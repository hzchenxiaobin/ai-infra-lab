<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：一个会话有多行活动 → 去重计数后相除得均值</text>

  <!-- ===== Left: Activity table (raw) ===== -->
  <text x="120" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Activity 表（原始，每行一条活动）</text>

  <!-- Header -->
  <rect x="30" y="56" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="71" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">user_id</text>
  <text x="115" y="71" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">session_id</text>
  <text x="180" y="71" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">activity_type</text>
  <line x1="85" y1="56" x2="85" y2="78" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="145" y1="56" x2="145" y2="78" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Session 1: user 1, 3 rows (green) -->
  <rect x="30" y="78" width="200" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="58" y="89" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="115" y="89" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="180" y="89" text-anchor="middle" font-size="7.5" fill="#4a7a3a">open_session</text>
  <line x1="85" y1="78" x2="85" y2="92" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="78" x2="145" y2="92" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="30" y="92" width="200" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="58" y="103" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="115" y="103" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="180" y="103" text-anchor="middle" font-size="7.5" fill="#4a7a3a">scroll</text>
  <line x1="85" y1="92" x2="85" y2="106" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="92" x2="145" y2="106" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="30" y="106" width="200" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="58" y="117" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="115" y="117" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="180" y="117" text-anchor="middle" font-size="7.5" fill="#4a7a3a">end_session</text>
  <line x1="85" y1="106" x2="85" y2="120" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="106" x2="145" y2="120" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Session bracket for session 1 -->
  <path d="M27 78 L22 78 L22 120 L27 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="20" y="103" text-anchor="end" font-size="7" fill="#4a7a3a" font-weight="bold">会话1</text>

  <!-- Session 4: user 2, 2 rows (blue) -->
  <rect x="30" y="120" width="200" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="58" y="131" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="115" y="131" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">4</text>
  <text x="180" y="131" text-anchor="middle" font-size="7.5" fill="#446688">open_session</text>
  <line x1="85" y1="120" x2="85" y2="134" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="120" x2="145" y2="134" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="30" y="134" width="200" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="58" y="145" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="115" y="145" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">4</text>
  <text x="180" y="145" text-anchor="middle" font-size="7.5" fill="#446688">end_session</text>
  <line x1="85" y1="134" x2="85" y2="148" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="134" x2="145" y2="148" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <path d="M27 120 L22 120 L22 148 L27 148" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="20" y="137" text-anchor="end" font-size="7" fill="#446688" font-weight="bold">会话4</text>

  <!-- Session 2: user 3, 2 rows (orange) -->
  <rect x="30" y="148" width="200" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="58" y="159" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="115" y="159" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2</text>
  <text x="180" y="159" text-anchor="middle" font-size="7.5" fill="#d6a040">open_session</text>
  <line x1="85" y1="148" x2="85" y2="162" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="148" x2="145" y2="162" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="30" y="162" width="200" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="58" y="173" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="115" y="173" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2</text>
  <text x="180" y="173" text-anchor="middle" font-size="7.5" fill="#d6a040">end_session</text>
  <line x1="85" y1="162" x2="85" y2="176" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="162" x2="145" y2="176" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <path d="M27 148 L22 148 L22 176 L27 176" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="20" y="165" text-anchor="end" font-size="7" fill="#d6a040" font-weight="bold">会话2</text>

  <!-- Session 5: user 3, 2 rows (red) -->
  <rect x="30" y="176" width="200" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="58" y="187" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="115" y="187" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">5</text>
  <text x="180" y="187" text-anchor="middle" font-size="7.5" fill="#b85450">open_session</text>
  <line x1="85" y1="176" x2="85" y2="190" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="176" x2="145" y2="190" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="30" y="190" width="200" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="58" y="201" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="115" y="201" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">5</text>
  <text x="180" y="201" text-anchor="middle" font-size="7.5" fill="#b85450">end_session</text>
  <line x1="85" y1="190" x2="85" y2="204" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="190" x2="145" y2="204" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <path d="M27 176 L22 176 L22 204 L27 204" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="20" y="193" text-anchor="end" font-size="7" fill="#b85450" font-weight="bold">会话5</text>

  <text x="130" y="218" text-anchor="middle" font-size="9" fill="#888">9 行活动 = 4 个会话（同一会话有多行 activity_type）</text>

  <!-- ===== Middle: Count boxes ===== -->
  <!-- Arrow from table to session count -->
  <path d="M235 99 L275 99" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="255" y="93" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">去重</text>

  <!-- Session count box -->
  <rect x="280" y="70" width="165" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="362" y="88" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">COUNT(DISTINCT session_id)</text>
  <text x="362" y="104" text-anchor="middle" font-size="9" fill="#333">= {1, 4, 2, 5}</text>
  <text x="362" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= 4 个会话</text>

  <!-- Arrow from table to user count -->
  <path d="M235 162 L275 162" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="255" y="156" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">去重</text>

  <!-- User count box -->
  <rect x="280" y="140" width="165" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="362" y="158" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">COUNT(DISTINCT user_id)</text>
  <text x="362" y="174" text-anchor="middle" font-size="9" fill="#333">= {1, 2, 3}</text>
  <text x="362" y="188" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">= 3 个用户</text>

  <!-- ===== Right: Division result ===== -->
  <!-- Arrow from session count to division -->
  <path d="M450 98 L475 122" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- Arrow from user count to division -->
  <path d="M450 168 L475 143" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Division box -->
  <rect x="470" y="100" width="115" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="527" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 ÷ 3</text>
  <line x1="490" y1="127" x2="565" y2="127" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="527" y="148" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">= 1.33</text>
  <text x="527" y="165" text-anchor="middle" font-size="7.5" fill="#888">ROUND(..., 2)</text>

  <!-- Result label -->
  <text x="527" y="192" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">average_sessions_per_user</text>

  <!-- ===== Bottom: Key insights ===== -->
  <rect x="20" y="215" width="560" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="235" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键洞察：为什么用 DISTINCT 而非 COUNT(*)</text>

  <text x="40" y="256" font-size="9.5" fill="#333">• 一个会话（session_id）对应多行 activity（open_session / scroll / end_session …）</text>
  <text x="40" y="274" font-size="9.5" fill="#333">  → <tspan fill="#b85450" font-weight="bold">COUNT(*)</tspan> 数的是行数（9），不是会话数（4），会<tspan fill="#b85450">多算</tspan></text>
  <text x="40" y="292" font-size="9.5" fill="#333">  → <tspan fill="#4a7a3a" font-weight="bold">COUNT(DISTINCT session_id)</tspan> 去重后才得到真实会话数 = 4</text>

  <text x="40" y="314" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">session_id 全局唯一</tspan>（每个会话只属一个用户）→ 总会话数 ÷ 总用户数 = 平均每人会话数</text>
  <text x="40" y="332" font-size="9.5" fill="#333">  等价于先 <tspan fill="#d6a040">GROUP BY user_id</tspan> 算每人会话数，再 <tspan fill="#d6a040">AVG</tspan> 取平均</text>

  <text x="40" y="354" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">WHERE activity_date BETWEEN '06-28' AND '07-27'</tspan>：30 天窗口（截止 07-27 含）</text>
  <text x="40" y="372" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">IFNULL(..., 0)</tspan>：区间内无数据时除零得 NULL → 兜底返回 0</text>
  <text x="40" y="390" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">ROUND(..., 2)</tspan>：保留两位小数</text>
</svg>
