<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：提取 → 排序 → 交叉配对 → 求和</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888">固定 4 位数，O(1) 时间 O(1) 空间</text>

  <!-- Step 1: 输入 num -->
  <rect x="180" y="60" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 num（4 位正整数）</text>

  <path d="M 260 100 L 260 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 提取 4 个数位 -->
  <rect x="150" y="122" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">提取数位 → [a, b, c, d]</text>
  <text x="260" y="156" text-anchor="middle" font-size="10" fill="#888">num % 10 取末位，num /= 10 循环 4 次</text>

  <path d="M 260 168 L 260 186" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 升序排序 -->
  <rect x="150" y="190" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">升序排序 → [d₀, d₁, d₂, d₃]</text>
  <text x="260" y="224" text-anchor="middle" font-size="10" fill="#888">d₀ ≤ d₁ ≤ d₂ ≤ d₃</text>

  <path d="M 260 236 L 260 254" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: 交叉配对 -->
  <polygon points="260,258 400,294 260,330 120,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">交叉配对</text>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#555">new1 = d₀×10 + d₂</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#555">new2 = d₁×10 + d₃</text>

  <path d="M 260 332 L 260 348" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: 返回和 -->
  <rect x="160" y="352" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 new1 + new2</text>

  <!-- Side annotation -->
  <path d="M 400 294 L 430 294" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="436" y="290" font-size="10" fill="#888">最小两位</text>
  <text x="436" y="302" font-size="10" fill="#888">放十位</text>
</svg>
