<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：树上离线 Trie 查询
  </text>

  <!-- Step 1 -->
  <rect x="140" y="46" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 建树：parents → children[]，找 root</text>
  <path d="M260,82 L260,96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="100" y="98" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 查询离线挂载：qAt[node].append((val, idx))</text>
  <path d="M260,134 L260,148" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="120" y="150" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 初始化空 Trie，栈 = [(root, 0)]</text>
  <path d="M260,186 L260,200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: loop diamond -->
  <polygon points="260,202 330,232 260,262 190,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">栈空？</text>

  <!-- Yes → return -->
  <path d="M330,232 L380,232 L380,410" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="226" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- No → pop -->
  <path d="M190,232 L140,232 L140,270" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="226" font-size="9" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="80" y="272" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="290" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">弹出 (u, state)</text>

  <!-- state diamond -->
  <path d="M140,302 L140,316" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="140,318 190,338 140,358 90,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="342" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">state?</text>

  <!-- state=0 进入 -->
  <path d="M190,338 L220,338" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="332" font-size="9" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="222" y="312" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="312" y="330" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">进入 u：</text>
  <text x="312" y="346" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">insert(u) → Trie 加入 u</text>
  <text x="312" y="358" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">query(val) 回答查询</text>
  <text x="312" y="368" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">子节点逆序入栈 + push(u,1)</text>

  <!-- state=1 退出 -->
  <path d="M90,338 L60,338 L60,372" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="332" font-size="9" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="14" y="374" width="92" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="390" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">退出 u：</text>
  <text x="60" y="404" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">remove(u)</text>
  <text x="60" y="414" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">cnt−1</text>

  <!-- loop back arrows -->
  <path d="M60,414 L60,440 L380,440 L380,232" stroke="#446688" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M312,372 L312,440" stroke="#446688" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="320" y="398" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="420" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ 返回 ans</text>
</svg>
