<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：DFA 逐字符状态推进</text>

  <!-- ===== Table A: "-123.456e789" 合法 ===== -->
  <text x="30" y="52" font-size="12" fill="#4a7a3a" font-weight="bold">A. s = "−123.456e789"  →  true（落在合法态 8）</text>

  <rect x="24" y="60" width="552" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="11" fill="#333">步</text>
  <text x="80" y="76" font-size="11" fill="#333">字符</text>
  <text x="150" y="76" font-size="11" fill="#333">类型</text>
  <text x="250" y="76" font-size="11" fill="#333">状态转移</text>
  <text x="430" y="76" font-size="11" fill="#333">当前态</text>
  <text x="510" y="76" font-size="11" fill="#333">说明</text>

  <rect x="24" y="84" width="552" height="22" fill="#fff8e1" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="99" font-size="11" fill="#333">1</text><text x="80" y="99" font-size="11" fill="#d6a040">−</text><text x="150" y="99" font-size="11" fill="#333">符号</text><text x="250" y="99" font-size="11" fill="#333">0 → 1</text><text x="430" y="99" font-size="11" fill="#d6a040">1</text><text x="510" y="99" font-size="11" fill="#666">尾数符号</text>

  <rect x="24" y="106" width="552" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="121" font-size="11" fill="#333">2</text><text x="80" y="121" font-size="11" fill="#4a7a3a">1</text><text x="150" y="121" font-size="11" fill="#333">数字</text><text x="250" y="121" font-size="11" fill="#333">1 → 2</text><text x="430" y="121" font-size="11" fill="#4a7a3a">2</text><text x="510" y="121" font-size="11" fill="#666">整数位</text>

  <rect x="24" y="128" width="552" height="22" fill="#f6f8fc" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="143" font-size="11" fill="#333">3-4</text><text x="80" y="143" font-size="11" fill="#4a7a3a">23</text><text x="150" y="143" font-size="11" fill="#333">数字</text><text x="250" y="143" font-size="11" fill="#333">2 → 2 → 2</text><text x="430" y="143" font-size="11" fill="#4a7a3a">2</text><text x="510" y="143" font-size="11" fill="#666">整数自环</text>

  <rect x="24" y="150" width="552" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="165" font-size="11" fill="#333">5</text><text x="80" y="165" font-size="11" fill="#b85450">.</text><text x="150" y="165" font-size="11" fill="#333">点</text><text x="250" y="165" font-size="11" fill="#333">2 → 4</text><text x="430" y="165" font-size="11" fill="#4a7a3a">4</text><text x="510" y="165" font-size="11" fill="#666">整数后点</text>

  <rect x="24" y="172" width="552" height="22" fill="#f6f8fc" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="187" font-size="11" fill="#333">6-8</text><text x="80" y="187" font-size="11" fill="#4a7a3a">456</text><text x="150" y="187" font-size="11" fill="#333">数字</text><text x="250" y="187" font-size="11" fill="#333">4 → 5 → 5 → 5</text><text x="430" y="187" font-size="11" fill="#4a7a3a">5</text><text x="510" y="187" font-size="11" fill="#666">小数位</text>

  <rect x="24" y="194" width="552" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="209" font-size="11" fill="#333">9</text><text x="80" y="209" font-size="11" fill="#d6a040">e</text><text x="150" y="209" font-size="11" fill="#333">指数</text><text x="250" y="209" font-size="11" fill="#333">5 → 6</text><text x="430" y="209" font-size="11" fill="#d6a040">6</text><text x="510" y="209" font-size="11" fill="#666">进入指数段</text>

  <rect x="24" y="216" width="552" height="22" fill="#f6f8fc" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="231" font-size="11" fill="#333">10-12</text><text x="80" y="231" font-size="11" fill="#4a7a3a">789</text><text x="150" y="231" font-size="11" fill="#333">数字</text><text x="250" y="231" font-size="11" fill="#333">6 → 8 → 8 → 8</text><text x="430" y="231" font-size="11" fill="#4a7a3a">8</text><text x="510" y="231" font-size="11" fill="#666">指数自环</text>

  <rect x="24" y="238" width="552" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="254" font-size="11" fill="#333">结束</text><text x="250" y="254" font-size="11" fill="#333">字符串扫完</text><text x="430" y="254" font-size="11" fill="#4a7a3a" font-weight="bold">8 ✓</text><text x="510" y="254" font-size="11" fill="#4a7a3a">合法终止态</text>

  <!-- ===== Table B: "99e2.5" 非法 ===== -->
  <text x="30" y="294" font-size="12" fill="#b85450" font-weight="bold">B. s = "99e2.5"  →  false（指数段遇点，转入非法态）</text>

  <rect x="24" y="302" width="552" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="318" font-size="11" fill="#333">步</text>
  <text x="80" y="318" font-size="11" fill="#333">字符</text>
  <text x="150" y="318" font-size="11" fill="#333">类型</text>
  <text x="250" y="318" font-size="11" fill="#333">状态转移</text>
  <text x="430" y="318" font-size="11" fill="#333">当前态</text>
  <text x="510" y="318" font-size="11" fill="#333">说明</text>

  <rect x="24" y="326" width="552" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="341" font-size="11" fill="#333">1-2</text><text x="80" y="341" font-size="11" fill="#4a7a3a">99</text><text x="150" y="341" font-size="11" fill="#333">数字</text><text x="250" y="341" font-size="11" fill="#333">0 → 2 → 2</text><text x="430" y="341" font-size="11" fill="#4a7a3a">2</text><text x="510" y="341" font-size="11" fill="#666">整数位</text>

  <rect x="24" y="348" width="552" height="22" fill="#f6f8fc" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="363" font-size="11" fill="#333">3</text><text x="80" y="363" font-size="11" fill="#d6a040">e</text><text x="150" y="363" font-size="11" fill="#333">指数</text><text x="250" y="363" font-size="11" fill="#333">2 → 6</text><text x="430" y="363" font-size="11" fill="#d6a040">6</text><text x="510" y="363" font-size="11" fill="#666">进入指数段</text>

  <rect x="24" y="370" width="552" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="385" font-size="11" fill="#333">4</text><text x="80" y="385" font-size="11" fill="#4a7a3a">2</text><text x="150" y="385" font-size="11" fill="#333">数字</text><text x="250" y="385" font-size="11" fill="#333">6 → 8</text><text x="430" y="385" font-size="11" fill="#4a7a3a">8</text><text x="510" y="385" font-size="11" fill="#666">指数位</text>

  <rect x="24" y="392" width="552" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="408" font-size="11" fill="#333">5</text><text x="80" y="408" font-size="11" fill="#b85450">.</text><text x="150" y="408" font-size="11" fill="#333">点</text><text x="250" y="408" font-size="11" fill="#b85450">8 → −1（非法）</text><text x="430" y="408" font-size="11" fill="#b85450" font-weight="bold">−1</text><text x="510" y="408" font-size="11" fill="#b85450">指数段禁点</text>

  <!-- ===== Table C: "1e" 非法 ===== -->
  <text x="30" y="448" font-size="12" fill="#b85450" font-weight="bold">C. s = "1e"  →  false（停在非终止态 6）</text>

  <rect x="24" y="456" width="552" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="472" font-size="11" fill="#333">步</text>
  <text x="80" y="472" font-size="11" fill="#333">字符</text>
  <text x="150" y="472" font-size="11" fill="#333">类型</text>
  <text x="250" y="472" font-size="11" fill="#333">状态转移</text>
  <text x="430" y="472" font-size="11" fill="#333">当前态</text>
  <text x="510" y="472" font-size="11" fill="#333">说明</text>

  <rect x="24" y="480" width="552" height="22" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="495" font-size="11" fill="#333">1</text><text x="80" y="495" font-size="11" fill="#4a7a3a">1</text><text x="150" y="495" font-size="11" fill="#333">数字</text><text x="250" y="495" font-size="11" fill="#333">0 → 2</text><text x="430" y="495" font-size="11" fill="#4a7a3a">2</text><text x="510" y="495" font-size="11" fill="#666">整数位</text>

  <rect x="24" y="502" width="552" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="517" font-size="11" fill="#333">2-结束</text><text x="80" y="517" font-size="11" fill="#d6a040">e</text><text x="150" y="517" font-size="11" fill="#333">指数</text><text x="250" y="517" font-size="11" fill="#333">2 → 6，扫完</text><text x="430" y="517" font-size="11" fill="#b85450" font-weight="bold">6 ✗</text><text x="510" y="517" font-size="11" fill="#b85450">非终止态</text>
</svg>
