<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算（n = 3）：按「已放集合」分层，pos = popcount(mask)+1</text>

  <!-- layer captions -->
  <g filter="url(#rough2)" font-size="11" fill="#777">
    <text x="78" y="46" text-anchor="middle">pos=1 全✓</text>
    <text x="195" y="46" text-anchor="middle">pos=2: {1,3}</text>
    <text x="315" y="46" text-anchor="middle">pos=3: {1,2}</text>
    <text x="455" y="46" text-anchor="middle">完成</text>
  </g>

  <!-- edges layer0 -> layer1 -->
  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="1.7">
    <path d="M 108 174 L 156 110" marker-end="url(#arrb)"/>
    <path d="M 112 188 L 155 188" marker-end="url(#arrb)"/>
    <path d="M 108 202 L 156 268" marker-end="url(#arrb)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#33507a">
    <text x="120" y="146" text-anchor="middle">k=1</text>
    <text x="134" y="180" text-anchor="middle">k=2</text>
    <text x="120" y="246" text-anchor="middle">k=3</text>
  </g>

  <!-- edges layer1 -> layer2 -->
  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="1.7">
    <path d="M 226 114 L 276 172" marker-end="url(#arrb)"/>
    <path d="M 226 178 L 276 96" marker-end="url(#arrb)"/>
    <path d="M 226 198 L 276 288" marker-end="url(#arrb)"/>
    <path d="M 226 268 L 276 204" marker-end="url(#arrb)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#33507a">
    <text x="238" y="152" text-anchor="middle">k=3</text>
    <text x="252" y="120" text-anchor="middle">k=1</text>
    <text x="240" y="252" text-anchor="middle">k=3</text>
    <text x="252" y="240" text-anchor="middle">k=1</text>
  </g>

  <!-- edges layer2 -> layer3 -->
  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="1.7">
    <path d="M 349 188 L 417 188" marker-end="url(#arrb)"/>
    <path d="M 349 290 L 417 208" marker-end="url(#arrb)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#33507a">
    <text x="382" y="180" text-anchor="middle">k=2</text>
    <text x="392" y="264" text-anchor="middle">k=1</text>
  </g>

  <!-- node 000 -->
  <rect x="44" y="168" width="68" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="78" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">000</text>
    <text x="78" y="201" text-anchor="middle" font-size="11" fill="#33507a">dp=1</text>
  </g>

  <!-- node 001 -->
  <rect x="161" y="78" width="68" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="195" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">001</text>
    <text x="195" y="111" text-anchor="middle" font-size="11" fill="#33507a">dp=1</text>
  </g>

  <!-- node 010 -->
  <rect x="161" y="168" width="68" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="195" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">010</text>
    <text x="195" y="201" text-anchor="middle" font-size="11" fill="#33507a">dp=1</text>
  </g>

  <!-- node 100 -->
  <rect x="161" y="258" width="68" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="195" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">100</text>
    <text x="195" y="291" text-anchor="middle" font-size="11" fill="#33507a">dp=1</text>
  </g>

  <!-- node 011 (dead) -->
  <rect x="281" y="58" width="68" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="315" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a36">011</text>
    <text x="315" y="91" text-anchor="middle" font-size="11" fill="#8c3a36">dp=1</text>
  </g>
  <text x="357" y="82" text-anchor="start" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">只剩 k=3：gcd(3,3)=3 ✗</text>

  <!-- node 101 (merged, highlight) -->
  <rect x="281" y="168" width="68" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="315" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">101</text>
    <text x="315" y="201" text-anchor="middle" font-size="11" fill="#b07818">dp=2</text>
  </g>

  <!-- node 110 -->
  <rect x="281" y="278" width="68" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="315" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">110</text>
    <text x="315" y="311" text-anchor="middle" font-size="11" fill="#33507a">dp=1</text>
  </g>

  <!-- node 111 (answer) -->
  <rect x="421" y="168" width="68" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="455" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c22">111</text>
    <text x="455" y="201" text-anchor="middle" font-size="11" fill="#2e5c22">dp=3 ★</text>
  </g>

  <!-- note box -->
  <rect x="28" y="326" width="504" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#b07818">
    <text x="280" y="346" text-anchor="middle">dp[101]=2：先放 1 再放 3、先放 3 再放 1 殊途同归 —— 记忆化只算一次</text>
    <text x="280" y="364" text-anchor="middle">dp[111]=3 ⇔ 合法排列 [1,3,2]、[3,1,2]、[2,3,1]，与示例 3 一致</text>
  </g>
</svg>
