<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,2,3,1]，k=3 → 5</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">去重{1,2,3} → bitCount=[1,1,2] → 升序 arr 与对应值 [1, 2, 3]</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="20" y="52" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="11.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="50"  y="71">步 i</text>
    <text x="110" y="71">值</text>
    <text x="170" y="71">bitCount</text>
    <text x="245" y="71">阈值 k−bc</text>
    <text x="335" y="71">合格搭档(值)</text>
    <text x="455" y="71">新增数对</text>
    <text x="550" y="71">ans</text>
  </g>

  <!-- vertical separators -->
  <g stroke="#d0d0d0" stroke-width="1" filter="url(#rough2)">
    <line x1="80"  y1="52" x2="80"  y2="232"/>
    <line x1="140" y1="52" x2="140" y2="232"/>
    <line x1="200" y1="52" x2="200" y2="232"/>
    <line x1="290" y1="52" x2="290" y2="232"/>
    <line x1="380" y1="52" x2="380" y2="232"/>
    <line x1="530" y1="52" x2="530" y2="232"/>
  </g>

  <!-- row i=0 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50"  y="100">0</text>
    <text x="110" y="100" font-weight="bold">1</text>
    <text x="170" y="100">1</text>
    <text x="245" y="100">2</text>
    <text x="335" y="100" fill="#446688">值3 (1 个)</text>
    <text x="455" y="100" fill="#d6a040" font-weight="bold">(1, 3)</text>
    <text x="550" y="100" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- row i=1 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50"  y="138">1</text>
    <text x="110" y="138" font-weight="bold">2</text>
    <text x="170" y="138">1</text>
    <text x="245" y="138">2</text>
    <text x="335" y="138" fill="#446688">值3 (1 个)</text>
    <text x="455" y="138" fill="#d6a040" font-weight="bold">(2, 3)</text>
    <text x="550" y="138" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- row i=2 (highlight) -->
  <g filter="url(#rough2)">
    <rect x="20" y="156" width="560" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50"  y="182">2</text>
    <text x="110" y="182" font-weight="bold">3</text>
    <text x="170" y="182">2</text>
    <text x="245" y="182">1</text>
    <text x="335" y="182" fill="#446688">值1,2,3 (3 个)</text>
    <text x="455" y="178" fill="#b85450" font-weight="bold">(3,1)</text>
    <text x="455" y="192" fill="#b85450" font-weight="bold">(3,2)(3,3)</text>
    <text x="550" y="182" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- table bottom border -->
  <path d="M 20 200 L 580 200" stroke="#d0d0d0" stroke-width="1" filter="url(#rough2)"/>

  <!-- j pointer mini illustration -->
  <text x="20" y="258" font-size="11" fill="#555" font-weight="bold">双指针 j 的移动（arr = [1, 1, 2]）：</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="270" width="50" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="270" width="50" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="270" width="50" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="85"  y="290">1</text>
    <text x="135" y="290">1</text>
    <text x="185" y="290">2</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="85"  y="314">下标0</text>
    <text x="135" y="314">下标1</text>
    <text x="185" y="314">下标2</text>
  </g>

  <!-- j markers -->
  <text x="240" y="288" font-size="10.5" fill="#b85450" font-weight="bold">i=0,1：阈值 2 → j=2（只下标2 合格）</text>
  <text x="240" y="308" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=2：阈值 1 → j 左移到 0（3 个全合格）</text>
  <path d="M 235 285 L 200 285" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 235 304 L 70 304" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="150" y="338" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="362" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 ans = 5</text>
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a">5 个优质数对：(1,3)(3,1)(2,3)(3,2)(3,3)</text>

  <text x="20" y="416" font-size="11" fill="#555">• i=2 时 j 从 2 左移到 0：阈值 k−arr[2]=1，arr[0]=arr[1]=arr[2]=1≥1 均合格。</text>
  <text x="20" y="432" font-size="10.5" fill="#888">• j==i 也计入，对应 (3,3) 自配——题目允许 num1==num2（只要该值出现过）。</text>
</svg>
