<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：遇到 key 就看下一个元素，一遍扫描边走边数</text>
  <text x="270" y="40" text-anchor="middle" font-size="10.5" fill="#888">nums[i]==key 时，nums[i+1] 即候选 target → 直接计数，无需二次扫描</text>

  <!-- ===== Array row: nums = [1,100,200,1,100], key = 1 ===== -->
  <text x="28" y="68" font-size="10.5" fill="#666">数组</text>
  <!-- index labels -->
  <text x="80" y="58" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="128" y="58" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="176" y="58" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="224" y="58" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="272" y="58" text-anchor="middle" font-size="9" fill="#888">4</text>
  <!-- value boxes: key positions (0,3) blue; following targets (1,4) green -->
  <rect x="58" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">100</text>
  <rect x="154" y="62" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">200</text>
  <rect x="202" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="250" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">100</text>

  <!-- legend -->
  <rect x="320" y="66" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="340" y="77" font-size="9.5" fill="#555">= key</text>
  <rect x="380" y="66" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="400" y="77" font-size="9.5" fill="#555">= 紧跟 key 的 target</text>

  <!-- curved arrows: key[0] -> target[1], key[3] -> target[4] -->
  <path d="M 80 94 C 80 124, 128 124, 128 94" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="104" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a">i=0</text>
  <path d="M 224 94 C 224 124, 272 124, 272 94" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a">i=3</text>

  <!-- ===== Left: brute force ===== -->
  <text x="28" y="150" font-size="10.5" fill="#666">暴力：对每个 target 重新扫描</text>
  <rect x="20" y="158" width="230" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">两遍扫描</text>
  <text x="135" y="196" text-anchor="middle" font-size="10" fill="#555">① 收集所有紧跟 key 的 target</text>
  <text x="135" y="212" text-anchor="middle" font-size="10" fill="#555">② 对每个 target 再遍历计数</text>
  <text x="135" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">O(n · t)，t 为 target 种类</text>
  <text x="135" y="246" text-anchor="middle" font-size="9.5" fill="#888">重复扫描同一数组，浪费</text>

  <!-- ===== Right: optimized single pass ===== -->
  <text x="290" y="150" font-size="10.5" fill="#666">优化：一遍扫描，遇 key 即计数</text>
  <rect x="282" y="158" width="238" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="401" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">一遍扫描 + 哈希计数</text>
  <text x="401" y="196" text-anchor="middle" font-size="10" fill="#555">i 从 0 到 n−2：</text>
  <text x="401" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">if nums[i]==key:</text>
  <text x="401" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">　count[nums[i+1]]++</text>
  <text x="401" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(n) 一次到位</text>

  <!-- arrow from brute to optimized -->
  <path d="M 250 206 L 280 206" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="265" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a">优化</text>

  <!-- ===== Bottom: hash map count + result ===== -->
  <rect x="40" y="268" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="288" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">计数表 count</text>
  <rect x="60" y="296" width="180" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="311" text-anchor="middle" font-size="11" fill="#333">{ 100 : 2 }</text>

  <rect x="290" y="268" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">取 count 最大者</text>
  <text x="400" y="312" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">答案 = 100</text>

  <!-- arrow from count to result -->
  <path d="M 260 296 L 288 296" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Footer ===== -->
  <text x="270" y="346" text-anchor="middle" font-size="10.5" fill="#888">关键：nums[i]==key 时 nums[i+1] 唯一确定为候选 → 一次遍历即可统计全部</text>
  <text x="270" y="364" text-anchor="middle" font-size="10" fill="#aaa">扫描范围 0 ≤ i ≤ n−2（key 不能出现在最后一位，否则无「下一个」）</text>
</svg>
