<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：互补滑动窗口——追踪「窗外」保留糖果的口味频率</text>

  <!-- ===== Window at [0,3) : shared=[1,2,2], kept=[3,4,3] ===== -->
  <text x="40" y="62" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口 [0,3)：送出 [1,2,2]，保留 [3,4,3]</text>

  <g filter="url(#rough2)">
    <!-- shared window highlight 0..2 -->
    <rect x="36" y="74" width="134" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" fill-opacity="0.4"/>
    <!-- cells: shared (pink) 0,1,2 ; kept (blue) 3,4,5 -->
    <rect x="40" y="78" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="61" y="99" text-anchor="middle" font-size="13" fill="#b85450">1</text>
    <rect x="84" y="78" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="105" y="99" text-anchor="middle" font-size="13" fill="#b85450">2</text>
    <rect x="128" y="78" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="149" y="99" text-anchor="middle" font-size="13" fill="#b85450">2</text>
    <rect x="172" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="193" y="99" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
    <rect x="216" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="237" y="99" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
    <rect x="260" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="281" y="99" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
    <text x="61" y="126" text-anchor="middle" font-size="8.5" fill="#b85450">0</text>
    <text x="105" y="126" text-anchor="middle" font-size="8.5" fill="#b85450">1</text>
    <text x="149" y="126" text-anchor="middle" font-size="8.5" fill="#b85450">2</text>
    <text x="193" y="126" text-anchor="middle" font-size="8.5" fill="#446688">3</text>
    <text x="237" y="126" text-anchor="middle" font-size="8.5" fill="#446688">4</text>
    <text x="281" y="126" text-anchor="middle" font-size="8.5" fill="#446688">5</text>
  </g>

  <!-- kept freq map for window [0,3) -->
  <g filter="url(#rough2)">
    <rect x="380" y="74" width="240" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" fill-opacity="0.35"/>
    <text x="500" y="90" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">保留口味频率表 cnt（窗外）</text>
    <text x="408" y="112" font-size="11" fill="#333">3 → 2</text>
    <text x="408" y="128" font-size="11" fill="#333">4 → 1</text>
    <rect x="528" y="100" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6"/>
    <text x="568" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">|cnt| = 2</text>
    <text x="568" y="138" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">ans = 2</text>
  </g>

  <!-- ===== Slide arrow ===== -->
  <text x="320" y="178" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">窗口整体右移 1：左端 candies[0]=1 出窗→保留，右端 candies[3]=3 入窗→送出</text>
  <path d="M150 190 L250 190" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="200" y="186" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">slide →</text>

  <!-- ===== Window at [1,4) : shared=[2,2,3], kept=[1]∪[4,3] ===== -->
  <text x="40" y="218" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口 [1,4)：送出 [2,2,3]，保留 [1] ∪ [4,3]</text>

  <g filter="url(#rough2)">
    <!-- shared window highlight 1..3 -->
    <rect x="80" y="230" width="134" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" fill-opacity="0.4"/>
    <!-- cell 0: just became kept (出窗) -->
    <rect x="40" y="234" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="61" y="255" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- cells 1,2,3 shared -->
    <rect x="84" y="234" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="105" y="255" text-anchor="middle" font-size="13" fill="#b85450">2</text>
    <rect x="128" y="234" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="149" y="255" text-anchor="middle" font-size="13" fill="#b85450">2</text>
    <rect x="172" y="234" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="193" y="255" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
    <!-- cells 4,5 kept -->
    <rect x="216" y="234" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="237" y="255" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
    <rect x="260" y="234" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="281" y="255" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="61" y="284" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">出窗</text>
  <text x="193" y="284" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">入窗</text>

  <!-- kept freq map for window [1,4) -->
  <g filter="url(#rough2)">
    <rect x="380" y="230" width="240" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" fill-opacity="0.35"/>
    <text x="500" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">保留口味频率表 cnt（更新后）</text>
    <text x="408" y="268" font-size="11" fill="#4a7a3a" font-weight="bold">1 → 1</text>
    <text x="408" y="284" font-size="11" fill="#333">3 → 1</text>
    <text x="408" y="300" font-size="11" fill="#333">4 → 1</text>
    <rect x="528" y="256" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="568" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">|cnt| = 3</text>
    <text x="568" y="294" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">ans = 3</text>
  </g>

  <!-- update arrows: add 1 (out), remove 3 (in) -->
  <path d="M61 268 Q 200 300 405 268" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" stroke-dasharray="4,3" filter="url(#rough2)" opacity="0.8"/>
  <path d="M193 268 Q 300 250 405 284" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)" stroke-dasharray="4,3" filter="url(#rough2)" opacity="0.8"/>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="334" width="580" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="320" y="354" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">关键：窗口 = 送出的 k 个连续糖果；窗口外 = 自己保留的糖果</text>
  <text x="320" y="374" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">① 维护「窗外」频率表 cnt，独特口味数 = |cnt|（不是窗口内！）</text>
  <text x="320" y="392" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">② 每次右移 1 格只变动两个元素：左端出窗 → cnt[左]++ ；右端入窗 → cnt[右]−−</text>
  <text x="320" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ cnt[右] 降为 0 则删除该键（该口味全部送出，不再保留）</text>
  <text x="320" y="428" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">共 n−k+1 个窗口位置，每次 O(1) 增量更新 → 整体 O(n)</text>
</svg>
