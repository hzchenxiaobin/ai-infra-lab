<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：标记 → 扫 0 格 → 取最大</text>

  <!-- Step 1 -->
  <rect x="60" y="46" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 遍历 grid，DFS 给每个岛屿打 tag(≥2)</text>
  <text x="270" y="82" text-anchor="middle" font-size="11" fill="#555">记录 area[tag] = 该岛屿面积</text>

  <line x1="270" y1="90" x2="270" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="106" width="420" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② ans = max(area) ← 初始为最大岛屿面积</text>

  <line x1="270" y1="144" x2="270" y2="158" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="60" y="160" width="420" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 遍历每个 0 格 (i, j)</text>

  <line x1="270" y1="198" x2="270" y2="212" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: diamond -->
  <polygon points="270,214 400,254 270,294 140,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">④ 查四邻 tag</text>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#555">seen = {unique tags}</text>

  <line x1="270" y1="294" x2="270" y2="308" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="60" y="310" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 候选 = 1 + Σ area[t], t ∈ seen</text>
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#555">ans = max(ans, 候选)　同一 tag 只算一次</text>

  <line x1="270" y1="354" x2="270" y2="368" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6 -->
  <rect x="100" y="370" width="340" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="386" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑥ 遍历结束，返回 ans</text>
</svg>
