<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 15，贪心路径 5 步到达 1</text>

  <!-- ===== Optimal path: 15 -> 16 -> 8 -> 4 -> 2 -> 1 ===== -->
  <!-- boxes at y = 70, width 64, height 40, gap 28 -->
  <!-- positions: 30, 122, 214, 306, 398, 490 -->

  <!-- step labels above -->
  <text x="62" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">step 0</text>
  <text x="154" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">step 1</text>
  <text x="246" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">step 2</text>
  <text x="338" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">step 3</text>
  <text x="430" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">step 4</text>
  <text x="522" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">step 5</text>

  <!-- 15 (odd, start) -->
  <rect x="30" y="70" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="62" y="96" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">15</text>
  <text x="62" y="124" text-anchor="middle" font-size="10" fill="#d6a040">奇, 15%4=3</text>

  <!-- arrow 15 -> 16 : +1 -->
  <path d="M 94 90 L 122 90" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="108" y="84" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">+1</text>

  <!-- 16 (even) -->
  <rect x="122" y="70" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="154" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">16</text>
  <text x="154" y="124" text-anchor="middle" font-size="10" fill="#446688">偶</text>

  <!-- arrow 16 -> 8 : /2 -->
  <path d="M 186 90 L 214 90" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">/2</text>

  <!-- 8 -->
  <rect x="214" y="70" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="246" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">8</text>
  <text x="246" y="124" text-anchor="middle" font-size="10" fill="#446688">偶</text>

  <!-- arrow 8 -> 4 -->
  <path d="M 278 90 L 306 90" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">/2</text>

  <!-- 4 -->
  <rect x="306" y="70" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="338" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">4</text>
  <text x="338" y="124" text-anchor="middle" font-size="10" fill="#446688">偶</text>

  <!-- arrow 4 -> 2 -->
  <path d="M 370 90 L 398 90" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="384" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">/2</text>

  <!-- 2 -->
  <rect x="398" y="70" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">2</text>
  <text x="430" y="124" text-anchor="middle" font-size="10" fill="#446688">偶</text>

  <!-- arrow 2 -> 1 -->
  <path d="M 462 90 L 490 90" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="476" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">/2</text>

  <!-- 1 (target) -->
  <rect x="490" y="70" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="522" y="96" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="522" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">终点 ✓</text>

  <!-- result box -->
  <rect x="120" y="146" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="167" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">+1 一次换来连续 4 次免费 /2，总步数 = 5 ✓</text>

  <!-- ===== Contrast: bad path 15 -> 14 -> 7 -> 8 -> 4 -> 2 -> 1 (6 steps) ===== -->
  <text x="280" y="206" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">对照：若第一步选 −1（15 % 4 == 3 时劣选）</text>

  <!-- bad path boxes at y = 220 -->
  <rect x="30" y="220" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="55" y="241" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">15</text>

  <path d="M 80 236 L 108 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="94" y="232" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">−1</text>

  <rect x="108" y="220" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="133" y="241" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">14</text>

  <path d="M 158 236 L 186 236" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="172" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">/2</text>

  <rect x="186" y="220" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="211" y="241" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">7</text>

  <path d="M 236 236 L 264 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="250" y="232" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">+1</text>

  <rect x="264" y="220" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="289" y="241" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">8</text>

  <path d="M 314 236 L 342 236" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="328" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">/2</text>

  <rect x="342" y="220" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="367" y="241" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <path d="M 392 236 L 420 236" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="406" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">/2</text>

  <rect x="420" y="220" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="445" y="241" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <path d="M 470 236 L 498 236" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="484" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">/2</text>

  <rect x="498" y="220" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="523" y="241" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- bad path note -->
  <rect x="80" y="270" width="400" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1 后 (15−1)/2 = 7（奇），被迫再 ±1，总步数 = 6 ✗</text>

  <!-- ===== Reasoning box ===== -->
  <rect x="40" y="318" width="480" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">关键：奇数 ±1 后必为偶，下一步必 /2，故 2 步到达 (n±1)/2</text>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">(n±1)/2 中一偶一奇，选偶者可「免费」再 /2 一次</text>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n % 4 == 3 → 选 +1（(n+1)/2 偶）；n % 4 == 1 → 选 −1</text>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#888">特例 n = 3：(3−1)/2 = 1 直达终点，选 −1</text>
</svg>
