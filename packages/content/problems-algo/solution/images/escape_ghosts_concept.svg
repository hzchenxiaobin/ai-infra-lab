<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：比较「你到目的地」与「阻碍者到目的地」的曼哈顿距离</text>

  <!-- ===== 左图：可逃脱 G > D ===== -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">情形A：阻碍者更远 → 可逃脱</text>

  <!-- 坐标网格底框 -->
  <rect x="40" y="68" width="220" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- 你 起点 (0,0) -->
  <ellipse cx="70" cy="210" rx="13" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">你</text>
  <text x="70" y="232" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>

  <!-- 目的地 target=(0,2) -->
  <rect x="58" y="92" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">目的地</text>

  <!-- 阻碍者 (3,0) 远 -->
  <ellipse cx="220" cy="210" rx="13" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">鬼</text>
  <text x="220" y="232" text-anchor="middle" font-size="9" fill="#888">(3,0)</text>

  <!-- 你的路径 D=2 -->
  <path d="M 70 199 L 70 116" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="88" y="158" font-size="10" fill="#446688" font-weight="bold">D=2</text>

  <!-- 鬼到目的地的路径 G=5 -->
  <path d="M 207 205 Q 150 150 82 108" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="160" y="180" font-size="10" fill="#b85450" font-weight="bold">G=5</text>

  <!-- 结论 -->
  <rect x="56" y="244" width="188" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">G=5 &gt; D=2 → 你先到 → true</text>

  <!-- ===== 右图：不可逃脱 G ≤ D ===== -->
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情形B：阻碍者不更远 → 不可逃脱</text>

  <rect x="320" y="68" width="220" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- 你 (0,0) -->
  <ellipse cx="350" cy="210" rx="13" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">你</text>
  <text x="350" y="232" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>

  <!-- 目的地 target=(2,0) -->
  <rect x="486" y="200" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="498" y="214" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">目的地</text>

  <!-- 鬼 (1,0) 拦在中间 -->
  <ellipse cx="420" cy="210" rx="13" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="214" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">鬼</text>
  <text x="420" y="232" text-anchor="middle" font-size="9" fill="#888">(1,0)</text>

  <!-- 你的路径 D=2 -->
  <path d="M 363 210 L 484 210" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="392" y="200" font-size="10" fill="#446688" font-weight="bold">D=2</text>

  <!-- 鬼到目的地 G=1 -->
  <path d="M 433 210 L 484 210" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="452" y="200" font-size="10" fill="#b85450" font-weight="bold">G=1</text>

  <!-- 结论 -->
  <rect x="336" y="244" width="188" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">G=1 ≤ D=2 → 鬼先到堵门 → false</text>

  <!-- ===== 底部公式框 ===== -->
  <rect x="40" y="294" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">D = |x_t| + |y_t|（你到目的地的曼哈顿距离）</text>
  <text x="290" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">G_i = |x_i − x_t| + |y_i − y_t|（第 i 个鬼到目的地的曼哈顿距离）</text>
  <text x="290" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">可逃脱 ⟺ ∀ i：G_i &gt; D；只要存在 G_i ≤ D 即 false</text>

  <!-- legend -->
  <ellipse cx="58" cy="378" rx="8" ry="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="382" font-size="10" fill="#666">你</text>
  <ellipse cx="120" cy="378" rx="8" ry="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="382" font-size="10" fill="#666">阻碍者</text>
  <rect x="194" y="372" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="382" font-size="10" fill="#666">目的地</text>
  <text x="270" y="382" font-size="10" fill="#888">曼哈顿距离 = |Δx| + |Δy|，四向网格的最短步数</text>
</svg>
