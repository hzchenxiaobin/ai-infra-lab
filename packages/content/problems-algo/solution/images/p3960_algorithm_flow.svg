<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：固定左端点 i，右端点 j 增量入窗，O(1) 搬桶判定</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">外层 i 逐点枚举（剪枝：ans ≥ n−i 提前收工），内层 j 每步只改两个哈希键</text>

  <!-- 开始 -->
  <rect x="100" y="48" width="140" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="65" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">i = 0 … n−1：固定左端点</text>

  <path d="M 170 74 L 170 85" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 剪枝菱形 -->
  <polygon points="170,88 228,106 170,124 112,106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="110" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">ans ≥ n−i ?</text>

  <path d="M 228 106 L 299 106" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="244" y="100" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="302" y="92" width="120" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="110" text-anchor="middle" font-size="10.5" fill="#8c3a34" filter="url(#rough2)">剪枝命中 → 返回 ans</text>

  <path d="M 170 124 L 170 137" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="136" font-size="10" fill="#778899" filter="url(#rough2)">否</text>

  <!-- 入窗 -->
  <rect x="88" y="138" width="164" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="156" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">j 右移一格，x = nums[j] 入窗</text>
  <text x="170" y="172" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">freq[x]: old → old+1</text>

  <path d="M 170 182 L 170 193" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 搬桶 -->
  <rect x="88" y="194" width="164" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="212" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">fc 搬桶：fc[old]−−（归零删键）</text>
  <text x="170" y="228" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">fc[old+1]++</text>

  <path d="M 170 238 L 170 249" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="170,254 224,270 170,286 116,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="274" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">合法？</text>

  <path d="M 224 270 L 278 270" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="240" y="264" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="280" y="250" width="150" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="266" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">ans = max(ans, j−i+1)</text>
  <text x="355" y="282" text-anchor="middle" font-size="10" fill="#3a6a2a" filter="url(#rough2)">刷新最长长度</text>

  <!-- 判定细则注释框 -->
  <rect x="300" y="128" width="196" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="148" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">合法判定（只看 fc）：</text>
  <text x="398" y="168" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">• 单一值 → ✓</text>
  <text x="398" y="186" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">• 恰两键且大 = 2×小 → ✓</text>
  <text x="398" y="204" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">• 其余（一键多值 / ≥3 键）→ ✗</text>
  <text x="398" y="222" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">示例：fc={1:1, 2:2} ✓；fc={2:2} ✗</text>

  <!-- 否分支与回路 -->
  <path d="M 170 286 L 170 318" fill="none" stroke="#778899" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="304" font-size="10" fill="#778899" filter="url(#rough2)">否</text>

  <path d="M 355 290 L 355 318" fill="none" stroke="#778899" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 355 318 L 60 318" fill="none" stroke="#778899" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 60 318 L 60 160 L 85 160" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="105" y="312" font-size="10" fill="#666" filter="url(#rough2)">j++，继续内层</text>
  <text x="316" y="338" font-size="10" fill="#888" filter="url(#rough2)">j 到头则 i++ 回到顶部；i = n 结束，返回 ans</text>
</svg>
