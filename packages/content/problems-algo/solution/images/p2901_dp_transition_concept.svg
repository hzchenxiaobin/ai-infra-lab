<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：带三条件的「接龙」DP</text>

  <!-- 上半部：词与合法转移 -->
  <rect x="30" y="58" width="92" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="76" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">abc</text>
  <text x="76" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g=1</text>

  <rect x="160" y="58" width="92" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="206" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">abd</text>
  <text x="206" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g=2</text>

  <rect x="290" y="58" width="92" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="336" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">bbd</text>
  <text x="336" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">g=1</text>

  <rect x="420" y="58" width="80" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">xyz</text>
  <text x="460" y="100" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">g=2</text>

  <!-- 合法转移箭头 -->
  <path d="M 124 85 L 158 85" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="141" y="48" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <path d="M 254 85 L 288 85" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="48" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 非法转移：xyz 与谁都接不上 -->
  <path d="M 418 95 C 380 130 340 130 330 114" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="382" y="138" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 汉明距离 = 3</text>

  <!-- 三个条件卡片 -->
  <text x="260" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j 能接在 i 前的三个条件（缺一不可）：</text>

  <rect x="28" y="182" width="148" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="102" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① groups[j] ≠ groups[i]</text>
  <text x="102" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">相邻组值不同</text>

  <rect x="188" y="182" width="148" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="262" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 等长</text>
  <text x="262" y="230" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">|words[j]| = |words[i]|</text>

  <rect x="348" y="182" width="148" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="422" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 汉明距离 = 1</text>
  <text x="422" y="230" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">恰好一处字符不同</text>

  <!-- dp 定义框 -->
  <rect x="40" y="270" width="440" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[i] = 以 words[i] 结尾的最长合法子序列长度</text>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">dp[i] = max{ dp[j] + 1 : j &lt; i 满足三条件 }</text>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">单个词自身合法（k=1 无相邻约束），故 dp[i] ≥ 1</text>
</svg>
