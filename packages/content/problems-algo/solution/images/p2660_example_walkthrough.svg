<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐轮价值表</text>

  <!-- ===== Example 1: player1 ===== -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 1 — player1 = [5,10,3,2] → 25</text>

  <!-- column headers -->
  <text x="80" y="76" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">轮 i</text>
  <text x="140" y="76" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">击中 x</text>
  <text x="230" y="76" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">前驱窗口</text>
  <text x="330" y="76" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">翻倍?</text>
  <text x="420" y="76" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">本轮价值</text>
  <text x="500" y="76" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">累计</text>

  <!-- row i=0 -->
  <text x="80" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="118" y="86" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="230" y="105" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">无</text>
  <text x="330" y="105" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <text x="420" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="500" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- row i=1 strike -->
  <text x="80" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="118" y="124" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="230" y="143" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x0=5</text>
  <text x="330" y="143" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <text x="420" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="500" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>

  <!-- row i=2 doubled -->
  <text x="80" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="118" y="162" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="181" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x1=10 ✓</text>
  <text x="330" y="181" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="420" y="181" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2×3=6</text>
  <text x="500" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">21</text>

  <!-- row i=3 doubled -->
  <text x="80" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="118" y="200" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="219" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x1=10 ✓</text>
  <text x="330" y="219" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="420" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2×2=4</text>
  <text x="500" y="219" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">25</text>

  <!-- arrow to result -->
  <path d="M 500 224 Q 540 240 510 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Example 4: player2 ===== -->
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 4 — player2 = [10,10,10,10,1,1,1] → 75</text>

  <!-- compact rows: i, x, doubled?, value, running -->
  <text x="60" y="302" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i</text>
  <text x="120" y="302" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x</text>
  <text x="210" y="302" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">窗口有10?</text>
  <text x="320" y="302" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">价值</text>
  <text x="420" y="302" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">累计</text>

  <!-- data rows i=0..6, compact -->
  <g filter="url(#rough2)" font-size="10" fill="#333" text-anchor="middle">
    <text x="60" y="322">0</text><text x="120" y="322">10</text><text x="210" y="322" fill="#999">无</text><text x="320" y="322" fill="#d6a040" font-weight="bold">10</text><text x="420" y="322">10</text>
    <text x="60" y="340">1</text><text x="120" y="340">10</text><text x="210" y="340" fill="#4a7a3a" font-weight="bold">x0=10 ✓</text><text x="320" y="340" fill="#4a7a3a" font-weight="bold">20</text><text x="420" y="340">30</text>
    <text x="60" y="358">2</text><text x="120" y="358">10</text><text x="210" y="358" fill="#4a7a3a" font-weight="bold">x1=10 ✓</text><text x="320" y="358" fill="#4a7a3a" font-weight="bold">20</text><text x="420" y="358">50</text>
    <text x="60" y="376">3</text><text x="120" y="376">10</text><text x="210" y="376" fill="#4a7a3a" font-weight="bold">x2=10 ✓</text><text x="320" y="376" fill="#4a7a3a" font-weight="bold">20</text><text x="420" y="376">70</text>
    <text x="60" y="394">4</text><text x="120" y="394">1</text><text x="210" y="394" fill="#4a7a3a" font-weight="bold">x3=10 ✓</text><text x="320" y="394" fill="#4a7a3a" font-weight="bold">2</text><text x="420" y="394">72</text>
    <text x="60" y="412">5</text><text x="120" y="412">1</text><text x="210" y="412" fill="#b85450" font-weight="bold">x3=10 ✓ (相距2轮)</text><text x="320" y="412" fill="#4a7a3a" font-weight="bold">2</text><text x="420" y="412">74</text>
    <text x="60" y="430">6</text><text x="120" y="430">1</text><text x="210" y="430" fill="#999">x4=1, x5=1</text><text x="320" y="430" fill="#446688" font-weight="bold">1</text><text x="420" y="430" font-weight="bold">75</text>
  </g>

  <text x="280" y="436" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">↑ 第 5 轮靠第 3 轮 strike 翻倍（窗口长 2，非相邻）</text>
</svg>
