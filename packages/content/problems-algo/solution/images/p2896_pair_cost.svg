<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">一对差异 (a, b) 的消除代价 = min(x, b − a)</text>

  <!-- 差异位示意行 -->
  <g filter="url(#rough2)">
    <rect x="44" y="52" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="88" y="52" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="132" y="52" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="176" y="52" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="220" y="52" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="264" y="52" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="308" y="52" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="352" y="52" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="396" y="52" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="440" y="52" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="63" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">≠</text>
    <text x="107" y="73" text-anchor="middle" font-size="13" fill="#446688">=</text>
    <text x="151" y="73" text-anchor="middle" font-size="13" fill="#446688">=</text>
    <text x="195" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">≠</text>
    <text x="239" y="73" text-anchor="middle" font-size="13" fill="#446688">=</text>
    <text x="283" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">≠</text>
    <text x="327" y="73" text-anchor="middle" font-size="13" fill="#446688">=</text>
    <text x="371" y="73" text-anchor="middle" font-size="13" fill="#446688">=</text>
    <text x="415" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">≠</text>
    <text x="459" y="73" text-anchor="middle" font-size="13" fill="#446688">=</text>
    <text x="63" y="100" text-anchor="middle" font-size="10" fill="#666">0</text>
    <text x="107" y="100" text-anchor="middle" font-size="10" fill="#666">1</text>
    <text x="151" y="100" text-anchor="middle" font-size="10" fill="#666">2</text>
    <text x="195" y="100" text-anchor="middle" font-size="10" fill="#666">3</text>
    <text x="239" y="100" text-anchor="middle" font-size="10" fill="#666">4</text>
    <text x="283" y="100" text-anchor="middle" font-size="10" fill="#666">5</text>
    <text x="327" y="100" text-anchor="middle" font-size="10" fill="#666">6</text>
    <text x="371" y="100" text-anchor="middle" font-size="10" fill="#666">7</text>
    <text x="415" y="100" text-anchor="middle" font-size="10" fill="#666">8</text>
    <text x="459" y="100" text-anchor="middle" font-size="10" fill="#666">9</text>
  </g>

  <!-- 左：链式传播 -->
  <g filter="url(#rough2)">
    <rect x="26" y="118" width="230" height="176" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="141" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a24">链式传播：一路相邻翻转</text>
    <rect x="50" y="160" width="48" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="118" y="160" width="48" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="160" width="48" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="74" y="181" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="142" y="181" text-anchor="middle" font-size="13" fill="#333">4</text>
    <text x="210" y="181" text-anchor="middle" font-size="13" fill="#333">5</text>
    <path d="M 100 176 L 116 176" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <path d="M 168 176 L 184 176" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <text x="108" y="156" text-anchor="middle" font-size="11" fill="#2f5a24">+1</text>
    <text x="176" y="156" text-anchor="middle" font-size="11" fill="#2f5a24">+1</text>
    <text x="141" y="218" text-anchor="middle" font-size="11.5" fill="#333">中间的 4 被翻两次，恰好抵消</text>
    <text x="141" y="240" text-anchor="middle" font-size="11.5" fill="#333">净效果：只有 3 和 5 各翻一次</text>
    <text x="141" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a24">代价 = b − a = 5 − 3 = 2</text>
  </g>

  <!-- 右：远程翻转 -->
  <g filter="url(#rough2)">
    <rect x="264" y="118" width="230" height="176" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="379" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6512">远程翻转：一次操作翻两位</text>
    <rect x="292" y="186" width="56" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="2"/>
    <rect x="410" y="186" width="56" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="2"/>
    <text x="320" y="207" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="438" y="207" text-anchor="middle" font-size="13" fill="#333">5</text>
    <path d="M 320 182 Q 379 150 438 182" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)"/>
    <text x="379" y="160" text-anchor="middle" font-size="11" fill="#8a6512">一次操作</text>
    <text x="379" y="240" text-anchor="middle" font-size="11.5" fill="#333">无论 a、b 相距多远</text>
    <text x="379" y="260" text-anchor="middle" font-size="11.5" fill="#333">代价都一样</text>
    <text x="379" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6512">代价 = x</text>
  </g>

  <!-- 底部公式 -->
  <g filter="url(#rough2)">
    <rect x="150" y="312" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="260" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">配对代价 = min(x, b − a)</text>
  </g>
</svg>
