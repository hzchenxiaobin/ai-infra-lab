<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：高位→低位逐位试探 + 一趟扫描检查</text>
  <text x="310" y="44" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">mask = 已确认能清零的位集合；答案 = full &amp; ~cleared（full = OR(nums)，30 位以内）</text>

  <!-- Part 1: bit greedy main flow -->
  <text x="44" y="72" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">① 主流程：逐位贪心清零</text>

  <rect x="40" y="84" width="118" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="99" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">full = OR(nums)</text>

  <path d="M158,102 L182,102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="184" y="84" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="254" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b 从 29 到 0 逐位</text>
  <text x="254" y="115" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">跳过不在 full 中的位</text>

  <path d="M324,102 L348,102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="350" y="84" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mask = cleared|bit</text>

  <path d="M480,102 L504,102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="506" y="84" width="86" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="549" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">一趟扫描 cnt</text>

  <path d="M549,120 L549,144" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="549,146 601,172 549,198 497,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="549" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt ≤ k ?</text>
  <text x="549" y="183" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（见下方②）</text>

  <!-- yes branch -->
  <path d="M497,172 L420,172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="459" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="286" y="156" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="351" y="170" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cleared = mask</text>
  <text x="351" y="183" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">位 b 成功清零 ✓</text>

  <!-- no branch -->
  <path d="M549,198 L549,222" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="563" y="215" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="456" y="224" width="186" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="549" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">位 b 留在答案里（放弃清零）</text>

  <!-- loop back -->
  <path d="M456,239 L254,239 L254,120" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="232" font-size="9.5" fill="#999" filter="url(#rough2)">处理下一位 b</text>

  <!-- final -->
  <rect x="40" y="156" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">所有位处理完：</text>
  <text x="140" y="191" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">答案 = full &amp; ~cleared</text>

  <!-- Part 2: check scan -->
  <text x="44" y="286" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">② 检查 mask：一趟贪心扫描，求最少操作数 cnt</text>

  <rect x="40" y="300" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cur = 全 1，cnt = 0</text>

  <path d="M190,317 L222,317" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="224" y="300" width="128" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="288" y="315" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">对每个 x：</text>
  <text x="288" y="329" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cur &amp;= x</text>

  <path d="M352,317 L384,317" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="454,286 522,317 454,348 386,317" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cur &amp; mask = 0 ?</text>

  <!-- yes: cut -->
  <path d="M386,317 L348,317 L348,366 L368,366" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="344" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="370" y="350" width="184" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="462" y="364" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切段：cur ← 全 1</text>
  <text x="462" y="378" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">段已合法，不花操作</text>

  <!-- no: merge -->
  <path d="M522,317 L552,317 L552,366 L532,366" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="543" y="344" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="348" y="392" width="256" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="476" y="406" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吞并下一位：cnt += 1（1 次操作）</text>
  <text x="476" y="420" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">扫完全程 → cnt 就是最少操作数</text>

  <!-- notes -->
  <rect x="40" y="350" width="292" height="76" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="186" y="371" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">两个免特判的细节</text>
  <text x="186" y="390" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">尾段没切段 → 并入上一段：并段 AND ⊆ 上一段</text>
  <text x="186" y="406" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">AND，自动合法，代价已计入 cnt</text>
  <text x="186" y="422" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">一段都切不出 → cnt = n &gt; k 自动否决</text>
</svg>
