<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：0/1 转换 + 前缀计数 + 余数匹配</text>

  <!-- Row 1: nums -->
  <text x="30" y="62" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="120" y="44" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="192" y="44" width="72" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="264" y="44" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="336" y="44" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="424" y="64" font-size="11" fill="#999" filter="url(#rough2)">modulo=3, k=0</text>

  <path d="M 300 78 L 300 94" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="90" font-size="11" fill="#446688" filter="url(#rough2)">b[i] = 1 若 nums[i]%modulo == k</text>

  <!-- Row 2: b -->
  <text x="30" y="126" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">b[i]</text>
  <rect x="120" y="108" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="192" y="108" width="72" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="264" y="108" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="336" y="108" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 300 142 L 300 158" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="154" font-size="11" fill="#446688" filter="url(#rough2)">s[i] = b[0] + … + b[i−1]</text>

  <!-- Row 3: prefix s -->
  <text x="30" y="190" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <rect x="72" y="172" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="96" y="192" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">s₀=0</text>
  <rect x="120" y="172" width="72" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="172" width="72" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="264" y="172" width="72" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="336" y="172" width="72" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- subarray cnt -->
  <rect x="72" y="216" width="336" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="240" y="236" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">子数组 nums[l..r] 的 cnt = s[r+1] − s[l]</text>

  <!-- condition transformation -->
  <rect x="50" y="262" width="500" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="286" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">趣味条件：(s[i] − s[j]) % modulo == k</text>
  <text x="300" y="310" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">移项（同余变形）：s[j] ≡ s[i] − k (mod modulo)</text>
  <text x="300" y="334" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">即查找 s[j] mod modulo == (s[i] − k + modulo) mod modulo</text>
  <text x="300" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">哈希表存「余数 → 出现次数」，先查 need 再写入 s[i]%modulo</text>
</svg>
