<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两次后序 DFS —— 先求总和，再找子树和 = S/2</text>

  <!-- 1. 开始 -->
  <rect x="210" y="46" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <line x1="260" y1="76" x2="260" y2="92" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 计算总和 -->
  <rect x="140" y="94" width="240" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#333">Pass 1：后序 DFS 求 S = Σnode.val</text>
  <line x1="260" y1="132" x2="260" y2="148" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 判奇偶 菱形 -->
  <polygon points="260,150 340,184 260,218 180,184" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12" fill="#333">S 是奇数?</text>

  <!-- Yes 分支 -> 返回 false -->
  <line x1="340" y1="184" x2="410" y2="184" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="358" y="178" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="170" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="460" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>

  <!-- No 分支 -->
  <line x1="260" y1="218" x2="260" y2="236" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 4. target = S/2 -->
  <rect x="150" y="238" width="220" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#333">target = S / 2（S 已保证为偶）</text>
  <line x1="260" y1="276" x2="260" y2="292" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. Pass 2: 后序 DFS -->
  <rect x="120" y="294" width="280" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#333">Pass 2：后序 DFS，对每个非根节点计算子树和</text>
  <line x1="260" y1="332" x2="260" y2="348" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. 判匹配 菱形 -->
  <polygon points="260,350 360,388 260,426 160,388" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="392" text-anchor="middle" font-size="11" fill="#333">某子树和 == target?</text>

  <!-- Yes -> 返回 true -->
  <line x1="360" y1="388" x2="410" y2="388" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="382" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="374" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="460" y="394" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 true</text>

  <!-- No -> 继续 DFS / 全部访问完则 false -->
  <line x1="160" y1="388" x2="110" y2="388" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="382" font-size="11" fill="#888" font-weight="bold">否</text>
  <rect x="10" y="374" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="60" y="394" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 false</text>

  <!-- 回环箭头: 继续 DFS -->
  <path d="M 60 374 Q 60 332 120 313" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="340" font-size="10" fill="#888">下一个节点</text>

  <text x="260" y="446" text-anchor="middle" font-size="11" fill="#888">关键：根节点本身不计入候选（删根上方无意义），用 is_root 标志跳过整树</text>
</svg>
