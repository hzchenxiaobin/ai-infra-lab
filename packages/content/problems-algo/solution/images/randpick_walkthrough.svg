<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：w=[1,3,2,4], pre=[1,4,6,10], total=10, 取 r=5</text>

  <!-- 顶部数轴（紧凑） 80..400, 32px/单位 -->
  <rect x="80" y="52" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="96" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>

  <rect x="112" y="52" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="160" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="208" y="52" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="240" y="70" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>

  <rect x="272" y="52" width="128" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="336" y="70" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>

  <!-- 边界刻度 -->
  <text x="80" y="96" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="112" y="96" text-anchor="middle" font-size="10" fill="#666">1</text>
  <text x="208" y="96" text-anchor="middle" font-size="10" fill="#666">4</text>
  <text x="272" y="96" text-anchor="middle" font-size="10" fill="#666">6</text>
  <text x="400" y="96" text-anchor="middle" font-size="10" fill="#666">10</text>

  <!-- r=5 标记：x = 80 + 5*32 = 240 -->
  <path d="M 240 100 L 240 52" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="214" y="104" width="52" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="240" y="118" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">r = 5</text>

  <text x="430" y="70" font-size="11" fill="#888">r 落在 [4,6) → 答案应为 i=2</text>

  <!-- 二分过程表 -->
  <text x="70" y="156" font-size="12" fill="#444" font-weight="bold">二分查找过程（找首个 pre[i] &gt; 5）：</text>

  <!-- 表头 -->
  <rect x="70" y="166" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="95" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">步骤</text>

  <rect x="120" y="166" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="140" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">lo</text>

  <rect x="160" y="166" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">hi</text>

  <rect x="200" y="166" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="220" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">mid</text>

  <rect x="240" y="166" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">pre[mid]</text>

  <rect x="300" y="166" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="350" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">比较</text>

  <rect x="400" y="166" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="455" y="184" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">动作</text>

  <!-- 第 1 行 -->
  <rect x="70" y="194" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="120" y="194" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="213" text-anchor="middle" font-size="11" fill="#446688">0</text>
  <rect x="160" y="194" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="213" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <rect x="200" y="194" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="220" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="240" y="194" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="213" text-anchor="middle" font-size="11" fill="#446688">4</text>
  <rect x="300" y="194" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a">4 ≤ 5</text>
  <rect x="400" y="194" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">lo = mid+1 = 2</text>

  <!-- 第 2 行 -->
  <rect x="70" y="224" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="243" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="120" y="224" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="243" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <rect x="160" y="224" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="243" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <rect x="200" y="224" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="220" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="240" y="224" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="243" text-anchor="middle" font-size="11" fill="#446688">6</text>
  <rect x="300" y="224" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="243" text-anchor="middle" font-size="11" fill="#b85450">6 &gt; 5</text>
  <rect x="400" y="224" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">hi = mid = 2</text>

  <!-- 结束行 -->
  <rect x="70" y="254" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="95" y="273" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">结束</text>
  <rect x="120" y="254" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="273" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <rect x="160" y="254" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="273" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <rect x="200" y="254" width="40" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="273" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="240" y="254" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="270" y="273" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="300" y="254" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="273" text-anchor="middle" font-size="11" fill="#d6a040">lo == hi</text>
  <rect x="400" y="254" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="455" y="273" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">return 2 ✓</text>

  <!-- 结论框 -->
  <rect x="36" y="306" width="488" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="330" font-size="11.5" fill="#4a7a3a" font-weight="bold">结论：仅需 ⌈log₂n⌉ 次比较即定位</text>
  <text x="56" y="350" font-size="11" fill="#555">• pre 严格递增（w[i] ≥ 1）→ 可二分；「首个 pre[i] &gt; r」即 upper_bound / bisect_right</text>
  <text x="56" y="370" font-size="11" fill="#555">• n=4 时最多 2 次比较；n=10⁴ 时约 14 次，远优于线性扫描的 O(n)</text>
</svg>
