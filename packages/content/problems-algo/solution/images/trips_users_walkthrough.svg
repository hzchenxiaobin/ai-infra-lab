<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐行程过滤 + 按天聚合取消率</text>

  <!-- Left: Trips table with banned annotations -->
  <text x="155" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Trips（标注 banned 状态）</text>

  <!-- Header -->
  <rect x="20" y="56" width="270" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="35" y="71" font-size="8" fill="#333">id</text>
  <text x="62" y="71" font-size="8" fill="#333">cli</text>
  <text x="92" y="71" font-size="8" fill="#333">cli_ban</text>
  <text x="135" y="71" font-size="8" fill="#333">drv</text>
  <text x="165" y="71" font-size="8" fill="#333">drv_ban</text>
  <text x="210" y="71" font-size="8" fill="#333">status</text>
  <text x="262" y="71" font-size="8" fill="#333">保留?</text>
  <line x1="52" y1="56" x2="52" y2="78" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="80" y1="56" x2="80" y2="78" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="122" y1="56" x2="122" y2="78" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="150" y1="56" x2="150" y2="78" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="195" y1="56" x2="195" y2="78" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="250" y1="56" x2="250" y2="78" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Day 1 separator -->
  <rect x="20" y="78" width="270" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="155" y="89" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2013-10-01</text>

  <!-- Trip 1: id=1, cli=1(No), drv=10(No), completed, keep -->
  <rect x="20" y="92" width="270" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="35" y="104" font-size="8" fill="#333">1</text>
  <text x="62" y="104" font-size="8" fill="#333">1</text>
  <text x="92" y="104" font-size="8" fill="#4a7a3a">No</text>
  <text x="135" y="104" font-size="8" fill="#333">10</text>
  <text x="165" y="104" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="104" font-size="7" fill="#333">completed</text>
  <text x="262" y="104" font-size="8" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Trip 2: id=2, cli=2(Yes!), drv=11(No), cancelled, EXCLUDE -->
  <rect x="20" y="110" width="270" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="35" y="122" font-size="8" fill="#333">2</text>
  <text x="62" y="122" font-size="8" fill="#b85450" font-weight="bold">2</text>
  <text x="92" y="122" font-size="8" fill="#b85450" font-weight="bold">Yes!</text>
  <text x="135" y="122" font-size="8" fill="#333">11</text>
  <text x="165" y="122" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="122" font-size="7" fill="#b85450">cancelled</text>
  <text x="262" y="122" font-size="8" fill="#b85450" font-weight="bold">✗</text>

  <!-- Trip 3: id=3, cli=3(No), drv=12(No), completed, keep -->
  <rect x="20" y="128" width="270" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="35" y="140" font-size="8" fill="#333">3</text>
  <text x="62" y="140" font-size="8" fill="#333">3</text>
  <text x="92" y="140" font-size="8" fill="#4a7a3a">No</text>
  <text x="135" y="140" font-size="8" fill="#333">12</text>
  <text x="165" y="140" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="140" font-size="7" fill="#333">completed</text>
  <text x="262" y="140" font-size="8" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Trip 4: id=4, cli=4(No), drv=13(No), cancelled, keep -->
  <rect x="20" y="146" width="270" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="35" y="158" font-size="8" fill="#333">4</text>
  <text x="62" y="158" font-size="8" fill="#333">4</text>
  <text x="92" y="158" font-size="8" fill="#4a7a3a">No</text>
  <text x="135" y="158" font-size="8" fill="#333">13</text>
  <text x="165" y="158" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="158" font-size="7" fill="#d6a040">cancelled</text>
  <text x="262" y="158" font-size="8" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Day 2 separator -->
  <rect x="20" y="166" width="270" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="155" y="177" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2013-10-02</text>

  <!-- Trip 5: keep -->
  <rect x="20" y="180" width="270" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="35" y="192" font-size="8" fill="#333">5</text>
  <text x="62" y="192" font-size="8" fill="#333">1</text>
  <text x="92" y="192" font-size="8" fill="#4a7a3a">No</text>
  <text x="135" y="192" font-size="8" fill="#333">10</text>
  <text x="165" y="192" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="192" font-size="7" fill="#333">completed</text>
  <text x="262" y="192" font-size="8" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Trip 6: EXCLUDE -->
  <rect x="20" y="198" width="270" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="35" y="210" font-size="8" fill="#333">6</text>
  <text x="62" y="210" font-size="8" fill="#b85450" font-weight="bold">2</text>
  <text x="92" y="210" font-size="8" fill="#b85450" font-weight="bold">Yes!</text>
  <text x="135" y="210" font-size="8" fill="#333">11</text>
  <text x="165" y="210" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="210" font-size="7" fill="#333">completed</text>
  <text x="262" y="210" font-size="8" fill="#b85450" font-weight="bold">✗</text>

  <!-- Trip 7: keep -->
  <rect x="20" y="216" width="270" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="35" y="228" font-size="8" fill="#333">7</text>
  <text x="62" y="228" font-size="8" fill="#333">3</text>
  <text x="92" y="228" font-size="8" fill="#4a7a3a">No</text>
  <text x="135" y="228" font-size="8" fill="#333">12</text>
  <text x="165" y="228" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="228" font-size="7" fill="#333">completed</text>
  <text x="262" y="228" font-size="8" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Day 3 separator -->
  <rect x="20" y="236" width="270" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="155" y="247" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2013-10-03</text>

  <!-- Trip 8: EXCLUDE -->
  <rect x="20" y="250" width="270" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="35" y="262" font-size="8" fill="#333">8</text>
  <text x="62" y="262" font-size="8" fill="#b85450" font-weight="bold">2</text>
  <text x="92" y="262" font-size="8" fill="#b85450" font-weight="bold">Yes!</text>
  <text x="135" y="262" font-size="8" fill="#333">12</text>
  <text x="165" y="262" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="262" font-size="7" fill="#333">completed</text>
  <text x="262" y="262" font-size="8" fill="#b85450" font-weight="bold">✗</text>

  <!-- Trip 9: keep -->
  <rect x="20" y="268" width="270" height="18" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="35" y="280" font-size="8" fill="#333">9</text>
  <text x="62" y="280" font-size="8" fill="#333">3</text>
  <text x="92" y="280" font-size="8" fill="#4a7a3a">No</text>
  <text x="135" y="280" font-size="8" fill="#333">10</text>
  <text x="165" y="280" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="280" font-size="7" fill="#333">completed</text>
  <text x="262" y="280" font-size="8" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Trip 10: keep (cancelled) -->
  <rect x="20" y="286" width="270" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="35" y="298" font-size="8" fill="#333">10</text>
  <text x="62" y="298" font-size="8" fill="#333">4</text>
  <text x="92" y="298" font-size="8" fill="#4a7a3a">No</text>
  <text x="135" y="298" font-size="8" fill="#333">13</text>
  <text x="165" y="298" font-size="8" fill="#4a7a3a">No</text>
  <text x="210" y="298" font-size="7" fill="#d6a040">cancelled</text>
  <text x="262" y="298" font-size="8" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Arrow to right side -->
  <path d="M290 190 L315 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M290 228 L315 228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M290 280 L315 280" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Right side: per-day calculation -->
  <!-- Day 1 calc -->
  <rect x="320" y="96" width="230" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2013-10-01</text>
  <text x="335" y="130" font-size="9" fill="#333">总行程: 4 → 排除 1（id=2 封禁）</text>
  <text x="335" y="146" font-size="9" fill="#333">有效行程: 3</text>
  <text x="335" y="160" font-size="9" fill="#d6a040">取消: 1（id=4 cancelled_by_client）</text>
  <text x="335" y="176" font-size="10" fill="#b85450" font-weight="bold">Rate = 1/3 = 0.33</text>

  <!-- Day 2 calc -->
  <rect x="320" y="192" width="230" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2013-10-02</text>
  <text x="335" y="226" font-size="9" fill="#333">总行程: 3 → 排除 1（id=6 封禁）</text>
  <text x="335" y="242" font-size="9" fill="#333">有效行程: 2，取消: 0</text>
  <text x="335" y="258" font-size="10" fill="#b85450" font-weight="bold">Rate = 0/2 = 0.00</text>

  <!-- Day 3 calc -->
  <rect x="320" y="272" width="230" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="435" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2013-10-03</text>
  <text x="335" y="306" font-size="9" fill="#333">总行程: 3 → 排除 1（id=8 封禁）</text>
  <text x="335" y="322" font-size="9" fill="#333">有效行程: 2</text>
  <text x="335" y="338" font-size="9" fill="#d6a040">取消: 1（id=10 cancelled_by_driver）</text>
  <text x="335" y="354" font-size="10" fill="#b85450" font-weight="bold">Rate = 1/2 = 0.50</text>

  <!-- Result table -->
  <text x="290" y="390" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终输出</text>
  <rect x="160" y="396" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="412" text-anchor="middle" font-size="9" fill="#333">Day</text>
  <text x="250" y="412" text-anchor="middle" font-size="9" fill="#333">Cancellation Rate</text>
  <line x1="220" y1="396" x2="220" y2="420" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="160" y="420" width="120" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="200" y="434" text-anchor="middle" font-size="9" fill="#333">2013-10-01</text>
  <text x="250" y="434" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0.33</text>
  <line x1="220" y1="420" x2="220" y2="440" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="160" y="440" width="120" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="200" y="454" text-anchor="middle" font-size="9" fill="#333">2013-10-02</text>
  <text x="250" y="454" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0.00</text>
  <line x1="220" y1="440" x2="220" y2="460" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="160" y="460" width="120" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="200" y="474" text-anchor="middle" font-size="9" fill="#333">2013-10-03</text>
  <text x="250" y="474" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0.50</text>
  <line x1="220" y1="460" x2="220" y2="480" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <rect x="320" y="396" width="230" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="435" y="414" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">关键观察</text>
  <text x="330" y="430" font-size="8" fill="#333">• user_id=2 的 client 被封，3 天各</text>
  <text x="330" y="442" font-size="8" fill="#333">  有一行程（id=2/6/8）全被排除</text>
  <text x="330" y="458" font-size="8" fill="#b85450">• AVG(CASE) = 取消数/有效总数</text>
  <text x="330" y="472" font-size="8" fill="#333">• ROUND(...,2) 保留两位小数</text>
</svg>
