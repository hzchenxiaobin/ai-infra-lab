<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="440" fill="#fafafa"/>

  <text x="370" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">Hierholzer 演算（示例 1）：后序入栈 + 逆序 + 配对</text>
  <path d="M 195 44 Q 370 52 545 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ① DFS deep chain -->
  <text x="40" y="84" font-size="12" font-weight="bold" fill="#446688">① 从起点 11 出发，沿唯一出边一路深入到死胡同</text>

  <g filter="url(#rough2)"><rect x="50" y="108" width="70" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="85" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">11</text>
  <text x="85" y="162" text-anchor="middle" font-size="9" fill="#d6a040">起点</text>

  <g filter="url(#rough2)"><rect x="170" y="108" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="205" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b">9</text>

  <g filter="url(#rough2)"><rect x="290" y="108" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="325" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b">4</text>

  <g filter="url(#rough2)"><rect x="410" y="108" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="445" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6b">5</text>

  <g filter="url(#rough2)"><rect x="530" y="108" width="70" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="565" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a2b28">1</text>
  <text x="565" y="162" text-anchor="middle" font-size="9" fill="#b85450">死胡同·无出边</text>

  <path d="M 122 128 L 168 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 242 128 L 288 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 362 128 L 408 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 482 128 L 528 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② post-order push -->
  <text x="40" y="196" font-size="12" font-weight="bold" fill="#4a7a3a">② 回退时后序入栈：耗尽出边的节点先入栈</text>

  <path d="M 85 150 L 85 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 205 150 L 205 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 325 150 L 325 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 445 150 L 445 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 565 150 L 565 213" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><circle cx="85" cy="226" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="85" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">⑤</text>
  <g filter="url(#rough2)"><circle cx="205" cy="226" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="205" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">④</text>
  <g filter="url(#rough2)"><circle cx="325" cy="226" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="325" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">③</text>
  <g filter="url(#rough2)"><circle cx="445" cy="226" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="445" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">②</text>
  <g filter="url(#rough2)"><circle cx="565" cy="226" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="565" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">①</text>

  <!-- ③ ans stack -->
  <text x="40" y="276" font-size="12" font-weight="bold" fill="#444">③ ans（入栈顺序 ①→⑤）：</text>
  <g filter="url(#rough2)"><rect x="40" y="288" width="560" height="40" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/></g>

  <g filter="url(#rough2)"><rect x="55" y="295" width="100" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="105" y="313" text-anchor="middle" font-size="12" fill="#2e6e2e">1 ①</text>
  <g filter="url(#rough2)"><rect x="170" y="295" width="100" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="220" y="313" text-anchor="middle" font-size="12" fill="#2e6e2e">5 ②</text>
  <g filter="url(#rough2)"><rect x="285" y="295" width="100" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="335" y="313" text-anchor="middle" font-size="12" fill="#2e6e2e">4 ③</text>
  <g filter="url(#rough2)"><rect x="400" y="295" width="100" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="450" y="313" text-anchor="middle" font-size="12" fill="#2e6e2e">9 ④</text>
  <g filter="url(#rough2)"><rect x="515" y="295" width="100" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/></g>
  <text x="565" y="313" text-anchor="middle" font-size="12" fill="#2e6e2e">11 ⑤</text>

  <!-- ④ reverse -->
  <text x="40" y="356" font-size="12" font-weight="bold" fill="#b85450">④ reverse(ans) → 节点路径 → 相邻配对即答案：</text>
  <path d="M 320 330 L 320 348" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="55" y="362" width="62" height="28" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="86" y="381" text-anchor="middle" font-size="12" fill="#7a2b28">11</text>
  <g filter="url(#rough2)"><rect x="127" y="362" width="62" height="28" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="158" y="381" text-anchor="middle" font-size="12" fill="#7a2b28">9</text>
  <g filter="url(#rough2)"><rect x="199" y="362" width="62" height="28" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="230" y="381" text-anchor="middle" font-size="12" fill="#7a2b28">4</text>
  <g filter="url(#rough2)"><rect x="271" y="362" width="62" height="28" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="302" y="381" text-anchor="middle" font-size="12" fill="#7a2b28">5</text>
  <g filter="url(#rough2)"><rect x="343" y="362" width="62" height="28" rx="4" fill="#fce4ec" stroke="#b85450"/></g>
  <text x="374" y="381" text-anchor="middle" font-size="12" fill="#7a2b28">1</text>

  <text x="430" y="372" font-size="11" fill="#666">→ 配对：</text>
  <g filter="url(#rough2)"><rect x="430" y="380" width="76" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="468" y="396" text-anchor="middle" font-size="10" fill="#7a5415">[11,9]</text>
  <g filter="url(#rough2)"><rect x="430" y="408" width="76" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="468" y="424" text-anchor="middle" font-size="10" fill="#7a5415">[9,4]</text>
  <g filter="url(#rough2)"><rect x="514" y="380" width="76" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="552" y="396" text-anchor="middle" font-size="10" fill="#7a5415">[4,5]</text>
  <g filter="url(#rough2)"><rect x="514" y="408" width="76" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="552" y="424" text-anchor="middle" font-size="10" fill="#7a5415">[5,1]</text>

  <text x="620" y="396" font-size="10" fill="#888">节点路径长 n+1</text>
  <text x="620" y="412" font-size="10" fill="#888">→ 数对数 = n</text>
</svg>
