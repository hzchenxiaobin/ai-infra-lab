<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fdfcf7"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">排行榜：双表分工</text>
  <path d="M 250 38 Q 360 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 表 ① 哈希表 ===== -->
  <g filter="url(#sk)">
    <rect x="25" y="60" width="300" height="280" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="175" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">表 ① 哈希表 score</text>
  <text x="175" y="98" text-anchor="middle" font-size="10" fill="#5a7a9a">playerId → 当前分数（O(1) 查/改）</text>
  <line x1="45" y1="108" x2="305" y2="108" stroke="#4a8edb" stroke-width="1" filter="url(#sk)"/>

  <!-- header row -->
  <text x="90" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">playerId</text>
  <text x="230" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">分数</text>

  <!-- data rows: 2->51, 3->39, 4->51, 5->4 -->
  <g filter="url(#sk)"><rect x="55" y="140" width="70" height="26" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="90" y="158" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="195" y="140" width="70" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="230" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">51</text>

  <g filter="url(#sk)"><rect x="55" y="172" width="70" height="26" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="90" y="190" text-anchor="middle" font-size="12" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="195" y="172" width="70" height="26" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="230" y="190" text-anchor="middle" font-size="12" fill="#333">39</text>

  <g filter="url(#sk)"><rect x="55" y="204" width="70" height="26" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="90" y="222" text-anchor="middle" font-size="12" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="195" y="204" width="70" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="230" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">51</text>

  <g filter="url(#sk)"><rect x="55" y="236" width="70" height="26" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="90" y="254" text-anchor="middle" font-size="12" fill="#333">5</text>
  <g filter="url(#sk)"><rect x="195" y="236" width="70" height="26" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="230" y="254" text-anchor="middle" font-size="12" fill="#333">4</text>

  <text x="175" y="285" text-anchor="middle" font-size="10" fill="#5a7a9a">addScore / reset 改这里 → 同步改表 ②</text>
  <text x="175" y="305" text-anchor="middle" font-size="10" fill="#7a5415">★ 按玩家定位：O(1)</text>

  <!-- ===== 表 ② 有序计数字典 ===== -->
  <g filter="url(#sk)">
    <rect x="395" y="60" width="300" height="280" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="545" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">表 ② 有序计数 cnt</text>
  <text x="545" y="98" text-anchor="middle" font-size="10" fill="#4a7a5a">分数(降序) → 人数（O(K) 取前 K）</text>
  <line x1="415" y1="108" x2="675" y2="108" stroke="#4a8e4a" stroke-width="1" filter="url(#sk)"/>

  <text x="460" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">分数</text>
  <text x="600" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">人数</text>

  <!-- rows: 51->2, 39->1, 4->1 -->
  <g filter="url(#sk)"><rect x="425" y="150" width="70" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="460" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">51</text>
  <g filter="url(#sk)"><rect x="565" y="150" width="70" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="600" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2</text>

  <g filter="url(#sk)"><rect x="425" y="188" width="70" height="30" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="460" y="208" text-anchor="middle" font-size="13" fill="#333">39</text>
  <g filter="url(#sk)"><rect x="565" y="188" width="70" height="30" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="600" y="208" text-anchor="middle" font-size="13" fill="#333">1</text>

  <g filter="url(#sk)"><rect x="425" y="226" width="70" height="30" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="460" y="246" text-anchor="middle" font-size="13" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="565" y="226" width="70" height="30" rx="4" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="600" y="246" text-anchor="middle" font-size="13" fill="#333">1</text>

  <text x="545" y="278" text-anchor="middle" font-size="10" fill="#888">↓ 按分数降序排列</text>
  <text x="545" y="298" text-anchor="middle" font-size="10" fill="#4a7a5a">top(K)：从最高分往下扫</text>
  <text x="545" y="316" text-anchor="middle" font-size="10" fill="#7a5415">★ 同分合并成一桶：扫 ≤ K 步</text>

  <!-- aggregation arrows: 两个 51 合并成一桶 -->
  <path d="M 265 153 Q 345 150 423 165" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 265 217 Q 345 210 423 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="345" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">同分 → 合并计数</text>

  <!-- ===== bottom caption ===== -->
  <g filter="url(#sk)"><rect x="25" y="358" width="670" height="68" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="40" y="382" font-size="12" font-weight="bold" fill="#444">核心思想：</text>
  <text x="40" y="402" font-size="11" fill="#444">表 ① 哈希表按 playerId 存分数，单点读写 O(1)；表 ② 把分数聚合成「分数→人数」并按降序维护。</text>
  <text x="40" y="418" font-size="11" fill="#7a5415">★ addScore/reset 同步两张表；top(K) 只扫表 ② 直到凑满 K 人 → O(K)，与总人数 n 无关。</text>
</svg>
