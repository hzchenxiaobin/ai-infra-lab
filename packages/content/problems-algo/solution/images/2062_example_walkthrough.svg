<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">逐步演算：纯元音段 "uaieuoua"（来自 "cuaieuouac"）</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">段内坐标 j=0..7，套用 1358「最后位置」法：贡献 = min(last) + 1</text>

  <!-- Table outer frame -->
  <rect x="8" y="56" width="504" height="224" fill="none" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column dividers (x: 58,108,158,208,258,308,358,408,458) -->
  <line x1="58" y1="56" x2="58" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="108" y1="56" x2="108" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="158" y1="56" x2="158" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="208" y1="56" x2="208" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="258" y1="56" x2="258" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="308" y1="56" x2="308" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="358" y1="56" x2="358" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="408" y1="56" x2="408" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="458" y1="56" x2="458" y2="280" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header divider -->
  <line x1="8" y1="84" x2="512" y2="84" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="9" y="57" width="502" height="27" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="33" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">j</text>
  <text x="83" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">word[j]</text>
  <text x="133" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">last_a</text>
  <text x="183" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">last_e</text>
  <text x="233" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">last_i</text>
  <text x="283" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">last_o</text>
  <text x="333" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">last_u</text>
  <text x="383" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">min</text>
  <text x="433" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">+贡献</text>
  <text x="485" y="75" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ans</text>

  <!-- Row height: 24.5. y centers: 96.5, 121, 145.5, 170, 194.5, 219, 243.5, 268 -->
  <!-- Row dividers between rows (subtle). Rows j=0..4 (no contrib) plain; j=5,6,7 (contrib>0) green tint -->

  <!-- j=0 u -->
  <text x="33" y="100" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="83" y="100" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">u</text>
  <text x="133" y="100" text-anchor="middle" font-size="11" fill="#bbb">−1</text>
  <text x="183" y="100" text-anchor="middle" font-size="11" fill="#bbb">−1</text>
  <text x="233" y="100" text-anchor="middle" font-size="11" fill="#bbb">−1</text>
  <text x="283" y="100" text-anchor="middle" font-size="11" fill="#bbb">−1</text>
  <text x="333" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="383" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="433" y="100" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="485" y="100" text-anchor="middle" font-size="11" fill="#555">0</text>
  <line x1="8" y1="108" x2="512" y2="108" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- j=1 a -->
  <text x="33" y="124" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="83" y="124" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">a</text>
  <text x="133" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="183" y="124" text-anchor="middle" font-size="11" fill="#bbb">−1</text>
  <text x="233" y="124" text-anchor="middle" font-size="11" fill="#bbb">−1</text>
  <text x="283" y="124" text-anchor="middle" font-size="11" fill="#bbb">−1</text>
  <text x="333" y="124" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="383" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="433" y="124" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="485" y="124" text-anchor="middle" font-size="11" fill="#555">0</text>
  <line x1="8" y1="132" x2="512" y2="132" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

