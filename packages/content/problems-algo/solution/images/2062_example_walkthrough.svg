  <text x="433" y="196" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="485" y="196" text-anchor="middle" font-size="11" fill="#555">0</text>
  <line x1="8" y1="204" x2="512" y2="204" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- j=5 o : first contribution (green row) -->
  <rect x="9" y="205" width="502" height="24" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="33" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
