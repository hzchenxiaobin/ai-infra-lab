  <line x1="8" y1="156" x2="512" y2="156" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- j=3 e -->
  <text x="33" y="172" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="83" y="172" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">e</text>
