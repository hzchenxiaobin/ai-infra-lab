  <text x="283" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="333" y="220" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="383" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="433" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="485" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="8" y1="229" x2="512" y2="229" stroke="#cde6c4" stroke-width="1" filter="url(#rough2)"/>

  <!-- j=6 u -->
  <rect x="9" y="230" width="502" height="24" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="33" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="83" y="245" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">u</text>
  <text x="133" y="245" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="183" y="245" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="233" y="245" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="283" y="245" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="333" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="383" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="433" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="485" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <line x1="8" y1="254" x2="512" y2="254" stroke="#cde6c4" stroke-width="1" filter="url(#rough2)"/>

  <!-- j=7 a -->
  <rect x="9" y="255" width="502" height="24" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="33" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="83" y="270" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">a</text>
