  <text x="485" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- Result box -->
  <rect x="110" y="296" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">段内合法子串 = 0+0+0+0+0+2+2+3 = 7 ✓</text>

  <!-- Footer -->
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#aaa">j=5 首次集齐五种元音（min=1≥0），此后 min 只增不减</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#aaa">辅音处重置 last 与 seg_start → 整体 O(n)/O(1)</text>
</svg>
