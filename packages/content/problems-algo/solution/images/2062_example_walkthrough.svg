  <line x1="8" y1="180" x2="512" y2="180" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- j=4 u -->
  <text x="33" y="196" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="83" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">u</text>
  <text x="133" y="196" text-anchor="middle" font-size="11" fill="#bbb">1</text>
  <text x="183" y="196" text-anchor="middle" font-size="11" fill="#bbb">3</text>
