  <text x="183" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="233" y="172" text-anchor="middle" font-size="11" fill="#bbb">2</text>
  <text x="283" y="172" text-anchor="middle" font-size="11" fill="#bbb">−1</text>
