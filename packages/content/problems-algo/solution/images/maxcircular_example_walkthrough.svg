<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [5, −3, 5, 2]</text>

  <!-- nums row -->
  <text x="30" y="60" font-size="12" fill="#888">nums:</text>
  <rect x="70" y="44" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="64" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="140" y="44" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="64" text-anchor="middle" font-size="12" fill="#333">−3</text>
  <rect x="210" y="44" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="64" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="280" y="44" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- curMax row -->
  <text x="30" y="112" font-size="12" fill="#888">curMax:</text>
  <rect x="70" y="96" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="116" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="140" y="96" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="116" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="210" y="96" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="280" y="96" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <text x="360" y="116" font-size="11" fill="#4a7a3a">max_sum = 9</text>

  <!-- curMin row -->
  <text x="30" y="168" font-size="12" fill="#888">curMin:</text>
  <rect x="70" y="152" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="172" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="140" y="152" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−3</text>
  <rect x="210" y="152" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="172" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="280" y="152" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="172" text-anchor="middle" font-size="12" fill="#333">4</text>

  <text x="360" y="172" font-size="11" fill="#b85450">min_sum = −3</text>

  <!-- total -->
  <text x="30" y="216" font-size="12" fill="#888">total:</text>
  <rect x="70" y="200" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="220" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="140" y="200" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="220" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="210" y="200" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="220" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="280" y="200" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <text x="360" y="220" font-size="11" fill="#d6a040">total = 9</text>

  <!-- Decision annotations -->
  <text x="170" y="140" text-anchor="middle" font-size="9" fill="#b85450">重启</text>
  <text x="240" y="140" text-anchor="middle" font-size="9" fill="#82b366">接上</text>
  <text x="310" y="140" text-anchor="middle" font-size="9" fill="#82b366">接上</text>

  <!-- Result calculation -->
  <rect x="40" y="248" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">max_sum = 9 &gt; 0，考虑环形</text>
  <text x="270" y="285" text-anchor="middle" font-size="12" fill="#555">total − min_sum = 9 − (−3) = 12 → answer = max(9, 12) = 12 ⭐</text>

  <!-- Visual: which elements are picked (circular = skip -3) -->
  <text x="30" y="322" font-size="12" fill="#888">环形选中:</text>
  <rect x="70" y="306" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="140" y="306" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="326" text-anchor="middle" font-size="11" fill="#ccc">−3</text>
  <rect x="210" y="306" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="280" y="306" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <text x="360" y="326" font-size="11" fill="#4a7a3a">跳过 −3，取 [5,5,2]</text>

  <!-- Summary -->
  <rect x="40" y="348" width="460" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="364" text-anchor="middle" font-size="11" fill="#444">环形子数组 [5, 5, 2] 跨越首尾，和 = 12 &gt; 普通最大和 9</text>
</svg>
