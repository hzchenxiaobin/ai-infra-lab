<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：取列 → 倍乘 → 赋新列 → 返回</text>

  <!-- Main flow row -->
  <rect x="16" y="64" width="116" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 接收</text>
  <text x="74" y="106" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">employees</text>

  <path d="M 132 93 L 148 93" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="64" width="116" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 取 salary</text>
  <text x="210" y="106" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">得到 Series</text>

  <path d="M 268 93 L 284 93" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="288" y="64" width="116" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="346" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 整列 ×2</text>
  <text x="346" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">向量化·无循环</text>

  <path d="M 404 93 L 420 93" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="424" y="64" width="122" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 赋给新列</text>
  <text x="485" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">df['bonus']=…</text>

  <!-- Into the diamond -->
  <path d="M 485 122 L 485 156 L 280 156 L 280 162" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="192,204 280,166 368,204 280,242" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">列名 bonus</text>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">已存在？</text>

  <!-- Branch: no -->
  <path d="M 192 204 L 162 204" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="182" width="124" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="98" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否 → 追加为</text>
  <text x="98" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">最右一列</text>

  <!-- Branch: yes -->
  <path d="M 368 204 L 396 204" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="398" y="182" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">是 → 整列</text>
  <text x="468" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">覆盖旧值</text>

  <!-- Converge to return -->
  <path d="M 98 226 L 98 286 L 194 286" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 468 226 L 468 286 L 366 286" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="198" y="264" width="164" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ 返回 employees</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（多了 bonus 列）</text>

  <!-- Bottom notes -->
  <rect x="50" y="336" width="460" height="70" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">索引对齐：右侧 Series 与 df 行索引按标签一一对齐，与物理顺序无关</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">向量化：×2 在 C 层连续数据块上整列完成，Python 层零循环</text>
</svg>
