<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：列的 LIS 动态规划</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="150" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">开始: m=len(strs[0]), dp[j]=1, best=1</text>

  <path d="M 270 78 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init j -->
  <rect x="210" y="100" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j = 1</text>

  <path d="M 270 134 L 270 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: j < m? -->
  <polygon points="270,158 386,196 270,234 154,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333">j &lt; m ?</text>
  <text x="270" y="208" text-anchor="middle" font-size="10" fill="#666">(还有列未处理)</text>

  <!-- No -> best finalize -->
  <path d="M 386 196 L 440 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="188" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="440" y="180" width="86" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="483" y="200" text-anchor="middle" font-size="11" fill="#333">返回 m − best</text>

  <!-- Yes -> down -->
  <path d="M 270 234 L 270 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="250" font-size="11" fill="#82b366">是</text>

  <!-- Init i -->
  <rect x="210" y="256" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 0</text>

  <path d="M 270 290 L 270 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: i < j? -->
  <polygon points="270,314 386,352 270,390 154,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#333">i &lt; j ?</text>
  <text x="270" y="364" text-anchor="middle" font-size="10" fill="#666">(还有前驱候选)</text>

  <!-- No -> update best, j++ -->
  <path d="M 154 352 L 110 352 L 110 122 L 210 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 112 238)">best=max(best,dp[j]), j++</text>

  <!-- Yes -> down -->
  <path d="M 270 390 L 270 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="406" font-size="11" fill="#82b366">是</text>

  <!-- Decision 3: le(i, j)? scan rows -->
  <polygon points="270,414 410,462 270,510 130,462" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="450" text-anchor="middle" font-size="11" fill="#333">∀r: strs[r][i] ≤ strs[r][j] ?</text>
  <text x="270" y="466" text-anchor="middle" font-size="10" fill="#666">(扫描所有行，首违即否)</text>
  <text x="270" y="482" text-anchor="middle" font-size="10" fill="#888">le(i, j) 谓词检查</text>

  <!-- Yes (le ok) -> dp[j] = max(dp[j], dp[i]+1) -> i++ -->
  <path d="M 410 462 L 460 462 L 460 273 L 330 273" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="362" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 462 362)">dp[j]=max(dp[j],dp[i]+1), i++</text>

  <!-- No -> i++ -->
  <path d="M 130 462 L 80 462 L 80 273 L 210 273" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="362" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" transform="rotate(-90 82 362)">不可比，i++</text>

  <!-- summary note -->
  <text x="270" y="540" text-anchor="middle" font-size="11" fill="#888">双层列循环 O(m²)，每次谓词最坏 O(n) → O(m²·n)；dp 数组 → O(m) 空间</text>
  <text x="270" y="554" text-anchor="middle" font-size="10" fill="#aaa">注：多行联合谓词无法构造单一全序，故不能用 O(m log m) 二分加速</text>
</svg>
