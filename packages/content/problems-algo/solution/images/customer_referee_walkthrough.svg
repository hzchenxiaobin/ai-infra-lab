  <text x="300" y="178" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="390" y="178" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="490" y="178" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE ✓</text>
  <line x1="95" y1="164" x2="95" y2="186" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="150" y1="164" x2="150" y2="186" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="248" y1="164" x2="248" y2="186" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="345" y1="164" x2="345" y2="186" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="435" y1="164" x2="435" y2="186" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

