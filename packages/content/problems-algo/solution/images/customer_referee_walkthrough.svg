  <line x1="95" y1="142" x2="95" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="150" y1="142" x2="150" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="248" y1="142" x2="248" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="345" y1="142" x2="345" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="435" y1="142" x2="435" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 5: Zack 1 - keep -->
  <rect x="40" y="164" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="178" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="120" y="178" text-anchor="middle" font-size="9" fill="#333">Zack</text>
