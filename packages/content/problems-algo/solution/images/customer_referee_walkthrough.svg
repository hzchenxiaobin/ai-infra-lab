  <text x="300" y="200" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="390" y="200" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="490" y="200" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE ✗</text>
  <line x1="95" y1="186" x2="95" y2="208" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="150" y1="186" x2="150" y2="208" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="248" y1="186" x2="248" y2="208" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="345" y1="186" x2="345" y2="208" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="435" y1="186" x2="435" y2="208" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Arrow down -->
  <path d="M290 214 L290 234" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="230" font-size="10" fill="#b85450" font-weight="bold">WHERE 留 TRUE 行（4 行）</text>

  <!-- Filtered result -->
  <rect x="80" y="244" width="420" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="258" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">id</text>
  <text x="180" y="258" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">name</text>
  <text x="320" y="258" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">referee_id</text>
  <text x="470" y="258" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">保留原因</text>
  <line x1="140" y1="244" x2="140" y2="266" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="244" x2="240" y2="266" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="244" x2="400" y2="266" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="266" width="420" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
