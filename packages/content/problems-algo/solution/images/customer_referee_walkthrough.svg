<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">示例演算：6 行逐行 WHERE 判定 → 留 4 行</text>

  <!-- Header row -->
  <rect x="40" y="54" width="500" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">id</text>
  <text x="120" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">name</text>
  <text x="200" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">referee_id</text>
  <text x="300" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">r != 2</text>
  <text x="390" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">r IS NULL</text>
  <text x="490" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">OR 结果</text>
  <line x1="95" y1="54" x2="95" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="150" y1="54" x2="150" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="248" y1="54" x2="248" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="345" y1="54" x2="345" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="435" y1="54" x2="435" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: Will null - keep -->
  <rect x="40" y="76" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="90" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="120" y="90" text-anchor="middle" font-size="9" fill="#333">Will</text>
  <text x="200" y="90" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">null</text>
  <text x="300" y="90" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">UNKNOWN</text>
  <text x="390" y="90" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="490" y="90" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE ✓</text>
  <line x1="95" y1="76" x2="95" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="150" y1="76" x2="150" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="248" y1="76" x2="248" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="345" y1="76" x2="345" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="435" y1="76" x2="435" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 2: Jane null - keep -->
  <rect x="40" y="98" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="112" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="120" y="112" text-anchor="middle" font-size="9" fill="#333">Jane</text>
  <text x="200" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">null</text>
  <text x="300" y="112" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">UNKNOWN</text>
  <text x="390" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="490" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE ✓</text>
  <line x1="95" y1="98" x2="95" y2="120" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="150" y1="98" x2="150" y2="120" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="248" y1="98" x2="248" y2="120" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="345" y1="98" x2="345" y2="120" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="435" y1="98" x2="435" y2="120" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 3: Alex 2 - drop -->
  <rect x="40" y="120" width="500" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="120" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Alex</text>
  <text x="200" y="134" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="300" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="390" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="490" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE ✗</text>
  <line x1="95" y1="120" x2="95" y2="142" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="150" y1="120" x2="150" y2="142" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="248" y1="120" x2="248" y2="142" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="345" y1="120" x2="345" y2="142" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="435" y1="120" x2="435" y2="142" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 4: Bill null - keep -->
  <rect x="40" y="142" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="156" text-anchor="middle" font-size="9" fill="#333">4</text>
