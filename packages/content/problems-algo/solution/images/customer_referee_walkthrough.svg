  <text x="180" y="278" text-anchor="middle" font-size="9" fill="#333">Will</text>
  <text x="320" y="278" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">null</text>
  <text x="470" y="278" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">IS NULL</text>
  <line x1="140" y1="266" x2="140" y2="282" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="240" y1="266" x2="240" y2="282" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="400" y1="266" x2="400" y2="282" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="80" y="282" width="420" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="294" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="180" y="294" text-anchor="middle" font-size="9" fill="#333">Jane</text>
  <text x="320" y="294" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">null</text>
  <text x="470" y="294" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">IS NULL</text>
  <line x1="140" y1="282" x2="140" y2="298" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="240" y1="282" x2="240" y2="298" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="400" y1="282" x2="400" y2="298" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="80" y="298" width="420" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="310" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="180" y="310" text-anchor="middle" font-size="9" fill="#333">Bill</text>
  <text x="320" y="310" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">null</text>
  <text x="470" y="310" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">IS NULL</text>
  <line x1="140" y1="298" x2="140" y2="314" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="240" y1="298" x2="240" y2="314" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="400" y1="298" x2="400" y2="314" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="80" y="314" width="420" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="326" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="180" y="326" text-anchor="middle" font-size="9" fill="#333">Zack</text>
  <text x="320" y="326" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="470" y="326" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">r != 2</text>
  <line x1="140" y1="314" x2="140" y2="330" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="240" y1="314" x2="240" y2="330" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="400" y1="314" x2="400" y2="330" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Arrow down to output -->
  <path d="M290 336 L290 356" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="370" y="352" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT name</text>

  <!-- Final output -->
