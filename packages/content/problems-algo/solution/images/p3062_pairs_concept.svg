<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心概念：两两结对对抗——偶数位选手 vs 奇数位选手</text>
  <text x="360" y="42" text-anchor="middle" font-size="10.5" fill="#888">长度为偶数的链表，每两个连续节点成一队；值大者胜，胜者为其下标的阵营得 1 分</text>

  <!-- Legend -->
  <rect x="140" y="56" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="67" font-size="10" fill="#555">偶数下标 → Even 阵营</text>
  <rect x="340" y="56" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="67" font-size="10" fill="#555">奇数下标 → Odd 阵营</text>
  <rect x="540" y="56" width="14" height="14" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="560" y="67" font-size="10" fill="#555">平局 → 双方 0 分</text>

  <!-- Pair labels -->
  <text x="148" y="94" text-anchor="middle" font-size="10" fill="#777" font-weight="bold">第 1 队 (0,1)</text>
  <text x="348" y="94" text-anchor="middle" font-size="10" fill="#777" font-weight="bold">第 2 队 (2,3)</text>
  <text x="548" y="94" text-anchor="middle" font-size="10" fill="#777" font-weight="bold">第 3 队 (4,5)</text>

  <!-- Pair dashed boxes -->
  <rect x="60" y="100" width="176" height="62" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <rect x="260" y="100" width="176" height="62" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <rect x="460" y="100" width="176" height="62" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>

  <!-- Nodes: [2,5,4,7,20,5] -->
  <rect x="70" y="114" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="137" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="170" y="114" width="54" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="137" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <rect x="270" y="114" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="137" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <rect x="370" y="114" width="54" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="137" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>

  <rect x="470" y="114" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="137" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">20</text>

  <rect x="570" y="114" width="54" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="597" y="137" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- next arrows -->
  <path d="M 124 132 L 164 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 132 L 264 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 324 132 L 364 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 424 132 L 464 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 524 132 L 564 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- winner badges -->
  <circle cx="224" cy="114" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="224" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">胜</text>
  <circle cx="424" cy="114" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="424" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">胜</text>
  <circle cx="524" cy="114" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="524" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">胜</text>

  <!-- index labels -->
  <text x="97" y="176" text-anchor="middle" font-size="9.5" fill="#446688">下标 0</text>
  <text x="197" y="176" text-anchor="middle" font-size="9.5" fill="#d6a040">下标 1</text>
  <text x="297" y="176" text-anchor="middle" font-size="9.5" fill="#446688">下标 2</text>
  <text x="397" y="176" text-anchor="middle" font-size="9.5" fill="#d6a040">下标 3</text>
  <text x="497" y="176" text-anchor="middle" font-size="9.5" fill="#446688">下标 4</text>
  <text x="597" y="176" text-anchor="middle" font-size="9.5" fill="#d6a040">下标 5</text>

  <!-- pair verdicts -->
  <text x="148" y="196" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2 &lt; 5 → Odd 阵营 +1</text>
  <text x="348" y="196" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4 &lt; 7 → Odd 阵营 +1</text>
  <text x="548" y="196" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">20 &gt; 5 → Even 阵营 +1</text>

  <!-- Scoreboard -->
  <rect x="150" y="212" width="160" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="234" text-anchor="middle" font-size="11" fill="#446688">Even 队（偶数位）</text>
  <text x="230" y="256" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1 胜</text>

  <rect x="410" y="212" width="160" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="234" text-anchor="middle" font-size="11" fill="#d6a040">Odd 队（奇数位）</text>
  <text x="490" y="256" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">2 胜</text>

  <text x="360" y="244" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">VS</text>

  <path d="M 360 266 L 360 288" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="360" y="284" text-anchor="middle" font-size="9.5" fill="#777">终局比分 1 : 2</text>

  <rect x="280" y="292" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="320" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">返回 "Odd"</text>

  <!-- Takeaway -->
  <rect x="40" y="348" width="640" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="368" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">规则三句：值大者胜 · 胜者给「自己下标的阵营」+1 分 · 平局双方均不计分</text>
  <text x="360" y="386" text-anchor="middle" font-size="10" fill="#555">终局只比两阵营总胜场：even &gt; odd → "Even"；odd &gt; even → "Odd"；否则 "Tie"</text>
</svg>
