<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：(2x²+4x+3) + (3x²-4x-1)</text>

  <!-- Table header -->
  <g filter="url(#rough2)">
    <rect x="20" y="48" width="560" height="30" fill="#f0f7ff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <line x1="80" y1="48" x2="80" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="200" y1="48" x2="200" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="320" y1="48" x2="320" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="460" y1="48" x2="460" y2="78" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="50" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="140" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">p1 / p2 当前</text>
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">幂次比较</text>
  <text x="510" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作 / 结果</text>

  <!-- Row 1 -->
  <g filter="url(#rough2)">
    <rect x="20" y="78" width="560" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <line x1="80" y1="78" x2="80" y2="134" stroke="#d6a040" stroke-width="1"/>
    <line x1="200" y1="78" x2="200" y2="134" stroke="#d6a040" stroke-width="1"/>
    <line x1="320" y1="78" x2="320" y2="134" stroke="#d6a040" stroke-width="1"/>
    <line x1="460" y1="78" x2="460" y2="134" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="50" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">①</text>
  <text x="140" y="100" text-anchor="middle" font-size="11" fill="#446688">p1=(2,2)</text>
  <text x="140" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a">p2=(3,2)</text>
  <text x="260" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2 == 2</text>
  <text x="470" y="100" font-size="10.5" fill="#444">sum=2+3=5≠0</text>
  <text x="470" y="118" font-size="10.5" fill="#2e6e2e" font-weight="bold">接入 (5,2)</text>

  <!-- Row 2 -->
  <g filter="url(#rough2)">
    <rect x="20" y="134" width="560" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <line x1="80" y1="134" x2="80" y2="190" stroke="#b85450" stroke-width="1"/>
    <line x1="200" y1="134" x2="200" y2="190" stroke="#b85450" stroke-width="1"/>
    <line x1="320" y1="134" x2="320" y2="190" stroke="#b85450" stroke-width="1"/>
    <line x1="460" y1="134" x2="460" y2="190" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="50" y="167" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">②</text>
  <text x="140" y="156" text-anchor="middle" font-size="11" fill="#446688">p1=(4,1)</text>
  <text x="140" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a">p2=(-4,1)</text>
  <text x="260" y="167" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 == 1</text>
  <text x="470" y="156" font-size="10.5" fill="#444">sum=4+(-4)=0</text>
  <text x="470" y="174" font-size="10.5" fill="#b85450" font-weight="bold">丢弃，不接入</text>

  <!-- Row 3 -->
  <g filter="url(#rough2)">
    <rect x="20" y="190" width="560" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <line x1="80" y1="190" x2="80" y2="246" stroke="#d6a040" stroke-width="1"/>
    <line x1="200" y1="190" x2="200" y2="246" stroke="#d6a040" stroke-width="1"/>
    <line x1="320" y1="190" x2="320" y2="246" stroke="#d6a040" stroke-width="1"/>
    <line x1="460" y1="190" x2="460" y2="246" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="50" y="223" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">③</text>
  <text x="140" y="212" text-anchor="middle" font-size="11" fill="#446688">p1=(3,0)</text>
  <text x="140" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a">p2=(-1,0)</text>
  <text x="260" y="223" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0 == 0</text>
  <text x="470" y="212" font-size="10.5" fill="#444">sum=3+(-1)=2≠0</text>
  <text x="470" y="230" font-size="10.5" fill="#2e6e2e" font-weight="bold">接入 (2,0)</text>

  <!-- Row 4: end -->
  <g filter="url(#rough2)">
    <rect x="20" y="246" width="560" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <line x1="80" y1="246" x2="80" y2="294" stroke="#4a7a3a" stroke-width="1"/>
    <line x1="200" y1="246" x2="200" y2="294" stroke="#4a7a3a" stroke-width="1"/>
    <line x1="320" y1="246" x2="320" y2="294" stroke="#4a7a3a" stroke-width="1"/>
    <line x1="460" y1="246" x2="460" y2="294" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <text x="50" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">终</text>
  <text x="140" y="275" text-anchor="middle" font-size="11" fill="#888">p1=p2=null</text>
  <text x="260" y="275" text-anchor="middle" font-size="11" fill="#888">退出循环</text>
  <text x="470" y="275" font-size="10.5" fill="#2e6e2e" font-weight="bold">接剩余(null)，返回</text>

  <!-- Result chain -->
  <text x="50" y="320" font-size="12" fill="#2e6e2e" font-weight="bold">结果链表：</text>
  <g filter="url(#rough2)">
    <rect x="130" y="306" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="180" y="306" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="270" y="306" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="320" y="306" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <path d="M 230 322 L 266 322" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>
  <text x="155" y="327" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="205" y="327" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="295" y="327" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="345" y="327" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="390" y="327" font-size="12" fill="#2e6e2e" font-weight="bold">= 5x² + 2</text>

  <g filter="url(#rough2)">
    <rect x="20" y="348" width="560" height="24" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3" rx="6"/>
  </g>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#444">关键：步②系数和为 0 → 该幂次项彻底消失，结果中无 x¹ 项</text>
</svg>
