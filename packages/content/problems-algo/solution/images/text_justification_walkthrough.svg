<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="760" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三行分别展示均匀分配、含余数左多右少、末行左对齐</text>
  <text x="540" y="46" text-anchor="end" font-size="10" fill="#888">maxWidth = 16（每格 30px）</text>

  <!-- ===== Line 1: This is an (uniform, extra=0) ===== -->
  <text x="60" y="64" font-size="12" fill="#b85450" font-weight="bold">第 1 行：贪心收入 This / is / an（example 放不下）</text>

  <!-- calc -->
  <rect x="60" y="74" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="96" text-anchor="middle" font-size="11" fill="#444">letters=8, spaces=16−8=8, gaps=2, base=8//2=4, extra=8%2=0</text>

  <!-- result bar: This(120) + 4sp(120) + is(60) + 4sp(120) + an(60) = 480, x=60..540 -->
  <rect x="60" y="118" width="480" height="40" fill="none" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="118" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="144" text-anchor="middle" font-size="13" fill="#333">This</text>
  <rect x="180" y="118" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="240" y="144" text-anchor="middle" font-size="10" fill="#d6a040">4 sp</text>
  <rect x="300" y="118" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="144" text-anchor="middle" font-size="13" fill="#333">is</text>
  <rect x="360" y="118" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="420" y="144" text-anchor="middle" font-size="10" fill="#d6a040">4 sp</text>
  <rect x="480" y="118" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="144" text-anchor="middle" font-size="13" fill="#333">an</text>

  <text x="240" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap=base=4</text>
  <text x="420" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap=base=4</text>
  <text x="300" y="190" text-anchor="middle" font-size="11" fill="#666">→ "This    is    an"（extra=0，均匀分配）</text>

  <!-- ===== Line 2: example of text (extra=1, left more) ===== -->
  <text x="60" y="226" font-size="12" fill="#b85450" font-weight="bold">第 2 行：贪心收入 example / of / text（justification. 放不下）</text>

  <rect x="60" y="236" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="258" text-anchor="middle" font-size="11" fill="#444">letters=13, spaces=16−13=3, gaps=2, base=3//2=1, extra=3%2=1</text>

  <!-- result bar: example(210) + 2sp(60) + of(60) + 1sp(30) + text(120) = 480 -->
  <rect x="60" y="280" width="480" height="40" fill="none" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="280" width="210" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="306" text-anchor="middle" font-size="13" fill="#333">example</text>
  <rect x="270" y="280" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="300" y="306" text-anchor="middle" font-size="10" fill="#d6a040">2 sp</text>
  <rect x="330" y="280" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="306" text-anchor="middle" font-size="13" fill="#333">of</text>
  <rect x="390" y="280" width="30" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="405" y="306" text-anchor="middle" font-size="9" fill="#d6a040">1sp</text>
  <rect x="420" y="280" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="306" text-anchor="middle" font-size="13" fill="#333">text</text>

  <text x="300" y="334" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">gap=base+1=2</text>
  <text x="405" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap=base=1</text>
  <path d="M 270 340 L 330 340" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 390 340 L 420 340" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="300" y="358" text-anchor="middle" font-size="11" fill="#666">→ "example  of text"（extra=1，左 gap 多 1，左多右少）</text>

  <!-- ===== Line 3: justification. (last line, left justify) ===== -->
  <text x="60" y="394" font-size="12" fill="#b85450" font-weight="bold">第 3 行（末行）：只剩 justification.，左对齐</text>

  <rect x="60" y="404" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="426" text-anchor="middle" font-size="11" fill="#444">末行不两端对齐：单词间 1 空格，letters=14，行末补 16−14=2 空格</text>

  <!-- result bar: justification.(420) + 2 trailing(60) = 480 -->
  <rect x="60" y="448" width="480" height="40" fill="none" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="448" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="474" text-anchor="middle" font-size="13" fill="#333">justification.</text>
  <rect x="480" y="448" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" rx="2" filter="url(#rough2)"/>
  <text x="510" y="474" text-anchor="middle" font-size="10" fill="#4a7a3a">行末</text>

  <text x="510" y="504" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2 sp 补尾</text>
  <text x="300" y="522" text-anchor="middle" font-size="11" fill="#666">→ "justification.  "（末行行末允许空格）</text>

  <!-- ===== Final output ===== -->
  <text x="60" y="558" font-size="12" fill="#b85450" font-weight="bold">最终输出</text>
  <rect x="60" y="568" width="480" height="140" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <rect x="80" y="582" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="603" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">"This    is    an"</text>

  <rect x="80" y="620" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="641" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">"example  of text"</text>

  <rect x="80" y="658" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="679" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">"justification.  "</text>

  <text x="300" y="718" text-anchor="middle" font-size="10" fill="#888">三行均恰为 16 字符，前两行两端对齐，末行左对齐</text>

  <!-- divider arrows connecting sections -->
  <path d="M 300 200 L 300 218" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 368 L 300 386" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 532 L 300 550" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
