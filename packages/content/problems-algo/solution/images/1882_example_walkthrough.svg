<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：servers = [3,3,2], tasks = [1,2,3,2,1,2]</text>
  <text x="320" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">初始 free = [(2,#2), (3,#0), (3,#1)]，busy = ∅</text>

  <!-- Column headers -->
  <text x="30" y="68" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="62" y="68" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">time</text>
  <text x="110" y="68" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">事件</text>
  <text x="330" y="68" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">free (权重,#)</text>
  <text x="480" y="68" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">busy (完成,权重,#)</text>
  <text x="610" y="68" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">ans</text>
  <path d="M 20 76 L 624 76" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- j=0: time=0 -->
  <text x="30" y="98" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="62" y="98" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="110" y="98" font-size="10" fill="#446688" filter="url(#rough2)">pop (2,#2) → 分配任务 0</text>
  <rect x="330" y="86" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="101" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">(3,#0)(3,#1)</text>
  <rect x="480" y="86" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="101" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(1,2,#2)</text>
  <text x="610" y="98" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[2]</text>

  <!-- j=1: time=1 -->
  <text x="30" y="128" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="62" y="128" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="110" y="128" font-size="10" fill="#d6a040" filter="url(#rough2)">busy 顶完成=1≤1 → 释放 #2</text>
  <text x="110" y="142" font-size="10" fill="#446688" filter="url(#rough2)">pop (2,#2) → 分配任务 1</text>
  <rect x="330" y="116" width="56" height="22" fill="#bbb" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="358" y="131" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">(3,#0)(3,#1)</text>
  <rect x="480" y="116" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="131" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(3,2,#2)</text>
  <text x="610" y="128" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[2,2]</text>

  <!-- j=2: time=2 -->
  <text x="30" y="168" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="62" y="168" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="110" y="168" font-size="10" fill="#888" filter="url(#rough2)">busy 顶完成=3&gt;2 → 不释放</text>
  <text x="110" y="182" font-size="10" fill="#446688" filter="url(#rough2)">pop (3,#0) → 分配任务 2</text>
  <rect x="330" y="156" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="171" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(3,#1)</text>
  <rect x="480" y="156" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="171" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(3,2,#2)(5,3,#0)</text>
  <text x="610" y="168" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[2,2,0]</text>

  <!-- j=3: time=3 -->
  <text x="30" y="208" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="62" y="208" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="110" y="208" font-size="10" fill="#d6a040" filter="url(#rough2)">busy 顶完成=3≤3 → 释放 #2</text>
  <text x="110" y="222" font-size="10" fill="#446688" filter="url(#rough2)">pop (2,#2) → 分配任务 3</text>
  <rect x="330" y="196" width="56" height="22" fill="#bbb" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="358" y="211" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">(3,#1)</text>
  <rect x="480" y="196" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="211" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(5,3,#0)(5,2,#2)</text>
  <text x="610" y="208" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[2,2,0,2]</text>

  <!-- j=4: time=4 -->
  <text x="30" y="248" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="62" y="248" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="110" y="248" font-size="10" fill="#888" filter="url(#rough2)">busy 顶完成=5&gt;4 → 不释放</text>
  <text x="110" y="262" font-size="10" fill="#446688" filter="url(#rough2)">pop (3,#1) → 分配任务 4</text>
  <rect x="330" y="236" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="251" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">∅</text>
  <rect x="480" y="236" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="251" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">(5,3,#0)(5,2,#2)(5,3,#1)</text>
  <text x="610" y="248" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[…,1]</text>

  <!-- j=5: time=5 -->
  <text x="30" y="292" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="62" y="292" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="110" y="292" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">free 空 → time 跳到 5</text>
  <text x="110" y="306" font-size="10" fill="#d6a040" filter="url(#rough2)">释放 #0、#2、#1（均完成于 5）</text>
  <text x="110" y="320" font-size="10" fill="#446688" filter="url(#rough2)">pop (2,#2) → 分配任务 5</text>
  <rect x="330" y="280" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="295" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">(2,#2)</text>
  <rect x="330" y="304" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="319" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(3,#0)(3,#1)</text>
  <rect x="480" y="280" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="295" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(7,2,#2)</text>
  <text x="610" y="292" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[…,2]</text>

  <!-- Separator -->
  <path d="M 20 340 L 624 340" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="40" y="368" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">最终答案：</text>
  <rect x="130" y="356" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="178" y="356" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="226" y="356" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="274" y="356" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="294" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="322" y="356" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="370" y="356" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="430" y="374" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">= [2,2,0,2,1,2]</text>

  <!-- Key observations -->
  <rect x="40" y="400" width="560" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="422" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">关键观察：</text>
  <text x="56" y="440" font-size="10" fill="#555" filter="url(#rough2)">• j=1：#2 完成=1≤time=1 → 释放回 free，再被选中（权重 2 最小）→ 同一服务器可被复用</text>
  <text x="56" y="456" font-size="10" fill="#555" filter="url(#rough2)">• j=2：busy 顶完成=3&gt;time=2 → 不释放，free 中 (3,#0)&lt;(3,#1) → 选 #0（同权重按下标）</text>
  <text x="56" y="472" font-size="10" fill="#555" filter="url(#rough2)">• j=4：free 空、busy 顶完成=5 → time 跳到 5，一次性释放三台服务器（同时完成）</text>
  <text x="56" y="496" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ j=5 是精髓：空闲堆空时跳跃时间，且 while 循环释放同一时刻完成的所有服务器</text>
</svg>
