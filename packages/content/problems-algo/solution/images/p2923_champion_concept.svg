<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：冠军 = 全胜行 = 无败列</text>

  <!-- 列表头 -->
  <text x="162" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j = 0</text>
  <text x="206" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="250" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>

  <!-- 行标签 -->
  <text x="132" y="83" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">i = 0</text>
  <text x="132" y="121" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="132" y="159" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">2</text>

  <!-- 矩阵格子：行 0 -->
  <rect x="140" y="60" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="84" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">0</text>
  <rect x="184" y="60" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="228" y="60" width="44" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="84" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">1</text>

  <!-- 矩阵格子：行 1（冠军行，全 1） -->
  <rect x="140" y="98" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="98" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="122" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">0</text>
  <rect x="228" y="98" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 矩阵格子：行 2 -->
  <rect x="140" y="136" width="44" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="160" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="184" y="136" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="228" y="136" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="160" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">0</text>

  <!-- 冠军王冠 -->
  <path d="M 84 114 L 84 100 L 91 107 L 96 96 L 101 107 L 108 100 L 108 114 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="130" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">冠军</text>

  <!-- 右侧注解：全胜行 -->
  <path d="M 276 112 L 302 92" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="308" y="64" width="196" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="406" y="84" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">冠军行全 1（除对角线）</text>
  <text x="406" y="102" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">直接击败其他所有队伍</text>

  <!-- 右侧注解：无败列 -->
  <path d="M 232 155 L 302 155" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="308" y="132" width="196" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="406" y="152" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">冠军列全 0（除对角线）</text>
  <text x="406" y="170" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">没有任何队伍能击败它</text>

  <!-- 分隔线 -->
  <path d="M 40 204 L 480 204" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 性质框 -->
  <rect x="40" y="216" width="440" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">完全性：i ≠ j 时 grid[i][j] 与 grid[j][i] 恰有一个为 1 —— 任两队必分胜负</text>

  <rect x="40" y="258" width="440" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">传递性：a 强于 b、b 强于 c ⇒ a 强于 c —— n 支队伍可排成一条强弱链</text>

  <rect x="40" y="300" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⇒ 「更强」是全序，冠军唯一 = 强弱链的最大元</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">打擂台 n − 1 次比较即可直取</text>
</svg>
