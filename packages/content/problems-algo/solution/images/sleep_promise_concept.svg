<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">Promise 是一次性状态机：pending → fulfilled，setTimeout 是触发器</text>

  <!-- async call box -->
  <rect x="240" y="48" width="160" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">async sleep(millis)</text>

  <path d="M 320 90 L 320 108" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== pending state ===== -->
  <rect x="60" y="112" width="240" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">pending（未敲定）</text>
  <text x="180" y="164" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">new Promise(executor)</text>
  <text x="180" y="184" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">executor 同步执行</text>
  <text x="180" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">setTimeout(resolve, millis)</text>
  <text x="180" y="222" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">立即返回（仍 pending）</text>

  <!-- ===== fulfilled state ===== -->
  <rect x="340" y="112" width="240" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="460" y="140" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">fulfilled（已敲定）</text>
  <text x="460" y="164" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">定时器回调触发</text>
  <text x="460" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">resolve() 被调用</text>
  <text x="460" y="204" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">.then(onFulfilled) 执行</text>
  <text x="460" y="222" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一次性，不可回退</text>

  <!-- transition arrow with timer -->
  <path d="M 300 172 L 340 172" stroke="#446688" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="276" y="244" width="88" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="320" y="264" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⏱ millis ms</text>
  <path d="M 320 242 L 320 222" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- bottom annotations -->
  <rect x="60" y="300" width="240" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键点</text>
  <text x="180" y="344" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">构造期不阻塞主线程</text>
  <text x="180" y="362" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">setTimeout 把回调推入</text>
  <text x="180" y="380" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">宏任务队列，到期执行</text>

  <rect x="340" y="300" width="240" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">单次性</text>
  <text x="460" y="344" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">pending→fulfilled 单向</text>
  <text x="460" y="362" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">resolve 只生效第一次</text>
  <text x="460" y="380" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">再次调用 resolve 无效</text>
</svg>
