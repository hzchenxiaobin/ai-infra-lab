<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：m=2, n=2, maxMove=2, 起点 (0,0) → 答案 6</text>

  <!-- ===== Left: dp[1] table ===== -->
  <text x="120" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[1]（只剩 1 步）</text>
  <!-- 2x2 grid, cells 60x60, origin (60, 74) -->
  <!-- (0,0) -->
  <rect x="60" y="74" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <!-- (0,1) -->
  <rect x="120" y="74" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <!-- (1,0) -->
  <rect x="60" y="134" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <!-- (1,1) -->
  <rect x="120" y="134" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <!-- coord labels -->
  <text x="90" y="68" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
  <text x="150" y="68" text-anchor="middle" font-size="9" fill="#888">(0,1)</text>
  <text x="52" y="110" text-anchor="end" font-size="9" fill="#888">(1,0)</text>
  <text x="52" y="170" text-anchor="end" font-size="9" fill="#888">(1,1)</text>

  <!-- note for dp[1] -->
  <rect x="40" y="210" width="160" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="228" text-anchor="middle" font-size="10" fill="#555">每格 2 条 = 4 方向里</text>
  <text x="120" y="244" text-anchor="middle" font-size="10" fill="#555">恰有 2 方向越界（+1+1）</text>

  <!-- arrow from dp[1] to dp[2] computation -->
  <path d="M 210 164 L 248 164" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="229" y="156" text-anchor="middle" font-size="9" fill="#888">递推</text>

  <!-- ===== Right: dp[2][0][0] breakdown ===== -->
  <text x="390" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[2][0][0] = ?（4 方向求和）</text>

  <!-- 4 rows of computation -->
  <!-- up: out → 1 -->
  <rect x="270" y="74" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="282" y="94" font-size="11" fill="#333">↑ 上</text>
  <text x="330" y="94" font-size="11" fill="#888">越界</text>
  <text x="490" y="94" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- down: dp[1][1][0] = 2 -->
  <rect x="270" y="108" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="282" y="128" font-size="11" fill="#333">↓ 下</text>
  <text x="318" y="128" font-size="11" fill="#888">(1,0) 留界内</text>
  <text x="490" y="128" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">+ dp[1][1][0] = 2</text>

  <!-- left: out → 1 -->
  <rect x="270" y="142" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="282" y="162" font-size="11" fill="#333">← 左</text>
  <text x="330" y="162" font-size="11" fill="#888">越界</text>
  <text x="490" y="162" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- right: dp[1][0][1] = 2 -->
  <rect x="270" y="176" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="282" y="196" font-size="11" fill="#333">→ 右</text>
  <text x="318" y="196" font-size="11" fill="#888">(0,1) 留界内</text>
  <text x="490" y="196" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">+ dp[1][0][1] = 2</text>

  <!-- sum line -->
  <path d="M 390 210 L 390 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="280" y="226" width="220" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="390" y="250" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">dp[2][0][0] = 1+2+1+2 = 6 ✓</text>

  <!-- bottom summary -->
  <rect x="50" y="290" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：dp[2][0][0] 复用了 dp[1][1][0] 与 dp[1][0][1]</text>
  <text x="270" y="330" text-anchor="middle" font-size="11" fill="#555">— 这正是「子问题重复」的体现：从 (0,0) 向下走到 (1,0)，</text>
  <text x="270" y="346" text-anchor="middle" font-size="11" fill="#555">与从别处走到 (1,0)，剩余 1 步的出界路径数是同一个子问题 → 记忆化 / 递推</text>
</svg>
