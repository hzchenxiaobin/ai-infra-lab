<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：CASE WHEN 二分支逐级判定节点类型</text>

  <!-- ===== Start box ===== -->
  <rect x="170" y="48" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">对 Tree 表每一行 (id, p_id) 逐行判定</text>

  <!-- arrow down -->
  <path d="M280 88 L280 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Decision 1: p_id IS NULL? ===== -->
  <polygon points="280,112 410,158 280,204 150,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">p_id IS NULL ?</text>
  <text x="280" y="170" text-anchor="middle" font-size="8.5" fill="#888">(无父节点?)</text>

  <!-- Yes branch -> Root (right) -->
  <path d="M410 158 L470 158" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="152" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="470" y="140" width="74" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="507" y="158" text-anchor="middle" font-size="9" fill="#888">THEN</text>
  <text x="507" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Root</text>

  <!-- No branch -> down -->
  <path d="M280 204 L280 226" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="296" y="218" font-size="9" fill="#4a7a3a" font-weight="bold">No</text>

  <!-- ===== Decision 2: has child? ===== -->
  <polygon points="280,230 420,278 280,326 140,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">id IN (SELECT p_id</text>
  <text x="280" y="288" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">FROM Tree) ?</text>
  <text x="280" y="302" text-anchor="middle" font-size="8" fill="#888">(有子节点?)</text>

  <!-- Yes branch -> Inner (right) -->
  <path d="M420 278 L470 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="272" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="470" y="260" width="74" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="507" y="278" text-anchor="middle" font-size="9" fill="#888">THEN</text>
  <text x="507" y="292" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Inner</text>

  <!-- No branch -> down -->
  <path d="M280 326 L280 348" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="296" y="340" font-size="9" fill="#4a7a3a" font-weight="bold">No</text>

  <!-- ===== Result: Leaf ===== -->
  <rect x="220" y="350" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="9" fill="#888">ELSE</text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Leaf</text>

  <!-- ===== Bottom note: LEFT JOIN alternative ===== -->
  <rect x="30" y="404" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="48" y="422" font-size="9.5" fill="#b85450" font-weight="bold">替代写法：</text>
  <text x="125" y="422" font-size="9.5" fill="#555">LEFT JOIN Tree t2 ON t1.id = t2.p_id → t2.id IS NULL 则无子节点 → Leaf</text>
</svg>
