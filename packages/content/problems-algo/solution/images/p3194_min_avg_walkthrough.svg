<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [7,8,3,4,15,13,4,1] → 输出 5.5</text>

  <!-- sorted mini array -->
  <text x="46" y="56" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">排序后：</text>

  <rect x="104" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="144" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="184" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="224" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="264" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="304" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="344" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">13</text>

  <rect x="384" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">15</text>

  <text x="122" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="162" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="202" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="242" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="282" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="322" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="362" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="402" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>

  <!-- table header -->
  <rect x="60" y="86" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">轮次</text>
  <rect x="110" y="86" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">配对 ( i , j )</text>
  <rect x="220" y="86" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">和</text>
  <rect x="280" y="86" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">平均值</text>
  <rect x="340" y="86" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="375" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">best</text>

  <!-- row 1 -->
  <rect x="60" y="112" width="50" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="131" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="110" y="112" width="110" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="131" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">(0,7)：1 + 15</text>
  <rect x="220" y="112" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="131" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">16</text>
  <rect x="280" y="112" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="131" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">8.0</text>
  <rect x="340" y="112" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="375" y="131" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">16</text>

  <!-- row 2 -->
  <rect x="60" y="142" width="50" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <rect x="110" y="142" width="110" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">(1,6)：3 + 13</text>
  <rect x="220" y="142" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">16</text>
  <rect x="280" y="142" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">8.0</text>
  <rect x="340" y="142" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="375" y="161" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">16</text>

  <!-- row 3 -->
  <rect x="60" y="172" width="50" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <rect x="110" y="172" width="110" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">(2,5)：4 + 8</text>
  <rect x="220" y="172" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">12</text>
  <rect x="280" y="172" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">6.0</text>
  <rect x="340" y="172" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="375" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">12</text>

  <!-- row 4 highlighted -->
  <rect x="60" y="202" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="221" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="110" y="202" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="221" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(3,4)：4 + 7</text>
  <rect x="220" y="202" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="221" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="280" y="202" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="221" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5.5</text>
  <rect x="340" y="202" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="375" y="221" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">11 ★</text>

  <!-- note: best column stores integer sums -->
  <text x="418" y="131" font-size="10" fill="#888" filter="url(#rough2)">best 存整数和</text>
  <text x="418" y="145" font-size="10" fill="#888" filter="url(#rough2)">最后 ÷2 → 5.5</text>

  <!-- warning -->
  <rect x="52" y="250" width="416" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="267" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 陷阱：最外层 (1+15)/2 = 8.0 并不是答案！</text>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">最小平均值可能藏在最内层，n/2 对必须逐一比较</text>

  <!-- formula -->
  <rect x="52" y="306" width="416" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = min( a[i] + a[n−1−i] ) / 2 ，0 ≤ i &lt; n/2</text>
</svg>
