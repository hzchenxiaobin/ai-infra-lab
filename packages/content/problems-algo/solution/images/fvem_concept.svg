<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">邮箱结构：前缀 + @ + 域名</text>

  <!-- ===== Email structure ===== -->
  <text x="180" y="52" text-anchor="middle" font-size="10" fill="#888">前缀</text>
  <rect x="70" y="58" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="84" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">sally.come</text>

  <text x="310" y="84" text-anchor="middle" font-size="16" fill="#666">@</text>

  <text x="420" y="52" text-anchor="middle" font-size="10" fill="#888">域名</text>
  <rect x="330" y="58" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">leetcode.com</text>

  <!-- Arrows down -->
  <path d="M 180 98 L 180 116" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 98 L 420 116" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Prefix rules ===== -->
  <rect x="50" y="118" width="270" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="138" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">前缀规则</text>
  <text x="65" y="156" font-size="10" fill="#444">① 必须以字母开头 [a-zA-Z]</text>
  <text x="65" y="172" font-size="10" fill="#444">② 仅含字母/数字/_/./-</text>
  <text x="65" y="188" font-size="10" fill="#444">③ 后续字符零或多个 *</text>
  <text x="65" y="204" font-size="10" fill="#444">④ 大小写均可</text>

  <!-- ===== Domain rules ===== -->
  <rect x="340" y="118" width="190" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="138" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">域名规则</text>
  <text x="355" y="156" font-size="10" fill="#444">① 精确匹配 @leetcode.com</text>
  <text x="355" y="172" font-size="10" fill="#444">② 全部小写</text>
  <text x="355" y="188" font-size="10" fill="#444">③ . 需转义为 [.]</text>

  <!-- ===== Invalid examples ===== -->
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">无效邮箱示例</text>

  <rect x="40" y="250" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="270" font-size="11" fill="#333">.shapo@leetcode.com</text>
  <text x="510" y="270" text-anchor="end" font-size="10" fill="#b85450">✗ 前缀以 . 开头</text>

  <rect x="40" y="286" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="306" font-size="11" fill="#333">quarz#2020@leetcode.com</text>
  <text x="510" y="306" text-anchor="end" font-size="10" fill="#b85450">✗ 含非法字符 #</text>

  <rect x="40" y="322" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="342" font-size="11" fill="#333">david69@gmail.com</text>
  <text x="510" y="342" text-anchor="end" font-size="10" fill="#b85450">✗ 域名非 leetcode.com</text>
</svg>
