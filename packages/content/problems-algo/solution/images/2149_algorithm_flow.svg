<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针一趟扫描</text>

  <!-- ===== Step 1 ===== -->
  <rect x="70" y="44" width="420" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 1：初始化结果数组与双指针</text>
  <text x="86" y="86" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">ans = [0] * n</text>
  <text x="86" y="102" font-size="11.5" fill="#446688" font-family="'Comic Sans MS', monospace">posIdx = 0   // 正数落点（偶下标）</text>
  <text x="280" y="102" font-size="11.5" fill="#b85450" font-family="'Comic Sans MS', monospace">negIdx = 1   // 负数落点（奇下标）</text>

  <!-- Arrow down -->
  <path d="M 280 110 L 280 134" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 2: iterate ===== -->
  <rect x="100" y="140" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 2：遍历 x in nums（从左到右）</text>
  <text x="280" y="180" text-anchor="middle" font-size="10.5" fill="#888">顺序扫描天然保序</text>

  <!-- Arrow down -->
  <path d="M 280 192 L 280 216" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 3: branch ===== -->
  <rect x="70" y="222" width="420" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 3：按符号写入对应落点</text>

  <!-- Positive branch -->
  <rect x="86" y="256" width="180" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="96" y="276" font-size="11" fill="#446688" font-weight="bold">if x &gt; 0（正数）：</text>
  <text x="96" y="296" font-size="11.5" fill="#446688" font-family="'Comic Sans MS', monospace">ans[posIdx] = x</text>
  <text x="96" y="314" font-size="11.5" fill="#446688" font-family="'Comic Sans MS', monospace">posIdx += 2</text>

  <!-- Negative branch -->
  <rect x="286" y="256" width="190" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="296" y="276" font-size="11" fill="#b85450" font-weight="bold">if x &lt; 0（负数）：</text>
  <text x="296" y="296" font-size="11.5" fill="#b85450" font-family="'Comic Sans MS', monospace">ans[negIdx] = x</text>
  <text x="296" y="314" font-size="11.5" fill="#b85450" font-family="'Comic Sans MS', monospace">negIdx += 2</text>

  <!-- Arrow down -->
  <path d="M 280 344 L 280 368" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Answer ===== -->
  <rect x="120" y="372" width="320" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">Step 4：返回 ans</text>
  <text x="280" y="414" text-anchor="middle" font-size="10.5" fill="#888">ans[0..n-1] 已按 正,负,正,负… 填满</text>
  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#888">posIdx、negIdx 恰好同时走到 n</text>
</svg>
