<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：seen 是个栈，「−1」是回看指令</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">正整数压栈并把 k 清零；连续第 k 个 −1 = 从栈顶往下回看第 k 层</text>

  <!-- input stream -->
  <text x="280" y="68" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">输入 nums（示例 2）</text>
  <g filter="url(#rough2)">
    <rect x="172" y="76" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="192" y="96" text-anchor="middle" font-size="13" fill="#2e5c22">1</text>
    <rect x="216" y="76" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="236" y="96" text-anchor="middle" font-size="13" fill="#b07818">−1</text>
    <rect x="260" y="76" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="280" y="96" text-anchor="middle" font-size="13" fill="#2e5c22">2</text>
    <rect x="304" y="76" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="324" y="96" text-anchor="middle" font-size="13" fill="#b07818">−1</text>
    <rect x="348" y="76" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="368" y="96" text-anchor="middle" font-size="13" fill="#b07818">−1</text>
  </g>

  <!-- push arrow from stream into stack top -->
  <path d="M 192 108 C 186 128 170 140 148 149" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="200" y="128" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">正数 → 压栈</text>

  <!-- stack -->
  <text x="90" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">seen 栈</text>
  <g filter="url(#rough2)">
    <rect x="80" y="150" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="135" y="172" text-anchor="middle" font-size="14" fill="#2e5c22" font-weight="bold">2</text>
    <rect x="80" y="188" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="135" y="210" text-anchor="middle" font-size="14" fill="#2e5c22">1</text>
    <text x="135" y="240" text-anchor="middle" font-size="10.5" fill="#666">栈底（最早访问）</text>
  </g>

  <!-- depth annotations -->
  <path d="M 192 167 L 212 167" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="218" y="163" font-size="11" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">栈顶 = 最后访问的整数</text>
  <text x="218" y="178" font-size="11" fill="#2e5c22" filter="url(#rough2)">连续 k=1 个 −1 → 取 2</text>
  <path d="M 192 205 L 212 205" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="218" y="201" font-size="11" fill="#4a7a3a" filter="url(#rough2)">头部第 2 个 = 倒数第二新</text>
  <text x="218" y="216" font-size="11" fill="#4a7a3a" filter="url(#rough2)">连续 k=2 个 −1 → 取 1</text>
  <text x="218" y="248" font-size="11" fill="#b85450" filter="url(#rough2)">k &gt; 栈深（看穿历史）→ ans 补 −1</text>

  <!-- three rules -->
  <g filter="url(#rough2)">
    <rect x="36" y="272" width="156" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="114" y="294" text-anchor="middle" font-size="11.5" fill="#2e5c22" font-weight="bold">① 正整数 x</text>
    <text x="114" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a">压栈，k 清零</text>
    <rect x="204" y="272" width="156" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="282" y="294" text-anchor="middle" font-size="11.5" fill="#b07818" font-weight="bold">② 连续第 k 个 −1</text>
    <text x="282" y="312" text-anchor="middle" font-size="11" fill="#b07818">取头部第 k 个元素</text>
    <rect x="372" y="272" width="156" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="450" y="294" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">③ k &gt; 栈深</text>
    <text x="450" y="312" text-anchor="middle" font-size="11" fill="#b85450">ans 追加 −1</text>
  </g>

  <!-- analogy note -->
  <rect x="70" y="350" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">类比浏览器「后退」：访问页面 = 压栈；连按 k 次后退 = 回看第 k 层</text>
</svg>
