<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：x=66, y=77 — 逐行 JOIN 解析 + CASE 求值</text>

  <!-- Column headers -->
  <rect x="20" y="40" width="620" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="57" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">left_operand</text>
  <text x="155" y="57" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">operator</text>
  <text x="245" y="57" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">right_operand</text>
  <text x="335" y="57" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">v1.value</text>
  <text x="415" y="57" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">v2.value</text>
  <text x="510" y="57" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">比较</text>
  <text x="610" y="57" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">value</text>

  <!-- Row 1: x > y → false -->
  <rect x="20" y="66" width="620" height="26" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="83" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="155" y="83" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="245" y="83" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y</text>
  <text x="335" y="83" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">66</text>
  <text x="415" y="83" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">77</text>
  <text x="510" y="83" text-anchor="middle" font-size="10.5" fill="#b85450">66 &gt; 77 ✗</text>
  <rect x="585" y="70" width="50" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="83" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">false</text>

  <!-- Row 2: x < y → true -->
  <rect x="20" y="92" width="620" height="26" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="109" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="155" y="109" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&lt;</text>
  <text x="245" y="109" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y</text>
  <text x="335" y="109" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">66</text>
  <text x="415" y="109" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">77</text>
  <text x="510" y="109" text-anchor="middle" font-size="10.5" fill="#4a7a3a">66 &lt; 77 ✓</text>
  <rect x="585" y="96" width="50" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="109" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- Row 3: x = y → false -->
  <rect x="20" y="118" width="620" height="26" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="135" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="155" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">=</text>
  <text x="245" y="135" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y</text>
  <text x="335" y="135" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">66</text>
  <text x="415" y="135" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">77</text>
  <text x="510" y="135" text-anchor="middle" font-size="10.5" fill="#b85450">66 = 77 ✗</text>
  <rect x="585" y="122" width="50" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="135" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">false</text>

  <!-- Row 4: y > x → true -->
  <rect x="20" y="144" width="620" height="26" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="161" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y</text>
  <text x="155" y="161" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="245" y="161" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="335" y="161" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">77</text>
  <text x="415" y="161" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">66</text>
  <text x="510" y="161" text-anchor="middle" font-size="10.5" fill="#4a7a3a">77 &gt; 66 ✓</text>
  <rect x="585" y="148" width="50" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- Row 5: y < x → false -->
  <rect x="20" y="170" width="620" height="26" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="187" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y</text>
  <text x="155" y="187" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&lt;</text>
  <text x="245" y="187" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="335" y="187" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">77</text>
  <text x="415" y="187" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">66</text>
  <text x="510" y="187" text-anchor="middle" font-size="10.5" fill="#b85450">77 &lt; 66 ✗</text>
  <rect x="585" y="174" width="50" height="18" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="187" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">false</text>

  <!-- Row 6: x = x → true -->
  <rect x="20" y="196" width="620" height="26" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="155" y="213" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">=</text>
  <text x="245" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="335" y="213" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">66</text>
  <text x="415" y="213" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">66</text>
  <text x="510" y="213" text-anchor="middle" font-size="10.5" fill="#4a7a3a">66 = 66 ✓</text>
  <rect x="585" y="200" width="50" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="610" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- Arrow: JOIN step -->
  <path d="M 330 230 L 330 250" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <polygon points="325,248 335,248 330,256" fill="#446688" filter="url(#rough2)"/>
  <text x="370" y="246" font-size="10" fill="#446688">↑ JOIN Variables 两次</text>

  <!-- Note box 1: JOIN -->
  <rect x="40" y="260" width="580" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="278" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 ①：双 JOIN 解析变量名 → 值</text>
  <text x="330" y="296" text-anchor="middle" font-size="10.5" fill="#555">e.left_operand = v1.name → v1.value；e.right_operand = v2.name → v2.value</text>

  <!-- Note box 2: CASE -->
  <rect x="40" y="312" width="580" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="330" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 ②：CASE WHEN 按 operator 分发比较</text>
  <text x="330" y="348" text-anchor="middle" font-size="10.5" fill="#555">op='&gt;' → v1&gt;v2？  op='&lt;' → v1&lt;v2？  op='=' → v1=v2？  成立则 'true'，否则 'false'</text>

  <!-- Note box 3: result -->
  <rect x="40" y="364" width="580" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="382" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 ③：输出 left_operand, operator, right_operand, value</text>
  <text x="330" y="400" text-anchor="middle" font-size="10.5" fill="#555">6 行表达式 → 6 行结果，每行一个 'true' / 'false' 布尔标签</text>

  <!-- Footer -->
  <text x="330" y="426" text-anchor="middle" font-size="10" fill="#888">关键：同一张 Variables 表 JOIN 两次（别名 v1/v2），分别解析左操作数和右操作数</text>
</svg>
