<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：DFS 逐位决策，字母位二分支，数字位单分支</text>

  <rect x="210" y="38" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">dfs(i, path)</text>

  <path d="M 280 72 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <polygon points="280,94 340,124 280,154 220,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i == n ?</text>

  <path d="M 340 124 L 388 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="358" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="390" y="107" width="155" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="467" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">收集 path 到 ans, return</text>

  <path d="M 280 154 L 280 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="168" font-size="10" fill="#b85450" font-weight="bold">No</text>

  <polygon points="280,174 350,204 280,234 210,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s[i] 是字母?</text>

  <path d="M 350 204 L 388 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="360" y="198" font-size="10" fill="#b85450" font-weight="bold">No</text>
  <rect x="390" y="182" width="160" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">追加 s[i]（数字原样）</text>
  <text x="470" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a">dfs(i+1) → 撤销</text>

  <path d="M 280 234 L 280 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="250" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>

  <path d="M 150 258 L 410 258" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 258 L 150 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 410 258 L 410 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="50" y="272" width="200" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 追加小写 s[i]</text>
  <text x="150" y="310" text-anchor="middle" font-size="11" fill="#446688">dfs(i+1) → 撤销</text>
  <text x="150" y="324" text-anchor="middle" font-size="9" fill="#888">（原形式，或 tolower）</text>

  <rect x="310" y="272" width="200" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② 追加大写 s[i]</text>
  <text x="410" y="310" text-anchor="middle" font-size="11" fill="#446688">dfs(i+1) → 撤销</text>
  <text x="410" y="324" text-anchor="middle" font-size="9" fill="#888">（翻转：c ^ 32，或 toupper）</text>

  <rect x="50" y="346" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">技巧：c ^ 32 翻转大小写（'a'(97) ^ 32 = 'A'(65)，因 'a'-'A' = 32）</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#666">字母位走两分支并撤销；数字位只走一条，无需翻转</text>
</svg>
