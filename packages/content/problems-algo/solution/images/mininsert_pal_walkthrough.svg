<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">区间 DP 演算（s = "mbadm"，n=5）</text>

  <!-- String reference -->
  <text x="50" y="56" font-size="11" fill="#888">s:</text>
  <rect x="82" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="61" text-anchor="middle" font-size="12" fill="#333">m</text>
  <rect x="126" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="61" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="170" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="61" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="214" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="61" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="258" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="61" text-anchor="middle" font-size="12" fill="#333">m</text>
  <text x="102" y="84" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="146" y="84" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="190" y="84" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="234" y="84" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="278" y="84" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- dp table -->
  <text x="50" y="114" font-size="11" fill="#555" font-weight="bold">dp[i][j] 表（按长度递增填写）：</text>

  <!-- column headers j -->
  <text x="120" y="132" text-anchor="middle" font-size="9" fill="#888">j: 0</text>
  <text x="164" y="132" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="208" y="132" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="252" y="132" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="296" y="132" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="335" y="132" font-size="9" fill="#888">字符</text>

  <!-- row i=0 -->
  <text x="100" y="154" text-anchor="end" font-size="9" fill="#888">i=0</text>
  <rect x="104" y="140" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="156" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="148" y="140" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="156" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="192" y="140" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="156" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="236" y="140" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="252" y="156" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="280" y="140" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="296" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="335" y="156" font-size="10" fill="#888">m</text>

  <!-- row i=1 -->
  <text x="100" y="184" text-anchor="end" font-size="9" fill="#888">i=1</text>
  <rect x="104" y="170" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="186" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="148" y="170" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="186" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="192" y="170" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="186" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="236" y="170" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="252" y="186" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="280" y="170" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="296" y="186" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="335" y="186" font-size="10" fill="#888">b</text>

  <!-- row i=2 -->
  <text x="100" y="214" text-anchor="end" font-size="9" fill="#888">i=2</text>
  <rect x="104" y="200" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="216" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="148" y="200" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="164" y="216" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="192" y="200" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="216" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="236" y="200" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="252" y="216" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="280" y="200" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="296" y="216" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="335" y="216" font-size="10" fill="#888">a</text>

  <!-- row i=3 -->
  <text x="100" y="244" text-anchor="end" font-size="9" fill="#888">i=3</text>
  <rect x="104" y="230" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="246" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="148" y="230" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="164" y="246" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="192" y="230" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="208" y="246" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="236" y="230" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="252" y="246" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="280" y="230" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="296" y="246" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="335" y="246" font-size="10" fill="#888">d</text>

  <!-- row i=4 -->
  <text x="100" y="274" text-anchor="end" font-size="9" fill="#888">i=4</text>
  <rect x="104" y="260" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="276" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="148" y="260" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="164" y="276" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="192" y="260" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="208" y="276" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="236" y="260" width="32" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="252" y="276" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="280" y="260" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="296" y="276" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="335" y="276" font-size="10" fill="#888">m</text>

  <!-- Legend -->
  <rect x="380" y="140" width="200" height="150" fill="#fff" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="480" y="160" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">图例</text>
  <rect x="392" y="170" width="20" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="182" font-size="9" fill="#555">对角线 len=1（单字符=0）</text>
  <rect x="392" y="192" width="20" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="204" font-size="9" fill="#555">len≥2 且 s[i]≠s[j]（+1）</text>
  <rect x="392" y="214" width="20" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="226" font-size="9" fill="#555">答案格 dp[0][4]</text>
  <rect x="392" y="236" width="20" height="14" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="248" font-size="9" fill="#555">i &gt; j（空串，不计）</text>
  <text x="480" y="274" text-anchor="middle" font-size="9" fill="#888">按长度 1→2→3→4→5 填</text>

  <!-- Key step callouts -->
  <rect x="40" y="300" width="540" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">关键填表步骤</text>
  <text x="55" y="340" font-size="10" fill="#333">• dp[0][1]: m≠b → min(dp[1][1], dp[0][0])+1 = min(0,0)+1 = <tspan font-weight="bold" fill="#b85450">1</tspan></text>
  <text x="55" y="356" font-size="10" fill="#333">• dp[0][2]: m≠a → min(dp[1][2], dp[0][1])+1 = min(1,1)+1 = <tspan font-weight="bold" fill="#b85450">2</tspan></text>
  <text x="55" y="372" font-size="10" fill="#333">• dp[0][3]: m≠d → min(dp[1][3], dp[0][2])+1 = min(2,2)+1 = <tspan font-weight="bold" fill="#b85450">3</tspan></text>
  <text x="55" y="388" font-size="10" fill="#4a7a3a">• dp[0][4]: m==m → dp[1][3] = <tspan font-weight="bold">2</tspan>  ✓ 两端配对，内部继承</text>

  <!-- Result -->
  <rect x="100" y="406" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = dp[0][4] = 2（插入 2 次得 "mbdadbm"）⭐</text>

  <!-- construction note -->
  <text x="300" y="470" text-anchor="middle" font-size="10" fill="#888">构造：m b [b] a [d] d m → "mbdadbm"（方括号字符为插入项）</text>
  <text x="300" y="486" text-anchor="middle" font-size="10" fill="#888">下标 1 后插 b，下标 2 后插 d，两端 m 天然配对</text>

  <!-- arrow from dp[1][3] to dp[0][4] -->
  <path d="M 296 182 L 296 140" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="305" y="164" font-size="9" fill="#b85450">dp[1][3]=2</text>
</svg>
