<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算："1210" 各位自洽返回 true，"030" 首位即矛盾返回 false</text>

  <!-- ===== Example 1: 1210 → true ===== -->
  <rect x="30" y="42" width="480" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="64" font-size="12.5" fill="#4a7a3a" font-weight="bold">示例 1：num="1210"（n=4，建 freq 表后逐位核对）</text>

  <!-- index labels -->
  <text x="50" y="92" font-size="10" fill="#888">下标 i</text>
  <text x="195" y="92" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="245" y="92" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="295" y="92" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="345" y="92" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- num string boxes (期望 E[i]) -->
  <text x="50" y="116" font-size="10" fill="#d6a040" font-weight="bold">期望 E[i]</text>
  <rect x="173" y="98" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="120" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <rect x="223" y="98" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="120" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">2</text>
  <rect x="273" y="98" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="295" y="120" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <rect x="323" y="98" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="345" y="120" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">0</text>

  <!-- actual freq A[i] -->
  <text x="50" y="150" font-size="10" fill="#4a7a3a" font-weight="bold">实测 A[i]</text>
  <text x="50" y="162" font-size="8.5" fill="#4a7a3a">freq[i]</text>
  <rect x="173" y="134" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="156" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
  <rect x="223" y="134" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="156" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
  <rect x="273" y="134" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="295" y="156" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
  <rect x="323" y="134" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="345" y="156" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>

  <!-- check marks -->
  <text x="195" y="186" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="245" y="186" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="295" y="186" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="345" y="186" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="415" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">→ true</text>

  <text x="270" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a">期望表与实测表逐项全等，自描述成立</text>

  <!-- ===== Example 2: 030 → false ===== -->
  <rect x="30" y="248" width="480" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="270" font-size="12.5" fill="#b85450" font-weight="bold">示例 2：num="030"（n=3，首位即矛盾）</text>

  <!-- index labels -->
  <text x="50" y="298" font-size="10" fill="#888">下标 i</text>
  <text x="220" y="298" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="270" y="298" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="320" y="298" text-anchor="middle" font-size="10" fill="#888">2</text>

  <!-- num string boxes (期望 E[i]) -->
  <text x="50" y="322" font-size="10" fill="#d6a040" font-weight="bold">期望 E[i]</text>
  <rect x="198" y="304" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="326" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">0</text>
  <rect x="248" y="304" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">3</text>
  <rect x="298" y="304" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="326" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">0</text>

  <!-- actual freq A[i] -->
  <text x="50" y="356" font-size="10" fill="#4a7a3a" font-weight="bold">实测 A[i]</text>
  <text x="50" y="368" font-size="8.5" fill="#4a7a3a">freq[i]</text>
  <rect x="198" y="340" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="362" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">2</text>
  <rect x="248" y="340" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <rect x="298" y="340" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="362" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>

  <!-- cross mark at index 0 -->
  <text x="220" y="392" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="400" y="392" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">→ false（短路）</text>

  <text x="270" y="398" font-size="9.5" fill="#b85450"></text>
  <text x="50" y="396" font-size="10" fill="#b85450">0 ≠ 2</text>

  <!-- ===== bottom note ===== -->
  <rect x="30" y="424" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="448" font-size="12" fill="#446688" font-weight="bold">关键：先建 freq[] 实测表，再逐位核对 freq[i] == num[i]−'0'</text>
  <text x="50" y="468" font-size="11" fill="#446688">· 核对遇首个矛盾即短路返回 false（示例 2）；全等才返回 true（示例 1）</text>
  <text x="50" y="480" font-size="10.5" fill="#888">· 字符须减 '0' 转数值再比；只核对下标 0~n−1，超 n 的数字不在约束内</text>
</svg>
