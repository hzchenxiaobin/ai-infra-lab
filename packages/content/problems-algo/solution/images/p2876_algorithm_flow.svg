<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 524" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="524" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：时间戳一次遍历（盖戳 → 判环 → 倒序推树枝）</text>

  <!-- A -->
  <rect x="200" y="40" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历每个未访问的起点 i</text>

  <path d="M 320 72 L 320 88" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B -->
  <rect x="140" y="92" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">沿出边走：盖时间戳 vis_time[u] = clock++</text>
  <text x="320" y="130" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">path 追加 u，u = edges[u]</text>

  <path d="M 320 140 L 320 158" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C diamond: u visited? -->
  <path d="M 320 164 L 424 198 L 320 232 L 216 198 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="203" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">u 已访问？</text>

  <!-- C "no" loop back to B -->
  <path d="M 216 198 L 100 198 L 100 116 L 134 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="188" font-size="11" fill="#446688" filter="url(#rough2)">否：继续走</text>

  <!-- C "yes" -->
  <path d="M 320 232 L 320 254" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="248" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- D diamond: in this round? -->
  <path d="M 320 260 L 470 300 L 320 340 L 170 300 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">vis_time[u] ≥</text>
  <text x="320" y="314" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">vis_time[i] ?</text>

  <!-- D yes -> R (cycle) -->
  <path d="M 470 300 C 508 330 502 352 484 374" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="336" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是：本轮撞环</text>

  <!-- D no -> L (branch) -->
  <path d="M 170 300 C 132 330 138 352 156 374" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="336" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">否：历史答案</text>

  <!-- R box: cycle case -->
  <rect x="352" y="378" width="256" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="398" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">环入口 = u，环长 = clock − vis_time[u]</text>
  <text x="480" y="416" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">start = vis_time[u] − vis_time[i]</text>
  <text x="480" y="434" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">path[start:] 都是环 → ans = 环长</text>

  <!-- L box: branch case -->
  <rect x="32" y="378" width="256" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="398" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">u 是历史轮次的点</text>
  <text x="160" y="416" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">ans[u] 已算好</text>
  <text x="160" y="434" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">整条 path 是树枝 → start = len(path)</text>

  <!-- merge to G -->
  <path d="M 160 442 C 190 468 230 470 256 470" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 442 C 450 468 410 470 384 470" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- G box -->
  <rect x="150" y="472" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="490" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">树枝倒序递推：j = start−1 … 0</text>
  <text x="320" y="506" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">ans[path[j]] = ans[edges[path[j]]] + 1</text>
</svg>
