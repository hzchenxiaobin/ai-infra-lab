<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：距离 = 2 × (max − min)，最优三元组 = 相邻三个出现</text>
  <text x="260" y="42" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1,2,1,1,3]（示例 1，答案 6）</text>

  <!-- 数组格子 -->
  <rect x="70" y="52" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="96" y="77" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="122" y="52" width="52" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="77" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">2</text>
  <rect x="174" y="52" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="77" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="226" y="52" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="77" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="278" y="52" width="52" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="77" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">3</text>

  <!-- 下标标注 -->
  <text x="96" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="148" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="200" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="252" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="304" y="102" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="342" y="102" font-size="10" fill="#999" filter="url(#rough2)">← 下标 i</text>

  <!-- 公式化简框 -->
  <rect x="30" y="112" width="460" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">排序 p ≤ q ≤ r：|i−j| + |j−k| + |k−i| = (q−p) + (r−q) + (r−p) = 2(r−p)</text>
  <text x="260" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">距离只由最左 p、最右 r 决定 —— 中间 q 只要存在即可</text>

  <!-- 分组行 -->
  <text x="36" y="188" font-size="12" fill="#666" filter="url(#rough2)">按值分组：值 1 → 下标列表 L = [0, 2, 3]（扫描天然升序）</text>

  <rect x="60" y="198" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <rect x="106" y="198" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="152" y="198" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>

  <text x="57" y="248" font-size="11" fill="#666" filter="url(#rough2)">p</text>
  <text x="170" y="248" font-size="11" fill="#666" filter="url(#rough2)">r</text>
  <path d="M 81 242 L 173 242" fill="none" stroke="#b85450" stroke-width="1.5" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="127" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">r − p = 3</text>

  <!-- 结果框 -->
  <rect x="230" y="194" width="264" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="362" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">相邻三元组 (0, 2, 3) ✓</text>
  <text x="362" y="238" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">距离 = 2 × (3 − 0) = 6</text>

  <!-- 为什么相邻框 -->
  <rect x="15" y="268" width="490" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">固定开头 p：凑齐三元组至少要再往后取两位 ⇒ 任何 r ≥ L[a+2]</text>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">相邻三个 (L[a], L[a+1], L[a+2]) 本身合法且窗口最窄 ⇒ 每个开头只看相邻三元组</text>

  <text x="16" y="336" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 出现 &lt; 3 次的值直接出局（本例值 2、值 3 只出现 1 次）</text>
  <text x="16" y="352" font-size="10" fill="#999" filter="url(#rough2)">💡 相邻窗口要全部扫过：L = [0,10,11,12] 的最优在尾部 (10,11,12)，开头三个只有 22</text>
</svg>
