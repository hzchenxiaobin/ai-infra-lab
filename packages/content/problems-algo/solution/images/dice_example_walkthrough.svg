<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=2, k=6, target=7</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[2][7] = dp[1][1] + dp[1][2] + ··· + dp[1][6] = 6</text>

  <!-- ===== index header row ===== -->
  <g font-size="10" fill="#888">
    <text x="70" y="80" text-anchor="middle">j</text>
    <text x="110" y="80" text-anchor="middle">0</text>
    <text x="155" y="80" text-anchor="middle">1</text>
    <text x="200" y="80" text-anchor="middle">2</text>
    <text x="245" y="80" text-anchor="middle">3</text>
    <text x="290" y="80" text-anchor="middle">4</text>
    <text x="335" y="80" text-anchor="middle">5</text>
    <text x="380" y="80" text-anchor="middle">6</text>
    <text x="425" y="80" text-anchor="middle">7</text>
  </g>

  <!-- ===== Row 0: dp[0] ===== -->
  <text x="40" y="110" font-size="10" fill="#888" font-weight="bold">dp[0]</text>
  <rect x="90" y="90" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="113" text-anchor="middle" font-size="13" fill="#a07820" font-weight="bold">1</text>
  <!-- zeros -->
  <g font-size="11" fill="#ccc">
    <rect x="135" y="90" width="40" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="155" y="113" text-anchor="middle">0</text>
    <rect x="180" y="90" width="40" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="200" y="113" text-anchor="middle">0</text>
    <rect x="225" y="90" width="40" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="245" y="113" text-anchor="middle">0</text>
    <rect x="270" y="90" width="40" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="290" y="113" text-anchor="middle">0</text>
    <rect x="315" y="90" width="40" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="335" y="113" text-anchor="middle">0</text>
    <rect x="360" y="90" width="40" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="380" y="113" text-anchor="middle">0</text>
    <rect x="405" y="90" width="40" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="425" y="113" text-anchor="middle">0</text>
  </g>

  <!-- ===== Row 1: dp[1] ===== -->
  <text x="40" y="160" font-size="10" fill="#888" font-weight="bold">dp[1]</text>
  <rect x="90" y="140" width="40" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="163" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <!-- ones (highlighted, these contribute to dp[2][7]) -->
  <rect x="135" y="140" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="163" text-anchor="middle" font-size="13" fill="#2a3f55" font-weight="bold">1</text>
  <rect x="180" y="140" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="163" text-anchor="middle" font-size="13" fill="#2a3f55" font-weight="bold">1</text>
  <rect x="225" y="140" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="163" text-anchor="middle" font-size="13" fill="#2a3f55" font-weight="bold">1</text>
  <rect x="270" y="140" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="163" text-anchor="middle" font-size="13" fill="#2a3f55" font-weight="bold">1</text>
  <rect x="315" y="140" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="163" text-anchor="middle" font-size="13" fill="#2a3f55" font-weight="bold">1</text>
  <rect x="360" y="140" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="163" text-anchor="middle" font-size="13" fill="#2a3f55" font-weight="bold">1</text>
  <rect x="405" y="140" width="40" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="425" y="163" text-anchor="middle" font-size="11" fill="#ccc">0</text>

  <!-- ===== arrows from dp[1][1..6] to dp[2][7] ===== -->
  <path d="M 155 178 Q 200 220 420 252" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 178 Q 230 215 420 250" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 245 178 Q 270 210 420 248" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 178 Q 310 205 420 246" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 335 178 Q 355 200 420 244" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 178 Q 395 195 420 242" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: dp[2] ===== -->
  <text x="40" y="250" font-size="10" fill="#888" font-weight="bold">dp[2]</text>
  <!-- only show dp[2][7] as the answer cell, others as dots -->
  <text x="180" y="248" font-size="12" fill="#aaa" font-weight="bold">···</text>
  <rect x="405" y="238" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="261" text-anchor="middle" font-size="14" fill="#2d4d22" font-weight="bold">6</text>

  <!-- ===== computation bar ===== -->
  <rect x="60" y="292" width="440" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333">
    <tspan fill="#446688" font-weight="bold">1+1+1+1+1+1</tspan>
    <tspan fill="#888"> = </tspan>
    <tspan fill="#4a7a3a" font-weight="bold">6</tspan>
    <tspan fill="#888">  ← 6 种方案：(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)</tspan>
  </text>

  <!-- ===== bottom note ===== -->
  <rect x="60" y="334" width="440" height="36" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#555">每枚骰子有编号 → (1,6) 与 (6,1) 是不同方案 → 顺序有关</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#888">前缀和优化：dp[2][7] = 滑动窗口 Σ dp[1][1..6]，内层 k 循环变 O(1)</text>
</svg>
