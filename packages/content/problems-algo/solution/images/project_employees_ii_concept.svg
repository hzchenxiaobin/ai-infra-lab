<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：按 project_id 分组计数，取员工数最多的项目</text>

  <!-- Step 1: 原始表 Project -->
  <text x="30" y="56" font-size="11.5" fill="#888">① 原始表 Project（每行 = 一个员工参与一个项目）</text>
  <rect x="120" y="64" width="360" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">project_id</text>
  <text x="390" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">employee_id</text>
  <text x="210" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="390" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="210" y="120" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="390" y="120" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="210" y="136" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="390" y="136" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="210" y="152" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="390" y="152" text-anchor="middle" font-size="11" fill="#333">1 / 4 …</text>

  <path d="M 300 162 L 300 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY + COUNT -->
  <text x="30" y="196" font-size="11.5" fill="#888">② GROUP BY project_id，COUNT(employee_id) 得每组员工数</text>
  <rect x="60" y="204" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">project 1 → COUNT = 3   |   project 2 → COUNT = 2</text>
  <text x="300" y="246" text-anchor="middle" font-size="10.5" fill="#555">PK = (employee_id, project_id) 保证无重复行，COUNT 即员工数</text>

  <path d="M 300 262 L 300 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: MAX -->
  <text x="30" y="296" font-size="11.5" fill="#888">③ 取所有组计数里的最大值 MAX = 3</text>
  <rect x="120" y="304" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="328" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">max_cnt = 3  →  员工数等于 3 的项目入选</text>

  <path d="M 300 346 L 300 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="361" font-size="10" fill="#888">输出</text>

  <!-- Result -->
  <rect x="180" y="370" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="394" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">SELECT project_id → {1}</text>

  <!-- Key insight box -->
  <rect x="30" y="420" width="540" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="440" font-size="11" fill="#555" font-weight="bold">💡 Employee 表是「障眼法」</text>
  <text x="50" y="456" font-size="10.5" fill="#888">员工数 = Project 表中该 project 的行数，无需 JOIN Employee。MAX 用子查询或 ALL 表达。</text>
</svg>
