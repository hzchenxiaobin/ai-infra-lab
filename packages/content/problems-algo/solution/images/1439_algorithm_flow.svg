<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分答案 + DFS 计数（行内剪枝 + 计数终止）</text>

  <!-- Step 1: init -->
  <rect x="140" y="46" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">① 初始化答案区间</text>
  <text x="280" y="86" text-anchor="middle" font-size="10.5" fill="#555">lo = Σ mat[i][0], hi = Σ mat[i][n−1]</text>

  <!-- arrow -->
  <path d="M 280 96 L 280 110" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: mid -->
  <rect x="160" y="114" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">② mid = lo + (hi − lo) / 2</text>
  <text x="280" y="147" text-anchor="middle" font-size="10" fill="#888">lo ≤ hi 时循环</text>

  <!-- arrow -->
  <path d="M 280 154 L 280 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: DFS count -->
  <rect x="110" y="172" width="340" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">③ DFS 计数 count(mid)</text>
  <text x="280" y="212" text-anchor="middle" font-size="10.5" fill="#555">逐行选元素，cur + mat[r][j] &gt; mid 则 break（行有序）</text>
  <text x="280" y="228" text-anchor="middle" font-size="10.5" fill="#555">cnt ≥ k 则提前终止（只需知是否 ≥ k）</text>

  <!-- arrow to diamond -->
  <path d="M 280 234 L 280 250" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,254 380,302 280,350 180,302" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">count</text>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">≥ k ?</text>

  <!-- Yes branch (left): feasible -->
  <path d="M 180 302 L 120 302" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="152" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="14" y="280" width="106" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="67" y="298" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">容量够</text>
  <text x="67" y="314" text-anchor="middle" font-size="10.5" fill="#555">ans=mid, hi=mid−1</text>

  <!-- No branch (right): not enough -->
  <path d="M 380 302 L 440 302" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 ✗</text>
  <rect x="430" y="280" width="118" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="489" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不够 k 个</text>
  <text x="489" y="314" text-anchor="middle" font-size="10.5" fill="#555">lo = mid + 1</text>

  <!-- loop back arrows -->
  <path d="M 67 280 L 67 134 L 160 134" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 489 280 L 489 134 L 400 134" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="280" y="272" text-anchor="middle" font-size="9.5" fill="#aaa">lo ≤ hi 时循环 ↑</text>

  <!-- arrow down to result -->
  <path d="M 280 350 L 280 374" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="366" font-size="10" fill="#aaa">lo &gt; hi 结束</text>

  <!-- Step 4: return -->
  <rect x="150" y="378" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">④ 返回 ans</text>
  <text x="280" y="414" text-anchor="middle" font-size="10.5" fill="#555">最小使 count ≥ k 的 target = 第 k 小数组和</text>

  <!-- pruning note -->
  <rect x="80" y="436" width="400" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="10.5" fill="#a87020">两重剪枝：行内 break（行有序）+ 计数达 k 即停 → O(m·k) per check</text>
</svg>
