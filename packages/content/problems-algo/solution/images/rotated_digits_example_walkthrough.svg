<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 10 → 旋转后逐数判定</text>

  <!-- Table header -->
  <rect x="40" y="48" width="60" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="67" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">x</text>
  <rect x="100" y="48" width="120" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="67" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">各位数字分类</text>
  <rect x="220" y="48" width="120" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">旋转结果</text>
  <rect x="340" y="48" width="100" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="67" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">判定</text>

  <!-- Row 1: x=1 -->
  <rect x="40" y="80" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="98" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="100" y="80" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="98" text-anchor="middle" font-size="11" fill="#446688">1 → 不变</text>
  <rect x="220" y="80" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="340" y="80" width="100" height="26" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">同原 ✗</text>

  <!-- Row 2: x=2 GOOD -->
  <rect x="40" y="108" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="108" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a">2 → 改变</text>
  <rect x="220" y="108" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="340" y="108" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="390" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">好数 ✓</text>

  <!-- Row 3: x=3 invalid -->
  <rect x="40" y="136" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="154" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="100" y="136" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="154" text-anchor="middle" font-size="11" fill="#b85450">3 → 非法</text>
  <rect x="220" y="136" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="340" y="136" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="154" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">非法 ✗</text>

  <!-- Row 4: x=4 invalid -->
  <rect x="40" y="164" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="182" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="100" y="164" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="182" text-anchor="middle" font-size="11" fill="#b85450">4 → 非法</text>
  <rect x="220" y="164" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="340" y="164" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">非法 ✗</text>

  <!-- Row 5: x=5 GOOD -->
  <rect x="40" y="192" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="100" y="192" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a">5 → 改变</text>
  <rect x="220" y="192" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="340" y="192" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="390" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">好数 ✓</text>

  <!-- Row 6: x=6 GOOD -->
  <rect x="40" y="220" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="100" y="220" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a">6 → 改变</text>
  <rect x="220" y="220" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="340" y="220" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="390" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">好数 ✓</text>

  <!-- Row 7: x=7 invalid -->
  <rect x="40" y="248" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="266" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="100" y="248" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="266" text-anchor="middle" font-size="11" fill="#b85450">7 → 非法</text>
  <rect x="220" y="248" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="340" y="248" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">非法 ✗</text>

  <!-- Row 8: x=8 same -->
  <rect x="40" y="276" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="294" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="100" y="276" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="294" text-anchor="middle" font-size="11" fill="#446688">8 → 不变</text>
  <rect x="220" y="276" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="340" y="276" width="100" height="26" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">同原 ✗</text>

  <!-- Row 9: x=9 GOOD -->
  <rect x="40" y="304" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="100" y="304" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a">9 → 改变</text>
  <rect x="220" y="304" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="340" y="304" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="390" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">好数 ✓</text>

  <!-- Row 10: x=10 same -->
  <rect x="40" y="332" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="350" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="100" y="332" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="350" text-anchor="middle" font-size="11" fill="#446688">1→不变, 0→不变</text>
  <rect x="220" y="332" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333">10</text>
  <rect x="340" y="332" width="100" height="26" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">同原 ✗</text>

  <!-- Summary box -->
  <rect x="40" y="378" width="400" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="400" font-size="12" fill="#446688" font-weight="bold">判定规则</text>
  <text x="60" y="418" font-size="11" fill="#444">① 任一位 ∈ {3,4,7} → 整数非法，旋转无意义</text>
  <text x="60" y="434" font-size="11" fill="#444">② 全部位 ∈ {0,1,8} → 旋转后与原数相同，不算好数</text>

  <!-- verdict -->
  <rect x="450" y="378" width="90" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="495" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">好数</text>
  <text x="495" y="424" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="495" y="438" text-anchor="middle" font-size="9" fill="#888">{2,5,6,9}</text>
</svg>
