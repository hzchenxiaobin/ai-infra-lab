<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">操作是强制的：合并「和最小」的相邻对</text>

  <!-- ① 初始 [5,2,3,1] -->
  <text x="130" y="80" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">step 0</text>
  <rect x="187" y="36" width="22" height="16" rx="7" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="198" y="48.5" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">7</text>
  <rect x="249" y="36" width="22" height="16" rx="7" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="48.5" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">5</text>
  <rect x="311" y="36" width="22" height="16" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="322" y="48.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <rect x="141" y="58" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="87" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">5</text>
  <rect x="203" y="58" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="87" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2</text>
  <rect x="265" y="58" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="291" y="87" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="327" y="58" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="353" y="87" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="260" y="120" text-anchor="middle" font-size="11" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">5 &gt; 2</tspan><tspan fill="#888"> → 仍无序，必须继续操作</tspan></text>

  <path d="M 260 130 L 260 156" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="148" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">① 合并 (3,1)：和 4 全场最小</text>

  <!-- ② [5,2,4] -->
  <text x="130" y="202" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">step 1</text>
  <rect x="218" y="160" width="22" height="16" rx="7" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="229" y="172.5" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">7</text>
  <rect x="280" y="160" width="22" height="16" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="291" y="172.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>

  <rect x="172" y="178" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="207" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">5</text>
  <rect x="234" y="178" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="207" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="296" y="178" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="322" y="207" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <text x="260" y="240" text-anchor="middle" font-size="11" filter="url(#rough2)"><tspan fill="#b85450" font-weight="bold">5 &gt; 2</tspan><tspan fill="#888"> → 仍无序，必须继续操作</tspan></text>

  <path d="M 260 250 L 260 276" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="268" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">② 合并 (2,4)：和 6 最小</text>

  <!-- ③ [5,6] 有序 -->
  <text x="130" y="308" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">step 2</text>
  <rect x="203" y="284" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="229" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>
  <rect x="265" y="284" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="291" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">6</text>

  <text x="260" y="346" text-anchor="middle" font-size="11" filter="url(#rough2)"><tspan fill="#4a7a3a" font-weight="bold">5 ≤ 6 → 非递减 ✓</tspan><tspan fill="#888">，停止，答案 = 2</tspan></text>

  <!-- 结论框 -->
  <rect x="88" y="356" width="344" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">每合并一次长度减 1，至多 n−1 次后必有序</text>
  <text x="260" y="388" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">平局（和相同）时取最左边的一对</text>
</svg>
