<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="540" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 按层扩展</text>

  <!-- 1 开始 -->
  <g filter="url(#rough2)">
    <rect x="180" y="46" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14"/>
    <text x="260" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
    <path d="M 260 78 L 260 92" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 2 diamond: end in bank? -->
  <g filter="url(#rough2)">
    <polygon points="260,92 360,116 260,140 160,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="120" text-anchor="middle" font-size="12" fill="#555">end ∈ bank ?</text>
    <path d="M 360 116 L 410 116" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="382" y="110" text-anchor="middle" font-size="10" fill="#b85450">否</text>
    <rect x="410" y="103" width="92" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="456" y="120" text-anchor="middle" font-size="11" fill="#b85450">返回 -1</text>
    <path d="M 260 140 L 260 154" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="272" y="152" font-size="10" fill="#4a7a3a">是</text>
  </g>

  <!-- 3 init -->
  <g filter="url(#rough2)">
    <rect x="120" y="156" width="280" height="34" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="260" y="178" text-anchor="middle" font-size="12" fill="#555">Q=[start], visited={start}, step=0</text>
    <path d="M 260 192 L 260 206" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 4 diamond Q 非空? -->
  <g filter="url(#rough2)">
    <polygon points="260,206 360,230 260,254 160,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="234" text-anchor="middle" font-size="12" fill="#555">Q 非空 ?</text>
    <path d="M 360 230 L 410 230" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="382" y="224" text-anchor="middle" font-size="10" fill="#b85450">否</text>
    <rect x="410" y="217" width="92" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="456" y="234" text-anchor="middle" font-size="11" fill="#b85450">返回 -1</text>
    <path d="M 260 254 L 260 268" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="272" y="266" font-size="10" fill="#4a7a3a">是</text>
  </g>

  <!-- 5 遍历本层 -->
  <g filter="url(#rough2)">
    <rect x="110" y="270" width="300" height="40" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="260" y="287" text-anchor="middle" font-size="12" fill="#555">遍历本层 sz = len(Q) 个节点</text>
    <text x="260" y="303" text-anchor="middle" font-size="11" fill="#888">cur = Q.popleft()</text>
    <path d="M 260 312 L 260 326" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 6 diamond cur==end? -->
  <g filter="url(#rough2)">
    <polygon points="260,326 360,350 260,374 160,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="354" text-anchor="middle" font-size="12" fill="#555">cur == end ?</text>
    <path d="M 360 350 L 410 350" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="382" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
    <rect x="410" y="337" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="6"/>
    <text x="456" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a">返回 step</text>
    <path d="M 260 374 L 260 388" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="272" y="386" font-size="10" fill="#b85450">否</text>
  </g>

  <!-- 7 生成候选 -->
  <g filter="url(#rough2)">
    <rect x="100" y="390" width="320" height="40" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="260" y="407" text-anchor="middle" font-size="12" fill="#555">生成 24 个候选（8 位 × 3 替换字符）</text>
    <text x="260" y="423" text-anchor="middle" font-size="11" fill="#888">逐位换成 A/C/G/T 中不同于原字符者</text>
    <path d="M 260 432 L 260 446" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 8 候选入队 -->
  <g filter="url(#rough2)">
    <rect x="90" y="448" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="6"/>
    <text x="260" y="467" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">候选 ∈ bank 且未访问 → 标记并入队</text>
    <text x="260" y="484" text-anchor="middle" font-size="11" fill="#888">本层结束 → step += 1，回到「Q 非空?」</text>
  </g>

  <!-- loop back arrow -->
  <g filter="url(#rough2)">
    <path d="M 90 470 L 56 470 L 56 230 L 158 230" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <text x="44" y="350" text-anchor="middle" font-size="10" fill="#446688" transform="rotate(-90 44 350)">回到循环顶部</text>
  </g>
</svg>
