<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 655" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="655" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：周一锚点 → 两级聚合 → 双阈值过滤 → 排序输出</text>

  <rect x="100" y="38" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 扫描 meetings，每行派生周一锚点</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">DATE_SUB(meeting_date, INTERVAL WEEKDAY(meeting_date) DAY)</text>

  <path d="M 260 94 L 260 106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="110" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② GROUP BY employee_id, 周一锚点</text>
  <text x="260" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">SUM(duration_hours) AS 周时长 → CTE weekly</text>

  <path d="M 260 158 L 260 170" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="178,214 260,172 342,214 260,256" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">周时长 &gt; 20 ?</text>

  <text x="272" y="272" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 256 L 260 276" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="366" y="206" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 342 214 L 404 214" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="408" y="192" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="458" y="210" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">丢弃该周</text>
  <text x="458" y="227" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（非密集周）</text>

  <rect x="100" y="280" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ JOIN employees</text>
  <text x="260" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">补 employee_name、department</text>

  <path d="M 260 328 L 260 340" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="344" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ GROUP BY employee_id</text>
  <text x="260" y="383" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">COUNT(*) AS meeting_heavy_weeks</text>

  <path d="M 260 392 L 260 404" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="178,448 260,406 342,448 260,490" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="453" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">COUNT(*) ≥ 2 ?</text>

  <text x="272" y="506" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 490 L 260 510" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="366" y="440" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 342 448 L 404 448" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="408" y="426" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="458" y="444" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">剔除该员工</text>
  <text x="458" y="461" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（不足 2 周）</text>

  <rect x="100" y="514" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="534" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ ORDER BY meeting_heavy_weeks DESC,</text>
  <text x="260" y="553" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">employee_name ASC</text>

  <path d="M 260 562 L 260 574" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="578" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="598" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出：employee_id / employee_name /</text>
  <text x="260" y="617" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">department / meeting_heavy_weeks</text>

  <text x="260" y="646" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两次 GROUP BY、两次 HAVING：第一层管「周是否密集（&gt; 20h）」，第二层管「人是否够 2 周（≥ 2）」</text>
</svg>
