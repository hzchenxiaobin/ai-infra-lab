<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="384" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：乘积为偶 ⇔ 子数组含至少一个偶数（吸收元）</text>

  <!-- nums row -->
  <text x="40" y="98" font-size="12" fill="#888">nums:</text>

  <!-- cells: 9(odd) 6(even) 7(odd) 13(odd) -->
  <rect x="170" y="76" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="99" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>

  <rect x="224" y="76" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="99" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <rect x="278" y="76" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="303" y="99" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <rect x="332" y="76" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="99" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">13</text>

  <!-- parity labels -->
  <text x="195" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">奇</text>
  <text x="249" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">偶</text>
  <text x="303" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">奇</text>
  <text x="357" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">奇</text>

  <!-- bracket: all-odd segment [9] -->
  <path d="M 170 66 L 170 60 L 220 60 L 220 66" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="195" y="54" text-anchor="middle" font-size="10" fill="#4a7a3a">全奇段 L=1</text>

  <!-- bracket: all-odd segment [7,13] -->
  <path d="M 278 66 L 278 60 L 382 60 L 382 66" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="330" y="54" text-anchor="middle" font-size="10" fill="#4a7a3a">全奇段 L=2</text>

  <!-- note on the even element -->
  <text x="249" y="150" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">偶数：一票否决为偶积</text>

  <!-- two result boxes -->
  <rect x="36" y="178" width="210" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="141" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">全部子数组 total</text>
  <text x="141" y="220" text-anchor="middle" font-size="12" fill="#333">= n(n+1)/2</text>
  <text x="141" y="240" text-anchor="middle" font-size="12" fill="#333">= 4·5/2 = 10</text>

  <rect x="294" y="178" width="210" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="399" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">全奇子数组 allOdd</text>
  <text x="399" y="220" text-anchor="middle" font-size="12" fill="#333">= Σ L(L+1)/2</text>
  <text x="399" y="240" text-anchor="middle" font-size="12" fill="#333">= 1 + 3 = 4</text>

  <!-- minus arrow between boxes -->
  <text x="270" y="218" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">−</text>

  <!-- key idea box -->
  <rect x="36" y="288" width="468" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = total − allOdd = 10 − 4 = 6</text>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#555">正面数「偶积」难去重 → 翻转到反面数「全奇」段内组合</text>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#555">全奇段长 L 贡献 C(L+1,2) = L(L+1)/2 个全奇子数组</text>

  <!-- legend -->
  <rect x="40" y="366" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="377" font-size="10" fill="#555">奇数</text>
  <rect x="100" y="366" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="377" font-size="10" fill="#555">偶数（吸收元）</text>
</svg>
