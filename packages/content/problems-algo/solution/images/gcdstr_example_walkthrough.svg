<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：成功与失败两种情形</text>

  <!-- Example 1: success -->
  <rect x="20" y="44" width="520" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="36" y="66" font-size="12" fill="#4a7a3a" font-weight="bold">示例① str1="ABCABC", str2="ABC" → "ABC"</text>

  <text x="36" y="96" font-size="11" fill="#888">str1+str2</text>
  <rect x="204" y="84" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <rect x="256" y="84" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <rect x="308" y="84" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>

  <text x="36" y="132" font-size="11" fill="#888">str2+str1</text>
  <rect x="204" y="120" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <rect x="256" y="120" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <rect x="308" y="120" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>

  <text x="380" y="124" font-size="18" fill="#4a7a3a" font-weight="bold">== ✓</text>
  <text x="380" y="146" font-size="11" fill="#4a7a3a">拼接相等</text>

  <line x1="280" y1="150" x2="280" y2="164" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="178" font-size="11" fill="#555">gcd(6, 3) = 3  →  str1[0:3] =</text>
  <rect x="320" y="166" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>

  <!-- Example 2: fail -->
  <rect x="20" y="206" width="520" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="36" y="228" font-size="12" fill="#b85450" font-weight="bold">示例② str1="AAAAAB", str2="AAA" → ""</text>

  <text x="36" y="258" font-size="11" fill="#888">str1+str2</text>
  <!-- 9 cells: A A A A A B A A A -->
  <rect x="110" y="246" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="148" y="246" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="186" y="246" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="224" y="246" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="262" y="246" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="300" y="246" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">B</text>
  <rect x="338" y="246" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="376" y="246" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="414" y="246" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>

  <text x="36" y="294" font-size="11" fill="#888">str2+str1</text>
  <rect x="110" y="282" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="148" y="282" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="186" y="282" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="224" y="282" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="262" y="282" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="300" y="282" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A</text>
  <rect x="338" y="282" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="376" y="282" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A</text>
  <rect x="414" y="282" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">B</text>

  <text x="460" y="278" font-size="18" fill="#b85450" font-weight="bold">!= ✗</text>
  <text x="460" y="298" font-size="10" fill="#b85450">第 6 位</text>
  <text x="460" y="312" font-size="10" fill="#b85450">B ≠ A</text>

  <text x="120" y="340" font-size="11" fill="#555">拼接不等 →</text>
  <text x="210" y="340" font-size="11" fill="#b85450" font-weight="bold">直接返回 ""</text>
  <text x="300" y="340" font-size="11" fill="#888">（无需再算 gcd）</text>
</svg>
