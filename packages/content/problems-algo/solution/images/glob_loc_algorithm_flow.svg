<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从右向左扫描，维护后缀最小值 mn = min(nums[i+2..])</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">循环不变量：处理位置 i 时，mn 恰为 nums[i+2..n−1] 的最小值</text>

  <!-- Start -->
  <rect x="225" y="64" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 280 98 L 280 118" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="170" y="120" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11.5" fill="#333">初始化：mn = nums[n−1]</text>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#666">i = n − 3</text>

  <path d="M 280 164 L 280 186" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <polygon points="280,188 372,232 280,276 188,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">i ≥ 0 ?</text>
  <text x="280" y="244" text-anchor="middle" font-size="10" fill="#888">(还有位置要查)</text>

  <!-- No branch -> return True -->
  <path d="M 372 232 L 430 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="432" y="214" width="108" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="486" y="238" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">return True</text>

  <!-- Yes branch down -->
  <path d="M 280 276 L 280 296" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="292" y="290" font-size="10.5" fill="#446688" font-weight="bold">是</text>

  <!-- Check diamond -->
  <polygon points="280,298 392,342 280,386 168,342" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">nums[i] &gt; mn ?</text>
  <text x="280" y="354" text-anchor="middle" font-size="9.5" fill="#888">(发现远距离倒置)</text>

  <!-- Yes -> return False -->
  <path d="M 392 342 L 442 342" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="336" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="444" y="324" width="104" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="496" y="348" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">return False</text>

  <!-- No -> update and loop back -->
  <path d="M 168 342 L 100 342" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="134" y="336" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Update box on left -->
  <rect x="40" y="324" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="69" y="342" text-anchor="middle" font-size="9.5" fill="#333">mn=min(</text>
  <text x="69" y="354" text-anchor="middle" font-size="9.5" fill="#333">mn,nums[i+1])</text>

  <!-- i = i - 1 -->
  <path d="M 69 324 L 69 232" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="36" y="216" width="66" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="69" y="236" text-anchor="middle" font-size="11" fill="#333">i = i − 1</text>

  <!-- loop back arrow up to diamond -->
  <path d="M 102 232 L 186 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- invariant note -->
  <rect x="350" y="120" width="190" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="445" y="140" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">循环不变量</text>
  <text x="445" y="156" text-anchor="middle" font-size="10" fill="#666">进入位置 i 时</text>
  <text x="445" y="170" text-anchor="middle" font-size="10" fill="#666">mn = min(nums[i+2 .. n−1])</text>
</svg>
