<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：负二进制竖式加法（直接模拟）</text>

  <!-- ===== Step 1: init ===== -->
  <rect x="170" y="50" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="11" fill="#333">逆序 arr1, arr2；carry = 0；res = []</text>

  <path d="M 280 80 L 280 92" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: loop diamond ===== -->
  <polygon points="280,96 400,140 280,184 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i &lt; n 或 j &lt; m</text>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">或 carry ≠ 0 ?</text>
  <text x="280" y="168" text-anchor="middle" font-size="10" fill="#888">while 循环</text>

  <!-- yes branch (right) -->
  <text x="410" y="136" font-size="10" fill="#4a7a3a">是</text>
  <path d="M 400 140 L 420 140" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step: x = a[i] or 0 -->
  <rect x="420" y="126" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="480" y="145" text-anchor="middle" font-size="10.5" fill="#333">x = a[i]（越界取 0）</text>

  <path d="M 480 156 L 480 168" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step: y = b[j] or 0 -->
  <rect x="420" y="170" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="480" y="189" text-anchor="middle" font-size="10.5" fill="#333">y = b[j]（越界取 0）</text>

  <path d="M 480 200 L 480 212" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step: sum = x + y + carry -->
  <rect x="410" y="214" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="480" y="233" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sum = x + y + carry</text>

  <path d="M 480 244 L 480 256" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step: bit = sum & 1 -->
  <rect x="420" y="258" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="480" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">bit = sum &amp; 1</text>

  <path d="M 480 288 L 480 300" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step: carry = -(sum >> 1) -->
  <rect x="410" y="302" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="480" y="321" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">carry = −(sum &gt;&gt; 1)</text>

  <path d="M 480 332 L 480 344" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step: res.append(bit) -->
  <rect x="420" y="346" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="480" y="365" text-anchor="middle" font-size="10.5" fill="#4a7a3a">res.append(bit)</text>

  <!-- loop back arrow -->
  <path d="M 420 360 Q 380 360 380 220 Q 380 140 400 140" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch (down) -->
  <text x="290" y="204" font-size="10" fill="#b85450">否</text>
  <path d="M 280 184 L 280 390" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- ===== Step 3: strip leading zeros ===== -->
  <rect x="150" y="392" width="260" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="11" fill="#d6a040">去前导零：res 末尾（=高位）连续 0 删除</text>

  <path d="M 280 422 L 280 432" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: return ===== -->
  <rect x="170" y="434" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="453" text-anchor="middle" font-size="11" fill="#333">空 → [0]；否则 reverse(res) 返回</text>

  <!-- ===== left side notes ===== -->
  <rect x="40" y="96" width="100" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="90" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">关键公式</text>
  <text x="90" y="132" text-anchor="middle" font-size="10" fill="#555">bit = sum &amp; 1</text>
  <text x="90" y="146" text-anchor="middle" font-size="10" fill="#b85450">carry = −(s&gt;&gt;1)</text>

  <rect x="40" y="220" width="100" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="90" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">carry 有界</text>
  <text x="90" y="256" text-anchor="middle" font-size="10" fill="#555">a, b ∈ {0,1}</text>
  <text x="90" y="270" text-anchor="middle" font-size="10" fill="#555">carry ∈ {−1,0,1}</text>
  <text x="90" y="284" text-anchor="middle" font-size="10" fill="#555">sum ∈ {−1..3}</text>
</svg>
