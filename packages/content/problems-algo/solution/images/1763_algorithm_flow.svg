<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：分治 —— 找坏字符、切分、递归取最长</text>

  <!-- Start -->
  <rect x="180" y="44" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">输入字符串 s</text>
  <text x="260" y="76" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">longestNiceSubstring(s)</text>

  <path d="M 260 80 L 260 98" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: len(s) < 2 ? -->
  <polygon points="260,100 340,140 260,180 180,140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">len(s) &lt; 2 ?</text>
  <text x="260" y="152" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">单字符无法成对</text>

  <!-- Yes branch: return "" -->
  <path d="M 340 140 L 400 140" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="120" width="96" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="448" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">return</text>
  <text x="448" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">""</text>

  <!-- No branch: down -->
  <path d="M 260 180 L 260 198" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="194" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Process: build set -->
  <rect x="160" y="200" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">构建字符集合 set(s)</text>

  <path d="M 260 236 L 260 254" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: exists bad char? -->
  <polygon points="260,256 380,296 260,336 140,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">存在坏字符 c ?</text>
  <text x="260" y="306" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">swapcase(c) ∉ set(s)</text>

  <!-- No branch: return s (nice) -->
  <path d="M 380 296 L 400 296" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="400" y="276" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="448" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return s</text>
  <text x="448" y="308" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（整个串美好）</text>

  <!-- Yes branch: down -->
  <path d="M 260 336 L 260 354" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="350" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Process: split by c -->
  <rect x="140" y="356" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="379" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">按 c 切分 s → segments[]</text>

  <path d="M 260 392 L 260 410" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: recurse on each segment -->
  <rect x="100" y="412" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="430" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">对每段递归 longestNiceSubstring(part)</text>
  <text x="260" y="446" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">取最长者，同长取最早（strict &gt;）</text>

  <path d="M 260 452 L 260 470" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return best -->
  <rect x="160" y="472" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="488" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return best</text>
</svg>
