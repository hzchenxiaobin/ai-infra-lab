<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">完美矩形 = 面积不变量 ∧ 顶点不变量</text>

  <!-- Left: 2x2 grid illustrating corner frequencies -->
  <text x="150" y="56" text-anchor="middle" font-size="11" fill="#888">4 个小矩形无缝拼成大矩形</text>

  <!-- 4 sub-rectangles -->
  <rect x="80"  y="210" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="210" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="80"  y="140" width="70" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="140" width="70" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Bounding box (bold dashed) -->
  <rect x="80" y="140" width="140" height="140" fill="none" stroke="#333" stroke-width="2.2" stroke-dasharray="6,3" rx="2" filter="url(#rough2)"/>

  <!-- Outer corners (red, count 1) -->
  <circle cx="80"  cy="280" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="220" cy="280" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="80"  cy="140" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="220" cy="140" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="58"  y="294" font-size="9" fill="#b85450" font-weight="bold">×1</text>
  <text x="226" y="294" font-size="9" fill="#b85450" font-weight="bold">×1</text>
  <text x="58"  y="136" font-size="9" fill="#b85450" font-weight="bold">×1</text>
  <text x="226" y="136" font-size="9" fill="#b85450" font-weight="bold">×1</text>

  <!-- Edge midpoints (blue, count 2) -->
  <circle cx="150" cy="280" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="150" cy="140" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="80"  cy="210" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="220" cy="210" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="156" y="296" font-size="9" fill="#446688" font-weight="bold">×2</text>
  <text x="156" y="136" font-size="9" fill="#446688" font-weight="bold">×2</text>
  <text x="58"  y="214" font-size="9" fill="#446688" font-weight="bold">×2</text>
  <text x="226" y="214" font-size="9" fill="#446688" font-weight="bold">×2</text>

  <!-- Center (green, count 4) -->
  <circle cx="150" cy="210" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="156" y="226" font-size="9" fill="#4a7a3a" font-weight="bold">×4</text>

  <!-- Right: legend + invariants -->
  <text x="330" y="74" font-size="11" fill="#444" font-weight="bold">顶点出现次数 → XOR</text>

  <rect x="320" y="86" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <circle cx="336" cy="99" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="348" y="103" font-size="10" fill="#333">外框 4 角：×1 → 保留</text>

  <rect x="320" y="118" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <circle cx="336" cy="131" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="348" y="135" font-size="10" fill="#333">边中点：×2 → 抵消</text>

  <rect x="320" y="150" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <circle cx="336" cy="163" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="348" y="167" font-size="10" fill="#333">内部交点：×4 → 抵消</text>

  <!-- Invariant 1: area -->
  <rect x="320" y="196" width="220" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="334" y="216" font-size="11" fill="#d6a040" font-weight="bold">① 面积不变量</text>
  <text x="334" y="234" font-size="10" fill="#333">Σ area(小矩形) = area(外框)</text>

  <!-- Invariant 2: corners -->
  <rect x="320" y="256" width="220" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="334" y="276" font-size="11" fill="#b85450" font-weight="bold">② 顶点不变量</text>
  <text x="334" y="294" font-size="10" fill="#333">XOR(所有顶点) =</text>
  <text x="334" y="310" font-size="10" fill="#333">{ 外框 4 角 }</text>

  <!-- Footer note -->
  <rect x="40" y="332" width="500" height="52" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">两条件联立 ⟺ 无重叠 ∧ 无空隙</text>
  <text x="280" y="370" text-anchor="middle" font-size="9" fill="#888">面积查「净覆盖量」，顶点查「边界拼接」——互补缺一不可</text>
</svg>
