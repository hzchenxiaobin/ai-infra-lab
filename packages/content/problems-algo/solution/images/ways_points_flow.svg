<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：多重背包求方案数（倒序 j + k 重循环）</text>

  <!-- Step 1 -->
  <rect x="120" y="48" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12.5" fill="#224466" font-weight="bold" font-family="monospace">① 初始化 dp[0]=1，dp[1..target]=0</text>
  <text x="280" y="89" text-anchor="middle" font-size="10.5" fill="#5588aa">恰好装满：空集得 0 分是唯一起点</text>

  <line x1="280" y1="98" x2="280" y2="120" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="80" y="122" width="400" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">② 遍历每种题型 (count, marks)</text>
  <text x="280" y="163" text-anchor="middle" font-size="12" fill="#3a5a2a" font-family="monospace">count 道、每道 marks 分</text>

  <line x1="280" y1="174" x2="280" y2="198" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="200" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12.5" fill="#7a5a20" font-weight="bold" font-family="monospace">③ for j = target downto 0:</text>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" font-family="monospace">dp[j] += Σ_{k=1..min(count, j//marks)} dp[j − k·marks]  (mod 1e9+7)</text>
  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#9a7a30">j 倒序 ⇒ dp[j−k·marks] 读到上一轮旧值，不重复计入本题型</text>

  <line x1="280" y1="286" x2="280" y2="308" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="100" y="310" width="360" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold" font-family="monospace">④ return dp[target]</text>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#b03a3a">k=0 项即 dp[j] 自身（不选该题型，沿用旧值）</text>
</svg>
