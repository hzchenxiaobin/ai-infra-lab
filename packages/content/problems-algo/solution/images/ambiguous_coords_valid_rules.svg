<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">合法数字的两条规则</text>

  <!-- Left column: Integer form -->
  <rect x="20" y="48" width="245" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="142" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">整数形式（无小数点）</text>
  <text x="142" y="88" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">条件：长度=1 或 首位≠0</text>

  <!-- integer examples -->
  <rect x="30" y="108" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"0"</text>
  <text x="55" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">✓ 单 digit</text>

  <rect x="90" y="108" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"12"</text>
  <text x="115" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">✓ 首位≠0</text>

  <rect x="150" y="108" width="55" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"00"</text>
  <text x="177" y="150" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 前导0</text>

  <rect x="215" y="108" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"01"</text>
  <text x="240" y="150" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 前导0</text>

  <rect x="20" y="162" width="245" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="142" y="182" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">首位是 0 且长度&gt;1 → 不合法（前导零禁令）</text>

  <!-- Right column: Decimal form -->
  <rect x="278" y="48" width="245" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">小数形式（插小数点）</text>
  <text x="400" y="88" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">整数部合法 且 小数部末位≠0</text>

  <!-- decimal: split t into int.frac -->
  <rect x="288" y="108" width="225" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="128" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t = 整数部 t[:k]  ·  小数部 t[k:]</text>

  <!-- decimal examples -->
  <rect x="288" y="148" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"0.1"</text>
  <text x="315" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">✓ int="0"</text>

  <rect x="350" y="148" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"1.2"</text>
  <text x="377" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">✓ 末位≠0</text>

  <rect x="412" y="148" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"0.01"</text>
  <text x="439" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">✓ 末位1</text>

  <rect x="288" y="200" width="55" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"1.0"</text>
  <text x="315" y="242" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 末位0</text>

  <rect x="350" y="200" width="55" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"00.1"</text>
  <text x="377" y="242" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ int前导</text>

  <rect x="412" y="200" width="55" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"0.10"</text>
  <text x="439" y="242" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗ 末位0</text>

  <!-- Summary box -->
  <rect x="20" y="270" width="503" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">生成函数 getValid(t) 伪代码</text>
  <text x="40" y="316" font-size="11" fill="#444" filter="url(#rough2)">整数： if len(t)==1 or t[0]!='0':  yield t</text>
  <text x="40" y="334" font-size="11" fill="#444" filter="url(#rough2)">小数： for k in 1..len(t)−1:</text>
  <text x="60" y="352" font-size="11" fill="#444" filter="url(#rough2)">intPart=t[:k], fracPart=t[k:]</text>
  <text x="60" y="370" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">if intPart合法 and fracPart[-1]!='0':  yield intPart+"."+fracPart</text>
</svg>
