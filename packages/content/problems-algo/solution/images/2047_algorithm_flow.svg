<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：切分 → 逐 token 三步校验</text>

  <!-- Step 1: Split -->
  <rect x="140" y="42" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">按空格切分 sentence → tokens</text>
  <path d="M 260 80 L 260 98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: For each token -->
  <rect x="140" y="102" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历每个 token</text>
  <path d="M 260 140 L 260 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Check 1: digits -->
  <polygon points="260,164 410,194 260,224 110,194" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">含数字?</text>
  <text x="260" y="206" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">isdigit(ch)</text>

  <!-- Yes -> invalid -->
  <path d="M 410 194 L 432 194" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="436" y="178" width="72" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="472" y="198" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">无效</text>

  <!-- No -> continue -->
  <path d="M 260 224 L 260 244" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="238" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Check 2: hyphen -->
  <polygon points="260,248 410,278 260,308 110,278" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">'-' &gt;1 或两侧非字母?</text>
  <text x="260" y="290" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">hyphen &gt; 1 或边界</text>

  <!-- Yes -> invalid -->
  <path d="M 410 278 L 432 278" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="272" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="436" y="262" width="72" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="472" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">无效</text>

  <!-- No -> continue -->
  <path d="M 260 308 L 260 328" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="322" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Check 3: punctuation -->
  <polygon points="260,332 410,362 260,392 110,362" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">标点 &gt;1 或不在末尾?</text>
  <text x="260" y="374" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">punct &gt; 1 或 i ≠ n-1</text>

  <!-- Yes -> invalid -->
  <path d="M 410 362 L 432 362" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="356" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="436" y="346" width="72" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="472" y="366" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">无效</text>

  <!-- No -> valid -->
  <path d="M 260 392 L 260 412" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="276" y="406" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Valid box -->
  <rect x="170" y="416" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="439" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有效 → ans++</text>

  <!-- Bottom note -->
  <text x="260" y="468" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">三条规则全部通过才计数；任一失败即跳过该 token</text>
</svg>
