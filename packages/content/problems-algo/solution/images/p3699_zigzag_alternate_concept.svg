<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：锯齿 ⟺ 相邻两步方向严格交替</text>
  <text x="205" y="46" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">锯齿序列示例：2 → 5 → 1 → 4</text>

  <!-- 上半：锯齿折线 -->
  <path d="M 104 138 Q 130 100 163 85" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="106" font-size="10.5" fill="#b85450" filter="url(#rough2)">升</text>

  <path d="M 176 84 Q 205 125 234 140" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="184" y="128" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">降</text>

  <path d="M 244 142 Q 272 100 303 84" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="106" font-size="10.5" fill="#b85450" filter="url(#rough2)">升</text>

  <circle cx="100" cy="148" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="170" cy="74" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="240" cy="150" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="310" cy="76" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <text x="205" y="178" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">升后必降，降后必升</text>

  <!-- 右上：违规反例 -->
  <path d="M 367 146 L 393 130" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 407 118 L 433 102" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="360" cy="152" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="400" cy="124" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="440" cy="96" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="90" font-size="16" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="400" y="172" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">三连严格递增 ✗</text>
  <text x="400" y="186" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">相邻相等同样 ✗</text>

  <path d="M 40 194 L 480 194" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6,5" filter="url(#rough2)"/>

  <!-- 下半：状态机 -->
  <text x="60" y="216" font-size="11" fill="#333" filter="url(#rough2)">状态与转移：上一步方向 × 结尾值（值域 1..4 为例）</text>

  <text x="60" y="234" font-size="9.5" fill="#446688" filter="url(#rough2)">up[x]：上一步↑升 ⇒ 下一步必↓降</text>
  <rect x="60" y="238" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="238" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="172" y="238" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="228" y="238" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 86 298 Q 134 266 194 268" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="286" font-size="9" fill="#b85450" filter="url(#rough2)">x &lt; y</text>
  <path d="M 254 268 Q 214 300 146 298" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="218" y="288" font-size="9" fill="#4a7a3a" filter="url(#rough2)">x &gt; y</text>

  <rect x="60" y="300" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="300" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="172" y="300" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="228" y="300" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="319" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <text x="60" y="345" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">dn[x]：上一步↓降 ⇒ 下一步必↑升</text>

  <rect x="300" y="232" width="198" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="399" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">整层转移 = 前缀和 / 后缀和</text>
  <text x="399" y="278" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">new_up[y] = Σ dn[x]（x &lt; y）</text>
  <text x="399" y="298" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">new_dn[y] = Σ up[x]（x &gt; y）</text>
  <text x="399" y="320" text-anchor="middle" font-size="9.5" fill="#a07020" filter="url(#rough2)">一趟正扫 + 一趟倒扫，每层 O(m)</text>
</svg>
