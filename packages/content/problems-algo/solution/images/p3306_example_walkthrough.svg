<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3 演算：word = "ieaouqqieaouqq"，k = 1 → f(1)</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（K = 1；贡献 = max(0, lastAll − left + 1)；f(0) 同法另跑一趟）</text>

  <!-- 表头 -->
  <rect x="30" y="52" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="125" y="70" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">入窗</text>
  <text x="205" y="70" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">收缩后 left</text>
  <text x="290" y="70" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">lastAll</text>
  <text x="360" y="70" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">贡献</text>
  <text x="455" y="70" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">备注</text>

  <!-- 行分隔线 -->
  <line x1="30" y1="102" x2="530" y2="102" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="132" x2="530" y2="132" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="162" x2="530" y2="162" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="192" x2="530" y2="192" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="222" x2="530" y2="222" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="252" x2="530" y2="252" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="282" x2="530" y2="282" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="312" x2="530" y2="312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="52" x2="30" y2="312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="530" y1="52" x2="530" y2="312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 1：r=0~3 -->
  <text x="60" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0~3</text>
  <text x="125" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i e a o</text>
  <text x="205" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">−1</text>
  <text x="360" y="122" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="455" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">u 还没出现</text>

  <!-- 行 2：r=4 -->
  <rect x="31" y="133" width="498" height="27" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
  <text x="60" y="152" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="125" y="152" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">u</text>
  <text x="205" y="152" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="152" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="360" y="152" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="455" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">「ieaou」集齐</text>

  <!-- 行 3：r=5 -->
  <rect x="31" y="163" width="498" height="27" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
  <text x="60" y="182" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="125" y="182" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">q</text>
  <text x="205" y="182" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="182" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="360" y="182" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="455" y="182" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">辅音 1 ≤ K 不缩</text>

  <!-- 行 4：r=6 -->
  <text x="60" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="125" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">q</text>
  <text x="205" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="290" y="212" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="360" y="212" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="455" y="212" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">辅音 2&gt;K 连踢 6 格</text>

  <!-- 行 5：r=7~10 -->
  <text x="60" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7~10</text>
  <text x="125" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i e a o</text>
  <text x="205" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="290" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1~4</text>
  <text x="360" y="242" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="455" y="242" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">lastAll &lt; left</text>

  <!-- 行 6：r=11 -->
  <rect x="31" y="253" width="498" height="27" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
  <text x="60" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="125" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">u</text>
  <text x="205" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="290" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="360" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+2</text>
  <text x="455" y="272" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">「qieaou」「ieaou」</text>

  <!-- 行 7：r=12 -->
  <rect x="31" y="283" width="498" height="27" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
  <text x="60" y="302" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="125" y="302" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">q</text>
  <text x="205" y="302" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="290" y="302" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="360" y="302" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="455" y="302" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">踢 q@6，「ieaouq」</text>

  <!-- 行 8：r=13 -->
  <text x="60" y="332" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)" dy="-8">13</text>
  <text x="125" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">q</text>
  <text x="205" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="290" y="324" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="360" y="324" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="455" y="324" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">连踢 7~12 全清</text>

  <!-- 汇总 -->
  <rect x="30" y="336" width="500" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">f(1) = 1+1+2+1 = 4 ｜ 同法另跑一趟 f(0) = 2（两个纯元音串）</text>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">ans = f(1) − f(0) = 4 − 2 = 3 ✓</text>

  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">看点：r=6 一次连踢 6 格（均摊不超 2n）；r=7~10 窗口辅音合规但元音不齐，贡献 0</text>
  <text x="280" y="430" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">lastAll 从 −1 抬到 0 再到 7 —— 元音约束只看「五个最后出现位置的最小值」</text>
  <text x="280" y="454" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">与 O(n²) 暴力对拍 3000 组随机数据全部一致</text>
</svg>
