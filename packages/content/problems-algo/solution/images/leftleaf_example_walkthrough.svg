<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：dfs(3) 递归展开</text>

  <!-- table header -->
  <rect x="20" y="44" width="480" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">dfs 调用</text>
  <text x="170" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">node</text>
  <text x="250" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">node.left</text>
  <text x="340" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">左孩子是叶子?</text>
  <text x="440" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">左贡献</text>

  <!-- row 1: dfs(3) -->
  <rect x="20" y="72" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(3)</text>
  <text x="170" y="92" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="250" y="92" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ (9 无孩子)</text>
  <text x="440" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+9</text>

  <!-- row 2: dfs(20) -->
  <rect x="20" y="102" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(20)</text>
  <text x="170" y="122" text-anchor="middle" font-size="11" fill="#333">20</text>
  <text x="250" y="122" text-anchor="middle" font-size="11" fill="#333">15</text>
  <text x="340" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ (15 无孩子)</text>
  <text x="440" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+15</text>

  <!-- row 3: dfs(7) -->
  <rect x="20" y="132" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(7)</text>
  <text x="170" y="152" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="250" y="152" text-anchor="middle" font-size="11" fill="#888">null</text>
  <text x="340" y="152" text-anchor="middle" font-size="11" fill="#888">— (无左孩子)</text>
  <text x="440" y="152" text-anchor="middle" font-size="11" fill="#888">+0</text>

  <!-- row 4: dfs(null) -->
  <rect x="20" y="162" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(null)</text>
  <text x="170" y="182" text-anchor="middle" font-size="11" fill="#888">null</text>
  <text x="250" y="182" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="340" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">base case</text>
  <text x="440" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 0</text>

  <!-- note box: dfs(9) & dfs(15) never called -->
  <rect x="20" y="208" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">⚠ dfs(9) 和 dfs(15) 从未被调用！</text>
  <text x="260" y="246" text-anchor="middle" font-size="10" fill="#555">它们作为左叶子，其值已被父节点（3、20）直接捕获，无需再进入</text>

  <!-- sum calculation -->
  <rect x="20" y="268" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">总和 = 9 + 15 + 0 + 0 = 24</text>

  <!-- recursion tree sketch -->
  <text x="260" y="326" text-anchor="middle" font-size="9" fill="#888">调用链：dfs(3) → dfs(20) → dfs(7) → dfs(null) 归返回</text>
  <text x="260" y="340" text-anchor="middle" font-size="9" fill="#888">每个节点只看自己的左孩子，左叶子值在父节点处入账</text>
</svg>
