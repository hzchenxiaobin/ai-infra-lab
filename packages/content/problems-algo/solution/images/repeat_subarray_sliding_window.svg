<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">滑动窗口对齐：找最佳错位下的最长连续匹配</text>
  <path d="M 130 38 Q 280 46 430 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- index ruler for nums1 -->
  <text x="70" y="72" font-size="10.5" fill="#aaa">下标</text>
  <g font-size="10.5" fill="#aaa" text-anchor="middle">
    <text x="120" y="72">0</text><text x="168" y="72">1</text><text x="216" y="72">2</text><text x="264" y="72">3</text><text x="312" y="72">4</text>
  </g>

  <!-- nums1 row -->
  <text x="70" y="100" font-size="12" fill="#888" font-weight="bold">nums1</text>
  <g filter="url(#rough2)">
    <rect x="96" y="80" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="144" y="80" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="192" y="80" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
    <rect x="240" y="80" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
    <rect x="288" y="80" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
  </g>
  <text x="120" y="100" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="168" y="100" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="216" y="100" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">3</text>
  <text x="264" y="100" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="312" y="100" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">1</text>

  <!-- match bracket above nums1 -->
  <path d="M 200 76 L 200 70 L 328 70 L 328 76" stroke="#4a8e4a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="264" y="60" text-anchor="middle" font-size="11" fill="#4a8e4a" font-weight="bold">连续匹配段 [3,2,1] = 3</text>

  <!-- nums2 row, shifted right by 2 cells (offset) -->
  <text x="70" y="158" font-size="12" fill="#888" font-weight="bold">nums2</text>
  <g filter="url(#rough2)">
    <rect x="192" y="138" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
    <rect x="240" y="138" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
    <rect x="288" y="138" width="48" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
    <rect x="336" y="138" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="384" y="138" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text x="216" y="158" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">3</text>
  <text x="264" y="158" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="312" y="158" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">1</text>
  <text x="360" y="158" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="408" y="158" text-anchor="middle" font-size="13" fill="#333">7</text>

  <!-- vertical match lines -->
  <g stroke="#4a8e4a" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)">
    <path d="M 216 112 L 216 136"/>
    <path d="M 264 112 L 264 136"/>
    <path d="M 312 112 L 312 136"/>
  </g>

  <!-- offset annotation -->
  <text x="408" y="100" font-size="11" fill="#888" font-style="italic">← 向右平移 offset=2</text>
  <path d="M 348 124 L 432 124" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 432 124 L 348 124" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <!-- explanation box -->
  <g filter="url(#rough2)">
    <rect x="50" y="196" width="460" height="118" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="70" y="220" font-size="12.5" fill="#444" font-weight="bold">思路：</text>
  <text x="70" y="242" font-size="11.5" fill="#555">① 枚举 nums2 相对 nums1 的所有平移偏移（共 m + n − 1 种）</text>
  <text x="70" y="262" font-size="11.5" fill="#555">② 对每种偏移，逐位比较「重叠区」，统计最长连续相等段</text>
  <text x="70" y="282" font-size="11.5" fill="#555">③ 所有偏移下的最长连续段即为答案</text>
  <text x="70" y="304" font-size="11.5" fill="#b85450" font-weight="bold">时间 O((m+n)·min(m,n))，空间 O(1)　几何直觉 = DP 对角线递增图案的来源</text>
</svg>
