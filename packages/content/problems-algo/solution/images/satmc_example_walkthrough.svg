<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="290" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：nums = [4, 7, 8, 15, 3, 5]</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888">质因子最后出现位置：last[2]=2, last[7]=1, last[3]=4, last[5]=5</text>

  <!-- column x: i@40, nums[i]@90, 新增质因子@150, last（取入）@250, maxLast@370, maxLast≤i?@440 -->
  <!-- table frame -->
  <g filter="url(#rough2)">
    <rect x="30" y="58" width="540" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <line x1="86" y1="58" x2="86" y2="196" stroke="#446688" stroke-width="1"/>
    <line x1="146" y1="58" x2="146" y2="196" stroke="#446688" stroke-width="1"/>
    <line x1="246" y1="58" x2="246" y2="196" stroke="#446688" stroke-width="1"/>
    <line x1="366" y1="58" x2="366" y2="196" stroke="#446688" stroke-width="1"/>
    <line x1="436" y1="58" x2="436" y2="196" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="58" y="76" text-anchor="middle" font-size="10.5" fill="#224466" font-weight="bold">i</text>
  <text x="116" y="76" text-anchor="middle" font-size="10.5" fill="#224466" font-weight="bold">nums[i]</text>
  <text x="196" y="76" text-anchor="middle" font-size="10.5" fill="#224466" font-weight="bold">新增质因子</text>
  <text x="306" y="76" text-anchor="middle" font-size="10.5" fill="#224466" font-weight="bold">取入 last[p]</text>
  <text x="401" y="76" text-anchor="middle" font-size="10.5" fill="#224466" font-weight="bold">maxLast</text>
  <text x="503" y="76" text-anchor="middle" font-size="10.5" fill="#224466" font-weight="bold">maxLast ≤ i?</text>

  <!-- row 0: i=0 -->
  <g filter="url(#rough2)"><rect x="30" y="88" width="540" height="34" fill="#ffffff" stroke="#446688" stroke-width="1"/></g>
  <text x="58" y="109" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="116" y="109" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="196" y="109" text-anchor="middle" font-size="11" fill="#224466">{2}</text>
  <text x="306" y="109" text-anchor="middle" font-size="11" fill="#333">last[2] = 2</text>
  <text x="401" y="109" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">2</text>
  <text x="503" y="109" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 (2 &gt; 0)</text>

  <!-- row 1: i=1 -->
  <g filter="url(#rough2)"><rect x="30" y="122" width="540" height="34" fill="#ffffff" stroke="#446688" stroke-width="1"/></g>
  <text x="58" y="143" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="116" y="143" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="196" y="143" text-anchor="middle" font-size="11" fill="#224466">{7}</text>
  <text x="306" y="143" text-anchor="middle" font-size="11" fill="#333">last[7] = 1</text>
  <text x="401" y="143" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">2</text>
  <text x="503" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 (2 &gt; 1)</text>

  <!-- row 2: i=2 (answer, highlight green) -->
  <g filter="url(#rough2)"><rect x="30" y="156" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="58" y="180" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="116" y="180" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">8</text>
  <text x="196" y="180" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">{2}</text>
  <text x="306" y="180" text-anchor="middle" font-size="11" fill="#3a5a2a">last[2] = 2</text>
  <text x="401" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="503" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓ → 返回 2</text>

  <!-- note -->
  <text x="300" y="224" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i=2 时 maxLast=2 ≤ 2：前缀质因子 {2,7} 最后出现均 ≤ 2</text>
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#444">未进入后缀，与后缀质因子 {3, 5} 互质 → gcd(224, 225) = 1</text>
  <text x="300" y="270" text-anchor="middle" font-size="10.5" fill="#888">注：前缀积 = 4·7·8 = 224 = 2⁵·7，后缀积 = 15·3·5 = 225 = 3²·5²，无公共质因子</text>
</svg>
