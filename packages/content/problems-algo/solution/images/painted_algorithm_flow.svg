<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="520" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：线段树「查询 → 计算新涂 → 区间修改」</text>

  <!-- Start -->
  <rect x="230" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="71" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 paint[i] = [start, end)</text>

  <path d="M 330 90 L 330 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: query -->
  <rect x="210" y="114" width="240" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① query(l, r)</text>
  <text x="330" y="152" text-anchor="middle" font-size="11" fill="#555">查询 [l,r] 已涂格子数 v</text>

  <path d="M 330 166 L 330 186" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute -->
  <rect x="210" y="190" width="240" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 新涂 = (r−l+1) − v</text>
  <text x="330" y="228" text-anchor="middle" font-size="11" fill="#555">区段总长 − 已涂 = 本次新涂</text>

  <path d="M 330 242 L 330 262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: modify -->
  <rect x="210" y="266" width="240" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ modify(l, r, 1)</text>
  <text x="330" y="304" text-anchor="middle" font-size="11" fill="#555">将 [l,r] 整段标记为已涂</text>

  <path d="M 330 318 L 330 338" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: record -->
  <rect x="250" y="342" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="365" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans[i] = 新涂</text>

  <!-- pushdown explanation on right side -->
  <rect x="480" y="114" width="160" height="120" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="560" y="136" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">懒标记 pushdown</text>
  <text x="560" y="156" text-anchor="middle" font-size="10" fill="#777">修改命中完整节点时</text>
  <text x="560" y="170" text-anchor="middle" font-size="10" fill="#777">v = r−l+1, add=1</text>
  <text x="560" y="186" text-anchor="middle" font-size="10" fill="#777">不下传到叶子</text>
  <text x="560" y="202" text-anchor="middle" font-size="10" fill="#777">查询/修改碰到时再</text>
  <text x="560" y="216" text-anchor="middle" font-size="10" fill="#777">pushdown 到子节点</text>

  <path d="M 450 138 L 478 138" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow -->
  <path d="M 410 360 Q 460 360 460 66 Q 460 46 430 46" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="200" font-size="10" fill="#888" transform="rotate(90, 470, 200)">下一轮 i+1</text>

  <!-- final -->
  <rect x="210" y="396" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="421" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束 → return ans</text>

  <path d="M 330 382 L 330 392" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="60" y="452" width="540" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="473" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">动态开点：节点按需创建，空指针访问时才 new Node(l, r)</text>
  <text x="330" y="490" text-anchor="middle" font-size="10" fill="#888">坐标范围 U=5×10⁴ 但实际访问的节点数 ≈ n·log U，避免预分配满树</text>
</svg>
