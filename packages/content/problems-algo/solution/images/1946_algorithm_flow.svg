<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次扫描 + 突变状态机</text>

  <!-- start -->
  <rect x="270" y="46" width="100" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始，mutating=false</text>
  <path d="M 320 80 L 320 100" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="240" y="104" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="126" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">遍历 num 每一位 d = num[i]</text>
  <path d="M 320 140 L 320 158" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- compute c -->
  <rect x="250" y="162" width="140" height="30" rx="6" fill="#fff" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="182" text-anchor="middle" font-size="12" fill="#333">c = change[d]</text>
  <path d="M 320 194 L 320 210" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision: mutating? -->
  <polygon points="320,214 410,254 320,294 230,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">mutating ?</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" fill="#888">(已开突?)</text>

  <!-- NO branch -> left -->
  <path d="M 230 254 L 150 254 L 150 286" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="160" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- NO branch decision: c > d ? -->
  <polygon points="150,290 230,322 150,354 70,322" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c &gt; d ?</text>
  <text x="150" y="334" text-anchor="middle" font-size="10" fill="#888">首个能变大</text>

  <!-- yes from c>d -->
  <path d="M 150 356 L 150 384" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="158" y="376" font-size="10" fill="#4a7a3a">是</text>
  <rect x="86" y="388" width="128" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a">res[i]=c, mutating=true</text>
  <text x="150" y="421" text-anchor="middle" font-size="10" fill="#888">→ 下一位</text>

  <!-- no from c>d: keep d, next -->
  <path d="M 70 322 L 46 322 L 46 408" stroke="#888" stroke-width="1.3" marker-dasharray="3 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="50" y="316" font-size="10" fill="#888">否</text>
  <rect x="20" y="388" width="58" height="40" rx="6" fill="#fff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="49" y="406" text-anchor="middle" font-size="11" fill="#555">留 d</text>
  <text x="49" y="421" text-anchor="middle" font-size="10" fill="#888">→ 下一位</text>

  <!-- YES branch -> right -->
  <path d="M 410 254 L 490 254 L 490 286" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="464" y="248" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- YES branch decision: c >= d ? -->
  <polygon points="490,290 570,322 490,354 410,322" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="318" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c ≥ d ?</text>
  <text x="490" y="334" text-anchor="middle" font-size="10" fill="#888">续突不亏?</text>

  <!-- yes: write c continue -->
  <path d="M 490 356 L 490 384" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="498" y="376" font-size="10" fill="#4a7a3a">是</text>
  <rect x="426" y="388" width="128" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a">res[i]=c</text>
  <text x="490" y="421" text-anchor="middle" font-size="10" fill="#888">→ 下一位</text>

  <!-- no: break -->
  <path d="M 570 322 L 600 322 L 600 408" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="576" y="316" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="566" y="388" width="56" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="594" y="412" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">break</text>

  <!-- end -->
  <path d="M 320 432 L 320 446" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="250" y="430" width="140" height="0" fill="none"/>
  <text x="320" y="452" text-anchor="middle" font-size="11" fill="#888">遍历结束 / break → 返回 res</text>
</svg>
