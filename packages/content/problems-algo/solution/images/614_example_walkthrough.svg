<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 行输入 → 自连接 3 个匹配 → 3 行输出</text>

  <!-- Left: f1 (Follow table) -->
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Follow f1（输入）</text>
  <rect x="50" y="58" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="73" font-size="9.5" fill="#446688" font-weight="bold">followee</text>
  <text x="125" y="73" font-size="9.5" fill="#d6a040" font-weight="bold">follower</text>
  <line x1="100" y1="58" x2="100" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="80" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="94" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="125" y="94" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <line x1="100" y1="80" x2="100" y2="100" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="100" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="114" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="125" y="114" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <line x1="100" y1="100" x2="100" y2="120" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="120" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="125" y="134" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <line x1="100" y1="120" x2="100" y2="140" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="140" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="154" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="125" y="154" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <line x1="100" y1="140" x2="100" y2="160" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Right: f2 (Follow table) -->
  <text x="430" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Follow f2</text>
  <rect x="380" y="58" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="73" font-size="9.5" fill="#d6a040" font-weight="bold">followee</text>
  <text x="455" y="73" font-size="9.5" fill="#b85450" font-weight="bold">follower</text>
  <line x1="430" y1="58" x2="430" y2="80" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="380" y="80" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="94" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="455" y="94" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <line x1="430" y1="80" x2="430" y2="100" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="380" y="100" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="114" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="455" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <line x1="430" y1="100" x2="430" y2="120" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="380" y="120" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="134" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="455" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <line x1="430" y1="120" x2="430" y2="140" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="380" y="140" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="154" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="455" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <line x1="430" y1="140" x2="430" y2="160" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- JOIN matches: highlight matched rows -->
  <!-- match 1: f1 row (1,2) y=80-100 matches f2 row (2,3) y=120-140 -->
  <rect x="118" y="80" width="20" height="20" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <rect x="398" y="120" width="20" height="20" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <path d="M138 90 C 250 60, 300 60, 398 130" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- match 2: f1 row (1,3) y=100-120 matches f2 row (3,4) y=140-160 -->
  <rect x="118" y="100" width="20" height="20" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <rect x="398" y="140" width="20" height="20" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <path d="M138 110 C 250 95, 300 110, 398 150" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- match 3: f1 row (2,3) y=120-140 matches f2 row (3,4) y=140-160 -->
  <rect x="118" y="120" width="20" height="20" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <rect x="398" y="140" width="20" height="20" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <path d="M138 130 C 250 150, 300 150, 398 150" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- no match: f1 row (3,4) y=140-160 → f2.followee=4 不存在 -->
  <rect x="118" y="140" width="20" height="20" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="155" font-size="9.5" fill="#888">followee=4 不存在 → 无匹配</text>

  <!-- JOIN label in middle -->
  <text x="265" y="184" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">JOIN ON f1.follower = f2.followee</text>

  <!-- arrow down to result -->
  <path d="M280 192 L280 208" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result rows before GROUP BY -->
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">自连接产生 3 行（本例无重复，GROUP BY 直通）</text>

  <!-- 3 result pairs shown as a table -->
  <rect x="180" y="234" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="249" font-size="9.5" fill="#446688" font-weight="bold">followee</text>
  <text x="345" y="249" font-size="9.5" fill="#b85450" font-weight="bold">follower</text>
  <line x1="280" y1="234" x2="280" y2="256" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="256" width="200" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="268" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="330" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <line x1="280" y1="256" x2="280" y2="274" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="274" width="200" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="286" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="330" y="286" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <line x1="280" y1="274" x2="280" y2="292" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="292" width="200" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="304" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="330" y="304" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <line x1="280" y1="292" x2="280" y2="310" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow down to final output -->
  <path d="M280 314 L280 332" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="328" font-size="9.5" fill="#4a7a3a">GROUP BY + ORDER BY 1, 2</text>

  <!-- Final output -->
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最终输出</text>
  <rect x="180" y="358" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="215" y="372" font-size="9.5" fill="#446688" font-weight="bold">followee</text>
  <text x="345" y="372" font-size="9.5" fill="#b85450" font-weight="bold">follower</text>
  <line x1="280" y1="358" x2="280" y2="378" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="378" width="200" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="230" y="388" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="330" y="388" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <line x1="280" y1="378" x2="280" y2="392" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="392" width="200" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="230" y="402" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="330" y="402" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <line x1="280" y1="392" x2="280" y2="406" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="406" width="200" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="230" y="416" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>
  <text x="330" y="416" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <line x1="280" y1="406" x2="280" y2="420" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
</svg>
