<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：f(i) = arr[i] − i 单调不减 → 可二分找零点</text>

  <!-- arr row -->
  <text x="40" y="78" font-size="12" fill="#888">arr:</text>
  <rect x="90" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="12" fill="#333">−10</text>
  <rect x="170" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="82" text-anchor="middle" font-size="12" fill="#333">−5</text>
  <rect x="250" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="330" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="82" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="410" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="82" text-anchor="middle" font-size="12" fill="#333">7</text>

  <!-- index labels -->
  <text x="130" y="108" text-anchor="middle" font-size="10" fill="#aaa">i=0</text>
  <text x="210" y="108" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="290" y="108" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="370" y="108" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="450" y="108" text-anchor="middle" font-size="10" fill="#aaa">4</text>

  <!-- f(i) row -->
  <text x="40" y="152" font-size="12" fill="#888">f(i):</text>
  <rect x="90" y="136" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="156" text-anchor="middle" font-size="12" fill="#b85450">−10</text>
  <rect x="170" y="136" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="156" text-anchor="middle" font-size="12" fill="#b85450">−6</text>
  <rect x="250" y="136" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="156" text-anchor="middle" font-size="12" fill="#b85450">−2</text>
  <rect x="330" y="136" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="410" y="136" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="156" text-anchor="middle" font-size="12" fill="#d6a040">3</text>

  <!-- non-decreasing arrow -->
  <path d="M 100 188 L 480 188" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#888">单调不减 ↑（红=负、绿=零、橙=正）</text>

  <!-- proof box -->
  <rect x="40" y="206" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">f(i+1) − f(i) = arr[i+1] − arr[i] − 1 ≥ 0</text>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#555">严格升序 + 互异 → arr[i+1] ≥ arr[i]+1 → 差值恒非负</text>

  <!-- result box -->
  <rect x="40" y="278" width="480" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">二分找首个 arr[i] ≥ i 的下标 lo（lower_bound）</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#555">若 arr[lo] == lo → 返回 lo（最小不动点）⭐</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#555">若 arr[lo] &gt; lo → 返回 −1（f 从负跳正，从未取零）</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#888">f=0 即 arr[i]==i，f 跨越 0 处即为答案</text>
</svg>
