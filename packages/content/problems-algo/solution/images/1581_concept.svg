<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：LEFT JOIN 保留无交易的访问（反连接）</text>

  <!-- ===== Visits table (left) ===== -->
  <text x="50" y="54" font-size="10" fill="#888">Visits（左表，全保留）</text>
  <rect x="40" y="60" width="130" height="212" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="76" font-size="9" fill="#446688" font-weight="bold">visit  cust</text>
  <line x1="40" y1="82" x2="170" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- v1 c23 matched -->
  <text x="50" y="98" font-size="9" fill="#4a7a3a">1     23</text>
  <!-- v2 c9 matched -->
  <text x="50" y="122" font-size="9" fill="#4a7a3a">2     9</text>
  <!-- v4 c30 unmatched -->
  <rect x="42" y="130" width="126" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="50" y="146" font-size="9" fill="#b85450" font-weight="bold">4     30</text>
  <!-- v5 c54 matched -->
  <text x="50" y="170" font-size="9" fill="#4a7a3a">5     54</text>
  <!-- v6 c96 unmatched -->
  <rect x="42" y="178" width="126" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="50" y="194" font-size="9" fill="#b85450" font-weight="bold">6     96</text>
  <!-- v7 c54 unmatched -->
  <rect x="42" y="202" width="126" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="50" y="218" font-size="9" fill="#b85450" font-weight="bold">7     54</text>
  <!-- v8 c54 unmatched -->
  <rect x="42" y="226" width="126" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="50" y="242" font-size="9" fill="#b85450" font-weight="bold">8     54</text>

  <text x="50" y="264" font-size="8" fill="#b85450">4 行无交易（红）</text>

  <!-- ===== Transactions table (right) ===== -->
  <text x="380" y="54" font-size="10" fill="#888">Transactions（右表）</text>
  <rect x="370" y="60" width="180" height="156" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="76" font-size="9" fill="#446688" font-weight="bold">trans visit  amount</text>
  <line x1="370" y1="82" x2="550" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="98" font-size="9" fill="#4a7a3a">2     5     310</text>
  <text x="380" y="122" font-size="9" fill="#4a7a3a">3     5     300</text>
  <text x="380" y="146" font-size="9" fill="#4a7a3a">9     5     200</text>
  <text x="380" y="170" font-size="9" fill="#4a7a3a">12    1     910</text>
  <text x="380" y="194" font-size="9" fill="#4a7a3a">13    2     970</text>
  <text x="380" y="212" font-size="8" fill="#888">5 笔交易（绿）</text>

  <!-- ===== Join arrows (visit_id match) ===== -->
  <!-- v1(98) -> t12(170) -->
  <path d="M 170 94 C 270 94, 270 166, 370 166" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <!-- v2(118) -> t13(190) -->
  <path d="M 170 118 C 270 118, 270 186, 370 186" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <!-- v5(166) -> t2(94) -->
  <path d="M 170 162 C 270 162, 270 94, 370 94" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <!-- v5(166) -> t3(118) -->
  <path d="M 170 162 C 270 162, 270 118, 370 118" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <!-- v5(166) -> t9(142) -->
  <path d="M 170 162 C 270 162, 270 142, 370 142" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>

  <!-- unmatched visits have no arrow -> NULL -->
  <text x="220" y="156" font-size="9" fill="#b85450" font-weight="bold">无匹配 → t.* = NULL</text>

  <!-- ===== Bottom: filter + group + result ===== -->
  <!-- Arrow down from unmatched visits -->
  <path d="M 105 268 L 105 288" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- WHERE IS NULL box -->
  <rect x="30" y="292" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="310" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">WHERE t.transaction_id</text>
  <text x="110" y="324" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">IS NULL</text>

  <!-- Arrow to group -->
  <path d="M 190 312 L 220 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- GROUP BY box -->
  <rect x="224" y="292" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="304" y="310" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">GROUP BY customer_id</text>
  <text x="304" y="324" text-anchor="middle" font-size="9" fill="#888">+ COUNT(*)</text>

  <!-- Arrow to result -->
  <path d="M 384 312 L 414 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result table -->
  <rect x="418" y="284" width="140" height="76" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="488" y="300" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">cust  count</text>
  <line x1="418" y1="306" x2="558" y2="306" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="320" font-size="9" fill="#446688">30    1</text>
  <text x="428" y="334" font-size="9" fill="#446688">54    2</text>
  <text x="428" y="348" font-size="9" fill="#446688">96    1</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="380" width="528" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="294" y="400" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">LEFT JOIN 保留左表全部行；右表无匹配则 t.* 填 NULL</text>
  <text x="294" y="416" text-anchor="middle" font-size="10" fill="#666">v5 有 3 笔交易→匹配；v4/v6/v7/v8 无交易→IS NULL→按顾客计数</text>

  <!-- ===== Legend ===== -->
  <rect x="380" y="226" width="170" height="46" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="390" y="240" font-size="9" fill="#4a7a3a">绿：有交易（匹配）</text>
  <text x="390" y="254" font-size="9" fill="#b85450">红：无交易（IS NULL）</text>
  <text x="390" y="268" font-size="8" fill="#888">c54 的 v5 有交易但 v7/v8 无</text>
</svg>
