<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：原地折叠至长度为 1</text>

  <!-- 1. start -->
  <rect x="160" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始：n = nums.length</text>

  <!-- arrow down to diamond -->
  <path d="M 260 86 L 260 116" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. diamond n==1? -->
  <polygon points="260,116 340,166 260,216 180,166" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n == 1 ?</text>

  <!-- yes branch: right to return -->
  <path d="M 340 166 L 410 166" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="146" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="171" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 nums[0]</text>

  <!-- no branch: down to loop body -->
  <path d="M 260 216 L 260 246" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="234" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 3. loop body: fold in place -->
  <rect x="70" y="246" width="380" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">for i ← 0 to n/2 − 1：</text>
  <text x="260" y="288" text-anchor="middle" font-size="11.5" fill="#333">op = (i 为偶 ? min : max)</text>
  <text x="260" y="306" text-anchor="middle" font-size="11.5" fill="#333">nums[i] = op(nums[2i], nums[2i+1])</text>

  <!-- arrow down to halve -->
  <path d="M 260 320 L 260 350" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. n <- n/2 -->
  <rect x="180" y="350" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">n ← n / 2</text>

  <!-- loop back arrow: from n/2 box left side, up the left margin, back to diamond left -->
  <path d="M 180 370 L 110 370 L 110 166 L 180 166" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="110" y="270" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">回</text>
  <text x="110" y="284" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">到</text>
  <text x="110" y="298" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">判</text>
  <text x="110" y="312" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">定</text>

  <!-- bottom note -->
  <rect x="30" y="404" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="422" text-anchor="middle" font-size="10.5" fill="#555">每轮长度折半，循环 ⌈log₂n⌉ 轮；总读写量 n+n/2+…+1 &lt; 2n</text>
</svg>
