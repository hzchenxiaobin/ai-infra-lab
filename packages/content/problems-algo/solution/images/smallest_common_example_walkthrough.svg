<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：计数数组变化过程（仅展示值 1–5）</text>

  <!-- Header row -->
  <rect x="50" y="42" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="60" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">处理行</text>

  <rect x="190" y="42" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1</text>

  <rect x="246" y="42" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2</text>

  <rect x="302" y="42" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">3</text>

  <rect x="358" y="42" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">4</text>

  <rect x="414" y="42" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="60" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">5</text>

  <!-- Row 0: [1,2,3,4,5] → all counts become 1 -->
  <rect x="50" y="72" width="140" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="88" text-anchor="middle" font-size="9" fill="#888">Row 0</text>
  <text x="120" y="100" text-anchor="middle" font-size="9" fill="#555">[1 2 3 4 5]</text>

  <rect x="190" y="72" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="94" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="246" y="72" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="94" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="302" y="72" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="94" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="358" y="72" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="94" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="414" y="72" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="94" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- Row 1: [2,4,5,8,10] → values 2,4,5 change -->
  <rect x="50" y="108" width="140" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="124" text-anchor="middle" font-size="9" fill="#888">Row 1</text>
  <text x="120" y="136" text-anchor="middle" font-size="9" fill="#555">[2 4 5 8 10]</text>

  <rect x="190" y="108" width="56" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="130" text-anchor="middle" font-size="12" fill="#999">1</text>

  <rect x="246" y="108" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="130" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="302" y="108" width="56" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="330" y="130" text-anchor="middle" font-size="12" fill="#999">1</text>

  <rect x="358" y="108" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="130" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="414" y="108" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="130" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- Row 2: [3,5,7,9,11] → values 3,5 change -->
  <rect x="50" y="144" width="140" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="160" text-anchor="middle" font-size="9" fill="#888">Row 2</text>
  <text x="120" y="172" text-anchor="middle" font-size="9" fill="#555">[3 5 7 9 11]</text>

  <rect x="190" y="144" width="56" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="218" y="166" text-anchor="middle" font-size="12" fill="#999">1</text>

  <rect x="246" y="144" width="56" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="274" y="166" text-anchor="middle" font-size="12" fill="#999">2</text>

  <rect x="302" y="144" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="166" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="358" y="144" width="56" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="386" y="166" text-anchor="middle" font-size="12" fill="#999">2</text>

  <rect x="414" y="144" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="166" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- Row 3: [1,3,5,7,9] → values 1,3,5 change; 5 reaches 4=m -->
  <rect x="50" y="180" width="140" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="196" text-anchor="middle" font-size="9" fill="#888">Row 3</text>
  <text x="120" y="208" text-anchor="middle" font-size="9" fill="#555">[1 3 5 7 9]</text>

  <rect x="190" y="180" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="202" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="246" y="180" width="56" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="274" y="202" text-anchor="middle" font-size="12" fill="#999">2</text>

  <rect x="302" y="180" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="202" text-anchor="middle" font-size="12" fill="#333">3</text>

  <rect x="358" y="180" width="56" height="34" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="386" y="202" text-anchor="middle" font-size="12" fill="#999">2</text>

  <rect x="414" y="180" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Bottom annotation -->
  <rect x="60" y="230" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="249" text-anchor="middle" font-size="11" fill="#444">count[5] = 4 = m → 最小公共元素 = 5 ✓</text>

  <!-- Legend -->
  <rect x="60" y="272" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="150" y="288" text-anchor="middle" font-size="9" fill="#444">橙色 = 本行有变化</text>

  <rect x="280" y="272" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="370" y="288" text-anchor="middle" font-size="9" fill="#444">绿色 = 达到 m，即答案</text>

  <!-- Insight -->
  <rect x="40" y="307" width="440" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="10" fill="#444">💡 顺序扫描 1→U，第一个 count==m 的即为最小公共元素</text>
</svg>