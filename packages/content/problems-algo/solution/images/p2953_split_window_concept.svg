<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：断点切段 + 长度候选 m·k + 定长滑窗</text>

  <!-- 观察 1：断点切段 -->
  <text x="24" y="52" font-size="13" fill="#446688" font-weight="bold">观察 1：相邻差 &gt; 2 是硬断点，切段后条件 2 免检</text>

  <rect x="90" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="83" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="134" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="83" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="178" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="83" text-anchor="middle" font-size="14" fill="#333">e</text>
  <rect x="262" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="83" text-anchor="middle" font-size="14" fill="#333">b</text>

  <path d="M 243 62 L 236 73 L 242 73 L 234 86" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="112" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a">|a−c|=2 ✓</text>
  <text x="156" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a">|c−e|=2 ✓</text>
  <text x="243" y="108" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|e−b|=3 ✗ 断点</text>

  <rect x="86" y="118" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="156" y="135" text-anchor="middle" font-size="11" fill="#333">段 1（条件 2 免检）</text>
  <rect x="258" y="118" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="284" y="135" text-anchor="middle" font-size="11" fill="#333">段 2</text>

  <rect x="348" y="58" width="196" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="446" y="78" text-anchor="middle" font-size="11" fill="#333">跨断点的子串必含非法相邻对；</text>
  <text x="446" y="94" text-anchor="middle" font-size="11" fill="#333">完全落在段内的子串</text>
  <text x="446" y="110" text-anchor="middle" font-size="11" fill="#333">条件 2 自动满足 → 分段计数</text>

  <!-- 观察 2：长度候选 -->
  <text x="24" y="168" font-size="13" fill="#446688" font-weight="bold">观察 2：每字符恰好 k 次 ⟹ 长度 = m·k，m = 1..26</text>

  <rect x="90" y="180" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="200" text-anchor="middle" font-size="12" fill="#333">k</text>
  <rect x="150" y="180" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="200" text-anchor="middle" font-size="12" fill="#333">2k</text>
  <rect x="210" y="180" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="200" text-anchor="middle" font-size="12" fill="#333">3k</text>
  <text x="272" y="200" text-anchor="middle" font-size="12" fill="#555">…</text>
  <rect x="292" y="180" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="200" text-anchor="middle" font-size="12" fill="#333">26k</text>

  <rect x="400" y="180" width="146" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="473" y="200" text-anchor="middle" font-size="11" fill="#333">长度候选：10⁵ 个 → 26 个</text>

  <!-- 观察 3：定长滑窗 -->
  <text x="24" y="232" font-size="13" fill="#446688" font-weight="bold">观察 3：对每个 m 做长度 m·k 的定长滑窗，valid 计数器判定</text>

  <rect x="70" y="244" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="265" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="104" y="244" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="265" text-anchor="middle" font-size="13" fill="#333">g</text>
  <rect x="138" y="244" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="265" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="172" y="244" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="265" text-anchor="middle" font-size="13" fill="#333">g</text>
  <rect x="206" y="244" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="265" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="240" y="244" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="265" text-anchor="middle" font-size="13" fill="#333">e</text>

  <rect x="66" y="240" width="144" height="40" fill="none" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="138" y="298" text-anchor="middle" font-size="11" fill="#b85450">win = m·k = 4（m=2, k=2）</text>

  <path d="M 138 304 L 138 318" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>

  <text x="290" y="298" font-size="11" fill="#555">进/出窗口跨过 k / k+1 边界才增减 valid</text>

  <rect x="60" y="322" width="310" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="215" y="344" text-anchor="middle" font-size="12" fill="#333">窗口内 cnt：i×2, g×2 → valid = 2 = m ✓ 命中</text>

  <path d="M 374 339 L 396 339" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>

  <rect x="400" y="322" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="344" text-anchor="middle" font-size="12" fill="#333">ans += 1</text>
</svg>
