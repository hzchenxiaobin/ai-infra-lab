<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：算用时 → 按比值排序 → 后缀和累加</text>

  <!-- ① 击杀用时 -->
  <rect x="100" y="40" width="320" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 每个敌人算击杀用时 t = ⌈health / power⌉</text>
  <path d="M 260 72 L 260 86" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 排序 -->
  <rect x="100" y="90" width="320" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 按 d/t 从大到小排序（交叉相乘定序）</text>
  <text x="432" y="102" font-size="10" fill="#7a6a50" filter="url(#rough2)">比较器：d_a·t_b &gt;</text>
  <text x="432" y="115" font-size="10" fill="#7a6a50" filter="url(#rough2)">d_b·t_a 则 a 在前</text>
  <path d="M 260 122 L 260 136" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 初始化 -->
  <rect x="100" y="140" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="161" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ suffix = 全体 d 之和（存活伤害），total = 0</text>
  <path d="M 260 172 L 260 186" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 遍历累加（循环） -->
  <rect x="100" y="190" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">④ 依序遍历（每敌一轮）：total += t × suffix</text>
  <text x="260" y="224" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">然后 suffix −= d</text>
  <path d="M 360 210 C 410 210, 410 240, 372 240 C 350 240, 340 230, 342 218" fill="none" stroke="#a07830" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="248" font-size="10" fill="#7a6a50" filter="url(#rough2)">还有敌人</text>
  <text x="415" y="260" font-size="10" fill="#7a6a50" filter="url(#rough2)">就转一圈</text>
  <path d="M 260 230 L 260 248" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 返回 -->
  <rect x="130" y="252" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">⑤ 返回 total（用 long long）</text>

  <!-- side note -->
  <rect x="60" y="300" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">后缀视角：打当前敌人要 t 秒，这 t 秒里</text>
  <text x="260" y="335" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">「它 + 排它后面的」全都活着、每秒都在输出伤害</text>
</svg>
