<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算： minLength=2, maxLength=3, oneGroup=1, zeroGroup=2</text>
  <text x="290" y="48" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">oneGroup=1（1 段可任意长），zeroGroup=2（0 段必须偶数长）</text>

  <!-- header row -->
  <rect x="20" y="62" width="540" height="30" rx="4" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="40" y="82" text-anchor="middle" font-size="12" fill="#445" filter="url(#rough2)">i</text>
  <text x="190" y="82" text-anchor="middle" font-size="12" fill="#445" filter="url(#rough2)">f[i] 推导</text>
  <text x="312" y="82" text-anchor="middle" font-size="12" fill="#445" filter="url(#rough2)">f[i]</text>
  <text x="450" y="82" text-anchor="middle" font-size="12" fill="#445" filter="url(#rough2)">长度 i 的好串</text>

  <!-- row 0 -->
  <rect x="20" y="94" width="540" height="34" rx="4" fill="#ffffff" stroke="#c8d2dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="40" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="116" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">空串：0 段 0、0 段 1 均 0 的倍数</text>
  <text x="312" y="116" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="450" y="116" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">ε（空）</text>

  <!-- row 1 -->
  <rect x="20" y="130" width="540" height="34" rx="4" fill="#fbfcfd" stroke="#c8d2dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="40" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="152" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">f[1-1]=f[0]（追加 1 个 1）</text>
  <text x="312" y="152" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="450" y="152" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>

  <!-- row 2 -->
  <rect x="20" y="166" width="540" height="34" rx="4" fill="#ffffff" stroke="#c8d2dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="40" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="188" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">f[1] + f[0] = 1+1</text>
  <text x="312" y="188" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="450" y="188" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">11, 00</text>

  <!-- row 3 -->
  <rect x="20" y="202" width="540" height="34" rx="4" fill="#fbfcfd" stroke="#c8d2dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="40" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="190" y="224" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">f[2] + f[1] = 2+1</text>
  <text x="312" y="224" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="450" y="224" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">111, 001, 100</text>

  <!-- ans box -->
  <rect x="40" y="252" width="500" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="279" text-anchor="middle" font-size="14" fill="#2c4a22" font-weight="bold" filter="url(#rough2)">ans = f[2]+f[3] = 2+3 = 5 ✓ （i ∈ [minLength, maxLength]）</text>

  <!-- final list box -->
  <rect x="40" y="306" width="500" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="328" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">五个好串：00, 11, 001, 100, 111</text>
  <text x="290" y="344" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">每个 0 段长 ∈{2}（zeroGroup 倍），每个 1 段长 ∈{1,2,3}（oneGroup 倍）</text>

  <!-- legend -->
  <rect x="40" y="368" width="22" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="379" font-size="11" fill="#555" filter="url(#rough2)">绿=0 段</text>
  <rect x="150" y="368" width="22" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180" y="379" font-size="11" fill="#555" filter="url(#rough2)">蓝=1 段</text>
  <text x="280" y="379" font-size="11" fill="#b85450" filter="url(#rough2)">红字=f[i] 值</text>
</svg>
