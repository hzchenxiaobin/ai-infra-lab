<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG2" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG3" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid = [[3,1,2,2],[1,4,4,5],[2,4,2,2],[2,4,2,2]]</text>

  <!-- ===== Top: 4x4 grid, cell=38, x0=46, y0=48 ===== -->
  <!-- Row 0 [3,1,2,2] blue -->
  <rect x="46" y="48" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="73" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="84" y="48" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="103" y="73" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="122" y="48" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="141" y="73" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="48" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="73" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <!-- Row 1 [1,4,4,5] orange -->
  <rect x="46" y="86" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="111" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="84" y="86" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="103" y="111" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="122" y="86" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="141" y="111" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="160" y="86" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="111" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <!-- Row 2 [2,4,2,2] green -->
  <rect x="46" y="124" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="65" y="149" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="124" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="103" y="149" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="122" y="124" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="141" y="149" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="124" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="149" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <!-- Row 3 [2,4,2,2] green (same as row2) -->
  <rect x="46" y="162" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="65" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="162" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="103" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="122" y="162" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="141" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="162" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- row labels -->
  <text x="40" y="73" text-anchor="end" font-size="10" fill="#888">R₀</text>
  <text x="40" y="111" text-anchor="end" font-size="10" fill="#888">R₁</text>
  <text x="40" y="149" text-anchor="end" font-size="10" fill="#888">R₂</text>
  <text x="40" y="187" text-anchor="end" font-size="10" fill="#888">R₃</text>

  <!-- ===== rowMap box (top-right) ===== -->
  <rect x="290" y="50" width="230" height="120" fill="#fff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="72" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">① rowMap：行序列 → 次数</text>
  <line x1="302" y1="80" x2="508" y2="80" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="306" y="100" font-size="11.5" fill="#446688">[3,1,2,2]</text>
  <text x="500" y="100" text-anchor="end" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="306" y="124" font-size="11.5" fill="#d6a040">[1,4,4,5]</text>
  <text x="500" y="124" text-anchor="end" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="306" y="148" font-size="11.5" fill="#4a7a3a">[2,4,2,2]</text>
  <text x="500" y="148" text-anchor="end" font-size="12" fill="#333" font-weight="bold">2 ← R₂=R₃ 合并</text>

  <!-- arrow grid -> rowMap -->
  <path d="M 198 105 C 230 105, 255 105, 286 110" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG2)" filter="url(#rough2)"/>
  <text x="242" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">逐行序列化入表</text>

  <!-- ===== Phase 2: column queries ===== -->
  <text x="40" y="232" font-size="12.5" fill="#d6a040" font-weight="bold">② 逐列序列化 → 查 rowMap → 累加 ans</text>

  <!-- C0 = [3,1,2,2] -> +1 (hit, green) -->
  <text x="40" y="258" font-size="11" fill="#888">C₀</text>
  <rect x="60" y="246" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="73" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="86" y="246" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="99" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="112" y="246" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="138" y="246" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="151" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <path d="M 170 258 L 250 258" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG2)" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a">命中 [3,1,2,2]</text>
  <rect x="420" y="246" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="445" y="263" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- C1 = [1,4,4,4] -> 0 (miss) -->
  <text x="40" y="294" font-size="11" fill="#888">C₁</text>
  <rect x="60" y="282" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="73" y="299" text-anchor="middle" font-size="12" fill="#888">1</text>
  <rect x="86" y="282" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="99" y="299" text-anchor="middle" font-size="12" fill="#888">4</text>
  <rect x="112" y="282" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="125" y="299" text-anchor="middle" font-size="12" fill="#888">4</text>
  <rect x="138" y="282" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="151" y="299" text-anchor="middle" font-size="12" fill="#888">4</text>
  <path d="M 170 294 L 250 294" stroke="#888" stroke-width="1.4" marker-end="url(#arrG3)" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="11.5" fill="#b85450">未命中（末位 4≠5）</text>
  <rect x="420" y="282" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="445" y="299" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">+0</text>

  <!-- C2 = [2,4,2,2] -> +2 (hit x2, green) -->
  <text x="40" y="330" font-size="11" fill="#888">C₂</text>
  <rect x="60" y="318" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="73" y="335" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="86" y="318" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="99" y="335" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="112" y="318" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="335" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="138" y="318" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="151" y="335" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <path d="M 170 330 L 250 330" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG2)" filter="url(#rough2)"/>
  <text x="300" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a">命中 [2,4,2,2]，计数=2</text>
  <rect x="420" y="318" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="445" y="335" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+2</text>

  <!-- C3 = [2,5,2,2] -> 0 (miss) -->
  <text x="40" y="366" font-size="11" fill="#888">C₃</text>
  <rect x="60" y="354" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="73" y="371" text-anchor="middle" font-size="12" fill="#888">2</text>
  <rect x="86" y="354" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="99" y="371" text-anchor="middle" font-size="12" fill="#888">5</text>
  <rect x="112" y="354" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="125" y="371" text-anchor="middle" font-size="12" fill="#888">2</text>
  <rect x="138" y="354" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="151" y="371" text-anchor="middle" font-size="12" fill="#888">2</text>
  <path d="M 170 366 L 250 366" stroke="#888" stroke-width="1.4" marker-end="url(#arrG3)" filter="url(#rough2)"/>
  <text x="300" y="370" text-anchor="middle" font-size="11.5" fill="#b85450">未命中（次位 5≠4）</text>
  <rect x="420" y="354" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="445" y="371" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">+0</text>

  <!-- ans total -->
  <path d="M 40 402 L 520 402" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="430" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = 1 + 0 + 2 + 0 = 3</text>
  <text x="300" y="450" text-anchor="middle" font-size="11.5" fill="#888">C₀↔R₀、C₂↔R₂、C₂↔R₃ 三对相等行列对</text>
</svg>
