<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：energy = [5, 2, −10, −5, 1]，k = 3，n = 5</text>
  <text x="260" y="44" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">倒序 i = 4 → 0；「energy[i]」一列是原值，改写后即为 dp[i]</text>

  <!-- row highlights -->
  <rect x="40" y="58" width="440" height="26" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="40" y="186" width="440" height="34" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- table lines -->
  <path d="M 40 58 L 480 58 M 40 84 L 480 84 M 40 118 L 480 118 M 40 152 L 480 152 M 40 186 L 480 186 M 40 220 L 480 220 M 40 254 L 480 254" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 40 58 L 40 254 M 80 58 L 80 254 M 150 58 L 150 254 M 240 58 L 240 254 M 380 58 L 380 254 M 480 58 L 480 254" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- header -->
  <text x="60" y="75" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i ↓</text>
  <text x="115" y="75" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i + k</text>
  <text x="195" y="75" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">energy[i] 原值</text>
  <text x="310" y="75" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i] = energy[i] + dp[i+k]</text>
  <text x="420" y="75" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row i=4 -->
  <text x="60" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="115" y="105" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">7 ≥ 5</text>
  <text x="195" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="310" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1（链尾，dp[7]=0）</text>
  <text x="420" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- row i=3 -->
  <text x="60" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="115" y="139" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">6 ≥ 5</text>
  <text x="195" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−5</text>
  <text x="310" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−5（链尾）</text>
  <text x="420" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- row i=2 -->
  <text x="60" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="115" y="173" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">5 ≥ 5</text>
  <text x="195" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−10</text>
  <text x="310" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−10（链尾）</text>
  <text x="420" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- row i=1 (answer row) -->
  <text x="60" y="207" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="115" y="207" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 &lt; 5 ✓</text>
  <text x="195" y="207" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="310" y="207" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2 + dp[4] = 2 + 1 = 3</text>
  <text x="420" y="207" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ★</text>

  <!-- row i=0 -->
  <text x="60" y="241" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="115" y="241" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3 &lt; 5 ✓</text>
  <text x="195" y="241" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="310" y="241" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 + dp[3] = 5 + (−5) = 0</text>
  <text x="420" y="241" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- notes below table -->
  <text x="40" y="274" font-size="10" fill="#555" filter="url(#rough2)">链尾（i + k ≥ n）直接取原值；其余位置一步拼出自己的后缀和</text>
  <text x="40" y="292" font-size="10" fill="#2f5d24" filter="url(#rough2)">绿色行：dp[1] = 2 + dp[4] = 3，刷新全局最大值 ★</text>

  <!-- bottom note -->
  <rect x="12" y="306" width="496" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">答案 3：从魔法师 1 出发，先吸 2 → 传送到 4 再吸 1</text>
  <text x="260" y="343" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">⚠️ 不能吸完 2 就收手：诅咒强制跳到底，这正是与 53（Kadane）的分野</text>
</svg>
