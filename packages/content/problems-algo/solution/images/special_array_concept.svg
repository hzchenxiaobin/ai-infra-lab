<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,3 L8,3" fill="none" stroke="#446688" stroke-width="1.5"/>
      <path d="M6,0 L9,3 L6,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后 cnt(x) 单调递减，找 cnt(x) == x 的交点</text>

  <!-- Step 1: original array -->
  <text x="60" y="62" text-anchor="start" font-size="11" fill="#888" font-weight="bold">原数组</text>
  <rect x="100" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="67" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <rect x="140" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="67" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">4</text>
  <rect x="180" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="67" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">3</text>
  <rect x="220" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="67" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <rect x="260" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">4</text>

  <!-- Sort arrow -->
  <path d="M 320 62 L 360 62" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="340" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">排序</text>

  <!-- Step 2: sorted array -->
  <text x="380" y="62" text-anchor="start" font-size="11" fill="#888" font-weight="bold">升序</text>
  <rect x="420" y="48" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="67" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <rect x="460" y="48" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="67" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <rect x="500" y="48" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="67" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">3</text>

  <!-- sorted row 2 (wrapped) -->
  <rect x="460" y="86" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="105" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">4</text>
  <rect x="500" y="86" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="105" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">4</text>

  <!-- Monotonicity curve area -->
  <rect x="40" y="140" width="480" height="180" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">枚举 x ∈ [0, n]，cnt(x) = 大于等于 x 的元素个数</text>

  <!-- mini table: x | cnt(x) | match? -->
  <text x="80" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="160" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt(x)</text>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt == x ?</text>
  <line x1="50" y1="196" x2="320" y2="196" stroke="#446688" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="80" y="214" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">5</text>
  <text x="160" y="214" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0</text>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <text x="80" y="232" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">4</text>
  <text x="160" y="232" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <text x="80" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">3</text>
  <text x="160" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">3</text>
  <rect x="230" y="238" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是 ✓</text>

  <text x="80" y="268" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <text x="160" y="268" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">3</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <text x="80" y="286" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <text x="160" y="286" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">3</text>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Right side: monotonicity note -->
  <rect x="350" y="200" width="160" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="222" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">单调性关键</text>
  <line x1="370" y1="230" x2="490" y2="230" stroke="#d6a040" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="430" y="246" text-anchor="middle" font-size="10" fill="#555">x 递增 ↑</text>
  <text x="430" y="262" text-anchor="middle" font-size="10" fill="#555">cnt(x) 递减 ↓</text>
  <text x="430" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">交点唯一 → 解唯一</text>

  <!-- Bottom note -->
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#888">cnt(x) = n − bisect_left(nums, x)；x 只需枚举 0..n（cnt 不超过 n）</text>
</svg>
