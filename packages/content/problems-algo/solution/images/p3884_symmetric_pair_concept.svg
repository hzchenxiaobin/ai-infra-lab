<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：i 与 n−1−i 是一对"镜像搭档"</text>
  <text x="260" y="34" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 s = "abcacbd"，n = 7</text>

  <!-- string cells: 7 cells, width 40, x from 120 -->
  <rect x="120" y="92" width="40" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="92" width="40" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="200" y="92" width="40" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="92" width="40" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="280" y="92" width="40" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="92" width="40" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="360" y="92" width="40" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="119" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="180" y="119" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="220" y="119" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="260" y="119" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="300" y="119" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="340" y="119" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="380" y="119" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="140" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="180" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="220" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">3←中点</text>
  <text x="300" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="340" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="380" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>

  <!-- pairing arcs -->
  <path d="M 140 88 Q 260 44 380 88" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=0：s[0]='a' vs s[6]='d' ✗</text>
  <path d="M 180 88 Q 260 68 340 88" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">i=1：'b' vs 'b' ✓ 命中！</text>

  <!-- pointers -->
  <path d="M 140 160 Q 140 174 148 174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="184" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i（左指针）</text>
  <text x="400" y="184" text-anchor="start" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">j = n−1−i（右指针）</text>
  <path d="M 380 160 Q 380 174 372 174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- result strip -->
  <rect x="56" y="200" width="408" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">i、j 同步向中间收拢，第一对相等即答案 → 返回 1</text>

  <!-- rules box -->
  <rect x="30" y="258" width="282" height="126" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="280" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">三条观察</text>
  <text x="42" y="300" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">① 配对 (i, n−1−i) 关于中点对称；i 过了</text>
  <text x="42" y="314" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">   中点就开始重复旧对 ⟹ 只扫前半 + 中点</text>
  <text x="42" y="332" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">② 奇数长度时中点 i = n//2 处 n−1−i = i，</text>
  <text x="42" y="346" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">   s[i] 和自己比恒相等 ⟹ 答案 ≤ n//2，</text>
  <text x="42" y="360" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">   奇数长度永远有解（示例 2 "abc" → 1）</text>
  <text x="42" y="378" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">③ 偶数长度扫完前半无命中才返回 −1</text>

  <!-- loop box -->
  <rect x="325" y="258" width="165" height="126" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="280" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">扫描范围</text>
  <text x="335" y="300" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">i ∈ [0, ⌊(n−1)/2⌋]</text>
  <text x="335" y="316" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">至多 ⌈n/2⌉ 次比较</text>
  <text x="335" y="332" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">n=7：i = 0,1,2,3</text>
  <text x="335" y="348" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">n=6：i = 0,1,2</text>
  <text x="335" y="366" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">时间 O(n) 空间 O(1)</text>
  <text x="335" y="380" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">无需任何额外数据结构</text>
</svg>
