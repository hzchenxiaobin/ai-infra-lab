<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：计数 1 → 均分三组 → 乘法原理</text>

  <!-- ===== 步骤1：统计 1 的总数 ===== -->
  <rect x="60" y="46" width="440" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333">① 遍历 s，统计 '1' 的总数 m</text>
  <path d="M 280 84 L 280 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 判断：m % 3 != 0 ===== -->
  <polygon points="280,98 400,138 280,178 160,138" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333">m % 3 != 0 ?</text>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#888">1 的总数能否均分三份</text>

  <!-- 是 → 返回 0 -->
  <path d="M 400 138 L 470 138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="130" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="470" y="124" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="505" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 0</text>

  <!-- 否 ↓ -->
  <path d="M 280 178 L 280 188" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="186" font-size="10" fill="#4a7a3a">否</text>

  <!-- ===== 判断：m == 0 ===== -->
  <polygon points="280,192 400,232 280,272 160,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#333">m == 0 ?</text>
  <text x="280" y="246" text-anchor="middle" font-size="10" fill="#888">全 0 串特例</text>

  <!-- 是 → C(n-1,2) -->
  <path d="M 400 232 L 470 232" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="224" text-anchor="middle" font-size="10" fill="#d6a040">是</text>
  <rect x="448" y="218" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="494" y="234" text-anchor="middle" font-size="10" fill="#d6a040">return</text>
  <text x="494" y="248" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">(n−1)(n−2)/2</text>

  <!-- 否 ↓ -->
  <path d="M 280 272 L 280 282" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="280" font-size="10" fill="#4a7a3a">否</text>

  <!-- ===== 步骤2：收集 1 的位置 ===== -->
  <rect x="60" y="286" width="440" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333">② 收集所有 '1' 的下标 p[0..m−1]，令 k = m / 3</text>
  <path d="M 280 324 L 280 334" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤3：算两组间隙 ===== -->
  <rect x="60" y="338" width="210" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="165" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 第一刀可选数</text>
  <text x="165" y="378" text-anchor="middle" font-size="12" fill="#333">x = p[k] − p[k−1]</text>

  <rect x="290" y="338" width="210" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="395" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ 第二刀可选数</text>
  <text x="395" y="378" text-anchor="middle" font-size="12" fill="#333">y = p[2k] − p[2k−1]</text>

  <path d="M 165 388 L 165 408 L 280 408" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 395 388 L 395 408 L 280 408" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤4：乘法原理 ===== -->
  <rect x="120" y="412" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">⑤ return (x × y) % MOD</text>

  <text x="280" y="468" text-anchor="middle" font-size="10" fill="#888">两刀独立 → 乘法原理；MOD = 10⁹ + 7</text>
</svg>
