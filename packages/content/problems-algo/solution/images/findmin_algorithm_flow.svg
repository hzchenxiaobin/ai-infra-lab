<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">寻找旋转排序数组最小值 · 流程</text>

  <!-- start box -->
  <rect x="170" y="46" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#333">left = 0, right = n − 1</text>

  <path d="M260 88 L260 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop decision diamond -->
  <polygon points="260,112 350,160 260,208 170,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">left &lt; right ?</text>
  <text x="260" y="172" text-anchor="middle" font-size="10" fill="#888">（区间是否 &gt; 1 个元素）</text>

  <!-- No branch -> return -->
  <path d="M350 160 L420 160" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="152" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="420" y="140" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="465" y="165" text-anchor="middle" font-size="11" fill="#333">return</text>
  <text x="465" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums[left]</text>

  <!-- Yes branch down -->
  <path d="M260 208 L260 228" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="222" font-size="10.5" fill="#b85450" font-weight="bold">是</text>

  <!-- mid box -->
  <rect x="150" y="232" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="11.5" fill="#333">mid = left + (right − left) / 2</text>

  <path d="M260 272 L260 292" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <polygon points="260,296 360,344 260,392 160,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[mid] &lt; nums[right] ?</text>

  <!-- Yes (left) -> right = mid, loop back -->
  <path d="M160 344 L110 344 L110 70 L170 70" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="336" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="50" y="300" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">right = mid</text>

  <!-- No (right) -> left = mid+1, loop back -->
  <path d="M360 344 L410 344 L410 70 L350 70" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="336" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="370" y="300" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">left = mid + 1</text>

  <text x="260" y="424" text-anchor="middle" font-size="10" fill="#aaa">两支均回到循环顶，区间每轮折半</text>
</svg>
