<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DP 状态转移：下一取值 v 两分支（刷新 / 保持）</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">源状态 (i, j, c) → 填 v ∈ [1, m] → 严格大于则刷新，否则保持</text>

  <!-- source state -->
  <rect x="150" y="58" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">源状态 dp[i][j][c]</text>
  <text x="270" y="94" text-anchor="middle" font-size="10" fill="#666">已填 i 位 · 当前最大值 j · 代价 c</text>
  <path d="M 270 104 L 270 122" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="270,124 380,166 270,208 160,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#333">下一取值 v ∈ [1, m]</text>
  <text x="270" y="178" text-anchor="middle" font-size="11" fill="#333">v 与 j 比大小</text>

  <!-- branch labels -->
  <text x="120" y="158" font-size="11" fill="#b85450" font-weight="bold">v &gt; j</text>
  <path d="M 160 166 L 100 166 L 100 224" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="412" y="158" font-size="11" fill="#4a7a3a" font-weight="bold">v ≤ j</text>
  <path d="M 380 166 L 440 166 L 440 224" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- Case A: refresh -->
  <rect x="20" y="226" width="220" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="130" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A：刷新最大值</text>
  <g font-size="11">
    <rect x="40" y="260" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="57" y="275" text-anchor="middle" fill="#b85450" font-weight="bold">v</text>
    <path d="M 76 271 L 108 271" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
    <rect x="110" y="260" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="130" y="275" text-anchor="middle" fill="#333">max=v</text>
    <rect x="170" y="260" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="187" y="275" text-anchor="middle" fill="#b85450" font-weight="bold">c+1</text>
  </g>
  <text x="130" y="306" text-anchor="middle" font-size="10" fill="#333">新最大值 = v，代价 +1</text>
  <text x="130" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[i+1][v][c+1] += cur</text>
  <text x="130" y="350" text-anchor="middle" font-size="10" fill="#888">需 c+1 ≤ k，否则丢弃</text>
  <text x="130" y="366" text-anchor="middle" font-size="9" fill="#888">首位 v &gt; 0（哨兵）必走此支</text>

  <!-- Case B: keep -->
  <rect x="300" y="226" width="220" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="410" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B：保持最大值</text>
  <g font-size="11">
    <rect x="320" y="260" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="337" y="275" text-anchor="middle" fill="#4a7a3a" font-weight="bold">v</text>
    <path d="M 356 271 L 388 271" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
    <rect x="390" y="260" width="40" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="410" y="275" text-anchor="middle" fill="#666">max=j</text>
    <rect x="450" y="260" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="467" y="275" text-anchor="middle" fill="#4a7a3a" font-weight="bold">c</text>
  </g>
  <text x="410" y="306" text-anchor="middle" font-size="10" fill="#333">v ≤ j，最大值与代价不变</text>
  <text x="410" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp[i+1][j][c] += cur</text>
  <text x="410" y="350" text-anchor="middle" font-size="10" fill="#888">取值 v ∈ [1, j] 共 j 个</text>
  <text x="410" y="366" text-anchor="middle" font-size="9" fill="#888">前缀和优化：× j 合并</text>

  <!-- merge arrows -->
  <path d="M 130 380 L 130 402 L 270 402" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 410 380 L 410 402 L 270 402" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 402 L 270 418" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="110" y="420" width="320" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="270" y="443" text-anchor="middle" font-size="12" fill="#333">答案 = Σ dp[n][j][k]，j ∈ [1, m]</text>
</svg>
