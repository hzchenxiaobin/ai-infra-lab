<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：特判 k = 1，二分求 f(n)，前缀相减 f(r) − f(l−1)</text>

  <!-- ===== left flow ===== -->
  <rect x="36" y="40" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 输入 l, r, k</text>
  <text x="156" y="72" text-anchor="middle" font-size="9.5" fill="#555">0 ≤ l ≤ r ≤ 10⁹，1 ≤ k ≤ 30</text>
  <path d="M 156 78 L 156 90" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="156,94 218,122 156,150 94,122" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="126" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">k == 1 ?</text>
  <path d="M 218 122 L 296 122" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="255" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 156 150 L 156 162" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="169" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="36" y="166" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="189" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 定义 f(n) = #{y ≤ n : y 是幂}</text>
  <path d="M 156 202 L 156 214" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="156,218 218,246 156,274 94,246" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="250" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">n &lt; 0 ?</text>
  <path d="M 218 246 L 296 246" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="255" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 156 274 L 156 286" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="169" y="284" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="36" y="290" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="309" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⑤ 二分 x ∈ [0, 31623]</text>
  <text x="156" y="326" text-anchor="middle" font-size="9.5" fill="#555">找最大 x 使 x^k ≤ n；C++ 判 p &gt; n/mid 防溢出</text>
  <path d="M 156 340 L 156 352" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="36" y="356" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="379" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⑥ f(n) = x_max + 1</text>
  <text x="156" y="391" text-anchor="middle" font-size="9" fill="#888">+1 记 x = 0 的 0 = 0^k</text>
  <path d="M 156 394 L 156 406" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="36" y="410" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="156" y="434" text-anchor="middle" font-size="12.5" fill="#2f5e23" font-weight="bold">⑦ ans = f(r) − f(l−1)</text>

  <!-- ===== right branch boxes ===== -->
  <rect x="300" y="100" width="228" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="414" y="118" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">②a ans = r − l + 1</text>
  <text x="414" y="134" text-anchor="middle" font-size="9.5" fill="#8a3a36">幂表 = 全体非负整数，上界 31623 失效</text>

  <rect x="300" y="224" width="228" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="414" y="242" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">④a 返回 0</text>
  <text x="414" y="258" text-anchor="middle" font-size="9.5" fill="#8a3a36">覆盖 l = 0 时的 f(−1)</text>

  <!-- ===== right example panel ===== -->
  <rect x="300" y="288" width="228" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="414" y="308" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">示例演算：l = 1, r = 9, k = 3</text>
  <text x="314" y="328" font-size="10" fill="#444">f(9)：2³ = 8 ≤ 9 &lt; 27 = 3³</text>
  <text x="314" y="344" font-size="10" fill="#444">　 → x_max = 2，f(9) = 3（幂 0,1,8）</text>
  <text x="314" y="362" font-size="10" fill="#444">f(0)：x_max = 0，f(0) = 1（幂 0）</text>
  <text x="314" y="384" font-size="11.5" fill="#2f5e23" font-weight="bold">ans = 3 − 1 = 2 ✓</text>

  <!-- ===== right edge case panel ===== -->
  <rect x="300" y="412" width="228" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="314" y="432" font-size="11.5" fill="#a87020" font-weight="bold">边界自检</text>
  <text x="314" y="450" font-size="9.5" fill="#444">k = 1 → r − l + 1；l = 0 → f(−1) = 0</text>
  <text x="314" y="466" font-size="9.5" fill="#444">0 = 0^k 计入；勿信 pow(n, 1/k) 直接取整</text>

  <text x="280" y="490" text-anchor="middle" font-size="10.5" fill="#8899aa">总代价：2 次二分 × 约 15 步 × k ≤ 30 次乘法 ≈ 千次运算以内</text>
</svg>
