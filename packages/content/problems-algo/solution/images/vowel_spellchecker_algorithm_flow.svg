<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建表阶段 + 查询阶段</text>

  <!-- ===== 阶段一：建表 ===== -->
  <rect x="30" y="42" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段一：遍历 wordlist 建三张表</text>

  <line x1="150" y1="74" x2="150" y2="88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="90" width="220" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="109" text-anchor="middle" font-size="11" fill="#333">对每个 word（按出现顺序）：</text>

  <line x1="150" y1="120" x2="150" y2="132" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="134" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="152" font-size="11" fill="#333"><tspan font-weight="bold" fill="#4a7a3a">①</tspan> exact[word] = word（覆盖亦无妨）</text>

  <line x1="150" y1="162" x2="150" y2="170" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="172" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="190" font-size="11" fill="#333"><tspan font-weight="bold" fill="#d6a040">②</tspan> low = lower(word)</text>
  <text x="60" y="200" font-size="10" fill="#555">若 low 不在 case 表：case[low] = word</text>

  <line x1="150" y1="204" x2="150" y2="212" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="214" width="220" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="232" font-size="11" fill="#333"><tspan font-weight="bold" fill="#b85450">③</tspan> vow = low 中元音→'*'</text>
  <text x="60" y="242" font-size="10" fill="#555">若 vow 不在 vowel 表：vowel[vow] = word</text>

  <text x="150" y="262" text-anchor="middle" font-size="10" fill="#888">⚠ ②③ 只存「首次出现」，保证优先返回最早的 word</text>

  <!-- ===== 阶段二：查询 ===== -->
  <rect x="310" y="42" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段二：对每个 query 依次查表</text>

  <line x1="430" y1="74" x2="430" y2="88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 决策菱形：精确命中？ -->
  <polygon points="430,92 510,122 430,152 350,122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="119" text-anchor="middle" font-size="10" fill="#333">exact[query]</text>
  <text x="430" y="132" text-anchor="middle" font-size="10" fill="#333">存在?</text>

  <!-- yes 分支 -->
  <line x1="510" y1="122" x2="540" y2="122" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="525" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="510" y="100" width="0" height="0" fill="none"/>
  <text x="556" y="126" font-size="10" fill="#4a7a3a" font-weight="bold">→ 返回</text>
  <text x="556" y="138" font-size="10" fill="#4a7a3a">exact[query]</text>

  <!-- no 分支 -->
  <line x1="430" y1="152" x2="430" y2="168" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="162" font-size="10" fill="#888">否</text>

  <polygon points="430,170 510,200 430,230 350,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="197" text-anchor="middle" font-size="10" fill="#333">case[lower(q)]</text>
  <text x="430" y="210" text-anchor="middle" font-size="10" fill="#333">存在?</text>

  <line x1="510" y1="200" x2="540" y2="200" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="525" y="194" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <text x="556" y="204" font-size="10" fill="#d6a040" font-weight="bold">→ 返回</text>
  <text x="556" y="216" font-size="10" fill="#d6a040">case[low]</text>

  <line x1="430" y1="230" x2="430" y2="248" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="242" font-size="10" fill="#888">否</text>

  <polygon points="430,250 510,280 430,310 350,280" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="277" text-anchor="middle" font-size="10" fill="#333">vowel[vow(q)]</text>
  <text x="430" y="290" text-anchor="middle" font-size="10" fill="#333">存在?</text>

  <line x1="510" y1="280" x2="540" y2="280" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="525" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="556" y="284" font-size="10" fill="#b85450" font-weight="bold">→ 返回</text>
  <text x="556" y="296" font-size="10" fill="#b85450">vowel[vow]</text>

  <line x1="430" y1="310" x2="430" y2="328" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="322" font-size="10" fill="#888">否</text>

  <rect x="370" y="330" width="120" height="28" fill="#eeeeee" stroke="#888" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="349" text-anchor="middle" font-size="11" fill="#555">→ 返回 ""</text>

  <!-- ===== 关键 ===== -->
  <rect x="30" y="392" width="520" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="412" font-size="11" fill="#4a7a3a" font-weight="bold">流程要点：</text>
  <text x="44" y="430" font-size="10" fill="#555">建表 O(Σ|w|)，查询每次三次 O(1) 哈希查找；优先级由「先查先返」天然保证</text>
  <text x="44" y="444" font-size="10" fill="#555">元音通配键：lower 后把每个 a/e/i/o/u 替换为 '*'，辅音位保留 → 同型词归一</text>
</svg>
