<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 548"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：cczazcc 与 aababab</text>

  <!-- ===== Example 1 ===== -->
  <text x="280" y="52" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">例 1：s = "cczazcc"，repeatLimit = 3</text>
  <text x="40" y="74" font-size="10.5" fill="#888">计数：z×2  c×4  a×1</text>

  <!-- Step 1: zz -->
  <text x="40" y="102" font-size="10.5" fill="#888">步骤1</text>
  <rect x="80" y="86" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="108" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">zz</text>
  <text x="150" y="106" font-size="10.5" fill="#446688">取 z，t=min(2,3)=2；z→0</text>
  <text x="470" y="106" font-size="10.5" fill="#4a7a3a" font-weight="bold">z 归零</text>

  <!-- Step 2: ccc -->
  <text x="40" y="138" font-size="10.5" fill="#888">步骤2</text>
  <rect x="80" y="122" width="84" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="122" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ccc</text>
  <text x="178" y="142" font-size="10.5" fill="#446688">取 c，t=min(4,3)=3；c→1</text>
  <text x="470" y="142" font-size="10.5" fill="#b85450" font-weight="bold">c 仍剩1</text>

  <!-- Step 2b: separator a -->
  <text x="40" y="174" font-size="10.5" fill="#888">间隔</text>
  <rect x="80" y="158" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="94" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <text x="122" y="178" font-size="10.5" fill="#b85450">c 有剩余 → 插次大 a；a→0</text>
  <text x="470" y="178" font-size="10.5" fill="#4a7a3a" font-weight="bold">打断</text>

  <!-- Step 3: c -->
  <text x="40" y="210" font-size="10.5" fill="#888">步骤3</text>
  <rect x="80" y="194" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="94" y="214" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="122" y="214" font-size="10.5" fill="#446688">回到 c，t=min(1,3)=1；c→0</text>
  <text x="470" y="214" font-size="10.5" fill="#4a7a3a" font-weight="bold">c 归零</text>

  <!-- result 1 -->
  <rect x="80" y="232" width="400" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">拼接：zz + ccc + a + c = "zzcccac" ✓</text>

  <!-- divider -->
  <line x1="40" y1="276" x2="520" y2="276" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">例 2：s = "aababab"，repeatLimit = 2</text>
  <text x="40" y="322" font-size="10.5" fill="#888">计数：b×3  a×4</text>

  <!-- Step 1: bb -->
  <text x="40" y="350" font-size="10.5" fill="#888">步骤1</text>
  <rect x="80" y="334" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="108" y="354" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">bb</text>
  <text x="150" y="354" font-size="10.5" fill="#446688">取 b，t=min(3,2)=2；b→1</text>
  <text x="470" y="354" font-size="10.5" fill="#b85450" font-weight="bold">b 仍剩1</text>

  <!-- Step 1b: separator a -->
  <text x="40" y="386" font-size="10.5" fill="#888">间隔</text>
  <rect x="80" y="370" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="94" y="390" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <text x="122" y="390" font-size="10.5" fill="#b85450">b 有剩余 → 插次大 a；a→3</text>
  <text x="470" y="390" font-size="10.5" fill="#4a7a3a" font-weight="bold">打断</text>

  <!-- Step 2: b -->
  <text x="40" y="422" font-size="10.5" fill="#888">步骤2</text>
  <rect x="80" y="406" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="94" y="426" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="122" y="426" font-size="10.5" fill="#446688">回到 b，t=min(1,2)=1；b→0</text>
  <text x="470" y="426" font-size="10.5" fill="#4a7a3a" font-weight="bold">b 归零</text>

  <!-- Step 3: aa + stop -->
  <text x="40" y="458" font-size="10.5" fill="#888">步骤3</text>
  <rect x="80" y="442" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="108" y="462" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">aa</text>
  <text x="150" y="462" font-size="10.5" fill="#446688">取 a，t=min(3,2)=2；a→1</text>
  <text x="470" y="462" font-size="10.5" fill="#b85450" font-weight="bold">a 仍剩1</text>

  <!-- stop note -->
  <rect x="80" y="478" width="400" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3 2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="495" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">a 需间隔但无更小字符 → 丢弃剩余 1 个 a，结束</text>

  <!-- result 2 -->
  <rect x="80" y="512" width="400" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="530" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">拼接：bb + a + b + aa = "bbabaa" ✓</text>
</svg>
