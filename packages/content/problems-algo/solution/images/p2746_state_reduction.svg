<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">状态压缩：只需记录首尾两个字符</text>

  <!-- long string representation -->
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">已拼串 str：内部字符再不参与未来删除</text>

  <!-- first char box (highlighted) -->
  <rect x="70" y="80" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="93" y="111" text-anchor="middle" font-size="18" fill="#224" filter="url(#rough2)">f</text>
  <text x="93" y="146" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">首字符</text>

  <!-- middle ellipsis boxes -->
  <rect x="124" y="80" width="40" height="46" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="144" y="111" text-anchor="middle" font-size="16" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="170" y="80" width="40" height="46" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="111" text-anchor="middle" font-size="16" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="216" y="80" width="40" height="46" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="236" y="111" text-anchor="middle" font-size="16" fill="#bbb" filter="url(#rough2)">·</text>
  <text x="246" y="146" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">内部（可丢）</text>

  <!-- last char box (highlighted) -->
  <rect x="362" y="80" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="385" y="111" text-anchor="middle" font-size="18" fill="#243" filter="url(#rough2)">l</text>
  <text x="385" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">尾字符</text>

  <!-- arrow down -->
  <path d="M260,168 L260,202" stroke="#446688" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="270" y="190" font-size="11" fill="#888" filter="url(#rough2)">压缩状态</text>

  <!-- state box -->
  <rect x="90" y="216" width="340" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="14" fill="#5a3a10" filter="url(#rough2)">状态 = (首 f, 尾 l)</text>
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#5a3a10" filter="url(#rough2)">dp[f][l] = 此状态下最小长度</text>
  <text x="260" y="282" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">共 26 × 26 = 676 个状态</text>

  <!-- arrow down -->
  <path d="M260,298 L260,332" stroke="#446688" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- reasoning box -->
  <rect x="50" y="342" width="420" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="13" fill="#7a3a3a" filter="url(#rough2)">未来拼接只碰两端 → 内部字符可整体丢弃</text>
</svg>
