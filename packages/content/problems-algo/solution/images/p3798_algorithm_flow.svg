<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟反向查找最后一个 '2'，取其前缀</text>

  <!-- 开始 -->
  <ellipse cx="280" cy="50" rx="42" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">开始</text>

  <path d="M 280 67 L 280 84" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- rfind -->
  <rect x="195" y="88" width="170" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">pos = s.rfind('2')</text>

  <path d="M 280 122 L 280 140" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,142 355,172 280,202 205,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">找到 '2' ?</text>
  <text x="280" y="184" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">(pos 有效吗)</text>

  <!-- 否分支 -->
  <path d="M 205 172 L 148 172" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="176" y="163" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">无</text>
  <rect x="30" y="152" width="118" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="89" y="170" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">全串无 '2'</text>
  <text x="89" y="185" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ""</text>

  <!-- 是分支 -->
  <path d="M 355 172 L 408 172" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="382" y="163" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">有</text>
  <rect x="412" y="152" width="122" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="473" y="170" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">保留最后一个 '2'</text>
  <text x="473" y="185" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">返回 s[0..pos]</text>

  <!-- 演示面板 -->
  <rect x="20" y="218" width="520" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="36" y="240" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">演示：s = "1112"（从右往左扫，第一个碰到的 '2' 就是最后一个 '2'）</text>

  <rect x="60" y="252" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="96" y="252" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="132" y="252" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="168" y="252" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="76" y="273" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="112" y="273" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="148" y="273" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="184" y="273" text-anchor="middle" font-size="12.5" fill="#2d5a24" filter="url(#rough2)">2</text>

  <!-- 反向扫描弧线 -->
  <path d="M 214 268 C 236 268, 236 258, 222 254" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="238" y="262" font-size="10" fill="#b85450" filter="url(#rough2)">← 从右往左扫</text>

  <text x="300" y="266" font-size="11" fill="#33506b" filter="url(#rough2)">pos = 3（下标从 0 计）</text>
  <text x="300" y="286" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">ans = s[0..3] = "1112" ✓</text>
  <text x="36" y="308" font-size="10" fill="#33506b" filter="url(#rough2)">反向扫描首个 '2' = 正向的最后一个 '2'：一趟 O(n)，与正向枚举每个 '2' 的 O(n²) 殊途同归</text>
</svg>
