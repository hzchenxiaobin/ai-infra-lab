<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次计数，频次超 2 即刻否决</text>

  <!-- step 1 -->
  <rect x="175" y="38" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">计数表清零 cnt[1..100]</text>

  <path d="M 260 72 L 260 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: loop -->
  <rect x="175" y="92" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">取出下一个元素 x</text>

  <path d="M 260 126 L 260 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3: increment -->
  <rect x="175" y="146" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">++cnt[x]</text>

  <path d="M 260 180 L 260 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 260 200 L 344 236 L 260 272 L 176 236 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="233" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt[x] &gt; 2 ?</text>
  <text x="260" y="251" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（第 3 个同值出现了）</text>

  <!-- yes -> false -->
  <path d="M 344 236 L 396 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="218" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="241" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- no -> loop back / end -->
  <path d="M 260 272 L 260 292" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="288" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <path d="M 260 296 L 344 330 L 260 364 L 176 330 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">nums 遍历完 ?</text>
  <text x="260" y="345" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（没有则回到取元素）</text>

  <path d="M 176 330 L 132 330 L 132 109 L 171 109" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <path d="M 266 368 L 294 378" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="266" y="362" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="300" y="362" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="352" y="384" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- side note -->
  <rect x="22" y="146" width="136" height="118" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="90" y="168" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">正确性两句话：</text>
  <text x="90" y="188" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">必要性：≥3 次</text>
  <text x="90" y="204" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">鸽巢必撞，无解；</text>
  <text x="90" y="224" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">充分性：≤2 次</text>
  <text x="90" y="240" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">一左一右必可构造。</text>
  <text x="90" y="256" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">故只看最大频次。</text>
</svg>
