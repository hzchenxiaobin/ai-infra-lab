<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算："(00011)" → t = "00011"，枚举 4 个切点</text>

  <!-- Split i=1: x="0" y="0011" -->
  <rect x="20" y="48" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=1: x="0" | y="0011"</text>

  <rect x="30" y="84" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"0" ✓</text>

  <rect x="100" y="84" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"0.011" ✓</text>

  <path d="M 60 108 L 90 132" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 145 108 L 120 132" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="55" y="134" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="110" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0, 0.011)</text>

  <!-- Split i=2: x="00" y="011" — no valid -->
  <rect x="210" y="48" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=2: x="00" | y="011"</text>

  <rect x="220" y="84" width="75" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="101" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">x: 无合法 ✓</text>
  <rect x="305" y="84" width="75" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="101" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">y: "0.11" ✓</text>

  <text x="300" y="120" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x 无合法 → 跳过此切点</text>

  <!-- Split i=3: x="000" y="11" — no valid x -->
  <rect x="400" y="48" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=3: x="000" | y="11"</text>

  <rect x="410" y="84" width="65" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="101" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">x: 无合法</text>
  <rect x="485" y="84" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="101" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">y:"11"✓</text>

  <text x="475" y="120" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x 无合法 → 跳过</text>

  <!-- Split i=4: x="0001" y="1" -->
  <rect x="120" y="170" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=4: x="0001" | y="1"</text>

  <rect x="130" y="206" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"0.001" ✓</text>

  <rect x="240" y="206" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"1" ✓</text>

  <path d="M 175 230 L 210 254" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 270 230 L 235 254" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="165" y="256" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="225" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0.001, 1)</text>

  <!-- Analysis box for "0001" -->
  <rect x="20" y="300" width="520" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">详细分析 x="0001" 的小数枚举：</text>
  <text x="40" y="338" font-size="10" fill="#444" filter="url(#rough2)">k=1: int="0"✓ frac="001" 末位1✓ → "0.001" ✓</text>
  <text x="40" y="352" font-size="10" fill="#b85450" filter="url(#rough2)">k=2: int="00" 前导0✗ → 跳过</text>
  <text x="40" y="366" font-size="10" fill="#b85450" filter="url(#rough2)">k=3: int="000" 前导0✗ → 跳过</text>

  <!-- Result -->
  <rect x="80" y="384" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终结果：["(0, 0.011)", "(0.001, 1)"]</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2、i=3 因 x 部无合法表示而被跳过</text>
</svg>
