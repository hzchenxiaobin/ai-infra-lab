<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：中心下标 i 满足 leftSum = rightSum = total − leftSum − nums[i]</text>

  <!-- index labels -->
  <text x="40" y="78" font-size="11" fill="#888">下标:</text>
  <text x="138" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="198" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="258" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="318" y="78" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="378" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">4</text>
  <text x="438" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">5</text>

  <text x="40" y="104" font-size="12" fill="#888">nums:</text>

  <!-- left part: idx 0..2 green -->
  <rect x="110" y="88" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="170" y="88" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="230" y="88" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- pivot: idx 3 orange/red emphasis -->
  <rect x="290" y="88" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="318" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">pivot i=3</text>

  <!-- right part: idx 4..5 blue -->
  <rect x="350" y="88" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="410" y="88" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="438" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- braces + sums -->
  <!-- left brace under 0..2 -->
  <path d="M 110 150 Q 110 158 116 158 L 280 158 Q 286 158 286 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="198" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">leftSum = 1+7+3 = 11</text>

  <!-- right brace under 4..5 -->
  <path d="M 350 150 Q 350 158 356 158 L 460 158 Q 466 158 466 150" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="408" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">rightSum = 5+6 = 11</text>

  <!-- equation derivation box -->
  <rect x="40" y="200" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="224" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">由 total = leftSum + nums[i] + rightSum 且 leftSum = rightSum</text>
  <text x="290" y="246" text-anchor="middle" font-size="12" fill="#444">⇒ total = 2 × leftSum + nums[i]</text>
  <text x="290" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⇒ 判定条件：2 × leftSum + nums[i] == total</text>

  <!-- numeric check -->
  <rect x="40" y="300" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="322" text-anchor="middle" font-size="12" fill="#444">代入 i=3：2 × 11 + 6 = 28 == total(1+7+3+6+5+6=28) ✓ 命中</text>
  <text x="290" y="338" text-anchor="middle" font-size="10" fill="#888">无需显式累加右侧，一次遍历 + 一个滚动变量即可</text>

  <!-- footer hint -->
  <text x="290" y="378" text-anchor="middle" font-size="10" fill="#888">nums[i] 本身不计入任一侧：它正是从 total 中扣掉的那一份</text>
</svg>
