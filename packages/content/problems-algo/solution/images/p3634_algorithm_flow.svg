<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3634b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 双指针滑窗 → n − 最长合法窗口</text>

  <!-- Step 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="40" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="130" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 排序</text>
    <text x="130" y="74" text-anchor="middle" font-size="9.5" fill="#555">O(n log n)，建立单调性</text>
  </g>
  <path d="M 130 88 v 22" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr3634b)"/>

  <!-- Step 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="114" width="180" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="130" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 初始化 i = j = 0</text>
    <text x="130" y="149" text-anchor="middle" font-size="9.5" fill="#555">best = 1（单元素必平衡）</text>
    <text x="130" y="163" text-anchor="middle" font-size="9.5" fill="#555">i 只进不退 ⇒ 总移动 ≤ n</text>
  </g>
  <path d="M 130 176 v 22" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr3634b)"/>

  <!-- Step 3: decision diamond -->
  <g filter="url(#rough2)">
    <polygon points="130,200 216,236 130,272 44,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="130" y="230" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">nums[j] ≤</text>
    <text x="130" y="246" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">nums[i] × k ?</text>
  </g>

  <!-- Yes branch (right) -->
  <g filter="url(#rough2)">
    <path d="M 216 236 h 40" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr3634b)"/>
    <text x="234" y="228" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="262" y="212" width="216" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="370" y="230" text-anchor="middle" font-size="10" fill="#2a5a2a" font-weight="bold">best = max(best, j − i + 1)</text>
    <text x="370" y="247" text-anchor="middle" font-size="9.5" fill="#555">记录窗口长度，j++ 继续扩张</text>
  </g>

  <!-- No branch (left down) -->
  <g filter="url(#rough2)">
    <path d="M 130 272 v 22" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr3634b)"/>
    <text x="142" y="290" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
    <rect x="40" y="298" width="216" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="148" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i++（收缩左端）</text>
    <text x="148" y="333" text-anchor="middle" font-size="9.5" fill="#555">抬升 min 直到判据重新成立</text>
  </g>
  <path d="M 256 322 h 90 v -236 a 20 20 0 0 0 -20 -20 h -166" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr3634b)"/>
  <text x="370" y="345" font-size="9" fill="#666" filter="url(#rough2)">回到判定（j 走完 n 个即止）</text>

  <!-- Final -->
  <g filter="url(#rough2)">
    <path d="M 478 236 h 18 v 96 h -60" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr3634b)"/>
    <rect x="262" y="312" width="216" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <text x="370" y="330" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 返回 n − best</text>
    <text x="370" y="348" text-anchor="middle" font-size="9.5" fill="#555">移除数 = 总数 − 最长保留窗口</text>
  </g>

  <!-- Bottom note -->
  <g filter="url(#rough2)">
    <rect x="30" y="368" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="260" y="385" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">⚠ nums[i]×k 最高 10⁹×10⁵ = 10¹⁴，C++ 判据必须 cast 成 long long</text>
  </g>
</svg>
