<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 288" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2021c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="288" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：每盏灯 = 一个区间，差分把「区间加 1」变成「端点事件」</text>

  <!-- Lamp 0: [-5,-1] blue -->
  <rect x="70" y="50" width="144" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">灯0: [-5, -1]</text>

  <!-- Lamp 1: [-1,3] green -->
  <rect x="214" y="78" width="144" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">灯1: [-1, 3]</text>

  <!-- Lamp 2: [0,6] orange -->
  <rect x="250" y="106" width="216" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">灯2: [0, 6]</text>

  <!-- Number line -->
  <path d="M 56 150 L 524 150" stroke="#888" stroke-width="1.6" marker-end="url(#arr2021c)" filter="url(#rough2)"/>

  <!-- Ticks + position labels -->
  <g font-size="11" fill="#666">
    <line x1="70" y1="145" x2="70" y2="155" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="170" text-anchor="middle">-5</text>
    <line x1="214" y1="145" x2="214" y2="155" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="214" y="170" text-anchor="middle">-1</text>
    <line x1="250" y1="145" x2="250" y2="155" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="250" y="170" text-anchor="middle">0</text>
    <line x1="358" y1="145" x2="358" y2="155" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="358" y="170" text-anchor="middle">3</text>
    <line x1="394" y1="145" x2="394" y2="155" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="394" y="170" text-anchor="middle">4</text>
    <line x1="466" y1="145" x2="466" y2="155" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="466" y="170" text-anchor="middle">6</text>
    <line x1="502" y1="145" x2="502" y2="155" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="502" y="170" text-anchor="middle">7</text>
  </g>

  <!-- Event markers: +1 (green) at left endpoints, -1 (red) at r+1 -->
  <g font-size="11" font-weight="bold">
    <!-- -5: +1 (lamp0 start) -->
    <text x="70" y="190" text-anchor="middle" fill="#4a7a3a">+1</text>
    <!-- -1: +1 (lamp1 start) -->
    <text x="214" y="190" text-anchor="middle" fill="#4a7a3a">+1</text>
    <!-- 0: +1 (lamp2 start) AND -1 (lamp0 end at r+1=0) -->
    <text x="250" y="190" text-anchor="middle" fill="#4a7a3a">+1</text>
    <text x="250" y="206" text-anchor="middle" fill="#b85450">−1</text>
    <!-- 4: -1 (lamp1 end at r+1=4) -->
    <text x="394" y="190" text-anchor="middle" fill="#b85450">−1</text>
    <!-- 7: -1 (lamp2 end at r+1=7) -->
    <text x="502" y="190" text-anchor="middle" fill="#b85450">−1</text>
  </g>

  <!-- tiny note that 3 and 6 are r (not events) -->
  <g font-size="9" fill="#aaa">
    <text x="358" y="190" text-anchor="middle">r</text>
    <text x="466" y="190" text-anchor="middle">r</text>
  </g>

  <!-- Callout box -->
  <rect x="40" y="226" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">差分：d[l] += 1（左端点，绿）；d[r+1] −= 1（右端点 +1 处，红）</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#666">闭区间含 r，故在 r+1 处才减；前缀和即得每个位置的亮度</text>
</svg>
