<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">交换论证：消除交叉，总和不增</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">对任意 a ≤ b 且 x ≤ y：|a−x| + |b−y| ≤ |a−y| + |b−x|</text>

  <!-- ============ Left panel: crossed (bad) ============ -->
  <rect x="24" y="54" width="220" height="216" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="134" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">交叉匹配（次优）</text>

  <!-- seats row (top): a=1 at x=70, b=5 at x=170 -->
  <text x="44" y="100" font-size="9.5" fill="#446688">座位</text>
  <rect x="52" y="86" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="70" y="107" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="152" y="86" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="170" y="107" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>
  <text x="70" y="128" text-anchor="middle" font-size="8.5" fill="#aaa">a=1</text>
  <text x="170" y="128" text-anchor="middle" font-size="8.5" fill="#aaa">b=5</text>

  <!-- crossed lines: seat 1 -> student 7 (right), seat 5 -> student 2 (left) -->
  <path d="M 70 122 L 170 196" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 170 122 L 70 196" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- students row (bottom): x=2 at x=70, y=7 at x=170 -->
  <text x="44" y="206" font-size="9.5" fill="#d6a040">学生</text>
  <rect x="52" y="188" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="70" y="209" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <rect x="152" y="188" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="170" y="209" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">7</text>
  <text x="70" y="232" text-anchor="middle" font-size="8.5" fill="#aaa">x=2</text>
  <text x="170" y="232" text-anchor="middle" font-size="8.5" fill="#aaa">y=7</text>

  <!-- cost -->
  <text x="134" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|1−7| + |5−2| = 6+3 = 9</text>

  <!-- ============ Right panel: uncrossed (good) ============ -->
  <rect x="276" y="54" width="220" height="216" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="386" y="74" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">同序配对（最优）</text>

  <text x="296" y="100" font-size="9.5" fill="#446688">座位</text>
  <rect x="304" y="86" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="322" y="107" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="404" y="86" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="422" y="107" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>
  <text x="322" y="128" text-anchor="middle" font-size="8.5" fill="#aaa">a=1</text>
  <text x="422" y="128" text-anchor="middle" font-size="8.5" fill="#aaa">b=5</text>

  <!-- parallel lines: 1->2, 5->7 -->
  <path d="M 322 122 L 322 196" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 422 122 L 422 196" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="296" y="206" font-size="9.5" fill="#d6a040">学生</text>
  <rect x="304" y="188" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="322" y="209" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <rect x="404" y="188" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="422" y="209" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">7</text>
  <text x="322" y="232" text-anchor="middle" font-size="8.5" fill="#aaa">x=2</text>
  <text x="422" y="232" text-anchor="middle" font-size="8.5" fill="#aaa">y=7</text>

  <text x="386" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">|1−2| + |5−7| = 1+2 = 3</text>

  <!-- Arrow between panels -->
  <path d="M 248 160 L 272 160" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">交换</text>

  <!-- Insight box -->
  <rect x="40" y="284" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键不等式：a ≤ b, x ≤ y 时 |a−x|+|b−y| ≤ |a−y|+|b−x|</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#555">交叉匹配中交换两端 → 连线不再交叉，总距离从 9 降到 3（不增）。</text>
  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#555">反复消除所有交叉 → 最终得到无交叉匹配 = 排序后顺序配对 → 即为最优解。</text>
</svg>
