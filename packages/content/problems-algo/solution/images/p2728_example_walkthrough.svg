<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2728c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：doors=[1,0,1,1,0], k=5（n=5）</text>

  <!-- 5 box positions: x centers 172,226,280,334,388 ; box w46 h38 -> x=149,203,257,311,365 -->
  <!-- Row1: initial -->
  <text x="138" y="78" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">初始</text>
  <!-- pointer at idx0 -->
  <path d="M172,52 L165,42 L179,42 z" fill="#b85450" filter="url(#rough2)"/>
  <rect x="149" y="56" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="172" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="203" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="226" y="80" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <rect x="257" y="56" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="311" y="56" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="334" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="365" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="388" y="80" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <text x="425" y="78" text-anchor="start" font-size="10" fill="#888">在 idx0</text>

  <!-- Row2: after close k=5 -->
  <text x="138" y="148" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">①关5门</text>
  <path d="M172,122 L165,112 L179,112 z" fill="#b85450" filter="url(#rough2)"/>
  <g font-size="15" font-weight="bold" fill="#446688">
    <rect x="149" y="126" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="172" y="150" text-anchor="middle">0</text>
    <rect x="203" y="126" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="226" y="150" text-anchor="middle">0</text>
    <rect x="257" y="126" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="280" y="150" text-anchor="middle">0</text>
    <rect x="311" y="126" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="334" y="150" text-anchor="middle">0</text>
    <rect x="365" y="126" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="388" y="150" text-anchor="middle">0</text>
  </g>
  <text x="425" y="148" text-anchor="start" font-size="10" fill="#888">绕一圈全闭</text>

  <!-- Row3: after openDoor (marker) -->
  <text x="138" y="218" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">②开门</text>
  <path d="M172,192 L165,182 L179,182 z" fill="#b85450" filter="url(#rough2)"/>
  <rect x="149" y="196" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="172" y="220" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <g font-size="15" font-weight="bold" fill="#446688">
    <rect x="203" y="196" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="226" y="220" text-anchor="middle">0</text>
    <rect x="257" y="196" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="280" y="220" text-anchor="middle">0</text>
    <rect x="311" y="196" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="334" y="220" text-anchor="middle">0</text>
    <rect x="365" y="196" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="388" y="220" text-anchor="middle">0</text>
  </g>
  <text x="425" y="218" text-anchor="start" font-size="10" fill="#888">标记 idx0 唯一开门</text>

  <!-- Row4: counting -->
  <text x="138" y="290" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">③计数</text>
  <path d="M172,264 L165,254 L179,254 z" fill="#b85450" filter="url(#rough2)"/>
  <rect x="149" y="268" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="172" y="292" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <g font-size="14" font-weight="bold" fill="#446688">
    <rect x="203" y="268" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="226" y="292" text-anchor="middle">0</text>
    <rect x="257" y="268" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="280" y="292" text-anchor="middle">0</text>
    <rect x="311" y="268" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="334" y="292" text-anchor="middle">0</text>
    <rect x="365" y="268" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="388" y="292" text-anchor="middle">0</text>
  </g>
  <!-- count numbers under boxes: visit order idx1=1,idx2=2,idx3=3,idx4=4,idx0=5(stop) -->
  <text x="226" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="334" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="388" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <circle cx="172" cy="318" r="12" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <!-- moveRight arrow -->
  <path d="M195,287 L200,287" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr2728c)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="120" y="356" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">右移 idx1→2→3→4→0(遇开门停)</text>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 5 = n ✓</text>
</svg>
