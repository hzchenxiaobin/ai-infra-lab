<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：回文 ⇔ 前半的排列（一一对应）</text>

  <!-- s = bacab -->
  <text x="145" y="64" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">s =</text>
  <rect x="155" y="40" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="63" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <rect x="197" y="40" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="63" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="239" y="40" width="38" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="63" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">c</text>
  <rect x="281" y="40" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="63" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <rect x="323" y="40" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="342" y="63" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b</text>

  <!-- 分组波浪下划线 -->
  <path d="M 155 84 Q 175 90 195 84 Q 215 78 235 84" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 239 84 Q 258 90 277 84" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 281 84 Q 301 90 321 84 Q 341 78 361 84" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">前半（自由排列）</text>
  <text x="258" y="104" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">中心</text>
  <text x="321" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">镜像</text>

  <path d="M 258 112 L 258 128" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 第 1 小：ab -> abcba -->
  <text x="64" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">第 1 小</text>
  <rect x="112" y="132" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="146" y="132" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <path d="M 186 146 L 208 146" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="214" y="134" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="152" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="242" y="134" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="152" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">b</text>
  <rect x="270" y="134" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="152" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">c</text>
  <rect x="298" y="134" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="311" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="326" y="134" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="339" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">a</text>

  <!-- 第 2 小：ba -> bacab -->
  <text x="64" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">第 2 小</text>
  <rect x="112" y="174" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <rect x="146" y="174" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <path d="M 186 188 L 208 188" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="214" y="176" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="194" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">b</text>
  <rect x="242" y="176" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="194" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="270" y="176" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="194" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">c</text>
  <rect x="298" y="176" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="311" y="194" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <rect x="326" y="176" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="339" y="194" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b</text>

  <!-- 底部两个说明框 -->
  <rect x="36" y="222" width="252" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">排列数 A = m! / ∏ cnt(i)!</text>
  <text x="162" y="268" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">本例 2!/(1!·1!) = 2 ⇒ k &gt; 2 返回 ""</text>

  <rect x="312" y="222" width="172" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">中心 = 唯一奇计数字符</text>
  <text x="398" y="268" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">（这里是 c，全程固定）</text>

  <!-- 底部提示 -->
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">双射：前半的每个排列 ↔ 恰好一个回文排列</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">字典序同步：两个回文串的首个不同位置必落在前半</text>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ 后半 = 前半的镜像，不占任何自由度</text>
</svg>
