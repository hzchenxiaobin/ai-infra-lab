<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,3,1,3,2] → [1,3,3,2,2]</text>

  <!-- 步骤①: 输入 -->
  <text x="50" y="58" font-size="11" fill="#446688" font-weight="bold">① 输入</text>
  <rect x="90" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="108" y="62" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="126" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="62" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="162" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="62" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="198" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="216" y="62" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="234" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="62" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- 步骤②: 统计频次 -->
  <path d="M155 76 L155 96" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="195" y="90" font-size="9.5" fill="#446688" font-weight="bold">统计频次</text>

  <text x="50" y="114" font-size="11" fill="#d6a040" font-weight="bold">② 频率表</text>
  <rect x="90" y="100" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="116" text-anchor="middle" font-size="9.5" fill="#888">值</text>
  <text x="175" y="116" text-anchor="middle" font-size="9.5" fill="#888">频次</text>
  <line x1="140" y1="100" x2="140" y2="126" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="90" y="126" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="141" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="175" y="141" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="140" y1="126" x2="140" y2="148" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="90" y="148" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="163" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="175" y="163" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2</text>
  <line x1="140" y1="148" x2="140" y2="170" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="90" y="170" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="185" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="175" y="185" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2</text>
  <line x1="140" y1="170" x2="140" y2="192" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 步骤③: 排序键 -->
  <path d="M215 158 L280 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="150" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">构造</text>

  <text x="300" y="114" font-size="11" fill="#b85450" font-weight="bold">③ 排序键 (freq, -val)</text>
  <rect x="300" y="122" width="290" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="137" font-size="9.5" fill="#888">值</text>
  <text x="375" y="137" text-anchor="middle" font-size="9.5" fill="#888">freq</text>
  <text x="430" y="137" text-anchor="middle" font-size="9.5" fill="#888">-val</text>
  <text x="510" y="137" text-anchor="middle" font-size="9.5" fill="#888">排序后位置</text>

  <rect x="300" y="144" width="290" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="159" font-size="10" fill="#333">1</text>
  <text x="375" y="159" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="430" y="159" text-anchor="middle" font-size="10" fill="#333">-1</text>
  <text x="510" y="159" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">第 1 位</text>

  <rect x="300" y="166" width="290" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="181" font-size="10" fill="#333">3</text>
  <text x="375" y="181" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <text x="430" y="181" text-anchor="middle" font-size="10" fill="#333">-3</text>
  <text x="510" y="181" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第 2 位</text>

  <rect x="300" y="188" width="290" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="203" font-size="10" fill="#333">2</text>
  <text x="375" y="203" text-anchor="middle" font-size="10" fill="#b85450">2</text>
  <text x="430" y="203" text-anchor="middle" font-size="10" fill="#333">-2</text>
  <text x="510" y="203" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">第 3 位</text>

  <!-- 同频次标注 -->
  <path d="M375 166 L375 188" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="455" y="225" text-anchor="middle" font-size="9" fill="#b85450">freq 同为 2 → 比较 -val: -3 &lt; -2 → 3 排前</text>

  <!-- 步骤④: 展开 -->
  <path d="M155 196 L155 240" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="195" y="228" font-size="9.5" fill="#4a7a3a" font-weight="bold">按序展开</text>

  <!-- 输出 -->
  <text x="50" y="260" font-size="11" fill="#4a7a3a" font-weight="bold">④ 输出</text>
  <rect x="90" y="246" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="108" y="264" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="126" y="246" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="264" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="162" y="246" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="264" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="198" y="246" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="216" y="264" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="234" y="246" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="264" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- 分组标注 -->
  <path d="M108 278 L108 296" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M108 296 L270 296" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="108" y="310" text-anchor="middle" font-size="9" fill="#4a7a3a">freq=1</text>
  <path d="M144 278 L144 296" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M180 296 L180 278" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M180 296 L234 296" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M234 296 L234 278" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="180" y="310" text-anchor="middle" font-size="9" fill="#b85450">freq=2 (val↓: 3&gt;2)</text>

  <!-- 对照: 示例1 -->
  <rect x="30" y="330" width="580" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">对照示例 1：nums = [1,1,2,2,2,3] → [3,1,1,2,2,2]</text>
  <text x="50" y="374" font-size="10" fill="#555">freq: 1→2, 2→3, 3→1（三个值频次互不相同，无需 tie-break）</text>
  <text x="50" y="392" font-size="10" fill="#555">排序键: (2,-1) (3,-2) (1,-3) → 升序排列 → 3 最前, 1 居中, 2 最后</text>

  <rect x="50" y="404" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="420" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="80" y="404" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="420" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="110" y="404" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="420" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="140" y="404" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="420" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="170" y="404" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="185" y="420" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="200" y="404" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="215" y="420" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="260" y="420" font-size="9.5" fill="#4a7a3a">freq=1</text>
  <text x="340" y="420" font-size="9.5" fill="#4a7a3a">freq=2</text>
  <text x="430" y="420" font-size="9.5" fill="#b85450">freq=3</text>
  <text x="50" y="448" font-size="9.5" fill="#888">频次全不同 → 纯按 freq 升序排列，第 2 键不参与</text>
</svg>
