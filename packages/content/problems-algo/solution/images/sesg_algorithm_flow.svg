<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐词构造签名 → 存入集合 → 返回集合大小</text>

  <!-- Step 1: iterate words -->
  <rect x="140" y="46" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">遍历每个单词 w</text>
  <text x="280" y="82" text-anchor="middle" font-size="10" fill="#666">for each word in words</text>
  <path d="M 280 92 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: split even/odd -->
  <rect x="100" y="114" width="360" height="56" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">按下标奇偶分离字符</text>
  <g font-size="11" filter="url(#rough2)">
    <rect x="130" y="142" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="190" y="158" text-anchor="middle" fill="#446688">偶位：w[0], w[2], …</text>
    <rect x="270" y="142" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="330" y="158" text-anchor="middle" fill="#d6a040">奇位：w[1], w[3], …</text>
  </g>
  <path d="M 280 172 L 280 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sort each -->
  <rect x="100" y="194" width="360" height="56" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">各自排序（化为多重集规范形）</text>
  <g font-size="11" filter="url(#rough2)">
    <rect x="130" y="222" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="190" y="238" text-anchor="middle" fill="#446688">sort(even)</text>
    <rect x="270" y="222" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="330" y="238" text-anchor="middle" fill="#d6a040">sort(odd)</text>
  </g>
  <path d="M 280 252 L 280 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: concat to key -->
  <rect x="140" y="274" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">拼接签名 key = sort(even) + sort(odd)</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#666">如 "abcd" → "ac" + "bd" = "acbd"</text>
  <path d="M 280 320 L 280 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: insert into set -->
  <rect x="140" y="342" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">将 key 插入哈希集合 seen</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#666">相同签名自动归并到一组</text>

  <!-- loop back arrow -->
  <path d="M 420 364 C 470 364, 480 64, 420 64" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="214" font-size="10" fill="#4a7a3a">下一个单词</text>

  <!-- output -->
  <path d="M 280 388 L 280 406" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="410" width="240" height="36" fill="#446688" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="433" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">返回 seen.size()（组数）</text>
</svg>
