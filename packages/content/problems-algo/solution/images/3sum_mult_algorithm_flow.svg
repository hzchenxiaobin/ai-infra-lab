<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：频次表 → 枚举值对 → 组合数累加 → 取模</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">时间 O(n + U²)，U=101；空间 O(U)=O(1)</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: count -->
    <rect x="40" y="64" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 统计频次</text>
    <text x="150" y="84" font-family="monospace" font-size="10" fill="#555">cnt[101] = {0};  for v in arr: cnt[v]++</text>
    <text x="54" y="102" font-size="9" fill="#888">一趟 O(n) 把数组压缩成 101 个频次桶；利用约束 0 ≤ arr[i] ≤ 100</text>

    <path d="M 260 116 L 260 130" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: enumerate -->
    <rect x="40" y="134" width="440" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="154" font-size="12" fill="#4a7a3a" font-weight="bold">② 枚举值对 x ≤ y</text>
    <text x="190" y="154" font-family="monospace" font-size="10" fill="#555">for x in 0..100:  for y in x..100:</text>
    <text x="54" y="172" font-family="monospace" font-size="10" fill="#555">    z = target − x − y</text>
    <text x="54" y="186" font-size="10" fill="#b85450">若 z &lt; y 或 z &gt; 100 或 cnt[z]==0 → continue（保证 x≤y≤z 且 z 合法）</text>

    <path d="M 260 202 L 260 216" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: combine -->
    <rect x="40" y="220" width="440" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="240" font-size="12" fill="#d6a040" font-weight="bold">③ 按相等关系用组合数累加</text>
    <text x="70" y="258" font-family="monospace" font-size="10" fill="#446688">x&lt;y&lt;z  → ans += cnt[x]·cnt[y]·cnt[z]</text>
    <text x="70" y="274" font-family="monospace" font-size="10" fill="#d6a040">x==y&lt;z → ans += C(cnt[x],2)·cnt[z]</text>
    <text x="70" y="290" font-family="monospace" font-size="10" fill="#4a7a3a">x&lt;y==z → ans += cnt[x]·C(cnt[y],2)</text>
    <text x="70" y="306" font-family="monospace" font-size="10" fill="#b85450">x==y==z→ ans += C(cnt[x],3)</text>

    <path d="M 260 314 L 260 328" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: mod -->
    <rect x="40" y="332" width="440" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="352" font-size="12" fill="#b85450" font-weight="bold">④ 取模返回</text>
    <text x="160" y="352" font-family="monospace" font-size="10" fill="#555">ans %= 10⁹+7;  return ans</text>
    <text x="54" y="370" font-size="9" fill="#888">每步累加后即取模防溢出（C++ 用 long long 中间运算）</text>

    <!-- complexity -->
    <rect x="40" y="392" width="440" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="410" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(n + 101²) · 空间 O(101)</text>
    <text x="260" y="424" text-anchor="middle" font-size="10" fill="#888">值域 U=101 是常数 → 实质 O(n)，远优于双指针 O(n²)</text>
  </g>
</svg>
