<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    环形数组 = 函数图（每个节点出度恰为 1）
  </text>

  <!-- Array boxes -->
  <g filter="url(#rough2)">
    <rect x="50" y="40" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="77" y="60" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="77" y="36" text-anchor="middle" font-size="8" fill="#999">idx0</text>

    <rect x="110" y="40" width="55" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="137" y="60" text-anchor="middle" font-size="12" fill="#333">−1</text>
    <text x="137" y="36" text-anchor="middle" font-size="8" fill="#999">idx1</text>

    <rect x="170" y="40" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="197" y="60" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="197" y="36" text-anchor="middle" font-size="8" fill="#999">idx2</text>

    <rect x="230" y="40" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="257" y="60" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="257" y="36" text-anchor="middle" font-size="8" fill="#999">idx3</text>

    <rect x="290" y="40" width="55" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="317" y="60" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="317" y="36" text-anchor="middle" font-size="8" fill="#999">idx4</text>
  </g>

  <!-- Legend -->
  <g filter="url(#rough2)">
    <rect x="380" y="44" width="10" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2"/>
    <text x="396" y="53" font-size="9" fill="#555">正向(白)</text>
    <rect x="380" y="60" width="10" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2"/>
    <text x="396" y="69" font-size="9" fill="#555">反向(红)</text>
    <rect x="380" y="76" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2"/>
    <text x="396" y="85" font-size="9" fill="#555">环上</text>
  </g>

  <!-- Functional graph: cycle 0→2→3→0, plus 1→0, 4→1 -->
  <!-- Node 0 -->
  <g filter="url(#rough2)">
    <circle cx="80" cy="160" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="80" y="157" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="80" y="168" text-anchor="middle" font-size="8" fill="#888">+2</text>
  </g>

  <!-- Node 2 -->
  <g filter="url(#rough2)">
    <circle cx="260" cy="160" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="260" y="157" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="260" y="168" text-anchor="middle" font-size="8" fill="#888">+1</text>
  </g>

  <!-- Node 3 -->
  <g filter="url(#rough2)">
    <circle cx="170" cy="280" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="170" y="277" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="170" y="288" text-anchor="middle" font-size="8" fill="#888">+2</text>
  </g>

  <!-- Node 1 (backward) -->
  <g filter="url(#rough2)">
    <circle cx="370" cy="170" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="370" y="167" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="370" y="178" text-anchor="middle" font-size="8" fill="#888">−1</text>
  </g>

  <!-- Node 4 (forward, leads to 1) -->
  <g filter="url(#rough2)">
    <circle cx="370" cy="280" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="370" y="277" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text x="370" y="288" text-anchor="middle" font-size="8" fill="#888">+2</text>
  </g>

  <!-- Cycle edges (green, thick) -->
  <path d="M 100 158 Q 170 130 240 158" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 250 178 Q 210 230 184 262" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 156 270 Q 100 220 72 180" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- Non-cycle edges -->
  <!-- 1 → 0 (red dashed) -->
  <path d="M 350 170 Q 220 100 100 155" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <!-- 4 → 1 (blue) -->
  <path d="M 370 260 Q 385 215 370 190" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- Annotations -->
  <text x="260" y="335" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">
    绿色三角 = 合法循环 0→2→3→0（全正向，长度 3 &gt; 1）
  </text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">
    1→0 跨方向，4→1→0 最终汇入环但不影响判定
  </text>
</svg>
