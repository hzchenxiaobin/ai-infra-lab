<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：个位是「刀口位置」，一刀切出底数 x 与指数 y</text>
    <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#666">width = v mod 10 读个位；d = ⌊v/10⌋ 去个位；刀口 = 10^(L−width)，L 为 d 的位数</text>

    <!-- ===== A: 读个位 ===== -->
    <text x="46" y="62" font-size="11" fill="#333" font-weight="bold">① 读个位 —— v = 2522</text>
    <rect x="150" y="48" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="178" y="48" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="206" y="48" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="234" y="48" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="164" y="67" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="192" y="67" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="220" y="67" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="248" y="67" text-anchor="middle" font-size="12" fill="#7a5c1a">2</text>
    <text x="276" y="67" font-size="10.5" fill="#7a5c1a" font-weight="bold">个位 → width = 2</text>
    <text x="46" y="92" font-size="10.5" fill="#446688">去掉个位 → d = 252（三位数，L = 3）</text>

    <path d="M 148 100 L 148 118" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- ===== B: 切刀口 ===== -->
    <text x="46" y="132" font-size="11" fill="#333" font-weight="bold">② 切刀口 —— d = 252，刀口 = 10^(3−2) = 10</text>
    <rect x="150" y="140" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="178" y="140" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="214" y="140" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="164" y="159" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="192" y="159" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="228" y="159" text-anchor="middle" font-size="12" fill="#2f5527">2</text>
    <text x="204" y="135" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✂</text>
    <text x="150" y="186" font-size="10.5" fill="#446688" font-weight="bold">前 width 位 → x = 25</text>
    <text x="222" y="186" font-size="10.5" fill="#2f5527" font-weight="bold">余下位 → y = 2</text>
    <text x="46" y="204" font-size="10" fill="#666">整除取余各得一半：x = d ÷ 10，y = d mod 10</text>

    <path d="M 148 212 L 148 230" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- ===== C: 解码值 ===== -->
    <rect x="46" y="234" width="220" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="156" y="251" text-anchor="middle" font-size="11" fill="#7a5c1a" font-weight="bold">③ 解码值 = x^y = 25² = 625</text>
    <text x="286" y="251" font-size="10" fill="#666">2101 → x=2, y=10 → 2¹⁰ = 1024</text>
    <text x="46" y="282" font-size="10.5" fill="#b85450" font-weight="bold">⚠ x、y 可近 10⁹ —— x^y 直接算有几十亿位，必须进模世界用快速幂！</text>

    <!-- ===== D: 公式总览 ===== -->
    <rect x="40" y="294" width="440" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#2f5527" font-weight="bold">每元素三步拆解（纯算术，O(log d)）</text>
    <text x="60" y="334" font-size="10" fill="#3d5a33">· width = v mod 10，d = ⌊v / 10⌋，L = d 的十进制位数</text>
    <text x="60" y="352" font-size="10" fill="#3d5a33">· x = d ÷ 10^(L−width)（前 width 位），y = d mod 10^(L−width)（余下位）</text>
    <text x="60" y="370" font-size="10" fill="#3d5a33">· 解码值 = x^y mod (10⁹+7)，用快速幂 O(log y) ≈ 30 次模乘</text>
    <text x="260" y="384" text-anchor="middle" font-size="9" fill="#4a7a3a">保证 L &gt; width ⇒ x、y 都至少一位数字、且无前导零（题目有效性保证）</text>
  </g>
</svg>
