<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：costs = [1,3,2,4,1], coins = 7</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">排序后 [1,1,2,3,4]，从左到右逐支尝试购买</text>

  <!-- Table header -->
  <rect x="30" y="58" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="112" y="58" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">当前价</text>
  <rect x="194" y="58" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">剩余 coins</text>
  <rect x="286" y="58" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">能否买</text>
  <rect x="378" y="58" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累计数量</text>

  <!-- Row 1 -->
  <rect x="30" y="90" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="108" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="112" y="90" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="108" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="194" y="90" width="90" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="239" y="108" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="286" y="90" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="378" y="90" width="100" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="428" y="108" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- Row 2 -->
  <rect x="30" y="120" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="112" y="120" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="194" y="120" width="90" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="239" y="138" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="286" y="120" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="378" y="120" width="100" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="428" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Row 3 -->
  <rect x="30" y="150" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="168" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="112" y="150" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="168" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="194" y="150" width="90" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="239" y="168" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="286" y="150" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="378" y="150" width="100" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="428" y="168" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- Row 4 -->
  <rect x="30" y="180" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="198" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="112" y="180" width="80" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="198" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="194" y="180" width="90" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="239" y="198" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="286" y="180" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="378" y="180" width="100" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="428" y="198" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- Row 5: stop -->
  <rect x="30" y="210" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <rect x="112" y="210" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="152" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="194" y="210" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="239" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="286" y="210" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 4&gt;0</text>
  <rect x="378" y="210" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="428" y="228" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4 (停)</text>

  <!-- Result box -->
  <rect x="60" y="256" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终返回 4 ✓</text>

  <!-- Footer note -->
  <text x="270" y="316" text-anchor="middle" font-size="10" fill="#888">第 5 步剩余 0 &lt; 价格 4，且后续更贵 → 提前终止</text>
  <text x="270" y="332" text-anchor="middle" font-size="10" fill="#aaa">若不排序按原序 [1,3,2,4,1] 贪心，会在买 [1,3,2] 后遇 4 买不起，错失第 2 支 1 元</text>
</svg>
