<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两种匹配策略对比</text>

  <!-- ===== LEFT: LIKE approach ===== -->
  <rect x="20" y="40" width="250" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">解法 A：LIKE 双条件</text>

  <!-- Condition 1 -->
  <rect x="30" y="78" width="230" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="96" font-size="10" fill="#444">条件 ① conditions LIKE 'DIAB1%'</text>
  <text x="40" y="112" font-size="9" fill="#888">DIAB1 在字符串开头</text>

  <text x="145" y="136" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">OR</text>

  <!-- Condition 2 -->
  <rect x="30" y="146" width="230" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="164" font-size="10" fill="#444">条件 ② conditions LIKE '% DIAB1%'</text>
  <text x="40" y="180" font-size="9" fill="#888">DIAB1 前面有空格</text>

  <path d="M 145 190 L 145 204" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="50" y="206" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">任一满足 → 输出该行</text>

  <!-- Note -->
  <rect x="30" y="246" width="230" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="264" font-size="9" fill="#b85450" font-weight="bold">注意 % DIAB1% 中</text>
  <text x="40" y="278" font-size="9" fill="#b85450">空格在 DIAB1 前，确保</text>
  <text x="40" y="290" font-size="9" fill="#b85450">DIAB1 是代码边界起点</text>

  <!-- ===== RIGHT: REGEXP approach ===== -->
  <rect x="290" y="40" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">解法 B：REGEXP 一条</text>

  <!-- Pattern breakdown -->
  <rect x="300" y="78" width="230" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="96" font-size="10" fill="#444">conditions REGEXP '^DIAB1| DIAB1'</text>
  <text x="310" y="112" font-size="9" fill="#888">正则两种边界统一表达</text>

  <!-- Regex parts -->
  <rect x="300" y="136" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">^DIAB1</text>
  <text x="420" y="152" font-size="9" fill="#666">开头匹配</text>

  <text x="415" y="178" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">|</text>

  <rect x="300" y="188" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="208" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold"> DIAB1</text>
  <text x="420" y="204" font-size="9" fill="#666">空格后匹配</text>

  <path d="M 415 218 L 415 232" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="320" y="234" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">匹配成功 → 输出该行</text>

  <!-- Note -->
  <rect x="300" y="274" width="230" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="292" font-size="9" fill="#d6a040" font-weight="bold">也可用 \\bDIAB1</text>
  <text x="310" y="306" font-size="9" fill="#d6a040">\\b = 单词边界</text>
  <text x="310" y="318" font-size="9" fill="#d6a040">等价于 ^或空格 两种位置</text>

  <!-- ===== Divider ===== -->
  <path d="M 30 340 L 530 340" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Bottom: execution flow ===== -->
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">SQL 执行流程</text>

  <rect x="60" y="376" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="396" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">FROM Patients</text>

  <path d="M 180 392 L 220 392" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,372 420,392 320,412 220,392" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="389" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">WHERE</text>
  <text x="320" y="402" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">模式匹配?</text>

  <path d="M 420 392 L 460 392" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="386" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">YES</text>
  <rect x="460" y="376" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="500" y="396" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT</text>

  <path d="M 320 412 L 320 432" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="426" font-size="9" fill="#b85450" font-weight="bold">NO</text>
  <rect x="260" y="432" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="447" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">跳过该行</text>
</svg>
