<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">后序 DFS 频率合并算法流程</text>

  <!-- Step 1: Build adjacency list -->
  <rect x="150" y="44" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 建邻接表（无向边双向加入）</text>
  <text x="280" y="78" text-anchor="middle" font-size="10.5" fill="#555">adj[a].push(b), adj[b].push(a)</text>

  <!-- Arrow down -->
  <path d="M 280 90 L 280 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: DFS from root 0 -->
  <rect x="150" y="112" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② DFS(0, parent=-1)</text>
  <text x="280" y="146" text-anchor="middle" font-size="10.5" fill="#555">从根节点 0 开始，parent 跳过来时方向</text>

  <!-- Arrow down -->
  <path d="M 280 158 L 280 176" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: Initialize freq (diamond/decision style) -->
  <rect x="120" y="180" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 初始化 freq[26] = {0}</text>
  <text x="280" y="218" text-anchor="middle" font-size="10.5" fill="#555">freq[labels[node]-'a'] = 1（计入自身标签）</text>

  <!-- Arrow down -->
  <path d="M 280 234 L 280 252" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: Loop children - decision diamond style -->
  <polygon points="280,256 380,286 280,316 180,286" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ 遍历邻居 child</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#555">child == parent? → 跳过</text>

  <!-- Left arrow: yes, skip -->
  <path d="M 180 286 L 100 286" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="40" y="274" width="56" height="24" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="68" y="290" text-anchor="middle" font-size="10.5" fill="#888">跳过</text>

  <!-- Down arrow: no, recurse -->
  <path d="M 280 318 L 280 336" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="332" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step 5: Recurse + merge -->
  <rect x="100" y="340" width="360" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 递归 dfs(child, node) → childFreq</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#555">freq[i] += childFreq[i]（逐位合并 26 个字母）</text>

  <!-- Loop back arrow from step 5 to step 4 -->
  <path d="M 460 365 Q 500 365 500 300 Q 500 286 380 286" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="510" y="326" font-size="10" fill="#888">下一 child</text>

  <!-- Arrow down from step 5 to step 6 (after loop ends) -->
  <path d="M 280 392 L 280 408" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 6: Record ans and return -->
  <rect x="100" y="412" width="360" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">⑥ ans[node] = freq[labels[node]]，return freq</text>
</svg>
