<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 4 演算：serial 计数 → 标记 → 收集</text>

  <!-- root -->
  <ellipse cx="200" cy="52" rx="22" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="56" text-anchor="middle" font-size="10" fill="#666">root</text>

  <!-- edges root -> a, b -->
  <path d="M 188 62 L 135 86" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 212 62 L 265 86" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node a (marked) -->
  <rect x="110" y="84" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="135" y="124" text-anchor="middle" font-size="8" fill="#b85450" font-family="monospace">x(y())z()</text>

  <!-- node b (marked) -->
  <rect x="240" y="84" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="102" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="265" y="124" text-anchor="middle" font-size="8" fill="#b85450" font-family="monospace">x(y())z()</text>

  <!-- X marks -->
  <text x="175" y="100" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="305" y="100" font-size="16" fill="#b85450" font-weight="bold">✗</text>

  <!-- edges a -> x, a -> z -->
  <path d="M 122 110 L 95 140" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 148 110 L 175 140" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- edges b -> x, b -> z -->
  <path d="M 252 110 L 225 140" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 278 110 L 305 140" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node a/x (marked) -->
  <rect x="70" y="140" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="158" text-anchor="middle" font-size="12" fill="#333">x</text>
  <text x="95" y="180" text-anchor="middle" font-size="8" fill="#b85450" font-family="monospace">y()</text>
  <text x="135" y="158" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- node a/z (leaf, not counted) -->
  <rect x="150" y="140" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="158" text-anchor="middle" font-size="12" fill="#333">z</text>
  <text x="175" y="180" text-anchor="middle" font-size="8" fill="#4a7a3a" font-family="monospace">(叶子)</text>

  <!-- node b/x (marked) -->
  <rect x="200" y="140" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="158" text-anchor="middle" font-size="12" fill="#333">x</text>
  <text x="225" y="180" text-anchor="middle" font-size="8" fill="#b85450" font-family="monospace">y()</text>
  <text x="265" y="158" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- node b/z (leaf) -->
  <rect x="280" y="140" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="158" text-anchor="middle" font-size="12" fill="#333">z</text>
  <text x="305" y="180" text-anchor="middle" font-size="8" fill="#4a7a3a" font-family="monospace">(叶子)</text>

  <!-- edges a/x -> y, b/x -> y -->
  <path d="M 95 166 L 95 194" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 225 166 L 225 194" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node a/x/y (leaf) -->
  <rect x="70" y="194" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="212" text-anchor="middle" font-size="12" fill="#333">y</text>

  <!-- node b/x/y (leaf) -->
  <rect x="200" y="194" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="212" text-anchor="middle" font-size="12" fill="#333">y</text>

  <!-- Divider -->
  <path d="M 360 40 L 360 400" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Freq table -->
  <text x="460" y="48" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">freq 计数表</text>
  <rect x="380" y="58" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="73" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">serial</text>
  <text x="510" y="73" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">freq</text>

  <rect x="380" y="80" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="95" text-anchor="middle" font-size="9" fill="#b85450" font-family="monospace">y()</text>
  <text x="510" y="95" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 ✗</text>

  <rect x="380" y="102" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="117" text-anchor="middle" font-size="8" fill="#b85450" font-family="monospace">x(y())z()</text>
  <text x="510" y="117" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 ✗</text>

  <rect x="380" y="124" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="139" text-anchor="middle" font-size="9" fill="#4a7a3a" font-family="monospace">(叶子)</text>
  <text x="510" y="139" text-anchor="middle" font-size="10" fill="#4a7a3a">不计</text>

  <!-- Legend -->
  <rect x="380" y="170" width="160" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="188" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">图例</text>
  <rect x="392" y="196" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="208" font-size="10" fill="#555">freq≥2 标记删除</text>
  <rect x="392" y="218" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="230" font-size="10" fill="#555">叶子 / 未标记保留</text>
  <text x="392" y="252" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="420" y="252" font-size="10" fill="#555">该节点被删除</text>

  <!-- Result -->
  <rect x="380" y="280" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="460" y="300" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">收集结果</text>
  <text x="460" y="320" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = [ ]</text>

  <!-- Bottom note -->
  <rect x="20" y="360" width="340" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="190" y="380" text-anchor="middle" font-size="11" fill="#444">a/x ≡ b/x（serial="y()" freq=2）→ 标记</text>
  <text x="190" y="396" text-anchor="middle" font-size="11" fill="#444">a ≡ b（serial="x(y())z()" freq=2）→ 标记 → 全删</text>
</svg>
