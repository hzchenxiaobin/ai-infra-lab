<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 2, 3, 1]</text>
  <path d="M 170 42 Q 310 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="60" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="100" y="60" width="60" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="60" width="170" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="330" y="60" width="70" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="400" y="60" width="180" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="70" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">步</text>
  <text x="130" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">num</text>
  <text x="245" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">seen（查前）</text>
  <text x="365" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">命中？</text>
  <text x="490" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">seen（查后）</text>

  <!-- 第 0 步：num=1, seen={} -->
  <g filter="url(#rough2)">
    <rect x="40" y="100" width="60" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="100" y="100" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="100" width="170" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="330" y="100" width="70" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="400" y="100" width="180" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="70" y="125" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="130" y="125" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="245" y="125" text-anchor="middle" font-size="12" fill="#888">{ }</text>
  <text x="365" y="125" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  <text x="490" y="125" text-anchor="middle" font-size="12" fill="#4a7a3a">{ 1 }</text>

  <!-- 第 1 步：num=2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="144" width="60" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="100" y="144" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="144" width="170" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="330" y="144" width="70" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="400" y="144" width="180" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="70" y="169" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="130" y="169" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="245" y="169" text-anchor="middle" font-size="12" fill="#888">{ 1 }</text>
  <text x="365" y="169" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  <text x="490" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a">{ 1, 2 }</text>

  <!-- 第 2 步：num=3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="188" width="60" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="100" y="188" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="188" width="170" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="330" y="188" width="70" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="400" y="188" width="180" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="70" y="213" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="130" y="213" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="245" y="213" text-anchor="middle" font-size="12" fill="#888">{ 1, 2 }</text>
  <text x="365" y="213" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  <text x="490" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a">{ 1, 2, 3 }</text>

  <!-- 第 3 步：num=1 命中（高亮行） -->
  <g filter="url(#rough2)">
    <rect x="40" y="232" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="100" y="232" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="160" y="232" width="170" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="330" y="232" width="70" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="400" y="232" width="180" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="70" y="257" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="130" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
  <text x="245" y="257" text-anchor="middle" font-size="12" fill="#888">{ 1, 2, 3 }</text>
  <text x="365" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">✓</text>
  <text x="490" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">返回 true</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="40" y="292" width="540" height="56" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="58" y="314" font-size="12" fill="#555">前 3 步：1 / 2 / 3 都不在 seen 中 → 各自 add 进集合；</text>
  <text x="58" y="334" font-size="12" fill="#555">第 4 步：第二个 1 查 seen 发现已存在 → 命中，立即返回 true，无需继续扫描。</text>
</svg>
