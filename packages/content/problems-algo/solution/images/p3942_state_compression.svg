<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：任意操作序列只能落在 2n 个「(族, 左旋量)」状态上</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 2：A = [1,0,2]，n = 3 —— 上排 = A 的旋转（族 0），下排 = rev(A) = [2,0,1] 的旋转（族 1）</text>

  <text x="55" y="86" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">族 0</text>
  <text x="55" y="100" text-anchor="middle" font-size="8.5" fill="#778899" filter="url(#rough2)">A 的旋转</text>
  <text x="55" y="186" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">族 1</text>
  <text x="55" y="200" text-anchor="middle" font-size="8.5" fill="#778899" filter="url(#rough2)">rev(A) 的旋转</text>

  <rect x="96" y="70" width="88" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="231" y="70" width="88" height="40" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="366" y="70" width="88" height="40" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="96" y="170" width="88" height="40" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="231" y="170" width="88" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="366" y="170" width="88" height="40" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="140" y="88" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">1 0 2</text>
  <text x="275" y="88" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0 2 1</text>
  <text x="410" y="88" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2 1 0</text>
  <text x="140" y="104" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">(0,0) 起点</text>
  <text x="275" y="104" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">(0,1)</text>
  <text x="410" y="104" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">(0,2)</text>

  <text x="140" y="188" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2 0 1</text>
  <text x="275" y="188" text-anchor="middle" font-size="13" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">0 1 2</text>
  <text x="410" y="188" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1 2 0</text>
  <text x="140" y="204" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">(1,0)</text>
  <text x="275" y="204" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">(1,1) 目标 ✓</text>
  <text x="410" y="204" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">(1,2)</text>

  <path d="M 186 90 L 226 90" fill="none" stroke="#778899" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 321 90 L 361 90" fill="none" stroke="#778899" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="207" y="82" text-anchor="middle" font-size="8.5" fill="#778899" filter="url(#rough2)">左旋</text>
  <text x="342" y="82" text-anchor="middle" font-size="8.5" fill="#778899" filter="url(#rough2)">左旋</text>
  <path d="M 440 66 C 440 52, 110 52, 110 66" fill="none" stroke="#778899" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="275" y="48" text-anchor="middle" font-size="9" fill="#778899" filter="url(#rough2)">左旋（循环回开头）</text>

  <path d="M 140 114 L 140 162" fill="none" stroke="#b85450" stroke-width="2.6" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="134" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 反转</text>
  <path d="M 275 114 L 275 162" fill="none" stroke="#a07020" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="134" font-size="8.5" fill="#a07020" filter="url(#rough2)">反转</text>
  <path d="M 410 114 L 410 162" fill="none" stroke="#a07020" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="419" y="134" font-size="8.5" fill="#a07020" filter="url(#rough2)">反转</text>

  <path d="M 186 190 L 226 190" fill="none" stroke="#b85450" stroke-width="2.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="207" y="181" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 左旋</text>
  <path d="M 321 190 L 361 190" fill="none" stroke="#778899" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="342" y="182" text-anchor="middle" font-size="8.5" fill="#778899" filter="url(#rough2)">左旋</text>
  <path d="M 440 214 C 440 246, 110 246, 110 214" fill="none" stroke="#778899" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="275" y="256" text-anchor="middle" font-size="9" fill="#778899" filter="url(#rough2)">左旋（循环回开头）</text>

  <rect x="30" y="268" width="460" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">左旋 = 族内前进 (t,s)→(t, s+1 mod n)；反转 = 换族 (t,s)→(1−t, n−s mod n)</text>
  <text x="260" y="310" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">n 个旋转 × 2 族 = 2n 个状态 —— n! 种形态坍缩成 2n 个节点，BFS 一趟出最短路</text>
  <text x="260" y="330" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">示例 2 最短路：① 反转 (0,0)→(1,0)，② 左旋 (1,0)→(1,1) = [0,1,2]，答案 2 ✓</text>
</svg>
