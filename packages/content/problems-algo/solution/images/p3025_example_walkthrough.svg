<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：points = [[6,2],[4,4],[2,6]]，答案 2</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序（x 升序，同 x 则 y 降序）后依次为 (2,6)、(4,4)、(6,2)</text>

  <!-- left: coordinate sketch -->
  <path d="M 46 252 L 236 252" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 46 252 L 46 62" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="240" y="266" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="38" y="58" font-size="10" fill="#888" filter="url(#rough2)">y</text>
  <text x="100" y="266" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="152" y="266" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="204" y="266" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="36" y="97" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="36" y="149" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="36" y="201" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>

  <!-- invalid big rectangle (2,6)-(6,2) -->
  <rect x="100" y="90" width="108" height="108" fill="#fce4ec" fill-opacity="0.25" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" rx="2" filter="url(#rough2)"/>
  <!-- valid pair rectangles -->
  <rect x="100" y="90" width="54" height="54" fill="none" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="154" y="144" width="54" height="54" fill="none" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>

  <!-- points -->
  <circle cx="100" cy="90" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="88" y="78" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">(2,6)</text>
  <circle cx="154" cy="144" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="166" y="136" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(4,4)</text>
  <circle cx="208" cy="198" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="208" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(6,2)</text>
  <text x="154" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ (4,4) 在大矩形内</text>

  <!-- right: step cards -->
  <rect x="262" y="76" width="250" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="387" y="96" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A=(2,6) → B=(4,4)</text>
  <text x="387" y="116" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4 ≤ 6 ✓ 且 4 &gt; −∞ ✓ → ✅ 计数，maxY=4</text>

  <rect x="262" y="136" width="250" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="387" y="156" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">A=(2,6) → B=(6,2)</text>
  <text x="387" y="176" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2 ≤ 6 ✓ 但 2 &gt; 4 ✗ → ❌ 被 (4,4) 挡住</text>

  <rect x="262" y="196" width="250" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="387" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A=(4,4) → B=(6,2)</text>
  <text x="387" y="236" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2 ≤ 4 ✓ 且 2 &gt; −∞ ✓ → ✅ 计数，maxY=2</text>

  <!-- arrow from card2 to the blocker -->
  <path d="M 262 162 C 240 175 210 168 168 152" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="222" y="188" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">就是它挡的</text>

  <!-- result -->
  <rect x="262" y="262" width="250" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="387" y="289" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = 1 + 0 + 1 = 2 ✓</text>

  <!-- bottom note -->
  <rect x="48" y="330" width="424" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">另一组示例 [[3,1],[1,3],[1,1]]（排序后 (1,3)、(1,1)、(3,1)）：</text>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两条线段对各计 1 次；(1,3)→(3,1) 被 (1,1) 压在边界上作废 → 答案 2</text>
  <text x="260" y="386" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">闭矩形的「闭」就在这里起作用：压线也算挡住</text>
</svg>
