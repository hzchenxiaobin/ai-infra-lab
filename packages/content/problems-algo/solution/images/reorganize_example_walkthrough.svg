<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "aaabbc" (a:3, b:2, c:1, n=6)</text>

  <!-- Table header -->
  <rect x="30" y="44" width="70" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="63" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">步骤</text>
  <rect x="104" y="44" width="160" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="63" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">堆状态 (弹前)</text>
  <rect x="268" y="44" width="120" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="63" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">弹出 &amp; 追加</text>
  <rect x="392" y="44" width="138" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="461" y="63" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">结果</text>

  <!-- Row 1: Initial -->
  <rect x="30" y="76" width="70" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="97" text-anchor="middle" font-size="12" fill="#333">初始</text>
  <rect x="104" y="76" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[a:3, b:2, c:1]</text>
  <rect x="268" y="76" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="97" text-anchor="middle" font-size="11" fill="#888">建堆</text>
  <rect x="392" y="76" width="138" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="461" y="97" text-anchor="middle" font-size="12" fill="#888">""</text>

  <!-- Row 2: Step 1 -->
  <rect x="30" y="112" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="133" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第1轮</text>
  <rect x="104" y="112" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="133" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[a:3, b:2, c:1]</text>
  <rect x="268" y="112" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="127" text-anchor="middle" font-size="11" fill="#333">弹 a:3, b:2</text>
  <text x="328" y="139" text-anchor="middle" font-size="10" fill="#888">推回 a:2, b:1</text>
  <rect x="392" y="112" width="138" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="461" y="133" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"ab"</text>

  <!-- Row 3: Step 2 -->
  <rect x="30" y="148" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第2轮</text>
  <rect x="104" y="148" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[a:2, b:1, c:1]</text>
  <rect x="268" y="148" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="163" text-anchor="middle" font-size="11" fill="#333">弹 a:2, b:1</text>
  <text x="328" y="175" text-anchor="middle" font-size="10" fill="#888">推回 a:1</text>
  <rect x="392" y="148" width="138" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="461" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"abab"</text>

  <!-- Row 4: Step 3 -->
  <rect x="30" y="184" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第3轮</text>
  <rect x="104" y="184" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[a:1, c:1]</text>
  <rect x="268" y="184" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="199" text-anchor="middle" font-size="11" fill="#333">弹 a:1, c:1</text>
  <text x="328" y="211" text-anchor="middle" font-size="10" fill="#888">都不推回</text>
  <rect x="392" y="184" width="138" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="461" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"ababac"</text>

  <!-- Row 5: Done -->
  <rect x="30" y="220" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束</text>
  <rect x="104" y="220" width="160" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="241" text-anchor="middle" font-size="12" fill="#888">堆空 ✓</text>
  <rect x="268" y="220" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="241" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="392" y="220" width="138" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="461" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"ababac" ✓</text>

  <!-- Impossibility example box -->
  <rect x="30" y="270" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">反例：s = "aaab" (a:3, b:1, n=4)</text>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#666">max_count = 3 &gt; (4+1)/2 = 2.5 → 某字符太多，无法错开 → 返回 ""</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#888">直觉：4 个位置最多放 ⌈4/2⌉ = 2 个相同字符，3 &gt; 2 放不下</text>

  <!-- Key insight -->
  <rect x="30" y="340" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键观察</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#666">每轮弹两个最高频交替放，保证相邻不同；末尾若剩 1 个其频率必为 1，不会与前一个相同</text>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#888">因为上一轮弹它时频率 ≥ 2，放了一个后频率减 1 = 1，而前一个字符是另一个</text>
</svg>
