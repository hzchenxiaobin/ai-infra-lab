<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">强密码三条规则</text>

  <rect x="30" y="50" width="480" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="74" font-size="13" fill="#446688" font-weight="bold">① 长度 6 ~ 20</text>
  <text x="48" y="96" font-size="11.5" fill="#555">太短 → 插入到 6；太长 → 删除到 20</text>
  <rect x="60" y="106" width="30" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough)"/>
  <text x="75" y="117" text-anchor="middle" font-size="9" fill="#b85450">n&lt;6</text>
  <rect x="100" y="106" width="380" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough)"/>
  <text x="290" y="117" text-anchor="middle" font-size="9.5" fill="#4a7a3a">6 ≤ n ≤ 20  ✓ 合法区间</text>
  <rect x="488" y="106" width="22" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough)"/>
  <text x="499" y="117" text-anchor="middle" font-size="9" fill="#b85450">n&gt;20</text>

  <rect x="30" y="146" width="480" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="170" font-size="13" fill="#4a7a3a" font-weight="bold">② 至少含三类字符</text>
  <text x="48" y="192" font-size="11.5" fill="#555">小写 a-z、大写 A-Z、数字 0-9，各至少一个</text>
  <circle cx="76" cy="210" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough)"/>
  <text x="76" y="214" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">a</text>
  <circle cx="104" cy="210" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough)"/>
  <text x="104" y="214" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">A</text>
  <circle cx="132" cy="210" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough)"/>
  <text x="132" y="214" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">9</text>
  <text x="156" y="214" font-size="10.5" fill="#888">missing_types = 缺失的种类数</text>

  <rect x="30" y="242" width="480" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="266" font-size="13" fill="#d6a040" font-weight="bold">③ 无连续 3 个相同字符</text>
  <text x="48" y="286" font-size="11.5" fill="#555">每个连续重复段长度 L≥3 都需拆解</text>

  <rect x="60" y="298" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough)"/>
  <rect x="82" y="298" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough)"/>
  <rect x="104" y="298" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough)"/>
  <rect x="126" y="298" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough)"/>
  <rect x="148" y="298" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough)"/>
  <rect x="170" y="298" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough)"/>
  <text x="196" y="313" font-size="11" fill="#555">L=6</text>
  <text x="196" y="327" font-size="10" fill="#b85450" font-weight="bold">需 ⌊6/3⌋=2 次替换</text>

  <path d="M 60 348 Q 120 346 180 348" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="120" y="364" text-anchor="middle" font-size="10" fill="#b85450">每个 ⌊L/3⌋ 计一次替换</text>

  <path d="M 290 308 L 320 308" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="312" font-size="11" fill="#446688" font-weight="bold">替换/插入/删除</text>
  <text x="330" y="328" font-size="10.5" fill="#555">可同时满足 ① ② ③</text>
  <text x="330" y="344" font-size="10.5" fill="#888">→ 求最小总操作数</text>
</svg>
