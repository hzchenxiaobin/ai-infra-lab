<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三组样例的配对、计数与结论</text>

  <!-- ===== Row 1: Ex1 abcdba ===== -->
  <text x="30" y="84" font-size="12.5" fill="#446688" font-weight="bold">示例 1</text>
  <text x="86" y="84" font-size="12" fill="#555">s =</text>
  <!-- cells a b c d b a : match,match,mismatch,mismatch,match,match -->
  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="110" y="62" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="127" y="85" font-weight="bold">a</text>
    <rect x="147" y="62" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="164" y="85" font-weight="bold">b</text>
    <rect x="184" y="62" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="201" y="85" font-weight="bold" fill="#b85450">c</text>
    <rect x="221" y="62" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="238" y="85" font-weight="bold" fill="#b85450">d</text>
    <rect x="258" y="62" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="275" y="85" font-weight="bold">b</text>
    <rect x="295" y="62" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="312" y="85" font-weight="bold">a</text>
  </g>
  <text x="344" y="84" font-size="12" fill="#555">→ m = <tspan fill="#b85450" font-weight="bold">1</tspan> ≤ 2</text>
  <rect x="430" y="58" width="216" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="538" y="76" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">✓ true</text>
  <text x="538" y="93" text-anchor="middle" font-size="10.5" fill="#555">改 c→d ⇒ abddba（1 步）</text>

  <!-- separator -->
  <path d="M 30 124 L 630 124" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Row 2: Ex2 aa ===== -->
  <text x="30" y="168" font-size="12.5" fill="#446688" font-weight="bold">示例 2</text>
  <text x="86" y="168" font-size="12" fill="#555">s =</text>
  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="110" y="146" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="127" y="169" font-weight="bold">a</text>
    <rect x="147" y="146" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="164" y="169" font-weight="bold">a</text>
  </g>
  <text x="190" y="168" font-size="11" fill="#888">（已是回文, 但 0 步不算）</text>
  <text x="344" y="168" font-size="12" fill="#555">→ m = <tspan fill="#4a7a3a" font-weight="bold">0</tspan> ≤ 2</text>
  <rect x="430" y="142" width="216" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="538" y="160" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">✓ true</text>
  <text x="538" y="177" text-anchor="middle" font-size="10.5" fill="#555">两 a 都→b ⇒ bb（2 步）</text>

  <!-- separator -->
  <path d="M 30 208 L 630 208" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Row 3: Ex3 abcdef ===== -->
  <text x="30" y="252" font-size="12.5" fill="#446688" font-weight="bold">示例 3</text>
  <text x="86" y="252" font-size="12" fill="#555">s =</text>
  <!-- cells a b c d e f : all mismatched -->
  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="110" y="230" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="127" y="253" font-weight="bold" fill="#b85450">a</text>
    <rect x="147" y="230" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="164" y="253" font-weight="bold" fill="#b85450">b</text>
    <rect x="184" y="230" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="201" y="253" font-weight="bold" fill="#b85450">c</text>
    <rect x="221" y="230" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="238" y="253" font-weight="bold" fill="#b85450">d</text>
    <rect x="258" y="230" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="275" y="253" font-weight="bold" fill="#b85450">e</text>
    <rect x="295" y="230" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="312" y="253" font-weight="bold" fill="#b85450">f</text>
  </g>
  <text x="344" y="252" font-size="12" fill="#555">→ m = <tspan fill="#b85450" font-weight="bold">3</tspan> &gt; 2</text>
  <rect x="430" y="226" width="216" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="538" y="244" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">✗ false</text>
  <text x="538" y="261" text-anchor="middle" font-size="10.5" fill="#555">三对都不等, 至少需 3 步</text>

  <!-- legend / color key -->
  <text x="30" y="300" font-size="11" fill="#888">配色：</text>
  <rect x="72" y="290" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="302" font-size="11" fill="#888">对称位相等（匹配）</text>
  <rect x="240" y="290" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="268" y="302" font-size="11" fill="#888">对称位不等（不匹配, m+1）</text>
  <text x="430" y="302" font-size="11" fill="#888">结论恒为 m ≤ 2 ?</text>

  <!-- conclusion bar -->
  <rect x="30" y="316" width="600" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="337" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">统一结论：不匹配对数 m ≤ 2 ⇒ true，否则 false</text>
</svg>
