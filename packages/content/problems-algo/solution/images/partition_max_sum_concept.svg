<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：切分末段为长度 ≤ k 的子数组，替换为段内最大值</text>

  <!-- ===== 原数组 ===== -->
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">原数组 arr（k = 3）</text>
  <!-- 7 cells, width 52, start x=108 -->
  <rect x="108" y="50" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="75" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="160" y="50" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="75" text-anchor="middle" font-size="13" fill="#333">15</text>
  <rect x="212" y="50" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="75" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="264" y="50" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="75" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="316" y="50" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="75" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="368" y="50" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="75" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="420" y="50" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="75" text-anchor="middle" font-size="13" fill="#333">10</text>

  <path d="M 290 94 L 290 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="105" font-size="10" fill="#888">分隔（每段 ≤ k）</text>

  <!-- ===== 分段着色 ===== -->
  <!-- segment 1 [1,15,7] green -->
  <rect x="108" y="112" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="137" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="160" y="112" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="186" y="137" text-anchor="middle" font-size="13" fill="#333">15</text>
  <rect x="212" y="112" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="238" y="137" text-anchor="middle" font-size="13" fill="#333">7</text>
  <!-- segment 2 [9] orange -->
  <rect x="264" y="112" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="137" text-anchor="middle" font-size="13" fill="#333">9</text>
  <!-- segment 3 [2,5,10] red -->
  <rect x="316" y="112" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="137" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="368" y="112" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="394" y="137" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="420" y="112" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="446" y="137" text-anchor="middle" font-size="13" fill="#333">10</text>

  <!-- 段内 max 标注 -->
  <path d="M 110 158 L 262 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="186" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">max = 15</text>
  <path d="M 266 158 L 314 158" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="290" y="173" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">max = 9</text>
  <path d="M 318 158 L 470 158" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="394" y="173" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">max = 10</text>

  <path d="M 290 182 L 290 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="193" font-size="10" fill="#888">替换为段内最大值</text>

  <!-- ===== 替换后 ===== -->
  <rect x="108" y="200" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="225" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">15</text>
  <rect x="160" y="200" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="186" y="225" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">15</text>
  <rect x="212" y="200" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="238" y="225" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">15</text>
  <rect x="264" y="200" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="225" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">9</text>
  <rect x="316" y="200" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="225" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10</text>
  <rect x="368" y="200" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="394" y="225" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10</text>
  <rect x="420" y="200" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="446" y="225" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10</text>

  <path d="M 290 244 L 290 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="255" font-size="10" fill="#888">求和</text>

  <!-- ===== 求和等式 ===== -->
  <rect x="60" y="264" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="287" text-anchor="middle" font-size="13" fill="#333">15×3 + 9×1 + 10×3 = 45 + 9 + 30 = <tspan fill="#b85450" font-weight="bold">84</tspan></text>

  <path d="M 290 302 L 290 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 核心洞察 ===== -->
  <rect x="50" y="322" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="343" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举末段长度 len = 1..k</text>
  <text x="290" y="359" text-anchor="middle" font-size="11" fill="#555">末段 arr[i−len..i−1] 全替换为段内最大值，前缀 dp[i−len] 与末段独立</text>

  <path d="M 290 368 L 290 384" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== DP 转移 ===== -->
  <rect x="50" y="388" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="410" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">dp[i] = max { dp[i−len] + max(段) × len }</text>
  <text x="290" y="426" text-anchor="middle" font-size="10.5" fill="#888">len = 1..min(k, i)，len 递增时 curMax 滚动维护</text>
</svg>
