<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：分数 = 环形相邻对之和 —— 轮换不变 ⇒ 固定 perm[0] = 0</text>

  <!-- Ring A -->
  <text x="95" y="50" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="158" y="112" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="95" y="178" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="32" y="112" text-anchor="end" font-size="8" fill="#999" filter="url(#rough2)">3</text>

  <circle cx="95" cy="68" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <circle cx="135" cy="108" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <circle cx="95" cy="148" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">c</text>
  <circle cx="55" cy="108" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">d</text>

  <path d="M 106 79 L 121 94" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 124 119 L 109 134" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 84 137 L 69 122" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 66 97 L 81 82" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="140" y="84" font-size="9.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">w1</text>
  <text x="140" y="138" font-size="9.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">w2</text>
  <text x="50" y="138" text-anchor="end" font-size="9.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">w3</text>
  <text x="50" y="84" text-anchor="end" font-size="9.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">w4</text>

  <text x="95" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">perm = [a, b, c, d]</text>

  <!-- rotation arrow -->
  <path d="M 170 108 L 280 108" stroke="#446688" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="225" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#555" filter="url(#rough2)">轮换 1 位</text>
  <text x="225" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">分数不变！</text>

  <!-- Ring B -->
  <text x="355" y="50" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="418" y="112" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="355" y="178" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="292" y="112" text-anchor="end" font-size="8" fill="#999" filter="url(#rough2)">3</text>

  <circle cx="355" cy="68" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">b</text>
  <circle cx="395" cy="108" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">c</text>
  <circle cx="355" cy="148" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">d</text>
  <circle cx="315" cy="108" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">a</text>

  <path d="M 366 79 L 381 94" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 384 119 L 369 134" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 344 137 L 329 122" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 326 97 L 341 82" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="400" y="84" font-size="9.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">w2</text>
  <text x="400" y="138" font-size="9.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">w3</text>
  <text x="310" y="138" text-anchor="end" font-size="9.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">w4</text>
  <text x="310" y="84" text-anchor="end" font-size="9.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">w1</text>

  <text x="355" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">perm = [b, c, d, a]</text>

  <text x="260" y="210" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">边代价 wi = |perm[i] − nums[perm[i+1]]|（i 对 n 取模）；轮换 = 换个起点，边集不变</text>

  <!-- observation boxes -->
  <rect x="16" y="222" width="240" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="136" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">观察①② ⇒ 固定 perm[0] = 0</text>
  <text x="136" y="258" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">① 轮换只重排 n 条边，分数不变</text>
  <text x="136" y="273" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">② 最优解都可轮换成 0 开头，且 0 是最小首元素</text>
  <text x="136" y="288" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">⇒ 字典序最优解必以 0 开头（搜索空间 ÷ n）</text>

  <rect x="268" y="222" width="236" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="386" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">观察③ 代价在放置瞬间确定</text>
  <text x="386" y="258" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">在 last 后放 v ⇒ 付出 |last − nums[v]|</text>
  <text x="386" y="273" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">填满后结算收尾项 |last − nums[0]|</text>
  <text x="386" y="288" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">剩余最低代价只看 (mask, last) ⇒ 状压 DP</text>

  <!-- formula strip -->
  <rect x="16" y="306" width="488" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">状态：dp[mask][last] = min{ |last − nums[v]| + dp[mask∪{v}][v] }，v 取遍不在 mask 中的值</text>
  <text x="260" y="339" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">边界：dp[full][last] = |last − nums[0]|（收尾项）；最低分数 = dp[{0}][0]</text>
  <text x="260" y="351" text-anchor="middle" font-size="9" fill="#8a6a1f" filter="url(#rough2)">n ≤ 14 ⇒ 状态数 2^n × n —— TSP（Held–Karp）同款骨架</text>
</svg>
