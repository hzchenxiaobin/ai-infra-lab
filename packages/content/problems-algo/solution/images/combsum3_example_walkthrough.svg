<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算（k=3, n=9）：DFS 逐步追踪</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">选→递归→撤销；size==k 验和；sum+i&gt;n 即 break</text>

  <g filter="url(#rough2)" font-size="10">
    <!-- Header -->
    <rect x="24" y="58" width="552" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="50" y="76" text-anchor="middle" fill="#446688" font-weight="bold">步骤</text>
    <text x="110" y="76" text-anchor="middle" fill="#446688" font-weight="bold">start</text>
    <text x="210" y="76" text-anchor="middle" fill="#446688" font-weight="bold">path</text>
    <text x="310" y="76" text-anchor="middle" fill="#446688" font-weight="bold">sum</text>
    <text x="440" y="76" text-anchor="middle" fill="#446688" font-weight="bold">动作</text>
    <text x="540" y="76" text-anchor="middle" fill="#446688" font-weight="bold">结果</text>

    <!-- dividers -->
    <line x1="80" y1="58" x2="80" y2="478" stroke="#ddd" stroke-width="0.8"/>
    <line x1="140" y1="58" x2="140" y2="478" stroke="#ddd" stroke-width="0.8"/>
    <line x1="280" y1="58" x2="280" y2="478" stroke="#ddd" stroke-width="0.8"/>
    <line x1="340" y1="58" x2="340" y2="478" stroke="#ddd" stroke-width="0.8"/>
    <line x1="540" y1="58" x2="540" y2="478" stroke="#ddd" stroke-width="0.8"/>

    <!-- Row 1: root -->
    <rect x="24" y="86" width="552" height="26" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="104" text-anchor="middle" fill="#555">1</text>
    <text x="110" y="104" text-anchor="middle" fill="#555">1</text>
    <text x="210" y="104" text-anchor="middle" fill="#555" font-weight="bold">[]</text>
    <text x="310" y="104" text-anchor="middle" fill="#555">0</text>
    <text x="440" y="104" text-anchor="middle" fill="#555">入 root，循环 i=1..7</text>
    <text x="540" y="104" text-anchor="middle" fill="#888">—</text>

    <!-- Row 2: pick 1 -->
    <rect x="24" y="114" width="552" height="26" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="132" text-anchor="middle" fill="#555">2</text>
    <text x="110" y="132" text-anchor="middle" fill="#555">2</text>
    <text x="210" y="132" text-anchor="middle" fill="#555" font-weight="bold">[1]</text>
    <text x="310" y="132" text-anchor="middle" fill="#555">1</text>
    <text x="440" y="132" text-anchor="middle" fill="#4a7a3a">选 1</text>
    <text x="540" y="132" text-anchor="middle" fill="#888">—</text>

    <!-- Row 3: pick 2 -->
    <rect x="24" y="142" width="552" height="26" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="160" text-anchor="middle" fill="#555">3</text>
    <text x="110" y="160" text-anchor="middle" fill="#555">3</text>
    <text x="210" y="160" text-anchor="middle" fill="#555" font-weight="bold">[1,2]</text>
    <text x="310" y="160" text-anchor="middle" fill="#555">3</text>
    <text x="440" y="160" text-anchor="middle" fill="#4a7a3a">选 2</text>
    <text x="540" y="160" text-anchor="middle" fill="#888">—</text>

    <!-- Row 4: [1,2,3] sum=6 != 9 -->
    <rect x="24" y="170" width="552" height="26" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="188" text-anchor="middle" fill="#555">4</text>
    <text x="110" y="188" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="188" text-anchor="middle" fill="#888" font-weight="bold">[1,2,3]</text>
    <text x="310" y="188" text-anchor="middle" fill="#888">6</text>
    <text x="440" y="188" text-anchor="middle" fill="#555">选 3，size==3，6≠9</text>
    <text x="540" y="188" text-anchor="middle" fill="#888">✗</text>

    <!-- Row 5: [1,2,4] sum=7 -->
    <rect x="24" y="198" width="552" height="26" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="216" text-anchor="middle" fill="#555">5</text>
    <text x="110" y="216" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="216" text-anchor="middle" fill="#888" font-weight="bold">[1,2,4]</text>
    <text x="310" y="216" text-anchor="middle" fill="#888">7</text>
    <text x="440" y="216" text-anchor="middle" fill="#555">撤 3，选 4，7≠9</text>
    <text x="540" y="216" text-anchor="middle" fill="#888">✗</text>

    <!-- Row 6: [1,2,5] sum=8 -->
    <rect x="24" y="226" width="552" height="26" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="244" text-anchor="middle" fill="#555">6</text>
    <text x="110" y="244" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="244" text-anchor="middle" fill="#888" font-weight="bold">[1,2,5]</text>
    <text x="310" y="244" text-anchor="middle" fill="#888">8</text>
    <text x="440" y="244" text-anchor="middle" fill="#555">撤 4，选 5，8≠9</text>
    <text x="540" y="244" text-anchor="middle" fill="#888">✗</text>

    <!-- Row 7: [1,2,6] sum=9 COLLECT -->
    <rect x="24" y="254" width="552" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="50" y="272" text-anchor="middle" fill="#555">7</text>
    <text x="110" y="272" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="272" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,2,6]</text>
    <text x="310" y="272" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="440" y="272" text-anchor="middle" fill="#555">撤 5，选 6，9==9</text>
    <text x="540" y="272" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>

    <!-- Row 8: [1,2,7] prune -->
    <rect x="24" y="282" width="552" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" rx="3"/>
    <text x="50" y="300" text-anchor="middle" fill="#555">8</text>
    <text x="110" y="300" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="300" text-anchor="middle" fill="#b85450" font-weight="bold">[1,2,7]✂</text>
    <text x="310" y="300" text-anchor="middle" fill="#b85450">10</text>
    <text x="440" y="300" text-anchor="middle" fill="#b85450">撤 6，选 7，10&gt;9 break</text>
    <text x="540" y="300" text-anchor="middle" fill="#b85450" font-weight="bold">✂</text>

    <!-- Row 9: [1,3] -->
    <rect x="24" y="310" width="552" height="26" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="328" text-anchor="middle" fill="#555">9</text>
    <text x="110" y="328" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="328" text-anchor="middle" fill="#555" font-weight="bold">[1,3]</text>
    <text x="310" y="328" text-anchor="middle" fill="#555">4</text>
    <text x="440" y="328" text-anchor="middle" fill="#4a7a3a">撤 7→撤 2，选 3</text>
    <text x="540" y="328" text-anchor="middle" fill="#888">—</text>

    <!-- Row 10: [1,3,4] sum=8 -->
    <rect x="24" y="338" width="552" height="26" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="356" text-anchor="middle" fill="#555">10</text>
    <text x="110" y="356" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="356" text-anchor="middle" fill="#888" font-weight="bold">[1,3,4]</text>
    <text x="310" y="356" text-anchor="middle" fill="#888">8</text>
    <text x="440" y="356" text-anchor="middle" fill="#555">选 4，8≠9</text>
    <text x="540" y="356" text-anchor="middle" fill="#888">✗</text>

    <!-- Row 11: [1,3,5] sum=9 COLLECT -->
    <rect x="24" y="366" width="552" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="50" y="384" text-anchor="middle" fill="#555">11</text>
    <text x="110" y="384" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="384" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1,3,5]</text>
    <text x="310" y="384" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="440" y="384" text-anchor="middle" fill="#555">撤 4，选 5，9==9</text>
    <text x="540" y="384" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>

    <!-- Row 12: [1,3,6] prune -->
    <rect x="24" y="394" width="552" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" rx="3"/>
    <text x="50" y="412" text-anchor="middle" fill="#555">12</text>
    <text x="110" y="412" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="412" text-anchor="middle" fill="#b85450" font-weight="bold">[1,3,6]✂</text>
    <text x="310" y="412" text-anchor="middle" fill="#b85450">10</text>
    <text x="440" y="412" text-anchor="middle" fill="#b85450">撤 5，选 6，10&gt;9 break</text>
    <text x="540" y="412" text-anchor="middle" fill="#b85450" font-weight="bold">✂</text>

    <!-- Row 13: skip to [2,3] -->
    <rect x="24" y="422" width="552" height="26" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="440" text-anchor="middle" fill="#555">…</text>
    <text x="110" y="440" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="440" text-anchor="middle" fill="#555" font-weight="bold">[2,3]</text>
    <text x="310" y="440" text-anchor="middle" fill="#555">5</text>
    <text x="440" y="440" text-anchor="middle" fill="#4a7a3a">跳过 [1,4]+（和均超），选 2→3</text>
    <text x="540" y="440" text-anchor="middle" fill="#888">—</text>

    <!-- Row 14: [2,3,4] COLLECT -->
    <rect x="24" y="450" width="552" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="50" y="468" text-anchor="middle" fill="#555">14</text>
    <text x="110" y="468" text-anchor="middle" fill="#555">4</text>
    <text x="210" y="468" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[2,3,4]</text>
    <text x="310" y="468" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="440" y="468" text-anchor="middle" fill="#555">选 4，9==9</text>
    <text x="540" y="468" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- ===== Summary ===== -->
  <rect x="24" y="486" width="552" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="300" y="506" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">收集 3 个组合：[1,2,6] [1,3,5] [2,3,4]</text>
  <text x="300" y="522" text-anchor="middle" font-size="10" fill="#555">步骤 8/12 展示和剪枝：sum+i&gt;n 时 break，砍掉整棵子树</text>
</svg>
