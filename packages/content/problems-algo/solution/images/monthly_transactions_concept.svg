  <!-- row 124 -->
  <rect x="20" y="128" width="180" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="33" y="140" text-anchor="middle" font-size="8" fill="#333">124</text>
  <text x="63" y="140" text-anchor="middle" font-size="8" fill="#333">DE</text>
  <text x="108" y="140" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">approved</text>
  <text x="150" y="140" text-anchor="middle" font-size="8" fill="#333">2000</text>
