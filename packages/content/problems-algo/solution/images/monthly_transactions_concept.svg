  <rect x="240" y="58" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="73" font-size="7" fill="#d6a040" font-weight="bold">country</text>
  <text x="313" y="73" font-size="7" fill="#d6a040" font-weight="bold">state</text>
  <text x="355" y="73" font-size="7" fill="#d6a040" font-weight="bold">amount</text>
  <text x="393" y="73" font-size="7" fill="#d6a040" font-weight="bold">month</text>
  <line x1="290" y1="58" x2="290" y2="80" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="335" y1="58" x2="335" y2="80" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="375" y1="58" x2="375" y2="80" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="240" y="80" width="170" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="263" y="92" text-anchor="middle" font-size="8" fill="#333">US</text>
  <text x="313" y="92" text-anchor="middle" font-size="8" fill="#4a7a3a">approved</text>
  <text x="355" y="92" text-anchor="middle" font-size="8" fill="#333">1000</text>
  <text x="393" y="92" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2018-12</text>

  <rect x="240" y="96" width="170" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="263" y="108" text-anchor="middle" font-size="8" fill="#333">US</text>
  <text x="313" y="108" text-anchor="middle" font-size="8" fill="#b85450">declined</text>
  <text x="355" y="108" text-anchor="middle" font-size="8" fill="#333">2000</text>
  <text x="393" y="108" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2018-12</text>

  <rect x="240" y="112" width="170" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="263" y="124" text-anchor="middle" font-size="8" fill="#333">US</text>
  <text x="313" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a">approved</text>
  <text x="355" y="124" text-anchor="middle" font-size="8" fill="#333">2000</text>
  <text x="393" y="124" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2019-01</text>

  <rect x="240" y="128" width="170" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="263" y="140" text-anchor="middle" font-size="8" fill="#333">DE</text>
  <text x="313" y="140" text-anchor="middle" font-size="8" fill="#4a7a3a">approved</text>
  <text x="355" y="140" text-anchor="middle" font-size="8" fill="#333">2000</text>
  <text x="393" y="140" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2019-01</text>

  <rect x="240" y="150" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="325" y="164" text-anchor="middle" font-size="7.5" fill="#4a7a3a">DATE_FORMAT(date,</text>
  <text x="325" y="174" text-anchor="middle" font-size="7.5" fill="#4a7a3a">'%Y-%m')</text>

  <!-- arrow ② GROUP BY -->
  <path d="M412 112 L445 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="428" y="106" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">②</text>
  <text x="428" y="124" text-anchor="middle" font-size="6.5" fill="#d6a040">分组</text>

  <!-- ===== Right: Result table ===== -->
  <text x="535" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">分组聚合结果</text>
  <rect x="450" y="58" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="73" font-size="6.5" fill="#b85450" font-weight="bold">month</text>
  <text x="505" y="73" font-size="6.5" fill="#b85450" font-weight="bold">country</text>
  <text x="540" y="73" font-size="6.5" fill="#b85450" font-weight="bold">t_cnt</text>
  <text x="568" y="73" font-size="6.5" fill="#b85450" font-weight="bold">a_cnt</text>
  <text x="595" y="73" font-size="6.5" fill="#b85450" font-weight="bold">a_amt</text>
  <line x1="490" y1="58" x2="490" y2="80" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="525" y1="58" x2="525" y2="80" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="555" y1="58" x2="555" y2="80" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="582" y1="58" x2="582" y2="80" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="450" y="80" width="170" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="93" text-anchor="middle" font-size="7.5" fill="#333">2018-12</text>
  <text x="505" y="93" text-anchor="middle" font-size="7.5" fill="#333">US</text>
  <text x="540" y="93" text-anchor="middle" font-size="7.5" fill="#333">2</text>
  <text x="568" y="93" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="595" y="93" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">1000</text>

  <rect x="450" y="100" width="170" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="113" text-anchor="middle" font-size="7.5" fill="#333">2019-01</text>
  <text x="505" y="113" text-anchor="middle" font-size="7.5" fill="#333">US</text>
  <text x="540" y="113" text-anchor="middle" font-size="7.5" fill="#333">1</text>
  <text x="568" y="113" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="595" y="113" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2000</text>

  <rect x="450" y="120" width="170" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="133" text-anchor="middle" font-size="7.5" fill="#333">2019-01</text>
  <text x="505" y="133" text-anchor="middle" font-size="7.5" fill="#333">DE</text>
  <text x="540" y="133" text-anchor="middle" font-size="7.5" fill="#333">1</text>
  <text x="568" y="133" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="595" y="133" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2000</text>

  <!-- ===== Key insight box ===== -->
  <rect x="20" y="200" width="600" height="252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="222" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键洞察：按 (月, 国家) 分组 + 条件聚合一次出 4 个指标</text>

  <text x="40" y="246" font-size="10" fill="#333">• <tspan fill="#d6a040" font-weight="bold">① DATE_FORMAT(trans_date, '%Y-%m')</tspan> 把日期截到「年-月」粒度，如 2018-12-18 → "2018-12"</text>
  <text x="40" y="266" font-size="10" fill="#333">• <tspan fill="#d6a040" font-weight="bold">② GROUP BY month, country</tspan> 按「月 × 国家」二维分组，同一月同一国家的交易归入一组</text>
  <text x="40" y="286" font-size="10" fill="#333">• <tspan fill="#446688" font-weight="bold">trans_count = COUNT(*)</tspan>：组内行数即交易笔数（含 approved/declined 全部）</text>
  <text x="40" y="306" font-size="10" fill="#333">• <tspan fill="#446688" font-weight="bold">trans_total_amount = SUM(amount)</tspan>：组内全部 amount 求和</text>
  <text x="40" y="326" font-size="10" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">approved_count = SUM(IF(state='approved',1,0))</tspan>：只给 approved 行记 1，条件计数</text>
  <text x="40" y="346" font-size="10" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">approved_total_amount = SUM(IF(state='approved',amount,0))</tspan>：只累加 approved 行金额</text>

  <text x="40" y="372" font-size="10" fill="#b85450">⚠️ <tspan font-weight="bold">条件聚合 = SUM(IF(...))</tspan>：同一分组内用 IF 把 approved/declined 区分对待，一次扫描出 4 个指标</text>
  <text x="40" y="390" font-size="10" fill="#b85450">   不必先拆表再 JOIN——「条件计数/条件求和」是 SQL 一行多指标的通用写法</text>

  <text x="40" y="416" font-size="10" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">COUNT(IF(state='approved',1,NULL))</tspan> 也能做条件计数：IF 返回 NULL 时 COUNT 跳过，等价于 SUM(IF(..,1,0))</text>
  <text x="40" y="436" font-size="10" fill="#333">• 输出列名须严格匹配：<tspan fill="#b85450" font-weight="bold">month, country, trans_count, approved_count,</tspan></text>
  <text x="58" y="452" font-size="10" fill="#b85450" font-weight="bold">trans_total_amount, approved_total_amount</text>
</svg>
