  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：DATE_FORMAT 取月 → GROUP BY(月,国家) → 条件聚合(COUNT/SUM + IF approved)</text>

