<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：K 堆合一堆，每次少 (K−1) 堆</text>

  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每次合并 K 堆 → 1 堆，堆数减少 (K−1)</text>

  <text x="60" y="84" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合并前：5 堆，K = 3</text>

  <rect x="60" y="92" width="76" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="140" y="92" width="76" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="178" y="117" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="220" y="92" width="76" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="258" y="117" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="300" y="92" width="76" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="338" y="117" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="380" y="92" width="76" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="138" y="86" width="240" height="52" rx="6" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="258" y="80" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">合并这连续 K=3 堆</text>

  <path d="M 258 138 Q 258 158 258 178" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="296" y="160" font-size="10" fill="#b85450" filter="url(#rough2)">成本 = 5+1+2 = 8</text>

  <text x="60" y="186" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">合并后：3 堆（少了 2 堆 = K−1）</text>

  <rect x="60" y="194" width="100" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="219" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="170" y="194" width="100" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="220" y="219" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="280" y="194" width="100" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="219" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="258" y="260" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">⋮  继续合并，直到 1 堆  ⋮</text>

  <rect x="60" y="284" width="460" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="13" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">可行性条件：堆数从 N → 1，共减 (N−1)</text>
  <text x="280" y="326" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">每次合并减 (K−1)，故需 (N−1) % (K−1) == 0</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不满足 → 直接返回 −1</text>

  <rect x="60" y="366" width="460" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">区间 DP：dp[i][j] = 合并 stones[i..j] 的最低成本</text>
  <text x="280" y="408" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">在切分点 k 处断开：dp[i][k] + dp[k+1][j]</text>
  <text x="280" y="428" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">当 (len−1)%(K−1)==0 时，触发最后一次合并 +sum(i..j)</text>
</svg>
