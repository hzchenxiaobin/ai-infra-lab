<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：正序收集只沿 next 走，prev 全程闲置</text>

  <!-- 遍历弧线 -->
  <path d="M53,88 C 150,52 350,52 449,86" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="251" y="48" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">curr 依次后移，一趟到底</text>

  <!-- head 指针 -->
  <text x="53" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">head</text>
  <path d="M53,82 L53,92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 双链表节点 -->
  <rect x="30" y="96" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="53" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="96" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="162" y="96" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="228" y="96" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="294" y="96" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="123" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="360" y="96" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="123" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="426" y="96" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="123" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- next 箭头（绿色，实际走的路） -->
  <path d="M79,108 L91,108" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M145,108 L157,108" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M211,108 L223,108" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M277,108 L289,108" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M343,108 L355,108" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M409,108 L421,108" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M473,107 L483,109" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="86" y="101" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">next</text>

  <!-- prev 箭头（灰色虚线，闲置） -->
  <path d="M93,126 L81,126" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M159,126 L147,126" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M225,126 L213,126" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M291,126 L279,126" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M357,126 L345,126" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M423,126 L411,126" stroke="#aaa" stroke-width="1.4" stroke-dasharray="3 3" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="86" y="143" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">prev</text>

  <!-- 空 -->
  <ellipse cx="497" cy="112" rx="13" ry="11" fill="#fafafa" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="497" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">∅</text>

  <!-- ans 收集 -->
  <text x="260" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans（动态数组：尾插收集）</text>
  <path d="M251,144 C 251,160 249,166 249,180" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="262" y="166" font-size="10" fill="#4a7a3a" filter="url(#rough2)">push_back 尾插 O(1)</text>

  <rect x="124" y="184" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="184" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="196" y="184" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="232" y="184" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="268" y="184" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="284" y="204" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="304" y="184" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="204" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="340" y="184" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="204" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 要点框 -->
  <rect x="40" y="234" width="440" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">「双向」是能力不是义务：正序输出 = 单链表同款 next 一趟</text>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">prev 指向遍历的反方向，全程用不上；终点 = 尾节点 next 为 ∅</text>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">值可重复（红色 3、2、1 各两次）——ans 收的是节点序列，不是值域</text>

  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿箭头 = next（走的路）；灰虚箭头 = prev（闲置）；∅ = 空</text>
</svg>
