<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW26" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例 2 演算：(2 × 5) ^ 2 = 100</text>

  <!-- table outer frame -->
  <rect x="36" y="42" width="488" height="184" fill="none" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="36" y="42" width="488" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="71"  y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">步骤</text>
  <text x="190" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">调用</text>
  <text x="345" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">运算</text>
  <text x="474" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">result</text>

  <!-- column dividers -->
  <path d="M106,42 L106,226" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M274,42 L274,226" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M416,42 L416,226" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row 1: new Calculator(2) -->
  <text x="71"  y="93" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">①</text>
  <text x="190" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">new Calculator(2)</text>
  <text x="345" y="93" text-anchor="middle" font-size="12" fill="#888">init</text>
  <rect x="430" y="78" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="474" y="98" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 2: .multiply(5) -->
  <text x="71"  y="129" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">②</text>
  <text x="190" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">.multiply(5)</text>
  <text x="345" y="129" text-anchor="middle" font-size="12" fill="#333">2 × 5</text>
  <rect x="430" y="114" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="474" y="134" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- row 3: .power(2) -->
  <text x="71"  y="165" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">③</text>
  <text x="190" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">.power(2)</text>
  <text x="345" y="165" text-anchor="middle" font-size="12" fill="#333">10 ^ 2</text>
  <rect x="430" y="150" width="88" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="474" y="170" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">100</text>

  <!-- row 4: .getResult() -->
  <text x="71"  y="201" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">④</text>
  <text x="190" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">.getResult()</text>
  <text x="345" y="201" text-anchor="middle" font-size="12" fill="#888">return</text>
  <rect x="430" y="186" width="88" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="4" filter="url(#rough2)"/>
  <text x="474" y="206" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">100</text>

  <!-- row dividers -->
  <path d="M36,110 L524,110" stroke="#446688" stroke-width="0.8" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M36,146 L524,146" stroke="#446688" stroke-width="0.8" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M36,182 L524,182" stroke="#446688" stroke-width="0.8" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- bottom note -->
  <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#888">每步 return this → 一路「.」下去；最后 getResult 取出 result</text>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#b85450">⚠ 注意：JS 中 ^ 是按位异或，幂运算须用 ** 或 Math.pow</text>
</svg>
