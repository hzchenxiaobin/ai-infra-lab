<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：各国参与者-时长均值 vs 全局均值</text>

  <!-- ===== Header row ===== -->
  <rect x="20" y="46" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">国家</text>

  <rect x="110" y="46" width="330" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">参与者-时长列表（每位参与者贡献一次）</text>

  <rect x="440" y="46" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">平均</text>

  <!-- ===== Peru row (highlight, investable) ===== -->
  <rect x="20" y="86" width="90" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="114" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Peru</text>

  <rect x="110" y="86" width="330" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="108" text-anchor="middle" font-size="11" fill="#333">102, 330, 5, 102, 330, 5</text>
  <text x="275" y="124" text-anchor="middle" font-size="10" fill="#888">和 = 874，个数 = 6</text>

  <rect x="440" y="86" width="100" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="114" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">145.67</text>

  <!-- check mark for Peru -->
  <text x="490" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">&gt; 全局 ✓</text>

  <!-- ===== Morocco row ===== -->
  <rect x="20" y="142" width="90" height="46" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="170" text-anchor="middle" font-size="12" fill="#333">Morocco</text>

  <rect x="110" y="142" width="330" height="46" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="164" text-anchor="middle" font-size="11" fill="#333">33, 59, 3, 7, 4, 59</text>
  <text x="275" y="180" text-anchor="middle" font-size="10" fill="#888">和 = 165，个数 = 6</text>

  <rect x="440" y="142" width="100" height="46" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="170" text-anchor="middle" font-size="12" fill="#333">27.50</text>

  <!-- ===== Israel row ===== -->
  <rect x="20" y="198" width="90" height="46" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="226" text-anchor="middle" font-size="12" fill="#333">Israel</text>

  <rect x="110" y="198" width="330" height="46" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="220" text-anchor="middle" font-size="11" fill="#333">13, 3, 1, 7, 33, 4, 13, 1</text>
  <text x="275" y="236" text-anchor="middle" font-size="10" fill="#888">和 = 75，个数 = 8</text>

  <rect x="440" y="198" width="100" height="46" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="226" text-anchor="middle" font-size="12" fill="#333">9.375</text>

  <!-- ===== Global average row ===== -->
  <rect x="20" y="264" width="420" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="65" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">全局</text>
  <text x="275" y="286" text-anchor="middle" font-size="11" fill="#333">Σ duration = 33+4+59+102+330+5+13+3+1+7 = 557</text>
  <text x="275" y="302" text-anchor="middle" font-size="10" fill="#888">通话数 = 10（每通计一次，非两次）</text>

  <rect x="440" y="264" width="100" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">55.70</text>

  <!-- ===== Conclusion ===== -->
  <rect x="20" y="324" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#a07020" font-weight="bold">仅 Peru 的 145.67 &gt; 全局 55.70</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#555">→ 输出 country = Peru</text>
</svg>
