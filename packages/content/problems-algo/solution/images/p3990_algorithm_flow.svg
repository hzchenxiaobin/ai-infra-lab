<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="15" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：二进制分解 k → zigzag 铺块 → 置位铺连接行 → 右列走廊</text>
  <text x="260" y="30" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">与 I 版最大不同：网格尺寸自选 ⇒ k ≥ 1 恒可构造，无特判、无返回 [] 的分支</text>

  <rect x="94" y="40" width="152" height="24" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="56" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">输入 k（1 ≤ k ≤ 1000）</text>
  <path d="M 170 64 L 170 74" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="66" y="76" width="208" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="89" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">maxb = ⌊log₂k⌋（最高置位）</text>
  <text x="170" y="101" text-anchor="middle" font-size="9" fill="#33507a" filter="url(#rough2)">R = 2(maxb+1) 行 × 13 列，先全填 '#'</text>
  <path d="M 170 106 L 170 114" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="94" y="114" width="152" height="22" rx="11" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="129" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">for b = 0 .. maxb</text>
  <text x="88" y="129" text-anchor="end" font-size="8.5" fill="#999" filter="url(#rough2)">循环 ↻</text>
  <path d="M 170 136 L 170 144" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="66" y="146" width="208" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="159" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">打开块 b 的 2×2 四格</text>
  <text x="170" y="171" text-anchor="middle" font-size="9" fill="#33507a" filter="url(#rough2)">(2b,b) (2b,b+1) (2b+1,b) (2b+1,b+1)</text>
  <path d="M 170 176 L 170 184" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <polygon points="170,184 236,208 170,232 104,208" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="212" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">k 的第 b 位 = 1 ?</text>
  <path d="M 236 208 L 250 208" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="248" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="254" y="192" width="250" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="205" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">打开第 2b 行的列 b+2 .. 12（连接行）</text>
  <text x="379" y="219" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">把这 2^b 股流送进第 12 列走廊</text>
  <path d="M 170 232 L 170 244" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="177" y="242" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="94" y="246" width="152" height="22" rx="11" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="261" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">b ← b + 1</text>
  <path d="M 94 257 L 32 257 L 32 125 L 90 125" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 170 268 L 170 282" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="178" y="280" font-size="8.5" fill="#888" filter="url(#rough2)">b &gt; maxb 时退出循环</text>
  <rect x="66" y="284" width="208" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="297" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">第 12 列第 0 .. R−1 行全开 = 终点走廊</text>
  <text x="170" y="309" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">各连接行在此汇流，入列后只能向下</text>
  <path d="M 170 314 L 170 322" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="66" y="324" width="208" height="30" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="337" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 R × 13 网格（20 × 13 ⊆ 25 × 25）</text>
  <text x="170" y="349" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">总路径数 = Σ 2^b = k ✓</text>
  <rect x="254" y="40" width="250" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="56" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">正确性三件套</text>
  <text x="264" y="71" font-size="8.5" fill="#444" filter="url(#rough2)">• 乘法：块内 2 条不相交路 ⇒ 流过块 b 即 ×2</text>
  <text x="264" y="84" font-size="8.5" fill="#444" filter="url(#rough2)">• 加法：连接行全在偶数行、上下邻格全封，互不干扰</text>
  <text x="264" y="97" font-size="8.5" fill="#444" filter="url(#rough2)">• 汇流：第 11 列只在连接行开格 ⇒ 走廊进流唯一；</text>
  <text x="270" y="109" font-size="8.5" fill="#444" filter="url(#rough2)">入走廊后只能向下，每股恰 1 条走法到终点</text>
  <rect x="254" y="124" width="250" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="139" text-anchor="middle" font-size="10.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">尺寸账（官方 hint：≤ 20 行 13 列）</text>
  <text x="264" y="153" font-size="8.5" fill="#444" filter="url(#rough2)">k ≤ 1000 &lt; 2¹⁰ ⇒ maxb ≤ 9 ⇒ 块占行 0..19（20 行）</text>
  <text x="264" y="166" font-size="8.5" fill="#444" filter="url(#rough2)">列 = 块区 11 + 隔离 1 + 走廊 1 = 13 ⊆ 25 × 25 ✓</text>
  <text x="264" y="178" font-size="8.5" fill="#444" filter="url(#rough2)">k 小则网格更小：R = 2(⌊log₂k⌋+1) 行</text>
  <rect x="254" y="330" width="250" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="346" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">验证：63 题计数 DP 全量测试 k = 1..1000，路径数均恰为 k ✓</text>
</svg>
