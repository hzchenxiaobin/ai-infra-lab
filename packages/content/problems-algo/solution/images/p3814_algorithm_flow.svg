<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 前缀最大容量 + 单调双指针</text>

  <!-- ============ 左列主干 ============ -->
  <g filter="url(#rough2)">
    <rect x="110" y="52" width="80" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="70" text-anchor="middle" font-size="12.5" fill="#33506b">开始</text>
  </g>
  <path d="M 150 78 L 150 96" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="46" y="100" width="208" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="121" text-anchor="middle" font-size="12" fill="#33506b">① 排序 (cost, cap) 按成本升序</text>
  </g>
  <path d="M 150 134 L 150 150" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="46" y="154" width="208" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="175" text-anchor="middle" font-size="12" fill="#33506b">② 一遍扫 prefMax（前缀最大容量）</text>
  </g>
  <path d="M 150 188 L 150 204" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="46" y="208" width="208" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="150" y="228" text-anchor="middle" font-size="12" fill="#33506b">③ 单台：t = 最右 cost &lt; budget</text>
    <text x="150" y="245" text-anchor="middle" font-size="11.5" fill="#33506b">ans = prefMax[t]（t &lt; 0 跳过）</text>
  </g>
  <path d="M 150 252 L 150 268" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="46" y="272" width="208" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="150" y="293" text-anchor="middle" font-size="12" fill="#8a6d1a">④ 两台：p = n−1，i = 0</text>
  </g>
  <path d="M 254 289 L 268 289 L 268 70 L 310 70" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="76" y="356" width="148" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="150" y="375" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">返回 ans</text>
  </g>

  <!-- ============ 右列两台循环 ============ -->
  <g filter="url(#rough2)">
    <rect x="310" y="56" width="238" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="429" y="73" text-anchor="middle" font-size="11.5" fill="#33506b">取 i（0 → n−1，配对中下标较大的一台）</text>
    <text x="429" y="90" text-anchor="middle" font-size="12" fill="#33506b">rem = budget − cost[i]</text>
  </g>
  <path d="M 429 96 L 429 112" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="310" y="116" width="238" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="429" y="133" text-anchor="middle" font-size="12" fill="#8a6d1a">while p ≥ 0 且 cost[p] ≥ rem：</text>
    <text x="429" y="150" text-anchor="middle" font-size="12" fill="#8a6d1a">　　p −−</text>
  </g>
  <text x="429" y="172" text-anchor="middle" font-size="10.5" fill="#b8862a" filter="url(#rough2)">rem 随 i 递减 ⟹ p 单向左移，均摊 O(n)</text>
  <path d="M 429 178 L 429 186" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="310" y="190" width="238" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="429" y="210" text-anchor="middle" font-size="12" fill="#33506b">q = min(p, i−1)（搭档还须下标 &lt; i）</text>
  </g>
  <path d="M 429 220 L 429 228" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="429,232 497,262 429,292 361,262" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="429" y="267" text-anchor="middle" font-size="12.5" fill="#33506b">q ≥ 0 ？</text>
  </g>
  <path d="M 429 292 L 429 306" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="303" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="310" y="310" width="238" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="429" y="331" text-anchor="middle" font-size="12" fill="#2f5d24">ans = max(ans, cap[i] + prefMax[q])</text>
  </g>
  <path d="M 429 344 L 429 356" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="390" y="360" width="78" height="26" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="429" y="377" text-anchor="middle" font-size="12" fill="#33506b">i + 1</text>
  </g>

  <!-- 否：绕过更新框直达 i+1 -->
  <path d="M 497 262 L 524 262 L 524 373 L 468 373" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="506" y="254" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 回边：i+1 → 取 i -->
  <path d="M 390 373 L 292 373 L 292 82 L 310 82" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="283" y="228" font-size="11" fill="#446688" text-anchor="middle" transform="rotate(-90 283 228)" filter="url(#rough2)">i &lt; n</text>

  <!-- 出口：i+1 → 返回 -->
  <path d="M 429 386 L 429 401 L 150 401 L 150 386" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="397" font-size="11" fill="#666" filter="url(#rough2)">i = n（扫完）</text>
</svg>
