<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后取两端，乘积差最大</text>

  <!-- Original array -->
  <text x="60" y="60" font-size="11.5" fill="#888">原数组 nums：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="82" y="91">5</text>
    <rect x="108" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="91">6</text>
    <rect x="156" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="91">2</text>
    <rect x="204" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="226" y="91">7</text>
    <rect x="252" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="91">4</text>
  </g>

  <!-- arrow down: sort -->
  <path d="M 178 110 L 178 134" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="196" y="128" font-size="11" fill="#b85450" font-weight="bold">排序</text>

  <!-- Sorted array with highlights -->
  <text x="60" y="158" font-size="11.5" fill="#888">排序后：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <!-- two smallest: green/orange highlight -->
    <rect x="60" y="166" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="82" y="189">2</text>
    <rect x="108" y="166" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="130" y="189">4</text>
    <!-- middle -->
    <rect x="156" y="166" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="189">5</text>
    <!-- two largest: blue/red highlight -->
    <rect x="204" y="166" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="226" y="189">6</text>
    <rect x="252" y="166" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="274" y="189">7</text>
  </g>

  <!-- labels under extremes -->
  <text x="130" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">min1, min2（最小俩）</text>
  <text x="240" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">max2, max1（最大俩）</text>

  <!-- Divider -->
  <path d="M 40 232 L 520 232" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Two product boxes -->
  <text x="280" y="254" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">拆成两步：最大化被减数，最小化减数</text>

  <!-- max product box -->
  <rect x="60" y="270" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="160" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">被减数最大化</text>
  <text x="160" y="312" text-anchor="middle" font-size="11.5" fill="#4a7a3a">max1 × max2 = 7 × 6 = 42</text>

  <!-- min product box -->
  <rect x="300" y="270" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">减数最小化</text>
  <text x="400" y="312" text-anchor="middle" font-size="11.5" fill="#d6a040">min1 × min2 = 2 × 4 = 8</text>

  <!-- minus sign -->
  <text x="288" y="304" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">−</text>

  <!-- Conclusion box -->
  <rect x="60" y="346" width="440" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = max1 × max2 − min1 × min2 = 42 − 8 = 34</text>

  <!-- note -->
  <text x="60" y="396" font-size="11" fill="#555">• nums[i] ≥ 1（全正）→ 乘积随元素单调，两端即极值</text>
  <text x="60" y="412" font-size="11" fill="#555">• n ≥ 4 → 两个最大与两个最小下标必互异，满足「不同下标」</text>
</svg>
