<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：command 是变长 token 序列，首字符决定如何分词</text>

  <!-- Input label -->
  <text x="40" y="70" font-size="11" fill="#888">command =</text>

  <!-- Token boxes: G  ()  (al) -->
  <g filter="url(#rough2)">
    <rect x="92" y="54" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="136" y="54" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="54" width="72" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="114" y="77" fill="#4a7a3a">G</text>
    <text x="164" y="77" fill="#446688">()</text>
    <text x="228" y="77" fill="#d6a040">(al)</text>
  </g>

  <!-- mapping arrows down -->
  <path d="M 114 92 L 114 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 164 92 L 164 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 228 92 L 228 128" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- interpreted boxes -->
  <g filter="url(#rough2)">
    <rect x="92" y="130" width="44" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="136" y="130" width="56" height="34" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="130" width="72" height="34" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="114" y="152" fill="#4a7a3a">G</text>
    <text x="164" y="152" fill="#446688">o</text>
    <text x="228" y="152" fill="#d6a040">al</text>
  </g>

  <!-- concat arrow -->
  <path d="M 168 168 L 168 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="186" font-size="10" fill="#888">拼接</text>

  <!-- result -->
  <rect x="120" y="198" width="124" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="182" y="220" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">"Goal"</text>

  <!-- Dispatch table on the right -->
  <rect x="340" y="54" width="200" height="178" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">分词规则（看首字符）</text>
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="340" y1="82" x2="540" y2="82"/>
    <line x1="340" y1="118" x2="540" y2="118"/>
    <line x1="340" y1="154" x2="540" y2="154"/>
    <line x1="430" y1="54" x2="430" y2="232"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="385" y="100" font-weight="bold" fill="#555">首字符</text>
    <text x="485" y="100" font-weight="bold" fill="#555">动作</text>

    <text x="385" y="138" font-weight="bold" fill="#4a7a3a">G</text>
    <text x="485" y="138">输出 G，i+=1</text>

    <text x="385" y="174" font-weight="bold" fill="#446688">( )</text>
    <text x="485" y="174">输出 o，i+=2</text>

    <text x="385" y="210" font-weight="bold" fill="#d6a040">( a</text>
    <text x="485" y="210">输出 al，i+=4</text>
  </g>

  <!-- Insight box -->
  <rect x="40" y="260" width="480" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="282" font-size="12" fill="#446688" font-weight="bold">关键洞察</text>
  <text x="58" y="302" font-size="11" fill="#555">• 这是一道「微型词法分析器」：把串切成 token，每个 token 映射成一段字符串</text>
  <text x="58" y="320" font-size="11" fill="#555">• token 长度不固定（1 / 2 / 4），但首字符互不重叠：'G' vs '('，再看 '(' 后一位即可定长度</text>
  <text x="58" y="338" font-size="11" fill="#555">• 因此单指针 i 一次扫描即可，无需回溯、无需栈</text>
  <text x="58" y="356" font-size="11" fill="#b85450" font-weight="bold">保证输入合法 → 不必做错误处理，i+=1/2/4 三分支即可</text>
</svg>
