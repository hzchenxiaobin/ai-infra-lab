<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#d6a040" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：整体异或 start，起点从 0 平移到 start</text>

  <!-- Row 1 label -->
  <text x="20" y="86" font-size="11" fill="#888" font-weight="bold">标准格雷码</text>
  <text x="20" y="100" font-size="10" fill="#888">G(i)=i^(i&gt;&gt;1)</text>

  <!-- Row 1: standard Gray code [0,1,3,2,6,7,5,4], start at 0 -->
  <!-- box0: 0 (highlighted as start-of-standard) -->
  <rect x="120" y="68" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="142" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">0</text>

  <rect x="170" y="68" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">1</text>

  <rect x="220" y="68" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="242" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">3</text>

  <rect x="270" y="68" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="292" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">2</text>

  <rect x="320" y="68" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="342" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">6</text>

  <rect x="370" y="68" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="392" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">7</text>

  <rect x="420" y="68" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="442" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">5</text>

  <rect x="470" y="68" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="492" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">4</text>

  <!-- position 0 marker -->
  <text x="142" y="58" text-anchor="middle" font-size="9" fill="#446688">i=0</text>

  <!-- XOR start arrow (vertical, center) -->
  <rect x="225" y="118" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">⊕ start = 2</text>
  <path d="M 270 110 L 270 116" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <path d="M 270 150 L 270 168" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <!-- Row 2 label -->
  <text x="20" y="196" font-size="11" fill="#888" font-weight="bold">异或后序列</text>
  <text x="20" y="210" font-size="10" fill="#888">p[i]=G(i)^start</text>

  <!-- Row 2: [2,3,1,0,4,5,7,6], position 0 = start = 2 (highlighted orange) -->
  <rect x="120" y="178" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="142" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">2</text>

  <rect x="170" y="178" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">3</text>

  <rect x="220" y="178" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="242" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">1</text>

  <rect x="270" y="178" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="292" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">0</text>

  <rect x="320" y="178" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="342" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">4</text>

  <rect x="370" y="178" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="392" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">5</text>

  <rect x="420" y="178" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="442" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">7</text>

  <rect x="470" y="178" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="492" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="monospace">6</text>

  <!-- position 0 = start marker -->
  <text x="142" y="168" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">=start</text>

  <!-- Insight box: why it works -->
  <rect x="30" y="232" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键不变式：(a ⊕ c) ⊕ (b ⊕ c) = a ⊕ b</text>
  <text x="270" y="270" text-anchor="middle" font-size="10.5" fill="#666">整体异或常量不改变相邻两项的差异 → 相邻差 1 位 + 首尾循环 全部保留</text>

  <!-- second insight: bijection -->
  <rect x="30" y="292" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">⊕ start 是 [0, 2ⁿ) 上的双射</text>
  <text x="270" y="330" text-anchor="middle" font-size="10.5" fill="#666">标准格雷码本就是排列 → 异或后仍是无重复排列；p[0] = 0 ⊕ start = start ✓</text>
</svg>
