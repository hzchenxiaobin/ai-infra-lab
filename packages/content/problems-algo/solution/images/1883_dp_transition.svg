<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">DP 状态转移：dp[i][j] = 完成前 i+1 段路程、用了 j 次跳过的最小「距离」</text>

  <!-- ===== State definition box ===== -->
  <rect x="40" y="38" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">dp[i][j]：完成 ride 0..i，在 rest 0..i−1 中跳过 j 次后的最小累计距离（= speed × 实际时间）</text>

  <!-- ===== Transition diagram ===== -->
  <!-- Row labels: i-1 -->
  <text x="40" y="98" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">ride i−1 完成：</text>

  <!-- Source states: dp[i-1][j] and dp[i-1][j-1] -->
  <rect x="90" y="82" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="102" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i−1][j]</text>

  <rect x="300" y="82" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="102" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i−1][j−1]</text>

  <!-- Row label: i -->
  <text x="40" y="178" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">ride i 完成：</text>

  <!-- Target state: dp[i][j] -->
  <rect x="210" y="232" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[i][j]</text>

  <!-- ===== Branch 1: Not skip rest i-1 (from dp[i-1][j]) ===== -->
  <!-- Arrow from dp[i-1][j] down to intermediate -->
  <path d="M 135 114 L 135 140 L 210 165" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- Branch 1 label box -->
  <rect x="70" y="120" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="135" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">不跳过 rest i−1</text>
  <text x="140" y="148" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">⌈dp/speed⌉×speed+dist[i]</text>

  <!-- Arrow from branch 1 to dp[i][j] -->
  <path d="M 210 156 L 240 232" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- ===== Branch 2: Skip rest i-1 (from dp[i-1][j-1]) ===== -->
  <!-- Arrow from dp[i-1][j-1] down to intermediate -->
  <path d="M 350 114 L 350 140 L 310 165" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- Branch 2 label box -->
  <rect x="280" y="120" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="135" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">跳过 rest i−1</text>
  <text x="350" y="148" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">dp[i−1][j−1]+dist[i]</text>

  <!-- Arrow from branch 2 to dp[i][j] -->
  <path d="M 310 156 L 280 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- Min label -->
  <text x="260" y="222" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">取 min</text>

  <!-- ===== Formula summary ===== -->
  <rect x="40" y="278" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">dp[i][j] = min( ⌈dp[i−1][j] / speed⌉ × speed , dp[i−1][j−1] ) + dist[i]</text>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">左分支：等待到下一个 speed 的倍数 ｜ 右分支：直接累加，无等待</text>

  <!-- ===== Answer box ===== -->
  <rect x="40" y="340" width="480" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案：最小的 j 使得 dp[n−1][j] × 100 ≤ round(hoursBefore × 100) × speed</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（×100 消除 hoursBefore 的小数，全程整数比较，无浮点误差）</text>
</svg>
