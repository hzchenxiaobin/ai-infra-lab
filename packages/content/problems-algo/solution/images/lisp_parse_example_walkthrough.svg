<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 递归求值过程</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">(let x 2 (mult x (let x 3 y 4 (add x y))))  →  14</text>

  <!-- table header -->
  <rect x="30" y="54" width="500" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="11" fill="#fff" font-weight="bold">步骤</text>
  <text x="120" y="70" font-size="11" fill="#fff" font-weight="bold">位置</text>
  <text x="230" y="70" font-size="11" fill="#fff" font-weight="bold">动作</text>
  <text x="370" y="70" font-size="11" fill="#fff" font-weight="bold">作用域栈（顶在上）</text>

  <!-- rows -->
  <rect x="30" y="78" width="500" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="60" y="93" font-size="10" fill="#333">1</text>
  <text x="120" y="93" font-size="10" fill="#333">(let ...)</text>
  <text x="230" y="93" font-size="10" fill="#333">进入 let，压 S1</text>
  <text x="370" y="93" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">S1={}</text>

  <rect x="30" y="100" width="500" height="22" fill="#fafafa" filter="url(#rough2)"/>
  <text x="60" y="115" font-size="10" fill="#333">2</text>
  <text x="120" y="115" font-size="10" fill="#333">x 2</text>
  <text x="230" y="115" font-size="10" fill="#333">绑定 x=2</text>
  <text x="370" y="115" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">S1={x:2}</text>

  <rect x="30" y="122" width="500" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="60" y="137" font-size="10" fill="#333">3</text>
  <text x="120" y="137" font-size="10" fill="#333">(mult ...)</text>
  <text x="230" y="137" font-size="10" fill="#333">t="(" → 最终表达式</text>
  <text x="370" y="137" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">S1={x:2}</text>

  <rect x="30" y="144" width="500" height="22" fill="#fafafa" filter="url(#rough2)"/>
  <text x="60" y="159" font-size="10" fill="#333">4</text>
  <text x="120" y="159" font-size="10" fill="#333">x</text>
  <text x="230" y="159" font-size="10" fill="#333">求 e1：查 x → 2</text>
  <text x="370" y="159" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">栈顶命中 x=2</text>

  <rect x="30" y="166" width="500" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="60" y="181" font-size="10" fill="#333">5</text>
  <text x="120" y="181" font-size="10" fill="#333">(let x 3 ...)</text>
  <text x="230" y="181" font-size="10" fill="#333">内层 let，压 S2</text>
  <text x="370" y="181" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">S2={}, S1={x:2}</text>

  <rect x="30" y="188" width="500" height="22" fill="#fafafa" filter="url(#rough2)"/>
  <text x="60" y="203" font-size="10" fill="#333">6</text>
  <text x="120" y="203" font-size="10" fill="#333">x 3</text>
  <text x="230" y="203" font-size="10" fill="#333">绑定 x=3（遮蔽）</text>
  <text x="370" y="203" font-size="10" fill="#b85450" font-family="'Comic Sans MS', monospace">S2={x:3}, S1={x:2}</text>

  <rect x="30" y="210" width="500" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="60" y="225" font-size="10" fill="#333">7</text>
  <text x="120" y="225" font-size="10" fill="#333">y 4</text>
  <text x="230" y="225" font-size="10" fill="#333">绑定 y=4</text>
  <text x="370" y="225" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">S2={x:3,y:4}</text>

  <rect x="30" y="232" width="500" height="22" fill="#fafafa" filter="url(#rough2)"/>
  <text x="60" y="247" font-size="10" fill="#333">8</text>
  <text x="120" y="247" font-size="10" fill="#333">(add x y)</text>
  <text x="230" y="247" font-size="10" fill="#333">最终表达式，递归</text>
  <text x="370" y="247" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">S2={x:3,y:4}</text>

  <rect x="30" y="254" width="500" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="60" y="269" font-size="10" fill="#333">9</text>
  <text x="120" y="269" font-size="10" fill="#333">x, y</text>
  <text x="230" y="269" font-size="10" fill="#333">查 x→3, y→4</text>
  <text x="370" y="269" font-size="10" fill="#b85450" font-family="'Comic Sans MS', monospace">内层优先 add=7</text>

  <rect x="30" y="276" width="500" height="22" fill="#fafafa" filter="url(#rough2)"/>
  <text x="60" y="291" font-size="10" fill="#333">10</text>
  <text x="120" y="291" font-size="10" fill="#333">弹出 S2</text>
  <text x="230" y="291" font-size="10" fill="#333">返回 7</text>
  <text x="370" y="291" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">S1={x:2}</text>

  <rect x="30" y="298" width="500" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="60" y="313" font-size="10" fill="#4a7a3a" font-weight="bold">11</text>
  <text x="120" y="313" font-size="10" fill="#4a7a3a" font-weight="bold">mult</text>
  <text x="230" y="313" font-size="10" fill="#4a7a3a" font-weight="bold">2 * 7 = 14</text>
  <text x="370" y="313" font-size="10" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">弹出 S1 → 返回 14</text>

  <!-- summary -->
  <rect x="30" y="338" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键：内层 let 的 x=3 遮蔽外层 x=2</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#444">add 查 x 时栈顶 S2 先命中 → 取 3（非外层 2）</text>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#444">S2 弹出后回到 S1，x 恢复为 2 → mult 2*7=14</text>
</svg>
