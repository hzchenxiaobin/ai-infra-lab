<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：TFTF / ab → ababa ；FF / aa → aba</text>

  <!-- ===== 上半：例 1 ===== -->
  <text x="70" y="50" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：str1 = "TFTF"，str2 = "ab"，L = 5</text>

  <!-- str1 条带 -->
  <rect x="72" y="58" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="87" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="102" y="58" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="117" y="74" text-anchor="middle" font-size="11" fill="#a07020" font-weight="bold" filter="url(#rough2)">F</text>
  <rect x="132" y="58" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="147" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="162" y="58" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="177" y="74" text-anchor="middle" font-size="11" fill="#a07020" font-weight="bold" filter="url(#rough2)">F</text>
  <text x="205" y="74" font-size="10.5" fill="#888" filter="url(#rough2)">← str1</text>

  <!-- word 格子 -->
  <rect x="72" y="92" width="38" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="110" y="92" width="38" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="148" y="92" width="38" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="186" y="92" width="38" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="224" y="92" width="38" height="36" rx="4" fill="#fff" stroke="#888" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="91" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="129" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="167" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="205" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="243" y="115" text-anchor="middle" font-size="13" fill="#a07020" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- 步骤注 -->
  <text x="292" y="102" font-size="10.5" fill="#446688" filter="url(#rough2)">T@0、T@2 各钉 "ab"</text>
  <text x="292" y="118" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">F@1: "ba"≠"ab" ✓</text>
  <text x="292" y="134" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">F@3: "ba"≠"ab" ✓ 位4 填 'a'</text>

  <!-- 答案条 -->
  <rect x="72" y="140" width="190" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="158" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">答案 "ababa" ✓</text>
  <text x="292" y="158" font-size="10.5" fill="#888" filter="url(#rough2)">（"ababb" 也可行但更大）</text>

  <!-- 分隔线 -->
  <path d="M 30 180 L 490 180" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="8,5" filter="url(#rough2)"/>

  <!-- ===== 下半：禁态回退 ===== -->
  <text x="70" y="204" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">例 2：str1 = "FF"，str2 = "aa" —— 禁态回退，三位全自由</text>

  <!-- 三个位置的贪心步骤 -->
  <rect x="72" y="216" width="38" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="91" y="239" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="110" y="216" width="38" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="129" y="239" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="148" y="216" width="38" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="239" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="91" y="266" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">x=0</text>
  <text x="129" y="266" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">x=1</text>
  <text x="167" y="266" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">x=2</text>

  <!-- 每步状态注 -->
  <rect x="228" y="212" width="96" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="230" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">x=0：试 'a'</text>
  <text x="276" y="246" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">j: 0→1 放行</text>

  <rect x="332" y="212" width="96" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="228" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">x=1：'a'→j=2=m</text>
  <text x="380" y="242" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">F@0 端点，禁！</text>
  <text x="380" y="255" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">改 'b'，j→0</text>

  <rect x="436" y="212" width="76" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="474" y="230" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">x=2：'a'</text>
  <text x="474" y="246" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">j=1 ✓</text>

  <path d="M 186 234 L 226 234" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <rect x="72" y="284" width="440" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="304" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案 "aba"：F@0 窗口 "ab" ≠ "aa" ✓，F@1 窗口 "ba" ≠ "aa" ✓</text>
  <text x="292" y="324" text-anchor="middle" font-size="10.5" fill="#a07020" filter="url(#rough2)">若不回退填 "aab"：F@0 窗口 "aa" 恰好全等 str2 → 违法。单看一位不违法，违法的是整窗全等</text>
</svg>
