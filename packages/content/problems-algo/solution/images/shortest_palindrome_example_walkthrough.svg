  <rect x="202" y="44" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="66" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="230" y="44" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
