  <text x="524" y="133" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>

  <rect x="524" y="44" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="538" y="66" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="538" y="98" text-anchor="middle" font-size="10" fill="#888">16</text>
  <rect x="524" y="114" width="28" height="28" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="538" y="133" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>

  <path d="M90 152 L90 160 L314 160 L314 152" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="202" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">步 8：# 截断前缀链，j 回跳到 0</text>

  <path d="M342 186 L342 194 L538 194 L538 186" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="440" y="210" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">步 9→16：reverse(s) 后缀逐位对上 s 前缀，j 递增</text>

  <rect x="60" y="226" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">lps[16] = 7 → 最长回文前缀 s[0..6] = "aacecaa"</text>

  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">拼接答案</text>

  <rect x="80" y="294" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"a"（补）</text>

  <path d="M202 309 L218 309" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="294" width="252" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="348" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"aacecaaa"（原串 s）</text>

  <rect x="60" y="336" width="440" height="18" fill="none" stroke="none"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= "aaacecaaa" ✓ 回文</text>
