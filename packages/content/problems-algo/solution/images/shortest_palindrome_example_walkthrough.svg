  <text x="496" y="66" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="510" y="44" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="524" y="66" text-anchor="middle" font-size="14" fill="#333">a</text>

  <text x="50" y="98" font-size="11" fill="#666" font-weight="bold">下标</text>
  <text x="104" y="98" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="132" y="98" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="160" y="98" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="188" y="98" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="216" y="98" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="244" y="98" text-anchor="middle" font-size="10" fill="#888">5</text>
