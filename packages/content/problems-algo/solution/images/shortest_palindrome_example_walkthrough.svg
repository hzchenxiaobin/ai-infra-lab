  <text x="160" y="133" text-anchor="middle" font-size="12" fill="#888">0</text>
  <rect x="174" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="188" y="133" text-anchor="middle" font-size="12" fill="#888">0</text>
  <rect x="202" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="216" y="133" text-anchor="middle" font-size="12" fill="#888">0</text>
  <rect x="230" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="244" y="133" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <rect x="258" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="272" y="133" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <rect x="286" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="133" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <rect x="314" y="114" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="133" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="342" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="356" y="133" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <rect x="370" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="384" y="133" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <rect x="398" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="133" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <rect x="426" y="114" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="133" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
