  <text x="50" y="132" font-size="11" fill="#666" font-weight="bold">LPS</text>
  <rect x="90" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="104" y="133" text-anchor="middle" font-size="12" fill="#888">0</text>
  <rect x="118" y="114" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
