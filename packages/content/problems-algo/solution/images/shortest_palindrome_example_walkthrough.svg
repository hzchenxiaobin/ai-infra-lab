  <text x="440" y="66" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="454" y="44" width="28" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="66" text-anchor="middle" font-size="14" fill="#333">e</text>
