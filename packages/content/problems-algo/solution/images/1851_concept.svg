<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：双侧约束 l ≤ q ≤ r → 离线排序 + 最小堆</text>

  <!-- ===== Top-left: intervals sorted by left asc ===== -->
  <text x="160" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 区间按 left 升序排</text>

  <text x="40" y="86" font-size="10" fill="#888" filter="url(#rough2)">l,r</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="80" y="76" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="93" fill="#446688" font-weight="bold">1,3</text>
    <rect x="150" y="76" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="182" y="93" fill="#446688" font-weight="bold">2,3</text>
    <rect x="220" y="76" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="252" y="93" fill="#446688" font-weight="bold">3,7</text>
    <rect x="80" y="108" width="64" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="112" y="125" fill="#aaa">6,6</text>
  </g>
  <text x="160" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">游标 ptr：left ≤ q 的逐个入堆</text>
  <path d="M 160 156 L 160 168" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Top-right: queries sorted asc ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 查询按 q 升序排（带原下标）</text>

  <text x="316" y="86" font-size="10" fill="#888" filter="url(#rough2)">q,idx</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="360" y="76" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="392" y="93" fill="#4a7a3a" font-weight="bold">1,#2</text>
    <rect x="430" y="76" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="462" y="93" fill="#4a7a3a" font-weight="bold">2,#0</text>
    <rect x="360" y="108" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="392" y="125" fill="#4a7a3a" font-weight="bold">3,#1</text>
    <rect x="430" y="108" width="64" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="462" y="125" fill="#aaa">…</text>
  </g>
  <text x="430" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">q 升序 → 过期区间可永久丢弃</text>

  <!-- ===== Middle: arrows down to heap ===== -->
  <path d="M 160 172 L 160 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 140 L 430 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: min-heap keyed by length ===== -->
  <rect x="60" y="192" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="78" y="208" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 最小堆（按 length 升序，元素 = (length, right)）</text>
  <text x="78" y="226" font-size="10" fill="#555" filter="url(#rough2)">left ≤ q 的区间入堆；堆顶即最短区间，O(1) 取最值</text>

  <!-- heap visualization: (len, r) -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="120" y="248" width="64" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="152" y="267" fill="#b85450" font-weight="bold">2,3</text>
    <rect x="200" y="248" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="232" y="267" fill="#446688" font-weight="bold">3,3</text>
    <rect x="280" y="248" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="312" y="267" fill="#446688" font-weight="bold">5,7</text>
  </g>
  <text x="152" y="244" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">堆顶=最短</text>
  <text x="370" y="267" font-size="10" fill="#888" filter="url(#rough2)">← priority_queue</text>

  <!-- ===== Two constraints ===== -->
  <text x="290" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">约束 l ≤ q ≤ r 拆成两半分别处理</text>

  <rect x="40" y="312" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="330" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">左约束 l ≤ q</text>
  <text x="60" y="346" font-size="10" fill="#555" filter="url(#rough2)">排序 + 游标 ptr 入堆</text>

  <rect x="300" y="312" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="330" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">右约束 q ≤ r</text>
  <text x="320" y="346" font-size="10" fill="#555" filter="url(#rough2)">弹堆：r &lt; q 的永久丢弃</text>

  <path d="M 152 290 L 152 280" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Bottom: answer ===== -->
  <rect x="60" y="362" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">弹尽无效后，堆顶 length = answer[j]；堆空 → -1</text>

  <!-- footer insight -->
  <rect x="40" y="408" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="428" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">为什么弹出的区间可永久丢弃？</text>
  <text x="56" y="446" font-size="10" fill="#555" filter="url(#rough2)">查询按 q 升序处理。r &lt; q 的区间对当前 q 无效，对后续 q' ≥ q 更无效（q' ≥ q &gt; r）。</text>
  <text x="56" y="462" font-size="10" fill="#555" filter="url(#rough2)">故弹出即弃，不会遗漏——这是「单调查询 + 永久淘汰」的摊还保证，与 1847 游标同理。</text>
</svg>
