<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：把「是否已排除边」写进状态——分层 Dijkstra</text>

  <!-- 第 1 层（j=1） -->
  <rect x="90" y="34" width="410" height="146" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="102" y="54" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">第 1 层 j = 1：已排除一条边（其余照常计费）</text>

  <g filter="url(#rough2)">
    <line x1="210" y1="155" x2="410" y2="155" stroke="#888" stroke-width="1.6"/>
    <line x1="410" y1="155" x2="310" y2="82" stroke="#888" stroke-width="1.6"/>
    <line x1="210" y1="155" x2="310" y2="82" stroke="#b85450" stroke-width="2.2"/>
    <text x="310" y="172" text-anchor="middle" font-size="10.5" fill="#666">w=1</text>
    <text x="382" y="118" text-anchor="middle" font-size="10.5" fill="#666">w=1</text>
    <text x="222" y="112" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">w=50000</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="210" cy="155" r="15" fill="#fff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="210" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
    <circle cx="410" cy="155" r="15" fill="#fff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="410" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <circle cx="310" cy="82" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="310" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="330" y="78" font-size="10.5" fill="#8a6d1f" font-weight="bold">终点 (2,1) = 0</text>
  </g>

  <!-- 第 0 层（j=0） -->
  <rect x="90" y="196" width="410" height="146" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="102" y="216" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 0 层 j = 0：尚未排除边（边照常计费）</text>

  <g filter="url(#rough2)">
    <line x1="210" y1="315" x2="410" y2="315" stroke="#888" stroke-width="1.6"/>
    <line x1="410" y1="315" x2="310" y2="242" stroke="#888" stroke-width="1.6"/>
    <line x1="210" y1="315" x2="310" y2="242" stroke="#b85450" stroke-width="2.2"/>
    <text x="310" y="334" text-anchor="middle" font-size="10.5" fill="#666">w=1</text>
    <text x="382" y="275" text-anchor="middle" font-size="10.5" fill="#666">w=1</text>
    <text x="222" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">w=50000</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="210" cy="315" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="210" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
    <text x="186" y="320" text-anchor="end" font-size="10.5" fill="#8a6d1f" font-weight="bold">起点 (0,0)</text>
    <circle cx="410" cy="315" r="15" fill="#fff" stroke="#446688" stroke-width="1.8"/>
    <text x="410" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <circle cx="310" cy="242" r="15" fill="#fff" stroke="#446688" stroke-width="1.8"/>
    <text x="310" y="247" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- 跨层转移：把权重 50000 的边排除（免费通过） -->
  <path d="M 196 302 C 60 258, 60 130, 296 86" fill="none" stroke="#4a7a3a" stroke-width="2.5"
        stroke-dasharray="7 5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="44" y="250" transform="rotate(-90 44 250)" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">把权重 50000 的边排除：免费通过（+0）</text>

  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">层内转移：+ w（照常付费）　·　跨层转移：+ 0（把这条边排除）　·　答案 = dist[n−1][1]</text>
</svg>
