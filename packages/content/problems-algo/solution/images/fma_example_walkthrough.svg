<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：array=[1,2,3,4,5,3,1], target=3</text>

  <!-- ===== Mountain array at top ===== -->
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888">数组（下标 0-6，峰值在下标 4）</text>

  <!-- index labels -->
  <text x="80" y="72" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="140" y="72" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="200" y="72" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="260" y="72" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="320" y="72" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="380" y="72" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="440" y="72" text-anchor="middle" font-size="9" fill="#888">6</text>

  <!-- cells -->
  <rect x="58" y="80" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="118" y="80" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="178" y="80" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="238" y="80" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="298" y="80" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="358" y="80" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="418" y="80" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- peak label -->
  <text x="320" y="72" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">peak</text>
  <!-- target label on index 2 -->
  <text x="200" y="72" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">target→</text>

  <!-- ===== Step 1: Peak finding table ===== -->
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">第一步：斜率二分找峰顶（3 轮，6 次 get）</text>

  <!-- table header -->
  <rect x="30" y="140" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="156" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">轮次</text>
  <text x="130" y="156" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">lo</text>
  <text x="180" y="156" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">hi</text>
  <text x="230" y="156" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">mid</text>
  <text x="310" y="156" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">get(mid)</text>
  <text x="390" y="156" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">get(mid+1)</text>
  <text x="480" y="156" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">动作</text>

  <!-- row 1 -->
  <rect x="30" y="164" width="500" height="22" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="179" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="130" y="179" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="180" y="179" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="230" y="179" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="310" y="179" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="390" y="179" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="480" y="179" text-anchor="middle" font-size="9" fill="#446688">↑ lo=4</text>

  <!-- row 2 -->
  <rect x="30" y="186" width="500" height="22" fill="#f6f6f6" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="201" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="130" y="201" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="180" y="201" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="230" y="201" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="310" y="201" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="390" y="201" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="480" y="201" text-anchor="middle" font-size="9" fill="#b85450">↓ hi=5</text>

  <!-- row 3 -->
  <rect x="30" y="208" width="500" height="22" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="223" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="130" y="223" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="180" y="223" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="230" y="223" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="310" y="223" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="390" y="223" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="480" y="223" text-anchor="middle" font-size="9" fill="#b85450">↓ hi=4</text>

  <!-- result row -->
  <rect x="30" y="230" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">lo==hi==4 → peak=4 ✓</text>

  <!-- ===== Step 2: Ascending search table ===== -->
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第二步：升序段 [0, 4] 二分查找 target=3（1 轮，1 次 get）</text>

  <!-- table header -->
  <rect x="30" y="286" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="302" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">轮次</text>
  <text x="130" y="302" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">lo</text>
  <text x="180" y="302" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">hi</text>
  <text x="230" y="302" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">mid</text>
  <text x="310" y="302" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">get(mid)</text>
  <text x="400" y="302" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">比较</text>
  <text x="490" y="302" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">动作</text>

  <!-- row 1 -->
  <rect x="30" y="310" width="500" height="22" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="325" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="130" y="325" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="180" y="325" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="230" y="325" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="310" y="325" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="400" y="325" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3 == 3</text>
  <text x="490" y="325" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">返回 2</text>

  <!-- result row -->
  <rect x="30" y="332" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">命中下标 2 → 返回 2，第三步无需执行 ✓</text>

  <!-- ===== Summary ===== -->
  <rect x="40" y="376" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">调用次数统计</text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#333">第一步 6 次 + 第二步 1 次 = 7 次 get 调用</text>
  <text x="280" y="434" text-anchor="middle" font-size="10" fill="#888">最坏情况 ≈ 3·log₂(10⁴) ≈ 42 次 ≪ 100 上限</text>
</svg>
