<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">固定 k：±1 变换 → 最大子数组和（Kadane）</text>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">以 nums = [1, 4, 6, 8]、k = 2 为例</text>

  <!-- 原数组行 -->
  <text x="70" y="79" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="110" y="56" width="58" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="56" width="58" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="246" y="56" width="58" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="314" y="56" width="58" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- 整除性标记 -->
  <text x="139" y="106" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">2 ∤ 1</text>
  <text x="207" y="106" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 | 4</text>
  <text x="275" y="106" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 | 6</text>
  <text x="343" y="106" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 | 8</text>

  <!-- 变换箭头 -->
  <path d="M 260 118 L 260 140" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="134" font-size="11" fill="#666" filter="url(#rough2)">整除 → +x，不整除 → −x</text>

  <!-- 变换后数组行 -->
  <text x="70" y="167" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">±nums</text>
  <rect x="110" y="144" width="58" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="139" y="167" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="178" y="144" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="207" y="167" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">+4</text>
  <rect x="246" y="144" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="275" y="167" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">+6</text>
  <rect x="314" y="144" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="343" y="167" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">+8</text>

  <!-- 手绘椭圆圈住最优区间 -->
  <ellipse cx="275" cy="162" rx="106" ry="27" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="275" y="202" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">最优区间 [+4, +6, +8]：D(2) = 18</text>
  <text x="275" y="219" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">端点若为负贡献，删去端点差值只会更大 ⇒ 最优区间两端必落「+」位置</text>

  <!-- 候选收缩说明框 -->
  <rect x="36" y="236" width="448" height="146" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="261" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">候选 k = 各元素的约数（&gt; 1）∪ {2}</text>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">与元素无整除关系的 k：变换后全负，D(k) = −min(nums)，与 k 是谁无关</text>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">存在元素 ≥ 2 时，其任一约数 d 有 D(d) ≥ 该元素 ≥ 2 &gt; −min(nums)</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⇒ 无整除关系的 k 必败；全员皆 1 时所有 k 并列 D = −1，取最小 k = 2</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（示例 3：nums = [1]，D* = −1，k* = 2，答案 −2 ≡ 1000000005 (mod 10⁹+7)）</text>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">枚举约数用试除 O(√x)；「+」位置之间的大段负贡献用前缀和一次跳过</text>
</svg>
