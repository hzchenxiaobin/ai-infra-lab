<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">「忠实客户」三个判据，全是组级聚合值</text>

  <!-- left: customer 101 transactions -->
  <text x="128" y="62" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">客户 101 的 4 笔交易</text>

  <rect x="48" y="72" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="90" font-size="12" fill="#333" filter="url(#rough2)">01-05</text>
  <text x="196" y="90" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">purchase</text>
  <text x="34" y="89" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">首笔</text>

  <rect x="48" y="102" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="120" font-size="12" fill="#333" filter="url(#rough2)">01-15</text>
  <text x="196" y="120" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">purchase</text>

  <rect x="48" y="132" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="150" font-size="12" fill="#333" filter="url(#rough2)">02-10</text>
  <text x="196" y="150" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">purchase</text>

  <rect x="48" y="162" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="180" font-size="12" fill="#333" filter="url(#rough2)">02-20</text>
  <text x="196" y="180" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">purchase</text>
  <text x="34" y="179" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">末笔</text>

  <!-- green span box -->
  <rect x="40" y="206" width="182" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="131" y="230" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">首笔 01-05 → 末笔 02-20</text>
  <text x="131" y="250" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">DATEDIFF = 46 天 ≥ 30 ✓</text>
  <text x="131" y="269" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（amount 金额列用不上）</text>

  <!-- arrow: one GROUP BY -->
  <path d="M 226 150 L 246 150" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="136" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">GROUP BY</text>
  <text x="236" y="170" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">customer_id</text>

  <!-- right: three condition boxes -->
  <rect x="252" y="52" width="234" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="369" y="76" text-anchor="middle" font-size="13" fill="#2a3a55" filter="url(#rough2)">① 购买 ≥ 3 次</text>
  <text x="369" y="98" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">SUM(type='purchase') = 4 ✓</text>

  <rect x="252" y="126" width="234" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="369" y="150" text-anchor="middle" font-size="13" fill="#6a5010" filter="url(#rough2)">② 活跃跨度 ≥ 30 天</text>
  <text x="369" y="172" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">DATEDIFF(MAX, MIN) = 46 ✓</text>

  <rect x="252" y="200" width="234" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="369" y="224" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">③ 退款率 &lt; 20%（严格）</text>
  <text x="369" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">SUM(refund) ÷ COUNT(*) = 0/4 = 0% ✓</text>

  <!-- bottom warning -->
  <rect x="40" y="292" width="446" height="54" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="263" y="314" text-anchor="middle" font-size="12.5" fill="#7a3030" filter="url(#rough2)">⚠️ 活跃天数 ≠ COUNT(DISTINCT transaction_date)</text>
  <text x="263" y="336" text-anchor="middle" font-size="12" fill="#7a3030" filter="url(#rough2)">101 只有 4 个不同日期，跨度却有 46 天</text>
</svg>
