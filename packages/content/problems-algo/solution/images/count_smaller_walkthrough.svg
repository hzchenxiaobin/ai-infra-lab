<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="640" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [5, 2, 6, 1] → [2, 1, 1, 0]</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">idx 数组按 nums 值排序，count 按原始下标累加（下标标在格内上角）</text>

  <!-- ===== Initial ===== -->
  <text x="20" y="72" font-size="11" fill="#446688" font-weight="bold">初始</text>
  <text x="20" y="88" font-size="9" fill="#888">idx</text>
  <rect x="50" y="74" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="middle" font-size="7" fill="#888">0</text>
  <text x="72" y="95" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="98" y="74" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="108" y="84" text-anchor="middle" font-size="7" fill="#888">1</text>
  <text x="120" y="95" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="146" y="74" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="156" y="84" text-anchor="middle" font-size="7" fill="#888">2</text>
  <text x="168" y="95" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="194" y="74" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="204" y="84" text-anchor="middle" font-size="7" fill="#888">3</text>
  <text x="216" y="95" text-anchor="middle" font-size="10" fill="#333">3</text>

  <text x="260" y="92" font-size="9" fill="#888">nums[idx]: [5, 2, 6, 1]</text>

  <path d="M 300 88 L 300 104" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level 1a: merge [0]·[1] ===== -->
  <rect x="20" y="108" width="560" height="62" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="30" y="124" font-size="11" fill="#446688" font-weight="bold">第1层 a：合并 [0]·[1] → nums[0]=5 vs nums[1]=2</text>
  <text x="30" y="140" font-size="10" fill="#333">5 &gt; 2 → 先取右 idx=1，右半耗尽 → 取左 idx=0，count[0] += j−(mid+1) = 2−1 = </text>
  <text x="455" y="140" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="30" y="158" font-size="9" fill="#888">合并后 idx 段 =</text>
  <rect x="120" y="148" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="156" text-anchor="middle" font-size="6" fill="#888">1</text>
  <text x="140" y="163" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>
  <rect x="162" y="148" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="156" text-anchor="middle" font-size="6" fill="#888">0</text>
  <text x="182" y="163" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">0</text>
  <text x="220" y="158" font-size="9" fill="#888">（按值 2,5 有序）</text>
  <text x="430" y="158" font-size="9" fill="#4a7a3a">count = [1, 0, 0, 0]</text>

  <!-- ===== Level 1b: merge [2]·[3] ===== -->
  <rect x="20" y="178" width="560" height="62" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="30" y="194" font-size="11" fill="#446688" font-weight="bold">第1层 b：合并 [2]·[3] → nums[2]=6 vs nums[3]=1</text>
  <text x="30" y="210" font-size="10" fill="#333">6 &gt; 1 → 先取右 idx=3，右半耗尽 → 取左 idx=2，count[2] += j−(mid+1) = 4−3 = </text>
  <text x="455" y="210" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="30" y="228" font-size="9" fill="#888">合并后 idx 段 =</text>
  <rect x="120" y="218" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="226" text-anchor="middle" font-size="6" fill="#888">3</text>
  <text x="140" y="233" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <rect x="162" y="218" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="226" text-anchor="middle" font-size="6" fill="#888">2</text>
  <text x="182" y="233" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text>
  <text x="220" y="228" font-size="9" fill="#888">（按值 1,6 有序）</text>
  <text x="430" y="228" font-size="9" fill="#4a7a3a">count = [1, 0, 1, 0]</text>

  <path d="M 300 242 L 300 258" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level 0: detailed merge ===== -->
  <text x="20" y="270" font-size="12" fill="#b85450" font-weight="bold">第0层合并：左半 idx[1,0]（值2,5） 与 右半 idx[3,2]（值1,6）合并，lo=0, mid=1, hi=3</text>

  <rect x="20" y="278" width="560" height="180" fill="#f6f6f6" stroke="#aaa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>

  <!-- header row -->
  <text x="30" y="298" font-size="9" fill="#888" font-weight="bold">步</text>
  <text x="60" y="298" font-size="9" fill="#888" font-weight="bold">i→(idx,值)</text>
  <text x="150" y="298" font-size="9" fill="#888" font-weight="bold">j→(idx,值)</text>
  <text x="240" y="298" font-size="9" fill="#888" font-weight="bold">比较</text>
  <text x="300" y="298" font-size="9" fill="#888" font-weight="bold">取</text>
  <text x="350" y="298" font-size="9" fill="#888" font-weight="bold">count 增量</text>
  <text x="470" y="298" font-size="9" fill="#888" font-weight="bold">tmp(idx)</text>

  <!-- Step 1 -->
  <rect x="24" y="304" width="552" height="30" fill="#fce4ec" stroke="none" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="30" y="322" font-size="9" fill="#333">1</text>
  <text x="60" y="322" font-size="9" fill="#446688" font-weight="bold">0,(1,2)</text>
  <text x="150" y="322" font-size="9" fill="#b85450" font-weight="bold">2,(3,1)</text>
  <text x="240" y="322" font-size="9" fill="#333">2 &gt; 1</text>
  <text x="300" y="322" font-size="9" fill="#b85450">右 idx3</text>
  <text x="350" y="322" font-size="9" fill="#888">不计数（取右）</text>
  <text x="470" y="322" font-size="9" fill="#4a7a3a">[3, _, _, _]</text>

  <!-- Step 2 -->
  <rect x="24" y="336" width="552" height="30" fill="#e8f0fe" stroke="none" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="30" y="354" font-size="9" fill="#333">2</text>
  <text x="60" y="354" font-size="9" fill="#446688" font-weight="bold">0,(1,2)</text>
  <text x="150" y="354" font-size="9" fill="#b85450" font-weight="bold">3,(2,6)</text>
  <text x="240" y="354" font-size="9" fill="#333">2 ≤ 6</text>
  <text x="300" y="354" font-size="9" fill="#446688">左 idx1</text>
  <text x="350" y="354" font-size="9" fill="#b85450" font-weight="bold">count[1] += 3−2 = 1</text>
  <text x="470" y="354" font-size="9" fill="#4a7a3a">[3, 1, _, _]</text>

  <!-- Step 3 -->
  <rect x="24" y="368" width="552" height="30" fill="#e8f0fe" stroke="none" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="30" y="386" font-size="9" fill="#333">3</text>
  <text x="60" y="386" font-size="9" fill="#446688" font-weight="bold">1,(0,5)</text>
  <text x="150" y="386" font-size="9" fill="#b85450" font-weight="bold">3,(2,6)</text>
  <text x="240" y="386" font-size="9" fill="#333">5 ≤ 6</text>
  <text x="300" y="386" font-size="9" fill="#446688">左 idx0</text>
  <text x="350" y="386" font-size="9" fill="#b85450" font-weight="bold">count[0] += 3−2 = 1</text>
  <text x="470" y="386" font-size="9" fill="#4a7a3a">[3, 1, 0, _]</text>

  <!-- Step 4 -->
  <rect x="24" y="400" width="552" height="30" fill="#fce4ec" stroke="none" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="30" y="418" font-size="9" fill="#333">4</text>
  <text x="60" y="418" font-size="9" fill="#888">左耗尽</text>
  <text x="150" y="418" font-size="9" fill="#b85450" font-weight="bold">3,(2,6)</text>
  <text x="240" y="418" font-size="9" fill="#333">—</text>
  <text x="300" y="418" font-size="9" fill="#b85450">右 idx2</text>
  <text x="350" y="418" font-size="9" fill="#888">不计数（右剩余）</text>
  <text x="470" y="418" font-size="9" fill="#4a7a3a">[3, 1, 0, 2] ✓</text>

  <!-- count snapshot after level 0 -->
  <text x="30" y="448" font-size="10" fill="#4a7a3a" font-weight="bold">合并后 count = [1+1, 0+1, 1, 0] = [2, 1, 1, 0]　idx = [3,1,0,2]（按值 1,2,5,6 有序）</text>

  <!-- ===== Final result ===== -->
  <rect x="80" y="478" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="500" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终结果 count = [2, 1, 1, 0]</text>
  <text x="300" y="520" text-anchor="middle" font-size="10" fill="#888">5右侧有{2,1}→2 ｜ 2右侧有{1}→1 ｜ 6右侧有{1}→1 ｜ 1右侧无→0</text>

  <!-- ===== Notes ===== -->
  <text x="20" y="556" font-size="10" fill="#888">💡 每个元素的「右侧更小个数」在它被取入 tmp 的那一刻确定：右半已放入多少个 = 它右侧（本层右半）比它小的个数</text>
  <text x="20" y="574" font-size="10" fill="#888">⚠️ count 累加到原始下标 idx[i]，而非位置 i——因为递归会移动 idx，原始下标才是题目要的输出位置</text>
  <text x="20" y="592" font-size="10" fill="#888">💡 跨层累加：一个元素在各层合并中被多次「取左」，每次都累加该层右半已放入数，总和即全部右侧更小元素</text>
</svg>
