<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：按价格排序 + 前缀最大美丽值 + 二分定位上界</text>

  <!-- ===== Section 1: Sorted items ===== -->
  <text x="40" y="56" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">① 按 price 升序排序后的物品 [price, beauty]</text>

  <!-- 5 item boxes -->
  <rect x="70" y="70" width="74" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="107" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[1, 2]</text>
  <text x="107" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">price=1</text>

  <rect x="156" y="70" width="74" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="193" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[2, 4]</text>
  <text x="193" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">price=2</text>

  <rect x="242" y="70" width="74" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="279" y="86" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[3, 2]</text>
  <text x="279" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">price=3</text>

  <rect x="328" y="70" width="74" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="365" y="86" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[3, 5]</text>
  <text x="365" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">price=3</text>

  <rect x="414" y="70" width="74" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="451" y="86" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[5, 6]</text>
  <text x="451" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">price=5</text>

  <!-- ===== Section 2: Prefix max ===== -->
  <text x="40" y="142" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">② 前缀最大美丽值 prefMax[i] = max(beauty[0..i])</text>

  <!-- arrows down -->
  <path d="M 107 112 L 107 138" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 193 112 L 193 138" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 279 112 L 279 138" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 365 112 L 365 138" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 451 112 L 451 138" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>

  <!-- prefMax boxes -->
  <rect x="70" y="148" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="156" y="148" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="242" y="148" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="328" y="148" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <rect x="414" y="148" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="451" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <text x="498" y="168" font-size="10" fill="#888" filter="url(#rough2)">← running max</text>

  <!-- price row reminder -->
  <text x="40" y="202" font-size="11" fill="#888" filter="url(#rough2)">prices = [1, 2, 3, 3, 5]</text>

  <!-- ===== Section 3: Binary search for a query ===== -->
  <text x="40" y="230" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">③ 查询 q=4：upper_bound 找首个 price &gt; 4</text>

  <!-- price axis boxes -->
  <rect x="70" y="244" width="74" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="107" y="263" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>

  <rect x="156" y="244" width="74" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="193" y="263" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>

  <rect x="242" y="244" width="74" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="279" y="263" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>

  <rect x="328" y="244" width="74" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="365" y="263" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>

  <!-- idx=4 highlighted: first price > 4 -->
  <rect x="414" y="244" width="74" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="451" y="263" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="451" y="284" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">idx=4 (首个&gt;4)</text>

  <!-- arrow: idx-1 = 3 -->
  <path d="M 414 258 L 376 258" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="395" y="296" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">idx-1 = 3</text>

  <!-- highlight idx-1 box on prefMax row -->
  <rect x="328" y="148" width="74" height="30" fill="none" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="194" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">prefMax[3] = 5</text>

  <!-- Formula box -->
  <rect x="60" y="312" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="334" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">answer[j] = prefMax[idx-1] = prefMax[3] = 5</text>
  <text x="290" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">idx == 0 时（无价格 ≤ q）返回 0</text>

  <!-- Key insight box -->
  <rect x="60" y="380" width="460" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="402" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">关键洞察：</text>
  <text x="80" y="420" font-size="10.5" fill="#555" filter="url(#rough2)">排序使价格有序 → upper_bound O(log n) 定位上界；</text>
  <text x="80" y="436" font-size="10.5" fill="#555" filter="url(#rough2)">prefMax 使"价格 ≤ q 的最大美丽值" O(1) 取得</text>
</svg>
