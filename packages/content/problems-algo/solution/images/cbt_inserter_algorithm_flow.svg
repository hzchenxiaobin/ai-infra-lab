<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：insert(v) 挂到队首空槽</text>

  <!-- 1. 取队首 -->
  <rect x="190" y="46" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">parent = q.front()（取队首）</text>

  <line x1="280" y1="80" x2="280" y2="96" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 建新节点 -->
  <rect x="210" y="100" width="140" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">node = new TreeNode(v)</text>

  <line x1="280" y1="132" x2="280" y2="148" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 判左空菱形 -->
  <polygon points="280,150 376,190 280,230 184,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">parent.left</text>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">== null ?</text>

  <!-- 是 → 挂左 -->
  <line x1="184" y1="190" x2="120" y2="190" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="30" y="174" width="90" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="75" y="195" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">parent.left</text>
  <text x="75" y="207" text-anchor="middle" font-size="10" fill="#4a7a3a">= node</text>
  <text x="75" y="226" text-anchor="middle" font-size="9" fill="#4a7a3a">队首留下</text>

  <!-- 否 → 挂右 + 出队 -->
  <line x1="280" y1="230" x2="280" y2="244" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="240" font-size="10" fill="#446688">否</text>
  <rect x="180" y="248" width="200" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">parent.right = node</text>
  <text x="280" y="283" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">q.pop()（队首两槽全满，出队）</text>

  <!-- 汇合 -->
  <path d="M 75 208 L 75 320 L 280 320" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="292" x2="280" y2="320" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 新节点入队 -->
  <rect x="180" y="324" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="11" fill="#446688">q.push(node)（新节点两槽皆空）</text>

  <line x1="280" y1="358" x2="280" y2="374" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 返回 -->
  <rect x="210" y="378" width="140" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="399" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return parent.val</text>

  <!-- 右侧：构造函数说明 -->
  <rect x="400" y="100" width="148" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="474" y="120" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">构造函数 CBTInserter</text>
  <text x="410" y="138" font-size="10" fill="#446688">· BFS 遍历初始树</text>
  <text x="410" y="152" font-size="10" fill="#446688">· 遇到 left/right 为空</text>
  <text x="410" y="166" font-size="10" fill="#446688">  的节点即入队</text>
  <text x="410" y="180" font-size="10" fill="#446688">· 保存 root 供 get_root</text>

  <!-- 底部不变式 -->
  <rect x="30" y="430" width="500" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">不变式：队首永远是层序中第一个尚有空槽的节点 → 插入位置天然靠左</text>
</svg>
