<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">简化路径算法流程：切分 → 逐段判定 → 拼接</text>

  <!-- Step 1: split -->
  <rect x="80" y="38" width="360" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">第 1 步：按 '/' 切分</text>
  <text x="260" y="76" text-anchor="middle" font-size="11" fill="#555">parts = split(path, '/')</text>

  <path d="M 260 88 L 260 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop start diamond -->
  <polygon points="260,108 380,148 260,188 140,148" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">还有下一段 part？</text>
  <text x="260" y="162" text-anchor="middle" font-size="10.5" fill="#777">遍历 parts</text>

  <!-- No -> join -->
  <path d="M 380 148 L 450 148 L 450 210" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="402" y="140" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="370" y="214" width="160" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="450" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">拼接结果</text>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a">"/" + join(stk, "/")</text>

  <!-- Yes down -->
  <path d="M 260 188 L 260 206" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="202" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Decision: what is part? -->
  <rect x="80" y="210" width="360" height="40" fill="#f8f8f8" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判断 part 的内容</text>

  <!-- Three branches -->
  <!-- Branch 1: skip -->
  <path d="M 130 250 L 130 268" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="50" y="272" width="160" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="292" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">part == "" 或 "."</text>
  <text x="130" y="310" text-anchor="middle" font-size="11" fill="#d6a040">→ 跳过（continue）</text>

  <!-- Branch 2: pop -->
  <path d="M 260 250 L 260 268" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="180" y="272" width="160" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">part == ".."</text>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#b85450">→ 若栈非空则弹栈</text>

  <!-- Branch 3: push -->
  <path d="M 390 250 L 390 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="310" y="272" width="160" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">其他目录名</text>
  <text x="390" y="310" text-anchor="middle" font-size="11" fill="#446688">→ 压入栈中（push）</text>

  <!-- Merge branches -> loop back -->
  <path d="M 130 320 L 130 340" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 260 320 L 260 340" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 390 320 L 390 340" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 130 340 L 390 340" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- loop back arrow -->
  <path d="M 260 340 L 260 356" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="160" y="360" width="200" height="32" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">取下一段 part，回到循环</text>

  <!-- loop back dashed -->
  <path d="M 160 376 L 20 376 L 20 148 L 140 148" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Result at bottom -->
  <path d="M 450 264 L 450 380" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="300" y="386" width="210" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="405" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">栈为空则返回 "/"</text>
</svg>
