<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：CASE WHEN 逐条件判定 → ORDER BY 输出</text>

  <!-- ===== Start: for each employee ===== -->
  <rect x="180" y="44" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">遍历每个员工 (employee_id)</text>

  <path d="M260 76 L260 90" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Decision 1: id odd? ===== -->
  <polygon points="260,92 380,130 260,168 140,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">employee_id</text>
  <text x="260" y="140" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">% 2 = 1 ?</text>

  <!-- No branch -> bonus=0 -->
  <path d="M140 130 L80 130 L80 200" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="122" font-size="9" fill="#b85450" font-weight="bold">否（偶数）</text>

  <rect x="20" y="200" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="80" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">bonus = 0</text>

  <!-- Yes branch -> Decision 2 -->
  <path d="M380 130 L440 130 L440 170" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="122" font-size="9" fill="#4a7a3a" font-weight="bold">是（奇数）</text>

  <!-- ===== Decision 2: name starts with M? ===== -->
  <polygon points="440,172 510,210 440,248 370,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="206" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">name</text>
  <text x="440" y="220" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">LIKE 'M%'?</text>

  <!-- Yes (starts with M) -> bonus=0 -->
  <path d="M440 248 L440 282 L360 282 L360 300" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="446" y="268" font-size="9" fill="#b85450" font-weight="bold">是（M 开头）</text>

  <rect x="300" y="300" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="360" y="322" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">bonus = 0</text>

  <!-- No (not M) -> bonus=salary -->
  <path d="M370 210 L250 210 L250 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="202" font-size="9" fill="#4a7a3a" font-weight="bold">否（非 M）</text>

  <rect x="190" y="300" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="250" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bonus = salary</text>

  <!-- ===== Merge: ORDER BY ===== -->
  <path d="M80 236 L80 360 L180 360" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M360 336 L360 360 L340 360" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M250 336 L250 360 L340 360" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="348" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ORDER BY employee_id → 输出</text>

  <!-- ===== Footnote ===== -->
  <text x="260" y="394" text-anchor="middle" font-size="8.5" fill="#888">CASE WHEN 先判条件 ①，再判条件 ②，短路求值：① 不满足时不再判 ②</text>
</svg>
