<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建表 → 解码</text>

  <!-- Phase 1 label -->
  <text x="36" y="54" font-size="12.5" fill="#446688" font-weight="bold">① 建表（扫描 key）</text>

  <!-- init -->
  <rect x="150" y="62" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">map = {}, idx = 0</text>

  <path d="M 280 94 L 280 116" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop over key -->
  <rect x="120" y="118" width="320" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for c in key:</text>

  <path d="M 280 150 L 280 172" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond: space or seen? -->
  <polygon points="280,176 400,214 280,252 160,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">c == ' ' 或</text>
  <text x="280" y="224" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">c 已在 map ?</text>

  <!-- yes -> skip -->
  <path d="M 400 214 L 460 214 L 460 138 L 440 138" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="416" y="208" font-size="11" fill="#888">是, skip</text>

  <!-- no -> register -->
  <path d="M 280 252 L 280 274" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="268" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="150" y="276" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">map[c] = 'a' + idx, idx++</text>

  <!-- loop back to next c -->
  <path d="M 150 292 L 70 292 L 70 134 L 120 134" stroke="#888" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- divider -->
  <path d="M 40 326 L 520 326" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Phase 2 label -->
  <text x="36" y="350" font-size="12.5" fill="#b85450" font-weight="bold">② 解码（扫描 message）</text>

  <path d="M 280 332 L 280 358" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- result init -->
  <rect x="120" y="360" width="320" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">res = ""</text>

  <path d="M 280 392 L 280 410" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond: space? -->
  <polygon points="280,414 380,446 280,478 180,446" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="450" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c == ' ' ?</text>

  <!-- yes -> space -->
  <path d="M 180 446 L 110 446" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="120" y="440" font-size="11" fill="#888">是</text>
  <rect x="34" y="464" width="84" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="76" y="484" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">res += ' '</text>

  <!-- no -> lookup -->
  <path d="M 380 446 L 450 446 L 450 482 L 372 482" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="398" y="440" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="260" y="468" width="116" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="318" y="488" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">res += map[c]</text>

  <!-- return -->
  <path d="M 200 478 L 200 504" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="150" y="506" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="525" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return res ✓</text>

  <!-- legend -->
  <text x="392" y="520" font-size="11" fill="#888">注：key 含全部</text>
  <text x="392" y="534" font-size="11" fill="#888">26 字母，查表必中</text>
</svg>
