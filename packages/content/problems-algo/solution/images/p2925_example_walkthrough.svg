<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：自底向上求 keep，答案 = total − keep[0]</text>
  <text x="280" y="43" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 1：edges = [[0,1],[0,2],[0,3],[2,4],[4,5]]，values = [5,2,5,2,1,1]，total = 16</text>

  <!-- tree edges -->
  <g filter="url(#rough2)" stroke="#999" stroke-width="1.5">
    <line x1="150" y1="85" x2="70" y2="160"/>
    <line x1="150" y1="85" x2="170" y2="160"/>
    <line x1="150" y1="85" x2="265" y2="160"/>
    <line x1="170" y1="160" x2="230" y2="240"/>
    <line x1="230" y1="240" x2="285" y2="318"/>
  </g>

  <!-- nodes: kept root = orange, taken = blue -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <circle cx="150" cy="85" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="150" y="90" text-anchor="middle">0</text>
    <text x="150" y="117" text-anchor="middle" font-size="11" fill="#8a6414">5</text>

    <circle cx="70" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="70" y="165" text-anchor="middle">1</text>
    <text x="70" y="190" text-anchor="middle" font-size="11" fill="#555">2</text>

    <circle cx="170" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="170" y="165" text-anchor="middle">2</text>
    <text x="170" y="190" text-anchor="middle" font-size="11" fill="#555">5</text>

    <circle cx="265" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="265" y="165" text-anchor="middle">3</text>
    <text x="265" y="190" text-anchor="middle" font-size="11" fill="#555">2</text>

    <circle cx="230" cy="240" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="230" y="245" text-anchor="middle">4</text>
    <text x="230" y="270" text-anchor="middle" font-size="11" fill="#555">1</text>

    <circle cx="285" cy="318" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="285" y="323" text-anchor="middle">5</text>
    <text x="285" y="348" text-anchor="middle" font-size="11" fill="#555">1</text>
  </g>

  <!-- keep badges -->
  <g filter="url(#rough2)" font-size="10" fill="#8a6414">
    <rect x="163" y="59" width="36" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="181" y="70.5" text-anchor="middle">k=5</text>
    <rect x="83" y="134" width="36" height="15" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="101" y="145.5" text-anchor="middle">k=2</text>
    <rect x="183" y="134" width="36" height="15" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="201" y="145.5" text-anchor="middle">k=1</text>
    <rect x="279" y="132" width="36" height="15" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="297" y="143.5" text-anchor="middle">k=2</text>
    <rect x="243" y="214" width="36" height="15" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="261" y="225.5" text-anchor="middle">k=1</text>
    <rect x="298" y="292" width="36" height="15" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="316" y="303.5" text-anchor="middle">k=1</text>
  </g>

  <text x="160" y="380" text-anchor="middle" font-size="11" fill="#2e5c22" filter="url(#rough2)">橙色 = 最终保留（根 0 一个点就守住全部 3 条路径）</text>

  <!-- table -->
  <rect x="315" y="58" width="233" height="182" fill="#fff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="315" y="58" width="233" height="26" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="315" y="214" width="233" height="26" fill="#fff8e1" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#c5d0dd" stroke-width="1">
    <line x1="315" y1="110" x2="548" y2="110"/>
    <line x1="315" y1="136" x2="548" y2="136"/>
    <line x1="315" y1="162" x2="548" y2="162"/>
    <line x1="315" y1="188" x2="548" y2="188"/>
    <line x1="315" y1="214" x2="548" y2="214"/>
    <line x1="362" y1="58" x2="362" y2="240"/>
    <line x1="502" y1="58" x2="502" y2="240"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#2c4a6e">
    <text x="338" y="75" text-anchor="middle" font-weight="bold">节点(值)</text>
    <text x="432" y="75" text-anchor="middle" font-weight="bold">计算（k=keep）</text>
    <text x="525" y="75" text-anchor="middle" font-weight="bold">keep</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#444">
    <text x="338" y="101" text-anchor="middle">1 (2)</text>
    <text x="432" y="101" text-anchor="middle">叶子 → 必须保留</text>
    <text x="525" y="101" text-anchor="middle" fill="#8a6414" font-weight="bold">2</text>

    <text x="338" y="127" text-anchor="middle">3 (2)</text>
    <text x="432" y="127" text-anchor="middle">叶子 → 必须保留</text>
    <text x="525" y="127" text-anchor="middle" fill="#8a6414" font-weight="bold">2</text>

    <text x="338" y="153" text-anchor="middle">5 (1)</text>
    <text x="432" y="153" text-anchor="middle">叶子 → 必须保留</text>
    <text x="525" y="153" text-anchor="middle" fill="#8a6414" font-weight="bold">1</text>

    <text x="338" y="179" text-anchor="middle">4 (1)</text>
    <text x="432" y="179" text-anchor="middle">min(1, k[5] = 1)</text>
    <text x="525" y="179" text-anchor="middle" fill="#8a6414" font-weight="bold">1</text>

    <text x="338" y="205" text-anchor="middle">2 (5)</text>
    <text x="432" y="205" text-anchor="middle">min(5, k[4] = 1)</text>
    <text x="525" y="205" text-anchor="middle" fill="#8a6414" font-weight="bold">1</text>

    <text x="338" y="231" text-anchor="middle">0 (5)</text>
    <text x="432" y="231" text-anchor="middle">min(5, k1+k2+k3 = 5)</text>
    <text x="525" y="231" text-anchor="middle" fill="#8a6414" font-weight="bold">5</text>
  </g>

  <!-- answer box -->
  <rect x="315" y="254" width="233" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#2e5c22">
    <text x="431" y="276" text-anchor="middle" font-size="12" font-weight="bold">答案 = total − keep[0]</text>
    <text x="431" y="296" text-anchor="middle" font-size="12">= 16 − 5 = 11 ✓</text>
    <text x="431" y="313" text-anchor="middle" font-size="10.5">（保留根 0 即守住全部路径）</text>
  </g>

  <!-- order note -->
  <rect x="315" y="330" width="233" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#8a6414">
    <text x="431" y="348" text-anchor="middle">处理顺序（后序）：1, 3, 5（叶子）</text>
    <text x="431" y="366" text-anchor="middle">→ 4 → 2 → 0，孩子必先于父</text>
  </g>
</svg>
