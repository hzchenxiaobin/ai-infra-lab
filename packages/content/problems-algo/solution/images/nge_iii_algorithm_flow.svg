<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="620" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数字版下一个排列 + 越界检查</text>

  <!-- Step 0: to digits -->
  <rect x="60" y="44" width="360" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">⓪ n 转数字数组 digits</text>
  <text x="240" y="82" text-anchor="middle" font-size="10.5" fill="#555">to_string(n) / list(str(n))</text>

  <path d="M 240 92 L 240 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: find i -->
  <rect x="60" y="112" width="360" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="132" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 从右找首个 digits[i] &lt; digits[i+1]</text>
  <text x="240" y="150" text-anchor="middle" font-size="10.5" fill="#555">i = d−2；while i≥0 且 digits[i]≥digits[i+1]：i−−</text>

  <path d="M 240 164 L 240 180" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: i >= 0 ? -->
  <polygon points="240,184 350,224 240,264 130,224" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ≥ 0 ?</text>
  <text x="240" y="238" text-anchor="middle" font-size="10" fill="#777">找到升序对了？</text>

  <!-- No -> return -1 (no wrap) -->
  <path d="M 350 224 L 430 224 L 430 288" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="360" y="216" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="338" y="292" width="124" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">已是最大排列</text>
  <text x="400" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 -1（不回绕）</text>

  <!-- Yes down -->
  <path d="M 240 264 L 240 280" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="256" y="276" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Step 2: find j -->
  <rect x="60" y="284" width="280" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 右侧找首个 digits[j] &gt; digits[i]</text>
  <text x="200" y="322" text-anchor="middle" font-size="10.5" fill="#555">j = d−1；while digits[j]≤digits[i]：j−−</text>

  <path d="M 200 336 L 200 352" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: swap -->
  <rect x="60" y="356" width="280" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="382" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 交换 digits[i] 与 digits[j]</text>

  <path d="M 200 400 L 200 416" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: reverse right -->
  <rect x="60" y="420" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="440" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">④ 反转 digits[i+1 .. d−1]</text>
  <text x="200" y="458" text-anchor="middle" font-size="10.5" fill="#555">降序段 → 升序（该前缀下最小排列）</text>

  <path d="M 200 470 L 200 486" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: to int + overflow check -->
  <rect x="60" y="490" width="280" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="510" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">⑤ 拼回整数 ans</text>
  <text x="200" y="528" text-anchor="middle" font-size="10.5" fill="#555">用 long long / Python int 承接</text>

  <path d="M 200 540 L 200 556" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: ans > INT_MAX ? -->
  <polygon points="200,560 290,592 200,624 110,592" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="588" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans &gt; 2^31−1 ?</text>
  <text x="200" y="604" text-anchor="middle" font-size="10" fill="#777">越界？</text>

  <!-- overflow -> -1 (right) -->
  <path d="M 290 592 L 360 592" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="584" font-size="10.5" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="362" y="576" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="418" y="597" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 -1</text>

  <!-- ok -> ans (left) -->
  <path d="M 110 592 L 40 592" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="78" y="584" font-size="10.5" fill="#82b366" font-weight="bold">No</text>
  <rect x="6" y="576" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="23" y="597" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans</text>
</svg>
