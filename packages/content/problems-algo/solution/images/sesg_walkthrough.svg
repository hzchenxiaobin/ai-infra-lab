<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：words = ["abcd","cdab","cbad","xyzz","zzxy","zzyx"]</text>

  <!-- Table frame -->
  <rect x="70" y="48" width="440" height="232" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="70" y="48" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="110" y="68" text-anchor="middle">原串</text>
    <text x="195" y="68" text-anchor="middle">sort(偶位)</text>
    <text x="285" y="68" text-anchor="middle">sort(奇位)</text>
    <text x="385" y="68" text-anchor="middle">签名 key</text>
    <text x="475" y="68" text-anchor="middle">组</text>
  </g>

  <!-- column separators -->
  <g stroke="#ccc" stroke-width="1" filter="url(#rough2)">
    <line x1="150" y1="78" x2="150" y2="280"/>
    <line x1="240" y1="78" x2="240" y2="280"/>
    <line x1="330" y1="78" x2="330" y2="280"/>
    <line x1="440" y1="78" x2="440" y2="280"/>
  </g>

  <!-- Row 1: abcd (group 1 green) -->
  <rect x="70" y="78" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="110" y="99" text-anchor="middle" fill="#333" font-weight="bold">abcd</text>
    <text x="195" y="99" text-anchor="middle" fill="#446688">ac</text>
    <text x="285" y="99" text-anchor="middle" fill="#d6a040">bd</text>
    <text x="385" y="99" text-anchor="middle" fill="#4a7a3a" font-weight="bold">acbd</text>
    <text x="475" y="99" text-anchor="middle" fill="#4a7a3a" font-weight="bold">①</text>
  </g>

  <!-- Row 2: cdab (group 1 green) -->
  <rect x="70" y="110" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="110" y="131" text-anchor="middle" fill="#333" font-weight="bold">cdab</text>
    <text x="195" y="131" text-anchor="middle" fill="#446688">ac</text>
    <text x="285" y="131" text-anchor="middle" fill="#d6a040">bd</text>
    <text x="385" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">acbd</text>
    <text x="475" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">①</text>
  </g>

  <!-- Row 3: cbad (group 1 green) -->
  <rect x="70" y="142" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="110" y="163" text-anchor="middle" fill="#333" font-weight="bold">cbad</text>
    <text x="195" y="163" text-anchor="middle" fill="#446688">ac</text>
    <text x="285" y="163" text-anchor="middle" fill="#d6a040">bd</text>
    <text x="385" y="163" text-anchor="middle" fill="#4a7a3a" font-weight="bold">acbd</text>
    <text x="475" y="163" text-anchor="middle" fill="#4a7a3a" font-weight="bold">①</text>
  </g>

  <!-- Row 4: xyzz (group 2 blue) -->
  <rect x="70" y="174" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="110" y="195" text-anchor="middle" fill="#333" font-weight="bold">xyzz</text>
    <text x="195" y="195" text-anchor="middle" fill="#446688">xz</text>
    <text x="285" y="195" text-anchor="middle" fill="#d6a040">yz</text>
    <text x="385" y="195" text-anchor="middle" fill="#446688" font-weight="bold">xzyz</text>
    <text x="475" y="195" text-anchor="middle" fill="#446688" font-weight="bold">②</text>
  </g>

  <!-- Row 5: zzxy (group 2 blue) -->
  <rect x="70" y="206" width="440" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="110" y="227" text-anchor="middle" fill="#333" font-weight="bold">zzxy</text>
    <text x="195" y="227" text-anchor="middle" fill="#446688">xz</text>
    <text x="285" y="227" text-anchor="middle" fill="#d6a040">yz</text>
    <text x="385" y="227" text-anchor="middle" fill="#446688" font-weight="bold">xzyz</text>
    <text x="475" y="227" text-anchor="middle" fill="#446688" font-weight="bold">②</text>
  </g>

  <!-- Row 6: zzyx (group 3 red) -->
  <rect x="70" y="238" width="440" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="110" y="259" text-anchor="middle" fill="#333" font-weight="bold">zzyx</text>
    <text x="195" y="259" text-anchor="middle" fill="#446688">yz</text>
    <text x="285" y="259" text-anchor="middle" fill="#d6a040">xz</text>
    <text x="385" y="259" text-anchor="middle" fill="#b85450" font-weight="bold">yzxz</text>
    <text x="475" y="259" text-anchor="middle" fill="#b85450" font-weight="bold">③</text>
  </g>

  <!-- Arrow down -->
  <path d="M 290 284 L 290 302" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Conclusion -->
  <rect x="90" y="306" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="326" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3 个不同签名 → 3 组特殊等价字符串</text>
  <text x="290" y="342" text-anchor="middle" font-size="10" fill="#666">① {abcd, cdab, cbad}  ② {xyzz, zzxy}  ③ {zzyx}</text>

  <!-- Takeaway -->
  <rect x="90" y="356" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">关键：zzyx 的偶位 yz ≠ xyzz 的偶位 xz → 不同组</text>
  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#666">仅看字符多重集不够，必须分偶位/奇位分别比对</text>
</svg>
