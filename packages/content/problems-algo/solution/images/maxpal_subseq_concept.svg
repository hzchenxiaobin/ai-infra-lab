<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">由子序列构造的最长回文串：拼接 + 跨边界更新</text>

  <!-- word1 + word2 label -->
  <text x="40" y="62" font-size="11" fill="#4a7a3a" font-weight="bold">word1</text>
  <text x="40" y="76" font-size="9" fill="#888">[0, n1)</text>
  <text x="316" y="62" font-size="11" fill="#446688" font-weight="bold">word2</text>
  <text x="316" y="76" font-size="9" fill="#888">[n1, n)</text>

  <!-- s = word1(green) + word2(blue): example "cacb | cbba" -->
  <text x="36" y="98" font-size="11" fill="#888">s =</text>
  <!-- word1: c a c b  (indices 0..3) -->
  <rect x="70"  y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="106" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="114" y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="106" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="158" y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="106" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="202" y="86" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="222" y="106" text-anchor="middle" font-size="13" fill="#333">b</text>
  <!-- word2: c b b a  (indices 4..7) -->
  <rect x="246" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="266" y="106" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="290" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="106" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="334" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="354" y="106" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="378" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="398" y="106" text-anchor="middle" font-size="13" fill="#333">a</text>

  <!-- index labels -->
  <text x="90"  y="130" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="134" y="130" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="178" y="130" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="222" y="130" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="266" y="130" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="310" y="130" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="354" y="130" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="398" y="130" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <!-- boundary dashed line at n1=4 (between index 3 and 4) at x=244 -->
  <path d="M 244 56 L 244 134" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="244" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">分界 n1=4</text>

  <!-- highlight the cross-boundary pair s[1]=a, s[7]=a with red rings -->
  <rect x="110" y="82" width="48" height="38" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <rect x="374" y="82" width="48" height="38" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="134" y="150" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">s[i] (i=1)</text>
  <text x="398" y="150" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">s[j] (j=7)</text>

  <!-- arrow connecting the pair as palindrome outer ends -->
  <path d="M 134 160 Q 266 196 398 160" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="266" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">回文两端 = s[i], s[j]</text>

  <!-- inner subsequence label -->
  <text x="266" y="214" text-anchor="middle" font-size="10" fill="#888">内部取 s[i+1..j−1] 的最长回文子序列</text>

  <!-- condition box -->
  <rect x="50" y="232" width="460" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">横跨条件：i &lt; n1 ≤ j</text>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#555">s[i] 来自 word1 且 s[j] 来自 word2 → 两部分都非空 ✓</text>
  <text x="280" y="289" text-anchor="middle" font-size="10" fill="#888">此时 ans = max(ans, dp[i][j]) = dp[i+1][j−1] + 2</text>

  <!-- formula box -->
  <rect x="50" y="308" width="460" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i][j] = s[i..j] 内最长回文子序列长度</text>
  <text x="70" y="352" font-size="11" fill="#4a7a3a">s[i]=s[j]：</text>
  <text x="150" y="352" font-size="11" fill="#333">dp[i][j] = dp[i+1][j−1] + 2</text>
  <text x="70" y="372" font-size="11" fill="#b85450">s[i]≠s[j]：</text>
  <text x="150" y="372" font-size="11" fill="#333">dp[i][j] = max(dp[i+1][j], dp[i][j−1])</text>
</svg>
