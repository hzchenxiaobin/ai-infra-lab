<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：枚举因数 d + 反向后序贪心切断</text>

  <!-- Step 1 -->
  <rect x="190" y="44" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">total = Σ nums[i]</text>
  <line x1="280" y1="86" x2="280" y2="104" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="150" y="106" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举 total 的因数 d（升序）</text>
  <line x1="280" y1="148" x2="280" y2="166" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 : reverse BFS post-order -->
  <rect x="110" y="168" width="340" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">反向 BFS 序遍历每个 u：比较 sub[u] 与 d</text>
  <line x1="280" y1="210" x2="280" y2="228" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,230 360,275 280,320 200,275" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sub[u] ? d</text>
  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(已累加子余量)</text>

  <!-- three branches -->
  <!-- left: < d -->
  <line x1="200" y1="275" x2="80" y2="275" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">&lt; d</text>
  <rect x="14" y="258" width="66" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="47" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">余量上交</text>

  <!-- down: == d -->
  <line x1="280" y1="320" x2="280" y2="338" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="334" font-size="10" fill="#d6a040" filter="url(#rough2)">= d</text>
  <rect x="246" y="340" width="68" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">切断（贡献 0）</text>

  <!-- right: > d -->
  <line x1="360" y1="275" x2="478" y2="275" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="268" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">&gt; d</text>
  <rect x="480" y="258" width="66" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="513" y="280" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">此 d 无解</text>

  <!-- loop back note -->
  <text x="80" y="370" font-size="10" fill="#666" filter="url(#rough2)">首个可行 d → 返回 total/d − 1</text>
</svg>
