<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：异或化简 + 规范二进制 + 最左出现</text>

  <!-- ===== Row 1: xor transform ===== -->
  <rect x="40" y="46" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="80" font-size="14" fill="#333" font-weight="bold">val ^ first == second</text>
  <text x="220" y="80" font-size="16" fill="#d6a040" font-weight="bold">⟺</text>
  <text x="245" y="80" font-size="14" fill="#333" font-weight="bold">val = first ^ second = target</text>
  <text x="60" y="98" font-size="10.5" fill="#888">两边同 ^ first 抵消：双参数 first/second 折叠成单参数 target</text>

  <!-- ===== Row 2: example ===== -->
  <text x="40" y="128" font-size="12" fill="#888">示例：s = "101101"，查询 [0,5] ⟹ target = 0 ^ 5 = 5 = "101"</text>

  <!-- s grid: indices 0..5 with chars 1 0 1 1 0 1 -->
  <!-- positions x = 60 + idx*45 -->
  <!-- idx0 '1' -->
  <rect x="60" y="140" width="45" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="82" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="82" y="200" text-anchor="middle" font-size="10" fill="#888">0</text>
  <!-- idx1 '0' -->
  <rect x="105" y="140" width="45" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="127" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="127" y="200" text-anchor="middle" font-size="10" fill="#888">1</text>
  <!-- idx2 '1' (matched, part of "101") -->
  <rect x="150" y="140" width="45" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="172" y="200" text-anchor="middle" font-size="10" fill="#888">2</text>
  <!-- idx3 '1' -->
  <rect x="195" y="140" width="45" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="217" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="217" y="200" text-anchor="middle" font-size="10" fill="#888">3</text>
  <!-- idx4 '0' -->
  <rect x="240" y="140" width="45" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="262" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="262" y="200" text-anchor="middle" font-size="10" fill="#888">4</text>
  <!-- idx5 '1' -->
  <rect x="285" y="140" width="45" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="307" y="170" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="307" y="200" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- bracket under "101" at idx0..2 -->
  <path d="M 62 208 L 62 216 L 193 216 L 193 208" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="127" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">bin(5)="101"，最左出现 → [0,2]</text>

  <!-- ===== Row 3: leading zero is longer ===== -->
  <rect x="330" y="218" width="225" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="442" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">前导 0 只会更长</text>
  <text x="340" y="260" font-size="11" fill="#444">"0101" = 5，长度 4</text>
  <text x="340" y="276" font-size="11" fill="#444">"101" = 5，长度 3 ✓最短</text>
  <text x="340" y="290" font-size="10" fill="#888">求最短 ⟹ 只看无前导 0 的规范串</text>

  <!-- arrow from grid to bracket note -->
  <path d="M 127 236 Q 127 252 127 250" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Row 4: bound note ===== -->
  <rect x="40" y="300" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="55" y="322" font-size="12" fill="#d6a040" font-weight="bold">值域与长度上限</text>
  <text x="55" y="340" font-size="10.5" fill="#444">first, second ≤ 10^9 &lt; 2^30  ⟹  target = first ^ second &lt; 2^30  ⟹  L = bitlen(target) ≤ 30</text>
  <text x="55" y="356" font-size="10.5" fill="#444">故从每个 '1' 至多延伸 30 位即可枚尽可被查询的值；预处理一次，每查询 O(1) 查表。</text>
</svg>
