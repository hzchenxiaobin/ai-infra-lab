<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "110101"，n = 6</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">left[] 从左到右，right[] 从右到左，合并取最小</text>

  <!-- ===== Row 1: String (6 boxes) ===== -->
  <text x="50" y="66" font-size="10.5" fill="#666">s[i]</text>
  <!-- Index labels -->
  <text x="106" y="58" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="160" y="58" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="214" y="58" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="268" y="58" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="322" y="58" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="376" y="58" text-anchor="middle" font-size="9" fill="#888">5</text>

  <rect x="82" y="62" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="136" y="62" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="190" y="62" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="83" text-anchor="middle" font-size="13" fill="#333">0</text>

  <rect x="244" y="62" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="298" y="62" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="83" text-anchor="middle" font-size="13" fill="#333">0</text>

  <rect x="352" y="62" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- ===== Row 2: left[] (6 values + boundary) ===== -->
  <text x="50" y="112" font-size="10.5" fill="#446688" font-weight="bold">left[i]</text>
  <text x="68" y="112" font-size="9" fill="#888">left[−1]=0</text>

  <rect x="82" y="104" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="122" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="136" y="104" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="122" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="190" y="104" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="122" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="244" y="104" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="122" text-anchor="middle" font-size="12" fill="#333">4</text>

  <rect x="298" y="104" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="122" text-anchor="middle" font-size="12" fill="#333">4</text>

  <rect x="352" y="104" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="122" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- ===== Row 3: right[] (6 values + boundary) ===== -->
  <text x="50" y="150" font-size="10.5" fill="#4a7a3a" font-weight="bold">right[i]</text>

  <rect x="82" y="142" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="160" text-anchor="middle" font-size="12" fill="#333">6</text>

  <rect x="136" y="142" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="160" text-anchor="middle" font-size="12" fill="#333">5</text>

  <rect x="190" y="142" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="160" text-anchor="middle" font-size="12" fill="#333">3</text>

  <rect x="244" y="142" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="160" text-anchor="middle" font-size="12" fill="#333">3</text>

  <rect x="298" y="142" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="352" y="142" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="410" y="160" font-size="9" fill="#888">right[6]=0</text>

  <!-- ===== Row 4: Combined (7 boxes for i=-1..5) ===== -->
  <text x="30" y="196" font-size="10" fill="#666">left[i]+right[i+1]</text>

  <!-- i=-1: 0+6=6 -->
  <rect x="60" y="188" width="48" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="200" text-anchor="middle" font-size="8" fill="#888">i=−1</text>
  <text x="84" y="212" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- i=0: 1+5=6 -->
  <rect x="116" y="188" width="48" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="200" text-anchor="middle" font-size="8" fill="#888">i=0</text>
  <text x="140" y="212" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- i=1: 2+3=5 MIN -->
  <rect x="172" y="188" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="200" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">i=1</text>
  <text x="196" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- i=2: 2+3=5 MIN -->
  <rect x="228" y="188" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="200" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">i=2</text>
  <text x="252" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- i=3: 4+1=5 MIN -->
  <rect x="284" y="188" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="200" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">i=3</text>
  <text x="308" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- i=4: 4+1=5 MIN -->
  <rect x="340" y="188" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="200" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">i=4</text>
  <text x="364" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- i=5: 6+0=6 -->
  <rect x="396" y="188" width="48" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="200" text-anchor="middle" font-size="8" fill="#888">i=5</text>
  <text x="420" y="212" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- Arrow to answer -->
  <path d="M 196 220 L 196 238" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Answer box -->
  <rect x="120" y="240" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = 5</text>

  <!-- Explanation -->
  <rect x="40" y="288" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">最优方案（i=1）：左删 s[0..1]（cost 2）+ 右删 s[3..5]（cost 3）= 5</text>
  <text x="260" y="322" text-anchor="middle" font-size="10" fill="#555">left[1]=2：左删 2 车覆盖 s[0],s[1] 两个 '1'</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#555">right[2]=3：右删 3 车（s[5],s[4],s[3]）覆盖 s[3],s[5] 两个 '1'；s[2]='0' 无需移除</text>
</svg>
