<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="300" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 1：root1 经 3 次翻转（节点 1、3、5）与 root2 等价</text>

  <!-- Tree labels -->
  <text x="155" y="42" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">root1</text>
  <text x="465" y="42" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">root2</text>

  <!-- root1 tree -->
  <!-- Node 1 (flip) -->
  <circle cx="155" cy="65" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="69" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- Node 2 (no flip) -->
  <circle cx="120" cy="110" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="114" text-anchor="middle" font-size="10" fill="#333">2</text>
  <line x1="145" y1="77" x2="126" y2="100" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- Node 3 (flip) -->
  <circle cx="190" cy="110" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="114" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="165" y1="77" x2="184" y2="100" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- Node 4 (leaf) -->
  <circle cx="100" cy="155" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="159" text-anchor="middle" font-size="9" fill="#333">4</text>
  <line x1="112" y1="120" x2="100" y2="147" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <!-- Node 5 (flip) -->
  <circle cx="140" cy="155" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="159" text-anchor="middle" font-size="9" fill="#333">5</text>
  <line x1="128" y1="120" x2="138" y2="147" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <!-- Node 6 (leaf, 3's left child) -->
  <circle cx="175" cy="155" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="175" y="159" text-anchor="middle" font-size="9" fill="#333">6</text>
  <line x1="182" y1="120" x2="175" y2="147" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <!-- Node 7 (leaf) -->
  <circle cx="122" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="204" text-anchor="middle" font-size="8" fill="#333">7</text>
  <line x1="132" y1="165" x2="124" y2="193" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <!-- Node 8 (leaf) -->
  <circle cx="158" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="158" y="204" text-anchor="middle" font-size="8" fill="#333">8</text>
  <line x1="148" y1="165" x2="156" y2="193" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- root2 tree -->
  <!-- Node 1 (flip) -->
  <circle cx="465" cy="65" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="465" y="69" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- Node 3 (flip) -->
  <circle cx="430" cy="110" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="114" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="455" y1="77" x2="436" y2="100" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- Node 2 (no flip) -->
  <circle cx="500" cy="110" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="114" text-anchor="middle" font-size="10" fill="#333">2</text>
  <line x1="475" y1="77" x2="494" y2="100" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- Node 6 (leaf, 3's right child) -->
  <circle cx="445" cy="155" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="445" y="159" text-anchor="middle" font-size="9" fill="#333">6</text>
  <line x1="436" y1="120" x2="443" y2="147" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <!-- Node 4 (leaf) -->
  <circle cx="485" cy="155" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="485" y="159" text-anchor="middle" font-size="9" fill="#333">4</text>
  <line x1="494" y1="120" x2="483" y2="147" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <!-- Node 5 (flip) -->
  <circle cx="515" cy="155" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="515" y="159" text-anchor="middle" font-size="9" fill="#333">5</text>
  <line x1="506" y1="120" x2="513" y2="147" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <!-- Node 8 (leaf) -->
  <circle cx="500" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="500" y="204" text-anchor="middle" font-size="8" fill="#333">8</text>
  <line x1="508" y1="165" x2="500" y2="193" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <!-- Node 7 (leaf) -->
  <circle cx="530" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="530" y="204" text-anchor="middle" font-size="8" fill="#333">7</text>
  <line x1="522" y1="165" x2="530" y2="193" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <!-- Legend -->
  <circle cx="50" cy="248" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="252" font-size="10" fill="#555">翻转（交叉匹配）</text>

  <circle cx="200" cy="248" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="252" font-size="10" fill="#555">不翻转（直连匹配）</text>

  <circle cx="360" cy="248" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="375" y="252" font-size="10" fill="#555">叶节点</text>

  <text x="310" y="280" text-anchor="middle" font-size="10" fill="#888">节点 1：子树 2↔3 交换 ｜ 节点 3：子树 6 左↔右 ｜ 节点 5：子树 7↔8 交换</text>
</svg>
