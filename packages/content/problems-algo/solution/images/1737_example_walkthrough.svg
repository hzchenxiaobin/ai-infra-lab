<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：a = "dabadd"，b = "cda"
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    lenA = 6，lenB = 3；只列 a–e，其后字母代价不再下降
  </text>

  <!-- ===== table ===== -->
  <!-- column headers -->
  <g filter="url(#rough2)">
    <rect x="40" y="58" width="60" height="24" fill="#f0f0f0" stroke="#bbb" rx="2"/>
    <text x="70" y="75" text-anchor="middle" font-size="10" fill="#555">边界 c</text>
    <rect x="100" y="58" width="60" height="24" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="130" y="75" text-anchor="middle" font-size="10" fill="#7a5415">a</text>
    <rect x="160" y="58" width="60" height="24" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="190" y="75" text-anchor="middle" font-size="10" fill="#7a5415">b</text>
    <rect x="220" y="58" width="60" height="24" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="250" y="75" text-anchor="middle" font-size="10" fill="#7a5415">c</text>
    <rect x="280" y="58" width="60" height="24" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="310" y="75" text-anchor="middle" font-size="10" fill="#7a5415">d</text>
    <rect x="340" y="58" width="60" height="24" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="370" y="75" text-anchor="middle" font-size="10" fill="#7a5415">e</text>
    <rect x="400" y="58" width="120" height="24" fill="#f0f0f0" stroke="#bbb" rx="2"/>
    <text x="460" y="75" text-anchor="middle" font-size="10" fill="#555">行最小</text>
  </g>

  <!-- row: preA -->
  <g filter="url(#rough2)">
    <rect x="40" y="82" width="60" height="24" fill="#e8f0fe" stroke="#446688" rx="2"/>
    <text x="70" y="99" text-anchor="middle" font-size="10" fill="#446688">preA</text>
    <rect x="100" y="82" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="130" y="99" text-anchor="middle" font-size="10" fill="#333">2</text>
    <rect x="160" y="82" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="190" y="99" text-anchor="middle" font-size="10" fill="#333">3</text>
    <rect x="220" y="82" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="250" y="99" text-anchor="middle" font-size="10" fill="#333">3</text>
    <rect x="280" y="82" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="310" y="99" text-anchor="middle" font-size="10" fill="#333">6</text>
    <rect x="340" y="82" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="370" y="99" text-anchor="middle" font-size="10" fill="#333">6</text>
    <rect x="400" y="82" width="120" height="24" fill="#f0f0f0" stroke="#bbb" rx="2"/>
    <text x="460" y="99" text-anchor="middle" font-size="9" fill="#888">—</text>
  </g>

  <!-- row: preB -->
  <g filter="url(#rough2)">
    <rect x="40" y="106" width="60" height="24" fill="#fce4ec" stroke="#b85450" rx="2"/>
    <text x="70" y="123" text-anchor="middle" font-size="10" fill="#b03a3a">preB</text>
    <rect x="100" y="106" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="130" y="123" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="160" y="106" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="190" y="123" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="220" y="106" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="250" y="123" text-anchor="middle" font-size="10" fill="#333">2</text>
    <rect x="280" y="106" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="310" y="123" text-anchor="middle" font-size="10" fill="#333">3</text>
    <rect x="340" y="106" width="60" height="24" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="370" y="123" text-anchor="middle" font-size="10" fill="#333">3</text>
    <rect x="400" y="106" width="120" height="24" fill="#f0f0f0" stroke="#bbb" rx="2"/>
    <text x="460" y="123" text-anchor="middle" font-size="9" fill="#888">—</text>
  </g>

  <!-- separator -->
  <line x1="40" y1="138" x2="520" y2="138" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- row: ops1 (a<b) -->
  <g filter="url(#rough2)">
    <rect x="40" y="144" width="60" height="26" fill="#eaf6ee" stroke="#4a8e4a" rx="2"/>
    <text x="70" y="162" text-anchor="middle" font-size="9" fill="#2e6e2e">ops₁ a&lt;b</text>
    <rect x="100" y="144" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="130" y="162" text-anchor="middle" font-size="10" fill="#333">5</text>
    <rect x="160" y="144" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="190" y="162" text-anchor="middle" font-size="10" fill="#333">4</text>
    <rect x="220" y="144" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="250" y="162" text-anchor="middle" font-size="10" fill="#333">5</text>
    <rect x="280" y="144" width="60" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="2"/>
    <text x="310" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">3</text>
    <rect x="340" y="144" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="370" y="162" text-anchor="middle" font-size="10" fill="#333">3</text>
    <rect x="400" y="144" width="120" height="26" fill="#eaf6ee" stroke="#4a8e4a" rx="2"/>
    <text x="460" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">3 ✓</text>
  </g>

  <!-- row: ops2 (b<a) -->
  <g filter="url(#rough2)">
    <rect x="40" y="170" width="60" height="26" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="70" y="188" text-anchor="middle" font-size="9" fill="#7a5415">ops₂ b&lt;a</text>
    <rect x="100" y="170" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="130" y="188" text-anchor="middle" font-size="10" fill="#333">4</text>
    <rect x="160" y="170" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="190" y="188" text-anchor="middle" font-size="10" fill="#333">5</text>
    <rect x="220" y="170" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="250" y="188" text-anchor="middle" font-size="10" fill="#333">4</text>
    <rect x="280" y="170" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="310" y="188" text-anchor="middle" font-size="10" fill="#333">6</text>
    <rect x="340" y="170" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="370" y="188" text-anchor="middle" font-size="10" fill="#333">6</text>
    <rect x="400" y="170" width="120" height="26" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="460" y="188" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">4</text>
  </g>

  <!-- row: ops3 (same letter) -->
  <g filter="url(#rough2)">
    <rect x="40" y="196" width="60" height="26" fill="#fce4ec" stroke="#b85450" rx="2"/>
    <text x="70" y="214" text-anchor="middle" font-size="9" fill="#b03a3a">ops₃ 同字母</text>
    <rect x="100" y="196" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="130" y="214" text-anchor="middle" font-size="10" fill="#333">6</text>
    <rect x="160" y="196" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="190" y="214" text-anchor="middle" font-size="10" fill="#333">8</text>
    <rect x="220" y="196" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="250" y="214" text-anchor="middle" font-size="10" fill="#333">8</text>
    <rect x="280" y="196" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="310" y="214" text-anchor="middle" font-size="10" fill="#333">5</text>
    <rect x="340" y="196" width="60" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="370" y="214" text-anchor="middle" font-size="10" fill="#333">9</text>
    <rect x="400" y="196" width="120" height="26" fill="#fce4ec" stroke="#b85450" rx="2"/>
    <text x="460" y="214" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">5</text>
  </g>

  <!-- ===== analysis box ===== -->
  <rect x="40" y="240" width="480" height="70" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="260" font-size="11" font-weight="bold" fill="#5a4a1a" filter="url(#rough2)">关键读法</text>
  <text x="56" y="278" font-size="10" fill="#444" filter="url(#rough2)">• ops₁ 在 c='d' 触底 = 3：a 已全 ≤ 'd' 不动，只改 b 的 3 个字母 → "eee"</text>
  <text x="56" y="294" font-size="10" fill="#444" filter="url(#rough2)">• ops₂ / ops₃ 行最小分别为 4、5，均劣于 3</text>
  <text x="56" y="310" font-size="10" fill="#444" filter="url(#rough2)">• 故 ans = min(3, 4, 5) = 3，对应「条件 1，c='d'」</text>

  <!-- ===== conclusion ===== -->
  <rect x="40" y="324" width="480" height="56" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">
    最优：把 b = "cda" 全改成 "eee"，2 步？不对——3 步
  </text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    c→e、d→e、a→e 共 3 次操作；max(a)='d' &lt; 'e'=min(b) ✓ 返回 3
  </text>
</svg>
