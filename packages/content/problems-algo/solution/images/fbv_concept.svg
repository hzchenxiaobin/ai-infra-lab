<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">版本好坏的单调切换：false…false, true…true</text>

  <!-- top note -->
  <text x="56" y="56" font-size="11" fill="#888">n = 5, bad = 4</text>
  <text x="56" y="72" font-size="11" fill="#888">好坏只切换一次 → 单调性</text>

  <!-- version cells: 5 cells, width 70, gap 12, start x=90 -->
  <!-- cell centers: 125, 207, 289, 371, 453 -->
  <!-- baseline y=200, cell height=70 -->

  <!-- version 1: good (false) -->
  <rect x="90" y="170" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">v1</text>
  <text x="125" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a">good</text>
  <text x="125" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">false</text>

  <!-- version 2: good (false) -->
  <rect x="172" y="170" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="207" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">v2</text>
  <text x="207" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a">good</text>
  <text x="207" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">false</text>

  <!-- version 3: good (false) -->
  <rect x="254" y="170" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="289" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">v3</text>
  <text x="289" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a">good</text>
  <text x="289" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">false</text>

  <!-- version 4: bad (true) - ANSWER -->
  <rect x="336" y="170" width="70" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="371" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">v4</text>
  <text x="371" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">bad</text>
  <text x="371" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">true</text>

  <!-- version 5: bad (true) -->
  <rect x="418" y="170" width="70" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="453" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">v5</text>
  <text x="453" y="220" text-anchor="middle" font-size="11" fill="#b85450">bad</text>
  <text x="453" y="236" text-anchor="middle" font-size="10" fill="#b85450">true</text>

  <!-- arrow pointing to v4: first bad -->
  <path d="M 371 120 L 371 166" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="88" width="162" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="371" y="109" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">首个 true = 答案</text>

  <!-- left region label: good -->
  <rect x="90" y="268" width="234" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="207" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a">isBadVersion = false（好版本区）</text>

  <!-- right region label: bad -->
  <rect x="336" y="268" width="152" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="412" y="288" text-anchor="middle" font-size="10.5" fill="#b85450">true（坏版本区）</text>

  <!-- arrow between regions: single switch -->
  <path d="M 326 283 L 334 283" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="314" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">单调切换</text>

  <!-- bottom note: binary search -->
  <rect x="120" y="330" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">单调性 → 二分查找：每轮丢弃一半</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">O(n) 线性扫描 → O(log n) 折半定位</text>
</svg>
