<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：expression = "1&amp;(0|1)"，终值 = 1，目标翻转为 0</text>

  <!-- Table header -->
  <rect x="20" y="38" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="55" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">步</text>
  <text x="80" y="55" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ch</text>
  <text x="160" y="55" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">动作</text>
  <text x="330" y="55" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">vals 栈</text>
  <text x="470" y="55" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ops 栈</text>

  <!-- Step 1: '1' -->
  <rect x="20" y="66" width="540" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="83" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="80" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="160" y="83" font-size="10" fill="#333">vals.push(1,0)</text>
  <text x="330" y="83" font-size="10" fill="#4a7a3a">[(1,0)]</text>
  <text x="470" y="83" font-size="10" fill="#888">[]</text>

  <!-- Step 2: '&' -->
  <rect x="20" y="94" width="540" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="111" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="80" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&amp;</text>
  <text x="160" y="111" font-size="10" fill="#333">ops.push('&amp;')</text>
  <text x="330" y="111" font-size="10" fill="#4a7a3a">[(1,0)]</text>
  <text x="470" y="111" font-size="10" fill="#b85450">['&amp;']</text>

  <!-- Step 3: '(' -->
  <rect x="20" y="122" width="540" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="139" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="80" y="139" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">(</text>
  <text x="160" y="139" font-size="10" fill="#333">ops.push('(')</text>
  <text x="330" y="139" font-size="10" fill="#4a7a3a">[(1,0)]</text>
  <text x="470" y="139" font-size="10" fill="#888">['&amp;','(']</text>

  <!-- Step 4: '0' -->
  <rect x="20" y="150" width="540" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="167" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="80" y="167" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="160" y="167" font-size="10" fill="#333">vals.push(0,1)</text>
  <text x="330" y="167" font-size="10" fill="#4a7a3a">[(1,0),(0,1)]</text>
  <text x="470" y="167" font-size="10" fill="#888">['&amp;','(']</text>

  <!-- Step 5: '|' -->
  <rect x="20" y="178" width="540" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="195" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="80" y="195" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">|</text>
  <text x="160" y="195" font-size="10" fill="#333">ops.push('|')</text>
  <text x="330" y="195" font-size="10" fill="#4a7a3a">[(1,0),(0,1)]</text>
  <text x="470" y="195" font-size="10" fill="#888">['&amp;','(','|']</text>

  <!-- Step 6: '1' -> reduce -->
  <rect x="20" y="206" width="540" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="223" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="80" y="223" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="160" y="223" font-size="10" fill="#d6a040" font-weight="bold">push(1,0) → 折叠</text>
  <text x="330" y="223" font-size="10" fill="#4a7a3a">[(1,0),(0,1),(1,0)]</text>
  <text x="470" y="223" font-size="10" fill="#888">['&amp;','(','|']</text>

  <!-- Step 6b: reduce result -->
  <rect x="20" y="234" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="253" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6'</text>
  <text x="160" y="247" font-size="10" fill="#4a7a3a" font-weight="bold">折叠 0|1:</text>
  <text x="160" y="259" font-size="9" fill="#666">c0=min(0+1,1+0)=1  c1=min(min(1,0),1+1)=0</text>
  <text x="330" y="253" font-size="10" fill="#4a7a3a" font-weight="bold">[(1,0),(1,0)]</text>
  <text x="470" y="253" font-size="10" fill="#888">['&amp;','(']</text>

  <!-- Step 7: ')' -> pop '(' -> reduce -->
  <rect x="20" y="268" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="287" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">7</text>
  <text x="80" y="287" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">)</text>
  <text x="160" y="281" font-size="10" fill="#d6a040" font-weight="bold">pop '(' → 折叠</text>
  <text x="160" y="293" font-size="9" fill="#666">vals 顶 2 + ops 顶 '&amp;'</text>
  <text x="330" y="287" font-size="10" fill="#4a7a3a">[(1,0),(1,0)]</text>
  <text x="470" y="287" font-size="10" fill="#b85450">['&amp;']</text>

  <!-- Step 7b: reduce result -->
  <rect x="20" y="302" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7'</text>
  <text x="160" y="315" font-size="10" fill="#4a7a3a" font-weight="bold">折叠 1&amp;1:</text>
  <text x="160" y="327" font-size="9" fill="#666">c0=min(min(1,1),1+2)=1  c1=min(0+0,1+0)=0</text>
  <text x="330" y="321" font-size="10" fill="#4a7a3a" font-weight="bold">[(1,0)]</text>
  <text x="470" y="321" font-size="10" fill="#888">[]</text>

  <!-- Separator -->
  <line x1="20" y1="346" x2="560" y2="346" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="20" y="368" font-size="12" fill="#888">最终 vals 栈仅剩一个元素 (c0, c1) = (1, 0)：</text>

  <!-- value box -->
  <rect x="40" y="380" width="200" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="140" y="400" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">终值 = 1</text>
  <text x="140" y="416" text-anchor="middle" font-size="10" fill="#666">c1 = 0（维持 1 代价为 0）</text>
  <text x="140" y="430" text-anchor="middle" font-size="10" fill="#b85450">c0 = 1（翻转为 0 的代价）</text>

  <!-- arrow -->
  <path d="M 240 410 L 290 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer box -->
  <rect x="300" y="380" width="240" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="420" y="402" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案 = max(c0, c1)</text>
  <text x="420" y="420" text-anchor="middle" font-size="11" fill="#444">= max(1, 0) = 1</text>
  <text x="420" y="434" text-anchor="middle" font-size="10" fill="#888">翻转终值最少操作数</text>

  <!-- verification note -->
  <rect x="40" y="460" width="500" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="480" font-size="11" fill="#444" font-weight="bold">验证：</text>
  <text x="60" y="496" font-size="10" fill="#666">原式 "1&amp;(0|1)" = 1&amp;1 = 1。把首个 '1' 改为 '0' → "0&amp;(0|1)" = 0&amp;1 = 0，仅需 1 次操作。</text>
  <text x="60" y="512" font-size="10" fill="#666">或把 '|' 改为 '&amp;' → "1&amp;(0&amp;1)" = 1&amp;0 = 0，同样 1 次操作。两种方案代价均为 1。</text>
</svg>
