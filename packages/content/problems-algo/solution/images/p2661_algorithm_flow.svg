<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：行列计数法</text>

  <!-- Start -->
  <ellipse cx="270" cy="60" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="13" fill="#3a5a2a">开始</text>
  <path d="M270 78 L270 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1 预处理 -->
  <g filter="url(#rough2)">
    <rect x="130" y="94" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="270" y="121" text-anchor="middle" font-size="13" fill="#333">1. 预处理：遍历 mat，建 pos[v] = (r, c)</text>
  </g>
  <path d="M270 140 L270 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2 初始化计数 -->
  <g filter="url(#rough2)">
    <rect x="130" y="158" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="270" y="185" text-anchor="middle" font-size="13" fill="#333">2. rowCnt[0..m-1]、colCnt[0..n-1] 置 0</text>
  </g>
  <path d="M270 204 L270 220" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3 i=0 -->
  <g filter="url(#rough2)">
    <rect x="170" y="222" width="200" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="270" y="246" text-anchor="middle" font-size="13" fill="#a07020">3. i = 0</text>
  </g>
  <path d="M270 260 L270 276" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box4 取值查表 (loop entry) -->
  <g filter="url(#rough2)">
    <rect x="130" y="278" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="270" y="305" text-anchor="middle" font-size="13" fill="#333">4. v = arr[i]；(r, c) = pos[v]</text>
  </g>
  <path d="M270 324 L270 340" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box5 计数++ -->
  <g filter="url(#rough2)">
    <rect x="130" y="342" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="270" y="369" text-anchor="middle" font-size="13" fill="#333">5. rowCnt[r]++; colCnt[c]++</text>
  </g>
  <path d="M270 388 L270 404" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 判断 -->
  <g filter="url(#rough2)">
    <polygon points="270,406 370,452 270,498 170,452" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="270" y="448" text-anchor="middle" font-size="12" fill="#333">rowCnt[r]==n</text>
    <text x="270" y="466" text-anchor="middle" font-size="12" fill="#333">或 colCnt[c]==m ?</text>
  </g>

  <!-- Yes branch (right) -->
  <path d="M370 452 L420 452" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="388" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="424" y="434" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="474" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2a">返回 i</text>
  </g>

  <!-- No branch (down) -->
  <path d="M270 498 L270 516" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="286" y="512" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="210" y="518" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="270" y="539" text-anchor="middle" font-size="13" fill="#a07020">i++，回到步骤 4</text>
  </g>

  <!-- loop-back arrow: from i++ box right side up to Box4 right side -->
  <path d="M330 534 L500 534 L500 301 L414 301" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
