<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：完全 k 次幂 = 一张严格递增的「幂表」</text>
  <text x="280" y="43" text-anchor="middle" font-size="11" fill="#888">示例 k = 2：幂表 0, 1, 4, 9, 16, 25, 36, …（x = 0, 1, 2, …），问 [l, r] = [8, 30] 里有几项</text>

  <!-- range band -->
  <rect x="262" y="58" width="218" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="371" y="54" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">区间 [l, r] = [8, 30]</text>

  <!-- power table boxes -->
  <rect x="62" y="64" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="132" y="64" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="202" y="64" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="272" y="64" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="342" y="64" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="412" y="64" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="482" y="64" width="60" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="92" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="162" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="232" y="90" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <text x="302" y="90" text-anchor="middle" font-size="15" fill="#2f5e23" font-weight="bold">9</text>
  <text x="372" y="90" text-anchor="middle" font-size="15" fill="#2f5e23" font-weight="bold">16</text>
  <text x="442" y="90" text-anchor="middle" font-size="15" fill="#2f5e23" font-weight="bold">25</text>
  <text x="512" y="90" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">36</text>

  <text x="92" y="122" text-anchor="middle" font-size="9.5" fill="#8899aa">x=0</text>
  <text x="162" y="122" text-anchor="middle" font-size="9.5" fill="#8899aa">x=1</text>
  <text x="232" y="122" text-anchor="middle" font-size="9.5" fill="#8899aa">x=2</text>
  <text x="302" y="122" text-anchor="middle" font-size="9.5" fill="#8899aa">x=3</text>
  <text x="372" y="122" text-anchor="middle" font-size="9.5" fill="#8899aa">x=4</text>
  <text x="442" y="122" text-anchor="middle" font-size="9.5" fill="#8899aa">x=5</text>
  <text x="512" y="122" text-anchor="middle" font-size="9.5" fill="#8899aa">x=6</text>

  <!-- legend -->
  <text x="62" y="146" font-size="10" fill="#446688" font-weight="bold">■ 蓝 = 幂 &lt; l，只进 f(l−1)</text>
  <text x="262" y="146" font-size="10" fill="#4a7a3a" font-weight="bold">■ 绿 = 落在 [l, r] → 计入答案</text>
  <text x="462" y="146" font-size="10" fill="#999" font-weight="bold">■ 灰 = &gt; r</text>

  <!-- f(r) row -->
  <text x="40" y="182" font-size="11.5" fill="#446688" font-weight="bold">f(r) = f(30)</text>
  <text x="130" y="182" font-size="10.5" fill="#555">x² ≤ 30 的 x：</text>
  <rect x="222" y="168" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="252" y="168" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="282" y="168" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="312" y="168" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="168" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="372" y="168" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="235" y="185" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">0</text>
  <text x="265" y="185" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">1</text>
  <text x="295" y="185" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">2</text>
  <text x="325" y="185" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">3</text>
  <text x="355" y="185" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">4</text>
  <text x="385" y="185" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">5</text>
  <text x="416" y="185" font-size="11" fill="#2f5e23" font-weight="bold">→ f = 6</text>

  <!-- f(l-1) row -->
  <text x="40" y="222" font-size="11.5" fill="#446688" font-weight="bold">f(l−1) = f(7)</text>
  <text x="140" y="222" font-size="10.5" fill="#555">x² ≤ 7 的 x：</text>
  <rect x="222" y="208" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="252" y="208" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="282" y="208" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="235" y="225" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="265" y="225" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="295" y="225" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="316" y="225" font-size="11" fill="#446688" font-weight="bold">→ f = 3</text>

  <!-- result -->
  <path d="M 280 238 L 280 252" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="120" y="256" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="13" fill="#2f5e23" font-weight="bold">ans = f(r) − f(l−1) = 6 − 3 = 3</text>

  <!-- insight boxes -->
  <rect x="28" y="304" width="504" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="44" y="325" font-size="11.5" fill="#2f5e23" font-weight="bold">① 幂表有序无重复：x ≥ 0 时 x^k 严格递增</text>
  <text x="44" y="344" font-size="10" fill="#444">「≤ n 的幂的个数」= 最大 x(x^k ≤ n) + 1，+1 是 x = 0 的 0 = 0^k（l = 0 时要计入）</text>

  <rect x="28" y="372" width="504" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="44" y="393" font-size="11.5" fill="#a87020" font-weight="bold">② 幂表极稀疏：k ≥ 2 且 y ≤ 10⁹ ⇒ x ≤ 31622</text>
  <text x="44" y="412" font-size="10" fill="#444">二分（或顺序枚举）一步定位；k = 1 时幂表 = 全体非负整数，须特判 f(n) = n + 1</text>
</svg>
