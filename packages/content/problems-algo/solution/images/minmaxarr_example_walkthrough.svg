<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：一遍扫描求 max⌈前缀和/长度⌉</text>

  <!-- ===== 示例 1 表格 ===== -->
  <text x="30" y="46" font-size="12.5" fill="#333" font-weight="bold">示例 1：nums = [3, 7, 1, 6]</text>

  <!-- header band -->
  <rect x="30" y="52" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="150" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="235" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sum (S_k)</text>
  <text x="310" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k=i+1</text>
  <text x="395" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">⌈S_k/k⌉</text>
  <text x="475" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>

  <!-- row 0: i=0 -->
  <text x="70" y="91" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="150" y="91" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="235" y="91" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>
  <text x="310" y="91" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="395" y="91" text-anchor="middle" font-size="11.5" fill="#888">3</text>
  <text x="475" y="91" text-anchor="middle" font-size="11.5" fill="#333">3</text>

  <!-- row 1: i=1 (highlight) -->
  <rect x="30" y="100" width="500" height="22" fill="#fff8e1" opacity="0.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="115" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="150" y="115" text-anchor="middle" font-size="11.5" fill="#333">7</text>
  <text x="235" y="115" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">10</text>
  <text x="310" y="115" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="395" y="115" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">5</text>
  <text x="475" y="115" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">5</text>

  <!-- row 2: i=2 -->
  <text x="70" y="135" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="150" y="135" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="235" y="135" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">11</text>
  <text x="310" y="135" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="395" y="135" text-anchor="middle" font-size="11.5" fill="#888">4</text>
  <text x="475" y="135" text-anchor="middle" font-size="11.5" fill="#333">5</text>

  <!-- row 3: i=3 (highlight) -->
  <rect x="30" y="142" width="500" height="22" fill="#fff8e1" opacity="0.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="157" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="150" y="157" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="235" y="157" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">17</text>
  <text x="310" y="157" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="395" y="157" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">5</text>
  <text x="475" y="157" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">5</text>

  <text x="530" y="115" font-size="10.5" fill="#b85450" font-weight="bold">← ans 在 i=1 处定到 5</text>

  <!-- divider -->
  <line x1="30" y1="176" x2="530" y2="176" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== 示例 2 表格 ===== -->
  <text x="30" y="196" font-size="12.5" fill="#333" font-weight="bold">示例 2：nums = [10, 1]</text>

  <rect x="30" y="202" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="150" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="235" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sum (S_k)</text>
  <text x="310" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k=i+1</text>
  <text x="395" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">⌈S_k/k⌉</text>
  <text x="475" y="218" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>

  <rect x="30" y="228" width="500" height="22" fill="#fff8e1" opacity="0.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="243" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="150" y="243" text-anchor="middle" font-size="11.5" fill="#333">10</text>
  <text x="235" y="243" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">10</text>
  <text x="310" y="243" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="395" y="243" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">10</text>
  <text x="475" y="243" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">10</text>

  <text x="70" y="263" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="150" y="263" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="235" y="263" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">11</text>
  <text x="310" y="263" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="395" y="263" text-anchor="middle" font-size="11.5" fill="#888">6</text>
  <text x="475" y="263" text-anchor="middle" font-size="11.5" fill="#333">10</text>

  <text x="530" y="243" font-size="10.5" fill="#b85450" font-weight="bold">← ans 在 i=0 即定到 10</text>

  <!-- divider -->
  <line x1="30" y1="282" x2="530" y2="282" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== 操作序列：原数组 → 终态 ===== -->
  <text x="30" y="302" font-size="12.5" fill="#333" font-weight="bold">示例 1 的操作达成（公式结果 5 可达）：</text>

  <!-- 原数组 [3,7,1,6] -->
  <rect x="36" y="312" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="336" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="92" y="312" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="336" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">7</text>
  <rect x="148" y="312" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="336" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="204" y="312" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="336" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">6</text>

  <!-- arrow with label -->
  <path d="M 256 331 L 304 331" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">3 次左移</text>
  <text x="280" y="350" text-anchor="middle" font-size="9.5" fill="#888">i=1,i=3,i=1</text>

  <!-- 终态 [5,5,2,5] -->
  <rect x="312" y="312" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="336" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <rect x="368" y="312" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="336" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <rect x="424" y="312" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="448" y="336" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="480" y="312" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="504" y="336" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">终态最大值 = 5，恰等于 max⌈S_k/k⌉ —— 下界紧、可达</text>
</svg>
