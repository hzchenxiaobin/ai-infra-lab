<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：自连接 → 平方距离 → MIN → SQRT → ROUND</text>

  <!-- Step 1: point_2d table -->
  <rect x="20" y="60" width="80" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">point_2d</text>
  <line x1="30" y1="86" x2="90" y2="86" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="60" y="100" text-anchor="middle" font-size="9" fill="#555">x | y</text>
  <text x="60" y="114" text-anchor="middle" font-size="9" fill="#555">n 行</text>
  <text x="60" y="126" text-anchor="middle" font-size="8" fill="#888">唯一点</text>

  <!-- Arrow 1→2 -->
  <path d="M100 95 L130 95" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: Self JOIN -->
  <rect x="130" y="55" width="90" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="75" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Self JOIN</text>
  <text x="175" y="89" text-anchor="middle" font-size="8.5" fill="#555">p1 × p2</text>
  <line x1="140" y1="94" x2="210" y2="94" stroke="#d6a040" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="175" y="108" text-anchor="middle" font-size="8.5" fill="#555">排除自身：</text>
  <text x="175" y="120" text-anchor="middle" font-size="8" fill="#446688">x₁≠x₂ OR y₁≠y₂</text>
  <text x="175" y="132" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">或字典序去半</text>

  <!-- Arrow 2→3 -->
  <path d="M220 95 L250 95" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: squared distance per pair -->
  <rect x="250" y="55" width="95" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="297" y="75" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">平方距离</text>
  <text x="297" y="93" text-anchor="middle" font-size="9.5" fill="#333" font-family="Georgia, serif">dx²+dy²</text>
  <line x1="260" y1="100" x2="335" y2="100" stroke="#4a7a3a" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="297" y="114" text-anchor="middle" font-size="8.5" fill="#555">每对算一次</text>
  <text x="297" y="126" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">免 SQRT</text>

  <!-- Arrow 3→4 -->
  <path d="M345 95 L375 95" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: MIN -->
  <rect x="375" y="55" width="65" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="407" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">MIN()</text>
  <line x1="385" y1="86" x2="430" y2="86" stroke="#d6a040" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="407" y="102" text-anchor="middle" font-size="9" fill="#555">C(n,2) 个</text>
  <text x="407" y="116" text-anchor="middle" font-size="9" fill="#555">值取最小</text>
  <text x="407" y="130" text-anchor="middle" font-size="8" fill="#888">→ 1 个值</text>

  <!-- Arrow 4→5 -->
  <path d="M440 95 L470 95" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 5: SQRT + ROUND -->
  <rect x="470" y="55" width="75" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="507" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">SQRT</text>
  <text x="507" y="90" text-anchor="middle" font-size="6" fill="#888">↓</text>
  <text x="507" y="102" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ROUND</text>
  <text x="507" y="116" text-anchor="middle" font-size="9" fill="#555">(, 2)</text>
  <text x="507" y="130" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">→ shortest</text>

  <!-- Row count annotations -->
  <text x="175" y="150" text-anchor="middle" font-size="8.5" fill="#888">C(n,2) 行（≈n²/2）</text>
  <text x="297" y="150" text-anchor="middle" font-size="8.5" fill="#888">C(n,2) 个 d²</text>
  <text x="407" y="150" text-anchor="middle" font-size="8.5" fill="#888">1 个 min(d²)</text>
  <text x="507" y="150" text-anchor="middle" font-size="8.5" fill="#888">1 个 shortest</text>

  <!-- Optimization section -->
  <rect x="20" y="170" width="525" height="190" fill="#f6f8fa" stroke="#446688" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">两种 JOIN 条件对比</text>

  <!-- Left: != condition -->
  <rect x="35" y="205" width="240" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="155" y="225" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">解法 A：!= 排除自身</text>
  <text x="50" y="244" font-size="9.5" fill="#333" font-family="Georgia, serif">ON p1.x ≠ p2.x OR p1.y ≠ p2.y</text>
  <line x1="50" y1="252" x2="265" y2="252" stroke="#d6a040" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="50" y="268" font-size="9.5" fill="#555">• 每对算两次：(A,B) 和 (B,A)</text>
  <text x="50" y="284" font-size="9.5" fill="#555">• 共 n²−n 行（含对称重复）</text>
  <text x="50" y="300" font-size="9.5" fill="#555">• MIN 不受重复影响 → 正确</text>
  <text x="50" y="316" font-size="9.5" fill="#555">• 简单直观，适合小数据</text>
  <text x="50" y="334" font-size="9" fill="#888">写入代价：2× 计算</text>

  <!-- Right: lexicographic condition -->
  <rect x="290" y="205" width="240" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="225" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">解法 B：字典序去半（推荐）</text>
  <text x="305" y="244" font-size="8.5" fill="#333" font-family="Georgia, serif">ON p1.x&lt;p2.x OR (p1.x=p2.x AND p1.y&lt;p2.y)</text>
  <line x1="305" y1="252" x2="520" y2="252" stroke="#4a7a3a" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="305" y="268" font-size="9.5" fill="#555">• 每对只算一次（全序关系）</text>
  <text x="305" y="284" font-size="9.5" fill="#555">• 共 C(n,2) 行（无重复）</text>
  <text x="305" y="300" font-size="9.5" fill="#555">• 天然排除自身（严格不等）</text>
  <text x="305" y="316" font-size="9.5" fill="#555">• 计算量减半，大表更友好</text>
  <text x="305" y="334" font-size="9" fill="#4a7a3a" font-weight="bold">写入代价：1× 计算 ★</text>
</svg>
