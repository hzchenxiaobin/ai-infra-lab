<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求和取 max，再与 ⌈s/2⌉ 取 max</text>

  <!-- Input -->
  <rect x="160" y="40" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s = a+b+c ； m = max(a,b,c)</text>
  <text x="280" y="74" text-anchor="middle" font-size="10.5" fill="#888">a,b,c = amount[0..2]</text>

  <!-- arrow down to diamond -->
  <path d="M 280 82 L 280 100" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="280,104 388,150 280,196 172,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2·m ≥ s ?</text>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#888">最大类 ≥ 其余之和</text>

  <!-- Yes branch (left) -->
  <path d="M 172 150 L 132 150" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="152" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="128" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="85" y="148" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">情形 A</text>
  <text x="85" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return m</text>

  <!-- No branch (right) -->
  <path d="M 388 150 L 428 150" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="430" y="128" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="475" y="148" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">情形 B</text>
  <text x="475" y="164" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">return ⌈s/2⌉</text>

  <!-- merge arrows down -->
  <path d="M 85 172 L 85 212 L 240 232" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 475 172 L 475 212 L 320 232" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- merge box -->
  <rect x="150" y="236" width="260" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">等价写法：return max(m, (s+1)//2)</text>
  <text x="280" y="276" text-anchor="middle" font-size="10.5" fill="#888">两情形被 max 自然合并，无需分支</text>

  <!-- legend notes -->
  <text x="40" y="314" font-size="11" fill="#555">• 情形 A（2·m ≥ s）：最大类足够"喂"完其余两类，余下逐杯单装 → m 秒</text>
  <text x="40" y="334" font-size="11" fill="#555">• 情形 B（2·m &lt; s）：三类彼此"配平"，两两配对至多剩 1 杯 → ⌈s/2⌉ 秒</text>
  <text x="40" y="354" font-size="11" fill="#555">• 两情形对应下界 m 与 ⌈s/2⌉，谁大谁主导，max 即答案</text>
  <text x="40" y="380" font-size="10.5" fill="#888">注：⌈s/2⌉ 的整数写法 (s+1)//2 在 s≥0 时对 C++/Python 行为一致。</text>
</svg>
