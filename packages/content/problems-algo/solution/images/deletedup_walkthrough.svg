<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：Self JOIN 配对 → 标出待删行</text>

  <!-- Original Person table -->
  <text x="80" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">原始 Person</text>
  <rect x="30" y="62" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="77" font-size="10" fill="#333">id</text>
  <text x="95" y="77" font-size="10" fill="#333">email</text>
  <line x1="68" y1="62" x2="68" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="84" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="98" font-size="10" fill="#333">1</text>
  <text x="95" y="98" font-size="10" fill="#333">a@b.com</text>
  <line x1="68" y1="84" x2="68" y2="104" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="104" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="118" font-size="10" fill="#333">2</text>
  <text x="95" y="118" font-size="10" fill="#333">c@d.com</text>
  <line x1="68" y1="104" x2="68" y2="124" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="124" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="138" font-size="10" fill="#333">3</text>
  <text x="95" y="138" font-size="10" fill="#333">a@b.com</text>
  <line x1="68" y1="124" x2="68" y2="144" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <path d="M140 114 L195 114" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="168" y="108" text-anchor="middle" font-size="9" fill="#446688">配对</text>

  <!-- Pairing table -->
  <text x="400" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">配对结果（p1.email=p2.email AND p1.id&gt;p2.id）</text>
  <rect x="240" y="62" width="320" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="77" font-size="10" fill="#333">p1.id</text>
  <text x="360" y="77" font-size="10" fill="#333">p1.email</text>
  <text x="450" y="77" font-size="10" fill="#333">p2.id</text>
  <text x="525" y="77" font-size="10" fill="#333">命中?</text>
  <line x1="320" y1="62" x2="320" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="62" x2="410" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="490" y1="62" x2="490" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- pair row 1: p1.id=1 -->
  <rect x="240" y="84" width="320" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="98" font-size="10" fill="#999">1</text>
  <text x="360" y="98" font-size="10" fill="#999">a@b.com</text>
  <text x="450" y="98" font-size="10" fill="#999">—</text>
  <text x="525" y="98" font-size="10" fill="#999">✗（无更小 id）</text>
  <line x1="320" y1="84" x2="320" y2="104" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="84" x2="410" y2="104" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="490" y1="84" x2="490" y2="104" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- pair row 2: p1.id=2 -->
  <rect x="240" y="104" width="320" height="20" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="118" font-size="10" fill="#999">2</text>
  <text x="360" y="118" font-size="10" fill="#999">c@d.com</text>
  <text x="450" y="118" font-size="10" fill="#999">—</text>
  <text x="525" y="118" font-size="10" fill="#999">✗（无更小 id）</text>
  <line x1="320" y1="104" x2="320" y2="124" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="104" x2="410" y2="124" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="490" y1="104" x2="490" y2="124" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- pair row 3: p1.id=3, p2.id=1 HIT -->
  <rect x="240" y="124" width="320" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="138" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="360" y="138" font-size="10" fill="#333">a@b.com</text>
  <text x="450" y="138" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="525" y="138" font-size="10" fill="#b85450" font-weight="bold">✓ 命中 → 删 p1</text>
  <line x1="320" y1="124" x2="320" y2="144" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="124" x2="410" y2="144" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="490" y1="124" x2="490" y2="144" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow down to delete set -->
  <path d="M80 152 L80 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="178" font-size="10" fill="#b85450" font-weight="bold">命中行即待删</text>

  <!-- delete set -->
  <text x="80" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">待删集合 = { id=3 }</text>
  <rect x="30" y="224" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">DELETE id=3</text>

  <!-- arrow to result -->
  <path d="M80 252 L80 290" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result -->
  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">删除后结果（每组仅留最小 id）</text>
  <rect x="250" y="292" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="307" font-size="10" fill="#333">id</text>
  <text x="315" y="307" font-size="10" fill="#333">email</text>
  <line x1="288" y1="292" x2="288" y2="314" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="250" y="314" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="328" font-size="10" fill="#333">1</text>
  <text x="315" y="328" font-size="10" fill="#333">a@b.com</text>
  <line x1="288" y1="314" x2="288" y2="334" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="250" y="334" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="348" font-size="10" fill="#333">2</text>
  <text x="315" y="348" font-size="10" fill="#333">c@d.com</text>
  <line x1="288" y1="334" x2="288" y2="354" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- takeaway -->
  <rect x="30" y="380" width="540" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="400" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">规律：每组重复 email 中，除最小 id 外的每一行都会被某配对命中</text>
  <text x="50" y="418" font-size="10" fill="#333">id=k 的行被删 ⟺ 存在更小的 id=k'&lt;k 且 email 相同（即 k 不是该 email 组的最小 id）→ 留下的恰好是每组最小 id</text>
</svg>
