<svg xmlns="http://www.w3.org/2000/svg" width="860" height="600" viewBox="0 0 860 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="600" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">迭代计数流程：斐波那契预处理 + 逐位累加</text>
  <path d="M 290 40 Q 430 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="370" y="60" width="120" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="430" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">开始</text>
  <path d="M 430 92 L 430 108" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="290" y="110" width="280" height="36" rx="6" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <text x="430" y="133" text-anchor="middle" font-size="12" fill="#333">bits = bin(n)[2:]，L = len(bits)</text>
  <path d="M 430 146 L 430 162" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="265" y="164" width="330" height="44" rx="6" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <text x="430" y="184" text-anchor="middle" font-size="12" fill="#333">预处理 f[0..L]</text>
  <text x="430" y="200" text-anchor="middle" font-size="11" fill="#666">f[0]=1, f[1]=2, f[i]=f[i-1]+f[i-2]</text>
  <path d="M 430 208 L 430 224" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="320" y="226" width="220" height="32" rx="6" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <text x="430" y="247" text-anchor="middle" font-size="12" fill="#333">ans = 0，prev_one = False</text>
  <path d="M 430 258 L 430 276" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="430" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">for i in range(L):</text>

  <g filter="url(#sk)">
    <rect x="150" y="300" width="560" height="244" rx="10" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>

  <g filter="url(#sk)">
    <path d="M 430 312 L 512 344 L 430 376 L 348 344 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="430" y="340" text-anchor="middle" font-size="11.5" fill="#2b2b2b">bits[i]</text>
  <text x="430" y="356" text-anchor="middle" font-size="11.5" fill="#2b2b2b">== '1' ?</text>

  <path d="M 348 344 L 256 344" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="302" y="338" text-anchor="middle" font-size="10.5" fill="#888">No</text>
  <g filter="url(#sk)">
    <rect x="166" y="328" width="90" height="34" rx="6" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <text x="211" y="350" text-anchor="middle" font-size="10.5" fill="#333">prev_one=False</text>

  <path d="M 430 376 L 430 396" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="390" font-size="10.5" fill="#888">Yes</text>

  <g filter="url(#sk)">
    <rect x="328" y="398" width="204" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="430" y="420" text-anchor="middle" font-size="12" fill="#2e6e2e">ans += f[L - i - 1]</text>
  <path d="M 430 432 L 430 448" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 430 450 L 502 478 L 430 506 L 358 478 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="430" y="482" text-anchor="middle" font-size="11.5" fill="#2b2b2b">prev_one ?</text>

  <path d="M 502 478 L 572 478" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="537" y="472" text-anchor="middle" font-size="10.5" fill="#b85450">Yes</text>
  <g filter="url(#sk)">
    <rect x="574" y="462" width="120" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="634" y="478" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">return ans</text>
  <text x="634" y="491" text-anchor="middle" font-size="9.5" fill="#b85450">（n 含连续 1）</text>

  <path d="M 430 506 L 430 522" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="518" font-size="10.5" fill="#888">No</text>
  <g filter="url(#sk)">
    <rect x="350" y="524" width="160" height="30" rx="6" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <text x="430" y="544" text-anchor="middle" font-size="11" fill="#333">prev_one = True</text>

  <path d="M 350 539 L 110 539 L 110 292 L 360 292" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4 3"/>
  <path d="M 166 345 L 110 345" stroke="#5a5a5a" stroke-width="1.4" fill="none" filter="url(#sk)" stroke-dasharray="4 3"/>
  <text x="92" y="420" font-size="10" fill="#888" transform="rotate(-90 92 420)">↻ 下一轮 i</text>

  <path d="M 430 544 L 430 562" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="320" y="564" width="220" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="430" y="585" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">return ans + 1（n 合法）</text>
</svg>
