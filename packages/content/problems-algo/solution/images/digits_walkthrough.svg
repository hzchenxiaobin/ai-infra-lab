<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "owoztneoer" → "012"</text>

  <!-- ===== Section 1: character frequency ===== -->
  <text x="40" y="54" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">字符频率统计：</text>

  <!-- 7 char-count boxes: o=3 w=1 z=1 t=1 n=1 e=2 r=1 -->
  <rect x="140" y="42" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o:3</text>
  <rect x="188" y="42" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w:1</text>
  <rect x="236" y="42" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="257" y="59" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">z:1</text>
  <rect x="284" y="42" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t:1</text>
  <rect x="332" y="42" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n:1</text>
  <rect x="380" y="42" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="401" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e:2</text>
  <rect x="428" y="42" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="449" y="59" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r:1</text>

  <!-- divider -->
  <line x1="40" y1="82" x2="500" y2="82" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Section 2: deduction ===== -->
  <text x="40" y="100" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逐数字推导：</text>

  <!-- Row 1: zero = count['z'] = 1 → 1 (green) y=118 -->
  <text x="50" y="120" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">zero</text>
  <text x="100" y="120" font-size="11" fill="#555" filter="url(#rough2)">= count['z']</text>
  <text x="210" y="120" font-size="11" fill="#888" filter="url(#rough2)">= 1</text>
  <rect x="430" y="108" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="444" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Row 2: two = count['w'] = 1 → 1 (green) y=136 -->
  <text x="50" y="138" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">two</text>
  <text x="100" y="138" font-size="11" fill="#555" filter="url(#rough2)">= count['w']</text>
  <text x="210" y="138" font-size="11" fill="#888" filter="url(#rough2)">= 1</text>
  <rect x="430" y="126" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="444" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Row 3: four = count['u'] = 0 → 0 (gray) y=154 -->
  <text x="50" y="156" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">four</text>
  <text x="100" y="156" font-size="11" fill="#555" filter="url(#rough2)">= count['u']</text>
  <text x="210" y="156" font-size="11" fill="#888" filter="url(#rough2)">= 0</text>
  <rect x="430" y="144" width="28" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="444" y="158" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- Row 4: six = count['x'] = 0 → 0 (gray) y=172 -->
  <text x="50" y="174" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">six</text>
  <text x="100" y="174" font-size="11" fill="#555" filter="url(#rough2)">= count['x']</text>
  <text x="210" y="174" font-size="11" fill="#888" filter="url(#rough2)">= 0</text>
  <rect x="430" y="162" width="28" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="444" y="176" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- Row 5: eight = count['g'] = 0 → 0 (gray) y=190 -->
  <text x="50" y="192" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">eight</text>
  <text x="100" y="192" font-size="11" fill="#555" filter="url(#rough2)">= count['g']</text>
  <text x="210" y="192" font-size="11" fill="#888" filter="url(#rough2)">= 0</text>
  <rect x="430" y="180" width="28" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="444" y="194" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- Row 6: three = count['h'] − eight = 0−0 = 0 → 0 (gray) y=208 -->
  <text x="50" y="210" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">three</text>
  <text x="100" y="210" font-size="11" fill="#555" filter="url(#rough2)">= count['h'] − eight</text>
  <text x="250" y="210" font-size="11" fill="#888" filter="url(#rough2)">= 0 − 0 = 0</text>
  <rect x="430" y="198" width="28" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="444" y="212" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- Row 7: five = count['f'] − four = 0−0 = 0 → 0 (gray) y=226 -->
  <text x="50" y="228" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">five</text>
  <text x="100" y="228" font-size="11" fill="#555" filter="url(#rough2)">= count['f'] − four</text>
  <text x="250" y="228" font-size="11" fill="#888" filter="url(#rough2)">= 0 − 0 = 0</text>
  <rect x="430" y="216" width="28" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="444" y="230" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- Row 8: seven = count['s'] − six = 0−0 = 0 → 0 (gray) y=244 -->
  <text x="50" y="246" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">seven</text>
  <text x="100" y="246" font-size="11" fill="#555" filter="url(#rough2)">= count['s'] − six</text>
  <text x="250" y="246" font-size="11" fill="#888" filter="url(#rough2)">= 0 − 0 = 0</text>
  <rect x="430" y="234" width="28" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="444" y="248" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- Row 9: nine = count['i'] − 5 − 6 − 8 = 0 → 0 (gray) y=262 -->
  <text x="50" y="264" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">nine</text>
  <text x="100" y="264" font-size="11" fill="#555" filter="url(#rough2)">= count['i'] − five − six − eight</text>
  <text x="290" y="264" font-size="11" fill="#888" filter="url(#rough2)">= 0</text>
  <rect x="430" y="252" width="28" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="444" y="266" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- Row 10: one = count['o'] − 0 − 2 − 4 = 3−1−1−0 = 1 → 1 (green) y=280 -->
  <text x="50" y="282" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">one</text>
  <text x="100" y="282" font-size="11" fill="#555" filter="url(#rough2)">= count['o'] − zero − two − four</text>
  <text x="290" y="282" font-size="11" fill="#888" filter="url(#rough2)">= 3 − 1 − 1 − 0 = 1</text>
  <rect x="430" y="270" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="444" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- divider -->
  <line x1="40" y1="300" x2="500" y2="300" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Section 3: result ===== -->
  <text x="40" y="322" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">非零数字：0×1 + 1×1 + 2×1</text>

  <!-- result digits -->
  <rect x="120" y="336" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="138" y="358" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="336" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="182" y="358" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="208" y="336" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="226" y="358" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- arrow -->
  <path d="M 256 353 L 296 353" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">升序拼接</text>

  <!-- final result -->
  <rect x="306" y="336" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="351" y="358" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">"012"</text>
</svg>
