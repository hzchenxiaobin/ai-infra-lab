<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">唯一性数组 = 全部子数组的 distinct 值排序（示例 nums = [1,2,3]）</text>

  <!-- left column header -->
  <text x="115" y="48" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 逐个求 distinct</text>

  <!-- 6 rows: subarray -> distinct -->
  <rect x="30" y="58" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="76" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="167" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 1</text>

  <rect x="30" y="90" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="167" y="108" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 1</text>

  <rect x="30" y="122" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="140" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[3]</text>
  <text x="167" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 1</text>

  <rect x="30" y="154" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="172" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="167" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 2</text>

  <rect x="30" y="186" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[2,3]</text>
  <text x="167" y="204" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 2</text>

  <rect x="30" y="218" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,2,3]</text>
  <text x="167" y="236" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 3</text>

  <!-- sort arrow -->
  <text x="242" y="138" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">排序 ↑</text>
  <path d="M 228 158 L 228 188" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- right column header -->
  <text x="392" y="48" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 排序后（唯一性数组）</text>

  <!-- sorted values vertical list -->
  <text x="262" y="76" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">#1</text>
  <rect x="278" y="58" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="262" y="108" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">#2</text>
  <rect x="278" y="90" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="108" text-anchor="middle" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="262" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">#3</text>
  <rect x="278" y="122" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="140" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="262" y="172" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">#4</text>
  <rect x="278" y="154" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="262" y="204" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">#5</text>
  <rect x="278" y="186" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="204" text-anchor="middle" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="262" y="236" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">#6</text>
  <rect x="278" y="218" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- median annotation -->
  <path d="M 330 135 L 368 135" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="374" y="120" width="118" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="433" y="140" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">中位数 = 1</text>

  <!-- bottom conclusion -->
  <rect x="40" y="266" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">m = n(n+1)/2 = 6 个值，k = ⌈m/2⌉ = 3（偶数长度取较小中间元素）</text>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">⇒ 中位数 = 唯一性数组的第 k 小</text>

  <!-- bottom note -->
  <rect x="40" y="330" width="440" height="30" fill="#fafafa" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">本题 m 可达 5×10⁹：数组造不出来，只能「数个数」——见下一张图</text>

  <text x="260" y="382" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">distinct 值域只有 [1, n]，中位数落点很窄 ⇒ 二分答案的信号</text>
</svg>
