<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="510" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums1=[1,3,3,2], nums2=[2,1,3,4], k=3</text>
  <text x="380" y="46" text-anchor="middle" font-size="11" fill="#888">按 nums2↓ 排序得：(2,4)→(3,3)→(1,2)→(3,1)，k−1=2，全程维护容量 2 的小顶堆</text>

  <!-- table header -->
  <g font-size="11" font-weight="bold">
    <rect x="30" y="64" width="60" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="60" y="84" text-anchor="middle" fill="#333">步</text>
    <rect x="92" y="64" width="130" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="157" y="84" text-anchor="middle" fill="#333">当前 (a1,a2)</text>
    <rect x="224" y="64" width="130" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="289" y="84" text-anchor="middle" fill="#333">入堆前堆</text>
    <rect x="356" y="64" width="60" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="386" y="84" text-anchor="middle" fill="#333">sum</text>
    <rect x="418" y="64" width="170" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="503" y="84" text-anchor="middle" fill="#333">候选 (sum+a1)*a2</text>
    <rect x="590" y="64" width="150" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="665" y="84" text-anchor="middle" fill="#333">入堆后（弹后）</text>
  </g>

  <!-- Step 1 -->
  <g font-size="11">
    <rect x="30" y="96" width="60" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="118" text-anchor="middle" fill="#333">1</text>
    <rect x="92" y="96" width="130" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="157" y="118" text-anchor="middle" fill="#333">(2, 4)</text>
    <rect x="224" y="96" width="130" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="289" y="118" text-anchor="middle" fill="#888">—（空）</text>
    <rect x="356" y="96" width="60" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="386" y="118" text-anchor="middle" fill="#333">0</text>
    <rect x="418" y="96" width="170" height="34" rx="3" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="503" y="118" text-anchor="middle" fill="#888">堆未满，跳过</text>
    <rect x="590" y="96" width="150" height="34" rx="3" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="665" y="118" text-anchor="middle" fill="#333">{2}</text>
  </g>

  <!-- Step 2 -->
  <g font-size="11">
    <rect x="30" y="132" width="60" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="154" text-anchor="middle" fill="#333">2</text>
    <rect x="92" y="132" width="130" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="157" y="154" text-anchor="middle" fill="#333">(3, 3)</text>
    <rect x="224" y="132" width="130" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="289" y="154" text-anchor="middle" fill="#333">{2}</text>
    <rect x="356" y="132" width="60" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="386" y="154" text-anchor="middle" fill="#333">2</text>
    <rect x="418" y="132" width="170" height="34" rx="3" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="503" y="154" text-anchor="middle" fill="#888">堆未满，跳过</text>
    <rect x="590" y="132" width="150" height="34" rx="3" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="665" y="154" text-anchor="middle" fill="#333">{2, 3}</text>
  </g>

  <!-- Step 3: highlight, candidate 12 -->
  <g font-size="11">
    <rect x="30" y="168" width="60" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="60" y="190" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="92" y="168" width="130" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="157" y="190" text-anchor="middle" fill="#333" font-weight="bold">(1, 2)</text>
    <rect x="224" y="168" width="130" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="289" y="190" text-anchor="middle" fill="#333">{2, 3}</text>
    <rect x="356" y="168" width="60" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="386" y="190" text-anchor="middle" fill="#333">5</text>
    <rect x="418" y="168" width="170" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="503" y="190" text-anchor="middle" fill="#b85450" font-weight="bold">(5+1)*2 = 12 ✓</text>
    <rect x="590" y="168" width="150" height="34" rx="3" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="665" y="190" text-anchor="middle" fill="#333">入1→弹1→{2,3}</text>
  </g>

  <!-- Step 4 -->
  <g font-size="11">
    <rect x="30" y="204" width="60" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="226" text-anchor="middle" fill="#333">4</text>
    <rect x="92" y="204" width="130" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="157" y="226" text-anchor="middle" fill="#333">(3, 1)</text>
    <rect x="224" y="204" width="130" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="289" y="226" text-anchor="middle" fill="#333">{2, 3}</text>
    <rect x="356" y="204" width="60" height="34" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="386" y="226" text-anchor="middle" fill="#333">5</text>
    <rect x="418" y="204" width="170" height="34" rx="3" fill="#fafafa" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="503" y="226" text-anchor="middle" fill="#888">(5+3)*1 = 8</text>
    <rect x="590" y="204" width="150" height="34" rx="3" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="665" y="226" text-anchor="middle" fill="#333">入3→弹2→{3,3}</text>
  </g>

  <!-- answer row -->
  <rect x="30" y="248" width="710" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="270" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最大候选 = 12（第 3 步：钦定 nums2=2 作 min，配前缀最大的 3、3 凑成 k=3）</text>

  <!-- explanation of step 3 -->
  <rect x="30" y="296" width="710" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="322" font-size="12" fill="#444" font-weight="bold">第 3 步为何命中答案？</text>
  <text x="50" y="344" font-size="11" fill="#555">处理到 (1, 2) 即下标 i=0：其 nums2[0]=2，此前已扫过 nums2=4、3 的两个下标（i=3、i=2）。</text>
  <text x="50" y="362" font-size="11" fill="#555">它们 nums2 都 ≥ 2，可作"不破坏 2 为最小"的合法配对；从中取 nums1 最大的 k−1=2 个：3、3（来自 i=2、i=3）。</text>
  <text x="50" y="380" font-size="11" fill="#555">加自身 nums1[0]=1 凑成 k=3 个，sum=3+3=5，候选 = (5+1)*2 = 12。</text>
  <text x="50" y="400" font-size="10" fill="#888">第 4 步 nums2 更小（=1），虽 sum 略升，乘以 1 后反而更小 → 12 保持最优。</text>
  <text x="50" y="416" font-size="10" fill="#888">对应官方解释：选下标 {0,2,3} → (1+3+2)*min(2,3,4) = 6*2 = 12。</text>

  <!-- bottom note -->
  <text x="380" y="452" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每步 O(1) 摊还（堆 push/pop O(log k)），全程 O(n log n)</text>
  <text x="380" y="472" text-anchor="middle" font-size="10" fill="#888">堆始终只存"已扫过中最大的 k−1 个 nums1"，容量被严格控制在 k−1</text>
</svg>
