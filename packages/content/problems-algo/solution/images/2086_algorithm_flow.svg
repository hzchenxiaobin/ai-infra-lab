<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：从左到右扫描，遇 H 贪心放桶</text>

  <rect x="245" y="38" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 280 62 L 280 74" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="76" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">s = list(hamsters)</text>
  <text x="280" y="106" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">ans = 0;  i = 0</text>
  <path d="M 280 110 L 280 124" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <polygon points="280,126 372,156 280,186 188,156" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)"></text>

  <path d="M 188 156 L 168 156" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="178" y="148" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="50" y="142" width="118" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="109" y="160" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return ans</text>

  <path d="M 280 186 L 280 200" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="196" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <polygon points="280,202 372,232 280,262 188,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">s[i]=='H' 且</text>
  <text x="280" y="244" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">未被左桶喂?</text>

  <path d="M 372 232 L 410 232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="224" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="410" y="218" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="236" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i++; 继续</text>

  <path d="M 280 262 L 280 276" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="272" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">是</text>

  <polygon points="280,278 372,308 280,338 188,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">右是空位?</text>
  <text x="280" y="320" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i+1&lt;n 且 s[i+1]=='.'</text>

  <path d="M 372 308 L 410 308" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="410" y="294" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="470" y="312" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">放右; ans++; i++</text>

  <path d="M 280 338 L 280 352" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="348" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <polygon points="280,354 372,384 280,414 188,384" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">左是空位?</text>
  <text x="280" y="396" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i-1≥0 且 s[i-1]=='.'</text>

  <path d="M 372 384 L 410 384" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="376" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="410" y="370" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="470" y="388" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">放左; ans++; i++</text>

  <path d="M 280 414 L 280 422" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="421" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="240" y="424" width="80" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">return -1</text>

  <path d="M 530 232 L 545 232 L 545 156 L 372 156" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 530 308 L 545 308" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 530 384 L 545 384" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="555" y="96" font-size="10" fill="#888" filter="url(#rough2)">循环</text>
  <text x="555" y="108" font-size="10" fill="#888" filter="url(#rough2)">回 D1</text>
</svg>
