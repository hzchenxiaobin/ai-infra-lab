<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：add / get 各 O(log n)</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">不变式：|left| = k（已 get 次数），left 堆顶 = 第 k 佳</text>

  <!-- ===== 左列：add(x) ===== -->
  <rect x="30" y="68" width="230" height="350" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="145" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">add(name, score)</text>

  <!-- step 1 -->
  <rect x="50" y="108" width="190" height="34" fill="#fff" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="129" text-anchor="middle" font-size="11" fill="#333">① x 压入 right（小顶）</text>
  <path d="M 145 142 L 145 152" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="50" y="156" width="190" height="34" fill="#fff" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="177" text-anchor="middle" font-size="11" fill="#333">② 弹 right 堆顶 y → 压入 left</text>
  <path d="M 145 190 L 145 200" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 145 204 L 200 234 L 145 264 L 90 234 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="232" text-anchor="middle" font-size="10" fill="#444">|left|</text>
  <text x="145" y="246" text-anchor="middle" font-size="10" fill="#444">&gt; k ?</text>
  <!-- yes branch -->
  <text x="206" y="238" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <path d="M 200 234 L 250 234 L 250 282" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="155" y="286" width="190" height="0" fill="none"/>
  <rect x="50" y="286" width="190" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="307" text-anchor="middle" font-size="11" fill="#b85450">③ 弹 left 堆顶 → 压回 right</text>
  <!-- no branch -->
  <text x="70" y="238" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 90 234 L 50 234 L 50 302" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="330" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="145" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left 恰为 k 佳，结束</text>

  <!-- ===== 右列：get() ===== -->
  <rect x="300" y="68" width="230" height="350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="415" y="92" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">get()</text>

  <!-- step 1 -->
  <rect x="320" y="108" width="190" height="34" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="415" y="129" text-anchor="middle" font-size="11" fill="#333">① 弹 right 堆顶 y → 压入 left</text>
  <path d="M 415 142 L 415 152" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="320" y="156" width="190" height="34" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="415" y="177" text-anchor="middle" font-size="11" fill="#333">② k = k + 1</text>
  <path d="M 415 190 L 415 200" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="320" y="204" width="190" height="34" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="415" y="225" text-anchor="middle" font-size="11" fill="#333">③ 返回 left 堆顶 = 第 k 佳</text>
  <path d="M 415 238 L 415 248" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note box -->
  <rect x="320" y="266" width="190" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="415" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">为何正确？</text>
  <text x="328" y="306" font-size="10" fill="#333">get 前 left 有 k 佳，</text>
  <text x="328" y="320" font-size="10" fill="#333">堆顶=第 k 佳。</text>
  <text x="328" y="336" font-size="10" fill="#333">提升 y=(k+1) 佳入 left，</text>
  <text x="328" y="350" font-size="10" fill="#333">新堆顶=y=第 k+1 佳 ✓</text>

  <!-- bottom invariant reminder -->
  <rect x="30" y="428" width="0" height="0" fill="none"/>
</svg>
