<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：平衡只看 min/max ⟹ 最优保留集 = 排序后一段连续区间</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">把值落在 [min, max] 里的元素全塞回来，min/max 不变 ⇒ 仍平衡且移除更少</text>

  <!-- ============ Panel 1: 非连续的保留集合 ============ -->
  <text x="30" y="68" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 假设最优解保留的是散点（nums = [1,2,6,9], k = 3）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="84" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="116" y="84" width="52" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="172" y="84" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="84" width="52" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="86" y="106" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">2</text>
    <text x="142" y="106" text-anchor="middle" font-size="12" fill="#888">1</text>
    <text x="198" y="106" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">6</text>
    <text x="254" y="106" text-anchor="middle" font-size="12" fill="#888">9</text>
    <text x="86" y="76" text-anchor="middle" font-size="8.5" fill="#4a7a3a">保留</text>
    <text x="198" y="76" text-anchor="middle" font-size="8.5" fill="#4a7a3a">保留</text>
    <text x="142" y="76" text-anchor="middle" font-size="8.5" fill="#999">弃</text>
    <text x="254" y="76" text-anchor="middle" font-size="8.5" fill="#999">弃</text>
    <text x="320" y="97" font-size="9.5" fill="#555">排序后 {2,6} 平衡：</text>
    <text x="320" y="114" font-size="9.5" fill="#555">6 ≤ 2×3，但中间的 1 白白扔了</text>
  </g>

  <!-- arrow -->
  <path d="M 200 140 q 10 18 0 34" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr3634a)"/>
  <defs>
    <marker id="arr3634a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>
  <text x="245" y="162" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">值在 [min,max] 内的全塞回来 ⟹ 更优</text>

  <!-- ============ Panel 2: 扩充成连续区间 ============ -->
  <text x="30" y="196" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 扩充：连续区间才是候选答案</text>

  <g filter="url(#rough2)">
    <rect x="60" y="212" width="52" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="116" y="212" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="172" y="212" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="228" y="212" width="52" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="86" y="234" text-anchor="middle" font-size="12" fill="#888">1</text>
    <text x="142" y="234" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">1</text>
    <text x="198" y="234" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">2</text>
    <text x="254" y="234" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">6</text>
    <text x="198" y="204" text-anchor="middle" font-size="8.5" fill="#d6a040">区间 [1,2,6]：min=1, max=6 ≤ 1×3? ✗</text>
    <text x="320" y="225" font-size="9.5" fill="#555">塞回 1 后 min 变 1，</text>
    <text x="320" y="242" font-size="9.5" fill="#555">窗口反被拉爆 ⇒ 换个左端点再试：</text>
  </g>

  <!-- ============ Panel 3: 滑动窗口判定 ============ -->
  <text x="30" y="284" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 问题坍缩：最长窗口 [i, j] 使 nums[j] ≤ nums[i] × k</text>

  <g filter="url(#rough2)">
    <rect x="60" y="300" width="52" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="116" y="300" width="52" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="172" y="300" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="300" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="86" y="322" text-anchor="middle" font-size="12" fill="#888">1</text>
    <text x="142" y="322" text-anchor="middle" font-size="12" fill="#888">2</text>
    <text x="198" y="322" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">6</text>
    <text x="254" y="322" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">9</text>
    <text x="198" y="292" text-anchor="middle" font-size="8.5" fill="#4a7a3a">i（min）</text>
    <text x="254" y="292" text-anchor="middle" font-size="8.5" fill="#4a7a3a">j（max）</text>
    <path d="M 172 342 v 6 h 108 v -6" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="226" y="362" text-anchor="middle" font-size="9.5" fill="#2a5a2a">9 ≤ 6×3 = 18 ✓ 长度 2</text>
    <text x="330" y="313" font-size="9.5" fill="#555">排序后 min=nums[i]、max=nums[j]，</text>
    <text x="330" y="330" font-size="9.5" fill="#555">区间合法 ⟺ 一句话判据</text>
    <text x="330" y="347" font-size="10" fill="#b85450" font-weight="bold">答案 = n − 最长窗口长度</text>
  </g>

  <!-- ============ Bottom note ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="374" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="260" y="398" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">移除最少 ⟺ 保留最多 ⟺ 排序后最长合法连续窗口——三步等价变形</text>
  </g>
</svg>
