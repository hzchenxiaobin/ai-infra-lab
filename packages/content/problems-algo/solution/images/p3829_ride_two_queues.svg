<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：双 FIFO 队列配对 + waiting 集合记账（懒删除）</text>

  <!-- 乘客队列 -->
  <text x="36" y="56" font-size="11" fill="#333" filter="url(#rough2)">乘客队列 riders（FIFO）</text>

  <rect x="36" y="66" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="59" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <rect x="88" y="66" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="111" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 已取消的幽灵条目 -->
  <rect x="140" y="66" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="163" y="89" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <path d="M 144 84 L 182 84" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="163" y="120" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">幽灵（已取消）</text>

  <!-- 队首弹出方向 -->
  <path d="M 32 84 L 16 84" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="24" y="102" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">队首</text>

  <!-- waiting 集合 -->
  <rect x="330" y="48" width="170" height="104" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">waiting 哈希集合</text>
  <text x="415" y="98" text-anchor="middle" font-size="15" fill="#2e5a24" filter="url(#rough2)">{3, 1}</text>
  <text x="415" y="124" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">在集合 ⇔ 还在等待（唯一账本）</text>

  <!-- cancel：只移出集合 -->
  <path d="M 192 84 L 320 84" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="256" y="66" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">cancelRider(2)：移出账本</text>
  <text x="256" y="104" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">队列条目原地不动 → 幽灵</text>

  <!-- 司机队列 -->
  <text x="36" y="180" font-size="11" fill="#333" filter="url(#rough2)">司机队列 drivers（FIFO）</text>

  <rect x="36" y="192" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="59" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="88" y="192" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="111" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <path d="M 32 210 L 16 210" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="24" y="228" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">队首</text>

  <!-- match -->
  <rect x="330" y="176" width="170" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">matchDriverWithRider()</text>

  <path d="M 298 154 L 326 182" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="294" y="150" text-anchor="end" font-size="9" fill="#446688" filter="url(#rough2)">乘客队首 r</text>

  <path d="M 298 236 L 326 208" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="294" y="252" text-anchor="end" font-size="9" fill="#446688" filter="url(#rough2)">司机队首 d</text>

  <path d="M 415 206 L 415 228" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="345" y="232" width="140" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="252" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">return [2, 3]</text>
  <text x="415" y="270" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">双双离队 + waiting 销账 r</text>

  <!-- 底部要点 -->
  <rect x="60" y="310" width="400" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">懒删除：取消只改账本 O(1)，不动队列；</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">幽灵条目轮到队首时才被弹出——删除被推迟到 O(1) 的那一刻</text>

  <text x="260" y="400" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1000 次操作全部 O(1)（match 均摊）</text>
</svg>
