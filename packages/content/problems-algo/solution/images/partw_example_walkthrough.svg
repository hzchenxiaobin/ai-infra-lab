<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums[2] 改为 −33，得到 4 种分割</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">S = −46, k = −33, nums[2] = −25 → d = k − nums[2] = −8</text>

  <!-- change box -->
  <rect x="150" y="58" width="340" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">目标：lt = (S+d)/2 = −27（左半），rt = (S−d)/2 = −19（右半）</text>

  <!-- pivot index labels -->
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="100" y="116">p=1</text>
    <text x="142" y="116">2</text>
    <text x="184" y="116">3</text>
    <text x="226" y="116">4</text>
    <text x="268" y="116">5</text>
    <text x="310" y="116">6</text>
    <text x="352" y="116">7</text>
    <text x="394" y="116">8</text>
    <text x="436" y="116">9</text>
    <text x="478" y="116">10</text>
    <text x="520" y="116">11</text>
    <text x="562" y="116">12</text>
  </g>

  <!-- left part brace (p=1..2) -->
  <path d="M 80 126 L 80 132 L 162 132 L 162 126" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="121" y="146" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">左半 p≤i(=2)，查 lt=−27</text>

  <!-- right part brace (p=3..12) -->
  <path d="M 164 126 L 164 132 L 582 132 L 582 126" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="373" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右半 p&gt;i，查 rt=−19</text>

  <!-- prefix cells -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <!-- p=1: 22 (left, miss) -->
    <rect x="80" y="156" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="100" y="176" fill="#446688" font-weight="bold">22</text>
    <!-- p=2: 26 (left, miss) -->
    <rect x="122" y="156" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="142" y="176" fill="#446688" font-weight="bold">26</text>
    <!-- p=3: 1 (right, miss) -->
    <rect x="164" y="156" width="40" height="30" fill="#f4faf6" stroke="#9bbfa0" stroke-width="1.4" rx="4"/>
    <text x="184" y="176" fill="#888">1</text>
    <!-- p=4: -19 (right, HIT) -->
    <rect x="206" y="156" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="226" y="176" fill="#4a7a3a" font-weight="bold">−19</text>
    <!-- p=5: -34 (miss) -->
    <rect x="248" y="156" width="40" height="30" fill="#f4faf6" stroke="#9bbfa0" stroke-width="1.4" rx="4"/>
    <text x="268" y="176" fill="#888">−34</text>
    <!-- p=6: -19 (HIT) -->
    <rect x="290" y="156" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="310" y="176" fill="#4a7a3a" font-weight="bold">−19</text>
    <!-- p=7: -35 -->
    <rect x="332" y="156" width="40" height="30" fill="#f4faf6" stroke="#9bbfa0" stroke-width="1.4" rx="4"/>
    <text x="352" y="176" fill="#888">−35</text>
    <!-- p=8: -28 -->
    <rect x="374" y="156" width="40" height="30" fill="#f4faf6" stroke="#9bbfa0" stroke-width="1.4" rx="4"/>
    <text x="394" y="176" fill="#888">−28</text>
    <!-- p=9: -9 -->
    <rect x="416" y="156" width="40" height="30" fill="#f4faf6" stroke="#9bbfa0" stroke-width="1.4" rx="4"/>
    <text x="436" y="176" fill="#888">−9</text>
    <!-- p=10: -19 (HIT) -->
    <rect x="458" y="156" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="478" y="176" fill="#4a7a3a" font-weight="bold">−19</text>
    <!-- p=11: -19 (HIT) -->
    <rect x="500" y="156" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="520" y="176" fill="#4a7a3a" font-weight="bold">−19</text>
    <!-- p=12: -32 -->
    <rect x="542" y="156" width="40" height="30" fill="#f4faf6" stroke="#9bbfa0" stroke-width="1.4" rx="4"/>
    <text x="562" y="176" fill="#888">−32</text>
  </g>

  <!-- HIT markers -->
  <g filter="url(#rough2)" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="middle">
    <text x="226" y="204">✓</text>
    <text x="310" y="204">✓</text>
    <text x="478" y="204">✓</text>
    <text x="520" y="204">✓</text>
  </g>
  <text x="100" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="142" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- divider line between p=2 and p=3 -->
  <path d="M 163 150 L 163 214" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="163" y="228" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=2</text>

  <!-- divider -->
  <line x1="40" y1="244" x2="600" y2="244" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- summary boxes -->
  <rect x="60" y="262" width="250" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="185" y="284" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">左半（p ∈ [1, 2]）</text>
  <text x="185" y="302" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">prefix = {22, 26}，目标 −27</text>
  <text x="185" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">命中 0 个</text>

  <rect x="330" y="262" width="250" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="455" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右半（p ∈ [3, 12]）</text>
  <text x="455" y="302" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">目标 −19，命中 p=4,6,10,11</text>
  <text x="455" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中 4 个 ★</text>

  <!-- result box -->
  <rect x="150" y="346" width="340" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">count = 0 + 4 = 4  →  ans = 4</text>

  <!-- note -->
  <rect x="40" y="396" width="560" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="414" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">改动 nums[2]=−25 → −33 后，4 个 pivot 处左和==右和，即 4 种分割方案</text>
</svg>
