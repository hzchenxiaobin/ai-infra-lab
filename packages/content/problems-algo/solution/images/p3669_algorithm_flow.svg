<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：约数表 → 非递减 DFS + 三重剪枝 → 取最优</text>

  <!-- 开始 -->
  <ellipse cx="150" cy="48" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="53" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 150 63 L 150 70" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 约数表 -->
  <rect x="52" y="74" width="196" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 求约数表 divs</text>
  <text x="150" y="103" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d 试除到 √n，成对收集后排序</text>
  <path d="M 150 108 L 150 116" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② dfs -->
  <rect x="52" y="118" width="196" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② dfs(start, picked, prod)</text>
  <path d="M 150 144 L 150 152" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ picked == k ? -->
  <polygon points="150,152 228,176 150,200 72,176" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">picked == k ?</text>

  <path d="M 150 200 L 150 208" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="209" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- ④ for -->
  <rect x="52" y="212" width="196" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ for d ∈ divs[start..]（升序）</text>
  <text x="150" y="241" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i 从 start 起 → 非递减，可重复选</text>
  <path d="M 150 246 L 150 254" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 两类 break 剪枝 -->
  <polygon points="150,254 250,280 150,306 50,280" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="276" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">prod·d &gt; n 或</text>
  <text x="150" y="290" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">prod·d^remain &gt; n ?</text>

  <path d="M 250 280 L 296 280" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="272" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="300" y="264" width="150" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="278" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">break：更大的 d 只会更糟</text>
  <text x="375" y="291" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">整段剪掉，回溯上一层</text>

  <path d="M 150 306 L 150 314" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="315" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- ⑥ 整除 continue -->
  <polygon points="150,314 232,340 150,366 68,340" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="344" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">n % (prod·d) ≠ 0 ?</text>

  <path d="M 232 340 L 296 340" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="244" y="332" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="300" y="324" width="150" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="338" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">continue：此 d 不整除</text>
  <text x="375" y="351" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过，试下一个 d</text>

  <path d="M 150 366 L 150 374" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="375" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- ⑦ 递归 -->
  <rect x="52" y="378" width="196" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="392" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⑦ 选 d：path.push(d)</text>
  <text x="150" y="406" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">dfs(i, picked+1, prod·d)</text>
  <text x="150" y="418" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">递归返回后 path.pop() 回溯</text>

  <!-- 循环回边 -->
  <path d="M 52 399 C 24 399, 24 229, 48 229" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="320" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 32 320)" filter="url(#rough2)">d++ 继续循环</text>

  <!-- ③ 是 → 叶子判定 -->
  <path d="M 228 176 L 283 176" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <polygon points="355,150 423,176 355,202 287,176" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">prod == n ?</text>

  <path d="M 355 202 L 355 210" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="211" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="325" y="212" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="355" y="228" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">直接 return</text>

  <path d="M 423 176 C 452 176, 440 194, 433 206" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="447" y="190" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="385" y="210" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="431" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">更新 best</text>
  <text x="431" y="235" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">(max−min 更小)</text>

  <!-- 顶层返回 → 输出 -->
  <path d="M 248 131 C 460 133, 486 156, 486 194 L 486 366 C 486 394, 472 412, 468 412" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="508" y="290" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 508 290)" filter="url(#rough2)">顶层 dfs 返回</text>
  <rect x="352" y="398" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="407" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">输出 best</text>
</svg>
