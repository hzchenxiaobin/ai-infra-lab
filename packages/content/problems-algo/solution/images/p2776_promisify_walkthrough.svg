<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">两个示例演算</text>

  <!-- 示例 1 -->
  <rect x="20" y="50" width="250" height="350" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="75" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1：resolve</text>

  <text x="30" y="100" font-size="11" fill="#555" filter="url(#rough2)">fn = (cb,a,b,c) =&gt;</text>
  <text x="40" y="117" font-size="11" fill="#555" filter="url(#rough2)">  cb(a*b*c)</text>
  <text x="30" y="138" font-size="11" fill="#555" filter="url(#rough2)">args = [1, 2, 3]</text>

  <rect x="40" y="152" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1×2×3=6</text>

  <line x1="120" y1="169" x2="150" y2="169" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="152" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">callback(6)</text>

  <text x="145" y="208" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">仅 1 个参数</text>

  <line x1="145" y1="215" x2="145" y2="238" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="232" font-size="11" fill="#4a7a3a" filter="url(#rough2)">error 无</text>

  <rect x="55" y="245" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">resolve(6)</text>

  <text x="145" y="320" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">Promise → 6</text>
  <text x="145" y="345" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">单参即成功</text>
  <text x="145" y="362" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">value=6 被采纳</text>
  <text x="145" y="385" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 成功</text>

  <!-- 示例 2 -->
  <rect x="290" y="50" width="250" height="350" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="75" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 2：reject</text>

  <text x="300" y="100" font-size="11" fill="#555" filter="url(#rough2)">fn = (cb,a,b,c) =&gt;</text>
  <text x="310" y="117" font-size="11" fill="#555" filter="url(#rough2)">  cb(a*b*c, "Err")</text>
  <text x="300" y="138" font-size="11" fill="#555" filter="url(#rough2)">args = [4, 5, 6]</text>

  <rect x="310" y="152" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="350" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4×5×6=120</text>

  <line x1="390" y1="169" x2="418" y2="169" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="420" y="152" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="475" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cb(120, "Err")</text>

  <text x="415" y="208" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2 个参数，error 真值</text>

  <line x1="415" y1="215" x2="415" y2="238" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="232" font-size="11" fill="#b85450" filter="url(#rough2)">error="Err"</text>

  <rect x="325" y="245" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="272" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">reject("Err")</text>

  <text x="415" y="320" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">Promise → reject</text>
  <text x="415" y="345" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">双参第二参=错误</text>
  <text x="415" y="362" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">value=120 被丢弃</text>
  <text x="415" y="385" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 失败</text>
</svg>
