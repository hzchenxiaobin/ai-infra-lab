<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">执行流程：分组聚合 + HAVING 过滤</text>

  <!-- Step 1: FROM -->
  <rect x="120" y="52" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① FROM Views</text>
  <rect x="430" y="56" width="70" height="28" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="14" filter="url(#rough2)"/>
  <text x="465" y="74" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">8 行</text>
  <path d="M 270 88 L 270 100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY -->
  <rect x="80" y="102" width="380" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② GROUP BY viewer_id, view_date</text>
  <rect x="430" y="106" width="70" height="28" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="14" filter="url(#rough2)"/>
  <text x="465" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5 组</text>
  <path d="M 270 138 L 270 150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: HAVING -->
  <rect x="60" y="152" width="420" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">③ HAVING COUNT(DISTINCT article_id) &gt; 1</text>
  <rect x="430" y="156" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="14" filter="url(#rough2)"/>
  <text x="465" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留 2 组</text>
  <path d="M 270 188 L 270 200" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: SELECT DISTINCT -->
  <rect x="80" y="202" width="380" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ SELECT DISTINCT viewer_id AS id</text>
  <rect x="430" y="206" width="70" height="28" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="14" filter="url(#rough2)"/>
  <text x="465" y="224" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{5, 6}</text>
  <path d="M 270 238 L 270 250" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: ORDER BY -->
  <rect x="120" y="252" width="300" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⑤ ORDER BY id（升序）</text>
  <rect x="430" y="256" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="14" filter="url(#rough2)"/>
  <text x="465" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">[5, 6]</text>

  <!-- left side: clause order note -->
  <rect x="40" y="312" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="328" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">SQL 子句执行顺序：FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</text>
  <text x="290" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">本题无 WHERE；HAVING 在 GROUP BY 之后、SELECT 之前过滤分组</text>

  <!-- bottom insight -->
  <rect x="40" y="360" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">⚠ HAVING 与 WHERE 的区别：WHERE 过滤行（分组前），HAVING 过滤组（分组后）</text>
  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">"不同文章数 &gt; 1" 依赖聚合 COUNT，必须用 HAVING 而非 WHERE</text>
  <text x="290" y="406" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">外层 DISTINCT 防止同一 viewer 多日入选产生重复 id</text>
</svg>
