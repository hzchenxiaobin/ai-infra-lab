<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="640" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 逐元素维护小顶堆 → 算候选 → 更新答案</text>

  <!-- Step 1: sort -->
  <rect x="160" y="50" width="240" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#333">① 按 nums2 降序打包 (nums1[i], nums2[i])</text>
  <path d="M 280 100 L 280 122" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="160" y="128" width="240" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="12" fill="#333">② 初始化：heap=空, sum=0, ans=0</text>
  <path d="M 280 178 L 280 200" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: loop header -->
  <path d="M 280 250 L 360 225 L 280 200 L 200 225 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#333">还有元素?</text>
  <text x="280" y="244" text-anchor="middle" font-size="9" fill="#888">取 (a1,a2)</text>
  <!-- no branch -->
  <path d="M 380 225 L 470 225" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="425" y="218" text-anchor="middle" font-size="10" fill="#888">否 → 结束</text>
  <rect x="430" y="210" width="80" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="230" text-anchor="middle" font-size="11" fill="#333">return ans</text>

  <!-- yes branch down -->
  <path d="M 280 252 L 280 274" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="294" y="268" font-size="10" fill="#888">是</text>

  <!-- Step 4: check heap size -->
  <path d="M 280 322 L 380 297 L 280 272 L 180 297 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#333">heap.size==k−1?</text>
  <text x="280" y="316" text-anchor="middle" font-size="9" fill="#888">凑齐 k−1 个</text>

  <!-- yes -> candidate -->
  <path d="M 380 297 L 440 297" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="410" y="290" text-anchor="middle" font-size="9" fill="#888">是</text>
  <rect x="420" y="278" width="120" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="295" text-anchor="middle" font-size="10" fill="#333">候选 = (sum+a1)*a2</text>
  <text x="480" y="310" text-anchor="middle" font-size="10" fill="#333">ans = max(ans, 候选)</text>

  <!-- no / continue down -->
  <path d="M 280 324 L 280 346" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="294" y="340" font-size="9" fill="#888">否/继续</text>

  <!-- Step 5: push -->
  <rect x="160" y="352" width="240" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#333">③ heap.push(a1); sum += a1</text>
  <path d="M 280 396 L 280 418" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 6: check overflow -->
  <path d="M 280 466 L 380 441 L 280 416 L 180 441 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#333">heap.size &gt; k−1?</text>
  <text x="280" y="460" text-anchor="middle" font-size="9" fill="#888">超容</text>

  <!-- yes -> pop -->
  <path d="M 380 441 L 440 441" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="410" y="434" text-anchor="middle" font-size="9" fill="#888">是</text>
  <rect x="430" y="424" width="110" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485" y="448" text-anchor="middle" font-size="10" fill="#333">sum −= heap.pop()</text>
  <!-- loop back arrow from pop up to loop header (left side) -->
  <path d="M 485 424 L 485 130 L 400 130" stroke="#888" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="498" y="280" font-size="9" fill="#888" transform="rotate(0 498 280)">下个元素</text>

  <!-- no -> loop back (left) -->
  <path d="M 180 441 L 100 441 L 100 225 L 200 225" stroke="#888" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="92" y="340" font-size="9" fill="#888" transform="rotate(-90 92 340)">否，下个元素</text>

  <!-- note -->
  <rect x="30" y="510" width="500" height="110" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="536" font-size="12" fill="#444" font-weight="bold">关键顺序：先算候选，再入堆</text>
  <text x="50" y="558" font-size="11" fill="#555">候选用"入堆前"的堆：前缀中最大的 k−1 个 nums1，加当前 a1 凑 k 个</text>
  <text x="50" y="578" font-size="11" fill="#555">若先入堆再算，当前 a1 会挤掉别人，钦定"当前 i 作 min"的关系会错乱</text>
  <text x="50" y="600" font-size="10" fill="#888">k=1 时 k−1=0，堆恒空，退化为逐个求 max(nums1[i]*nums2[i])</text>
</svg>
