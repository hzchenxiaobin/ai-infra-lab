<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=2, m=3, k=1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">逐层填充 dp[i][j][c]，仅列非零状态；最终 Σ dp[2][j][1] = 6</text>

  <!-- column headers -->
  <text x="90" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i = 0</text>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i = 1</text>
  <text x="470" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i = 2</text>

  <!-- i=0 layer -->
  <rect x="36" y="86" width="108" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="110" text-anchor="middle" font-size="11" fill="#333">dp[0][0][0] = 1</text>

  <!-- i=0 -> i=1 arrows: source (j=0,c=0) splits to 3 -->
  <path d="M 144 106 L 226 106" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <path d="M 144 106 L 226 146" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <path d="M 144 106 L 226 186" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="185" y="100" text-anchor="middle" font-size="9" fill="#b85450">v=1,2,3 &gt; 0</text>
  <text x="185" y="100" text-anchor="middle" font-size="9" fill="#b85450"></text>
  <text x="185" y="120" text-anchor="middle" font-size="9" fill="#b85450">刷新 c+1</text>

  <!-- i=1 layer: 3 states -->
  <rect x="226" y="86" width="108" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#333">dp[1][1][1] = 1</text>
  <rect x="226" y="126" width="108" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#333">dp[1][2][1] = 1</text>
  <rect x="226" y="166" width="108" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#333">dp[1][3][1] = 1</text>

  <!-- i=1 -> i=2 arrows -->
  <!-- from j=1 (y=106) -> dp[2][1][1] (y=106): v=1 keep -->
  <path d="M 334 106 L 416 106" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="375" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a">v=1 ≤1 保持</text>
  <!-- from j=2 (y=146) -> dp[2][2][1] (y=146): v=1,2 keep -->
  <path d="M 334 146 L 416 146" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="375" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a">v=1,2 ≤2 保持</text>
  <!-- from j=3 (y=186) -> dp[2][3][1] (y=186): v=1,2,3 keep -->
  <path d="M 334 186 L 416 186" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="375" y="180" text-anchor="middle" font-size="9" fill="#4a7a3a">v=1,2,3 ≤3 保持</text>

  <!-- i=2 layer: 3 states -->
  <rect x="416" y="86" width="118" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="110" text-anchor="middle" font-size="11" fill="#333">dp[2][1][1] = 1</text>
  <rect x="416" y="126" width="118" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="150" text-anchor="middle" font-size="11" fill="#333">dp[2][2][1] = 2</text>
  <rect x="416" y="166" width="118" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="190" text-anchor="middle" font-size="11" fill="#333">dp[2][3][1] = 3</text>

  <!-- note: refresh drops -->
  <rect x="36" y="226" width="498" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="246" font-size="11" fill="#d6a040" font-weight="bold">丢弃的刷新分支</text>
  <text x="56" y="263" font-size="10" fill="#555">k=1，凡 c+1=2 &gt; k 的刷新分支一律丢弃：j=1 时 v=2,3；j=2 时 v=3；j=3 无刷新。</text>

  <!-- answer -->
  <path d="M 475 208 L 475 284" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="150" y="288" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="300" y="313" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 1 + 2 + 3 = 6 ✓</text>

  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#888">首元素 v 越大，其后「保持不刷新」的取值越多（恰 v 个 ≤ v），方案数随 v 线性累加</text>
</svg>
