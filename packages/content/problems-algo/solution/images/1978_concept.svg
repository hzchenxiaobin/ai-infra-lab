<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：自引用反连接 — manager_id 指向已不存在的员工</text>

  <!-- ===== Employees table ===== -->
  <text x="50" y="54" font-size="10" fill="#446688" font-weight="bold">Employees（自引用表）</text>
  <rect x="40" y="60" width="220" height="180" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="76" font-size="9" fill="#446688" font-weight="bold">emp_id  name      mgr_id  salary</text>
  <line x1="40" y1="82" x2="260" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="98" font-size="9" fill="#333">3       Mila      9       60301</text>
  <text x="52" y="114" font-size="9" fill="#888">12      Antonella null    31000</text>
  <text x="52" y="130" font-size="9" fill="#888">13      Emery     null    67084</text>
  <rect x="42" y="134" width="216" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="52" y="146" font-size="9" fill="#d6a040" font-weight="bold">1       Kalel     11      21241</text>
  <text x="52" y="162" font-size="9" fill="#888">9       Mikaela   null    50937</text>
  <rect x="42" y="166" width="216" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.6"/>
  <text x="52" y="178" font-size="9" fill="#b85450" font-weight="bold">11      Joziah    6       28485</text>
  <text x="52" y="200" font-size="8" fill="#888">emp_id 集合 = {1, 3, 9, 11, 12, 13}</text>
  <text x="52" y="214" font-size="8" fill="#888">mgr_id 出现的值: {9, 11, 6, null}</text>
  <text x="52" y="230" font-size="8" fill="#b85450" font-weight="bold">6 ∉ emp_id 集合 → 经理已离职</text>

  <!-- ===== Self-reference arrows (manager_id → employee_id) ===== -->
  <!-- Arrow from emp 1 (mgr=11) to emp 11 -->
  <path d="M 260 146 C 290 146, 290 178, 260 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.7"/>
  <text x="292" y="160" font-size="8" fill="#4a7a3a">mgr=11 ✓</text>
  <text x="292" y="172" font-size="7" fill="#4a7a3a">仍在表中</text>

  <!-- Arrow from emp 11 (mgr=6) to nowhere (dashed, red) -->
  <path d="M 260 178 C 300 178, 330 178, 360 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="300" y="194" font-size="8" fill="#b85450" font-weight="bold">mgr=6 → 空！</text>
  <text x="300" y="206" font-size="7" fill="#b85450">经理已离职</text>

  <!-- ===== Right side: anti-join concept ===== -->
  <rect x="370" y="60" width="180" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">反连接（Anti-Join）</text>
  <line x1="380" y1="86" x2="540" y2="86" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="102" font-size="9" fill="#333">mgr_id NOT IN</text>
  <text x="380" y="116" font-size="9" fill="#333">  (SELECT emp_id</text>
  <text x="380" y="130" font-size="9" fill="#333">   FROM Employees)</text>
  <text x="380" y="148" font-size="8" fill="#446688">= 经理不在员工表里</text>

  <!-- Two conditions box -->
  <rect x="370" y="172" width="180" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="192" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">两个条件 AND</text>
  <text x="380" y="208" font-size="9" fill="#333">① salary &lt; 30000</text>
  <text x="380" y="222" font-size="9" fill="#b85450" font-weight="bold">② mgr_id ∉ emp_id 集合</text>
  <text x="380" y="234" font-size="7" fill="#888">（mgr_id 非 null 时才判定）</text>

  <!-- ===== Arrow to result ===== -->
  <path d="M 460 244 L 460 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="400" y="274" width="120" height="50" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="290" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">employee_id</text>
  <line x1="400" y1="296" x2="520" y2="296" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="460" y="314" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">11</text>

  <!-- ===== Bottom: NULL handling note ===== -->
  <rect x="40" y="274" width="310" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="10" fill="#b85450" font-weight="bold">NULL 经理的妙处</text>
  <text x="50" y="310" font-size="9" fill="#333">mgr_id = null 的员工（无上级）：</text>
  <text x="50" y="324" font-size="9" fill="#333">null NOT IN (...) → UNKNOWN → 自动排除</text>
  <text x="50" y="336" font-size="8" fill="#888">无需显式写 manager_id IS NOT NULL</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="360" width="530" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">同表自引用：manager_id 指向 employee_id，不在集合内 = 经理已离职</text>
  <text x="290" y="394" text-anchor="middle" font-size="9" fill="#888">salary &lt; 30000 AND manager_id NOT IN (SELECT employee_id FROM Employees)</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="412" width="530" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="42" y="430" font-size="9" fill="#d6a040">橙：salary &lt; 30000 候选</text>
  <text x="200" y="430" font-size="9" fill="#4a7a3a">绿箭：mgr 仍在表（保留）</text>
  <text x="360" y="430" font-size="9" fill="#b85450">红：mgr 已离职（输出）</text>
  <text x="42" y="444" font-size="8" fill="#888">反连接 = 「在 A 但不在 B」— 本题 A=mgr_id 集合，B=emp_id 集合</text>
</svg>
