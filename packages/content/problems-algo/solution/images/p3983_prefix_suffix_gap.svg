<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：前缀贪心最早结束 × 后缀贪心最晚开始，中间给新字符留空位</text>

  <!-- ① s 与万能牌 -->
  <g filter="url(#rough2)">
    <rect x="20" y="38" width="520" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="35" y="57" font-size="11.5" fill="#33506b" font-weight="bold">① 把 s[i] 换成万能牌 ？（例：s = "axf"，t = "abcdef"，替换 i = 1）</text>

    <text x="142" y="90" text-anchor="end" font-size="12" fill="#33506b">s =</text>

    <rect x="150" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="172" y="89" text-anchor="middle" font-size="14" fill="#333">a</text>

    <rect x="202" y="68" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="224" y="89" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold">?</text>

    <rect x="254" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="276" y="89" text-anchor="middle" font-size="14" fill="#333">f</text>

    <text x="172" y="114" text-anchor="middle" font-size="9.5" fill="#888">s[0]</text>
    <text x="224" y="114" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">s[1] 替换位</text>
    <text x="276" y="114" text-anchor="middle" font-size="9.5" fill="#888">s[2]</text>

    <text x="330" y="80" font-size="10.5" fill="#33506b">新字符 26 个字母任取</text>
    <text x="330" y="98" font-size="10.5" fill="#33506b">⇒ ？是万能牌：不挑字符，只挑空位</text>
    <text x="330" y="116" font-size="10.5" fill="#33506b">判定只剩：t 里能否留出一个空位</text>
  </g>

  <!-- 万能牌下落箭头 -->
  <path d="M 224 126 C 224 146, 232 152, 232 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="152" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">任选一个空位</text>

  <!-- ② t 上的对位 -->
  <g filter="url(#rough2)">
    <rect x="20" y="132" width="520" height="152" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="35" y="150" font-size="11.5" fill="#444" font-weight="bold">② t 上的对位：前缀吃左端 · 后缀吃右端 · 中间是空位区间</text>

    <text x="121" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">pre[1] = 1</text>
    <line x1="121" y1="171" x2="121" y2="230" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3"/>

    <text x="325" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">suf[2] = 5</text>
    <line x1="325" y1="171" x2="325" y2="230" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3"/>

    <text x="58" y="197" text-anchor="end" font-size="12" fill="#555">t =</text>

    <rect x="70" y="176" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="93" y="199" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">a</text>

    <rect x="121" y="176" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="144" y="199" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold">b</text>

    <rect x="172" y="176" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="195" y="199" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold">c</text>

    <rect x="223" y="176" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="246" y="199" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold">d</text>

    <rect x="274" y="176" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="297" y="199" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold">e</text>

    <rect x="325" y="176" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="348" y="199" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold">f</text>

    <text x="400" y="184" font-size="10" fill="#555">前缀 "a" 从左贪心</text>
    <text x="400" y="200" font-size="10" fill="#555">后缀 "f" 从右贪心</text>
    <text x="400" y="216" font-size="10" fill="#555">换好得 "abf" ⊆ t ✓</text>

    <path d="M 72 222 L 114 222" stroke="#446688" stroke-width="1.8" fill="none"/>
    <text x="60" y="242" text-anchor="end" font-size="9.5" fill="#446688" font-weight="bold">前缀占</text>

    <path d="M 123 222 L 318 222" stroke="#d6a040" stroke-width="1.8" fill="none"/>
    <text x="220" y="242" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">空位区间 [pre[i], suf[i+1] − 1] = [1, 4]，万能牌放这里</text>

    <path d="M 327 222 L 369 222" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="381" y="242" text-anchor="start" font-size="9.5" fill="#4a7a3a" font-weight="bold">后缀占</text>

    <text x="280" y="270" text-anchor="middle" font-size="10" fill="#666">两端各自贪心：前缀「最早结束」不挡后缀的路，后缀「最晚开始」不抢前缀的地盘</text>
  </g>

  <!-- ③ 判定条件 -->
  <g filter="url(#rough2)">
    <rect x="20" y="296" width="520" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="318" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">③ 判定：pre[i] &lt; suf[i+1]（严格小于 ⇔ 中间至少剩 1 个空位）</text>
    <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#2f5d24">锚点各自取极值、方向相反、互不挤占——交换论证保证不漏解（见面试 Q1）</text>
  </g>

  <!-- ⚠️ 单指针贪心反例 -->
  <g filter="url(#rough2)">
    <rect x="20" y="366" width="520" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="386" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">⚠️ 单指针贪心会翻车：s = "cb"，t = "abc"——'c' 先咬死 t[2]，万能牌没处放，误判 false</text>
    <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#8a3030">而把 s[0] 的 'c' 换成 'a' 得 "ab" ✓。替换位是全局决策 ⇒ 必须前后缀分解</text>
  </g>
</svg>
