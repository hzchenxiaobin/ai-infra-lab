<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">反向网格 DP 算法流程</text>

  <!-- Step 1: init -->
  <rect x="110" y="44" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 建 (m+1)×(n+1) dp 表，填 ∞</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#888">置哨兵 dp[m−1][n] = dp[m][n−1] = 1</text>

  <path d="M 260 92 L 260 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop header (diamond) -->
  <polygon points="260,112 370,152 260,192 150,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i 从 m−1 到 0 ？</text>
  <text x="260" y="166" text-anchor="middle" font-size="10" fill="#888">倒序遍历每一行</text>

  <!-- Yes branch down -->
  <path d="M 260 192 L 260 210" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="204" font-size="10" fill="#4a7a3a">是</text>

  <!-- Step 3: inner loop -->
  <rect x="90" y="214" width="340" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for j = n−1 .. 0（倒序）：</text>
  <text x="260" y="254" text-anchor="middle" font-size="11" fill="#444">dp[i][j] = max(1, min(dp[i+1][j], dp[i][j+1]) − dungeon[i][j])</text>

  <!-- loop back arrow to diamond -->
  <path d="M 430 242 L 460 242 L 460 152 L 372 152" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="200" font-size="10" fill="#888">j−− / i−−</text>

  <!-- No branch left -->
  <path d="M 150 152 L 80 152 L 80 296" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="146" font-size="10" fill="#b85450">否</text>

  <!-- Step 4: return -->
  <rect x="30" y="294" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 返回 dp[0][0]</text>
  <text x="120" y="330" text-anchor="middle" font-size="10" fill="#888">即最小初始 HP</text>

  <!-- Note box -->
  <rect x="270" y="294" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="312" text-anchor="middle" font-size="11" fill="#444">哨兵让公主格无需特判：</text>
  <text x="380" y="328" text-anchor="middle" font-size="10" fill="#888">dp[m−1][n−1]=max(1, 1−d[m−1][n−1])</text>
</svg>
