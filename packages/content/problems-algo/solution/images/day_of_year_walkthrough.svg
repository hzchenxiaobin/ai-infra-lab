<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三组日期验证闰年修正逻辑</text>

  <!-- ===== Strip 1: 2019-02-10 → 41 ===== -->
  <rect x="20" y="50" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="85" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"2019-02-10"</text>

  <path d="M 150 70 L 166 70" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="50" width="250" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="293" y="67" text-anchor="middle" font-size="10.5" fill="#555">2019%4=3≠0 → 平年</text>
  <text x="293" y="82" text-anchor="middle" font-size="10.5" fill="#555">prefix[1]=31 → 31 + 10 + 0</text>

  <path d="M 418 70 L 434 70" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="436" y="50" width="124" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="498" y="75" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">= 41</text>

  <!-- ===== Strip 2: 2000-03-01 → 61 ===== -->
  <rect x="20" y="110" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="85" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"2000-03-01"</text>

  <path d="M 150 130 L 166 130" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="110" width="250" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="293" y="127" text-anchor="middle" font-size="10.5" fill="#555">2000%400=0 → 闰年 ✓</text>
  <text x="293" y="142" text-anchor="middle" font-size="10.5" fill="#555">prefix[2]=59 → 59 + 1 + 1</text>

  <path d="M 418 130 L 434 130" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="436" y="110" width="124" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="498" y="135" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">= 61</text>

  <!-- ===== Strip 3: 1900-03-01 → 60 (trap) ===== -->
  <rect x="20" y="170" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="85" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"1900-03-01"</text>

  <path d="M 150 190 L 166 190" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="170" width="250" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="293" y="187" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1900%100=0, %400≠0 → 平年 ⚠️ 陷阱</text>
  <text x="293" y="202" text-anchor="middle" font-size="10.5" fill="#555">prefix[2]=59 → 59 + 1 + 0</text>

  <path d="M 418 190 L 434 190" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="436" y="170" width="124" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="498" y="195" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">= 60</text>

  <!-- ===== Summary note ===== -->
  <rect x="40" y="232" width="500" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">关键对比：2000 vs 1900 —— 同为 3 月 1 日，结果差 1</text>
  <text x="290" y="274" text-anchor="middle" font-size="10.5" fill="#555">2000 ÷400=0 → 闰年 → 二月 29 → prefix[2]=59+1=60 → 60+1=61</text>
  <text x="290" y="292" text-anchor="middle" font-size="10.5" fill="#555">1900 ÷100=0, ÷400≠0 → 平年 → 二月 28 → prefix[2]=59 → 59+1=60</text>
  <text x="290" y="312" text-anchor="middle" font-size="10.5" fill="#b85450">⚠️ 只看 ÷4 会把 1900 误判为闰年 → 多算 1 天</text>
</svg>
