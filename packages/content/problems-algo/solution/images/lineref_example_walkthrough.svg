<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：points = [[1,1],[−1,1],[−2,2],[2,2]]</text>

  <!-- Coordinate plane -->
  <line x1="80" y1="180" x2="480" y2="180" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="280" y1="240" x2="280" y2="60" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="485" y="184" font-size="10" fill="#888">x</text>
  <text x="276" y="56" font-size="10" fill="#888">y</text>

  <!-- x-axis labels -->
  <text x="158" y="196" font-size="9" fill="#888">−2</text>
  <text x="218" y="196" font-size="9" fill="#888">−1</text>
  <text x="335" y="196" font-size="9" fill="#888">1</text>
  <text x="395" y="196" font-size="9" fill="#888">2</text>

  <!-- Symmetry axis x=0 -->
  <line x1="280" y1="230" x2="280" y2="70" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="288" y="72" font-size="10" fill="#b85450" font-weight="bold">x = 0</text>

  <!-- Points -->
  <circle cx="160" cy="100" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="120" y="96" font-size="10" fill="#446688" font-weight="bold">(−2, 2)</text>

  <circle cx="220" cy="140" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="180" y="136" font-size="10" fill="#4a7a3a" font-weight="bold">(−1, 1)</text>

  <circle cx="340" cy="140" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="348" y="136" font-size="10" fill="#4a7a3a" font-weight="bold">(1, 1)</text>

  <circle cx="400" cy="100" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="408" y="96" font-size="10" fill="#446688" font-weight="bold">(2, 2)</text>

  <!-- Mirror arrows -->
  <path d="M 170 100 Q 280 70 390 100" stroke="#446688" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 140 Q 280 165 330 140" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: axis -->
  <rect x="40" y="252" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="270" font-size="10" fill="#4a7a3a" font-weight="bold">min_x = −2,  max_x = 2</text>
  <text x="54" y="284" font-family="monospace" font-size="10" fill="#555">sum = 0  →  对称轴 x = 0</text>

  <!-- Step 2: verify -->
  <rect x="300" y="252" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="314" y="268" font-size="10" fill="#d6a040" font-weight="bold">镜像验证 4/4 命中</text>
  <text x="314" y="282" font-family="monospace" font-size="8" fill="#555">(1,1)→(−1,1)✓  (−2,2)→(2,2)✓</text>

  <!-- Result -->
  <rect x="40" y="302" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="320" font-size="11" fill="#333" font-weight="bold">所有点镜像均在集合中 → return true</text>
  <text x="60" y="336" font-size="9" fill="#888">对称轴 x = 0 由 min_x + max_x = 0 唯一确定，验证 O(n)</text>

  <!-- Complexity note -->
  <rect x="40" y="352" width="500" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#888">对称轴 O(1) 确定 + 4 次哈希查找 O(1) × 4 = O(n) 总复杂度</text>
</svg>
