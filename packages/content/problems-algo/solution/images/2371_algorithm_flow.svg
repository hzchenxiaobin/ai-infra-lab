<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：扁平化 → 按值升序 → 维护行/列最大值 → 每格取 max+1 并回写</text>

  <!-- ===== Top horizontal flow ===== -->
  <g filter="url(#rough2)">
    <!-- ① -->
    <rect x="24" y="54" width="104" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="76" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 扁平化</text>
    <text x="76" y="90" text-anchor="middle" font-size="10" fill="#555">(值, i, j) 列表</text>
    <!-- ② -->
    <rect x="142" y="54" width="104" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="194" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② 按值升序</text>
    <text x="194" y="90" text-anchor="middle" font-size="10" fill="#555">＝合法拓扑序</text>
    <!-- ③ -->
    <rect x="260" y="54" width="104" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="312" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 初始化</text>
    <text x="312" y="90" text-anchor="middle" font-size="10" fill="#555">rowMax/colMax=0</text>
    <!-- ④ highlighted -->
    <rect x="378" y="52" width="104" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8"/>
    <text x="430" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">④ 逐格处理</text>
    <text x="430" y="90" text-anchor="middle" font-size="10" fill="#a07a20">（循环体 ↓）</text>
    <!-- ⑤ -->
    <rect x="496" y="54" width="104" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
    <text x="548" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ 返回 ans</text>
    <text x="548" y="90" text-anchor="middle" font-size="10" fill="#555">最大值最小</text>
    <!-- arrows -->
    <path d="M 128 77 L 142 77" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 246 77 L 260 77" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 364 77 L 378 77" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 482 77 L 496 77" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- connect ④ down to detail -->
  <path d="M 430 102 L 430 128" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Detail panel : loop body ===== -->
  <rect x="40" y="128" width="540" height="252" fill="#fffef8" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310" y="150" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">循环体：处理每个格子 (i, j)（原始值 v，已升序到达）</text>
  <text x="310" y="166" text-anchor="middle" font-size="10" fill="#888">示例取 (0,0)=3：行 0 与列 0 此前各处理过一格，ans 都是 1</text>

  <!-- read rowMax[i] -->
  <g filter="url(#rough2)">
    <rect x="110" y="186" width="140" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="180" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">读 rowMax[i]</text>
    <text x="180" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">= 1</text>
  </g>
  <text x="180" y="252" text-anchor="middle" font-size="10" fill="#666">本行已处理格的最大 ans</text>

  <!-- read colMax[j] -->
  <g filter="url(#rough2)">
    <rect x="370" y="186" width="140" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="440" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">读 colMax[j]</text>
    <text x="440" y="224" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">= 1</text>
  </g>
  <text x="440" y="252" text-anchor="middle" font-size="10" fill="#666">本列已处理格的最大 ans</text>

  <!-- arrows from reads down to compute -->
  <path d="M 180 236 L 180 276 L 250 276" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 236 L 440 276 L 370 276" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute box -->
  <g filter="url(#rough2)">
    <rect x="170" y="288" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="310" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans[i][j] = max(rowMax[i], colMax[j]) + 1</text>
  </g>

  <!-- arrow down to result -->
  <path d="M 310 328 L 310 342" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <g filter="url(#rough2)">
    <rect x="250" y="344" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="310" y="364" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans[i][j] = 2</text>
  </g>

  <!-- write-back dashed arrows -->
  <path d="M 250 359 L 90 359 L 90 236" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="96" y="300" font-size="10" fill="#b85450" font-weight="bold">回写</text>
  <path d="M 370 359 L 530 359 L 530 236" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="524" y="300" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">回写</text>

  <!-- side note -->
  <text x="310" y="392" text-anchor="middle" font-size="10" fill="#888">⚠ 先读旧值 → 取 max → +1 → 再回写；行、列两边都要刷新</text>
</svg>
