<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：索引映射 ans[j] = nums[j % n]</text>

  <!-- Example 1 -->
  <text x="60" y="56" font-size="12" fill="#555" font-weight="bold">示例 1：nums = [1,2,1]（n=3）</text>

  <text x="60" y="82" font-size="11" fill="#888">nums：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="110" y="68" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="128" y="87">1</text>
    <rect x="150" y="68" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="87">2</text>
    <rect x="190" y="68" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="208" y="87">1</text>
  </g>

  <text x="60" y="132" font-size="11" fill="#888">ans：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="110" y="118" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="128" y="137">1</text>
    <rect x="150" y="118" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="137">2</text>
    <rect x="190" y="118" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="208" y="137">1</text>
    <rect x="230" y="118" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="248" y="137">1</text>
    <rect x="270" y="118" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="288" y="137">2</text>
    <rect x="310" y="118" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="328" y="137">1</text>
  </g>
  <g font-size="9" fill="#888" text-anchor="middle">
    <text x="128" y="158">j=0</text>
    <text x="168" y="158">1</text>
    <text x="208" y="158">2</text>
    <text x="248" y="158">3</text>
    <text x="288" y="158">4</text>
    <text x="328" y="158">5</text>
  </g>
  <g font-size="9" fill="#b85450" text-anchor="middle">
    <text x="128" y="172">0%3=0</text>
    <text x="168" y="172">1%3=1</text>
    <text x="208" y="172">2%3=2</text>
    <text x="248" y="172">3%3=0</text>
    <text x="288" y="172">4%3=1</text>
    <text x="328" y="172">5%3=2</text>
  </g>

  <rect x="380" y="118" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="138" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">ans = [1,2,1,1,2,1] ✓</text>

  <!-- Divider -->
  <path d="M 40 192 L 520 192" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <text x="60" y="216" font-size="12" fill="#555" font-weight="bold">示例 2：nums = [1,3,2,1]（n=4）</text>

  <text x="60" y="240" font-size="11" fill="#888">nums：</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="110" y="226" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="128" y="245">1</text>
    <rect x="150" y="226" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="245">3</text>
    <rect x="190" y="226" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="208" y="245">2</text>
    <rect x="230" y="226" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="248" y="245">1</text>
  </g>

  <text x="60" y="282" font-size="11" fill="#888">ans：</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="110" y="268" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="126" y="285">1</text>
    <rect x="146" y="268" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="162" y="285">3</text>
    <rect x="182" y="268" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="198" y="285">2</text>
    <rect x="218" y="268" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="234" y="285">1</text>
    <rect x="254" y="268" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="270" y="285">1</text>
    <rect x="290" y="268" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="306" y="285">3</text>
    <rect x="326" y="268" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="342" y="285">2</text>
    <rect x="362" y="268" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="378" y="285">1</text>
  </g>
  <g font-size="8.5" fill="#888" text-anchor="middle">
    <text x="126" y="304">0</text>
    <text x="162" y="304">1</text>
    <text x="198" y="304">2</text>
    <text x="234" y="304">3</text>
    <text x="270" y="304">4</text>
    <text x="306" y="304">5</text>
    <text x="342" y="304">6</text>
    <text x="378" y="304">7</text>
  </g>

  <rect x="400" y="268" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[1,3,2,1,1,3,2,1] ✓</text>

  <!-- note -->
  <text x="60" y="328" font-size="11" fill="#555">观察：j % n 在 j = n 处归零，后半段重新对齐 nums[0]，形成两段完全相同的拷贝。</text>
  <text x="60" y="346" font-size="11" fill="#555">该模运算视角是「环形数组」技巧的基础（见第 5 节）。</text>
</svg>
