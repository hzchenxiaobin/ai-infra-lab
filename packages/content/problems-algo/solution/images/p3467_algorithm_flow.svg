<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">计数解法：数出偶数个数 even，直接拼接 0 和 1</text>

  <rect x="200" y="38" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 260 68 L 260 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="92" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" fill="#333">遍历 nums 中每个元素 x</text>

  <path d="M 260 126 L 260 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,148 350,183 260,218 170,183" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x 是偶数？</text>

  <path d="M 350 183 L 388 183" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="392" y="165" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="442" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">even++</text>

  <path d="M 170 183 L 132 183" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="173" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="28" y="165" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="78" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">odd++</text>

  <path d="M 442 163 L 442 112 L 374 112" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="5,4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="408" y="106" font-size="9" fill="#999">取下一个 x</text>

  <path d="M 78 163 L 78 112 L 146 112" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="5,4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="86" y="106" font-size="9" fill="#999">取下一个 x</text>

  <path d="M 260 218 L 260 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="9.5" fill="#888">遍历结束</text>

  <rect x="110" y="244" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">拼接输出：even 个 0 后接 odd 个 1</text>
  <text x="260" y="280" text-anchor="middle" font-size="10" fill="#555">[0, …, 0, 1, …, 1] ← 全程无一次比较</text>

  <rect x="40" y="306" width="440" height="42" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="10" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="10" fill="#555">验证：[4,3,2,1] even=2 → [0,0,1,1] ✓    [1,5,1,4,2] even=2 → [0,0,1,1,1] ✓</text>
  <text x="260" y="339" text-anchor="middle" font-size="10" fill="#555">时间 O(n) · 空间 O(1)（返回值不计）</text>
</svg>
