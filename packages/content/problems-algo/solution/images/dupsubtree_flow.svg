<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：后序 DFS → 序列化 → 哈希计数 → 首次重复即收录</text>

  <!-- 开始 -->
  <rect x="220" y="44" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11" fill="#333">dfs(node) 后序遍历</text>

  <line x1="280" y1="74" x2="280" y2="92" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="280,94 360,124 280,154 200,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#888">空子树</text>

  <!-- 是 → 返回 # -->
  <line x1="360" y1="124" x2="420" y2="124" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="420" y="108" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="121" text-anchor="middle" font-size="10" fill="#333">返回 "#"</text>
  <text x="470" y="133" text-anchor="middle" font-size="9" fill="#888">(空标记)</text>

  <!-- 否 → 递归左右 -->
  <line x1="280" y1="154" x2="280" y2="172" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="166" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="190" y="174" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="187" text-anchor="middle" font-size="11" fill="#333">left = dfs(node.left)</text>
  <text x="280" y="199" text-anchor="middle" font-size="11" fill="#333">right = dfs(node.right)</text>

  <line x1="280" y1="206" x2="280" y2="222" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 序列化 -->
  <rect x="170" y="224" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="243" text-anchor="middle" font-size="11" fill="#333">key = val + "," + left + "," + right</text>

  <line x1="280" y1="254" x2="280" y2="270" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 哈希计数 -->
  <rect x="170" y="272" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="11" fill="#333">count[key] += 1</text>

  <line x1="280" y1="302" x2="280" y2="318" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 count==2 -->
  <polygon points="280,320 380,350 280,380 180,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="11" fill="#333">count[key] == 2?</text>
  <text x="280" y="362" text-anchor="middle" font-size="9" fill="#888">首次重复</text>

  <!-- 是 → 收录 -->
  <line x1="380" y1="350" x2="440" y2="350" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="344" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="334" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="347" text-anchor="middle" font-size="10" fill="#333">ans.append(node)</text>
  <text x="490" y="359" text-anchor="middle" font-size="9" fill="#888">(仅收一次)</text>

  <!-- 否/返回 -->
  <line x1="280" y1="380" x2="280" y2="398" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="392" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="210" y="400" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="280" y="419" text-anchor="middle" font-size="11" fill="#333">返回 key</text>

  <!-- 侧注 -->
  <rect x="40" y="174" width="120" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="194" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">为什么后序？</text>
  <text x="48" y="210" font-size="9" fill="#666">先拿到左右子树</text>
  <text x="48" y="222" font-size="9" fill="#666">的序列，才能拼出</text>
  <text x="48" y="234" font-size="9" fill="#666">当前子树的序列</text>
</svg>
