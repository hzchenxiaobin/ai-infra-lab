<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">示例演算：n=5, meetings=[[3,4,2],[1,2,1],[2,3,1]], firstPerson=1</text>

  <text x="44" y="62" font-size="12" fill="#446688" filter="url(#rough2)">t=0</text>
  <rect x="80" y="48" width="270" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="215" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">专家 0 将秘密分享给专家 1</text>
  <text x="375" y="67" font-size="11" fill="#333" filter="url(#rough2)">knows = {</text>
  <text x="438" y="67" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0, 1</text>
  <text x="468" y="67" font-size="11" fill="#333" filter="url(#rough2)">}</text>

  <line x1="40" y1="88" x2="560" y2="88" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="44" y="118" font-size="12" fill="#446688" filter="url(#rough2)">t=1</text>
  <rect x="80" y="104" width="270" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="215" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">会议 [1,2] [2,3] → union {1,2,3}</text>

  <circle cx="120" cy="160" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="164" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">种子</text>
  <circle cx="170" cy="160" r="14" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="164" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <circle cx="220" cy="160" r="14" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="164" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <line x1="134" y1="160" x2="156" y2="160" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="184" y1="160" x2="206" y2="160" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="164" font-size="10" fill="#d6a040" filter="url(#rough2)">分量内 1 知晓 → 全传播</text>
  <text x="375" y="164" font-size="11" fill="#333" filter="url(#rough2)">knows = {</text>
  <text x="438" y="164" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0,1,2,3</text>
  <text x="488" y="164" font-size="11" fill="#333" filter="url(#rough2)">}</text>
  <text x="100" y="195" font-size="10" fill="#b85450" filter="url(#rough2)">传播后全绿，重置 parent → 下一组</text>

  <line x1="40" y1="210" x2="560" y2="210" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="44" y="238" font-size="12" fill="#446688" filter="url(#rough2)">t=2</text>
  <rect x="80" y="224" width="270" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="215" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">会议 [3,4] → union {3,4}</text>

  <circle cx="140" cy="280" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="284" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="262" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">种子</text>
  <circle cx="200" cy="280" r="14" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <line x1="154" y1="280" x2="186" y2="280" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="284" font-size="10" fill="#d6a040" filter="url(#rough2)">分量内 3 知晓 → 4 习得</text>
  <text x="375" y="284" font-size="11" fill="#333" filter="url(#rough2)">knows = {</text>
  <text x="438" y="284" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0,1,2,3,4</text>
  <text x="498" y="284" font-size="11" fill="#333" filter="url(#rough2)">}</text>

  <line x1="40" y1="310" x2="560" y2="310" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <line x1="300" y1="324" x2="300" y2="350" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="100" y="356" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">所有会议结束，返回 knows=true 的专家</text>
  <text x="300" y="394" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = [0, 1, 2, 3, 4]</text>

  <circle cx="55" y="430" r="0" fill="none"/>
  <circle cx="60" cy="425" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="429" font-size="10" fill="#333" filter="url(#rough2)">知晓秘密</text>
  <circle cx="150" cy="425" r="6" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="162" y="429" font-size="10" fill="#333" filter="url(#rough2)">不知晓</text>
  <text x="230" y="429" font-size="10" fill="#d6a040" filter="url(#rough2)">种子 = 分组前已知秘密的人，触发分量内传播</text>
</svg>
