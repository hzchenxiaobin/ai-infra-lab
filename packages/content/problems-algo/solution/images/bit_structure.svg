<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">树状数组：tree[i] 管辖 [i−lowbit(i)+1, i] 的和</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">nums[1..6] = [1, 3, 5, 7, 9, 11]  (1-indexed)</text>

  <!-- nums cells (1-indexed) -->
  <rect x="90"  y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="146" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="202" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="314" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="370" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="174" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="230" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="286" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <text x="342" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="398" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">11</text>
  <text x="118" y="104" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="174" y="104" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  <text x="230" y="104" text-anchor="middle" font-size="10" fill="#888">i=3</text>
  <text x="286" y="104" text-anchor="middle" font-size="10" fill="#888">i=4</text>
  <text x="342" y="104" text-anchor="middle" font-size="10" fill="#888">i=5</text>
  <text x="398" y="104" text-anchor="middle" font-size="10" fill="#888">i=6</text>

  <!-- tree bars (highlight query path: tree[6], tree[4] orange) -->
  <rect x="90"  y="130" width="56"  height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="90"  y="164" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="202" y="198" width="56"  height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="90"  y="232" width="224" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="314" y="266" width="56"  height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="314" y="300" width="112" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>

  <!-- left labels -->
  <text x="84" y="147" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">tree[1]</text>
  <text x="84" y="181" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">tree[2]</text>
  <text x="84" y="215" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">tree[3]</text>
  <text x="84" y="249" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">tree[4]</text>
  <text x="84" y="283" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">tree[5]</text>
  <text x="84" y="317" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">tree[6]</text>

  <!-- inside-bar labels -->
  <text x="118" y="147" text-anchor="middle" font-size="10" fill="#333">1 · lb1</text>
  <text x="146" y="181" text-anchor="middle" font-size="10" fill="#333">4 · lb2 · [1,2]</text>
  <text x="230" y="215" text-anchor="middle" font-size="10" fill="#333">5 · lb1</text>
  <text x="202" y="249" text-anchor="middle" font-size="10" fill="#333">16 · lb4 · [1,4]</text>
  <text x="342" y="283" text-anchor="middle" font-size="10" fill="#333">9 · lb1</text>
  <text x="370" y="317" text-anchor="middle" font-size="10" fill="#333">20 · lb2 · [5,6]</text>

  <!-- query(6) jump arrow: tree[6] -> tree[4] (vertical, both at x=314) -->
  <path d="M 314 300 L 314 260" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="284" font-size="10" fill="#b85450" font-weight="bold">6−lb2→4</text>

  <!-- query callout -->
  <rect x="445" y="232" width="145" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="517" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">query(6) 路径</text>
  <text x="517" y="270" text-anchor="middle" font-size="11" fill="#444">6 → 4 → 0</text>
  <text x="517" y="288" text-anchor="middle" font-size="11" fill="#444">= tree[6] + tree[4]</text>
  <text x="517" y="306" text-anchor="middle" font-size="11" fill="#444">= 20 + 16</text>
  <text x="517" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 36 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="350" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#444">lowbit(i) = i &amp; (-i) = 管辖区间长度（最低位的 1）</text>
  <text x="300" y="386" text-anchor="middle" font-size="11" fill="#555">查询 prefixSum：沿 i −= lowbit 向下"拆区间"累加</text>
  <text x="300" y="400" text-anchor="middle" font-size="11" fill="#555">更新 update：沿 i += lowbit 向上"找覆盖"逐层加</text>
</svg>
