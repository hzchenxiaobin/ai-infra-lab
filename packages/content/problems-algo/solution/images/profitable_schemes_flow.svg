<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">盈利计划 DP：双层倒序 + 利润截断</text>

  <!-- 初始化 -->
  <rect x="150" y="46" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="69" text-anchor="middle" font-size="12" fill="#333">dp[0..n][0..minProfit] = 0;  dp[0][0] = 1</text>

  <path d="M 290 82 L 290 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历犯罪 -->
  <polygon points="290,100 410,144 290,188 170,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#333">还有未处理的犯罪？</text>
  <text x="290" y="158" text-anchor="middle" font-size="11" fill="#888">每桩只用一次</text>

  <path d="M 290 188 L 290 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="202" font-size="10" fill="#82b366">是</text>

  <!-- 取出 g, pr -->
  <rect x="130" y="210" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="228" text-anchor="middle" font-size="12" fill="#333">取出犯罪 i：成员 g，利润 pr</text>
  <text x="290" y="244" text-anchor="middle" font-size="11" fill="#888">g 即费用①，pr 用于累加并截断到 minProfit</text>

  <path d="M 290 250 L 290 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 双层倒序 + 截断 -->
  <rect x="80" y="270" width="420" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for j = n ↓ g :  for p = minProfit ↓ 0</text>
  <text x="290" y="312" text-anchor="middle" font-size="11" fill="#333">dp[j][min(minProfit, p+pr)] += dp[j−g][p]</text>
  <text x="290" y="328" text-anchor="middle" font-size="10" fill="#888">取模 1e9+7</text>

  <text x="478" y="296" font-size="10" fill="#b85450" font-weight="bold">两维</text>
  <text x="478" y="310" font-size="10" fill="#b85450" font-weight="bold">都倒序!</text>

  <path d="M 290 334 L 290 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回到遍历 -->
  <path d="M 80 302 L 50 302 L 50 144 L 170 144" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="224" font-size="10" fill="#888">下一桩</text>

  <!-- 结束 -->
  <path d="M 410 144 L 470 144 L 470 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="138" font-size="10" fill="#b85450">否</text>

  <!-- 求和 -->
  <rect x="370" y="214" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="232" text-anchor="middle" font-size="11" fill="#333">对 j = 0..n 求和</text>
  <text x="470" y="248" text-anchor="middle" font-size="11" fill="#333">Σ dp[j][minProfit]</text>

  <!-- 倒序说明 -->
  <rect x="70" y="372" width="440" height="72" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#555">倒序保证 dp[j−g][p] 仍是上一轮旧值 → 每桩犯罪只算一次</text>
  <text x="290" y="412" text-anchor="middle" font-size="11" fill="#555">截断 min(minProfit, p+pr)：利润一旦达到门槛就并入 p=minProfit 格</text>
  <text x="290" y="430" text-anchor="middle" font-size="11" fill="#555">最后对成员数 j 求和，因为「至多 n 人」= 各 j 之和</text>
</svg>
