<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="880" height="600" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三操作流程：定桶 → 遍历链表 → 处理</text>
  <path d="M 260 44 Q 440 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Common start: compute bucket ===== -->
  <g filter="url(#sk)"><rect x="340" y="64" width="200" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="440" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">idx = key % 769</text>

  <!-- split arrows to three columns -->
  <path d="M 440 108 Q 440 130 170 150" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 108 L 440 150" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 108 Q 440 130 710 150" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Column 1: add ===== -->
  <g filter="url(#sk)"><rect x="60" y="152" width="220" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="170" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">add(key)</text>

  <!-- traverse list looking for key -->
  <g filter="url(#sk2)"><rect x="60" y="208" width="220" height="56" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.2"/></g>
  <text x="170" y="228" text-anchor="middle" font-size="11.5" fill="#333">遍历 buckets[idx] 链表</text>
  <text x="170" y="246" text-anchor="middle" font-size="11" fill="#888">找有没有 key</text>
  <path d="M 170 188 L 170 208" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: found? -->
  <g filter="url(#sk2)"><path d="M 170 300 L 110 330 L 170 360 L 230 330 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="170" y="335" text-anchor="middle" font-size="11" fill="#b03a3a">已存在?</text>
  <path d="M 170 264 L 170 300" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- yes: do nothing -->
  <path d="M 110 330 Q 60 330 60 380" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="60" y="382" width="100" height="32" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="110" y="403" text-anchor="middle" font-size="11" fill="#2e6e2e">直接返回</text>
  <text x="92" y="324" font-size="10" fill="#2e6e2e">是</text>

  <!-- no: head insert -->
  <path d="M 230 330 Q 280 330 280 380" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="190" y="382" width="140" height="40" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">头插新节点</text>
  <text x="260" y="415" text-anchor="middle" font-size="10" fill="#5a7a5a">node→next = bucket</text>
  <text x="248" y="324" font-size="10" fill="#b03a3a">否</text>

  <!-- ===== Column 2: contains ===== -->
  <g filter="url(#sk)"><rect x="330" y="152" width="220" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="440" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">contains(key)</text>

  <g filter="url(#sk2)"><rect x="330" y="208" width="220" height="56" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.2"/></g>
  <text x="440" y="228" text-anchor="middle" font-size="11.5" fill="#333">遍历 buckets[idx] 链表</text>
  <text x="440" y="246" text-anchor="middle" font-size="11" fill="#888">逐节点比较 key</text>
  <path d="M 440 188 L 440 208" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk2)"><path d="M 440 300 L 380 330 L 440 360 L 500 330 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="440" y="335" text-anchor="middle" font-size="11" fill="#b03a3a">找到了?</text>
  <path d="M 440 264 L 440 300" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 380 330 Q 360 330 360 380" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="345" y="382" width="80" height="32" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="385" y="403" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true</text>
  <text x="360" y="324" font-size="10" fill="#2e6e2e">是</text>

  <path d="M 500 330 Q 520 330 520 380" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="475" y="382" width="90" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="520" y="403" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">return false</text>
  <text x="515" y="324" font-size="10" fill="#b03a3a">否</text>

  <!-- ===== Column 3: remove ===== -->
  <g filter="url(#sk)"><rect x="600" y="152" width="220" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="710" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">remove(key)</text>

  <g filter="url(#sk2)"><rect x="600" y="208" width="220" height="56" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.2"/></g>
  <text x="710" y="228" text-anchor="middle" font-size="11.5" fill="#333">遍历 buckets[idx] 链表</text>
  <text x="710" y="246" text-anchor="middle" font-size="11" fill="#888">记 prev 指针</text>
  <path d="M 710 188 L 710 208" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk2)"><path d="M 710 300 L 650 330 L 710 360 L 770 330 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="710" y="335" text-anchor="middle" font-size="11" fill="#b03a3a">找到了?</text>
  <path d="M 710 264 L 710 300" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 650 330 Q 630 330 630 380" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="610" y="382" width="100" height="44" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="660" y="400" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">摘除节点</text>
  <text x="660" y="416" text-anchor="middle" font-size="10" fill="#5a7a5a">prev→next = cur→next</text>
  <text x="640" y="324" font-size="10" fill="#2e6e2e">是</text>

  <path d="M 770 330 Q 790 330 790 380" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="765" y="382" width="80" height="32" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="805" y="403" text-anchor="middle" font-size="11" fill="#2e6e2e">什么都不做</text>
  <text x="785" y="324" font-size="10" fill="#b03a3a">否</text>

  <!-- ===== Bottom: complexity summary ===== -->
  <g filter="url(#sk)"><rect x="60" y="460" width="760" height="110" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="440" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">复杂度：每次操作 = 1 次取模 + 1 次短链表遍历</text>
  <g font-size="12">
    <g filter="url(#sk2)"><rect x="90" y="500" width="220" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="200" y="522" text-anchor="middle" fill="#2e6e2e" font-weight="bold">平均时间 O(1)</text>
    <text x="200" y="542" text-anchor="middle" fill="#5a7a5a" font-size="10.5">链表长 ≈ n/769 ≈ 13</text>
    <g filter="url(#sk2)"><rect x="330" y="500" width="220" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
    <text x="440" y="522" text-anchor="middle" fill="#7a5415" font-weight="bold">最坏 O(n)</text>
    <text x="440" y="542" text-anchor="middle" fill="#8a6a35" font-size="10.5">全部挤进同一桶</text>
    <g filter="url(#sk2)"><rect x="570" y="500" width="220" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="680" y="522" text-anchor="middle" fill="#2e6e2e" font-weight="bold">空间 O(n)</text>
    <text x="680" y="542" text-anchor="middle" fill="#5a7a5a" font-size="10.5">769 桶 + n 个节点</text>
  </g>
</svg>
