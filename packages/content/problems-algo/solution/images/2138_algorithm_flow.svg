<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：步长 k 遍历 + 末组填充</text>

  <!-- Start -->
  <rect x="210" y="44" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 80 L 280 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- n = len(s), res = [] -->
  <rect x="180" y="98" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#333">n = len(s)，res = []</text>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#333">i = 0（步长 k 遍历）</text>
  <path d="M 280 140 L 280 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="280,160 376,196 280,232 184,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#333">还有字符?</text>

  <!-- No: return res -->
  <path d="M 376 196 L 460 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="180" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="201" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return res</text>

  <!-- Yes: extract group -->
  <path d="M 280 232 L 280 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="246" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="160" y="252" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#333">group = s[i : i+k]</text>
  <path d="M 280 294 L 280 312" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: len(group) < k ? -->
  <polygon points="280,314 376,346 280,378 184,346" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#333">len(group)</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#333">&lt; k ?（末组不足）</text>

  <!-- Yes: pad -->
  <path d="M 184 346 L 100 346" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="338" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <rect x="36" y="328" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="68" y="344" text-anchor="middle" font-size="9" fill="#333">group +=</text>
  <text x="68" y="356" text-anchor="middle" font-size="9" fill="#333">fill × (k−len)</text>

  <!-- No: skip -->
  <path d="M 376 346 L 430 346" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="338" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>
  <text x="436" y="342" font-size="9" fill="#888">刚好 k 个</text>
  <text x="436" y="354" font-size="9" fill="#888">跳过填充</text>

  <!-- Merge to append -->
  <path d="M 68 364 L 68 392 L 280 392" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 360 L 430 392 L 280 392" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- res.append(group) -->
  <rect x="180" y="394" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="415" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res.append(group)；i += k</text>

  <!-- Loop back to diamond i < n -->
  <path d="M 180 411 L 120 411 L 120 196 L 184 196" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="300" text-anchor="middle" font-size="9" fill="#888">步长 k</text>
  <text x="112" y="312" text-anchor="middle" font-size="9" fill="#888">回循环</text>

  <!-- Footnote -->
  <text x="280" y="466" text-anchor="middle" font-size="10" fill="#888">步长 k 遍历保证每组恰好 k 个字符，仅末组可能不足 → 填充</text>
  <text x="280" y="480" text-anchor="middle" font-size="10" fill="#888">循环 ⌈n/k⌉ 次，每次 O(k) 截取 → 总 O(n)</text>
</svg>
