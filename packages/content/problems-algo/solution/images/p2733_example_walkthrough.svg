<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2733w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：前三个数取中位数</text>

  <!-- Example 1 -->
  <text x="40" y="62" font-size="13" fill="#446688" font-weight="bold">示例 1：nums = [3,2,1,4]</text>
  <text x="40" y="80" font-size="10" fill="#888">n=4 ≥ 3，取前三个：</text>

  <rect x="40" y="88" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="62" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="84" y="88" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="106" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="128" y="88" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="150" y="109" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="172" y="88" width="44" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="194" y="109" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold">4</text>
  <text x="226" y="109" font-size="10" fill="#888">无需看</text>

  <text x="40" y="138" font-size="10" fill="#4a7a3a">排序 [3,2,1] → [1,2,3]，中位=</text>
  <rect x="276" y="124" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="298" y="145" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="40" y="166" width="280" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出 2 ✓ （最小1、最大4，2 均非）</text>

  <path d="M280,200 L280,212" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2733w)" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <text x="40" y="238" font-size="13" fill="#446688" font-weight="bold">示例 2：nums = [1,2]</text>
  <rect x="40" y="246" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="62" y="267" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="84" y="246" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="106" y="267" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="140" y="267" font-size="10" fill="#b85450">n=2 &lt; 3，非最小即最大</text>

  <rect x="40" y="286" width="280" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出 -1 ✓ （凑不出中位）</text>

  <path d="M280,316 L280,328" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2733w)" filter="url(#rough2)"/>

  <!-- Example 3 -->
  <text x="40" y="354" font-size="13" fill="#446688" font-weight="bold">示例 3：nums = [2,1,3]</text>
  <text x="40" y="372" font-size="10" fill="#888">n=3 ≥ 3，全部即前三个：</text>

  <rect x="40" y="380" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="62" y="401" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="380" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="106" y="401" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="128" y="380" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="150" y="401" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="180" y="401" font-size="10" fill="#4a7a3a">排序→[1,2,3]，中位=</text>
  <rect x="310" y="380" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="332" y="401" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="360" y="380" width="170" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="445" y="401" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出 2 ✓</text>

  <text x="280" y="430" text-anchor="middle" font-size="10" fill="#888">三例都验证：看前三个数足矣，不必扫描全数组</text>
</svg>
