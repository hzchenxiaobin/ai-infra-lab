<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    队列轮转：pop 队首迭代器 → 取值并推进 → 仍有元素则 push 回队尾
  </text>

  <!-- v1 row -->
  <text x="44" y="72" font-size="13" fill="#446688" filter="url(#rough2)">v1 =</text>
  <rect x="88" y="56" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="56" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- v2 row -->
  <text x="44" y="124" font-size="13" fill="#4a7a3a" filter="url(#rough2)">v2 =</text>
  <rect x="88" y="108" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="132" y="108" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="176" y="108" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="220" y="108" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- arrows: vectors -> queue -->
  <path d="M152,90 Q200,150 232,182" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M240,140 Q290,160 332,182" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="158" font-size="10" fill="#666" filter="url(#rough2)">构造迭代器入队</text>

  <!-- queue container -->
  <rect x="186" y="178" width="280" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="326" y="196" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">迭代器队列 queue（front → back）</text>
  <rect x="206" y="206" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="252" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">it(v1) → 1</text>
  <rect x="354" y="206" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">it(v2) → 3</text>
  <text x="206" y="262" font-size="10" fill="#b85450" filter="url(#rough2)">↑ front（出队口）</text>
  <text x="372" y="262" font-size="10" fill="#b85450" filter="url(#rough2)">↑ back（入队口）</text>

  <!-- cyclic pushback arrow over the queue -->
  <path d="M298,206 Q326,168 354,206" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="326" y="164" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">推进后仍有 → 回尾部</text>

  <!-- pop front arrow down to output -->
  <path d="M252,236 L252,300" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="276" font-size="10" fill="#b85450" filter="url(#rough2)">pop → 取值</text>

  <!-- output row -->
  <text x="44" y="332" font-size="12" fill="#333" filter="url(#rough2)">输出（锯齿序）</text>
  <rect x="150" y="318" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="318" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="226" y="318" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="264" y="318" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="302" y="318" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="340" y="318" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    每次只动队首：取一个值就轮到下一个向量，长度不同者耗尽后自动出队
  </text>
</svg>
