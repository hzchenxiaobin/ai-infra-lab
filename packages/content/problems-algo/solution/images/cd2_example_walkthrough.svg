<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 2, 3, 1], k = 3</text>
  <path d="M 180 42 Q 330 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="25" y="60" width="45" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="70" y="60" width="65" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="135" y="60" width="170" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="305" y="60" width="95" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="400" y="60" width="65" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
    <rect x="465" y="60" width="185" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="47.5" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">i</text>
  <text x="102.5" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">nums[i]</text>
  <text x="220" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">last（查前）</text>
  <text x="352.5" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">距离</text>
  <text x="432.5" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">命中？</text>
  <text x="557.5" y="82" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">last（查后）</text>

  <!-- 第 0 步 -->
  <g filter="url(#rough2)">
    <rect x="25" y="100" width="45" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="70" y="100" width="65" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="135" y="100" width="170" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="305" y="100" width="95" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="400" y="100" width="65" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="465" y="100" width="185" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="47.5" y="125" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="102.5" y="125" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="220" y="125" text-anchor="middle" font-size="12" fill="#888">{ }</text>
  <text x="352.5" y="125" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="432.5" y="125" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  <text x="557.5" y="125" text-anchor="middle" font-size="12" fill="#4a7a3a">{ 1:0 }</text>

  <!-- 第 1 步 -->
  <g filter="url(#rough2)">
    <rect x="25" y="144" width="45" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="70" y="144" width="65" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="135" y="144" width="170" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="305" y="144" width="95" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="400" y="144" width="65" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="465" y="144" width="185" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="47.5" y="169" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="102.5" y="169" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="220" y="169" text-anchor="middle" font-size="12" fill="#888">{ 1:0 }</text>
  <text x="352.5" y="169" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="432.5" y="169" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  <text x="557.5" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a">{ 1:0, 2:1 }</text>

  <!-- 第 2 步 -->
  <g filter="url(#rough2)">
    <rect x="25" y="188" width="45" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="70" y="188" width="65" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="135" y="188" width="170" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="305" y="188" width="95" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="400" y="188" width="65" height="40" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="465" y="188" width="185" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="47.5" y="213" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="102.5" y="213" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="220" y="213" text-anchor="middle" font-size="12" fill="#888">{ 1:0, 2:1 }</text>
  <text x="352.5" y="213" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="432.5" y="213" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  <text x="557.5" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a">{ 1:0, 2:1, 3:2 }</text>

  <!-- 第 3 步：命中（高亮行） -->
  <g filter="url(#rough2)">
    <rect x="25" y="232" width="45" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="70" y="232" width="65" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="135" y="232" width="170" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="305" y="232" width="95" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="400" y="232" width="65" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="465" y="232" width="185" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="47.5" y="257" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="102.5" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
  <text x="220" y="257" text-anchor="middle" font-size="12" fill="#888">{ 1:0, 2:1, 3:2 }</text>
  <text x="352.5" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">3−0=3</text>
  <text x="432.5" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">✓</text>
  <text x="557.5" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">返回 true</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="25" y="292" width="625" height="56" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="42" y="314" font-size="12" fill="#555">前 3 步：1 / 2 / 3 都不在 last 中 → 各自 last[v] = i 入表；</text>
  <text x="42" y="334" font-size="12" fill="#555">第 4 步：第二个 1 查得 last[1]=0，距离 3−0=3 ≤ k=3 → 命中，立即返回 true。</text>
</svg>
