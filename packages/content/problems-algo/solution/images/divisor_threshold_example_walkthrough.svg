<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,5,9], threshold = 6</text>

  <!-- header -->
  <text x="40" y="52" font-size="11" fill="#888">轮次</text>
  <text x="110" y="52" font-size="11" fill="#888">区间 [lo,hi]</text>
  <text x="240" y="52" font-size="11" fill="#888">mid</text>
  <text x="300" y="52" font-size="11" fill="#888">⌈1/d⌉+⌈2/d⌉+⌈5/d⌉+⌈9/d⌉ = S</text>
  <text x="520" y="52" font-size="11" fill="#888">判定</text>
  <text x="580" y="52" font-size="11" fill="#888">动作</text>
  <line x1="30" y1="58" x2="620" y2="58" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Round 1: mid=5 -->
  <rect x="30" y="64" width="590" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="88" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="110" y="82" font-size="11" fill="#333">[1, 9]</text>
  <text x="240" y="82" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="300" y="82" font-size="11" fill="#333">1 + 1 + 1 + 2 = 5</text>
  <text x="520" y="82" font-size="11" fill="#4a7a3a" font-weight="bold">5 ≤ 6 ✓</text>
  <text x="580" y="76" font-size="10" fill="#333">ans=5</text>
  <text x="580" y="90" font-size="10" fill="#333">hi=4</text>

  <!-- Round 2: mid=2 -->
  <rect x="30" y="116" width="590" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="140" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="110" y="134" font-size="11" fill="#333">[1, 4]</text>
  <text x="240" y="134" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="300" y="134" font-size="11" fill="#333">1 + 1 + 3 + 5 = 10</text>
  <text x="520" y="134" font-size="11" fill="#b85450" font-weight="bold">10 &gt; 6 ✗</text>
  <text x="580" y="134" font-size="10" fill="#333">lo=3</text>

  <!-- Round 3: mid=3 -->
  <rect x="30" y="168" width="590" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="192" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="110" y="186" font-size="11" fill="#333">[3, 4]</text>
  <text x="240" y="186" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="300" y="186" font-size="11" fill="#333">1 + 1 + 2 + 3 = 7</text>
  <text x="520" y="186" font-size="11" fill="#b85450" font-weight="bold">7 &gt; 6 ✗</text>
  <text x="580" y="186" font-size="10" fill="#333">lo=4</text>

  <!-- Round 4: mid=4 -->
  <rect x="30" y="220" width="590" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="244" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="110" y="238" font-size="11" fill="#333">[4, 4]</text>
  <text x="240" y="238" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="300" y="238" font-size="11" fill="#333">1 + 1 + 2 + 3 = 7</text>
  <text x="520" y="238" font-size="11" fill="#b85450" font-weight="bold">7 &gt; 6 ✗</text>
  <text x="580" y="238" font-size="10" fill="#333">lo=5</text>

  <!-- end -->
  <line x1="30" y1="272" x2="620" y2="272" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="292" text-anchor="middle" font-size="12" fill="#888">lo=5 &gt; hi=4，循环结束</text>

  <!-- answer box -->
  <rect x="220" y="304" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="330" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">答案 ans = 5</text>

  <!-- verification note -->
  <rect x="60" y="356" width="520" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="378" font-size="11" fill="#555" font-weight="bold">验证：</text>
  <text x="80" y="396" font-size="11" fill="#444">d=5 时 S=⌈1/5⌉+⌈2/5⌉+⌈5/5⌉+⌈9/5⌉ = 1+1+1+2 = 5 ≤ 6 ✓（最小可行）</text>
  <text x="80" y="414" font-size="11" fill="#444">d=4 时 S=⌈1/4⌉+⌈2/4⌉+⌈5/4⌉+⌈9/4⌉ = 1+1+2+3 = 7 &gt; 6 ✗（不可行，故 5 是最小）</text>
</svg>
