<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描，先查后插</text>

  <!-- start -->
  <rect x="200" y="36" width="160" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s = 0，ans = −∞，map = {}</text>
  <path d="M 280 66 L 280 80" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="175" y="82" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="103" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">for x in nums（s = x 之前的前缀和）</text>
  <path d="M 280 114 L 280 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- query -->
  <rect x="140" y="130" width="280" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">查询：t ∈ {x − k, x + k}</text>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">若 t 在 map 中：ans = max(ans, s + x − map[t])</text>
  <path d="M 280 182 L 280 198" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- insert -->
  <rect x="140" y="200" width="280" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="219" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">插入：map[x] = min(map[x], s)</text>
  <text x="280" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（x 登记为未来左端点的候选）</text>
  <path d="M 280 248 L 280 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- advance -->
  <rect x="215" y="266" width="130" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">s += x</text>
  <path d="M 280 296 L 280 312" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="280,314 352,348 280,382 208,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="353" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">还有元素？</text>

  <!-- yes loop back -->
  <text x="360" y="340" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 352 348 L 470 348 L 470 98 L 389 98" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- no -->
  <text x="290" y="396" font-size="11.5" fill="#555" filter="url(#rough2)">否</text>
  <path d="M 280 382 L 280 398" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="195" y="400" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="421" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = −∞ ? 返回 0 : ans</text>

  <!-- side note -->
  <rect x="16" y="140" width="116" height="150" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="74" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">易错点</text>
  <text x="74" y="184" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">① 存最小前缀和</text>
  <text x="74" y="201" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">　 不是最早下标</text>
  <text x="74" y="222" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">② 先查后插</text>
  <text x="74" y="239" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">　 （k=0 时必须）</text>
  <text x="74" y="260" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">③ 和可达 10¹⁴</text>
  <text x="74" y="277" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">　 C++ 用 long long</text>
</svg>
