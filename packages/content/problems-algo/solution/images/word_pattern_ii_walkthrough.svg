<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：pattern="abab", s="redblueredblue"</text>
  <text x="300" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">沿命中路径：a→red, b→blue，子串首尾相接拼满 s → true ✓</text>

  <g>
    <rect x="24" y="68" width="110" height="220" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="79" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">层 0</text>
    <line x1="34" y1="98" x2="124" y2="98" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="79" y="116" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">pi=0 si=0</text>
    <text x="79" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ch: a</text>
    <line x1="34" y1="144" x2="124" y2="144" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="79" y="162" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">新字符</text>
    <text x="79" y="178" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">试 len=3</text>
    <text x="79" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">w="red"</text>
    <line x1="34" y1="204" x2="124" y2="204" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="79" y="222" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c2w:{a:red}</text>
    <text x="79" y="236" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">w2c:{red:a}</text>
    <text x="79" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">登记 ✓</text>
    <text x="79" y="278" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（len=1,2 失败回溯）</text>
  </g>

  <g>
    <rect x="146" y="68" width="110" height="220" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="201" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">层 1</text>
    <line x1="156" y1="98" x2="246" y2="98" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="201" y="116" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">pi=1 si=3</text>
    <text x="201" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ch: b</text>
    <line x1="156" y1="144" x2="246" y2="144" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="201" y="162" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">新字符</text>
    <text x="201" y="178" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">试 len=4</text>
    <text x="201" y="194" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">w="blue"</text>
    <line x1="156" y1="204" x2="246" y2="204" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="201" y="222" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c2w:+b:blue</text>
    <text x="201" y="236" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">w2c:+blue:b</text>
    <text x="201" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">登记 ✓</text>
  </g>

  <g>
    <rect x="268" y="68" width="110" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="323" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">层 2</text>
    <line x1="278" y1="98" x2="368" y2="98" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="323" y="116" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">pi=2 si=7</text>
    <text x="323" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ch: b</text>
    <line x1="278" y1="144" x2="368" y2="144" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="323" y="162" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">已映射</text>
    <text x="323" y="178" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">w="blue"</text>
    <text x="323" y="194" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s[7:]前缀?</text>
    <line x1="278" y1="204" x2="368" y2="204" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="323" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">"bluered…"</text>
    <text x="323" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">=blue ✓</text>
    <text x="323" y="262" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">不枚举长度</text>
    <text x="323" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">前缀校验 ✓</text>
  </g>

  <g>
    <rect x="390" y="68" width="110" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="445" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">层 3</text>
    <line x1="400" y1="98" x2="490" y2="98" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="445" y="116" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">pi=3 si=11</text>
    <text x="445" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ch: a</text>
    <line x1="400" y1="144" x2="490" y2="144" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="445" y="162" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">已映射</text>
    <text x="445" y="178" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">w="red"</text>
    <text x="445" y="194" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s[11:]前缀?</text>
    <line x1="400" y1="204" x2="490" y2="204" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="445" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">"redblue"</text>
    <text x="445" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">=red ✓</text>
    <text x="445" y="262" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">不枚举长度</text>
    <text x="445" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">前缀校验 ✓</text>
  </g>

  <g>
    <rect x="512" y="68" width="80" height="220" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="552" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">层 4</text>
    <line x1="522" y1="98" x2="582" y2="98" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="552" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">pi=4</text>
    <text x="552" y="136" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">=len(p)</text>
    <text x="552" y="158" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">si=14</text>
    <text x="552" y="174" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">=len(s)</text>
    <line x1="522" y1="186" x2="582" y2="186" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="552" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">子串拼满</text>
    <text x="552" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">无空隙</text>
    <text x="552" y="258" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">成功 ✓</text>
    <text x="552" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">return true</text>
  </g>

  <rect x="120" y="312" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="332" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">red+blue+red+blue = redblueredblue</text>
  <text x="300" y="350" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">→ 双射成立，return true</text>

  <text x="300" y="384" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">注：a 先试 len=1,2 因后续拼不满/反向冲突而回溯，最终在 len=3 命中</text>
</svg>
