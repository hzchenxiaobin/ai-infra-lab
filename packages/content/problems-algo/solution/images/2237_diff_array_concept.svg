<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：路灯照亮连续区间 → 差分数组两端打标 → 前缀和还原亮度</text>

  <!-- street row (shared scenario: n=5, lamp at pos 2 range 1 -> [1,3]) -->
  <text x="300" y="58" text-anchor="middle" font-size="11" fill="#888">同一场景：街道 0~4，一盏灯 [pos=2, range=1] 照亮 [1,3]</text>

  <!-- ===== Left side: naive (bad) ===== -->
  <rect x="28" y="74" width="266" height="340" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="161" y="96" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗ 朴素：区间内逐点 +1</text>

  <!-- street cells 0..4, cover [1,3] shaded -->
  <rect x="62" y="110" width="38" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="132" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="104" y="110" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="123" y="132" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="146" y="110" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="132" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="188" y="110" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="207" y="132" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="230" y="110" width="38" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="132" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- +1 markers over [1,3] -->
  <path d="M 123 108 L 123 96" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 165 108 L 165 96" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 207 108 L 207 96" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="161" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">每点亮一格 +1：3 次写操作</text>

  <!-- cost box -->
  <rect x="58" y="180" width="206" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="161" y="200" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">单灯 O(R−L)</text>
  <text x="161" y="218" text-anchor="middle" font-size="10" fill="#888">m 盏灯 × n 位置 → O(m·n) ≈ 10^10 超时</text>

  <!-- repeat for every lamp -->
  <rect x="58" y="244" width="206" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="161" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">每盏灯都遍历整段区间</text>
  <text x="161" y="276" text-anchor="middle" font-size="10" fill="#888">区间越长越慢</text>

  <text x="161" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">方向：点改区间，逐点累加</text>
  <text x="161" y="330" text-anchor="middle" font-size="10" fill="#888">区间加 = 线性扫描</text>
  <text x="161" y="372" text-anchor="middle" font-size="20" fill="#bbb" font-weight="bold">慢</text>

  <!-- ===== Right side: diff array (good) ===== -->
  <rect x="306" y="74" width="266" height="340" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="439" y="96" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 差分：两端打标 O(1)</text>

  <!-- diff array d[0..5], mark d[1]+=1, d[4]-=1 -->
  <text x="439" y="124" text-anchor="middle" font-size="10" fill="#888">差分数组 d（长度 n+1=6）</text>
  <rect x="328" y="132" width="34" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="152" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="362" y="132" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="379" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="396" y="132" width="34" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="413" y="152" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="430" y="132" width="34" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="447" y="152" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="464" y="132" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="481" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1</text>
  <rect x="498" y="132" width="34" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="515" y="152" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="379" y="178" text-anchor="middle" font-size="9" fill="#4a7a3a">d[L]++</text>
  <text x="481" y="178" text-anchor="middle" font-size="9" fill="#b85450">d[R+1]--</text>

  <!-- prefix sum arrow -->
  <path d="M 439 184 L 439 202" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">前缀和</text>
  <text x="439" y="196" text-anchor="end" font-size="9" fill="#888" dx="-6">s[i]=s[i−1]+d[i]</text>

  <!-- brightness row 0..4 = [0,1,1,1,0] -->
  <rect x="336" y="208" width="38" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="230" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="378" y="208" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="397" y="230" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="420" y="208" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="439" y="230" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="462" y="208" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="481" y="230" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="504" y="208" width="38" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="523" y="230" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="439" y="258" text-anchor="middle" font-size="10" fill="#888">亮度 = [0,1,1,1,0]，与逐点法完全一致</text>

  <!-- cost box -->
  <rect x="336" y="272" width="206" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="439" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">单灯 O(1)，还原 O(n)</text>
  <text x="439" y="310" text-anchor="middle" font-size="10" fill="#888">m 盏打标 + 一次前缀和 → O(m+n)</text>

  <text x="439" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">方向：区间加只动两端</text>
  <text x="439" y="364" text-anchor="middle" font-size="10" fill="#888">把「重复加」压缩成「两标记」</text>
  <text x="439" y="396" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">快</text>

  <!-- center vs arrow -->
  <text x="300" y="232" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">vs</text>
</svg>
