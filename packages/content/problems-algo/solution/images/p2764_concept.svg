<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2764a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：栈 = 从根到当前节点的 DFS 路径</text>

  <!-- preorder sequence -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold">前序</text>
  <g font-size="13" fill="#888" font-weight="bold">
    <text x="80" y="58">0 → 1 → 2 → 3 → </text>
    <text x="222" y="58" fill="#b85450">4</text>
    <text x="240" y="58" fill="#b85450">← 当前</text>
  </g>

  <!-- TREE (left) -->
  <text x="40" y="92" font-size="12" fill="#446688" font-weight="bold">二叉树</text>
  <!-- edges (gray for finished) -->
  <line x1="140" y1="108" x2="80" y2="172" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="140" y1="108" x2="210" y2="172" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="210" y1="188" x2="170" y2="248" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="210" y1="188" x2="250" y2="248" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- nodes -->
  <!-- node 1 (finished, gray) -->
  <ellipse cx="80" cy="160" rx="17" ry="17" fill="#eeeeee" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="165" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">1</text>
  <!-- node 3 (finished, gray) -->
  <ellipse cx="170" cy="260" rx="17" ry="17" fill="#eeeeee" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="265" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">3</text>
  <!-- node 0 (path) -->
  <ellipse cx="140" cy="96" rx="18" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="101" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <!-- node 2 (path) -->
  <ellipse cx="210" cy="180" rx="18" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="210" y="185" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <!-- node 4 (current) -->
  <ellipse cx="250" cy="260" rx="18" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="250" y="265" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>

  <text x="58" y="160" font-size="10" fill="#999">已弹出</text>
  <text x="188" y="305" text-anchor="middle" font-size="10" fill="#999">已弹出</text>

  <!-- STACK (right) -->
  <text x="440" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">栈（路径）</text>
  <!-- top marker -->
  <text x="372" y="138" font-size="11" fill="#4a7a3a" font-weight="bold">栈顶 →</text>
  <line x1="406" y1="134" x2="418" y2="134" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr2764a)" filter="url(#rough2)"/>
  <!-- stack boxes, top=4 -->
  <rect x="418" y="120" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="442" y="142" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>
  <rect x="418" y="158" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="442" y="180" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <rect x="418" y="196" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="442" y="218" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <text x="442" y="246" text-anchor="middle" font-size="10" fill="#888">栈底</text>

  <!-- link tree->stack -->
  <path d="M270,260 C330,260 360,160 416,138" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr2764a)" filter="url(#rough2)"/>
  <text x="330" y="200" font-size="10" fill="#446688">当前节点压栈</text>

  <!-- note -->
  <rect x="40" y="328" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">访问新节点时，其父必须在栈上（栈顶或弹出已完成兄弟后）</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#446688">弹出 = 该子树已走完；若弹空栈仍未找到父 ⇒ 非前序</text>
</svg>
