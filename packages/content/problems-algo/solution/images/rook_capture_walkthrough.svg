<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 3 演算：R(3,3) 四方向扫描 → 可吃 3 个卒</text>

  <!-- 列标 a-h -->
  <text x="67"  y="52" text-anchor="middle" font-size="10" fill="#888">a</text>
  <text x="101" y="52" text-anchor="middle" font-size="10" fill="#888">b</text>
  <text x="135" y="52" text-anchor="middle" font-size="10" fill="#888">c</text>
  <text x="169" y="52" text-anchor="middle" font-size="10" fill="#888">d</text>
  <text x="203" y="52" text-anchor="middle" font-size="10" fill="#888">e</text>
  <text x="237" y="52" text-anchor="middle" font-size="10" fill="#888">f</text>
  <text x="271" y="52" text-anchor="middle" font-size="10" fill="#888">g</text>
  <text x="305" y="52" text-anchor="middle" font-size="10" fill="#888">h</text>

  <!-- 行标 8-1 -->
  <text x="38" y="80"  text-anchor="middle" font-size="10" fill="#888">8</text>
  <text x="38" y="114" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="38" y="148" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="38" y="182" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="38" y="216" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="38" y="250" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="38" y="284" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="38" y="318" text-anchor="middle" font-size="10" fill="#888">1</text>

  <!-- 8x8 棋盘格：x=50+r*0... col c -> x=50+c*34, row r -> y=60+r*34 -->
  <!-- 棋盘外框 -->
  <rect x="50" y="60" width="272" height="272" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 第0行 -->
  <rect x="50"  y="60"  width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="84"  y="60"  width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="118" y="60"  width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="152" y="60"  width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="186" y="60"  width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="60"  width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="254" y="60"  width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="288" y="60"  width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 第1行：p@(1,3) -->
  <rect x="50"  y="94"  width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="84"  y="94"  width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="118" y="94"  width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="152" y="94"  width="34" height="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="169" y="116" text-anchor="middle" font-size="15" fill="#999">p</text>
  <rect x="186" y="94"  width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="94"  width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="254" y="94"  width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="288" y="94"  width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 第2行：p@(2,3)=d6 可吃 -->
  <rect x="50"  y="128" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="84"  y="128" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="118" y="128" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="152" y="128" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="169" y="150" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">p</text>
  <rect x="186" y="128" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="128" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="254" y="128" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="288" y="128" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 第3行：p@(3,0) p@(3,1)=b5 . R . p@(3,5)=f5 B@(3,6) -->
  <rect x="50"  y="162" width="34" height="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="67"  y="184" text-anchor="middle" font-size="15" fill="#999">p</text>
  <rect x="84"  y="162" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="101" y="184" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">p</text>
  <rect x="118" y="162" width="34" height="34" fill="#eef7ee" stroke="#9ec89a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="152" y="162" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="169" y="184" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">R</text>
  <rect x="186" y="162" width="34" height="34" fill="#eef7ee" stroke="#9ec89a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="162" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="237" y="184" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">p</text>
  <rect x="254" y="162" width="34" height="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="271" y="184" text-anchor="middle" font-size="15" fill="#999">B</text>
  <rect x="288" y="162" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 第4行：(4,3) 空路径 -->
  <rect x="50"  y="196" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="84"  y="196" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="118" y="196" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="152" y="196" width="34" height="34" fill="#fdeeee" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="186" y="196" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="196" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="254" y="196" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="288" y="196" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 第5行：B@(5,3) 被挡 -->
  <rect x="50"  y="230" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="84"  y="230" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="118" y="230" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="152" y="230" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="169" y="252" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">B</text>
  <rect x="186" y="230" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="230" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="254" y="230" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="288" y="230" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 第6行：p@(6,3) 被挡 -->
  <rect x="50"  y="264" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="84"  y="264" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="118" y="264" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="152" y="264" width="34" height="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="169" y="286" text-anchor="middle" font-size="15" fill="#999">p</text>
  <rect x="186" y="264" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="264" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="254" y="264" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="288" y="264" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 第7行 -->
  <rect x="50"  y="298" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="84"  y="298" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="118" y="298" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="152" y="298" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="186" y="298" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="298" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="254" y="298" width="34" height="34" fill="#fafafa" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="288" y="298" width="34" height="34" fill="#f4f4f4" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 方向扫描箭头：从 R(169,179) 出发 -->
  <!-- 上：R→d6(p) 绿 -->
  <path d="M 169 170 L 169 156" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 下：R→B(5,3) 红，经过(4,3)空格 -->
  <path d="M 169 188 L 169 240" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 左：R→b5(p) 绿，经过(3,2)空格 -->
  <path d="M 160 179 L 112 179" fill="none" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 右：R→f5(p) 绿，经过(3,4)空格 -->
  <path d="M 178 179 L 226 179" fill="none" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 方向文字 -->
  <text x="183" y="160" font-size="9" fill="#4a7a3a" font-weight="bold">上</text>
  <text x="183" y="230" font-size="9" fill="#b85450" font-weight="bold">下</text>
  <text x="132" y="174" font-size="9" fill="#4a7a3a" font-weight="bold">左</text>
  <text x="206" y="174" font-size="9" fill="#4a7a3a" font-weight="bold">右</text>

  <!-- 右侧图例 -->
  <rect x="350" y="70" width="230" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="465" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">图例</text>

  <rect x="366" y="108" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="396" y="122" font-size="11" fill="#555">R = 白车（唯一，先定位）</text>

  <rect x="366" y="134" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="148" font-size="11" fill="#4a7a3a">绿格 = 可吃卒（首个 p）</text>

  <rect x="366" y="160" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="174" font-size="11" fill="#b85450">红格 = 挡路象（首个 B）</text>

  <rect x="366" y="186" width="20" height="18" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="200" font-size="11" fill="#888">灰格 = 被挡棋子（吃不到）</text>

  <rect x="366" y="212" width="20" height="4" fill="none" stroke="#9ec89a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="396" y="218" font-size="11" fill="#888">淡绿路径 = 扫描经过的空格</text>

  <!-- 结果框 -->
  <rect x="350" y="246" width="230" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="465" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">扫描结果</text>
  <text x="362" y="290" font-size="11" fill="#4a7a3a">上 → d6=p ✓   count=1</text>
  <text x="362" y="306" font-size="11" fill="#b85450">下 → d3=B ✗   被挡</text>
  <text x="362" y="322" font-size="11" fill="#4a7a3a">左 → b5=p ✓   count=2</text>
  <text x="480" y="290" font-size="11" fill="#4a7a3a">右 → f5=p ✓</text>
  <text x="480" y="306" font-size="11" fill="#4a7a3a">count=3</text>
  <text x="465" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 3</text>
</svg>
