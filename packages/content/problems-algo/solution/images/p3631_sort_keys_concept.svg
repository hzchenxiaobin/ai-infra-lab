<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：三级排序键 = 一条「字典序」比较链</text>
  <text x="26" y="46" font-size="11" fill="#666" filter="url(#rough2)">threats[i] = [id, severity, exploitability]</text>
  <text x="494" y="46" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">蓝=严重性　橙=可利用性　绿=id 决胜</text>

  <!-- 左列：三级键漏斗 -->
  <text x="135" y="62" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">优先级从上到下递减</text>

  <rect x="30" y="68" width="210" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="87" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">第 1 键：严重性 sev</text>
  <text x="135" y="103" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">降序 —— 高的在前</text>

  <path d="M 135 114 L 135 128" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="126" font-size="9.5" fill="#999" filter="url(#rough2)">平局才下沉</text>

  <rect x="30" y="132" width="210" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="151" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">第 2 键：可利用性 expl</text>
  <text x="135" y="167" text-anchor="middle" font-size="10.5" fill="#b07818" filter="url(#rough2)">降序 —— 高的在前</text>

  <path d="M 135 178 L 135 192" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="190" font-size="9.5" fill="#999" filter="url(#rough2)">平局才下沉</text>

  <rect x="30" y="196" width="210" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="215" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">第 3 键：标识符 id（决胜）</text>
  <text x="135" y="231" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">升序 —— 小的在前</text>

  <!-- 右列：两个具体比较 -->
  <text x="380" y="68" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例① [103,3,3] vs [102,3,2]</text>
  <rect x="268" y="76" width="88" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[103,3,3]</text>
  <text x="378" y="94" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">vs</text>
  <rect x="390" y="76" width="88" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[102,3,2]</text>

  <text x="380" y="118" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">severity：3 = 3 平局 ↓</text>
  <text x="380" y="136" text-anchor="middle" font-size="10.5" fill="#b07818" filter="url(#rough2)">expl：3 &gt; 2 → 103 在前 ✓</text>

  <text x="380" y="168" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例② [102,1,5] vs [103,1,5]</text>
  <rect x="268" y="176" width="88" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="194" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[102,1,5]</text>
  <text x="378" y="194" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">vs</text>
  <rect x="390" y="176" width="88" height="26" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="194" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[103,1,5]</text>

  <text x="380" y="218" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">severity：1 = 1 平局 ↓</text>
  <text x="380" y="236" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">expl：5 = 5 平局 ↓</text>
  <text x="380" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">id：102 &lt; 103 → 102 在前 ✓</text>

  <!-- 结论框 -->
  <rect x="30" y="292" width="460" height="54" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">高级键分不出胜负，才轮到低级键 —— 一条 if-else 链编码全部三级</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">id 互不相同 ⇒ 任意两元素必分先后（全序），结果唯一确定</text>
</svg>
