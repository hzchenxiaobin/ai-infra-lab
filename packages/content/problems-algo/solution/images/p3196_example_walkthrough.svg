<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, −2, 3, 4]</text>

  <rect x="30" y="42" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="61" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="98" y="61" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="170" y="61" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">keep</text>
  <text x="250" y="61" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">flip</text>
  <text x="410" y="61" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">说明</text>

  <rect x="30" y="70" width="500" height="38" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="98" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="170" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="250" y="93" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>
  <text x="298" y="93" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">首元素不可翻（实现上取 1 即可，被支配）</text>

  <rect x="30" y="108" width="500" height="38" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="108" width="80" height="38" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="48" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="98" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−2</text>
  <text x="170" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="250" y="131" text-anchor="middle" font-size="11" fill="#8a6a1e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="298" y="131" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">flip = 1−(−2) = 3：符号 + −，把 −2 翻成 +2</text>

  <rect x="30" y="146" width="500" height="38" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="98" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="250" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−4</text>
  <text x="298" y="169" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">keep = max(−1,3)+3 = 6：续成 + − +，即段 [1,−2,3]</text>

  <rect x="30" y="184" width="500" height="38" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="130" y="184" width="80" height="38" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="48" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="98" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="170" y="207" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="250" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="298" y="207" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">keep = max(6,−4)+4 = 10：整段 [1,−2,3] ＋ 新段 [4]</text>

  <rect x="30" y="238" width="500" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">答案 = max(keep, flip) = max(10, 2) = 10</text>
  <text x="280" y="277" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对应分割 [1, −2, 3] | [4]：cost = (1+2+3) + 4 = 10</text>

  <rect x="70" y="304" width="90" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="331" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">＋1</text>
  <rect x="170" y="304" width="90" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="331" text-anchor="middle" font-size="13" fill="#8a6a1e" font-weight="bold" filter="url(#rough2)">＋2</text>
  <text x="215" y="298" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">翻负为正</text>
  <rect x="270" y="304" width="90" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="331" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">＋3</text>
  <rect x="380" y="304" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="331" text-anchor="middle" font-size="13" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">＋4</text>

  <path d="M 370 296 L 370 354" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最优符号方案 + − + | +：只翻转 −2 一处，其余保持原号，总和 = 10</text>
</svg>
