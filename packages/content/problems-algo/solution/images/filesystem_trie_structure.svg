<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>

  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">路径 Trie 结构</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="#888">每个节点 = 一级路径，节点存 value；createPath("/leet",1) + createPath("/leet/code",2) + create("/a",1)</text>

  <!-- Root -->
  <g filter="url(#sk)">
    <circle cx="300" cy="96" r="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="300" y="101" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">root</text>
  <text x="300" y="138" text-anchor="middle" font-size="9" fill="#888">v = -1（哨兵）</text>

  <!-- leet branch -->
  <path d="M 280 116 Q 200 150 170 176" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="210" y="146" font-size="10" fill="#888">leet</text>
  <g filter="url(#sk)">
    <ellipse cx="160" cy="196" rx="42" ry="22" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  </g>
  <text x="160" y="194" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">leet</text>
  <text x="160" y="208" text-anchor="middle" font-size="9.5" fill="#2e8b57">v = 1 ✓</text>
  <text x="160" y="236" text-anchor="middle" font-size="9" fill="#888">"/leet" 已创建</text>

  <!-- code under leet -->
  <path d="M 160 220 L 160 256" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="172" y="244" font-size="10" fill="#888">code</text>
  <g filter="url(#sk)">
    <ellipse cx="160" cy="280" rx="42" ry="22" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  </g>
  <text x="160" y="278" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">code</text>
  <text x="160" y="292" text-anchor="middle" font-size="9.5" fill="#2e8b57">v = 2 ✓</text>
  <text x="160" y="320" text-anchor="middle" font-size="9" fill="#888">"/leet/code" 已创建</text>

  <!-- a branch -->
  <path d="M 320 116 Q 420 150 460 176" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="410" y="146" font-size="10" fill="#888">a</text>
  <g filter="url(#sk)">
    <ellipse cx="470" cy="196" rx="34" ry="22" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  </g>
  <text x="470" y="194" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">a</text>
  <text x="470" y="208" text-anchor="middle" font-size="9.5" fill="#2e8b57">v = 1 ✓</text>
  <text x="470" y="236" text-anchor="middle" font-size="9" fill="#888">"/a" 已创建</text>

  <!-- failure case: /c/d parent missing -->
  <path d="M 320 116 Q 360 200 340 348" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="362" y="282" font-size="9.5" fill="#b85450">c（不存在）</text>
  <g filter="url(#sk)">
    <ellipse cx="335" cy="372" rx="30" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>
  <text x="335" y="370" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">d?</text>
  <text x="335" y="384" text-anchor="middle" font-size="8.5" fill="#b85450">父缺失→false</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="360" width="240" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="160" y="380" text-anchor="middle" font-size="10.5" fill="#7a5a20" font-weight="bold">关键：父路径必须已创建</text>
  <text x="160" y="396" text-anchor="middle" font-size="9.5" fill="#888">createPath 只在末级新增节点</text>
</svg>
