<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">以 k 为锚点：拆成「左下链 + k + 右上链」</text>

  <!-- 分隔虚线（过 k 的两条线） -->
  <path d="M 260 50 L 260 266" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 58 158 L 462 158" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- 左上：不可比 -->
  <rect x="62" y="52" width="192" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="158" y="94" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">左上：不可比 ✗</text>
  <text x="158" y="112" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x &lt; xk 但 y &gt; yk</text>
  <text x="158" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">排在 k 前后都矛盾 → 剔除</text>

  <!-- 右上：upper -->
  <rect x="266" y="52" width="192" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="362" y="80" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">右上区（k 之后）</text>
  <text x="362" y="97" text-anchor="middle" font-size="10" fill="#2c4a66" filter="url(#rough2)">x &gt; xk 且 y &gt; yk</text>

  <!-- 左下：lower -->
  <rect x="62" y="160" width="192" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="158" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左下区（k 之前）</text>
  <text x="158" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">x &lt; xk 且 y &lt; yk</text>

  <!-- 右下：不可比 -->
  <rect x="266" y="160" width="192" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="362" y="202" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">右下：不可比 ✗</text>
  <text x="362" y="220" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x &gt; xk 但 y &lt; yk</text>
  <text x="362" y="236" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">只比一个坐标就会踩坑！</text>

  <!-- 锚点 k -->
  <circle cx="260" cy="158" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="277" y="152" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">锚点 (xk, yk)</text>

  <!-- 左下链条：一路升向 k -->
  <circle cx="100" cy="244" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="152" cy="219" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="204" cy="194" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 106 241 L 144 223" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 158 216 L 196 198" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 210 189 L 247 168" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="106" y="262" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">LIS(左下)：k 的前缀链</text>

  <!-- 右上链条：从 k 继续向上 -->
  <circle cx="316" cy="128" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="368" cy="103" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="420" cy="78" r="5" fill="#446688" filter="url(#rough2)"/>
  <path d="M 270 149 L 308 131" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 322 124 L 360 107" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 374 98 L 412 83" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="330" y="146" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">LIS(右上)：k 的后缀链</text>

  <!-- 底部公式 -->
  <rect x="40" y="284" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = LIS(左下) + 1 + LIS(右上)</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">传递性：k 前的点必在左下、k 后的点必在右上，两段互不干扰</text>
  <path d="M 260 278 L 260 282" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
</svg>
