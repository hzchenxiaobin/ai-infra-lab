<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [10, 12, 13, 14, 15] → 答案 11</text>

  <!-- sorted array -->
  <text x="52" y="76" font-size="11.5" fill="#555" filter="url(#rough2)">排序后：</text>
  <rect x="118" y="54" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="76" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">10</text>
  <rect x="166" y="54" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="188" y="76" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">12</text>
  <rect x="214" y="54" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="76" text-anchor="middle" font-size="13.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="262" y="54" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="284" y="76" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">14</text>
  <rect x="310" y="54" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="76" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">15</text>

  <path d="M 236 42 L 236 50" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="236" y="34" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">中位数 m = 13</text>

  <!-- palindrome candidates -->
  <rect x="60" y="118" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p_lo = 11（≤ 13 的最大回文数）</text>
  <rect x="270" y="118" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="365" y="140" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">p_hi = 22（≥ 13 的最小回文数）</text>

  <!-- cost table -->
  <text x="48" y="182" font-size="11.5" fill="#555" filter="url(#rough2)">只需比较两个候选的代价：</text>

  <rect x="45" y="192" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">y</text>
  <rect x="99" y="192" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">|10−y|</text>
  <rect x="165" y="192" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">|12−y|</text>
  <rect x="231" y="192" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">|13−y|</text>
  <rect x="297" y="192" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="328" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">|14−y|</text>
  <rect x="363" y="192" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="394" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">|15−y|</text>
  <rect x="429" y="192" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="462" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">cost</text>

  <rect x="45" y="226" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="99" y="226" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="246" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="165" y="226" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="246" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="231" y="226" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="246" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="297" y="226" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="246" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <rect x="363" y="226" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="246" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <rect x="429" y="226" width="66" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="246" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11 ✓</text>

  <rect x="45" y="260" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="280" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">22</text>
  <rect x="99" y="260" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="280" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">12</text>
  <rect x="165" y="260" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="280" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">10</text>
  <rect x="231" y="260" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="280" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">9</text>
  <rect x="297" y="260" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="280" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">8</text>
  <rect x="363" y="260" width="62" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="280" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">7</text>
  <rect x="429" y="260" width="66" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="280" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">46</text>

  <!-- result -->
  <rect x="90" y="312" width="340" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = min(11, 46) = 11 —— 全部改成回文数 11</text>

  <!-- note -->
  <rect x="48" y="366" width="424" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">若 m 本身就是回文数（示例 1 的 m = 3、示例 3 的 m = 22），</text>
  <text x="260" y="408" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">二分恰好命中 m，cost(m) 即最优答案，无需再看另一侧。</text>
</svg>
