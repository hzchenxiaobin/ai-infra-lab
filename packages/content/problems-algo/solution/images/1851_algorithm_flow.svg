<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双排序 + 游标入堆 + 弹无效 + 取堆顶</text>

  <!-- Step 1: sort -->
  <rect x="70" y="44" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① intervals 按 left 升序排；queries 升序排（带原下标 j）</text>

  <path d="M 270 78 L 270 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="70" y="98" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② ptr = 0；最小堆 heap = ∅（按 length 排序）</text>

  <path d="M 270 132 L 270 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision -->
  <polygon points="270,152 388,196 270,240 152,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有查询?</text>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(按 q 升序)</text>

  <!-- No branch -> end -->
  <path d="M 388 196 L 460 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="188" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Yes branch down -->
  <path d="M 270 240 L 270 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="252" font-size="11" fill="#82b366" filter="url(#rough2)">是</text>

  <!-- Step 3: cursor advance while -->
  <rect x="40" y="260" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ while ptr &lt; n 且 intervals[ptr].left ≤ q:</text>
  <text x="270" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">len = r−l+1；heap.push((len, r))；ptr++</text>

  <path d="M 270 300 L 270 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: pop invalid while -->
  <rect x="40" y="318" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ while heap 非空 且 heap.top().right &lt; q:</text>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">heap.pop()   （r &lt; q 永久失效，弹出即弃）</text>

  <path d="M 270 358 L 270 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: empty check -->
  <polygon points="270,376 360,406 270,436 180,406" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">heap 为空?</text>

  <!-- Yes -> -1 -->
  <path d="M 180 406 L 120 406 L 120 450" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="398" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="64" y="452" width="112" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="470" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">answer[j] = -1</text>

  <!-- No -> heap top -->
  <path d="M 270 436 L 270 450" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="432" font-size="11" fill="#82b366" filter="url(#rough2)">否</text>

  <rect x="190" y="452" width="300" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="470" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer[j] = heap.top().length</text>

  <!-- loop back arrow -->
  <path d="M 490 466 L 510 466 L 510 196 L 388 196" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="330" text-anchor="middle" font-size="10" fill="#888" transform="rotate(90 510 330)" filter="url(#rough2)">下一个查询</text>

  <!-- summary note -->
  <text x="270" y="520" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序 O(n log n + k log k) + 每个区间入堆 1 次 + 出堆至多 1 次 = O((n+k) log n)</text>
</svg>
