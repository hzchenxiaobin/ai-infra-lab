<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/>
    </filter>
    <marker id="arR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fdfcf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：6×6 迷宫的 11 步最短路径</text>
  <path d="M 230 40 Q 430 48 630 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: 6x6 grid ===== -->
  <!-- col labels -->
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="113" y="100">0</text><text x="159" y="100">1</text><text x="205" y="100">2</text>
    <text x="251" y="100">3</text><text x="297" y="100">4</text><text x="343" y="100">5</text>
  </g>
  <text x="80" y="86" font-size="10" fill="#888">列→</text>
  <!-- row labels -->
  <g font-size="11" fill="#666" text-anchor="end">
    <text x="84" y="137">0</text><text x="84" y="183">1</text><text x="84" y="229">2</text>
    <text x="84" y="275">3</text><text x="84" y="321">4</text><text x="84" y="367">5</text>
  </g>
  <text x="74" y="110" font-size="10" fill="#888">行</text>
  <text x="74" y="122" font-size="10" fill="#888">↓</text>

  <!-- grid cells: empty + snake-corridor tint -->
  <!-- corridor cells (snake ever occupies): (0,0)(0,1)(0,2)(0,3)(1,2)(1,3)(2,3)(3,3)(4,3)(4,4)(4,5)(5,3)(5,4)(5,5) -->
  <g filter="url(#sk2)">
    <!-- all cells base -->
    <rect x="90" y="110" width="276" height="276" fill="#fafafa" stroke="#cfcfcf" stroke-width="1"/>
    <!-- corridor tint (light blue) -->
    <rect x="90"  y="110" width="46" height="46" fill="#eef3fb"/>
    <rect x="136" y="110" width="46" height="46" fill="#eef3fb"/>
    <rect x="182" y="110" width="46" height="46" fill="#eef3fb"/>
    <rect x="228" y="110" width="46" height="46" fill="#eef3fb"/>
    <rect x="182" y="156" width="46" height="46" fill="#eef3fb"/>
    <rect x="228" y="156" width="46" height="46" fill="#eef3fb"/>
    <rect x="228" y="202" width="46" height="46" fill="#eef3fb"/>
    <rect x="228" y="248" width="46" height="46" fill="#eef3fb"/>
    <rect x="228" y="294" width="46" height="46" fill="#eef3fb"/>
    <rect x="274" y="294" width="46" height="46" fill="#eef3fb"/>
    <rect x="320" y="294" width="46" height="46" fill="#eef3fb"/>
    <rect x="228" y="340" width="46" height="46" fill="#eef3fb"/>
    <rect x="274" y="340" width="46" height="46" fill="#eef3fb"/>
    <rect x="320" y="340" width="46" height="46" fill="#eef3fb"/>
    <!-- obstacles (dark) -->
    <rect x="320" y="110" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="90"  y="156" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="136" y="156" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="274" y="156" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="274" y="202" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="320" y="202" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="182" y="248" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="274" y="248" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="136" y="294" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="182" y="294" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="136" y="340" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <rect x="182" y="340" width="46" height="46" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
    <!-- grid lines -->
    <path d="M 90 156 H 366 M 90 202 H 366 M 90 248 H 366 M 90 294 H 366 M 90 340 H 366
             M 136 110 V 386 M 182 110 V 386 M 228 110 V 386 M 274 110 V 386 M 320 110 V 386"
          stroke="#cfcfcf" stroke-width="1" fill="none"/>
    <rect x="90" y="110" width="276" height="276" fill="none" stroke="#888" stroke-width="1.6"/>
  </g>
  <text x="333" y="138" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="113" y="184" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="159" y="184" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="297" y="184" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="297" y="230" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="343" y="230" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="205" y="276" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="297" y="276" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="159" y="322" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="205" y="322" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="159" y="368" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>
  <text x="205" y="368" text-anchor="middle" font-size="12" fill="#ddd" font-weight="bold">1</text>

  <!-- path line (grey) connecting anchors -->
  <path d="M 113 133 L 159 133 L 205 133 L 251 133 L 251 179 L 251 225 L 251 271 L 251 317 L 297 317 L 297 363"
        stroke="#b0b0b0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#sk2)"/>

  <!-- numbered anchor dots: H=blue, V=green -->
  <!-- step 0 (0,0) H -->
  <g filter="url(#sk2)"><circle cx="113" cy="133" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="113" y="137" text-anchor="middle" font-size="10" fill="#34506e" font-weight="bold">0</text>
  <!-- step 1 (0,1) H -->
  <g filter="url(#sk2)"><circle cx="159" cy="133" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="159" y="137" text-anchor="middle" font-size="10" fill="#34506e" font-weight="bold">1</text>
  <!-- step 2 (0,2) H -->
  <g filter="url(#sk2)"><circle cx="205" cy="133" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="205" y="137" text-anchor="middle" font-size="10" fill="#34506e" font-weight="bold">2</text>
  <!-- step 3 (0,2) V rotation -->
  <g filter="url(#sk2)"><circle cx="221" cy="149" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="221" y="153" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">3</text>
  <path d="M 213 141 A 10 10 0 1 1 215 149" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk2)"/>

  <!-- step 4 (0,3) V -->
  <g filter="url(#sk2)"><circle cx="251" cy="133" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="251" y="137" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">4</text>
  <!-- step 5 (1,3) V -->
  <g filter="url(#sk2)"><circle cx="251" cy="179" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="251" y="183" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">5</text>
  <!-- step 6 (2,3) V -->
  <g filter="url(#sk2)"><circle cx="251" cy="225" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="251" y="229" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">6</text>
  <!-- step 7 (3,3) V -->
  <g filter="url(#sk2)"><circle cx="251" cy="271" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="251" y="275" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">7</text>
  <!-- step 8 (4,3) V -->
  <g filter="url(#sk2)"><circle cx="251" cy="317" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="251" y="321" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">8</text>
  <!-- step 9 (4,3) H rotation -->
  <g filter="url(#sk2)"><circle cx="267" cy="333" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="267" y="337" text-anchor="middle" font-size="9" fill="#34506e" font-weight="bold">9</text>
  <path d="M 259 325 A 10 10 0 1 1 261 333" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk2)"/>

  <!-- step 10 (4,4) H -->
  <g filter="url(#sk2)"><circle cx="297" cy="317" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="297" y="321" text-anchor="middle" font-size="9.5" fill="#34506e" font-weight="bold">10</text>
  <!-- step 11 (5,4) H target -->
  <g filter="url(#sk2)"><circle cx="297" cy="363" r="11" fill="#fff0f3" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="297" y="367" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">11</text>
  <text x="297" y="392" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⭐ 终点</text>
  <text x="113" y="108" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">起点</text>

  <!-- legend -->
  <g filter="url(#sk2)">
    <rect x="90" y="404" width="276" height="44" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  </g>
  <g filter="url(#sk2)"><circle cx="110" cy="426" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="124" y="430" font-size="10" fill="#444">水平 H</text>
  <g filter="url(#sk2)"><circle cx="178" cy="426" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="192" y="430" font-size="10" fill="#444">竖直 V</text>
  <text x="240" y="430" font-size="13" fill="#d6a040" font-weight="bold">⟳</text>
  <text x="254" y="430" font-size="10" fill="#444">旋转</text>
  <rect x="296" y="420" width="12" height="12" fill="#6a6a6a" stroke="#444" stroke-width="1" filter="url(#sk2)"/>
  <text x="312" y="430" font-size="10" fill="#444">障碍</text>
  <rect x="346" y="420" width="12" height="12" fill="#eef3fb" stroke="#446688" stroke-width="1" filter="url(#sk2)"/>
  <text x="362" y="430" font-size="9.5" fill="#444">通道</text>

  <!-- ===== RIGHT: step list ===== -->
  <g filter="url(#sk)">
    <rect x="396" y="90" width="432" height="420" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="612" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">逐步状态转移（锚点 + 朝向）</text>

  <g font-size="11" fill="#444">
    <!-- header -->
    <text x="416" y="142" font-weight="bold" fill="#666">步</text>
    <text x="448" y="142" font-weight="bold" fill="#666">移动</text>
    <text x="520" y="142" font-weight="bold" fill="#666">状态 (r,c,o)</text>
    <text x="640" y="142" font-weight="bold" fill="#666">说明</text>
    <line x1="412" y1="148" x2="812" y2="148" stroke="#bcd0ef" stroke-width="1" filter="url(#sk2)"/>

    <!-- step 0 -->
    <text x="420" y="166" fill="#446688" font-weight="bold">0</text>
    <text x="448" y="166">起点</text>
    <text x="520" y="166" fill="#446688">(0,0,0)H</text>
    <text x="640" y="166" fill="#888">左上角水平放置</text>

    <!-- step 1 -->
    <text x="420" y="188" fill="#446688" font-weight="bold">1</text>
    <text x="448" y="188">右 →</text>
    <text x="520" y="188" fill="#446688">(0,1,0)H</text>
    <text x="640" y="188" fill="#888">占 (0,1)(0,2)</text>

    <!-- step 2 -->
    <text x="420" y="210" fill="#446688" font-weight="bold">2</text>
    <text x="448" y="210">右 →</text>
    <text x="520" y="210" fill="#446688">(0,2,0)H</text>
    <text x="640" y="210" fill="#888">占 (0,2)(0,3)</text>

    <!-- step 3 rotation -->
    <text x="420" y="232" fill="#d6a040" font-weight="bold">3</text>
    <text x="448" y="232" fill="#d6a040" font-weight="bold">⟳ 顺时针</text>
    <text x="520" y="232" fill="#4a7a3a">(0,2,1)V</text>
    <text x="640" y="232" fill="#888">下方两格空，转竖直</text>

    <!-- step 4 -->
    <text x="420" y="254" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="448" y="254">右 →</text>
    <text x="520" y="254" fill="#4a7a3a">(0,3,1)V</text>
    <text x="640" y="254" fill="#888">竖直整体右移</text>

    <!-- step 5 -->
    <text x="420" y="276" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="448" y="276">下 ↓</text>
    <text x="520" y="276" fill="#4a7a3a">(1,3,1)V</text>
    <text x="640" y="276" fill="#888">占 (1,3)(2,3)</text>

    <!-- step 6 -->
    <text x="420" y="298" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="448" y="298">下 ↓</text>
    <text x="520" y="298" fill="#4a7a3a">(2,3,1)V</text>
    <text x="640" y="298" fill="#888">占 (2,3)(3,3)</text>

    <!-- step 7 -->
    <text x="420" y="320" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="448" y="320">下 ↓</text>
    <text x="520" y="320" fill="#4a7a3a">(3,3,1)V</text>
    <text x="640" y="320" fill="#888">占 (3,3)(4,3)</text>

    <!-- step 8 -->
    <text x="420" y="342" fill="#4a7a3a" font-weight="bold">8</text>
    <text x="448" y="342">下 ↓</text>
    <text x="520" y="342" fill="#4a7a3a">(4,3,1)V</text>
    <text x="640" y="342" fill="#888">占 (4,3)(5,3)</text>

    <!-- step 9 rotation -->
    <text x="420" y="364" fill="#d6a040" font-weight="bold">9</text>
    <text x="448" y="364" fill="#d6a040" font-weight="bold">⟲ 逆时针</text>
    <text x="520" y="364" fill="#446688">(4,3,0)H</text>
    <text x="640" y="364" fill="#888">右侧两格空，转水平</text>

    <!-- step 10 -->
    <text x="420" y="386" fill="#446688" font-weight="bold">10</text>
    <text x="448" y="386">右 →</text>
    <text x="520" y="386" fill="#446688">(4,4,0)H</text>
    <text x="640" y="386" fill="#888">占 (4,4)(4,5)</text>

    <!-- step 11 -->
    <text x="420" y="408" fill="#b85450" font-weight="bold">11</text>
    <text x="448" y="408">下 ↓</text>
    <text x="520" y="408" fill="#b85450" font-weight="bold">(5,4,0)H ⭐</text>
    <text x="640" y="408" fill="#888">命中终点 (n−1,n−2,0)</text>
  </g>

  <!-- summary box -->
  <g filter="url(#sk2)">
    <rect x="412" y="424" width="400" height="70" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.1" stroke-dasharray="5 3"/>
  </g>
  <text x="612" y="446" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">水平段（步 0-2、10-11）+ 竖直段（步 4-8）</text>
  <text x="612" y="464" text-anchor="middle" font-size="11" fill="#7a5415">两次旋转（步 3、9）衔接两种朝向的通道</text>
  <text x="612" y="482" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">BFS 首次到达终点 → 11 即为最少移动次数</text>
</svg>
