<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双状态 DP：末尾选 A / 选 B 并列维护，逐位二选一续接</text>

  <!-- i-1 label -->
  <text x="100" y="86" text-anchor="middle" font-size="11" fill="#888">位置 i − 1</text>
  <!-- i label -->
  <text x="430" y="86" text-anchor="middle" font-size="11" fill="#888">位置 i</text>

  <!-- Left state boxes (i-1) -->
  <rect x="36" y="104" width="132" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="102" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp[i−1][0]  选 a₁=3</text>
  <text x="102" y="142" text-anchor="middle" font-size="12" fill="#333">= 2</text>

  <rect x="36" y="184" width="132" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="102" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dp[i−1][1]  选 b₁=2</text>
  <text x="102" y="222" text-anchor="middle" font-size="12" fill="#333">= 2</text>

  <!-- Right state boxes (i) -->
  <rect x="372" y="104" width="132" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="438" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp[i][0]  选 a₂=2</text>
  <text x="438" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 3</text>

  <rect x="372" y="184" width="132" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="438" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dp[i][1]  选 b₂=3</text>
  <text x="438" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 3</text>

  <!-- Transitions -->
  <!-- Lt -> Rt : a>=a_prev  BLOCKED -->
  <path d="M 168 122 Q 270 92 372 122" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="88" text-anchor="middle" font-size="10" fill="#b85450">a₂=2 ≥ a₁=3 ?  ✗（续不上）</text>

  <!-- Lb -> Rb : b>=b_prev  OK -->
  <path d="M 168 216 Q 270 246 372 216" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a">b₂=3 ≥ b₁=2 ✓  → 2+1 = 3</text>

  <!-- Lt -> Rb : b>=a_prev  OK (cross down) -->
  <path d="M 168 150 C 250 150 290 210 372 210" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="232" y="186" font-size="10" fill="#4a7a3a">b₂=3 ≥ a₁=3 ✓ →3</text>

  <!-- Lb -> Rt : a>=b_prev  OK (cross up) -->
  <path d="M 168 188 C 250 188 290 128 372 128" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="170" font-size="10" fill="#4a7a3a">a₂=2 ≥ b₁=2 ✓ →3</text>

  <!-- Legend / summary -->
  <rect x="24" y="288" width="492" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">每个位置只有「选 a」或「选 b」两种末尾 → 两个并列状态</text>
  <text x="270" y="326" text-anchor="middle" font-size="10" fill="#555">连续段只看相邻前驱 i−1；4 条转移分别判断 a/b 与 a₁/b₁ 的大小</text>
  <text x="270" y="340" text-anchor="middle" font-size="10" fill="#b85450">⚠ 若只存一个状态，i=2 选 a=2 时会漏掉「只能续 b₁」这条路径</text>
</svg>
