<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">流程：一趟扫描，树状数组先查后插</text>

  <!-- 开始框 -->
  <rect x="185" y="36" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">p = 0，插入 P[0]</text>
  <path d="M 260 68 L 260 80" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="185" y="82" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = nums[j]</text>
  <path d="M 260 112 L 260 124" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,126 345,158 260,190 175,158" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x == target ?</text>

  <!-- 是分支 -->
  <path d="M 175 158 L 133 158" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="68" y="143" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">p += 1</text>

  <!-- 否分支 -->
  <path d="M 345 158 L 387 158" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="392" y="143" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447" y="162" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">p −= 1</text>

  <!-- 汇合线 -->
  <path d="M 123 173 L 123 205 L 252 205" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 447 173 L 447 205 L 268 205" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 260 190 L 260 212" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 查询框（核心） -->
  <rect x="150" y="216" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans += query(p + n)</text>
  <text x="260" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">数左边严格小于 p 的前缀和个数</text>
  <path d="M 260 258 L 260 270" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 插入框 -->
  <rect x="150" y="272" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">插入 p（下标 p + n + 1）</text>

  <!-- 循环回边 -->
  <path d="M 370 288 L 478 288 L 478 97 L 341 97" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="280" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j+1 ≤ n，下一轮</text>

  <!-- 结束 -->
  <path d="M 260 304 L 260 316" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="318" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <!-- 警示气泡 -->
  <rect x="30" y="220" width="105" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="82" y="238" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 先查后插</text>
  <text x="82" y="254" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">别把自己数进去</text>
</svg>
