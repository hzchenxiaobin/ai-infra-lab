<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">树中心：最小偏心距 = ⌈d/2⌉（半径）</text>

  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">画出一条直径路径 u→v（图中 d = 4），c 为直径中点</text>

  <line x1="85" y1="120" x2="145" y2="120" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="175" y1="120" x2="235" y2="120" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="265" y1="120" x2="325" y2="120" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="355" y1="120" x2="415" y2="120" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="70" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="125" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">u</text>
  <circle cx="160" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="125" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">·</text>
  <circle cx="250" cy="120" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="250" y="125" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">c</text>
  <circle cx="340" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="125" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">·</text>
  <circle cx="430" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="125" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">v</text>

  <text x="250" y="94" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">直径中点 = 中心</text>

  <path d="M 70 145 L 70 153 L 250 153 L 250 145" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="160" y="170" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">dist(u,c) = d/2</text>
  <path d="M 250 145 L 250 153 L 430 153 L 430 145" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="340" y="170" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">dist(c,v) = d/2</text>

  <line x1="160" y1="135" x2="160" y2="205" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="160" cy="218" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="223" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="290" y="216" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">挂在半路上的点 x：</text>
  <text x="290" y="233" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">dist(x,u)=2，dist(x,v)=3 → ecc(x)=3 &gt; 2</text>

  <rect x="55" y="258" width="410" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">任意点 x：dist(u,x) + dist(x,v) ≥ d ⟹ ecc(x) ≥ ⌈d/2⌉（三角不等式）</text>

  <rect x="55" y="298" width="410" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">中心 c 的最远点恰是直径端点：ecc(c) = ⌈d/2⌉，下界取得到</text>

  <rect x="55" y="338" width="410" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">min ecc = 半径 = ⌈d/2⌉ ⟹ 跨界项最小 = ⌈d₁/2⌉ + ⌈d₂/2⌉ + 1</text>
</svg>
