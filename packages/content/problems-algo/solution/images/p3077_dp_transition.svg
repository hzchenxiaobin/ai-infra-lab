<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">状态转移：读入 x = nums[i−1] 时的五种迁移</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">外 = 当前元素不在任何段内（dp[i][j][0]）｜ 内 = 当前元素在第 j 段内（dp[i][j][1]），段从左数</text>

  <text x="112" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">吃 x 之前</text>
  <text x="448" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">吃 x 之后</text>

  <!-- left states -->
  <rect x="50" y="76" width="124" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="112" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">外 (j−1)</text>
  <rect x="50" y="136" width="124" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="112" y="157" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">内 (j−1)</text>
  <rect x="50" y="228" width="124" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="112" y="249" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">内 (j)</text>
  <rect x="50" y="288" width="124" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="112" y="309" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">外 (j)</text>

  <!-- right states -->
  <rect x="386" y="160" width="124" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="448" y="181" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">内 (j)</text>
  <rect x="386" y="258" width="124" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="448" y="279" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">外 (j)</text>

  <!-- transitions -->
  <path d="M 174 93 C 260 100, 320 140, 384 172" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="268" y="118" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">① 新开第 j 段：+c_j·x</text>

  <path d="M 174 153 C 250 160, 320 165, 384 172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="272" y="146" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">② 紧邻新开（相邻合法!）：+c_j·x</text>

  <path d="M 174 245 C 250 235, 320 212, 384 186" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="226" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 延伸第 j 段：+c_j·x</text>

  <path d="M 174 252 C 250 258, 320 266, 384 272" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="262" y="278" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">④ 结束第 j 段、跳过 x：+0</text>

  <path d="M 174 309 C 250 305, 320 296, 384 288" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="262" y="312" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">⑤ 跳过 x：+0</text>

  <!-- bottom note -->
  <rect x="30" y="332" width="500" height="48" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">起点：外(0) = 0，其余 = −∞；答案 = max(外(k), 内(k))（处理完全部 n 个元素后）。</text>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">② 是易漏点：两段相邻（如 [1,2]｜[3]）完全合法，题目只要求「不相交」——新开第 j 段的前驱可以是 内(j−1)。</text>
</svg>
