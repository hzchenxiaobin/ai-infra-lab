<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：每条 response 去重后累加 → 全局频率表</text>

  <!-- Response 0 -->
  <text x="30" y="62" font-size="11" fill="#888">response[0]</text>
  <rect x="30" y="68" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="87" text-anchor="middle" font-size="11" fill="#333">"i like cooler cooler"</text>
  <!-- arrow to set -->
  <path d="M 140 98 L 140 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- dedup set -->
  <rect x="60" y="116" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="135" text-anchor="middle" font-size="11" fill="#333">{i, like, cooler}</text>
  <text x="240" y="135" font-size="10" fill="#4a7a3a">去重!</text>

  <!-- Response 1 -->
  <text x="30" y="172" font-size="11" fill="#888">response[1]</text>
  <rect x="30" y="178" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="197" text-anchor="middle" font-size="11" fill="#333">"lock touch cool"</text>
  <path d="M 140 208 L 140 222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="226" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="245" text-anchor="middle" font-size="11" fill="#333">{lock, touch, cool}</text>

  <!-- Response 2 -->
  <text x="30" y="282" font-size="11" fill="#888">response[2]</text>
  <rect x="30" y="288" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="307" text-anchor="middle" font-size="11" fill="#333">"locker like touch"</text>
  <path d="M 140 318 L 140 332" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="336" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="355" text-anchor="middle" font-size="11" fill="#333">{locker, like, touch}</text>

  <!-- Arrow to cnt table -->
  <path d="M 260 200 L 310 200" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="194" text-anchor="middle" font-size="10" fill="#d6a040">累加</text>

  <!-- cnt table -->
  <rect x="320" y="120" width="210" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="142" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">cnt 频率表</text>
  <line x1="340" y1="150" x2="510" y2="150" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="168" font-size="11" fill="#333">cooler  → 1</text>
  <text x="350" y="186" font-size="11" fill="#333">lock    → 1</text>
  <text x="350" y="204" font-size="11" fill="#333">touch   → 2</text>
  <text x="350" y="222" font-size="11" fill="#999">cool    → 1</text>
  <text x="350" y="240" font-size="11" fill="#999">like    → 2</text>
  <text x="350" y="258" font-size="11" fill="#999">locker  → 1</text>
  <text x="350" y="276" font-size="11" fill="#999">i       → 1</text>

  <!-- highlight box -->
  <rect x="340" y="158" width="150" height="52" fill="none" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="300" text-anchor="middle" font-size="10" fill="#b85450">↑ features 相关的计数高亮</text>
</svg>
