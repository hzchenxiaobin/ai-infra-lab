<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心：后序剪枝 — 不足叶子先删，内部节点失全部孩子则级联删</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888">limit = −1 · 下传 limit − node.val · 叶子处 node.val &lt; limit 则删</text>

  <!-- Left: original tree -->
  <text x="130" y="62" text-anchor="middle" font-size="10" fill="#888">剪枝前</text>

  <!-- root 1 -->
  <circle cx="130" cy="88" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="94" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- level 1: 2 and -3 -->
  <circle cx="80" cy="158" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="164" text-anchor="middle" font-size="13" fill="#333">2</text>
  <circle cx="190" cy="158" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="164" text-anchor="middle" font-size="13" fill="#333">−3</text>

  <!-- edges level 1 -->
  <path d="M 116 104 L 92 142" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 144 104 L 178 142" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- level 2: -5 and 4 -->
  <circle cx="50" cy="228" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="50" y="234" text-anchor="middle" font-size="12" fill="#333">−5</text>
  <circle cx="160" cy="228" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="234" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- edges level 2 -->
  <path d="M 68 174 L 52 212" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 178 174 L 162 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- path sum labels -->
  <text x="50" y="259" text-anchor="middle" font-size="9" fill="#b85450">路径和 −2 &lt; −1 ✗</text>
  <text x="160" y="259" text-anchor="middle" font-size="9" fill="#4a7a3a">路径和 2 ≥ −1 ✓</text>

  <!-- step annotations -->
  <text x="80" y="146" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">② 级联删</text>
  <text x="50" y="251" text-anchor="middle" font-size="8" fill="#b85450">① 删</text>
  <text x="160" y="251" text-anchor="middle" font-size="8" fill="#4a7a3a">③ 留</text>

  <!-- divider -->
  <path d="M 265 72 L 265 260" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- arrow -->
  <path d="M 245 158 L 285 158" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="151" text-anchor="middle" font-size="9" fill="#666">剪枝</text>

  <!-- Right: pruned tree -->
  <text x="390" y="62" text-anchor="middle" font-size="10" fill="#888">剪枝后</text>

  <!-- root 1 -->
  <circle cx="390" cy="88" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="94" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- -3 (right child) -->
  <circle cx="390" cy="158" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="164" text-anchor="middle" font-size="13" fill="#333">−3</text>

  <!-- edge 1 -> -3 -->
  <path d="M 390 108 L 390 138" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 4 (left child of -3) -->
  <circle cx="360" cy="228" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="234" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- edge -3 -> 4 -->
  <path d="M 376 174 L 362 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- right side annotations -->
  <text x="455" y="100" font-size="9" fill="#b85450">✗ 节点 2：删除</text>
  <text x="455" y="116" font-size="9" fill="#b85450">✗ 节点 −5：删除</text>
  <text x="455" y="158" font-size="9" fill="#4a7a3a">✓ 节点 −3：保留</text>
  <text x="455" y="174" font-size="9" fill="#4a7a3a">  （有充足路径）</text>
  <text x="455" y="228" font-size="9" fill="#4a7a3a">✓ 节点 4：保留</text>
  <text x="455" y="244" font-size="9" fill="#4a7a3a">  （路径和 2 ≥ −1）</text>

  <!-- bottom: explanation boxes -->
  <rect x="30" y="278" width="240" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">limit 递减机制</text>
  <text x="45" y="318" font-size="9" fill="#555">dfs(node, limit) 下传 limit − node.val</text>
  <text x="45" y="335" font-size="9" fill="#555">叶子处：node.val &lt; limit</text>
  <text x="45" y="352" font-size="9" fill="#555">⟺ 路径和 &lt; 原始 limit → 删除</text>

  <rect x="290" y="278" width="240" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="298" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">级联删除</text>
  <text x="305" y="318" font-size="9" fill="#555">内部节点剪完孩子后：</text>
  <text x="305" y="335" font-size="9" fill="#555">左右都空 → 删除该节点</text>
  <text x="305" y="352" font-size="9" fill="#555">（所有原始路径已不足）</text>
</svg>
