<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">比赛规则：队首两人对决</text>

  <text x="42" y="62" font-size="12" fill="#666" filter="url(#rough2)">开局队列：</text>

  <path d="M 42 56 L 46 66" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="16" y="80" font-size="11" fill="#b85450" filter="url(#rough2)">队首</text>

  <rect x="40" y="68" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="86" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">玩家0</text>
  <text x="70" y="104" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">技能 4</text>

  <rect x="110" y="68" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">玩家1</text>
  <text x="140" y="104" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">技能 2</text>

  <rect x="180" y="68" width="60" height="46" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="86" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">玩家2</text>
  <text x="210" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">技能 6</text>

  <rect x="250" y="68" width="60" height="46" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">玩家3</text>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">技能 3</text>

  <rect x="320" y="68" width="60" height="46" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="86" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">玩家4</text>
  <text x="350" y="104" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">技能 9</text>

  <path d="M 70 118 C 70 140, 150 140, 190 150" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 118 C 140 140, 220 140, 250 150" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="152" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">玩家0（技能4） VS 玩家1（技能2）</text>

  <path d="M 260 192 L 260 206" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="204" font-size="12" fill="#b85450" filter="url(#rough2)">4 &gt; 2，玩家 0 胜！</text>

  <text x="42" y="238" font-size="12" fill="#666" filter="url(#rough2)">赛后队列：</text>

  <rect x="40" y="246" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="264" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">玩家0</text>
  <text x="70" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">技能 4</text>
  <text x="70" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">胜 · 留守队首</text>

  <rect x="110" y="246" width="60" height="46" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="264" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">玩家2</text>
  <text x="140" y="282" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">技能 6</text>

  <rect x="180" y="246" width="60" height="46" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="264" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">玩家3</text>
  <text x="210" y="282" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">技能 3</text>

  <rect x="250" y="246" width="60" height="46" fill="#fafafa" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">玩家4</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">技能 9</text>

  <rect x="320" y="246" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="264" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">玩家1</text>
  <text x="350" y="282" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">技能 2</text>
  <text x="350" y="308" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">负 · 排到队尾</text>

  <path d="M 380 269 C 440 269, 440 269, 480 269" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 480 269 L 480 91 L 386 91" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="452" y="122" font-size="11" fill="#8a6a20" filter="url(#rough2)" transform="rotate(-90 452 122)">去队尾重排</text>

  <rect x="30" y="324" width="460" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="12.5" fill="#8a3a34" filter="url(#rough2)">胜者留在队首迎战下一位；败者排到队列末尾重新排队</text>
</svg>
