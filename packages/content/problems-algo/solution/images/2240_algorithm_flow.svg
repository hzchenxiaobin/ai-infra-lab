<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 590" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="590" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：归一化 → 枚举钢笔 x → 整除算铅笔 → 累加</text>

  <!-- Start -->
  <rect x="190" y="44" width="160" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="19" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">开始</text>
  <path d="M 270 82 L 270 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: cost1 < cost2 ? -->
  <polygon points="270,104 370,150 270,196 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#444">cost1 &lt; cost2 ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#888">需否交换</text>

  <!-- Yes branch: swap -->
  <path d="M 370 150 L 392 150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="380" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">是</text>
  <rect x="394" y="128" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="459" y="148" text-anchor="middle" font-size="12" fill="#444">交换</text>
  <text x="459" y="164" text-anchor="middle" font-size="12" fill="#444">cost1 ↔ cost2</text>
  <!-- swap -> init (down then left) -->
  <path d="M 459 172 L 459 220 L 352 220" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- No branch label -->
  <text x="282" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Init box: x=0, ans=0 -->
  <rect x="190" y="208" width="160" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="235" text-anchor="middle" font-size="13" fill="#333">x = 0,  ans = 0</text>
  <path d="M 270 252 L 270 270" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision: x*cost1 <= total ? -->
  <polygon points="270,274 380,322 270,370 160,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#444">x · cost1 ≤ total ?</text>
  <text x="270" y="335" text-anchor="middle" font-size="10" fill="#888">还能买第 x 支钢笔</text>

  <!-- No branch: return ans (left) -->
  <path d="M 160 322 L 138 322" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="150" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="14" y="300" width="124" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="19" filter="url(#rough2)"/>
  <text x="76" y="327" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- Yes branch: down -->
  <text x="282" y="386" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 270 370 L 270 392" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- rem box -->
  <rect x="170" y="394" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="421" text-anchor="middle" font-size="13" fill="#333">rem = total − x · cost1</text>
  <path d="M 270 438 L 270 456" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Y box -->
  <rect x="170" y="458" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="485" text-anchor="middle" font-size="13" fill="#333">Y = ⌊ rem / cost2 ⌋</text>
  <path d="M 270 502 L 270 520" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans += Y+1 box -->
  <rect x="170" y="522" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="549" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans += Y + 1 ;  x += 1</text>

  <!-- loop back arrow: from ans box right -> up -> left to loop diamond right -->
  <path d="M 370 544 L 460 544 L 460 322 L 382 322" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="472" y="436" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 472 436)">回到判断</text>
</svg>
