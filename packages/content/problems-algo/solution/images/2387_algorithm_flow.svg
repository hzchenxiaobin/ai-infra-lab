<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分 value + 每行 bisect_right 计数</text>

  <!-- Step 1 -->
  <rect x="150" y="46" width="260" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">① 确定二分范围</text>
  <text x="280" y="85" text-anchor="middle" font-size="10.5" fill="#555">lo = min(各行首), hi = max(各行尾)</text>

  <path d="M 280 96 L 280 112" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="120" y="116" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">② 取中点 mid = (lo + hi) / 2</text>
  <text x="280" y="155" text-anchor="middle" font-size="10.5" fill="#555">在 value 数轴上对半切，往中位数方向逼近</text>

  <path d="M 280 166 L 280 182" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="100" y="186" width="360" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">③ 计数 cnt = Σ bisect_right(row, mid)</text>
  <text x="280" y="224" text-anchor="middle" font-size="10.5" fill="#555">每行有序 → 二分找首个 &gt; mid 的下标即 ≤mid 的个数</text>
  <text x="280" y="238" text-anchor="middle" font-size="10.5" fill="#555">N = m·n，target = N/2（即 N//2）</text>

  <path d="M 280 244 L 280 262" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,266 392,316 280,366 168,316" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt &gt; N/2 ?</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#b85450">即 cnt ≥ N/2+1</text>

  <!-- 是：hi=mid -->
  <path d="M 392 316 L 444 316" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="309" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是 ✓</text>
  <rect x="436" y="296" width="116" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="494" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">value 偏大</text>
  <text x="494" y="330" text-anchor="middle" font-size="10.5" fill="#555">hi = mid</text>

  <!-- 否：lo=mid+1 -->
  <path d="M 168 316 L 116 316" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="144" y="309" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否 ✗</text>
  <rect x="8" y="296" width="108" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="62" y="314" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">value 偏小</text>
  <text x="62" y="330" text-anchor="middle" font-size="10.5" fill="#555">lo = mid + 1</text>

  <!-- loop back -->
  <path d="M 494 296 L 494 210 L 460 210" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 62 296 L 62 210 L 100 210" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="280" y="258" text-anchor="middle" font-size="9.5" fill="#aaa">lo &lt; hi 时循环 ↑</text>

  <path d="M 280 366 L 280 392" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="304" y="384" font-size="10" fill="#aaa">lo == hi 结束</text>

  <!-- return -->
  <rect x="170" y="396" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="421" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">④ 返回 lo（即中位数）</text>

  <text x="280" y="456" text-anchor="middle" font-size="10" fill="#888">每轮 O(m log n)，共 O(log(max−min)) 轮</text>
</svg>
