<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：trees = [[1,1],[2,2],[2,0],[2,4],[3,3],[4,2]]</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">排序后 = [[1,1],[2,0],[2,2],[2,4],[3,3],[4,2]] → 下凸包 + 上凸包</text>

  <!-- ===== Lower hull table ===== -->
  <text x="30" y="70" font-size="11" fill="#4a7a3a" font-weight="bold">下凸包（从左到右扫描）</text>

  <!-- Header -->
  <rect x="25" y="78" width="50" height="22" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="50" y="93" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
  <rect x="75" y="78" width="65" height="22" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="107" y="93" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">点</text>
  <rect x="140" y="78" width="60" height="22" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="170" y="93" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">cross</text>
  <rect x="200" y="78" width="115" height="22" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="257" y="93" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">动作</text>
  <rect x="315" y="78" width="200" height="22" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="415" y="93" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">stack 之后</text>

  <!-- Row 1 -->
  <rect x="25" y="100" width="490" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="116" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="107" y="116" text-anchor="middle" font-size="10" fill="#333">[1,1]</text>
  <text x="170" y="116" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="257" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a">push</text>
  <text x="415" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[1,1]</text>

  <!-- Row 2 -->
  <rect x="25" y="124" width="490" height="24" fill="#fff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="140" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="107" y="140" text-anchor="middle" font-size="10" fill="#333">[2,0]</text>
  <text x="170" y="140" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="257" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">push</text>
  <text x="415" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[1,1],[2,0]</text>

  <!-- Row 3 -->
  <rect x="25" y="148" width="490" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="164" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="107" y="164" text-anchor="middle" font-size="10" fill="#333">[2,2]</text>
  <text x="170" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a">+2</text>
  <text x="257" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a">push（左转）</text>
  <text x="415" y="164" text-anchor="middle" font-size="10" fill="#555">[1,1],[2,0],[2,2]</text>

  <!-- Row 4 -->
  <rect x="25" y="172" width="490" height="24" fill="#fff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="188" text-anchor="middle" font-size="10" fill="#555">4</text>
  <text x="107" y="188" text-anchor="middle" font-size="10" fill="#333">[2,4]</text>
  <text x="170" y="188" text-anchor="middle" font-size="10" fill="#d6a040">0</text>
  <text x="257" y="188" text-anchor="middle" font-size="10" fill="#d6a040">push（共线）</text>
  <text x="415" y="188" text-anchor="middle" font-size="10" fill="#555">…,[2,2],[2,4]</text>

  <!-- Row 5 (key: pop x2) -->
  <rect x="25" y="196" width="490" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="212" text-anchor="middle" font-size="10" fill="#555">5</text>
  <text x="107" y="212" text-anchor="middle" font-size="10" fill="#333">[3,3]</text>
  <text x="170" y="212" text-anchor="middle" font-size="9.5" fill="#b85450">−2,−2</text>
  <text x="257" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">pop×2, push</text>
  <text x="415" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[1,1],[2,0],[3,3]</text>

  <!-- Row 6 (key: pop x1) -->
  <rect x="25" y="220" width="490" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="236" text-anchor="middle" font-size="10" fill="#555">6</text>
  <text x="107" y="236" text-anchor="middle" font-size="10" fill="#333">[4,2]</text>
  <text x="170" y="236" text-anchor="middle" font-size="9.5" fill="#b85450">−4</text>
  <text x="257" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">pop, push</text>
  <text x="415" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[1,1],[2,0],[4,2]</text>

  <!-- Lower hull result -->
  <rect x="25" y="248" width="490" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="263" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">下凸包结果 = [1,1] → [2,0] → [4,2]（底部边界）</text>

  <!-- ===== Upper hull table ===== -->
  <text x="30" y="292" font-size="11" fill="#446688" font-weight="bold">上凸包（从右到左反向扫描）</text>

  <!-- Header -->
  <rect x="25" y="300" width="50" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="50" y="315" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
  <rect x="75" y="300" width="65" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="107" y="315" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">点</text>
  <rect x="140" y="300" width="60" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="170" y="315" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">cross</text>
  <rect x="200" y="300" width="115" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="257" y="315" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">动作</text>
  <rect x="315" y="300" width="200" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="415" y="315" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">stack 之后</text>

  <!-- Row 1 -->
  <rect x="25" y="322" width="490" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="338" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="107" y="338" text-anchor="middle" font-size="10" fill="#333">[4,2]</text>
  <text x="170" y="338" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="257" y="338" text-anchor="middle" font-size="10" fill="#446688">push</text>
  <text x="415" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[4,2]</text>

  <!-- Row 2 -->
  <rect x="25" y="346" width="490" height="24" fill="#fff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="362" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="107" y="362" text-anchor="middle" font-size="10" fill="#333">[3,3]</text>
  <text x="170" y="362" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="257" y="362" text-anchor="middle" font-size="10" fill="#446688">push</text>
  <text x="415" y="362" text-anchor="middle" font-size="10" fill="#555">[4,2],[3,3]</text>

  <!-- Row 3 -->
  <rect x="25" y="370" width="490" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="386" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="107" y="386" text-anchor="middle" font-size="10" fill="#333">[2,4]</text>
  <text x="170" y="386" text-anchor="middle" font-size="10" fill="#d6a040">0</text>
  <text x="257" y="386" text-anchor="middle" font-size="10" fill="#d6a040">push（共线）</text>
  <text x="415" y="386" text-anchor="middle" font-size="10" fill="#555">[4,2],[3,3],[2,4]</text>

  <!-- Row 4 -->
  <rect x="25" y="394" width="490" height="24" fill="#fff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="410" text-anchor="middle" font-size="10" fill="#555">4</text>
  <text x="107" y="410" text-anchor="middle" font-size="10" fill="#333">[2,2]</text>
  <text x="170" y="410" text-anchor="middle" font-size="10" fill="#4a7a3a">+2</text>
  <text x="257" y="410" text-anchor="middle" font-size="10" fill="#4a7a3a">push（左转）</text>
  <text x="415" y="410" text-anchor="middle" font-size="9.5" fill="#555">…,[2,4],[2,2]</text>

  <!-- Row 5 -->
  <rect x="25" y="418" width="490" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="50" y="434" text-anchor="middle" font-size="10" fill="#555">5</text>
  <text x="107" y="434" text-anchor="middle" font-size="10" fill="#333">[2,0]</text>
  <text x="170" y="434" text-anchor="middle" font-size="10" fill="#d6a040">0</text>
  <text x="257" y="434" text-anchor="middle" font-size="10" fill="#d6a040">push（共线）</text>
  <text x="415" y="434" text-anchor="middle" font-size="9.5" fill="#555">…,[2,2],[2,0]</text>

  <!-- Row 6 (key: pop x2) -->
  <rect x="25" y="442" width="490" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="458" text-anchor="middle" font-size="10" fill="#555">6</text>
  <text x="107" y="458" text-anchor="middle" font-size="10" fill="#333">[1,1]</text>
  <text x="170" y="458" text-anchor="middle" font-size="9.5" fill="#b85450">−2,−2</text>
  <text x="257" y="458" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">pop×2, push</text>
  <text x="415" y="458" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[4,2],[3,3],[2,4],[1,1]</text>

  <!-- Upper hull result -->
  <rect x="25" y="470" width="490" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="485" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">上凸包结果 = [4,2] → [3,3] → [2,4] → [1,1]（顶部边界，含边上点 [3,3]）</text>

  <!-- Final result -->
  <rect x="25" y="498" width="490" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="511" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">合并去重 → {[1,1],[2,0],[4,2],[3,3],[2,4]}（5 个点，含边上共线点 [3,3]）</text>
</svg>
