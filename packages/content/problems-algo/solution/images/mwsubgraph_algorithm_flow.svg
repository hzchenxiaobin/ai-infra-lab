<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：三次 Dijkstra + 枚举汇合点</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">正向图跑两源，反向图从 dest 跑一次即得所有 x→dest</text>

  <!-- Step 0: build graphs -->
  <rect x="36" y="64" width="488" height="46" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="56" y="84" font-size="11" fill="#444" font-weight="bold">① 建图</text>
  <text x="56" y="100" font-size="10" fill="#666">正向图 G（u→v, w）  +  反向图 G^R（v→u, w）  ← 仅边方向反转，权重不变</text>

  <path d="M 280 112 L 280 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: Dijkstra src1 -->
  <rect x="36" y="130" width="230" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="150" font-size="11" fill="#446688" font-weight="bold">② Dijkstra(G, src1)</text>
  <text x="56" y="166" font-size="10" fill="#446688">在正向图上从 src1 跑最短路</text>
  <text x="56" y="182" font-size="10" fill="#666">→ dist1[x] = src1 到 x 的最短距离</text>

  <!-- Step 2: Dijkstra src2 -->
  <rect x="294" y="130" width="230" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="314" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">③ Dijkstra(G, src2)</text>
  <text x="314" y="166" font-size="10" fill="#4a7a3a">在正向图上从 src2 跑最短路</text>
  <text x="314" y="182" font-size="10" fill="#666">→ dist2[x] = src2 到 x 的最短距离</text>

  <path d="M 280 196 L 280 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Dijkstra reverse from dest -->
  <rect x="36" y="214" width="488" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="234" font-size="11" fill="#d6a040" font-weight="bold">④ Dijkstra(G^R, dest)   ← 关键一步</text>
  <text x="56" y="250" font-size="10" fill="#d6a040">在反向图上从 dest 跑最短路</text>
  <text x="56" y="266" font-size="10" fill="#666">→ distDest[x] = G^R 中 dest 到 x 的距离 = G 中 x 到 dest 的最短距离 d(x,dest)</text>

  <path d="M 280 280 L 280 294" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: enumerate x -->
  <rect x="36" y="298" width="488" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="318" font-size="11" fill="#b85450" font-weight="bold">⑤ 枚举汇合点 x ∈ [0, n)</text>
  <text x="56" y="336" font-size="10" fill="#666">对每个 x，若 dist1[x] / dist2[x] / distDest[x] 均有限：</text>
  <text x="56" y="352" font-size="10" fill="#444" font-weight="bold">     ans = min(ans, dist1[x] + dist2[x] + distDest[x])</text>
  <text x="56" y="368" font-size="9" fill="#888">若所有 x 都不满足（存在 INF），返回 -1</text>

  <path d="M 280 374 L 280 388" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="36" y="392" width="488" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">输出 ans（最小带权子图边权和）</text>
  <text x="280" y="428" text-anchor="middle" font-size="9" fill="#666">三次 Dijkstra 各 O(E log V)，枚举 O(V)，总计 O(E log V)</text>

  <text x="280" y="450" text-anchor="middle" font-size="9" fill="#888">边权为正 → Dijkstra 适用；无需 Bellman-Ford</text>
</svg>
