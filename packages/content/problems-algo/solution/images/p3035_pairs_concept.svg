<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：字符全池化 —— 词长不变，字符任意重排</text>

  <!-- words row -->
  <text x="109" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">words[0]</text>
  <rect x="36" y="58" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="52" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="74" y="58" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="79" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="112" y="58" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="79" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="150" y="58" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="79" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>

  <text x="239" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">words[1]</text>
  <rect x="204" y="58" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="79" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="242" y="58" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <text x="335" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">words[2]</text>
  <rect x="300" y="58" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="338" y="58" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="354" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- arrow down -->
  <path d="M 260 100 L 260 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="118" font-size="11" fill="#888" filter="url(#rough2)">任意两处可交换（含词内）⇒ 字符自由流动</text>

  <!-- char pool -->
  <rect x="36" y="136" width="448" height="66" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="82" y="174" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">字符池</text>
  <rect x="130" y="155" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="162" y="155" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="194" y="155" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="226" y="155" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="258" y="155" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="290" y="155" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="322" y="155" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="354" y="155" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- pairs row -->
  <rect x="40" y="224" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115" y="246" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a × 4 → 2 对</text>
  <text x="198" y="246" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">+</text>
  <rect x="206" y="224" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="281" y="246" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b × 4 → 2 对</text>
  <path d="M 360 241 L 384 241" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="388" y="224" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="434" y="246" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">Q = 4 对</text>

  <!-- conclusion box -->
  <rect x="36" y="278" width="448" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">词长 L 的回文「造价」= ⌊L/2⌋ 对同字符（镜像位）</text>
  <text x="260" y="326" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">L 为奇数时再要 1 个任意字符当中间位（不用配对）</text>
  <text x="260" y="350" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">于是问题变成：预算 Q 对原料，能「买」下几个词？</text>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">贪心：造价升序逐个扣预算，扣不动为止</text>
</svg>
