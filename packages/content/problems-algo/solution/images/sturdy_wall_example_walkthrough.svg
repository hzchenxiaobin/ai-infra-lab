<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：height=2, width=3, bricks=[1,2]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">3 种行 → 3 个掩码 → SOS 超集和 g → 容斥 = 2</text>

  <!-- ===== Three rows with masks ===== -->
  <g font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="80"  y="64">[1,1,1]</text>
    <text x="260" y="64">[1,2]</text>
    <text x="440" y="64">[2,1]</text>
  </g>

  <!-- Row A: [1,1,1] at x=20..140 (cells 40 wide) -->
  <g filter="url(#rough2)">
    <rect x="20"  y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="60"  y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="100" y="70" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <g stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)">
    <line x1="60" y1="66" x2="60" y2="104"/>
    <line x1="100" y1="66" x2="100" y2="104"/>
  </g>
  <text x="80" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">掩码 11</text>

  <!-- Row B: [1,2] at x=200..320 -->
  <g filter="url(#rough2)">
    <rect x="200" y="70" width="40"  height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="240" y="70" width="80"  height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
  </g>
  <line x1="240" y1="66" x2="240" y2="104" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">掩码 01</text>

  <!-- Row C: [2,1] at x=380..500 -->
  <g filter="url(#rough2)">
    <rect x="380" y="70" width="80"  height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="460" y="70" width="40"  height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <line x1="460" y1="66" x2="460" y2="104" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="440" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">掩码 10</text>

  <!-- arrow down -->
  <line x1="280" y1="128" x2="280" y2="148" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="144" font-size="10" fill="#888">SOS 超集和</text>

  <!-- ===== g table ===== -->
  <text x="60" y="166" font-size="12" fill="#4a7a3a" font-weight="bold">g[T] = Σ_{m ⊇ T} cnt[m]：</text>
  <g filter="url(#rough2)">
    <!-- header row -->
    <rect x="60"  y="174" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="140" y="174" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="220" y="174" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="300" y="174" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="380" y="174" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <!-- value row -->
    <rect x="60"  y="200" width="80" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="140" y="200" width="80" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="220" y="200" width="80" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="300" y="200" width="80" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="380" y="200" width="80" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
  </g>
  <g font-size="12" fill="#333" font-weight="bold" text-anchor="middle">
    <text x="100" y="192">T</text>
    <text x="180" y="192">00</text>
    <text x="260" y="192">01</text>
    <text x="340" y="192">10</text>
    <text x="420" y="192">11</text>
    <text x="100" y="218">g[T]</text>
    <text x="180" y="218">3</text>
    <text x="260" y="218">2</text>
    <text x="340" y="218">2</text>
    <text x="420" y="218">1</text>
  </g>

  <!-- ===== Formula ===== -->
  <rect x="60" y="240" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">
    g[00]² − g[01]² − g[10]² + g[11]² = 9 − 4 − 4 + 1 = 2
  </text>

  <!-- ===== Two sturdy walls ===== -->
  <text x="60" y="296" font-size="12" fill="#446688" font-weight="bold">2 种坚实方案（行1在上、行2在下，公共接缝 ∅）：</text>

  <!-- Wall 1: [1,2] over [2,1] -->
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="120" y="312">方案1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="80"  y="318" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="120" y="318" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="80"  y="342" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="160" y="342" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
  </g>
  <g stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)">
    <line x1="120" y1="314" x2="120" y2="344"/>
    <line x1="160" y1="340" x2="160" y2="368"/>
  </g>
  <text x="120" y="380" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">01 &amp; 10 = 00 ✓</text>

  <!-- Wall 2: [2,1] over [1,2] -->
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="360" y="312">方案2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="320" y="318" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="400" y="318" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="320" y="342" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="360" y="342" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
  </g>
  <g stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)">
    <line x1="400" y1="314" x2="400" y2="344"/>
    <line x1="360" y1="340" x2="360" y2="368"/>
  </g>
  <text x="360" y="380" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">10 &amp; 01 = 00 ✓</text>

  <text x="280" y="400" text-anchor="middle" font-size="10.5" fill="#888">反例 ([1,2],[1,2])：01 &amp; 01 = 01 ≠ 0 → 位置1 贯穿，不坚实</text>
</svg>
