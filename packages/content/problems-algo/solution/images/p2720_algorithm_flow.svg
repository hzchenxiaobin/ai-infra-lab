<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：展开边 → 分组计数 → 全局分母 → 百分比 → 排序</text>

  <!-- Step 1 -->
  <rect x="36" y="66" width="150" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="86" font-size="11" fill="#446688" filter="url(#rough2)">① all_users</text>
  <text x="48" y="102" font-size="9" fill="#555" filter="url(#rough2)">SELECT user1</text>
  <text x="48" y="114" font-size="9" fill="#555" filter="url(#rough2)">UNION  user2</text>
  <text x="48" y="128" font-size="9" fill="#888" filter="url(#rough2)">→ 去重用户集</text>

  <!-- arrow 1->2 -->
  <path d="M188 101 L208 101" stroke="#446688" stroke-width="2" marker-end="url(#arrf)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="210" y="66" width="150" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="222" y="86" font-size="11" fill="#446688" filter="url(#rough2)">② meta</text>
  <text x="222" y="102" font-size="9" fill="#555" filter="url(#rough2)">COUNT(*) - 1</text>
  <text x="222" y="116" font-size="9" fill="#555" filter="url(#rough2)">AS denom</text>
  <text x="222" y="128" font-size="9" fill="#888" filter="url(#rough2)">→ 分母 = 总数-1</text>

  <!-- arrow 2->3 -->
  <path d="M362 101 L382 101" stroke="#446688" stroke-width="2" marker-end="url(#arrf)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="384" y="66" width="150" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396" y="86" font-size="11" fill="#4a7a3a" filter="url(#rough2)">③ edges（展开）</text>
  <text x="396" y="102" font-size="9" fill="#555" filter="url(#rough2)">Friends</text>
  <text x="396" y="114" font-size="9" fill="#555" filter="url(#rough2)">UNION ALL 交换列</text>
  <text x="396" y="128" font-size="9" fill="#888" filter="url(#rough2)">→ 双向边表（×2）</text>

  <!-- arrow 3 down to 4 -->
  <path d="M459 138 L459 210" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="466" y="178" font-size="9" fill="#4a7a3a" filter="url(#rough2)">分组</text>

  <!-- Step 4 (row2 right) -->
  <rect x="384" y="212" width="150" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396" y="232" font-size="11" fill="#4a7a3a" filter="url(#rough2)">④ GROUP BY u</text>
  <text x="396" y="248" font-size="9" fill="#555" filter="url(#rough2)">COUNT(*) AS cnt</text>
  <text x="396" y="262" font-size="9" fill="#555" filter="url(#rough2)">按用户折叠</text>
  <text x="396" y="276" font-size="9" fill="#888" filter="url(#rough2)">→ 每用户好友数</text>

  <!-- arrow 4 -> 5 (leftward) -->
  <path d="M382 247 L362 247" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="210" y="212" width="150" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="222" y="232" font-size="11" fill="#a07820" filter="url(#rough2)">⑤ 算百分比</text>
  <text x="222" y="248" font-size="9" fill="#555" filter="url(#rough2)">ROUND(</text>
  <text x="222" y="260" font-size="9" fill="#555" filter="url(#rough2)">cnt*100.0/(denom),2)</text>
  <text x="222" y="276" font-size="9" fill="#888" filter="url(#rough2)">→ percentage</text>

  <!-- arrow 5 -> 6 (leftward) -->
  <path d="M208 247 L188 247" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>

  <!-- Step 6 -->
  <rect x="36" y="212" width="150" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="232" font-size="11" fill="#b85450" filter="url(#rough2)">⑥ ORDER BY</text>
  <text x="48" y="248" font-size="9" fill="#555" filter="url(#rough2)">percentage DESC,</text>
  <text x="48" y="260" font-size="9" fill="#555" filter="url(#rough2)">user1 ASC</text>
  <text x="48" y="276" font-size="9" fill="#888" filter="url(#rough2)">→ 排序输出</text>

  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">💡 100.0 强制浮点防整数除法截断；(denom) 加括号防优先级把减号拆出</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">denom 已是 total-1 的值；分母来自 ① 的去重用户总数</text>
</svg>
