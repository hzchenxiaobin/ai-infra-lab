<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">周期定理：最小周期 p = n − lps[n−1]</text>

  <text x="40" y="60" font-size="12" fill="#666">s = "ababab"，n = 6</text>

  <rect x="100" y="72" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="148" y="72" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="196" y="72" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="244" y="72" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="292" y="72" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="340" y="72" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>

  <text x="124" y="124" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="172" y="124" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="220" y="124" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="268" y="124" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="316" y="124" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="364" y="124" text-anchor="middle" font-size="10" fill="#888">5</text>

  <path d="M100 66 L100 58 L292 58 L292 66" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="196" y="50" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前缀 "abab"（l = 4）</text>

  <path d="M148 130 L148 138 L340 138 L340 130" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="244" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">后缀 "abab"（相同！）</text>

  <text x="40" y="184" font-size="12" fill="#666">lps[5] = 4</text>

  <rect x="120" y="172" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="194" text-anchor="middle" font-size="12.5" fill="#444">前缀 == 后缀 → s 向右平移 (n−l)=2 位，重叠部分仍相同</text>

  <text x="40" y="248" font-size="12" fill="#666">平移 2 位对齐：</text>

  <rect x="120" y="232" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="168" y="232" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="216" y="232" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="264" y="232" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="312" y="232" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="254" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a</text>
  <rect x="360" y="232" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="254" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>

  <rect x="216" y="276" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="298" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a</text>
  <rect x="264" y="276" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="298" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>
  <rect x="312" y="276" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="298" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="360" y="276" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="298" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="408" y="276" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="298" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="456" y="276" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="298" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <text x="240" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ 平移 p=2 位</text>

  <path d="M216 320 L216 312 L336 312 L336 320" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="276" y="306" text-anchor="middle" font-size="10" fill="#b85450">重叠部分相同 → p=2 是周期</text>

  <rect x="80" y="340" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="361" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">p = n − lps[n−1] = 6 − 4 = 2，且 6 % 2 == 0 → true</text>
</svg>
