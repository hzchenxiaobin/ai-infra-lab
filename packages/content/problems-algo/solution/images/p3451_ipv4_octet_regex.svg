<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">合法 IPv4 = 恰好 4 段 × 合法八位组</text>

  <!-- anchors -->
  <text x="44" y="52" text-anchor="middle" font-size="9" fill="#888">锚定串首</text>
  <text x="44" y="82" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">^</text>
  <text x="308" y="52" text-anchor="middle" font-size="9" fill="#888">锚定串尾</text>
  <text x="308" y="82" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">$</text>

  <!-- valid ip octet boxes -->
  <rect x="58" y="52" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="74" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">192</text>
  <text x="122" y="74" text-anchor="middle" font-size="16" fill="#333">.</text>
  <rect x="130" y="52" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="74" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">168</text>
  <text x="194" y="74" text-anchor="middle" font-size="16" fill="#333">.</text>
  <rect x="202" y="52" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="74" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="250" y="74" text-anchor="middle" font-size="16" fill="#333">.</text>
  <rect x="258" y="52" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="277" y="74" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>

  <!-- valid callout -->
  <rect x="356" y="52" width="232" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="472" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a">✓ 四段全部命中八位组</text>
  <text x="472" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a">⇒ 192.168.1.1 合法</text>

  <!-- bracket under first 3 octets -->
  <path d="M 58 96 L 58 102 L 240 102 L 240 96" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">( 八位组 [.] ){3}</text>
  <text x="277" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">八位组</text>

  <!-- invalid examples -->
  <rect x="30" y="132" width="560" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="149" font-size="11" fill="#333">256.1.2.3</text>
  <text x="576" y="149" text-anchor="end" font-size="10" fill="#b85450">✗ 256 &gt; 255</text>

  <rect x="30" y="162" width="560" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="179" font-size="11" fill="#333">192.168.001.1</text>
  <text x="576" y="179" text-anchor="end" font-size="10" fill="#b85450">✗ 001 前导零</text>

  <rect x="30" y="192" width="560" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="209" font-size="11" fill="#333">192.168.1</text>
  <text x="576" y="209" text-anchor="end" font-size="10" fill="#b85450">✗ 只有 3 段</text>

  <rect x="30" y="222" width="560" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="239" font-size="11" fill="#333">192.168..1</text>
  <text x="576" y="239" text-anchor="end" font-size="10" fill="#b85450">✗ 空段（三条规则字面全漏）</text>

  <!-- octet pattern decomposition -->
  <text x="310" y="268" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">合法八位组：5 条互斥分支拼出 0–255（自带「无前导零」）</text>

  <rect x="30" y="278" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="82" y="298" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">25[0-5]</text>
  <text x="82" y="316" text-anchor="middle" font-size="10" fill="#8a6d1f">250–255</text>

  <rect x="142" y="278" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="194" y="298" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">2[0-4][0-9]</text>
  <text x="194" y="316" text-anchor="middle" font-size="10" fill="#8a6d1f">200–249</text>

  <rect x="254" y="278" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="306" y="298" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">1[0-9][0-9]</text>
  <text x="306" y="316" text-anchor="middle" font-size="10" fill="#8a6d1f">100–199</text>

  <rect x="366" y="278" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="418" y="298" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">[1-9][0-9]</text>
  <text x="418" y="316" text-anchor="middle" font-size="10" fill="#8a6d1f">10–99</text>

  <rect x="478" y="278" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="530" y="298" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold">[0-9]</text>
  <text x="530" y="316" text-anchor="middle" font-size="10" fill="#8a6d1f">0–9</text>

  <!-- full pattern formula -->
  <rect x="30" y="340" width="560" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="362" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">^( 八位组 [.] ){3} 八位组 $</text>
  <text x="310" y="380" text-anchor="middle" font-size="10.5" fill="#555">ip NOT REGEXP 此模式 ⇒ 无效：三条件 + 空段 + 垃圾字符，一网打尽</text>
</svg>
