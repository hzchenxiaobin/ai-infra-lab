<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：lo=7, hi=11, k=4</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先算每个数的权重，再按 (权重, 数值) 升序排序，取第 k=4 个</text>

  <!-- 上排标签 -->
  <text x="300" y="72" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">区间 [7, 11] 各数及其权重</text>

  <!-- 上排：原始顺序 7,8,9,10,11，centers x:100,200,300,400,500，box x=center-40, y=82, w=80, h=60 -->
  <!-- 7 / 16 -->
  <rect x="60" y="82" width="80" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="114" text-anchor="middle" font-size="22" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="100" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">权重 16</text>
  <!-- 8 / 3 -->
  <rect x="160" y="82" width="80" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="114" text-anchor="middle" font-size="22" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="200" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">权重 3</text>
  <!-- 9 / 19 -->
  <rect x="260" y="82" width="80" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="114" text-anchor="middle" font-size="22" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="300" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">权重 19</text>
  <!-- 10 / 6 -->
  <rect x="360" y="82" width="80" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="114" text-anchor="middle" font-size="22" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="400" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">权重 6</text>
  <!-- 11 / 14 -->
  <rect x="460" y="82" width="80" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="114" text-anchor="middle" font-size="22" fill="#446688" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="500" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">权重 14</text>

  <!-- 中间排序提示 -->
  <text x="300" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↓ 按 (权重, 数值) 升序排序 ↓</text>

  <!-- 下排标签 -->
  <text x="300" y="184" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">排序后 [8, 10, 11, 7, 9]</text>

  <!-- 下排：按权重升序 8(3),10(6),11(14),7(16),9(19)，第4个高亮 -->
  <!-- 8 / 3 -->
  <rect x="60" y="194" width="80" height="60" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="226" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="100" y="246" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">权重 3</text>
  <!-- 10 / 6 -->
  <rect x="160" y="194" width="80" height="60" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="226" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="200" y="246" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">权重 6</text>
  <!-- 11 / 14 -->
  <rect x="260" y="194" width="80" height="60" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="226" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="300" y="246" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">权重 14</text>
  <!-- 7 / 16  ← 第4个，高亮红 -->
  <rect x="360" y="194" width="80" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="226" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="400" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">权重 16</text>
  <!-- 9 / 19 -->
  <rect x="460" y="194" width="80" height="60" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="226" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="500" y="246" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">权重 19</text>

  <!-- k=4 指向第4个的箭头与标注 -->
  <path d="M 400 268 L 400 256" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="338" y="270" width="124" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">k=4 → 答案 7 ✓</text>

  <!-- 底部说明 -->
  <text x="300" y="316" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">权重序列 3, 6, 14, 16, 19 严格升序（无并列）；若有并列则按数值升序</text>
  <text x="300" y="332" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">注意 7 的权重 16 比 11 的 14 大，故排在 11 之后——排序按权重而非原数值大小</text>
</svg>
