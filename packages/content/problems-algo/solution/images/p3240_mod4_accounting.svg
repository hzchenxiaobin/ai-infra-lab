<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">记账：谁在欠「mod 4」的债？</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总 1 数 = 4a（四元组全 1）+ 2P（终态 11 对数）+ center，需 ≡ 0 (mod 4)</text>

  <!-- 面板 1：四元对称组 -->
  <rect x="30" y="56" width="460" height="102" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="78" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">① 四元对称组（4 格全等，组内 1 记为 c）</text>
  <rect x="48" y="90" width="24" height="24" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="72" y="90" width="24" height="24" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="48" y="114" width="24" height="24" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="72" y="114" width="24" height="24" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="84" y="152" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c = 2</text>
  <text x="112" y="98" font-size="11" fill="#333" filter="url(#rough2)">代价 min(c, 4−c)：c=0/4→0，c=1/3→1，c=2→2</text>
  <text x="112" y="116" font-size="11" fill="#333" filter="url(#rough2)">终态只能全 0 或全 1 → 贡献 0 或 4 个 1</text>
  <text x="112" y="138" font-size="11.5" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">≡ 0 (mod 4)：怎么翻都不欠债 ✓</text>

  <!-- 面板 2：二元组 -->
  <rect x="30" y="170" width="460" height="102" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="192" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">② 中间行/列二元组（2 格相等）</text>
  <rect x="48" y="204" width="24" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="72" y="204" width="24" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="48" y="234" width="24" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="72" y="234" width="24" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="208" font-size="11" fill="#333" filter="url(#rough2)">相等：00 → 贡献 0 个 1；11 → 贡献 2 个 1（0 次）</text>
  <text x="112" y="226" font-size="11" fill="#333" filter="url(#rough2)">不等：修 1 次即相等，终态 00 / 11 任选</text>
  <text x="112" y="252" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">flex 弹性 —— 全矩阵唯一的余数调节器</text>

  <!-- 面板 3：中心格 -->
  <rect x="30" y="284" width="460" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="306" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">③ 中心格（m、n 双奇）</text>
  <rect x="48" y="316" width="24" height="24" fill="#ffffff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="333" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="318" font-size="10.5" fill="#333" filter="url(#rough2)">贡献 0 或 1；其余结构的贡献全为偶数</text>
  <text x="112" y="338" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">它 = 1 则总数必为奇数 → 必须翻成 0（+1）</text>

  <!-- 底部：调配规则 -->
  <rect x="30" y="362" width="460" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">收尾调配：P 须为偶、center 须为 0</text>
  <text x="260" y="400" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">pair11 奇 &amp; flex&gt;0 → 挑一对修成 11（+0，白嫖）</text>
  <text x="260" y="418" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">pair11 奇 &amp; flex=0 → 硬改一对 11⇄00（+2）</text>
</svg>
