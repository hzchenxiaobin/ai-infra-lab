<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrDown" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root=[4,2,6,1,3,5,7]，target=2</text>

  <!-- ===== 步骤1: split(4,2) ===== -->
  <rect x="30" y="44" width="560" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="44" y="62" font-size="11" fill="#d6a040" font-weight="bold">① split(4, 2)</text>
  <text x="44" y="78" font-size="10" fill="#333">4 &gt; 2 → 归入大树，递归拆左子树 split(2, 2)</text>
  <text x="44" y="94" font-size="10" fill="#888">await [sL, tL] = split(left=2) …</text>

  <circle cx="500" cy="72" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <path d="M 488 78 L 470 96" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="462" cy="104" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="108" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="540" y="108" font-size="9" fill="#d6a040">↓拆左</text>

  <!-- 递归箭头 -->
  <path d="M 310 122 L 310 138" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="324" y="134" font-size="9" fill="#888">递归</text>

  <!-- ===== 步骤2: split(2,2) ===== -->
  <rect x="30" y="142" width="560" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="44" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">② split(2, 2)</text>
  <text x="44" y="176" font-size="10" fill="#333">2 ≤ 2 → 归入小树，递归拆右子树 split(3, 2)</text>
  <text x="44" y="192" font-size="10" fill="#888">await [sR, tR] = split(right=3) …</text>

  <circle cx="500" cy="170" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <path d="M 512 176 L 530 196" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="540" cy="204" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="208" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="446" y="208" font-size="9" fill="#4a7a3a">拆右↓</text>

  <path d="M 310 220 L 310 236" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="324" y="232" font-size="9" fill="#888">递归</text>

  <!-- ===== 步骤3: split(3,2) ===== -->
  <rect x="30" y="240" width="560" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="44" y="258" font-size="11" fill="#d6a040" font-weight="bold">③ split(3, 2)</text>
  <text x="44" y="274" font-size="10" fill="#333">3 &gt; 2 → 归入大树，递归拆左子树 split(null, 2)</text>
  <text x="44" y="290" font-size="10" fill="#888">split(null) = [∅, ∅]；root.left = ∅；return [∅, 3]</text>

  <circle cx="500" cy="268" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="272" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="448" y="288" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="468" y="302" text-anchor="middle" font-size="9" fill="#b85450">[∅,3]</text>

  <!-- 回溯箭头 -->
  <path d="M 310 318 L 310 334" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="324" y="330" font-size="9" fill="#888">回溯</text>

  <!-- ===== 步骤4: 回到 split(2,2) ===== -->
  <rect x="30" y="338" width="560" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="44" y="356" font-size="11" fill="#4a7a3a" font-weight="bold">②' 回到 split(2, 2)</text>
  <text x="44" y="372" font-size="10" fill="#333">[sR, tR] = [∅, 3]；root.right = sR = ∅（断开 3）</text>
  <text x="44" y="388" font-size="10" fill="#4a7a3a" font-weight="bold">return [2, 3]　→ 小树根=2，大树分支根=3</text>

  <circle cx="500" cy="366" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="370" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <path d="M 500 380 L 540 380" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="516" y="374" font-size="8" fill="#b85450">断</text>
  <circle cx="560" cy="380" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560" y="384" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <rect x="448" y="386" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="468" y="400" text-anchor="middle" font-size="9" fill="#b85450">[2,3]</text>

  <path d="M 310 416 L 310 432" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="324" y="428" font-size="9" fill="#888">回溯</text>

  <!-- ===== 步骤5: 回到 split(4,2) ===== -->
  <rect x="30" y="436" width="560" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="44" y="454" font-size="11" fill="#d6a040" font-weight="bold">①' 回到 split(4, 2)</text>
  <text x="44" y="470" font-size="10" fill="#333">[sL, tL] = [2, 3]；root.left = tL = 3（左子由 2 重接为 3）</text>
  <text x="44" y="486" font-size="10" fill="#d6a040" font-weight="bold">return [2, 4]　→ 最终：S 根=2，T 根=4 ✅</text>

  <circle cx="500" cy="464" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="468" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <path d="M 488 472 L 470 490" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="462" cy="498" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="502" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <path d="M 512 472 L 532 490" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="540" cy="498" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="502" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="500" y="518" text-anchor="middle" font-size="9" fill="#888">left: 2→3 重接</text>
</svg>
