<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：逐个相邻对算和、查集合</text>

  <!-- Example 1: [4,2,4] -> true -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1　nums = [4, 2, 4]　→　true</text>

  <g filter="url(#rough2)">
    <!-- step row header -->
    <rect x="40" y="68" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="70" y="86" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">步骤</text>
    <rect x="100" y="68" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="175" y="86" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">相邻对（和）</text>
    <rect x="250" y="68" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="325" y="86" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">seen 集合</text>
    <rect x="400" y="68" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="460" y="86" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">结果</text>

    <!-- step 1 -->
    <rect x="40" y="94" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="70" y="112" text-anchor="middle" font-size="11" fill="#333">i=0</text>
    <rect x="100" y="94" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="175" y="112" text-anchor="middle" font-size="11" fill="#333">[4,2] → 6</text>
    <rect x="250" y="94" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="325" y="112" text-anchor="middle" font-size="11" fill="#333">{ 6 }（新增）</text>
    <rect x="400" y="94" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="460" y="112" text-anchor="middle" font-size="11" fill="#888">继续</text>

    <!-- step 2 -->
    <rect x="40" y="120" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="70" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=1</text>
    <rect x="100" y="120" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="175" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[2,4] → 6</text>
    <rect x="250" y="120" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="325" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6 已存在 ✗</text>
    <rect x="400" y="120" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="460" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return true</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="170" x2="520" y2="170" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- Example 2: [1,2,3,4,5] -> false -->
  <text x="40" y="196" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2　nums = [1, 2, 3, 4, 5]　→　false</text>

  <g filter="url(#rough2)">
    <!-- pairs row -->
    <text x="40" y="224" font-size="11" fill="#888">相邻对：</text>
    <rect x="100" y="210" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="140" y="228" text-anchor="middle" font-size="11" fill="#333">[1,2]=3</text>
    <rect x="186" y="210" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="226" y="228" text-anchor="middle" font-size="11" fill="#333">[2,3]=5</text>
    <rect x="272" y="210" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="312" y="228" text-anchor="middle" font-size="11" fill="#333">[3,4]=7</text>
    <rect x="358" y="210" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="398" y="228" text-anchor="middle" font-size="11" fill="#333">[4,5]=9</text>

    <!-- seen set after all -->
    <text x="40" y="262" font-size="11" fill="#888">seen 全程：</text>
    <rect x="120" y="248" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="260" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{ 3, 5, 7, 9 }（无重复）</text>

    <!-- result -->
    <rect x="410" y="248" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="465" y="268" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">return false</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="300" x2="520" y2="300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- Example 3: [0,0,0] -> true -->
  <text x="40" y="326" font-size="12" fill="#4a7a3a" font-weight="bold">示例 3　nums = [0, 0, 0]　→　true</text>

  <g filter="url(#rough2)">
    <text x="40" y="354" font-size="11" fill="#888">相邻对：</text>
    <rect x="100" y="340" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="155" y="358" text-anchor="middle" font-size="11" fill="#333">[0,0]=0（新增）</text>
    <rect x="216" y="340" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="276" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[0,0]=0（重复）</text>

    <text x="350" y="354" font-size="11" fill="#888">起始下标不同，仍算两个子数组</text>

    <rect x="400" y="384" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="460" y="402" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return true</text>
  </g>
</svg>
