<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算</text>

  <!-- ========================================= -->
  <!-- ===== Example 1: nums = [1,1,2,3,5] ===== -->
  <!-- ========================================= -->
  <text x="28" y="52" font-size="11" fill="#444" font-weight="bold">示例 1：nums = [1,1,2,3,5]</text>

  <!-- index labels -->
  <text x="78" y="60" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="118" y="60" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="158" y="60" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="198" y="60" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="238" y="60" text-anchor="middle" font-size="9" fill="#888">4</text>

  <!-- array boxes: 0=deleted(red), 1-2=pair1(blue), 3-4=pair2(green) -->
  <rect x="58" y="64" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <line x1="62" y1="92" x2="94" y2="66" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <rect x="98" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="178" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="218" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- step annotations -->
  <text x="98" y="108" text-anchor="middle" font-size="9.5" fill="#b85450">①1==1 删</text>
  <text x="158" y="108" text-anchor="middle" font-size="9.5" fill="#446688">②1≠2 配对</text>
  <text x="228" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a">③3≠5 配对</text>

  <!-- arrow down -->
  <path d="M 168 96 L 168 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step detail rows -->
  <rect x="300" y="64" width="230" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="82" font-size="10.5" fill="#333">步骤① i=0: 1==1 → 删, ans=1</text>

  <rect x="300" y="92" width="230" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="110" font-size="10.5" fill="#333">步骤② i=1: 1≠2 → 配对, i→3</text>

  <rect x="300" y="120" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="138" font-size="10.5" fill="#333">步骤③ i=3: 3≠5 → 配对, i→5</text>

  <!-- result for example 1 -->
  <rect x="58" y="154" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="172" font-size="10.5" fill="#333" font-weight="bold">存活数组：</text>
  <rect x="150" y="160" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="160" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="160" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="250" y="160" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="310" y="176" font-size="10.5" fill="#4a7a3a" font-weight="bold">配对(1,2)(3,5) ✓</text>
  <text x="80" y="188" font-size="10" fill="#555">存活长 = 5−1 = 4（偶）→ 无需补删 → ans = 1</text>

  <!-- ============================================= -->
  <!-- ===== Example 2: nums = [1,1,2,2,3,3] ===== -->
  <!-- ============================================= -->
  <text x="28" y="218" font-size="11" fill="#444" font-weight="bold">示例 2：nums = [1,1,2,2,3,3]</text>

  <!-- index labels -->
  <text x="78" y="226" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="118" y="226" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="158" y="226" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="198" y="226" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="238" y="226" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="278" y="226" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- array boxes: 0=deleted(red), 1-2=pair1(blue), 3-4=pair2(green), 5=deleted(red, odd) -->
  <rect x="58" y="230" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="250" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <line x1="62" y1="258" x2="94" y2="232" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <rect x="98" y="230" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="250" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="230" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="250" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="178" y="230" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="250" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="218" y="230" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="250" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="258" y="230" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="250" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <line x1="262" y1="258" x2="294" y2="232" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- step annotations -->
  <text x="98" y="274" text-anchor="middle" font-size="9.5" fill="#b85450">①1==1 删</text>
  <text x="158" y="274" text-anchor="middle" font-size="9.5" fill="#446688">②1≠2 配对</text>
  <text x="228" y="274" text-anchor="middle" font-size="9.5" fill="#4a7a3a">③2≠3 配对</text>
  <text x="278" y="274" text-anchor="middle" font-size="9.5" fill="#b85450">④孤→删</text>

  <!-- arrow down -->
  <path d="M 168 262 L 168 286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step detail rows -->
  <rect x="300" y="230" width="230" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="248" font-size="10.5" fill="#333">步骤① i=0: 1==1 → 删, ans=1</text>

  <rect x="300" y="258" width="230" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="276" font-size="10.5" fill="#333">步骤② i=1: 1≠2 → 配对, i→3</text>

  <rect x="300" y="286" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="304" font-size="10.5" fill="#333">步骤③ i=3: 2≠3 → 配对, i→5</text>

  <rect x="300" y="314" width="230" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="332" font-size="10.5" fill="#333">步骤④ i=5: i+1≥n → 存活奇, 补删</text>

  <!-- result for example 2 -->
  <rect x="58" y="324" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="342" font-size="10.5" fill="#333" font-weight="bold">存活数组：</text>
  <rect x="150" y="330" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="330" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="330" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="250" y="330" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="310" y="346" font-size="10.5" fill="#4a7a3a" font-weight="bold">配对(1,2)(2,3) ✓</text>
  <text x="80" y="358" font-size="10" fill="#555">存活长 = 6−1 = 5（奇）→ 补删 → ans = 2</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="384" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：相邻相等→删前者(ans++,i+=1)；相邻不等→配对(i+=2)</text>
  <text x="270" y="418" text-anchor="middle" font-size="10" fill="#555">末尾存活长度为奇 → 补删一个使长度变偶</text>
</svg>
