<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="290" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心：两张频次表取交集（freq1==1 且 freq2==1）</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">words1=[leetcode,is,amazing,as,is]  words2=[amazing,leetcode,is]</text>

  <!-- freq1 表头 -->
  <rect x="80" y="72" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="89" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">freq1（词→次数）</text>

  <!-- freq1 条目：leetcode, amazing, is, as（按公共词序排列，减少连线交叉） -->
  <rect x="80" y="100" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">leetcode → 1</text>

  <rect x="80" y="134" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">amazing → 1</text>

  <rect x="80" y="168" width="140" height="30" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="188" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">is → 2</text>

  <rect x="80" y="202" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">as → 1</text>

  <!-- freq2 表头 -->
  <rect x="360" y="72" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="89" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">freq2（词→次数）</text>

  <!-- freq2 条目：leetcode, amazing, is（同序排列） -->
  <rect x="360" y="100" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">leetcode → 1</text>

  <rect x="360" y="134" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">amazing → 1</text>

  <rect x="360" y="168" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">is → 1</text>

  <!-- 连接线：同词横向连接，绿色实线=双侧均==1，灰色虚线=不满足 -->
  <line x1="220" y1="115" x2="352" y2="115" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="286" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 双侧==1</text>

  <line x1="220" y1="149" x2="352" y2="149" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="286" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 双侧==1</text>

  <line x1="220" y1="183" x2="352" y2="183" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="178" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 左=2</text>

  <line x1="220" y1="217" x2="262" y2="217" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="312" y="221" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 右侧缺失</text>

  <!-- 图例 -->
  <rect x="70" y="250" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="92" y="262" font-size="11" fill="#333" filter="url(#rough2)">本侧 freq==1</text>
  <rect x="200" y="250" width="14" height="14" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="222" y="262" font-size="11" fill="#333" filter="url(#rough2)">本侧 freq≠1</text>
  <line x1="330" y1="257" x2="360" y2="257" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="262" font-size="11" fill="#333" filter="url(#rough2)">双侧==1（计入）</text>
  <line x1="470" y1="257" x2="500" y2="257" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="510" y="262" font-size="11" fill="#333" filter="url(#rough2)">不满足</text>

  <!-- 箭头到结果 -->
  <line x1="290" y1="284" x2="290" y2="316" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="306" font-size="11" fill="#4a7a3a" filter="url(#rough2)">AND 取交集</text>

  <!-- 结果 -->
  <rect x="150" y="322" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="346" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">双侧 freq==1：leetcode, amazing</text>
  <text x="290" y="365" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">ans = 2</text>
</svg>
