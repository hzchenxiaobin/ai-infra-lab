<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：n = 5, start = 0</text>

  <!-- Step lines -->
  <text x="40" y="50" font-size="11.5" fill="#333">① ans = 0（初始）</text>
  <text x="40" y="68" font-size="11.5" fill="#333">② 遍历 i = 0..4，每轮 ans ^= start + 2*i</text>

  <!-- Table header row -->
  <rect x="50" y="82" width="500" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="158" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2*i</text>
  <text x="248" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="345" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans(异或前)</text>
  <text x="475" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans(异或后)</text>

  <!-- vertical separators -->
  <path d="M 108 82 L 108 294 M 208 82 L 208 294 M 288 82 L 288 294 M 402 82 L 402 294" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 0 -->
  <rect x="50" y="110" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="133" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="158" y="133" text-anchor="middle" font-size="11.5" fill="#888">0</text>
  <text x="248" y="133" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">0</text>
  <text x="345" y="133" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="475" y="133" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 1 -->
  <rect x="50" y="146" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="169" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="158" y="169" text-anchor="middle" font-size="11.5" fill="#888">2</text>
  <text x="248" y="169" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <text x="345" y="169" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="475" y="169" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 2 -->
  <rect x="50" y="182" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="205" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="158" y="205" text-anchor="middle" font-size="11.5" fill="#888">4</text>
  <text x="248" y="205" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">4</text>
  <text x="345" y="205" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="475" y="205" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- row 3 -->
  <rect x="50" y="218" width="500" height="36" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="241" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="158" y="241" text-anchor="middle" font-size="11.5" fill="#888">6</text>
  <text x="248" y="241" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">6</text>
  <text x="345" y="241" text-anchor="middle" font-size="11" fill="#999">6</text>
  <text x="475" y="241" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 4 (highlight) -->
  <rect x="50" y="254" width="500" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="277" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="158" y="277" text-anchor="middle" font-size="11.5" fill="#888">8</text>
  <text x="248" y="277" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">8</text>
  <text x="345" y="277" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="475" y="277" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">8</text>

  <!-- Result -->
  <text x="300" y="316" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">结果 ans = 0 ^ 2 ^ 4 ^ 6 ^ 8 = 8</text>

  <!-- color legend -->
  <rect x="100" y="328" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="126" y="340" font-size="10.5" fill="#555">nums[i]（当前元素）</text>
  <rect x="320" y="328" width="18" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="346" y="340" font-size="10.5" fill="#555">ans（折叠结果）</text>

  <!-- footer note -->
  <rect x="60" y="352" width="480" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#555">6 ^ 6 = 0：相同元素异或自消，是 XOR 的核心性质</text>
  <text x="300" y="382" text-anchor="middle" font-size="10" fill="#888">n = 5 个元素，i = 0..4 共 5 次异或折叠</text>
</svg>
