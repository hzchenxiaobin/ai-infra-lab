<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="440" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：以 leaf=7 为新根</text>
  <text x="440" y="42" text-anchor="middle" font-size="11" fill="#888">翻转路径 7 → 2 → 5 → 3 上的父子关系</text>

  <!-- ===== LEFT: original tree ===== -->
  <text x="220" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">原树（红色为翻转路径）</text>

  <!-- edges (draw before nodes so nodes overlay) -->
  <!-- 3-5 (path) -->
  <line x1="210" y1="84" x2="180" y2="108" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <!-- 3-1 -->
  <line x1="230" y1="84" x2="260" y2="108" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 5-6 -->
  <line x1="168" y1="132" x2="148" y2="158" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 5-2 (path) -->
  <line x1="185" y1="132" x2="195" y2="158" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <!-- 1-0 -->
  <line x1="262" y1="132" x2="248" y2="158" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 1-8 -->
  <line x1="278" y1="132" x2="292" y2="158" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 2-7 (path) -->
  <line x1="192" y1="182" x2="178" y2="208" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <!-- 2-4 -->
  <line x1="208" y1="182" x2="222" y2="208" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- nodes -->
  <!-- 3 (root, path) -->
  <circle cx="220" cy="72" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="220" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- 5 (path) -->
  <circle cx="175" cy="120" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="175" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- 1 -->
  <circle cx="270" cy="120" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- 6 -->
  <circle cx="140" cy="170" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>

  <!-- 2 (path) -->
  <circle cx="200" cy="170" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- 0 -->
  <circle cx="245" cy="170" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>

  <!-- 8 -->
  <circle cx="295" cy="170" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>

  <!-- 7 (leaf, path, new root) -->
  <circle cx="175" cy="220" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="175" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="175" y="248" text-anchor="middle" font-size="9" fill="#4a7a3a">leaf</text>

  <!-- 4 -->
  <circle cx="225" cy="220" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="224" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <!-- path label -->
  <rect x="80" y="278" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="220" y="298" text-anchor="middle" font-size="10" fill="#333">路径 7 ← 2 ← 5 ← 3（自底向上翻转）</text>

  <!-- off-path note -->
  <text x="220" y="334" text-anchor="middle" font-size="9" fill="#888">6、4、0、8、1 为非路径子树，随各自节点上提</text>

  <!-- ===== MIDDLE: transformation arrow ===== -->
  <path d="M 380 195 L 510 195" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="445" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">翻转 3 轮</text>
  <text x="445" y="208" text-anchor="middle" font-size="9" fill="#888">①7-2 ②2-5 ③5-3</text>

  <!-- ===== RIGHT: final tree ===== -->
  <text x="650" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">新树（7 为根）</text>

  <!-- edges -->
  <!-- 7-2 -->
  <line x1="650" y1="84" x2="650" y2="108" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 2-5 -->
  <line x1="638" y1="132" x2="624" y2="158" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 2-4 -->
  <line x1="662" y1="132" x2="700" y2="158" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 5-3 -->
  <line x1="610" y1="182" x2="596" y2="208" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 5-6 -->
  <line x1="634" y1="182" x2="648" y2="208" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 3-1 -->
  <line x1="590" y1="232" x2="590" y2="258" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 1-0 -->
  <line x1="580" y1="282" x2="566" y2="308" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 1-8 -->
  <line x1="600" y1="282" x2="614" y2="308" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- nodes -->
  <!-- 7 (new root) -->
  <circle cx="650" cy="72" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="650" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="676" y="74" font-size="9" fill="#4a7a3a">新根</text>

  <!-- 2 -->
  <circle cx="650" cy="120" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- 5 -->
  <circle cx="618" cy="170" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="618" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- 4 -->
  <circle cx="705" cy="170" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="705" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <!-- 3 -->
  <circle cx="590" cy="220" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- 6 -->
  <circle cx="655" cy="220" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="655" y="224" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>

  <!-- 1 -->
  <circle cx="590" cy="270" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="590" y="274" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <!-- 0 -->
  <circle cx="560" cy="320" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560" y="324" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>

  <!-- 8 -->
  <circle cx="620" cy="320" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620" y="324" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>

  <!-- annotation: 6 moved from 5.left to 5.right -->
  <path d="M 655 236 Q 670 250 660 262" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="700" y="252" font-size="9" fill="#d6a040">5 的左子 6</text>
  <text x="700" y="264" font-size="9" fill="#d6a040">挪到右子位</text>

  <!-- annotation: path reversed -->
  <rect x="510" y="358" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="650" y="378" text-anchor="middle" font-size="10" fill="#333">路径已变 7 → 2 → 5 → 3（父子逆转）</text>

  <text x="650" y="408" text-anchor="middle" font-size="9" fill="#888">输出：[7,2,null,5,4,3,6,null,null,null,1,null,null,0,8]</text>
</svg>
