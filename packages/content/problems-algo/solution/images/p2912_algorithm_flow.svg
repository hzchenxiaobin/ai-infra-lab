<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程</text>

  <!-- start -->
  <rect x="200" y="40" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 260 70 L 260 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="145" y="90" width="230" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="12" fill="#333">初始化 f = [1, 0, 0, 0]</text>
  <path d="M 260 126 L 260 144" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="140" y="146" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="12" fill="#333">第 t 轮（t = 1 … k）</text>
  <path d="M 260 182 L 260 200" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- transfer -->
  <rect x="75" y="202" width="370" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#333">按四个转移方程计算 g[0..3]，逐项取模</text>
  <path d="M 260 238 L 260 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update -->
  <rect x="190" y="258" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="12" fill="#333">f ← g</text>
  <path d="M 260 294 L 260 312" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="260,312 350,346 260,380 170,346" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="11" fill="#333">k 轮完成？</text>
  <!-- no: loop back -->
  <path d="M 170 346 C 60 346 60 166 136 166" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="336" text-anchor="middle" font-size="10" fill="#b85450">否，下一轮</text>
  <!-- yes -->
  <path d="M 260 380 L 260 398" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="394" font-size="10" fill="#4a7a3a">是</text>

  <!-- pick f[j] -->
  <rect x="95" y="400" width="330" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="422" text-anchor="middle" font-size="12" fill="#333">按 dest 与 source 的行列关系选取 f[j]</text>
  <path d="M 260 436 L 260 454" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="135" y="456" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="478" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 f[j]（已对 1e9+7 取模）</text>

  <!-- side mapping note -->
  <rect x="433" y="402" width="84" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="422" text-anchor="middle" font-size="9" fill="#555">都同 → f[0]</text>
  <text x="475" y="440" text-anchor="middle" font-size="9" fill="#555">仅x异 → f[1]</text>
  <text x="475" y="458" text-anchor="middle" font-size="9" fill="#555">仅y异 → f[2]</text>
  <text x="475" y="476" text-anchor="middle" font-size="9" fill="#555">都异 → f[3]</text>
</svg>
