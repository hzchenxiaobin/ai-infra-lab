<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：dictionary = [deer, door, cake, card]</text>
  <text x="330" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">abbr_map: d2r→{deer,door}　c2e→{cake}　c2d→{card}</text>

  <!-- 表头 -->
  <rect x="30" y="64" width="600" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">查询 word</text>
  <text x="180" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">缩写 a</text>
  <text x="320" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">mp[a] 集合</text>
  <text x="470" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">有「其他词」?</text>
  <text x="575" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">结果</text>

  <!-- 行 1: dear -> false -->
  <rect x="30" y="96" width="600" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="80" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dear</text>
  <text x="180" y="119" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">d2r</text>
  <text x="320" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">{deer, door}</text>
  <text x="470" y="119" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✓ deer, door ≠ dear</text>
  <text x="575" y="119" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 行 2: cart -> true -->
  <rect x="30" y="134" width="600" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="80" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cart</text>
  <text x="180" y="157" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">c2t</text>
  <text x="320" y="157" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">∅（空）</text>
  <text x="470" y="157" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✗ 无其他词</text>
  <text x="575" y="157" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行 3: cane -> false （与行5对照：同缩写 c2e） -->
  <rect x="30" y="172" width="600" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="80" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cane</text>
  <text x="180" y="195" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">c2e</text>
  <text x="320" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">{cake}</text>
  <text x="470" y="195" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✓ cake ≠ cane</text>
  <text x="575" y="195" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 行 4: make -> true -->
  <rect x="30" y="210" width="600" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="80" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">make</text>
  <text x="180" y="233" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">m2e</text>
  <text x="320" y="233" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">∅（空）</text>
  <text x="470" y="233" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✗ 无其他词</text>
  <text x="575" y="233" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行 5: cake -> true （查询词在集合里，且只有自己） -->
  <rect x="30" y="248" width="600" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="80" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cake</text>
  <text x="180" y="271" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">c2e</text>
  <text x="320" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">{cake}</text>
  <text x="470" y="271" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✗ 只有自己</text>
  <text x="575" y="271" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行 6: deer -> false -->
  <rect x="30" y="286" width="600" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="80" y="309" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">deer</text>
  <text x="180" y="309" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">d2r</text>
  <text x="320" y="309" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">{deer, door}</text>
  <text x="470" y="309" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✓ door ≠ deer</text>
  <text x="575" y="309" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 底部对照说明 -->
  <rect x="30" y="332" width="600" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="350" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对照第 3、5 行：同缩写 c2e，查询词 cane 不在集合→false，</text>
  <text x="330" y="366" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">查询词 cake 在集合且仅自己→true　·　此即「集合」而非「计数」之要</text>
</svg>
