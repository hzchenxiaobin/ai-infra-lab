<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">execTop()：校验循环，过期即弃</text>

  <!-- 开始 -->
  <rect x="245" y="42" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="305" y="61" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">execTop()</text>
  <path d="M 305 72 L 305 88" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定1：堆空？ -->
  <polygon points="305,92 372,122 305,152 238,122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="126" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">堆空？</text>
  <path d="M 372 122 L 416 122" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="390" y="114" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="420" y="108" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 -1</text>

  <path d="M 305 152 L 305 170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="318" y="165" font-size="9.5" fill="#666" filter="url(#rough2)">否</text>

  <!-- 取堆顶 -->
  <rect x="222" y="172" width="166" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="191" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">取堆顶 (p, id)</text>
  <path d="M 305 202 L 305 224" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定2：有效快照？ -->
  <polygon points="305,228 402,262 305,296 208,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="254" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">id ∈ info 且</text>
  <text x="305" y="272" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">priority == p ？</text>

  <!-- 是：执行 -->
  <path d="M 305 296 L 305 318" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="318" y="312" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="182" y="320" width="246" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="339" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">执行：弹出堆顶 + info.erase(id)</text>
  <path d="M 305 350 L 305 366" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="240" y="368" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="305" y="387" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 userId</text>

  <!-- 否：过期，回环 -->
  <path d="M 208 262 L 120 262 L 120 122 L 232 122" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="160" y="254" font-size="9.5" fill="#b85450" filter="url(#rough2)">否：过期快照</text>
  <text x="96" y="196" font-size="9.5" fill="#b85450" filter="url(#rough2)" transform="rotate(-90 96 196)">弹掉，回环继续</text>

  <!-- 侧注 -->
  <rect x="20" y="368" width="190" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="115" y="384" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">每个快照至多入堆一次、</text>
  <text x="115" y="400" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">出堆一次 → 均摊 O(log n)</text>
</svg>
