<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐位映射 + 反序构造 + 比较</text>

  <!-- Step 1: 初始化 -->
  <rect x="40" y="42" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="62" font-size="12" fill="#446688" font-weight="bold">步骤 1：初始化</text>
  <text x="60" y="80" font-size="11" fill="#444" font-family="monospace">rotated = 0, temp = n</text>
  <text x="60" y="94" font-size="10" fill="#888">用 temp 遍历 n 的每一位，rotated 累积旋转后的结果</text>

  <path d="M 270 100 L 270 118" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 循环体 -->
  <rect x="40" y="122" width="460" height="142" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="142" font-size="12" fill="#446688" font-weight="bold">步骤 2：循环（while temp &gt; 0）—— 逐位提取、校验、映射、累加</text>
  <text x="60" y="162" font-size="11" fill="#444" font-family="monospace">d = temp % 10                        // 取末位</text>
  <text x="60" y="180" font-size="11" fill="#b85450" font-family="monospace">if d ∉ {0, 1, 6, 8, 9}: return false  // 非法数字，直接判否</text>
  <text x="60" y="198" font-size="11" fill="#444" font-family="monospace">rotated = rotated * 10 + map[d]      // 映射并累加（天然反序）</text>
  <text x="60" y="216" font-size="11" fill="#444" font-family="monospace">temp //= 10                          // 去掉末位</text>
  <text x="60" y="238" font-size="10" fill="#888">从右向左处理，每步 rotated = reverted*10 + map[d]，等价于「反序 + 映射」</text>
  <text x="60" y="254" font-size="10" fill="#d6a040">map = {0:0, 1:1, 6:9, 8:8, 9:6}</text>

  <path d="M 270 268 L 270 286" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 比较判定 -->
  <rect x="40" y="290" width="460" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="310" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 3：比较 rotated 与 n</text>
  <text x="60" y="328" font-size="11" fill="#444" font-family="monospace">return rotated != n</text>
  <text x="60" y="346" font-size="10" fill="#888">rotated ≠ n → 旋转后变不同数 → 易混淆 → true</text>

  <path d="M 270 362 L 270 378" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="120" y="382" width="300" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="399" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">true（易混淆）/ false（非易混淆）</text>
</svg>
