<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：完美性自底向上可分解 —— node 完美 ⟺ 左右子树都完美 且 高度相等</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">示例 1：绿色 = 完美子树根（两棵大小 3 的 + 六个叶子），红虚线圆 = 不完美</text>

  <!-- 树的边 -->
  <g stroke="#999" stroke-width="1.4" filter="url(#rough2)">
    <line x1="300" y1="81" x2="205" y2="103"/>
    <line x1="300" y1="81" x2="395" y2="103"/>
    <line x1="205" y1="129" x2="158" y2="151"/>
    <line x1="205" y1="129" x2="252" y2="151"/>
    <line x1="395" y1="129" x2="348" y2="151"/>
    <line x1="395" y1="129" x2="443" y2="151"/>
    <line x1="158" y1="177" x2="120" y2="199"/>
    <line x1="158" y1="177" x2="196" y2="199"/>
    <line x1="348" y1="177" x2="310" y2="199"/>
    <line x1="348" y1="177" x2="386" y2="199"/>
  </g>

  <!-- 两棵大小 3 的完美子树（阴影圈出） -->
  <rect x="95" y="147" width="130" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="285" y="147" width="130" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- 不完美节点（红虚线） -->
  <circle cx="300" cy="68" r="14" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="205" cy="116" r="14" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="205" y="120" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="395" cy="116" r="14" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="395" y="120" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 完美子树根（绿色，粗边 = 大小 3 的根） -->
  <circle cx="158" cy="164" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="158" y="168" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="348" cy="164" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="348" y="168" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 叶子（绿色，各自是大小 1 的完美子树） -->
  <circle cx="252" cy="164" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="168" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2</text>
  <circle cx="443" cy="164" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="168" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">7</text>
  <circle cx="120" cy="212" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="216" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>
  <circle cx="196" cy="212" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="216" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">8</text>
  <circle cx="310" cy="212" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="216" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">6</text>
  <circle cx="386" cy="212" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="216" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">8</text>

  <!-- 不完美原因标注 -->
  <text x="322" y="54" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">左子树不完美 → ✗</text>
  <text x="183" y="120" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">hL=2 ≠ hR=1 ✗</text>
  <text x="417" y="120" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">hL=2 ≠ hR=1 ✗</text>

  <!-- 完美子树标注 -->
  <text x="160" y="258" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">h=2 → size 2²−1 = 3 ✓</text>
  <text x="350" y="258" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">h=2 → size 2²−1 = 3 ✓</text>

  <!-- 判定规则说明框 -->
  <rect x="30" y="272" width="460" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">判定规则（自底向上）</text>
  <text x="260" y="308" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">node 完美 ⟺ 左右子树都完美 ∧ hL = hR；空节点 h=0 与叶子 h=1 错开，单孩子自动判负</text>
  <text x="260" y="326" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">完美时 h = hL+1，size = 2^h − 1；不完美返回 −1，只向上传播——孩子已入列的大小全部有效</text>
  <text x="260" y="344" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">嵌套分别计数：大小 3 的子树内部，两个叶子各是大小 1 的完美子树，同时入列</text>
</svg>
