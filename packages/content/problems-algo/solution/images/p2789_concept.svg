<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2789" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
    <marker id="arrL2789" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">操作：若 nums[i]≤nums[i+1]，则 nums[i+1]+=nums[i] 并删 nums[i]</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#888">贪心：从右向左扫一遍，维护累加器 s</text>

  <!-- Operation demo -->
  <text x="40" y="80" font-size="11" fill="#666" font-weight="bold">操作示例</text>
  <rect x="40" y="86" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="92" y="104" font-size="11" fill="#888">≤</text>
  <rect x="104" y="86" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <path d="M 156 99 L 196 99" stroke="#888" stroke-width="1.4" marker-end="url(#arr2789)" filter="url(#rough2)"/>
  <text x="176" y="92" text-anchor="middle" font-size="9" fill="#888">合并</text>
  <rect x="200" y="86" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a+b</text>
  <text x="262" y="104" font-size="10" fill="#888">(a 被删除)</text>

  <!-- Array row with scan pointer -->
  <text x="40" y="166" font-size="11" fill="#666" font-weight="bold">扫描方向 ←</text>
  <rect x="120" y="150" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="170" y="150" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="220" y="150" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="270" y="150" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="320" y="150" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- scan arrow above -->
  <path d="M 355 138 L 135 138" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrL2789)" filter="url(#rough2)"/>
  <text x="245" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i 从 n−2 → 0</text>

  <!-- accumulator box -->
  <rect x="384" y="146" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="424" y="162" text-anchor="middle" font-size="10" fill="#888">累加器</text>
  <text x="424" y="178" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">s</text>
  <path d="M 372 165 L 384 165" stroke="#888" stroke-width="1.4" marker-end="url(#arr2789)" filter="url(#rough2)"/>

  <!-- Two decision branches -->
  <text x="40" y="222" font-size="11" fill="#666" font-weight="bold">对每个 nums[i] 的决策</text>
  <rect x="40" y="230" width="230" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="55" y="250" font-size="11" fill="#4a7a3a" font-weight="bold">✓ nums[i] ≤ s  → 合并</text>
  <text x="55" y="270" font-size="11" fill="#666">s ← s + nums[i]（块向左延伸）</text>
  <rect x="290" y="230" width="230" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305" y="250" font-size="11" fill="#b85450" font-weight="bold">✗ nums[i] &gt; s  → 重置</text>
  <text x="305" y="270" font-size="11" fill="#666">s ← nums[i]（另起新块）</text>

  <!-- invariant box -->
  <rect x="30" y="306" width="500" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键不变量：s 始终单调递增</text>
  <text x="50" y="352" font-size="11" fill="#666">① 合并时 s += nums[i]（nums[i]≥1）→ s 严格增大</text>
  <text x="50" y="370" font-size="11" fill="#666">② 重置时 nums[i] &gt; s → 新 s = nums[i] &gt; 旧 s，仍严格增大</text>
  <text x="50" y="386" font-size="11" fill="#4a7a3a" font-weight="bold">→ s 每步都在变大，最终 s 即全过程最大值，直接返回 s</text>
</svg>
