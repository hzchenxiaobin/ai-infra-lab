<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：num = 5 = 00101 走 Trie</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">从高位到低位逐位贪心，累计异或结果</text>

  <!-- table header -->
  <rect x="30" y="58" width="540" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">位 i</text>
  <text x="130" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">5 的该位</text>
  <text x="220" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">want(相反)</text>
  <text x="320" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">Trie 有?</text>
  <text x="420" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">取到</text>
  <text x="515" y="77" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">异或结果</text>

  <!-- row bit4 -->
  <rect x="30" y="92" width="540" height="34" fill="#e6f4ea" stroke="#9e9e9e" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">bit4</text>
  <text x="130" y="114" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="220" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="320" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 有</text>
  <text x="420" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 (相反)</text>
  <text x="515" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10000 = 16</text>

  <!-- row bit3 -->
  <rect x="30" y="128" width="540" height="34" fill="#e6f4ea" stroke="#9e9e9e" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">bit3</text>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="220" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="320" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 有</text>
  <text x="420" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 (相反)</text>
  <text x="515" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11000 = 24</text>

  <!-- row bit2 -->
  <rect x="30" y="164" width="540" height="34" fill="#e6f4ea" stroke="#9e9e9e" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">bit2</text>
  <text x="130" y="186" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="220" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="320" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 有</text>
  <text x="420" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 (相反)</text>
  <text x="515" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11100 = 28</text>

  <!-- row bit1 -->
  <rect x="30" y="200" width="540" height="34" fill="#fce4ec" stroke="#9e9e9e" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">bit1</text>
  <text x="130" y="222" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="220" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="320" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 无</text>
  <text x="420" y="222" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0 (相同)</text>
  <text x="515" y="222" text-anchor="middle" font-size="11" fill="#888">11100 = 28</text>

  <!-- row bit0 -->
  <rect x="30" y="236" width="540" height="34" fill="#fce4ec" stroke="#9e9e9e" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">bit0</text>
  <text x="130" y="258" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="220" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="320" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 无</text>
  <text x="420" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 (相同)</text>
  <text x="515" y="258" text-anchor="middle" font-size="11" fill="#888">11100 = 28</text>

  <!-- conclusion -->
  <rect x="30" y="284" width="540" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">走到的叶子 = 25 (11001)，5 XOR 25 = 28</text>
  <text x="300" y="324" text-anchor="middle" font-size="10.5" fill="#888">前 3 位取到相反位 → 异或为 1；后 2 位只有相同位 → 异或为 0</text>

  <!-- legend -->
  <rect x="30" y="346" width="540" height="40" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="368" font-size="10" fill="#4a7a3a" font-weight="bold">绿行</text>
  <text x="50" y="380" font-size="9" fill="#888">成功取相反位</text>
  <text x="200" y="368" font-size="10" fill="#b85450" font-weight="bold">粉行</text>
  <text x="200" y="380" font-size="9" fill="#888">无相反位，退取相同位</text>
  <text x="420" y="368" font-size="10" fill="#d6a040" font-weight="bold">最终</text>
  <text x="420" y="380" font-size="9" fill="#888">遍历所有 num 取最大</text>
</svg>
