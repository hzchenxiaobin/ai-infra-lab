<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "MCMXCIV" → 1994</text>

  <!-- Top: the string laid out as cells -->
  <text x="40" y="50" font-size="10" fill="#888">下标:</text>
  <text x="120" y="50" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="180" y="50" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="240" y="50" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="300" y="50" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="360" y="50" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="420" y="50" font-size="10" fill="#888" font-weight="bold">5</text>
  <text x="480" y="50" font-size="10" fill="#888" font-weight="bold">6</text>

  <!-- char cells -->
  <rect x="96" y="56" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">M</text>
  <rect x="156" y="56" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">C</text>
  <rect x="216" y="56" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">M</text>
  <rect x="276" y="56" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">X</text>
  <rect x="336" y="56" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">C</text>
  <rect x="396" y="56" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">I</text>
  <rect x="456" y="56" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">V</text>

  <!-- legend for top cells -->
  <rect x="520" y="60" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="536" y="70" font-size="9" fill="#555">加</text>
  <rect x="520" y="76" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="536" y="86" font-size="9" fill="#555">减</text>

  <!-- Table header -->
  <text x="30" y="116" font-size="11" fill="#444" font-weight="bold">步</text>
  <text x="62" y="116" font-size="11" fill="#444" font-weight="bold">i</text>
  <text x="100" y="116" font-size="11" fill="#444" font-weight="bold">符号</text>
  <text x="160" y="116" font-size="11" fill="#444" font-weight="bold">当前值</text>
  <text x="250" y="116" font-size="11" fill="#444" font-weight="bold">右边值</text>
  <text x="340" y="116" font-size="11" fill="#444" font-weight="bold">判断</text>
  <text x="440" y="116" font-size="11" fill="#444" font-weight="bold">操作</text>
  <text x="540" y="116" font-size="11" fill="#444" font-weight="bold">ans</text>

  <line x1="20" y1="122" x2="600" y2="122" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: i=0, M, 1000, 100(C), 1000>=100, +1000, 1000 -->
  <text x="30" y="140" font-size="10" fill="#333">1</text>
  <text x="62" y="140" font-size="10" fill="#333">0</text>
  <text x="100" y="140" font-size="11" fill="#333" font-weight="bold">M</text>
  <text x="160" y="140" font-size="10" fill="#333">1000</text>
  <text x="250" y="140" font-size="10" fill="#777">100 (C)</text>
  <text x="340" y="140" font-size="10" fill="#4a7a3a">1000 ≥ 100</text>
  <text x="440" y="140" font-size="10" fill="#4a7a3a" font-weight="bold">+1000</text>
  <text x="540" y="140" font-size="10" fill="#333" font-weight="bold">1000</text>

  <!-- Step 2: i=1, C, 100, 1000(M), 100<1000, -100, 900 -->
  <text x="30" y="158" font-size="10" fill="#333">2</text>
  <text x="62" y="158" font-size="10" fill="#333">1</text>
  <text x="100" y="158" font-size="11" fill="#333" font-weight="bold">C</text>
  <text x="160" y="158" font-size="10" fill="#333">100</text>
  <text x="250" y="158" font-size="10" fill="#777">1000 (M)</text>
  <text x="340" y="158" font-size="10" fill="#b85450">100 &lt; 1000</text>
  <text x="440" y="158" font-size="10" fill="#b85450" font-weight="bold">−100</text>
  <text x="540" y="158" font-size="10" fill="#333" font-weight="bold">900</text>

  <!-- Step 3: i=2, M, 1000, 10(X), 1000>=10, +1000, 1900 -->
  <text x="30" y="176" font-size="10" fill="#333">3</text>
  <text x="62" y="176" font-size="10" fill="#333">2</text>
  <text x="100" y="176" font-size="11" fill="#333" font-weight="bold">M</text>
  <text x="160" y="176" font-size="10" fill="#333">1000</text>
  <text x="250" y="176" font-size="10" fill="#777">10 (X)</text>
  <text x="340" y="176" font-size="10" fill="#4a7a3a">1000 ≥ 10</text>
  <text x="440" y="176" font-size="10" fill="#4a7a3a" font-weight="bold">+1000</text>
  <text x="540" y="176" font-size="10" fill="#333" font-weight="bold">1900</text>

  <!-- Step 4: i=3, X, 10, 100(C), 10<100, -10, 1890 -->
  <text x="30" y="194" font-size="10" fill="#333">4</text>
  <text x="62" y="194" font-size="10" fill="#333">3</text>
  <text x="100" y="194" font-size="11" fill="#333" font-weight="bold">X</text>
  <text x="160" y="194" font-size="10" fill="#333">10</text>
  <text x="250" y="194" font-size="10" fill="#777">100 (C)</text>
  <text x="340" y="194" font-size="10" fill="#b85450">10 &lt; 100</text>
  <text x="440" y="194" font-size="10" fill="#b85450" font-weight="bold">−10</text>
  <text x="540" y="194" font-size="10" fill="#333" font-weight="bold">1890</text>

  <!-- Step 5: i=4, C, 100, 1(I), 100>=1, +100, 1990 -->
  <text x="30" y="212" font-size="10" fill="#333">5</text>
  <text x="62" y="212" font-size="10" fill="#333">4</text>
  <text x="100" y="212" font-size="11" fill="#333" font-weight="bold">C</text>
  <text x="160" y="212" font-size="10" fill="#333">100</text>
  <text x="250" y="212" font-size="10" fill="#777">1 (I)</text>
  <text x="340" y="212" font-size="10" fill="#4a7a3a">100 ≥ 1</text>
  <text x="440" y="212" font-size="10" fill="#4a7a3a" font-weight="bold">+100</text>
  <text x="540" y="212" font-size="10" fill="#333" font-weight="bold">1990</text>

  <!-- Step 6: i=5, I, 1, 5(V), 1<5, -1, 1989 -->
  <text x="30" y="230" font-size="10" fill="#333">6</text>
  <text x="62" y="230" font-size="10" fill="#333">5</text>
  <text x="100" y="230" font-size="11" fill="#333" font-weight="bold">I</text>
  <text x="160" y="230" font-size="10" fill="#333">1</text>
  <text x="250" y="230" font-size="10" fill="#777">5 (V)</text>
  <text x="340" y="230" font-size="10" fill="#b85450">1 &lt; 5</text>
  <text x="440" y="230" font-size="10" fill="#b85450" font-weight="bold">−1</text>
  <text x="540" y="230" font-size="10" fill="#333" font-weight="bold">1989</text>

  <!-- Step 7: i=6, V, 5, none, last char, +5, 1994 -->
  <text x="30" y="248" font-size="10" fill="#333">7</text>
  <text x="62" y="248" font-size="10" fill="#333">6</text>
  <text x="100" y="248" font-size="11" fill="#333" font-weight="bold">V</text>
  <text x="160" y="248" font-size="10" fill="#333">5</text>
  <text x="250" y="248" font-size="10" fill="#aaa">— (无)</text>
  <text x="340" y="248" font-size="10" fill="#888">末尾，直接加</text>
  <text x="440" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">+5</text>
  <text x="540" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">1994</text>

  <!-- separator line -->
  <line x1="20" y1="260" x2="600" y2="260" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- grouping annotation: CM=900, XC=90, IV=4 -->
  <text x="120" y="280" font-size="10" fill="#888" text-anchor="middle">M</text>
  <path d="M 156 264 L 156 268 L 264 268 L 264 264" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="210" y="280" font-size="10" fill="#b85450" text-anchor="middle">CM=900</text>
  <path d="M 276 264 L 276 268 L 384 268 L 384 264" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="330" y="280" font-size="10" fill="#b85450" text-anchor="middle">XC=90</text>
  <path d="M 396 264 L 396 268 L 504 268 L 504 264" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="450" y="280" font-size="10" fill="#b85450" text-anchor="middle">IV=4</text>

  <!-- result box -->
  <rect x="80" y="300" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="324" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">M + CM + XC + IV = 1000 + 900 + 90 + 4 = 1994</text>
  <text x="310" y="344" text-anchor="middle" font-size="11" fill="#888">贪心逐位法与分组法结果完全一致，但只需一次遍历</text>

  <!-- bottom note -->
  <rect x="80" y="372" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">观察：蓝色格 = 当前值 ≥ 右边 → 加；粉色格 = 当前值 &lt; 右边 → 减</text>
  <text x="310" y="408" text-anchor="middle" font-size="10" fill="#888">末尾字符无右邻，必为加</text>

  <!-- star on final ans -->
  <text x="568" y="248" font-size="10" fill="#d6a040">⭐</text>
</svg>
