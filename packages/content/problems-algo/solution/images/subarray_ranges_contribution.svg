<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贡献计数：每个元素作为若干子数组的最大 / 最小</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">范围和 = Σ(子数组最大) − Σ(子数组最小) = Σ nums[i]·(maxCnt[i] − minCnt[i])</text>

  <!-- ===== Array row ===== -->
  <text x="30" y="78" font-size="11" fill="#446688" font-weight="bold">数组 nums = [1, 2, 3]</text>
  <g font-size="11">
    <rect x="120" y="86" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="150" y="108" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="150" y="80" text-anchor="middle" font-size="9" fill="#888">i=0</text>

    <rect x="184" y="86" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="214" y="108" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="214" y="80" text-anchor="middle" font-size="9" fill="#888">i=1</text>

    <rect x="248" y="86" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="278" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="278" y="80" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  </g>

  <!-- ===== Max contribution ===== -->
  <text x="30" y="150" font-size="11" fill="#b85450" font-weight="bold">作为最大值的次数 maxCnt（左严&gt; 右≥）</text>
  <g font-size="10">
    <rect x="120" y="158" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="176" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="150" y="196" text-anchor="middle" font-size="9" fill="#888">L=1 R=1 → 1</text>

    <rect x="184" y="158" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="214" y="176" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="214" y="196" text-anchor="middle" font-size="9" fill="#888">L=2 R=1 → 2</text>

    <rect x="248" y="158" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="278" y="176" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="278" y="196" text-anchor="middle" font-size="9" fill="#888">L=3 R=1 → 3</text>
  </g>
  <text x="340" y="176" font-size="10" fill="#b85450" font-weight="bold">sumMax = 1·1 + 2·2 + 3·3 = 14</text>

  <!-- ===== Min contribution ===== -->
  <text x="30" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">作为最小值的次数 minCnt（左严&lt; 右≤）</text>
  <g font-size="10">
    <rect x="120" y="234" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="252" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="150" y="272" text-anchor="middle" font-size="9" fill="#888">L=1 R=3 → 3</text>

    <rect x="184" y="234" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="214" y="252" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="214" y="272" text-anchor="middle" font-size="9" fill="#888">L=1 R=2 → 2</text>

    <rect x="248" y="234" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="278" y="252" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="278" y="272" text-anchor="middle" font-size="9" fill="#888">L=1 R=1 → 1</text>
  </g>
  <text x="340" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">sumMin = 1·3 + 2·2 + 3·1 = 10</text>

  <!-- ===== boundary explanation ===== -->
  <rect x="30" y="296" width="500" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="40" y="312" font-size="10" fill="#555">L = i − prevBoundary（左起终点可选数）</text>
  <text x="40" y="328" font-size="10" fill="#555">R = nextBoundary − i（右终终点可选数）  cnt = L · R</text>
  <text x="300" y="312" font-size="10" fill="#b85450">最大：左找严格更大，右找更大或相等</text>
  <text x="300" y="328" font-size="10" fill="#4a7a3a">最小：左找严格更小，右找更小或相等</text>

  <!-- ===== Result ===== -->
  <rect x="120" y="350" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">范围和 = sumMax − sumMin = 14 − 10 = 4</text>
</svg>
