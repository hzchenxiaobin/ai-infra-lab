<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[5,4,2,4]，每步累加 right−left+1</text>

  <!-- column headers -->
  <text x="30" y="58" font-size="11" fill="#888" font-weight="bold">r</text>
  <text x="60" y="58" font-size="11" fill="#888" font-weight="bold">x</text>
  <text x="100" y="58" font-size="11" fill="#888" font-weight="bold">窗口值</text>
  <text x="250" y="58" font-size="11" fill="#888" font-weight="bold">max−min</text>
  <text x="350" y="58" font-size="11" fill="#888" font-weight="bold">left</text>
  <text x="410" y="58" font-size="11" fill="#888" font-weight="bold">累加</text>
  <text x="500" y="58" font-size="11" fill="#888" font-weight="bold">ans</text>

  <!-- divider -->
  <line x1="20" y1="66" x2="560" y2="66" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row r=0 -->
  <text x="30" y="92" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="60" y="92" font-size="12" fill="#333" font-weight="bold">5</text>
  <g font-size="13" font-weight="bold">
    <rect x="100" y="78" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="94" text-anchor="middle" fill="#333">5</text>
  </g>
  <text x="250" y="92" font-size="11" fill="#4a7a3a" font-weight="bold">0 ≤ 2 ✓</text>
  <text x="350" y="92" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="410" y="92" font-size="11" fill="#d6a040" font-weight="bold">+1</text>
  <text x="500" y="92" font-size="12" fill="#446688" font-weight="bold">1</text>

  <line x1="20" y1="104" x2="560" y2="104" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row r=1 -->
  <text x="30" y="130" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="60" y="130" font-size="12" fill="#333" font-weight="bold">4</text>
  <g font-size="13" font-weight="bold">
    <rect x="100" y="116" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="132" text-anchor="middle" fill="#333">5</text>
    <rect x="134" y="116" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="132" text-anchor="middle" fill="#333">4</text>
  </g>
  <text x="250" y="130" font-size="11" fill="#4a7a3a" font-weight="bold">5−4=1 ≤ 2 ✓</text>
  <text x="350" y="130" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="410" y="130" font-size="11" fill="#d6a040" font-weight="bold">+2</text>
  <text x="500" y="130" font-size="12" fill="#446688" font-weight="bold">3</text>

  <line x1="20" y1="142" x2="560" y2="142" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row r=2 -->
  <text x="30" y="168" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="60" y="168" font-size="12" fill="#333" font-weight="bold">2</text>
  <g font-size="13" font-weight="bold">
    <rect x="100" y="154" width="34" height="22" fill="#eee" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="2,2" filter="url(#rough2)"/>
    <text x="117" y="170" text-anchor="middle" fill="#999">5</text>
    <rect x="134" y="154" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="170" text-anchor="middle" fill="#333">4</text>
    <rect x="168" y="154" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="185" y="170" text-anchor="middle" fill="#b85450">2</text>
  </g>
  <text x="250" y="168" font-size="11" fill="#b85450" font-weight="bold">5−2=3 &gt; 2 ✗</text>
  <text x="350" y="168" font-size="12" fill="#b85450" font-weight="bold">0→1</text>
  <text x="410" y="168" font-size="11" fill="#d6a040" font-weight="bold">+2</text>
  <text x="500" y="168" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="250" y="182" font-size="9" fill="#b85450">收缩 left，丢 5</text>

  <line x1="20" y1="188" x2="560" y2="188" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row r=3 -->
  <text x="30" y="214" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="60" y="214" font-size="12" fill="#333" font-weight="bold">4</text>
  <g font-size="13" font-weight="bold">
    <rect x="134" y="200" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="216" text-anchor="middle" fill="#333">4</text>
    <rect x="168" y="200" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="185" y="216" text-anchor="middle" fill="#b85450">2</text>
    <rect x="202" y="200" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="219" y="216" text-anchor="middle" fill="#4a7a3a">4</text>
  </g>
  <text x="250" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">4−2=2 ≤ 2 ✓</text>
  <text x="350" y="214" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="410" y="214" font-size="11" fill="#d6a040" font-weight="bold">+3</text>
  <text x="500" y="214" font-size="12" fill="#446688" font-weight="bold">8</text>
  <text x="250" y="228" font-size="9" fill="#4a7a3a">min=2,max=4</text>

  <!-- summary -->
  <rect x="60" y="250" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">r=2 时 5−2=3 超标，收缩 left 到 1 丢掉 5</text>
  <text x="290" y="290" text-anchor="middle" font-size="11" fill="#d6a040">每步累加 right−left+1：1+2+2+3 = 8 ✓</text>
  <text x="290" y="304" text-anchor="middle" font-size="10" fill="#d6a040">以 right 结尾的合法子数组：起点 ∈ [left, right]</text>

  <!-- bottom: the counting formula -->
  <rect x="60" y="326" width="460" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为何 right−left+1 是对的？</text>
  <text x="290" y="370" text-anchor="middle" font-size="11" fill="#446688">[left, right] 合法 ⇒ 其任意后缀 [k, right]（left ≤ k ≤ right）</text>
  <text x="290" y="386" text-anchor="middle" font-size="11" fill="#446688">也合法（子区间极差 ≤ 原区间极差）。后缀恰好 right−left+1 个。</text>
  <text x="290" y="406" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不会多算也不会漏：left−1 起必不合法（收缩边界）</text>
</svg>
