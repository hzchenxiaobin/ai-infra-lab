<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="420" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：哈希表分组 + 排序取 Top5
  </text>

  <!-- Step 1 -->
  <g filter="url(#rough2)">
    <rect x="120" y="46" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <text x="240" y="68" text-anchor="middle" font-size="13" fill="#333">① 遍历 items</text>
    <text x="240" y="86" text-anchor="middle" font-size="11" fill="#666">map[id].append(score)</text>
  </g>
  <path d="M240,100 L240,120" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <g filter="url(#rough2)">
    <rect x="120" y="126" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="240" y="148" text-anchor="middle" font-size="13" fill="#333">② 对每个学生的成绩列表</text>
    <text x="240" y="166" text-anchor="middle" font-size="11" fill="#666">降序排序 sort(begin, end, greater)</text>
  </g>
  <path d="M240,180 L240,200" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <g filter="url(#rough2)">
    <rect x="120" y="206" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="240" y="228" text-anchor="middle" font-size="13" fill="#333">③ 取前 5 个求和</text>
    <text x="240" y="246" text-anchor="middle" font-size="11" fill="#666">avg = sum(前5) / 5 （整数除法）</text>
  </g>
  <path d="M240,260 L240,280" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <g filter="url(#rough2)">
    <rect x="120" y="286" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <text x="240" y="308" text-anchor="middle" font-size="13" fill="#333">④ 收集 [id, avg] 并按 id 排序</text>
    <text x="240" y="326" text-anchor="middle" font-size="11" fill="#666">sort by student_id ascending</text>
  </g>
  <path d="M240,340 L240,360" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Output -->
  <g filter="url(#rough2)">
    <rect x="120" y="366" width="240" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8"/>
    <text x="240" y="392" text-anchor="middle" font-size="13" fill="#b85450">返回 result</text>
  </g>

  <!-- Side annotation -->
  <g filter="url(#rough2)">
    <text x="385" y="76" font-size="10" fill="#888">O(n)</text>
    <text x="385" y="156" font-size="10" fill="#888">O(k log k)</text>
    <text x="385" y="236" font-size="10" fill="#888">O(5) = O(1)</text>
    <text x="385" y="316" font-size="10" fill="#888">O(m log m)</text>
  </g>
  <text x="385" y="56" font-size="10" fill="#888" filter="url(#rough2)">n=总记录数</text>
  <text x="385" y="136" font-size="10" fill="#888" filter="url(#rough2)">k=该生成绩数</text>
  <text x="385" y="216" font-size="10" fill="#888" filter="url(#rough2)">m=学生数</text>
</svg>
