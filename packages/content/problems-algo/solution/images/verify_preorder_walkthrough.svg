<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[5,2,1,3,6] → true ✓</text>

  <!-- ===== Table for valid case ===== -->
  <!-- Header -->
  <rect x="20" y="40" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="56" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤</text>
  <rect x="72" y="40" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="56" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">x</text>
  <rect x="114" y="40" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="159" y="56" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">栈（前）</text>
  <rect x="206" y="40" width="170" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="291" y="56" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">动作</text>
  <rect x="378" y="40" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="403" y="56" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">lower</text>
  <rect x="430" y="40" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="475" y="56" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">栈（后）</text>

  <!-- Row 1: x=5 -->
  <rect x="20" y="66" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="45" y="81" text-anchor="middle" font-size="10" fill="#666">①</text>
  <rect x="72" y="66" width="40" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="81" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="114" y="66" width="90" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="159" y="81" text-anchor="middle" font-size="10" fill="#888">[]</text>
  <rect x="206" y="66" width="170" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="291" y="81" text-anchor="middle" font-size="10" fill="#666">栈空，直接入栈</text>
  <rect x="378" y="66" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="403" y="81" text-anchor="middle" font-size="10" fill="#888">−∞</text>
  <rect x="430" y="66" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="475" y="81" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[5]</text>

  <!-- Row 2: x=2 -->
  <rect x="20" y="90" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="45" y="105" text-anchor="middle" font-size="10" fill="#666">②</text>
  <rect x="72" y="90" width="40" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="105" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="114" y="90" width="90" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="159" y="105" text-anchor="middle" font-size="10" fill="#888">[5]</text>
  <rect x="206" y="90" width="170" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="291" y="105" text-anchor="middle" font-size="10" fill="#666">2 &lt; 5，直接入栈</text>
  <rect x="378" y="90" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="403" y="105" text-anchor="middle" font-size="10" fill="#888">−∞</text>
  <rect x="430" y="90" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="475" y="105" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[5,2]</text>

  <!-- Row 3: x=1 -->
  <rect x="20" y="114" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="45" y="129" text-anchor="middle" font-size="10" fill="#666">③</text>
  <rect x="72" y="114" width="40" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="129" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="114" y="114" width="90" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="159" y="129" text-anchor="middle" font-size="10" fill="#888">[5,2]</text>
  <rect x="206" y="114" width="170" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="291" y="129" text-anchor="middle" font-size="10" fill="#666">1 &lt; 2，直接入栈</text>
  <rect x="378" y="114" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="403" y="129" text-anchor="middle" font-size="10" fill="#888">−∞</text>
  <rect x="430" y="114" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="475" y="129" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[5,2,1]</text>

  <!-- Row 4: x=3 (key transition) -->
  <rect x="20" y="138" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="45" y="153" text-anchor="middle" font-size="10" fill="#666">④</text>
  <rect x="72" y="138" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="153" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="114" y="138" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="159" y="153" text-anchor="middle" font-size="10" fill="#888">[5,2,1]</text>
  <rect x="206" y="138" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="291" y="153" text-anchor="middle" font-size="9" fill="#b85450">弹1→l=1; 弹2→l=2; 停</text>
  <rect x="378" y="138" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="403" y="153" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <rect x="430" y="138" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="475" y="153" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[5,3]</text>

  <!-- Row 5: x=6 (key transition) -->
  <rect x="20" y="162" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="45" y="177" text-anchor="middle" font-size="10" fill="#666">⑤</text>
  <rect x="72" y="162" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="177" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <rect x="114" y="162" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="159" y="177" text-anchor="middle" font-size="10" fill="#888">[5,3]</text>
  <rect x="206" y="162" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="291" y="177" text-anchor="middle" font-size="9" fill="#b85450">弹3→l=3; 弹5→l=5; 停</text>
  <rect x="378" y="162" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="403" y="177" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <rect x="430" y="162" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="475" y="177" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[6]</text>

  <!-- Result -->
  <rect x="20" y="188" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全部通过 → return true ✓</text>

  <!-- ===== Divider ===== -->
  <line x1="20" y1="222" x2="540" y2="222" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" filter="url(#rough2)"/>

  <!-- ===== Table for invalid case ===== -->
  <text x="280" y="240" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">[5,2,6,1,3] → false ✗</text>

  <!-- Header -->
  <rect x="20" y="250" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="265" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤</text>
  <rect x="72" y="250" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="265" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">x</text>
  <rect x="114" y="250" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="159" y="265" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">栈</text>
  <rect x="206" y="250" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="291" y="265" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">动作</text>
  <rect x="378" y="250" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="403" y="265" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">lower</text>
  <rect x="430" y="250" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="475" y="265" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">结果</text>

  <!-- Row 1: x=5 -->
  <rect x="20" y="274" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="45" y="289" text-anchor="middle" font-size="10" fill="#666">①</text>
  <rect x="72" y="274" width="40" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="289" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="114" y="274" width="90" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="159" y="289" text-anchor="middle" font-size="10" fill="#888">[]</text>
  <rect x="206" y="274" width="170" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="291" y="289" text-anchor="middle" font-size="10" fill="#666">入栈</text>
  <rect x="378" y="274" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="403" y="289" text-anchor="middle" font-size="10" fill="#888">−∞</text>
  <rect x="430" y="274" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="475" y="289" text-anchor="middle" font-size="10" fill="#333">[5]</text>

  <!-- Row 2: x=2 -->
  <rect x="20" y="298" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="45" y="313" text-anchor="middle" font-size="10" fill="#666">②</text>
  <rect x="72" y="298" width="40" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="313" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="114" y="298" width="90" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="159" y="313" text-anchor="middle" font-size="10" fill="#888">[5]</text>
  <rect x="206" y="298" width="170" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="291" y="313" text-anchor="middle" font-size="10" fill="#666">入栈</text>
  <rect x="378" y="298" width="50" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="403" y="313" text-anchor="middle" font-size="10" fill="#888">−∞</text>
  <rect x="430" y="298" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="475" y="313" text-anchor="middle" font-size="10" fill="#333">[5,2]</text>

  <!-- Row 3: x=6 -->
  <rect x="20" y="322" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="45" y="337" text-anchor="middle" font-size="10" fill="#666">③</text>
  <rect x="72" y="322" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="92" y="337" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <rect x="114" y="322" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="159" y="337" text-anchor="middle" font-size="10" fill="#888">[5,2]</text>
  <rect x="206" y="322" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="291" y="337" text-anchor="middle" font-size="9" fill="#b85450">弹2→l=2; 弹5→l=5; 入栈</text>
  <rect x="378" y="322" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="403" y="337" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <rect x="430" y="322" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="475" y="337" text-anchor="middle" font-size="10" fill="#333">[6]</text>

  <!-- Row 4: x=1 (FAIL) -->
  <rect x="20" y="346" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="361" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">④</text>
  <rect x="72" y="346" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="361" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="114" y="346" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="159" y="361" text-anchor="middle" font-size="10" fill="#888">[6]</text>
  <rect x="206" y="346" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="291" y="361" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1 &lt; lower(5) → 非法!</text>
  <rect x="378" y="346" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="403" y="361" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <rect x="430" y="346" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="475" y="361" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- Result -->
  <rect x="20" y="372" width="500" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="387" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 出现在 5 的右子树(6)之后，但 1 &lt; 5 → return false ✗</text>

  <!-- Note -->
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888">下界 lower 在 ③ 处升为 5（进入 5 的右子树），④ 处 1 &lt; 5 立即拦截</text>
</svg>
