<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：grid = [[1,2,2],[1,1,0],[0,1,0]]（n = 3, m = 1）</text>

  <!-- grid labels -->
  <text x="69" y="56" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c=0</text>
  <text x="115" y="56" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c=1</text>
  <text x="161" y="56" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">c=2</text>
  <text x="42" y="90" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=0</text>
  <text x="42" y="136" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="42" y="182" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">r=2</text>

  <!-- grid cells -->
  <rect x="48" y="62" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="69" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="94" y="62" width="42" height="42" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="89" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">2</text>

  <rect x="140" y="62" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="48" y="108" width="42" height="42" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="69" y="135" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>

  <rect x="94" y="108" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="135" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="140" y="108" width="42" height="42" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="161" y="135" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>

  <rect x="48" y="154" width="42" height="42" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="69" y="181" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>

  <rect x="94" y="154" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="181" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="140" y="154" width="42" height="42" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="161" y="181" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>

  <!-- red rings: cells to change under (a=1, b=0) -->
  <ellipse cx="115" cy="83" rx="26" ry="24" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="161" cy="83" rx="26" ry="24" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="69" cy="129" rx="26" ry="24" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- count tables -->
  <rect x="32" y="214" width="228" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="146" y="236" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cntY = [0, 3, 1]　yTot = n+m = 4</text>
  <text x="146" y="257" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cntO = [3, 1, 1]　oTot = 5</text>
  <text x="146" y="277" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（下标即值 0 / 1 / 2；蓝格 = Y，白格 = Y 外）</text>

  <!-- cost table -->
  <rect x="278" y="62" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="309" y="79" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(a, b)</text>
  <rect x="340" y="62" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="369" y="79" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4−cntY[a]</text>
  <rect x="398" y="62" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="425" y="79" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5−cntO[b]</text>
  <rect x="452" y="62" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="476" y="79" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cost</text>

  <!-- row 1 -->
  <rect x="278" y="88" width="62" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="105" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(0, 1)</text>
  <rect x="340" y="88" width="58" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="369" y="105" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="398" y="88" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="105" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="452" y="88" width="48" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476" y="105" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>

  <!-- row 2 -->
  <rect x="278" y="114" width="62" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="131" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(0, 2)</text>
  <rect x="340" y="114" width="58" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="369" y="131" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="398" y="114" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="131" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="452" y="114" width="48" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476" y="131" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>

  <!-- row 3: best -->
  <rect x="278" y="140" width="62" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="157" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(1, 0)</text>
  <rect x="340" y="140" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="369" y="157" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="398" y="140" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="157" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="452" y="140" width="48" height="26" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="476" y="157" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ★</text>

  <!-- row 4 -->
  <rect x="278" y="166" width="62" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="183" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(1, 2)</text>
  <rect x="340" y="166" width="58" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="369" y="183" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="398" y="166" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="183" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="452" y="166" width="48" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476" y="183" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>

  <!-- row 5 -->
  <rect x="278" y="192" width="62" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="209" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(2, 0)</text>
  <rect x="340" y="192" width="58" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="369" y="209" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="398" y="192" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="209" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="452" y="192" width="48" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476" y="209" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>

  <!-- row 6 -->
  <rect x="278" y="218" width="62" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="235" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(2, 1)</text>
  <rect x="340" y="218" width="58" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="369" y="235" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="398" y="218" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="235" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="452" y="218" width="48" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476" y="235" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>

  <!-- ans box -->
  <rect x="278" y="256" width="222" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="389" y="273" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 3（a = 1, b = 0）</text>
  <text x="389" y="290" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">Y 内只改 1 格，Y 外只改 2 格</text>

  <!-- bottom note -->
  <rect x="32" y="308" width="468" height="62" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="266" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⭕ 红圈 = 最优方案 (a=1, b=0) 下需要修改的 3 格：</text>
  <text x="266" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">Y 内 (0,2): 2→1；Y 外 (0,1): 2→0、(1,0): 1→0。</text>
  <text x="266" y="365" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个错误格恰好 1 次操作，两区域代价独立相加。</text>
</svg>
