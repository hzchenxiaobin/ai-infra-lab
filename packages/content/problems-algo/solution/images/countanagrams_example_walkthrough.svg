<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="280" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "too hot"</text>

  <!-- 表格外框 -->
  <rect x="30" y="48" width="520" height="140" fill="none" stroke="#888" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <!-- 列竖线 -->
  <path d="M 130 48 L 130 188" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 180 48 L 180 188" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 340 48 L 340 188" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="30" y="48" width="520" height="30" fill="#e8f0fe" stroke="none" rx="6" filter="url(#rough2)"/>
  <text x="80" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">单词</text>
  <text x="155" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">L</text>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">字符频次</text>
  <text x="430" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">公式 L! / ∏ cᵢ!</text>
  <text x="515" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">项</text>
  <path d="M 30 78 L 550 78" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 行 1 too -->
  <rect x="30" y="78" width="520" height="40" fill="#f6fff7" stroke="none" filter="url(#rough2)"/>
  <text x="80" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"too"</text>
  <text x="155" y="103" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="260" y="103" text-anchor="middle" font-size="12" fill="#333">t:1,　o:2</text>
  <text x="430" y="103" text-anchor="middle" font-size="12" fill="#333">3! / (1! · 2!) = 6/2</text>
  <rect x="490" y="86" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="103" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- 行 2 hot -->
  <rect x="30" y="118" width="520" height="40" fill="#f3f7ff" stroke="none" filter="url(#rough2)"/>
  <text x="80" y="143" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">"hot"</text>
  <text x="155" y="143" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="260" y="143" text-anchor="middle" font-size="12" fill="#333">h:1,　o:1,　t:1</text>
  <text x="430" y="143" text-anchor="middle" font-size="12" fill="#333">3! / (1!·1!·1!) = 6/1</text>
  <rect x="490" y="126" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="143" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>

  <!-- 结论 -->
  <text x="290" y="218" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">ans = 3 × 6 = <tspan fill="#b85450" font-weight="bold" font-size="17">18</tspan>　mod (10⁹+7)</text>

  <rect x="60" y="238" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="257" text-anchor="middle" font-size="11" fill="#d6a040">c=1 时 1!=1 不影响结果；全互异单词的项即 L!</text>
</svg>
