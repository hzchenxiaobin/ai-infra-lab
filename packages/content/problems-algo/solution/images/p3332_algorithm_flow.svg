<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：逐天滚动填表</text>

  <!-- 起点 -->
  <rect x="175" y="32" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">dp[·] ← 0（起点任选）</text>

  <line x1="260" y1="58" x2="260" y2="70" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 天循环 -->
  <rect x="180" y="72" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">for i = 0 … k−1（第 i 天）</text>

  <line x1="260" y1="98" x2="260" y2="110" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 城市循环 -->
  <rect x="180" y="112" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">for j = 0 … n−1（宿 j 城）</text>

  <line x1="260" y1="138" x2="260" y2="150" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移 -->
  <rect x="115" y="152" width="290" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="169" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">ndp[j] = max( dp[j] + stay[i][j] ,</text>
  <text x="260" y="184" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">max_p dp[p] + travel[p][j] )</text>

  <line x1="260" y1="192" x2="260" y2="204" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 滚动 -->
  <rect x="180" y="206" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">swap(dp, ndp)</text>

  <line x1="260" y1="232" x2="260" y2="244" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,246 322,276 260,306 198,276" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">还有天？</text>

  <!-- 是：回环 -->
  <path d="M 198 276 C 150 276, 130 200, 130 85 L 176 85" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="258" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 否：收尾 -->
  <line x1="260" y1="306" x2="260" y2="318" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="316" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="185" y="320" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return max(dp)</text>

  <!-- 右侧小注 -->
  <rect x="332" y="246" width="176" height="96" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="264" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">复杂度与实现小注</text>
  <text x="342" y="281" font-size="8.5" fill="#666" filter="url(#rough2)">p 可扫全城（含 j）：</text>
  <text x="342" y="295" font-size="8.5" fill="#666" filter="url(#rough2)">travel[j][j]=0 输给 stay ≥ 1</text>
  <text x="342" y="312" font-size="8.5" fill="#666" filter="url(#rough2)">时间 O(k·n²)，n=k=200 → 8×10⁶</text>
  <text x="342" y="326" font-size="8.5" fill="#666" filter="url(#rough2)">空间 O(n)：两层滚动即可</text>
</svg>
