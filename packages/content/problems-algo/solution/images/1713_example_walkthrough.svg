<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：耐心排序求 LIS
  </text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    target=[6,4,8,1,3,2], arr=[4,7,6,2,3,8,6,1] → nums=[1,0,5,4,2,0,3]
  </text>

  <!-- ===== Column headers: step numbers ===== -->
  <text x="110" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">step1</text>
  <text x="170" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">step2</text>
  <text x="230" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">step3</text>
  <text x="290" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">step4</text>
  <text x="350" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">step5</text>
  <text x="410" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">step6</text>
  <text x="470" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">step7</text>

  <!-- separator vertical lines -->
  <line x1="140" y1="52" x2="140" y2="380" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="200" y1="52" x2="200" y2="380" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="260" y1="52" x2="260" y2="380" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="320" y1="52" x2="320" y2="380" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="380" y1="52" x2="380" y2="380" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="440" y1="52" x2="440" y2="380" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>

  <!-- ===== Row 1: input x ===== -->
  <text x="40" y="84" font-size="10" fill="#888" filter="url(#rough2)">输入 x</text>
  <rect x="92" y="72" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="152" y="72" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="212" y="72" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="272" y="72" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="332" y="72" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="392" y="72" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="452" y="72" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- ===== Row 2: compare with tails末尾 ===== -->
  <text x="40" y="120" font-size="10" fill="#888" filter="url(#rough2)">对比</text>
  <text x="40" y="132" font-size="9" fill="#aaa" filter="url(#rough2)">末尾</text>
  <text x="110" y="124" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">空</text>
  <text x="170" y="124" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">0&lt;1</text>
  <text x="230" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">5≥0</text>
  <text x="290" y="124" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">4&lt;5</text>
  <text x="350" y="124" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">2&lt;4</text>
  <text x="410" y="124" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">0&lt;2</text>
  <text x="470" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">3≥2</text>

  <!-- ===== Row 3: action ===== -->
  <text x="40" y="156" font-size="10" fill="#888" filter="url(#rough2)">动作</text>
  <text x="110" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">追加</text>
  <text x="170" y="156" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">替换[0]</text>
  <text x="230" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">追加</text>
  <text x="290" y="156" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">替换[1]</text>
  <text x="350" y="156" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">替换[1]</text>
  <text x="410" y="156" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">替换[0]</text>
  <text x="470" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">追加</text>

  <!-- ===== Row 4: tails after each step ===== -->
  <text x="40" y="196" font-size="10" fill="#888" filter="url(#rough2)">tails</text>
  <text x="40" y="208" font-size="9" fill="#aaa" filter="url(#rough2)">之后</text>

  <!-- step1: tails=[1] -->
  <rect x="96" y="182" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="110" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <!-- step2: tails=[0] -->
  <rect x="96" y="182" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="110" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <!-- step3: tails=[0,5] -->
  <rect x="152" y="182" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" opacity="0.5" filter="url(#rough2)"/>
  <text x="166" y="197" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="184" y="182" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="198" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>

  <!-- step4: tails=[0,4] -->
  <rect x="212" y="182" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" opacity="0.5" filter="url(#rough2)"/>
  <text x="226" y="197" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="244" y="182" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="258" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>

  <!-- step5: tails=[0,2] -->
  <rect x="272" y="182" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" opacity="0.5" filter="url(#rough2)"/>
  <text x="286" y="197" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="304" y="182" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="318" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>

  <!-- step6: tails=[0,2] (0 replaced by 0, no change) -->
  <rect x="332" y="182" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="346" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="364" y="182" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" opacity="0.5" filter="url(#rough2)"/>
  <text x="378" y="197" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <!-- step7: tails=[0,2,3] -->
  <rect x="392" y="182" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" opacity="0.5" filter="url(#rough2)"/>
  <text x="406" y="197" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="424" y="182" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" opacity="0.5" filter="url(#rough2)"/>
  <text x="438" y="197" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <rect x="456" y="182" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="470" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>

  <!-- ===== Row 5: LIS length ===== -->
  <text x="40" y="236" font-size="10" fill="#888" filter="url(#rough2)">LIS</text>
  <text x="40" y="248" font-size="9" fill="#aaa" filter="url(#rough2)">长度</text>
  <text x="110" y="242" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="170" y="242" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="230" y="242" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="290" y="242" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="350" y="242" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="410" y="242" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="470" y="242" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3 ←</text>

  <!-- ===== Row 6: notes ===== -->
  <text x="40" y="290" font-size="10" fill="#888" filter="url(#rough2)">备注</text>
  <text x="80" y="282" font-size="9" fill="#5a5a5a" filter="url(#rough2)">step1: 空表追加 1</text>
  <text x="80" y="296" font-size="9" fill="#5a5a5a" filter="url(#rough2)">step2: 0 比 1 小 → 二分找位 → 替换 tails[0]，长度不变</text>
  <text x="80" y="310" font-size="9" fill="#5a5a5a" filter="url(#rough2)">step3: 5 ≥ 末尾 0 → 直接追加，长度 +1</text>
  <text x="80" y="324" font-size="9" fill="#5a5a5a" filter="url(#rough2)">step4-6: 4/2/0 均小于当前末尾 → 二分替换对应位，长度不变</text>
  <text x="80" y="338" font-size="9" fill="#5a5a5a" filter="url(#rough2)">step7: 3 ≥ 末尾 2 → 追加，长度 +1 → 最终 LIS=3</text>
  <text x="80" y="352" font-size="9" fill="#b85450" filter="url(#rough2)">注意：tails 不是真实 LIS，但其长度 = LIS 长度</text>

  <!-- ===== Bottom: final answer ===== -->
  <rect x="80" y="376" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    最少操作 = len(target) − LIS = 6 − 3 = 3
  </text>
  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    → 输出 3  ✓
  </text>

  <!-- footnote -->
  <text x="280" y="442" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    绿=追加；红=替换；蓝(淡)=保留旧值；橙=LIS 长度
  </text>
  <text x="280" y="458" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">
    tails 单调递增 → 二分 bisect_left 找首个 ≥ x 的位置
  </text>
</svg>
