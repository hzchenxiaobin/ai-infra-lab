<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：startWords=["ant","act","tack"]</text>

  <!-- ====== startMasks reference ====== -->
  <text x="40" y="50" font-size="12" fill="#446688" font-weight="bold">startMasks 集合：</text>
  <rect x="150" y="36" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="210" y="52" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"ant"={a,n,t}</text>
  <rect x="278" y="36" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="338" y="52" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"act"={a,c,t}</text>
  <rect x="406" y="36" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="471" y="52" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"tack"={a,c,k,t}</text>

  <!-- divider -->
  <line x1="40" y1="74" x2="520" y2="74" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ====== Target 1: tack ====== -->
  <text x="40" y="96" font-size="12" fill="#4a7a3a" font-weight="bold">target[0]="tack"  tmask={a,c,k,t}</text>
  <text x="40" y="114" font-size="10" fill="#666">逐位剥离 →</text>

  <rect x="150" y="102" width="92" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="196" y="118" text-anchor="middle" font-size="10" fill="#888">−a →{c,k,t}✗</text>
  <rect x="248" y="102" width="92" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="294" y="118" text-anchor="middle" font-size="10" fill="#888">−c →{a,k,t}✗</text>
  <rect x="346" y="102" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="392" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">−k →{a,c,t}✓</text>
  <text x="448" y="118" font-size="11" fill="#4a7a3a" font-weight="bold">命中 "act" → count=1</text>

  <!-- divider -->
  <line x1="40" y1="136" x2="520" y2="136" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ====== Target 2: act ====== -->
  <text x="40" y="158" font-size="12" fill="#b85450" font-weight="bold">target[1]="act"  tmask={a,c,t}</text>
  <text x="40" y="176" font-size="10" fill="#666">逐位剥离 →</text>

  <rect x="150" y="164" width="92" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="196" y="180" text-anchor="middle" font-size="10" fill="#888">−a →{c,t}✗</text>
  <rect x="248" y="164" width="92" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="294" y="180" text-anchor="middle" font-size="10" fill="#888">−c →{a,t}✗</text>
  <rect x="346" y="164" width="92" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="392" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−t →{a,c}✗</text>
  <text x="448" y="180" font-size="11" fill="#b85450" font-weight="bold">全未命中（不能少加字母）</text>

  <!-- divider -->
  <line x1="40" y1="198" x2="520" y2="198" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ====== Target 3: acti ====== -->
  <text x="40" y="220" font-size="12" fill="#4a7a3a" font-weight="bold">target[2]="acti"  tmask={a,c,t,i}</text>
  <text x="40" y="238" font-size="10" fill="#666">逐位剥离 →</text>

  <rect x="120" y="226" width="78" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="159" y="242" text-anchor="middle" font-size="9" fill="#888">−a→{c,t,i}✗</text>
  <rect x="202" y="226" width="78" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="241" y="242" text-anchor="middle" font-size="9" fill="#888">−c→{a,t,i}✗</text>
  <rect x="284" y="226" width="78" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="323" y="242" text-anchor="middle" font-size="9" fill="#888">−t→{a,c,i}✗</text>
  <rect x="366" y="226" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="405" y="242" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">−i→{a,c,t}✓</text>
  <text x="452" y="242" font-size="10" fill="#4a7a3a" font-weight="bold">命中→count=2</text>

  <!-- ====== Result box ====== -->
  <rect x="40" y="270" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="295" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 count = 2  ✓  （target[0] 与 target[2] 可获得）</text>

  <!-- ====== Bottom note: bitmask trick ====== -->
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">位运算细节</text>

  <rect x="40" y="344" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="368" font-size="11" fill="#555" font-weight="bold">① 编码：mask |= 1 &lt;&lt; (ch − 'a')   // 字母 a..z 映射到第 0..25 位</text>
  <text x="60" y="390" font-size="11" fill="#555" font-weight="bold">② 探测：probe = tmask &amp; ~(1 &lt;&lt; bit)   // 去掉第 bit 位</text>
  <text x="60" y="412" font-size="11" fill="#555" font-weight="bold">③ 仅当 tmask 第 bit 位为 1 才需试探：先 if (tmask &gt;&gt; bit) &amp; 1</text>
  <text x="60" y="434" font-size="11" fill="#888">每个 target 至多 26 次探测，哈希集合 O(1) 查询 → 总 O((|start|+|target|)·26)</text>
  <text x="60" y="454" font-size="10" fill="#888">约束：每个字母至多出现一次 → 掩码无重复位，编码/剥离均无歧义</text>
</svg>
