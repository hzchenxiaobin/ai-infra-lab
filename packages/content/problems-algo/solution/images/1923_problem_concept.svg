<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">最长公共子路径：所有路径中都出现的连续城市序列</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">子路径 = 路径中连续的城市序列（类比子串，不是子序列）</text>

  <!-- Path 0: [0,1,2,3,4] -->
  <text x="40" y="90" font-size="12" fill="#888" font-weight="bold">路径 0</text>
  <g font-size="13">
    <rect x="100" y="74" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="125" y="96" text-anchor="middle" fill="#446688">0</text>
    <rect x="152" y="74" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="177" y="96" text-anchor="middle" fill="#446688">1</text>
    <rect x="204" y="74" width="50" height="34" rx="5" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="229" y="96" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="256" y="74" width="50" height="34" rx="5" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="281" y="96" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="308" y="74" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="333" y="96" text-anchor="middle" fill="#446688">4</text>
  </g>
  <!-- bracket for common subpath -->
  <path d="M 204 116 L 204 122 L 306 122 L 306 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="255" y="138" text-anchor="middle" font-size="10" fill="#b85450">[2, 3] ✓</text>

  <!-- Path 1: [2,3,4] -->
  <text x="40" y="170" font-size="12" fill="#888" font-weight="bold">路径 1</text>
  <g font-size="13">
    <rect x="204" y="154" width="50" height="34" rx="5" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="229" y="176" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="256" y="154" width="50" height="34" rx="5" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="281" y="176" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="308" y="154" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="333" y="176" text-anchor="middle" fill="#446688">4</text>
  </g>
  <path d="M 204 196 L 204 202 L 306 202 L 306 196" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="255" y="218" text-anchor="middle" font-size="10" fill="#b85450">[2, 3] ✓</text>

  <!-- Path 2: [4,0,1,2,3] -->
  <text x="40" y="250" font-size="12" fill="#888" font-weight="bold">路径 2</text>
  <g font-size="13">
    <rect x="100" y="234" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="125" y="256" text-anchor="middle" fill="#446688">4</text>
    <rect x="152" y="234" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="177" y="256" text-anchor="middle" fill="#446688">0</text>
    <rect x="204" y="234" width="50" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="229" y="256" text-anchor="middle" fill="#446688">1</text>
    <rect x="256" y="234" width="50" height="34" rx="5" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="281" y="256" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="308" y="234" width="50" height="34" rx="5" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="333" y="256" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>
  <path d="M 256 276 L 256 282 L 358 282 L 358 276" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="307" y="298" text-anchor="middle" font-size="10" fill="#b85450">[2, 3] ✓</text>

  <!-- Bottom summary box -->
  <rect x="40" y="316" width="540" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="340" font-size="12" fill="#444" font-weight="bold">目标：找最长的 L，使存在长度为 L 的连续序列出现在所有路径中</text>
  <text x="60" y="360" font-size="11" fill="#d6a040">关键性质：若长度 L 的公共子路径存在 ⇒ 长度 L−1 也必存在（截取子段即可）</text>
  <text x="60" y="376" font-size="11" fill="#b85450" font-weight="bold">⇒ 单调性成立 ⇒ 二分答案 L，用滚动哈希验证</text>
</svg>
