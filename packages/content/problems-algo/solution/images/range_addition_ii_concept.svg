<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个操作覆盖左上角矩形，最大值 = 所有矩形交集</text>

  <!-- 4x4 grid representing M (m=4, n=4), cell=44, start x=190 y=64 -->
  <!-- grid lines -->
  <g stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)">
    <path d="M190 64 L366 64 M190 108 L366 108 M190 152 L366 152 M190 196 L366 196 M190 240 L366 240"/>
    <path d="M190 64 L190 240 M234 64 L234 240 M278 64 L278 240 M322 64 L322 240 M366 64 L366 240"/>
  </g>

  <!-- Rect A = op [4,4] covers whole grid (blue outline) -->
  <rect x="190" y="64" width="176" height="176" fill="none" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <!-- Rect B = op [3,3] (orange outline) -->
  <rect x="190" y="64" width="132" height="132" fill="none" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <!-- Rect C = op [2,2] = intersection (red fill) -->
  <rect x="190" y="64" width="88" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="2" filter="url(#rough2)"/>

  <!-- labels for each rectangle on the right -->
  <text x="376" y="74" font-size="11" fill="#446688" font-weight="bold">op [4,4]</text>
  <text x="376" y="118" font-size="11" fill="#d6a040" font-weight="bold">op [3,3]</text>
  <text x="376" y="162" font-size="11" fill="#b85450" font-weight="bold">op [2,2]</text>

  <!-- origin label -->
  <text x="184" y="58" text-anchor="end" font-size="10" fill="#888">(0,0)</text>

  <!-- intersection annotation -->
  <path d="M 234 108 Q 120 150 96 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="40" y="200" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">交集 = 最大值区域</text>
  <text x="115" y="234" text-anchor="middle" font-size="10" fill="#666">被每个操作都覆盖</text>

  <!-- formula box -->
  <rect x="40" y="262" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最大值个数 = min(aᵢ) × min(bᵢ)</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#666">所有操作 aᵢ 的最小者 × 所有操作 bᵢ 的最小者</text>

  <!-- empty ops special case -->
  <rect x="40" y="324" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">特例：ops 为空 → 全矩阵都是 0 → 最大值个数 = m × n</text>

  <!-- insight dashed box -->
  <rect x="40" y="372" width="480" height="0" fill="none"/>
</svg>
