<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：每个查询一趟 O(n) 判定</text>

  <!-- 预处理 -->
  <rect x="70" y="32" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="51" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">预处理 s：prefS[i] 与 onesS（全程共享）</text>
  <path d="M 180 62 L 180 72" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 取一个 t -->
  <rect x="70" y="76" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="95" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">取 t：数 fixed、q，k = onesS − fixed</text>
  <path d="M 180 106 L 180 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断 1：k 范围 -->
  <polygon points="110,142 180,118 250,142 180,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="147" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0 ≤ k ≤ q ?</text>
  <path d="M 180 166 L 180 178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="189" y="176" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 250 142 L 326 136" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="132" font-size="9" fill="#a0433f" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 填 '?' -->
  <rect x="70" y="182" width="220" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="201" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">从右往左填 '?'：最右 k 个 → '1'，其余 → '0'</text>
  <path d="M 180 212 L 180 222" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 前缀检查 -->
  <rect x="70" y="226" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="245" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">从左往右累计 ones，逐位比 prefS[i]</text>
  <path d="M 180 256 L 180 266" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断 2：前缀条件 -->
  <polygon points="110,292 180,268 250,292 180,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="290" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">每位都</text>
  <text x="180" y="303" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ones ≤ prefS[i] ?</text>
  <path d="M 180 316 L 180 328" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="189" y="328" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 250 292 L 326 286" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="282" font-size="9" fill="#a0433f" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- true -->
  <rect x="70" y="332" width="220" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="350" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans[i] = true ✓ → 下一个 t</text>

  <!-- false 框 1 -->
  <rect x="330" y="112" width="178" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="129" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">ans[i] = false → 下一个 t</text>
  <text x="419" y="146" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">k&lt;0：'1' 太多；k&gt;q：'?' 不够</text>

  <!-- false 框 2 -->
  <rect x="330" y="262" width="178" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="279" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">ans[i] = false → 下一个 t</text>
  <text x="419" y="296" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">某前缀的 1 个数超过 s 的同前缀</text>

  <!-- 贪心正确性注记 -->
  <rect x="330" y="316" width="178" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="333" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">贪心正确性：k 个 '1' 放最右的 '?'</text>
  <text x="419" y="350" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">⇒ 任意前缀的 1 数同时最小</text>

  <!-- 回环箭头 -->
  <path d="M 70 345 L 42 345 L 42 91 L 68 91" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="34" y="220" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 34 220)" filter="url(#rough2)">对 strs 中每个 t 循环</text>
</svg>
