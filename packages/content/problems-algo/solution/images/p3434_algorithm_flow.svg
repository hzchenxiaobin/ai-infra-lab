<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="20" y="24" font-size="13" fill="#333" filter="url(#rough2)">算法流程：值域枚举 v + 变换 + Kadane（O(50n) 时间 / O(1) 空间）</text>

  <!-- Step 1 -->
  <rect x="100" y="44" width="320" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 统计 totalK：数组中 k 的总个数</text>
  <text x="260" y="79" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans ← totalK（取 x = 0 的保底）</text>

  <line x1="260" y1="88" x2="260" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop header -->
  <rect x="100" y="112" width="320" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#2f5224" filter="url(#rough2)">② 枚举 v = 1 … 50（跳过 v = k）</text>
  <text x="260" y="147" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">值域只有 1~50，直接枚举！</text>

  <line x1="260" y1="156" x2="260" y2="176" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: transform -->
  <rect x="100" y="180" width="320" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 变换：元素 = v 记 +1；元素 = k 记 −1</text>
  <text x="260" y="215" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">其余元素记 0（对子段和无贡献）</text>

  <line x1="260" y1="224" x2="260" y2="244" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: kadane -->
  <rect x="100" y="248" width="320" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 一趟 Kadane：cur += b[i]</text>
  <text x="260" y="283" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">cur &lt; 0 就清零；best = max(best, cur) ≥ 0</text>

  <line x1="260" y1="292" x2="260" y2="312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: update answer -->
  <rect x="100" y="316" width="320" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ ans ← max(ans, totalK + best)</text>

  <!-- loop back to step 2 -->
  <path d="M 424,336 C 488,336 488,134 424,134" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <line x1="260" y1="356" x2="260" y2="374" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="100" y="378" width="320" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="400" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">所有 v 枚举完 → 返回 ans</text>
</svg>
