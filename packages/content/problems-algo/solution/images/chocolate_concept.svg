<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：阈值 T 越大 → 可切段数 cnt(T) 越少（单调递减）</text>

  <!-- ===== Chocolate bar with piece grouping (T=6, K=5) ===== -->
  <text x="40" y="52" font-size="12" fill="#888">甜度数组 (T=6 时的贪心切割, 切成 6 段):</text>

  <!-- Piece brackets above boxes -->
  <!-- P1: 1,2,3 = 6 -->
  <path d="M 96 116 L 96 108 L 192 108 L 192 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="144" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">P1 = 6</text>
  <!-- P2: 4,5 = 9 -->
  <path d="M 194 116 L 194 108 L 260 108 L 260 116" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="227" y="102" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">P2 = 9</text>
  <!-- P3: 6 = 6 (min, highlighted) -->
  <path d="M 262 116 L 262 108 L 294 108 L 294 116" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="278" y="102" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">P3 = 6</text>
  <!-- P4: 7 -->
  <path d="M 296 116 L 296 108 L 328 108 L 328 116" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="312" y="102" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">P4 = 7</text>
  <!-- P5: 8 -->
  <path d="M 330 116 L 330 108 L 362 108 L 362 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="346" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">P5 = 8</text>
  <!-- P6: 9 -->
  <path d="M 364 116 L 364 108 L 396 108 L 396 116" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="380" y="102" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">P6 = 9</text>

  <!-- baseline -->
  <line x1="90" y1="162" x2="402" y2="162" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 9 chunk boxes, colored by piece -->
  <!-- P1 (green): 1,2,3 -->
  <rect x="96" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="164" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- P2 (blue): 4,5 -->
  <rect x="198" y="132" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="232" y="132" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <!-- P3 (red, min): 6 -->
  <rect x="266" y="132" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <!-- P4 (orange): 7 -->
  <rect x="300" y="132" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <!-- P5 (green): 8 -->
  <rect x="334" y="132" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <!-- P6 (blue): 9 -->
  <rect x="368" y="132" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <text x="112" y="178" text-anchor="middle" font-size="9" fill="#999">s[0]</text>
  <text x="384" y="178" text-anchor="middle" font-size="9" fill="#999">s[n-1]</text>

  <!-- min highlight label -->
  <rect x="232" y="186" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="292" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最小段 = 6 = 答案</text>

  <!-- arrow down -->
  <path d="M 280 212 L 280 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="222" font-size="11" fill="#888">cnt(T) 单调递减</text>

  <!-- ===== Monotonic curve ===== -->
  <!-- axes -->
  <line x1="90" y1="240" x2="90" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="370" x2="380" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="246" text-anchor="end" font-size="10" fill="#888">cnt</text>
  <text x="384" y="374" font-size="10" fill="#888">T →</text>
  <text x="84" y="374" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- decreasing curve: T=1,cnt=9 -> T=45,cnt=1 -->
  <path d="M 100 250 C 160 270 230 335 380 358" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="150" y="258" font-size="11" fill="#446688" font-weight="bold">T ↑ ⇒ cnt ↓</text>

  <!-- k+1 threshold line -->
  <line x1="90" y1="312" x2="380" y2="312" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="384" y="316" font-size="11" fill="#b85450" font-weight="bold">K+1 = 6</text>

  <!-- answer point at T=6, cnt=6 -->
  <circle cx="118" cy="312" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="118" y1="312" x2="118" y2="370" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="118" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">T = 6</text>

  <!-- feasible / infeasible labels -->
  <text x="160" y="306" font-size="10" fill="#4a7a3a">可行 ✓ (cnt ≥ 6)</text>
  <text x="300" y="306" font-size="10" fill="#b85450">段数不足 ✗</text>

  <!-- right summary note -->
  <rect x="396" y="252" width="150" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="471" y="276" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="471" y="298" text-anchor="middle" font-size="11" fill="#666">T ∈ [min, sum]</text>
  <text x="471" y="318" text-anchor="middle" font-size="11" fill="#666">求最大的 T</text>
  <text x="471" y="336" text-anchor="middle" font-size="11" fill="#666">使 cnt(T) ≥ K+1</text>
  <text x="471" y="360" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
</svg>
