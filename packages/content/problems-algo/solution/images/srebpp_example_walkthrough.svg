<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：L=1, R=2, T=0, B=2 → 面积 6</text>

  <!-- ===== 列标号 ===== -->
  <text x="152" y="92" text-anchor="middle" font-size="9" fill="#999">c0</text>
  <text x="196" y="92" text-anchor="middle" font-size="9" fill="#999">c1</text>
  <text x="240" y="92" text-anchor="middle" font-size="9" fill="#999">c2</text>
  <text x="284" y="92" text-anchor="middle" font-size="9" fill="#999">c3</text>
  <!-- 行标号 -->
  <text x="122" y="126" text-anchor="end" font-size="9" fill="#999">r0</text>
  <text x="122" y="170" text-anchor="end" font-size="9" fill="#999">r1</text>
  <text x="122" y="214" text-anchor="end" font-size="9" fill="#999">r2</text>

  <!-- ===== 网格 3×4 ===== -->
  <!-- row0: 0 0 1 0 -->
  <rect x="130" y="100" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="128" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="174" y="100" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="196" y="128" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="218" y="100" width="44" height="44" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="128" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">1</text>
  <rect x="262" y="100" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="284" y="128" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <!-- row1: 0 1 1 0 -->
  <rect x="130" y="144" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="172" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="174" y="144" width="44" height="44" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="172" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">1</text>
  <rect x="218" y="144" width="44" height="44" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="172" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">1</text>
  <rect x="262" y="144" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="284" y="172" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <!-- row2: 0 1 0 0 -->
  <rect x="130" y="188" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="216" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="174" y="188" width="44" height="44" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="216" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">1</text>
  <rect x="218" y="188" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="216" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="262" y="188" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="284" y="216" text-anchor="middle" font-size="14" fill="#bbb">0</text>

  <!-- 包围矩形 -->
  <rect x="174" y="100" width="88" height="132" fill="none" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- 锚点 -->
  <circle cx="240" cy="122" r="6" fill="#b85450" stroke="#fff" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="252" y="112" font-size="9" fill="#b85450" font-weight="bold">(x=0,y=2)</text>

  <!-- 边界标注 -->
  <text x="174" y="94" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">L=1</text>
  <text x="262" y="94" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">R=2</text>
  <text x="124" y="106" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">T=0</text>
  <text x="124" y="236" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">B=2</text>

  <!-- ===== 右侧：二分结果表 ===== -->
  <text x="430" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">四次二分结果</text>
  <!-- 表头 -->
  <rect x="340" y="100" width="190" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="116" font-size="10" fill="#446688" font-weight="bold">边界</text>
  <text x="430" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">区间</text>
  <text x="510" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">结果</text>
  <!-- 行 L -->
  <rect x="340" y="124" width="190" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="139" font-size="10" fill="#4a7a3a" font-weight="bold">L 左</text>
  <text x="430" y="139" text-anchor="middle" font-size="10" fill="#555">列 [0,2]</text>
  <text x="510" y="139" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- 行 R -->
  <rect x="340" y="146" width="190" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="161" font-size="10" fill="#d6a040" font-weight="bold">R 右</text>
  <text x="430" y="161" text-anchor="middle" font-size="10" fill="#555">列 [2,3]</text>
  <text x="510" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <!-- 行 T -->
  <rect x="340" y="168" width="190" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="183" font-size="10" fill="#4a7a3a" font-weight="bold">T 上</text>
  <text x="430" y="183" text-anchor="middle" font-size="10" fill="#555">行 [0,0]</text>
  <text x="510" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <!-- 行 B -->
  <rect x="340" y="190" width="190" height="22" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="205" font-size="10" fill="#d6a040" font-weight="bold">B 下</text>
  <text x="430" y="205" text-anchor="middle" font-size="10" fill="#555">行 [0,2]</text>
  <text x="510" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- 谓词示例 -->
  <rect x="340" y="226" width="190" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="244" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">例：找 L，列谓词</text>
  <text x="435" y="258" text-anchor="middle" font-size="9" fill="#555">c0=否, c1=是, c2=是</text>
  <text x="435" y="270" text-anchor="middle" font-size="9" fill="#555">首个“是” → L=1</text>

  <!-- ===== 计算框 ===== -->
  <rect x="40" y="300" width="490" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="285" y="322" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">面积 = (R − L + 1) × (B − T + 1)</text>
  <text x="285" y="336" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">
    <tspan fill="#d6a040">(2−1+1)</tspan>
    <tspan fill="#333"> × </tspan>
    <tspan fill="#d6a040">(2−0+1)</tspan>
    <tspan fill="#333"> = </tspan>
    <tspan fill="#d6a040">2</tspan>
    <tspan fill="#333"> × </tspan>
    <tspan fill="#d6a040">3</tspan>
    <tspan fill="#333"> = </tspan>
    <tspan fill="#b85450">6</tspan>
    <tspan fill="#b85450"> ✓</tspan>
  </text>

  <rect x="40" y="356" width="490" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="285" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">连通性保证：列 [1,2]、行 [0,2] 各为连续区间，故谓词单调可二分</text>
</svg>
