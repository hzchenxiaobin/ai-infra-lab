<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：S = 历代全部点，在 7³ = 343 的小宇宙里逐代取中点闭包</text>
  <text x="187" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 2：三个坐标完全对称，只看一个坐标（值域 0..6）</text>

  <g filter="url(#rough2)">
    <!-- 代标签 -->
    <text x="34" y="104" text-anchor="middle" font-size="9.5" fill="#666">第 0 代</text>
    <text x="34" y="162" text-anchor="middle" font-size="9.5" fill="#666">第 1 代</text>
    <text x="34" y="220" text-anchor="middle" font-size="9.5" fill="#666">第 2 代</text>

    <!-- 第 0 代：两个初始点 -->
    <circle cx="70" cy="100" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="70" y="84" text-anchor="middle" font-size="9.5" fill="#33506b">(0,0,0)</text>
    <circle cx="260" cy="100" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="84" text-anchor="middle" font-size="9.5" fill="#33506b">(5,5,5)</text>

    <!-- 第 0 代 → 第 1 代 的配对弧 -->
    <path d="M 72 112 Q 88 142 138 150" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 258 112 Q 242 142 154 150" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- 第 1 代：中点 -->
    <circle cx="146" cy="158" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="162" y="162" font-size="9.5" fill="#2f5d24">(2,2,2) = ⌊(0+5)/2⌋</text>

    <!-- 第 0/1 代 → 第 2 代 的跨代配对弧 -->
    <path d="M 72 112 Q 66 175 102 205" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 141 168 Q 128 190 113 204" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 151 168 Q 164 190 178 204" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 258 112 Q 252 175 190 205" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- 第 2 代：两个新中点（(1,1,1) 是 target） -->
    <circle cx="108" cy="216" r="14" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
    <circle cx="108" cy="216" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="108" y="196" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">(1,1,1)</text>
    <text x="92" y="221" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold">← target!</text>
    <circle cx="184" cy="216" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="184" y="196" text-anchor="middle" font-size="9.5" fill="#8a6d1a">(3,3,3)</text>

    <!-- 虚线对齐到坐标轴 -->
    <line x1="146" y1="170" x2="146" y2="279" stroke="#c9b06a" stroke-width="1" stroke-dasharray="3,4"/>
    <line x1="108" y1="230" x2="108" y2="279" stroke="#c9b06a" stroke-width="1" stroke-dasharray="3,4"/>
    <line x1="184" y1="230" x2="184" y2="279" stroke="#c9b06a" stroke-width="1" stroke-dasharray="3,4"/>

    <!-- 坐标轴 -->
    <line x1="52" y1="285" x2="316" y2="285" stroke="#999" stroke-width="1.5"/>
    <line x1="70" y1="279" x2="70" y2="291" stroke="#999" stroke-width="1.2"/>
    <line x1="108" y1="279" x2="108" y2="291" stroke="#999" stroke-width="1.2"/>
    <line x1="146" y1="279" x2="146" y2="291" stroke="#999" stroke-width="1.2"/>
    <line x1="184" y1="279" x2="184" y2="291" stroke="#999" stroke-width="1.2"/>
    <line x1="222" y1="279" x2="222" y2="291" stroke="#999" stroke-width="1.2"/>
    <line x1="260" y1="279" x2="260" y2="291" stroke="#999" stroke-width="1.2"/>
    <line x1="298" y1="279" x2="298" y2="291" stroke="#999" stroke-width="1.2"/>
    <text x="70" y="308" text-anchor="middle" font-size="10" fill="#666">0</text>
    <text x="108" y="308" text-anchor="middle" font-size="10" fill="#666">1</text>
    <text x="146" y="308" text-anchor="middle" font-size="10" fill="#666">2</text>
    <text x="184" y="308" text-anchor="middle" font-size="10" fill="#666">3</text>
    <text x="222" y="308" text-anchor="middle" font-size="10" fill="#666">4</text>
    <text x="260" y="308" text-anchor="middle" font-size="10" fill="#666">5</text>
    <text x="298" y="308" text-anchor="middle" font-size="10" fill="#666">6</text>
    <text x="184" y="328" text-anchor="middle" font-size="9.5" fill="#888">x / y / z 坐标轴（值域 0..6）</text>
  </g>

  <!-- 右侧要点框 -->
  <g filter="url(#rough2)">
    <rect x="358" y="56" width="182" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="449" y="76" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">宇宙封闭</text>
    <text x="449" y="96" text-anchor="middle" font-size="9.5" fill="#8a6d1a">⌊(a+b)/2⌋ 夹在 a、b 之间</text>
    <text x="449" y="112" text-anchor="middle" font-size="9.5" fill="#8a6d1a">永不逃出初始包围盒</text>
    <text x="449" y="128" text-anchor="middle" font-size="9.5" fill="#8a6d1a">值域 [0,6] ⇒ U = 7³ = 343</text>
    <text x="449" y="144" text-anchor="middle" font-size="9.5" fill="#8a6d1a">无需任何越界检查</text>
    <text x="449" y="164" text-anchor="middle" font-size="9" fill="#8a6d1a">中点只会把点往里收</text>

    <rect x="358" y="196" width="182" height="134" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="449" y="216" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">单调 ⇒ 终止</text>
    <text x="449" y="236" text-anchor="middle" font-size="9.5" fill="#2f5d24">S 只增不减</text>
    <text x="449" y="252" text-anchor="middle" font-size="9.5" fill="#2f5d24">每个有效代 ≥ 1 个新点</text>
    <text x="449" y="268" text-anchor="middle" font-size="9.5" fill="#2f5d24">≤ 343 代后闭包稳定</text>
    <text x="449" y="284" text-anchor="middle" font-size="9.5" fill="#2f5d24">（实测 ≤ 8 代即稳）</text>
    <text x="449" y="304" text-anchor="middle" font-size="9.5" fill="#2f5d24">稳定后 target 未现 → −1</text>
    <text x="449" y="322" text-anchor="middle" font-size="9" fill="#4a6b5a">单点初始集：无点对 → 恒 −1</text>
  </g>

  <!-- 底部关键点 -->
  <g filter="url(#rough2)">
    <rect x="30" y="338" width="315" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="187" y="356" text-anchor="middle" font-size="9.5" fill="#8a3030" font-weight="bold">关键：第 k 代的配对池是 S = 第 0..k−1 代的全部点</text>
    <text x="187" y="372" text-anchor="middle" font-size="9.5" fill="#8a3030">(1,1,1) = ⌊(0+2)/2⌋ 来自第 0 代 × 第 1 代的跨代配对</text>
    <text x="187" y="386" text-anchor="middle" font-size="9" fill="#8a3030">只拿上一代新点配对 → 漏解（WA）</text>
  </g>
</svg>
