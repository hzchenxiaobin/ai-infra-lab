<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="150" y="18" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：排序 → 双指针锯齿构造 → 求和</text>

  <!-- 左列：流程 -->
  <rect x="72" y="30" width="110" height="28" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="127" y="49" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 127 58 L 127 66" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="47" y="70" width="160" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="127" y="91" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 排序 heights（升序）</text>
  <path d="M 127 102 L 127 110" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="47" y="114" width="160" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="127" y="135" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">② 双指针 i = 0, j = n−1</text>
  <path d="M 127 146 L 127 154" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="37" y="158" width="180" height="72" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="127" y="178" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">③ k = 0 … n−1 依次填：</text>
  <text x="127" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k 为偶：res[k] = a[j−−]</text>
  <text x="127" y="214" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k 为奇：res[k] = a[i++]</text>
  <path d="M 127 230 L 127 238" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="37" y="242" width="180" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="127" y="261" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">④ ans = res[0]</text>
  <text x="127" y="280" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">+ Σ|res[k+1] − res[k]|</text>
  <path d="M 127 290 L 127 298" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="62" y="302" width="130" height="30" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="127" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⑤ 返回 ans</text>
  <text x="127" y="348" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">res[0] 即「地面 → 第一块平台」那一跳</text>

  <!-- 右上：双指针走查 -->
  <rect x="252" y="30" width="252" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="378" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">双指针走查：heights = [1,7,9]</text>
  <text x="270" y="72" font-size="10.5" fill="#333" filter="url(#rough2)">k=0 偶 ← a[j]=9（j: 2→1）</text>
  <text x="270" y="91" font-size="10.5" fill="#333" filter="url(#rough2)">k=1 奇 ← a[i]=1（i: 0→1）</text>
  <text x="270" y="110" font-size="10.5" fill="#333" filter="url(#rough2)">k=2 偶 ← a[j]=7（j: 1→0）</text>
  <rect x="286" y="120" width="180" height="22" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">res = [9, 1, 7]</text>

  <!-- 右中：溢出警报 -->
  <rect x="252" y="164" width="252" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="378" y="184" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">注意：溢出警报</text>
  <text x="270" y="206" font-size="10.5" fill="#333" filter="url(#rough2)">答案上界 ≈ 2×10¹⁴</text>
  <text x="270" y="224" font-size="10.5" fill="#333" filter="url(#rough2)">（n = 10⁵、h = 10⁹ 量级）</text>
  <text x="270" y="242" font-size="10.5" fill="#b85450" filter="url(#rough2)">C++ 必须 long long 累加</text>

  <!-- 右下：复杂度 -->
  <rect x="252" y="264" width="252" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="378" y="284" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">复杂度</text>
  <text x="270" y="306" font-size="10.5" fill="#333" filter="url(#rough2)">时间 O(n log n)：排序主导</text>
  <text x="270" y="324" font-size="10.5" fill="#333" filter="url(#rough2)">构造 + 求和均为一趟 O(n)</text>
  <text x="270" y="342" font-size="10.5" fill="#333" filter="url(#rough2)">空间 O(n) 存 res 数组</text>
</svg>
