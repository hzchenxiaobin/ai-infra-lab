<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双重循环枚举输出格，每格扫描 3×3 取最大</text>

  <!-- START -->
  <ellipse cx="280" cy="60" rx="50" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">开始</text>
  <line x1="280" y1="78" x2="280" y2="98" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: init ans matrix -->
  <rect x="150" y="100" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="13" fill="#333">建 maxLocal[(n−2)][(n−2)]，i=0</text>
  <line x1="280" y1="140" x2="280" y2="160" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i <= n-3 ? -->
  <polygon points="280,162 360,196 280,230 200,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ≤ n−3 ?</text>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#888">枚举行</text>

  <!-- No branch: return -->
  <line x1="360" y1="196" x2="430" y2="196" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="178" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="485" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 maxLocal</text>

  <!-- Yes branch down -->
  <line x1="280" y1="230" x2="280" y2="252" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="244" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step: j=0 -->
  <rect x="150" y="254" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="13" fill="#333">j = 0</text>
  <line x1="280" y1="290" x2="280" y2="306" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: j <= n-3 ? -->
  <polygon points="280,308 360,342 280,376 200,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j ≤ n−3 ?</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#888">枚举列</text>

  <!-- No branch: i++ back to top diamond -->
  <line x1="360" y1="342" x2="404" y2="342" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="404" y="324" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="454" y="346" text-anchor="middle" font-size="12" fill="#333">i++，回到 i 判定</text>
  <path d="M 454 324 L 454 196 L 360 196" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch (to inner scan) -->
  <line x1="280" y1="376" x2="280" y2="392" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="386" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Inner scan box -->
  <rect x="90" y="394" width="380" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="413" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mx ← max(grid[i..i+2][j..j+2])；maxLocal[i][j] ← mx；j++ ↺</text>

  <!-- j++ loop back arrow from inner box left side up to j diamond yes entry -->
  <path d="M 90 409 L 60 409 L 60 342 L 200 342" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
