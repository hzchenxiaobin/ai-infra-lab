<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="300" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：parents=[-1,0,1,0,3,3], nums=[5,4,6,2,1,3]</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="610" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="65" y="61" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">阶段</text>
  <text x="125" y="61" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">u</text>
  <text x="260" y="61" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">标记/合并（侧子树）</text>
  <text x="455" y="61" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">seen 集合</text>
  <text x="565" y="61" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">mex</text>
  <text x="615" y="61" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">ans</text>

  <!-- 行：初始 -->
  <rect x="30" y="70" width="610" height="26" fill="#eeeeee" filter="url(#rough2)"/>
  <text x="65" y="87" text-anchor="middle" font-size="10" fill="#666">初始</text>
  <text x="125" y="87" text-anchor="middle" font-size="10" fill="#666">—</text>
  <text x="260" y="87" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="455" y="87" text-anchor="middle" font-size="10" fill="#666">∅</text>
  <text x="565" y="87" text-anchor="middle" font-size="10" fill="#666">1</text>
  <text x="615" y="87" text-anchor="middle" font-size="10" fill="#666">—</text>

  <!-- 行① u=4 -->
  <rect x="30" y="96" width="610" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="65" y="113" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="125" y="113" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="260" y="113" text-anchor="middle" font-size="10" fill="#333">+1（node1 自身）</text>
  <text x="455" y="113" text-anchor="middle" font-size="10" fill="#333">{1}</text>
  <text x="565" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="615" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- 行② u=3 -->
  <rect x="30" y="122" width="610" height="26" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="65" y="139" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="125" y="139" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="260" y="139" text-anchor="middle" font-size="10" fill="#333">+2；合并子树 5（+3）</text>
  <text x="455" y="139" text-anchor="middle" font-size="10" fill="#333">{1,2,3}</text>
  <text x="565" y="139" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <text x="615" y="139" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>

  <!-- 行③ u=0 -->
  <rect x="30" y="148" width="610" height="26" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="65" y="165" text-anchor="middle" font-size="10" fill="#333">③</text>
  <text x="125" y="165" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="260" y="165" text-anchor="middle" font-size="10" fill="#333">+5；合并子树 1（+4,+6）</text>
  <text x="455" y="165" text-anchor="middle" font-size="10" fill="#333">{1,2,3,4,5,6}</text>
  <text x="565" y="165" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>
  <text x="615" y="165" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>

  <!-- 表格边框 + 分隔线 -->
  <rect x="30" y="44" width="610" height="130" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="100" y1="44" x2="100" y2="174" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="150" y1="44" x2="150" y2="174" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="44" x2="370" y2="174" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="540" y1="44" x2="540" y2="174" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="590" y1="44" x2="590" y2="174" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 总结框 -->
  <rect x="30" y="195" width="610" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 ans = [7, 1, 1, 4, 2, 1] ✓</text>
  <text x="48" y="238" font-size="10" fill="#555">• 路径节点 4→3→0：mex 依次 2 → 4 → 7（单调不减，只增不重算）</text>
  <text x="48" y="255" font-size="10" fill="#555">• 侧子树（节点 1/2/5）不含值 1：直接 ans=1，无需进入循环</text>
  <text x="48" y="272" font-size="10" fill="#555">• 每个基因值只被标记一次，总工作量 O(n)</text>
</svg>
