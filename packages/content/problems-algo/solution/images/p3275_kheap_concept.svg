<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：大顶堆只装「最近的 k 个」，堆顶就是第 k 近</text>

  <!-- 排序数轴场景 -->
  <text x="185" y="42" text-anchor="middle" font-size="11" fill="#7a6a50" filter="url(#rough2)">把某时刻所有障碍物距离从小到大排队（例：k = 3，已有 6 个）</text>

  <!-- 堆区域虚线框 -->
  <text x="115" y="96" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">堆：最小的 k = 3 个</text>
  <rect x="58" y="104" width="114" height="36" rx="6" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <path d="M 40 122 L 335 122" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 圆点：前三个在堆内，第三个是堆顶 -->
  <circle cx="80" cy="122" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="126" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">3</text>
  <circle cx="115" cy="122" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="126" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">4</text>
  <circle cx="150" cy="122" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="150" y="126" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="195" cy="122" r="10" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="195" y="126" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <circle cx="240" cy="122" r="10" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="126" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">9</text>
  <circle cx="285" cy="122" r="10" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285" y="126" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">12</text>

  <!-- 堆顶与无关区标注 -->
  <path d="M 150 138 L 150 154" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="114" y="170" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">堆顶 5 = 第 3 近 = 答案</text>
  <text x="262" y="170" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 4 近及以后：与答案无关</text>

  <!-- 新距离进入：堆已满时的两种情况 -->
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#7a6a50" font-weight="bold" filter="url(#rough2)">新距离 d 进来（堆已满时）：和堆顶比一比</text>

  <rect x="40" y="206" width="240" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="223" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">d = 2 &lt; 顶 5 → 2 进堆、5 出局，答案变 4</text>

  <rect x="40" y="238" width="240" height="26" rx="5" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="255" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">d = 8 ≥ 顶 5 → 直接丢弃，答案仍是 5</text>

  <!-- 侧注：堆未满 -->
  <rect x="300" y="206" width="210" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="226" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">堆未满（&lt; k 个）时：</text>
  <text x="405" y="243" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">不做比较，d 直接入堆</text>
  <text x="405" y="258" text-anchor="middle" font-size="10" fill="#7a6a50" filter="url(#rough2)">答案保持 −1 直到堆满</text>

  <!-- 底部要点 -->
  <rect x="50" y="278" width="460" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">为什么敢扔掉 7、9、12？障碍物只增不删 → 第 k 近单调不增</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">被挤出「前 k」的距离 ≥ 当时堆顶 ≥ 未来任何堆顶，永不翻身</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#8a3833" filter="url(#rough2)">方向对照：第 k 近 → 大顶堆（本题）；第 k 大 → 小顶堆（703 题）</text>
</svg>
