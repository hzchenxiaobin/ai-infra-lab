<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "eceba"，求至多 2 种字符的最长子串</text>

  <text x="40" y="52" font-size="11" fill="#888">下标:</text>
  <text x="120" y="52" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="170" y="52" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="220" y="52" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="270" y="52" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="320" y="52" font-size="11" fill="#888" font-weight="bold">4</text>

  <!-- char cells -->
  <rect x="100" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="146" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="192" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="238" y="58" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="284" y="58" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <!-- Steps table header -->
  <text x="30" y="118" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="80" y="118" font-size="12" fill="#444" font-weight="bold">right</text>
  <text x="130" y="118" font-size="12" fill="#444" font-weight="bold">字符</text>
  <text x="180" y="118" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="330" y="118" font-size="12" fill="#444" font-weight="bold">freq（种类）</text>
  <text x="470" y="118" font-size="12" fill="#444" font-weight="bold">窗口</text>
  <text x="540" y="118" font-size="12" fill="#444" font-weight="bold">max</text>

  <line x1="20" y1="124" x2="560" y2="124" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <text x="30" y="144" font-size="11" fill="#333">1</text>
  <text x="80" y="144" font-size="11" fill="#333">0</text>
  <text x="130" y="144" font-size="11" fill="#333" font-weight="bold">e</text>
  <text x="180" y="144" font-size="11" fill="#82b366">入窗，种类 1 ≤ 2</text>
  <text x="330" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">{e:1}（1）</text>
  <text x="470" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">[e]</text>
  <text x="540" y="144" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Step 2 -->
  <text x="30" y="166" font-size="11" fill="#333">2</text>
  <text x="80" y="166" font-size="11" fill="#333">1</text>
  <text x="130" y="166" font-size="11" fill="#333" font-weight="bold">c</text>
  <text x="180" y="166" font-size="11" fill="#82b366">入窗，种类 2 ≤ 2</text>
  <text x="330" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">{e:1,c:1}（2）</text>
  <text x="470" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">[e,c]</text>
  <text x="540" y="166" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Step 3 -->
  <text x="30" y="188" font-size="11" fill="#333">3</text>
  <text x="80" y="188" font-size="11" fill="#333">2</text>
  <text x="130" y="188" font-size="11" fill="#333" font-weight="bold">e</text>
  <text x="180" y="188" font-size="11" fill="#82b366">入窗，e 已在窗</text>
  <text x="330" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">{e:2,c:1}（2）</text>
  <text x="470" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">[e,c,e]</text>
  <text x="540" y="188" font-size="11" fill="#333" font-weight="bold">3 ⭐</text>

  <!-- Step 4a: b enters, distinct=3 > 2 -->
  <text x="30" y="210" font-size="11" fill="#333">4</text>
  <text x="80" y="210" font-size="11" fill="#333">3</text>
  <text x="130" y="210" font-size="11" fill="#333" font-weight="bold">b</text>
  <text x="180" y="210" font-size="11" fill="#b85450">入窗，种类 3 &gt; 2!</text>
  <text x="330" y="210" font-size="11" fill="#b85450" font-weight="bold">{e:2,c:1,b:1}（3）</text>
  <text x="470" y="210" font-size="11" fill="#d6a040" font-weight="bold">需收缩</text>
  <text x="540" y="210" font-size="11" fill="#333">3</text>

  <!-- Step 4b: shrink left=0, remove e -->
  <text x="30" y="232" font-size="10" fill="#888">4'</text>
  <text x="80" y="232" font-size="10" fill="#888">—</text>
  <text x="130" y="232" font-size="10" fill="#888">—</text>
  <text x="180" y="232" font-size="10" fill="#b85450">left=0 移 e→1，仍 3 种</text>
  <text x="330" y="232" font-size="10" fill="#b85450">{e:1,c:1,b:1}（3）</text>
  <text x="470" y="232" font-size="10" fill="#d6a040">left→1</text>
  <text x="540" y="232" font-size="10" fill="#888">3</text>

  <!-- Step 4c: shrink left=1, remove c -->
  <text x="30" y="254" font-size="10" fill="#888">4''</text>
  <text x="80" y="254" font-size="10" fill="#888">—</text>
  <text x="130" y="254" font-size="10" fill="#888">—</text>
  <text x="180" y="254" font-size="10" fill="#82b366">left=1 移 c→0，种类 2 ✓</text>
  <text x="330" y="254" font-size="10" fill="#4a7a3a">{e:1,b:1}（2）</text>
  <text x="470" y="254" font-size="10" fill="#4a7a3a" font-weight="bold">[e,b]</text>
  <text x="540" y="254" font-size="10" fill="#888">3</text>

  <!-- Step 5a: a enters, distinct=3 > 2 -->
  <text x="30" y="278" font-size="11" fill="#333">5</text>
  <text x="80" y="278" font-size="11" fill="#333">4</text>
  <text x="130" y="278" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="180" y="278" font-size="11" fill="#b85450">入窗，种类 3 &gt; 2!</text>
  <text x="330" y="278" font-size="11" fill="#b85450" font-weight="bold">{e:1,b:1,a:1}（3）</text>
  <text x="470" y="278" font-size="11" fill="#d6a040" font-weight="bold">需收缩</text>
  <text x="540" y="278" font-size="11" fill="#333">3</text>

  <!-- Step 5b: shrink left=2, remove e -->
  <text x="30" y="300" font-size="10" fill="#888">5'</text>
  <text x="80" y="300" font-size="10" fill="#888">—</text>
  <text x="130" y="300" font-size="10" fill="#888">—</text>
  <text x="180" y="300" font-size="10" fill="#82b366">left=2 移 e→0，种类 2 ✓</text>
  <text x="330" y="300" font-size="10" fill="#4a7a3a">{b:1,a:1}（2）</text>
  <text x="470" y="300" font-size="10" fill="#4a7a3a" font-weight="bold">[b,a]</text>
  <text x="540" y="300" font-size="10" fill="#888">3</text>

  <!-- result box -->
  <rect x="60" y="330" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="352" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 3，最长子串 "ece"（下标 0-2）</text>
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#888">left、right 各至多移动 n 次 → 整体 O(n)</text>

  <!-- legend -->
  <rect x="60" y="404" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="415" font-size="11" fill="#555">入窗/收缩成功</text>
  <rect x="190" y="404" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="210" y="415" font-size="11" fill="#555">种类超限触发收缩</text>
  <rect x="340" y="404" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="360" y="415" font-size="11" fill="#555">中间收缩步</text>
  <text x="460" y="415" font-size="11" fill="#888">⭐ = 全局最大</text>
</svg>
