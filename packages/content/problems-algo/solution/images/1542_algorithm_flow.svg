<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀异或 + 首次出现下标</text>

  <!-- init box -->
  <rect x="150" y="48" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#444">first[0]=−1, 其余 −2(未出现); mask=0, ans=0</text>

  <path d="M 280 96 L 280 116" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <path d="M 280 118 L 470 150 L 280 182 L 90 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">遍历下标 i，字符 ch</text>

  <path d="M 280 184 L 280 204" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- flip bit -->
  <rect x="160" y="206" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#333">mask ^= 1 &lt;&lt; (ch - '0')  （翻一位）</text>

  <path d="M 280 246 L 280 262" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- case 1 -->
  <rect x="60" y="264" width="210" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">情形一：全偶</text>
  <text x="165" y="302" text-anchor="middle" font-size="10.5" fill="#444">查 first[mask]</text>
  <text x="165" y="316" text-anchor="middle" font-size="10.5" fill="#4a7a3a">命中 → ans=max(ans,i−first)</text>

  <!-- case 2 -->
  <rect x="290" y="264" width="210" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="395" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">情形二：恰一奇</text>
  <text x="395" y="302" text-anchor="middle" font-size="10.5" fill="#444">枚举 d=0..9: 查 first[mask⊕2^d]</text>
  <text x="395" y="316" text-anchor="middle" font-size="10.5" fill="#b85450">命中 → ans=max(ans,i−first)</text>

  <path d="M 165 324 L 165 342" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 395 324 L 395 342" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- record first -->
  <rect x="120" y="344" width="320" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">若 first[mask] 未出现 → first[mask] = i</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#b85450">（已存在绝不覆盖，保留最早下标）</text>

  <!-- loop back arrow -->
  <path d="M 440 365 Q 510 365 510 150 Q 510 150 470 150" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="512" y="258" font-size="10" fill="#888">下一字符</text>

  <path d="M 280 388 L 280 408" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="180" y="410" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">返回 ans</text>
</svg>
