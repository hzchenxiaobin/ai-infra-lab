<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：可行的取数序列必然严格递增</text>
  <path d="M 260 44 L 260 190" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,5" filter="url(#rough2)"/>
  <text x="135" y="56" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 反证：先 5 后 3？</text>
  <text x="75" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">先取</text>
  <text x="175" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">后取</text>
  <rect x="52" y="74" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="152" y="74" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="97" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 102 92 L 148 92" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="135" y="128" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取 3 时 x ≥ 5（x 已含 5）</text>
  <text x="135" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">操作条件要求 3 &gt; x ≥ 5</text>
  <text x="135" y="178" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 3 &gt; 5 ？矛盾！</text>
  <path d="M 118 162 L 152 186" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="386" y="56" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 正例：升序 1 → 4 → 6</text>
  <rect x="288" y="74" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="97" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="368" y="74" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="388" y="97" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="448" y="74" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="468" y="97" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 332 92 L 364 92" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 412 92 L 444 92" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="386" y="128" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">x 轨迹：0 → 1 → 5 → 11</text>
  <text x="386" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">步步检查：1&gt;0 ✓   4&gt;1 ✓   6&gt;5 ✓</text>
  <text x="386" y="178" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总奖励 11，合法！</text>
  <rect x="30" y="202" width="460" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">先取 a 再取 b  ⇒  b &gt; x ≥ a  ⇒  b &gt; a（相邻即递增）</text>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⟹ 可行序列必严格递增：升序是唯一可能的形状</text>
  <text x="260" y="280" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">⟹ 重复值至多取一次（同值第二次取时 x ≥ v，必不合法）</text>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">⟹ 排序去重后「选或不选」，问题退化为 0-1 背包</text>
</svg>
