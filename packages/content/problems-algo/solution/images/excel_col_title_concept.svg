<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：先减 1 把 1-indexed 平移到 0-indexed</text>

  <!-- ===== Row 1: Excel 字母表（1-indexed，无 0）===== -->
  <text x="36" y="68" font-size="12" fill="#446688" font-weight="bold">Excel 列</text>
  <text x="36" y="82" font-size="10" fill="#888">1-indexed</text>

  <rect x="120" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <text x="138" y="98" text-anchor="middle" font-size="10" fill="#888">1</text>

  <rect x="166" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>
  <text x="184" y="98" text-anchor="middle" font-size="10" fill="#888">2</text>

  <text x="220" y="73" font-size="14" fill="#bbb" font-weight="bold">···</text>

  <rect x="250" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="268" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Y</text>
  <text x="268" y="98" text-anchor="middle" font-size="10" fill="#888">25</text>

  <rect x="296" y="52" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="73" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Z</text>
  <text x="314" y="98" text-anchor="middle" font-size="10" fill="#d6a040">26</text>

  <!-- 缺失的 0 槽位 -->
  <rect x="372" y="52" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="390" y="73" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">?</text>
  <text x="390" y="98" text-anchor="middle" font-size="10" fill="#b85450">0</text>
  <text x="418" y="73" font-size="11" fill="#b85450" font-weight="bold">← 无字母</text>
  <text x="418" y="86" font-size="10" fill="#b85450">代表 0</text>

  <!-- 问题说明 -->
  <rect x="36" y="112" width="488" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">直接 n % 26：当 n=26(Z) 时余 0，无字母可对应 → off-by-one</text>

  <!-- arrow down to fix -->
  <path d="M 280 150 Q 280 162 280 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">修正：每轮先 n--</text>

  <!-- ===== Row 2: 减 1 后，0~25 全部对应字母 ===== -->
  <text x="36" y="204" font-size="12" fill="#4a7a3a" font-weight="bold">减 1 后</text>
  <text x="36" y="218" font-size="10" fill="#888">0-indexed</text>

  <rect x="120" y="188" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="209" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">A</text>
  <text x="138" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>

  <rect x="166" y="188" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>
  <text x="184" y="234" text-anchor="middle" font-size="10" fill="#888">1</text>

  <text x="220" y="209" font-size="14" fill="#bbb" font-weight="bold">···</text>

  <rect x="250" y="188" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="268" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Y</text>
  <text x="268" y="234" text-anchor="middle" font-size="10" fill="#888">24</text>

  <rect x="296" y="188" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="209" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Z</text>
  <text x="314" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a">25</text>

  <text x="350" y="209" font-size="11" fill="#4a7a3a" font-weight="bold">0~25 全部</text>
  <text x="350" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">有字母</text>

  <!-- arrow down to formula -->
  <path d="M 280 248 Q 280 260 280 270" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="60" y="274" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">digit = (n − 1) % 26 ；字母 = chr(digit + 'A')；n = (n − 1) / 26</text>

  <!-- 验证小例 -->
  <rect x="60" y="320" width="210" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="165" y="340" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">n = 26（期望 Z）</text>
  <text x="165" y="358" text-anchor="middle" font-size="10.5" fill="#555">n-- → 25，25%26=25 → Z</text>
  <text x="165" y="374" text-anchor="middle" font-size="10.5" fill="#555">n = 25/26 = 0，停止 ✓</text>

  <rect x="290" y="320" width="210" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="395" y="340" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">n = 28（期望 AB）</text>
  <text x="395" y="358" text-anchor="middle" font-size="10.5" fill="#555">第1轮: 27%26=1 → B，n=1</text>
  <text x="395" y="374" text-anchor="middle" font-size="10.5" fill="#555">第2轮: 0%26=0 → A，停止 ✓</text>
</svg>
