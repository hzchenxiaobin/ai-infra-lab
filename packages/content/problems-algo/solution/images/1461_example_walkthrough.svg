<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "00110110", k = 2, need = 2^2 = 4</text>
  <text x="310" y="40" text-anchor="middle" font-size="10.5" fill="#888">mask = 3；val 初始 0；i ≥ k−1=1 时窗口已满，入集</text>

  <!-- Header row y=50-74 ; columns: i | s[i] | bit | val | i≥k-1? | seen | |seen| -->
  <!-- col x: i=70/36, s[i]=106/44, bit=150/40, val=190/50, i≥k-1?=240/90, seen=330/180, |seen|=510/50 -->
  <rect x="70" y="50" width="36" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <rect x="106" y="50" width="44" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s[i]</text>
  <rect x="150" y="50" width="40" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">bit</text>
  <rect x="190" y="50" width="50" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">val</text>
  <rect x="240" y="50" width="90" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i ≥ k−1 ?</text>
  <rect x="330" y="50" width="180" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">seen（入集后）</text>
  <rect x="510" y="50" width="50" height="24" rx="3" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="535" y="67" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">|seen|</text>

  <!-- Row 0: i=0, 0, 0, 0, ✗, ∅, 0 -->
  <rect x="70" y="74" width="490" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="92" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="128" y="92" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="170" y="92" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="215" y="92" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="285" y="92" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 未满</text>
  <text x="420" y="92" text-anchor="middle" font-size="11" fill="#888">∅</text>
  <text x="535" y="92" text-anchor="middle" font-size="11.5" fill="#333">0</text>

  <!-- Row 1: i=1, 0, 0, 0, ✓ add 0, {0}, 1 -->
  <rect x="70" y="100" width="490" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="118" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="128" y="118" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="170" y="118" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="215" y="118" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="285" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓ add 0</text>
  <text x="420" y="118" text-anchor="middle" font-size="11" fill="#333">{0}</text>
  <text x="535" y="118" text-anchor="middle" font-size="11.5" fill="#333">1</text>

  <!-- Row 2: i=2, 1, 1, 1, ✓ add 1, {0,1}, 2 -->
  <rect x="70" y="126" width="490" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="144" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="128" y="144" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="170" y="144" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="215" y="144" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="285" y="144" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓ add 1</text>
  <text x="420" y="144" text-anchor="middle" font-size="11" fill="#333">{0, 1}</text>
  <text x="535" y="144" text-anchor="middle" font-size="11.5" fill="#333">2</text>

  <!-- Row 3: i=3, 1, 1, 3, ✓ add 3, {0,1,3}, 3 -->
  <rect x="70" y="152" width="490" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="170" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="128" y="170" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="170" y="170" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="215" y="170" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="285" y="170" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓ add 3</text>
  <text x="420" y="170" text-anchor="middle" font-size="11" fill="#333">{0, 1, 3}</text>
  <text x="535" y="170" text-anchor="middle" font-size="11.5" fill="#333">3</text>

  <!-- Row 4: i=4, 0, 0, 2, ✓ add 2, {0,1,3,2}, 4  HIGHLIGHT - reaches need -->
  <rect x="70" y="178" width="490" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="88" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="128" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <text x="170" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <text x="215" y="196" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="285" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ add 2</text>
  <text x="420" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">{0, 1, 3, 2}</text>
  <text x="535" y="196" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">4 ★</text>

  <!-- Row 5: i=5, 1, 1, 1, ✓ add 1(dup), {0,1,3,2}, 4 -->
  <rect x="70" y="204" width="490" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="222" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="128" y="222" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="170" y="222" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="215" y="222" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="285" y="222" text-anchor="middle" font-size="10.5" fill="#888">✓ 重复</text>
  <text x="420" y="222" text-anchor="middle" font-size="11" fill="#333">{0, 1, 3, 2}</text>
  <text x="535" y="222" text-anchor="middle" font-size="11.5" fill="#333">4</text>

  <!-- Row 6: i=6, 1, 1, 3, ✓ add 3(dup), {0,1,3,2}, 4 -->
  <rect x="70" y="230" width="490" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="248" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="128" y="248" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="170" y="248" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="215" y="248" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="285" y="248" text-anchor="middle" font-size="10.5" fill="#888">✓ 重复</text>
  <text x="420" y="248" text-anchor="middle" font-size="11" fill="#333">{0, 1, 3, 2}</text>
  <text x="535" y="248" text-anchor="middle" font-size="11.5" fill="#333">4</text>

  <!-- Row 7: i=7, 0, 0, 2, ✓ add 2(dup), {0,1,3,2}, 4 -->
  <rect x="70" y="256" width="490" height="26" fill="#ffffff" stroke="#cfd8dc" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="274" text-anchor="middle" font-size="11.5" fill="#333">7</text>
  <text x="128" y="274" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="170" y="274" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="215" y="274" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="285" y="274" text-anchor="middle" font-size="10.5" fill="#888">✓ 重复</text>
  <text x="420" y="274" text-anchor="middle" font-size="11" fill="#333">{0, 1, 3, 2}</text>
  <text x="535" y="274" text-anchor="middle" font-size="11.5" fill="#333">4</text>

  <!-- annotation arrow pointing to row 4 -->
  <path d="M 600 191 L 564 191" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="598" y="186" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">命中</text>
  <text x="598" y="200" text-anchor="end" font-size="10" fill="#d6a040">|seen|=need</text>

  <!-- Summary box -->
  <rect x="80" y="300" width="460" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="320" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i=4 时 |seen| = 4 = 2^k → return true ✓</text>
  <text x="310" y="340" text-anchor="middle" font-size="11" fill="#555">val 演变：0→0→1→3→2，恰好覆盖 {00,01,11,10} 全部 4 种编码</text>
</svg>
