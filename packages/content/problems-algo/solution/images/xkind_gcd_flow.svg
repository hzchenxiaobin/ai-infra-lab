<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：统计频次 → 求总 GCD → 判 ≥ 2</text>

  <!-- Step 1: count frequency -->
  <rect x="160" y="44" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">① 哈希表统计每张牌的频次</text>

  <path d="M 270 86 L 270 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute overall GCD -->
  <rect x="160" y="110" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">② 求所有频次的 GCD</text>

  <path d="M 270 152 L 270 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="270,176 360,220 270,264 180,220" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">GCD ≥ 2 ?</text>

  <!-- Yes branch -->
  <path d="M 360 220 L 420 220" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="420" y="200" width="92" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="466" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return true</text>

  <!-- No branch -->
  <path d="M 180 220 L 120 220" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="28" y="200" width="92" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="74" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return false</text>

  <!-- Euclidean algorithm box -->
  <rect x="40" y="282" width="460" height="84" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">辗转相除法求 GCD</text>
  <text x="270" y="324" text-anchor="middle" font-size="12" fill="#666">gcd(a, b) = gcd(b, a mod b)，直到 b = 0，此时 a 即为 gcd</text>
  <text x="270" y="346" text-anchor="middle" font-size="12" fill="#666">多频次累求：g = freq[0]；for 每个 freq：g = gcd(g, freq)</text>
</svg>
