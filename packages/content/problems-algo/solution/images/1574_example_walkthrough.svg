<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1,2,3,10,4,2,3,5]</text>

  <!-- Array header -->
  <text x="40" y="56" font-size="11" fill="#888" font-weight="bold">下标</text>
  <text x="40" y="76" font-size="11" fill="#888" font-weight="bold">值</text>

  <!-- index boxes -->
  <g font-size="10" fill="#888">
    <text x="92" y="56" text-anchor="middle">0</text>
    <text x="138" y="56" text-anchor="middle">1</text>
    <text x="184" y="56" text-anchor="middle">2</text>
    <text x="230" y="56" text-anchor="middle">3</text>
    <text x="276" y="56" text-anchor="middle">4</text>
    <text x="322" y="56" text-anchor="middle">5</text>
    <text x="368" y="56" text-anchor="middle">6</text>
    <text x="414" y="56" text-anchor="middle">7</text>
  </g>

  <!-- value boxes: prefix green 0-3, middle red 4-5, suffix blue 6-7 -->
  <rect x="70" y="62" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="116" y="62" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <rect x="162" y="62" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <rect x="208" y="62" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>

  <rect x="254" y="62" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <rect x="300" y="62" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <rect x="346" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <rect x="392" y="62" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- region brackets -->
  <text x="149" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">前缀 i=3</text>
  <text x="299" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删除段</text>
  <text x="381" y="110" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">后缀 j=5</text>

  <!-- initial ans -->
  <rect x="40" y="124" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="146" font-size="11" fill="#555">初始 ans = min(n−1−i, j) = min(7−3, 5) = min(4, 5) = 4</text>

  <!-- Two pointer table -->
  <text x="40" y="180" font-size="12" fill="#555" font-weight="bold">双指针合并过程：</text>

  <!-- table header -->
  <rect x="40" y="190" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤</text>

  <rect x="100" y="190" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">k, l</text>

  <rect x="180" y="190" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">比较</text>

  <rect x="290" y="190" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="340" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">动作</text>

  <rect x="390" y="190" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="435" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ans</text>

  <!-- rows -->
  <g font-size="10" fill="#333">
    <!-- row 1 -->
    <rect x="40" y="220" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="70" y="236" text-anchor="middle">1</text>
    <rect x="100" y="220" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="140" y="236" text-anchor="middle">0, 5</text>
    <rect x="180" y="220" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="235" y="236" text-anchor="middle">1 ≤ 2 ✓</text>
    <rect x="290" y="220" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="236" text-anchor="middle">ans=5−0−1=4, k++</text>
    <rect x="390" y="220" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="435" y="236" text-anchor="middle">4</text>

    <!-- row 2 -->
    <rect x="40" y="246" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="70" y="262" text-anchor="middle">2</text>
    <rect x="100" y="246" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="140" y="262" text-anchor="middle">1, 5</text>
    <rect x="180" y="246" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="235" y="262" text-anchor="middle">2 ≤ 2 ✓</text>
    <rect x="290" y="246" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="262" text-anchor="middle">ans=5−1−1=3, k++</text>
    <rect x="390" y="246" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="435" y="262" text-anchor="middle" font-weight="bold">3</text>

    <!-- row 3 -->
    <rect x="40" y="272" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="70" y="288" text-anchor="middle">3</text>
    <rect x="100" y="272" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="140" y="288" text-anchor="middle">2, 5</text>
    <rect x="180" y="272" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="235" y="288" text-anchor="middle">3 ≤ 2 ✗</text>
    <rect x="290" y="272" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="288" text-anchor="middle">l++</text>
    <rect x="390" y="272" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="435" y="288" text-anchor="middle">3</text>

    <!-- row 4 -->
    <rect x="40" y="298" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="70" y="314" text-anchor="middle">4</text>
    <rect x="100" y="298" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="140" y="314" text-anchor="middle">2, 6</text>
    <rect x="180" y="298" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="235" y="314" text-anchor="middle">3 ≤ 3 ✓</text>
    <rect x="290" y="298" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="314" text-anchor="middle">ans=6−2−1=3, k++</text>
    <rect x="390" y="298" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="435" y="314" text-anchor="middle">3</text>

    <!-- row 5 -->
    <rect x="40" y="324" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="70" y="340" text-anchor="middle">5</text>
    <rect x="100" y="324" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="140" y="340" text-anchor="middle">3, 6</text>
    <rect x="180" y="324" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="235" y="340" text-anchor="middle">10 ≤ 3 ✗</text>
    <rect x="290" y="324" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="340" text-anchor="middle">l++</text>
    <rect x="390" y="324" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="435" y="340" text-anchor="middle">3</text>

    <!-- row 6 -->
    <rect x="40" y="350" width="60" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="70" y="366" text-anchor="middle">6</text>
    <rect x="100" y="350" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="140" y="366" text-anchor="middle">3, 7</text>
    <rect x="180" y="350" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="235" y="366" text-anchor="middle">10 ≤ 5 ✗</text>
    <rect x="290" y="350" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="340" y="366" text-anchor="middle">l++ → l=8, 退出</text>
    <rect x="390" y="350" width="90" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="435" y="366" text-anchor="middle">3</text>
  </g>

  <!-- conclusion -->
  <rect x="40" y="384" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">答案 = 3：删除 [10,4,2]，剩余 [1,2,3,3,5] 非递减</text>
</svg>
