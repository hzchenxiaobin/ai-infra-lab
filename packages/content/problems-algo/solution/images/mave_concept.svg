<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：去绝对值 → 符号枚举 → 拆成 f(i) − f(j)</text>

  <!-- ===== Section A: the expression ===== -->
  <text x="30" y="52" font-size="11" fill="#888" font-weight="bold">原表达式（3 个绝对值项）：</text>

  <rect x="40" y="60" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">|arr1[i]−arr1[j]| + |arr2[i]−arr2[j]| + |i−j|</text>

  <!-- arrows down -->
  <path d="M 280 90 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section B: each abs value -> 2 signs ===== -->
  <text x="30" y="116" font-size="11" fill="#888" font-weight="bold">每个 |x−y| 有 2 种展开 → 3 项共 2³ = 8 种符号组合：</text>

  <!-- term 1 -->
  <rect x="40" y="124" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="142" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">|arr1[i]−arr1[j]|</text>
  <text x="115" y="158" text-anchor="middle" font-size="10" fill="#b85450">→ ±(arr1[i]−arr1[j])</text>

  <!-- term 2 -->
  <rect x="205" y="124" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">|arr2[i]−arr2[j]|</text>
  <text x="280" y="158" text-anchor="middle" font-size="10" fill="#b85450">→ ±(arr2[i]−arr2[j])</text>

  <!-- term 3 -->
  <rect x="370" y="124" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="142" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">|i − j|</text>
  <text x="445" y="158" text-anchor="middle" font-size="10" fill="#b85450">→ ±(i − j)</text>

  <!-- arrow down -->
  <path d="M 280 164 L 280 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section C: fixed signs -> f(i) - f(j) ===== -->
  <text x="30" y="190" font-size="11" fill="#888" font-weight="bold">固定符号 (s₁, s₂, s₃)，按 i / j 分组：</text>

  <rect x="40" y="198" width="480" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#333">s₁(a₁[i]−a₁[j]) + s₂(a₂[i]−a₂[j]) + s₃(i−j)</text>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= [s₁·a₁[i] + s₂·a₂[i] + s₃·i] − [s₁·a₁[j] + s₂·a₂[j] + s₃·j]</text>
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= f(i) − f(j)</text>

  <!-- arrow down -->
  <path d="M 280 256 L 280 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section D: max - min ===== -->
  <text x="30" y="282" font-size="11" fill="#888" font-weight="bold">配对变单点：max[f(i) − f(j)] = max(f) − min(f)</text>

  <!-- 8 combos -->
  <rect x="40" y="290" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="310" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8 种符号组合</text>
  <text x="100" y="326" text-anchor="middle" font-size="10" fill="#888">(s₁,s₂,s₃) ∈ {±1}³</text>

  <!-- arrow -->
  <path d="M 160 315 L 195 315" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- each combo -->
  <rect x="200" y="290" width="160" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">每组：遍历求 max(f), min(f)</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#888">O(n) 一遍扫完</text>

  <!-- arrow -->
  <path d="M 360 315 L 395 315" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="400" y="290" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="310" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取最大差</text>
  <text x="460" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">max(f)−min(f)</text>

  <!-- ===== Section E: optimization note ===== -->
  <rect x="40" y="356" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">优化：(s₁,s₂,s₃) 与 (−s₁,−s₂,−s₃) 结果相同</text>
  <text x="280" y="394" text-anchor="middle" font-size="10" fill="#888">固定 s₁=+1，只需 4 种组合，常数减半</text>
</svg>
