<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：tickets=[2,3,2], k=2, T=2</text>

  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">初始队伍（第 k=2 人下划线高亮）：</text>

  <rect x="60" y="68" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="86" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="105" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="160" y="68" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="205" y="86" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="205" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="260" y="68" width="90" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="86" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i=k=2</text>
  <text x="305" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 255 116 L 255 124 L 355 124 L 355 116" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="305" y="138" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">目标 k</text>

  <text x="40" y="166" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">按位置贡献（T=2，全员 i≤k）：</text>

  <rect x="40" y="180" width="480" height="120" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>

  <text x="55" y="200" font-size="11" fill="#666" filter="url(#rough2)">位置 i</text>
  <text x="55" y="220" font-size="11" fill="#666" filter="url(#rough2)">tickets[i]</text>
  <text x="55" y="240" font-size="11" fill="#666" filter="url(#rough2)">与 k 关系</text>
  <text x="55" y="260" font-size="11" fill="#666" filter="url(#rough2)">贡献</text>
  <text x="55" y="284" font-size="11" fill="#666" filter="url(#rough2)">累计 ans</text>

  <line x1="150" y1="188" x2="150" y2="292" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="180" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="240" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i ≤ k</text>
  <rect x="140" y="248" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="262" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">min(2,2)=2</text>
  <text x="180" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <line x1="230" y1="188" x2="230" y2="292" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i ≤ k</text>
  <rect x="240" y="248" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">min(3,2)=2</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <line x1="330" y1="188" x2="330" y2="292" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="380" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2 = k</text>
  <text x="380" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="380" y="240" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">i = k</text>
  <rect x="340" y="248" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="380" y="262" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">min(2,2)=2</text>
  <text x="380" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="40" y="318" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 ans = 2 + 2 + 2 = 6 ✅</text>

  <text x="40" y="374" font-size="10.5" fill="#888" filter="url(#rough2)">注：本例无 i &gt; k 的人；若有，则按 min(tickets[i], T−1) 计入</text>
</svg>
