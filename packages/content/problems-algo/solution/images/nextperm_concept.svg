<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M8,8 L4,1 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：从右找升序对，做最小幅度增大</text>

  <!-- scan arrow (right to left) above cells -->
  <path d="M 360 86 L 184 86" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="272" y="78" text-anchor="middle" font-size="11" fill="#888">从右往左找首个 nums[i] &lt; nums[i+1]</text>

  <!-- descending suffix bracket over cells 2..5 -->
  <path d="M 174 98 L 174 92 L 358 92 L 358 98" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="266" y="84" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">右侧降序段 [7,4,3,1]</text>

  <!-- array cells -->
  <rect x="80" y="110" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="138" text-anchor="middle" font-size="14" fill="#333">1</text>

  <rect x="126" y="110" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="149" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <rect x="172" y="110" width="46" height="42" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="138" text-anchor="middle" font-size="14" fill="#333">7</text>

  <rect x="218" y="110" width="46" height="42" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="241" y="138" text-anchor="middle" font-size="14" fill="#333">4</text>

  <rect x="264" y="110" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="287" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <rect x="310" y="110" width="46" height="42" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="333" y="138" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- index labels -->
  <text x="103" y="170" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="149" y="170" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">1 ← i</text>
  <text x="195" y="170" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="241" y="170" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="287" y="170" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">4 ← j</text>
  <text x="333" y="170" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- pivot arrow from below to cell i -->
  <path d="M 149 196 L 149 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="149" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">待增大位 i</text>
  <text x="149" y="226" text-anchor="middle" font-size="10" fill="#666">nums[i]=2</text>

  <!-- j arrow from below to cell j -->
  <path d="M 287 196 L 287 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="287" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">后继 j</text>
  <text x="287" y="226" text-anchor="middle" font-size="10" fill="#666">&gt;2 的最小值 = 3</text>

  <!-- key idea boxes -->
  <rect x="30" y="248" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① i 右侧已降序 = 该段最大状态，无法再增大</text>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#555">只能动 i：换上比它大的最小值，整体刚好变大</text>

  <rect x="30" y="300" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 交换 i,j 后右侧仍降序</text>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#555">③ 反转右侧降序段 → 升序 = 该前缀下最小排列</text>

  <rect x="30" y="352" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="367" text-anchor="middle" font-size="11" fill="#444">找不到 i（整段降序）→ 反转整个数组回绕到最小</text>
</svg>
