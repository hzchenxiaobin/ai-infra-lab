<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">概念：排序后双指针——小令牌换分，大令牌换能量</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">贪心：用最少的能量买分（正面朝上），卡住时用最贵的令牌换能量（反面朝下）</text>

  <!-- face-up label box (left, blue) -->
  <rect x="34" y="68" width="180" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="88" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">正面朝上（左端）</text>
  <text x="124" y="105" text-anchor="middle" font-size="11" fill="#2a4a66">花 tokens[i] 能量 → 得 1 分</text>

  <!-- face-down label box (right, orange) -->
  <rect x="346" y="68" width="180" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="436" y="88" text-anchor="middle" font-size="12" fill="#a67830" font-weight="bold">反面朝下（右端）</text>
  <text x="436" y="105" text-anchor="middle" font-size="11" fill="#a67830">花 1 分 → 得 tokens[i] 能量</text>

  <!-- sorted token array -->
  <text x="46" y="176" font-size="12" fill="#888" font-weight="bold">排序后</text>
  <rect x="120" y="154" width="70" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="180" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">100</text>
  <rect x="200" y="154" width="70" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="235" y="180" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">200</text>
  <rect x="280" y="154" width="70" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="315" y="180" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">300</text>
  <rect x="360" y="154" width="70" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="395" y="180" text-anchor="middle" font-size="14" fill="#a67830" font-weight="bold">400</text>

  <!-- left pointer arrow -->
  <line x1="155" y1="120" x2="155" y2="150" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="155" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left</text>

  <!-- right pointer arrow -->
  <line x1="395" y1="120" x2="395" y2="150" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="395" y="142" text-anchor="middle" font-size="10" fill="#a67830" font-weight="bold">right</text>

  <!-- energy/score exchange cycle -->
  <text x="46" y="248" font-size="12" fill="#888" font-weight="bold">能量流向</text>
  <!-- left box: energy out, score in -->
  <rect x="120" y="226" width="130" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="244" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">能量 → 分数</text>
  <text x="185" y="260" text-anchor="middle" font-size="10" fill="#666">power ↓, score ↑</text>
  <!-- right box: score out, energy in -->
  <rect x="310" y="226" width="130" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="244" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">分数 → 能量</text>
  <text x="375" y="260" text-anchor="middle" font-size="10" fill="#666">power ↑, score ↓</text>
  <!-- connecting arrows -->
  <line x1="250" y1="247" x2="306" y2="247" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="278" y="240" text-anchor="middle" font-size="10" fill="#b85450">卡住时</text>

  <!-- caption -->
  <rect x="40" y="296" width="480" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#555">核心类比：令牌 = 商品，能量 = 现金，分数 = 收益</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555">低价买入（正面朝上小令牌），高价卖出（反面朝下大令牌）</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#555">每次交易都让局面更好，最终分数最大化</text>
</svg>
