<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">核心观察：状态 = (节点, 剩余电量)</text>
  <text x="260" y="36" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每次转发耗 cost[u] ≥ 1 ⇒ 电量只减不增 ⇒ 状态图是 DAG</text>

  <!-- 电量分层背景带 -->
  <rect x="88" y="52" width="414" height="52" rx="6" fill="#f4f4f2" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="88" y="112" width="414" height="52" rx="6" fill="#f4f4f2" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="88" y="172" width="414" height="52" rx="6" fill="#f4f4f2" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="88" y="232" width="414" height="52" rx="6" fill="#f4f4f2" stroke="#cccccc" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="80" y="82" text-anchor="end" font-size="11" font-style="italic" fill="#999" filter="url(#rough2)">电量 4</text>
  <text x="80" y="142" text-anchor="end" font-size="11" font-style="italic" fill="#999" filter="url(#rough2)">电量 2</text>
  <text x="80" y="202" text-anchor="end" font-size="11" font-style="italic" fill="#999" filter="url(#rough2)">电量 1</text>
  <text x="80" y="262" text-anchor="end" font-size="11" font-style="italic" fill="#999" filter="url(#rough2)">电量 0</text>

  <!-- 状态框 (0,4) 起点 -->
  <text x="131" y="61" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">起点 · 满电</text>
  <rect x="100" y="65" width="62" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="131" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 4)</text>
  <text x="131" y="94" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t = 0</text>

  <!-- 状态框 (1,2) 卡死 -->
  <rect x="196" y="125" width="62" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="227" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 2)</text>
  <text x="227" y="154" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t = 1</text>
  <text x="227" y="176" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">剩余 2 &lt; cost[1]=3 ✗ 卡死</text>

  <!-- 状态框 (2,2) -->
  <rect x="330" y="125" width="62" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="361" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 2)</text>
  <text x="361" y="154" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t = 1</text>

  <!-- 状态框 (3,1) -->
  <rect x="330" y="185" width="62" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="361" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 1)</text>
  <text x="361" y="214" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">t = 2</text>

  <!-- 状态框 (4,0) 终点 -->
  <rect x="430" y="245" width="62" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="461" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4, 0)</text>
  <text x="461" y="274" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">t = 3 · 终点</text>

  <!-- 状态转移箭头 -->
  <path d="M 120 101 L 212 125" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="121" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">0→1: +1s · 耗2</text>

  <path d="M 145 101 L 345 125" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="108" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">0→2: +1s · 耗2</text>

  <path d="M 361 161 L 361 185" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="176" text-anchor="start" font-size="9.5" fill="#446688" filter="url(#rough2)">2→3: +1s · 耗1</text>

  <path d="M 392 215 L 440 245" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="242" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">3→4: +1s · 耗1</text>

  <!-- 底部说明 -->
  <rect x="88" y="298" width="414" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="315" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">target 行先取最小时间 T = 3，再取达成 T 的最大电量 → 答案 [3, 0]</text>
  <text x="295" y="333" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">同一节点不同电量互不可替代：「更慢但更有电」可能才是全局最优</text>
</svg>
