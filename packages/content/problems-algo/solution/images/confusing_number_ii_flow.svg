<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：数位计数求有效数（以 n = 100 为例）</text>

  <!-- Step 1: 位数 < L -->
  <rect x="30" y="40" width="480" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="60" font-size="12" fill="#446688" font-weight="bold">步骤 1：统计位数 &lt; L 的有效数</text>
  <text x="50" y="78" font-size="11" fill="#444" font-family="monospace">d 位数 = 4 × 5^(d−1)（首位 {1,6,8,9}，其余每位 5 选）</text>
  <text x="50" y="96" font-size="10" fill="#888">n=100, L=3 → 1 位数: 4×5⁰=4,  2 位数: 4×5¹=20  → 小计 24</text>

  <path d="M 270 114 L 270 130" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 逐位枚举 -->
  <rect x="30" y="134" width="480" height="186" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="154" font-size="12" fill="#446688" font-weight="bold">步骤 2：逐位枚举 L 位数 ≤ n（从高位到低位）</text>

  <!-- digit position 0 -->
  <rect x="50" y="166" width="440" height="44" fill="#fff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="64" y="184" font-size="11" fill="#444" font-family="monospace">i=0, s[0]='1': 比 1 小的有效非零数字 → {} → less=0</text>
  <text x="64" y="200" font-size="10" fill="#4a7a3a">1 ∈ {0,1,6,8,9} ✓ → 继续</text>

  <!-- digit position 1 -->
  <rect x="50" y="216" width="440" height="44" fill="#fff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="64" y="234" font-size="11" fill="#444" font-family="monospace">i=1, s[1]='0': 比 0 小的有效数字 → {} → less=0</text>
  <text x="64" y="250" font-size="10" fill="#4a7a3a">0 ∈ {0,1,6,8,9} ✓ → 继续</text>

  <!-- digit position 2 -->
  <rect x="50" y="266" width="440" height="44" fill="#fff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="64" y="284" font-size="11" fill="#444" font-family="monospace">i=2, s[2]='0': 比 0 小的有效数字 → {} → less=0</text>
  <text x="64" y="300" font-size="10" fill="#4a7a3a">0 ∈ {0,1,6,8,9} ✓ → 继续</text>

  <path d="M 270 324 L 270 340" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: n itself -->
  <rect x="30" y="344" width="480" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="364" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 3：n 本身所有位有效 → +1</text>
  <text x="50" y="380" font-size="10" fill="#888">100 各位 1,0,0 ∈ {0,1,6,8,9} → 有效，total = 24 + 0 + 1 = 25</text>

  <path d="M 270 394 L 270 408" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="100" y="412" width="340" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="429" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">有效数个数 = 25</text>
</svg>
