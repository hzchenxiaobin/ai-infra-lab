<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：不排序，直接求前 k 小的和</text>

  <!-- ===== Left: brute force ===== -->
  <text x="145" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">暴力：全部排序</text>

  <!-- nums -->
  <rect x="60" y="68" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="88" text-anchor="middle" font-size="11" fill="#333">nums = [1,2,3,4]</text>

  <!-- arrow -->
  <path d="M 145 98 L 145 112" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- all sums -->
  <rect x="40" y="116" width="210" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="134" text-anchor="middle" font-size="10.5" fill="#555">枚举 n(n+1)/2 个子数组和</text>
  <text x="145" y="149" text-anchor="middle" font-size="10" fill="#888">1,3,6,10,2,5,9,3,7,4</text>

  <!-- arrow -->
  <path d="M 145 156 L 145 170" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- sorted -->
  <rect x="40" y="174" width="210" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="192" text-anchor="middle" font-size="10.5" fill="#555">排序 O(n² log n)</text>
  <text x="145" y="207" text-anchor="middle" font-size="10" fill="#888">[1,2,3,3,4,5,6,7,9,10]</text>

  <!-- arrow -->
  <path d="M 145 214 L 145 228" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- range sum -->
  <rect x="55" y="232" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="255" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">求 [left, right] 区间和</text>

  <!-- brute complexity -->
  <text x="145" y="290" text-anchor="middle" font-size="10.5" fill="#888">空间 O(n²)，n=10³ → 10⁶ 个数</text>

  <!-- ===== Right: binary search ===== -->
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最优：二分答案</text>

  <!-- key idea box -->
  <rect x="320" y="68" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="86" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">答案 = sumFirstK(right)</text>
  <text x="430" y="102" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">− sumFirstK(left−1)</text>

  <!-- arrow -->
  <path d="M 430 118 L 430 132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- binary search value -->
  <rect x="320" y="136" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="154" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">二分找第 k 小的值 v</text>
  <text x="430" y="169" text-anchor="middle" font-size="10" fill="#555">count(≤v) ≥ k 的最小 v</text>

  <!-- arrow -->
  <path d="M 430 176 L 430 190" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- count_and_sum -->
  <rect x="320" y="194" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="212" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">count_and_sum(v)</text>
  <text x="430" y="228" text-anchor="middle" font-size="10" fill="#555">滑动窗口 O(n) 计数 + 求和</text>

  <!-- arrow -->
  <path d="M 430 244 L 430 258" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="335" y="262" width="190" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="285" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">sum − (cnt−k)×v</text>

  <!-- optimal complexity -->
  <text x="430" y="318" text-anchor="middle" font-size="10.5" fill="#888">O(n log S)，S = sum(nums)</text>

  <!-- divider -->
  <path d="M 290 50 L 290 320" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- footer -->
  <rect x="80" y="338" width="420" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="358" text-anchor="middle" font-size="11" fill="#666">nums 全正 → 前缀和单调 → 滑动窗口可 O(n) 计数</text>
</svg>
