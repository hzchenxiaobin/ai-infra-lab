<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">好下标 i 的两段单调性</text>

  <!-- index labels above -->
  <text x="148" y="108" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i−2</text>
  <text x="204" y="108" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i−1</text>
  <text x="260" y="100" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i (好下标)</text>
  <text x="316" y="108" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i+1</text>
  <text x="372" y="108" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i+2</text>

  <!-- cells: 1 1 1 3 4 (example good index 3) -->
  <rect x="120" y="118" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="147" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="176" y="118" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="147" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="232" y="118" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="288" y="118" width="56" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="147" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>

  <rect x="344" y="118" width="56" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="147" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>

  <!-- non-increasing down arrows over left two gaps -->
  <path d="M170 100 L176 100" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M226 100 L232 100" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="176" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">≥</text>
  <text x="232" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">≥</text>

  <!-- non-decreasing up arrows over right two gaps -->
  <path d="M288 100 L282 100" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M344 100 L338 100" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">≤</text>
  <text x="356" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">≤</text>

  <!-- left bracket: k non-increasing -->
  <path d="M122 178 L122 188 L228 188 L228 178" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="208" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">前 k 个非递增</text>
  <text x="175" y="225" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">⟺ inc[i−1] ≥ k</text>

  <!-- right bracket: k non-decreasing -->
  <path d="M290 178 L290 188 L398 188 L398 178" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="344" y="208" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">后 k 个非递减</text>
  <text x="344" y="225" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⟺ dec[i+1] ≥ k</text>

  <!-- summary note -->
  <rect x="70" y="258" width="460" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">核心：预计算 inc[]（以 i 结尾的非递增段长）</text>
  <text x="300" y="302" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">与 dec[]（以 i 开头的非递减段长），扫描时 O(1) 查表</text>
</svg>
