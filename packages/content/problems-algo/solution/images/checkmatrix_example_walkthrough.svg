<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：有效 vs 无效</text>

  <!-- ====== Example 1: valid ====== -->
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 示例1：matrix = [[1,2,3],[3,1,2],[2,3,1]]</text>

  <!-- row0 -->
  <rect x="70" y="68" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="68" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="68" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="200" y="91" font-size="10" fill="#4a7a3a" font-weight="bold">行0 {1,2,3} ✓</text>

  <!-- row1 -->
  <rect x="70" y="104" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="110" y="104" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="104" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="200" y="127" font-size="10" fill="#4a7a3a" font-weight="bold">行1 {1,2,3} ✓</text>

  <!-- row2 -->
  <rect x="70" y="140" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="110" y="140" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="150" y="140" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="200" y="163" font-size="10" fill="#4a7a3a" font-weight="bold">行2 {1,2,3} ✓</text>

  <!-- col annotations -->
  <text x="90" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">列0{1,2,3}✓</text>
  <text x="130" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">列1{1,2,3}✓</text>
  <text x="170" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">列2{1,2,3}✓</text>

  <rect x="70" y="200" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2n 条线全部通过 → return true</text>

  <!-- ====== Example 2: invalid ====== -->
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 示例2：matrix = [[1,1,1],[1,2,3],[1,2,3]]</text>

  <!-- failing row0 band -->
  <rect x="330" y="68" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="0" rx="4" filter="url(#rough2)" opacity="0.6"/>

  <!-- row0: 1 1 1 (failing) -->
  <rect x="330" y="68" width="40" height="36" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="68" width="40" height="36" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="410" y="68" width="40" height="36" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="460" y="91" font-size="10" fill="#b85450" font-weight="bold">行0={1} 缺2,3 ✗</text>

  <!-- row1 -->
  <rect x="330" y="104" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="104" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="410" y="104" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="127" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="460" y="127" font-size="10" fill="#4a7a3a" font-weight="bold">行1 {1,2,3} ✓</text>

  <!-- row2 -->
  <rect x="330" y="140" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="140" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="410" y="140" width="40" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="163" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="460" y="163" font-size="10" fill="#4a7a3a" font-weight="bold">行2 {1,2,3} ✓</text>

  <!-- col annotations: col0 = {1} fails -->
  <text x="350" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">列0={1}✗</text>
  <text x="390" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">列1✓</text>
  <text x="430" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">列2✓</text>

  <rect x="330" y="200" width="220" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">行0 / 列0 不合法 → return false</text>

  <!-- ====== seen array illustration ====== -->
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">seen 数组工作机制（以行0为例）</text>

  <!-- valid row seen -->
  <text x="100" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">行0={1,2,3}：</text>
  <rect x="70" y="290" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="311" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1✓</text>
  <rect x="110" y="290" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="311" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2✓</text>
  <rect x="150" y="290" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="311" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3✓</text>
  <text x="200" y="311" font-size="11" fill="#4a7a3a" font-weight="bold">全 true → 通过</text>

  <!-- invalid row seen -->
  <text x="100" y="344" font-size="11" fill="#b85450" font-weight="bold">行0={1,1,1}：</text>
  <rect x="70" y="354" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="375" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1✓</text>
  <rect x="110" y="354" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="375" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2✗</text>
  <rect x="150" y="354" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="375" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3✗</text>
  <text x="200" y="375" font-size="11" fill="#b85450" font-weight="bold">有 false → 失败</text>

  <!-- bottom note -->
  <rect x="40" y="402" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="421" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">值域恰为 1..n → seen 数组长度 n+1，下标即值，O(1) 标记 / 查验</text>
</svg>
