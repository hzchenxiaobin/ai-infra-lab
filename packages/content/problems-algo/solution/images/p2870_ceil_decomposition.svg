<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">每个组：用最少的「删 2」「删 3」凑空频率 f → ⌈f/3⌉ 次</text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">f = 2a + 3b，最小化 a + b —— 元素位置无关，只看个数</text>

  <!-- row 0: f=3 -->
  <text x="92" y="96" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">f = 3</text>
  <g filter="url(#rough2)">
    <rect x="104" y="72" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="116" y="82" width="14" height="14" fill="#4a7a3a" rx="2"/>
    <rect x="133" y="82" width="14" height="14" fill="#4a7a3a" rx="2"/>
    <rect x="150" y="82" width="14" height="14" fill="#4a7a3a" rx="2"/>
  </g>
  <text x="140" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">删 3</text>
  <text x="348" y="96" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold" filter="url(#rough2)">→ 1 次</text>
  <text x="460" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">正好整除</text>

  <!-- row 1: f=4 -->
  <text x="92" y="156" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">f = 4</text>
  <g filter="url(#rough2)">
    <rect x="104" y="132" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="116" y="142" width="14" height="14" fill="#446688" rx="2"/>
    <rect x="133" y="142" width="14" height="14" fill="#446688" rx="2"/>
  </g>
  <text x="130" y="182" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">删 2</text>
  <g filter="url(#rough2)">
    <rect x="166" y="132" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="178" y="142" width="14" height="14" fill="#446688" rx="2"/>
    <rect x="195" y="142" width="14" height="14" fill="#446688" rx="2"/>
  </g>
  <text x="192" y="182" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">删 2</text>
  <text x="348" y="156" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold" filter="url(#rough2)">→ 2 次</text>
  <text x="462" y="150" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">余 1：退一捆 3</text>
  <text x="462" y="166" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">改成 2 + 2</text>

  <!-- row 2: f=5 -->
  <text x="92" y="216" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">f = 5</text>
  <g filter="url(#rough2)">
    <rect x="104" y="192" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="116" y="202" width="14" height="14" fill="#4a7a3a" rx="2"/>
    <rect x="133" y="202" width="14" height="14" fill="#4a7a3a" rx="2"/>
    <rect x="150" y="202" width="14" height="14" fill="#4a7a3a" rx="2"/>
  </g>
  <text x="140" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">删 3</text>
  <g filter="url(#rough2)">
    <rect x="186" y="192" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="198" y="202" width="14" height="14" fill="#446688" rx="2"/>
    <rect x="215" y="202" width="14" height="14" fill="#446688" rx="2"/>
  </g>
  <text x="212" y="242" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">删 2</text>
  <text x="348" y="216" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold" filter="url(#rough2)">→ 2 次</text>
  <text x="462" y="216" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">余 2：补一捆 2</text>

  <!-- row 3: f=7 -->
  <text x="92" y="276" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">f = 7</text>
  <g filter="url(#rough2)">
    <rect x="104" y="252" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="116" y="262" width="14" height="14" fill="#4a7a3a" rx="2"/>
    <rect x="133" y="262" width="14" height="14" fill="#4a7a3a" rx="2"/>
    <rect x="150" y="262" width="14" height="14" fill="#4a7a3a" rx="2"/>
  </g>
  <text x="140" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">删 3</text>
  <g filter="url(#rough2)">
    <rect x="186" y="252" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="198" y="262" width="14" height="14" fill="#446688" rx="2"/>
    <rect x="215" y="262" width="14" height="14" fill="#446688" rx="2"/>
  </g>
  <text x="212" y="302" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">删 2</text>
  <g filter="url(#rough2)">
    <rect x="248" y="252" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="260" y="262" width="14" height="14" fill="#446688" rx="2"/>
    <rect x="277" y="262" width="14" height="14" fill="#446688" rx="2"/>
  </g>
  <text x="274" y="302" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">删 2</text>
  <text x="348" y="276" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold" filter="url(#rough2)">→ 3 次</text>
  <text x="462" y="276" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">都压到下界 ⌈f/3⌉</text>

  <!-- row 4: f=1 -->
  <text x="92" y="336" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">f = 1</text>
  <g filter="url(#rough2)">
    <rect x="104" y="312" width="32" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8"/>
    <rect x="113" y="322" width="14" height="14" fill="#b85450" rx="2"/>
  </g>
  <text x="156" y="336" text-anchor="start" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 无解</text>
  <text x="348" y="336" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 返回 −1</text>
  <text x="462" y="336" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 和 3 凑不出 1</text>

  <!-- formula box -->
  <rect x="70" y="366" width="420" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold" filter="url(#rough2)">ops(f) = ⌈f / 3⌉ = (f + 2) / 3，f ≥ 2</text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#rough2)">下界：每次最多删 3 个；构造：按余数「多退少补」恰好达界</text>

  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">f = 1 是唯一无解情形：Frobenius 数 2×3 − 2 − 3 = 1</text>
</svg>
