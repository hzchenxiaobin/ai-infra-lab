<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：枚举操作次数 k，增量更新 cost，取 sum + k·x 的最小</text>

  <!-- Start -->
  <rect x="200" y="42" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333">开始：n = len(nums)</text>

  <!-- Init: cost = nums[:], ans = sum -->
  <rect x="150" y="92" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">初始化（k = 0）</text>
  <text x="270" y="128" text-anchor="middle" font-size="10" fill="#555">cost[t] ← nums[t]；ans ← Σcost</text>

  <!-- arrow down -->
  <path d="M 270 136 L 270 154" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Loop condition: k < n ? -->
  <polygon points="270,156 380,200 270,244 160,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k &lt; n ?</text>
  <text x="270" y="212" text-anchor="middle" font-size="10" fill="#888">（k 从 1 起）</text>

  <!-- No branch -> return -->
  <path d="M 380 200 L 440 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="184" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="483" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 244 L 270 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="256" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Inner: for each t update cost -->
  <rect x="130" y="264" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">对每个 t ∈ [0, n) 增量更新</text>
  <text x="270" y="300" text-anchor="middle" font-size="10" fill="#555">idx ← (t − k) mod n</text>
  <text x="270" y="314" text-anchor="middle" font-size="10" fill="#555">cost[t] ← min(cost[t], nums[idx])</text>

  <!-- arrow down -->
  <path d="M 270 320 L 270 338" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Update ans -->
  <rect x="120" y="340" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">更新答案</text>
  <text x="270" y="378" text-anchor="middle" font-size="10" fill="#555">ans ← min(ans, Σcost + k·x)</text>

  <!-- k++ -->
  <rect x="200" y="402" width="140" height="34" fill="#f4f4f4" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="423" text-anchor="middle" font-size="11" fill="#555">k ← k + 1</text>

  <!-- loop back arrow: from k++ up to decision diamond on the left side -->
  <path d="M 200 419 L 90 419 L 90 200 L 160 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="60" y="310" font-size="10" fill="#446688" font-weight="bold">回</text>
  <text x="60" y="324" font-size="10" fill="#446688" font-weight="bold">到</text>
  <text x="60" y="338" font-size="10" fill="#446688" font-weight="bold">判</text>
  <text x="60" y="352" font-size="10" fill="#446688" font-weight="bold">定</text>

  <!-- Complexity note -->
  <rect x="20" y="460" width="500" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="480" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">复杂度与正确性要点</text>
  <text x="270" y="498" text-anchor="middle" font-size="10" fill="#555">· 外层枚举 k ∈ [1, n−1]，内层遍历 n 个类型 → 时间 O(n²)，空间 O(n)</text>
  <text x="270" y="514" text-anchor="middle" font-size="10" fill="#555">· 读不变的 nums、写各格 cost[t]，各 t 独立 → 顺序无关，可原地更新</text>
  <text x="270" y="530" text-anchor="middle" font-size="10" fill="#555">· 窗口随 k 单调扩张、元素只进不出 → 增量 min 维护正确</text>
</svg>
