<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐员工判定（示例 2）</text>

  <!-- 表头 -->
  <rect x="40" y="40" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">员工</text>
  <rect x="96" y="40" width="124" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="158" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">原始 HHMM</text>
  <rect x="224" y="40" width="112" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">排序后分钟</text>
  <rect x="340" y="40" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="388" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">三元跨度</text>
  <rect x="442" y="40" width="68" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="476" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">判定</text>

  <!-- 行 c -->
  <rect x="40" y="64" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <rect x="96" y="64" width="124" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0808 0829 0809</text>
  <rect x="224" y="64" width="112" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">488 · 489 · 509</text>
  <rect x="340" y="64" width="96" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">509−488=21</text>
  <rect x="442" y="64" width="68" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="476" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">✓ 高访问</text>

  <!-- 行 d -->
  <rect x="40" y="98" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <rect x="96" y="98" width="124" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="118" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0002 1508 1444 1410</text>
  <rect x="224" y="98" width="112" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2 ·</text>
  <text x="292" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">850 · 884 · 908</text>
  <rect x="340" y="98" width="96" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">908−850=58</text>
  <rect x="442" y="98" width="68" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="476" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">✓ 高访问</text>

  <!-- 行 e -->
  <rect x="40" y="132" width="52" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">e</text>
  <rect x="96" y="132" width="124" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="152" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0215</text>
  <rect x="224" y="132" width="112" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">135</text>
  <rect x="340" y="132" width="96" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">— 不足 3 条</text>
  <rect x="442" y="132" width="68" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="152" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">✗</text>

  <path d="M 260 168 L 260 180" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="180" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">输出（字典序）：["c", "d"]</text>

  <!-- 边界三连问 -->
  <text x="40" y="232" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">三个边界，一次说清</text>

  <rect x="40" y="240" width="440" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">① 10:25 → 11:24 相差 59 分钟 &lt; 60：压线同窗，ab 入选（示例 3）</text>

  <rect x="40" y="272" width="440" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">② 08:15 → 09:15 恰好 60 分钟：严格小于才算同窗，不算 ✗</text>

  <rect x="40" y="304" width="440" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">③ 00:05 与 23:50：全部记录同一天，无需跨天环绕，直接比分钟值</text>

  <text x="260" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">一句话：转分钟 → 排序 → 只看相邻三元组</text>
</svg>
