<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
  </defs>
  <rect width="920" height="420" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：capacity=2 的 LFU 操作流</text>
  <path d="M 290 42 Q 460 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="100" height="36" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
    <rect x="140" y="64" width="160" height="36" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="300" y="64" width="160" height="36" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="460" y="64" width="160" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a"/>
    <rect x="620" y="64" width="90" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb"/>
    <rect x="710" y="64" width="170" height="36" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
  </g>
  <text x="90" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">操作</text>
  <text x="220" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">freq=1 桶(head→tail)</text>
  <text x="380" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">freq=2 桶</text>
  <text x="540" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">freq=3 桶</text>
  <text x="665" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">min_freq</text>
  <text x="795" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">说明</text>

  <!-- row 1: put(1,1) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="100" width="100" height="38"/><rect x="140" y="100" width="160" height="38" fill="#fce4ec"/><rect x="300" y="100" width="160" height="38" fill="#fbf3e0"/><rect x="460" y="100" width="160" height="38" fill="#f3f9f3"/><rect x="620" y="100" width="90" height="38" fill="#f4f8fe"/><rect x="710" y="100" width="170" height="38" fill="#fffdf3"/></g></g>
  <text x="90" y="124" text-anchor="middle" font-size="11" fill="#333">put(1,1)</text>
  <text x="220" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1]</text>
  <text x="380" y="124" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="540" y="124" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="665" y="124" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="795" y="124" text-anchor="middle" font-size="10" fill="#444">新建→freq=1 head</text>

  <!-- row 2: put(2,2) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="138" width="100" height="38"/><rect x="140" y="138" width="160" height="38" fill="#fce4ec"/><rect x="300" y="138" width="160" height="38" fill="#fbf3e0"/><rect x="460" y="138" width="160" height="38" fill="#f3f9f3"/><rect x="620" y="138" width="90" height="38" fill="#f4f8fe"/><rect x="710" y="138" width="170" height="38" fill="#fffdf3"/></g></g>
  <text x="90" y="162" text-anchor="middle" font-size="11" fill="#333">put(2,2)</text>
  <text x="220" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[2, 1]</text>
  <text x="380" y="162" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="540" y="162" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="665" y="162" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="795" y="162" text-anchor="middle" font-size="10" fill="#444">2 插 head，1 后移</text>

  <!-- row 3: get(1) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="176" width="100" height="38"/><rect x="140" y="176" width="160" height="38" fill="#fce4ec"/><rect x="300" y="176" width="160" height="38" fill="#fbf3e0"/><rect x="460" y="176" width="160" height="38" fill="#f3f9f3"/><rect x="620" y="176" width="90" height="38" fill="#f4f8fe"/><rect x="710" y="176" width="170" height="38" fill="#fffdf3"/></g></g>
  <text x="90" y="200" text-anchor="middle" font-size="11" fill="#333">get(1)→1</text>
  <text x="220" y="200" text-anchor="middle" font-size="11" fill="#b85450">[2]</text>
  <text x="380" y="200" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">[1]</text>
  <text x="540" y="200" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="665" y="200" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="795" y="200" text-anchor="middle" font-size="10" fill="#444">1 摘出→freq=2 head</text>

  <!-- row 4: put(3,3) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="214" width="100" height="38"/><rect x="140" y="214" width="160" height="38" fill="#fce4ec"/><rect x="300" y="214" width="160" height="38" fill="#fbf3e0"/><rect x="460" y="214" width="160" height="38" fill="#f3f9f3"/><rect x="620" y="214" width="90" height="38" fill="#f4f8fe"/><rect x="710" y="214" width="170" height="38" fill="#fffdf3"/></g></g>
  <text x="90" y="238" text-anchor="middle" font-size="11" fill="#333">put(3,3)</text>
  <text x="220" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[3]</text>
  <text x="380" y="238" text-anchor="middle" font-size="11" fill="#7a5415">[1]</text>
  <text x="540" y="238" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="665" y="238" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="795" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">满→淘汰 min 桶的 2</text>

  <!-- row 5: get(3) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="252" width="100" height="38"/><rect x="140" y="252" width="160" height="38" fill="#fce4ec"/><rect x="300" y="252" width="160" height="38" fill="#fbf3e0"/><rect x="460" y="252" width="160" height="38" fill="#f3f9f3"/><rect x="620" y="252" width="90" height="38" fill="#f4f8fe"/><rect x="710" y="252" width="170" height="38" fill="#fffdf3"/></g></g>
  <text x="90" y="276" text-anchor="middle" font-size="11" fill="#333">get(3)→3</text>
  <text x="220" y="276" text-anchor="middle" font-size="11" fill="#999">空</text>
  <text x="380" y="276" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">[3, 1]</text>
  <text x="540" y="276" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="665" y="276" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="795" y="276" text-anchor="middle" font-size="10" fill="#444">3 升 freq=2，旧桶空→min++</text>

  <!-- row 6: put(4,4) -->
  <g filter="url(#sk)"><g stroke="#bbb" fill="#fff"><rect x="40" y="290" width="100" height="38"/><rect x="140" y="290" width="160" height="38" fill="#fce4ec"/><rect x="300" y="290" width="160" height="38" fill="#fbf3e0"/><rect x="460" y="290" width="160" height="38" fill="#f3f9f3"/><rect x="620" y="290" width="90" height="38" fill="#f4f8fe"/><rect x="710" y="290" width="170" height="38" fill="#fffdf3"/></g></g>
  <text x="90" y="314" text-anchor="middle" font-size="11" fill="#333">put(4,4)</text>
  <text x="220" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[4]</text>
  <text x="380" y="314" text-anchor="middle" font-size="11" fill="#7a5415">[3]</text>
  <text x="540" y="314" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="665" y="314" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="795" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">满→淘汰 min=2 桶的 1</text>

  <!-- 说明框 -->
  <g filter="url(#sk)">
    <rect x="40" y="344" width="840" height="62" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="60" y="368" font-size="12" font-weight="bold" fill="#2b6e9e">关键不变量</text>
  <text x="60" y="388" font-size="11" fill="#444">① 同频桶内 head=最近访问，tail 前=同频最久(淘汰候选)   ② min_freq 始终指向非空的最小频率桶   ③ 新建节点 freq=1 → min_freq 重置为 1</text>
  <text x="60" y="402" font-size="11" fill="#b85450">④ 淘汰只在 put 满时发生：取 min_freq 桶的 tail 前节点删除   ⑤ 访问后旧桶空且 freq==min_freq → min_freq++（保证 min_freq 仍指向非空桶）</text>
</svg>
