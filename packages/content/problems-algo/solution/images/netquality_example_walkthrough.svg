<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：towers=[[1,2,5],[2,1,7],[3,1,9]], radius=2，候选点 (2,1)</text>

  <!-- Header row -->
  <g font-size="11" fill="#666" text-anchor="middle">
    <rect x="30" y="54" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="90" y="71" font-weight="bold">塔 (xi, yi, qi)</text>
    <rect x="150" y="54" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="205" y="71" font-weight="bold">距离 d</text>
    <rect x="260" y="54" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="325" y="71" font-weight="bold">d ≤ 2 ?</text>
    <rect x="390" y="54" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="465" y="71" font-weight="bold">⌊qi / (1+d) ⌋</text>
  </g>

  <!-- Row 1: tower (2,1,7) -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="30" y="92" width="120" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="90" y="111" fill="#4a7a3a" font-weight="bold">(2, 1, 7)</text>
    <rect x="150" y="92" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="205" y="111">√0 = 0</text>
    <rect x="260" y="92" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="325" y="111" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="390" y="92" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="465" y="111" fill="#4a7a3a" font-weight="bold">⌊7/1⌋ = 7</text>
  </g>

  <!-- Row 2: tower (1,2,5) -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="30" y="128" width="120" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="90" y="147" fill="#446688" font-weight="bold">(1, 2, 5)</text>
    <rect x="150" y="128" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="205" y="147">√2 ≈ 1.414</text>
    <rect x="260" y="128" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="325" y="147" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="390" y="128" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="465" y="147" fill="#4a7a3a" font-weight="bold">⌊5/2.414⌋ = 2</text>
  </g>

  <!-- Row 3: tower (3,1,9) -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="30" y="164" width="120" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="90" y="183" fill="#d6a040" font-weight="bold">(3, 1, 9)</text>
    <rect x="150" y="164" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="205" y="183">√1 = 1</text>
    <rect x="260" y="164" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="325" y="183" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="390" y="164" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="465" y="183" fill="#4a7a3a" font-weight="bold">⌊9/2⌋ = 4</text>
  </g>

  <!-- Sum row -->
  <path d="M 465 194 L 465 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="212" width="210" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="465" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">总信号 = 7 + 2 + 4</text>
  <text x="465" y="246" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= 13 ✓ 最大</text>

  <!-- Note box -->
  <rect x="30" y="270" width="500" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="292" font-size="11" fill="#d6a040" font-weight="bold">关键细节</text>
  <text x="48" y="312" font-size="11" fill="#555">• 向下取整对每座塔单独做，再累加：先加后取整会出错。</text>
  <text x="48" y="330" font-size="11" fill="#555">• d 用浮点 sqrt 计算后直接与 radius 比较；⌊·⌋ 用整数除法 (int) 截断。</text>
  <text x="48" y="348" font-size="11" fill="#555">• 字典序 tie-break：按 x、y 升序枚举，仅当 q &gt; bestQ 严格更优才更新，</text>
  <text x="60" y="364" font-size="11" fill="#555">相同信号值的后续点不会覆盖先出现的（更小字典序）点。</text>
  <text x="48" y="384" font-size="11" fill="#555">• 全零情形（如所有 qi=0）：bestQ 从 -1 起步，(0,0) 先置 0 并胜出。</text>
</svg>
