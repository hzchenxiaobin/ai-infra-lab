<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：m=4, n=3, hFences=[2,3], vFences=[2]</text>

  <!-- ===== left: H pairs ===== -->
  <text x="130" y="56" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">水平：H = [1, 2, 3, 4]（6 对）</text>

  <!-- table rows: pair | diff -->
  <rect x="40" y="66" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="84" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">数对 (i, j)</text>
  <text x="192" y="84" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">差 d</text>

  <rect x="40" y="96" width="130" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="112" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">(1, 2)</text>
  <rect x="176" y="96" width="44" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="112" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">1</text>

  <rect x="40" y="124" width="130" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="140" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">(1, 3)</text>
  <rect x="176" y="124" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="140" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="40" y="152" width="130" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="168" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">(1, 4)</text>
  <rect x="176" y="152" width="44" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="168" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">3</text>

  <rect x="40" y="180" width="130" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="196" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">(2, 3)</text>
  <rect x="176" y="180" width="44" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="196" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">1</text>

  <rect x="40" y="208" width="130" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="224" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">(2, 4)</text>
  <rect x="176" y="208" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="224" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="40" y="236" width="130" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="252" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">(3, 4)</text>
  <rect x="176" y="236" width="44" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="252" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">1</text>

  <rect x="40" y="268" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="287" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">S_h = { 1, 2, 3 }</text>

  <!-- ===== right: V pairs ===== -->
  <text x="372" y="56" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">垂直：V = [1, 2, 3]（3 对）</text>

  <rect x="282" y="66" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="354" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">数对 (i, j)</text>
  <text x="434" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">差 d</text>

  <rect x="282" y="96" width="130" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="112" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">(1, 2)</text>
  <rect x="418" y="96" width="44" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="112" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">1</text>

  <rect x="282" y="124" width="130" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="140" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">(1, 3)</text>
  <rect x="418" y="124" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="440" y="140" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="282" y="152" width="130" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="168" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">(2, 3)</text>
  <rect x="418" y="152" width="44" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="168" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">1</text>

  <rect x="282" y="184" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="372" y="203" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S_v = { 1, 2 }</text>

  <!-- intersection result -->
  <path d="M 220 240 L 268 240" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="244" y="232" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">查交集</text>

  <rect x="282" y="222" width="212" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="388" y="244" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">S_h ∩ S_v = { 1, 2 }</text>
  <text x="388" y="266" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">best = 2 → 面积 = 4</text>
  <text x="388" y="287" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（对应移除 y=2 与 x=2 的栅栏）</text>

  <!-- example 2 note -->
  <rect x="40" y="318" width="454" height="48" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="266" y="338" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">示例 2：H = [1, 2, 6] → S_h = {1, 4, 5}；V = [1, 4, 7] → S_v = {3, 6}</text>
  <text x="266" y="357" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">交集为空 ⇒ 无公共边长 ⇒ 返回 −1</text>

  <!-- bottom note -->
  <text x="260" y="396" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注意 (1,2)、(2,3)、(3,4) 的差同为 1 —— 哈希集合天然去重，比较时只需关心值本身</text>
  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">最大水平差 m−1 = 3、最大垂直差 n−1 = 2，min 之外的大边长直接无缘</text>
</svg>
