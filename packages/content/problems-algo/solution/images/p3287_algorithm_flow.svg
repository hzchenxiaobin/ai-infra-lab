<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双向背包快照 + 枚举分割线合并</text>

  <!-- 开始 -->
  <rect x="160" y="38" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="230" y="59" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输入 nums, k</text>

  <path d="M 230 70 L 230 84" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ① 正向背包 -->
  <rect x="55" y="88" width="350" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="106" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 正向背包：i = 0 → n−1</text>
  <text x="230" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">倒序 c：dp[c][s|v] |= dp[c−1][s]，快照 F[i] = dp[k]</text>

  <path d="M 230 134 L 230 148" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ② 反向背包 -->
  <rect x="55" y="152" width="350" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="170" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 反向背包：i = n−1 → 0（同一套转移）</text>
  <text x="230" y="188" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">快照 G[i] = 后缀 [i..n−1] 恰选 k 个的 OR 集合</text>

  <path d="M 230 198 L 230 212" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ③ 枚举分割线 -->
  <rect x="55" y="216" width="350" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="238" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 枚举分割线 i = 0 … n−2</text>

  <path d="M 230 250 L 230 264" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ④ 合并 -->
  <rect x="55" y="268" width="350" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="286" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ s ∈ F[i]，t ∈ G[i+1]</text>
  <text x="230" y="304" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans = max(ans, s ⊕ t)</text>

  <!-- 判断菱形 -->
  <path d="M 405 291 L 455 269 L 505 291 L 455 313 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="288" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 127 ?</text>
  <text x="455" y="301" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">(已达上界)</text>

  <path d="M 405 291 L 409 291" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 405 291 C 400 291, 400 233, 410 233" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="377" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否，下一条 i</text>

  <!-- 返回 -->
  <path d="M 455 269 C 455 180, 430 120, 380 60" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="472" y="180" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="200" y="322" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <path d="M 270 314 L 270 320" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
</svg>
