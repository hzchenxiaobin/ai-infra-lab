<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：r² 关于 r 单调递增 ⇒ 二段性，求最大的「r² ≤ x」</text>

  <!-- ===== Left panel: geometric meaning ===== -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">几何意义</text>

  <!-- axes -->
  <line x1="70" y1="300" x2="70" y2="120" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="300" x2="270" y2="300" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="116" text-anchor="end" font-size="10" fill="#888">r²</text>
  <text x="274" y="304" font-size="10" fill="#888">r →</text>
  <text x="64" y="304" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- parabola y = r^2 (drawn as increasing curve, origin at 70,300) -->
  <path d="M 70 300 C 120 298 165 290 200 270 C 230 250 250 215 262 168" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="232" y="200" font-size="11" fill="#446688" font-weight="bold">y = r²</text>

  <!-- horizontal line y = x -->
  <line x1="70" y1="210" x2="270" y2="210" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="274" y="214" font-size="11" fill="#d6a040" font-weight="bold">y = x</text>

  <!-- intersection = true sqrt -->
  <circle cx="206" cy="210" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="206" y1="210" x2="206" y2="300" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="206" y="316" text-anchor="middle" font-size="10" fill="#b85450">√x</text>

  <!-- floor answer: largest integer r with r² ≤ x -->
  <circle cx="188" cy="218" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="188" y1="218" x2="188" y2="300" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="188" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案 = ⌊√x⌋</text>

  <!-- ===== Right panel: answer space number line ===== -->
  <text x="320" y="58" font-size="12" fill="#888" font-weight="bold">答案空间（在 r 上二分）</text>

  <!-- number line -->
  <line x1="320" y1="180" x2="540" y2="180" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- feasible segment (green) 320 -> 430 -->
  <line x1="320" y1="180" x2="430" y2="180" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <!-- infeasible segment (red) 430 -> 540 -->
  <line x1="430" y1="180" x2="540" y2="180" stroke="#b85450" stroke-width="4" filter="url(#rough2)"/>

  <!-- endpoints -->
  <circle cx="320" cy="180" r="3.5" fill="#888" filter="url(#rough2)"/>
  <circle cx="540" cy="180" r="3.5" fill="#888" filter="url(#rough2)"/>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="540" y="200" text-anchor="middle" font-size="10" fill="#999">x</text>

  <!-- answer marker at boundary 430 -->
  <circle cx="430" cy="180" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans</text>

  <!-- region labels -->
  <text x="375" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">r² ≤ x ✓ 可行</text>
  <text x="485" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">r² &gt; x ✗ 太大</text>

  <!-- arrow: ans is the RIGHTMOST feasible -->
  <path d="M 430 232 L 430 214" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a">最大的可行 r</text>

  <!-- formula box -->
  <rect x="320" y="270" width="220" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">验证函数 check(r)</text>
  <text x="430" y="316" text-anchor="middle" font-size="12" fill="#444">return r * r &lt;= x</text>
  <text x="430" y="338" text-anchor="middle" font-size="10" fill="#888">O(1) 验证，无需遍历</text>

  <!-- left note box -->
  <rect x="40" y="338" width="240" height="0" fill="none"/>
  <text x="160" y="352" text-anchor="middle" font-size="10" fill="#888">r ↑ ⇒ r² ↑ 单调 ⇒ 存在分界点 ans</text>
</svg>
