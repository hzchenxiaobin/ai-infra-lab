<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">计数排序：值域即桶号，频率表替代比较</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">costs[i] ∈ [1, 10⁵] → freq[1..V] 统计各价位数量，按价位升序遍历</text>

  <!-- Original costs -->
  <text x="28" y="78" font-size="10.5" fill="#666">costs</text>
  <rect x="68" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="83" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="107" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="83" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="146" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="83" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="185" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="83" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="224" y="60" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="83" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Arrow down: count -->
  <path d="M 155 100 L 155 118" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="300" y="114" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">↑ 一次遍历建频率表 freq[c]++，O(n)</text>

  <!-- Freq table buckets -->
  <text x="28" y="148" font-size="10.5" fill="#666">freq[]</text>

  <!-- Bucket 1 -->
  <rect x="68" y="130" width="34" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[1]</text>
  <text x="85" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- Bucket 2 -->
  <rect x="107" y="130" width="34" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[2]</text>
  <text x="124" y="166" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Bucket 3 -->
  <rect x="146" y="130" width="34" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[3]</text>
  <text x="163" y="166" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Bucket 4 -->
  <rect x="185" y="130" width="34" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[4]</text>
  <text x="202" y="166" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Bucket 5 (empty) -->
  <rect x="224" y="130" width="34" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="241" y="148" text-anchor="middle" font-size="10" fill="#aaa">[5]</text>
  <text x="241" y="166" text-anchor="middle" font-size="13" fill="#aaa">0</text>

  <!-- Ellipsis -->
  <text x="276" y="158" font-size="14" fill="#aaa">…</text>

  <!-- Bucket V -->
  <rect x="296" y="130" width="34" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="313" y="148" text-anchor="middle" font-size="10" fill="#aaa">[V]</text>
  <text x="313" y="166" text-anchor="middle" font-size="13" fill="#aaa">0</text>

  <!-- Arrow down: scan -->
  <path d="M 155 178 L 155 196" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">↑ 按价位升序遍历，批量购买</text>

  <!-- Scan result -->
  <rect x="50" y="200" width="420" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">按价位批量处理（同价一次买完）</text>
  <text x="260" y="237" text-anchor="middle" font-size="10.5" fill="#555">price=1: can = min(2, 7/1)=2 → 买 2 支，ans=2, coins=5</text>
  <text x="260" y="252" text-anchor="middle" font-size="10.5" fill="#555">price=2: can = min(1, 5/2)=1 → 买 1 支, ans=3, coins=3</text>

  <!-- Comparison box -->
  <rect x="40" y="278" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为何计数排序优于比较排序？</text>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#555">值域 V=10⁵ 与 n 同阶 → O(n+V) 优于 O(n log n)</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#555">同价位雪糕可一次批量购买，常数更小；值域过大时退化为不可用</text>

  <!-- Footer -->
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#aaa">freq[c] 即「价格为 c 的雪糕数量」；无需回填排序数组，直接在频率表上贪心</text>
</svg>
