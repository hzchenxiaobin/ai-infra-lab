<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：四行薪水逐一翻倍</text>

  <!-- Walkthrough table -->
  <rect x="90" y="52" width="380" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <rect x="100" y="62" width="100" height="26" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="202" y="62" width="110" height="26" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="257" y="80" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">salary（原）</text>
  <rect x="314" y="62" width="60" height="26" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="344" y="80" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">× 2</text>
  <rect x="376" y="62" width="84" height="26" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="418" y="80" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">salary（新）</text>

  <rect x="100" y="92" width="100" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Jack</text>
  <rect x="202" y="92" width="110" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="257" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">19666</text>
  <text x="344" y="111" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">→</text>
  <rect x="376" y="92" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="418" y="111" text-anchor="middle" font-size="11" fill="#b3801f" filter="url(#rough2)">39332</text>

  <rect x="100" y="122" width="100" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Piper</text>
  <rect x="202" y="122" width="110" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="257" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">74754</text>
  <text x="344" y="141" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">→</text>
  <rect x="376" y="122" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="418" y="141" text-anchor="middle" font-size="11" fill="#b3801f" filter="url(#rough2)">149508</text>

  <rect x="100" y="152" width="100" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Mia</text>
  <rect x="202" y="152" width="110" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="257" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">62509</text>
  <text x="344" y="171" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">→</text>
  <rect x="376" y="152" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="418" y="171" text-anchor="middle" font-size="11" fill="#b3801f" filter="url(#rough2)">125018</text>

  <rect x="100" y="182" width="100" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ulysses</text>
  <rect x="202" y="182" width="110" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="257" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">54866</text>
  <text x="344" y="201" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">→</text>
  <rect x="376" y="182" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="418" y="201" text-anchor="middle" font-size="11" fill="#b3801f" filter="url(#rough2)">109732</text>

  <text x="280" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">向量化执行并无显式行循环——此表只是把整列一次算完的结果按行摆开</text>

  <!-- Left: forgot assignment -->
  <rect x="48" y="272" width="225" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 形态一：忘了赋值</text>
  <text x="160" y="318" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">employees['salary'] * 2</text>
  <text x="160" y="336" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">求值出新 Series 随即丢弃</text>
  <text x="160" y="360" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">原表未变 → 评测失败</text>

  <!-- Right: apply version -->
  <rect x="287" y="272" width="225" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="399" y="296" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">△ 形态二：apply 逐元素</text>
  <text x="399" y="318" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">.apply(lambda x: x * 2)</text>
  <text x="399" y="336" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">结果正确，但逐元素回调</text>
  <text x="399" y="360" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">比向量化慢约 100 倍</text>
</svg>
