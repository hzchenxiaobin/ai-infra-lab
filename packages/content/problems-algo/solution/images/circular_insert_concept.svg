<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">循环有序链表的插入：定位插入点的三种情况</text>
  <path d="M 220 38 Q 380 44 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ========= 顶部：环形链表结构 ========= -->
  <text x="40" y="68" font-size="12" font-weight="bold" fill="#2b6e9e">环形链表：3 → 4 → 1 ↺ （升序环绕，1→3 是最小→最大的"拐点"）</text>

  <g font-size="13" fill="#444">
    <g filter="url(#sk)"><rect x="180" y="88" width="48" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="204" y="110" text-anchor="middle" font-weight="bold" fill="#2b6e9e">3</text></g>
    <g filter="url(#sk)"><rect x="300" y="88" width="48" height="34" rx="6" fill="#fff" stroke="#bbb"/><text x="324" y="110" text-anchor="middle">4</text></g>
    <g filter="url(#sk)"><rect x="420" y="88" width="48" height="34" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/><text x="444" y="110" text-anchor="middle" font-weight="bold" fill="#2e6e2e">1</text></g>
  </g>
  <!-- 顺时针箭头 3->4, 4->1 -->
  <path d="M 228 105 L 296 105" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 348 105 L 416 105" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- 1 -> 3 回环（拐点） -->
  <path d="M 444 122 Q 324 168 204 122" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="324" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">拐点：prev(4) > curr(1)，max→min</text>

  <!-- 分隔线 -->
  <path d="M 40 178 Q 380 182 720 178" stroke="#ddd" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ========= Case 1 ========= -->
  <text x="40" y="204" font-size="12" font-weight="bold" fill="#4a7a3a">情况①  升序区间内插入：prev.val ≤ insertVal ≤ curr.val</text>
  <g font-size="12" fill="#444">
    <g filter="url(#sk)"><rect x="100" y="220" width="44" height="30" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/><text x="122" y="240" text-anchor="middle" font-weight="bold">1</text></g>
    <g filter="url(#sk)"><rect x="240" y="220" width="44" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="262" y="240" text-anchor="middle" font-weight="bold">3</text></g>
    <!-- 插入节点 2 -->
    <g filter="url(#sk)"><rect x="168" y="220" width="44" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="190" y="240" text-anchor="middle" font-weight="bold" fill="#b85450">2</text></g>
  </g>
  <path d="M 144 235 L 164 235" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 212 235 L 232 235" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="122" y="270" text-anchor="middle" font-size="10" fill="#888">prev</text>
  <text x="190" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">insert=2</text>
  <text x="262" y="270" text-anchor="middle" font-size="10" fill="#888">curr</text>
  <text x="320" y="240" font-size="11" fill="#4a7a3a">1 ≤ 2 ≤ 3 ✓ 插在 prev 与 curr 之间</text>

  <!-- ========= Case 2 ========= -->
  <text x="40" y="300" font-size="12" font-weight="bold" fill="#d6a040">情况②  拐点处插入：prev.val &gt; curr.val，insertVal ≥ prev(max) 或 ≤ curr(min)</text>
  <g font-size="12" fill="#444">
    <g filter="url(#sk)"><rect x="100" y="316" width="44" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/><text x="122" y="336" text-anchor="middle" font-weight="bold">4</text></g>
    <g filter="url(#sk)"><rect x="240" y="316" width="44" height="30" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/><text x="262" y="336" text-anchor="middle" font-weight="bold">1</text></g>
    <!-- 插入 5（≥max） -->
    <g filter="url(#sk)"><rect x="168" y="316" width="44" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="190" y="336" text-anchor="middle" font-weight="bold" fill="#b85450">5</text></g>
  </g>
  <path d="M 144 331 L 164 331" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 212 331 L 232 331" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="122" y="366" text-anchor="middle" font-size="10" fill="#888">prev=4</text>
  <text x="190" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">insert=5</text>
  <text x="262" y="366" text-anchor="middle" font-size="10" fill="#888">curr=1</text>
  <text x="340" y="336" font-size="11" fill="#d6a040">5 ≥ 4(max) ✓ 或 5 ≤ 1(min)? 否 → 取前者</text>

  <!-- Case 2 第二行：插入 0 -->
  <g font-size="12" fill="#444">
    <g filter="url(#sk)"><rect x="100" y="380" width="44" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/><text x="122" y="400" text-anchor="middle" font-weight="bold">4</text></g>
    <g filter="url(#sk)"><rect x="240" y="380" width="44" height="30" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/><text x="262" y="400" text-anchor="middle" font-weight="bold">1</text></g>
    <g filter="url(#sk)"><rect x="168" y="380" width="44" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="190" y="400" text-anchor="middle" font-weight="bold" fill="#b85450">0</text></g>
  </g>
  <path d="M 144 395 L 164 395" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 212 395 L 232 395" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="340" y="400" font-size="11" fill="#d6a040">0 ≤ 1(min) ✓ 插在 max 与 min 之间</text>

  <!-- 分隔线 -->
  <path d="M 40 432 Q 380 436 720 432" stroke="#ddd" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ========= Case 3 ========= -->
  <text x="40" y="458" font-size="12" font-weight="bold" fill="#4a8edb">情况③  全等遍历一圈无插入点：所有节点值相同，插任意位置</text>
  <g font-size="12" fill="#444">
    <g filter="url(#sk)"><rect x="100" y="472" width="44" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="122" y="492" text-anchor="middle" font-weight="bold">3</text></g>
    <g filter="url(#sk)"><rect x="170" y="472" width="44" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="192" y="492" text-anchor="middle" font-weight="bold">3</text></g>
    <g filter="url(#sk)"><rect x="240" y="472" width="44" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/><text x="262" y="492" text-anchor="middle" font-weight="bold">3</text></g>
    <g filter="url(#sk)"><rect x="310" y="472" width="44" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="332" y="492" text-anchor="middle" font-weight="bold" fill="#b85450">2</text></g>
  </g>
  <path d="M 144 487 L 166 487" stroke="#4a8edb" stroke-width="1.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 214 487 L 236 487" stroke="#4a8edb" stroke-width="1.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 284 487 L 306 487" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="400" y="492" font-size="11" fill="#4a8edb">prev==head 一圈未命中 → 默认插 head 之后</text>

</svg>
