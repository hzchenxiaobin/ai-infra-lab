<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：示例1（m=2 → 4 种）与示例2（m=1 → 2 种）</text>

  <!-- ===== Panel 1: example 1 ===== -->
  <text x="280" y="46" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">示例 1：s = "1001", k = 3, n = 4 → m = n−k+1 = 2 个自由位</text>
  <text x="280" y="62" text-anchor="middle" font-size="10.5" fill="#888">w₀ 覆盖 [0,2]、w₁ 覆盖 [1,3]；p₀=f₀, p₁=p₂=f₀⊕f₁, p₃=f₁</text>

  <!-- table outer -->
  <rect x="44" y="74" width="472" height="160" fill="none" stroke="#ccc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <!-- header row -->
  <rect x="44" y="74" width="472" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="92" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f₀ f₁</text>
  <text x="200" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">翻转奇偶向量 p</text>
  <text x="390" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果串 s ⊕ p</text>
  <!-- column separators -->
  <line x1="140" y1="74" x2="140" y2="234" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="74" x2="300" y2="234" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: (0,0) -->
  <text x="92" y="117" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">0 0</text>
  <text x="200" y="117" text-anchor="middle" font-size="11.5" fill="#888" font-family="monospace">0 0 0 0</text>
  <text x="390" y="117" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" font-weight="bold">1001</text>
  <line x1="50" y1="126" x2="510" y2="126" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 2: (1,0) -->
  <text x="92" y="143" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1 0</text>
  <text x="200" y="143" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" font-weight="bold">1 1 1 0</text>
  <text x="390" y="143" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" font-weight="bold">0111</text>
  <line x1="50" y1="152" x2="510" y2="152" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 3: (0,1) -->
  <text x="92" y="169" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">0 1</text>
  <text x="200" y="169" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" font-weight="bold">0 1 1 1</text>
  <text x="390" y="169" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" font-weight="bold">1110</text>
  <line x1="50" y1="178" x2="510" y2="178" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 4: (1,1) -->
  <text x="92" y="195" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1 1</text>
  <text x="200" y="195" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" font-weight="bold">1 0 0 1</text>
  <text x="390" y="195" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" font-weight="bold">0000</text>

  <!-- conclusion pill -->
  <rect x="150" y="210" width="260" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4 个不同串 = 2² ✓</text>

  <!-- ===== Panel 2: example 2 ===== -->
  <text x="280" y="276" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">示例 2：s = "10110", k = 5, n = 5 → m = 1（整串一个窗口）</text>

  <!-- option A: no op -->
  <rect x="60" y="294" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="318" font-size="11" fill="#446688" font-weight="bold">不操作</text>
  <text x="230" y="318" text-anchor="end" font-size="13" fill="#333" font-family="monospace" font-weight="bold">10110</text>

  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#888">|</text>

  <!-- option B: flip whole -->
  <rect x="300" y="294" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="318" font-size="11" fill="#d6a040" font-weight="bold">翻转整串</text>
  <text x="490" y="318" text-anchor="end" font-size="13" fill="#333" font-family="monospace" font-weight="bold">01001</text>

  <!-- conclusion pill -->
  <rect x="150" y="350" width="260" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2 个不同串 = 2¹ ✓</text>

  <text x="280" y="400" text-anchor="middle" font-size="10.5" fill="#888">两示例均验证：不同串数 = 2^(n−k+1)，与 s 的具体内容无关</text>
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#aaa">（结果串各异 ⟺ 翻转向量线性无关 ⟺ 每个 f 组合对应唯一 p）</text>
</svg>
