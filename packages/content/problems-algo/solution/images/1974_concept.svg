<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L7,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L7,5 L0,10 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：圆盘 26 字符环形排列，取顺/逆时针较短者</text>

  <!-- ===== Dial circle ===== -->
  <circle cx="170" cy="210" r="120" fill="#fff" stroke="#ccc" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="214" text-anchor="middle" font-size="10" fill="#ddd">dial</text>

  <!-- 26 letters around the circle -->
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="170" y="93">a</text>
    <text x="199" y="97">b</text>
    <text x="226" y="107">c</text>
    <text x="250" y="123">d</text>
    <text x="269" y="145">e</text>
    <text x="282" y="170">f</text>
    <text x="289" y="199">g</text>
    <text x="289" y="228">h</text>
    <text x="282" y="256">i</text>
    <text x="269" y="281">j</text>
    <text x="250" y="303">k</text>
    <text x="226" y="319">l</text>
    <text x="199" y="330">m</text>
    <text x="170" y="333">n</text>
    <text x="141" y="330">o</text>
    <text x="114" y="319">p</text>
    <text x="90" y="303">q</text>
    <text x="71" y="281">r</text>
    <text x="58" y="256">s</text>
    <text x="51" y="228">t</text>
    <text x="51" y="199">u</text>
    <text x="58" y="170">v</text>
    <text x="71" y="145">w</text>
    <text x="90" y="123">x</text>
    <text x="114" y="107">y</text>
    <text x="141" y="97">z</text>
  </g>

  <!-- Long arc: a→z clockwise (25 steps, red, dashed) -->
  <path d="M 170 78 A 132 132 0 1 1 138 82" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Short arc: a→z counterclockwise (1 step, green) -->
  <path d="M 170 78 A 132 132 0 0 0 138 82" fill="none" stroke="#4a7a3a" stroke-width="3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Highlight 'a' (current / start) -->
  <circle cx="170" cy="90" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>

  <!-- Highlight 'z' (target) -->
  <circle cx="141" cy="94" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="141" y="98" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">z</text>

  <!-- Pointer arrow above 'a' -->
  <path d="M 170 54 L 170 74" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="170" y="46" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">指针</text>

  <!-- Arc labels -->
  <text x="146" y="66" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">逆时针 1 步 ✓</text>
  <text x="295" y="210" font-size="9.5" fill="#b85450" font-weight="bold">顺时针 25 步 ✗</text>

  <!-- ===== Right side: formula ===== -->
  <path d="M 350 50 L 350 380" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="365" y="68" font-size="12" fill="#555" font-weight="bold">公式：</text>

  <rect x="360" y="78" width="190" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="98" text-anchor="middle" font-size="11" fill="#333">diff = |pos(c) − pos(cur)|</text>
  <text x="455" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">moves = min(diff, 26 − diff)</text>

  <!-- Example box -->
  <text x="365" y="150" font-size="12" fill="#555" font-weight="bold">示例：a → z</text>
  <rect x="360" y="158" width="190" height="82" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="178" font-size="10.5" fill="#555">pos(a) = 0,  pos(z) = 25</text>
  <text x="370" y="194" font-size="10.5" fill="#555">diff = |25 − 0| = 25</text>
  <text x="370" y="210" font-size="10.5" fill="#b85450">顺时针 = 25 步 ✗</text>
  <text x="370" y="226" font-size="10.5" fill="#4a7a3a" font-weight="bold">逆时针 = 26 − 25 = 1 步 ✓</text>

  <!-- Cost formula -->
  <text x="365" y="260" font-size="12" fill="#555" font-weight="bold">每字符代价：</text>
  <rect x="360" y="268" width="190" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="286" text-anchor="middle" font-size="11" fill="#333">移动 moves 步 + 键入 1 秒</text>
  <text x="455" y="304" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">= min(diff, 26−diff) + 1</text>

  <!-- Notes -->
  <text x="365" y="334" font-size="10.5" fill="#888">圆盘是环形的，顺/逆时针均可</text>
  <text x="365" y="350" font-size="10.5" fill="#888">到达目标，取步数较少者。</text>
  <text x="365" y="366" font-size="10.5" fill="#888">指针初始指向 'a'（pos=0）。</text>
  <text x="365" y="382" font-size="10.5" fill="#888">diff = 13 时两方向等长。</text>
</svg>
