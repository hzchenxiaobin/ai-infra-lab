<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：DP 表与对角线接龙（initial = abcde × target = cdef）</text>

  <text x="152" y="46" font-size="10" fill="#888" filter="url(#rough2)">target →</text>
  <text transform="rotate(-90 98 158)" x="98" y="158" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">initial ↓</text>

  <!-- header row -->
  <rect x="110" y="50" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="69" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i＼j</text>
  <rect x="150" y="50" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="170" y="69" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="190" y="50" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="69" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="230" y="50" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="69" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="270" y="50" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="69" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">f</text>

  <!-- header col + data rows: a -->
  <rect x="110" y="78" width="40" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="99" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="150" y="78" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="99" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="190" y="78" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="99" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="230" y="78" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="99" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="270" y="78" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="99" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- row b -->
  <rect x="110" y="110" width="40" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="131" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="150" y="110" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="131" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="190" y="110" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="131" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="230" y="110" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="131" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="270" y="110" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="131" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- row c -->
  <rect x="110" y="142" width="40" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="163" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="150" y="142" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="163" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="190" y="142" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="163" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="230" y="142" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="163" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="270" y="142" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="163" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- row d -->
  <rect x="110" y="174" width="40" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="195" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="150" y="174" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="195" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="190" y="174" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="195" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="230" y="174" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="195" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="270" y="174" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="195" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- row e -->
  <rect x="110" y="206" width="40" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="227" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="150" y="206" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="227" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="190" y="206" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="227" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="230" y="206" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="227" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="270" y="206" width="40" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="227" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- diagonal arrows -->
  <path d="M 186 172 L 212 190" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 226 204 L 252 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- right annotations -->
  <text x="332" y="96" font-size="11" fill="#4a7a3a" filter="url(#rough2)">c = c：f[3][1] = 1</text>
  <text x="332" y="124" font-size="11" fill="#4a7a3a" filter="url(#rough2)">d = d：f[4][2] = 左上 + 1 = 2</text>
  <text x="332" y="152" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">e = e：f[5][3] = 左上 + 1 = 3</text>
  <text x="332" y="186" font-size="11" fill="#555" filter="url(#rough2)">对角线接龙 = 公共子串「cde」</text>
  <text x="332" y="208" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">mx = 3</text>

  <rect x="322" y="226" width="186" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="247" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = 5 + 4 − 2×3 = 3</text>

  <!-- bottom note -->
  <rect x="70" y="286" width="380" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">断串即清零：f[i][j] 只看左上 f[i−1][j−1]，不等归 0</text>
  <text x="260" y="321" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">不能像 LCS（1143）那样从左 / 上取 max 继承 —— 子串要求连续</text>
</svg>
