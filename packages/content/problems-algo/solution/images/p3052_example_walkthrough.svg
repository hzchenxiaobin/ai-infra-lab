<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：先整除定 prime，再取模得余量，再整除定 not_prime</text>

  <rect x="30" y="40" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="56" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">item_type</text>
  <rect x="130" y="40" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="153" y="56" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">件数</text>
  <rect x="176" y="40" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="56" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">面积和 S</text>
  <rect x="246" y="40" width="104" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="56" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">可用空间 C</text>
  <rect x="350" y="40" width="96" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="56" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">套数 k=⌊C/S⌋</text>
  <rect x="446" y="40" width="84" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="56" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">件数=件数×k</text>

  <rect x="30" y="68" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="86" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">prime_eligible</text>
  <text x="80" y="100" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">（6 种商品）</text>
  <rect x="130" y="68" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="176" y="68" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">555.20</text>
  <rect x="246" y="68" width="104" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">500 000</text>
  <text x="298" y="100" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">（整仓容量）</text>
  <rect x="350" y="68" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="86" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">⌊500000/555.2⌋</text>
  <text x="398" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">= 900 套</text>
  <rect x="446" y="68" width="84" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5400</text>

  <rect x="30" y="112" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">not_prime</text>
  <text x="80" y="144" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">（4 种商品）</text>
  <rect x="130" y="112" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="176" y="112" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">128.50</text>
  <rect x="246" y="112" width="104" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">320</text>
  <text x="298" y="144" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">（=500000 mod 555.2）</text>
  <rect x="350" y="112" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⌊320/128.5⌋</text>
  <text x="398" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 2 套</text>
  <rect x="446" y="112" width="84" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="30" y="168" width="500" height="76" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="48" y="190" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">守恒验证：</text>
  <text x="60" y="208" font-size="10" fill="#555" filter="url(#rough2)">✓ prime 实占 900 × 555.2 = 499 680 ≤ 500 000；再塞一套 prime？555.2 &gt; 320 ✗</text>
  <text x="60" y="226" font-size="10" fill="#555" filter="url(#rough2)">✓ not_prime 实占 2 × 128.5 = 257 ≤ 320；再塞一套 not_prime？128.5 &gt; 63 ✗</text>
  <text x="60" y="240" font-size="10" fill="#8a6d1a" filter="url(#rough2)">499 680 + 257 = 499 937，闲置 500 000 − 499 937 = 63 sq ft（塞不下任何整套）</text>

  <path d="M 280 244 L 280 258" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="160" y="282" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">item_type</text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">item_count</text>
  <rect x="100" y="290" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="308" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">prime_eligible</text>
  <rect x="220" y="290" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">5400</text>
  <rect x="100" y="320" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">not_prime</text>
  <rect x="220" y="320" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="390" y="308" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 件数大者在前</text>
  <text x="390" y="338" font-size="10" fill="#999" filter="url(#rough2)">（ORDER BY item_count DESC）</text>
</svg>
