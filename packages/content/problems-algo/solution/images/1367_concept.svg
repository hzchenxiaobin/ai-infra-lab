<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">链表视作「模式串」，在二叉树的向下路径中做匹配</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">路径必须从父走到子（向下），不可回头；模式 = 链表整条</text>

  <!-- ===== Left: pattern + tree ===== -->
  <text x="150" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 链表 = 模式 [4, 2, 8]</text>

  <!-- linked list boxes -->
  <rect x="60" y="84" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="103" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <line x1="100" y1="98" x2="120" y2="98" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="84" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="103" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <line x1="160" y1="98" x2="180" y2="98" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="84" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="103" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8</text>
  <text x="240" y="103" font-size="10" fill="#888">head</text>

  <!-- tree -->
  <text x="150" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② 树中红色路径即一次成功匹配</text>

  <g font-size="12">
    <!-- edges (non-match) -->
    <line x1="150" y1="164" x2="100" y2="200" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="150" y1="164" x2="210" y2="200" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="100" y1="210" x2="140" y2="246" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="210" y1="210" x2="180" y2="246" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="210" y1="210" x2="250" y2="246" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

    <!-- match edges: 4->2->8 (right 4 -> left 2 -> right 8) -->
    <line x1="210" y1="210" x2="180" y2="246" stroke="#b85450" stroke-width="2.8" filter="url(#rough2)"/>
    <line x1="180" y1="256" x2="250" y2="292" stroke="#b85450" stroke-width="2.8" filter="url(#rough2)"/>

    <!-- nodes -->
    <circle cx="150" cy="158" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="150" y="163" text-anchor="middle" fill="#446688" font-weight="bold">1</text>

    <circle cx="100" cy="204" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="100" y="209" text-anchor="middle" fill="#446688" font-weight="bold">4</text>

    <circle cx="210" cy="204" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="210" y="209" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>

    <circle cx="140" cy="252" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="257" text-anchor="middle" fill="#446688" font-weight="bold">2</text>

    <circle cx="180" cy="252" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="180" y="257" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>

    <circle cx="250" cy="252" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="250" y="257" text-anchor="middle" fill="#446688" font-weight="bold">6</text>

    <circle cx="250" cy="298" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="250" y="303" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
  </g>

  <text x="150" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 → 2 → 8：模式整段出现</text>

  <!-- ===== Right: KMP insight ===== -->
  <text x="460" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ KMP：状态 j 沿树下行，失配回退</text>

  <rect x="330" y="84" width="260" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dfs(node, j) —— j = 已匹配长度</text>
  <text x="344" y="126" font-size="11" fill="#333" font-family="monospace">while j&gt;0 and val≠p[j]: j=next[j-1]</text>
  <text x="344" y="144" font-size="11" fill="#333" font-family="monospace">if val==p[j]: j+=1</text>
  <text x="344" y="158" font-size="10" fill="#888">j==m 即整段匹配成功</text>

  <rect x="330" y="172" width="260" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">回退 = 保留最长「前缀=后缀」</text>
  <text x="344" y="214" font-size="10" fill="#555">已匹配 [1,2,1] 失配时：</text>
  <text x="344" y="230" font-size="11" fill="#333" font-family="monospace">j = next[2] = 1   // 留住前缀 "1"</text>
  <text x="344" y="246" font-size="10" fill="#888">不必从头重比，进度部分保留</text>

  <rect x="330" y="260" width="260" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">分支独立：j 按值传递</text>
  <text x="344" y="300" font-size="10" fill="#555">dfs(left, j) 与 dfs(right, j) 用同一</text>
  <text x="344" y="312" font-size="10" fill="#555">个入口 j，兄弟间互不污染</text>

  <!-- compare naive vs kmp -->
  <rect x="20" y="350" width="580" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="40" y="372" font-size="11" fill="#446688" font-weight="bold">对比</text>
  <text x="40" y="392" font-size="10" fill="#555">暴力：每个树节点都从 head 重比一遍，失配即弃，最坏 O(n·m)</text>
  <text x="40" y="410" font-size="10" fill="#555">KMP ：单趟 DFS 携带状态 j，失配靠 next[] 回退，整树 O(n+m)</text>
  <text x="40" y="424" font-size="10" fill="#888">关键差别：失配后「丢弃进度」还是「保留最长前缀」</text>
</svg>
