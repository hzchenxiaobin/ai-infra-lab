<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：建 starts 集合 → 逐个查 cityBi ∉ starts</text>

  <!-- Start -->
  <ellipse cx="180" cy="54" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 180 70 L 180 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: build starts set -->
  <rect x="72" y="84" width="216" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="11.5" fill="#333">starts = { p[0] for p in paths }</text>

  <path d="M 180 116 L 180 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: init -->
  <rect x="110" y="130" width="140" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="11.5" fill="#333">i = 0</text>

  <path d="M 180 162 L 180 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="180,178 262,216 180,254 98,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="220" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- Yes branch down -->
  <path d="M 180 254 L 180 270" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond: cityBi in starts? -->
  <polygon points="180,272 276,310 180,348 84,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="306" text-anchor="middle" font-size="11.5" fill="#333">paths[i][1]</text>
  <text x="180" y="320" text-anchor="middle" font-size="11.5" fill="#333">∉ starts ?</text>

  <!-- Yes (found) -> return -->
  <path d="M 276 310 L 322 310" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="304" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="322" y="294" width="150" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="397" y="314" text-anchor="middle" font-size="11.5" fill="#333">返回 paths[i][1]</text>

  <path d="M 397 326 L 397 338" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="397" cy="356" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="397" y="360" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- No -> i += 1 -> loop back -->
  <path d="M 180 348 L 180 362" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="360" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="130" y="364" width="100" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="382" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <!-- loop back: box left -> far left -> up -> diamond i<n left -->
  <path d="M 130 378 L 50 378 L 50 216 L 98 216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="54" y="210" font-size="10.5" fill="#4a7a3a">回到判断</text>

  <!-- No branch (i<n) right -> unreachable note -->
  <path d="M 262 216 L 322 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="210" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="322" y="200" width="172" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408" y="220" text-anchor="middle" font-size="10.5" fill="#b85450">（题目保证必有终点）</text>

  <!-- footer note -->
  <rect x="60" y="396" width="440" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#555">建集合 O(n) + 遍历查集合 O(n)，集合查询 O(1)，总 O(n) 时间 / O(n) 空间</text>
</svg>
