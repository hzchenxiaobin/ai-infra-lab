<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：四类输入的判定</text>

  <text x="40" y="48" font-size="11.5" fill="#4a7a3a" font-weight="bold">例1: n=16</text>

  <text x="40" y="73" font-size="10.5" fill="#333" font-weight="bold">n=16</text>
  <rect x="170" y="56" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="73" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="202" y="56" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="73" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="234" y="56" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="73" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="266" y="56" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="73" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="298" y="56" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="73" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="330" y="56" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="73" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="362" y="56" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="73" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="394" y="56" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="73" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <text x="436" y="73" font-size="9.5" fill="#b85450">1 在 bit 4（偶数位）</text>

  <rect x="40" y="92" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① n&gt;0 ✓   ② n&amp;(n−1)==0 ✓   ③ n&amp;0x55555555=16≠0 ✓   → true ✓</text>

  <line x1="40" y1="128" x2="520" y2="128" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <text x="40" y="148" font-size="11.5" fill="#b85450" font-weight="bold">例2: n=8</text>

  <text x="40" y="173" font-size="10.5" fill="#333" font-weight="bold">n=8</text>
  <rect x="170" y="156" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="173" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="202" y="156" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="173" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="234" y="156" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="173" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="266" y="156" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="173" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="298" y="156" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="173" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="330" y="156" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="173" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="362" y="156" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="173" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="394" y="156" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="173" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <text x="436" y="173" font-size="9.5" fill="#d6a040">1 在 bit 3（奇数位）</text>

  <rect x="40" y="192" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">① ✓   ② ✓   ③ n&amp;0x55555555==0 ✗（1 在奇数位）   → false ✗</text>

  <line x1="40" y1="228" x2="520" y2="228" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <text x="40" y="248" font-size="11.5" fill="#b85450" font-weight="bold">例3: n=5</text>

  <text x="40" y="273" font-size="10.5" fill="#333" font-weight="bold">n=5</text>
  <rect x="170" y="256" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="273" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="202" y="256" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="273" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="234" y="256" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="273" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="266" y="256" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="273" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="298" y="256" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="273" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="330" y="256" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="362" y="256" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="273" text-anchor="middle" font-size="12" fill="#333" >0</text>
  <rect x="394" y="256" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="436" y="273" font-size="9.5" fill="#b85450">两个 1</text>

  <rect x="40" y="292" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">① n&gt;0 ✓   ② n&amp;(n−1)=5&amp;4=4≠0 ✗（非 2 的幂）   → false ✗</text>

  <line x1="40" y1="328" x2="520" y2="328" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <text x="40" y="348" font-size="11.5" fill="#b85450" font-weight="bold">例4: n=0</text>

  <rect x="150" y="338" width="370" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="335" y="355" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">n &gt; 0 不满足 → false（0 非 4 的幂）</text>

  <rect x="60" y="372" width="440" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="389" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">三道关：① n&gt;0   ② n&amp;(n−1)==0   ③ n&amp;0x55555555≠0，缺一不可</text>
</svg>