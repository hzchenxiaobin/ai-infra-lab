<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 + 双指针贪心</text>

  <!-- Start -->
  <rect x="250" y="42" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">开始</text>
  <line x1="300" y1="70" x2="300" y2="86" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort + init box -->
  <rect x="120" y="88" width="360" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="110" text-anchor="middle" font-size="12" fill="#555">排序 tokens；left=0, right=n−1, score=0, maxScore=0</text>
  <line x1="300" y1="122" x2="300" y2="138" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond 1: left <= right -->
  <polygon points="300,140 390,180 300,220 210,180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="176" text-anchor="middle" font-size="12" fill="#3a5a2a">left ≤ right</text>
  <text x="300" y="192" text-anchor="middle" font-size="12" fill="#3a5a2a">?</text>

  <!-- No -> return maxScore -->
  <line x1="390" y1="180" x2="458" y2="180" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="424" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="166" width="120" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="185" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 maxScore</text>

  <!-- Yes -> down to Diamond 2 -->
  <line x1="300" y1="220" x2="300" y2="236" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="316" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond 2: power >= tokens[left] -->
  <polygon points="300,238 396,280 300,322 204,280" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="285" text-anchor="middle" font-size="12" fill="#2a4a66">power ≥</text>
  <text x="300" y="301" text-anchor="middle" font-size="12" fill="#2a4a66">tokens[left] ?</text>

  <!-- Yes (face-up) -> left box -->
  <line x1="204" y1="280" x2="166" y2="280" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="185" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="34" y="258" width="132" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="276" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">正面朝上</text>
  <text x="100" y="291" text-anchor="middle" font-size="10" fill="#2a4a66">power−=t[left]</text>
  <text x="100" y="303" text-anchor="middle" font-size="10" fill="#2a4a66">score++, left++, 更新max</text>

  <!-- No -> Diamond 3 -->
  <line x1="300" y1="322" x2="300" y2="340" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="316" y="336" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Diamond 3: score >= 1 -->
  <polygon points="300,340 384,380 300,420 216,380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="385" text-anchor="middle" font-size="12" fill="#a67830">score ≥ 1 ?</text>

  <!-- Yes (face-down) -> right box -->
  <line x1="384" y1="380" x2="422" y2="380" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="403" y="372" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">是</text>
  <rect x="424" y="358" width="142" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="376" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">反面朝下</text>
  <text x="495" y="391" text-anchor="middle" font-size="10" fill="#a67830">power+=t[right]</text>
  <text x="495" y="403" text-anchor="middle" font-size="10" fill="#a67830">score−−, right−−</text>

  <!-- No -> break (merge with return) -->
  <line x1="216" y1="380" x2="178" y2="380" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="197" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="34" y="366" width="144" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="385" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无法操作，跳出</text>

  <!-- Loopback from face-up box: bottom -> down -> left corridor -> up -> Diamond 1 -->
  <path d="M 100 306 L 100 460 L 24 460 L 24 180 L 208 180" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- Loopback from face-down box: joins main loopback -->
  <path d="M 495 406 L 495 460 L 100 460" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="40" y="476" font-size="11" fill="#666">↻ 循环：每次操作后回到「left ≤ right」判断</text>

  <rect x="60" y="488" width="480" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="505" text-anchor="middle" font-size="11" fill="#555">关键：优先正面朝上拿分；能量不够且有分时才反面朝下换能量</text>
</svg>
