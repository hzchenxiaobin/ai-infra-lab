<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐行求和、严格 &gt; 刷新 (idx, mx)，遍历完返回</text>

  <!-- ============ Left panel: Example 2 ============ -->
  <text x="30" y="52" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：mat = [[0,0,0],[0,1,1]]</text>

  <!-- header -->
  <text x="30" y="74" font-size="10" fill="#999" filter="url(#rough2)">行</text>
  <text x="62" y="74" font-size="10" fill="#999" filter="url(#rough2)">该行</text>
  <text x="148" y="74" font-size="10" fill="#999" filter="url(#rough2)">sum</text>
  <text x="184" y="74" font-size="10" fill="#999" filter="url(#rough2)">c &gt; mx?</text>
  <text x="248" y="74" font-size="10" fill="#999" filter="url(#rough2)">(idx,mx)</text>

  <!-- row 0 -->
  <text x="40" y="98" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="56" y="84" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="67" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="78" y="84" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="89" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="84" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="111" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="156" y="100" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="190" y="100" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <text x="248" y="100" font-size="11" fill="#555" filter="url(#rough2)">(0,0)</text>

  <!-- row 1: update -->
  <text x="40" y="126" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="56" y="112" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="67" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="78" y="112" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="89" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="100" y="112" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="111" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="156" y="128" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="190" y="128" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <text x="248" y="128" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1,2) ⭐</text>

  <!-- result -->
  <rect x="30" y="146" width="250" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="155" y="165" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 [1, 2]</text>

  <!-- ============ Right panel: Example 3 ============ -->
  <text x="320" y="52" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3：mat = [[0,0],[1,1],[0,0]]</text>

  <text x="320" y="74" font-size="10" fill="#999" filter="url(#rough2)">行</text>
  <text x="352" y="74" font-size="10" fill="#999" filter="url(#rough2)">该行</text>
  <text x="418" y="74" font-size="10" fill="#999" filter="url(#rough2)">sum</text>
  <text x="454" y="74" font-size="10" fill="#999" filter="url(#rough2)">c &gt; mx?</text>
  <text x="520" y="74" font-size="10" fill="#999" filter="url(#rough2)">(idx,mx)</text>

  <!-- row 0 -->
  <text x="330" y="98" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="346" y="84" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="357" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="368" y="84" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="379" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="426" y="100" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="460" y="100" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <text x="520" y="100" font-size="11" fill="#555" filter="url(#rough2)">(0,0)</text>

  <!-- row 1: update -->
  <text x="330" y="126" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="346" y="112" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="357" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="368" y="112" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="379" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="426" y="128" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="460" y="128" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <text x="520" y="128" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1,2) ⭐</text>

  <!-- row 2: keep -->
  <text x="330" y="154" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="346" y="140" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="357" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="368" y="140" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="379" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="426" y="156" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="460" y="156" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <text x="520" y="156" font-size="11" fill="#555" filter="url(#rough2)">(1,2)</text>

  <!-- result -->
  <rect x="320" y="174" width="250" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="193" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 [1, 2]</text>

  <text x="300" y="230" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">观察：两例都最终 (idx=1, mx=2)；示例 3 多扫一行但 row 2 的 0 不刷新答案（严格 &gt;）</text>
</svg>
