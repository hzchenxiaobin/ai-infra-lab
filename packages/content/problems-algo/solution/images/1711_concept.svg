<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：和为 2 的幂的数对 —— 枚举 22 个目标，哈希查补数</text>

  <!-- ===== Left: definition of good meal ===== -->
  <text x="150" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">大餐 = 两个不同餐 a + b 是 2 的幂</text>

  <!-- meal a -->
  <g filter="url(#rough2)">
    <rect x="64" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="92" y="92" text-anchor="middle" font-size="11" fill="#888">餐 a</text>
    <text x="92" y="107" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="130" y="100" font-size="16" fill="#555" font-weight="bold" filter="url(#rough2)">+</text>
  <!-- meal b -->
  <g filter="url(#rough2)">
    <rect x="146" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="174" y="92" text-anchor="middle" font-size="11" fill="#888">餐 b</text>
    <text x="174" y="107" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>
  </g>
  <text x="212" y="100" font-size="16" fill="#555" font-weight="bold" filter="url(#rough2)">=</text>
  <!-- power chip -->
  <g filter="url(#rough2)">
    <rect x="226" y="76" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="18"/>
    <text x="251" y="99" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2³</text>
  </g>

  <path d="M 150 124 L 150 140" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- insight under definition -->
  <rect x="44" y="146" width="232" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="164" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两数之和的变体：</text>
  <text x="56" y="178" font-size="10" fill="#555" filter="url(#rough2)">目标值不是单一 target，而是</text>
  <text x="56" y="192" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">「2 的幂」这一组目标集合</text>

  <!-- ===== Right: target set is tiny ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">目标集合只有 22 个值</text>

  <rect x="312" y="72" width="232" height="132" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="90" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">值域 ≤ 2²⁰ → 最大和 2²¹</text>
  <text x="324" y="110" font-size="11" fill="#555" filter="url(#rough2)">2⁰ 2¹ 2² 2³ 2⁴ 2⁵</text>
  <text x="324" y="126" font-size="11" fill="#555" filter="url(#rough2)">2⁶ 2⁷ 2⁸ 2⁹ 2¹⁰</text>
  <text x="324" y="142" font-size="11" fill="#555" filter="url(#rough2)">2¹¹ 2¹² 2¹³ 2¹⁴ 2¹⁵</text>
  <text x="324" y="158" font-size="11" fill="#555" filter="url(#rough2)">2¹⁶ 2¹⁷ 2¹⁸ 2¹⁹ 2²⁰</text>
  <text x="324" y="174" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2²¹</text>
  <text x="324" y="194" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">共 22 个 → 可逐个枚举</text>

  <!-- ===== Bottom: hash strategy ===== -->
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">策略：一次遍历 + 哈希计数，对每个 x 枚举 22 个目标</text>

  <!-- array -->
  <text x="40" y="258" font-size="10" fill="#888" filter="url(#rough2)">数组：</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="78" y="246" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="95" y="266" fill="#446688">1</text>
    <rect x="112" y="246" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="129" y="266" fill="#446688">3</text>
    <rect x="146" y="246" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="163" y="266" fill="#446688">5</text>
    <rect x="180" y="246" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="197" y="266" fill="#446688">7</text>
    <rect x="214" y="246" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="231" y="266" fill="#446688">9</text>
  </g>
  <text x="256" y="266" font-size="9" fill="#aaa" filter="url(#rough2)">遍历每个 x</text>

  <!-- arrow down -->
  <path d="M 95 280 L 95 298" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for each power box -->
  <rect x="40" y="302" width="220" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="322" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">对每个 x，枚举 22 个幂 p：</text>
  <line x1="52" y1="330" x2="248" y2="330" stroke="#e8d090" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="346" font-size="10" fill="#555" filter="url(#rough2)">补数 = p − x</text>
  <text x="52" y="362" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans += cnt[补数]</text>
  <text x="52" y="378" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 查哈希 O(1)</text>

  <!-- arrow right -->
  <path d="M 262 345 L 300 345" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- hash map -->
  <rect x="304" y="302" width="216" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="412" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">哈希表 cnt（值→出现次数）</text>
  <line x1="316" y1="330" x2="510" y2="330" stroke="#c0d0e8" stroke-width="1" filter="url(#rough2)"/>
  <text x="316" y="346" font-size="10" fill="#555" filter="url(#rough2)">查 cnt[p−x]：之前见过几个？</text>
  <text x="316" y="362" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">先查后存：只数 i &lt; j 的对</text>
  <text x="316" y="378" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">查完再 cnt[x] += 1</text>

  <!-- footer key insight -->
  <rect x="40" y="404" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="424" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键：两数之和只有一个 target → 哈希查一次；本题有 22 个 target → 哈希查 22 次，仍 O(n)</text>
  <text x="52" y="440" font-size="10" fill="#555" filter="url(#rough2)">值域上界让目标集合缩小为常数 22，是「枚举目标」可行的根源</text>

  <text x="280" y="468" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">22 × 10⁵ ≈ 2×10⁶ 次哈希查找，远低于 O(n²) = 10¹⁰</text>
</svg>
