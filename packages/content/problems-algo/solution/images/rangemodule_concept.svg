<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：有序 map 维护互不相交区间，三种操作均 O(log n)</text>

  <text x="40" y="64" font-size="12" fill="#888" font-weight="bold">操作前</text>
  <text x="40" y="80" font-size="10.5" fill="#888">已有 3 段，互不相交</text>

  <rect x="160" y="92" width="80" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="280" y="92" width="40" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="400" y="92" width="80" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="200" y="105" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[10,20)</text>
  <text x="300" y="105" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[25,30)</text>
  <text x="440" y="105" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[40,50)</text>

  <rect x="200" y="116" width="104" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="252" y="127" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">addRange(15, 28)</text>

  <line x1="80" y1="138" x2="500" y2="138" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="134" x2="80" y2="142" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="134" x2="160" y2="142" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="134" x2="240" y2="142" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="134" x2="320" y2="142" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="134" x2="400" y2="142" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="134" x2="480" y2="142" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="156" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="160" y="156" text-anchor="middle" font-size="10" fill="#888">10</text>
  <text x="240" y="156" text-anchor="middle" font-size="10" fill="#888">20</text>
  <text x="320" y="156" text-anchor="middle" font-size="10" fill="#888">30</text>
  <text x="400" y="156" text-anchor="middle" font-size="10" fill="#888">40</text>
  <text x="480" y="156" text-anchor="middle" font-size="10" fill="#888">50</text>

  <path d="M 280 172 L 280 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="190" font-size="10.5" fill="#666" font-weight="bold">合并重叠 + 相邻</text>

  <text x="40" y="222" font-size="12" fill="#888" font-weight="bold">操作后</text>
  <text x="40" y="238" font-size="10.5" fill="#4a7a3a">[10,20)∪[15,28)∪[25,30) → [10,30)</text>

  <rect x="160" y="252" width="160" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="400" y="252" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="265" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[10, 30)</text>
  <text x="440" y="265" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[40, 50)</text>

  <line x1="80" y1="284" x2="500" y2="284" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="280" x2="80" y2="288" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="280" x2="160" y2="288" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="280" x2="240" y2="288" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="280" x2="320" y2="288" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="280" x2="400" y2="288" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="280" x2="480" y2="288" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="302" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="160" y="302" text-anchor="middle" font-size="10" fill="#888">10</text>
  <text x="240" y="302" text-anchor="middle" font-size="10" fill="#888">20</text>
  <text x="320" y="302" text-anchor="middle" font-size="10" fill="#888">30</text>
  <text x="400" y="302" text-anchor="middle" font-size="10" fill="#888">40</text>
  <text x="480" y="302" text-anchor="middle" font-size="10" fill="#888">50</text>

  <text x="40" y="332" font-size="11.5" fill="#888" font-weight="bold">map&lt;int,int&gt; ranges（只存端点）</text>
  <rect x="180" y="320" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">{ 10 → 30,  40 → 50 }</text>

  <rect x="36" y="360" width="488" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="382" font-size="12" fill="#4a7a3a" font-weight="bold">为什么用有序 map？</text>
  <text x="56" y="402" font-size="11" fill="#555">• 不变量：互不相交 + 按键有序；upper_bound(left) 前移一位即得「起点 ≤ left 的唯一区间」</text>
  <text x="56" y="420" font-size="11" fill="#555">• queryRange 一步判定；addRange/removeRange 定位 + 合并/切分均 O(log n)</text>
  <text x="56" y="438" font-size="11" fill="#b85450" font-weight="bold">→ 值域 10⁹ 只存 O(操作数) 条端点，空间压缩 4 个数量级</text>
</svg>
