<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="392" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两个易错样本 + 一个溢出陷阱</text>

  <!-- ===== Example 2: min at deepest level ===== -->
  <rect x="24" y="40" width="230" height="192" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="139" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：最小层藏在最深处</text>
  <g font-size="11">
    <circle cx="95" cy="96" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="95" y="100" text-anchor="middle" fill="#446688" font-weight="bold">36</text>
    <circle cx="60" cy="136" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="60" y="140" text-anchor="middle" fill="#446688" font-weight="bold">17</text>
    <circle cx="140" cy="136" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="140" text-anchor="middle" fill="#446688" font-weight="bold">10</text>
    <circle cx="120" cy="176" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="120" y="180" text-anchor="middle" fill="#b85450" font-weight="bold">24</text>
    <line x1="85" y1="108" x2="66" y2="124" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="105" y1="108" x2="132" y2="124" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="134" y1="148" x2="124" y2="164" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  </g>
  <g font-size="10.5">
    <text x="176" y="100" fill="#446688" filter="url(#rough2)">L1 = 36</text>
    <text x="176" y="140" fill="#446688" filter="url(#rough2)">L2 = 27</text>
    <text x="176" y="180" fill="#b85450" font-weight="bold" filter="url(#rough2)">L3 = 24 ★</text>
  </g>
  <text x="139" y="218" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">最小层和 24 在 L3 → 不能提前终止</text>

  <!-- ===== Example 3: tie -> smallest level ===== -->
  <rect x="266" y="40" width="230" height="192" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="381" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3：三层全平，取最小层号</text>
  <g font-size="11">
    <circle cx="330" cy="96" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="330" y="100" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="365" cy="136" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="365" y="140" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="400" cy="176" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="400" y="180" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <line x1="340" y1="106" x2="357" y2="128" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="375" y1="146" x2="392" y2="168" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  </g>
  <g font-size="10.5">
    <text x="440" y="100" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L1 = 5 ✅</text>
    <text x="440" y="140" fill="#4a7a3a" filter="url(#rough2)">L2 = 5</text>
    <text x="440" y="180" fill="#4a7a3a" filter="url(#rough2)">L3 = 5</text>
  </g>
  <text x="381" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">严格 &lt; 只在 L1 触发 → ans = 1</text>

  <!-- ===== Overflow trap ===== -->
  <rect x="24" y="248" width="472" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">溢出陷阱：n ≤ 10^5、|val| ≤ 10^5 ⇒ 单层和上界 10^10</text>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">超出 int32（≈ 2.1×10^9）⇒ C++ 层和必须 long long；Python 整数无上限</text>

  <!-- ===== Example 1 rolling ===== -->
  <rect x="24" y="316" width="472" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1 滚动演算：minSum 从 +∞ 出发</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">L1: 50 &lt; +∞ → 50@L1     L2: 8 &lt; 50 → 8@L2 ✅     L3: 117 &lt; 8? 否</text>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 2（层和 8 最小）</text>
</svg>
