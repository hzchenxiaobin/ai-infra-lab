<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：后缀 DP + 净赚（零和博弈）</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">dp[i] = 当前玩家从位置 i 出发，能比对手多拿的分数（净赚）</text>

  <!-- array values = [1,2,3,7] -->
  <text x="70" y="86" text-anchor="end" font-size="12" fill="#666" font-weight="bold">values =</text>
  <g font-size="16">
    <rect x="84" y="66" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="112" y="92" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="144" y="66" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="172" y="92" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="204" y="66" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="232" y="92" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="264" y="66" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="292" y="92" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
  </g>
  <!-- index labels -->
  <text x="112" y="122" text-anchor="middle" font-size="9" fill="#999">i=0</text>
  <text x="172" y="122" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="232" y="122" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="292" y="122" text-anchor="middle" font-size="9" fill="#999">3</text>

  <!-- pointer at i=0 -->
  <path d="M 112 130 L 112 144" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="112" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">当前先手</text>

  <!-- three take options -->
  <!-- option k=1 -->
  <rect x="40" y="178" width="180" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="198" font-size="12" fill="#4a7a3a" font-weight="bold">拿 1 堆</text>
  <g font-size="13">
    <rect x="56" y="208" width="32" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="72" y="226" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <text x="96" y="226" font-size="10" fill="#666">得 1，对手从 i=1 起</text>
  <text x="56" y="252" font-size="12" fill="#4a7a3a" font-weight="bold">净赚 = 1 − dp[1]</text>
  <text x="56" y="268" font-size="9" fill="#888">对手成先手，其净赚为 dp[1]</text>

  <!-- option k=2 -->
  <rect x="230" y="178" width="180" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="246" y="198" font-size="12" fill="#d6a040" font-weight="bold">拿 2 堆</text>
  <g font-size="13">
    <rect x="246" y="208" width="32" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="262" y="226" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="280" y="208" width="32" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="296" y="226" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
  </g>
  <text x="320" y="226" font-size="10" fill="#666">得 3，对手从 i=2 起</text>
  <text x="246" y="252" font-size="12" fill="#d6a040" font-weight="bold">净赚 = 3 − dp[2]</text>
  <text x="246" y="268" font-size="9" fill="#888">身份互换：我选 max，对手选 min</text>

  <!-- option k=3 -->
  <rect x="420" y="178" width="180" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="436" y="198" font-size="12" fill="#b85450" font-weight="bold">拿 3 堆</text>
  <g font-size="13">
    <rect x="436" y="208" width="28" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="450" y="226" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="466" y="208" width="28" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="480" y="226" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="496" y="208" width="28" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="510" y="226" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>
  <text x="532" y="226" font-size="10" fill="#666">得 6，对手从 i=3 起</text>
  <text x="436" y="252" font-size="12" fill="#b85450" font-weight="bold">净赚 = 6 − dp[3]</text>
  <text x="436" y="268" font-size="9" fill="#888">最多取 3 堆，候选固定 3 个</text>

  <!-- max formula box -->
  <rect x="40" y="290" width="560" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="312" font-size="13" fill="#446688" font-weight="bold">dp[i] = max(Sₖ − dp[i+k])，k = 1, 2, 3</text>
  <text x="60" y="332" font-size="11" fill="#666">Sₖ = values[i] + … + values[i+k−1]（这一手拿的分数）；先手从 3 个候选中选净赚最大者</text>

  <!-- zero-sum explanation -->
  <rect x="40" y="358" width="560" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="380" font-size="12" fill="#b85450" font-weight="bold">💡 为什么「净赚」一行搞定？</text>
  <text x="60" y="400" font-size="11" fill="#666">零和博弈：区间总分固定，先手多拿 = 后手少拿。只记差值即可判输赢。</text>
  <text x="60" y="418" font-size="11" fill="#666">身份互换：先手拿 k 堆后，对手成为剩余部分的「先手」拿到净赚 dp[i+k]。</text>
  <text x="60" y="436" font-size="11" fill="#666">从原先手视角，对手的净赚要减去 → dp[i] = Sₖ − dp[i+k]。无需标记「轮到谁」。</text>
</svg>
