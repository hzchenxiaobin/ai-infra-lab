<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">区域包含关系 = 一棵树</text>

  <!-- Earth (root) -->
  <rect x="240" y="55" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Earth</text>

  <!-- Lines from Earth to North America and South America -->
  <path d="M265,89 L170,125" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M305,89 L400,125" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- North America -->
  <rect x="120" y="125" width="110" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">North America</text>

  <!-- South America -->
  <rect x="370" y="125" width="100" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">South America</text>

  <!-- Lines from North America -->
  <path d="M155,159 L100,200" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M195,159 L260,200" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- United States -->
  <rect x="50" y="200" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">United States</text>

  <!-- Canada -->
  <rect x="230" y="200" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Canada</text>

  <!-- Line from South America to Brazil -->
  <path d="M420,159 L420,200" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="380" y="200" width="80" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Brazil</text>

  <!-- Lines from United States -->
  <path d="M85,234 L55,270" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M115,234 L145,270" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- New York -->
  <rect x="20" y="270" width="80" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">New York</text>

  <!-- Boston -->
  <rect x="120" y="270" width="70" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Boston</text>

  <!-- Lines from Canada -->
  <path d="M255,234 L215,270" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M285,234 L315,270" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Ontario -->
  <rect x="190" y="270" width="70" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ontario</text>

  <!-- Quebec (highlighted) -->
  <rect x="290" y="270" width="70" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="325" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Quebec</text>

  <!-- Highlight LCA path: Quebec -> Canada -> North America -->
  <path d="M290,285 L175,142" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6,3" fill="none" opacity="0.6" filter="url(#rough2)"/>
  <path d="M60,285 L175,142" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6,3" fill="none" opacity="0.6" filter="url(#rough2)"/>

  <!-- Annotation -->
  <rect x="340" y="320" width="200" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">region1 = Quebec (红框)</text>
  <text x="440" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">region2 = New York (红框)</text>
  <text x="440" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">LCA = North America</text>

  <!-- Parent pointer arrow annotation -->
  <text x="20" y="340" font-size="10" fill="#888" filter="url(#rough2)">每条边 = parent[child] = parent</text>
</svg>
