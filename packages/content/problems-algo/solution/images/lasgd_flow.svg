<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单层循环 + 哈希 O(1) 转移</text>

  <!-- Start -->
  <rect x="200" y="48" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="17" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 arr 中每个 v</text>

  <!-- arrow down -->
  <path d="M 260 82 L 260 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- compute prev -->
  <rect x="170" y="105" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="12" fill="#333">prev = v − difference</text>

  <!-- arrow down -->
  <path d="M 260 139 L 260 157" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,160 360,200 260,240 160,200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#333">dp 中存在</text>
  <text x="260" y="212" text-anchor="middle" font-size="11" fill="#333">prev ?</text>

  <!-- Yes branch -->
  <path d="M 160 200 L 100 200 L 100 240" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="118" y="192" font-size="11" fill="#4a7a3a">是</text>

  <rect x="30" y="245" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="262" text-anchor="middle" font-size="11" fill="#333">dp[v] =</text>
  <text x="100" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[prev] + 1</text>

  <!-- No branch -->
  <path d="M 360 200 L 420 200 L 420 240" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="378" y="192" font-size="11" fill="#b85450">否</text>

  <rect x="350" y="245" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="262" text-anchor="middle" font-size="11" fill="#333">dp[v] =</text>
  <text x="420" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1 (新起)</text>

  <!-- merge arrows -->
  <path d="M 100 285 L 100 310 L 260 310" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 420 285 L 420 310 L 260 310" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- arrow down to ans -->
  <path d="M 260 310 L 260 328" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- update ans -->
  <rect x="160" y="333" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="355" text-anchor="middle" font-size="12" fill="#333">ans = max(ans, dp[v])</text>

  <!-- loop back arrow -->
  <path d="M 360 350 L 470 350 L 470 65 L 320 65" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="478" y="210" font-size="10" fill="#888">下一个 v</text>

  <!-- return -->
  <rect x="200" y="378" width="120" height="16" fill="none"/>
</svg>
