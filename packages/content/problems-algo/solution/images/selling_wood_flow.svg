<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：按尺寸递增填表</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">外层 i 从 1→m，内层 j 从 1→n，子问题先算好</text>

  <rect x="40" y="70" width="440" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="98" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 初始化</text>
  <text x="150" y="98" font-size="11" fill="#333" filter="url(#rough2)">建 price[h][w] 价格表，dp[i][j] 先置 price[i][j]</text>

  <path d="M 260 120 Q 260 132 260 142" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="146" width="440" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="174" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 双重循环</text>
  <text x="150" y="174" font-size="11" fill="#333" filter="url(#rough2)">for i in 1..m:  for j in 1..n:</text>

  <path d="M 260 196 Q 260 208 260 218" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="222" width="210" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="250" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">③a 横切：枚举 k∈[1,i)</text>
  <text x="180" y="250" font-size="10" fill="#7a5a20" filter="url(#rough2)">dp[k][j]+dp[i−k][j]</text>

  <rect x="270" y="222" width="210" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="286" y="250" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">③b 竖切：枚举 k∈[1,j)</text>
  <text x="410" y="250" font-size="10" fill="#7a5a20" filter="url(#rough2)">dp[i][k]+dp[i][j−k]</text>

  <path d="M 145 272 Q 145 284 145 294" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 375 272 Q 375 284 375 294" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="298" width="440" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="326" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 取最大</text>
  <text x="150" y="326" font-size="11" fill="#333" filter="url(#rough2)">dp[i][j] = max(dp[i][j], 横切最优, 竖切最优)</text>

  <path d="M 260 348 Q 260 360 260 370" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="374" width="280" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 dp[m][n] ✓</text>

  <text x="500" y="174" font-size="10" fill="#446688" filter="url(#rough2)">i×j 升阶</text>
  <text x="500" y="326" font-size="10" fill="#b85450" filter="url(#rough2)">三选一</text>
</svg>
