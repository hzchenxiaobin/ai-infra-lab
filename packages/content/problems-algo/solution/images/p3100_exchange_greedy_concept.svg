<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：喝 → 换 → 喝 的循环，每轮净消耗 x−1 个空瓶</text>

  <!-- stage 1: full bottles -->
  <rect x="40" y="70" width="110" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="95" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n 瓶满水</text>
  <text x="95" y="110" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">全部喝光 → 答案 +n</text>

  <path d="M 152 96 C 175 96, 185 96, 205 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">喝！</text>

  <!-- stage 2: empty bottles -->
  <rect x="208" y="70" width="110" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="263" y="92" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">n 个空瓶</text>
  <text x="263" y="110" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">空瓶唯一的用途 = 交换</text>

  <!-- stage 3: exchange box -->
  <rect x="350" y="58" width="150" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">交换：交出 x 个空瓶</text>
  <text x="425" y="98" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">换回 1 瓶满水</text>
  <text x="425" y="116" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">阈值 x → x + 1 ⚠️</text>

  <path d="M 320 96 C 335 96, 335 96, 348 96" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="334" y="84" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">够 x 个?</text>

  <!-- loop back arrow: from exchange box bottom back to drink -->
  <path d="M 425 136 C 425 176, 95 176, 95 126" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">换回的 1 瓶立刻喝掉 → 答案 +1，空瓶 +1</text>

  <!-- net effect panel -->
  <rect x="40" y="200" width="440" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每一轮的净账本（以阈值 x 交换一次）</text>
  <text x="260" y="248" text-anchor="middle" font-size="11.5" fill="#3a5a2e" filter="url(#rough2)">空瓶：−x（交出） + 1（喝掉换回的） = 净减 (x − 1)</text>
  <text x="260" y="270" text-anchor="middle" font-size="11.5" fill="#3a5a2e" filter="url(#rough2)">答案：+1（换回的那瓶必被喝掉）</text>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">⇒ 总答案 = n + 交换次数 k，问题变成最大化 k</text>

  <!-- bottom note -->
  <rect x="40" y="312" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">为什么能换就换？推迟交换：空瓶不会变多，阈值不会变小</text>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⇒ 可行即交换，贪心最优（x=1 时净消耗 0，但阈值很快涨上去）</text>
</svg>
