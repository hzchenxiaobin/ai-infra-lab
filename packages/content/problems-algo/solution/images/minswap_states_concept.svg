<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两状态 DP：每个位置只有「不换 keep」与「换 swap」两种决策</text>

  <!-- ===== column headers: i-1 / i ===== -->
  <text x="130" y="60" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">位置 i−1</text>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">位置 i</text>

  <!-- ===== i-1 keep (top-left) ===== -->
  <rect x="60" y="86" width="140" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">keep[i−1]</text>
  <text x="130" y="128" text-anchor="middle" font-size="10.5" fill="#555">i−1 位保持原样</text>
  <text x="130" y="143" text-anchor="middle" font-size="10" fill="#888">行1: A[i−1] 行2: B[i−1]</text>

  <!-- ===== i-1 swap (bottom-left) ===== -->
  <rect x="60" y="226" width="140" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">swap[i−1]</text>
  <text x="130" y="268" text-anchor="middle" font-size="10.5" fill="#555">i−1 位做了交换</text>
  <text x="130" y="283" text-anchor="middle" font-size="10" fill="#888">行1: B[i−1] 行2: A[i−1]</text>

  <!-- ===== i keep (top-right) ===== -->
  <rect x="360" y="86" width="140" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">keep[i]</text>
  <text x="430" y="128" text-anchor="middle" font-size="10.5" fill="#555">i 位保持原样</text>
  <text x="430" y="143" text-anchor="middle" font-size="10" fill="#888">行1: A[i] 行2: B[i]</text>

  <!-- ===== i swap (bottom-right) ===== -->
  <rect x="360" y="226" width="140" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">swap[i]</text>
  <text x="430" y="268" text-anchor="middle" font-size="10.5" fill="#555">i 位做了交换（+1）</text>
  <text x="430" y="283" text-anchor="middle" font-size="10" fill="#888">行1: B[i] 行2: A[i]</text>

  <!-- ===== 4 transition arrows ===== -->
  <!-- keep[i-1] -> keep[i] : same, green -->
  <path d="M 200 110 Q 280 96 360 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">same ✓ → keep = keep[i−1]</text>

  <!-- keep[i-1] -> swap[i] : cross, orange -->
  <path d="M 200 134 Q 280 180 360 250" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="266" y="186" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">cross ✓ → swap = keep[i−1]+1</text>

  <!-- swap[i-1] -> keep[i] : cross, orange -->
  <path d="M 200 250 Q 280 180 360 134" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="294" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">cross ✓ → keep = swap[i−1]</text>

  <!-- swap[i-1] -> swap[i] : same, green -->
  <path d="M 200 264 Q 280 278 360 264" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">same ✓ → swap = swap[i−1]+1</text>

  <!-- ===== condition legend ===== -->
  <rect x="40" y="316" width="480" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="336" font-size="10.5" fill="#444" font-weight="bold">两个有效性条件（满足即可走对应边）：</text>
  <text x="60" y="354" font-size="10" fill="#4a7a3a">same：A[i−1]&lt;A[i] 且 B[i−1]&lt;B[i]（两边都不换 / 两边都换时各行递增）</text>
  <text x="60" y="368" font-size="10" fill="#d6a040">cross：A[i−1]&lt;B[i] 且 B[i−1]&lt;A[i]（只换其中一边时各行递增）</text>
</svg>
