<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：逐元素 countLE 差分 + 增量插入
  </text>

  <!-- Start -->
  <ellipse cx="270" cy="54" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M270,70 L270,84" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: init -->
  <rect x="150" y="88" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">空 Trie（节点含 child[2] + cnt）；ans = 0</text>
  <path d="M270,118 L270,132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 还有元素? -->
  <polygon points="270,136 350,162 270,188 190,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有元素?</text>

  <!-- no branch -> return -->
  <path d="M350,162 L408,162" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="155" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="412" y="146" width="108" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="466" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return ans</text>

  <!-- yes branch -->
  <path d="M270,188 L270,202" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="198" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Step: take next x -->
  <rect x="180" y="206" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取下一个 x = nums[j]</text>
  <path d="M270,234 L270,246" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: countLE diff (先查) -->
  <rect x="70" y="250" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">ans += countLE(x, high) − countLE(x, low−1)</text>
  <text x="270" y="280" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">先查：Trie 中只含 nums[0..j−1]，保证 i &lt; j</text>
  <path d="M270,284 L270,296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: insert (后插) -->
  <rect x="120" y="300" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">insert(x)：沿路径每个节点 cnt++</text>
  <text x="425" y="318" font-size="9" fill="#d6a040" filter="url(#rough2)">后插</text>

  <!-- countLE sub-box (right side) -->
  <rect x="372" y="240" width="160" height="92" fill="#fafafa" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="452" y="256" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">countLE(x, limit)</text>
  <line x1="382" y1="262" x2="522" y2="262" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="276" font-size="9" fill="#333" filter="url(#rough2)">l_b=1:</text>
  <text x="430" y="276" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+child[x_b].cnt</text>
  <text x="430" y="288" font-size="9" fill="#d6a040" filter="url(#rough2)">下钻 child[1−x_b]</text>
  <text x="380" y="302" font-size="9" fill="#333" filter="url(#rough2)">l_b=0:</text>
  <text x="430" y="302" font-size="9" fill="#d6a040" filter="url(#rough2)">下钻 child[x_b]</text>
  <text x="430" y="314" font-size="9" fill="#888" filter="url(#rough2)">末位 +cur.cnt</text>
  <text x="452" y="326" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">O(log max)</text>

  <!-- loop back from insert up to diamond -->
  <path d="M120,315 L60,315 L60,162 L190,162" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- complexity footnote -->
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    每元素：2 次 countLE + 1 次 insert，各 O(log max)
  </text>
  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    总时间 O(n · log max)，总空间 O(n · log max)
  </text>
  <text x="270" y="400" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    n ≤ 2×10⁴，log max = 15（因 nums[i], high &lt; 2¹⁵）
  </text>
  <text x="270" y="418" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    绿=查询（先）；橙=插入（后）；红框=countLE 子流程
  </text>
</svg>
