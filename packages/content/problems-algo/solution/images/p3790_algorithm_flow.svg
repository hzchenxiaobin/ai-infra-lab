<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 545"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="545" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">余数递推：鸽笼原理保证至多 k 步出结果</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="228" y="38" width="104" height="32" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="59" text-anchor="middle" font-size="13" fill="#8a6d1a">输入 k</text>
  </g>
  <path d="M 280 70 L 280 92" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判无解 -->
  <g filter="url(#rough2)">
    <polygon points="280,92 395,130 280,168 165,130" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="126" text-anchor="middle" font-size="12" fill="#33506b">k%2==0 或</text>
    <text x="280" y="143" text-anchor="middle" font-size="12" fill="#33506b">k%5==0 ?</text>
  </g>
  <path d="M 395 130 L 446 130" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="121" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="450" y="114" width="92" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="496" y="135" text-anchor="middle" font-size="13" fill="#8a3030">返回 -1</text>
  </g>
  <path d="M 280 168 L 280 193" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="185" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="200" y="197" width="160" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="218" text-anchor="middle" font-size="13" fill="#33506b">r = 0 , L = 0</text>
  </g>
  <path d="M 280 229 L 280 254" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递推 -->
  <g filter="url(#rough2)">
    <rect x="178" y="258" width="204" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="276" text-anchor="middle" font-size="12.5" fill="#8a6d1a">L ← L + 1</text>
    <text x="280" y="294" text-anchor="middle" font-size="12.5" fill="#8a6d1a">r ← (r × 10 + 1) mod k</text>
  </g>
  <path d="M 280 302 L 280 326" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 命中判断 -->
  <g filter="url(#rough2)">
    <polygon points="280,326 382,362 280,398 178,362" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="367" text-anchor="middle" font-size="13" fill="#33506b">r == 0 ?</text>
  </g>
  <path d="M 382 362 L 446 362" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="353" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="450" y="346" width="92" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="496" y="367" text-anchor="middle" font-size="13" fill="#2f5d24">返回 L ✓</text>
  </g>
  <path d="M 280 398 L 280 424" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="416" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 上界判断 -->
  <g filter="url(#rough2)">
    <polygon points="280,424 385,460 280,496 175,460" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="465" text-anchor="middle" font-size="13" fill="#33506b">L &lt; k ?</text>
  </g>
  <path d="M 175 460 L 110 460 L 110 280 L 174 280" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="450" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">是</text>
  <text x="100" y="380" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">继续追加一个 1</text>
  <path d="M 280 496 L 280 508" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="293" y="508" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="234" y="512" width="92" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="280" y="532" text-anchor="middle" font-size="13" fill="#8a3030">返回 -1</text>
  </g>
</svg>
