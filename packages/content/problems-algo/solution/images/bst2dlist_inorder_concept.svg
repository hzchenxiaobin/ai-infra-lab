<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：BST 的中序遍历天然有序</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">把中序访问顺序串成双向链表即得升序链表</text>

  <!-- ===== BST ===== -->
  <text x="100" y="78" font-size="12" fill="#444" font-weight="bold">原 BST</text>
  <g font-size="13">
    <!-- root 4 -->
    <circle cx="100" cy="110" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="100" y="115" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <!-- left 2 -->
    <line x1="92" y1="124" x2="60" y2="156" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="56" cy="166" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="56" y="171" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <!-- right 5 -->
    <line x1="108" y1="124" x2="140" y2="156" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="144" cy="166" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="144" y="171" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <!-- 1 (left of 2) -->
    <line x1="48" y1="180" x2="24" y2="212" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="20" cy="222" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="20" y="227" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <!-- 3 (right of 2) -->
    <line x1="64" y1="180" x2="88" y2="212" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <circle cx="92" cy="222" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="92" y="227" text-anchor="middle" fill="#333" font-weight="bold">3</text>
  </g>
  <!-- 中序访问编号 -->
  <text x="20" y="252" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">①</text>
  <text x="56" y="200" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">②</text>
  <text x="92" y="252" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">③</text>
  <text x="100" y="92" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">④</text>
  <text x="144" y="194" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">⑤</text>

  <!-- ===== 中序序列 ===== -->
  <text x="270" y="110" font-size="11" fill="#446688" font-weight="bold">中序遍历</text>
  <path d="M 180 166 Q 230 166 270 166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="158" text-anchor="middle" font-size="10" fill="#446688">in-order</text>

  <g font-size="12">
    <rect x="270" y="150" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="287" y="170" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="304" y1="165" x2="316" y2="165" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="322" y="150" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="339" y="170" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="356" y1="165" x2="368" y2="165" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="374" y="150" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="391" y="170" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="408" y1="165" x2="420" y2="165" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="426" y="150" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="443" y="170" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="460" y1="165" x2="472" y2="165" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="478" y="150" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="495" y="170" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>
  <text x="287" y="198" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">head</text>

  <!-- ===== 循环双向链表 ===== -->
  <text x="270" y="246" font-size="11" fill="#446688" font-weight="bold">串成循环双向链表</text>
  <path d="M 455 184 Q 460 220 290 232" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g font-size="12">
    <!-- 1 -->
    <rect x="60" y="266" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="82" y="287" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <!-- 2 -->
    <line x1="104" y1="282" x2="122" y2="282" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <line x1="122" y1="288" x2="104" y2="288" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="128" y="266" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="150" y="287" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <!-- 3 -->
    <line x1="172" y1="282" x2="190" y2="282" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <line x1="190" y1="288" x2="172" y2="288" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="196" y="266" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="218" y="287" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <!-- 4 -->
    <line x1="240" y1="282" x2="258" y2="282" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <line x1="258" y1="288" x2="240" y2="288" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="264" y="266" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
    <text x="286" y="287" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <!-- 5 -->
    <line x1="308" y1="282" x2="326" y2="282" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <line x1="326" y1="288" x2="308" y2="288" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="332" y="266" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
    <text x="354" y="287" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>
  <text x="82" y="260" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">head</text>
  <text x="354" y="260" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">last</text>

  <!-- 循环回环箭头：5 -> 1 -->
  <path d="M 354 298 Q 354 340 220 340 Q 82 340 82 300" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="335" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">last.right = head</text>
  <text x="218" y="350" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">head.left = last</text>

  <!-- ===== 关键 ===== -->
  <rect x="30" y="366" width="520" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="386" font-size="11" fill="#446688" font-weight="bold">核心：BST 中序遍历 = 升序序列</text>
  <text x="44" y="404" font-size="10" fill="#555">中序访问时维护 prev（上一访问节点），把 prev 与当前节点 curr 互连：</text>
  <text x="44" y="420" font-size="10" fill="#d6a040" font-weight="bold">prev.right = curr　|　curr.left = prev　|　遍历完首尾互连成环</text>
</svg>
