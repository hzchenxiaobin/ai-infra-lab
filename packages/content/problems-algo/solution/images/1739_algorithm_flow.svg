<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两次二分查找 → 拼接答案</text>

  <!-- ===== Step 1: Input ===== -->
  <g filter="url(#rough2)">
    <rect x="210" y="44" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="18"/>
    <text x="280" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 n 个盒子</text>
  </g>

  <path d="M 280 84 L 280 104" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Binary search for m ===== -->
  <g filter="url(#rough2)">
    <rect x="140" y="110" width="280" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第一次二分：找最大 m</text>
    <text x="280" y="150" text-anchor="middle" font-size="10" fill="#555">条件: m(m+1)(m+2)/6 ≤ n</text>
    <text x="280" y="168" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">范围 [0, 2000]，向上取整模板</text>
  </g>

  <path d="M 280 184 L 280 204" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Calculate r ===== -->
  <g filter="url(#rough2)">
    <rect x="180" y="210" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="280" y="230" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">计算残余 r = n − T(m)</text>
    <text x="280" y="250" text-anchor="middle" font-size="10" fill="#555">T(m) = m(m+1)(m+2)/6</text>
  </g>

  <!-- Branch: r=0 vs r>0 -->
  <path d="M 280 270 L 280 284" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- Diamond decision -->
  <g filter="url(#rough2)">
    <polygon points="280,284 330,310 280,336 230,310" fill="#fafafa" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">r = 0?</text>
  </g>

  <!-- r=0 path (left) -->
  <path d="M 230 310 L 100 310 L 100 360" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="302" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="40" y="366" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="100" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">直接返回</text>
    <text x="100" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">m(m+1)/2</text>
  </g>

  <!-- r>0 path (right) -->
  <path d="M 330 310 L 460 310 L 460 360" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="420" y="302" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ===== Step 4: Binary search for k ===== -->
  <g filter="url(#rough2)">
    <rect x="340" y="366" width="200" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="440" y="388" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第二次二分：找最小 k</text>
    <text x="440" y="406" text-anchor="middle" font-size="10" fill="#555">条件: k(k+1)/2 ≥ r</text>
    <text x="440" y="424" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">范围 [0, 2000]，向下取整模板</text>
  </g>

  <!-- Converge arrows -->
  <path d="M 440 440 L 440 460 L 320 460 L 320 470" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 420 L 100 460 L 240 460 L 240 470" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: Return answer ===== -->
  <g filter="url(#rough2)">
    <rect x="180" y="476" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="18"/>
    <text x="280" y="499" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 m(m+1)/2 + k</text>
  </g>

  <!-- Side notes -->
  <rect x="40" y="110" width="80" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="80" y="128" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">找最大满足</text>
  <text x="80" y="142" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">≤ 的 m</text>

  <rect x="440" y="366" width="80" height="0" fill="none"/>
  <rect x="440" y="440" width="100" height="0" fill="none"/>

  <rect x="350" y="210" width="80" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="390" y="228" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">C++ 注意</text>
  <text x="390" y="242" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">用 long long</text>
</svg>
