<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">奇数位回文生成：root 翻转镜像（去掉末位再拼接）</text>

  <text x="40" y="64" font-size="12" fill="#888">root = 123</text>

  <rect x="80" y="74" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="74" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="74" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <text x="105" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">保留</text>
  <text x="155" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">保留</text>
  <text x="205" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">中点</text>

  <path d="M 155 140 Q 120 165 95 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 105 140 Q 70 165 55 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="100" y="170" font-size="11" fill="#b85450" font-weight="bold">翻转前半（去掉末位）</text>

  <text x="40" y="204" font-size="12" fill="#888">回文 = 12321</text>

  <rect x="80" y="214" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="237" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="214" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="237" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="214" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="237" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="230" y="214" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="237" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="280" y="214" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="237" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <text x="155" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">root 原样</text>
  <text x="305" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">root 前半翻转</text>

  <line x1="40" y1="290" x2="520" y2="290" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">更多示例</text>

  <rect x="40" y="324" width="480" height="80" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>

  <text x="60" y="346" font-size="11" fill="#888">root=1</text>
  <text x="120" y="346" font-size="11" fill="#333" font-weight="bold">→ 1</text>
  <text x="60" y="366" font-size="11" fill="#888">root=10</text>
  <text x="120" y="366" font-size="11" fill="#333" font-weight="bold">→ 101</text>
  <text x="60" y="386" font-size="11" fill="#888">root=123</text>
  <text x="120" y="386" font-size="11" fill="#333" font-weight="bold">→ 12321</text>

  <text x="260" y="346" font-size="11" fill="#888">root=5</text>
  <text x="320" y="346" font-size="11" fill="#333" font-weight="bold">→ 5</text>
  <text x="260" y="366" font-size="11" fill="#888">root=12</text>
  <text x="320" y="366" font-size="11" fill="#333" font-weight="bold">→ 121</text>
  <text x="260" y="386" font-size="11" fill="#888">root=1000</text>
  <text x="320" y="386" font-size="11" fill="#333" font-weight="bold">→ 10000001</text>

  <text x="420" y="366" font-size="10" fill="#4a7a3a" font-weight="bold">公式：</text>
  <text x="420" y="382" font-size="10" fill="#444" font-family="monospace">s + s[:-1][::-1]</text>
</svg>
