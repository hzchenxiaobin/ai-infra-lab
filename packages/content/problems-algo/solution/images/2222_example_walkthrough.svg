<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "001101"</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">total0 = 3, total1 = 3  ——  逐位置贡献累加</text>

  <!-- ===== String row ===== -->
  <text x="28" y="72" font-size="10.5" fill="#666">下标</text>
  <text x="78" y="68" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="118" y="68" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="158" y="68" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="198" y="68" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="238" y="68" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="278" y="68" text-anchor="middle" font-size="9" fill="#888">5</text>

  <text x="28" y="88" font-size="10.5" fill="#666">s</text>
  <!-- value boxes -->
  <rect x="58" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="98" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="138" y="72" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="178" y="72" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="218" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="258" y="72" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- ===== Step table ===== -->
  <text x="28" y="128" font-size="11" fill="#444" font-weight="bold">逐位置贡献</text>

  <!-- header -->
  <rect x="40" y="134" width="380" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="149" font-size="9.5" fill="#555" font-weight="bold">j</text>
  <text x="98" y="149" font-size="9.5" fill="#555" font-weight="bold">s[j]</text>
  <text x="140" y="149" font-size="9.5" fill="#555" font-weight="bold">形态</text>
  <text x="196" y="149" font-size="9.5" fill="#555" font-weight="bold">左 × 右</text>
  <text x="280" y="149" font-size="9.5" fill="#555" font-weight="bold">贡献</text>
  <text x="356" y="149" font-size="9.5" fill="#555" font-weight="bold">ans</text>

  <!-- row 1: j=0, s=0, 101, 0×3, 0, 0 -->
  <rect x="40" y="158" width="380" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="172" font-size="10" fill="#333">0</text>
  <text x="98" y="172" font-size="10" fill="#333">0</text>
  <text x="140" y="172" font-size="10" fill="#b85450">101</text>
  <text x="196" y="172" font-size="10" fill="#555">0 × 3</text>
  <text x="280" y="172" font-size="10" fill="#333">0</text>
  <text x="356" y="172" font-size="10" fill="#333" font-weight="bold">0</text>

  <!-- row 2: j=1, s=0, 101, 0×3, 0, 0 -->
  <rect x="40" y="180" width="380" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="194" font-size="10" fill="#333">1</text>
  <text x="98" y="194" font-size="10" fill="#333">0</text>
  <text x="140" y="194" font-size="10" fill="#b85450">101</text>
  <text x="196" y="194" font-size="10" fill="#555">0 × 3</text>
  <text x="280" y="194" font-size="10" fill="#333">0</text>
  <text x="356" y="194" font-size="10" fill="#333" font-weight="bold">0</text>

  <!-- row 3: j=2, s=1, 010, 2×1, 2, 2 (highlight) -->
  <rect x="40" y="202" width="380" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="58" y="216" font-size="10" fill="#333">2</text>
  <text x="98" y="216" font-size="10" fill="#333">1</text>
  <text x="140" y="216" font-size="10" fill="#446688" font-weight="bold">010</text>
  <text x="196" y="216" font-size="10" fill="#446688" font-weight="bold">2 × 1</text>
  <text x="280" y="216" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="356" y="216" font-size="10" fill="#333" font-weight="bold">2</text>

  <!-- row 4: j=3, s=1, 010, 2×1, 2, 4 (highlight) -->
  <rect x="40" y="224" width="380" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="58" y="238" font-size="10" fill="#333">3</text>
  <text x="98" y="238" font-size="10" fill="#333">1</text>
  <text x="140" y="238" font-size="10" fill="#446688" font-weight="bold">010</text>
  <text x="196" y="238" font-size="10" fill="#446688" font-weight="bold">2 × 1</text>
  <text x="280" y="238" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="356" y="238" font-size="10" fill="#333" font-weight="bold">4</text>

  <!-- row 5: j=4, s=0, 101, 2×1, 2, 6 (highlight green) -->
  <rect x="40" y="246" width="380" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="58" y="260" font-size="10" fill="#333">4</text>
  <text x="98" y="260" font-size="10" fill="#333">0</text>
  <text x="140" y="260" font-size="10" fill="#b85450" font-weight="bold">101</text>
  <text x="196" y="260" font-size="10" fill="#4a7a3a" font-weight="bold">2 × 1</text>
  <text x="280" y="260" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="356" y="260" font-size="10" fill="#333" font-weight="bold">6</text>

  <!-- row 6: j=5, s=1, 010, 3×0, 0, 6 -->
  <rect x="40" y="268" width="380" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="282" font-size="10" fill="#333">5</text>
  <text x="98" y="282" font-size="10" fill="#333">1</text>
  <text x="140" y="282" font-size="10" fill="#446688">010</text>
  <text x="196" y="282" font-size="10" fill="#555">3 × 0</text>
  <text x="280" y="282" font-size="10" fill="#333">0</text>
  <text x="356" y="282" font-size="10" fill="#333" font-weight="bold">6</text>

  <!-- ===== Visual: j=2 as middle, 010 pattern ===== -->
  <text x="28" y="316" font-size="11" fill="#444" font-weight="bold">图解 j=2（形态 010）：左 2 个 0 × 右 1 个 0 = 2</text>

  <!-- left 0s highlighted -->
  <rect x="44" y="328" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="348" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="88" y="328" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="348" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="108" y="372" text-anchor="middle" font-size="9.5" fill="#446688">左侧 pre0 = 2</text>

  <!-- middle 1 -->
  <rect x="132" y="326" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="153" y="348" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="153" y="372" text-anchor="middle" font-size="9.5" fill="#d6a040">中间 j=2</text>

  <!-- right 0s highlighted -->
  <rect x="188" y="328" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="348" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="232" y="328" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="348" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="208" y="372" text-anchor="middle" font-size="9.5" fill="#446688">右侧 suf0 = 1</text>

  <!-- multiply -->
  <text x="120" y="348" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">×</text>
  <text x="180" y="348" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">×</text>

  <!-- result -->
  <path d="M 153 380 L 153 398" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="402" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="170" y="422" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">贡献 = 2 × 1 = 2</text>

  <!-- ===== Right note box ===== -->
  <rect x="300" y="316" width="240" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="336" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">关键点</text>
  <text x="316" y="354" font-size="9.5" fill="#555">• 先贡献后更新：pre 只含左侧</text>
  <text x="316" y="370" font-size="9.5" fill="#555">• suf = total − pre（中间异类）</text>
  <text x="316" y="386" font-size="9.5" fill="#555">• j=0,1 左侧无 1 → 贡献 0</text>
  <text x="316" y="402" font-size="9.5" fill="#555">• j=5 右侧无 0 → 贡献 0</text>
  <text x="316" y="418" font-size="9.5" fill="#4a7a3a" font-weight="bold">  总和 = 0+0+2+2+2+0 = 6 ✓</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="436" width="480" height="0" fill="none"/>
</svg>
