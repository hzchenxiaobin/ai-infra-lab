<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">什么是「好子序列」？——相邻不同对不超过 k</text>

  <rect x="424" y="40" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="463" y="54" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">预算</text>
  <text x="463" y="70" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k = 2</text>

  <text x="200" y="46" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">选出下标 0,1,2,3</text>
  <rect x="102" y="51" width="196" height="50" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="8" filter="url(#rough2)"/>

  <text x="56" y="80" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">nums</text>

  <rect x="108" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>

  <rect x="156" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="176" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>

  <rect x="204" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="224" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <rect x="252" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="272" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>

  <rect x="300" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="320" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <path d="M 200 104 L 200 130" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="214" y="122" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">抽出子序列</text>

  <text x="56" y="160" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">seq</text>

  <rect x="108" y="138" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <rect x="156" y="138" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="176" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <rect x="204" y="138" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="224" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <rect x="252" y="138" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="272" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <circle cx="152" cy="192" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="197" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="152" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">花 1 枪</text>

  <circle cx="200" cy="192" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="197" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="200" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">花 1 枪</text>

  <circle cx="248" cy="192" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="197" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="248" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">免费</text>

  <rect x="70" y="230" width="380" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">相邻不同对 = 2 ≤ k = 2 → 好子序列，长度 = 4</text>

  <rect x="30" y="282" width="460" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">反例：seq = [1,2,1,3]（下标 0,1,2,4）</text>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">相邻不同对 = 3 &gt; k = 2 → 超预算，长度同为 4 却不是好子序列</text>
</svg>
