<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：链表 1→2→3→4→5（一次可能的随机结果）</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="500" height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="58" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">步骤</text>
  <text x="140" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cur.val</text>
  <text x="220" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="300" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">替换 1/i</text>
  <text x="400" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">随机判定</text>
  <text x="490" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">蓄水池</text>

  <!-- 列分隔线 -->
  <line x1="90" y1="44" x2="90" y2="262" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="44" x2="180" y2="262" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="44" x2="260" y2="262" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="44" x2="350" y2="262" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="450" y1="44" x2="450" y2="262" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 ①  val=1, i=1, 100% 选中 -->
  <rect x="30" y="76" width="500" height="34" fill="#fff" stroke="none" filter="url(#rough2)"/>
  <text x="58" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">①</text>
  <rect x="122" y="80" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="98" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="220" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="300" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1/1 = 100%</text>
  <text x="400" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">必选 reservoir=1</text>
  <rect x="468" y="80" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 行 ②  val=2, i=2, 1/2 替换 -->
  <rect x="30" y="110" width="500" height="34" fill="#f6f8fb" stroke="none" filter="url(#rough2)"/>
  <text x="58" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">②</text>
  <rect x="122" y="114" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="220" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="300" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1/2 = 50%</text>
  <text x="400" y="132" text-anchor="middle" font-size="11" fill="#d6a040">%2==0 → 替换</text>
  <rect x="468" y="114" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- 行 ③  val=3, i=3, 1/3 不替换 -->
  <rect x="30" y="144" width="500" height="34" fill="#fff" stroke="none" filter="url(#rough2)"/>
  <text x="58" y="166" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">③</text>
  <rect x="122" y="148" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="220" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="300" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1/3 ≈ 33%</text>
  <text x="400" y="166" text-anchor="middle" font-size="11" fill="#888">%3==1 → 保持</text>
  <rect x="468" y="148" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="490" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- 行 ④  val=4, i=4, 1/4 替换 -->
  <rect x="30" y="178" width="500" height="34" fill="#f6f8fb" stroke="none" filter="url(#rough2)"/>
  <text x="58" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">④</text>
  <rect x="122" y="182" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="220" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <text x="300" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1/4 = 25%</text>
  <text x="400" y="200" text-anchor="middle" font-size="11" fill="#d6a040">%4==0 → 替换</text>
  <rect x="468" y="182" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="200" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>

  <!-- 行 ⑤  val=5, i=5, 1/5 不替换 -->
  <rect x="30" y="212" width="500" height="34" fill="#fff" stroke="none" filter="url(#rough2)"/>
  <text x="58" y="234" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">⑤</text>
  <rect x="122" y="216" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="220" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <text x="300" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1/5 = 20%</text>
  <text x="400" y="234" text-anchor="middle" font-size="11" fill="#888">%5==2 → 保持</text>
  <rect x="468" y="216" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="490" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>

  <!-- 表底框 -->
  <rect x="30" y="44" width="500" height="202" fill="none" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <!-- 概率校验 -->
  <rect x="30" y="262" width="500" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="11" fill="#4a7a3a" font-weight="bold">概率校验（n=5，每个节点应 = 1/5）：望远镜积 ∏(k−1)/k = j/n</text>
  <text x="50" y="300" font-size="10.5" fill="#555">val=1: (1/1)·(1/2·2/3·3/4·4/5) = 1·(1/5) = 1/5 ✅    val=2: (1/2)·(2/3·3/4·4/5) = (1/2)·(2/5) = 1/5 ✅</text>
  <text x="50" y="318" font-size="10.5" fill="#555">val=3: (1/3)·(3/4·4/5) = (1/3)·(3/5) = 1/5 ✅    val=4: (1/4)·(4/5) = 1/5 ✅    val=5: (1/5) = 1/5 ✅</text>
  <text x="50" y="334" font-size="10" fill="#888">第 j 个节点幸存 = (1/j)·∏_{k=j+1}^{n}(k−1)/k = (1/j)·(j/n) = 1/n，与 j 无关 → 严格等概率</text>
</svg>
