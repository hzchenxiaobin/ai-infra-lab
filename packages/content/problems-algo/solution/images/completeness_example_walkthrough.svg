<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,2,3,4,5,null,7] → false</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">BFS 含 null 入队，第 7 步在 null 后遇到非 null 节点 7</text>

  <!-- 表头 -->
  <g font-size="11" font-weight="bold">
    <rect x="30" y="60" width="60" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="76" text-anchor="middle" fill="#446688">步</text>
    <rect x="90" y="60" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="125" y="76" text-anchor="middle" fill="#446688">出队 node</text>
    <rect x="160" y="60" width="90" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="205" y="76" text-anchor="middle" fill="#446688">seenNull</text>
    <rect x="250" y="60" width="320" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="410" y="76" text-anchor="middle" fill="#446688">出队后队列</text>
  </g>

  <!-- 行 1 -->
  <g font-size="11">
    <text x="60" y="104" text-anchor="middle" fill="#555">1</text>
    <text x="125" y="104" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="205" y="104" text-anchor="middle" fill="#4a7a3a">false</text>
    <rect x="270" y="92" width="20" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="280" y="105" text-anchor="middle" font-size="10" fill="#446688">2</text>
    <rect x="292" y="92" width="20" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="302" y="105" text-anchor="middle" font-size="10" fill="#446688">3</text>
  </g>

  <!-- 行 2 -->
  <g font-size="11">
    <text x="60" y="130" text-anchor="middle" fill="#555">2</text>
    <text x="125" y="130" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="205" y="130" text-anchor="middle" fill="#4a7a3a">false</text>
    <rect x="270" y="118" width="20" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="280" y="131" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <rect x="292" y="118" width="20" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="302" y="131" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
    <rect x="314" y="118" width="20" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="324" y="131" text-anchor="middle" font-size="10" fill="#4a7a3a">5</text>
  </g>

  <!-- 行 3 -->
  <g font-size="11">
    <text x="60" y="156" text-anchor="middle" fill="#555">3</text>
    <text x="125" y="156" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="205" y="156" text-anchor="middle" fill="#4a7a3a">false</text>
    <rect x="270" y="144" width="20" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="280" y="157" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
    <rect x="292" y="144" width="20" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="302" y="157" text-anchor="middle" font-size="10" fill="#4a7a3a">5</text>
    <rect x="314" y="144" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="324" y="157" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
    <rect x="336" y="144" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="346" y="157" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>
  </g>

  <!-- 行 4 -->
  <g font-size="11">
    <text x="60" y="182" text-anchor="middle" fill="#555">4</text>
    <text x="125" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="205" y="182" text-anchor="middle" fill="#4a7a3a">false</text>
    <rect x="270" y="170" width="20" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="280" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a">5</text>
    <rect x="292" y="170" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="302" y="183" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
    <rect x="314" y="170" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="324" y="183" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>
    <rect x="336" y="170" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="346" y="183" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
    <rect x="358" y="170" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="368" y="183" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
  </g>

  <!-- 行 5 -->
  <g font-size="11">
    <text x="60" y="208" text-anchor="middle" fill="#555">5</text>
    <text x="125" y="208" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="205" y="208" text-anchor="middle" fill="#4a7a3a">false</text>
    <rect x="270" y="196" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="280" y="209" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
    <rect x="292" y="196" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="302" y="209" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>
    <rect x="314" y="196" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="324" y="209" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
    <rect x="336" y="196" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="346" y="209" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
    <rect x="358" y="196" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="368" y="209" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
    <rect x="380" y="196" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="390" y="209" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
  </g>

  <!-- 行 6: 出队 null -> seenNull=true（关键转折，用橙底高亮） -->
  <rect x="28" y="224" width="544" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)" opacity="0.5"/>
  <g font-size="11">
    <text x="60" y="243" text-anchor="middle" fill="#7a5a20" font-weight="bold">6</text>
    <text x="125" y="243" text-anchor="middle" fill="#aaa">∅</text>
    <text x="205" y="243" text-anchor="middle" fill="#d6a040" font-weight="bold">true ⭐</text>
    <rect x="270" y="231" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="280" y="244" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">7</text>
    <rect x="292" y="231" width="20" height="18" rx="3" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="302" y="244" text-anchor="middle" font-size="9" fill="#aaa">∅</text>
    <text x="320" y="244" font-size="10" fill="#aaa">…</text>
  </g>

  <!-- 行 7: 出队 7 -> seenNull 已 true -> return false（红底高亮） -->
  <rect x="28" y="258" width="544" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)" opacity="0.55"/>
  <g font-size="11">
    <text x="60" y="277" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
    <text x="125" y="277" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <text x="205" y="277" text-anchor="middle" fill="#b85450" font-weight="bold">true</text>
  </g>
  <line x1="146" y1="271" x2="250" y2="271" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">seenNull 已 true 又遇非 null → return false ✗</text>

  <!-- 底部说明 -->
  <rect x="30" y="316" width="540" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">对比：完全二叉树 [1,2,3,4,5,6]</text>
  <text x="46" y="360" font-size="11" fill="#3a5a2a">· 层序序列：1,2,3,4,5,6,∅,∅,…</text>
  <text x="46" y="378" font-size="11" fill="#3a5a2a">· 第 6 步首次出队 null，seenNull=true；之后队列里只剩 null，循环正常结束</text>
  <text x="46" y="394" font-size="11" fill="#3a5a3a" font-weight="bold">· return true ✓（实节点全在 null 之前）</text>
</svg>
