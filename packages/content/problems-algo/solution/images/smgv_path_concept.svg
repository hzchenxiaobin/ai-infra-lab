<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：只有「含值 1 的路径」上节点答案才 &gt; 1</text>

  <!-- 树边 -->
  <line x1="268" y1="78" x2="184" y2="138" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="292" y1="78" x2="372" y2="138" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="160" y1="162" x2="128" y2="218" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="368" y1="162" x2="332" y2="218" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="392" y1="162" x2="418" y2="218" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 节点 0 (路径, ans=7) -->
  <circle cx="280" cy="68" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="304" y="60" font-size="10" fill="#d6a040" font-weight="bold">ans=7</text>

  <!-- 节点 1 (非路径, ans=1) -->
  <circle cx="172" cy="150" r="15" fill="#eeeeee" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="154" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="195" y="146" font-size="10" fill="#999" font-weight="bold">ans=1</text>

  <!-- 节点 3 (路径, ans=4) -->
  <circle cx="380" cy="150" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="402" y="146" font-size="10" fill="#d6a040" font-weight="bold">ans=4</text>

  <!-- 节点 2 (非路径, ans=1) -->
  <circle cx="122" cy="230" r="13" fill="#eeeeee" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="122" y="234" text-anchor="middle" font-size="10" fill="#666">6</text>
  <text x="140" y="226" font-size="9" fill="#999" font-weight="bold">ans=1</text>

  <!-- 节点 4 (node1, 值1, 路径起点, ans=2) -->
  <circle cx="322" cy="230" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="322" y="234" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="342" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">ans=2</text>
  <text x="322" y="256" text-anchor="middle" font-size="9" fill="#4a7a3a">↑ 值 1 在此</text>

  <!-- 节点 5 (非路径, ans=1) -->
  <circle cx="428" cy="230" r="13" fill="#eeeeee" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="428" y="234" text-anchor="middle" font-size="10" fill="#666">3</text>
  <text x="446" y="226" font-size="9" fill="#999" font-weight="bold">ans=1</text>

  <!-- 路径方向标注 -->
  <text x="350" y="198" font-size="9" fill="#d6a040" font-weight="bold">↑路径</text>

  <!-- 说明框 -->
  <rect x="40" y="282" width="480" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键洞察</text>
  <text x="58" y="325" font-size="11" fill="#555">• 基因值互不相同 → 值 1 全树唯一，只出现在一个节点（node1）</text>
  <text x="58" y="343" font-size="11" fill="#555">• 子树不含 1 → 缺失最小值就是 1（灰色节点，绝大多数）</text>
  <text x="58" y="361" font-size="11" fill="#d6a040">• 只有 node1→根 这条路径上的节点子树才含 1，需逐个算 mex</text>
  <text x="58" y="378" font-size="11" fill="#4a7a3a">• 绿色 node1 是起点；橙色路径边即「待计算」节点</text>
</svg>
