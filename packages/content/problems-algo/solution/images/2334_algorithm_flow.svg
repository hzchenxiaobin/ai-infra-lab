  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 700" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="700" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">元素值大于变化阈值的子数组：单调栈两遍扫描流程</text>

  <!-- Start -->
  <ellipse cx="290" cy="60" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333">开始: ans = 0</text>

  <path d="M 290 80 L 290 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 1: left scan -->
  <rect x="90" y="100" width="400" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Pass 1：左扫描 i = 0 → n−1</text>
  <text x="290" y="138" text-anchor="middle" font-size="11" fill="#666">值递增栈，弹出所有 ≥ nums[i]；栈顶 = left[i]（空则 −1），入栈 i</text>

  <path d="M 290 150 L 290 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 2: right scan -->
  <rect x="90" y="170" width="400" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Pass 2：右扫描 i = n−1 → 0</text>
  <text x="290" y="208" text-anchor="middle" font-size="11" fill="#666">同理弹出 ≥ nums[i]；栈顶 = right[i]（空则 n），入栈 i</text>

  <path d="M 290 220 L 290 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="290,242 390,288 290,334 190,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="284" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="290" y="300" text-anchor="middle" font-size="10" fill="#888">(遍历判定)</text>

  <!-- i<n : No -> right then down to terminal box -->
  <path d="M 390 288 L 490 288 L 490 620 L 402 620" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="280" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- i<n : Yes -> down -->
  <path d="M 290 334 L 290 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="348" font-size="11" fill="#82b366">是</text>

  <!-- Process: len = right[i] - left[i] - 1 -->
  <rect x="110" y="354" width="360" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="12" fill="#333">len = right[i] − left[i] − 1   (最宽区间长度)</text>

  <path d="M 290 390 L 290 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: nums[i] * len > threshold ? -->
  <polygon points="290,412 410,458 290,504 170,458" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="450" text-anchor="middle" font-size="12" fill="#333">(long long)nums[i]</text>
  <text x="290" y="468" text-anchor="middle" font-size="12" fill="#333">× len &gt; threshold ?</text>

  <!-- Yes -> ans = max box (left) -->
  <path d="M 170 458 L 106 458" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="450" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="8" y="438" width="98" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="57" y="455" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans =</text>
  <text x="57" y="470" text-anchor="middle" font-size="10" fill="#333">max(ans, len)</text>

  <!-- No -> down to merge bus -->
  <path d="M 290 504 L 290 540" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="302" y="524" font-size="11" fill="#b85450">否</text>

  <!-- ans-max box feeds merge bus -->
  <path d="M 57 478 L 57 540" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- merge bus: collects Yes(ans=max)/No(skip) branches -->
  <path d="M 8 540 L 290 540" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="57" cy="540" r="2.5" fill="#666"/>
  <circle cx="290" cy="540" r="2.5" fill="#666"/>

  <!-- loopback: up far-left then right into i<n diamond left vertex -->
  <path d="M 8 540 L 8 288 L 188 288" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="8" y="415" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 8 415)">i++ 继续遍历</text>

  <!-- terminal box: return ans / -1 -->
  <rect x="180" y="595" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="615" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束判定</text>
  <text x="290" y="634" text-anchor="middle" font-size="11" fill="#666">返回 ans &gt; 0 ? ans : −1</text>

  <!-- bottom note -->
  <rect x="40" y="660" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="676" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">两遍扫描各 O(n)，判定 O(n)；时间 O(n)，空间 O(n)；乘法升 64 位防溢出；弹栈用 ≥（严格更小划界）</text>
</svg>
