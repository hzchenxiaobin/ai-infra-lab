<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,3 L8,3" fill="none" stroke="#446688" stroke-width="1.5"/>
      <path d="M6,0 L9,3 L6,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每格放 min(行剩余, 列剩余)，放完同步扣减</text>

  <!-- Matrix cells 2x2 -->
  <!-- cell (0,0) highlighted: min(3,4)=3 -->
  <rect x="150" y="80" width="90" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="122" text-anchor="middle" font-size="20" fill="#333" font-family="monospace" font-weight="bold">3</text>
  <text x="195" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">min(3,4)=3</text>

  <!-- cell (0,1) -->
  <rect x="240" y="80" width="90" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="122" text-anchor="middle" font-size="20" fill="#333" font-family="monospace">?</text>

  <!-- cell (1,0) -->
  <rect x="150" y="150" width="90" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="192" text-anchor="middle" font-size="20" fill="#333" font-family="monospace">?</text>

  <!-- cell (1,1) -->
  <rect x="240" y="150" width="90" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="192" text-anchor="middle" font-size="20" fill="#333" font-family="monospace">?</text>

  <!-- Row sum labels (right side) -->
  <rect x="335" y="80" width="56" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="363" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">行和</text>
  <text x="363" y="130" text-anchor="middle" font-size="18" fill="#333" font-family="monospace" font-weight="bold">3</text>

  <rect x="335" y="150" width="56" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="363" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a">行和</text>
  <text x="363" y="200" text-anchor="middle" font-size="18" fill="#333" font-family="monospace" font-weight="bold">8</text>

  <!-- Col sum labels (bottom) -->
  <rect x="150" y="225" width="90" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="245" text-anchor="middle" font-size="10" fill="#b85450">列和</text>
  <text x="195" y="265" text-anchor="middle" font-size="18" fill="#333" font-family="monospace" font-weight="bold">4</text>

  <rect x="240" y="225" width="90" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="245" text-anchor="middle" font-size="10" fill="#b85450">列和</text>
  <text x="285" y="265" text-anchor="middle" font-size="18" fill="#333" font-family="monospace" font-weight="bold">7</text>

  <!-- Arrows from cell to row sum and col sum -->
  <path d="M 240 115 L 333 115" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 195 150 L 195 223" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- subtraction annotation -->
  <text x="295" y="108" font-size="10" fill="#4a7a3a">3−3=0</text>
  <text x="210" y="170" font-size="10" fill="#b85450">4−3=1</text>

  <!-- Invariant box -->
  <rect x="60" y="300" width="440" height="62" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">不变量：Σ(剩余行和) ≡ Σ(剩余列和)</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#888">每格扣减同样的 x，两侧总和始终相等 → 最后一格两者必相等，自然归零</text>

  <!-- Left annotation: greedy choice -->
  <rect x="20" y="86" width="118" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="79" y="106" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">贪心：尽量多放</text>
  <text x="79" y="122" text-anchor="middle" font-size="10" fill="#888">但不能超过行和</text>
  <text x="79" y="136" text-anchor="middle" font-size="10" fill="#888">也不能超过列和</text>
</svg>
