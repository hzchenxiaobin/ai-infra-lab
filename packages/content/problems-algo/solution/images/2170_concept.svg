<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">交替数组：偶数位全相同，奇数位全相同，且两值不同</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">nums[i-2]==nums[i] 且 nums[i-1]!=nums[i] ⟹ 所有偶数位=a，所有奇数位=b，a≠b</text>

  <!-- ===== Left: Alternating array structure ===== -->
  <text x="40" y="74" font-size="11.5" fill="#446688" font-weight="bold">① 交替数组的结构</text>

  <!-- index labels -->
  <text x="62" y="94" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="106" y="94" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="150" y="94" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="194" y="94" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="238" y="94" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="282" y="94" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- alternating array: a b a b a b -->
  <rect x="40" y="100" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="84" y="100" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="128" y="100" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="172" y="100" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="216" y="100" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="260" y="100" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="122" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>

  <!-- group labels -->
  <path d="M 40 142 L 40 150 L 260 150 L 260 142" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="150" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">偶数位：全部 = a</text>

  <path d="M 84 142 L 84 150 L 304 150 L 304 142" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)" transform="translate(0,8)"/>
  <text x="194" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">奇数位：全部 = b</text>

  <!-- constraint -->
  <rect x="40" y="190" width="264" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="172" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">约束：a ≠ b（相邻必不同）</text>

  <!-- ===== Right: Key insight ===== -->
  <line x1="330" y1="60" x2="330" y2="380" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="450" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② 核心转化：最少操作数</text>

  <!-- formula box 1 -->
  <rect x="350" y="88" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作数 = 改变的元素数</text>
  <text x="450" y="126" text-anchor="middle" font-size="10.5" fill="#555">= n − 保留的元素数</text>
  <text x="450" y="140" text-anchor="middle" font-size="10" fill="#888">要最小化操作数 ⟹ 最大化保留数</text>

  <!-- arrow down -->
  <path d="M 450 148 L 450 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box 2 -->
  <rect x="350" y="168" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留数 = freq_even[a] + freq_odd[b]</text>
  <text x="450" y="206" text-anchor="middle" font-size="10.5" fill="#555">偶数位选频率最高的 a</text>
  <text x="450" y="220" text-anchor="middle" font-size="10.5" fill="#555">奇数位选频率最高的 b</text>

  <!-- arrow down -->
  <path d="M 450 228 L 450 242" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="470" y="240" font-size="9.5" fill="#b85450" font-weight="bold">但 a≠b！</text>

  <!-- formula box 3 -->
  <rect x="350" y="248" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="268" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">需各取 Top 2 频率</text>
  <text x="450" y="286" text-anchor="middle" font-size="10.5" fill="#555">若 top1_even ≠ top1_odd → 直接配</text>
  <text x="450" y="300" text-anchor="middle" font-size="10.5" fill="#555">若相同 → 退而求其次</text>

  <!-- ===== Bottom: final formula ===== -->
  <rect x="40" y="250" width="264" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="172" y="272" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">最终公式</text>
  <text x="172" y="294" text-anchor="middle" font-size="12" fill="#333">答案 = n − max</text>
  <text x="172" y="312" text-anchor="middle" font-size="11" fill="#555">( freq_even[a] + freq_odd[b] )</text>
  <text x="172" y="326" text-anchor="middle" font-size="10" fill="#888" font-style="italic">对所有 a ≠ b 取最大</text>

  <!-- ===== Bottom: two groups diagram ===== -->
  <text x="40" y="356" font-size="11" fill="#444" font-weight="bold">分组统计 → 各取最高频 → 约束配对 → 最少操作数</text>

  <!-- mini flow -->
  <rect x="40" y="366" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">偶数位频率</text>

  <rect x="140" y="366" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="384" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">奇数位频率</text>

  <path d="M 120 380 L 140 380" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 380 L 240 380" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="366" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a≠b 配对</text>

  <path d="M 320 380 L 350 380" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="350" y="366" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="384" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n − max_sum</text>
</svg>
