<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "leetcode" → "leotcede"</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">元音序列 e,e,o,e 反转 → e,o,e,e，填回原位</text>

  <!-- 图例 -->
  <rect x="40" y="56" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="69" font-size="10" fill="#333">元音</text>
  <rect x="110" y="56" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="132" y="69" font-size="10" fill="#333">辅音</text>
  <text x="180" y="69" font-size="10" fill="#4a7a3a" font-weight="bold">L=left</text>
  <text x="230" y="69" font-size="10" fill="#b85450" font-weight="bold">R=right</text>
  <text x="290" y="69" font-size="10" fill="#d6a040" font-weight="bold">⇄ 表示本轮交换</text>

  <!-- ===== 初始状态 ===== -->
  <text x="40" y="98" font-size="12" fill="#444" font-weight="bold">初始：L=0, R=7</text>
  <g font-size="13">
    <rect x="40" y="104" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="60" y="126" text-anchor="middle" fill="#333" font-weight="bold">l</text>
    <rect x="84" y="104" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="104" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="128" y="104" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="172" y="104" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="192" y="126" text-anchor="middle" fill="#333" font-weight="bold">t</text>
    <rect x="216" y="104" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="236" y="126" text-anchor="middle" fill="#333" font-weight="bold">c</text>
    <rect x="260" y="104" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="280" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">o</text>
    <rect x="304" y="104" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="324" y="126" text-anchor="middle" fill="#333" font-weight="bold">d</text>
    <rect x="348" y="104" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="368" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
  </g>
  <text x="104" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L</text>
  <text x="368" y="92" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R</text>

  <!-- 步骤说明 -->
  <text x="404" y="120" font-size="10" fill="#555">L 停在 e(1)，R 停在 e(7)</text>
  <text x="404" y="134" font-size="10" fill="#b85450" font-weight="bold">⇄ 交换 s[1]↔s[7]（同字母，看似无变化）</text>

  <!-- ===== 第 1 次交换后 ===== -->
  <text x="40" y="170" font-size="12" fill="#444" font-weight="bold">交换后：L=2, R=6</text>
  <g font-size="13">
    <rect x="40" y="176" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="60" y="198" text-anchor="middle" fill="#333" font-weight="bold">l</text>
    <rect x="84" y="176" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="104" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="128" y="176" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="172" y="176" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="192" y="198" text-anchor="middle" fill="#333" font-weight="bold">t</text>
    <rect x="216" y="176" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="236" y="198" text-anchor="middle" fill="#333" font-weight="bold">c</text>
    <rect x="260" y="176" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="280" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">o</text>
    <rect x="304" y="176" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="324" y="198" text-anchor="middle" fill="#333" font-weight="bold">d</text>
    <rect x="348" y="176" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="368" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
  </g>
  <text x="148" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L</text>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R</text>
  <text x="404" y="192" font-size="10" fill="#555">L 停在 e(2)，R 跳过 d 停在 o(5)</text>
  <text x="404" y="206" font-size="10" fill="#b85450" font-weight="bold">⇄ 交换 s[2]↔s[5]：e↔o</text>

  <!-- ===== 第 2 次交换后 ===== -->
  <text x="40" y="242" font-size="12" fill="#444" font-weight="bold">交换后：L=3, R=4</text>
  <g font-size="13">
    <rect x="40" y="248" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="60" y="270" text-anchor="middle" fill="#333" font-weight="bold">l</text>
    <rect x="84" y="248" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="104" y="270" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="128" y="248" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="270" text-anchor="middle" fill="#b85450" font-weight="bold">o</text>
    <rect x="172" y="248" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="192" y="270" text-anchor="middle" fill="#333" font-weight="bold">t</text>
    <rect x="216" y="248" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="236" y="270" text-anchor="middle" fill="#333" font-weight="bold">c</text>
    <rect x="260" y="248" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="280" y="270" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="304" y="248" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="324" y="270" text-anchor="middle" fill="#333" font-weight="bold">d</text>
    <rect x="348" y="248" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="368" y="270" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
  </g>
  <text x="192" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L</text>
  <text x="236" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R</text>
  <text x="404" y="264" font-size="10" fill="#555">L 跳过 t 停在 c(4)？</text>
  <text x="404" y="278" font-size="10" fill="#4a7a3a" font-weight="bold">L=3(t)非元音→++；L=4(c)非元音→++</text>

  <!-- ===== 收敛 ===== -->
  <text x="40" y="314" font-size="12" fill="#444" font-weight="bold">L 跳到 5：L=5, R=4</text>
  <g font-size="13">
    <rect x="40" y="320" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="60" y="342" text-anchor="middle" fill="#333" font-weight="bold">l</text>
    <rect x="84" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="104" y="342" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="128" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="342" text-anchor="middle" fill="#b85450" font-weight="bold">o</text>
    <rect x="172" y="320" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="192" y="342" text-anchor="middle" fill="#333" font-weight="bold">t</text>
    <rect x="216" y="320" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="236" y="342" text-anchor="middle" fill="#333" font-weight="bold">c</text>
    <rect x="260" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="280" y="342" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="304" y="320" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="324" y="342" text-anchor="middle" fill="#333" font-weight="bold">d</text>
    <rect x="348" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="368" y="342" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
  </g>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L</text>
  <text x="236" y="308" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R</text>
  <text x="404" y="336" font-size="10" fill="#555">L 继续跳到 e(5)，但此时</text>
  <text x="404" y="350" font-size="10" fill="#b85450" font-weight="bold">L=5 &gt; R=4 → 循环结束！</text>

  <!-- ===== 最终结果 ===== -->
  <rect x="40" y="378" width="430" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60" y="400" font-size="13" fill="#4a7a3a" font-weight="bold">最终结果："leotcede"</text>
  <text x="220" y="400" font-size="11" fill="#555">（元音序列 e,e,o,e → 反转为 e,o,e,e）</text>

  <!-- ===== 元音序列对照 ===== -->
  <text x="40" y="432" font-size="12" fill="#444" font-weight="bold">元音子序列视角（抽出元音看更清楚）：</text>
  <g font-size="12">
    <rect x="40" y="440" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="60" y="460" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="84" y="440" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="104" y="460" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <rect x="128" y="440" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="148" y="460" text-anchor="middle" fill="#b85450" font-weight="bold">o</text>
    <rect x="172" y="440" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="192" y="460" text-anchor="middle" fill="#b85450" font-weight="bold">e</text>
    <text x="222" y="460" font-size="14" fill="#444" font-weight="bold">反转 →</text>
    <rect x="276" y="440" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="296" y="460" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="320" y="440" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="340" y="460" text-anchor="middle" fill="#4a7a3a" font-weight="bold">o</text>
    <rect x="364" y="440" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="384" y="460" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
    <rect x="408" y="440" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="428" y="460" text-anchor="middle" fill="#4a7a3a" font-weight="bold">e</text>
  </g>
  <text x="60" y="488" font-size="10" fill="#888">原位 1,2,5,7</text>
  <text x="296" y="488" font-size="10" fill="#888">填回原位 1,2,5,7</text>

  <!-- ===== 关键 ===== -->
  <rect x="30" y="500" width="520" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="518" font-size="11" fill="#d6a040" font-weight="bold">一句话总结：</text>
  <text x="44" y="531" font-size="10" fill="#555">双指针夹逼等价于「反转元音子序列」——辅音不动，元音按外↔内配对交换，L≥R 即停</text>
</svg>
