<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：stoneValue = [6,2,3,4,5,5]</text>

  <!-- ===== Round 1: [6,2,3,4,5,5] cut [6,2,3] | [4,5,5] ===== -->
  <text x="30" y="56" font-size="11" fill="#b85450" font-weight="bold">第 1 轮</text>
  <text x="90" y="56" font-size="10" fill="#888">区间 [6,2,3,4,5,5]，切 [6,2,3] | [4,5,5]</text>

  <!-- left [6,2,3] kept (green) -->
  <rect x="30" y="66" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="46" y="84" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="62" y="66" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="78" y="84" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="94" y="66" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="80" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a">左和 11 ✓ 保留</text>

  <!-- right [4,5,5] discarded (red strike) -->
  <rect x="140" y="66" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="84" text-anchor="middle" font-size="11" fill="#999">4</text>
  <rect x="172" y="66" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="84" text-anchor="middle" font-size="11" fill="#999">5</text>
  <rect x="204" y="66" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="84" text-anchor="middle" font-size="11" fill="#999">5</text>
  <path d="M 140 70 L 236 92" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="106" text-anchor="middle" font-size="10" fill="#b85450">右和 14 ✗ 丢弃</text>

  <!-- score row -->
  <rect x="320" y="68" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="370" y="86" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">本轮 +11</text>
  <rect x="430" y="68" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">累计 = 11</text>

  <!-- arrow to round 2 -->
  <path d="M 80 112 L 80 126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <!-- ===== Round 2: [6,2,3] cut [6] | [2,3] ===== -->
  <text x="30" y="146" font-size="11" fill="#b85450" font-weight="bold">第 2 轮</text>
  <text x="90" y="146" font-size="10" fill="#888">区间 [6,2,3]，切 [6] | [2,3]</text>

  <!-- left [6] discarded -->
  <rect x="30" y="156" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="174" text-anchor="middle" font-size="11" fill="#999">6</text>
  <path d="M 30 160 L 70 182" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="50" y="196" text-anchor="middle" font-size="10" fill="#b85450">左和 6 ✗</text>

  <!-- right [2,3] kept -->
  <rect x="80" y="156" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="96" y="174" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="112" y="156" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="174" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="112" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a">右和 5 ✓</text>

  <rect x="320" y="158" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="370" y="176" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">本轮 +5</text>
  <rect x="430" y="158" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">累计 = 16</text>

  <path d="M 112 202 L 112 216" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <!-- ===== Round 3: [2,3] cut [2] | [3] ===== -->
  <text x="30" y="236" font-size="11" fill="#b85450" font-weight="bold">第 3 轮</text>
  <text x="90" y="236" font-size="10" fill="#888">区间 [2,3]，切 [2] | [3]</text>

  <!-- left [2] kept -->
  <rect x="30" y="246" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="50" y="264" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="50" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a">左和 2 ✓</text>

  <!-- right [3] discarded -->
  <rect x="80" y="246" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="264" text-anchor="middle" font-size="11" fill="#999">3</text>
  <path d="M 80 250 L 120 272" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="286" text-anchor="middle" font-size="10" fill="#b85450">右和 3 ✗</text>

  <rect x="320" y="248" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="370" y="266" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">本轮 +2</text>
  <rect x="430" y="248" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">累计 = 18</text>

  <!-- end box -->
  <path d="M 50 292 L 50 306" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <rect x="20" y="308" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="328" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">剩单块 [2]，游戏结束 → 返回 18</text>

  <!-- footer -->
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">每轮 Bob 丢大边，Alice 保小边继续玩；累计得分即答案</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">Alice 的自由度只在「选切分点」与「两边相等时选保留哪边」</text>
</svg>
