<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数据结构：每个 index 一条有序版本列表</text>

  <!-- index column -->
  <rect x="40" y="56" width="60" height="172" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="50" text-anchor="middle" font-size="11" fill="#888">index</text>
  <rect x="50" y="68" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="50" y="120" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="50" y="172" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- arrow index0 -> version list -->
  <path d="M 90 82 L 138 82" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- arrow index1 -> version list -->
  <path d="M 90 134 L 138 134" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- arrow index2 -> version list -->
  <path d="M 90 186 L 138 186" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="300" y="50" text-anchor="middle" font-size="10" fill="#888">cur_snap 单调递增 → 版本列表天然有序</text>

  <!-- arr[0] version list: (0,5)(1,6)(2,9) -->
  <rect x="140" y="64" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="175" y="96" text-anchor="middle" font-size="9" fill="#888">val=5</text>
  <rect x="210" y="64" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="245" y="96" text-anchor="middle" font-size="9" fill="#888">val=6</text>
  <rect x="280" y="64" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="315" y="96" text-anchor="middle" font-size="9" fill="#888">val=9</text>

  <!-- arr[1] version list: only sentinel (0,0) -->
  <rect x="140" y="116" width="70" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="175" y="148" text-anchor="middle" font-size="9" fill="#888">val=0</text>
  <text x="225" y="139" font-size="10" fill="#b85450">哨兵（从未 set）</text>

  <!-- arr[2] version list: (0,0)(1,3) -->
  <rect x="140" y="168" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="175" y="200" text-anchor="middle" font-size="9" fill="#888">val=0</text>
  <rect x="210" y="168" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="245" y="200" text-anchor="middle" font-size="9" fill="#888">val=3</text>

  <!-- query box -->
  <rect x="120" y="228" width="340" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">get(index = 0, snap_id = 1)</text>
  <text x="290" y="266" text-anchor="middle" font-size="11" fill="#b85450">在 arr[0] 的 [0,1,2] 上二分找「≤ 1 的最大」</text>

  <!-- result arrow from arr[0] idx1 to query -->
  <path d="M 245 102 L 245 228" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- highlight idx1 of arr[0] -->
  <rect x="210" y="64" width="70" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="82" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="245" y="96" text-anchor="middle" font-size="9" fill="#888">val=6</text>

  <!-- result -->
  <rect x="120" y="294" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">命中 snap = 1（≤ 1 的最大）</text>
  <text x="290" y="330" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">→ 返回 val = 6</text>
</svg>
