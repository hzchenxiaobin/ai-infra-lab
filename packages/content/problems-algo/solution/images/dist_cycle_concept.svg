<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单环图：剥去度=1 的叶子，剩下的就是环</text>

  <!-- Edges (cycle = red, tree = gray) -->
  <!-- cycle 1-2 -->
  <path d="M 230 200 L 360 200" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- cycle 2-4 -->
  <path d="M 360 200 L 360 310" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- cycle 4-3 -->
  <path d="M 360 310 L 230 310" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- cycle 3-1 -->
  <path d="M 230 310 L 230 200" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- tree 0-1 -->
  <path d="M 120 170 L 230 200" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- tree 2-5 -->
  <path d="M 360 200 L 470 170" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- tree 5-6 -->
  <path d="M 470 170 L 560 110" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- degree=1 labels for leaves -->
  <text x="92" y="158" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">度=1</text>
  <text x="578" y="98" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">度=1</text>

  <!-- Leaves (orange): 0, 6 -->
  <circle cx="120" cy="170" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="175" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <circle cx="560" cy="110" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="560" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- Tree non-leaf (blue): 5 -->
  <circle cx="470" cy="170" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- Cycle nodes (red): 1, 2, 3, 4 -->
  <circle cx="230" cy="200" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="230" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <circle cx="360" cy="200" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="360" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <circle cx="360" cy="310" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="360" y="315" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <circle cx="230" cy="310" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="230" y="315" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- cycle badge -->
  <text x="295" y="259" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">环</text>

  <!-- Legend -->
  <rect x="40" y="360" width="540" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="380" font-size="11" fill="#444">● 红=环上节点（度≥2，剥不掉）</text>
  <text x="60" y="396" font-size="11" fill="#444">● 橙=叶子（度=1，先被剥）</text>
  <text x="310" y="380" font-size="11" fill="#444">● 蓝=树枝中间节点（被剥后度变 1，再入队）</text>
  <text x="310" y="396" font-size="11" fill="#666">连通 + n 条边 ⇒ 恰一个环；逐层删叶子即裸露出环</text>
</svg>
