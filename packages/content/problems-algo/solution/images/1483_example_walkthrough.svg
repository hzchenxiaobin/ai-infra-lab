<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：parent = [-1,0,0,1,1,2,2]</text>

  <g filter="url(#rough2)">
    <line x1="150" y1="70" x2="105" y2="130" stroke="#888" stroke-width="1.5"/>
    <line x1="150" y1="70" x2="195" y2="130" stroke="#888" stroke-width="1.5"/>
    <line x1="105" y1="130" x2="75" y2="200" stroke="#888" stroke-width="1.5"/>
    <line x1="105" y1="130" x2="120" y2="200" stroke="#888" stroke-width="1.5"/>
    <line x1="195" y1="130" x2="165" y2="200" stroke="#888" stroke-width="1.5"/>
    <line x1="195" y1="130" x2="210" y2="200" stroke="#888" stroke-width="1.5"/>

    <circle cx="150" cy="70"  r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="150" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
    <circle cx="105" cy="130" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="105" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <circle cx="195" cy="130" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="195" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <circle cx="75"  cy="200" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="75" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
    <circle cx="120" cy="200" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="120" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <circle cx="165" cy="200" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="165" y="205" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">5</text>
    <circle cx="210" cy="200" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="210" y="205" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">6</text>
    <text x="150" y="48" text-anchor="middle" font-size="10" fill="#888">根</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="280" y="44" width="248" height="160" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="8"/>
    <text x="292" y="64" font-size="12" fill="#a87020" font-weight="bold">查询 A: getKthAncestor(6, 3)</text>
    <text x="292" y="84" font-size="10" fill="#555">k = 3 = 2⁰ + 2¹（二进制 11）</text>
    <rect x="290" y="92" width="230" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="300" y="108" font-size="10.5" fill="#333">j=0, 位=1 → node = up[6][0] = 2</text>
    <rect x="290" y="118" width="230" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="300" y="134" font-size="10.5" fill="#333">j=1, 位=1 → node = up[2][1] = -1</text>
    <rect x="290" y="148" width="230" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="405" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 -1（越界，无第 3 祖先）</text>
    <text x="292" y="196" font-size="9.5" fill="#888">6→2→(无) ，根只有 2 个祖先</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="280" y="216" width="248" height="170" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" rx="8"/>
    <text x="292" y="236" font-size="12" fill="#3a5a2a" font-weight="bold">查询 B: getKthAncestor(5, 2)</text>
    <text x="292" y="256" font-size="10" fill="#555">k = 2 = 2¹（二进制 10）</text>
    <rect x="290" y="264" width="230" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="300" y="280" font-size="10.5" fill="#888">j=0, 位=0 → 跳过</text>
    <rect x="290" y="290" width="230" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4"/>
    <text x="300" y="306" font-size="10.5" fill="#333">j=1, 位=1 → node = up[5][1] = 0</text>
    <rect x="290" y="320" width="230" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="405" y="340" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">返回 0（根节点）</text>
    <text x="292" y="370" font-size="9.5" fill="#888">5→2→0 ，恰好 2 步到根</text>
  </g>
</svg>
