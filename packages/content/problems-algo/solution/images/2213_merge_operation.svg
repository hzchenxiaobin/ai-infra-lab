<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">merge 操作：两子节点合并出父节点</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">关键：横跨边界的重复段 = L.sufLen + R.preLen（当 L.rc == R.lc）</text>

  <!-- ===== Left child L = "aaa" ===== -->
  <text x="40" y="76" font-size="10.5" fill="#446688" font-weight="bold">左子 L = "aaa"</text>
  <rect x="40" y="84" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="82" y="84" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="124" y="84" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <!-- L fields -->
  <text x="40" y="142" font-size="9.5" fill="#555">len=3  lc='a'  rc='a'</text>
  <text x="40" y="156" font-size="9.5" fill="#555">preLen=3  sufLen=3</text>
  <text x="40" y="170" font-size="9.5" fill="#b85450" font-weight="bold">maxLen=3</text>

  <!-- ===== Right child R = "aab" ===== -->
  <text x="360" y="76" font-size="10.5" fill="#446688" font-weight="bold">右子 R = "aab"</text>
  <rect x="360" y="84" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="402" y="84" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="422" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="444" y="84" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="464" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- R fields -->
  <text x="360" y="142" font-size="9.5" fill="#555">len=3  lc='a'  rc='b'</text>
  <text x="360" y="156" font-size="9.5" fill="#555">preLen=2  sufLen=1</text>
  <text x="360" y="170" font-size="9.5" fill="#b85450" font-weight="bold">maxLen=2</text>

  <!-- ===== bridge highlight: L.rc='a' == R.lc='a' ===== -->
  <rect x="124" y="82" width="42" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="358" y="82" width="42" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <path d="M 166 104 L 356 104" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="261" y="98" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">L.rc == R.lc == 'a' ⟹ 可桥接</text>

  <!-- ===== merge down arrows ===== -->
  <path d="M 102 176 L 232 244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <path d="M 420 176 L 290 244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="280" y="208" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">merge</text>

  <!-- ===== Parent P = "aaaaab" ===== -->
  <text x="120" y="240" font-size="10.5" fill="#4a7a3a" font-weight="bold">父节点 P = "aaaaab"</text>

  <!-- 6 boxes, width 40, gap 4, start x=120 -->
  <rect x="120" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="274" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="164" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="184" y="274" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="208" y="248" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="274" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="252" y="248" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="274" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="296" y="248" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="274" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="340" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="274" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- maxLen bracket over boxes 0-4 (x 120..336) -->
  <path d="M 120 246 L 120 240 L 336 240 L 336 246" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="228" y="234" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">maxLen 区段 = 5</text>

  <!-- P fields computed -->
  <rect x="36" y="306" width="488" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">父节点字段计算（三步）</text>

  <text x="52" y="346" font-size="10" fill="#444">① len = L.len + R.len = 3 + 3 = <tspan font-weight="bold">6</tspan>；  lc = L.lc = 'a'；  rc = R.rc = 'b'</text>
  <text x="52" y="364" font-size="10" fill="#444">② preLen：L 全同（preLen==len）且 L.lc==R.lc ⟹ preLen = L.len + R.preLen = 3+2 = <tspan font-weight="bold" fill="#d6a040">5</tspan></text>
  <text x="52" y="380" font-size="10" fill="#444">     sufLen：R 非全同 ⟹ sufLen = R.sufLen = <tspan font-weight="bold" fill="#d6a040">1</tspan></text>
  <text x="52" y="398" font-size="10" fill="#444">③ maxLen = max(L.maxLen, R.maxLen, 桥接) = max(3, 2, L.sufLen+R.preLen=3+2) = <tspan font-weight="bold" fill="#b85450">5</tspan></text>
  <text x="52" y="416" font-size="10" fill="#888">→ 桥接段 L.sufLen(3) + R.preLen(2) = 5 胜出，构成 "aaaaa"（下标 0-4）</text>

  <!-- footer -->
  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#666" font-style="italic">每次单点更新后，从叶到根逐层 merge，根的 maxLen 即当前全局答案</text>
</svg>
