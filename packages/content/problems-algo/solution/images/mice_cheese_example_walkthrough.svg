<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)" font-weight="bold">示例1演算：reward1=[1,1,3,4], reward2=[4,4,1,1], k=2</text>

  <!-- 表头 -->
  <g font-size="13" fill="#333">
    <text x="60" y="62" filter="url(#rough2)">i</text>
    <rect x="80" y="48" width="40" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="100" y="65" text-anchor="middle" filter="url(#rough2)">0</text>
    <rect x="124" y="48" width="40" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="144" y="65" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="168" y="48" width="40" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="188" y="65" text-anchor="middle" filter="url(#rough2)">2</text>
    <rect x="212" y="48" width="40" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="232" y="65" text-anchor="middle" filter="url(#rough2)">3</text>
  </g>

  <!-- reward1 行 -->
  <text x="60" y="100" font-size="13" fill="#333" filter="url(#rough2)">r1</text>
  <g font-size="13" fill="#333">
    <rect x="80" y="86" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="100" y="103" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="124" y="86" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="144" y="103" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="168" y="86" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="188" y="103" text-anchor="middle" filter="url(#rough2)">3</text>
    <rect x="212" y="86" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="232" y="103" text-anchor="middle" filter="url(#rough2)">4</text>
  </g>

  <!-- reward2 行 -->
  <text x="60" y="138" font-size="13" fill="#333" filter="url(#rough2)">r2</text>
  <g font-size="13" fill="#333">
    <rect x="80" y="124" width="40" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="100" y="141" text-anchor="middle" filter="url(#rough2)">4</text>
    <rect x="124" y="124" width="40" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="144" y="141" text-anchor="middle" filter="url(#rough2)">4</text>
    <rect x="168" y="124" width="40" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="188" y="141" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="212" y="124" width="40" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="232" y="141" text-anchor="middle" filter="url(#rough2)">1</text>
  </g>

  <!-- gain 行 -->
  <text x="60" y="176" font-size="13" fill="#b85450" filter="url(#rough2)" font-weight="bold">gain</text>
  <g font-size="13" fill="#b85450">
    <rect x="80" y="162" width="40" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="100" y="179" text-anchor="middle" filter="url(#rough2)">−3</text>
    <rect x="124" y="162" width="40" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="144" y="179" text-anchor="middle" filter="url(#rough2)">−3</text>
    <rect x="168" y="162" width="40" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="188" y="179" text-anchor="middle" filter="url(#rough2)">2</text>
    <rect x="212" y="162" width="40" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="232" y="179" text-anchor="middle" filter="url(#rough2)">3</text>
  </g>

  <!-- 选 top2 -->
  <text x="290" y="176" font-size="13" fill="#333" filter="url(#rough2)">↑ gain 排序：3, 2, −3, −3 → 取前 k=2 → i=3, i=2</text>

  <!-- 计算框 -->
  <rect x="60" y="210" width="450" height="90" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="234" font-size="13" fill="#333" filter="url(#rough2)">base = sum(reward2) = 4+4+1+1 = 10</text>
  <text x="76" y="258" font-size="13" fill="#333" filter="url(#rough2)">topK gain 之和 = 3 + 2 = 5</text>
  <text x="76" y="286" font-size="15" fill="#b85450" filter="url(#rough2)" font-weight="bold">答案 = 10 + 5 = 15 ✓</text>

  <!-- 验证分配 -->
  <rect x="60" y="316" width="450" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough)"/>
  <text x="76" y="338" font-size="12" fill="#333" filter="url(#rough)">核对：老鼠1 吃 i=3,2 → reward1[3]+reward1[2]=4+3=7</text>
  <text x="76" y="358" font-size="12" fill="#333" filter="url(#rough)">　　　老鼠2 吃 i=0,1 → reward2[0]+reward2[1]=4+4=8</text>
  <text x="76" y="376" font-size="12" fill="#333" filter="url(#rough)">　　　合计 7+8 = 15 ✓（与公式一致）</text>
</svg>
