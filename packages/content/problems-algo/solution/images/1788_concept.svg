<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    核心观察：首尾同值 + 中间只留正数
  </text>

  <!-- ===== Row 1: original array ===== -->
  <text x="40" y="62" font-size="11" fill="#888" filter="url(#rough2)">flowers =</text>

  <!-- flowers = [100, 1, 1, -3, 1]  (example 2) -->
  <rect x="100" y="48" width="60" height="32" fill="#eee" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="69" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">100</text>
  <rect x="164" y="48" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="218" y="48" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="272" y="48" width="50" height="32" fill="#eee" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="297" y="69" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">−3</text>
  <rect x="326" y="48" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- index labels -->
  <text x="130" y="94" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">0</text>
  <text x="189" y="94" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="243" y="94" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">2</text>
  <text x="297" y="94" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">3</text>
  <text x="351" y="94" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- annotations -->
  <text x="130" y="40" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">园外移除</text>
  <text x="297" y="40" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">负数移除</text>
  <text x="189" y="40" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">首端 v</text>
  <text x="351" y="40" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">尾端 v</text>

  <!-- ===== Row 2: valid garden after removal ===== -->
  <text x="40" y="128" font-size="11" fill="#888" filter="url(#rough2)">有效花园 =</text>

  <rect x="100" y="114" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="154" y="114" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="208" y="114" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="270" y="135" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 美观度 = 1+1+1 = 3</text>

  <!-- ===== Row 3: formula ===== -->
  <text x="40" y="180" font-size="11" fill="#888" filter="url(#rough2)">区间 [i, j]：</text>

  <rect x="40" y="194" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    beauty(i, j) = 2·v + Σ max(flowers[k], 0) ,  i &lt; k &lt; j
  </text>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">
    首尾必须保留（即使为负）· 中间只留正数
  </text>

  <!-- ===== Row 4: prefix sum ===== -->
  <text x="40" y="276" font-size="11" fill="#888" filter="url(#rough2)">用前缀和加速：</text>

  <rect x="40" y="290" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    s[k] = Σ max(flowers[t], 0),  0 ≤ t &lt; k
  </text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    ⇒ beauty = 2·v + s[j] − s[i+1]
  </text>

  <!-- ===== Bottom: greedy choice ===== -->
  <rect x="40" y="346" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    s 单调不减 → 对每个值 v，取最早出现 i（最小化 s[i+1]）
  </text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    哈希表 d[v] 记录首次下标，再次遇到即计算并更新答案
  </text>
</svg>
