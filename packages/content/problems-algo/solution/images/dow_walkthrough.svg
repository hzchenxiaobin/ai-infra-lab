<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两组日期验证参考日法</text>

  <!-- ===== Strip 1: 2019-08-31 → Saturday ===== -->
  <rect x="20" y="50" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="85" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2019-08-31</text>

  <path d="M 150 72 L 166 72" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="50" width="250" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="293" y="66" text-anchor="middle" font-size="10" fill="#555">days_years = 48×365 + 12 = 17532</text>
  <text x="293" y="82" text-anchor="middle" font-size="10" fill="#555">+ prefix[7] + 31 − 1 = 212 + 30 = 242</text>

  <path d="M 418 72 L 434 72" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="436" y="50" width="124" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="498" y="68" text-anchor="middle" font-size="10" fill="#555">17774 % 7 = 1</text>
  <text x="498" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Saturday</text>

  <!-- ===== Strip 2: 1999-07-18 → Sunday ===== -->
  <rect x="20" y="110" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="85" y="137" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1999-07-18</text>

  <path d="M 150 132 L 166 132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="110" width="250" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="293" y="126" text-anchor="middle" font-size="10" fill="#555">days_years = 28×365 + 7 = 10227</text>
  <text x="293" y="142" text-anchor="middle" font-size="10" fill="#555">+ prefix[6] + 18 − 1 = 181 + 17 = 198</text>

  <path d="M 418 132 L 434 132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="436" y="110" width="124" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="498" y="128" text-anchor="middle" font-size="10" fill="#555">10425 % 7 = 2</text>
  <text x="498" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Sunday</text>

  <!-- ===== leap_count explanation ===== -->
  <rect x="40" y="172" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="194" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">闰年计数公式：leap(y) = ⌊y/4⌋ − ⌊y/100⌋ + ⌊y/400⌋</text>
  <text x="290" y="212" text-anchor="middle" font-size="10.5" fill="#555">[1971, 2018] 区间：leap(2018) − leap(1970) = 489 − 477 = 12 个闰年</text>
  <text x="290" y="230" text-anchor="middle" font-size="10.5" fill="#555">[1971, 1998] 区间：leap(1998) − leap(1970) = 484 − 477 = 7 个闰年</text>

  <!-- ===== Summary note ===== -->
  <rect x="40" y="256" width="500" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">关键：elapsed = days_years + day_of_year − 1</text>
  <text x="290" y="296" text-anchor="middle" font-size="10.5" fill="#555">day_of_year 用 1154 的前缀和 + 闰年修正（复用子例程）</text>
  <text x="290" y="314" text-anchor="middle" font-size="10.5" fill="#b85450">⚠️「−1」不可省：Jan 1 的 day_of_year=1，但 elapsed=0（参考日当天）</text>
</svg>
