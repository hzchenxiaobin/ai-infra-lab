<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 3, 2] → 答案 4</text>

  <!-- 表头 -->
  <text x="36" y="65" font-size="10" fill="#555" filter="url(#rough2)">j（arr1 取值）→</text>
  <rect x="160" y="50" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="50" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="50" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="50" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="50" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="65" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">j=0</text>
  <text x="235" y="65" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">j=1</text>
  <text x="285" y="65" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">j=2</text>
  <text x="335" y="65" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">j=3</text>
  <text x="385" y="65" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">j=4</text>

  <!-- 行 1：dp0 -->
  <text x="36" y="93" font-size="9.5" fill="#333" filter="url(#rough2)">i=0：nums=2</text>
  <rect x="160" y="78" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="78" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="78" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="78" width="50" height="22" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="360" y="78" width="50" height="22" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="185" y="93" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="235" y="93" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="285" y="93" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="335" y="93" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">·</text>
  <text x="385" y="93" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">·</text>

  <!-- 行 2：pre0 -->
  <text x="36" y="119" font-size="9" fill="#a07830" filter="url(#rough2)">pre₀[t]（读 t=j）</text>
  <rect x="160" y="104" width="50" height="22" rx="4" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="210" y="104" width="50" height="22" rx="4" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="260" y="104" width="50" height="22" rx="4" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="310" y="104" width="50" height="22" rx="4" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="360" y="104" width="50" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="185" y="119" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">0</text>
  <text x="235" y="119" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">1</text>
  <text x="285" y="119" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">2</text>
  <text x="335" y="119" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">3</text>
  <text x="385" y="119" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#rough2)">3</text>

  <!-- 行 3：dp1 -->
  <text x="36" y="145" font-size="9" fill="#333" filter="url(#rough2)">i=1：nums=3，d=1</text>
  <rect x="160" y="130" width="50" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="210" y="130" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="130" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="130" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="130" width="50" height="22" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="185" y="145" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="235" y="145" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="285" y="145" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="335" y="145" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="385" y="145" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">·</text>

  <!-- 行 4：pre1 -->
  <text x="36" y="171" font-size="9" fill="#a07830" filter="url(#rough2)">pre₁[t]（读 t=j+1）</text>
  <rect x="160" y="156" width="50" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="210" y="156" width="50" height="22" rx="4" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="260" y="156" width="50" height="22" rx="4" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="310" y="156" width="50" height="22" rx="4" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="360" y="156" width="50" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="185" y="171" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="235" y="171" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">0</text>
  <text x="285" y="171" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">1</text>
  <text x="335" y="171" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">3</text>
  <text x="385" y="171" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#rough2)">6</text>

  <!-- 行 5：dp2 -->
  <text x="36" y="197" font-size="9" fill="#333" filter="url(#rough2)">i=2：nums=2，d=0</text>
  <rect x="160" y="182" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="182" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="182" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="182" width="50" height="22" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="360" y="182" width="50" height="22" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="185" y="197" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="235" y="197" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="285" y="197" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="335" y="197" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">·</text>
  <text x="385" y="197" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">·</text>

  <!-- 答案框 -->
  <rect x="36" y="218" width="380" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="226" y="239" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">答案 = dp₂[0] + dp₂[1] + dp₂[2] = 0 + 1 + 3 = 4 ✓</text>

  <!-- 4 个合法对 -->
  <text x="36" y="274" font-size="10" fill="#333" filter="url(#rough2)">对应的 4 个单调数组对（arr2 = nums − arr1）：</text>
  <text x="52" y="294" font-size="9.5" fill="#33506b" filter="url(#rough2)">① arr1=[0,1,1]，arr2=[2,2,1]</text>
  <text x="52" y="314" font-size="9.5" fill="#33506b" filter="url(#rough2)">② arr1=[0,1,2]，arr2=[2,2,0]</text>
  <text x="280" y="294" font-size="9.5" fill="#33506b" filter="url(#rough2)">③ arr1=[0,2,2]，arr2=[2,1,0]</text>
  <text x="280" y="314" font-size="9.5" fill="#33506b" filter="url(#rough2)">④ arr1=[1,2,2]，arr2=[1,1,0]</text>

  <text x="36" y="342" font-size="9" fill="#888" filter="url(#rough2)">注：d=1 时 dp₁[j] 读正上方的 pre₀[j]；d=0 时 dp₂[j] 读右邻一列的 pre₁[j+1]</text>
</svg>
