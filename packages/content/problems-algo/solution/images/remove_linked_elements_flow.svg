<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">移除链表元素：迭代法流程</text>

  <!-- Start -->
  <rect x="220" y="42" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <line x1="280" y1="72" x2="280" y2="92" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="180" y="96" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#333">dummy.next = head</text>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#333">curr = dummy</text>
  <line x1="280" y1="136" x2="280" y2="156" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <polygon points="280,160 380,200 280,240 180,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#333">curr.next ==</text>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#333">nullptr ?</text>

  <!-- Yes -> return -->
  <line x1="380" y1="200" x2="460" y2="200" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="460" y="184" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="505" y="204" text-anchor="middle" font-size="11" fill="#333">return</text>
  <text x="505" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dummy.next</text>

  <!-- No -> down to inner check -->
  <line x1="280" y1="240" x2="280" y2="262" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="256" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Inner decision diamond -->
  <polygon points="280,266 390,306 280,346 170,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#333">curr.next.val</text>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333">== val ?</text>

  <!-- Yes (equal): skip, NOT advance -->
  <line x1="170" y1="306" x2="90" y2="306" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="300" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="20" y="288" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="306" text-anchor="middle" font-size="10" fill="#333">curr.next =</text>
  <text x="55" y="320" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">curr.next.next</text>
  <text x="55" y="340" text-anchor="middle" font-size="9" fill="#b85450">（不移动 curr）</text>

  <!-- No (not equal): advance -->
  <line x1="390" y1="306" x2="470" y2="306" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="470" y="290" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="510" y="313" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">curr =</text>
  <text x="510" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">curr.next</text>

  <!-- Loop back arrows to top diamond -->
  <path d="M 55 288 L 55 200 L 180 200" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 290 L 510 200 L 380 200" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="244" font-size="10" fill="#888">回到循环判断</text>

  <!-- legend -->
  <rect x="20" y="400" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough)"/>
  <text x="34" y="420" font-size="11" fill="#333">💡 关键不对称：删节点后 <tspan font-weight="bold">不前进</tspan>（新 curr.next 可能也要删）；保留节点才前进。</text>
  <text x="34" y="436" font-size="11" fill="#666">这保证了连续目标值（如 7→7→7）被一次性全部删除。</text>
</svg>
