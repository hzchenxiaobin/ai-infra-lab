<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：P(j) = [at(j) == v] 在 [i, n−1] 上先真后假 → 可二分</text>

  <rect x="90" y="34" width="340" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">设当前块首 i = 4，v = at(4) = 9，搜索域 [i, n−1] = [4, 9]</text>

  <!-- 数组格子 -->
  <rect x="50"  y="74" width="42" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="92"  y="74" width="42" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="74" width="42" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="74" width="42" height="30" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="218" y="74" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="74" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="74" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="344" y="74" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="386" y="74" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="428" y="74" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="71"  y="94" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="113" y="94" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="155" y="94" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="197" y="94" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">3</text>
  <text x="239" y="94" text-anchor="middle" font-size="12" fill="#8a6414" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="281" y="94" text-anchor="middle" font-size="12" fill="#8a6414" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="323" y="94" text-anchor="middle" font-size="12" fill="#8a6414" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="365" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="407" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="449" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <text x="71"  y="116" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="113" y="116" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="155" y="116" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">2</text>
  <text x="197" y="116" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">3</text>
  <text x="239" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="281" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="323" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="365" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="407" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>
  <text x="449" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">9</text>

  <!-- 谓词行 -->
  <text x="42" y="148" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">P(j)</text>
  <text x="71"  y="148" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">—</text>
  <text x="113" y="148" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">—</text>
  <text x="155" y="148" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">—</text>
  <text x="197" y="148" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">—</text>
  <circle cx="239" cy="144" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="239" y="148" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>
  <circle cx="281" cy="144" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281" y="148" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>
  <circle cx="323" cy="144" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="323" y="148" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>
  <circle cx="365" cy="144" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="365" y="148" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">F</text>
  <circle cx="407" cy="144" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="407" y="148" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">F</text>
  <circle cx="449" cy="144" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="449" y="148" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">F</text>

  <text x="200" y="148" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">域外</text>

  <rect x="55" y="164" width="410" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">域 [4,9] 上：T T T F F F —— 先真后假，二分找「最后一个 T」= 块尾 6</text>

  <!-- 反例 -->
  <rect x="55" y="206" width="410" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠️ 反例：若无「等值必相邻」保证，如 [1, 2, 1]</text>
  <text x="260" y="246" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">v=1 时 P = T F T 非单调，二分失效 → 此时任何算法都需 Ω(n) 次探测</text>

  <!-- 二分模板 -->
  <rect x="70" y="272" width="380" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">「找最后一个 T」二分模板</text>
  <text x="260" y="310" text-anchor="middle" font-size="10.5" fill="#33507a" font-family="'Comic Sans MS', monospace" filter="url(#rough2)">lo = i, hi = n−1;  mid = (lo + hi + 1) / 2</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#33507a" font-family="'Comic Sans MS', monospace" filter="url(#rough2)">at(mid)==v ? lo = mid : hi = mid − 1</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">mid 上取整是标配：防止 lo = mid 时死循环</text>
</svg>
