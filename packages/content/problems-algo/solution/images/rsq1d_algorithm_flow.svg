<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一维前缀和算法流程：先预处理，后 O(1) 查询</text>

  <!-- ① 构造阶段 -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">① 构造阶段　O(n)</text>

  <rect x="70" y="68" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="12" fill="#333">pre 开 n+1 全 0（pre[0]=0 作哨兵，边界自动为 0）</text>

  <path d="M260 102 V124" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="128" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#333">单循环：i = 0..n−1</text>

  <path d="M260 162 V184" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="188" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">pre[i+1] = pre[i] + nums[i]</text>

  <!-- 分隔 -->
  <path d="M40 252 H480" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- ② 查询阶段 -->
  <text x="40" y="276" font-size="12" fill="#b85450" font-weight="bold">② 查询阶段　每次 O(1)</text>

  <rect x="70" y="286" width="380" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#333">调用 sumRange(left, right)</text>

  <path d="M260 320 V342" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="346" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">return pre[right+1] − pre[left]</text>
</svg>
