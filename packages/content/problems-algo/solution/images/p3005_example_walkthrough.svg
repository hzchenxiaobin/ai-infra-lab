<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,2,3,1,4]，一遍遍历的 maxFreq / ans 变化</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">橙行＝突破重置，绿行＝并列累加</text>

  <!-- header -->
  <rect x="20" y="56" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="68" y="56" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="108" y="56" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="141" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">freq[x]</text>
  <rect x="174" y="56" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="207" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">maxFreq</text>
  <rect x="240" y="56" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="273" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>
  <rect x="306" y="56" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- row 0: init -->
  <rect x="20" y="86" width="526" height="31" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="106" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">初始</text>
  <text x="88" y="106" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−</text>
  <text x="141" y="106" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−</text>
  <text x="207" y="106" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="273" y="106" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="426" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">还没开始扫</text>

  <!-- row 1: x=1, breakthrough -->
  <rect x="20" y="117" width="526" height="31" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="44" y="137" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="88" y="137" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="141" y="137" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">1</text>
  <text x="207" y="137" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="273" y="137" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="426" y="137" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">1 &gt; 0 → 突破，重置 ans = 1</text>

  <!-- row 2: x=2, tie -->
  <rect x="20" y="148" width="526" height="31" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="44" y="168" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="88" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="141" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="207" y="168" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="273" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="426" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 == 1 → 并列，ans += 1</text>

  <!-- row 3: x=2, breakthrough -->
  <rect x="20" y="179" width="526" height="31" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="44" y="199" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="88" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="141" y="199" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">2</text>
  <text x="207" y="199" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="273" y="199" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="426" y="199" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">2 &gt; 1 → 突破，旧账作废，ans 重置 = 2</text>

  <!-- row 4: x=3, no change -->
  <rect x="20" y="210" width="526" height="31" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="230" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="88" y="230" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="141" y="230" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="207" y="230" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="273" y="230" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="426" y="230" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1 &lt; 2 → 无关元素，不变</text>

  <!-- row 5: x=1, tie (final answer) -->
  <rect x="20" y="241" width="526" height="31" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="261" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="88" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="141" y="261" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="207" y="261" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="273" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="426" y="261" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 == 2 → 并列，ans += 2 ★ 定格答案</text>

  <!-- row 6: x=4, no change -->
  <rect x="20" y="272" width="526" height="31" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="292" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="88" y="292" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="141" y="292" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="207" y="292" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="273" y="292" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="426" y="292" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1 &lt; 2 → 无关元素，不变</text>

  <!-- final answer box -->
  <rect x="58" y="318" width="444" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">最终返回 ans = 4：元素 1 和 2 并列最大频率 2，总频率 = 2 + 2</text>
  <text x="280" y="363" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">注意第 5 步：1 追平 maxFreq 时 ans 加的是 maxFreq=2（它的全部频率），不是 1</text>
</svg>
