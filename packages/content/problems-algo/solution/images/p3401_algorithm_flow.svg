<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：edges 度数过滤 → walk 递归走链 → chains 环行判定 → 编号输出</text>
  <text x="290" y="36" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">左侧为 SQL 流水线，右侧为示例数据在每一步的形态</text>

  <rect x="30" y="48" width="340" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="70" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① edges：出入度过滤（拆掉不在环上的边）</text>
  <text x="50" y="90" font-size="9.5" fill="#333" filter="url(#rough2)">WHERE giver_id IN (… GROUP BY giver_id HAVING COUNT(*)=1)</text>
  <text x="50" y="108" font-size="9.5" fill="#333" filter="url(#rough2)">　AND receiver_id IN (… GROUP BY receiver_id HAVING COUNT(*)=1)</text>
  <text x="50" y="130" font-size="9" fill="#446688" filter="url(#rough2)">出入度 ≠ 1 的员工不可能在环上 → 图退化为不相交的路径 + 环</text>
  <text x="50" y="146" font-size="9" fill="#446688" filter="url(#rough2)">路径残骸无害：走不到自己，不会产生环行</text>

  <rect x="390" y="48" width="160" height="108" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="470" y="68" text-anchor="middle" font-size="9" fill="#888" font-weight="bold" filter="url(#rough2)">edges（5 行）</text>
  <text x="470" y="88" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">示例每人恰好送 / 收一份</text>
  <text x="470" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 行全保留</text>
  <text x="470" y="128" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">（若添 2→9 这类边则被删）</text>
  <text x="470" y="146" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">＝干净的函数图</text>

  <path d="M 200 158 L 200 178" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="180" width="340" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="202" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② walk：递归走链（每条边作起点）</text>
  <text x="50" y="222" font-size="9.5" fill="#333" filter="url(#rough2)">锚点：(start, cur, total, steps, min_seen)</text>
  <text x="50" y="240" font-size="9.5" fill="#333" filter="url(#rough2)">递推：JOIN edges ON giver_id = cur_id 沿唯一后继延伸</text>
  <text x="50" y="258" font-size="9.5" fill="#333" filter="url(#rough2)">终止：WHERE cur_id &lt;&gt; start_id —— 回到起点即切断</text>
  <text x="50" y="280" font-size="9" fill="#4a7a3a" filter="url(#rough2)">LEAST 滚动维护路径最小 id；total / steps 顺手累计</text>
  <text x="50" y="294" font-size="9" fill="#4a7a3a" filter="url(#rough2)">过滤后无「路径接环」→ 递归必然终止</text>

  <rect x="390" y="180" width="160" height="118" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="470" y="200" text-anchor="middle" font-size="9" fill="#888" font-weight="bold" filter="url(#rough2)">walk（环 ① 的 3 趟）</text>
  <text x="470" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">从 1：1→2→3→1 ✓ min=1</text>
  <text x="470" y="238" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">从 2：2→3→1→2 min=1≠2</text>
  <text x="470" y="256" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">从 3：3→1→2→3 min=1≠3</text>
  <text x="470" y="278" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">每趟都回到自己（steps=3,</text>
  <text x="470" y="292" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">total=90），靠 min_seen 分胜负</text>

  <path d="M 200 300 L 200 320" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="322" width="340" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="344" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ chains：环行判定（每环恰好一行）</text>
  <text x="50" y="366" font-size="9.5" fill="#333" filter="url(#rough2)">WHERE cur=start AND min_seen=start AND steps&gt;1</text>

  <rect x="390" y="322" width="160" height="62" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="470" y="346" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(1, 长3, 总90)</text>
  <text x="470" y="366" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(4, 长2, 总60)</text>

  <path d="M 200 386 L 200 406" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="408" width="340" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="428" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 编号输出</text>
  <text x="50" y="448" font-size="9.5" fill="#333" filter="url(#rough2)">ROW_NUMBER() OVER (ORDER BY 长 DESC, 总 DESC, start_id) AS chain_id</text>

  <rect x="390" y="408" width="160" height="52" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="470" y="428" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(1, 3, 90)</text>
  <text x="470" y="448" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(2, 2, 60)</text>
</svg>
