<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">极坐标法算法流程：一次成型，无循环无丢弃</text>

  <!-- Step 1: Start -->
  <ellipse cx="280" cy="62" rx="50" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">调用 randPoint()</text>

  <!-- arrow -->
  <line x1="280" y1="84" x2="280" y2="104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sample U1, theta -->
  <rect x="160" y="108" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333">U₁ ~ Uniform(0,1)</text>
  <text x="280" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">θ = 2π · U₁</text>

  <line x1="280" y1="154" x2="280" y2="174" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sample U2, rho -->
  <rect x="160" y="178" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#333">U₂ ~ Uniform(0,1)</text>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">ρ = R · √U₂</text>

  <line x1="280" y1="224" x2="280" y2="244" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: convert to cartesian -->
  <rect x="130" y="248" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#333">映射回笛卡尔坐标</text>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">x = xc + ρ·cosθ ,  y = yc + ρ·sinθ</text>

  <line x1="280" y1="300" x2="280" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <ellipse cx="280" cy="342" rx="70" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return [x, y]</text>

  <!-- Side note -->
  <rect x="400" y="178" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="470" y="196" text-anchor="middle" font-size="10" fill="#b85450">关键：√U 补偿</text>
  <text x="470" y="212" text-anchor="middle" font-size="10" fill="#888">面积元 ρ dρ dθ</text>
  <line x1="400" y1="200" x2="402" y2="200" stroke="#b85450" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom takeaway -->
  <rect x="60" y="382" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#666">两次 uniform + 一次 sqrt + cos/sin，O(1) 常数时间</text>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#888">对比拒绝采样：无循环、无丢弃、调用次数确定</text>
</svg>
