<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4,4,2,1]（V = 4，共 6 对）</text>
  <text x="260" y="37" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">三张表逐行求出，最后一步把查询变成「排名定位」</text>

  <!-- 表头：g -->
  <text x="100" y="66" text-anchor="end" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">g →</text>
  <rect x="110" y="48" width="89" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="154" y="67" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="201" y="48" width="89" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="67" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="292" y="48" width="89" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="336" y="67" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="383" y="48" width="89" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="427" y="67" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 行：m(g) -->
  <text x="100" y="97" text-anchor="end" font-size="9" fill="#666" filter="url(#rough2)">m(g) 倍数个数</text>
  <rect x="110" y="80" width="89" height="28" fill="#ffffff" stroke="#8fa8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="154" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="201" y="80" width="89" height="28" fill="#ffffff" stroke="#8fa8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="292" y="80" width="89" height="28" fill="#ffffff" stroke="#8fa8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="336" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="383" y="80" width="89" height="28" fill="#ffffff" stroke="#8fa8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="427" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行：P(g) -->
  <text x="100" y="129" text-anchor="end" font-size="9" fill="#666" filter="url(#rough2)">P(g) = C(m,2)</text>
  <rect x="110" y="112" width="89" height="28" fill="#ffffff" stroke="#8fa8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="154" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="201" y="112" width="89" height="28" fill="#ffffff" stroke="#8fa8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="292" y="112" width="89" height="28" fill="#ffffff" stroke="#8fa8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="336" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="383" y="112" width="89" height="28" fill="#ffffff" stroke="#8fa8c4" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="427" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行：E[g]（绿色高亮） -->
  <text x="100" y="161" text-anchor="end" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">E[g] 容斥后</text>
  <rect x="110" y="144" width="89" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="163" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="201" y="144" width="89" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="163" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="292" y="144" width="89" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="163" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="383" y="144" width="89" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="427" y="163" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行：cum[g]（橙色高亮） -->
  <text x="100" y="193" text-anchor="end" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">cum[g] 前缀和</text>
  <rect x="110" y="176" width="89" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="195" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="201" y="176" width="89" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="245" y="195" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="292" y="176" width="89" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="195" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="383" y="176" width="89" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="427" y="195" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 容斥注记 -->
  <text x="260" y="221" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">倒序：E[4] = P(4) = 1 → E[2] = P(2) − E[4] = 3 − 1 = 2 → E[1] = P(1) − E[2] − E[3] − E[4] = 6 − 3 = 3</text>
  <text x="260" y="236" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">m(2) = 3（2,4,4），m(4) = 2（4,4）；cum[2] = cum[3] = 5：值 3 不出现，二分自动跳过</text>

  <!-- 排序后 gcdPairs -->
  <text x="100" y="262" text-anchor="end" font-size="9.5" fill="#333" font-weight="bold" filter="url(#rough2)">gcdPairs =</text>
  <rect x="110" y="246" width="46" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="133" y="265" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="246" width="46" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="187" y="265" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="246" width="46" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="241" y="265" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="272" y="246" width="46" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="295" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="326" y="246" width="46" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="349" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="380" y="246" width="46" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="403" y="265" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="133" y="284" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="187" y="284" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="241" y="284" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="295" y="284" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="349" y="284" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="403" y="284" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="452" y="265" font-size="8.5" fill="#888" filter="url(#rough2)">← 下标(红=被查询)</text>

  <!-- 查询应答 -->
  <rect x="26" y="294" width="468" height="56" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">查询即排名：queries[i] = q（0 起）→ 二分找最小 g 使 cum[g] ≥ q + 1</text>
  <text x="260" y="330" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">q=5 → 第6个 → g=4　　　q=3 → 第4个 → g=2　　　q=1 → 第2个 → g=1　　　q=0 → 第1个 → g=1</text>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer = [4, 2, 1, 1] ✓</text>
</svg>
