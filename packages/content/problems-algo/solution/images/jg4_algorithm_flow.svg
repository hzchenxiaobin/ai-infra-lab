<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="640" fill="#fdfcf7"/>
  <text x="260" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">BFS 求最少步数流程</text>
  <path d="M 130 36 Q 260 44 390 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Init -->
  <g filter="url(#sk)">
    <rect x="120" y="52" width="280" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#2b4b6e" font-weight="bold">初始化</text>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#555">建 值→下标表 valIdx；visited[0]=1；q=[0]；steps=0</text>
  <path d="M 260 102 L 260 120" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: queue empty? -->
  <g filter="url(#sk)">
    <path d="M 260 124 L 336 158 L 260 192 L 184 158 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">本层队列空?</text>
  <text x="260" y="172" text-anchor="middle" font-size="9" fill="#888">(所有层处理完)</text>
  <path d="M 336 158 L 408 158" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="408" y="142" width="92" height="34" rx="6" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="454" y="164" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">不可达 -1</text>

  <text x="246" y="206" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>
  <path d="M 260 192 L 260 214" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- pop i (layer) -->
  <g filter="url(#sk)">
    <rect x="110" y="216" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">按层弹出 i（记录当前层节点数 sz）</text>
  <text x="260" y="250" text-anchor="middle" font-size="10" fill="#555">对 sz 个节点逐一处理，处理完一层 steps++</text>
  <path d="M 260 260 L 260 278" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond: i == n-1? -->
  <g filter="url(#sk)">
    <path d="M 260 282 L 340 318 L 260 354 L 180 318 Z" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">i == n−1?</text>
  <text x="260" y="332" text-anchor="middle" font-size="9" fill="#888">(到达终点)</text>
  <path d="M 340 318 L 410 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="410" y="302" width="84" height="34" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="452" y="324" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">return steps</text>
  <path d="M 260 354 L 260 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="246" y="368" font-size="10" fill="#2e6e2e" font-weight="bold">No</text>

  <!-- enqueue i-1, i+1 -->
  <g filter="url(#sk)">
    <rect x="110" y="374" width="300" height="44" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/>
  </g>
  <text x="260" y="392" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">邻接边：i−1、i+1 合法且未访问 → 入队</text>
  <text x="260" y="408" text-anchor="middle" font-size="10" fill="#888">标记 visited 后入队，避免重复</text>
  <path d="M 260 418 L 260 436" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- same-value + clear (KEY STEP, red highlight) -->
  <g filter="url(#sk)">
    <rect x="92" y="438" width="336" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="260" y="458" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">同值边：遍历 valIdx[arr[i]] 全部下标 j</text>
  <text x="260" y="474" text-anchor="middle" font-size="10" fill="#555">未访问的 j → 标记 visited 并入队</text>
  <text x="260" y="494" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">★ 立即清空 valIdx[arr[i]]（关键优化）</text>
  <path d="M 260 504 L 260 522" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>

  <!-- ++steps / next in layer or next layer -->
  <g filter="url(#sk)">
    <rect x="150" y="524" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="542" text-anchor="middle" font-size="11" fill="#2b4b6e" font-weight="bold">本层 sz 处理完 → steps++</text>
  <text x="260" y="556" text-anchor="middle" font-size="10" fill="#888">进入下一层继续扩展</text>

  <!-- loop back arrow to queue-empty check -->
  <path d="M 370 544 L 470 544 L 470 158 L 340 158" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="478" y="350" font-size="10" fill="#2e6e2e" font-weight="bold" transform="rotate(-90 478 350)">回到队首判断</text>

  <!-- note box at bottom -->
  <g filter="url(#sk)">
    <rect x="60" y="582" width="400" height="48" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="260" y="604" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">为何清空？同值点首次入队后已全部 visited，</text>
  <text x="260" y="620" text-anchor="middle" font-size="10" fill="#888">后续再遇到同值节点无需重遍 → 总边数 O(n)</text>
</svg>
