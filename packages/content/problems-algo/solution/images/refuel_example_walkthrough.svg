<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：target=100, startFuel=10, stations=[[10,60],[20,30],[30,30],[60,40]]</text>
  <text x="300" y="40" text-anchor="middle" font-size="11" fill="#888">初值: cur=10, prev=0, 堆=[], stops=0  （终点视为 [100, 0] 站点）</text>

  <!-- Column headers -->
  <text x="40" y="64" font-size="10" fill="#888">步</text>
  <text x="84" y="64" text-anchor="middle" font-size="10" fill="#888">到达点</text>
  <text x="150" y="64" text-anchor="middle" font-size="10" fill="#888">need</text>
  <text x="206" y="64" text-anchor="middle" font-size="10" fill="#888">到达前 cur</text>
  <text x="306" y="64" text-anchor="middle" font-size="10" fill="#888">动作</text>
  <text x="430" y="64" text-anchor="middle" font-size="10" fill="#888">堆（处理后）</text>
  <text x="540" y="64" font-size="10" fill="#888">stops</text>

  <!-- Divider under header -->
  <path d="M 24 70 L 576 70" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: 站10, need=10, cur=10, 直达+记60, heap=[60], stops=0 -->
  <text x="40" y="92" font-size="11" fill="#555">1</text>
  <rect x="56" y="78" width="56" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="92" text-anchor="middle" font-size="10" fill="#333">站 10</text>
  <text x="150" y="92" text-anchor="middle" font-size="11" fill="#555">10</text>
  <text x="206" y="92" text-anchor="middle" font-size="11" fill="#555">10</text>
  <rect x="248" y="78" width="116" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="306" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a">直达; 记 60 入堆</text>
  <text x="430" y="92" text-anchor="middle" font-size="10" fill="#333">[60]</text>
  <text x="540" y="92" font-size="11" fill="#555">0</text>

  <!-- Row 2: 站20, need=10, cur=0, 缺油取60再走, heap=[30], stops=1 -->
  <text x="40" y="124" font-size="11" fill="#555">2</text>
  <rect x="56" y="110" width="56" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="124" text-anchor="middle" font-size="10" fill="#333">站 20</text>
  <text x="150" y="124" text-anchor="middle" font-size="11" fill="#555">10</text>
  <text x="206" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="248" y="110" width="116" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="306" y="124" text-anchor="middle" font-size="10" fill="#b85450">取 60; 再走 10; 记 30</text>
  <text x="430" y="124" text-anchor="middle" font-size="10" fill="#333">[30]</text>
  <text x="540" y="124" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- Row 3: 站30, need=10, cur=50, 直达+记30, heap=[30,30], stops=1 -->
  <text x="40" y="156" font-size="11" fill="#555">3</text>
  <rect x="56" y="142" width="56" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="156" text-anchor="middle" font-size="10" fill="#333">站 30</text>
  <text x="150" y="156" text-anchor="middle" font-size="11" fill="#555">10</text>
  <text x="206" y="156" text-anchor="middle" font-size="11" fill="#555">50</text>
  <rect x="248" y="142" width="116" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="306" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">直达; 记 30 入堆</text>
  <text x="430" y="156" text-anchor="middle" font-size="10" fill="#333">[30, 30]</text>
  <text x="540" y="156" font-size="11" fill="#555">1</text>

  <!-- Row 4: 站60, need=30, cur=40, 直达+记40, heap=[40,30,30], stops=1 -->
  <text x="40" y="188" font-size="11" fill="#555">4</text>
  <rect x="56" y="174" width="56" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="84" y="188" text-anchor="middle" font-size="10" fill="#333">站 60</text>
  <text x="150" y="188" text-anchor="middle" font-size="11" fill="#555">30</text>
  <text x="206" y="188" text-anchor="middle" font-size="11" fill="#555">40</text>
  <rect x="248" y="174" width="116" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="306" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a">直达; 记 40 入堆</text>
  <text x="430" y="188" text-anchor="middle" font-size="10" fill="#333">[40, 30, 30]</text>
  <text x="540" y="188" font-size="11" fill="#555">1</text>

  <!-- Row 5: 终点100, need=40, cur=10, 缺油取40再走, heap=[30,30], stops=2 -->
  <text x="40" y="220" font-size="11" fill="#555">5</text>
  <rect x="56" y="206" width="56" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="84" y="220" text-anchor="middle" font-size="10" fill="#333">终点 100</text>
  <text x="150" y="220" text-anchor="middle" font-size="11" fill="#555">40</text>
  <text x="206" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <rect x="248" y="206" width="116" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="306" y="220" text-anchor="middle" font-size="10" fill="#b85450">取 40; 再走 40; 到达</text>
  <text x="430" y="220" text-anchor="middle" font-size="10" fill="#333">[30, 30]</text>
  <text x="540" y="220" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- Divider under rows -->
  <path d="M 24 236 L 576 236" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="40" y="248" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="268" font-size="11" fill="#888">结果:</text>
  <text x="300" y="268" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">在站 10 与站 60 各加一次油，共 stops = 2 次 ✓</text>
  <text x="300" y="288" text-anchor="middle" font-size="10" fill="#d6a040">关键: 站10 的 60 升先「记账」，到站20 缺油时才取出；站60 的 40 升留到冲终点才用</text>

  <!-- Legend -->
  <rect x="40" y="312" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="322" font-size="10" fill="#666">直达/记账</text>
  <rect x="160" y="312" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="182" y="322" font-size="10" fill="#666">缺油取最大</text>
  <text x="300" y="322" font-size="10" fill="#999">堆按「最大堆」语义，列出内容不区分次序</text>
</svg>
