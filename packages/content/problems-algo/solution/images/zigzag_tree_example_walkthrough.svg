<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：label = 14</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">每步：求层级 h → 镜像 → 除以 2 得父节点</text>

  <!-- ===== Step table header ===== -->
  <rect x="30" y="56" width="50" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="74" text-anchor="middle" font-size="11" fill="#888">步</text>
  <rect x="82" y="56" width="80" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="122" y="74" text-anchor="middle" font-size="11" fill="#888">label</text>
  <rect x="164" y="56" width="50" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="189" y="74" text-anchor="middle" font-size="11" fill="#888">h</text>
  <rect x="216" y="56" width="140" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="286" y="74" text-anchor="middle" font-size="11" fill="#888">mirror = 2^(h-1)+2^h-1-label</text>
  <rect x="358" y="56" width="80" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="398" y="74" text-anchor="middle" font-size="11" fill="#888">label=mirror/2</text>
  <rect x="440" y="56" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="74" text-anchor="middle" font-size="11" fill="#888">result</text>

  <!-- ===== Step 0: init ===== -->
  <rect x="30" y="86" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="105" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="82" y="86" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="105" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">14</text>
  <rect x="164" y="86" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="105" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="216" y="86" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="286" y="105" text-anchor="middle" font-size="11" fill="#333">8 + 15 − 14 = 9</text>
  <rect x="358" y="86" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="398" y="105" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="440" y="86" width="90" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="105" text-anchor="middle" font-size="10" fill="#555">[14]</text>

  <!-- ===== Step 1 ===== -->
  <rect x="30" y="118" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="137" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="82" y="118" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="164" y="118" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="137" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="216" y="118" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="286" y="137" text-anchor="middle" font-size="11" fill="#333">4 + 7 − 4 = 7</text>
  <rect x="358" y="118" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="398" y="137" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="440" y="118" width="90" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="137" text-anchor="middle" font-size="10" fill="#555">[14, 4]</text>

  <!-- ===== Step 2 ===== -->
  <rect x="30" y="150" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="169" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="82" y="150" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="164" y="150" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="169" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="216" y="150" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="286" y="169" text-anchor="middle" font-size="11" fill="#333">2 + 3 − 3 = 2</text>
  <rect x="358" y="150" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="398" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="440" y="150" width="90" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="169" text-anchor="middle" font-size="10" fill="#555">[14,4,3]</text>

  <!-- ===== Step 3: stop ===== -->
  <rect x="30" y="182" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="201" text-anchor="middle" font-size="11" fill="#333">停</text>
  <rect x="82" y="182" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="122" y="201" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="164" y="182" width="290" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="201" text-anchor="middle" font-size="11" fill="#b85450">label = 1 ≤ 1，停止循环</text>
  <rect x="440" y="182" width="90" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="201" text-anchor="middle" font-size="10" fill="#555">[14,4,3,1]</text>

  <!-- separator -->
  <path d="M 30 222 L 530 222" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="540" y="226" font-size="10" fill="#d6a040" font-weight="bold">反转</text>

  <!-- ===== Result path ===== -->
  <text x="40" y="252" font-size="12" fill="#444" font-weight="bold">反转后路径（根 → 目标）：</text>

  <!-- path boxes: 1 -> 3 -> 4 -> 14 -->
  <rect x="60" y="264" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="85" y="285" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <path d="M 112 280 L 138 280" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="264" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="285" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <path d="M 192 280 L 218 280" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="264" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="245" y="285" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <path d="M 272 280 L 298 280" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="264" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="325" y="285" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">14</text>

  <!-- ===== Tree path visualization ===== -->
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#888">树上的路径（高亮）：</text>

  <!-- L1: 1 (highlighted) -->
  <circle cx="280" cy="346" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <line x1="270" y1="358" x2="220" y2="378" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- L2: 3 (highlighted, left side) -->
  <circle cx="215" cy="388" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="215" y="393" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>

  <!-- L2: 2 (dimmed) -->
  <circle cx="345" cy="388" r="13" fill="#f5f5f5" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="345" y="393" text-anchor="middle" font-size="10" fill="#bbb">2</text>

  <line x1="207" y1="400" x2="175" y2="416" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- L3: 4 (highlighted) -->
  <circle cx="170" cy="424" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="428" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>

  <line x1="160" y1="432" x2="135" y2="432" stroke="none"/>

  <!-- path arrow 4 -> 14 (down to L4) -->
  <path d="M 170 436 Q 155 432 145 432" stroke="none"/>

  <!-- final answer box -->
  <rect x="60" y="404" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)" opacity="0"/>
  <text x="280" y="424" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">answer = [1, 3, 4, 14]  ✓</text>
</svg>
