<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建结果数组，一次遍历放置后拼接返回</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#333">res = 长度 n 的空数组，i = 0</text>

  <path d="M 280 78 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision -->
  <polygon points="280,96 400,140 280,184 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#888">(还有源字符)</text>

  <!-- No -> return -->
  <path d="M 400 140 L 470 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="132" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="460" y="120" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">拼接 res</text>
  <text x="505" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ⭐</text>

  <!-- Yes -->
  <path d="M 280 184 L 280 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="194" font-size="10" fill="#82b366">是</text>

  <!-- Step: res[indices[i]] = s[i] -->
  <rect x="90" y="202" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① res[indices[i]] = s[i]</text>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#666">源字符 i 直达目标位置 indices[i]</text>

  <path d="M 280 242 L 280 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: i++ -->
  <rect x="180" y="260" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="11" fill="#333">② i++，回到循环开头</text>

  <!-- loop back arrow -->
  <path d="M 180 276 L 70 276 L 70 140 L 160 140" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="205" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 62 205)">继续下一个</text>

  <!-- Note -->
  <rect x="90" y="316" width="380" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">关键：循环方向沿「源→目标」走</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888">每个 i 的目标 indices[i] 已知，O(1) 直达</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#888">indices 是排列 → 无冲突、无遗漏</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#b85450">⚠️ 不能原地写回 s，需独立结果数组</text>
</svg>
