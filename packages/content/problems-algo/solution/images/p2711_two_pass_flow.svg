<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两遍扫描法：同一条对角线正向+逆向各扫一遍</text>

  <!-- ===== Forward pass (top row) ===== -->
  <text x="30" y="58" font-size="12" fill="#b85450" font-weight="bold">① 正向扫描（左上→右下）</text>
  <text x="30" y="73" font-size="10" fill="#888">记录 topLeft = 加入前的 |seen|</text>

  <!-- 3 cells: (0,0)=1, (1,1)=1, (2,2)=1 -->
  <!-- Cell (0,0) -->
  <rect x="40" y="82" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="108" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="68" y="78" text-anchor="middle" font-size="8" fill="#aaa">(0,0)</text>
  <rect x="44" y="128" width="48" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="142" text-anchor="middle" font-size="9" fill="#b85450">seen={} → TL=0</text>

  <!-- arrow -->
  <path d="M 96 102 L 124 102" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Cell (1,1) -->
  <rect x="130" y="82" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="108" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="158" y="78" text-anchor="middle" font-size="8" fill="#aaa">(1,1)</text>
  <rect x="134" y="128" width="48" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="142" text-anchor="middle" font-size="9" fill="#b85450">seen={1} → TL=1</text>

  <!-- arrow -->
  <path d="M 186 102 L 214 102" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Cell (2,2) -->
  <rect x="220" y="82" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="108" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="248" y="78" text-anchor="middle" font-size="8" fill="#aaa">(2,2)</text>
  <rect x="224" y="128" width="48" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="142" text-anchor="middle" font-size="9" fill="#b85450">seen={1} → TL=1</text>

  <!-- ===== Backward pass (bottom row) ===== -->
  <text x="30" y="182" font-size="12" fill="#4a7a3a" font-weight="bold">② 逆向扫描（右下→左上）</text>
  <text x="30" y="197" font-size="10" fill="#888">记录 bottomRight = 加入前的 |seen|</text>

  <!-- Cell (2,2) -->
  <rect x="40" y="206" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="232" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="68" y="202" text-anchor="middle" font-size="8" fill="#aaa">(2,2)</text>
  <rect x="44" y="252" width="48" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a">seen={} → BR=0</text>

  <!-- arrow (right to left, so reverse direction) -->
  <path d="M 124 226 L 96 226" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Cell (1,1) -->
  <rect x="130" y="206" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="232" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="158" y="202" text-anchor="middle" font-size="8" fill="#aaa">(1,1)</text>
  <rect x="134" y="252" width="48" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a">seen={1} → BR=1</text>

  <!-- arrow -->
  <path d="M 214 226 L 186 226" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Cell (0,0) -->
  <rect x="220" y="206" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="232" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="248" y="202" text-anchor="middle" font-size="8" fill="#aaa">(0,0)</text>
  <rect x="224" y="252" width="48" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a">seen={1} → BR=1</text>

  <!-- ===== Answer column ===== -->
  <text x="380" y="58" font-size="12" fill="#d6a040" font-weight="bold">③ answer = |TL - BR|</text>

  <rect x="336" y="82" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="396" y="108" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(0,0): |0-1| = 1</text>

  <rect x="336" y="142" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="396" y="168" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(1,1): |1-1| = 0</text>

  <rect x="336" y="202" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="396" y="228" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(2,2): |1-0| = 1</text>

  <!-- connecting arrows -->
  <path d="M 296 102 L 336 102" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 296 162 L 336 162" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 296 226 L 336 226" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Summary -->
  <rect x="30" y="295" width="460" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#333">对每条对角线（r-c 恒定）：正向记 topLeft，逆向记 bottomRight</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#333">同一 set 滚动复用：加入前的大小即"另一侧不同值个数"</text>
</svg>
