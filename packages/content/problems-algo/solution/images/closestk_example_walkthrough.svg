<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：arr=[1..10], k=4, x=5</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">3 轮二分锁定左边界 low=2 → 返回 [3,4,5,6]</text>

  <!-- array row, fixed positions; index 0..9 at x = 40 + i*48 -->
  <text x="22" y="78" text-anchor="middle" font-size="10" fill="#888">下标</text>
  <text x="22" y="100" text-anchor="middle" font-size="10" fill="#888">值</text>
  <line x1="36" y1="60" x2="36" y2="116" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- indices -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="60" y="74">0</text><text x="108" y="74">1</text><text x="156" y="74">2</text>
    <text x="204" y="74">3</text><text x="252" y="74">4</text><text x="300" y="74">5</text>
    <text x="348" y="74">6</text><text x="396" y="74">7</text><text x="444" y="74">8</text>
    <text x="492" y="74">9</text>
  </g>
  <!-- values -->
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="40" y="84" width="40" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="60" y="103">1</text>
    <rect x="88" y="84" width="40" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="108" y="103">2</text>
    <rect x="136" y="84" width="40" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="156" y="103">3</text>
    <rect x="184" y="84" width="40" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="204" y="103">4</text>
    <rect x="232" y="84" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/><text x="252" y="103">5</text>
    <rect x="280" y="84" width="40" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="300" y="103">6</text>
    <rect x="328" y="84" width="40" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="348" y="103">7</text>
    <rect x="376" y="84" width="40" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="396" y="103">8</text>
    <rect x="424" y="84" width="40" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="444" y="103">9</text>
    <rect x="472" y="84" width="40" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="492" y="103">10</text>
  </g>
  <text x="252" y="128" text-anchor="middle" font-size="9.5" fill="#d6a040">↑ x=5</text>

  <!-- Step 1 -->
  <text x="20" y="150" font-size="11" fill="#444" font-weight="bold">轮1</text>
  <rect x="40" y="156" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="174" font-size="10.5" fill="#333">low=0, high=6  →  mid=3</text>
  <text x="56" y="190" font-size="10.5" fill="#555">比 arr[3]=4 与 arr[7]=8：x−4=1 ≤ 8−x=3 ?  ✓ 是 → high=3</text>
  <!-- highlight mid and mid+k -->
  <rect x="184" y="84" width="40" height="28" fill="none" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="376" y="84" width="40" height="28" fill="none" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="138" text-anchor="middle" font-size="9" fill="#446688">mid</text>
  <text x="396" y="138" text-anchor="middle" font-size="9" fill="#b85450">mid+k</text>

  <!-- Step 2 -->
  <text x="20" y="216" font-size="11" fill="#444" font-weight="bold">轮2</text>
  <rect x="40" y="222" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="240" font-size="10.5" fill="#333">low=0, high=3  →  mid=1</text>
  <text x="56" y="256" font-size="10.5" fill="#555">比 arr[1]=2 与 arr[5]=6：x−2=3 ≤ 6−x=1 ?  ✗ 否 → low=2</text>

  <!-- Step 3 -->
  <text x="20" y="282" font-size="11" fill="#444" font-weight="bold">轮3</text>
  <rect x="40" y="288" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="10.5" fill="#333">low=2, high=3  →  mid=2</text>
  <text x="56" y="322" font-size="10.5" fill="#555">比 arr[2]=3 与 arr[6]=7：x−3=2 ≤ 7−x=2 ?  ✓ 是（平局取左）→ high=2</text>

  <!-- result -->
  <rect x="40" y="350" width="500" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">low == high == 2  →  返回 arr[2:6] = [3, 4, 5, 6]</text>
  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#555">验证：距 5 的距离 0,1,1,2 · 平局(3 与 7 同为 2)取较小数 3 ✓</text>

  <!-- highlight final window in array -->
  <rect x="136" y="84" width="184" height="28" fill="none" stroke="#4a7a3a" stroke-width="3" rx="6" filter="url(#rough2)"/>

  <text x="280" y="432" text-anchor="middle" font-size="10.5" fill="#888">每轮比较两个端点到 x 的距离，范围 [0,6] → [0,3] → [2,3] → [2,2]，O(log n)</text>
</svg>
