<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：a + b 是回文 ⟺「镜像双翼 + 中心回文」</text>
  <text x="260" y="32" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">示例 4 · s = "abcde"，t = "ecdba"：选 a = "abc"，b = "ba" → W = "abcba"</text>

  <!-- s strip -->
  <text x="24" y="67" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">s :</text>
  <text x="110" y="42" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">P = "ab"</text>
  <text x="170" y="42" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">M = "c"</text>
  <g filter="url(#rough2)">
    <rect x="70" y="46" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="110" y="46" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="150" y="46" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="190" y="46" width="40" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="230" y="46" width="40" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <text x="90" y="67" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">a</text>
    <text x="130" y="67" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">b</text>
    <text x="170" y="67" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">c</text>
    <text x="210" y="67" text-anchor="middle" font-size="12" fill="#888">d</text>
    <text x="250" y="67" text-anchor="middle" font-size="12" fill="#888">e</text>
  </g>

  <!-- t strip -->
  <text x="316" y="67" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">t :</text>
  <text x="469" y="42" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">Q = "ba"</text>
  <g filter="url(#rough2)">
    <rect x="350" y="46" width="34" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="384" y="46" width="34" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="418" y="46" width="34" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="452" y="46" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="486" y="46" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="367" y="67" text-anchor="middle" font-size="12" fill="#888">e</text>
    <text x="401" y="67" text-anchor="middle" font-size="12" fill="#888">c</text>
    <text x="435" y="67" text-anchor="middle" font-size="12" fill="#888">d</text>
    <text x="469" y="67" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">b</text>
    <text x="503" y="67" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">a</text>
  </g>

  <!-- arrows s/t -> W -->
  <line x1="185" y1="84" x2="168" y2="154" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="132" y="122" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">a = "abc"</text>
  <line x1="435" y1="84" x2="262" y2="154" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="368" y="122" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">b = "ba"</text>

  <!-- W strip -->
  <text x="86" y="186" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">W :</text>
  <g filter="url(#rough2)">
    <rect x="110" y="160" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="150" y="160" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="190" y="160" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="230" y="160" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="270" y="160" width="40" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="130" y="186" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">a</text>
    <text x="170" y="186" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">b</text>
    <text x="210" y="186" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">c</text>
    <text x="250" y="186" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">b</text>
    <text x="290" y="186" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">a</text>
    <text x="130" y="216" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold">左翼 P</text>
    <text x="210" y="216" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">中心 M</text>
    <text x="290" y="216" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold">右翼 rev(Q)</text>
  </g>

  <!-- mirror arc between wings -->
  <path d="M 130 224 Q 210 244 290 224" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrO)" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="210" y="245" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">互为镜像：P = rev(Q)</text>

  <!-- explanation boxes -->
  <g filter="url(#rough2)">
    <rect x="30" y="254" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="260" y="272" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">k = min(|a|, |b|)：前 k 格来自 a（前缀 P），后 k 格来自 b（后缀 Q），两翼满足 P = rev(Q)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="30" y="290" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="260" y="308" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">掐头去尾后中心段仍是回文：要么全在 s（M 紧贴 P 右侧），要么全在 t（N 紧贴 Q 左侧）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="30" y="326" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="260" y="344" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">ans = max( 单侧最长回文 , max over 镜像对 [ 2k + max(midS[i₁+k], midT[i₂−k]) ] )</text>
  </g>
</svg>
