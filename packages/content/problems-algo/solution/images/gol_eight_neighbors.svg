<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrIn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：看周围 8 个邻居，且必须「同步」更新</text>

  <!-- 3x3 grid: cell 54x54, step 58, origin (52, 76) -->
  <!-- (0,0)=1 live  (0,1)=0  (0,2)=1 live -->
  <!-- (1,0)=0       (1,1)=1  (1,2)=0      -->
  <!-- (2,0)=0       (2,1)=1  (2,2)=0      -->

  <!-- dead cells (light gray) -->
  <rect x="110" y="76"  width="54" height="54" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="52"  y="134" width="54" height="54" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="222" y="134" width="54" height="54" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="52"  y="192" width="54" height="54" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="222" y="192" width="54" height="54" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="15" fill="#bbb" text-anchor="middle" font-weight="bold">
    <text x="137" y="108">0</text>
    <text x="79"  y="166">0</text>
    <text x="249" y="166">0</text>
    <text x="79"  y="224">0</text>
    <text x="249" y="224">0</text>
  </g>

  <!-- live neighbor cells (blue) -->
  <rect x="52"  y="76"  width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="222" y="76"  width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="110" y="192" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g font-size="16" fill="#2a4a66" text-anchor="middle" font-weight="bold">
    <text x="79"  y="108">1</text>
    <text x="249" y="108">1</text>
    <text x="137" y="224">1</text>
  </g>

  <!-- center cell (live, green highlight) -->
  <rect x="110" y="134" width="54" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="137" y="168" text-anchor="middle" font-size="17" fill="#3a5a2a" font-weight="bold">1</text>
  <text x="137" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">中心 (i,j)</text>

  <!-- 8 arrows from neighbors toward center -->
  <g stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)">
    <line x1="86"  y1="100" x2="118" y2="142" marker-end="url(#arrIn)"/>
    <line x1="137" y1="98"  x2="137" y2="130" marker-end="url(#arrIn)"/>
    <line x1="242" y1="100" x2="156" y2="142" marker-end="url(#arrIn)"/>
    <line x1="84"  y1="161" x2="106" y2="161" marker-end="url(#arrIn)"/>
    <line x1="244" y1="161" x2="168" y2="161" marker-end="url(#arrIn)"/>
    <line x1="86"  y1="218" x2="118" y2="182" marker-end="url(#arrIn)"/>
    <line x1="137" y1="206" x2="137" y2="194" marker-end="url(#arrIn)"/>
    <line x1="242" y1="218" x2="156" y2="182" marker-end="url(#arrIn)"/>
  </g>

  <!-- right panel -->
  <rect x="296" y="74" width="200" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="98" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">活邻居数 = 3</text>
  <text x="396" y="120" text-anchor="middle" font-size="11" fill="#444">中心原为活细胞</text>
  <text x="396" y="138" text-anchor="middle" font-size="11" fill="#444">2 ≤ 3 ≤ 3 → 存活</text>
  <text x="396" y="156" text-anchor="middle" font-size="10" fill="#888">（规则 2）</text>

  <!-- warning box: simultaneous update -->
  <rect x="296" y="180" width="200" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="202" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">⚠️ 同步更新的陷阱</text>
  <text x="306" y="222" font-size="10.5" fill="#555">若边算边把新状态直接</text>
  <text x="306" y="237" font-size="10.5" fill="#555">写回 board[i][j]，后续</text>
  <text x="306" y="252" font-size="10.5" fill="#555">细胞数邻居就会读到</text>
  <text x="306" y="267" font-size="10.5" fill="#8a3a36" font-weight="bold">「新值」而非「旧值」</text>

  <!-- caption -->
  <rect x="40" y="292" width="460" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#555">每个细胞基于「同一份旧状态」数 8 邻居，一次性算出全部下一代</text>
  <text x="270" y="329" text-anchor="middle" font-size="11" fill="#555">→ 朴素做法需 O(mn) 额外空间拷贝，能否原地 O(1)？见下图</text>
</svg>
