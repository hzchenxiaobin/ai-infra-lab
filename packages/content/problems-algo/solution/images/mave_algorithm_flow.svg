<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举符号组合 → 遍历求 max/min → 取最大差</text>

  <!-- Step 1: init -->
  <rect x="170" y="40" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>

  <!-- arrow down -->
  <path d="M 260 74 L 260 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop over sign combos -->
  <rect x="120" y="88" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">枚举符号组合 (s₁, s₂, s₃)</text>
  <text x="260" y="122" text-anchor="middle" font-size="10" fill="#888">s₁, s₂, s₃ ∈ {+1, −1}，共 8 组</text>

  <!-- arrow down -->
  <path d="M 260 128 L 260 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: init mx, mn -->
  <rect x="140" y="142" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mx = −∞,  mn = +∞</text>

  <!-- arrow down -->
  <path d="M 260 176 L 260 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: loop i -->
  <rect x="120" y="190" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">遍历 i = 0 … n−1</text>
  <text x="260" y="224" text-anchor="middle" font-size="10" fill="#888">计算 f = s₁·arr1[i] + s₂·arr2[i] + s₃·i</text>

  <!-- arrow down -->
  <path d="M 260 230 L 260 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: update mx, mn -->
  <!-- diamond for decision-like update -->
  <rect x="140" y="244" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mx = max(mx, f)</text>
  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mn = min(mn, f)</text>

  <!-- loop back arrow: from update box back to loop i -->
  <path d="M 380 264 C 430 264 430 210 400 210" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="440" y="240" text-anchor="middle" font-size="9" fill="#888">下一个 i</text>

  <!-- arrow down after loop done -->
  <path d="M 260 284 L 260 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="292" font-size="9" fill="#888">遍历结束</text>

  <!-- Step 6: update ans -->
  <rect x="120" y="300" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">ans = max(ans, mx − mn)</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#888">该符号组合的最大差</text>

  <!-- loop back to sign combo -->
  <path d="M 400 320 C 460 320 460 108 400 108" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="475" y="220" text-anchor="middle" font-size="9" fill="#888">下一组</text>
  <text x="475" y="232" text-anchor="middle" font-size="9" fill="#888">符号</text>

  <!-- arrow down after all combos done -->
  <path d="M 260 340 L 260 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="348" font-size="9" fill="#888">8 组完毕</text>

  <!-- Step 7: return ans -->
  <rect x="160" y="356" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 ans</text>

  <!-- complexity note -->
  <rect x="80" y="404" width="360" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="422" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(8n) = O(n)    空间 O(1)</text>
</svg>
