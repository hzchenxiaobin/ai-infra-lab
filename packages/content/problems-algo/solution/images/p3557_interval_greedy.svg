<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">合法子串 = 区间：结束越早越先切，切完清空首现表</text>

  <text x="20" y="44" font-size="11" fill="#888" filter="url(#rough2)">以 word = "abcdeafdef" 为例：</text>

  <!-- 字符格子 -->
  <rect x="83" y="52" width="38" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">a</text>
  <rect x="127" y="52" width="38" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">b</text>
  <rect x="171" y="52" width="38" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">c</text>
  <rect x="215" y="52" width="38" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="234" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">d</text>
  <rect x="259" y="52" width="38" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">e</text>
  <rect x="303" y="52" width="38" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="322" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">a</text>
  <rect x="347" y="52" width="38" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">f</text>
  <rect x="391" y="52" width="38" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">d</text>
  <rect x="435" y="52" width="38" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">e</text>
  <rect x="479" y="52" width="38" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="498" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">f</text>

  <!-- 下标 -->
  <text x="102" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="146" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="190" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="234" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="278" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="322" y="106" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="366" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="410" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="454" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">8</text>
  <text x="498" y="106" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">9</text>

  <text x="172" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✂ abcdea → 第 1 刀</text>
  <text x="432" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">✂ fdef → 第 2 刀</text>

  <!-- 候选区间 -->
  <text x="20" y="150" font-size="11" fill="#888" filter="url(#rough2)">全部候选区间（首尾同字符、长度 ≥ 4）：</text>

  <text x="56" y="170" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">a…a</text>
  <rect x="83" y="160" width="258" height="14" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="349" y="171" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 选中（结束最早）</text>

  <text x="56" y="194" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">d…d</text>
  <rect x="215" y="184" width="214" height="14" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="195" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 与第 1 刀重叠</text>

  <text x="56" y="218" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">e…e</text>
  <rect x="259" y="208" width="214" height="14" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="481" y="219" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 重叠</text>

  <text x="56" y="242" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">f…f</text>
  <rect x="347" y="232" width="170" height="14" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="525" y="243" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 要点框 -->
  <rect x="40" y="258" width="480" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">贪心准则：按结束位置从左往右扫描，能切就切（经典区间调度）</text>
  <text x="280" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">判定 i 能否收尾：只查 first[word[i]] —— 自上一刀以来该字符的首次出现</text>
  <text x="280" y="324" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">首现下标最小 ⇒ i − first[c] 最大：首现都不够远，更晚的出现更不可能够远</text>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">切完即清空 first —— 新子串必须从 i+1 重新开始</text>
</svg>
