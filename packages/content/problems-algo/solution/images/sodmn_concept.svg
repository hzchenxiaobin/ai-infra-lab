<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：三步流水线——取最小 → 求数位和 → 判奇偶</text>

  <!-- ===== Step 1: find minimum ===== -->
  <rect x="30" y="64" width="150" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="105" y="86" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">第 1 步：取最小值</text>

  <rect x="44" y="98" width="34" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="61" y="116" text-anchor="middle" font-size="11" fill="#333">34</text>
  <rect x="82" y="98" width="34" height="26" fill="#fff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="99" y="116" text-anchor="middle" font-size="11" fill="#333">23</text>
  <rect x="120" y="98" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="105" y="142" text-anchor="middle" font-size="11" fill="#446688">扫描 → mn = 1</text>

  <!-- arrow step1 -> step2 -->
  <path d="M 182 112 L 210 112" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: sum of digits ===== -->
  <rect x="214" y="64" width="150" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="289" y="86" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">第 2 步：求数位之和</text>

  <rect x="232" y="98" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="280" y="116" font-size="13" fill="#888">→</text>
  <rect x="294" y="98" width="26" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="307" y="117" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="324" y="116" font-size="13" fill="#888">+</text>
  <rect x="338" y="98" width="0" height="28" fill="none" filter="url(#rough2)"/>
  <text x="289" y="142" text-anchor="middle" font-size="11" fill="#d6a040">s = 1</text>

  <!-- arrow step2 -> step3 -->
  <path d="M 366 112 L 394 112" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: parity ===== -->
  <rect x="398" y="64" width="120" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="458" y="86" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">第 3 步：判奇偶</text>

  <rect x="420" y="98" width="76" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="458" y="117" text-anchor="middle" font-size="11.5" fill="#333">s 为奇?</text>

  <rect x="414" y="138" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="439" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">奇→0</text>
  <rect x="468" y="138" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="493" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶→1</text>

  <!-- ===== divider ===== -->
  <line x1="30" y1="186" x2="510" y2="186" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== example 2 strip ===== -->
  <text x="30" y="210" font-size="12" fill="#555" font-weight="bold">示例 2：nums = [99,77,33,66,55]</text>

  <rect x="30" y="222" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="240" font-size="11" fill="#446688">最小值：</text>
  <rect x="96" y="228" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">33</text>
  <text x="105" y="268" text-anchor="middle" font-size="10.5" fill="#446688">mn = 33</text>

  <path d="M 182 250 L 210 250" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="214" y="222" width="150" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="289" y="240" text-anchor="middle" font-size="11" fill="#d6a040">3 + 3 = 6</text>
  <rect x="248" y="246" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="273" y="262" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">s = 6</text>

  <path d="M 366 250 L 394 250" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="398" y="222" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="458" y="244" text-anchor="middle" font-size="11.5" fill="#4a7a3a">6 为偶 → 返回</text>
  <rect x="436" y="252" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="458" y="268" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- bottom note -->
  <rect x="60" y="300" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">三步彼此独立，串成一条线性流水线</text>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#888">注意返回值方向：偶数→1，奇数→0（与直觉相反）</text>
</svg>
