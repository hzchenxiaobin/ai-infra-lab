<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3：n=2, m=3，hBars=[2,3]，vBars=[2,4]</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">水平线共 4 条、竖直线共 5 条；两个数组各自独立找最长连续段</text>

  <!-- left panel: hBars -->
  <rect x="25" y="56" width="230" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">水平线（决定高）</text>
  <rect x="60" y="90" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="76" y="111" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="104" y="90" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="111" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="98" y="86" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">差 1</text>
  <path d="M 60 128 L 60 134 L 136 134 L 136 128" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="98" y="150" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">一条连续段，长 2</text>
  <text x="140" y="167" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最大跨度 = 2 + 1 = 3</text>

  <!-- right panel: vBars -->
  <rect x="265" y="56" width="230" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="380" y="78" text-anchor="middle" font-size="12" fill="#a07818" font-weight="bold" filter="url(#rough2)">竖直线（决定宽）</text>
  <rect x="300" y="90" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="111" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="420" y="90" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="436" y="111" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <text x="376" y="112" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">差 2，断开 ✗</text>
  <path d="M 300 128 L 300 133 L 332 133 L 332 128" stroke="#a07818" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 420 128 L 420 133 L 452 133 L 452 128" stroke="#a07818" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="316" y="148" text-anchor="middle" font-size="9.5" fill="#a07818" filter="url(#rough2)">长 1</text>
  <text x="436" y="148" text-anchor="middle" font-size="9.5" fill="#a07818" filter="url(#rough2)">长 1</text>
  <text x="380" y="167" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">最长段 1 ⇒ 最大跨度 = 2</text>

  <!-- result box -->
  <rect x="90" y="186" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">边长 = min(3, 2) = 2，面积 = 2² = 4</text>
  <text x="260" y="220" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">跨度 3 的水平方向只需删 1 条线即可凑成边长 2</text>

  <!-- grid after removal -->
  <text x="130" y="244" font-size="11" fill="#555" filter="url(#rough2)">操作后网格：</text>

  <rect x="190" y="280" width="60" height="60" fill="#e6f4ea" opacity="0.65" filter="url(#rough2)"/>

  <!-- vertical lines 1..5 at x=130,160,190,220,250 -->
  <path d="M 130 250 L 130 340" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 160 250 L 160 340" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 190 250 L 190 340" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 220 250 L 220 340" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 250 250 L 250 340" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- horizontal lines 1..4 at y=250,280,310,340 -->
  <path d="M 130 250 L 250 250" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 130 280 L 250 280" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 130 310 L 250 310" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 130 340 L 250 340" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- X marks on removed lines -->
  <path d="M 213 298 L 227 312 M 227 298 L 213 312" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 173 303 L 187 317 M 187 303 L 173 317" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- hole label -->
  <rect x="190" y="280" width="60" height="60" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="220" y="306" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2×2</text>
  <text x="220" y="324" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">面积 4</text>

  <!-- grid line labels -->
  <text x="118" y="254" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="118" y="284" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="118" y="314" text-anchor="end" font-size="10" fill="#a07818" filter="url(#rough2)">3</text>
  <text x="118" y="344" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="130" y="356" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="160" y="356" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="190" y="356" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="220" y="356" text-anchor="middle" font-size="10" fill="#a07818" filter="url(#rough2)">4</text>
  <text x="250" y="356" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>

  <!-- annotations -->
  <path d="M 255 310 L 268 310" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="274" y="302" font-size="10.5" fill="#b85450" filter="url(#rough2)">删水平线 3 ⇒ 高 2</text>
  <text x="274" y="320" font-size="10.5" fill="#b85450" filter="url(#rough2)">删竖直线 4 ⇒ 宽 2</text>

  <!-- caption -->
  <rect x="90" y="382" width="340" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">只删水平线 3 + 竖直线 4 ⇒ 2×2 正方形空洞，面积 4</text>
</svg>
