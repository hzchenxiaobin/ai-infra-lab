<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：从 f(0) 逐步累加到 f(n)</text>

  <!-- 表头 -->
  <rect x="40" y="50" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n</text>
  <text x="190" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">新增 g(n)</text>
  <text x="360" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">累计 f(n)</text>
  <text x="520" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">含义</text>

  <!-- 行 n=0 -->
  <rect x="40" y="84" width="520" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="107" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0</text>
  <text x="190" y="107" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="360" y="107" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <text x="520" y="107" text-anchor="middle" font-size="11" fill="#888">只有 0</text>

  <!-- 行 n=1 -->
  <rect x="40" y="124" width="520" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="147" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <text x="190" y="147" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">9</text>
  <text x="360" y="147" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">10</text>
  <text x="520" y="147" text-anchor="middle" font-size="11" fill="#888">0..9</text>

  <!-- 行 n=2 高亮 -->
  <rect x="40" y="164" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="189" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="190" y="189" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">9 × 9 = 81</text>
  <text x="360" y="189" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">91</text>
  <text x="520" y="189" text-anchor="middle" font-size="11" fill="#333">= 10 + 81 ✓</text>

  <!-- 行 n=3 -->
  <rect x="40" y="208" width="520" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="231" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <text x="190" y="231" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9×9×8 = 648</text>
  <text x="360" y="231" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">739</text>
  <text x="520" y="231" text-anchor="middle" font-size="11" fill="#888">= 91 + 648</text>

  <!-- 行 n=4 -->
  <rect x="40" y="248" width="520" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="271" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>
  <text x="190" y="271" text-anchor="middle" font-size="12" fill="#333">9×9×8×7 = 4536</text>
  <text x="360" y="271" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5275</text>
  <text x="520" y="271" text-anchor="middle" font-size="11" fill="#888">= 739 + 4536</text>

  <!-- 箭头：n=2 输入 -> 输出 91 -->
  <path d="M 360 204 L 360 216" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 说明框：n=2 详注 -->
  <rect x="40" y="300" width="520" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="321" font-size="11.5" fill="#d6a040" font-weight="bold">以 n=2（示例 1）为例</text>
  <text x="60" y="338" font-size="11" fill="#333">• 1 位数：0..9 共 10 个（f(1)=10）</text>
  <text x="60" y="354" font-size="11" fill="#333">• 2 位数新增：首位 1–9（9 选），次位 0–9 去首位（9 选）→ 9×9=81</text>
  <text x="380" y="354" font-size="11" fill="#b85450" font-weight="bold">f(2)=10+81=91 ✓</text>

  <!-- 上界提示 -->
  <rect x="40" y="374" width="520" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="11" fill="#446688">k &gt; 10 时 (11−k) ≤ 0，g(k)=0（鸽巢：10 个数字必重复），故 f(n)=f(10)</text>
</svg>
