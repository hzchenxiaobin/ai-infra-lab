<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">3 车道道路：侧跳可跳到任意车道，且能越过障碍</text>

  <!-- Point labels 0..4 -->
  <text x="40" y="52" font-size="11" fill="#888" filter="url(#rough2)">点:</text>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="80" y="52" filter="url(#rough2)">0</text>
    <text x="160" y="52" filter="url(#rough2)">1</text>
    <text x="240" y="52" filter="url(#rough2)">2</text>
    <text x="320" y="52" filter="url(#rough2)">3</text>
    <text x="400" y="52" filter="url(#rough2)">4</text>
  </g>

  <!-- Lane labels -->
  <g font-size="12" fill="#666" text-anchor="end">
    <text x="48" y="99" filter="url(#rough2)">1 道</text>
    <text x="48" y="159" filter="url(#rough2)">2 道</text>
    <text x="48" y="219" filter="url(#rough2)">3 道</text>
  </g>

  <!-- Lane lines (faint dashed) -->
  <g stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4" fill="none" filter="url(#rough2)">
    <line x1="60" y1="95" x2="440" y2="95"/>
    <line x1="60" y1="155" x2="440" y2="155"/>
    <line x1="60" y1="215" x2="440" y2="215"/>
  </g>

  <!-- Vertical point guides -->
  <g stroke="#eee" stroke-width="1" fill="none">
    <line x1="80" y1="60" x2="80" y2="250"/>
    <line x1="160" y1="60" x2="160" y2="250"/>
    <line x1="240" y1="60" x2="240" y2="250"/>
    <line x1="320" y1="60" x2="320" y2="250"/>
    <line x1="400" y1="60" x2="400" y2="250"/>
  </g>

  <!-- Obstacles: point1 lane1, point2 lane2, point3 lane3 -->
  <g filter="url(#rough2)">
    <rect x="146" y="80" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="160" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">障</text>
    <rect x="226" y="140" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="240" y="159" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">障</text>
    <rect x="306" y="200" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="320" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">障</text>
  </g>

  <!-- Frog forward path (green) -->
  <g stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)">
    <line x1="92" y1="155" x2="146" y2="155" marker-end="url(#arrG)"/>
    <line x1="172" y1="215" x2="226" y2="215" marker-end="url(#arrG)"/>
    <line x1="252" y1="95" x2="306" y2="95" marker-end="url(#arrG)"/>
    <line x1="332" y1="95" x2="386" y2="95" marker-end="url(#arrG)"/>
  </g>

  <!-- Side jumps (red). jump①: lane2->3 at point1 (down). jump②: lane3->1 at point2 (up, over obstacle) -->
  <g fill="none" filter="url(#rough2)">
    <line x1="160" y1="170" x2="160" y2="202" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <line x1="240" y1="200" x2="240" y2="108" stroke="#b85450" stroke-width="2.6" marker-end="url(#arrR)"/>
  </g>

  <!-- Frog position circles -->
  <g filter="url(#rough2)">
    <circle cx="80" cy="155" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="160" cy="155" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="160" cy="215" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="240" cy="215" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="240" cy="95" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="320" cy="95" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="400" cy="95" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <!-- Start / End labels -->
  <text x="80" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点(2道)</text>
  <text x="400" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终点</text>

  <!-- Side jump labels -->
  <text x="178" y="190" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">侧跳①</text>
  <text x="258" y="155" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">越障侧跳②</text>

  <!-- Caption -->
  <rect x="40" y="280" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">关键：侧跳不要求相邻，可一次跨到任意空闲道并越过障碍</text>
  <text x="280" y="319" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">→ 转移只需 dp[j] = min(dp[j], min(dp)+1)</text>
</svg>
