<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：f(y) = Σ|nums[i] − y| 是凸函数，中位数处最低</text>

  <!-- axes -->
  <path d="M 70 88 L 70 302" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 68 296 L 468 296" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="96" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">f(y)</text>
  <text x="452" y="318" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">y（目标回文数）</text>
  <text x="100" y="118" font-size="10.5" fill="#999" filter="url(#rough2)">拐点在各个 nums[i] 处</text>

  <!-- convex V-shaped polyline -->
  <path d="M 95 100 L 135 190 L 175 245 L 210 268 L 245 275 L 285 266 L 325 240 L 365 200 L 405 155 L 445 100"
        fill="none" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <circle cx="95" cy="100" r="2.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="135" cy="190" r="2.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="175" cy="245" r="2.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="210" cy="268" r="2.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="245" cy="275" r="2.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="285" cy="266" r="2.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="325" cy="240" r="2.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="365" cy="200" r="2.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="405" cy="155" r="2.6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="445" cy="100" r="2.6" fill="#446688" filter="url(#rough2)"/>

  <!-- median -->
  <path d="M 245 275 L 245 296" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="245" cy="296" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="245" y="322" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">中位数 m</text>

  <!-- p_lo -->
  <path d="M 175 296 L 175 245" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="175" cy="296" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="175" y="322" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p_lo</text>
  <text x="175" y="337" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">≤ m 的最大回文数</text>
  <text x="168" y="230" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">代价小 ✓</text>

  <!-- p_hi -->
  <path d="M 325 296 L 325 240" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="325" cy="296" r="5.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="325" y="322" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">p_hi</text>
  <text x="325" y="337" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">≥ m 的最小回文数</text>
  <text x="332" y="226" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">代价小 ✓</text>

  <!-- far palindromes -->
  <path d="M 135 296 L 135 190" stroke="#999" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="135" cy="296" r="4.4" fill="#999" filter="url(#rough2)"/>
  <text x="128" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">代价大 ✗</text>
  <path d="M 405 296 L 405 155" stroke="#999" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="405" cy="296" r="4.4" fill="#999" filter="url(#rough2)"/>
  <text x="405" y="145" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">代价大 ✗</text>
  <text x="270" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（灰色圆点：更远的回文数）</text>

  <!-- note box -->
  <rect x="48" y="362" width="424" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">凸性推论：m 左侧 f 单调不增 ⇒ 更远的回文数代价只会更大；右侧同理。</text>
  <text x="260" y="395" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = min( f(p_lo), f(p_hi) )，只需比较两个候选！</text>
</svg>
