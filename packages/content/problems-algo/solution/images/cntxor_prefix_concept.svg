<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">前缀异或转化：s[i] == s[k+1] ⟺ arr[i..k] 整段异或为 0</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">arr = [2,3,1,6,7]，s[0]=0，s[t] = arr[0]⊕…⊕arr[t−1] ⇒ s = [0, 2, 1, 0, 6, 1]</text>

  <!-- ===== prefix cells row ===== -->
  <!-- 6 cells, width 56, gap 16, start x=80 -->
  <!-- centers: 108, 180, 252, 324, 396, 468 -->
  <g filter="url(#rough2)">
    <rect x="80"  y="120" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="152" y="120" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="224" y="120" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="296" y="120" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="368" y="120" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="440" y="120" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <text x="108" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="180" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="252" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="324" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="396" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="468" y="146" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- index labels -->
  <text x="108" y="178" text-anchor="middle" font-size="10" fill="#888">s₀</text>
  <text x="180" y="178" text-anchor="middle" font-size="10" fill="#888">s₁</text>
  <text x="252" y="178" text-anchor="middle" font-size="10" fill="#888">s₂</text>
  <text x="324" y="178" text-anchor="middle" font-size="10" fill="#888">s₃</text>
  <text x="396" y="178" text-anchor="middle" font-size="10" fill="#888">s₄</text>
  <text x="468" y="178" text-anchor="middle" font-size="10" fill="#888">s₅</text>

  <!-- ===== arc 1: s0 (108) <-> s3 (324), val 0, above ===== -->
  <path d="M 108 120 C 108 80, 324 80, 324 120" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="150" y="74" width="132" height="22" fill="#fffdf3" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="216" y="89" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">s₀==s₃==0 ⇒ 贡献 2</text>

  <!-- ===== arc 2: s2 (252) <-> s5 (468), val 1, below ===== -->
  <path d="M 252 160 C 252 210, 468 210, 468 160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="294" y="196" width="132" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="211" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">s₂==s₅==1 ⇒ 贡献 2</text>

  <!-- ===== segment brackets under prefix row ===== -->
  <!-- arr[0..2]: between s0 and s3 -->
  <path d="M 80 232 L 80 240 L 352 240 L 352 232" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="216" y="256" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">arr[0..2] ⊕ = s₃⊕s₀ = 0，(i,k)=(0,2)，贡献 k−i = 2</text>
  <!-- arr[2..4]: between s2 and s5 -->
  <path d="M 224 268 L 224 276 L 496 276 L 496 268" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="360" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">arr[2..4] ⊕ = s₅⊕s₂ = 0，(i,k)=(2,4)，贡献 k−i = 2</text>

  <!-- ===== conclusion box ===== -->
  <rect x="60" y="312" width="480" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结论</text>
  <text x="78" y="356" font-size="11" fill="#4a7a3a">前缀异或性质：arr[i..k] ⊕ = s[k+1] ⊕ s[i]</text>
  <text x="78" y="374" font-size="11" fill="#4a7a3a">⇒ s[i] == s[k+1] 即意味着整段异或为 0，每对下标贡献 (k − i)</text>
  <text x="78" y="390" font-size="11" fill="#b85450" font-weight="bold">本题答案 = 2 + 2 = 4 ✓</text>
</svg>
