<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：双指针收拢反转前缀</text>

  <ellipse cx="300" cy="62" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <line x1="300" y1="80" x2="300" y2="96" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="100" width="156" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l = 0，r = k − 1</text>
  <text x="388" y="122" font-size="10" fill="#666" filter="url(#rough2)">未处理区间 [0, k)</text>

  <line x1="300" y1="132" x2="300" y2="146" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,150 372,186 300,222 228,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="191" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">l &lt; r ?</text>

  <text x="310" y="240" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <line x1="300" y1="222" x2="300" y2="250" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="254" width="230" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">swap(s[l], s[r])</text>
  <text x="300" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l++；r−−（向中间收拢）</text>

  <path d="M 415 273 L 452 273 L 452 186 L 380 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="176" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">循环 ⌊k/2⌋ 轮</text>

  <text x="155" y="180" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 228 186 L 100 186 L 100 250" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="254" width="112" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="275" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 s</text>

  <line x1="100" y1="286" x2="100" y2="308" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="100" cy="326" rx="44" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="331" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结束</text>

  <text x="335" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">⌊k/2⌋ 轮后指针相遇 / 交错，前缀反转完成</text>
</svg>
