<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#6a9acc"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思想：把 [1, n] 拆成「位数少全取」+「同位数贴上界枚举」</text>

  <!-- n = 135 three slots -->
  <text x="40" y="70" font-size="12.5" fill="#888">n =</text>
  <rect x="78" y="52" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="100" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="126" y="52" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="148" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="174" y="52" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="196" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  <text x="230" y="70" font-size="11" fill="#888">L = 3 位</text>

  <!-- splitting arrows -->
  <path d="M 130 92 Q 90 120 95 145" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 165 92 Q 360 118 380 145" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- left branch: fewer digits -->
  <rect x="30" y="150" width="230" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="145" y="173" text-anchor="middle" font-size="13" fill="#2f5a26" font-weight="bold">位数 &lt; 3（全自由排列）</text>
  <text x="145" y="196" text-anchor="middle" font-size="12" fill="#444">1 位：1~9 → 9 个</text>
  <text x="145" y="216" text-anchor="middle" font-size="12" fill="#444">2 位：9 × 9 = 81 个</text>
  <text x="145" y="240" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">小计 = 9 + 81 = 90</text>
  <text x="145" y="260" text-anchor="middle" font-size="10.5" fill="#888">k 位 = 9 × P(9, k−1)</text>

  <!-- right branch: same length, bounded -->
  <rect x="320" y="150" width="220" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="173" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">位数 = 3 且 ≤ 135</text>
  <text x="430" y="194" text-anchor="middle" font-size="12" fill="#444">逐位填数 + 掩码记已用</text>
  <text x="430" y="214" text-anchor="middle" font-size="11.5" fill="#666">每位取「更小且未用」数字</text>
  <text x="430" y="233" text-anchor="middle" font-size="11.5" fill="#666">× 剩余位排列 P(可用数, 余位)</text>
  <text x="430" y="256" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">小计 = 20</text>

  <!-- mask illustration box -->
  <rect x="320" y="288" width="220" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="308" text-anchor="middle" font-size="12" fill="#7a3a36" font-weight="bold">掩码 mask：已用数字集合</text>
  <text x="430" y="326" text-anchor="middle" font-size="11" fill="#555">填过 1、3 → mask = 1010₂</text>
  <text x="430" y="342" text-anchor="middle" font-size="11" fill="#888">第 d 位为 1 表示 d 已用，禁止再填</text>

  <!-- total -->
  <rect x="30" y="300" width="230" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="324" text-anchor="middle" font-size="13" fill="#444">合计</text>
  <text x="145" y="343" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">90 + 20 = 110 ✓</text>
</svg>
