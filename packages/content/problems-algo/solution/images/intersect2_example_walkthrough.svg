<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：nums1=[4,9,5], nums2=[9,4,9,8,4]</text>

  <!-- Initial counter -->
  <text x="30" y="60" font-size="12" fill="#4a7a3a" font-weight="bold">初始 Counter(nums1)：</text>
  <g font-size="11">
    <rect x="180" y="46" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="215" y="63" text-anchor="middle" fill="#333">4 → 1</text>
    <rect x="255" y="46" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="290" y="63" text-anchor="middle" fill="#333">9 → 1</text>
    <rect x="330" y="46" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="365" y="63" text-anchor="middle" fill="#333">5 → 1</text>
  </g>

  <!-- Step rows -->
  <text x="30" y="96" font-size="11" fill="#888" font-weight="bold">遍历 nums2：</text>

  <!-- Row 1: x=9 -->
  <rect x="30" y="104" width="600" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="128" font-size="12" fill="#333" font-weight="bold">x = 9</text>
  <text x="100" y="128" font-size="11" fill="#4a7a3a">cnt[9]=1 &gt; 0 ✓ 加入</text>
  <text x="260" y="128" font-size="11" fill="#888">cnt[9]: 1 → 0</text>
  <text x="400" y="128" font-size="11" fill="#d6a040" font-weight="bold">result = [9]</text>

  <!-- Row 2: x=4 -->
  <rect x="30" y="148" width="600" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="172" font-size="12" fill="#333" font-weight="bold">x = 4</text>
  <text x="100" y="172" font-size="11" fill="#4a7a3a">cnt[4]=1 &gt; 0 ✓ 加入</text>
  <text x="260" y="172" font-size="11" fill="#888">cnt[4]: 1 → 0</text>
  <text x="400" y="172" font-size="11" fill="#d6a040" font-weight="bold">result = [9, 4]</text>

  <!-- Row 3: x=9 -->
  <rect x="30" y="192" width="600" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="216" font-size="12" fill="#333" font-weight="bold">x = 9</text>
  <text x="100" y="216" font-size="11" fill="#b85450">cnt[9]=0 ✗ 跳过</text>
  <text x="260" y="216" font-size="11" fill="#888">配额已耗尽</text>
  <text x="400" y="216" font-size="11" fill="#888">result = [9, 4]（不变）</text>

  <!-- Row 4: x=8 -->
  <rect x="30" y="236" width="600" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="260" font-size="12" fill="#333" font-weight="bold">x = 8</text>
  <text x="100" y="260" font-size="11" fill="#b85450">cnt[8]=0 ✗ 跳过</text>
  <text x="260" y="260" font-size="11" fill="#888">nums1 中无 8</text>
  <text x="400" y="260" font-size="11" fill="#888">result = [9, 4]（不变）</text>

  <!-- Row 5: x=4 -->
  <rect x="30" y="280" width="600" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="304" font-size="12" fill="#333" font-weight="bold">x = 4</text>
  <text x="100" y="304" font-size="11" fill="#b85450">cnt[4]=0 ✗ 跳过</text>
  <text x="260" y="304" font-size="11" fill="#888">配额已耗尽</text>
  <text x="400" y="304" font-size="11" fill="#888">result = [9, 4]（不变）</text>

  <!-- Final -->
  <rect x="120" y="338" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="330" y="366" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">最终结果 = [9, 4]  ✓</text>

  <!-- note -->
  <rect x="30" y="392" width="600" height="20" fill="none"/>
  <text x="330" y="408" text-anchor="middle" font-size="10" fill="#888">每个值恰好出现 min(nums1 频次, nums2 频次) 次：min(1,2)=1 → 9 出现 1 次；min(1,2)=1 → 4 出现 1 次</text>
</svg>
