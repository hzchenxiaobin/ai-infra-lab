<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">addElement(num) 流程：插入 → 平衡 → 淘汰队首</text>

  <!-- Step 1: enqueue + insert -->
  <rect x="36" y="46" width="488" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 新元素 num 入队 q（FIFO 记录插入顺序）</text>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#666">按值判定落入哪个桶：num ≤ max(lo) → lo；num ≥ min(hi) → hi；否则 → mid</text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: balance decision -->
  <rect x="36" y="112" width="488" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">② 平衡：保证 |lo| ≤ k 且 |hi| ≤ k（插入只会溢出不会不足）</text>
  <text x="120" y="158" font-size="11" fill="#b85450" font-weight="bold">若 |lo| &gt; k：</text>
  <text x="120" y="174" font-size="11" fill="#666">lo 的最大值 → mid（mid_sum += x）</text>
  <text x="330" y="158" font-size="11" fill="#b85450" font-weight="bold">若 |hi| &gt; k：</text>
  <text x="330" y="174" font-size="11" fill="#666">hi 的最小值 → mid（mid_sum += x）</text>

  <path d="M 280 192 L 280 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: decision diamond - window overflow? -->
  <polygon points="280,212 380,256 280,300 180,256" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">|q| &gt; m ?</text>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#888">窗口已满需淘汰</text>

  <!-- No branch -->
  <path d="M 380 256 L 430 256 L 430 370" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="250" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="380" y="362" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结束，返回</text>

  <!-- Yes branch -->
  <path d="M 180 256 L 100 256 L 100 312" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="250" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- Step 4: remove old -->
  <rect x="36" y="316" width="200" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ 淘汰队首 old = q.pop()</text>
  <text x="44" y="358" font-size="10" fill="#666">old ≤ max(lo)：lo 删 old</text>
  <text x="44" y="372" font-size="10" fill="#888">  → mid 最小值补入 lo</text>
  <text x="44" y="386" font-size="10" fill="#666">old ≥ min(hi)：hi 删 old</text>
  <text x="196" y="372" font-size="10" fill="#888" text-anchor="end">→ mid 最大值补入 hi</text>
  <text x="196" y="386" font-size="10" fill="#666" text-anchor="end">否则：mid 删 old（不补）</text>

  <!-- Note about duplicate boundary -->
  <rect x="250" y="316" width="270" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="385" y="334" text-anchor="middle" font-size="10" fill="#888">💡 边界等值时 old 可能在 lo 或 mid，</text>
  <text x="385" y="348" text-anchor="middle" font-size="10" fill="#888">但值相同 → 删哪个都行，平衡后桶内容一致</text>

  <!-- calculateMKAverage box -->
  <rect x="36" y="410" width="488" height="0" fill="none"/>
</svg>
