<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：check(a, b) ∨ check(b, a)</text>

  <!-- Top: entry -->
  <rect x="220" y="40" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">checkPalindromeFormation</text>

  <!-- branch to two checks -->
  <path d="M290,74 L290,88 L160,88 L160,100" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M290,74 L290,88 L420,88 L420,100" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="84" font-size="10" fill="#446688" font-weight="bold">check(a,b)</text>
  <text x="360" y="84" font-size="10" fill="#446688" font-weight="bold">check(b,a)</text>

  <!-- check(a,b) box -->
  <rect x="80" y="104" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">check(a, b)</text>

  <!-- check(b,a) box -->
  <rect x="340" y="104" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">check(b, a)</text>

  <!-- OR node -->
  <ellipse cx="290" cy="160" rx="24" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">∨</text>
  <path d="M160,134 L160,148 L270,160" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M420,134 L420,148 L310,160" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result true -->
  <path d="M290,176 L290,196" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="198" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <!-- check function detail (left side) -->
  <text x="30" y="250" font-size="12" fill="#888" font-weight="bold">check(s₁, s₂) 内部流程：</text>

  <!-- Step 1: init -->
  <rect x="30" y="260" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="280" text-anchor="middle" font-size="11" fill="#333">l=0, r=n−1</text>
  <path d="M190,275 L210,275" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: diamond - a[l]==b[r] and l<r? -->
  <polygon points="290,255 370,275 290,295 210,275" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="273" text-anchor="middle" font-size="10" fill="#444">l&lt;r 且</text>
  <text x="290" y="285" text-anchor="middle" font-size="10" fill="#444">s₁[l]==s₂[r]?</text>

  <!-- yes: l++, r-- -->
  <path d="M290,255 L290,240 L420,240 L420,260" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="360" y="260" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="280" text-anchor="middle" font-size="11" fill="#333">l++, r−−</text>
  <!-- loop back -->
  <path d="M420,260 L420,232 L290,232 L290,255" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="355" y="228" font-size="9" fill="#4a7a3a">循环</text>

  <!-- no: check l>=r -->
  <path d="M210,275 L195,275 L195,320 L220,320" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="300" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <text x="360" y="250" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- diamond: l >= r? -->
  <polygon points="290,305 360,325 290,345 220,325" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="329" text-anchor="middle" font-size="11" fill="#444">l ≥ r ?</text>

  <!-- yes: return true -->
  <path d="M290,305 L290,288 L460,288 L460,310" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="400" y="310" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>
  <text x="380" y="284" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- no: check palindrome -->
  <path d="M290,345 L290,362 L290,375" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="298" y="360" font-size="9" fill="#b85450" font-weight="bold">否</text>

  <!-- palindrome check box -->
  <rect x="150" y="378" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="400" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">isPalindrome(s₁, l, r) ∨ isPalindrome(s₂, l, r)</text>

  <!-- result -->
  <path d="M290,412 L290,428" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="430" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="448" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return true / false</text>
</svg>
