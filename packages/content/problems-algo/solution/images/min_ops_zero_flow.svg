<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：从低位到高位逐位贪心 + 进位</text>

  <!-- start -->
  <rect x="200" y="44" width="120" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="13" fill="#333">初始化 ans = 0</text>
  <line x1="260" y1="74" x2="260" y2="96" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond n==0? -->
  <polygon points="260,96 340,136 260,176 180,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="13" fill="#7a5a10">n == 0 ?</text>
  <text x="260" y="149" text-anchor="middle" font-size="13" fill="#7a5a10">（结束）</text>

  <!-- yes -> return -->
  <line x1="340" y1="136" x2="392" y2="136" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a">是</text>
  <rect x="392" y="120" width="110" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="447" y="141" text-anchor="middle" font-size="13" fill="#4a7a3a">返回 ans</text>

  <!-- no down -->
  <line x1="260" y1="176" x2="260" y2="204" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="194" text-anchor="start" font-size="12" fill="#b85450">否</text>

  <!-- diamond n&1==0? -->
  <polygon points="260,204 340,242 260,280 180,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="239" text-anchor="middle" font-size="13" fill="#7a5a10">最低位是 0 ?</text>
  <text x="260" y="255" text-anchor="middle" font-size="12" fill="#7a5a10">(n &amp; 1) == 0</text>

  <!-- yes -> shift -->
  <line x1="180" y1="242" x2="118" y2="242" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="234" text-anchor="middle" font-size="12" fill="#446688">是</text>
  <rect x="30" y="226" width="88" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="247" text-anchor="middle" font-size="13" fill="#333">n >>= 1</text>
  <text x="74" y="276" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">此位无需操作</text>

  <!-- no down -->
  <line x1="260" y1="280" x2="260" y2="308" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="298" text-anchor="start" font-size="12" fill="#b85450">否（最低位是 1）</text>

  <!-- diamond n&2? -->
  <polygon points="260,308 340,344 260,380 180,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="13" fill="#7a5a10">下一位也是 1 ?</text>
  <text x="260" y="357" text-anchor="middle" font-size="12" fill="#7a5a10">(n &amp; 2) ≠ 0</text>

  <!-- yes -> n+=1 -->
  <line x1="340" y1="344" x2="392" y2="344" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a">是</text>
  <rect x="392" y="326" width="110" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="447" y="344" text-anchor="middle" font-size="12" fill="#4a7a3a">n += 1 （进位）</text>
  <text x="447" y="358" text-anchor="middle" font-size="12" fill="#4a7a3a">ans += 1</text>

  <!-- no -> n>>=1 -->
  <line x1="180" y1="344" x2="128" y2="344" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="154" y="336" text-anchor="middle" font-size="12" fill="#446688">否</text>
  <rect x="30" y="326" width="98" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="344" text-anchor="middle" font-size="12" fill="#333">n >>= 1（减 2⁰）</text>
  <text x="79" y="358" text-anchor="middle" font-size="12" fill="#333">ans += 1</text>

  <!-- loop back arrow: from bottom rects up the left side back to top diamond -->
  <path d="M74,326 L74,206 Q74,196 84,196 L168,196 Q178,196 178,196" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M447,326 L447,196" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="100" y="200" font-size="11" fill="#888" filter="url(#rough2)">循环回 n==0?</text>
</svg>
