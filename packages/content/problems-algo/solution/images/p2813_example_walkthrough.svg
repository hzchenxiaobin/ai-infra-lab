<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：items=[[3,1],[3,1],[2,2],[5,3]], k=3</text>

  <!-- sorted strip label -->
  <text x="30" y="52" font-size="11" fill="#888">按 profit 降序排序：</text>

  <!-- sorted items: [5,3] [3,1] [3,1] [2,2] -->
  <rect x="30" y="60" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="60" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="60" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a">类别3</text>

  <rect x="100" y="60" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="130" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a">类别1</text>

  <rect x="170" y="60" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="200" y="96" text-anchor="middle" font-size="9" fill="#b85450">类别1(重)</text>

  <rect x="240" y="60" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="270" y="96" text-anchor="middle" font-size="9" fill="#d6a040">类别2</text>

  <!-- bracket: top k -->
  <text x="320" y="74" font-size="10" fill="#446688">↑ 前 k=3 项</text>
  <text x="320" y="90" font-size="10" fill="#888">第 4 项待处理</text>

  <!-- separator -->
  <path d="M 30 120 L 530 120" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== State 1: initial ===== -->
  <text x="30" y="146" font-size="12" fill="#446688" font-weight="bold">状态 1：取前 3 项（初始骨架）</text>

  <!-- selected items -->
  <rect x="30" y="156" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="60" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="60" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a">类别3</text>

  <rect x="100" y="156" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="130" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a">类别1</text>

  <rect x="170" y="156" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="200" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="200" y="188" text-anchor="middle" font-size="9" fill="#b85450">类别1(重)</text>

  <!-- stack -->
  <text x="320" y="150" font-size="10" fill="#b85450" font-weight="bold">反悔栈</text>
  <rect x="300" y="156" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="171" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="358" y="172" font-size="9" fill="#b85450">← 栈顶</text>

  <!-- metrics box 1 -->
  <rect x="30" y="206" width="360" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="226" font-size="11" fill="#333">total = 5+3+3 = <tspan font-weight="bold" fill="#446688">11</tspan></text>
  <text x="230" y="226" font-size="11" fill="#333">distinct = {3,1} = <tspan font-weight="bold" fill="#446688">2</tspan></text>
  <text x="40" y="246" font-size="11" fill="#333">优雅度 = 11 + 2² = <tspan font-weight="bold" fill="#b85450">15</tspan>  →  ans = <tspan font-weight="bold" fill="#b85450">15</tspan></text>

  <!-- ===== State 2: after swap ===== -->
  <text x="30" y="290" font-size="12" fill="#d6a040" font-weight="bold">状态 2：第 4 项 [2,类别2] 是新类别 → 弹栈替换</text>

  <!-- replacement visual -->
  <!-- removed (popped) item -->
  <rect x="30" y="300" width="60" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="60" y="316" text-anchor="middle" font-size="11" fill="#999" text-decoration="line-through">3</text>
  <text x="60" y="332" text-anchor="middle" font-size="9" fill="#999">类别1</text>
  <text x="60" y="352" text-anchor="middle" font-size="9" fill="#b85450">换出</text>

  <!-- arrow -->
  <path d="M 100 320 L 150 320" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- new item comes in -->
  <rect x="160" y="300" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="190" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="190" y="332" text-anchor="middle" font-size="9" fill="#d6a040">类别2</text>
  <text x="190" y="352" text-anchor="middle" font-size="9" fill="#4a7a3a">换入</text>

  <!-- final selected set -->
  <text x="245" y="316" font-size="10" fill="#666">→ 候选集：</text>
  <rect x="320" y="300" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="342" y="316" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="342" y="332" text-anchor="middle" font-size="8" fill="#4a7a3a">类3</text>
  <rect x="368" y="300" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="390" y="316" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="390" y="332" text-anchor="middle" font-size="8" fill="#4a7a3a">类1</text>
  <rect x="416" y="300" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="438" y="316" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="438" y="332" text-anchor="middle" font-size="8" fill="#4a7a3a">类2</text>

  <!-- metrics box 2 -->
  <rect x="30" y="366" width="500" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="386" font-size="11" fill="#333">total += 2 − 3 = <tspan font-weight="bold" fill="#d6a040">10</tspan></text>
  <text x="250" y="386" font-size="11" fill="#333">distinct = {3,1,2} = <tspan font-weight="bold" fill="#d6a040">3</tspan></text>
  <text x="40" y="408" font-size="12" fill="#333" font-weight="bold">优雅度 = 10 + 3² = <tspan font-size="14" fill="#b85450">19</tspan>  →  ans = <tspan font-size="14" fill="#b85450">19</tspan> ✓</text>

  <!-- bottom note -->
  <rect x="40" y="430" width="480" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="445" text-anchor="middle" font-size="10" fill="#446688">利润 11→10（少 1）换得 distinct 2→3（多 1），平方增益 5 &gt; 损失 1，故反悔划算</text>
</svg>
