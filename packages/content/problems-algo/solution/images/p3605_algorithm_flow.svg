<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="620" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：二分答案 k，check = 等长区间选点贪心</text>

  <g filter="url(#rough2)">
    <rect x="115" y="36" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="190" y="55" text-anchor="middle" font-size="11" fill="#333">读入 nums, maxC</text>
    <line x1="190" y1="64" x2="190" y2="78" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="70" y="78" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="190" y="98" text-anchor="middle" font-size="10.5" fill="#333">① 建 ST 表：静态区间 gcd O(1) 查询</text>
    <line x1="190" y1="110" x2="190" y2="124" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="70" y="124" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="190" y="144" text-anchor="middle" font-size="10.5" fill="#333">② 双指针求 len[i]（右端 R 只进不退）</text>
    <line x1="190" y1="156" x2="190" y2="170" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="70" y="170" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="190" y="190" text-anchor="middle" font-size="10.5" fill="#333">③ 二分初始化：lo=0，hi=max(len)</text>
    <line x1="190" y1="202" x2="190" y2="216" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="190,216 262,246 190,276 118,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="190" y="250" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">lo &lt; hi ?</text>
    <text x="200" y="288" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>
    <text x="80" y="238" font-size="9.5" fill="#b85450" font-weight="bold">否</text>

    <rect x="70" y="290" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="190" y="309" text-anchor="middle" font-size="10.5" fill="#333">mid=(lo+hi)/2；L=mid+1；cnt=0</text>
    <line x1="190" y1="320" x2="190" y2="334" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="55" y="334" width="270" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="190" y="353" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">逐窗扫描（i + L ≤ n）：</text>
    <text x="190" y="371" text-anchor="middle" font-size="10" fill="#8a6d1f">len[i]≥L ⟹ 落针 cnt++、i+=L；否则 i+=1</text>
    <line x1="190" y1="386" x2="190" y2="400" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="190,400 262,430 190,460 118,430" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="190" y="434" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">cnt ≤ maxC ?</text>

    <line x1="262" y1="430" x2="300" y2="430" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="272" y="423" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="300" y="414" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="395" y="434" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">可行：hi = mid</text>

    <path d="M 190 460 V 486 H 300" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="200" y="478" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
    <rect x="300" y="470" width="190" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="395" y="490" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">不可行：lo = mid+1</text>

    <line x1="490" y1="430" x2="505" y2="430" stroke="#446688" stroke-width="1.8"/>
    <line x1="490" y1="486" x2="505" y2="486" stroke="#446688" stroke-width="1.8"/>
    <path d="M 505 486 V 246 H 264" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="475" y="238" font-size="9.5" fill="#446688">更新 lo/hi 后回到二分</text>

    <path d="M 118 246 H 40 V 563 H 105" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="105" y="545" width="170" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="190" y="560" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">输出 lo</text>
    <text x="190" y="575" text-anchor="middle" font-size="9" fill="#4a7a3a">（最小稳定性因子）</text>
  </g>
</svg>
