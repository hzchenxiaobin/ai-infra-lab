<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 428"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="428" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：不同字符数只有 1 / 2 / 3 ⟹ 分类，各类配一个「前缀签名」</text>

  <!-- 情形一：单字符游程 -->
  <rect x="20" y="40" width="520" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="73" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 只有 1 种字符</text>
  <rect x="170" y="56" width="26" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="204" y="56" width="26" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="238" y="56" width="26" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="272" y="56" width="26" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="74" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">c</text>
  <text x="217" y="74" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">c</text>
  <text x="251" y="74" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">c</text>
  <text x="285" y="74" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">c</text>
  <path d="M 308 69 L 336 69" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="344" y="73" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⟹ 最长同字符游程</text>

  <!-- 情形二：恰两种字符 -->
  <rect x="20" y="116" width="520" height="128" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="140" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 恰 2 种字符 {x, y}</text>
  <text x="104" y="169" font-size="10" fill="#666" filter="url(#rough2)">s =</text>
  <rect x="140" y="152" width="26" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="175" y="152" width="26" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="152" width="26" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="245" y="152" width="26" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="170" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="188" y="170" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="223" y="170" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="258" y="170" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="94" y="192" font-size="8" fill="#999" filter="url(#rough2)">i:</text>
  <text x="117" y="192" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="153" y="192" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="188" y="192" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="223" y="192" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>
  <text x="258" y="192" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>
  <text x="64" y="212" font-size="9.5" fill="#666" filter="url(#rough2)">a−b:</text>
  <rect x="102" y="196" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="138" y="196" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="173" y="196" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="196" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="243" y="196" width="30" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="213" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="153" y="213" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">+1</text>
  <text x="188" y="213" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="223" y="213" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">−1</text>
  <text x="258" y="213" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">0</text>
  <ellipse cx="117" cy="208" rx="20" ry="15" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <ellipse cx="258" cy="208" rx="20" ry="15" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 122 236 L 252 236" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="240" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">"abba" 长度 4</text>
  <text x="336" y="160" font-size="10" fill="#33506b" filter="url(#rough2)">签名 (Δx−Δy, Δz)：</text>
  <text x="336" y="178" font-size="10" fill="#33506b" filter="url(#rough2)">差相等 ⇒ Δx = Δy</text>
  <text x="336" y="196" font-size="10" fill="#33506b" filter="url(#rough2)">Δz = 0 ⇒ 不含第三字符</text>
  <text x="336" y="214" font-size="10" fill="#33506b" filter="url(#rough2)">三个字符对各配一张表</text>

  <!-- 情形三：三种字符齐全 -->
  <rect x="20" y="252" width="520" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="276" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ 3 种字符齐全</text>
  <text x="110" y="300" font-size="10" fill="#666" filter="url(#rough2)">s =</text>
  <rect x="140" y="284" width="30" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="182" y="284" width="30" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="284" width="30" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="266" y="284" width="30" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="308" y="284" width="30" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="284" width="30" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="300" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">a</text>
  <text x="197" y="300" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">b</text>
  <text x="239" y="300" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">c</text>
  <text x="281" y="300" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">a</text>
  <text x="323" y="300" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">b</text>
  <text x="365" y="300" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">c</text>
  <text x="90" y="318" font-size="8" fill="#999" filter="url(#rough2)">i:</text>
  <text x="113" y="318" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="155" y="318" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="197" y="318" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="239" y="318" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>
  <text x="281" y="318" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>
  <text x="323" y="318" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">5</text>
  <text x="365" y="318" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">6</text>
  <rect x="94" y="322" width="38" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="322" width="38" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="178" y="322" width="38" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="322" width="38" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="322" width="38" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="322" width="38" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="346" y="322" width="38" height="24" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="338" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">(0,0)</text>
  <text x="155" y="338" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">(−1,−1)</text>
  <text x="197" y="338" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">(0,−1)</text>
  <text x="239" y="338" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">(0,0)</text>
  <text x="281" y="338" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">(−1,−1)</text>
  <text x="323" y="338" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">(0,−1)</text>
  <text x="365" y="338" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">(0,0)</text>
  <ellipse cx="113" cy="334" rx="24" ry="14" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <ellipse cx="365" cy="334" rx="24" ry="14" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="396" y="292" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">两分量相等</text>
  <text x="396" y="308" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">⇒ Δa=Δb=Δc</text>
  <text x="396" y="324" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">非空 ⇒ 全 &gt; 0</text>
  <text x="94" y="360" font-size="10" fill="#b85450" filter="url(#rough2)">i=0 与 i=6 同签名 (0,0) ⇒ "abcabc" 长度 6（每种字符各 2 次）</text>

  <!-- 统一骨架 -->
  <rect x="20" y="372" width="520" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">统一骨架：前缀签名相同的两个下标 i &lt; j ⇒ 子串 (i, j] 各字符增量相等 ⇒ 平衡</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">哈希表只记首现下标 ⇒ 一趟扫描取得最长（情形① 游程另算）</text>
</svg>
