<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：被迫贪心 + 把目标值 T 当未知数</text>

  <!-- ============ 左半：被迫性 ============ -->
  <text x="140" y="52" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 行优先扫描，操作被迫</text>

  <!-- 4x4 网格, cell=36, origin (58,68) -->
  <g filter="url(#rough2)">
    <rect x="58" y="68" width="144" height="144" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <path d="M 94 68 L 94 212 M 130 68 L 130 212 M 166 68 L 166 212" stroke="#446688" stroke-width="1"/>
    <path d="M 58 104 L 202 104 M 58 140 L 202 140 M 58 176 L 202 176" stroke="#446688" stroke-width="1"/>
  </g>
  <!-- 扫描序号 -->
  <g filter="url(#rough2)" font-size="7.5" fill="#8a9bb0">
    <text x="61" y="78">1</text><text x="97" y="78">2</text><text x="133" y="78">3</text><text x="169" y="78">4</text>
    <text x="61" y="114">5</text><text x="97" y="114">6</text><text x="133" y="114">7</text><text x="169" y="114">8</text>
    <text x="61" y="150">9</text><text x="97" y="150">10</text><text x="133" y="150">11</text><text x="169" y="150">12</text>
    <text x="61" y="186">13</text><text x="97" y="186">14</text><text x="133" y="186">15</text><text x="169" y="186">16</text>
  </g>
  <!-- 覆盖窗口（虚线）：行 1-2 × 列 1-2 -->
  <rect x="94" y="104" width="72" height="72" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <!-- 已决定锚点 (1,1)(1,2)(2,1)：左上角橙色小块 -->
  <g filter="url(#rough2)">
    <rect x="95" y="105" width="9" height="9" fill="#d6a040"/>
    <rect x="131" y="105" width="9" height="9" fill="#d6a040"/>
    <rect x="95" y="141" width="9" height="9" fill="#d6a040"/>
  </g>
  <!-- 当前格 (2,2) -->
  <rect x="130" y="140" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(i,j)</text>

  <text x="34" y="120" text-anchor="middle" font-size="10" fill="#a07020" font-weight="bold" filter="url(#rough2)">已定</text>
  <path d="M 48 124 L 90 124" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="152" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">唯一未决!</text>
  <path d="M 228 156 L 172 156" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" fill="#33506b" text-anchor="middle">
    <text x="140" y="232">扫到 (i,j)：能覆盖它的 k×k 操作里，</text>
    <text x="140" y="248">只有「以 (i,j) 为左上角」的还没定 → 放几块被迫唯一</text>
  </g>

  <!-- 分隔线 -->
  <path d="M 288 44 L 288 256" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>

  <!-- ============ 右半：对齐格 ============ -->
  <text x="424" y="52" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 对齐格：每个 k×k 窗口恰一个</text>

  <!-- 5x5 网格, cell=28, origin (338,68)，k=2 -->
  <g filter="url(#rough2)">
    <rect x="338" y="68" width="140" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <path d="M 366 68 L 366 208 M 394 68 L 394 208 M 422 68 L 422 208 M 450 68 L 450 208" stroke="#446688" stroke-width="1"/>
    <path d="M 338 96 L 478 96 M 338 124 L 478 124 M 338 152 L 478 152 M 338 180 L 478 180" stroke="#446688" stroke-width="1"/>
    <!-- 条带：底行 + 右列 -->
    <rect x="338" y="180" width="140" height="28" fill="#fff8e1"/>
    <rect x="450" y="68" width="28" height="112" fill="#fff8e1"/>
  </g>
  <!-- 对齐锚点 (0,0)(0,2)(2,0)(2,2) -->
  <g filter="url(#rough2)">
    <rect x="339" y="69" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="395" y="69" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="339" y="125" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="395" y="125" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#2f5d24" font-weight="bold" text-anchor="middle">
    <text x="352" y="86">锚</text><text x="408" y="86">锚</text>
    <text x="352" y="142">锚</text><text x="408" y="142">锚</text>
  </g>
  <!-- 一个 k×k 窗口（虚线）：行 2-3 × 列 2-3 -->
  <rect x="394" y="124" width="56" height="56" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="422" y="196" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口内恰 1 个对齐位</text>
  <text x="408" y="226" text-anchor="middle" font-size="10" fill="#a07020" font-weight="bold" filter="url(#rough2)">条带：值被等式钉死</text>
  <path d="M 408 216 L 408 202" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" fill="#33506b" text-anchor="middle">
    <text x="424" y="248">对齐锚点放 x = T − β；其余锚点放 x = −β（与 T 无关）</text>
  </g>

  <!-- ============ 底部结论框 ============ -->
  <g filter="url(#rough2)">
    <rect x="26" y="268" width="508" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="290" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">约束系统（一遍扫描即得）</text>
    <text x="280" y="312" text-anchor="middle" font-size="10.5" fill="#33506b">锚点格：x = (1−α)·T − β ≥ 0 —— 对齐给下界 T ≥ β，非对齐给与 T 无关的检查（β ≤ 0）</text>
    <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#33506b">非锚点格（下/右条带）：(1−α)·T = β —— 等式：T 被钉死（或必须 β = 0），冲突即 −1</text>
    <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#33506b">每格覆盖量 = α·T + β，α ∈ {0,1}（对齐格引理），操作数 = Σx = (mn·T − S)/k² 随 T 单调增</text>
    <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">→ 解出最小可行 T*，答案 = Σx(T*)，无须逐个试 T</text>
  </g>
</svg>
