<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto">
      <path d="M0,8 L5,2 L10,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：叶子是值，非叶是运算符，自底向上求值</text>

  <!-- root: 2 (OR) -->
  <circle cx="270" cy="76" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="270" y="58" text-anchor="middle" font-size="10" fill="#d6a040">OR</text>

  <!-- edges level 1 -->
  <path d="M 256 92 L 196 138" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 284 92 L 344 138" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left child: 1 (leaf true) -->
  <circle cx="180" cy="156" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="162" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="180" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a">true</text>

  <!-- right child: 3 (AND) -->
  <circle cx="360" cy="156" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="162" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="360" y="138" text-anchor="middle" font-size="10" fill="#446688">AND</text>

  <!-- edges level 2 under AND -->
  <path d="M 346 172 L 296 218" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 374 172 L 424 218" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- AND left leaf: 0 (false) -->
  <circle cx="280" cy="236" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="280" y="218" text-anchor="middle" font-size="10" fill="#b85450">false</text>

  <!-- AND right leaf: 1 (true) -->
  <circle cx="440" cy="236" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="440" y="242" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="440" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a">true</text>

  <!-- bottom-up evaluation arrows -->
  <path d="M 360 200 L 360 178" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="384" y="196" font-size="10" fill="#b85450">先算</text>

  <!-- result chips -->
  <rect x="306" y="266" width="108" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="360" y="285" text-anchor="middle" font-size="11" fill="#8a6a20">false AND true</text>
  <text x="442" y="285" font-size="10" fill="#b85450" font-weight="bold">= false</text>

  <path d="M 270 110 L 270 88" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <rect x="180" y="298" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="317" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true OR false = true ✓</text>

  <!-- legend -->
  <text x="40" y="356" font-size="10" fill="#888">叶子 0/1 = 布尔值（绿=true 粉=false）</text>
  <text x="40" y="374" font-size="10" fill="#888">非叶 2/3 = OR / AND 运算符</text>
</svg>
