<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三类间隙：把 -1 段翻译成约束</text>

  <!-- Row 1: 单个 -1 -->
  <text x="26" y="72" font-size="13" fill="#4a7a3a" filter="url(#rough2)">单个 -1</text>
  <rect x="110" y="52" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="162" y="52" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="72" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">v</text>
  <rect x="214" y="52" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="278" y="64" font-size="12" fill="#555" filter="url(#rough2)">v 只能取 x 或 y：</text>
  <text x="278" y="80" font-size="12" fill="#b85450" filter="url(#rough2)">v ∈ [hi−d, lo+d]</text>

  <!-- Row 2: 双 -1 -->
  <text x="14" y="132" font-size="13" fill="#4a7a3a" filter="url(#rough2)">连续 2 个</text>
  <rect x="110" y="112" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="162" y="112" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="132" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">?</text>
  <rect x="214" y="112" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="237" y="132" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">?</text>
  <rect x="266" y="112" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="330" y="124" font-size="12" fill="#555" filter="url(#rough2)">两格同值 v：如上；</text>
  <text x="330" y="140" font-size="12" fill="#b85450" filter="url(#rough2)">或横跨 x…y（|x−y|≤d）</text>

  <!-- Row 3: 长段压缩 -->
  <text x="14" y="192" font-size="13" fill="#4a7a3a" filter="url(#rough2)">长段压缩</text>
  <rect x="110" y="172" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="156" y="172" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="194" y="172" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="172" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="172" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="312" y="172" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="375" y="186" font-size="16" fill="#446688" filter="url(#rough2)">≡</text>
  <rect x="396" y="172" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="442" y="172" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="480" y="172" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="222" font-size="12" fill="#555" filter="url(#rough2)">中间交替填 x/y，多出的格子不产生新约束</text>

  <!-- Row 4: 哨兵 -->
  <text x="14" y="284" font-size="13" fill="#4a7a3a" filter="url(#rough2)">贴边补哨兵</text>
  <rect x="110" y="264" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="264" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="186" y="264" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="240" y="278" font-size="12" fill="#555" filter="url(#rough2)">开头有 -1？把 b 复制一份贴到最左</text>
  <path d="M 236 300 C 210 316 180 316 156 302" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="96" y="316" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="336" text-anchor="middle" font-size="12" fill="#2d5523" filter="url(#rough2)">b</text>
  <rect x="142" y="316" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="316" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="218" y="316" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="280" y="330" font-size="12" fill="#555" filter="url(#rough2)">变成 (b,b) 夹住的普通段，</text>
  <text x="280" y="346" font-size="12" fill="#555" filter="url(#rough2)">约束完全等价、代码零特判</text>

  <!-- legend -->
  <rect x="110" y="366" width="16" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="132" y="377" font-size="11" fill="#555" filter="url(#rough2)">已知值</text>
  <rect x="184" y="366" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="206" y="377" font-size="11" fill="#555" filter="url(#rough2)">待填 x/y</text>
  <rect x="268" y="366" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="377" font-size="11" fill="#555" filter="url(#rough2)">可压缩/可省略</text>
</svg>
