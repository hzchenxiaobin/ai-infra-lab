<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 → 求总和 → 最大化保留数 → 相减</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">核心：min removed = total − max (n−i)·beans[i]</text>

  <!-- ===== Step 1: sort ===== -->
  <rect x="60" y="70" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="92" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① 排序（升序）</text>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#555">beans.sort()</text>
  <text x="150" y="122" text-anchor="middle" font-size="9.5" fill="#888">O(n log n)</text>

  <!-- arrow down -->
  <path d="M 150 128 L 150 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- ===== Step 2: total ===== -->
  <rect x="60" y="150" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 求总和 total</text>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#555">total = Σ beans[k]</text>
  <text x="150" y="202" text-anchor="middle" font-size="9.5" fill="#888">一次遍历 O(n)</text>

  <!-- arrow down -->
  <path d="M 150 208 L 150 226" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- ===== Step 3: loop maximize ===== -->
  <rect x="60" y="230" width="180" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">③ 遍历最大化</text>
  <text x="150" y="270" text-anchor="middle" font-size="10" fill="#555">for i in 0..n−1:</text>
  <text x="150" y="284" text-anchor="middle" font-size="10" fill="#555">  keep = (n−i)·beans[i]</text>
  <text x="150" y="296" text-anchor="middle" font-size="9.5" fill="#888">维护 maxKeep</text>

  <!-- arrow down -->
  <path d="M 150 296 L 150 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- ===== Step 4: return ===== -->
  <rect x="60" y="318" width="180" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="340" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">④ 返回结果</text>
  <text x="150" y="358" text-anchor="middle" font-size="11" fill="#333">return total − maxKeep</text>
  <text x="150" y="370" text-anchor="middle" font-size="9.5" fill="#888">注意用 long long</text>

  <!-- ===== Right: worked trace for [4,1,2,3] ===== -->
  <line x1="270" y1="60" x2="270" y2="380" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="415" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">代入 beans = [4,1,2,3]</text>

  <!-- trace: sort -->
  <rect x="300" y="84" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="106" text-anchor="middle" font-size="10.5" fill="#333">排序后 → [1, 2, 3, 4]</text>

  <!-- trace: total -->
  <rect x="300" y="130" width="230" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="152" text-anchor="middle" font-size="10.5" fill="#333">total = 1+2+3+4 = 10</text>

  <!-- trace: loop values -->
  <rect x="300" y="176" width="230" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="415" y="194" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">枚举每个 i：</text>
  <text x="315" y="210" font-size="9.5" fill="#555">i=0: 4·1=4</text>
  <text x="315" y="224" font-size="9.5" fill="#555">i=1: 3·2=6 ←</text>
  <text x="315" y="238" font-size="9.5" fill="#555">i=2: 2·3=6 ←</text>
  <text x="315" y="252" font-size="9.5" fill="#555">i=3: 1·4=4</text>
  <text x="415" y="252" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">maxKeep=6</text>

  <!-- trace: return -->
  <rect x="300" y="272" width="230" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="415" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = 10 − 6 = 4 ✓</text>

  <!-- connecting arrows left->right per step -->
  <path d="M 240 98 L 296 98" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <path d="M 240 178 L 296 147" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <path d="M 240 262 L 296 218" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>
  <path d="M 240 346 L 296 289" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 3"/>

  <!-- footer note -->
  <text x="415" y="330" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">无需去重：重复值后继位置</text>
  <text x="415" y="344" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">乘积更小，不会成为最优</text>
</svg>
