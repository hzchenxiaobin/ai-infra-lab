<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每个值的归属用一个 3 位掩码表示</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">数组 i 内去重 → 对值 v 的掩码「或」上第 i 位 → popcount ≥ 2 即入选</text>

  <!-- Three arrays row -->
  <text x="28" y="78" font-size="11" fill="#666" font-weight="bold">三个数组</text>

  <!-- nums1 -->
  <rect x="60" y="60" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="81" text-anchor="middle" font-size="11" fill="#333">nums1</text>
  <text x="120" y="106" text-anchor="middle" font-size="9.5" fill="#888">bit 0</text>

  <!-- nums2 -->
  <rect x="210" y="60" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="81" text-anchor="middle" font-size="11" fill="#333">nums2</text>
  <text x="270" y="106" text-anchor="middle" font-size="9.5" fill="#888">bit 1</text>

  <!-- nums3 -->
  <rect x="360" y="60" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="81" text-anchor="middle" font-size="11" fill="#333">nums3</text>
  <text x="420" y="106" text-anchor="middle" font-size="9.5" fill="#888">bit 2</text>

  <!-- arrows down to a single value v -->
  <path d="M 120 112 L 220 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 112 L 270 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 112 L 320 150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- value v box (highlight) -->
  <rect x="200" y="148" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="170" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">值 v 的掩码 mask[v]</text>

  <!-- 3-bit mask visualization -->
  <text x="28" y="216" font-size="11" fill="#666" font-weight="bold">3 位掩码</text>

  <!-- bit 2 (nums3) -->
  <rect x="160" y="200" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b₂</text>
  <text x="190" y="248" text-anchor="middle" font-size="9.5" fill="#d6a040">nums3?</text>

  <!-- bit 1 (nums2) -->
  <rect x="240" y="200" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b₁</text>
  <text x="270" y="248" text-anchor="middle" font-size="9.5" fill="#4a7a3a">nums2?</text>

  <!-- bit 0 (nums1) -->
  <rect x="320" y="200" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="350" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b₀</text>
  <text x="350" y="248" text-anchor="middle" font-size="9.5" fill="#446688">nums1?</text>

  <!-- arrow down -->
  <path d="M 270 258 L 270 278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- popcount decision -->
  <rect x="110" y="278" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="301" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">popcount(mask[v]) ≥ 2  →  v 入选答案</text>

  <!-- examples of masks -->
  <text x="28" y="346" font-size="10.5" fill="#666" font-weight="bold">掩码示例</text>

  <rect x="80" y="332" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="115" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a">111=7 → 3个</text>

  <rect x="170" y="332" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="205" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a">011=3 → 2个</text>

  <rect x="260" y="332" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="295" y="350" text-anchor="middle" font-size="10" fill="#b85450">100=1 → 1个</text>

  <rect x="350" y="332" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="410" y="350" text-anchor="middle" font-size="10" fill="#b85450">000=0 → 0个（落选）</text>
</svg>
