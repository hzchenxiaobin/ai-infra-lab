<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">核心观察：逆排列 days[] + 定长 K 窗口</text>

  <!-- bulbs row -->
  <text x="28" y="80" font-size="11.5" fill="#888">bulbs（day→pos）</text>
  <g filter="url(#rough2)">
    <rect x="170" y="62" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="62" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="286" y="62" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="344" y="62" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="402" y="62" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="195" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="253" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="311" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="369" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="427" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="195" y="108" text-anchor="middle" font-size="9.5" fill="#aaa">day1</text>
  <text x="253" y="108" text-anchor="middle" font-size="9.5" fill="#aaa">day2</text>
  <text x="311" y="108" text-anchor="middle" font-size="9.5" fill="#aaa">day3</text>
  <text x="369" y="108" text-anchor="middle" font-size="9.5" fill="#aaa">day4</text>
  <text x="427" y="108" text-anchor="middle" font-size="9.5" fill="#aaa">day5</text>

  <!-- inverse arrow -->
  <path d="M 300 116 L 300 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="132" font-size="10.5" fill="#446688" font-weight="bold">逆排列</text>

  <!-- days row -->
  <text x="28" y="168" font-size="11.5" fill="#888">days（pos→day）</text>
  <g filter="url(#rough2)">
    <rect x="170" y="150" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="150" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="286" y="150" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="344" y="150" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="402" y="150" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="195" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="253" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="311" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="369" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="427" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="195" y="196" text-anchor="middle" font-size="9.5" fill="#aaa">pos1</text>
  <text x="253" y="196" text-anchor="middle" font-size="9.5" fill="#aaa">pos2</text>
  <text x="311" y="196" text-anchor="middle" font-size="9.5" fill="#aaa">pos3</text>
  <text x="369" y="196" text-anchor="middle" font-size="9.5" fill="#aaa">pos4</text>
  <text x="427" y="196" text-anchor="middle" font-size="9.5" fill="#aaa">pos5</text>

  <!-- window bracket: left=pos1, middle=pos2, right=pos3 -->
  <text x="195" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">左端</text>
  <text x="253" y="214" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">中段(K=1)</text>
  <text x="311" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右端</text>

  <path d="M 195 220 L 311 220" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="253" y="236" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">right = left + K + 1</text>

  <!-- condition box -->
  <rect x="40" y="252" width="520" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="276" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">合法 ⟺ min{days[中段]} &gt; max{days[左端], days[右端]}</text>
  <text x="300" y="298" text-anchor="middle" font-size="11.5" fill="#555">中段 K 盏的点亮日 都晚于 两端点亮日的较晚者</text>
  <text x="300" y="318" text-anchor="middle" font-size="11.5" fill="#555">→ 这天两端已亮、中段全灭，恰好 K 盏关闭夹中间</text>
  <text x="300" y="336" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">候选日 = max(days[left], days[right])，取所有窗口最小</text>

  <!-- intuition box -->
  <rect x="40" y="356" width="520" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="380" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">为什么转成 days[] ？</text>
  <text x="58" y="402" font-size="11" fill="#555">• bulbs 按「天」组织，难直接判断「某天某段是否全灭」</text>
  <text x="58" y="422" font-size="11" fill="#555">• days[pos] = 该位置点亮日，把问题变成：找两位置 left、right=left+K+1</text>
  <text x="58" y="438" font-size="11" fill="#555">   使中段 days 全 &gt; max(days[left],days[right]) —— 定长窗口 + 区间最小查询</text>
</svg>
