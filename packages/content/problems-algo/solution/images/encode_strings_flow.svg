<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：编码 + 解码</text>

  <!-- ===== 编码流程 ===== -->
  <rect x="30" y="44" width="500" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="66" font-size="13" fill="#446688" font-weight="bold">encode(strs)</text>

  <rect x="50" y="80" width="100" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="103" text-anchor="middle" font-size="11" fill="#333">结果 res = ""</text>

  <path d="M 100 116 L 100 138" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="100,140 160,162 100,184 40,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="166" text-anchor="middle" font-size="10" fill="#333">还有字符串?</text>

  <path d="M 160 162 L 200 162" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>

  <rect x="200" y="146" width="200" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="162" text-anchor="middle" font-size="11" fill="#333">res += len(s) + "#" + s</text>
  <text x="300" y="176" text-anchor="middle" font-size="9" fill="#888">长度 + # + 原文</text>

  <path d="M 300 182 L 300 200 L 100 200 L 100 184" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 40 162 L 20 162 L 20 220 L 280 220 L 280 200" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="156" text-anchor="middle" font-size="9" fill="#b85450">否</text>

  <rect x="220" y="208" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return res</text>

  <!-- ===== 解码流程 ===== -->
  <rect x="30" y="250" width="500" height="195" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="272" font-size="13" fill="#4a7a3a" font-weight="bold">decode(s)</text>

  <rect x="50" y="286" width="120" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="307" text-anchor="middle" font-size="11" fill="#333">i = 0, res = []</text>

  <path d="M 110 320 L 110 340" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="110,342 170,362 110,382 50,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="366" text-anchor="middle" font-size="10" fill="#333">i &lt; len(s) ?</text>

  <path d="M 170 362 L 210 362" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="356" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>

  <rect x="210" y="338" width="150" height="50" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="356" text-anchor="middle" font-size="10" fill="#333">j = s.find("#", i)</text>
  <text x="285" y="372" text-anchor="middle" font-size="10" fill="#333">length = int(s[i:j])</text>

  <path d="M 360 362 L 396 362" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="396" y="338" width="120" height="50" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="456" y="356" text-anchor="middle" font-size="10" fill="#333">res.append(</text>
  <text x="456" y="372" text-anchor="middle" font-size="10" fill="#333">  s[j+1:j+1+length])</text>

  <path d="M 456 388 L 456 410 L 110 410 L 110 382" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="9" fill="#888">i = j + 1 + length（跳过 # 与内容）</text>

  <path d="M 50 362 L 30 362 L 30 432 L 280 432" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="356" text-anchor="middle" font-size="9" fill="#b85450">否</text>

  <rect x="220" y="420" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return res</text>
</svg>
