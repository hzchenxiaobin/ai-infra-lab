<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：合法交换只有两种 —— 左边恰比右边大 1</text>

  <text x="40" y="56" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 允许的相邻交换（条件只看左边下标 i）</text>

  <rect x="55" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="89" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <path d="M133,80 L166,80" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="176" y="66" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="210" y="66" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="290" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="324" y="66" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <path d="M368,80 L401,80" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="411" y="66" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="445" y="66" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="462" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">条件：nums[i] − nums[i+1] = 1 且 locked[i] = 0（只看左边！）</text>

  <text x="40" y="146" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 永远换不动：差值不是 1</text>
  <rect x="55" y="156" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="89" y="156" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <line x1="50" y1="152" x2="128" y2="188" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="128" y1="152" x2="50" y2="188" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="170" font-size="11" fill="#b85450" filter="url(#rough2)">3 − 1 = 2 ≠ 1，1 与 3 相邻时永远无法交换</text>
  <text x="150" y="186" font-size="10" fill="#999" filter="url(#rough2)">有序对 (1,2)、(2,3) 差为 −1，同样换不动（也无需换）</text>

  <text x="40" y="218" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">谁在移动？—— 1 只向左，3 只向右，2 双向</text>

  <path d="M112,238 L78,238" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M112,254 L78,254" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="232" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <path d="M235,246 L205,246" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M277,246 L307,246" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="243" y="232" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="373" y="232" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <path d="M415,238 L449,238" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M415,254 L449,254" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每次交换只发生在 2 与 1、3 与 2 之间 ⟹ 1 与 3 的相对顺序永不改变</text>

  <rect x="40" y="292" width="440" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">若 first3 &lt; last1：存在 3 排在 1 前面，排序后两者必须互换位置</text>
  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">但 1 与 3 永不交叉 ⟹ 无解，返回 −1</text>
</svg>
