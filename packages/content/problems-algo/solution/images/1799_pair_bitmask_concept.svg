<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">位掩码配对：用一个二进制数记录「哪些数已被取走」</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">nums = [3, 4, 6, 8]，共 2n = 4 个数，要做 n = 2 次配对</text>

  <text x="40" y="82" font-size="12" fill="#888">数值:</text>
  <rect x="80" y="66" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="66" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="240" y="66" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="320" y="66" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>

  <text x="40" y="124" font-size="11" fill="#888">下标:</text>
  <text x="115" y="124" text-anchor="middle" font-size="11" fill="#888">bit0</text>
  <text x="195" y="124" text-anchor="middle" font-size="11" fill="#888">bit1</text>
  <text x="275" y="124" text-anchor="middle" font-size="11" fill="#888">bit2</text>
  <text x="355" y="124" text-anchor="middle" font-size="11" fill="#888">bit3</text>

  <text x="40" y="158" font-size="12" fill="#888">mask:</text>
  <rect x="80" y="142" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="165" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="142" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="165" text-anchor="middle" font-size="15" fill="#999">0</text>
  <rect x="240" y="142" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="165" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="320" y="142" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="165" text-anchor="middle" font-size="15" fill="#999">0</text>

  <rect x="410" y="66" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="89" text-anchor="middle" font-size="11" fill="#4a7a3a">= 已取走</text>
  <rect x="410" y="142" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="165" text-anchor="middle" font-size="11" fill="#b85450">= 仍可用</text>

  <rect x="40" y="196" width="450" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="265" y="221" text-anchor="middle" font-size="12" fill="#444">mask = 0101₂ = 5 → 已取走 {3, 6}，剩余 {4, 8} 待配对</text>

  <rect x="40" y="252" width="200" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="140" y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">已取个数 = popcount(mask)</text>
  <text x="140" y="296" text-anchor="middle" font-size="11" fill="#555">0101 里有 2 个 1</text>
  <text x="140" y="316" text-anchor="middle" font-size="11" fill="#555">说明已做 2 ÷ 2 = 1 次操作</text>
  <text x="140" y="336" text-anchor="middle" font-size="11" fill="#555">下一操作序号 = 1 + 1 = 2</text>

  <path d="M 242 302 L 268 302" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="252" width="220" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">本轮得分 = op × gcd(x, y)</text>
  <text x="380" y="296" text-anchor="middle" font-size="11" fill="#555">op = popcount(mask) ÷ 2 + 1</text>
  <text x="380" y="316" text-anchor="middle" font-size="11" fill="#b85450">取走 4 与 8 → 2 × gcd(4,8) = 8</text>
  <text x="380" y="336" text-anchor="middle" font-size="11" fill="#888">mask 越满 → op 越大 → 优先配大 gcd</text>
</svg>
