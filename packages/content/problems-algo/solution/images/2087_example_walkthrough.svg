<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：startPos=[1,0] → homePos=[2,3]</text>

  <text x="120" y="52" font-size="11" fill="#888" filter="url(#rough2)">rowCosts=[5,4,3]</text>
  <text x="300" y="52" font-size="11" fill="#888" filter="url(#rough2)">colCosts=[8,2,6,7]</text>

  <rect x="120" y="60" width="54" height="44" fill="none" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="174" y="60" width="54" height="44" fill="none" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="228" y="60" width="54" height="44" fill="none" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="282" y="60" width="54" height="44" fill="none" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>

  <rect x="120" y="104" width="54" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="147" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">起</text>
  <text x="147" y="138" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">(1,0)</text>
  <rect x="174" y="104" width="54" height="44" fill="none" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="228" y="104" width="54" height="44" fill="none" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="282" y="104" width="54" height="44" fill="none" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>

  <rect x="120" y="148" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="147" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">①</text>
  <rect x="174" y="148" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="201" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">②</text>
  <rect x="228" y="148" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="255" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③</text>
  <rect x="282" y="148" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="309" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">家</text>
  <text x="309" y="182" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">④(2,3)</text>

  <path d="M 147 148 L 147 134" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 174 170 L 160 170" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 228 170 L 214 170" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 282 170 L 268 170" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <text x="100" y="88" font-size="9.5" fill="#888" filter="url(#rough2)">行0</text>
  <text x="100" y="130" font-size="9.5" fill="#d6a040" filter="url(#rough2)">行1</text>
  <text x="100" y="174" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">行2</text>

  <text x="147" y="210" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">列0</text>
  <text x="201" y="210" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">列1</text>
  <text x="255" y="210" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">列2</text>
  <text x="309" y="210" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">列3</text>

  <text x="400" y="76" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">逐步代价累加</text>

  <rect x="370" y="86" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="104" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="430" y="86" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="460" y="104" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">代价</text>
  <rect x="490" y="86" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="520" y="104" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">累计</text>

  <rect x="370" y="112" width="60" height="26" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="130" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">①下</text>
  <rect x="430" y="112" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="460" y="130" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">row[2]</text>
  <rect x="490" y="112" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="520" y="130" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="370" y="138" width="60" height="26" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="156" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">②右</text>
  <rect x="430" y="138" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="460" y="156" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">col[1]</text>
  <rect x="490" y="138" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="520" y="156" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="370" y="164" width="60" height="26" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="182" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">③右</text>
  <rect x="430" y="164" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="460" y="182" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">col[2]</text>
  <rect x="490" y="164" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="520" y="182" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">11</text>

  <rect x="370" y="190" width="60" height="26" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="208" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">④右</text>
  <rect x="430" y="190" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="460" y="208" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">col[3]</text>
  <rect x="490" y="190" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="520" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">18</text>

  <rect x="40" y="240" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总和 = rowCosts[2] + colCosts[1] + colCosts[2] + colCosts[3]</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= 3 + 2 + 6 + 7 = 18 ✓</text>

  <text x="40" y="304" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">换一条路验证（先右后下）：(1,0)→(1,1)→(1,2)→(1,3)→(2,3)</text>

  <rect x="40" y="312" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">代价 = colCosts[1]+colCosts[2]+colCosts[3] + rowCosts[2]</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">= 2 + 6 + 7 + 3 = 18</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">同样的行列集合，只是顺序不同 → 代价相同</text>

  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">结论：行列代价 ≥ 0 时，单调路径即最优，代价由起终点唯一决定</text>
  <text x="280" y="414" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 2：startPos == homePos → 无需移动 → 返回 0</text>
</svg>
