<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：分类打标 → 前缀和 → ×2</text>

  <!-- A -->
  <rect x="40" y="48" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="71" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">归一化：x &gt; y 则交换 → x ≤ y</text>
  <path d="M 190 84 L 190 92" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B 菱形 -->
  <polygon points="190,92 258,118 190,144 122,118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="123" text-anchor="middle" font-size="12.5" fill="#8a3a34" filter="url(#rough2)">x == y ?</text>

  <path d="M 258 118 L 356 118" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="300" y="110" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="360" y="96" width="150" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="114" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">纯链：res[k] = 2(n−k)</text>
  <text x="435" y="131" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">（自环不影响任何距离）</text>

  <path d="M 190 144 L 190 164" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="202" y="159" font-size="11.5" fill="#446688" filter="url(#rough2)">否</text>

  <!-- D -->
  <rect x="40" y="166" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">定参数：L = y−x+1，m1 = x−1，m2 = n−y</text>
  <text x="190" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">差分数组 diff[1..n+2] 清零</text>
  <path d="M 190 208 L 190 228" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- E -->
  <rect x="40" y="230" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="253" text-anchor="middle" font-size="12" fill="#2d5a1f" filter="url(#rough2)">类①②：链闭式 + 环闭式 → 逐点打标</text>
  <path d="M 190 266 L 190 284" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- F -->
  <rect x="40" y="286" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="304" text-anchor="middle" font-size="11.5" fill="#2d5a1f" filter="url(#rough2)">类③：枚举环距 t，区间加 cnt(t)</text>
  <text x="190" y="320" text-anchor="middle" font-size="11.5" fill="#2d5a1f" filter="url(#rough2)">（左尾、右尾各来一遍）</text>
  <path d="M 190 326 L 190 342" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- G -->
  <rect x="40" y="344" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="367" text-anchor="middle" font-size="12" fill="#2d5a1f" filter="url(#rough2)">类④：枚举 a，区间 [a+2, a+m2+1] 加 1</text>
  <path d="M 190 380 L 190 394" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- H -->
  <rect x="40" y="396" width="300" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="414" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">前缀和还原：cur += diff[k]</text>
  <text x="190" y="429" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">res[k] = 2 × cur → 返回</text>

  <text x="260" y="452" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">自检：Σ res[k] 应恰等于 n(n−1)</text>
</svg>
