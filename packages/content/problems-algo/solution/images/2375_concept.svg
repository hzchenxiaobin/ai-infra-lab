<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：基串 "123…n+1" 已满足所有 I，只需翻转每段 D 连续区</text>

  <!-- pattern = "IIIDIDDD" , 8 chars between 9 cells -->
  <!-- cell width 40, cells at x=50,90,130,170,210,250,290,330,370 ; end 410 -->
  <!-- pattern labels centered between cells: x=70,110,150,190,230,270,310,350 -->

  <!-- pattern row label -->
  <text x="32" y="64" font-size="12" fill="#888" font-weight="bold">pattern</text>

  <!-- pattern chars: I I I D I D D D -->
  <g filter="url(#rough2)">
    <text x="70"  y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">I</text>
    <text x="110" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">I</text>
    <text x="150" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">I</text>
    <text x="190" y="66" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">D</text>
    <text x="230" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">I</text>
    <text x="270" y="66" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">D</text>
    <text x="310" y="66" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">D</text>
    <text x="350" y="66" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">D</text>
  </g>

  <!-- base num row label -->
  <text x="32" y="116" font-size="12" fill="#888" font-weight="bold">基串 num</text>

  <!-- base cells 1..9 ; highlight D-run segments -->
  <!-- run1 = cells 3,4 (x 170..250) ; run2 = cells 5,6,7,8 (x 250..410) -->
  <g filter="url(#rough2)">
    <rect x="50"  y="96" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="70"  y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
    <rect x="90"  y="96" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="110" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
    <rect x="130" y="96" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="150" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
    <!-- run1 segment -->
    <rect x="170" y="96" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="190" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
    <rect x="210" y="96" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="230" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
    <!-- run2 segment -->
    <rect x="250" y="96" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="270" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
    <rect x="290" y="96" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="310" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
    <rect x="330" y="96" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="350" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
    <rect x="370" y="96" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="390" y="117" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  </g>

  <!-- D-run brackets -->
  <path d="M 170 140 L 170 146 L 250 146 L 250 140" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="210" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">D 段①(长1)</text>
  <path d="M 250 140 L 250 146 L 410 146 L 410 140" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="330" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">D 段②(长3)</text>

  <!-- reversal arrows down -->
  <path d="M 210 168 L 210 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 168 L 330 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="186" font-size="10" fill="#b85450" font-weight="bold">reverse</text>
  <text x="345" y="186" font-size="10" fill="#b85450" font-weight="bold">reverse</text>

  <!-- result row label -->
  <text x="32" y="230" font-size="12" fill="#888" font-weight="bold">结果 num</text>

  <!-- result cells 1 2 3 5 4 9 8 7 6 ; changed cells highlighted -->
  <g filter="url(#rough2)">
    <rect x="50"  y="206" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="70"  y="227" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
    <rect x="90"  y="206" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="110" y="227" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
    <rect x="130" y="206" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="150" y="227" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
    <rect x="170" y="206" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="190" y="227" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>
    <rect x="210" y="206" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="230" y="227" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
    <rect x="250" y="206" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="270" y="227" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">9</text>
    <rect x="290" y="206" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="310" y="227" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">8</text>
    <rect x="330" y="206" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="350" y="227" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>
    <rect x="370" y="206" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="390" y="227" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  </g>

  <!-- boundary check annotations: I at pos2 (x150) and pos4 (x230) still increasing -->
  <text x="150" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3&lt;5 ✓</text>
  <text x="230" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4&lt;9 ✓</text>

  <!-- insight box -->
  <rect x="40" y="278" width="440" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 基串取最小 n+1 个数字 1…n+1 升序排列 → 天然满足所有 I</text>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 每段连续 D 对应一段升序子串，翻转即变降序 → 满足 D</text>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ 翻转用最小数字、保持 I 边界 → 字典序最小，一次扫描 O(n)</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#888">I 边界仍升序：左端点取段内最小、右端点接段外更大值</text>
</svg>
