<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2753c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：street=[1,0,1,1,0], k=5（n=5）</text>

  <!-- 5 box positions: centers 172,226,280,334,388 ; box w46 h38 -> x=149,203,257,311,365 -->

  <!-- Row1: find P at idx0 (open, not closed) -->
  <text x="138" y="78" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">找到P</text>
  <path d="M172,52 L165,42 L179,42 z" fill="#d6a040" filter="url(#rough2)"/>
  <rect x="149" y="56" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="172" y="80" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <rect x="203" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="226" y="80" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <rect x="257" y="56" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="311" y="56" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="334" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="365" y="56" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="388" y="80" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <text x="425" y="78" text-anchor="start" font-size="10" fill="#888">idx0=P·不关</text>

  <!-- Row2: i=2 -> idx2 open, close, ans=2 ; state 1 0 0 1 0 -->
  <text x="138" y="140" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">i=2</text>
  <path d="M280,114 L273,104 L287,104 z" fill="#b85450" filter="url(#rough2)"/>
  <rect x="149" y="118" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="172" y="142" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <rect x="203" y="118" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="226" y="142" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <rect x="257" y="118" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="311" y="118" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="334" y="142" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="365" y="118" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="388" y="142" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <text x="425" y="140" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold">关 idx2·ans=2</text>

  <!-- Row3: i=3 -> idx3 open, close, ans=3 ; state 1 0 0 0 0 -->
  <text x="138" y="202" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">i=3</text>
  <path d="M334,176 L327,166 L341,166 z" fill="#b85450" filter="url(#rough2)"/>
  <rect x="149" y="180" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="172" y="204" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">1</text>
  <g font-size="15" font-weight="bold" fill="#446688">
    <rect x="203" y="180" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="226" y="204" text-anchor="middle">0</text>
    <rect x="257" y="180" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="280" y="204" text-anchor="middle">0</text>
  </g>
  <rect x="311" y="180" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="334" y="204" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="365" y="180" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="388" y="204" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">0</text>
  <text x="425" y="202" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold">关 idx3·ans=3</text>

  <!-- Row4: i=5 -> back to idx0 (open), close, ans=5 ; state 0 0 0 0 0 -->
  <text x="138" y="264" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">i=5</text>
  <path d="M172,238 L165,228 L179,228 z" fill="#b85450" filter="url(#rough2)"/>
  <rect x="149" y="242" width="46" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="172" y="266" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <g font-size="15" font-weight="bold" fill="#446688">
    <rect x="203" y="242" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="226" y="266" text-anchor="middle">0</text>
    <rect x="257" y="242" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="280" y="266" text-anchor="middle">0</text>
    <rect x="311" y="242" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="334" y="266" text-anchor="middle">0</text>
    <rect x="365" y="242" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/><text x="388" y="266" text-anchor="middle">0</text>
  </g>
  <text x="425" y="264" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold">回 P·关·ans=5</text>

  <!-- skip note -->
  <text x="280" y="302" text-anchor="middle" font-size="10" fill="#888">（i=1 到 idx1 为闭、i=4 到 idx4 为闭，均跳过）</text>

  <!-- result -->
  <rect x="120" y="318" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">回到 P(idx0) 走满 5 步才再遇开门</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 5 = n ✓</text>

  <!-- moveRight arc note -->
  <path d="M195,261 L200,261" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr2753c)" filter="url(#rough2)"/>
</svg>
