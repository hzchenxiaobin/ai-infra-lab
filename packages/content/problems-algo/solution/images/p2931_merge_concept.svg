<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrW" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：小值配小天，大值配大天</text>
  <text x="140" y="42" text-anchor="middle" font-size="10" fill="#888">每行非递增 ⇒ 只能从右往左买（行内值小者先买）</text>

  <!-- 店0 -->
  <text x="44" y="66" font-size="11" fill="#446688" font-weight="bold">店0</text>
  <rect x="70" y="48" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="66" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="118" y="48" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="66" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="166" y="48" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="66" text-anchor="middle" font-size="12" fill="#333">2</text>
  <path d="M214,80 L78,80" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- 店1 -->
  <text x="44" y="108" font-size="11" fill="#446688" font-weight="bold">店1</text>
  <rect x="70" y="90" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="108" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="118" y="90" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="108" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="166" y="90" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <path d="M214,122 L78,122" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- 店2 -->
  <text x="44" y="150" font-size="11" fill="#446688" font-weight="bold">店2</text>
  <rect x="70" y="132" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="150" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="118" y="132" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="166" y="132" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="150" text-anchor="middle" font-size="12" fill="#333">3</text>
  <path d="M214,164 L78,164" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- 汇合箭头 -->
  <path d="M232,61 Q272,72 266,160" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M232,103 Q278,110 267,164" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M232,145 Q274,152 268,168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 归并节点 -->
  <ellipse cx="260" cy="180" rx="86" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="185" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">多路归并：每天买候选最小</text>

  <path d="M260,198 L260,212" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 购买流水线 -->
  <rect x="46" y="216" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="94" y="216" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="234" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="142" y="216" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="234" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="190" y="216" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="234" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="238" y="216" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="286" y="216" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="234" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="334" y="216" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="234" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="382" y="216" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="234" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="430" y="216" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <!-- 天数标签 -->
  <text x="68" y="258" text-anchor="middle" font-size="10" fill="#888">d=1</text>
  <text x="116" y="258" text-anchor="middle" font-size="10" fill="#888">d=2</text>
  <text x="164" y="258" text-anchor="middle" font-size="10" fill="#888">d=3</text>
  <text x="212" y="258" text-anchor="middle" font-size="10" fill="#888">d=4</text>
  <text x="260" y="258" text-anchor="middle" font-size="10" fill="#888">d=5</text>
  <text x="308" y="258" text-anchor="middle" font-size="10" fill="#888">d=6</text>
  <text x="356" y="258" text-anchor="middle" font-size="10" fill="#888">d=7</text>
  <text x="404" y="258" text-anchor="middle" font-size="10" fill="#888">d=8</text>
  <text x="452" y="258" text-anchor="middle" font-size="10" fill="#888">d=9</text>

  <!-- 结论框 -->
  <rect x="30" y="272" width="460" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#333">总开销 = Σ 值 × 天数，天数 d = 1…mn 固定升序</text>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">排序不等式：同序和最大 ⇒ 第 k 小的值恰在第 k 天买</text>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#333">每行从右往左读是非降序列 ⇒ 升序购买天然满足行尾约束 ✓</text>
</svg>
