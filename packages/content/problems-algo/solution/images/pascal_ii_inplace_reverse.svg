<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：倒序更新 = 单数组原地递推</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">从右往左更新，保证读 row[j-1] 时它仍是上一行的旧值</text>

  <!-- ===== 上一行（概念上的 prev） ===== -->
  <text x="70" y="82" text-anchor="middle" font-size="11" fill="#888">上一行 prev</text>
  <g font-size="13" fill="#333">
    <rect x="100" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="128" y="90" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="158" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="186" y="90" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="216" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="244" y="90" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- ===== 当前数组 row（同一数组，正在更新 i=3 行） ===== -->
  <text x="70" y="170" text-anchor="middle" font-size="11" fill="#888">同一数组 row</text>
  <g font-size="13" fill="#333">
    <!-- index labels -->
    <text x="128" y="124" text-anchor="middle" font-size="9" fill="#aaa">[0]</text>
    <text x="186" y="124" text-anchor="middle" font-size="9" fill="#aaa">[1]</text>
    <text x="244" y="124" text-anchor="middle" font-size="9" fill="#aaa">[2]</text>
    <text x="302" y="124" text-anchor="middle" font-size="9" fill="#aaa">[3]</text>

    <!-- row[0]=1 unchanged -->
    <rect x="100" y="132" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="128" y="154" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- row[1]: already updated to 3 (NEW) -->
    <rect x="158" y="132" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="186" y="154" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <!-- row[2]: about to update, still old value 1 -->
    <rect x="216" y="132" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="244" y="154" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <!-- row[3]: not yet touched, old=0 -->
    <rect x="274" y="132" width="56" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="302" y="154" text-anchor="middle" fill="#999">0</text>
  </g>

  <!-- ===== 错误：正序（左→右）读取已更新的 row[1] ===== -->
  <rect x="370" y="68" width="170" height="98" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="455" y="88" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 正序（左→右）</text>
  <text x="455" y="108" text-anchor="middle" font-size="10" fill="#b85450">算 row[2] 时</text>
  <text x="455" y="124" text-anchor="middle" font-size="10" fill="#b85450">读到 row[1]=3（新值）</text>
  <text x="455" y="140" text-anchor="middle" font-size="10" fill="#b85450">应读旧值 2 → 错!</text>
  <!-- arrow from updated row[1] to row[2] (wrong read) -->
  <path d="M 214 149 Q 300 138 240 150" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== 正确：倒序（右→左）读取未更新的 row[1] ===== -->
  <rect x="370" y="178" width="170" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="455" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 倒序（右→左）</text>
  <text x="455" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a">先算 row[3]，再算 row[2]</text>
  <text x="455" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a">算 row[2] 时 row[1] 未动</text>
  <text x="455" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a">仍是旧值 2 → 对!</text>

  <!-- 倒序方向大箭头：从 row[3] 指向 row[1] -->
  <path d="M 302 200 Q 244 215 186 200" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="244" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">j 从大到小</text>

  <!-- ===== 公式 ===== -->
  <rect x="60" y="288" width="440" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-family="monospace" font-size="13" fill="#333" font-weight="bold">row[j] = row[j] + row[j-1]   （j 从 i ↓ 1）</text>
  <text x="280" y="322" text-anchor="middle" font-size="9" fill="#888">右边的 row[j] 和 row[j-1] 都还是上一行的旧值 → 原地完成肩上相加</text>

  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#666">空间 O(k)：只需一个长度 k+1 的数组，反复原地刷新</text>
</svg>
