<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 9，跟踪 (head, step, count, 方向)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每过一轮：count ÷ 2、step × 2、方向翻转；head 按规则前移</text>

  <!-- ===== table grid ===== -->
  <!-- columns: 轮(50) 方向(110) head(180) step(240) count(300) 剩余序列(420) -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1" fill="none">
    <rect x="28" y="60" width="500" height="200" fill="#fff" stroke="#bbb"/>
    <line x1="76" y1="60" x2="76" y2="260"/>
    <line x1="148" y1="60" x2="148" y2="260"/>
    <line x1="216" y1="60" x2="216" y2="260"/>
    <line x1="276" y1="60" x2="276" y2="260"/>
    <line x1="336" y1="60" x2="336" y2="260"/>
    <line x1="28" y1="100" x2="528" y2="100"/>
    <line x1="28" y1="140" x2="528" y2="140"/>
    <line x1="28" y1="180" x2="528" y2="180"/>
    <line x1="28" y1="220" x2="528" y2="220"/>
  </g>

  <!-- header -->
  <g filter="url(#rough2)" font-size="11" fill="#555" font-weight="bold" text-anchor="middle">
    <text x="52" y="84">轮次</text>
    <text x="112" y="84">方向</text>
    <text x="182" y="84">head</text>
    <text x="246" y="84">step</text>
    <text x="306" y="84">count</text>
    <text x="432" y="84">剩余序列（删后）</text>
  </g>

  <!-- row: 初始 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="52" y="124" fill="#888">初始</text>
    <text x="112" y="124" fill="#888">—</text>
    <text x="182" y="124" fill="#446688" font-weight="bold">1</text>
    <text x="246" y="124" fill="#446688" font-weight="bold">1</text>
    <text x="306" y="124" fill="#446688" font-weight="bold">9</text>
    <text x="432" y="124" fill="#555">1 … 9</text>
  </g>

  <!-- row: pass 1 L→R, head 1→2 (left, always advance) -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="52" y="164" fill="#b85450" font-weight="bold">1</text>
    <text x="112" y="164" fill="#b85450" font-weight="bold">L→R</text>
    <text x="182" y="164" fill="#b85450" font-weight="bold">2</text>
    <text x="246" y="164" fill="#446688" font-weight="bold">2</text>
    <text x="306" y="164" fill="#446688" font-weight="bold">4</text>
    <!-- survivors 2,4,6,8 small badges -->
    <rect x="368" y="152" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="379" y="165" fill="#446688" font-size="10">2</text>
    <rect x="392" y="152" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="403" y="165" fill="#446688" font-size="10">4</text>
    <rect x="416" y="152" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="427" y="165" fill="#446688" font-size="10">6</text>
    <rect x="440" y="152" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="451" y="165" fill="#446688" font-size="10">8</text>
  </g>

  <!-- row: pass 2 R←L, count=4 even → head not advance, stays 2 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="52" y="204" fill="#d6a040" font-weight="bold">2</text>
    <text x="112" y="204" fill="#d6a040" font-weight="bold">R←L</text>
    <text x="182" y="204" fill="#d6a040" font-weight="bold">2</text>
    <text x="246" y="204" fill="#446688" font-weight="bold">4</text>
    <text x="306" y="204" fill="#446688" font-weight="bold">2</text>
    <rect x="392" y="192" width="22" height="18" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="403" y="205" fill="#d6a040" font-size="10">2</text>
    <rect x="416" y="192" width="22" height="18" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="427" y="205" fill="#d6a040" font-size="10">6</text>
  </g>

  <!-- row: pass 3 L→R, head 2→6 (left, advance by step=4) -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="32" y="224" width="492" height="32" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" rx="4"/>
    <text x="52" y="244" fill="#b85450" font-weight="bold">3</text>
    <text x="112" y="244" fill="#b85450" font-weight="bold">L→R</text>
    <text x="182" y="244" fill="#b85450" font-weight="bold">6</text>
    <text x="246" y="244" fill="#446688" font-weight="bold">8</text>
    <text x="306" y="244" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="404" y="232" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/><text x="417" y="246" fill="#4a7a3a" font-size="11" font-weight="bold">6</text>
    <text x="448" y="246" font-size="10" fill="#4a7a3a" font-weight="bold">⭐ 答案</text>
  </g>

  <!-- ===== bottom note ===== -->
  <rect x="28" y="276" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">规则：head 前移 ⇔ (从左删) ∨ (从右删 ∧ count 奇)</text>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a">第 2 轮 count=4 为偶 → 从右删不动 head；第 3 轮从左删 → head += step</text>
</svg>
