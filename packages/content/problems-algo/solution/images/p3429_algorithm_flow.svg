<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 开始 -->
  <ellipse cx="250" cy="26" rx="40" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="31" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M250,42 L250,54" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="95" y="56" width="310" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="74" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">初始化（第 0 对）：</text>
  <text x="250" y="92" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">dp[a][b] = cost[0][a] + cost[n−1][b]，a ≠ b</text>
  <path d="M250,100 L250,112" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="250,112 322,147 250,182 178,147" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="152" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">k &lt; m ?</text>

  <!-- 否 → 求答案 -->
  <path d="M322,147 L366,147" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="139" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="368" y="129" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="433" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">ans = min dp[a][b]</text>
  <path d="M433,165 L433,181" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="433" cy="197" rx="40" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="433" y="202" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <!-- 是 → 枚举新对 -->
  <path d="M250,182 L250,198" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="196" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <rect x="85" y="200" width="330" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="221" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">枚举第 k 对的新颜色 (c,d)，c ≠ d（6 种）</text>
  <path d="M250,234 L250,246" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移 -->
  <rect x="85" y="248" width="330" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">best = min{ dp[a][b] : a≠c 且 b≠d }</text>
  <text x="250" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ndp[c][d] = best + cost[k][c] + cost[n−1−k][d]</text>

  <!-- 回环 -->
  <path d="M85,276 L50,276 L50,147 L174,147" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="196" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">k+1</text>
  <text x="44" y="212" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">dp ← ndp</text>

  <!-- 底部复杂度说明 -->
  <rect x="110" y="318" width="300" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每对至多 9×9 = 81 次转移枚举（合法 36 次）</text>
  <text x="260" y="347" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">总时间 O(n)，空间 O(1)（3×3 滚动表）</text>
</svg>
