<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：调用时刻 T_n = n·delay + period·n(n−1)/2</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#999">（以示例1 delay=50, period=20, cancelTime=225 为例）</text>

  <!-- execute / cancel shaded regions -->
  <rect x="30" y="92" width="338" height="46" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="368" y="92" width="172" height="46" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <text x="199" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a">执行区间（T_n &lt; cancelTime）</text>
  <text x="454" y="86" text-anchor="middle" font-size="11" fill="#b85450">取消</text>

  <!-- timeline baseline -->
  <line x1="30" y1="120" x2="550" y2="120" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 548 116 L 558 120 L 548 124" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="556" y="138" font-size="10" fill="#888">t(ms)</text>

  <!-- T0 origin -->
  <circle cx="30" cy="120" r="3" fill="#888" filter="url(#rough2)"/>
  <text x="30" y="138" text-anchor="middle" font-size="10" fill="#888">0</text>

  <!-- call ticks: T1=50->105, T2=120->210, T3=210->345, T4=320->510 -->
  <!-- interval labels above baseline -->
  <text x="67" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">50</text>
  <text x="157" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">70</text>
  <text x="277" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">90</text>
  <text x="427" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">110</text>

  <!-- executed calls (green) -->
  <line x1="105" y1="112" x2="105" y2="128" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="105" cy="120" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">T₁=50 ✓</text>

  <line x1="210" y1="112" x2="210" y2="128" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="210" cy="120" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">T₂=120 ✓</text>

  <line x1="345" y1="112" x2="345" y2="128" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="345" cy="120" r="4.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">T₃=210 ✓</text>

  <!-- cancelled call (red) -->
  <line x1="510" y1="112" x2="510" y2="128" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="510" cy="120" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="150" text-anchor="middle" font-size="10" fill="#b85450">T₄=320 ✗</text>

  <!-- cancelTime vertical dashed line at 225 -> x=368 -->
  <line x1="368" y1="70" x2="368" y2="160" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="368" y="64" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cancelTime = 225</text>

  <!-- divider -->
  <line x1="20" y1="180" x2="560" y2="180" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- closed-form panel -->
  <text x="20" y="202" font-size="12" fill="#446688" font-weight="bold">间隔序列 a_k = delay + (k−1)·period（递增）</text>
  <rect x="20" y="210" width="540" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="35" y="231" font-size="11" fill="#333">a₁=50</text>
  <text x="120" y="231" font-size="11" fill="#333">a₂=50+20=70</text>
  <text x="250" y="231" font-size="11" fill="#333">a₃=50+2·20=90</text>
  <text x="395" y="231" font-size="11" fill="#b85450">a₄=50+3·20=110…</text>

  <text x="20" y="266" font-size="12" fill="#446688" font-weight="bold">调用时刻 T_n = n·delay + period·n(n−1)/2（二次函数，单调递增）</text>
  <rect x="20" y="274" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="35" y="295" font-size="11" fill="#333">T₁=1·50+0=50</text>
  <text x="160" y="295" font-size="11" fill="#333">T₂=2·50+20=120</text>
  <text x="300" y="295" font-size="11" fill="#333">T₃=3·50+60=210</text>
  <text x="430" y="295" font-size="11" fill="#b85450">T₄=4·50+120=320</text>

  <!-- takeaway -->
  <rect x="20" y="320" width="540" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="35" y="341" font-size="11" fill="#333">🔑 T_n 单调递增 ⇒ 找“满足 T_n &lt; cancelTime 的最大 n”可二分，O(log cnt)，无需逐步模拟</text>
</svg>
