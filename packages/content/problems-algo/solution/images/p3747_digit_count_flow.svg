<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="28" y="20" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：位数分桶 + 逐位贴上界，O(log n)</text>

  <!-- 开始 -->
  <rect x="130" y="30" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="50" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">s = n 的数字串，L = 位数，ans = 0</text>

  <path d="M 250 62 L 250 72" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段一 -->
  <rect x="105" y="76" width="290" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">阶段一：ans += 9¹ + 9² + … + 9^(L−1)</text>
  <text x="250" y="114" text-anchor="middle" font-size="10.5" fill="#667" filter="url(#rough2)">位数 &lt; L 的无零数：k 位恰 9^k 个，全收</text>

  <path d="M 250 124 L 250 136" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="150" y="140" width="200" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="159" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">i = 0，ok = true</text>

  <path d="M 250 170 L 250 186" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：i < L ? -->
  <polygon points="250,190 318,222 250,254 182,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="226" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">i &lt; L ?</text>

  <!-- 否 → n 自身无零? -->
  <path d="M 318 222 L 404 220" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="214" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 是 ↓ -->
  <path d="M 250 254 L 250 268" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="266" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 判定 2：s[i] == 0 ? -->
  <polygon points="250,272 316,304 250,336 184,304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="308" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">s[i] == 0 ?</text>

  <!-- 是·贴不住 → 直达返回 -->
  <path d="M 184 304 L 115 304 L 115 446 L 352 446" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="296" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">是·贴不住</text>

  <!-- 否 ↓ -->
  <path d="M 250 336 L 250 348" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="348" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 累加 -->
  <rect x="120" y="350" width="260" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="368" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">ans += (d−1) · 9^(L−1−i)</text>
  <text x="250" y="386" text-anchor="middle" font-size="9.5" fill="#667" filter="url(#rough2)">这一位填 1..d−1，后 L−1−i 位任填 1..9</text>

  <path d="M 250 392 L 250 400" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i += 1 -->
  <rect x="185" y="402" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="421" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">i += 1</text>

  <!-- 回环 -->
  <path d="M 250 432 L 250 466 L 55 466 L 55 222 L 176 222" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="44" y="344" text-anchor="middle" font-size="9.5" fill="#8a6d1f" transform="rotate(-90 44 344)" filter="url(#rough2)">回到 i &lt; L ?</text>

  <!-- 判定 3：n 自身无零? -->
  <polygon points="410,220 478,252 410,284 342,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="256" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">n 自身无零 ?</text>

  <!-- 是 ↓ 补 1 -->
  <path d="M 410 284 L 410 296" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="293" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="325" y="298" width="180" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="318" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">ans += 1（补上 n 本尊）</text>

  <path d="M 415 330 L 415 424" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 直接返回 -->
  <path d="M 478 252 L 522 252 L 522 446 L 516 446" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="497" y="245" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 返回 -->
  <rect x="358" y="428" width="152" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="434" y="451" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">返回 ans</text>

  <text x="250" y="490" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">L ≤ 16 ⇒ 两趟扫描 O(L) = O(log₁₀ n)，与 n 的大小无关</text>
</svg>
