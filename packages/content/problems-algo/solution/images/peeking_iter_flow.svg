<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    peek() / next() / hasNext() 流程：围绕 cache 的一读一补
  </text>

  <!-- ===== peek() 流程（左上） ===== -->
  <text x="40" y="62" font-size="13" fill="#4a7a3a" filter="url(#rough2)">peek()</text>
  <rect x="40" y="74" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">直接返回 cache（不调底层）</text>
  <path d="M140,106 L140,120" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="40" y="122" width="200" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return cache</text>
  <text x="252" y="100" font-size="10" fill="#4a7a3a" filter="url(#rough2)">← 不动指针，可重复调用</text>

  <!-- ===== next() 流程（左中） ===== -->
  <text x="40" y="186" font-size="13" fill="#446688" filter="url(#rough2)">next()</text>
  <rect x="40" y="198" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">val = cache（记下待返回值）</text>
  <path d="M140,230 L140,244" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="140,246 210,276 140,306 70,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">底层 iter</text>
  <text x="140" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">hasNext()?</text>

  <path d="M210,276 L250,276" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="216" y="270" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="250" y="260" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cache = iter.next()</text>
  <path d="M320,292 L320,312 L140,312" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M140,306 L140,318" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="318" font-size="10" fill="#b85450" filter="url(#rough2)">否 → cache 置空</text>

  <rect x="40" y="324" width="200" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return val</text>

  <!-- ===== hasNext() 流程（右上） ===== -->
  <text x="410" y="62" font-size="13" fill="#b85450" filter="url(#rough2)">hasNext()</text>
  <polygon points="470,74 534,104 470,134 406,104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cache</text>
  <text x="470" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">有值？</text>

  <path d="M406,104 L380,104 L380,150" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="388" y="98" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="338" y="152" width="84" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return false</text>

  <path d="M534,104 L556,104 L556,150" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="540" y="98" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="514" y="152" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="556" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return true</text>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    peek 只读不补，next 先读后补，hasNext 只判 cache 非空——三者都绕开「直接调底层 next」
  </text>
</svg>
