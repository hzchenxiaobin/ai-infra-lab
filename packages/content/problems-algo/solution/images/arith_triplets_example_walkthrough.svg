<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[0,1,4,6,7,10], diff=3</text>

  <!-- Table header -->
  <rect x="40" y="46" width="480" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="67" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">中项 x</text>
  <text x="175" y="67" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">x−diff ∈ S?</text>
  <text x="285" y="67" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">x+diff ∈ S?</text>
  <text x="430" y="67" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">是否成组</text>

  <!-- column dividers (faint) -->
  <path d="M 120 46 L 120 300" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 230 46 L 230 300" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 340 46 L 340 300" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: x=0 -->
  <rect x="40" y="80" width="480" height="32" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="100" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="175" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−3 ✗</text>
  <text x="285" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3 ✗</text>
  <text x="430" y="100" text-anchor="middle" font-size="12" fill="#888">否</text>

  <!-- Row 1: x=1 -->
  <rect x="40" y="112" width="480" height="32" fill="#f3f6fb" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="175" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−2 ✗</text>
  <text x="285" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 ✓</text>
  <text x="430" y="132" text-anchor="middle" font-size="12" fill="#888">否</text>

  <!-- Row 2: x=4 (HIT) -->
  <rect x="40" y="144" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="175" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <text x="285" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7 ✓</text>
  <text x="430" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1（1,4,7）</text>

  <!-- Row 3: x=6 -->
  <rect x="40" y="176" width="480" height="32" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="196" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="175" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3 ✗</text>
  <text x="285" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9 ✗</text>
  <text x="430" y="196" text-anchor="middle" font-size="12" fill="#888">否</text>

  <!-- Row 4: x=7 (HIT) -->
  <rect x="40" y="208" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="175" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 ✓</text>
  <text x="285" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">10 ✓</text>
  <text x="430" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1（4,7,10）</text>

  <!-- Row 5: x=10 -->
  <rect x="40" y="240" width="480" height="32" fill="#f3f6fb" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="260" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="175" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7 ✓</text>
  <text x="285" y="260" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">13 ✗</text>
  <text x="430" y="260" text-anchor="middle" font-size="12" fill="#888">否</text>

  <!-- Total row -->
  <rect x="40" y="274" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">合计</text>
  <text x="430" y="296" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">= 2 组</text>

  <!-- footer notes -->
  <text x="40" y="340" font-size="11" fill="#555">两个命中中项：</text>
  <text x="40" y="360" font-size="11" fill="#555">• x=4：左邻 1、右邻 7 都在 S → 三元组 (1, 4, 7)，下标 (1, 2, 4)</text>
  <text x="40" y="380" font-size="11" fill="#555">• x=7：左邻 4、右邻 10 都在 S → 三元组 (4, 7, 10)，下标 (2, 4, 5)</text>
  <text x="40" y="410" font-size="10.5" fill="#888">注：x=1 虽右邻 4 在 S，但左邻 −2 不在 → 缺一不可；x=10 同理左邻在而右邻 13 不在。</text>
  <text x="40" y="428" font-size="10.5" fill="#888">      严格递增保证 1&lt;4&lt;7 与 4&lt;7&lt;10 下标天然有序，故「查到即合法」。</text>
</svg>
