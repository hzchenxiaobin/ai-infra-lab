<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按固定对扫描计数</text>

  <!-- 开始 -->
  <rect x="200" y="42" width="160" height="30" fill="#eeeeee" stroke="#888" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">ans = 0</text>

  <path d="M 280 72 L 280 86" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 取对 -->
  <rect x="180" y="88" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#333">取下一对 i = 0, 2, 4, …, n−2</text>

  <path d="M 280 122 L 280 138" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 菱形1 还有对吗 -->
  <polygon points="280,140 356,170 280,200 204,170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 204 170 L 120 170" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="150" y="162" font-size="11" fill="#4a7a3a">否</text>
  <rect x="14" y="154" width="102" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="65" y="175" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>

  <!-- 是 → 菱形2 -->
  <path d="M 280 200 L 280 218" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="288" y="214" font-size="11" fill="#446688">是</text>

  <polygon points="280,220 368,252 280,284 192,252" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#333">s[i] != s[i+1] ?</text>

  <!-- 是 → ans++ -->
  <path d="M 368 252 L 424 252" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="384" y="244" font-size="11" fill="#b85450">是</text>
  <rect x="426" y="236" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="481" y="257" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans++</text>
  <path d="M 481 268 L 481 300 L 280 300 L 280 314" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 否 → 跳过 -->
  <path d="M 280 284 L 280 314" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="288" y="304" font-size="11" fill="#4a7a3a">否，本对免费</text>

  <!-- i += 2 回到取对 -->
  <rect x="200" y="316" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#333">i += 2，处理下一对</text>
  <path d="M 200 331 L 150 331 L 150 105 L 178 105" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <text x="448" y="150" font-size="11" fill="#999">每个不匹配对恰花 1 次，</text>
  <text x="448" y="166" font-size="11" fill="#999">各对互不影响，直接数个数</text>
</svg>
