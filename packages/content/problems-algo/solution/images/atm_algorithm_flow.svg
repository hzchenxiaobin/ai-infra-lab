<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="460" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心取款 + 原子提交</text>

  <!-- Start -->
  <ellipse cx="250" cy="60" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始 withdraw</text>

  <line x1="250" y1="80" x2="250" y2="96" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="90" y="100" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="250" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化临时副本</text>
  <text x="250" y="138" text-anchor="middle" font-size="10.5" fill="#888">rem = amount, take = [0,0,0,0,0]</text>

  <line x1="250" y1="150" x2="250" y2="166" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="110" y="170" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="250" y="195" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">for i = 4 → 0（$500 到 $20）</text>

  <line x1="250" y1="210" x2="250" y2="226" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Operation -->
  <rect x="70" y="230" width="360" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">take[i] = min(rem ÷ denom[i], cnt[i])</text>
  <text x="250" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">rem -= take[i] × denom[i]</text>

  <!-- Loop back arrow -->
  <path d="M 430 258 Q 460 258 460 190 Q 460 190 390 190" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="452" y="226" font-size="10" fill="#d6a040" font-weight="bold">循环</text>

  <line x1="250" y1="286" x2="250" y2="304" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision -->
  <polygon points="250,306 360,346 250,386 140,346" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="350" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">rem == 0 ?</text>

  <!-- Yes branch -->
  <path d="M 140 346 L 80 346 L 80 380" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="384" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="80" y="402" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt -= take</text>
  <text x="80" y="416" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">return take ✓</text>

  <!-- No branch -->
  <path d="M 360 346 L 420 346 L 420 380" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="386" y="340" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="370" y="384" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="402" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">不动库存</text>
  <text x="420" y="416" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">return [-1] ✗</text>

  <!-- complexity tag -->
  <rect x="160" y="432" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="250" y="448" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">时间 O(5)=O(1)，空间 O(1)</text>
</svg>
