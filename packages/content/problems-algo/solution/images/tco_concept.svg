<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：连续奇数计数器——遇奇加一，遇偶清零</text>

  <!-- Highlight bracket for [5,7,23] at indices 5,6,7: x=286..424 -->
  <path d="M 286 48 L 286 40 L 424 40 L 424 48" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="355" y="34" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">三连奇数 ✓</text>

  <!-- Array label -->
  <text x="30" y="74" font-size="11" fill="#888">arr =</text>

  <!-- 9 boxes, x=56,102,148,194,240,286,332,378,424, width=46, height=32 -->
  <!-- Index 0: 1 (odd) -->
  <rect x="56" y="56" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="79" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="79" y="104" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <!-- Index 1: 2 (even) -->
  <rect x="102" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="125" y="104" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <!-- Index 2: 34 (even) -->
  <rect x="148" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">34</text>
  <text x="171" y="104" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <!-- Index 3: 3 (odd) -->
  <rect x="194" y="56" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="217" y="104" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <!-- Index 4: 4 (even) -->
  <rect x="240" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="263" y="104" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <!-- Index 5: 5 (odd) — highlighted -->
  <rect x="286" y="56" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="309" y="104" text-anchor="middle" font-size="9" fill="#888">i=5</text>

  <!-- Index 6: 7 (odd) — highlighted -->
  <rect x="332" y="56" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <text x="355" y="104" text-anchor="middle" font-size="9" fill="#888">i=6</text>

  <!-- Index 7: 23 (odd) — highlighted -->
  <rect x="378" y="56" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="401" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">23</text>
  <text x="401" y="104" text-anchor="middle" font-size="9" fill="#888">i=7</text>

  <!-- Index 8: 12 (even) — not reached -->
  <rect x="424" y="56" width="46" height="32" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="447" y="77" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">12</text>
  <text x="447" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=8</text>

  <!-- Counter label -->
  <text x="30" y="140" font-size="10" fill="#888">cnt =</text>

  <!-- Counter circles: values 1,0,0,1,0,1,2,3,— -->
  <circle cx="79" cy="146" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="79" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <circle cx="125" cy="146" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="125" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>

  <circle cx="171" cy="146" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="171" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>

  <circle cx="217" cy="146" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="217" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <circle cx="263" cy="146" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="263" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>

  <circle cx="309" cy="146" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="309" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <circle cx="355" cy="146" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- cnt=3 — the winner -->
  <circle cx="401" cy="146" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="401" y="151" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>

  <!-- not reached -->
  <circle cx="447" cy="146" r="12" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="447" y="150" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Legend -->
  <rect x="40" y="178" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="60" y="190" font-size="10" fill="#666">奇数 → cnt++</text>
  <rect x="170" y="178" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="190" y="190" font-size="10" fill="#666">偶数 → cnt=0</text>
  <circle cx="306" cy="185" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="190" font-size="10" fill="#666">cnt=3 → 返回 true ⭐</text>

  <!-- Divider -->
  <line x1="30" y1="210" x2="530" y2="210" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Key insight box -->
  <rect x="30" y="224" width="500" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="248" font-size="12" fill="#444" font-weight="bold">关键直觉：维护"当前连续奇数个数" cnt</text>
  <text x="50" y="270" font-size="11" fill="#666">• 遇到奇数：cnt++（连续段延长）</text>
  <text x="50" y="290" font-size="11" fill="#666">• 遇到偶数：cnt = 0（偶数打断连续性，重新计数）</text>
  <text x="50" y="310" font-size="11" fill="#666">• cnt 达到 3：立即返回 true（存在性判定，找到即停）</text>
  <text x="50" y="334" font-size="12" fill="#b85450" font-weight="bold">→ 无需枚举每个窗口，每个元素只看一次</text>
  <text x="50" y="354" font-size="11" fill="#888">奇偶判定用位运算：x &amp; 1（奇数为 1，偶数为 0）</text>
</svg>
