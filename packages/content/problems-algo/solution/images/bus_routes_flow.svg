<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="580" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">公交路线 BFS 算法流程</text>

  <!-- Step 1: source == target? -->
  <polygon points="280,44 370,78 280,112 190,78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="11" fill="#333">source ==</text>
  <text x="280" y="89" text-anchor="middle" font-size="11" fill="#333">target?</text>

  <!-- Yes → return 0 -->
  <path d="M 190 78 L 118 78" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="154" y="70" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <ellipse cx="62" cy="78" rx="52" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="82" text-anchor="middle" font-size="11" fill="#333">返回 0</text>

  <!-- No ↓ -->
  <path d="M 280 112 L 280 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="128" font-size="11" fill="#888">否</text>

  <!-- Step 2: Build stop→routes -->
  <rect x="110" y="136" width="340" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="11" fill="#333">构建 stop → routes 映射：遍历每条路线的每个站点</text>

  <path d="M 280 170 L 280 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Init BFS -->
  <rect x="90" y="194" width="380" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="11" fill="#333">source 所在的所有路线入队 (buses=1)，标记 visited</text>

  <path d="M 280 228 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Queue empty? -->
  <polygon points="280,252 360,288 280,324 200,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#333">队列为空?</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#888">(无可扩展路线)</text>

  <!-- Yes → return -1 -->
  <path d="M 360 288 L 432 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="280" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <ellipse cx="486" cy="288" rx="52" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="292" text-anchor="middle" font-size="11" fill="#333">返回 -1</text>

  <!-- No ↓ -->
  <path d="M 280 324 L 280 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="340" font-size="11" fill="#82b366">否</text>

  <!-- Step 5: Dequeue route -->
  <rect x="90" y="348" width="380" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="369" text-anchor="middle" font-size="11" fill="#333">出队 (route, buses)，遍历 route 上每个 stop</text>

  <path d="M 280 382 L 280 402" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: stop == target? -->
  <polygon points="280,406 380,442 280,478 180,442" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="439" text-anchor="middle" font-size="11" fill="#333">stop ==</text>
  <text x="280" y="453" text-anchor="middle" font-size="11" fill="#333">target?</text>

  <!-- Yes → return buses -->
  <path d="M 380 442 L 430 442" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="434" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <ellipse cx="490" cy="442" rx="58" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="446" text-anchor="middle" font-size="11" fill="#333">返回 buses</text>

  <!-- No ↓ -->
  <path d="M 280 478 L 280 498" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="494" font-size="11" fill="#888">否</text>

  <!-- Step 7: Enqueue unvisited routes + clear stop -->
  <rect x="70" y="502" width="420" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="521" text-anchor="middle" font-size="11" fill="#333">查 stop_to_routes[stop]，未访问路线入队 (buses+1) 并标记</text>
  <text x="280" y="537" text-anchor="middle" font-size="10" fill="#666">clear(stop_to_routes[stop]) — 该站所有路线已处理，不再重复扫描</text>

  <!-- Loop back: from step 7 left → back up to queue-empty decision -->
  <path d="M 70 524 L 20 524 L 20 288 L 200 288" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="406" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 34 406)">继续出队</text>
</svg>
