<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fdfcf7"/>

  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">DP 状态转移：dp[i][j] 的两种情形</text>
  <path d="M 210 42 Q 360 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- top-left: dp[i-1][j-1] -->
  <g filter="url(#sk)"><rect x="80" y="70" width="200" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="180" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">dp[i-1][j-1]</text>
  <text x="180" y="114" text-anchor="middle" font-size="10" fill="#5a5a5a">已匹配 T[0..j-1] 的最大起点</text>

  <!-- top-right: dp[i-1][j] -->
  <g filter="url(#sk)"><rect x="440" y="70" width="200" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="540" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">dp[i-1][j]</text>
  <text x="540" y="114" text-anchor="middle" font-size="10" fill="#5a5a5a">上一行同列（S[i] 不参与）</text>

  <!-- center: dp[i][j] -->
  <g filter="url(#sk)"><rect x="260" y="206" width="200" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="360" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">dp[i][j]</text>
  <text x="360" y="254" text-anchor="middle" font-size="10" fill="#5a5a5a">以 S[i] 结尾匹配 T[0..j] 的最大起点</text>

  <!-- arrow left -> center (match case) -->
  <path d="M 180 126 Q 180 170 300 210" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="120" y="172" font-size="11" font-weight="bold" fill="#2e6e2e">① 匹配</text>
  <text x="120" y="188" font-size="10" fill="#444">S[i] == T[j]</text>
  <text x="40" y="206" font-size="10" fill="#444">j &gt; 0:</text>
  <text x="40" y="220" font-size="10" font-weight="bold" fill="#2e6e2e">dp[i][j] = dp[i-1][j-1]</text>

  <!-- arrow right -> center (no match case) -->
  <path d="M 540 126 Q 540 170 420 210" stroke="#888" stroke-width="2" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="560" y="172" font-size="11" font-weight="bold" fill="#2b6e9e">② 不匹配</text>
  <text x="560" y="188" font-size="10" fill="#444">S[i] != T[j]</text>
  <text x="560" y="206" font-size="10" fill="#444">S[i] 不参与匹配 T[j]</text>
  <text x="560" y="220" font-size="10" font-weight="bold" fill="#2b6e9e">dp[i][j] = dp[i-1][j]</text>

  <!-- base case note -->
  <g filter="url(#sk)">
    <rect x="60" y="298" width="600" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="322" font-size="12" font-weight="bold" fill="#7a5415">边界：j == 0（匹配 T 的首字符）</text>
  <text x="80" y="342" font-size="11" fill="#444">若 S[i] == T[0] → dp[i][0] = i（起点即自己）；否则 dp[i][0] = dp[i-1][0]（继承前一个首字符匹配）</text>
  <text x="80" y="358" font-size="11" fill="#b85450">答案：j == n-1 且 dp[i][n-1] != -1 时，窗口长 = i - dp[i][n-1] + 1，取最小</text>
</svg>
