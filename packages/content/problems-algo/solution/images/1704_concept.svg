<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：单遍对冲计数 —— 前半 +1、后半 −1，终值为零即相近</text>

  <!-- string label -->
  <text x="56" y="80" font-size="12" fill="#888" filter="url(#rough2)">s = "textbook"（n = 8, n/2 = 4）</text>

  <!-- 8 cells: first half blue, second half green -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="104" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="126" y="90" filter="url(#rough2)">t</text>
    <rect x="148" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="90" filter="url(#rough2)">e</text>
    <rect x="192" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="214" y="90" filter="url(#rough2)">x</text>
    <rect x="236" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="90" filter="url(#rough2)">t</text>
    <rect x="280" y="66" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="302" y="90" filter="url(#rough2)">b</text>
    <rect x="324" y="66" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="346" y="90" filter="url(#rough2)">o</text>
    <rect x="368" y="66" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="90" filter="url(#rough2)">o</text>
    <rect x="412" y="66" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="434" y="90" filter="url(#rough2)">k</text>
  </g>

  <!-- highlight vowels with red border: e, o, o -->
  <rect x="146" y="64" width="48" height="40" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="322" y="64" width="48" height="40" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="366" y="64" width="48" height="40" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>

  <!-- divider line between halves -->
  <path d="M 280 54 L 280 118" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前半 a（i &lt; 4）</text>
  <text x="360" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后半 b（i ≥ 4）</text>

  <!-- counter contribution chips -->
  <text x="56" y="160" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">元音贡献：</text>

  <rect x="120" y="148" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="168" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e（前半）</text>
  <text x="168" y="180" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt += 1</text>

  <rect x="232" y="148" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o（后半）</text>
  <text x="280" y="180" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt -= 1</text>

  <rect x="344" y="148" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="392" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o（后半）</text>
  <text x="392" y="180" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt -= 1</text>

  <!-- result box -->
  <rect x="104" y="208" width="352" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt = (+1) + (−1) + (−1) = <tspan fill="#b85450" font-weight="bold">−1</tspan></text>
  <text x="280" y="247" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1 ≠ 0 → 两半不相近 → 返回 false</text>

  <!-- key insight -->
  <path d="M 40 276 L 520 276" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="298" font-size="11.5" fill="#555" filter="url(#rough2)">• 不必分别统计再比较，用 <tspan fill="#446688" font-weight="bold">带符号累加</tspan> 把"比较相等"转为"判零"</text>
  <text x="56" y="316" font-size="11.5" fill="#555" filter="url(#rough2)">• cnt 终值 = (前半元音数) − (后半元音数)；<tspan fill="#4a7a3a" font-weight="bold">cnt == 0</tspan> ⇔ 相近</text>
</svg>
