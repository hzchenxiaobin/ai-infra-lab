<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：滚动变量版线性 DP —— O(n) 时间 / O(1) 空间</text>

  <!-- 初始化 -->
  <rect x="150" y="40" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a1=A[0]，b1=B[0]，a2=b2=0，i=1</text>

  <path d="M 260 76 L 260 94" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,98 340,124 260,150 180,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 260 150 L 260 166" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="270" y="162" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 转移 -->
  <rect x="110" y="168" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">curA = max(a1, b2) + A[i]</text>
  <text x="260" y="203" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">curB = max(b1, a2) + B[i]</text>
  <text x="418" y="190" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">续杯 or</text>
  <text x="418" y="204" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">切换</text>

  <path d="M 260 212 L 260 228" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 滚动 -->
  <rect x="110" y="230" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">滚动：a2,b2 ← a1,b1；a1,b1 ← curA,curB</text>
  <text x="260" y="266" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i++</text>

  <!-- 循环回边 -->
  <path d="M 412 252 C 468 252, 468 124, 344 124" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="478" y="190" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">循环</text>

  <!-- 否 -->
  <path d="M 178 124 L 74 124 L 74 300 L 156 300" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 返回 -->
  <rect x="160" y="282" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 max(a1, b1)</text>

  <!-- 溢出提醒 -->
  <rect x="90" y="328" width="340" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">溢出提醒：总和最大 10¹⁰，C++ 需 long long</text>
</svg>
