<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="490" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建匹配表 → 建位置位集 → 预算 acc → Shift-AND 求交</text>

  <!-- Start -->
  <ellipse cx="240" cy="54" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="59" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="240" y1="72" x2="240" y2="90" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="80" y="92" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="114" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 建 ok[a][b]：对角线 true + mappings（不传递）</text>

  <line x1="240" y1="126" x2="240" y2="144" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="80" y="146" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="168" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 扫 s，pos[s[p]] 第 p 位置 1</text>

  <line x1="240" y1="180" x2="240" y2="198" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="60" y="200" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="216" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 预算 acc[a] = OR of pos[b]</text>
  <text x="240" y="232" text-anchor="middle" font-size="10.5" fill="#888">b 取所有 ok[a][b]=true（含自身）</text>

  <line x1="240" y1="240" x2="240" y2="258" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cand = all ones -->
  <rect x="150" y="260" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="280" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">cand = 全 1；i = 0</text>

  <line x1="240" y1="290" x2="240" y2="300" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: i < m ? -->
  <polygon points="240,300 326,324 240,348 154,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="328" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">i &lt; m ?</text>
  <!-- 否 → right → return cand != 0 -->
  <text x="334" y="318" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="326" y1="324" x2="346" y2="324" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="346" y="308" width="128" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="328" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return cand!=0</text>
  <!-- 是 ↓ -->
  <text x="250" y="362" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="240" y1="348" x2="240" y2="366" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 body -->
  <rect x="70" y="368" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="390" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ cand &amp;= acc[sub[i]] &gt;&gt; i</text>

  <line x1="240" y1="402" x2="240" y2="418" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2: cand == 0 ? -->
  <polygon points="240,418 332,442 240,466 148,442" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="446" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cand == 0 ?</text>
  <!-- 是 → right → return false -->
  <text x="340" y="436" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="332" y1="442" x2="346" y2="442" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="346" y="426" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="404" y="446" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>
  <!-- 否 → left loop back to diamond 1 -->
  <text x="140" y="436" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 148 442 L 44 442 L 44 324 L 154 324" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="316" font-size="10.5" fill="#4a7a3a" font-weight="bold">i++，下一轮</text>
</svg>
