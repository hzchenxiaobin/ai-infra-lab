<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐叶比较，全局最优中途更新</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">例2　root = [25,1,3,1,3,0,2]　DFS 先左后右</text>

  <!-- tree: 25(z) -> 1(b),3(d) ; 1 -> 1(b),3(d) ; 3 -> 0(a),2(c) -->
  <!-- root z -->
  <circle cx="280" cy="74" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">z</text>
  <text x="306" y="68" font-size="9" fill="#888">25</text>

  <!-- b(1) left, d(3) right -->
  <circle cx="210" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="135" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="234" y="124" font-size="9" fill="#888">1</text>
  <circle cx="350" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="135" text-anchor="middle" font-size="13" fill="#333">d</text>
  <text x="374" y="124" font-size="9" fill="#888">3</text>

  <path d="M 267 88 L 222 114" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 293 88 L 338 114" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- leaves: b(1) ①, d(3) ②, a(0) ③, c(2) ④ -->
  <circle cx="172" cy="196" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="201" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="148" y="218" font-size="10" fill="#4a7a3a" font-weight="bold">①</text>

  <circle cx="248" cy="196" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="248" y="201" text-anchor="middle" font-size="13" fill="#333">d</text>
  <text x="224" y="218" font-size="10" fill="#446688" font-weight="bold">②</text>

  <circle cx="312" cy="196" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="312" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="296" y="218" font-size="10" fill="#b85450" font-weight="bold">③ ← 更新</text>

  <circle cx="388" cy="196" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="388" y="201" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="364" y="218" font-size="10" fill="#446688" font-weight="bold">④</text>

  <path d="M 198 144 L 178 178" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 222 144 L 242 178" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 338 144 L 318 178" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 362 144 L 382 178" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- table -->
  <path d="M 30 244 L 530 244" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">逐叶演算（root→leaf 路径到叶翻转得候选）</text>

  <!-- header -->
  <rect x="40" y="276" width="40" height="22" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="291" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步</text>
  <rect x="84" y="276" width="80" height="22" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="124" y="291" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">root→leaf</text>
  <rect x="168" y="276" width="92" height="22" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="214" y="291" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">候选(叶→根)</text>
  <rect x="264" y="276" width="100" height="22" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="314" y="291" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">比较</text>
  <rect x="368" y="276" width="80" height="22" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="408" y="291" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">best</text>

  <!-- row 1 -->
  <rect x="40" y="302" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="318" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="84" y="302" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="124" y="318" text-anchor="middle" font-size="10" fill="#333">z b b</text>
  <rect x="168" y="302" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="318" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">bbz</text>
  <rect x="264" y="302" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="318" text-anchor="middle" font-size="9" fill="#888">best 空 → 设</text>
  <rect x="368" y="302" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="408" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bbz</text>

  <!-- row 2 -->
  <rect x="40" y="330" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="346" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="84" y="330" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="124" y="346" text-anchor="middle" font-size="10" fill="#333">z b d</text>
  <rect x="168" y="330" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="346" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">dbz</text>
  <rect x="264" y="330" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="346" text-anchor="middle" font-size="9" fill="#b85450">d &gt; b → 不换</text>
  <rect x="368" y="330" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="408" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bbz</text>

  <!-- row 3 (update) -->
  <rect x="40" y="358" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="60" y="374" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="84" y="358" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="124" y="374" text-anchor="middle" font-size="10" fill="#333">z d a</text>
  <rect x="168" y="358" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="214" y="374" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">adz</text>
  <rect x="264" y="358" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="314" y="374" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">a &lt; b → 更新</text>
  <rect x="368" y="358" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="408" y="374" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">adz</text>

  <!-- row 4 -->
  <rect x="40" y="386" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="402" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="84" y="386" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="124" y="402" text-anchor="middle" font-size="10" fill="#333">z d c</text>
  <rect x="168" y="386" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="402" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">cdz</text>
  <rect x="264" y="386" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="402" text-anchor="middle" font-size="9" fill="#b85450">c &gt; a → 不换</text>
  <rect x="368" y="386" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="408" y="402" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">adz</text>

  <!-- final -->
  <rect x="150" y="418" width="260" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">最终答案 = adz</text>
</svg>
