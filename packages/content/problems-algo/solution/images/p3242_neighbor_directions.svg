<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">八邻居分两组：相邻 vs 对角</text>

  <!-- 左：内部格 5x5 -->
  <text x="146" y="52" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">内部格 v=(2,2)</text>

  <g filter="url(#rough2)">
    <rect x="36" y="64" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="80" y="64" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="124" y="64" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="168" y="64" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="212" y="64" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="36" y="108" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="80" y="108" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="124" y="108" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="168" y="108" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="212" y="108" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="36" y="152" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="80" y="152" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="124" y="152" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="168" y="152" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="212" y="152" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="36" y="196" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="80" y="196" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="124" y="196" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="168" y="196" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="212" y="196" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="36" y="240" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="80" y="240" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="124" y="240" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="168" y="240" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="212" y="240" width="44" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
  </g>

  <text x="146" y="177" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="146" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">上</text>
  <text x="146" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">下</text>
  <text x="102" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">左</text>
  <text x="190" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">右</text>

  <path d="M 146 160 L 146 138" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>
  <path d="M 146 188 L 146 210" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>
  <path d="M 138 174 L 112 174" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>
  <path d="M 154 174 L 180 174" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>
  <path d="M 138 166 L 114 138" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 154 166 L 178 138" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 138 182 L 114 210" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 154 182 L 178 210" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <text x="146" y="304" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">内部格：相邻 4 个 + 对角 4 个</text>

  <!-- 右：角落格 3x3（左上角带越界虚线格） -->
  <text x="368" y="48" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">角落格 v=(0,0)</text>

  <g filter="url(#rough2)">
    <rect x="288" y="56" width="40" height="40" fill="#fdf1f3" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="328" y="56" width="40" height="40" fill="#fdf1f3" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="288" y="96" width="40" height="40" fill="#fdf1f3" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="368" y="56" width="40" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="408" y="56" width="40" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="328" y="96" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="368" y="96" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="408" y="96" width="40" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="328" y="136" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="368" y="136" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="408" y="136" width="40" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="328" y="176" width="40" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="368" y="176" width="40" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <rect x="408" y="176" width="40" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="308" y="82" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">×</text>
    <text x="348" y="82" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">×</text>
    <text x="308" y="122" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">×</text>
    <text x="348" y="120" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">v</text>
    <text x="388" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">→</text>
    <text x="348" y="160" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">↓</text>
    <text x="388" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">↘</text>
  </g>

  <text x="368" y="240" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">角落格：相邻 2 个 + 对角 1 个</text>
  <text x="368" y="258" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">虚线格 × = 越界，自动跳过</text>

  <!-- 底部图例 -->
  <rect x="36" y="316" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="146" y="339" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">adjacentSum = 上 + 下 + 左 + 右</text>
  <rect x="276" y="316" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="386" y="339" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diagonalSum = 四个角之和</text>
</svg>
