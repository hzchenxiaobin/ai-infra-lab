<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：两种候选对比</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序后 nums = [-100, -98, 1, 2, 3]，n = 5</text>

  <text x="40" y="78" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后数组：</text>

  <g filter="url(#rough2)" font-size="9" fill="#999">
    <text x="120" y="78" text-anchor="middle">0</text>
    <text x="168" y="78" text-anchor="middle">1</text>
    <text x="216" y="78" text-anchor="middle">2</text>
    <text x="264" y="78" text-anchor="middle">3</text>
    <text x="312" y="78" text-anchor="middle">4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="98" y="84" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="120" y="107" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">−100</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="146" y="84" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="168" y="107" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">−98</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="194" y="84" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="216" y="107" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="242" y="84" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="264" y="107" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="290" y="84" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="312" y="107" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">3</text>
  </g>

  <text x="312" y="74" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">↑ 最大</text>
  <text x="144" y="74" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">↑ 两最小</text>

  <g filter="url(#rough2)">
    <rect x="30" y="140" width="240" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="150" y="162" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">候选一：三个最大值</text>
    <text x="150" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a">下标 [n-3, n-2, n-1] = [2, 3, 4]</text>
    <text x="150" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a">数值：1 × 2 × 3</text>
    <rect x="80" y="210" width="140" height="30" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="150" y="230" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">= 6</text>
    <text x="150" y="258" text-anchor="middle" font-size="10" fill="#888">三个正数，未利用负数</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="290" y="140" width="240" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="410" y="162" text-anchor="middle" font-size="12.5" fill="#a07820" font-weight="bold">候选二：两最小 × 最大</text>
    <text x="410" y="180" text-anchor="middle" font-size="11" fill="#d6a040">下标 [0, 1, n-1] = [0, 1, 4]</text>
    <text x="410" y="198" text-anchor="middle" font-size="11" fill="#d6a040">数值：(−100) × (−98) × 3</text>
    <rect x="330" y="210" width="160" height="30" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="410" y="230" text-anchor="middle" font-size="13" fill="#a07820" font-weight="bold">= 29400 ✓</text>
    <text x="410" y="258" text-anchor="middle" font-size="10" fill="#888">两负凑正，反超！</text>
  </g>

  <path d="M 216 118 L 150 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 264 118 L 175 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 312 118 L 195 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <path d="M 120 118 L 330 140" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 168 118 L 360 140" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 312 118 L 410 140" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="130" y="290" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="280" y="312" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">max(6, 29400) = 29400</text>
    <text x="280" y="328" text-anchor="middle" font-size="10.5" fill="#888">候选二胜出 → 返回 29400</text>
  </g>

  <path d="M 150 270 L 220 290" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 270 L 340 290" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="348" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="370" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">规律：</text>
  <text x="48" y="388" font-size="11" fill="#555" filter="url(#rough2)">• 存在「两个绝对值很大的负数」时，候选二反超（两负凑大正）</text>
  <text x="48" y="402" font-size="11" fill="#555" filter="url(#rough2)">• 否则候选一（三个最大值）就是答案。两种候选取 max 统一处理。</text>
</svg>
