<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="370" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：180° 旋转 = 反序 + 逐位映射</text>

  <!-- ===== Left: valid rotation mapping table ===== -->
  <text x="140" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">有效数字旋转映射</text>

  <!-- 0 → 0 (unchanged, green) -->
  <rect x="64" y="66" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="87" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="116" y="85" font-size="14" fill="#4a7a3a" font-weight="bold">→</text>
  <rect x="138" y="66" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="87" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="190" y="85" font-size="10" fill="#888">不变</text>

  <!-- 1 → 1 (unchanged, green) -->
  <rect x="64" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="125" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="116" y="123" font-size="14" fill="#4a7a3a" font-weight="bold">→</text>
  <rect x="138" y="104" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="125" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="190" y="123" font-size="10" fill="#888">不变</text>

  <!-- 6 → 9 (swapped, orange) -->
  <rect x="64" y="142" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="163" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <text x="116" y="161" font-size="14" fill="#d6a040" font-weight="bold">→</text>
  <rect x="138" y="142" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="163" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">9</text>
  <text x="190" y="161" font-size="10" fill="#d6a040" font-weight="bold">互换</text>

  <!-- 8 → 8 (unchanged, green) -->
  <rect x="64" y="180" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="201" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
  <text x="116" y="199" font-size="14" fill="#4a7a3a" font-weight="bold">→</text>
  <rect x="138" y="180" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="201" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
  <text x="190" y="199" font-size="10" fill="#888">不变</text>

  <!-- 9 → 6 (swapped, orange) -->
  <rect x="64" y="218" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="239" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
  <text x="116" y="237" font-size="14" fill="#d6a040" font-weight="bold">→</text>
  <rect x="138" y="218" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="239" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">6</text>
  <text x="190" y="237" font-size="10" fill="#d6a040" font-weight="bold">互换</text>

  <!-- ===== Right top: invalid digits ===== -->
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">无效数字（旋转后非法）</text>
  <rect x="290" y="64" width="220" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>

  <rect x="306" y="78" width="32" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <rect x="346" y="78" width="32" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <rect x="386" y="78" width="32" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <rect x="426" y="78" width="32" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>
  <rect x="466" y="78" width="32" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="482" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>

  <text x="400" y="122" text-anchor="middle" font-size="10.5" fill="#b85450">含任一即返回 false</text>

  <!-- ===== Right bottom: rotation example 89 → 68 ===== -->
  <text x="400" y="154" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">旋转示例：89 → 68</text>
  <rect x="290" y="164" width="220" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>

  <!-- original 89 -->
  <rect x="312" y="178" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="329" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="352" y="178" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="369" y="198" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <text x="398" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">↻180°</text>

  <!-- rotated 68 -->
  <rect x="312" y="218" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="329" y="238" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">6</text>
  <rect x="352" y="218" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="238" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">8</text>
  <text x="398" y="236" font-size="10" fill="#888">反序+映射</text>
  <text x="470" y="236" font-size="11" fill="#b85450" font-weight="bold">≠ 89</text>

  <!-- ===== Bottom: formula ===== -->
  <rect x="40" y="278" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">易混淆 = 全部位有效 AND rotated ≠ n（rotated = 反序 + 映射）</text>

  <!-- bottom note -->
  <rect x="40" y="322" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：180° 旋转同时翻转位序 + 逐位映射；6↔9 互换，0/1/8 不变</text>
  <text x="270" y="354" text-anchor="middle" font-size="10" fill="#888">rotated = n 时为中心对称数（strobogrammatic），非易混淆</text>
</svg>
