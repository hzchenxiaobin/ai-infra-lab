<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：先定 min/max，再数「夹中间」的元素</text>

  <!-- ====== Example 1 ====== -->
  <text x="36" y="62" font-size="12" fill="#446688" font-weight="bold">示例 1：nums = [11, 7, 2, 15]</text>

  <text x="36" y="86" font-size="10" fill="#888">第一遍 → min = 2, max = 15</text>

  <!-- array row -->
  <rect x="90" y="96" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="122" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">11</text>

  <rect x="146" y="96" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="122" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">7</text>

  <rect x="202" y="96" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="122" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2</text>

  <rect x="258" y="96" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="122" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">15</text>

  <!-- check marks row -->
  <text x="118" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2&lt;x&lt;15 ✓</text>
  <text x="174" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2&lt;x&lt;15 ✓</text>
  <text x="230" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">x=min ✗</text>
  <text x="286" y="156" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">x=max ✗</text>

  <!-- result -->
  <rect x="120" y="172" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="240" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt = 2（11、7）→ 输出 2</text>

  <!-- divider -->
  <path d="M 30 216 L 530 216" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Example 2 ====== -->
  <text x="36" y="244" font-size="12" fill="#446688" font-weight="bold">示例 2：nums = [-3, 3, 3, 90]</text>

  <text x="36" y="268" font-size="10" fill="#888">第一遍 → min = -3, max = 90；注意有两个 3</text>

  <!-- array row -->
  <rect x="90" y="278" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="118" y="304" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">-3</text>

  <rect x="146" y="278" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="304" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>

  <rect x="202" y="278" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="304" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>

  <rect x="258" y="278" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="304" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">90</text>

  <!-- check marks row -->
  <text x="118" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">x=min ✗</text>
  <text x="174" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">-3&lt;x&lt;90 ✓</text>
  <text x="230" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">-3&lt;x&lt;90 ✓</text>
  <text x="286" y="338" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">x=max ✗</text>

  <!-- result -->
  <rect x="120" y="354" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt = 2（两个 3 都计入）→ 输出 2</text>

  <!-- divider -->
  <path d="M 30 398 L 530 398" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Edge case note ====== -->
  <rect x="60" y="412" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">边界：若所有元素相等 → min == max → 无元素可夹</text>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#555">如 [6,6,6]：min=max=6，循环判定 6&lt;x&lt;6 恒假 → 返回 0</text>
</svg>
