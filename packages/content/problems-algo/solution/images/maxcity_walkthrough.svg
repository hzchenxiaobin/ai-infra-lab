<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：stations=[1,2,4,5,0], r=1, k=2</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">初始电量 p=[3,7,11,9,5]，lo=min(p)=3，hi=Σstations+k=12+2=14</text>

  <!-- ============ Panel P=5 ============ -->
  <rect x="30" y="58" width="560" height="260" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="80" font-size="12" fill="#4a7a3a" font-weight="bold">check(P=5) ✓</text>

  <!-- table header -->
  <rect x="50" y="92" width="520" height="24" fill="#4a7a3a" filter="url(#rough2)" opacity="0.15"/>
  <text x="70" y="108" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="130" y="108" font-size="11" fill="#333" font-weight="bold">p[i]</text>
  <text x="195" y="108" font-size="11" fill="#333" font-weight="bold">cur</text>
  <text x="262" y="108" font-size="11" fill="#333" font-weight="bold">total</text>
  <text x="335" y="108" font-size="11" fill="#333" font-weight="bold">need</text>
  <text x="405" y="108" font-size="11" fill="#333" font-weight="bold">added</text>
  <text x="480" y="108" font-size="11" fill="#333" font-weight="bold">d 变化</text>

  <!-- row i=0 -->
  <text x="70" y="134" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="130" y="134" font-size="11" fill="#333">3</text>
  <text x="195" y="134" font-size="11" fill="#333">0</text>
  <text x="262" y="134" font-size="11" fill="#b85450" font-weight="bold">3 &lt;5</text>
  <text x="335" y="134" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="405" y="134" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="480" y="134" font-size="11" fill="#4a7a3a">j=1, d[3]−=2</text>

  <!-- row i=1 -->
  <text x="70" y="158" font-size="11" fill="#333">1</text>
  <text x="130" y="158" font-size="11" fill="#333">7</text>
  <text x="195" y="158" font-size="11" fill="#4a7a3a">2</text>
  <text x="262" y="158" font-size="11" fill="#4a7a3a">9 ≥5</text>
  <text x="335" y="158" font-size="11" fill="#888">0</text>
  <text x="405" y="158" font-size="11" fill="#888">2</text>
  <text x="480" y="158" font-size="11" fill="#888">—</text>

  <!-- row i=2 -->
  <text x="70" y="182" font-size="11" fill="#333">2</text>
  <text x="130" y="182" font-size="11" fill="#333">11</text>
  <text x="195" y="182" font-size="11" fill="#4a7a3a">2</text>
  <text x="262" y="182" font-size="11" fill="#4a7a3a">13 ≥5</text>
  <text x="335" y="182" font-size="11" fill="#888">0</text>
  <text x="405" y="182" font-size="11" fill="#888">2</text>
  <text x="480" y="182" font-size="11" fill="#888">—</text>

  <!-- row i=3 -->
  <text x="70" y="206" font-size="11" fill="#333">3</text>
  <text x="130" y="206" font-size="11" fill="#333">9</text>
  <text x="195" y="206" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="262" y="206" font-size="11" fill="#4a7a3a">9 ≥5</text>
  <text x="335" y="206" font-size="11" fill="#888">0</text>
  <text x="405" y="206" font-size="11" fill="#888">2</text>
  <text x="480" y="206" font-size="11" fill="#888">cur+=d[3]=−2</text>

  <!-- row i=4 -->
  <text x="70" y="230" font-size="11" fill="#333">4</text>
  <text x="130" y="230" font-size="11" fill="#333">5</text>
  <text x="195" y="230" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="262" y="230" font-size="11" fill="#4a7a3a">5 ≥5</text>
  <text x="335" y="230" font-size="11" fill="#888">0</text>
  <text x="405" y="230" font-size="11" fill="#888">2</text>
  <text x="480" y="230" font-size="11" fill="#888">—</text>

  <!-- result line -->
  <text x="50" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">返回 added=2 ≤ k=2 ✓ 可行 → ans=5, lo=6</text>
  <text x="50" y="288" font-size="11" fill="#444">注：i=0 把 2 座新站放 j=min(0+1,4)=1（覆盖[0,2]），cur 立刻 +2；到 i=3 出覆盖区，d[3] 撤销 −2。</text>
  <text x="50" y="306" font-size="11" fill="#444">与官方解释"建在城市1"完全一致——贪心天然命中最优选址。</text>

  <!-- ============ Panel P=6 ============ -->
  <rect x="30" y="332" width="560" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="354" font-size="12" fill="#b85450" font-weight="bold">check(P=6) ✗</text>

  <!-- header -->
  <rect x="50" y="366" width="520" height="22" fill="#b85450" filter="url(#rough2)" opacity="0.12"/>
  <text x="70" y="381" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="130" y="381" font-size="11" fill="#333" font-weight="bold">p[i]</text>
  <text x="195" y="381" font-size="11" fill="#333" font-weight="bold">cur</text>
  <text x="262" y="381" font-size="11" fill="#333" font-weight="bold">total</text>
  <text x="335" y="381" font-size="11" fill="#333" font-weight="bold">need</text>
  <text x="405" y="381" font-size="11" fill="#333" font-weight="bold">added</text>

  <!-- row i=0 -->
  <text x="70" y="406" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="130" y="406" font-size="11" fill="#333">3</text>
  <text x="195" y="406" font-size="11" fill="#333">0</text>
  <text x="262" y="406" font-size="11" fill="#b85450" font-weight="bold">3 &lt;6</text>
  <text x="335" y="406" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="405" y="406" font-size="11" fill="#b85450" font-weight="bold">3&gt;k=2</text>

  <text x="50" y="430" font-size="12" fill="#b85450" font-weight="bold">added=3 &gt; k=2 立即返回 false ✗ 不可行 → hi=5</text>

  <!-- ============ Conclusion ============ -->
  <rect x="30" y="456" width="560" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="476" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">lo=6 &gt; hi=5 二分结束，答案 ans = 5</text>
</svg>
