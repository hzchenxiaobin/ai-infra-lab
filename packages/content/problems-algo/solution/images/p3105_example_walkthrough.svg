<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：[1,4,3,3,2] 双计数器逐轮轨迹（示例 1）</text>

  <!-- header row -->
  <rect x="60" y="44" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="130" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="205" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">与前一个比较</text>
  <text x="280" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">inc</text>
  <text x="340" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dec</text>
  <text x="415" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- rows -->
  <rect x="60" y="74" width="400" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="106" width="400" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="138" width="400" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="170" width="400" height="32" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="202" width="400" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- column separators -->
  <line x1="100" y1="44" x2="100" y2="234" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="44" x2="160" y2="234" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="44" x2="250" y2="234" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="44" x2="310" y2="234" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="44" x2="370" y2="234" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- highlighted cells -->
  <rect x="250" y="106" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="138" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="202" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="80" y="95" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="130" y="95" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="205" y="95" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—（初始）</text>
  <text x="280" y="95" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="340" y="95" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="415" y="95" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>

  <!-- row 1 -->
  <text x="80" y="127" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="130" y="127" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="205" y="127" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4 &gt; 1 ↑</text>
  <text x="280" y="127" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="340" y="127" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="415" y="127" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>

  <!-- row 2 -->
  <text x="80" y="159" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="130" y="159" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="205" y="159" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 &lt; 4 ↓</text>
  <text x="280" y="159" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="340" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="415" y="159" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>

  <!-- row 3: equal reset -->
  <text x="80" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="130" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="205" y="191" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ＝ 3</text>
  <text x="280" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="340" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="415" y="191" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>

  <!-- row 4 -->
  <text x="80" y="223" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="130" y="223" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="205" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 &lt; 3 ↓</text>
  <text x="280" y="223" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="340" y="223" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="415" y="223" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>

  <!-- outer border -->
  <rect x="60" y="44" width="400" height="190" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- mini example boxes -->
  <rect x="26" y="264" width="228" height="80" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="286" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">[3,3,3,3] → 1</text>
  <text x="140" y="308" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">相邻对全是「＝」（示例 2）</text>
  <text x="140" y="326" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">双计数器每轮都重置为 1</text>

  <rect x="266" y="264" width="228" height="80" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="286" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">[3,2,1] → 3</text>
  <text x="380" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">相邻对全是「＜」（示例 3）</text>
  <text x="380" y="326" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">dec 一路接龙 1 → 2 → 3</text>

  <!-- footer note -->
  <rect x="70" y="360" width="380" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">「＝」行（i = 3）：两个计数器同时打回 1，ans 靠历史最大值兜住</text>
</svg>
