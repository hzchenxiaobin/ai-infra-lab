<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 475" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="475" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">填充书架：算法流程</text>
  <path d="M 200 34 Q 330 42 460 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Node 1: Start -->
  <g filter="url(#sk2)"><ellipse cx="220" cy="54" rx="50" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="220" y="58" text-anchor="middle" font-size="12" fill="#2b2b2b">开始</text>
  <path d="M 220 68 L 220 78" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Node 2: Init -->
  <g filter="url(#sk2)"><rect x="140" y="80" width="160" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="220" y="100" text-anchor="middle" font-size="11" fill="#2b2b2b">dp[0]=0, dp[1..n]=∞</text>
  <path d="M 220 110 L 220 120" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Node 3: i <= n? (diamond) -->
  <g filter="url(#sk2)"><polygon points="220,122 266,150 220,178 174,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="220" y="154" text-anchor="middle" font-size="11" fill="#5a4a1a" font-weight="bold">i ≤ n ?</text>

  <!-- Node 3 No -> Return -->
  <path d="M 266 150 L 468 150" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="366" y="144" text-anchor="middle" font-size="10" fill="#888">否</text>
  <g filter="url(#sk2)"><rect x="468" y="133" width="124" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="530" y="155" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">返回 dp[n]</text>

  <!-- Node 3 Yes -> down -->
  <path d="M 220 178 L 220 188" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="186" font-size="10" fill="#888">是</text>

  <!-- Node 4: j=i; width=0; h=0 -->
  <g filter="url(#sk2)"><rect x="150" y="190" width="140" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="220" y="210" text-anchor="middle" font-size="11" fill="#2b2b2b">j = i; width = 0; h = 0</text>
  <path d="M 220 220 L 220 230" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Node 5: j >= 1? (diamond) -->
  <g filter="url(#sk2)"><polygon points="220,232 264,258 220,284 176,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="220" y="262" text-anchor="middle" font-size="11" fill="#5a4a1a" font-weight="bold">j ≥ 1 ?</text>

  <!-- Node 5 No -> i++ -->
  <path d="M 264 258 L 390 258" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="326" y="252" text-anchor="middle" font-size="10" fill="#888">否</text>
  <g filter="url(#sk2)"><rect x="390" y="241" width="84" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="432" y="263" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">i++</text>

  <!-- i++ loop back up to i<=n (right side, x=600) -->
  <path d="M 432 241 L 600 241 L 600 131 L 238 131" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="596" y="190" text-anchor="end" font-size="9" fill="#4a8e4a">回外层循环</text>

  <!-- Node 5 Yes -> down -->
  <path d="M 220 284 L 220 294" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="292" font-size="10" fill="#888">是</text>

  <!-- Node 7: width += thickness[j-1] -->
  <g filter="url(#sk2)"><rect x="140" y="296" width="160" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="220" y="316" text-anchor="middle" font-size="11" fill="#2b2b2b">width += thickness[j-1]</text>
  <path d="M 220 326 L 220 336" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Node 8: width > shelfWidth? (diamond) -->
  <g filter="url(#sk2)"><polygon points="220,338 280,366 220,394 160,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="220" y="363" text-anchor="middle" font-size="10" fill="#5a4a1a" font-weight="bold">width &gt; shelfW ?</text>

  <!-- Node 8 Yes (break) -> right up to i++ -->
  <path d="M 280 366 L 432 366 L 432 277" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="356" y="360" text-anchor="middle" font-size="10" fill="#b03a3a">是 break</text>

  <!-- Node 8 No -> down -->
  <path d="M 220 394 L 220 404" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="402" font-size="10" fill="#888">否</text>

  <!-- Node 9: h=max; dp[i]=min -->
  <g filter="url(#sk2)"><rect x="96" y="406" width="248" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="220" y="421" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">h = max(h, height[j-1])</text>
  <text x="220" y="436" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">dp[i] = min(dp[i], dp[j-1] + h)</text>

  <!-- j-- loop back to j>=1 (left side) -->
  <path d="M 220 442 L 220 454 L 78 454 L 78 258 L 174 258" stroke="#4a8e4a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="92" y="360" font-size="9" fill="#4a8e4a">j-- 继续</text>

  <!-- Legend for inner/outer loop -->
  <g filter="url(#sk)"><rect x="470" y="300" width="160" height="78" rx="6" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="5 3"/></g>
  <text x="550" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#444">循环层次</text>
  <text x="482" y="338" font-size="9" fill="#446688">━ 外层：i = 1..n</text>
  <text x="482" y="352" font-size="9" fill="#d6a040">◇ 条件判定</text>
  <text x="482" y="366" font-size="9" fill="#4a8e4a">┄ 内层：j 倒序枚举</text>
</svg>
