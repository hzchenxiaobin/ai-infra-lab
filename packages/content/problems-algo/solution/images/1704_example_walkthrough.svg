<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "textbook" 的对冲计数过程</text>

  <!-- Row labels -->
  <text x="44" y="74" font-size="11" fill="#888" filter="url(#rough2)">下标 i</text>
  <text x="44" y="110" font-size="11" fill="#888" filter="url(#rough2)">字符</text>
  <text x="44" y="146" font-size="11" fill="#888" filter="url(#rough2)">元音?</text>
  <text x="44" y="182" font-size="11" fill="#888" filter="url(#rough2)">半区</text>
  <text x="44" y="218" font-size="11" fill="#888" filter="url(#rough2)">cnt</text>

  <!-- 8 columns: index 0-7, cell width 48, start x=88 -->
  <!-- indices -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="112" y="74" filter="url(#rough2)">0</text>
    <text x="160" y="74" filter="url(#rough2)">1</text>
    <text x="208" y="74" filter="url(#rough2)">2</text>
    <text x="256" y="74" filter="url(#rough2)">3</text>
    <text x="304" y="74" filter="url(#rough2)">4</text>
    <text x="352" y="74" filter="url(#rough2)">5</text>
    <text x="400" y="74" filter="url(#rough2)">6</text>
    <text x="448" y="74" filter="url(#rough2)">7</text>
  </g>

  <!-- chars: t e x t | b o o k -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="88" y="92" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="112" y="116" filter="url(#rough2)">t</text>
    <rect x="136" y="92" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="116" filter="url(#rough2)">e</text>
    <rect x="184" y="92" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="208" y="116" filter="url(#rough2)">x</text>
    <rect x="232" y="92" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="256" y="116" filter="url(#rough2)">t</text>
    <rect x="280" y="92" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="304" y="116" filter="url(#rough2)">b</text>
    <rect x="328" y="92" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="352" y="116" filter="url(#rough2)">o</text>
    <rect x="376" y="92" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="400" y="116" filter="url(#rough2)">o</text>
    <rect x="424" y="92" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="448" y="116" filter="url(#rough2)">k</text>
  </g>

  <!-- vowel? row: ✗ ✓ ✗ ✗ ✗ ✓ ✓ ✗ -->
  <g font-size="13" text-anchor="middle">
    <text x="112" y="146" fill="#aaa" filter="url(#rough2)">✗</text>
    <text x="160" y="146" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="208" y="146" fill="#aaa" filter="url(#rough2)">✗</text>
    <text x="256" y="146" fill="#aaa" filter="url(#rough2)">✗</text>
    <text x="304" y="146" fill="#aaa" filter="url(#rough2)">✗</text>
    <text x="352" y="146" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="400" y="146" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="448" y="146" fill="#aaa" filter="url(#rough2)">✗</text>
  </g>

  <!-- half row: 前 前 前 前 | 后 后 后 后 -->
  <g font-size="11" text-anchor="middle">
    <text x="112" y="182" fill="#446688" filter="url(#rough2)">前</text>
    <text x="160" y="182" fill="#446688" filter="url(#rough2)">前</text>
    <text x="208" y="182" fill="#446688" filter="url(#rough2)">前</text>
    <text x="256" y="182" fill="#446688" filter="url(#rough2)">前</text>
    <text x="304" y="182" fill="#4a7a3a" filter="url(#rough2)">后</text>
    <text x="352" y="182" fill="#4a7a3a" filter="url(#rough2)">后</text>
    <text x="400" y="182" fill="#4a7a3a" filter="url(#rough2)">后</text>
    <text x="448" y="182" fill="#4a7a3a" filter="url(#rough2)">后</text>
  </g>

  <!-- cnt row: 0 1 1 1 1 0 -1 -1 -->
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="88" y="200" width="48" height="30" fill="none" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="112" y="220" fill="#888" filter="url(#rough2)">0</text>
    <rect x="136" y="200" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="220" fill="#b85450" filter="url(#rough2)">+1</text>
    <rect x="184" y="200" width="48" height="30" fill="none" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="208" y="220" fill="#888" filter="url(#rough2)">1</text>
    <rect x="232" y="200" width="48" height="30" fill="none" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="256" y="220" fill="#888" filter="url(#rough2)">1</text>
    <rect x="280" y="200" width="48" height="30" fill="none" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="304" y="220" fill="#888" filter="url(#rough2)">1</text>
    <rect x="328" y="200" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="352" y="220" fill="#b85450" filter="url(#rough2)">0</text>
    <rect x="376" y="200" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="400" y="220" fill="#b85450" filter="url(#rough2)">−1</text>
    <rect x="424" y="200" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="448" y="220" fill="#b85450" filter="url(#rough2)">−1</text>
  </g>

  <!-- divider between halves -->
  <path d="M 280 64 L 280 236" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="256" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">前半 a</text>
  <text x="376" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后半 b</text>

  <!-- annotations for vowel steps -->
  <text x="160" y="252" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">e, 前半 → +1</text>
  <text x="352" y="252" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">o, 后半 → −1</text>
  <text x="400" y="252" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">o, 后半 → −1</text>

  <!-- Conclusion -->
  <path d="M 40 272 L 520 272" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="88" y="284" width="384" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">前半元音数 = 1（e），后半元音数 = 2（o, o）</text>
  <text x="280" y="318" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt = 1 − 2 = −1 ≠ 0 → 返回 false</text>

  <!-- Footer note -->
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">红框为元音触发的计数变动；非元音字符 cnt 原样透传</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">对照示例 1 "book"：a="bo"(1), b="ok"(1) → cnt = 1−1 = 0 → true</text>
</svg>
