<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="840" height="440" fill="#fdfcf7"/>

  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">设计哈希映射：桶数组 + 拉链法</text>
  <path d="M 250 42 Q 420 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- hash function box -->
  <g filter="url(#sk)">
    <rect x="510" y="70" width="290" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="655" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">哈希函数</text>
  <text x="655" y="118" text-anchor="middle" font-size="14" fill="#444">h(key) = key mod BASE</text>

  <!-- bucket array label -->
  <text x="160" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">桶数组 buckets[BASE]</text>
  <text x="160" y="104" text-anchor="middle" font-size="10" fill="#888">每个桶 = 一个链表(同义词)</text>

  <!-- bucket array (left) -->
  <g filter="url(#sk)">
    <rect x="70" y="120" width="180" height="248" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="86" y="142" font-size="11" fill="#444" font-weight="bold">idx</text>
  <text x="150" y="142" font-size="11" fill="#444" font-weight="bold">head</text>
  <line x1="80" y1="148" x2="240" y2="148" stroke="#9e9e9e" stroke-width="1" filter="url(#sk)"/>

  <!-- index labels & buckets -->
  <g font-size="11" fill="#444">
    <text x="92" y="168">0</text>
    <text x="92" y="196">1</text>
    <text x="92" y="224">2</text>
    <text x="92" y="252">3</text>
    <text x="92" y="280">4</text>
    <text x="92" y="308">5</text>
    <text x="92" y="336">6</text>
  </g>
  <text x="240" y="356" text-anchor="end" font-size="10" fill="#888">BASE = 7 (示意)</text>

  <!-- bucket cells with arrows -->
  <!-- idx 0: empty -->
  <text x="150" y="168" font-size="12" fill="#bbb">∅</text>
  <!-- idx 1: (1,1) -->
  <path d="M 200 164 L 290 200" stroke="#4a8edb" stroke-width="1.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <!-- idx 2: (2,2) -> (9,9) collision -->
  <path d="M 200 192 L 290 290" stroke="#4a8edb" stroke-width="1.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <!-- idx 3: empty -->
  <text x="150" y="252" font-size="12" fill="#bbb">∅</text>
  <!-- idx 4: (4,40) -->
  <path d="M 200 248 L 290 240" stroke="#4a8edb" stroke-width="1.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <!-- idx 5: empty -->
  <text x="150" y="308" font-size="12" fill="#bbb">∅</text>
  <!-- idx 6: (6,60) -->
  <path d="M 200 304 L 420 240" stroke="#4a8edb" stroke-width="1.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- chains (linked list of (key,val) pairs) -->
  <!-- bucket 1: (1,1) -->
  <g filter="url(#sk)">
    <rect x="290" y="186" width="100" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="340" y="208" text-anchor="middle" font-size="12" fill="#2e6e2e">k=1, v=1</text>

  <!-- bucket 2: (2,2) -> (9,9)  (2%7=2, 9%7=2 冲突) -->
  <g filter="url(#sk)">
    <rect x="290" y="276" width="100" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="340" y="298" text-anchor="middle" font-size="12" fill="#2e6e2e">k=2, v=2</text>
  <path d="M 390 293 L 440 293" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="440" y="276" width="100" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="490" y="298" text-anchor="middle" font-size="12" fill="#b85450">k=9, v=9</text>
  <text x="490" y="326" text-anchor="middle" font-size="10" fill="#b85450">同址冲突→拉链</text>

  <!-- bucket 4: (4,40) -->
  <g filter="url(#sk)">
    <rect x="290" y="226" width="100" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="340" y="248" text-anchor="middle" font-size="12" fill="#2e6e2e">k=4, v=40</text>

  <!-- bucket 6: (6,60) -->
  <g filter="url(#sk)">
    <rect x="420" y="226" width="100" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="470" y="248" text-anchor="middle" font-size="12" fill="#2e6e2e">k=6, v=60</text>

  <!-- operation summary box -->
  <g filter="url(#sk)">
    <rect x="40" y="388" width="760" height="42" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="410" font-size="12" fill="#444"><tspan font-weight="bold" fill="#2e6e2e">put/get/remove：</tspan> 先 h(key) 定桶 → 在该桶链表内线性扫描 key → 命中则改/删，未命中则尾插(put)</text>
  <text x="660" y="410" font-size="11" fill="#888">★ BASE 取质数减少聚集</text>
</svg>
