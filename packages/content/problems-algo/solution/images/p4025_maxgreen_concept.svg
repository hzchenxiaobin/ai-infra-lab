<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：绿灯窗口嵌套，并集 = [0, maxGreen)</text>

  <!-- 灯0：g=3 -->
  <text x="102" y="75" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">灯0 g=3</text>
  <rect x="110" y="60" width="108" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="60" width="252" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 灯1：g=6 -->
  <text x="102" y="110" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">灯1 g=6</text>
  <rect x="110" y="95" width="216" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="326" y="95" width="144" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 灯2：g=8 = maxGreen -->
  <text x="102" y="145" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">灯2 g=8←最大</text>
  <rect x="110" y="130" width="288" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="398" y="130" width="72" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">绿</text>
  <text x="434" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">红</text>

  <!-- maxGreen 竖直分界线 -->
  <path d="M 398,56 L 398,172" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <!-- 时间轴 -->
  <path d="M 106,176 L 474,176" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 110,171 L 110,181" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 398,171 L 398,181" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 470,171 L 470,181" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="197" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="392" y="197" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">maxGreen = 8</text>
  <text x="470" y="197" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">period = 10</text>

  <!-- 车 1：r=4，绿灯 -->
  <path d="M 254,182 L 254,202" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <rect x="240" y="206" width="28" height="12" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="248" cy="220" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="260" cy="220" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="234" y="218" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">r = 4 &lt; maxGreen：分给灯2 → 等待 0</text>

  <!-- 车 2：r=9，红灯 -->
  <path d="M 434,182 L 434,246" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <rect x="420" y="250" width="28" height="12" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="428" cy="264" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="440" cy="264" r="3" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 452,256 L 494,256" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="475" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">下一周期 0 点</text>
  <text x="415" y="288" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">r = 9 ≥ maxGreen：处处红灯 → 等待 period − r = 1</text>

  <!-- 结论框 -->
  <rect x="40" y="302" width="440" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">所有灯同步：绿灯窗口都是 [0, lights[i])，彼此嵌套</text>
  <text x="260" y="341" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r &lt; maxGreen → 等待 0；r ≥ maxGreen → 等待 period − r</text>
</svg>
