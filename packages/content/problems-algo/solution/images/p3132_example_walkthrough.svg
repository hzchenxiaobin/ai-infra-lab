<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：两个官方样例 i=2 一步命中，构造样例需回退到 i=1</text>

  <!-- card 1: example 1 -->
  <rect x="30" y="40" width="460" height="90" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：nums1=[4,20,16,12,8]→[4,8,12,16,20]，nums2=[10,14,18]</text>
  <text x="46" y="84" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=2：x = 10 − 12 = −2 → 删 4、8，配 10/14/18 ✓</text>
  <text x="46" y="112" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 −2（一步命中，且已是最小候选）</text>

  <!-- card 2: example 2 -->
  <rect x="30" y="142" width="460" height="90" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="164" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">例 2：nums1=[3,5,5,3]→[3,3,5,5]，nums2=[7,7]</text>
  <text x="46" y="186" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=2：x = 7 − 5 = 2 → 删两个 3，配 7/7 ✓</text>
  <text x="46" y="214" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 2（重复元素不妨碍贪心配对）</text>

  <!-- card 3: constructed fallback -->
  <rect x="30" y="244" width="460" height="104" fill="#fffdf5" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="46" y="266" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">构造：nums1=[1,5,6,7,100]，nums2=[2,3,4]（真解 x=−3）</text>
  <text x="46" y="288" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=2：x = 2 − 6 = −4 ✗（100−4=96≠4，4 无人可配）</text>
  <text x="46" y="310" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=1：x = 2 − 5 = −3 ✓（删两侧干扰 1 和 100，配 2/3/4）</text>
  <text x="46" y="338" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 −3（回退一枚才命中 → 枚举顺序不可省）</text>

  <!-- bottom note -->
  <rect x="30" y="360" width="460" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">干扰元素可在保留最小的两侧 → i=2 不保证成功，按 2→1→0 回退，首个合法即最小 x</text>
</svg>
