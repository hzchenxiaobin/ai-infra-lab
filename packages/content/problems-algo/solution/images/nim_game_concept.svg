<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">必败态 / 必胜态：4 的倍数是「黑洞」</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每次拿 1~3 颗 → 对手总能把你拿的数补到 4，把 4 的倍数甩回给你</text>

  <!-- ===== Number line 1..12 ===== -->
  <text x="30" y="82" font-size="11" fill="#446688" font-weight="bold">剩余石头数 n（你先手）</text>

  <!-- 12 cells, each 40 wide starting x=40 -->
  <g font-size="12">
    <!-- row of state boxes -->
    <!-- 1 -->
    <rect x="40"  y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="60"  y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="60"  y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">W</text>
    <!-- 2 -->
    <rect x="80"  y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="100" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="100" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">W</text>
    <!-- 3 -->
    <rect x="120" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="140" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">W</text>
    <!-- 4 -->
    <rect x="160" y="96" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="180" y="120" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="180" y="150" text-anchor="middle" font-size="9" fill="#b85450">L</text>
    <!-- 5 -->
    <rect x="200" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="220" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">W</text>
    <!-- 6 -->
    <rect x="240" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="260" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">W</text>
    <!-- 7 -->
    <rect x="280" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="300" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="300" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">W</text>
    <!-- 8 -->
    <rect x="320" y="96" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="340" y="120" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <text x="340" y="150" text-anchor="middle" font-size="9" fill="#b85450">L</text>
    <!-- 9 -->
    <rect x="360" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="380" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="380" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">W</text>
    <!-- 10 -->
    <rect x="400" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="420" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <text x="420" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">W</text>
    <!-- 11 -->
    <rect x="440" y="96" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="460" y="120" text-anchor="middle" fill="#4a7a3a" font-weight="bold">11</text>
    <text x="460" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a">W</text>
    <!-- 12 -->
    <rect x="480" y="96" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="500" y="120" text-anchor="middle" fill="#b85450" font-weight="bold">12</text>
    <text x="500" y="150" text-anchor="middle" font-size="9" fill="#b85450">L</text>
  </g>

  <!-- bracket: 4k are losing -->
  <path d="M 180 160 L 180 168 L 500 168 L 500 160" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="340" y="182" text-anchor="middle" font-size="10" fill="#b85450">n % 4 == 0 → 必败（L）</text>
  <path d="M 60 160 L 60 168 L 140 168 L 140 160" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="100" y="182" text-anchor="middle" font-size="9" fill="#4a7a3a">拿光即赢</text>

  <!-- ===== Complement strategy ===== -->
  <text x="30" y="216" font-size="11" fill="#444" font-weight="bold">「补到 4」策略（对手的完美应对）：</text>

  <rect x="30" y="226" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="248" font-size="11" fill="#333">你拿</text>
  <rect x="78" y="236" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="95" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
  <text x="122" y="248" font-size="11" fill="#333">∈ {1,2,3}，对手就拿</text>
  <rect x="252" y="236" width="58" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 − a</text>
  <text x="318" y="248" font-size="11" fill="#333">→ 每轮合计恰好 4 → 把下一个 4 的倍数甩回给你</text>
  <text x="46" y="268" font-size="9" fill="#888">只要对手不犯错，处于 4 的倍数的一方永远翻不了身</text>

  <!-- ===== Two outcomes ===== -->
  <rect x="30" y="290" width="245" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="152" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">n % 4 != 0 → 必胜 ✓</text>
  <text x="152" y="326" text-anchor="middle" font-size="9" fill="#555">拿 n % 4 颗，留 4 的倍数给对手</text>
  <text x="152" y="338" text-anchor="middle" font-size="9" fill="#555">之后每轮补到 4 即可</text>

  <rect x="285" y="290" width="245" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="407" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">n % 4 == 0 → 必败 ✗</text>
  <text x="407" y="326" text-anchor="middle" font-size="9" fill="#555">无论拿 1/2/3，对手都能补到 4</text>
  <text x="407" y="338" text-anchor="middle" font-size="9" fill="#555">最终你会直面 n = 4 的死局</text>
</svg>
