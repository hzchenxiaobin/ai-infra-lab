<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">二分图最大匹配：男孩 ↔ 女孩</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888">grid[i][j]=1 表示男孩 i 可邀请女孩 j；求最多邀请数 = 最大匹配边数</text>

  <!-- column headers -->
  <text x="95" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">男孩集合 X</text>
  <text x="415" y="78" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">女孩集合 Y</text>

  <!-- ===== boys (left) ===== -->
  <g font-size="13">
    <rect x="60" y="100" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="95" y="122" text-anchor="middle" fill="#333" font-weight="bold">B0</text>
    <rect x="60" y="168" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="95" y="190" text-anchor="middle" fill="#333" font-weight="bold">B1</text>
    <rect x="60" y="236" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="95" y="258" text-anchor="middle" fill="#333" font-weight="bold">B2</text>
  </g>

  <!-- ===== girls (right) ===== -->
  <g font-size="13">
    <rect x="380" y="100" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="415" y="122" text-anchor="middle" fill="#333" font-weight="bold">G0</text>
    <rect x="380" y="168" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="415" y="190" text-anchor="middle" fill="#333" font-weight="bold">G1</text>
    <rect x="380" y="236" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="415" y="258" text-anchor="middle" fill="#333" font-weight="bold">G2</text>
  </g>

  <!-- ===== non-matching edges (thin dashed gray) ===== -->
  <g stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)">
    <!-- B0-G0 -->
    <path d="M 130 117 L 380 117"/>
    <!-- B0-G2 -->
    <path d="M 130 117 L 380 253"/>
    <!-- B1-G2 -->
    <path d="M 130 185 L 380 253"/>
  </g>

  <!-- ===== matching edges (bold green) ===== -->
  <g stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#rough2)">
    <!-- B0-G1 -->
    <path d="M 130 117 L 380 185"/>
    <!-- B1-G0 -->
    <path d="M 130 185 L 380 117"/>
    <!-- B2-G2 -->
    <path d="M 130 253 L 380 253"/>
  </g>
  <g font-size="9" fill="#4a7a3a" font-weight="bold">
    <text x="255" y="146" text-anchor="middle">匹配边</text>
    <text x="255" y="108" text-anchor="middle" fill="#999">候选边</text>
  </g>

  <!-- ===== match array ===== -->
  <rect x="40" y="300" width="250" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="318" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">match[j] = 配对给女孩 j 的男孩</text>
  <text x="165" y="334" text-anchor="middle" font-size="10" fill="#666">match = [B1, B0, B2]（按女孩索引）</text>

  <!-- ===== goal box ===== -->
  <rect x="300" y="300" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="395" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最大匹配 = 3</text>
  <text x="395" y="334" text-anchor="middle" font-size="10" fill="#666">= 最多邀请个数</text>
</svg>
