<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    算法流程：一次扫描，每块一次 flood fill
  </text>

  <!-- start -->
  <rect x="95" y="48" width="150" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="67" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 170,78 L 170,93" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B1: count cnt -->
  <rect x="75" y="96" width="190" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="118" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">统计非阻塞格总数 cnt</text>
  <path d="M 170,132 L 170,149" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B2: scan -->
  <rect x="75" y="152" width="190" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="174" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">逐格扫描 (i, j)</text>
  <path d="M 170,188 L 170,204" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: grid[i][j] > 0 ? -->
  <polygon points="95,212 170,180 245,212 170,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="217" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">grid[i][j] &gt; 0 ?</text>
  <text x="181" y="236" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- no branch -->
  <path d="M 245,212 L 316,212" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="204" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="320" y="194" width="128" height="36" rx="6" fill="#efefef" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="216" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">阻塞或已访问</text>
  <path d="M 384,192 L 384,169 L 268,169" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B3: flood fill -->
  <path d="M 170,246 L 170,257" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="55" y="260" width="230" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="278" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">显式栈 flood fill：累加 s、t</text>
  <text x="170" y="296" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">邻格入栈时累加值并原地置 0</text>
  <path d="M 170,308 L 170,319" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4: accumulate -->
  <rect x="75" y="322" width="190" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="343" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">ans += (cnt − t) × s</text>

  <!-- loop back to scan -->
  <path d="M 73,338 L 40,338 L 40,169 L 71,169" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="255" text-anchor="middle" font-size="11.5" fill="#b85450"
        transform="rotate(-90 32 255)" filter="url(#rough2)">未扫完 → 下一格</text>

  <!-- end -->
  <path d="M 267,338 L 316,338" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="291" y="330" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">扫完</text>
  <rect x="320" y="321" width="152" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="342" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">返回 ans</text>
</svg>
