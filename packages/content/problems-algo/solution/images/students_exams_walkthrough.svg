  <!-- arrow to result -->
  <path d="M 225 150 L 270 150 L 270 300 L 300 300" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="280" y="232" font-size="9" fill="#888">LEFT JOIN</text>
  <text x="280" y="244" font-size="9" fill="#888">补 NULL→0</text>

  <!-- Right: combo set note -->
  <rect x="300" y="62" width="310" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="455" y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">CROSS JOIN 全组合 = 4 学生 × 3 科目</text>
  <text x="455" y="104" text-anchor="middle" font-size="10" fill="#555">= 12 行骨架（每对学生×科目各一行）</text>
  <text x="316" y="126" font-size="9.5" fill="#555">• 左表全组合作骨架：不参加的组合也占一行</text>
  <text x="316" y="144" font-size="9.5" fill="#555">• LEFT JOIN 命中 → 取分组 cnt（如 Alice-Math=3）</text>
  <text x="316" y="162" font-size="9.5" fill="#555">• LEFT JOIN 未命中 → e.student_id 为 NULL</text>
  <text x="316" y="180" font-size="9.5" fill="#b85450">  COUNT(e.student_id) 忽略 NULL → 自动记 0</text>
  <text x="316" y="200" font-size="9.5" fill="#888">  若用 COUNT(*) 会把 NULL 行算成 1（错误）</text>
  <text x="316" y="218" font-size="9.5" fill="#446688">  → Alex 三行、Bob-Physics 一行由此补 0</text>

  <!-- Bottom: final result table -->
  <text x="40" y="284" font-size="11" fill="#555" font-weight="bold">最终输出（ORDER BY student_id, subject_name）— 共 12 行</text>

