<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：奇位数直接构造 + 偶位数递推</text>

  <!-- ===== Example 1: n=403 (k=3 odd) ===== -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">例1：n = 403（k = 3 奇）</text>

  <!-- n=403 digits -->
  <g filter="url(#rough2)">
    <rect x="40" y="66" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="72" y="66" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="104" y="66" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" fill="#333" font-weight="bold">
    <text x="56" y="86" text-anchor="middle">4</text>
    <text x="88" y="86" text-anchor="middle">0</text>
    <text x="120" y="86" text-anchor="middle">3</text>
  </g>
  <text x="148" y="86" font-size="11" fill="#b85450" font-weight="bold">奇数位 ⟹ 直接构造 (k+1)=4 位</text>

  <!-- arrow down -->
  <path d="M 280 102 L 280 122" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- construct step: 10^3 = 1000 -->
  <text x="40" y="140" font-size="11" fill="#555">10^k = 10^3 = 1000（1 奇 3 偶，差 2 个奇数位）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="146" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="72" y="146" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="104" y="146" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="136" y="146" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" fill="#333" font-weight="bold">
    <text x="56" y="166" text-anchor="middle">1</text>
    <text x="88" y="166" text-anchor="middle">0</text>
    <text x="120" y="166" text-anchor="middle">0</text>
    <text x="152" y="166" text-anchor="middle">0</text>
  </g>

  <!-- + repunit(1) = 1 -->
  <path d="M 280 180 L 280 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="190" y="192" font-size="11" fill="#b85450" font-weight="bold">+ repunit(k÷2)=repunit(1)=1，末位 0→1</text>

  <!-- result 1001 -->
  <g filter="url(#rough2)">
    <rect x="40" y="200" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="72" y="200" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="104" y="200" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="136" y="200" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="14" fill="#333" font-weight="bold">
    <text x="56" y="220" text-anchor="middle">1</text>
    <text x="88" y="220" text-anchor="middle">0</text>
    <text x="120" y="220" text-anchor="middle">0</text>
    <text x="152" y="220" text-anchor="middle">1</text>
  </g>
  <text x="180" y="220" font-size="12" fill="#4a7a3a" font-weight="bold">= 1001（奇2 偶2 ✓）</text>

  <!-- ===== Example 2: n=11 (k=2 even, not fair) ===== -->
  <text x="40" y="262" font-size="12" fill="#446688" font-weight="bold">例2：n = 11（k = 2 偶，奇2 偶0，不公平）</text>

  <!-- table of increment steps -->
  <g filter="url(#rough2)">
    <rect x="40" y="272" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="160" y="272" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="360" y="272" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
  </g>
  <text x="100" y="290" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">步</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">n（奇,偶）</text>
  <text x="440" y="290" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">判定</text>

  <g filter="url(#rough2)">
    <rect x="40" y="298" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="160" y="298" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="360" y="298" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
  </g>
  <text x="100" y="316" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#333">11（奇2 偶0）</text>
  <text x="440" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不公平，n+1</text>

  <g filter="url(#rough2)">
    <rect x="40" y="324" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="160" y="324" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="360" y="324" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="100" y="342" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#333">12（奇1 偶1）</text>
  <text x="440" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">公平 ✓ 返回 12</text>

  <!-- note -->
  <rect x="40" y="368" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">偶位数且本身不公平时，+1 递推最多走「下一个公平数」</text>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#555">若该位数无公平数 ≥ n（如 n=99），递推越过 10^k 到奇位数即触发直接构造</text>
</svg>
