<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：回文 = 从中心向两端「成对」扩展</text>

  <!-- 顶栏：回文串的对称配对视图 -->
  <path d="M 90 90 C 170 36, 350 36, 430 90" fill="none" stroke="#446688" stroke-width="1.4"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">b ↔ b</text>
  <path d="M 175 90 C 212 60, 308 60, 345 90" fill="none" stroke="#4a7a3a" stroke-width="1.4"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a ↔ a</text>

  <circle cx="90" cy="112" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <circle cx="175" cy="112" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <circle cx="260" cy="112" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <circle cx="345" cy="112" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <circle cx="430" cy="112" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">中心</text>
  <text x="62" y="112" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">对称位置</text>
  <text x="62" y="126" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">字符相等</text>

  <!-- 中栏：三个构造快照 -->
  <circle cx="95" cy="222" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>

  <path d="M 125 222 C 140 216, 150 216, 162 220" fill="none" stroke="#4a7a3a" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+对 (a,a)</text>

  <circle cx="200" cy="222" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <circle cx="240" cy="222" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <circle cx="280" cy="222" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <path d="M 310 222 C 325 216, 335 216, 347 220" fill="none" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="210" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">+对 (b,b)</text>

  <circle cx="370" cy="222" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="226" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">b</text>
  <circle cx="402" cy="222" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="226" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">a</text>
  <circle cx="434" cy="222" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="226" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">c</text>
  <circle cx="466" cy="222" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466" y="226" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">a</text>
  <circle cx="498" cy="222" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="498" y="226" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">b</text>

  <text x="95" y="258" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">① 基态（中心）</text>
  <text x="95" y="272" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">长度 = 1</text>
  <text x="240" y="258" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">② 加一对 (a,a)</text>
  <text x="240" y="272" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">长度 = 3</text>
  <text x="434" y="258" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">③ 加一对 (b,b)</text>
  <text x="434" y="272" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">长度 = 5</text>

  <!-- 底部要点框 -->
  <rect x="55" y="292" width="410" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每步只需：a ∈ N(l)、b ∈ N(r)、label[a] = label[b]、a,b ∉ mask</text>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">新状态 (mask ∪ {a,b}, a, b)，长度 = popcount(mask)</text>
</svg>
