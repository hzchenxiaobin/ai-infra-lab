<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次扫描，遇下降重置，凑齐 5 元音更新答案</text>

  <!-- Start oval -->
  <ellipse cx="240" cy="56" rx="40" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>

  <path d="M 240 72 L 240 84" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="120" y="86" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="111" text-anchor="middle" font-size="12" fill="#333">left=0; distinct=1; ans=0; right=1</text>

  <path d="M 240 126 L 240 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: right < n ? -->
  <polygon points="240,150 312,180 240,210 168,180" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="185" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">right &lt; n ?</text>

  <!-- No branch: right -->
  <text x="320" y="174" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 312 180 L 360 180" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="362" y="162" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="412" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <path d="M 462 180 L 498 180" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="528" cy="180" rx="30" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="528" y="185" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">结束</text>

  <!-- Yes branch: down -->
  <text x="248" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 240 210 L 240 232" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2: word[right] vs word[right-1] -->
  <polygon points="240,234 332,272 240,310 148,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="268" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">word[right]</text>
  <text x="240" y="284" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">vs prev ?</text>

  <!-- "<" branch: left to reset box -->
  <text x="138" y="264" font-size="11" fill="#b85450" font-weight="bold">&lt; 下降</text>
  <path d="M 148 272 L 112 272" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="254" width="72" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="76" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">left=right</text>
  <text x="76" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">distinct=1</text>
  <!-- reset box return to main line at (240, 332) -->
  <path d="M 76 290 L 76 332 L 232 332" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ">" branch: right to distinct++ box -->
  <text x="338" y="264" font-size="11" fill="#4a7a3a" font-weight="bold">&gt; 上升</text>
  <path d="M 332 272 L 372 272" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="374" y="254" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="422" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">distinct += 1</text>
  <!-- distinct++ return to main line -->
  <path d="M 422 290 L 422 332 L 248 332" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- "=" branch: down -->
  <text x="252" y="324" font-size="11" fill="#888" font-weight="bold">= 相等</text>
  <!-- main vertical line through merge -->
  <path d="M 240 310 L 240 352" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond3: distinct == 5 ? -->
  <polygon points="240,356 312,386 240,416 168,386" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="391" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">distinct == 5 ?</text>

  <!-- No branch: right bypass to right++ box -->
  <text x="320" y="380" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 312 386 L 380 386 L 380 500 L 332 500" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch: down to ans box -->
  <text x="248" y="432" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 240 416 L 240 432" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="434" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="457" text-anchor="middle" font-size="12" fill="#333">ans = max(ans, right − left + 1)</text>

  <!-- merge to right++ box -->
  <path d="M 240 470 L 240 482" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right++ box -->
  <rect x="150" y="484" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="505" text-anchor="middle" font-size="12" fill="#333">right += 1</text>

  <!-- loop back: from right++ box left, up to diamond1 -->
  <path d="M 150 500 L 22 500 L 22 180 L 168 180" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="14" y="340" font-size="10" fill="#888" transform="rotate(-90 14 340)">回到 right &lt; n 判定</text>

  <!-- bottom note -->
  <text x="300" y="532" text-anchor="middle" font-size="10" fill="#888">每轮 O(1)：一次比较 + 至多一次计数更新；共 n−1 轮 ⇒ 总 O(n)</text>
</svg>
