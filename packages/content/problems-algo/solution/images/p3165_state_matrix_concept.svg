<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：区间只需向外暴露「左右端点选 / 不选」</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">f[a][b] = 区间内不含相邻元素的子序列最大和；a=1 表示左端必选，b=1 表示右端必选，非法状态记 −∞</text>

  <!-- segment [l..r] -->
  <text x="260" y="58" text-anchor="middle" font-size="9" fill="#999">某线段树节点覆盖的区间 [l, r]</text>
  <rect x="150" y="64" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="83" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="194" y="64" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="83" text-anchor="middle" font-size="11" fill="#666">−1</text>
  <rect x="238" y="64" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="11" fill="#666">4</text>
  <rect x="282" y="64" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="83" text-anchor="middle" font-size="11" fill="#666">1</text>
  <rect x="326" y="64" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="83" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="172" y="112" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">左端点 nums[l] → a</text>
  <text x="348" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">右端点 nums[r] → b</text>

  <!-- 2x2 matrix -->
  <rect x="100" y="140" width="72" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="161" text-anchor="middle" font-size="9" fill="#888">a \ b</text>
  <rect x="172" y="140" width="86" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="161" text-anchor="middle" font-size="9" fill="#888">b=0 右端不选</text>
  <rect x="258" y="140" width="86" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="161" text-anchor="middle" font-size="9" fill="#888">b=1 右端必选</text>
  <rect x="100" y="174" width="72" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="195" text-anchor="middle" font-size="9" fill="#888">a=0 左端不选</text>
  <rect x="100" y="208" width="72" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="229" text-anchor="middle" font-size="9" fill="#888">a=1 左端必选</text>
  <rect x="172" y="174" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="195" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">f[0][0]</text>
  <rect x="258" y="174" width="86" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="195" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">f[0][1]</text>
  <rect x="172" y="208" width="86" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="229" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">f[1][0]</text>
  <rect x="258" y="208" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="229" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">f[1][1]</text>

  <!-- leaf box -->
  <rect x="356" y="140" width="152" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="432" y="158" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">叶子节点（l = r）</text>
  <text x="368" y="176" font-size="9.5" fill="#555">f[0][0] = 0（空子序列）</text>
  <text x="368" y="194" font-size="9.5" fill="#555">f[1][1] = nums[i]（必选，可为负）</text>
  <text x="368" y="212" font-size="9.5" fill="#555">f[0][1] = f[1][0] = −∞</text>
  <text x="368" y="230" font-size="9.5" fill="#888">（同一元素：矛盾状态）</text>

  <!-- counterexample -->
  <rect x="40" y="264" width="108" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="94" y="281" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[2, 3]</text>
  <text x="94" y="297" text-anchor="middle" font-size="9" fill="#446688">最优 = 3（选 3）</text>
  <text x="163" y="290" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">⊕</text>
  <rect x="184" y="264" width="96" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="232" y="281" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[2]</text>
  <text x="232" y="297" text-anchor="middle" font-size="9" fill="#4a7a3a">最优 = 2</text>
  <path d="M 292 285 L 312 285" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="318" y="264" width="162" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="399" y="281" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">直接拼 3 + 2 = 5 ✗</text>
  <text x="399" y="297" text-anchor="middle" font-size="9" fill="#b85450">3 与 2 相邻！真实最优 2 + 2 = 4</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">单一「区间最优值」不携带端点占用信息，拼接会撞车 → 必须按端点状态拆成四份保管</text>

  <!-- bottom note -->
  <rect x="40" y="338" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">跨区间的相邻约束只发生在「拼接缝」那一条边，区间内部怎么选与邻居无关；</text>
  <text x="260" y="376" text-anchor="middle" font-size="10.5" fill="#555">左右端点的选择状态，就是区间对外的全部接口——每个线段树节点存 4 个数即可任意拼接</text>
</svg>
