<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：每条路径在每个对角层恰过一格</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">某层（除首尾）只有 1 个「路径格」→ 该格是支配点 → 翻转它即断路</text>

  <!-- ===== Left: Example 1 grid (single path, every level=1 → true) ===== -->
  <text x="130" y="70" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">示例1：每层都只有 1 个路径格 → true</text>

  <!-- grid 3x3, cell 40, origin x=50 y=82 -->
  <!-- level 0: (0,0) -->
  <rect x="50" y="82" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- level 1: (0,1) blocked? no grid[0][1]=1 but not on path; (1,0) on path -->
  <rect x="90" y="82" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="108" text-anchor="middle" font-size="13" fill="#aaa">1</text>
  <rect x="50" y="122" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="148" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- level 2: (0,2)=1 not path, (1,1)=0, (2,0)=1 path -->
  <rect x="130" y="82" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="108" text-anchor="middle" font-size="13" fill="#aaa">1</text>
  <rect x="90" y="122" width="40" height="40" fill="#e8e8e8" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="148" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="50" y="162" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- level 3: (1,2)=0, (2,1)=1 path -->
  <rect x="130" y="122" width="40" height="40" fill="#e8e8e8" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="148" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <rect x="90" y="162" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- level 4: (2,2) -->
  <rect x="130" y="162" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- path arrows -->
  <path d="M 70 122 L 70 122" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 70 162 L 70 162" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- level labels (anti-diagonal) right of grid -->
  <text x="186" y="108" font-size="10.5" fill="#888">层0: 1格（起点）</text>
  <text x="186" y="148" font-size="10.5" fill="#b85450" font-weight="bold">层1: 1格 ← 支配点</text>
  <text x="186" y="188" font-size="10.5" fill="#b85450" font-weight="bold">层2: 1格 ← 支配点</text>
  <text x="186" y="220" font-size="10.5" fill="#b85450" font-weight="bold">层3: 1格 ← 支配点</text>
  <text x="186" y="238" font-size="10.5" fill="#888">层4: 1格（终点）</text>

  <!-- flip note -->
  <rect x="44" y="256" width="290" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="189" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">翻转任意一个红色支配点（1→0）</text>
  <text x="189" y="290" text-anchor="middle" font-size="10.5" fill="#555">→ 路径必经它 → 断路 → return true</text>

  <!-- ===== Right: Example 2 grid (two paths, middle levels=2 → false) ===== -->
  <text x="430" y="70" text-anchor="middle" font-size="11.5" fill="#666" font-weight="bold">示例2：每层都有 ≥2 个路径格 → false</text>

  <!-- grid 3x3, origin x=350 y=82 -->
  <!-- (0,0) -->
  <rect x="350" y="82" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- (0,1) path -->
  <rect x="390" y="82" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- (0,2) path -->
  <rect x="430" y="82" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- (1,0) path -->
  <rect x="350" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="148" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- (1,1)=0 -->
  <rect x="390" y="122" width="40" height="40" fill="#e8e8e8" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="148" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <!-- (1,2) path -->
  <rect x="430" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="148" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- (2,0) path -->
  <rect x="350" y="162" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- (2,1) path -->
  <rect x="390" y="162" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- (2,2) -->
  <rect x="430" y="162" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- two path arrows: down-left route and right-down route -->
  <path d="M 370 122 L 370 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 122 L 410 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- level labels -->
  <text x="486" y="108" font-size="10.5" fill="#888">层0: 1格（起点）</text>
  <text x="486" y="148" font-size="10.5" fill="#446688" font-weight="bold">层1: 2格</text>
  <text x="486" y="188" font-size="10.5" fill="#446688" font-weight="bold">层2: 2格</text>
  <text x="486" y="220" font-size="10.5" fill="#446688" font-weight="bold">层3: 2格</text>
  <text x="486" y="238" font-size="10.5" fill="#888">层4: 1格（终点）</text>

  <!-- no dominator note -->
  <rect x="344" y="256" width="290" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="489" y="274" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">中间各层都有 2 个路径格</text>
  <text x="489" y="290" text-anchor="middle" font-size="10.5" fill="#555">→ 无单一支配点 → 翻一格无法断路 → false</text>

  <!-- bottom summary -->
  <rect x="44" y="316" width="590" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="339" y="336" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">判定准则：算 f（从起点可达）与 g（能到终点），路径格 = f∧g</text>
  <text x="339" y="354" text-anchor="middle" font-size="11" fill="#555">对每个对角层 k∈[1, m+n−3] 计路径格数，若某层恰为 1 → 该格即支配点 → return true</text>
</svg>
