<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="500" height="420" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：生成器逐个 yield 阶乘值</text>

  <!-- Start -->
  <ellipse cx="250" cy="56" rx="50" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 250 76 L 250 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init result = 1 -->
  <rect x="180" y="92" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="114" text-anchor="middle" font-size="12" fill="#333">result = 1</text>
  <path d="M 250 126 L 250 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yield 0! -->
  <rect x="170" y="142" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">yield result  ← 0! = 1</text>
  <path d="M 250 176 L 250 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init i = 1 -->
  <rect x="180" y="194" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="216" text-anchor="middle" font-size="12" fill="#333">i = 1</text>
  <path d="M 250 228 L 250 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i <= n? -->
  <polygon points="250,248 330,288 250,328 170,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="286" text-anchor="middle" font-size="11" fill="#333">i ≤ n ?</text>
  <text x="250" y="300" text-anchor="middle" font-size="10" fill="#888">循环条件</text>

  <!-- Yes branch: result *= i -->
  <path d="M 330 288 L 380 288" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="382" y="270" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="287" text-anchor="middle" font-size="11" fill="#333">result *= i</text>
  <text x="432" y="300" text-anchor="middle" font-size="9" fill="#888">累乘</text>

  <path d="M 432 306 L 432 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="372" y="338" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="432" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">yield result</text>

  <!-- i++ and loop back -->
  <path d="M 372 355 L 340 355" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="230" y="338" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333">i = i + 1</text>

  <path d="M 280 338 L 280 328" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 328 L 250 328 L 250 328" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 355 L 180 330 L 180 300 L 170 296" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="330" font-size="9" fill="#888">回到判断</text>

  <!-- No branch: End -->
  <path d="M 250 328 L 250 352" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="345" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <ellipse cx="250" cy="374" rx="50" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="378" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束</text>

  <!-- Side note -->
  <rect x="20" y="270" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="35" y="288" font-size="10" fill="#666" font-weight="bold">关键点：</text>
  <text x="35" y="302" font-size="9" fill="#888">• 先 yield 0! = 1</text>
  <text x="35" y="315" font-size="9" fill="#888">• 再循环 yield 1! ~ n!</text>
  <text x="35" y="328" font-size="9" fill="#888">• 每轮只做一次乘法</text>
</svg>
