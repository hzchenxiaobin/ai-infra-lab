<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="432" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 条广告的条件聚合 → 相除兜底 → 排序输出</text>

  <!-- ============ Section 1: aggregation table ============ -->
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① GROUP BY ad_id + 条件聚合（Ignored 不进分子/分母）</text>

  <!-- header -->
  <rect x="45" y="52" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="67" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">ad_id</text>
  <rect x="105" y="52" width="75" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="67" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Clicked</text>
  <rect x="180" y="52" width="75" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="217" y="67" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">Viewed</text>
  <rect x="255" y="52" width="75" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="292" y="67" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">Ignored</text>
  <rect x="330" y="52" width="85" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="372" y="67" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">分子 Σ(Clicked)</text>
  <rect x="415" y="52" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="465" y="67" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">分母 Σ(C+V)</text>

  <!-- row ad 1 -->
  <rect x="45" y="74" width="60" height="20" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="75" y="88" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">1</text>
  <rect x="105" y="74" width="75" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="142" y="88" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="180" y="74" width="75" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="217" y="88" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">1</text>
  <rect x="255" y="74" width="75" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="292" y="88" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="330" y="74" width="85" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="372" y="88" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="415" y="74" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="465" y="88" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>

  <!-- row ad 2 -->
  <rect x="45" y="94" width="60" height="20" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="75" y="108" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">2</text>
  <rect x="105" y="94" width="75" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="142" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="94" width="75" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="217" y="108" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">2</text>
  <rect x="255" y="94" width="75" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="292" y="108" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0</text>
  <rect x="330" y="94" width="85" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="372" y="108" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <rect x="415" y="94" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="465" y="108" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>

  <!-- row ad 3 -->
  <rect x="45" y="114" width="60" height="20" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="75" y="128" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">3</text>
  <rect x="105" y="114" width="75" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="142" y="128" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="114" width="75" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="217" y="128" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">1</text>
  <rect x="255" y="114" width="75" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="292" y="128" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0</text>
  <rect x="330" y="114" width="85" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="372" y="128" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <rect x="415" y="114" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="465" y="128" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">2</text>

  <!-- row ad 5 (highlight: denom=0) -->
  <rect x="45" y="134" width="60" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="75" y="148" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">5</text>
  <rect x="105" y="134" width="75" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="142" y="148" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="180" y="134" width="75" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="217" y="148" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">0</text>
  <rect x="255" y="134" width="75" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="292" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="330" y="134" width="85" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="372" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0</text>
  <rect x="415" y="134" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="465" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0 ⚠</text>
  <text x="525" y="148" font-size="9" fill="#b85450" font-weight="bold">除零</text>

  <!-- arrow to section 2 -->
  <path d="M280 160 L280 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="150" y="161" width="260" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="173" text-anchor="middle" font-size="9" fill="#333">分子 / 分母 × 100 → IFNULL 兜底 → ROUND(, 2)</text>

  <!-- ============ Section 2: computation table ============ -->
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 相除 × 100 + 除零兜底 + 保留两位</text>

  <!-- header -->
  <rect x="45" y="196" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="211" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">ad_id</text>
  <rect x="105" y="196" width="150" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="211" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">分子/分母 × 100</text>
  <rect x="255" y="196" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="315" y="211" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">除零兜底</text>
  <rect x="375" y="196" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="445" y="211" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">ROUND(, 2) = ctr</text>

  <!-- row ad 1 -->
  <rect x="45" y="218" width="60" height="20" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="75" y="232" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">1</text>
  <rect x="105" y="218" width="150" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="180" y="232" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2/3 × 100 = 66.666…</text>
  <rect x="255" y="218" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="315" y="232" text-anchor="middle" font-size="9" fill="#777">66.666（无需兜底）</text>
  <rect x="375" y="218" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="445" y="232" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">66.67</text>

  <!-- row ad 2 -->
  <rect x="45" y="238" width="60" height="20" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="75" y="252" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">2</text>
  <rect x="105" y="238" width="150" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="180" y="252" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1/3 × 100 = 33.333…</text>
  <rect x="255" y="238" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="315" y="252" text-anchor="middle" font-size="9" fill="#777">33.333（无需兜底）</text>
  <rect x="375" y="238" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="445" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">33.33</text>

  <!-- row ad 3 -->
  <rect x="45" y="258" width="60" height="20" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="75" y="272" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">3</text>
  <rect x="105" y="258" width="150" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="180" y="272" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1/2 × 100 = 50</text>
  <rect x="255" y="258" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="315" y="272" text-anchor="middle" font-size="9" fill="#777">50（无需兜底）</text>
  <rect x="375" y="258" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="445" y="272" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">50.00</text>

  <!-- row ad 5 (div zero) -->
  <rect x="45" y="278" width="60" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="75" y="292" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">5</text>
  <rect x="105" y="278" width="150" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="180" y="292" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0/0 → NULL</text>
  <rect x="255" y="278" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="315" y="292" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">IFNULL→0</text>
  <rect x="375" y="278" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="445" y="292" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">0.00</text>

  <!-- arrow to section 3 -->
  <path d="M280 304 L280 322" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="120" y="305" width="320" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="9" fill="#333">ORDER BY ctr DESC, ad_id ASC（CTR 降序，并列按 ad_id 升序）</text>

  <!-- ============ Section 3: final output ============ -->
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 排序输出（最终结果）</text>

  <rect x="205" y="340" width="70" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="240" y="354" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">ad_id</text>
  <rect x="275" y="340" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="315" y="354" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">ctr</text>

  <rect x="205" y="360" width="70" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="372" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="275" y="360" width="80" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="315" y="372" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">66.67</text>

  <rect x="205" y="376" width="70" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="388" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="275" y="376" width="80" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="315" y="388" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">50.00</text>

  <rect x="205" y="392" width="70" height="16" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="404" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">2</text>
  <rect x="275" y="392" width="80" height="16" fill="#ffffff" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="315" y="404" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">33.33</text>

  <rect x="205" y="408" width="70" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="240" y="420" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">5</text>
  <rect x="275" y="408" width="80" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="315" y="420" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">0.00</text>

  <text x="375" y="372" font-size="9" fill="#d6a040" font-weight="bold">50.00 排在 33.33 前</text>
  <text x="375" y="386" font-size="9" fill="#d6a040">（ctr 降序唯一键）</text>
  <text x="375" y="420" font-size="9" fill="#b85450" font-weight="bold">兜底为 0，排末尾</text>
</svg>
