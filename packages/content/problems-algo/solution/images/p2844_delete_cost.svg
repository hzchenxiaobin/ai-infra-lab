<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGrey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">选定末两位对 (i, j)：删除代价 = n − i − 2，只与 i 有关</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">num = "2245047"（n = 7）：'5'@3 作十位、'0'@4 作个位，拼出末两位 "50"</text>

  <!-- digit cells -->
  <rect x="68" y="78" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <rect x="138" y="78" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <rect x="208" y="78" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">4</text>
  <rect x="278" y="78" width="64" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="111" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="348" y="78" width="64" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
  <text x="380" y="111" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="418" y="78" width="64" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="111" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">4</text>
  <rect x="488" y="78" width="64" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="520" y="111" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">7</text>

  <!-- index labels -->
  <text x="100" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="170" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="240" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="310" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3 = i</text>
  <text x="380" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4 = j</text>
  <text x="450" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <text x="520" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>

  <!-- region brackets -->
  <path d="M 68 164 L 68 174 M 68 168 L 272 168 M 272 164 L 272 174" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前缀 0..i−1：全保留（白送）</text>
  <path d="M 278 164 L 278 174 M 278 168 L 482 168 M 482 164 L 482 174" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="190" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">i（十位）· j（个位）</text>
  <path d="M 488 164 L 488 174 M 488 168 L 552 168 M 552 164 L 552 174" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">删 2 个</text>

  <!-- delete arrows on cells 5,6 -->
  <path d="M 450 66 L 450 56" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrGrey)" filter="url(#rough2)"/>
  <path d="M 520 66 L 520 56" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrGrey)" filter="url(#rough2)"/>
  <text x="485" y="52" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j 之后全删：n − 1 − j = 2 个</text>

  <!-- formula box -->
  <rect x="90" y="212" width="440" height="62" rx="9" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">代价 = (j − i − 1) + (n − 1 − j) = n − i − 2</text>
  <text x="310" y="258" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">本例 = 0 + 2 = 7 − 3 − 2 = 2 次</text>

  <!-- result box -->
  <rect x="140" y="296" width="340" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="321" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">"224" + "50" → 22450 = 898 × 25 ✓</text>

  <text x="310" y="366" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i 越靠右代价越小；兜底：留单个 '0' → n − 1 次，全删 → n 次</text>
</svg>
