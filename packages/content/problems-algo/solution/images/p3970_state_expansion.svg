<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：无后效性——只需记住「末尾标签连了几个」</text>
  <text x="280" y="42" text-anchor="middle" font-size="11.5" fill="#888">把每个节点 v 扩成 k 个状态 (v, c)：c = labels[v] 在路径末尾的连续长度</text>

  <!-- 原图（示例 2） -->
  <text x="76" y="70" text-anchor="start" font-size="11" fill="#8899aa">原图（示例 2，k = 2）</text>

  <!-- edges -->
  <path d="M 115 108 L 240 108" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="177" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">w=1</text>
  <path d="M 285 108 L 410 108" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="347" y="99" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">w=1</text>
  <path d="M 103 132 C 160 185, 380 185, 428 132" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="265" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">w=3</text>

  <!-- nodes -->
  <circle cx="95" cy="115" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="265" cy="115" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="435" cy="115" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="95" y="121" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <text x="265" y="121" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <text x="435" y="121" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <text x="95" y="146" text-anchor="middle" font-size="10" fill="#a87020">节点 0（起点）</text>
  <text x="265" y="146" text-anchor="middle" font-size="10" fill="#667788">节点 1</text>
  <text x="435" y="146" text-anchor="middle" font-size="10" fill="#b85450">节点 2（终点）</text>

  <!-- 扩维箭头 -->
  <path d="M 265 200 L 265 226" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="288" y="218" text-anchor="start" font-size="11" fill="#446688" font-weight="bold">状态扩维</text>

  <!-- 状态图 -->
  <rect x="58" y="240" width="74" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="95" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">(0, 1)</text>
  <text x="95" y="292" text-anchor="middle" font-size="10" fill="#8899aa">起点 run=1</text>

  <rect x="243" y="240" width="74" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">(1, 2)</text>
  <text x="280" y="292" text-anchor="middle" font-size="10" fill="#a87020">a 连续 2 次</text>

  <rect x="428" y="240" width="74" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="465" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">(2, 1)</text>
  <text x="465" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a">终点 run=1</text>

  <!-- 状态转移 -->
  <path d="M 132 259 L 241 259" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="186" y="251" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">同 a：c+1</text>
  <path d="M 317 259 L 426 259" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="371" y="251" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">异：重置 1</text>
  <path d="M 95 300 C 150 340, 390 340, 465 300" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">异：重置 1</text>

  <!-- 说明框 -->
  <rect x="55" y="352" width="450" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">转移：labels[u]==labels[v] ? c+1 : 1；nc &gt; k 直接剪枝（k=1 时 (0,1)→(1,2) 即被剪）</text>
  <text x="280" y="385" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">状态图边权 = 原边权 w ≥ 1（非负）⇒ Dijkstra 照常适用；首个出队的 (n−1, c) 即答案</text>
</svg>
