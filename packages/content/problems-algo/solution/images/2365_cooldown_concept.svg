<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">冷却规则：同类任务之间至少间隔 space 天</text>

  <!-- timeline axis -->
  <line x1="30" y1="200" x2="446" y2="200" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="204" font-size="12" fill="#666" filter="url(#rough2)">天</text>

  <!-- bracket above showing space gap -->
  <path d="M62,168 L62,156 L238,156 L238,168" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">space = 3 天间隔</text>

  <!-- day cells 1..9 -->
  <!-- day 1: type1 done (blue) -->
  <rect x="40" y="178" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">类型1</text>
  <text x="62" y="214" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">完成</text>
  <text x="62" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第1天</text>

  <!-- days 2,3,4: rest (orange) -->
  <rect x="84" y="178" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="106" y="204" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">休</text>
  <text x="106" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第2天</text>

  <rect x="128" y="178" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="150" y="204" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">休</text>
  <text x="150" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第3天</text>

  <rect x="172" y="178" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="194" y="204" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">休</text>
  <text x="194" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第4天</text>

  <!-- day 5: type1 allowed again (green) -->
  <rect x="216" y="178" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="238" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">类型1</text>
  <text x="238" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">可再做</text>
  <text x="238" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第5天</text>

  <!-- days 6..9: dim -->
  <rect x="260" y="178" width="44" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="282" y="240" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第6天</text>
  <rect x="304" y="178" width="44" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="326" y="240" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第7天</text>
  <rect x="348" y="178" width="44" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="240" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第8天</text>
  <rect x="392" y="178" width="44" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="414" y="240" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第9天</text>

  <!-- formula box -->
  <rect x="60" y="270" width="440" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">同类最早可做日 = last[t] + space + 1（中间这些天被迫休息）</text>
</svg>
