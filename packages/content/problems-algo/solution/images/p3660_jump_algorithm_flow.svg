<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：后缀最小 + 前缀最大，两趟扫描切分收割</text>
  <text x="498" y="54" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">时间 O(n)｜空间 O(n)</text>
  <text x="498" y="70" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">收割各段互不重叠，总代价线性</text>

  <!-- 开始 -->
  <rect x="70" y="44" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="64" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">输入 nums（n 个元素）</text>

  <path d="M 155 76 L 155 92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1 -->
  <rect x="55" y="96" width="200" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 从右往左一趟</text>
  <text x="155" y="133" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">suf_min[k] = min(nums[k..n-1])</text>

  <path d="M 155 144 L 155 158" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="55" y="162" width="200" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 从左往右扫 k = 1..n-1</text>
  <text x="155" y="199" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">滚动维护 pre_max 与 seg_max</text>

  <path d="M 155 210 L 155 224" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 割判定 -->
  <polygon points="70,272 155,224 240,272 155,320" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pre_max ≤ suf_min[k] ?</text>
  <text x="155" y="284" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">割：左边全部 ≤ 右边全部</text>

  <!-- 是 → 收割 -->
  <path d="M 240 272 L 286 272" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="264" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="290" y="238" width="200" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="258" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">割！收割当前段</text>
  <text x="390" y="276" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans[start..k-1] ← seg_max</text>
  <text x="390" y="294" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">开新段：start = k, seg_max = nums[k]</text>

  <!-- 收割支路汇回主干 -->
  <path d="M 382 304 L 382 381 L 160 381" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 段内累计 -->
  <path d="M 155 320 L 155 330" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="167" y="328" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="60" y="334" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="351" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">段内累计（不是割）</text>
  <text x="155" y="369" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">seg_max = max(seg_max, nums[k])</text>

  <!-- 主干 -->
  <path d="M 155 378 L 155 392" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 回扫虚线 -->
  <path d="M 155 392 L 30 392 L 30 186 L 53 186" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6,5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="96" y="386" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">k+1 &lt; n，继续扫描</text>

  <!-- 扫描结束 -->
  <path d="M 155 392 L 155 406" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="405" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">k = n，扫描结束</text>

  <!-- 步骤3 -->
  <rect x="55" y="410" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="429" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 收尾：收割最后一段</text>
  <text x="155" y="447" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans[start..n-1] ← seg_max</text>

  <path d="M 155 456 L 155 470" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="70" y="474" width="170" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="494" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">输出 ans（段内最大值）</text>
</svg>
