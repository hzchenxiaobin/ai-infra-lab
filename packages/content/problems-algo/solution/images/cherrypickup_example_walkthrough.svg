<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid = [[0,1,−1],[1,0,−1],[1,1,1]]，n = 3</text>

  <!-- column headers -->
  <text x="40" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">k</text>
  <text x="130" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">P1 (x1,y1)</text>
  <text x="240" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">P2 (x2,y2)</text>
  <text x="330" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">同格?</text>
  <text x="420" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">gain</text>
  <text x="510" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">best前驱</text>
  <text x="590" y="56" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">dp值</text>

  <line x1="14" y1="64" x2="612" y2="64" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row k=0 -->
  <text x="40" y="86" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="130" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(0,0)</text>
  <text x="240" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(0,0)</text>
  <text x="330" y="86" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <text x="420" y="86" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="510" y="86" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="566" y="74" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="590" y="90" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Row k=1 -->
  <text x="40" y="118" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="130" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(1,0)</text>
  <text x="240" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(0,1)</text>
  <text x="330" y="118" text-anchor="middle" font-size="11" fill="#555">否</text>
  <text x="420" y="118" text-anchor="middle" font-size="11" fill="#333">1+1=2</text>
  <text x="510" y="118" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="566" y="106" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="590" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Row k=2 -->
  <text x="40" y="150" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(2,0)</text>
  <text x="240" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(1,1)</text>
  <text x="330" y="150" text-anchor="middle" font-size="11" fill="#555">否</text>
  <text x="420" y="150" text-anchor="middle" font-size="11" fill="#333">1+0=1</text>
  <text x="510" y="150" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="566" y="138" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="590" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row k=3 -->
  <text x="40" y="182" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="130" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(2,1)</text>
  <text x="240" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(2,1)</text>
  <text x="330" y="182" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <text x="420" y="182" text-anchor="middle" font-size="11" fill="#333">1(只算一次)</text>
  <text x="510" y="182" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="566" y="170" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="590" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Row k=4 -->
  <text x="40" y="214" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="130" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(2,2)</text>
  <text x="240" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(2,2)</text>
  <text x="330" y="214" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <text x="420" y="214" text-anchor="middle" font-size="11" fill="#333">1(只算一次)</text>
  <text x="510" y="214" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="566" y="202" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="590" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <line x1="14" y1="232" x2="612" y2="232" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="130" y="248" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="273" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = dp[2][2] = 5（0+2+1+1+1）⭐</text>

  <!-- decisions explanation -->
  <rect x="30" y="300" width="560" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="322" font-size="11.5" fill="#444" font-weight="bold">决策回顾：</text>
  <text x="50" y="342" font-size="11" fill="#555">• k=1：P1 走到 (1,0)，P2 走到 (0,1)，各摘 1 颗 → gain=2，累加得 2</text>
  <text x="50" y="362" font-size="11" fill="#555">• k=2：P1 走到 (2,0) 摘 1，P2 走到 (1,1) 是空格摘 0 → gain=1，累加得 3</text>
  <text x="50" y="382" font-size="11" fill="#555">• k=3：两人都走到 (2,1)，同格只算一次 → gain=1，累加得 4</text>
  <text x="50" y="402" font-size="11" fill="#555">• k=4：两人会师终点 (2,2)，同格只算一次 → gain=1，累加得 5</text>
</svg>
