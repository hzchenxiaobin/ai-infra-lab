<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：选 k 翻转前 k 个元素（煎饼铲子插入第 k 位，整段翻面）</text>

  <!-- before row -->
  <text x="60" y="92" font-size="12" fill="#888">翻转前：</text>
  <rect x="120" y="70" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="170" y="70" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="70" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <rect x="270" y="70" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="145" y="124" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="195" y="124" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="245" y="124" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  <text x="295" y="124" text-anchor="middle" font-size="10" fill="#888">i=3</text>

  <!-- spatula marker between i=2 and i=3 (cut at k=3) -->
  <path d="M 270 58 L 270 122" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="270" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k=3 铲子</text>

  <!-- reverse arc over the first 3 -->
  <path d="M 145 66 C 170 36, 220 36, 245 66" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="195" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">前 3 个翻转</text>

  <!-- big down arrow -->
  <path d="M 280 138 L 280 168" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="158" font-size="11" fill="#666" font-weight="bold">flip(k=3)</text>

  <!-- after row -->
  <text x="60" y="222" font-size="12" fill="#888">翻转后：</text>
  <rect x="120" y="200" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="226" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <rect x="170" y="200" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="226" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="200" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="226" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="270" y="200" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="226" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <!-- swap arrows: 3<->4 -->
  <text x="145" y="254" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑原i=2</text>
  <text x="245" y="254" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑原i=0</text>

  <!-- note box -->
  <rect x="360" y="70" width="184" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="452" y="96" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">煎饼翻转定义</text>
  <text x="452" y="122" text-anchor="middle" font-size="11" fill="#666">选 k（1 ≤ k ≤ n）</text>
  <text x="452" y="144" text-anchor="middle" font-size="11" fill="#666">翻转 arr[0..k-1]</text>
  <text x="452" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a">等价 reverse 前 k 个</text>
  <text x="452" y="200" text-anchor="middle" font-size="11" fill="#446688">一次操作 O(k)</text>
  <text x="452" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">铲子插入第 k 位翻面</text>

  <!-- bottom takeaway -->
  <rect x="40" y="288" width="500" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键性质：任意一个元素都能用至多 2 次翻转送到目标位置</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#666">① 先翻到首位（若已在首位则跳过）  ② 再翻到最终位置</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#888">故 n 个元素至多 2(n−1) 次翻转，远低于题目允许的 10n 上限</text>
</svg>
