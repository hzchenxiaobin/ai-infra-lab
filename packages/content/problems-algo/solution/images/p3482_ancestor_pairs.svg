<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一次「祖先-后代对」展开，三个统计量全解决</text>
  <text x="310" y="38" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">递归 CTE 物化 pairs(manager_id, member_id, salary) —— 子树聚合退化为普通 GROUP BY</text>

  <!-- 左侧：组织树 -->
  <text x="14" y="70" font-size="9" fill="#999" filter="url(#rough2)">L1</text>
  <text x="14" y="152" font-size="9" fill="#999" filter="url(#rough2)">L2</text>
  <text x="14" y="232" font-size="9" fill="#999" filter="url(#rough2)">L3</text>

  <path d="M 98 80 L 57 136" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 98 80 L 149 136" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 55 162 L 55 216" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="66" y="56" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="98" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1 Alice</text>

  <rect x="26" y="138" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="55" y="154" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">2 Bob</text>

  <rect x="120" y="138" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="152" y="154" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">3 Charlie</text>

  <rect x="26" y="218" width="58" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="55" y="234" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">4 David</text>

  <text x="90" y="264" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">组织树（manager_id 邻接表）</text>

  <!-- 右侧：pairs 表 -->
  <rect x="206" y="50" width="328" height="222" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <line x1="206" y1="72" x2="534" y2="72" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="50" x2="310" y2="272" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="50" x2="410" y2="272" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <text x="258" y="65" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">manager_id</text>
  <text x="356" y="65" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">member_id</text>
  <text x="470" y="65" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">salary</text>

  <!-- 蓝框：manager=1（Alice）的 4 行 -->
  <rect x="208" y="73" width="324" height="99" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>

  <!-- 行数据 -->
  <text x="258" y="89" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="356" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">12000</text>

  <text x="258" y="114" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="356" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="470" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10000</text>

  <text x="258" y="139" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="356" y="139" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="470" y="139" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9000</text>

  <circle cx="322" cy="159" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="258" y="164" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="356" y="164" text-anchor="middle" font-size="10" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="470" y="164" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6000</text>

  <text x="258" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="356" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="470" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10000</text>

  <circle cx="322" cy="209" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="258" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="356" y="214" text-anchor="middle" font-size="10" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="470" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6000</text>

  <text x="258" y="239" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="356" y="239" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="470" y="239" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9000</text>

  <circle cx="322" cy="259" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="258" y="264" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="356" y="264" text-anchor="middle" font-size="10" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="470" y="264" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6000</text>

  <!-- 右侧旁注 -->
  <text x="545" y="112" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">manager=1</text>
  <text x="545" y="126" font-size="9" fill="#446688" filter="url(#rough2)">（Alice）4 行</text>
  <text x="545" y="198" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">member=4</text>
  <text x="545" y="212" font-size="9" fill="#2d5a1e" filter="url(#rough2)">共 3 行（绿点）</text>

  <!-- 底部两个结论框 -->
  <rect x="15" y="290" width="292" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="28" y="308" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">按 manager 分组（蓝框 4 行）</text>
  <text x="28" y="324" font-size="9.5" fill="#333" filter="url(#rough2)">team_size = 4 − 1 = 3（去掉自配对）</text>
  <text x="28" y="339" font-size="9.5" fill="#333" filter="url(#rough2)">budget = SUM(salary) = 37000</text>

  <rect x="322" y="290" width="283" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="335" y="308" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">按 member 计数（绿点 3 行）</text>
  <text x="335" y="324" font-size="9.5" fill="#333" filter="url(#rough2)">level = 祖先数（含自己）</text>
  <text x="335" y="339" font-size="9.5" fill="#333" filter="url(#rough2)">David(4) ⇒ level 3</text>
</svg>
