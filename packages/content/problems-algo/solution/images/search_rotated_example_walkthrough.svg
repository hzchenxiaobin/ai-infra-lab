<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4,5,6,7,0,1,2], target = 0</text>

  <!-- column headers -->
  <text x="20" y="54" font-size="10.5" fill="#888" font-weight="bold">轮</text>
  <text x="56" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">left</text>
  <text x="100" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">right</text>
  <text x="140" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">mid</text>
  <text x="190" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">nums[mid]</text>
  <text x="290" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">有序半段</text>
  <text x="430" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">target 落点</text>
  <text x="540" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">下一步</text>

  <line x1="10" y1="62" x2="570" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <text x="20" y="92" font-size="11" fill="#333">1</text>
  <text x="56" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="100" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="140" y="92" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="190" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="290" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左半[4,5,6,7]</text>
  <text x="430" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 不在[4,7)</text>
  <text x="540" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">left=4</text>

  <!-- Row 2 -->
  <text x="20" y="124" font-size="11" fill="#333">2</text>
  <text x="56" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="100" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="140" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="190" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="290" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">右半[1,2]</text>
  <text x="430" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 不在(1,2]</text>
  <text x="540" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right=4</text>

  <!-- Row 3 -->
  <text x="20" y="156" font-size="11" fill="#333">3</text>
  <text x="56" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="100" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="140" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="190" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="290" y="156" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="430" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">命中 ✓</text>
  <text x="540" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return 4</text>

  <line x1="10" y1="172" x2="570" y2="172" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="188" width="420" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="211" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">三轮二分定位 → 返回 4 ✓</text>

  <!-- visual per-round -->
  <text x="20" y="248" font-size="12" fill="#888" font-weight="bold">第 1 轮：left=0 right=6 mid=3，左半有序</text>
  <rect x="20" y="258" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="40" y="274" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="64" y="258" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="274" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="108" y="258" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="128" y="274" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="152" y="258" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="196" y="258" width="40" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="216" y="274" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="240" y="258" width="40" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#aaa">1</text>
  <rect x="284" y="258" width="40" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="304" y="274" text-anchor="middle" font-size="11" fill="#aaa">2</text>
  <text x="340" y="274" font-size="10.5" fill="#b85450" font-weight="bold">→ 砍掉左半，left=4</text>

  <text x="20" y="306" font-size="12" fill="#888" font-weight="bold">第 2 轮：left=4 right=6 mid=5，右半有序</text>
  <rect x="20" y="316" width="40" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="332" text-anchor="middle" font-size="10" fill="#ccc">4</text>
  <rect x="64" y="316" width="40" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="332" text-anchor="middle" font-size="10" fill="#ccc">5</text>
  <rect x="108" y="316" width="40" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="332" text-anchor="middle" font-size="10" fill="#ccc">6</text>
  <rect x="152" y="316" width="40" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="332" text-anchor="middle" font-size="10" fill="#ccc">7</text>
  <rect x="196" y="316" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="216" y="332" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="240" y="316" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="284" y="316" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="304" y="332" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="340" y="332" font-size="10.5" fill="#b85450" font-weight="bold">→ 砍掉右半，right=4</text>

  <text x="20" y="364" font-size="12" fill="#888" font-weight="bold">第 3 轮：left=right=4，nums[4]=0 == target</text>
  <rect x="196" y="374" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="390" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="250" y="390" font-size="11" fill="#4a7a3a" font-weight="bold">→ 命中，返回 4 ✓</text>
</svg>
