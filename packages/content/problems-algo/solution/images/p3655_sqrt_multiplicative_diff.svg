<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：按 k 根号分治 + 同余类乘法差分</text>

  <rect x="20" y="30" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="47" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">查询 [l, r, k, v] = [2, 11, 3, 5]</text>

  <path d="M 122 72 Q 180 46 239 72" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 239 72 Q 297 46 356 72" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 356 72 Q 414 46 473 72" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="42" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">idx += k = 3</text>
  <path d="M 473 72 Q 496 58 508 48" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="492" y="38" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">14 &gt; r，停</text>

  <rect x="26" y="72" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="95" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">·</text>

  <rect x="65" y="72" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="83" y="95" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">·</text>

  <rect x="104" y="72" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="95" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×5</text>

  <rect x="143" y="72" width="36" height="36" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="161" y="95" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>

  <rect x="182" y="72" width="36" height="36" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="200" y="95" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>

  <rect x="221" y="72" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="95" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×5</text>

  <rect x="260" y="72" width="36" height="36" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="278" y="95" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>

  <rect x="299" y="72" width="36" height="36" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="317" y="95" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>

  <rect x="338" y="72" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="95" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×5</text>

  <rect x="377" y="72" width="36" height="36" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="395" y="95" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>

  <rect x="416" y="72" width="36" height="36" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="434" y="95" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>

  <rect x="455" y="72" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="473" y="95" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×5</text>

  <text x="44" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="83" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="122" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l=2</text>
  <text x="161" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="200" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="239" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="278" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="317" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="356" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <text x="395" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">9</text>
  <text x="434" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">10</text>
  <text x="473" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r=11</text>

  <text x="260" y="142" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① 原数组视角：只碰下标 2, 5, 8, 11 —— 落点稀疏离散</text>

  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 同余类视角：把 ≡ 2 (mod 3) 的下标拉成一条链，落点变连续段</text>

  <rect x="80" y="178" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×v</text>

  <rect x="170" y="178" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×v</text>

  <rect x="260" y="178" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×v</text>

  <rect x="350" y="178" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">×v</text>

  <rect x="440" y="178" width="44" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="462" y="199" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">×1</text>

  <text x="102" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="192" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="282" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <text x="372" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">11</text>
  <text x="462" y="226" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">14 越界</text>

  <path d="M 86 244 L 98 216" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="14" y="246" width="192" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="261" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">diff[2] ×= v —— 起点记 +v</text>

  <path d="M 456 244 L 466 216" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="314" y="246" width="192" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="261" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">diff[14] ×= v⁻¹ —— 终点还账</text>

  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前缀积 P 沿链走：v → v → v → v → 1，恰好只有 [l, last] 的落点带上 v（望远镜式抵消）</text>

  <rect x="25" y="296" width="470" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 大 k（&gt; B）：每查询落点 ≤ n/B 个 → 直接模拟，总计 O(qn/B)</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 小 k（≤ B）：k 至多 B 种 → 每种一轮差分 + 前缀积摊回，总计 O(Bn)</text>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ 逆元：v⁻¹ ≡ v^(p−2) (mod p)，p = 10⁹+7 质数，线性递推出全表</text>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑥ 取 B = ⌊√q⌋ 平衡两侧 → 总复杂度 O(n√q + q) ≈ 6×10⁷</text>
</svg>
