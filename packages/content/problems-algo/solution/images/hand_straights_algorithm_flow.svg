<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 + freq → 取最小 x → 消耗 k 连张 → 循环</text>

  <!-- Step 1: 排序 + 统计 freq -->
  <rect x="160" y="40" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11.5" fill="#333">① n % k ≠ 0 → return false</text>
  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 统计 freq -->
  <rect x="160" y="94" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11.5" fill="#333">② 统计 freq，按 key 升序</text>
  <path d="M 260 130 L 260 146" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: 还有 freq[x] > 0 的 x? -->
  <path d="M 260 150 L 360 186 L 260 222 L 160 186 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#333">还有 freq[x]&gt;0 ?</text>
  <text x="260" y="196" text-anchor="middle" font-size="10" fill="#888">未消耗完?</text>

  <!-- No: return true (right) -->
  <path d="M 360 186 L 440 186" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="440" y="168" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="472" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="472" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- Yes: continue down -->
  <path d="M 260 222 L 260 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="236" font-size="10.5" fill="#888">是</text>

  <!-- Step 3: 取最小 x, cnt = freq[x] -->
  <rect x="140" y="242" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#333">③ 取最小 x，cnt = freq[x]（开 cnt 组）</text>
  <path d="M 260 278 L 260 294" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: 对 i=1..k-1, freq[x+i] >= cnt ? -->
  <path d="M 260 298 L 390 338 L 260 378 L 130 338 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#333">对 i=1…k−1</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#333">freq[x+i] ≥ cnt ?</text>

  <!-- No: return false (left) -->
  <path d="M 130 338 L 70 338" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="320" width="64" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return</text>
  <text x="52" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- Yes: decrement (right) -->
  <path d="M 390 338 L 450 338" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="330" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">是</text>
  <rect x="450" y="320" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="482" y="336" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">freq[x+i]</text>
  <text x="482" y="350" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">−= cnt</text>

  <!-- Loop back to decision 1 -->
  <path d="M 482 356 L 482 400 L 260 400 L 260 222 L 260 222" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="396" text-anchor="middle" font-size="10" fill="#888">处理完 x 的所有 cnt 组，回到循环</text>

  <!-- Bottom note -->
  <rect x="40" y="410" width="440" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="425" text-anchor="middle" font-size="10" fill="#555">每个 x 一次性消耗 cnt 组 → 内层循环 O(k)，总消耗 O(n/k × k) = O(n)</text>
</svg>
