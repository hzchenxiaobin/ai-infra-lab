<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">count(t)：「至多 t 种不同」滑窗，按右端点计数</text>
  <text x="80" y="46" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">t = 2，nums = [4,3,5,4]，右端 r = 2 时：</text>

  <!-- array cells: x=140,184,228,272 w=44 h=36, y=54 -->
  <rect x="140" y="54" width="44" height="36" fill="#ffffff" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="162" y="78" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <rect x="184" y="54" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="78" text-anchor="middle" font-size="13" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="228" y="54" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="78" text-anchor="middle" font-size="13" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="272" y="54" width="44" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="294" y="78" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4</text>

  <!-- left/right pointers -->
  <path d="M 206 122 L 206 96" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="206" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">left = 1</text>
  <path d="M 250 122 L 250 96" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="250" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">right = 2</text>

  <!-- state box -->
  <rect x="340" y="52" width="152" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="416" y="70" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">窗口 {3,5}</text>
  <text x="416" y="88" text-anchor="middle" font-size="10.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">distinct = 2 ≤ t ✓</text>

  <!-- subarrays ending at right=2 -->
  <text x="70" y="172" text-anchor="start" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">以 r = 2 结尾的合法子数组（左端取 left..r）：</text>

  <rect x="150" y="184" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="203" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="186" y="184" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="203" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="248" y="203" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">← 左端 = 1</text>

  <rect x="168" y="220" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="239" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="248" y="239" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">← 左端 = 2</text>

  <!-- sum box -->
  <rect x="340" y="196" width="152" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="214" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans += r − left + 1</text>
  <text x="416" y="230" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">= 2 个</text>

  <!-- bottom facts -->
  <rect x="40" y="278" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">不重不漏：每个子数组恰被它的右端点统计一次</text>

  <rect x="40" y="316" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">freq[x] 0→1 时 distinct++，1→0 时 distinct−−；双指针各至多 n 步 ⇒ 均摊 O(n)</text>

  <text x="260" y="366" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">收缩时机：distinct &gt; t 才移左端，保证 l_r 是「最长合法窗口」的左端</text>
</svg>
