<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：按 dist 升序逐节点 DP</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">处理顺序 5(d=0) → 3(d=1) → 2(d=2) → 1(d=4) → 4(d=6)</text>

  <!-- ===== dist table ===== -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">Dijkstra 得到 dist[]（到节点 5 的最短距离）：</text>
  <g font-size="11">
    <rect x="60" y="84" width="50" height="28" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="85" y="102" text-anchor="middle" fill="#aaa">节点</text>
    <rect x="112" y="84" width="50" height="28" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
    <text x="137" y="102" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="164" y="84" width="50" height="28" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
    <text x="189" y="102" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="216" y="84" width="50" height="28" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
    <text x="241" y="102" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="268" y="84" width="50" height="28" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
    <text x="293" y="102" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="320" y="84" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="345" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
  </g>
  <g font-size="11">
    <rect x="60" y="114" width="50" height="28" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="85" y="132" text-anchor="middle" fill="#aaa" font-size="9">dist</text>
    <rect x="112" y="114" width="50" height="28" fill="#fff8e1" stroke="#d6a040" rx="3" filter="url(#rough2)"/>
    <text x="137" y="132" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="164" y="114" width="50" height="28" fill="#fff8e1" stroke="#d6a040" rx="3" filter="url(#rough2)"/>
    <text x="189" y="132" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="216" y="114" width="50" height="28" fill="#fff8e1" stroke="#d6a040" rx="3" filter="url(#rough2)"/>
    <text x="241" y="132" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="268" y="114" width="50" height="28" fill="#fff8e1" stroke="#d6a040" rx="3" filter="url(#rough2)"/>
    <text x="293" y="132" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="320" y="114" width="50" height="28" fill="#fff8e1" stroke="#d6a040" rx="3" filter="url(#rough2)"/>
    <text x="345" y="132" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
  </g>

  <!-- ===== DP steps ===== -->
  <text x="40" y="168" font-size="11" fill="#b85450" font-weight="bold">DP 逐节点计算（按 dist 升序）：</text>

  <!-- Step 0: node 5 -->
  <rect x="40" y="180" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="55" y="201" font-size="11" fill="#b85450" font-weight="bold">① 节点 5</text>
  <text x="130" y="201" font-size="10" fill="#666">dist=0 · 基准</text>
  <text x="240" y="201" font-size="10" fill="#666">dp[5] = 1</text>
  <rect x="460" y="188" width="48" height="20" fill="#b85450" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <text x="484" y="202" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>

  <!-- Step 1: node 3 -->
  <rect x="40" y="218" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="55" y="239" font-size="11" fill="#446688" font-weight="bold">② 节点 3</text>
  <text x="130" y="239" font-size="10" fill="#666">dist=1</text>
  <text x="180" y="239" font-size="10" fill="#446688">邻居 5 (d=0&lt;1) ✓</text>
  <text x="320" y="239" font-size="10" fill="#666">dp[3] = dp[5] = 1</text>
  <rect x="460" y="226" width="48" height="20" fill="#446688" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="484" y="240" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>

  <!-- Step 2: node 2 -->
  <rect x="40" y="256" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="55" y="277" font-size="11" fill="#446688" font-weight="bold">③ 节点 2</text>
  <text x="130" y="277" font-size="10" fill="#666">dist=2</text>
  <text x="180" y="277" font-size="10" fill="#4a7a3a">邻居 3(1&lt;2), 5(0&lt;2) ✓</text>
  <text x="320" y="277" font-size="10" fill="#666">dp[2] = dp[3]+dp[5] = 1+1</text>
  <rect x="460" y="264" width="48" height="20" fill="#446688" stroke="#446688" rx="3" filter="url(#rough2)"/>
  <text x="484" y="278" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text>

  <!-- Step 3: node 1 (ANSWER) -->
  <rect x="40" y="294" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="55" y="315" font-size="11" fill="#d6a040" font-weight="bold">④ 节点 1</text>
  <text x="130" y="315" font-size="10" fill="#666">dist=4</text>
  <text x="180" y="315" font-size="10" fill="#d6a040">邻居 2(2&lt;4), 3(1&lt;4) ✓</text>
  <text x="320" y="315" font-size="10" fill="#666">dp[1] = dp[2]+dp[3] = 2+1</text>
  <rect x="460" y="302" width="48" height="20" fill="#d6a040" stroke="#d6a040" rx="3" filter="url(#rough2)"/>
  <text x="484" y="316" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>

  <!-- Step 4: node 4 -->
  <rect x="40" y="332" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="55" y="353" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ 节点 4</text>
  <text x="130" y="353" font-size="10" fill="#666">dist=6</text>
  <text x="180" y="353" font-size="10" fill="#4a7a3a">邻居 1(4&lt;6), 5(0&lt;6) ✓</text>
  <text x="320" y="353" font-size="10" fill="#666">dp[4] = dp[1]+dp[5] = 3+1</text>
  <rect x="460" y="340" width="48" height="20" fill="#4a7a3a" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="484" y="354" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text>

  <!-- ===== Answer ===== -->
  <rect x="150" y="378" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="399" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = dp[1] = 3 ✓</text>
</svg>
