<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序去重 → 建映射 → 查表填结果</text>

  <!-- Start -->
  <rect x="200" y="40" width="140" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">arrayRankTransform(arr)</text>

  <path d="M 270 70 L 270 86" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 1: copy & sort -->
  <rect x="120" y="88" width="300" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="109" text-anchor="middle" font-size="11" fill="#333">① 复制数组并排序：sorted = sort(arr)</text>
  <text x="430" y="109" font-size="10" fill="#888">O(n log n)</text>

  <path d="M 270 122 L 270 138" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: unique -->
  <rect x="120" y="140" width="300" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="161" text-anchor="middle" font-size="11" fill="#333">② 去重：unique(sorted)（相同值只留一个）</text>
  <text x="430" y="161" font-size="10" fill="#888">O(n)</text>

  <path d="M 270 174 L 270 190" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: build map -->
  <rect x="120" y="192" width="300" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="213" text-anchor="middle" font-size="11" fill="#333">③ 建映射：rankMap[sorted[i]] = i + 1</text>
  <text x="430" y="213" font-size="10" fill="#888">O(n)</text>

  <path d="M 270 226 L 270 242" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: lookup fill -->
  <rect x="120" y="244" width="300" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="265" text-anchor="middle" font-size="11" fill="#333">④ 遍历原数组：res[i] = rankMap[arr[i]]</text>
  <text x="430" y="265" font-size="10" fill="#888">O(n)</text>

  <path d="M 270 278 L 270 294" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="200" y="296" width="140" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return res</text>

  <!-- side note: why unique matters -->
  <rect x="40" y="346" width="460" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="370" font-size="12" fill="#444" font-weight="bold">关键细节：为什么必须「去重」？</text>
  <text x="60" y="392" font-size="11" fill="#555">若不去重，相同值会占据相邻多个下标，名次出现「跳号」。</text>
  <text x="60" y="410" font-size="11" fill="#555">例：arr = [100,100,100]，排序后 [100,100,100]</text>
  <text x="60" y="426" font-size="11" fill="#555">  不去重 → 名次 1,2,3（错误，应为 1,1,1）</text>
  <text x="60" y="442" font-size="11" fill="#555">  去重后 → [100] → 名次 1,1,1 ✓</text>
</svg>
