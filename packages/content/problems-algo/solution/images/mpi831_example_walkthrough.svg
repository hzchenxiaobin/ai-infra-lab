<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：邮箱（示例1）与带国家码电话（示例4）逐步脱敏</text>

  <!-- ====== 邮箱示例 1 ====== -->
  <rect x="30" y="44" width="580" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="66" font-size="12" fill="#446688" font-weight="bold">示例 1（邮箱）：s = "LeetCode@LeetCode.com"</text>

  <!-- step row labels -->
  <text x="50" y="92" font-size="10" fill="#888">① find('@')</text>
  <rect x="170" y="78" width="180" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="10" fill="#333">at = 8</text>
  <text x="370" y="93" font-size="10" fill="#888">名字</text>
  <rect x="410" y="78" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">"LeetCode"</text>
  <text x="545" y="93" font-size="10" fill="#888">(8 字符)</text>

  <text x="50" y="124" font-size="10" fill="#888">② 转小写</text>
  <rect x="170" y="110" width="280" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="125" text-anchor="middle" font-size="10" fill="#333">"leetcode@leetcode.com"</text>

  <text x="50" y="156" font-size="10" fill="#888">③ 取首尾</text>
  <rect x="170" y="142" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="157" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">首='l' 尾='e'</text>
  <text x="310" y="157" font-size="10" fill="#888">中间 6 字符全弃</text>

  <text x="50" y="188" font-size="10" fill="#888">④ 拼装</text>
  <rect x="170" y="174" width="380" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="360" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"l" + "*****" + "e" + "@leetcode.com"</text>
  <path d="M 555 187 L 580 187" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="600" y="191" font-size="10" fill="#d6a040" font-weight="bold">✓</text>

  <!-- ====== 电话示例 4 ====== -->
  <rect x="30" y="238" width="580" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="260" font-size="12" fill="#4a7a3a" font-weight="bold">示例 4（电话）：s = "86-(10)12345678"</text>

  <text x="50" y="286" font-size="10" fill="#888">① 抽数字</text>
  <rect x="170" y="272" width="220" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="10" fill="#333">剔 -( ) → "861012345678"</text>

  <text x="50" y="318" font-size="10" fill="#888">② 数位数</text>
  <rect x="170" y="304" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="319" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">n = 12</text>
  <text x="310" y="319" font-size="10" fill="#888">国家码 = 12-10 = 2 位</text>

  <text x="50" y="350" font-size="10" fill="#888">③ 取末4位</text>
  <rect x="170" y="336" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="351" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">last4 = "5678"</text>

  <text x="50" y="382" font-size="10" fill="#888">④ 套模板</text>
  <rect x="170" y="368" width="380" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"+" + "**" + "-***-***-" + "5678"</text>
  <path d="M 555 381 L 580 381" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="600" y="385" font-size="10" fill="#d6a040" font-weight="bold">✓</text>

  <!-- contrast note -->
  <rect x="30" y="428" width="580" height="0" fill="none"/>
  <text x="320" y="430" text-anchor="middle" font-size="10" fill="#888">对比示例3 "1(234)567-890"：n=10 → 无 +，直接 "***-***-7890"</text>
</svg>
