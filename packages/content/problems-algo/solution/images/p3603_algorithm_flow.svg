<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="396" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一维滚动数组逐行递推，终点退等待费</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dp[j]：更新前 = 上一行（上方来源）；更新后 = 本行</text>

  <!-- start -->
  <rect x="110" y="52" width="120" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="69" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始</text>
  <line x1="170" y1="78" x2="170" y2="88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="60" y="90" width="220" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="109" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">① dp[0] ← 1，第 0 行：dp[j] ← dp[j−1] + wait + (j+1)</text>
  <line x1="170" y1="120" x2="170" y2="130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: row loop -->
  <rect x="60" y="132" width="220" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="152" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② i 从 1 到 m−1 逐行循环</text>
  <line x1="170" y1="164" x2="170" y2="174" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: row head -->
  <rect x="60" y="176" width="220" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="195" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">③ 行首 dp[0] += wait[i][0] + (i+1)（只能从上来）</text>
  <line x1="170" y1="206" x2="170" y2="216" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: transition -->
  <rect x="30" y="218" width="280" height="58" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="234" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">④ j 从 1 到 n−1：</text>
  <text x="170" y="250" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">dp[j] ← min(dp[j], dp[j−1])   // 上方 vs 左方</text>
  <text x="170" y="264" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">        + wait[i][j] + (i+1)×(j+1)</text>
  <line x1="170" y1="276" x2="170" y2="286" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 170 288 L 238 316 L 170 344 L 102 316 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="320" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">行扫完？</text>

  <!-- yes -->
  <line x1="170" y1="344" x2="170" y2="356" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="354" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="95" y="358" width="150" height="28" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="376" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑤ 返回 dp[n−1] − wait[m−1][n−1]</text>

  <!-- no: loop back -->
  <path d="M 238 316 L 320 316 L 320 148 L 284 148" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="246" y="310" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="331" y="232" transform="rotate(-90 331 232)" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">i ← i+1，下一行</text>

  <!-- side note 1 -->
  <rect x="344" y="90" width="164" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="108" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">为什么免队列？</text>
  <text x="356" y="124" font-size="9" fill="#8a6d1f" filter="url(#rough2)">只向右/下走 ⇒ 状态图是</text>
  <text x="356" y="137" font-size="9" fill="#8a6d1f" filter="url(#rough2)">DAG，行优先扫描就是</text>
  <text x="356" y="150" font-size="9" fill="#8a6d1f" filter="url(#rough2)">拓扑序，依赖（上、左）</text>
  <text x="356" y="163" font-size="9" fill="#8a6d1f" filter="url(#rough2)">先于当前格算好——</text>
  <text x="356" y="176" font-size="9" fill="#8a6d1f" filter="url(#rough2)">Dijkstra 的堆纯属多余</text>

  <!-- side note 2 -->
  <rect x="344" y="218" width="164" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="236" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 必须用 long long</text>
  <text x="426" y="250" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">累加和上界 ≈ 2×10¹⁰</text>
  <text x="426" y="263" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">超 int32，乘法先转型再乘</text>

  <!-- side note 3 -->
  <rect x="344" y="290" width="164" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="308" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="426" y="323" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">时间 O(mn)，mn ≤ 10⁵</text>
  <text x="426" y="337" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">空间 O(n) 滚动数组</text>
  <text x="426" y="350" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">终点修正依赖 mn ≥ 2</text>
</svg>
