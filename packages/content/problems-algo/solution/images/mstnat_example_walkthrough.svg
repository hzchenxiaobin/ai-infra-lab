<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：p=2, q=7（Case 1 四步重连）</text>

  <!-- ================================================================ -->
  <!-- Cell 1 (top-left): Original tree -->
  <!-- ================================================================ -->
  <text x="140" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">① 原始树</text>

  <!-- edges -->
  <path d="M 134 78 Q 112 92 102 106" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 146 78 Q 168 92 178 106" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 94 132 Q 82 146 74 156" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 108 132 Q 118 146 126 156" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 178 132 L 178 156" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 68 182 Q 58 194 54 204" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 182 Q 90 194 94 204" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node 1 -->
  <circle cx="140" cy="68" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="72" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- node 2 (p) -->
  <circle cx="100" cy="120" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <!-- node 3 -->
  <circle cx="180" cy="120" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="124" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- node 4 -->
  <circle cx="72" cy="168" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="172" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- node 5 -->
  <circle cx="128" cy="168" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="172" text-anchor="middle" font-size="10" fill="#333">5</text>

  <!-- node 6 -->
  <circle cx="180" cy="168" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="172" text-anchor="middle" font-size="10" fill="#333">6</text>

  <!-- node 7 (q) -->
  <circle cx="52" cy="216" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="52" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7</text>

  <!-- node 8 -->
  <circle cx="96" cy="216" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="220" text-anchor="middle" font-size="10" fill="#333">8</text>

  <!-- labels -->
  <text x="84" y="108" font-size="9" fill="#d6a040" font-weight="bold">p</text>
  <text x="38" y="232" font-size="9" fill="#b85450" font-weight="bold">q</text>

  <!-- arrow down -->
  <path d="M 260 140 L 285 140" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- ================================================================ -->
  <!-- Cell 2 (top-right): Detach q=7 from 4 -->
  <!-- ================================================================ -->
  <text x="420" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">② 摘除 q=7（从 4 断开）</text>

  <!-- edges -->
  <path d="M 414 78 Q 392 92 382 106" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 426 78 Q 448 92 458 106" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 374 132 Q 362 146 354 156" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 388 132 Q 398 146 406 156" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 458 132 L 458 156" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 360 182 Q 370 194 374 204" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- dashed: 4 -> 7 (detached) -->
  <path d="M 350 182 L 470 216" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>

  <!-- node 1 -->
  <circle cx="420" cy="68" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="72" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- node 2 (p) -->
  <circle cx="380" cy="120" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <!-- node 3 -->
  <circle cx="460" cy="120" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="124" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- node 4 (lost q) -->
  <circle cx="352" cy="168" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="172" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- node 5 -->
  <circle cx="408" cy="168" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="172" text-anchor="middle" font-size="10" fill="#333">5</text>

  <!-- node 6 -->
  <circle cx="460" cy="168" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="172" text-anchor="middle" font-size="10" fill="#333">6</text>

  <!-- node 8 -->
  <circle cx="378" cy="216" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="220" text-anchor="middle" font-size="10" fill="#333">8</text>

  <!-- node 7 (q, detached) -->
  <circle cx="480" cy="222" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="2,1.5" filter="url(#rough2)"/>
  <text x="480" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7</text>

  <!-- labels -->
  <text x="362" y="108" font-size="9" fill="#d6a040" font-weight="bold">p</text>
  <text x="468" y="238" font-size="9" fill="#b85450" font-weight="bold">q(断开)</text>

  <!-- ================================================================ -->
  <!-- Divider -->
  <!-- ================================================================ -->
  <path d="M 30 250 L 530 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- arrow from cell1 to cell3 (down-left) and cell2 to cell4 (down-right) -->
  <path d="M 140 232 L 140 268" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <path d="M 420 232 L 420 268" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- ================================================================ -->
  <!-- Cell 3 (bottom-left): q=7 replaces p=2 -->
  <!-- ================================================================ -->
  <text x="140" y="282" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">③ q=7 替换 p=2 的位置</text>

  <!-- edges: 1 -> 7, 1 -> 3, 3 -> 6 -->
  <path d="M 134 308 Q 112 322 102 336" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 146 308 Q 168 322 178 336" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 180 362 L 180 386" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- p=2 detached, show with subtree -->
  <path d="M 88 362 Q 76 376 68 386" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 102 362 Q 112 376 118 386" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <path d="M 64 410 L 58 422" stroke="#bbb" stroke-width="1" stroke-dasharray="2,1.5" fill="none" filter="url(#rough2)"/>

  <!-- node 1 -->
  <circle cx="140" cy="298" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="302" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- node 7 (q, now child of 1) -->
  <circle cx="100" cy="350" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="354" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>

  <!-- node 3 -->
  <circle cx="180" cy="350" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="354" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- node 6 -->
  <circle cx="180" cy="398" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="402" text-anchor="middle" font-size="10" fill="#333">6</text>

  <!-- node 2 (p, detached with subtree) -->
  <circle cx="82" cy="398" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="2,1.5" filter="url(#rough2)"/>
  <text x="82" y="402" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>

  <!-- node 4 (in p's detached subtree) -->
  <circle cx="58" cy="428" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="1.5,1" filter="url(#rough2)"/>
  <text x="58" y="431" text-anchor="middle" font-size="8" fill="#333">4</text>

  <!-- labels -->
  <text x="84" y="338" font-size="9" fill="#b85450" font-weight="bold">q</text>
  <text x="64" y="414" font-size="8.5" fill="#d6a040">p(待挂)</text>

  <!-- arrow to cell 4 -->
  <path d="M 260 360 L 285 360" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- ================================================================ -->
  <!-- Cell 4 (bottom-right): Final — p=2 attached to q=7 -->
  <!-- ================================================================ -->
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ 完成：p=2 挂为 q=7 的末子</text>

  <!-- edges -->
  <path d="M 414 308 Q 396 322 388 336" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 426 308 Q 444 322 452 336" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 388 362 L 388 384" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 452 362 L 452 384" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 382 410 Q 372 422 368 428" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 394 410 Q 404 422 408 428" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- node 1 -->
  <circle cx="420" cy="298" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="302" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- node 7 (q) -->
  <circle cx="388" cy="350" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="388" y="354" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>

  <!-- node 3 -->
  <circle cx="452" cy="350" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="354" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- node 2 (p, now child of q=7) -->
  <circle cx="388" cy="398" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="388" y="402" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <!-- node 6 -->
  <circle cx="452" cy="398" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="402" text-anchor="middle" font-size="10" fill="#333">6</text>

  <!-- node 4 -->
  <circle cx="366" cy="428" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="366" y="431" text-anchor="middle" font-size="9" fill="#333">4</text>

  <!-- node 5 -->
  <circle cx="410" cy="428" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="410" y="431" text-anchor="middle" font-size="9" fill="#333">5</text>

  <!-- labels -->
  <text x="372" y="338" font-size="9" fill="#b85450" font-weight="bold">q</text>
  <text x="372" y="386" font-size="9" fill="#d6a040" font-weight="bold">p</text>
</svg>
