<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [−1,−100,3,99]，k = 2</text>

  <!-- Row 1: 原数组 -->
  <rect x="10" y="58" width="130" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">原数组</text>
  <rect x="160" y="56" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="80" text-anchor="middle" font-size="13" fill="#333">−1</text>
  <rect x="230" y="56" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="80" text-anchor="middle" font-size="13" fill="#333">−100</text>
  <rect x="300" y="56" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="80" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="370" y="56" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="80" text-anchor="middle" font-size="13" fill="#333">99</text>

  <path d="M 480 74 L 480 110" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="488" y="96" font-size="11" fill="#d6a040" font-weight="bold">① 整体反转</text>

  <!-- Row 2: [99,3,-100,-1] all orange -->
  <rect x="10" y="116" width="130" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="140" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">reverse(0,3)</text>
  <rect x="160" y="114" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="138" text-anchor="middle" font-size="13" fill="#333">99</text>
  <rect x="230" y="114" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="138" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="300" y="114" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="138" text-anchor="middle" font-size="13" fill="#333">−100</text>
  <rect x="370" y="114" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="138" text-anchor="middle" font-size="13" fill="#333">−1</text>

  <path d="M 480 132 L 480 168" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="488" y="154" font-size="11" fill="#b85450" font-weight="bold">② 反转前 k=2</text>

  <!-- Row 3: [3,99,-100,-1] first2 red, last2 orange -->
  <rect x="10" y="174" width="130" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="75" y="198" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">reverse(0,1)</text>
  <rect x="160" y="172" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="230" y="172" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">99</text>
  <rect x="300" y="172" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="196" text-anchor="middle" font-size="13" fill="#333">−100</text>
  <rect x="370" y="172" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="196" text-anchor="middle" font-size="13" fill="#333">−1</text>

  <path d="M 480 190 L 480 226" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="488" y="212" font-size="11" fill="#446688" font-weight="bold">③ 反转后 n−k=2</text>

  <!-- Row 4: [3,99,-1,-100] first2 red, last2 blue = 结果 -->
  <rect x="10" y="232" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="75" y="256" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">reverse(2,3) ✓</text>
  <rect x="160" y="230" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="254" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="230" y="230" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="254" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">99</text>
  <rect x="300" y="230" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="254" text-anchor="middle" font-size="13" fill="#333">−1</text>
  <rect x="370" y="230" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="254" text-anchor="middle" font-size="13" fill="#333">−100</text>

  <!-- Result note -->
  <rect x="120" y="296" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">结果 [3,99,−1,−100] = 末尾 2 个搬到开头</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#888">前两步生成的 [3,99]（红）即原末尾 k 个，已就位</text>
</svg>
