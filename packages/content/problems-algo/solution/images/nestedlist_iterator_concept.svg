<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    嵌套结构 → 前序遍历 → 扁平序列
  </text>

  <!-- Outermost list bracket depth 1 -->
  <path d="M 40 70 Q 30 70 30 90 L 30 180 Q 30 200 40 200"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 530 70 Q 540 70 540 90 L 540 180 Q 540 200 530 200"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="20" y="140" font-size="13" fill="#446688" filter="url(#rough2)">list</text>

  <!-- Inner [1,1] #1 -->
  <path d="M 70 100 Q 62 100 62 115 L 62 165 Q 62 180 70 180"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 180 100 Q 188 100 188 115 L 188 165 Q 188 180 180 180"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="80" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="141" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">①</text>
  <rect x="130" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="141" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">②</text>

  <!-- Middle integer 2 -->
  <rect x="255" y="120" width="50" height="32" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">③</text>

  <!-- Inner [1,1] #2 -->
  <path d="M 360 100 Q 352 100 352 115 L 352 165 Q 352 180 360 180"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 470 100 Q 478 100 478 115 L 478 165 Q 478 180 470 180"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="370" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="141" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="390" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">④</text>
  <rect x="420" y="120" width="40" height="32" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="141" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="440" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⑤</text>

  <!-- Arrow down -->
  <line x1="280" y1="215" x2="280" y2="248" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="237" font-size="12" fill="#4a7a3a" filter="url(#rough2)">前序 DFS</text>

  <!-- Flat output sequence -->
  <rect x="80" y="262" width="400" height="50" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    next() 依次返回
  </text>
  <rect x="160" y="290" width="40" height="30" fill="#fff" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="311" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="210" y="290" width="40" height="30" fill="#fff" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="311" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="260" y="290" width="40" height="30" fill="#fff" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="310" y="290" width="40" height="30" fill="#fff" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="311" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="360" y="290" width="40" height="30" fill="#fff" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="311" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- visit order labels under flat -->
  <text x="180" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">①</text>
  <text x="230" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">②</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">③</text>
  <text x="330" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">④</text>
  <text x="380" y="342" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⑤</text>

  <!-- legend -->
  <rect x="40" y="355" width="18" height="14" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="367" font-size="11" fill="#555" filter="url(#rough2)">整数节点</text>
  <rect x="140" y="355" width="18" height="14" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="367" font-size="11" fill="#555" filter="url(#rough2)">顶层整数</text>
  <path d="M 250 355 Q 246 355 246 362 L 246 369" fill="none" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="367" font-size="11" fill="#555" filter="url(#rough2)">列表括号（内部节点）</text>
</svg>
