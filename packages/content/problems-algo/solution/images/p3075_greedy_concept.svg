<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：解耦「选谁」与「第几轮选」</text>

  <!-- original row -->
  <text x="158" y="70" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">原始（乱序）</text>
  <rect x="170" y="48" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="48" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="48" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="48" width="42" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="191" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="237" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="283" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="329" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 250 92 C 250 100, 250 106, 250 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="108" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">降序排序</text>

  <!-- sorted row -->
  <text x="158" y="139" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后 a[i]</text>
  <rect x="170" y="116" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="116" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="116" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="116" width="42" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="191" y="139" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="237" y="139" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="283" y="139" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="329" y="139" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- index row -->
  <text x="191" y="174" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i = 0</text>
  <text x="237" y="174" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i = 1</text>
  <text x="283" y="174" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i = 2</text>
  <text x="329" y="174" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i = 3</text>

  <!-- decay row -->
  <text x="158" y="199" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">轮次衰减</text>
  <text x="191" y="199" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−0</text>
  <text x="237" y="199" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="283" y="199" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="329" y="199" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="418" y="199" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（磨到 0 为止）</text>

  <!-- net contribution row -->
  <text x="158" y="235" text-anchor="end" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">净贡献</text>
  <rect x="170" y="214" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="214" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="262" y="214" width="42" height="34" fill="#f2f2f2" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="214" width="42" height="34" fill="#f2f2f2" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="191" y="236" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="237" y="236" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="283" y="236" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="329" y="236" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="237" y="262" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">← 只选前 k = 2 个</text>
  <text x="329" y="262" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">未选</text>

  <!-- formula box -->
  <rect x="50" y="282" width="310" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="205" y="302" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">ans = max(4−0, 0) + max(3−1, 0)</text>
  <text x="205" y="322" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">= 4 + 2 = 6</text>

  <!-- note box -->
  <rect x="386" y="282" width="134" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="453" y="303" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">大值配小衰减</text>
  <text x="453" y="321" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">（排序不等式）</text>

  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第 i 轮选中者恰好被磨 i 轮 → 净贡献 = max(a[i] − i, 0)</text>
</svg>
