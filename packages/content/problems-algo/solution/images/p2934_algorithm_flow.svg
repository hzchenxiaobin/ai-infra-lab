<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举 2 种终态，各做一次线性扫描</text>

  <!-- read a, b -->
  <rect x="160" y="38" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">a = nums1[n−1]，b = nums2[n−1]</text>

  <path d="M 212 72 L 138 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 308 72 L 382 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- two cases -->
  <rect x="30" y="108" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">方案 A：末位不动</text>
  <text x="135" y="147" text-anchor="middle" font-size="11" fill="#333">cntA = count(a, b)</text>

  <rect x="280" y="108" width="210" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="128" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">方案 B：末位互换（+1）</text>
  <text x="385" y="147" text-anchor="middle" font-size="11" fill="#333">cntB = 1 + count(b, a)</text>

  <path d="M 135 156 L 135 174" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 385 156 L 385 174" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- count frame -->
  <rect x="30" y="178" width="460" height="170" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="198" font-size="11" fill="#888">count(tA, tB)：目标末位 (tA, tB)，记 x = nums1[i]，y = nums2[i]，逐个扫描 i = 0 … n−2</text>

  <!-- diamond 1 -->
  <polygon points="260,212 392,240 260,268 128,240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">原位合法？</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#333">x ≤ tA 且 y ≤ tB</text>

  <path d="M 392 240 L 400 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="396" y="232" font-size="10" fill="#4a7a3a">是</text>
  <rect x="404" y="226" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="444" y="244" text-anchor="middle" font-size="10" fill="#333">+0 → 下一个 i</text>

  <path d="M 260 268 L 260 280" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="278" font-size="10" fill="#888">否</text>

  <!-- diamond 2 -->
  <polygon points="260,282 392,310 260,338 128,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">换后合法？</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#333">y ≤ tA 且 x ≤ tB</text>

  <path d="M 392 310 L 400 310" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="396" y="302" font-size="10" fill="#d6a040">是</text>
  <rect x="404" y="296" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="444" y="314" text-anchor="middle" font-size="10" fill="#333">cnt+1 → 下一个 i</text>

  <path d="M 128 310 L 120 310" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="124" y="302" font-size="10" fill="#b85450">否</text>
  <rect x="36" y="296" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="76" y="314" text-anchor="middle" font-size="10" fill="#b85450">返回 ∞（无解）</text>

  <!-- final -->
  <path d="M 260 348 L 260 362" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="95" y="366" width="330" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = min(cntA, cntB)；均为 ∞ → 返回 −1</text>
</svg>
