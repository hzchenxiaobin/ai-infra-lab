<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：收入轴按税级分段，每段独立税率，跨过 income 即止</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#666">brackets=[[3,50],[7,10],[12,25]]，income=10</text>

  <!-- income vertical marker -->
  <line x1="420" y1="70" x2="420" y2="220" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="384" y="60" width="72" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">income=10</text>

  <!-- ===== segment bars: [0,3]=50% blue, [3,7]=10% green, [7,12]=25% orange ===== -->
  <!-- bar y=150 h=56 ; unit=35 ; start x=70 -->
  <rect x="70" y="150" width="105" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="122" y="184" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">50%</text>

  <rect x="175" y="150" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="245" y="184" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">10%</text>

  <!-- [7,12] split: taxable [7,10] + beyond-income [10,12] -->
  <rect x="315" y="150" width="105" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="367" y="184" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">25%</text>
  <rect x="420" y="150" width="70" height="56" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="455" y="184" text-anchor="middle" font-size="10" fill="#999">超收入</text>

  <!-- taxable amount labels above each segment -->
  <text x="122" y="146" text-anchor="middle" font-size="10" fill="#446688">本段 3 元</text>
  <text x="245" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a">本段 4 元</text>
  <text x="367" y="146" text-anchor="middle" font-size="10" fill="#d6a040">本段 3 元</text>

  <!-- ===== income axis with ticks ===== -->
  <line x1="60" y1="222" x2="500" y2="222" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- ticks 0,3,7,10,12 -->
  <line x1="70" y1="222" x2="70" y2="230" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="244" text-anchor="middle" font-size="11" fill="#555">0</text>
  <line x1="175" y1="222" x2="175" y2="230" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="175" y="244" text-anchor="middle" font-size="11" fill="#555">3</text>
  <line x1="315" y1="222" x2="315" y2="230" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="315" y="244" text-anchor="middle" font-size="11" fill="#555">7</text>
  <line x1="420" y1="222" x2="420" y2="230" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <line x1="490" y1="222" x2="490" y2="230" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="490" y="244" text-anchor="middle" font-size="11" fill="#555">12</text>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#888">收入轴（$）</text>

  <!-- prev pointer note -->
  <text x="70" y="280" font-size="10.5" fill="#446688">prev 起点为 0，逐段右移至 upper</text>

  <!-- ===== Bottom insight box ===== -->
  <rect x="30" y="296" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">每段应税额 = min(income, upper) − prev</text>
  <text x="280" y="334" text-anchor="middle" font-size="10.5" fill="#555">cap 在 income：收入落在哪段就只算到哪段；之后段 taxable=0，可直接终止</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#555">例：[7,12] 段 income 落在 10 → 应税 = min(10,12)−7 = 3，而非 5</text>
</svg>
