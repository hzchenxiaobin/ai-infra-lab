<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：两遍扫描</text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="460" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="55" y="72" font-size="12" fill="#b85450" font-weight="bold">第一步：收集坏数集合 bad</text>
  <text x="55" y="90" font-size="10" fill="#555">遍历所有卡片 i，若 fronts[i] == backs[i]，将 fronts[i] 加入 bad 集合</text>
  <text x="55" y="106" font-size="10" fill="#555">bad 中的数"永远可见"，不可能成为好数</text>

  <!-- Arrow 1->2 -->
  <path d="M 270 125 L 270 145" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="150" width="460" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="55" y="172" font-size="12" fill="#4a7a3a" font-weight="bold">第二步：扫描所有数，找不在 bad 中的最小值</text>
  <text x="55" y="190" font-size="10" fill="#555">遍历 fronts[i] 和 backs[i]，若该数 ∉ bad，更新 ans = min(ans, 该数)</text>
  <text x="55" y="206" font-size="10" fill="#555">这些数可被翻转隐藏 → 候选好数</text>

  <!-- Arrow 2->3 -->
  <path d="M 270 225 L 270 245" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="250" width="460" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="55" y="272" font-size="12" fill="#446688" font-weight="bold">第三步：返回结果</text>
  <text x="55" y="290" font-size="10" fill="#555">若 ans 仍为初始值（∞），说明无好数，返回 0</text>
  <text x="55" y="304" font-size="10" fill="#555">否则返回 ans（最小好数）</text>

  <!-- Complexity -->
  <rect x="40" y="320" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="55" y="340" font-size="10" fill="#8a6a20" font-weight="bold">复杂度：O(n) 时间 / O(n) 空间 — 两遍线性扫描 + 一个哈希集合</text>
</svg>
