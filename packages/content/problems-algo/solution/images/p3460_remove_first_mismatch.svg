<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：唯一值得试的删除 = 第一个失配位 s[i]</text>

  <!-- ===== 上：原始对齐 ===== -->
  <text x="24" y="66" font-size="13" fill="#555" filter="url(#rough2)">t =</text>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="58" y="44" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="96" y="44" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="134" y="44" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="172" y="44" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="210" y="44" width="38" height="32" rx="4" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="77" y="65" filter="url(#rough2)">m</text>
    <text x="115" y="65" filter="url(#rough2)">a</text>
    <text x="153" y="65" filter="url(#rough2)">d</text>
    <text x="191" y="65" filter="url(#rough2)">a</text>
    <text x="229" y="65" filter="url(#rough2)">m</text>
  </g>
  <text x="24" y="102" font-size="13" fill="#555" filter="url(#rough2)">s =</text>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="58" y="80" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="96" y="80" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="134" y="80" width="38" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="172" y="80" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="210" y="80" width="38" height="32" rx="4" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="77" y="101" filter="url(#rough2)">m</text>
    <text x="115" y="101" filter="url(#rough2)">a</text>
    <text x="153" y="101" filter="url(#rough2)">d</text>
    <text x="191" y="101" fill="#b85450" filter="url(#rough2)">x</text>
    <text x="229" y="101" filter="url(#rough2)">a</text>
  </g>
  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="77" y="126" filter="url(#rough2)">0</text>
    <text x="115" y="126" filter="url(#rough2)">1</text>
    <text x="153" y="126" filter="url(#rough2)">2</text>
    <text x="191" y="126" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=3</text>
    <text x="229" y="126" filter="url(#rough2)">4</text>
  </g>
  <!-- 右侧失配标注 -->
  <path d="M 300 52 C 264 38, 226 36, 200 42" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="66" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">首个失配 i = 3</text>
  <text x="302" y="84" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">s[3]='x' ≠ t[3]='a'</text>
  <text x="302" y="106" font-size="11" fill="#666" filter="url(#rough2)">前 3 位全配 → 不删时 LCP = 3</text>

  <!-- 过渡说明 -->
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">删掉 s[3]='x'：s 的后缀整体左移一格，与 t[i:] 错位续配</text>

  <!-- ===== 中：删除后续配 ===== -->
  <text x="24" y="174" font-size="13" fill="#555" filter="url(#rough2)">t =</text>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="58" y="152" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="96" y="152" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="134" y="152" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="172" y="152" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="210" y="152" width="38" height="32" rx="4" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <text x="77" y="173" filter="url(#rough2)">m</text>
    <text x="115" y="173" filter="url(#rough2)">a</text>
    <text x="153" y="173" filter="url(#rough2)">d</text>
    <text x="191" y="173" filter="url(#rough2)">a</text>
    <text x="229" y="173" fill="#bbb" filter="url(#rough2)">m</text>
  </g>
  <text x="14" y="210" font-size="13" fill="#555" filter="url(#rough2)">s' =</text>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="58" y="188" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="96" y="188" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="134" y="188" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="172" y="188" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="210" y="188" width="38" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
    <text x="77" y="209" filter="url(#rough2)">m</text>
    <text x="115" y="209" filter="url(#rough2)">a</text>
    <text x="153" y="209" filter="url(#rough2)">d</text>
    <text x="191" y="209" filter="url(#rough2)">a</text>
    <text x="229" y="209" fill="#b85450" filter="url(#rough2)">x</text>
  </g>
  <path d="M 214 192 L 244 218" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <!-- 右侧续配标注 -->
  <text x="302" y="164" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">s[4]='a' 顶到 t[3] 的位置</text>
  <text x="302" y="182" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">错位续配：m·a·d·a 全配 ✓</text>
  <text x="302" y="208" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">LCP = 4，比不删多 1</text>
  <text x="302" y="226" font-size="10" fill="#999" filter="url(#rough2)">（虚线格 = 已删除的 'x'）</text>

  <!-- ===== 下：三类删除清算 ===== -->
  <rect x="24" y="240" width="472" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="262" font-size="11.5" fill="#333" filter="url(#rough2)">① 删 j &gt; i：失配点纹丝不动 → LCP 仍是 i（白删）</text>
  <text x="40" y="282" font-size="11.5" fill="#333" filter="url(#rough2)">② 删 j &lt; i：后缀整体左移一格，被「删 i」支配 → 不会更优（交换论证）</text>
  <text x="40" y="302" font-size="11.5" fill="#333" filter="url(#rough2)">③ 删 s[i]：前缀照配 + 错位续配 → 唯一值得试的删除 ✓</text>

  <!-- 结论横幅 -->
  <rect x="24" y="322" width="472" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">答案 = i + LCP( s[i+1:], t[i:] ) —— 两指针一趟线性扫描</text>
</svg>
