<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟扫描检查三种 Case</text>

  <!-- Start: for i = 3 to n-1 -->
  <rect x="150" y="38" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">for i = 3  to  n − 1</text>

  <!-- arrow down -->
  <line x1="260" y1="70" x2="260" y2="83" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Case 1 decision -->
  <rect x="80" y="86" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="220" y="103" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Case 1: d[i] ≥ d[i−2]  且  d[i−1] ≤ d[i−3] ?</text>
  <text x="220" y="120" text-anchor="middle" font-size="9" fill="#888">line i 穿越 line i−3</text>

  <!-- Yes → return true (right) -->
  <line x1="360" y1="108" x2="395" y2="108" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="103" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="398" y="93" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="453" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <!-- No ↓ -->
  <line x1="220" y1="132" x2="220" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="142" font-size="9" fill="#888">否</text>

  <!-- Case 2 decision -->
  <rect x="80" y="148" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="220" y="165" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Case 2: i≥4 且 d[i−1]==d[i−3]</text>
  <text x="220" y="180" text-anchor="middle" font-size="10" fill="#d6a040">且 d[i]+d[i−4] ≥ d[i−2] ?</text>

  <!-- Yes → return true -->
  <line x1="360" y1="170" x2="395" y2="170" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="165" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="398" y="155" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="453" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <!-- No ↓ -->
  <line x1="220" y1="194" x2="220" y2="207" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="204" font-size="9" fill="#888">否</text>

  <!-- Case 3 decision -->
  <rect x="60" y="210" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="220" y="228" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Case 3: i≥5 且 d[i−2]≥d[i−4] 且 d[i−1]≤d[i−3]</text>
  <text x="220" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a">且 d[i−1]+d[i−5]≥d[i−3] 且 d[i]+d[i−4]≥d[i−2] ?</text>
  <text x="220" y="258" text-anchor="middle" font-size="9" fill="#888">line i 穿越 line i−5（螺旋内折）</text>

  <!-- Yes → return true -->
  <line x1="380" y1="238" x2="395" y2="238" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="390" y="233" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>
  <rect x="398" y="223" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="453" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <!-- No ↓ -->
  <line x1="220" y1="268" x2="220" y2="281" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="278" font-size="9" fill="#888">否</text>

  <!-- i++ -->
  <rect x="170" y="284" width="100" height="28" fill="#f5f5f5" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="303" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">i++</text>

  <!-- loop back arrow: from i++ left, up, right to start -->
  <path d="M 170 298 L 40 298 L 40 53 L 148 53" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="180" font-size="9" fill="#888" transform="rotate(-90 50 180)">继续下一轮</text>

  <!-- loop ends → return false (from start, right branch) -->
  <line x1="370" y1="53" x2="395" y2="53" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="382" y="48" text-anchor="middle" font-size="9" fill="#b85450">结束</text>
  <rect x="398" y="38" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="453" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- bottom note -->
  <rect x="60" y="330" width="400" height="68" fill="#fffbe6" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">关键洞察</text>
  <text x="260" y="368" text-anchor="middle" font-size="9.5" fill="#666">螺旋未自交时层层嵌套，line i 只可能与 line i−3 / i−4 / i−5 相交</text>
  <text x="260" y="384" text-anchor="middle" font-size="9.5" fill="#666">更早的线段被外层屏蔽，无需检查 → O(n) 一趟扫描</text>
</svg>
