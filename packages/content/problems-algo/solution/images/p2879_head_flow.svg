<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">head(3) 算法流程</text>

  <!-- Step 1 -->
  <rect x="55" y="52" width="270" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 输入 employees</text>
  <text x="190" y="89" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">任意行数 n、4 列</text>

  <path d="M 190 100 L 190 122" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="55" y="126" width="270" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="146" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">② head(3)：从行标签 0 起数 3 行</text>
  <text x="190" y="163" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">纯位置计算，与列值无关</text>

  <path d="M 190 174 L 190 196" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="55" y="200" width="270" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">③ 切出前缀，构造新 DataFrame</text>
  <text x="190" y="237" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">原表 employees 保持不动</text>

  <path d="M 190 248 L 190 270" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="55" y="274" width="270" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="190" y="294" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">④ 返回前 3 行</text>
  <text x="190" y="311" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">顺序、行索引 0~2、列全部原样</text>

  <!-- Side branch: fewer than 3 rows -->
  <path d="M 327 187 L 358 187" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="150" width="145" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="432" y="172" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不足 3 行？</text>
  <text x="432" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">有多少返回多少</text>
  <text x="432" y="207" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">不报错、不补 NaN</text>

  <!-- Side note: equivalent forms -->
  <rect x="360" y="52" width="145" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="432" y="74" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">等价写法</text>
  <text x="432" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">df.iloc[:3]</text>
  <text x="432" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">df[:3]</text>
</svg>
