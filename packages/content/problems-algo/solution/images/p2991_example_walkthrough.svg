<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：跨行求和定名次，缺位用占位串补齐</text>

  <!-- 表头 -->
  <rect x="18" y="40" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="63" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">country</text>

  <rect x="108" y="40" width="136" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">top_winery</text>

  <rect x="244" y="40" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">second_winery</text>

  <rect x="394" y="40" width="148" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="468" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">third_winery</text>

  <!-- Australia 行 -->
  <rect x="18" y="72" width="90" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="97" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Australia</text>

  <rect x="108" y="72" width="136" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="97" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">HarmonyHill (100)</text>

  <rect x="244" y="72" width="150" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="97" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">GrapesGalore (85)</text>

  <rect x="394" y="72" width="148" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="468" y="97" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">WhisperingPines (84)</text>

  <!-- Hungary 行 -->
  <rect x="18" y="114" width="90" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Hungary</text>

  <rect x="108" y="114" width="136" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">MoonlitCellars (60)</text>

  <rect x="244" y="114" width="150" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="319" y="139" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">No second winery</text>

  <rect x="394" y="114" width="148" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="468" y="139" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">No third winery</text>

  <!-- India 行 -->
  <rect x="18" y="156" width="90" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="181" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">India</text>

  <rect x="108" y="156" width="136" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="181" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">SunsetVines (69)</text>

  <rect x="244" y="156" width="150" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="319" y="181" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">No second winery</text>

  <rect x="394" y="156" width="148" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="468" y="181" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">No third winery</text>

  <!-- USA 行 -->
  <rect x="18" y="198" width="90" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="223" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">USA</text>

  <rect x="108" y="198" width="136" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="223" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">RoyalVines (86)</text>

  <rect x="244" y="198" width="150" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="223" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Eagle'sNest (45)</text>

  <rect x="394" y="198" width="148" height="42" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="468" y="223" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">PacificCrest (9)</text>

  <!-- 标注箭头 -->
  <path d="M 176 244 Q 176 262 200 268" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 319 244 Q 319 260 300 264" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 注解区 -->
  <rect x="18" y="272" width="524" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">★ USA：RoyalVines 两行 47 + 39 = 86 合并成一席第 1 名（不聚合会错占第 1、2 名）</text>

  <rect x="18" y="310" width="524" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">★ Hungary / India：酒庄数不足 → rn = 2 / 3 缺失，COALESCE 填占位串</text>

  <rect x="18" y="348" width="524" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="365" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">输出格式：CONCAT(酒庄名, ' (', 总分, ')') —— 名字与括号间有一个空格</text>
</svg>
