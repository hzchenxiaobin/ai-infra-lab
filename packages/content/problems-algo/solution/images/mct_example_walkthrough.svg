<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.1"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：arr = [6, 2, 4]，答案 32</text>
  <path d="M 210 34 Q 360 42 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Section 1: Two trees ===== -->
  <text x="60" y="62" font-size="12" font-weight="bold" fill="#5a3a7a">① 两种二叉树（中序遍历 = [6,2,4]）</text>

  <!-- Tree A: ((6,2),4) sum=36 -->
  <text x="140" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">树 A：sum = 36</text>
  <!-- root A -->
  <g filter="url(#sk2)"><ellipse cx="140" cy="108" rx="32" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="140" y="113" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">24</text>
  <!-- left child A (internal) -->
  <g filter="url(#sk2)"><ellipse cx="90" cy="148" rx="28" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="90" y="152" text-anchor="middle" font-size="10" fill="#8a6a1a" font-weight="bold">12</text>
  <!-- right leaf A -->
  <g filter="url(#sk2)"><rect x="178" y="136" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="192" y="154" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">4</text>
  <!-- leaves under left child -->
  <g filter="url(#sk2)"><rect x="58" y="178" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="72" y="196" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">6</text>
  <g filter="url(#sk2)"><rect x="94" y="178" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="108" y="196" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">2</text>
  <!-- edges A -->
  <path d="M 122 120 L 90 134" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 158 120 L 192 136" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 76 162 L 72 178" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 104 162 L 108 178" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <!-- annotations A -->
  <text x="140" y="222" text-anchor="middle" font-size="9" fill="#8a6a1a">24=6×4, 12=6×2</text>

  <!-- Tree B: (6,(2,4)) sum=32 -->
  <text x="420" y="84" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">树 B（最优）：sum = 32 ✓</text>
  <!-- root B -->
  <g filter="url(#sk2)"><ellipse cx="420" cy="108" rx="32" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="420" y="113" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">24</text>
  <!-- left leaf B -->
  <g filter="url(#sk2)"><rect x="344" y="136" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="358" y="154" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">6</text>
  <!-- right child B (internal) -->
  <g filter="url(#sk2)"><ellipse cx="470" cy="148" rx="28" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="470" y="152" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">8</text>
  <!-- leaves under right child -->
  <g filter="url(#sk2)"><rect x="436" y="178" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">2</text>
  <g filter="url(#sk2)"><rect x="472" y="178" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="486" y="196" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">4</text>
  <!-- edges B -->
  <path d="M 402 120 L 372 136" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 438 120 L 470 134" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 456 162 L 450 178" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 484 162 L 486 178" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <!-- annotations B -->
  <text x="420" y="222" text-anchor="middle" font-size="9" fill="#b03a3a">24=6×4, 8=2×4</text>

  <!-- divider -->
  <path d="M 40 236 L 680 236" stroke="#ddd" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- ===== Section 2: DP table ===== -->
  <text x="60" y="256" font-size="12" font-weight="bold" fill="#5a3a7a">② 区间 DP 填表（dp[i][j] / maxLeaf[i][j]）</text>

  <!-- maxLeaf table -->
  <text x="60" y="278" font-size="11" font-weight="bold" fill="#2b6e9e">maxLeaf 表（区间最大叶值）：</text>
  <g font-size="11">
    <g filter="url(#sk2)"><rect x="50" y="284" width="56" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="78" y="300" text-anchor="middle" fill="#2b6e9e">[0,0]</text>
    <g filter="url(#sk2)"><rect x="108" y="284" width="56" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="136" y="300" text-anchor="middle" fill="#2b6e9e">[0,1]</text>
    <g filter="url(#sk2)"><rect x="166" y="284" width="56" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="194" y="300" text-anchor="middle" fill="#2b6e9e">[0,2]</text>
    <g filter="url(#sk2)"><rect x="224" y="284" width="56" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/></g>
    <text x="252" y="300" text-anchor="middle" fill="#8a6a1a">[1,1]</text>
    <g filter="url(#sk2)"><rect x="282" y="284" width="56" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/></g>
    <text x="310" y="300" text-anchor="middle" fill="#8a6a1a">[1,2]</text>
    <g filter="url(#sk2)"><rect x="340" y="284" width="56" height="24" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1"/></g>
    <text x="368" y="300" text-anchor="middle" fill="#2e6e2e">[2,2]</text>
  </g>
  <g font-size="12">
    <text x="78" y="324" text-anchor="middle" fill="#2b6e9e" font-weight="bold">6</text>
    <text x="136" y="324" text-anchor="middle" fill="#2b6e9e" font-weight="bold">6</text>
    <text x="194" y="324" text-anchor="middle" fill="#2b6e9e" font-weight="bold">6</text>
    <text x="252" y="324" text-anchor="middle" fill="#8a6a1a" font-weight="bold">2</text>
    <text x="310" y="324" text-anchor="middle" fill="#8a6a1a" font-weight="bold">4</text>
    <text x="368" y="324" text-anchor="middle" fill="#2e6e2e" font-weight="bold">4</text>
  </g>

  <!-- dp table -->
  <text x="60" y="346" font-size="11" font-weight="bold" fill="#2b6e9e">dp 表（非叶节点最小和）：</text>
  <g font-size="11">
    <g filter="url(#sk2)"><rect x="50" y="352" width="56" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="78" y="368" text-anchor="middle" fill="#2b6e9e">[0,0]</text>
    <g filter="url(#sk2)"><rect x="108" y="352" width="56" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="136" y="368" text-anchor="middle" fill="#2b6e9e">[0,1]</text>
    <g filter="url(#sk2)"><rect x="166" y="352" width="56" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="194" y="368" text-anchor="middle" fill="#b03a3a">[0,2]</text>
    <g filter="url(#sk2)"><rect x="224" y="352" width="56" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/></g>
    <text x="252" y="368" text-anchor="middle" fill="#8a6a1a">[1,1]</text>
    <g filter="url(#sk2)"><rect x="282" y="352" width="56" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/></g>
    <text x="310" y="368" text-anchor="middle" fill="#8a6a1a">[1,2]</text>
    <g filter="url(#sk2)"><rect x="340" y="352" width="56" height="24" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1"/></g>
    <text x="368" y="368" text-anchor="middle" fill="#2e6e2e">[2,2]</text>
  </g>
  <g font-size="12">
    <text x="78" y="392" text-anchor="middle" fill="#888">0</text>
    <text x="136" y="392" text-anchor="middle" fill="#2b6e9e" font-weight="bold">12</text>
    <text x="194" y="392" text-anchor="middle" fill="#b03a3a" font-weight="bold">32</text>
    <text x="252" y="392" text-anchor="middle" fill="#888">0</text>
    <text x="310" y="392" text-anchor="middle" fill="#8a6a1a" font-weight="bold">8</text>
    <text x="368" y="392" text-anchor="middle" fill="#888">0</text>
  </g>

  <!-- key computation for dp[0][2] -->
  <g filter="url(#sk)"><rect x="440" y="290" width="240" height="120" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1" stroke-dasharray="5 3"/></g>
  <text x="560" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">dp[0][2] 的计算：</text>
  <text x="452" y="330" font-size="10" fill="#446688">k=0: dp[0][0]+dp[1][2]</text>
  <text x="676" y="330" font-size="10" fill="#446688" text-anchor="end">+6×4</text>
  <text x="676" y="344" font-size="10" fill="#446688" text-anchor="end" font-weight="bold">= 0+8+24 = 32 ✓</text>
  <text x="452" y="364" font-size="10" fill="#d6a040">k=1: dp[0][1]+dp[2][2]</text>
  <text x="676" y="364" font-size="10" fill="#d6a040" text-anchor="end">+6×4</text>
  <text x="676" y="378" font-size="10" fill="#d6a040" text-anchor="end" font-weight="bold">= 12+0+24 = 36</text>
  <text x="560" y="400" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">min(32, 36) = 32</text>

  <!-- bottom note -->
  <text x="360" y="442" text-anchor="middle" font-size="10" fill="#666">关键：树 B 把小值 2 和 4 组合（内部节点 8），让大值 6 只在根处贡献一次 6×4=24</text>
</svg>
