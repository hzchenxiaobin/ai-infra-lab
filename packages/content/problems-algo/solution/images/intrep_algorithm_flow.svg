<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心 + 位运算，O(log n) 一遍循环</text>

  <!-- Start -->
  <ellipse cx="270" cy="56" rx="56" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="61" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">count = 0</text>

  <line x1="270" y1="76" x2="270" y2="92" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n > 1 ? -->
  <polygon points="270,96 360,146 270,196 180,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">n &gt; 1 ?</text>
  <text x="270" y="159" text-anchor="middle" font-size="10.5" fill="#888">继续替换</text>

  <!-- No: left to return -->
  <text x="166" y="140" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <path d="M 180 146 Q 100 146 100 230" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="232" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="254" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return count</text>
  <line x1="100" y1="266" x2="100" y2="292" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="100" cy="312" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="317" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- Yes: down to n even ? -->
  <text x="282" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="270" y1="196" x2="270" y2="216" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n 偶数 ? -->
  <polygon points="270,220 360,260 270,300 180,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">n 偶数 ?</text>
  <text x="270" y="272" text-anchor="middle" font-size="10.5" fill="#888">看最低位</text>

  <!-- even: right to n /= 2 -->
  <text x="372" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 360 260 Q 430 260 430 296" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="300" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="432" y="320" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n = n / 2</text>

  <!-- odd: down to odd-branch box -->
  <text x="282" y="316" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <line x1="270" y1="300" x2="270" y2="320" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Odd branch box (ternary in one action box) -->
  <rect x="80" y="324" width="380" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">奇数分支（按下述三选一更新 n）：</text>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#333">n == 3 → n − 1</text>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#333">n % 4 == 1 → n − 1    else (n % 4 == 3) → n + 1</text>

  <!-- merge: count++ -->
  <path d="M 432 330 Q 432 360 432 396" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 384 Q 270 396 270 404" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="408" width="240" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="425" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">count++; 回到「n &gt; 1 ?」</text>

  <!-- loop back arrow: from count++ box right side up to n>1 diamond right vertex -->
  <path d="M 410 420 Q 510 420 510 146 Q 510 146 360 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
