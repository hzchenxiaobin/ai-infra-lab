<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算（节选关键步骤）</text>

  <!-- Column headers -->
  <text x="30" y="52" font-size="11" fill="#888" font-weight="bold">步骤</text>
  <text x="80" y="52" font-size="11" fill="#888" font-weight="bold">操作</text>
  <text x="200" y="52" font-size="11" fill="#888" font-weight="bold">history 数组（cur↑ 当前 / last 红框）</text>
  <text x="540" y="52" font-size="11" fill="#888" font-weight="bold">返回</text>
  <line x1="20" y1="58" x2="560" y2="58" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: visit youtube -->
  <rect x="20" y="64" width="540" height="34" fill="#e8f0fe" opacity="0.3" rx="4" filter="url(#rough2)"/>
  <text x="30" y="86" font-size="11" fill="#555" font-weight="bold">①</text>
  <text x="80" y="86" font-size="11" fill="#446688" font-weight="bold">visit(youtube)</text>
  <rect x="210" y="70" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="86" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">leetcode</text>
  <rect x="286" y="70" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="314" y="86" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">google</text>
  <rect x="344" y="70" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="376" y="86" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">facebook</text>
  <rect x="410" y="70" width="56" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="438" y="86" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">youtube</text>
  <text x="472" y="86" font-size="9.5" fill="#d6a040" font-weight="bold">↑cur</text>
  <text x="540" y="86" font-size="10.5" fill="#888">—</text>

  <!-- Row 2: back(1) -> facebook -->
  <text x="30" y="118" font-size="11" fill="#555" font-weight="bold">②</text>
  <text x="80" y="118" font-size="11" fill="#b85450" font-weight="bold">back(1)</text>
  <rect x="210" y="102" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="118" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">leetcode</text>
  <rect x="286" y="102" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="314" y="118" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">google</text>
  <rect x="344" y="102" width="64" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="118" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">facebook</text>
  <text x="414" y="118" font-size="9.5" fill="#d6a040" font-weight="bold">↑cur</text>
  <rect x="410" y="102" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="438" y="118" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">youtube</text>
  <text x="540" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">facebook</text>

  <!-- Row 3: back(1) -> google -->
  <text x="30" y="150" font-size="11" fill="#555" font-weight="bold">③</text>
  <text x="80" y="150" font-size="11" fill="#b85450" font-weight="bold">back(1)</text>
  <rect x="210" y="134" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="150" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">leetcode</text>
  <rect x="286" y="134" width="56" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="150" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">google</text>
  <text x="350" y="150" font-size="9.5" fill="#d6a040" font-weight="bold">↑cur</text>
  <rect x="344" y="134" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="376" y="150" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">facebook</text>
  <rect x="410" y="134" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="438" y="150" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">youtube</text>
  <text x="540" y="150" font-size="10" fill="#4a7a3a" font-weight="bold">google</text>

  <!-- Row 4: forward(1) -> facebook -->
  <rect x="20" y="160" width="540" height="34" fill="#e8f0fe" opacity="0.3" rx="4" filter="url(#rough2)"/>
  <text x="30" y="182" font-size="11" fill="#555" font-weight="bold">④</text>
  <text x="80" y="182" font-size="11" fill="#4a7a3a" font-weight="bold">forward(1)</text>
  <rect x="210" y="166" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="182" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">leetcode</text>
  <rect x="286" y="166" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="314" y="182" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">google</text>
  <rect x="344" y="166" width="64" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="182" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">facebook</text>
  <text x="414" y="182" font-size="9.5" fill="#d6a040" font-weight="bold">↑cur</text>
  <rect x="410" y="166" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="438" y="182" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">youtube</text>
  <text x="540" y="182" font-size="10" fill="#4a7a3a" font-weight="bold">facebook</text>

  <!-- Row 5: visit(linkedin) - key! clears forward -->
  <rect x="20" y="198" width="540" height="44" fill="#fce4ec" opacity="0.3" rx="4" filter="url(#rough2)"/>
  <text x="30" y="220" font-size="11" fill="#555" font-weight="bold">⑤</text>
  <text x="80" y="220" font-size="11" fill="#446688" font-weight="bold">visit(linkedin)</text>
  <text x="80" y="234" font-size="9.5" fill="#b85450" font-weight="bold">清空前进!</text>
  <rect x="210" y="206" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="222" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">leetcode</text>
  <rect x="286" y="206" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="314" y="222" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">google</text>
  <rect x="344" y="206" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="376" y="222" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">facebook</text>
  <rect x="410" y="206" width="56" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="438" y="222" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">linkedin</text>
  <text x="472" y="222" font-size="9.5" fill="#d6a040" font-weight="bold">↑cur=last</text>
  <text x="210" y="238" font-size="9" fill="#b85450">youtube 被 linkedin 覆盖，last=3 截断</text>
  <text x="540" y="222" font-size="10.5" fill="#888">—</text>

  <!-- Row 6: back(2) -> google -->
  <text x="30" y="266" font-size="11" fill="#555" font-weight="bold">⑥</text>
  <text x="80" y="266" font-size="11" fill="#b85450" font-weight="bold">back(2)</text>
  <rect x="210" y="250" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="266" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">leetcode</text>
  <rect x="286" y="250" width="56" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="266" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">google</text>
  <text x="350" y="266" font-size="9.5" fill="#d6a040" font-weight="bold">↑cur</text>
  <rect x="344" y="250" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="376" y="266" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">facebook</text>
  <rect x="410" y="250" width="56" height="24" fill="#e8f0fe" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="438" y="266" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">linkedin</text>
  <text x="540" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">google</text>

  <!-- Row 7: back(7) -> leetcode (clamped) -->
  <rect x="20" y="288" width="540" height="34" fill="#fce4ec" opacity="0.3" rx="4" filter="url(#rough2)"/>
  <text x="30" y="310" font-size="11" fill="#555" font-weight="bold">⑦</text>
  <text x="80" y="310" font-size="11" fill="#b85450" font-weight="bold">back(7)</text>
  <text x="100" y="310" font-size="9.5" fill="#888">cur=1→想退7步</text>
  <rect x="210" y="294" width="74" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="247" y="310" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">leetcode</text>
  <text x="290" y="310" font-size="9.5" fill="#d6a040" font-weight="bold">↑cur=0</text>
  <rect x="286" y="294" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="314" y="310" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">google</text>
  <rect x="344" y="294" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="376" y="310" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">facebook</text>
  <rect x="410" y="294" width="56" height="24" fill="#e8f0fe" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="438" y="310" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">linkedin</text>
  <text x="540" y="310" font-size="10" fill="#4a7a3a" font-weight="bold">leetcode</text>

  <!-- clamp note -->
  <path d="M 540 314 L 540 326" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="20" y="340" width="540" height="48" fill="#f8f8f8" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="360" font-size="10.5" fill="#555" font-weight="bold">图例：</text>
  <rect x="84" y="350" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="104" y="361" font-size="10" fill="#555">有效页</text>
  <rect x="160" y="350" width="14" height="14" fill="#fff8e1" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="180" y="361" font-size="10" fill="#555">cur 当前页（红框标记）</text>
  <rect x="84" y="370" width="14" height="14" fill="#e8f0fe" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="104" y="381" font-size="10" fill="#555">last 边界页</text>
  <text x="240" y="381" font-size="10" fill="#b85450">↑cur=last 表示 visit 截断后两者重合</text>

  <!-- key takeaway -->
  <rect x="20" y="396" width="540" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="416" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">关键瞬间：第⑤步 visit(linkedin)</text>
  <text x="290" y="434" text-anchor="middle" font-size="11" fill="#4a7a3a">cur 右移写入新页 + last=cur，youtube 被原地覆盖而非"删除"</text>
</svg>
