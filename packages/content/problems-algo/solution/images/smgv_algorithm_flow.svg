<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 492" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="492" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：沿 node1→根 路径逐节点合并 + 推进 mex</text>

  <!-- A -->
  <rect x="140" y="44" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="11" fill="#333">① 建树 children[]；扫描找 node1（nums[i]==1）</text>
  <line x1="290" y1="86" x2="290" y2="106" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 -->
  <polygon points="290,108 352,130 290,152 228,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="11" fill="#333">node1 == -1?</text>
  <line x1="352" y1="130" x2="424" y2="130" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="123" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="424" y="112" width="132" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="136" text-anchor="middle" font-size="10" fill="#333">ans 全为 1，返回</text>

  <line x1="290" y1="152" x2="290" y2="176" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="168" font-size="10" fill="#4a7a3a">是</text>

  <!-- B -->
  <rect x="140" y="178" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="204" text-anchor="middle" font-size="11" fill="#333">② seen=∅，mex=1；u=node1，prev=-1</text>
  <line x1="290" y1="220" x2="290" y2="240" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2 -->
  <polygon points="290,242 352,264 290,286 228,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="11" fill="#333">u != -1?</text>
  <line x1="352" y1="264" x2="424" y2="264" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="257" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="424" y="246" width="132" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="270" text-anchor="middle" font-size="10" fill="#333">返回 ans</text>

  <line x1="290" y1="286" x2="290" y2="308" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="300" font-size="10" fill="#4a7a3a">是</text>

  <!-- C -->
  <rect x="110" y="310" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#333">③ 标记 nums[u] 入 seen</text>
  <text x="290" y="348" text-anchor="middle" font-size="10" fill="#555">对 u 的孩子 c≠prev：DFS 把侧子树全部值入 seen</text>
  <line x1="290" y1="358" x2="290" y2="376" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D -->
  <rect x="110" y="378" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="396" text-anchor="middle" font-size="11" fill="#333">④ while seen[mex]：mex++</text>
  <text x="290" y="414" text-anchor="middle" font-size="11" fill="#333">ans[u] = mex</text>
  <line x1="290" y1="422" x2="290" y2="438" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E -->
  <rect x="170" y="440" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="464" text-anchor="middle" font-size="11" fill="#333">⑤ prev=u；u=parents[u]</text>

  <!-- loop arrow E -> D2 -->
  <path d="M 170 459 L 96 459 L 96 264 L 226 264" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="106" y="452" font-size="10" fill="#888" font-weight="bold">循环↑</text>
</svg>
