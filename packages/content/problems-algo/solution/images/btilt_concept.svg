<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">节点坡度 = |左子树和 − 右子树和|</text>

  <!-- Edges -->
  <line x1="280" y1="78" x2="180" y2="148" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="280" y1="78" x2="400" y2="148" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="180" y1="148" x2="120" y2="228" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="180" y1="148" x2="240" y2="228" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="400" y1="148" x2="460" y2="228" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- Root node 4 -->
  <circle cx="280" cy="78" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- Node 2 -->
  <circle cx="180" cy="148" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- Node 9 -->
  <circle cx="400" cy="148" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- Node 3 (leaf) -->
  <circle cx="120" cy="228" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Node 5 (leaf) -->
  <circle cx="240" cy="228" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- Node 7 (leaf) -->
  <circle cx="460" cy="228" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <!-- Subtree sum bubbles (post-order returns) -->
  <!-- leftSum = 3+5+2 = 10 -->
  <rect x="120" y="262" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="205" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左子树和 = 3+5+2 = 10</text>
  <path d="M 205 262 L 205 248" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- rightSum = 7+9 = 16 -->
  <rect x="350" y="262" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="435" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右子树和 = 7+9 = 16</text>
  <path d="M 435 262 L 435 248" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- Tilt annotation at root -->
  <rect x="60" y="308" width="220" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">tilt(4) = |10 − 16| = 6</text>
  <path d="M 170 308 L 230 294" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Return value box at root -->
  <rect x="300" y="308" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(4) 返回 4+10+16 = 30</text>
  <path d="M 410 308 L 330 100" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Bottom formula -->
  <rect x="40" y="350" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11" fill="#333">dfs 返回子树和（向上传递），副作用累加每个节点的 tilt</text>
</svg>
