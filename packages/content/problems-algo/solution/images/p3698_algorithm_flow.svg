<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：反向建 dec[]，正向一遍扫（inc 滚动 + 前缀和），O(n)</text>

  <!-- 1. reverse scan build dec -->
  <rect x="100" y="44" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 反向扫描 i = n−2 … 0</text>
  <text x="270" y="81" text-anchor="middle" font-size="11" fill="#555">dec[i] = dec[i+1] 且 nums[i] &gt; nums[i+1]</text>

  <path d="M 270 88 L 270 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. init -->
  <rect x="100" y="106" width="340" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="129" text-anchor="middle" font-size="11.5" fill="#333">② total = Σnums，pre = 0，inc = true，ans = −1</text>

  <path d="M 270 142 L 270 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. forward loop -->
  <rect x="100" y="160" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 循环 i = 0 … n−2：pre += nums[i]</text>
  <text x="270" y="197" text-anchor="middle" font-size="11" fill="#555">inc = inc 且 nums[i] &gt; nums[i−1]（滚动变量）</text>

  <path d="M 270 204 L 270 220" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. diamond: valid split? -->
  <polygon points="270,222 380,256 270,290 160,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="11.5" fill="#333">inc[i] 且 dec[i+1] ?</text>
  <text x="270" y="268" text-anchor="middle" font-size="10.5" fill="#888">(分割点合法?)</text>

  <!-- 是 ↓ -->
  <path d="M 270 290 L 270 306" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="302" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 5. update answer -->
  <rect x="100" y="308" width="340" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="331" text-anchor="middle" font-size="11.5" fill="#333">④ d = |2·pre − total|，ans = min(ans, d)</text>

  <!-- 否 → loop back right -->
  <path d="M 380 256 L 480 256 L 480 182 L 448 182" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="392" y="250" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- loop back left from ④ -->
  <path d="M 96 326 L 48 326 L 48 182 L 96 182" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="30" y="250" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下</text>
  <text x="30" y="264" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一</text>
  <text x="30" y="278" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i</text>

  <!-- exit down -->
  <path d="M 270 344 L 270 396" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="374" font-size="10.5" fill="#4a7a3a" font-weight="bold">i 扫完</text>

  <!-- 6. final -->
  <rect x="100" y="398" width="340" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="417" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 结束</text>
  <text x="270" y="435" text-anchor="middle" font-size="11" fill="#555">ans == −1 ? 返回 −1 : 返回 ans</text>
</svg>
