<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">拆分 BST 递归流程：split(root, target) → [S, T]</text>

  <!-- 入口：root == null? -->
  <path d="M 300 50 L 220 50 L 220 78 L 300 78 L 380 78 L 380 50 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="11" fill="#446688">root == null ?</text>

  <!-- 是 → 返回 [null,null] -->
  <path d="M 220 64 L 130 64" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="58" text-anchor="middle" font-size="9" fill="#888">是</text>
  <rect x="40" y="50" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="85" y="69" text-anchor="middle" font-size="10" fill="#b85450">return [∅, ∅]</text>

  <!-- 否 → 决策菱形: val <= target? -->
  <path d="M 380 64 L 460 64" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="58" text-anchor="middle" font-size="9" fill="#888">否</text>
  <path d="M 540 80 L 460 100 L 540 120 L 620 100 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="104" text-anchor="middle" font-size="11" fill="#333">val ≤ target?</text>

  <!-- 左分支: val <= target (绿) -->
  <path d="M 470 110 L 130 160" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是（归入小树 S）</text>

  <rect x="40" y="155" width="180" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="130" y="173" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">root 属于小树</text>
  <text x="50" y="192" font-size="9.5" fill="#333">① 递归拆右子树：</text>
  <text x="60" y="207" font-size="9.5" fill="#4a7a3a">[sR, tR] = split(right)</text>
  <text x="50" y="224" font-size="9.5" fill="#333">② 重接：root.right = sR</text>
  <text x="50" y="240" font-size="9.5" fill="#333">③ 返回</text>
  <text x="60" y="255" font-size="9.5" fill="#4a7a3a" font-weight="bold">return [root, tR]</text>

  <!-- 右分支: val > target (橙) -->
  <path d="M 610 110 L 470 160" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="555" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">否（归入大树 T）</text>

  <rect x="380" y="155" width="180" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="470" y="173" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">root 属于大树</text>
  <text x="390" y="192" font-size="9.5" fill="#333">① 递归拆左子树：</text>
  <text x="400" y="207" font-size="9.5" fill="#d6a040">[sL, tL] = split(left)</text>
  <text x="390" y="224" font-size="9.5" fill="#333">② 重接：root.left = tL</text>
  <text x="390" y="240" font-size="9.5" fill="#333">③ 返回</text>
  <text x="400" y="255" font-size="9.5" fill="#d6a040" font-weight="bold">return [sL, root]</text>

  <!-- 关键说明框 -->
  <rect x="40" y="285" width="520" height="160" fill="#fff" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="12" fill="#333" font-weight="bold">💡 为什么这样重接是正确的？</text>

  <text x="60" y="332" font-size="10.5" fill="#4a7a3a">• val ≤ target 时：root 及其左子树必然都 ≤ target（BST 性质：左子树 &lt; root ≤ target）</text>
  <text x="60" y="350" font-size="10.5" fill="#4a7a3a">　 唯一不确定的是右子树——它可能混有 ≤ / &gt; target 的节点，所以只需递归拆右子树。</text>
  <text x="60" y="368" font-size="10.5" fill="#4a7a3a">　 拆完得到 sR（≤ target 部分）挂在 root.right；tR（&gt; target 部分）单独返回。</text>

  <text x="60" y="392" font-size="10.5" fill="#d6a040">• val &gt; target 时：root 及其右子树必然都 &gt; target（BST 性质：右子树 &gt; root &gt; target）</text>
  <text x="60" y="410" font-size="10.5" fill="#d6a040">　 唯一不确定的是左子树——它可能混有 ≤ / &gt; target 的节点，所以只需递归拆左子树。</text>
  <text x="60" y="428" font-size="10.5" fill="#d6a040">　 拆完得到 tL（&gt; target 部分）挂在 root.left；sL（≤ target 部分）单独返回。</text>
</svg>
