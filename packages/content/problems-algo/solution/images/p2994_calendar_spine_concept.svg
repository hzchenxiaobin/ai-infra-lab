  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Purchases 只在 11-03 和 11-24 有周五交易：GROUP BY 只能聚出 2 行</text>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">日历骨架当 LEFT JOIN 左表：11-10、11-17 无匹配也保留 → 补成 0</text>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">聚合不会「发明」行 —— 缺的行必须来自日历骨架</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（这正是 2994 定为困难、而 2993 只要 GROUP BY 的原因）</text>
