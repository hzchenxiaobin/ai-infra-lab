<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：先建表 O(n)，再查表填 P O(n)</text>

  <!-- Step 1: build map -->
  <rect x="40" y="56" width="200" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 1：建倒排索引</text>
  <text x="50" y="100" font-size="11" fill="#333">遍历 B[j]，j = 0..n-1</text>
  <text x="50" y="116" font-size="11" fill="#333">map[B[j]].push_back(j)</text>
  <text x="50" y="130" font-size="11" fill="#888">→ 值 → [下标列表]</text>

  <!-- arrow -->
  <path d="M 140 132 L 140 168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: iterate A -->
  <rect x="40" y="172" width="200" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="196" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">步骤 2：遍历 A</text>
  <text x="50" y="216" font-size="11" fill="#333">for i in 0..n-1:</text>
  <text x="50" y="232" font-size="11" fill="#333">  v = A[i]</text>

  <!-- arrow -->
  <path d="M 140 248 L 140 284" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: query decision diamond -->
  <polygon points="140,288 230,330 140,372 50,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">map[v] 列表</text>
  <text x="140" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">非空？</text>
  <text x="140" y="356" text-anchor="middle" font-size="10" fill="#888">(恒真：B 是 A 的排列)</text>

  <!-- arrow right: yes -->
  <path d="M 230 330 L 290 330" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 4: pop and append -->
  <rect x="294" y="300" width="220" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="404" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">步骤 3：取下标并填 P</text>
  <text x="304" y="340" font-size="11" fill="#333">j = map[v].pop_back()</text>
  <text x="304" y="356" font-size="11" fill="#333">P[i] = j</text>

  <!-- loop back arrow to step 2 -->
  <path d="M 404 300 Q 404 210 240 210" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="200" font-size="10" fill="#888">下一个 i</text>

  <!-- End -->
  <rect x="294" y="378" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="404" y="400" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 P</text>
  <path d="M 404 362 L 404 376" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="374" font-size="10" fill="#888">遍历完</text>

  <!-- right side notes -->
  <rect x="540" y="56" width="70" height="180" fill="none" stroke="none"/>
  <text x="546" y="80" font-size="11" fill="#888" font-weight="bold">关键不变式：</text>
  <text x="546" y="100" font-size="11" fill="#555">每个 j 恰被</text>
  <text x="546" y="116" font-size="11" fill="#555">取走一次</text>
  <text x="546" y="136" font-size="11" fill="#555">(计数相等)</text>
  <text x="546" y="166" font-size="11" fill="#888" font-weight="bold">复杂度：</text>
  <text x="546" y="186" font-size="11" fill="#555">建表 O(n)</text>
  <text x="546" y="202" font-size="11" fill="#555">查表 O(n)</text>
  <text x="546" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">总 O(n)</text>
</svg>
