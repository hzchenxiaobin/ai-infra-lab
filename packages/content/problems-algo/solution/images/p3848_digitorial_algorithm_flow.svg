<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次求和 + 一次多重集比对，无需枚举排列</text>

  <!-- start -->
  <ellipse cx="260" cy="52" rx="56" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">输入 n</text>
  <path d="M 260 70 L 260 84" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- precompute -->
  <rect x="180" y="88" width="160" height="32" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 预计算 fact[0..9]</text>
  <path d="M 260 120 L 260 142" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- sum -->
  <rect x="160" y="146" width="200" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② F ← Σ fact[d]（d 遍历 str(n) 各位）</text>
  <text x="260" y="177" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">0! = 1，别按 0 算</text>
  <path d="M 260 184 L 260 206" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,208 356,244 260,280 164,244" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">③ sorted(str(F))</text>
  <text x="260" y="254" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">== sorted(str(n)) ？</text>

  <!-- yes branch -->
  <path d="M 164 244 L 138 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="9.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="34" y="227" width="104" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="86" y="248" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- no branch -->
  <path d="M 356 244 L 382 244" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="368" y="236" text-anchor="middle" font-size="9.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="382" y="227" width="104" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="248" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- notes -->
  <rect x="48" y="296" width="424" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">k = 位数 ≤ 10：求和 O(k) + 排序 O(k log k)，避开 10! ≈ 363 万个排列的枚举</text>
  <text x="260" y="333" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">n ≤ 10^9 ⇒ F ≤ 10 × 9! = 3 628 800，连 int 都装得下（用 long long 更稳）</text>
</svg>
