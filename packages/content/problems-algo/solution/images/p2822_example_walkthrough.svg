<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三组示例演算</text>

  <!-- ===== Example 1: Success ===== -->
  <rect x="30" y="50" width="500" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="72" font-size="12" fill="#4a7a3a" filter="url(#rough2)">示例 1 ✅ 成功反转</text>

  <!-- Input -->
  <text x="50" y="95" font-size="11" fill="#333" filter="url(#rough2)">输入：{"a":"1", "b":"2", "c":"3", "d":"4"}</text>

  <!-- Step by step -->
  <text x="50" y="118" font-size="10" fill="#666" filter="url(#rough2)">a→1: seen={1}, result={"1":"a"}</text>
  <text x="50" y="133" font-size="10" fill="#666" filter="url(#rough2)">b→2: seen={1,2}, result={"1":"a","2":"b"}</text>
  <text x="50" y="148" font-size="10" fill="#666" filter="url(#rough2)">c→3: seen={1,2,3}, result={"1":"a","2":"b","3":"c"}</text>
  <text x="300" y="118" font-size="10" fill="#666" filter="url(#rough2)">d→4: seen={1,2,3,4}</text>
  <text x="300" y="133" font-size="10" fill="#666" filter="url(#rough2)">result={"1":"a","2":"b",</text>
  <text x="300" y="148" font-size="10" fill="#666" filter="url(#rough2)">       "3":"c","4":"d"}</text>

  <!-- Result -->
  <rect x="420" y="100" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="118" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">输出</text>
  <text x="465" y="133" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">反转成功</text>

  <!-- ===== Example 2: Duplicate ===== -->
  <rect x="30" y="175" width="500" height="115" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="197" font-size="12" fill="#d6a040" filter="url(#rough2)">示例 2 ❌ 值重复</text>

  <!-- Input -->
  <text x="50" y="220" font-size="11" fill="#333" filter="url(#rough2)">输入：{"a":"1", "b":"2", "c":"2", "d":"4"}</text>

  <!-- Step by step -->
  <text x="50" y="242" font-size="10" fill="#666" filter="url(#rough2)">a→1: seen={1}, result={"1":"a"}</text>
  <text x="50" y="257" font-size="10" fill="#666" filter="url(#rough2)">b→2: seen={1,2}, result={"1":"a","2":"b"}</text>
  <rect x="195" y="248" width="110" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="273" font-size="10" fill="#b85450" filter="url(#rough2)">c→2: seen.has("2")=true → return null ✗</text>

  <!-- Result -->
  <rect x="420" y="225" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="243" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">输出</text>
  <text x="465" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">null</text>

  <!-- ===== Example 3: Array ===== -->
  <rect x="30" y="305" width="500" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="327" font-size="12" fill="#b85450" filter="url(#rough2)">示例 3 ❌ 输入是数组</text>

  <!-- Input -->
  <text x="50" y="350" font-size="11" fill="#333" filter="url(#rough2)">输入：["1", "2", "3", "4"]</text>

  <!-- Step -->
  <text x="50" y="375" font-size="10" fill="#666" filter="url(#rough2)">第一步：Array.isArray(["1","2","3","4"])</text>
  <rect x="290" y="365" width="40" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="395" font-size="10" fill="#b85450" filter="url(#rough2)">→ true，直接 return null ✗（不进入遍历）</text>

  <!-- Result -->
  <rect x="420" y="355" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="373" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">输出</text>
  <text x="465" y="388" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">null</text>
</svg>
