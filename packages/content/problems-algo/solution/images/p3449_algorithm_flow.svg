<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="372" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：二分答案 + check(x) 从左到右弹跳贪心</text>

  <!-- ① 二分答案 -->
  <g filter="url(#rough2)">
    <rect x="140" y="36" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">① 二分答案 x</text>
    <text x="260" y="69" text-anchor="middle" font-size="8.5" fill="#55677d">lo = 0，hi = m·max(points) + 1</text>
  </g>
  <path d="M 260 76 L 260 86" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② check 首步 -->
  <g filter="url(#rough2)">
    <rect x="140" y="86" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">② check(x)：首步落 0</text>
    <text x="260" y="119" text-anchor="middle" font-size="8.5" fill="#55677d">moves = 1，cur = p[0]，fed = 0，i = 0</text>
  </g>
  <path d="M 260 126 L 260 136" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 弹跳补缺 -->
  <g filter="url(#rough2)">
    <rect x="125" y="136" width="270" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="153" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">③ 若 cur &lt; x：在 i ↔ i+1 弹跳补缺口</text>
    <text x="260" y="168" text-anchor="middle" font-size="9" fill="#55677d">b = ⌈(x−cur)/p[i]⌉ 次：moves += 2b</text>
    <text x="260" y="180" text-anchor="middle" font-size="9" fill="#55677d">cur += b·p[i]，fed = b·p[i+1]</text>
  </g>
  <path d="M 260 184 L 260 194" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <g filter="url(#rough2)">
    <path d="M 260 250 L 165 222 L 260 194 L 355 222 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">i == n−2 ?</text>
  </g>

  <!-- 是 → 末格特判 -->
  <path d="M 355 222 L 376 222" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="214" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="384" y="192" width="128" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="448" y="209" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">④ 末格 n−1 特判</text>
    <text x="448" y="224" text-anchor="middle" font-size="8.5" fill="#2f5d24">fed ≥ x：免右移收工 ✔</text>
    <text x="448" y="238" text-anchor="middle" font-size="8.5" fill="#2f5d24">否则右移 1 步，再</text>
    <text x="448" y="251" text-anchor="middle" font-size="8.5" fill="#2f5d24">r = ⌈(x−fed−p末)/p末⌉ 次往返</text>
  </g>

  <!-- 否 → 右移下一格 -->
  <path d="M 260 250 L 260 262" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="268" y="260" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="145" y="264" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="278" text-anchor="middle" font-size="9" fill="#33506b">右移 1 步：moves += 1</text>
    <text x="260" y="291" text-anchor="middle" font-size="9" fill="#55677d">cur = fed + p[i+1]，fed = 0，i++</text>
  </g>

  <!-- 回环 -->
  <path d="M 145 281 L 34 281 L 34 160 L 118 160" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="92" y="273" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">下一格（回 ③）</text>

  <!-- check 返回 -->
  <path d="M 448 256 L 448 268" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="384" y="270" width="128" height="40" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="448" y="286" text-anchor="middle" font-size="9" font-weight="bold" fill="#33506b">check 返回 moves ≤ m</text>
    <text x="448" y="299" text-anchor="middle" font-size="8" fill="#55677d">中途超限随时剪枝 ✂</text>
  </g>
  <path d="M 448 310 L 448 342 L 378 342" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 输出 -->
  <g filter="url(#rough2)">
    <rect x="150" y="328" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">⑤ 二分收敛，lo 即答案</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="24" y="328" width="116" height="28" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="82" y="346" text-anchor="middle" font-size="8" fill="#55677d">可行→lo=mid 否→hi=mid−1</text>
  </g>
</svg>
