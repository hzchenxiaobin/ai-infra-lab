<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 494" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="494" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：把「下一行动的奇偶」并入状态 —— 每个格子一分为二的分层图</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以示例 2（m=n=2，penalty=[[0,7],[3,2]]）的最优行动序列为例；每次行动都在两层之间互换</text>

  <!-- layer tags -->
  <text x="30" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">奇数层</text>
  <text x="30" y="113" text-anchor="middle" font-size="8.5" fill="#8899aa" filter="url(#rough2)">→↓免费</text>
  <text x="30" y="274" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">偶数层</text>
  <text x="30" y="289" text-anchor="middle" font-size="8.5" fill="#8899aa" filter="url(#rough2)">←↑免费</text>

  <!-- top grid (next action odd) -->
  <rect x="64" y="84" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <rect x="152" y="84" width="84" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="64" y="132" width="84" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="152" y="132" width="84" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="106" y="100" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(0,0)</text>
  <text x="106" y="112" text-anchor="middle" font-size="8" fill="#556" filter="url(#rough2)">入口 1</text>
  <text x="106" y="123" text-anchor="middle" font-size="8" fill="#889" filter="url(#rough2)">pen 0</text>
  <text x="194" y="100" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(0,1)</text>
  <text x="194" y="112" text-anchor="middle" font-size="8" fill="#556" filter="url(#rough2)">入口 2</text>
  <text x="194" y="123" text-anchor="middle" font-size="8" fill="#889" filter="url(#rough2)">pen 7</text>
  <text x="106" y="147" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(1,0)</text>
  <text x="106" y="159" text-anchor="middle" font-size="8" fill="#556" filter="url(#rough2)">入口 2</text>
  <text x="106" y="171" text-anchor="middle" font-size="8" fill="#889" filter="url(#rough2)">pen 3</text>
  <text x="194" y="147" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(1,1)</text>
  <text x="194" y="159" text-anchor="middle" font-size="8" fill="#556" filter="url(#rough2)">入口 4</text>
  <text x="194" y="171" text-anchor="middle" font-size="8" fill="#889" filter="url(#rough2)">pen 2</text>
  <text x="106" y="78" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点</text>

  <!-- bottom grid (next action even) -->
  <rect x="64" y="262" width="84" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="152" y="262" width="84" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="64" y="310" width="84" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="152" y="310" width="84" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="106" y="277" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(0,0)</text>
  <text x="106" y="289" text-anchor="middle" font-size="8" fill="#556" filter="url(#rough2)">入口 1</text>
  <text x="106" y="301" text-anchor="middle" font-size="8" fill="#889" filter="url(#rough2)">pen 0</text>
  <text x="194" y="277" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(0,1)</text>
  <text x="194" y="289" text-anchor="middle" font-size="8" fill="#556" filter="url(#rough2)">入口 2</text>
  <text x="194" y="301" text-anchor="middle" font-size="8" fill="#889" filter="url(#rough2)">pen 7</text>
  <text x="106" y="325" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(1,0)</text>
  <text x="106" y="337" text-anchor="middle" font-size="8" fill="#556" filter="url(#rough2)">入口 2</text>
  <text x="106" y="349" text-anchor="middle" font-size="8" fill="#889" filter="url(#rough2)">pen 3</text>
  <text x="194" y="325" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">(1,1)</text>
  <text x="194" y="337" text-anchor="middle" font-size="8" fill="#556" filter="url(#rough2)">入口 4</text>
  <text x="194" y="349" text-anchor="middle" font-size="8" fill="#889" filter="url(#rough2)">pen 2</text>
  <text x="194" y="371" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">终点 ✓</text>

  <!-- action 1: wait (orange dashed, same cell, cross layer) -->
  <path d="M 106 131 L 106 256" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <circle cx="82" cy="194" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="198" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="114" y="224" text-anchor="start" font-size="8.5" fill="#a87020" filter="url(#rough2)">等待换层</text>

  <!-- action 2: violating right (red, cross layer) -->
  <path d="M 140 259 Q 236 200 178 133" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="222" cy="194" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="250" y="178" text-anchor="start" font-size="8.5" fill="#b85450" filter="url(#rough2)">违规右移</text>

  <!-- action 3: compliant down (green, cross layer) -->
  <path d="M 238 112 Q 284 220 238 318" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="274" cy="212" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="262" y="252" text-anchor="start" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">合规下移</text>

  <!-- rule box -->
  <rect x="312" y="64" width="294" height="140" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="459" y="84" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">行动价目表（每行动一次，奇偶互换）</text>
  <text x="326" y="104" text-anchor="start" font-size="9" fill="#7a5c1a" filter="url(#rough2)">奇数行动 →↓：只付目标入口 (i+1)(j+1)</text>
  <text x="326" y="121" text-anchor="start" font-size="9" fill="#7a5c1a" filter="url(#rough2)">偶数行动 ←↑：只付目标入口</text>
  <text x="326" y="138" text-anchor="start" font-size="9" fill="#7a5c1a" filter="url(#rough2)">违规移动：目标入口 + penalty[出发格]</text>
  <text x="326" y="155" text-anchor="start" font-size="9" fill="#7a5c1a" filter="url(#rough2)">等待：付 penalty[当前格]，原地换层</text>
  <text x="326" y="172" text-anchor="start" font-size="9" fill="#7a5c1a" filter="url(#rough2)">起点预付入口 1｜橙=等待 红=违规 绿=合规</text>

  <!-- takeaway box -->
  <rect x="312" y="220" width="294" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="459" y="240" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">建模一句话</text>
  <text x="326" y="258" text-anchor="start" font-size="9" fill="#446688" filter="url(#rough2)">状态 = (i, j, p)：格子 + 下一行动的奇偶</text>
  <text x="326" y="275" text-anchor="start" font-size="9" fill="#446688" filter="url(#rough2)">移动 / 等待都翻转 p ⇒ 天然二部分层图</text>
  <text x="326" y="292" text-anchor="start" font-size="9" fill="#446688" filter="url(#rough2)">边权全非负 ⇒ 堆优化 Dijkstra</text>
  <text x="326" y="309" text-anchor="start" font-size="9" fill="#446688" filter="url(#rough2)">2mn ≤ 2×10⁵ 个状态、约 10⁶ 条边</text>

  <!-- bill box -->
  <rect x="40" y="386" width="262" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="171" y="404" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例 2 路径账单（总代价 7）</text>
  <text x="52" y="420" text-anchor="start" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">① 等待@(0,0)：penalty[0][0] = 0</text>
  <text x="52" y="434" text-anchor="start" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">② 右移→(0,1)：入口 2 + 违规罚 0</text>
  <text x="52" y="448" text-anchor="start" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">③ 下移→(1,1)：入口 4（合规）</text>
  <text x="52" y="462" text-anchor="start" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">合计 = 1 + 0 + 2 + 0 + 4 = 7 ✓</text>

  <!-- contrast box -->
  <rect x="318" y="386" width="266" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="451" y="404" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">不许等待的对照（两条单调路径）</text>
  <text x="330" y="420" text-anchor="start" font-size="8.5" fill="#b85450" filter="url(#rough2)">先右后下：1 + 2 + (4+7) = 14</text>
  <text x="330" y="434" text-anchor="start" font-size="8.5" fill="#b85450" filter="url(#rough2)">先下后右：1 + 2 + (4+3) = 10</text>
  <text x="330" y="448" text-anchor="start" font-size="8.5" fill="#b85450" filter="url(#rough2)">等待把违规挪到 pen=0 的 (0,0) 上</text>
  <text x="330" y="462" text-anchor="start" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 7 严格优于 10 与 14</text>
</svg>
