<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 扫描断口分块 → 块内贪心分配</text>

  <ellipse cx="260" cy="54" rx="44" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="13" fill="#333">开始</text>

  <path d="M 260 71 L 260 84" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="130" y="88" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#333">idx = 0…n−1，按 nums 值升序排序</text>

  <path d="M 260 124 L 260 138" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="175" y="142" width="170" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#333">i ← 0（块首），j ← i</text>

  <path d="M 260 174 L 260 190" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="260,194 375,230 260,266 145,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#333">j+1 &lt; n 且排序后相邻差</text>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#333">nums[idx[j+1]]−nums[idx[j]] ≤ limit？</text>

  <path d="M 375 230 C 438 230 438 194 268 194" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="448" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <text x="448" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a">j++</text>

  <path d="M 260 266 L 260 288" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="272" y="282" font-size="11" fill="#b85450">否：遇到断口</text>

  <rect x="105" y="292" width="310" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#333">连通块 [i..j]：原下标 idx[i..j] 升序排序</text>
  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#333">升序的值依次填入对应下标位置（贪心）</text>

  <path d="M 260 346 L 260 358" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="260,362 350,392 260,422 170,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="396" text-anchor="middle" font-size="11" fill="#333">i = j+1 到达末尾？</text>

  <path d="M 170 392 C 92 392 92 158 173 158" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="140" y="384" font-size="11" fill="#4a7a3a">否：下一块</text>
  <text x="66" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 66 280)">i ← j+1</text>

  <path d="M 350 392 L 388 392" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arro)"/>
  <text x="368" y="382" font-size="11" fill="#d6a040">是</text>

  <rect x="392" y="374" width="108" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="446" y="396" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>
</svg>
