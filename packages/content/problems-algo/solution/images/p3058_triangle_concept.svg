<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：共同朋友 = 无向图中的三角形</text>

  <!-- 三角形① 填充：1-2-5 -->
  <polygon points="128,100 60,88 62,165" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.85" filter="url(#rough2)"/>
  <!-- 三角形② 填充：2-3-4 -->
  <polygon points="128,100 196,88 198,165" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.85" filter="url(#rough2)"/>

  <!-- 普通边 -->
  <line x1="60" y1="88" x2="128" y2="100" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="128" y1="100" x2="62" y2="165" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="60" y1="88" x2="62" y2="165" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="128" y1="100" x2="196" y2="88" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="128" y1="100" x2="198" y2="165" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="196" y1="88" x2="198" y2="165" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 悬边（答案） -->
  <line x1="48" y1="262" x2="108" y2="280" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="160" y1="264" x2="215" y2="282" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="60" cy="88" r="14" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="93" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="128" cy="100" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="128" y="105" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="62" cy="165" r="14" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="170" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="196" cy="88" r="14" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="93" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="198" cy="165" r="14" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="48" cy="262" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="48" y="267" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="108" cy="280" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="285" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">7</text>
  <circle cx="160" cy="264" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="269" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">8</text>
  <circle cx="215" cy="282" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="287" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- 图内标注 -->
  <text x="70" y="205" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">三角形① 1-2-5</text>
  <text x="188" y="205" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">三角形② 2-3-4</text>
  <text x="78" y="308" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">悬边 6-7 ✅</text>
  <text x="190" y="312" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">悬边 8-9 ✅</text>
  <text x="130" y="336" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（用户 = 节点，朋友 = 边）</text>

  <!-- 右侧卡片 1：三角形内 -->
  <rect x="265" y="48" width="232" height="72" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="381" y="66" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">在三角形里 → 有共同朋友，排除</text>
  <text x="277" y="86" font-size="9.5" fill="#333" filter="url(#rough2)">边 (1,2)：顶点 5 同时连着 1 和 2</text>
  <text x="277" y="103" font-size="9.5" fill="#333" filter="url(#rough2)">→ 共同朋友 5 → 排除；</text>
  <text x="277" y="114" font-size="9.5" fill="#333" filter="url(#rough2)">同理 (3,4) 的共同朋友是 2</text>

  <!-- 右侧卡片 2：悬边 -->
  <rect x="265" y="132" width="232" height="72" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="381" y="150" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">不在任何三角形 → 无共同朋友</text>
  <text x="277" y="170" font-size="9.5" fill="#333" filter="url(#rough2)">边 (6,7)：6 的朋友只有 7，反之亦然</text>
  <text x="277" y="187" font-size="9.5" fill="#333" filter="url(#rough2)">找不出第三方 z → ✅ 保留</text>
  <text x="277" y="198" font-size="9.5" fill="#333" filter="url(#rough2)">(8,9) 同理</text>

  <!-- 右侧卡片 3：判定式 -->
  <rect x="265" y="216" width="232" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="381" y="236" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">判定式</text>
  <text x="277" y="254" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">(a,b) 有共同朋友 ⇔ 存在 z</text>
  <text x="277" y="270" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">使边 a–z 与 b–z 同时存在</text>

  <!-- 右侧卡片 4：答案 -->
  <rect x="265" y="290" width="232" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="381" y="310" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = 不属于任何三角形的边</text>
  <text x="381" y="330" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">输出 (6,7)、(8,9)（ORDER BY 1,2）</text>
</svg>
