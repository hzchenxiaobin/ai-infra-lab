<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最短超级串：状态压缩 DP（TSP 模型）</text>

  <rect x="20" y="44" width="250" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">状态定义</text>
  <text x="36" y="86" font-size="11" fill="#444">dp[mask][i] = 已用 mask 集合的字符串、</text>
  <text x="36" y="102" font-size="11" fill="#444">  末尾为 word[i] 时的最短长度</text>
  <text x="36" y="122" font-size="10" fill="#888">mask: n 位二进制，第 k 位=1 表示已用 word[k]</text>

  <rect x="290" y="44" width="250" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">转移方程</text>
  <text x="306" y="88" font-size="11" fill="#444">dp[mask|1&lt;&lt;j][j] = min(</text>
  <text x="320" y="106" font-size="11" fill="#444">  dp[mask][i] + len(w[j]) − overlap[i][j]</text>
  <text x="306" y="124" font-size="10" fill="#888">遍历 i ∈ mask, j ∉ mask</text>

  <rect x="20" y="152" width="250" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">初始化</text>
  <text x="36" y="194" font-size="11" fill="#444">dp[1&lt;&lt;i][i] = len(word[i])（单独放置）</text>

  <rect x="290" y="152" width="250" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 + 路径还原</text>
  <text x="306" y="194" font-size="11" fill="#444">取 min dp[全1][i]，parent 回溯得排列</text>

  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">转移示意（以 3 个词为例）</text>

  <rect x="40" y="248" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="265" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">mask={0,2}</text>
  <text x="85" y="278" text-anchor="middle" font-size="9" fill="#666">末尾 i=2</text>

  <rect x="180" y="248" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="225" y="265" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">mask={0,2,1}</text>
  <text x="225" y="278" text-anchor="middle" font-size="9" fill="#666">末尾 j=1</text>

  <line x1="130" y1="266" x2="175" y2="266" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="152" y="260" text-anchor="middle" font-size="9" fill="#4a7a3a">+w[1]</text>
  <text x="152" y="288" text-anchor="middle" font-size="8" fill="#888">−overlap[2][1]</text>

  <rect x="320" y="248" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="265" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">mask={0,1}</text>
  <text x="365" y="278" text-anchor="middle" font-size="9" fill="#666">末尾 i=1</text>

  <rect x="440" y="248" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="265" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">mask={0,1,2}</text>
  <text x="490" y="278" text-anchor="middle" font-size="9" fill="#666">末尾 j=2</text>

  <line x1="410" y1="266" x2="435" y2="266" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="422" y="260" text-anchor="middle" font-size="9" fill="#4a7a3a">+w[2]</text>

  <text x="85" y="306" text-anchor="middle" font-size="9" fill="#888">mask = 101₂ = 5</text>
  <text x="225" y="306" text-anchor="middle" font-size="9" fill="#888">mask = 111₂ = 7</text>
  <text x="365" y="306" text-anchor="middle" font-size="9" fill="#888">mask = 011₂ = 3</text>
  <text x="490" y="306" text-anchor="middle" font-size="9" fill="#888">mask = 111₂ = 7</text>

  <rect x="20" y="324" width="520" height="64" fill="#f5f5f5" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">本质 = 旅行商问题（TSP）</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#666">城市 = 字符串，距离 = len(word[j]) − overlap[i][j]，求最短哈密顿路径</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#666">n ≤ 12 → 2¹² × 12 = 49152 个状态，完美落入状压 DP 甜区</text>
</svg>
