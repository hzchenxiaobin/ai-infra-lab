<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[10,1,2,4,7,2] limit=5</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">关注步骤 2、5（超标收缩 left）与步骤 6（minq 连续弹 3 个）</text>

  <!-- table header -->
  <g font-size="9" fill="#444" font-weight="bold">
    <rect x="16" y="56" width="22" height="18" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="27" y="69" text-anchor="middle">步</text>
    <rect x="38" y="56" width="20" height="18" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="48" y="69" text-anchor="middle">i</text>
    <rect x="58" y="56" width="32" height="18" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="74" y="69" text-anchor="middle">nums[i]</text>
    <rect x="90" y="56" width="28" height="18" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="104" y="69" text-anchor="middle">left</text>
    <rect x="118" y="56" width="120" height="18" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="178" y="69" text-anchor="middle">maxq（下标:值）</text>
    <rect x="238" y="56" width="120" height="18" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="298" y="69" text-anchor="middle">minq（下标:值）</text>
    <rect x="358" y="56" width="178" height="18" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="447" y="69" text-anchor="middle">动作</text>
    <rect x="536" y="56" width="22" height="18" fill="#f6f6f6" stroke="#ccc" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
    <text x="547" y="69" text-anchor="middle">ans</text>
  </g>

  <!-- rows -->
  <g font-size="8" fill="#333">
    <!-- step 1 -->
    <rect x="16" y="76" width="22" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="27" y="91" text-anchor="middle">1</text>
    <rect x="38" y="76" width="20" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="48" y="91" text-anchor="middle">0</text>
    <rect x="58" y="76" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="74" y="91" text-anchor="middle">10</text>
    <rect x="90" y="76" width="28" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="104" y="91" text-anchor="middle">0</text>
    <rect x="118" y="76" width="120" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="178" y="91" text-anchor="middle">[0:10]</text>
    <rect x="238" y="76" width="120" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="298" y="91" text-anchor="middle">[0:10]</text>
    <rect x="358" y="76" width="178" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="447" y="91" text-anchor="middle" fill="#4a7a3a">两队入0；diff=0≤5</text>
    <rect x="536" y="76" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="547" y="91" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>

    <!-- step 2 (key!) -->
    <rect x="16" y="100" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="27" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="38" y="100" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="48" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="58" y="100" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="74" y="115" text-anchor="middle">1</text>
    <rect x="90" y="100" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="104" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="118" y="100" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="178" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">[1:1]</text>
    <rect x="238" y="100" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="298" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">[1:1]</text>
    <rect x="358" y="100" width="178" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="447" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">9&gt;5 收缩left=1；弹过期0</text>
    <rect x="536" y="100" width="22" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="547" y="115" text-anchor="middle">1</text>

    <!-- step 3 -->
    <rect x="16" y="124" width="22" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="27" y="139" text-anchor="middle">3</text>
    <rect x="38" y="124" width="20" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="48" y="139" text-anchor="middle">2</text>
    <rect x="58" y="124" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="74" y="139" text-anchor="middle">2</text>
    <rect x="90" y="124" width="28" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="104" y="139" text-anchor="middle">1</text>
    <rect x="118" y="124" width="120" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="178" y="139" text-anchor="middle">[2:2]</text>
    <rect x="238" y="124" width="120" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="298" y="139" text-anchor="middle">[1:1, 2:2]</text>
    <rect x="358" y="124" width="178" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="447" y="139" text-anchor="middle" fill="#4a7a3a">maxq弹尾1(1≤2)；diff=1≤5</text>
    <rect x="536" y="124" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="547" y="139" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>

    <!-- step 4 -->
    <rect x="16" y="148" width="22" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="27" y="163" text-anchor="middle">4</text>
    <rect x="38" y="148" width="20" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="48" y="163" text-anchor="middle">3</text>
    <rect x="58" y="148" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="74" y="163" text-anchor="middle">4</text>
    <rect x="90" y="148" width="28" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="104" y="163" text-anchor="middle">1</text>
    <rect x="118" y="148" width="120" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="178" y="163" text-anchor="middle">[3:4]</text>
    <rect x="238" y="148" width="120" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="298" y="163" text-anchor="middle">[1:1, 2:2, 3:4]</text>
    <rect x="358" y="148" width="178" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="447" y="163" text-anchor="middle" fill="#4a7a3a">maxq弹尾2(2≤4)；diff=3≤5</text>
    <rect x="536" y="148" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="547" y="163" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>

    <!-- step 5 (key!) -->
    <rect x="16" y="172" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="27" y="187" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="38" y="172" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="48" y="187" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="58" y="172" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="74" y="187" text-anchor="middle">7</text>
    <rect x="90" y="172" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="104" y="187" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="118" y="172" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="178" y="187" text-anchor="middle" fill="#b85450" font-weight="bold">[4:7]</text>
    <rect x="238" y="172" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="298" y="187" text-anchor="middle" fill="#b85450" font-weight="bold">[2:2, 3:4, 4:7]</text>
    <rect x="358" y="172" width="178" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="447" y="187" text-anchor="middle" fill="#b85450" font-weight="bold">6&gt;5 收缩left=2；minq弹过期1</text>
    <rect x="536" y="172" width="22" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="547" y="187" text-anchor="middle">3</text>

    <!-- step 6 (key!) -->
    <rect x="16" y="196" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="27" y="211" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="38" y="196" width="20" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="48" y="211" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="58" y="196" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
    <text x="74" y="211" text-anchor="middle">2</text>
    <rect x="90" y="196" width="28" height="22" fill="#fff" stroke="#eee" stroke-width="0.4" rx="1" filter="url(#rough2)"/>
    <text x="104" y="211" text-anchor="middle">2</text>
    <rect x="118" y="196" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="178" y="211" text-anchor="middle" fill="#d6a040" font-weight="bold">[4:7, 5:2]</text>
    <rect x="238" y="196" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="298" y="211" text-anchor="middle" fill="#d6a040" font-weight="bold">[5:2]</text>
    <rect x="358" y="196" width="178" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="447" y="211" text-anchor="middle" fill="#d6a040" font-weight="bold">minq弹尾4,3,2(≥2)；diff=5≤5</text>
    <rect x="536" y="196" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
    <text x="547" y="211" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <!-- ===== Final result ===== -->
  <line x1="16" y1="226" x2="560" y2="226" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="244" width="500" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终结果：4（窗口 [2,4,7,2]）</text>
  <text x="280" y="284" text-anchor="middle" font-size="10" fill="#555">步骤 2：10−1=9&gt;5，收缩 left 0→1，丢掉 10</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#555">步骤 5：7−1=6&gt;5，收缩 left 1→2，minq 弹过期下标 1（值 1，曾是窗口最小）</text>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#555">步骤 6：2 入 minq 时连弹 4,3,2（都比 2 大且更早，永不再是最小）</text>
  <text x="280" y="330" text-anchor="middle" font-size="9" fill="#888">每元素入两队各 1 次 + 出队各 1 次 → O(n)</text>
</svg>
