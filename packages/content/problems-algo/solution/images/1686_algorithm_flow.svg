<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：求和 → 排序 → 交替取 → 比分</text>

  <!-- Step 1: compute sums -->
  <rect x="60" y="46" width="420" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 对每个石子 i，求 s[i] = a[i] + b[i]</text>
  <text x="270" y="86" text-anchor="middle" font-size="10" fill="#666">a = aliceValues，b = bobValues；s[i] = “取走该石子的净分差收益”</text>
  <path d="M 270 98 L 270 114" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="60" y="116" width="420" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 按第三方值 s[i] 降序排列（索引重排）</text>
  <text x="270" y="156" text-anchor="middle" font-size="10" fill="#666">sort(key = lambda i: a[i] + b[i], reverse = True)</text>
  <path d="M 270 168 L 270 184" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: alternate pick visualization -->
  <rect x="40" y="186" width="460" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 排序后交替取：Alice 取偶数位，Bob 取奇数位</text>

  <!-- sorted stones row -->
  <g font-size="10">
    <rect x="70" y="220" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="100" y="238" text-anchor="middle" fill="#446688" font-weight="bold">order[0]</text>
    <text x="100" y="252" text-anchor="middle" font-size="9" fill="#666">s 最大</text>

    <rect x="150" y="220" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="180" y="238" text-anchor="middle" fill="#4a7a3a" font-weight="bold">order[1]</text>
    <text x="180" y="252" text-anchor="middle" font-size="9" fill="#666">s 次大</text>

    <rect x="230" y="220" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="260" y="238" text-anchor="middle" fill="#446688" font-weight="bold">order[2]</text>
    <text x="260" y="252" text-anchor="middle" font-size="9" fill="#666">…</text>

    <rect x="310" y="220" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="340" y="238" text-anchor="middle" fill="#4a7a3a" font-weight="bold">order[3]</text>
    <text x="340" y="252" text-anchor="middle" font-size="9" fill="#666">…</text>

    <rect x="390" y="220" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="420" y="238" text-anchor="middle" fill="#446688" font-weight="bold">…</text>
    <text x="420" y="252" text-anchor="middle" font-size="9" fill="#666">s 最小</text>
  </g>

  <!-- player labels -->
  <text x="100" y="284" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Alice 拿</text>
  <text x="180" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Bob 拿</text>
  <text x="260" y="284" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Alice 拿</text>
  <text x="340" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Bob 拿</text>
  <text x="420" y="284" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">…</text>

  <text x="270" y="300" text-anchor="middle" font-size="9" fill="#888">偶数下标 → Alice，奇数下标 → Bob</text>
  <path d="M 270 308 L 270 324" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: compute scores -->
  <rect x="40" y="326" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="348" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ Alice 得分</text>
  <text x="150" y="368" text-anchor="middle" font-size="10" fill="#333">Σ a[order[k]]，k = 0,2,4,...</text>

  <rect x="280" y="326" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="390" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ Bob 得分</text>
  <text x="390" y="368" text-anchor="middle" font-size="10" fill="#333">Σ b[order[k]]，k = 1,3,5,...</text>

  <path d="M 150 384 L 150 404 L 270 404" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 390 384 L 390 404 L 270 404" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 404 L 270 420" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 5: compare and return -->
  <rect x="90" y="422" width="360" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="270" y="446" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑤ 比分：Alice &gt; Bob → 1 ；&lt; → −1 ；= → 0</text>
  <text x="270" y="462" text-anchor="middle" font-size="9" fill="#888">平局时返回 0</text>

  <text x="270" y="490" text-anchor="middle" font-size="10" fill="#888">时间 O(n log n)（排序），空间 O(n)（索引数组）</text>
</svg>
