<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最小分割 DP 演算（s = "aab"）</text>

  <!-- String reference -->
  <text x="40" y="56" font-size="11" fill="#888">s:</text>
  <rect x="70" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="61" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="114" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="61" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="158" y="42" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="61" text-anchor="middle" font-size="12" fill="#333">b</text>
  <text x="90" y="84" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="134" y="84" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="178" y="84" text-anchor="middle" font-size="9" fill="#aaa">2</text>

  <!-- Step i=0 -->
  <rect x="30" y="98" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="118" font-size="11" fill="#333" font-weight="bold">i=0：s[0..0]="a"</text>
  <text x="50" y="138" font-size="10" fill="#555">isPal[0][0]=T → 整段回文，不需切</text>
  <text x="50" y="155" font-size="10" fill="#4a7a3a">→ dp[0] = 0</text>
  <!-- dp box -->
  <rect x="420" y="108" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="470" y="127" font-size="10" fill="#888">dp[0]</text>

  <!-- Step i=1 -->
  <rect x="30" y="176" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="196" font-size="11" fill="#333" font-weight="bold">i=1：s[0..1]="aa"</text>
  <text x="50" y="216" font-size="10" fill="#555">isPal[0][1]=T → 整段回文，不需切</text>
  <text x="50" y="233" font-size="10" fill="#4a7a3a">→ dp[1] = 0</text>
  <rect x="420" y="186" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="470" y="205" font-size="10" fill="#888">dp[1]</text>

  <!-- Step i=2 -->
  <rect x="30" y="254" width="500" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="274" font-size="11" fill="#333" font-weight="bold">i=2：s[0..2]="aab"</text>

  <text x="50" y="294" font-size="10" fill="#555">isPal[0][2]=F → 整段非回文，需枚举切点 j：</text>

  <!-- j=0: isPal[0][2]=F, skip -->
  <text x="60" y="314" font-size="10" fill="#b85450">j=0: isPal[0][2]=F ✗ 跳过</text>
  <!-- j=1: isPal[1][2]=F, skip -->
  <text x="60" y="330" font-size="10" fill="#b85450">j=1: isPal[1][2]=F ✗ 跳过</text>
  <!-- j=2: isPal[2][2]=T → dp[1]+1 -->
  <text x="60" y="346" font-size="10" fill="#4a7a3a">j=2: isPal[2][2]=T ✓ → dp[1]+1 = 0+1 = 1</text>

  <rect x="420" y="284" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="303" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="470" y="303" font-size="10" fill="#888">dp[2]</text>

  <!-- Arrow showing dp[1] feeds dp[2] -->
  <path d="M 440 214 L 440 280" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="450" y="250" font-size="9" fill="#b85450">dp[j−1]</text>

  <!-- Result -->
  <rect x="130" y="370" width="300" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = dp[2] = 1（"aa" | "b" 切 1 刀）⭐</text>
</svg>
