<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：GROUP BY 计数 → HAVING=1 筛单一 → MAX 取最大</text>

  <!-- Step 1: MyNumbers table -->
  <text x="90" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① MyNumbers 表</text>
  <rect x="50" y="64" width="80" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="50" y1="84" x2="130" y2="84" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">num</text>
  <text x="90" y="100" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="90" y="118" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="90" y="136" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="90" y="154" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="90" y="172" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="90" y="190" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="90" y="208" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="90" y="226" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- arrow to step 2 -->
  <path d="M 135 140 L 175 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY num + COUNT -->
  <text x="250" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② GROUP BY num + COUNT</text>
  <rect x="180" y="64" width="140" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="250" y1="84" x2="320" y2="84" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">num</text>
  <text x="300" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt</text>
  <text x="210" y="102" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="300" y="102" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="210" y="126" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="300" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="210" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="300" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="210" y="174" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="300" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="210" y="198" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="300" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="210" y="222" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="300" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- arrow to step 3 -->
  <path d="M 325 140 L 365 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: HAVING COUNT=1 -->
  <text x="430" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ HAVING cnt=1</text>
  <rect x="370" y="108" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="128" text-anchor="middle" font-size="11" fill="#333">1, 4, 5, 6</text>
  <text x="430" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a">单一数字集合</text>

  <!-- arrow down to MAX -->
  <path d="M 430 160 L 430 185" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: MAX -->
  <text x="430" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ MAX → 6</text>
  <rect x="380" y="214" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="237" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">num = 6</text>

  <!-- bottom note -->
  <rect x="60" y="285" width="400" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键洞察：MAX 对空集返回 NULL</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#555">子查询无单一数字时 → MAX(空集) = NULL</text>
  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#555">天然满足「不存在则返回 null」的要求，无需 IFNULL</text>
</svg>
