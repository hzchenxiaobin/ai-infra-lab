<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1,2,2,6,6,6,6,7,10]，n = 9</text>

  <!-- Info line -->
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">threshold = n/4 = 2.25，候选下标 = {2, 4, 6}</text>

  <!-- Table header -->
  <rect x="40" y="60" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">候选下标</text>
  <text x="160" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">arr[i]</text>
  <text x="250" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left</text>
  <text x="320" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">right</text>
  <text x="400" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">count</text>
  <text x="486" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">判定</text>

  <!-- Row 1: index 2 -->
  <rect x="40" y="92" width="480" height="32" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="112" text-anchor="middle" font-size="11" fill="#444">2 (n/4)</text>
  <text x="160" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="250" y="112" text-anchor="middle" font-size="11" fill="#444">1</text>
  <text x="320" y="112" text-anchor="middle" font-size="11" fill="#444">2</text>
  <text x="400" y="112" text-anchor="middle" font-size="11" fill="#444">2</text>
  <text x="486" y="112" text-anchor="middle" font-size="11" fill="#888">2 &gt; 2.25? 否</text>

  <!-- Row 2: index 4 (hit) -->
  <rect x="40" y="128" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#444">4 (n/2)</text>
  <text x="160" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="250" y="148" text-anchor="middle" font-size="11" fill="#444">3</text>
  <text x="320" y="148" text-anchor="middle" font-size="11" fill="#444">6</text>
  <text x="400" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="486" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 &gt; 2.25? 是 ✓</text>

  <!-- Row 3: index 6 (skipped) -->
  <rect x="40" y="164" width="480" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="184" text-anchor="middle" font-size="11" fill="#999">6 (3n/4)</text>
  <text x="160" y="184" text-anchor="middle" font-size="11" fill="#999">6</text>
  <text x="250" y="184" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="320" y="184" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="400" y="184" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="486" y="184" text-anchor="middle" font-size="11" fill="#999">已返回，跳过</text>

  <!-- Mini array visualization -->
  <text x="36" y="226" font-size="11" fill="#888">数组</text>
  <!-- 9 boxes, box=40, start x=80 -->
  <rect x="80" y="212" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="231" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="120" y="212" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="231" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="160" y="212" width="40" height="28" fill="#c8d6e8" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="231" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="200" y="212" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <rect x="240" y="212" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <rect x="280" y="212" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <rect x="320" y="212" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <rect x="360" y="212" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="231" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="400" y="212" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="231" text-anchor="middle" font-size="11" fill="#333">10</text>

  <!-- index labels under mini array -->
  <text x="100" y="252" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="140" y="252" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="180" y="252" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="220" y="252" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="260" y="252" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <text x="300" y="252" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="340" y="252" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="380" y="252" text-anchor="middle" font-size="9" fill="#aaa">7</text>
  <text x="420" y="252" text-anchor="middle" font-size="9" fill="#aaa">8</text>

  <!-- brackets for left/right of 6 -->
  <path d="M 200 258 L 200 264 L 360 264 L 360 258" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="10" fill="#d6a040">6 的范围 [left=3, right=6]，count = 6−3+1 = 4</text>

  <!-- Result -->
  <rect x="140" y="294" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">count(6) = 4 &gt; 2.25 → 返回 6</text>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#888">仅检查 2 个候选即命中，O(log n) 二分</text>
</svg>
