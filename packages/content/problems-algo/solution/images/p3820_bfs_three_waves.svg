<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：距离对称——从 x / y / z 各洪泛一次，三次 BFS 得三张距离表</text>
  <text x="260" y="36" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">d(u,x) = d(x,u)：「每个点到 3 个固定目标」⟺「从 3 个固定目标各自扫全树」</text>

  <!-- Tree panel label -->
  <text x="70" y="56" font-size="9.5" fill="#888" filter="url(#rough2)">原树（无向、无权）</text>

  <!-- Tree edges -->
  <line x1="80" y1="135" x2="145" y2="95" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="80" y1="135" x2="75" y2="205" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="145" y1="95" x2="205" y2="68" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="145" y1="95" x2="215" y2="122" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="75" y1="205" x2="140" y2="250" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- BFS waves around targets -->
  <ellipse cx="205" cy="68" rx="21" ry="16" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <ellipse cx="205" cy="68" rx="31" ry="24" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" filter="url(#rough2)"/>
  <ellipse cx="215" cy="122" rx="21" ry="16" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <ellipse cx="215" cy="122" rx="31" ry="24" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" filter="url(#rough2)"/>
  <ellipse cx="140" cy="250" rx="21" ry="16" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <ellipse cx="140" cy="250" rx="31" ry="24" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" filter="url(#rough2)"/>

  <!-- Tree nodes -->
  <circle cx="80" cy="135" r="13" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="145" cy="95" r="13" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="99" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="75" cy="205" r="13" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="205" cy="68" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="205" y="72" text-anchor="middle" font-size="11" fill="#223" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="215" cy="122" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="215" y="126" text-anchor="middle" font-size="11" fill="#223" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="140" cy="250" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="254" text-anchor="middle" font-size="11" fill="#223" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Legend -->
  <circle cx="58" cy="300" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="304" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 3</text>
  <circle cx="122" cy="300" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="304" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y = 4</text>
  <circle cx="186" cy="300" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="304" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">z = 5</text>

  <!-- Right panel: three distance tables -->
  <text x="392" y="58" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">三张距离表（列 = 节点编号）</text>

  <text x="328" y="79" text-anchor="end" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">BFS① 从 x</text>
  <rect x="336" y="64" width="25" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348.5" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="363" y="64" width="25" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375.5" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="390" y="64" width="25" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="402.5" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="417" y="64" width="25" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="429.5" y="79" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="444" y="64" width="25" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="456.5" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="471" y="64" width="25" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="483.5" y="79" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <text x="328" y="111" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">BFS② 从 y</text>
  <rect x="336" y="96" width="25" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348.5" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="363" y="96" width="25" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375.5" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="390" y="96" width="25" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="402.5" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="417" y="96" width="25" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="429.5" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="444" y="96" width="25" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="456.5" y="111" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="471" y="96" width="25" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="483.5" y="111" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <text x="328" y="143" text-anchor="end" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">BFS③ 从 z</text>
  <rect x="336" y="128" width="25" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348.5" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="363" y="128" width="25" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375.5" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="390" y="128" width="25" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="402.5" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="417" y="128" width="25" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="429.5" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="444" y="128" width="25" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="456.5" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="471" y="128" width="25" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="483.5" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- node index row -->
  <text x="328" y="165" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">u</text>
  <text x="348.5" y="165" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="375.5" y="165" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="402.5" y="165" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="429.5" y="165" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="456.5" y="165" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="483.5" y="165" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">5</text>

  <!-- highlight column u=5 -->
  <rect x="468" y="60" width="32" height="106" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <path d="M 484 168 L 455 186" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- check box -->
  <rect x="280" y="188" width="225" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="392" y="206" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">取第 u 列三元组，排序 a ≤ b ≤ c</text>
  <text x="392" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">判 a² + b² = c² ？</text>
  <text x="392" y="244" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">u=5：(4,4,0) → (0,4,4)，0+16=16 ✓ 特殊</text>

  <!-- warning box -->
  <rect x="280" y="268" width="228" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="394" y="286" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 别把 x、y、z 一起塞进队列！</text>
  <text x="394" y="302" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">多源 BFS 只给「到最近源」的距离，</text>
  <text x="394" y="316" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">三个目标必须各自独立 BFS 一遍</text>

  <!-- bottom note -->
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">三次 BFS 各 O(n) + 逐节点 O(1) 判定 = 总时间 O(n)（n ≤ 10⁵ 轻松通过）</text>
</svg>
