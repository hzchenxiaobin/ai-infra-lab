<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="640" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：6 行 → 2 个分组 → 算 quality 与 poor_query_percentage</text>

  <!-- 原始表 -->
  <text x="40" y="50" font-size="11.5" fill="#888">原始表 Queries（按 query_name 分组着色）</text>

  <!-- 表头 -->
  <rect x="40" y="58" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">query_name</text>
  <rect x="160" y="58" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">result</text>
  <rect x="340" y="58" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">position</text>
  <rect x="430" y="58" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">rating</text>
  <rect x="510" y="58" width="70" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="545" y="75" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">分组</text>

  <!-- Dog rows (green) -->
  <rect x="40" y="84" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="99" text-anchor="middle" font-size="10.5" fill="#333">Dog</text>
  <rect x="160" y="84" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="99" text-anchor="middle" font-size="10" fill="#333">Golden Retriever</text>
  <rect x="340" y="84" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="99" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="430" y="84" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="99" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="510" y="84" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="99" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Dog</text>

  <rect x="40" y="108" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="123" text-anchor="middle" font-size="10.5" fill="#333">Dog</text>
  <rect x="160" y="108" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="123" text-anchor="middle" font-size="10" fill="#333">German Shepherd</text>
  <rect x="340" y="108" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="123" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="430" y="108" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="123" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="510" y="108" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="123" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Dog</text>

  <rect x="40" y="132" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="147" text-anchor="middle" font-size="10.5" fill="#333">Dog</text>
  <rect x="160" y="132" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="147" text-anchor="middle" font-size="10" fill="#333">Mule</text>
  <rect x="340" y="132" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="147" text-anchor="middle" font-size="10.5" fill="#333">200</text>
  <rect x="430" y="132" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="470" y="147" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="510" y="132" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="147" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Dog</text>

  <!-- Cat rows (orange) -->
  <rect x="40" y="158" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="173" text-anchor="middle" font-size="10.5" fill="#333">Cat</text>
  <rect x="160" y="158" width="180" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="173" text-anchor="middle" font-size="10" fill="#333">Shirazi</text>
  <rect x="340" y="158" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="173" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="430" y="158" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="470" y="173" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2</text>
  <rect x="510" y="158" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="173" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Cat</text>

  <rect x="40" y="182" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="197" text-anchor="middle" font-size="10.5" fill="#333">Cat</text>
  <rect x="160" y="182" width="180" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="197" text-anchor="middle" font-size="10" fill="#333">Siamese</text>
  <rect x="340" y="182" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="197" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="430" y="182" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="197" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="510" y="182" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="197" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Cat</text>

  <rect x="40" y="206" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="221" text-anchor="middle" font-size="10.5" fill="#333">Cat</text>
  <rect x="160" y="206" width="180" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="221" text-anchor="middle" font-size="10" fill="#333">Sphynx</text>
  <rect x="340" y="206" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="221" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="430" y="206" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="221" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="510" y="206" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="221" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Cat</text>

  <!-- 箭头到分组计算 -->
  <path d="M 300 232 L 300 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="246" font-size="10" fill="#888">GROUP BY query_name</text>

  <!-- Dog 分组计算 -->
  <rect x="40" y="256" width="540" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="276" font-size="12" fill="#4a7a3a" font-weight="bold">分组 Dog（3 行）</text>

  <!-- Dog 比率表 -->
  <text x="60" y="296" font-size="10.5" fill="#555">rating/position：</text>
  <text x="170" y="296" font-size="10.5" fill="#333">5/1=5.000</text>
  <text x="270" y="296" font-size="10.5" fill="#333">5/2=2.500</text>
  <text x="370" y="296" font-size="10.5" fill="#333">1/200=0.005</text>
  <text x="490" y="296" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ AVG</text>

  <text x="60" y="316" font-size="10.5" fill="#555">quality =</text>
  <text x="130" y="316" font-size="10.5" fill="#333">(5.000 + 2.500 + 0.005) / 3 = 7.505 / 3 = 2.5017</text>
  <text x="445" y="316" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ ROUND → 2.50</text>

  <text x="60" y="338" font-size="10.5" fill="#555">rating&lt;3?：</text>
  <text x="170" y="338" font-size="10.5" fill="#333">5&lt;3→0</text>
  <text x="270" y="338" font-size="10.5" fill="#333">5&lt;3→0</text>
  <text x="370" y="338" font-size="10.5" fill="#b85450" font-weight="bold">1&lt;3→1</text>
  <text x="490" y="338" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ AVG</text>

  <text x="60" y="358" font-size="10.5" fill="#555">poor_pct =</text>
  <text x="135" y="358" font-size="10.5" fill="#333">(0 + 0 + 1) / 3 × 100 = 0.333 × 100 = 33.33</text>
  <text x="455" y="358" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ ROUND → 33.33</text>

  <text x="60" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">Dog 输出：quality=2.50, poor_query_percentage=33.33</text>

  <!-- Cat 分组计算 -->
  <rect x="40" y="416" width="540" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="436" font-size="12" fill="#d6a040" font-weight="bold">分组 Cat（3 行）</text>

  <text x="60" y="456" font-size="10.5" fill="#555">rating/position：</text>
  <text x="170" y="456" font-size="10.5" fill="#333">2/5=0.400</text>
  <text x="270" y="456" font-size="10.5" fill="#333">3/3=1.000</text>
  <text x="370" y="456" font-size="10.5" fill="#333">4/7=0.571</text>
  <text x="490" y="456" font-size="10.5" fill="#d6a040" font-weight="bold">→ AVG</text>

  <text x="60" y="476" font-size="10.5" fill="#555">quality =</text>
  <text x="130" y="476" font-size="10.5" fill="#333">(0.400 + 1.000 + 0.571) / 3 = 1.971 / 3 = 0.6571</text>
  <text x="445" y="476" font-size="10.5" fill="#d6a040" font-weight="bold">→ ROUND → 0.66</text>

  <text x="60" y="498" font-size="10.5" fill="#555">rating&lt;3?：</text>
  <text x="170" y="498" font-size="10.5" fill="#b85450" font-weight="bold">2&lt;3→1</text>
  <text x="270" y="498" font-size="10.5" fill="#333">3&lt;3→0</text>
  <text x="370" y="498" font-size="10.5" fill="#333">4&lt;3→0</text>
  <text x="490" y="498" font-size="10.5" fill="#d6a040" font-weight="bold">→ AVG</text>

  <text x="60" y="518" font-size="10.5" fill="#555">poor_pct =</text>
  <text x="135" y="518" font-size="10.5" fill="#333">(1 + 0 + 0) / 3 × 100 = 0.333 × 100 = 33.33</text>
  <text x="455" y="518" font-size="10.5" fill="#d6a040" font-weight="bold">→ ROUND → 33.33</text>

  <text x="60" y="544" font-size="11" fill="#d6a040" font-weight="bold">Cat 输出：quality=0.66, poor_query_percentage=33.33</text>

  <!-- 箭头到结果 -->
  <path d="M 300 568 L 300 586" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 最终结果 -->
  <rect x="60" y="590" width="480" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="610" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">最终输出：Dog(2.50, 33.33) / Cat(0.66, 33.33)</text>
  <text x="300" y="624" text-anchor="middle" font-size="10" fill="#555">两组劣质占比恰好相同，但 quality 差异显著</text>
</svg>
