<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：DFS「进入 / 退出」双阶段 + 值互异滑窗</text>

  <!-- 主流程（左列） -->
  <g filter="url(#rough2)">
    <rect x="40" y="44" width="280" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="180" y="63" text-anchor="middle" font-size="11" fill="#333">建邻接表（无向边双向各加一次），从根 0 出发</text>
    <path d="M 180 74 L 180 86" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>

    <rect x="40" y="90" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <text x="180" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">进入 u（深度 d、父边权 w）：</text>
    <text x="180" y="124" text-anchor="middle" font-size="10.5" fill="#33506b">dist[d] = dist[d−1] + w；j = last[nums[u]]</text>
    <path d="M 180 134 L 180 146" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>

    <polygon points="180,148 256,172 180,196 104,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="180" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">j ≥ top ？</text>
    <text x="180" y="183" text-anchor="middle" font-size="9.5" fill="#8a6d1f">（值在窗口内出现过）</text>

    <text x="266" y="162" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">是</text>
    <path d="M 256 172 L 266 172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <rect x="270" y="158" width="62" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="301" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">top ← j+1</text>
    <path d="M 301 186 L 301 204 L 180 204 L 180 212" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>

    <text x="192" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">否</text>
    <path d="M 180 196 L 180 212" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>

    <rect x="40" y="216" width="280" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="180" y="234" text-anchor="middle" font-size="10.5" fill="#333">用 (dist[d]−dist[top], d−top+1) 更新答案</text>
    <text x="180" y="251" text-anchor="middle" font-size="10" fill="#333">更长 → 替换；等长 → 节点数取 min</text>
    <path d="M 180 262 L 180 274" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>

    <rect x="40" y="278" width="280" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="180" y="298" text-anchor="middle" font-size="11" fill="#333">子节点依次入栈（迭代 DFS，防递归爆栈）</text>
    <path d="M 180 310 L 180 322" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>

    <rect x="40" y="326" width="280" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="180" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">退出 u：弹 dist，恢复 last[nums[u]] 与 top</text>
  </g>

  <!-- 右列要点 -->
  <g filter="url(#rough2)">
    <rect x="344" y="44" width="152" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="420" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b">top 的语义</text>
    <text x="420" y="77" text-anchor="middle" font-size="9.5" fill="#33506b">窗口 [top..d] 内值互不相同；</text>
    <text x="420" y="91" text-anchor="middle" font-size="9.5" fill="#33506b">last[值] = 该值在当前链</text>
    <text x="420" y="103" text-anchor="middle" font-size="9.5" fill="#33506b">最深处出现的下标</text>

    <rect x="344" y="120" width="152" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="420" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f">答案兜底</text>
    <text x="420" y="153" text-anchor="middle" font-size="9.5" fill="#8a6d1f">单点也是特殊路径：</text>
    <text x="420" y="167" text-anchor="middle" font-size="9.5" fill="#8a6d1f">best 初始化 (0, 1)，</text>
    <text x="420" y="180" text-anchor="middle" font-size="9.5" fill="#8a6d1f">示例 2 全重复值即靠它</text>

    <rect x="344" y="190" width="152" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="420" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">为什么是 O(n)</text>
    <text x="420" y="223" text-anchor="middle" font-size="9.5" fill="#b85450">每条边被进入、退出</text>
    <text x="420" y="237" text-anchor="middle" font-size="9.5" fill="#b85450">各一次，enter / exit</text>
    <text x="420" y="251" text-anchor="middle" font-size="9.5" fill="#b85450">的哈希操作均摊 O(1)</text>

    <rect x="344" y="260" width="152" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="420" y="278" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">复杂度</text>
    <text x="420" y="293" text-anchor="middle" font-size="9.5" fill="#2f5d24">时间 O(n)、空间 O(n)</text>
    <text x="420" y="307" text-anchor="middle" font-size="9.5" fill="#2f5d24">n = 5×10⁴ 链状树</text>
    <text x="420" y="321" text-anchor="middle" font-size="9.5" fill="#2f5d24">深度即 5×10⁴，须防爆栈</text>
  </g>
</svg>
