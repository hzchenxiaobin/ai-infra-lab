<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="200" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：行列计数法</text>

  <!-- Step 1: Init -->
  <rect x="80" y="48" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Step 1：初始化</text>
  <text x="200" y="82" text-anchor="middle" font-size="10.5" fill="#888">rowCount[m]=0, colCount[n]=0</text>

  <!-- Arrow -->
  <path d="M 200 92 L 200 106" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: First pass -->
  <rect x="80" y="110" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Step 2：第一趟遍历</text>
  <text x="200" y="144" text-anchor="middle" font-size="10.5" fill="#888">grid[i][j]==1 → row[i]++, col[j]++</text>

  <!-- Arrow -->
  <path d="M 200 154 L 200 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: ans = 0 -->
  <rect x="70" y="172" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="195" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans = 0</text>

  <!-- Arrow -->
  <path d="M 200 208 L 200 222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: Second pass -->
  <rect x="80" y="226" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Step 3：第二趟遍历</text>
  <text x="200" y="260" text-anchor="middle" font-size="10.5" fill="#888">对每个 server (i, j)</text>

  <!-- Arrow -->
  <path d="M 200 270 L 200 284" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="200,284 300,306 200,328 100,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="302" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">rowCount[i]&gt;1</text>
  <text x="200" y="318" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">或 colCount[j]&gt;1?</text>

  <!-- Yes branch (down) -->
  <path d="M 200 328 L 200 342" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="210" y="340" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- ans++ box -->
  <rect x="100" y="346" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="369" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans++</text>

  <!-- Loop back arrow: from ans++ right → up → into Step 4 right -->
  <path d="M 300 364 L 370 364" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 370 364 L 370 248" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 370 248 L 320 248" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="334" y="300" width="72" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="316" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">继续遍历</text>

  <!-- No branch (right then down) -->
  <path d="M 300 306 L 340 306 L 340 398 L 300 398" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="316" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Return box -->
  <rect x="100" y="380" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="403" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- Side note: complexity -->
  <rect x="410" y="56" width="120" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="78" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">复杂度</text>
  <text x="420" y="98" font-size="10.5" fill="#555">时间 O(mn)</text>
  <text x="420" y="116" font-size="10.5" fill="#555">空间 O(m+n)</text>
  <text x="420" y="138" font-size="10.5" fill="#555">两趟遍历</text>
  <text x="420" y="156" font-size="10.5" fill="#555">查表 O(1) 判定</text>

  <!-- Side note: key insight -->
  <rect x="410" y="180" width="120" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="202" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">关键洞察</text>
  <text x="420" y="222" font-size="10.5" fill="#555">同行/同列即通信</text>
  <text x="420" y="240" font-size="10.5" fill="#555">预统计行/列计数</text>
  <text x="420" y="254" font-size="10.5" fill="#555">避免逐个扫描</text>
</svg>
