<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，两方向各自滚动，单元素减一次</text>

  <ellipse cx="170" cy="48" rx="34" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="53" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 170 62 L 170 72" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="74" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">up/down 的 cnt、sum 及 ans ← 0</text>

  <path d="M 170 100 L 170 110" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,112 240,136 170,160 100,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="141" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <text x="256" y="128" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 240 136 L 326 136" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <ellipse cx="390" cy="136" rx="56" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="141" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="180" y="176" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 170 160 L 170 172" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="174" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="192" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">y ← nums[i]，d ← y − nums[i−1]</text>

  <path d="M 130 200 L 130 218" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 200 L 230 218" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="218" width="220" height="72" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="238" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">+1 方向：up_cnt / up_sum</text>
  <text x="140" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = +1：cnt++，sum += cnt × y</text>
  <text x="140" y="280" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否则：cnt = 1，sum = y</text>

  <rect x="270" y="218" width="220" height="72" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="238" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">−1 方向：down_cnt / down_sum</text>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = −1：cnt++，sum += cnt × y</text>
  <text x="380" y="280" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否则：cnt = 1，sum = y</text>

  <path d="M 140 290 L 140 304" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 290 L 380 304" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="115" y="304" width="290" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans += up_sum + down_sum − y</text>
  <text x="260" y="343" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（单元素两方向各计一次，当场减回一次）</text>

  <path d="M 260 352 L 260 366" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="205" y="368" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i ← i + 1</text>

  <path d="M 205 381 L 40 381 L 40 136 L 96 136" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="262" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 34 262)">回到循环判断</text>

  <rect x="330" y="368" width="172" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="386" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">坑位提醒</text>
  <text x="416" y="402" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cnt×y ≤ 10¹⁰ → long long</text>
  <text x="416" y="418" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">减法可能为负 → +MOD 再取模</text>

  <text x="160" y="428" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(n)，空间 O(1)；n = 1 时循环一次，ans = y</text>
</svg>
