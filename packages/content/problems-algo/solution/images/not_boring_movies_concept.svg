<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    两个过滤条件 + 一个排序
  </text>

  <rect x="40" y="60" width="160" height="60" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">条件①</text>
  <text x="120" y="106" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">id 为奇数</text>

  <rect x="200" y="60" width="160" height="60" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">条件②</text>
  <text x="280" y="106" text-anchor="middle" font-size="13" fill="#a07020" filter="url(#rough2)">非 boring</text>

  <rect x="360" y="60" width="160" height="60" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">排序</text>
  <text x="440" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">rating DESC</text>

  <text x="280" y="148" text-anchor="middle" font-size="22" fill="#b85450" filter="url(#rough2)">AND</text>

  <rect x="80" y="165" width="180" height="40" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="190" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">id % 2 = 1  (MOD)</text>

  <rect x="300" y="165" width="180" height="40" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="190" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">description != 'boring'</text>

  <text x="120" y="240" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">奇偶判断速查</text>

  <rect x="50" y="252" width="40" height="28" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="70" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">奇 ✓</text>

  <rect x="95" y="252" width="40" height="28" rx="4" fill="#eee"
        stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="115" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">偶 ✗</text>

  <rect x="140" y="252" width="40" height="28" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">奇 ✓</text>

  <rect x="185" y="252" width="40" height="28" rx="4" fill="#eee"
        stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="205" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="205" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">偶 ✗</text>

  <rect x="230" y="252" width="40" height="28" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="250" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">奇 ✓</text>

  <path d="M 300 266 Q 360 246 410 266" fill="none" stroke="#446688"
        stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">id &amp; 1 / MOD 2</text>

  <rect x="300" y="252" width="220" height="60" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">等价写法（任选其一）</text>
  <text x="410" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">id % 2 = 1  ≡  id &amp; 1 = 1  ≡  MOD(id,2)=1</text>

  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">
    WHERE 条件① AND 条件②  →  ORDER BY rating DESC
  </text>
</svg>
