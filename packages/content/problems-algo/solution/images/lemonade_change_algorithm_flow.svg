<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：贪心模拟，按面额分情况处理</text>

  <!-- Start -->
  <rect x="200" y="38" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#333">遍历 bills[i]</text>
  <path d="M 260 68 L 260 84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: bill == 5? -->
  <polygon points="260,86 340,116 260,146 180,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#333">bill == 5?</text>

  <!-- Yes branch (right) -->
  <path d="M 340 116 L 400 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="400" y="102" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="120" text-anchor="middle" font-size="10.5" fill="#333">five++; 下一个</text>

  <!-- No branch (down) -->
  <path d="M 260 146 L 260 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="158" font-size="10" fill="#888">否</text>

  <!-- Decision: bill == 10? -->
  <polygon points="260,164 340,194 260,224 180,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="11" fill="#333">bill == 10?</text>

  <!-- Yes branch (right): five > 0? -->
  <path d="M 340 194 L 400 194" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <polygon points="448,178 508,194 448,210 388,194" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="198" text-anchor="middle" font-size="10" fill="#333">five≥1?</text>
  <!-- yes -->
  <path d="M 448 210 L 448 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="462" y="222" font-size="9.5" fill="#4a7a3a">是</text>
  <rect x="400" y="228" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="244" text-anchor="middle" font-size="10" fill="#333">five--; ten++</text>
  <!-- no -->
  <path d="M 388 194 L 360 194 L 360 252" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="188" font-size="9.5" fill="#b85450">否</text>
  <rect x="312" y="254" width="96" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="270" text-anchor="middle" font-size="10" fill="#b85450">return false</text>

  <!-- No branch (down) -->
  <path d="M 260 224 L 260 240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="236" font-size="10" fill="#888">否</text>

  <!-- Decision: ten>0 && five>0? (greedy) -->
  <polygon points="260,242 360,272 260,302 160,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="10.5" fill="#333">bill==20:</text>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#333">ten≥1 且 five≥1?</text>

  <!-- Yes branch (right): greedy 10+5 -->
  <path d="M 360 272 L 400 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="384" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="400" y="258" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="276" text-anchor="middle" font-size="10" fill="#333">ten--; five-- ✓贪心</text>

  <!-- No branch (down): five>=3? -->
  <path d="M 260 302 L 260 318" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="314" font-size="10" fill="#888">否</text>

  <polygon points="260,320 340,348 260,376 180,348" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#333">five ≥ 3?</text>

  <!-- Yes branch (right) -->
  <path d="M 340 348 L 400 348" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="400" y="334" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="352" text-anchor="middle" font-size="10" fill="#333">five -= 3</text>

  <!-- No branch (down) -->
  <path d="M 260 376 L 260 392" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="276" y="388" font-size="10" fill="#b85450">否</text>
  <rect x="212" y="394" width="96" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="410" text-anchor="middle" font-size="10" fill="#b85450">return false</text>

  <!-- End -->
  <path d="M 260 418 L 260 432" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="434" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="11" filter="url(#rough2)"/>
  <text x="260" y="449" text-anchor="middle" font-size="10.5" fill="#333">遍历完 → return true</text>
</svg>
