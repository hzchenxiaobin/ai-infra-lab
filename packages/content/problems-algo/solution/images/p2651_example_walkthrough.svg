<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">两个示例：不回绕 vs 回绕</text>

  <!-- Example 1 label -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：15 + 5 = 20（&lt; 24，不回绕）</text>

  <!-- Row 1: 15 + 5 = 20 % 24 = 20 -->
  <rect x="40" y="68" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="93" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">15</text>

  <text x="112" y="94" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">+</text>

  <rect x="124" y="68" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="93" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="196" y="94" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">=</text>

  <rect x="208" y="68" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="238" y="93" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">20</text>

  <text x="284" y="94" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">% 24 =</text>

  <rect x="330" y="68" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="93" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">20</text>

  <text x="412" y="94" font-size="11" fill="#4a7a3a" filter="url(#rough2)">20:00</text>

  <!-- Example 2 label -->
  <text x="40" y="158" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：13 + 11 = 24（≥ 24，回绕到 0）</text>

  <!-- Row 2: 13 + 11 = 24 % 24 = 0 -->
  <rect x="40" y="168" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="193" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">13</text>

  <text x="112" y="194" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">+</text>

  <rect x="124" y="168" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="193" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">11</text>

  <text x="196" y="194" text-anchor="middle" font-size="18" fill="#888" filter="url(#rough2)">=</text>

  <rect x="208" y="168" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="193" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">24</text>

  <text x="284" y="194" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">% 24 =</text>

  <rect x="330" y="168" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="193" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="412" y="194" font-size="11" fill="#b85450" filter="url(#rough2)">00:00</text>

  <!-- wrap annotation for ex2 -->
  <path d="M 238 210 Q 238 240 300 240 Q 365 240 365 210" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">24 整除 24 → 余 0（回绕）</text>

  <!-- Summary box -->
  <rect x="40" y="278" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">结论：(arrivalTime + delayedTime) % 24</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不回绕时余数 = 原值；回绕时余数 = 0~23，两例同公式</text>
</svg>
