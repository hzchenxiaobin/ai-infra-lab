<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, −1, 1, 2]</text>

  <!-- ===== Header row ===== -->
  <rect x="30" y="48" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="84" y="48" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="114" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <rect x="148" y="48" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="223" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f = max(g, 0) + x</text>
  <rect x="300" y="48" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">g = f − x</text>
  <rect x="432" y="48" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="472" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">对应子数组</text>
  <rect x="514" y="48" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="549" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- ===== Row 0: i=0, x=3 ===== -->
  <rect x="30" y="80" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="102" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="84" y="80" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="148" y="80" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="223" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">max(−∞,0)+3 = 3</text>
  <rect x="300" y="80" width="130" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="102" text-anchor="middle" font-size="11" fill="#888">−∞（开新段）</text>
  <rect x="432" y="80" width="80" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="472" y="102" text-anchor="middle" font-size="11" fill="#555">[3]</text>
  <rect x="514" y="80" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="549" y="102" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>

  <!-- ===== Row 1: i=1, x=-1 ===== -->
  <rect x="30" y="118" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="84" y="118" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="140" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <rect x="148" y="118" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="140" text-anchor="middle" font-size="12" fill="#333">max(−∞,0)−1 = −1</text>
  <rect x="300" y="118" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="365" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3 − (−1) = 4</text>
  <rect x="432" y="118" width="80" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="472" y="140" text-anchor="middle" font-size="11" fill="#555">[3, −1]</text>
  <rect x="514" y="118" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="549" y="140" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>

  <!-- ===== Row 2: i=2, x=1  BEST ===== -->
  <rect x="30" y="156" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="55" y="178" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="84" y="156" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="178" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="148" y="156" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">max(4,0)+1 = 5 ⭐</text>
  <rect x="300" y="156" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="178" text-anchor="middle" font-size="12" fill="#333">−1 − 1 = −2</text>
  <rect x="432" y="156" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="472" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[3,−1,1]</text>
  <rect x="514" y="156" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="549" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <!-- ===== Row 3: i=3, x=2 ===== -->
  <rect x="30" y="194" width="50" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="216" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="84" y="194" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="216" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="148" y="194" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="223" y="216" text-anchor="middle" font-size="12" fill="#333">max(−2,0)+2 = 2</text>
  <rect x="300" y="194" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="216" text-anchor="middle" font-size="12" fill="#333">5 − 2 = 3</text>
  <rect x="432" y="194" width="80" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="472" y="216" text-anchor="middle" font-size="11" fill="#555">[3,−1,1,2]</text>
  <rect x="514" y="194" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="549" y="216" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <!-- ===== Explanation box ===== -->
  <rect x="30" y="252" width="580" height="92" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="44" y="274" font-size="11" fill="#666" font-weight="bold">关键解读：</text>
  <text x="44" y="294" font-size="11" fill="#555">• i=0：开新段 [3]，f=3；g 仍 −∞（首元素不能取负号）。</text>
  <text x="44" y="312" font-size="11" fill="#555">• i=1：g 由 f 续接得 3−(−1)=4（子数组 [3,−1]）；f 开新段得 −1，不如续接。</text>
  <text x="44" y="330" font-size="11" fill="#555">• i=2：f 续接 g 得 max(4,0)+1=5 ⭐，对应 [3,−1,1]，正是全局最优。</text>

  <!-- ===== Result ===== -->
  <rect x="170" y="356" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="384" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 ans = 5 ⭐（子数组 [3, −1, 1]）</text>

  <!-- ===== Footer note ===== -->
  <rect x="60" y="408" width="520" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="423" text-anchor="middle" font-size="10" fill="#555">注意：每步 f、g 同步更新（依赖旧值），ans 跟踪所有 f、g 的最大值。</text>
</svg>
