<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两种典型场景对比</text>

  <!-- ===== 示例 3：有负数可翻 ===== -->
  <text x="40" y="54" font-size="12" fill="#446688" font-weight="bold">示例 3：nums = [2,-3,-1,5,-4], k = 2</text>

  <!-- 排序 -->
  <rect x="40" y="62" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="56" y="82" font-size="11" fill="#333">排序 →</text>
  <rect x="104" y="66" width="42" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-4</text>
  <rect x="150" y="66" width="42" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-3</text>
  <rect x="196" y="66" width="42" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-1</text>
  <rect x="242" y="66" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <rect x="288" y="66" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a">5</text>
  <text x="345" y="82" font-size="10.5" fill="#888">k = 2</text>

  <!-- 翻转 1 -->
  <path d="M 125 90 L 125 104" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="100" font-size="9.5" fill="#d6a040">翻</text>

  <rect x="40" y="108" width="480" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="56" y="128" font-size="11" fill="#333">翻-4→4</text>
  <rect x="104" y="112" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="150" y="112" width="42" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-3</text>
  <rect x="196" y="112" width="42" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-1</text>
  <rect x="242" y="112" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <rect x="288" y="112" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a">5</text>
  <text x="345" y="128" font-size="10.5" fill="#888">k = 1</text>

  <!-- 翻转 2 -->
  <path d="M 171 140 L 171 154" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="181" y="150" font-size="9.5" fill="#d6a040">翻</text>

  <rect x="40" y="158" width="480" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="56" y="178" font-size="11" fill="#333">翻-3→3</text>
  <rect x="104" y="162" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>
  <rect x="150" y="162" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="196" y="162" width="42" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-1</text>
  <rect x="242" y="162" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <rect x="288" y="162" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a">5</text>
  <text x="345" y="178" font-size="10.5" fill="#888">k = 0 ✓</text>

  <!-- 结果 -->
  <rect x="80" y="196" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">和 = 4 + 3 + (-1) + 2 + 5 = 13 ✓</text>

  <!-- 分隔线 -->
  <path d="M 40 236 L 520 236" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== 示例 1：无负数，k 为奇数 ===== -->
  <text x="40" y="258" font-size="12" fill="#446688" font-weight="bold">示例 1：nums = [4,2,3], k = 1</text>

  <!-- 排序 -->
  <rect x="40" y="266" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="56" y="286" font-size="11" fill="#333">排序 →</text>
  <rect x="104" y="270" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <rect x="150" y="270" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <rect x="196" y="270" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>
  <text x="260" y="286" font-size="10.5" fill="#888">无负数，k = 1 仍剩余</text>

  <!-- k 为奇数判断 -->
  <rect x="40" y="304" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="323" text-anchor="middle" font-size="11.5" fill="#333">k = 1 为奇数 → 翻转最小绝对值元素（2）</text>

  <!-- 翻转最小 -->
  <path d="M 125 334 L 125 348" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="344" font-size="9.5" fill="#d6a040">翻</text>

  <rect x="40" y="352" width="480" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="56" y="372" font-size="11" fill="#333">翻2→-2</text>
  <rect x="104" y="356" width="42" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-2</text>
  <rect x="150" y="356" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <rect x="196" y="356" width="42" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>
  <text x="260" y="372" font-size="10.5" fill="#888">k = 0 ✓</text>

  <!-- 结果 -->
  <rect x="80" y="390" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">和 = (-2) + 3 + 4 = 5 ✓</text>

  <!-- 对比说明 -->
  <rect x="40" y="428" width="480" height="24" fill="#f5f5f5" stroke="none" rx="6" filter="url(#rough2)"/>
  <text x="280" y="445" text-anchor="middle" font-size="10" fill="#888">对比：示例3翻负数使和增加；示例1被迫翻正数使和减少，但翻最小损失最少</text>
</svg>
