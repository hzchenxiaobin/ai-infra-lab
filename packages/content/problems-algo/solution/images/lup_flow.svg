<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">后序 DFS 流程：dfs(node) 返回「向下同值箭头」边数</text>

  <!-- 入口 -->
  <rect x="210" y="42" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">调用 dfs(node)</text>

  <!-- 判空 菱形 -->
  <path d="M 280 78 L 345 108 L 280 138 L 215 108 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <path d="M 280 70 L 280 78" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是 → return 0 -->
  <path d="M 345 108 L 420 108" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="100" font-size="10" fill="#4a7a3a">是</text>
  <rect x="420" y="94" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="112" text-anchor="middle" font-size="11" fill="#333">return 0</text>

  <!-- 否 → 递归 -->
  <path d="M 215 108 L 150 108" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="100" font-size="10" fill="#b85450">否</text>

  <rect x="60" y="94" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="112" text-anchor="middle" font-size="11" fill="#333">递归左右</text>
  <text x="105" y="138" text-anchor="middle" font-size="10" fill="#888">L = dfs(left)</text>
  <text x="105" y="152" text-anchor="middle" font-size="10" fill="#888">R = dfs(right)</text>

  <path d="M 105 122 L 105 158 L 280 158 L 280 173" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算左右箭头 -->
  <rect x="120" y="175" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#333">leftArrow  = (left 且 left.val==node.val)  ? L + 1 : 0</text>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333">rightArrow = (right 且 right.val==node.val) ? R + 1 : 0</text>

  <path d="M 280 231 L 280 248" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新答案 -->
  <rect x="150" y="250" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = max(ans, leftArrow + rightArrow)</text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#b85450">路径在此节点「拐弯」，拼接左右两支</text>

  <path d="M 280 290 L 280 308" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="170" y="310" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return max(leftArrow, rightArrow)</text>

  <!-- 底部说明 -->
  <rect x="40" y="360" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">关键：值不等 → 箭头截断为 0；向上只传一支，拐弯在节点处</text>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#888">空节点 return 0 · 叶子 leftArrow=rightArrow=0，ans 不变，return 0</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#888">与 543 直径同骨架，仅多一步「同值才能延伸」的判定</text>
</svg>
