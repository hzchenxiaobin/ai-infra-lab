<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：整块修不起就修一部分，收尾段把预算花光</text>

  <!-- ===== Panel A: example 2 ===== -->
  <text x="64" y="48" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 ②：road = "..xxxxx"，budget = 4</text>

  <rect x="64" y="56" width="34" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="81" y="78" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">.</text>
  <rect x="104" y="56" width="34" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="121" y="78" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">.</text>

  <rect x="144" y="56" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="78" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="184" y="56" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="78" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="224" y="56" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="241" y="78" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x</text>

  <rect x="264" y="56" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="281" y="78" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">x</text>
  <rect x="304" y="56" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="321" y="78" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">x</text>

  <text x="360" y="70" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 已修 3 个</text>
  <text x="360" y="84" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 预算不够</text>

  <text x="64" y="114" font-size="11.5" fill="#555" filter="url(#rough2)">唯一块 L = 5：整修需 6 &gt; 4，修不起 → 只修其中连续 3 个，花费 3 + 1 = 4</text>

  <rect x="64" y="122" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="184" y="141" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 3（= budget − 1，预算恰好花光）</text>

  <!-- ===== Panel B: example 3 ===== -->
  <text x="64" y="176" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 ③：road = "x.x.xxx...x"，budget = 14</text>

  <rect x="64" y="184" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="77" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="94" y="184" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="107" y="202" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">.</text>
  <rect x="124" y="184" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
