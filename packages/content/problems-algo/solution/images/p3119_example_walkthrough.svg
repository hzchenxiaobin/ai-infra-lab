  <rect x="184" y="184" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="197" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="214" y="184" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="227" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="244" y="184" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="257" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="274" y="184" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="202" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">.</text>
  <rect x="304" y="184" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="317" y="202" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">.</text>
  <rect x="334" y="184" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="347" y="202" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">.</text>
  <rect x="364" y="184" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="377" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>

  <!-- braces under blocks -->
  <path d="M 64 214 L 64 219 L 77 219 L 77 214" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="77" y="231" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">块长 1</text>
  <path d="M 124 214 L 124 219 L 137 219 L 137 214" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="137" y="231" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">块长 1</text>
  <path d="M 184 214 L 184 219 L 270 219 L 270 214" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="227" y="231" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">块长 3</text>
  <path d="M 364 214 L 364 219 L 390 219 L 390 214" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="377" y="231" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">块长 1</text>

  <text x="428" y="205" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">降序处理：</text>
  <text x="428" y="220" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">[3, 1, 1, 1]</text>

  <!-- steps table -->
  <rect x="64" y="242" width="166" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="147" y="257" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">操作</text>
  <rect x="230" y="242" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="257" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">花费</text>
  <rect x="310" y="242" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="257" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">剩余预算</text>
  <rect x="390" y="242" width="66" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="423" y="257" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="64" y="266" width="166" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="147" y="283" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">整修长度 3 的块（xxx）</text>
  <rect x="230" y="266" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="283" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">3 + 1 = 4</text>
  <rect x="310" y="266" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="283" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">10</text>
  <rect x="390" y="266" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="423" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="64" y="294" width="166" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="147" y="311" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">整修长度 1 的块</text>
  <rect x="230" y="294" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="311" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1 + 1 = 2</text>
  <rect x="310" y="294" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="311" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">8</text>
  <rect x="390" y="294" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="423" y="311" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="64" y="322" width="166" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="147" y="339" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">整修长度 1 的块</text>
  <rect x="230" y="322" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="339" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1 + 1 = 2</text>
  <rect x="310" y="322" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="339" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <rect x="390" y="322" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="423" y="339" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="64" y="350" width="166" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="147" y="367" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">整修长度 1 的块</text>
  <rect x="230" y="350" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="367" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1 + 1 = 2</text>
  <rect x="310" y="350" width="80" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="367" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <rect x="390" y="350" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="423" y="367" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="64" y="386" width="392" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="407" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">总花费 4 + 2 + 2 + 2 = 10 ≤ 14：6 个坑洼全部修复 → ans = 6</text>
</svg>
