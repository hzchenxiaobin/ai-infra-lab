<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 按 target 拆分为两棵子树</text>

  <!-- ===== 原始 BST ===== -->
  <text x="240" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">原始 BST（target = 2）</text>

  <!-- 4 根 -->
  <line x1="232" y1="84" x2="195" y2="120" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="248" y1="84" x2="285" y2="120" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="240" cy="72" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- 2 (绿, ≤target) -->
  <line x1="187" y1="134" x2="165" y2="170" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="203" y1="134" x2="225" y2="170" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="195" cy="122" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="195" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- 6 -->
  <line x1="277" y1="134" x2="255" y2="170" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="293" y1="134" x2="315" y2="170" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="285" cy="122" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="285" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- 1 (绿) -->
  <circle cx="160" cy="178" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="182" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <!-- 3 -->
  <circle cx="230" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="182" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>

  <!-- 5 -->
  <circle cx="250" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="182" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>

  <!-- 7 -->
  <circle cx="320" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="182" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>

  <!-- target 分割线 -->
  <path d="M 130 100 Q 175 150 130 210" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <text x="105" y="100" font-size="10" fill="#b85450" font-weight="bold">target=2</text>

  <!-- 图例 -->
  <rect x="370" y="60" width="210" height="56" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <circle cx="388" cy="78" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="82" font-size="10" fill="#4a7a3a">≤ target → 小树 S</text>
  <circle cx="388" cy="100" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="104" font-size="10" fill="#d6a040">&gt; target → 大树 T</text>

  <!-- 拆分箭头 -->
  <path d="M 160 205 L 110 250" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 320 205 L 470 250" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <!-- ===== 小树 S (≤ target) ===== -->
  <rect x="40" y="232" width="180" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <text x="130" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">小树 S（≤ target）</text>

  <line x1="120" y1="284" x2="100" y2="324" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="130" cy="272" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <circle cx="95" cy="338" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="342" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <text x="130" y="370" text-anchor="middle" font-size="9" fill="#4a7a3a">2.right 断开 → null</text>

  <!-- ===== 大树 T (> target) ===== -->
  <rect x="330" y="232" width="240" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">大树 T（&gt; target）</text>

  <line x1="442" y1="284" x2="410" y2="320" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="458" y1="284" x2="490" y2="320" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="450" cy="272" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <circle cx="405" cy="332" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="336" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>

  <line x1="482" y1="346" x2="462" y2="376" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="498" y1="346" x2="518" y2="376" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="490" cy="332" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="336" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>

  <circle cx="458" cy="392" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="395" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">5</text>

  <circle cx="522" cy="392" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522" y="395" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">7</text>

  <text x="450" y="422" text-anchor="middle" font-size="9" fill="#d6a040">4.left 由 2 → 重接为 3</text>
</svg>
