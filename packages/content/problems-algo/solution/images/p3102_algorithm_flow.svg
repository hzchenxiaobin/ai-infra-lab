<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 435"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="435" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描 + ≤4 个候选，全程 O(n)</text>

  <!-- 步骤 1 -->
  <rect x="40" y="48" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="70" text-anchor="middle" font-size="12" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">① 坐标变换</text>
  <text x="190" y="88" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">uᵢ = xᵢ − yᵢ ， vᵢ = xᵢ + yᵢ</text>
  <path d="M 190 104 L 190 124" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="40" y="124" width="300" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="146" text-anchor="middle" font-size="12" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">② top-2 预处理（一遍线性扫描）</text>
  <text x="190" y="164" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">u / v 各求：最大 + 次大、最小 + 次小</text>
  <text x="190" y="180" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">（值和下标都记，共 8 个量）</text>
  <path d="M 190 192 L 190 212" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="40" y="212" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="234" text-anchor="middle" font-size="12" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">③ 组装候选集</text>
  <text x="190" y="252" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">C = { argmax u, argmin u, argmax v, argmin v } ≤ 4 点</text>
  <path d="M 190 268 L 190 288" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="40" y="288" width="300" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="190" y="310" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">④ 枚举候选 i ∈ C（每个 O(1)）</text>
  <text x="190" y="328" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">i 命中的极值下标 → 换用次值</text>
  <text x="190" y="344" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ans = min(ans, max(range′ᵤ, range′ᵥ))</text>
  <path d="M 190 356 L 190 376" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 5 -->
  <rect x="100" y="376" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="190" y="402" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑤ return ans</text>

  <!-- 右侧注释框 1 -->
  <rect x="368" y="48" width="140" height="168" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="438" y="70" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">为什么只试 ≤4 个点？</text>
  <text x="438" y="92" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">删非极值点 →</text>
  <text x="438" y="105" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">四个极值不变，直径不变</text>
  <text x="438" y="128" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">删任意点 →</text>
  <text x="438" y="141" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">点集变小，直径不增</text>
  <text x="438" y="164" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">交换论证：</text>
  <text x="438" y="177" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">最优 min 必落在</text>
  <text x="438" y="190" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">极值点候选之中</text>

  <!-- 右侧注释框 2 -->
  <rect x="368" y="236" width="140" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="438" y="258" text-anchor="middle" font-size="10.5" fill="#8f4040" font-weight="bold" filter="url(#rough2)">并列极值怎么办？</text>
  <text x="438" y="280" text-anchor="middle" font-size="9" fill="#8f4040" filter="url(#rough2)">多个点同取 max u 时</text>
  <text x="438" y="293" text-anchor="middle" font-size="9" fill="#8f4040" filter="url(#rough2)">次大 = 最大</text>
  <text x="438" y="316" text-anchor="middle" font-size="9" fill="#8f4040" filter="url(#rough2)">删掉一个，剩下的仍顶住</text>
  <text x="438" y="329" text-anchor="middle" font-size="9" fill="#8f4040" filter="url(#rough2)">极值 —— 公式天然正确</text>
  <text x="438" y="348" text-anchor="middle" font-size="8.5" fill="#a06a6a" filter="url(#rough2)">无需任何特判</text>
</svg>
