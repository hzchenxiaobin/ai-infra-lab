<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "baeyh"，k = 2（v² mod 2 == 0 ⟺ v 为偶数）</text>

  <text x="92" y="62" font-size="12" fill="#555">s =</text>

  <rect x="120" y="44" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="62" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="156" y="44" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="174" y="62" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="192" y="44" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="62" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="228" y="44" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="62" text-anchor="middle" font-size="13" fill="#333">y</text>
  <rect x="264" y="44" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="282" y="62" text-anchor="middle" font-size="13" fill="#333">h</text>

  <text x="138" y="86" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="174" y="86" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="210" y="86" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="246" y="86" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="282" y="86" text-anchor="middle" font-size="10" fill="#999">4</text>

  <path d="M 116 94 L 116 102 L 262 102 L 262 94" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a">① "baey"（i=0..3，v=2，len=4）</text>

  <path d="M 152 110 L 152 118 L 300 118 L 300 110" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="228" y="134" text-anchor="middle" font-size="11" fill="#b85450">② "aeyh"（i=1..4，v=2，len=4）</text>

  <rect x="70" y="146" width="435" height="196" fill="#ffffff" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="70" y="222" width="435" height="24" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="70" y="294" width="435" height="24" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <line x1="70" y1="170" x2="505" y2="170" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="194" x2="505" y2="194" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="218" x2="505" y2="218" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="242" x2="505" y2="242" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="266" x2="505" y2="266" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="290" x2="505" y2="290" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="314" x2="505" y2="314" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="338" x2="505" y2="338" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <line x1="170" y1="146" x2="170" y2="342" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="146" x2="215" y2="342" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="146" x2="260" y2="342" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="146" x2="350" y2="342" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="146" x2="440" y2="342" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="120" y="163" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">子串</text>
  <text x="192" y="163" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">v</text>
  <text x="237" y="163" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">len</text>
  <text x="305" y="163" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2v == len</text>
  <text x="395" y="163" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">v² mod 2</text>
  <text x="472" y="163" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">命中</text>

  <text x="120" y="187" text-anchor="middle" font-size="11" fill="#333">"ba"</text>
  <text x="192" y="187" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="237" y="187" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="305" y="187" text-anchor="middle" font-size="11" fill="#333">2==2 ✓</text>
  <text x="395" y="187" text-anchor="middle" font-size="11" fill="#b85450">1 ✗</text>
  <text x="472" y="187" text-anchor="middle" font-size="11" fill="#999">✗</text>

  <text x="120" y="211" text-anchor="middle" font-size="11" fill="#333">"bae"</text>
  <text x="192" y="211" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="237" y="211" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="305" y="211" text-anchor="middle" font-size="11" fill="#b85450">4≠3 ✗</text>
  <text x="395" y="211" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="472" y="211" text-anchor="middle" font-size="11" fill="#999">✗</text>

  <text x="120" y="239" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"baey"</text>
  <text x="192" y="239" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="237" y="239" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="305" y="239" text-anchor="middle" font-size="11" fill="#4a7a3a">4==4 ✓</text>
  <text x="395" y="239" text-anchor="middle" font-size="11" fill="#4a7a3a">0 ✓</text>
  <text x="472" y="239" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <text x="120" y="263" text-anchor="middle" font-size="11" fill="#333">"baeyh"</text>
  <text x="192" y="263" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="237" y="263" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="305" y="263" text-anchor="middle" font-size="11" fill="#b85450">4≠5 ✗</text>
  <text x="395" y="263" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="472" y="263" text-anchor="middle" font-size="11" fill="#999">✗</text>

  <text x="120" y="287" text-anchor="middle" font-size="11" fill="#333">"ae"</text>
  <text x="192" y="287" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="237" y="287" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="305" y="287" text-anchor="middle" font-size="11" fill="#b85450">4≠2 ✗</text>
  <text x="395" y="287" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="472" y="287" text-anchor="middle" font-size="11" fill="#999">✗</text>

  <text x="120" y="311" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"aeyh"</text>
  <text x="192" y="311" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="237" y="311" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="305" y="311" text-anchor="middle" font-size="11" fill="#4a7a3a">4==4 ✓</text>
  <text x="395" y="311" text-anchor="middle" font-size="11" fill="#4a7a3a">0 ✓</text>
  <text x="472" y="311" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <text x="120" y="335" text-anchor="middle" font-size="11" fill="#333">"ey"</text>
  <text x="192" y="335" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="237" y="335" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="305" y="335" text-anchor="middle" font-size="11" fill="#333">2==2 ✓</text>
  <text x="395" y="335" text-anchor="middle" font-size="11" fill="#b85450">1 ✗</text>
  <text x="472" y="335" text-anchor="middle" font-size="11" fill="#999">✗</text>

  <rect x="70" y="360" width="435" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="287" y="385" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = 2：只有 "baey" 与 "aeyh" 同时闯过两关 ✓（与官方一致）</text>

  <text x="70" y="426" font-size="11" fill="#999">其余子串（"e"、"aey"、"eyh"、"y"、"yh"、"h"）在 2v == len 一关即出局；k = 2 要求 v 为偶数</text>
</svg>
