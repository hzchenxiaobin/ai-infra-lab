<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：挂载函数为对象属性 → 方法调用规则自动绑定 this</text>

  <!-- Step 1: function (this) -->
  <rect x="24" y="120" width="130" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="89" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">callPolyfill 内 this</text>
  <text x="89" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">待调用的函数</text>
  <text x="89" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">fn = function</text>
  <text x="89" y="200" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(b) { this.a+b }</text>
  <text x="89" y="224" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">此时 this 尚未绑定</text>

  <!-- arrow: attach -->
  <path d="M 154 180 L 212 180" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="183" y="170" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">挂载</text>
  <text x="183" y="198" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">context[key] = fn</text>

  <!-- Step 2: context object with fn attached -->
  <rect x="218" y="120" width="170" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="303" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">context 对象</text>
  <rect x="234" y="138" width="138" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="303" y="153" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">a: 5</text>
  <rect x="234" y="166" width="138" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="303" y="181" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[Symbol()]: fn ← 新挂载</text>
  <text x="303" y="206" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">fn 成为 context 的方法</text>
  <text x="303" y="224" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">(唯一键，不污染原属性)</text>

  <!-- arrow: invoke -->
  <path d="M 388 180 L 446 180" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="417" y="170" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">方法调用</text>
  <text x="417" y="198" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">context[key](...args)</text>

  <!-- Step 3: result with this bound -->
  <rect x="452" y="120" width="106" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="505" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">执行结果</text>
  <text x="505" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">this = context</text>
  <text x="505" y="172" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">this.a + b</text>
  <text x="505" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 5 + 7</text>
  <text x="505" y="220" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 12 ✓</text>

  <!-- bottom note -->
  <rect x="24" y="270" width="532" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">JS this 绑定规则：obj.fn() 的"方法调用"形式 → this 指向 obj（接收方）</text>
  <text x="290" y="308" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">把函数临时挂为属性，再用 obj.fn() 调用，即可"借壳"绑定 this，无需 Function.call</text>
</svg>
