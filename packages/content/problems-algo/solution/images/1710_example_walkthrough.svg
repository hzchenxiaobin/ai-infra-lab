<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例 1 演算：[[1,3],[2,2],[3,1]], truckSize = 4
  </text>

  <!-- Table header -->
  <rect x="40" y="48" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">步骤</text>
  <text x="130" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">类型</text>
  <text x="195" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">单元/箱</text>
  <text x="265" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">数量</text>
  <text x="330" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">take</text>
  <text x="395" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">累计单元</text>
  <text x="475" y="67" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">remaining</text>

  <!-- Column dividers (faint) -->
  <line x1="100" y1="48" x2="100" y2="200" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="48" x2="160" y2="200" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="230" y1="48" x2="230" y2="200" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="48" x2="300" y2="200" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="360" y1="48" x2="360" y2="200" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="430" y1="48" x2="430" y2="200" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: type 0, 3 units, count 1 -->
  <rect x="40" y="80" width="480" height="32" fill="#ffffff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第 0 类</text>
  <text x="195" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="265" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="100" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">min(1,4)=1</text>
  <text x="395" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="475" y="100" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3</text>

  <!-- Row 2: type 1, 2 units, count 2 -->
  <rect x="40" y="114" width="480" height="32" fill="#f6f9f6" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第 1 类</text>
  <text x="195" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="265" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="134" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">min(2,3)=2</text>
  <text x="395" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3+4=7</text>
  <text x="475" y="134" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">1</text>

  <!-- Row 3: type 2, 1 unit, count 3 -->
  <rect x="40" y="148" width="480" height="32" fill="#ffffff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="130" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第 2 类</text>
  <text x="195" y="168" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="265" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="330" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">min(3,1)=1</text>
  <text x="395" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">7+1=8</text>
  <text x="475" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0 ✓</text>

  <!-- Truck visual below table -->
  <text x="48" y="214" font-size="11" fill="#888" filter="url(#rough2)">装车结果：</text>

  <!-- 4 truck slots filled -->
  <rect x="120" y="222" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="252" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">车位1</text>

  <rect x="184" y="222" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="214" y="252" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">车位2</text>

  <rect x="248" y="222" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="278" y="252" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">车位3</text>

  <rect x="312" y="222" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="342" y="252" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">车位4</text>

  <!-- sum bracket -->
  <path d="M120,266 L372,266" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="284" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 + 2 + 2 + 1 = 8</text>

  <!-- Note box -->
  <rect x="50" y="300" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    第 3 步：第 2 类有 3 个箱子，但车位只剩 1
  </text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    → take = min(3, 1) = 1，只取 1 个，remaining 归零终止
  </text>
</svg>
