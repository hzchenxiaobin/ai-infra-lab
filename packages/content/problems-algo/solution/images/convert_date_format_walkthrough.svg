<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 个日期逐一格式化</text>

  <!-- ===== Left: Days input table ===== -->
  <text x="100" y="52" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Days 表（输入）</text>
  <rect x="40" y="58" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="100" y="72" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">day</text>

  <rect x="40" y="78" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="93" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" font-family="monospace">2022-04-12</text>

  <rect x="40" y="100" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="115" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" font-family="monospace">2021-08-09</text>

  <rect x="40" y="122" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="137" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" font-family="monospace">2020-06-26</text>

  <!-- arrow to right -->
  <path d="M160 96 L200 96" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="90" text-anchor="middle" font-size="7.5" fill="#888">行 ①</text>
  <path d="M160 111 L200 111" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="105" text-anchor="middle" font-size="7.5" fill="#888">行 ②</text>
  <path d="M160 133 L200 133" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="127" text-anchor="middle" font-size="7.5" fill="#888">行 ③</text>

  <!-- ===== Right: per-row decomposition table ===== -->
  <rect x="200" y="58" width="380" height="332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">逐行拆解：%W / %M / %e / %Y → 拼接输出</text>
  <line x1="215" y1="84" x2="565" y2="84" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- table header -->
  <text x="216" y="100" font-size="8" fill="#888" font-weight="bold">输入日期</text>
  <text x="284" y="100" font-size="8" fill="#446688" font-weight="bold">%W</text>
  <text x="330" y="100" font-size="8" fill="#4a7a3a" font-weight="bold">%M</text>
  <text x="380" y="100" font-size="8" fill="#d6a040" font-weight="bold">%e</text>
  <text x="420" y="100" font-size="8" fill="#b85450" font-weight="bold">%Y</text>
  <text x="468" y="100" font-size="8" fill="#888" font-weight="bold">→ 输出字符串</text>

  <!-- Row 1: 2022-04-12 -->
  <rect x="210" y="106" width="350" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="216" y="120" font-size="9" fill="#446688" font-weight="bold" font-family="monospace">2022-04-12</text>
  <text x="216" y="134" font-size="7.5" fill="#888">4 月 12 日</text>
  <text x="284" y="124" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Tuesday</text>
  <text x="284" y="138" text-anchor="middle" font-size="7" fill="#888">星期二</text>
  <text x="330" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">April</text>
  <text x="330" y="138" text-anchor="middle" font-size="7" fill="#888">四月</text>
  <text x="380" y="124" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">12</text>
  <text x="380" y="138" text-anchor="middle" font-size="7" fill="#888">无前导零</text>
  <text x="420" y="124" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2022</text>
  <text x="420" y="138" text-anchor="middle" font-size="7" fill="#888">4 位</text>
  <text x="466" y="130" font-size="8.5" fill="#333" font-family="monospace">Tuesday, April</text>
  <text x="466" y="142" font-size="8.5" fill="#333" font-family="monospace">12, 2022</text>

  <!-- Row 2: 2021-08-09 -->
  <rect x="210" y="150" width="350" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="216" y="164" font-size="9" fill="#4a7a3a" font-weight="bold" font-family="monospace">2021-08-09</text>
  <text x="216" y="178" font-size="7.5" fill="#888">8 月 9 日 ⚠</text>
  <text x="284" y="168" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Monday</text>
  <text x="284" y="182" text-anchor="middle" font-size="7" fill="#888">星期一</text>
  <text x="330" y="168" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">August</text>
  <text x="330" y="182" text-anchor="middle" font-size="7" fill="#888">八月</text>
  <text x="380" y="168" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">9</text>
  <text x="380" y="182" text-anchor="middle" font-size="7" fill="#b85450">非 09!</text>
  <text x="420" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2021</text>
  <text x="420" y="182" text-anchor="middle" font-size="7" fill="#888">4 位</text>
  <text x="466" y="174" font-size="8.5" fill="#333" font-family="monospace">Monday, August</text>
  <text x="466" y="186" font-size="8.5" fill="#333" font-family="monospace">9, 2021</text>

  <!-- Row 3: 2020-06-26 -->
  <rect x="210" y="194" width="350" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="216" y="208" font-size="9" fill="#d6a040" font-weight="bold" font-family="monospace">2020-06-26</text>
  <text x="216" y="222" font-size="7.5" fill="#888">6 月 26 日</text>
  <text x="284" y="212" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Friday</text>
  <text x="284" y="226" text-anchor="middle" font-size="7" fill="#888">星期五</text>
  <text x="330" y="212" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">June</text>
  <text x="330" y="226" text-anchor="middle" font-size="7" fill="#888">六月</text>
  <text x="380" y="212" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">26</text>
  <text x="380" y="226" text-anchor="middle" font-size="7" fill="#888">无前导零</text>
  <text x="420" y="212" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2020</text>
  <text x="420" y="226" text-anchor="middle" font-size="7" fill="#888">4 位</text>
  <text x="466" y="218" font-size="8.5" fill="#333" font-family="monospace">Friday, June</text>
  <text x="466" y="230" font-size="8.5" fill="#333" font-family="monospace">26, 2020</text>

  <line x1="215" y1="244" x2="565" y2="244" stroke="#d6a040" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- key observations -->
  <text x="216" y="262" font-size="9.5" fill="#d6a040" font-weight="bold">关键观察：</text>
  <text x="216" y="280" font-size="9" fill="#333">• <tspan fill="#446688" font-weight="bold">%W</tspan> 由日期推算星期：2022-04-12 是 Tuesday</text>
  <text x="216" y="296" font-size="9" fill="#333">  （DATE_FORMAT 内部完成星期计算，无需自己查日历）</text>
  <text x="216" y="314" font-size="9" fill="#b85450">⚠ 行 ② 的 8 月 9 日：<tspan fill="#d6a040" font-weight="bold">%e</tspan> 输出 "9" 而非 "09"</text>
  <text x="216" y="330" font-size="9" fill="#333">  若误用 <tspan fill="#888" font-family="monospace">%d</tspan> 会得到 "Monday, August 09, 2021" → 不符题意</text>
  <text x="216" y="348" font-size="9" fill="#333">• 月份名与星期名均首字母大写：<tspan fill="#4a7a3a" font-weight="bold">April</tspan> 非 april</text>
  <text x="216" y="366" font-size="9" fill="#333">• 三行输入 → 三行输出，行数严格不变</text>
  <text x="216" y="384" font-size="9" fill="#888">  （纯标量函数格式化，不涉及过滤/聚合/连接）</text>

  <!-- ===== Bottom: output result ===== -->
  <rect x="40" y="400" width="520" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="418" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">最终输出（day 列，3 行字符串）</text>
  <text x="300" y="436" text-anchor="middle" font-size="9" fill="#b85450" font-family="monospace">Tuesday, April 12, 2022  /  Monday, August 9, 2021  /  Friday, June 26, 2020</text>
</svg>
