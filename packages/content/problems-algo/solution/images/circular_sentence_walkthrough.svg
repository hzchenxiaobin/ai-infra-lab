<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐个衔接点检查两侧字符</text>
  <text x="30" y="46" font-size="11.5" fill="#888">sentence = "leetcode exercises sound delightful"</text>

  <!-- 字符串行：逐字符格子，空格用窄格标记 -->
  <!-- 字符: l e e t c o d e _ e x e r c i s e s _ s o u n d _ d e l i g h t f u l -->
  <!-- 起始 x=30, 每格 16 宽, 高 28, y=64 -->
  <g filter="url(#rough2)">
    <!-- leetcode -->
    <rect x="30" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="46" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="62" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="78" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="94" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="110" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="126" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="142" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <!-- space -->
    <rect x="158" y="64" width="12" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <!-- exercises -->
    <rect x="170" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="186" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="202" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="218" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="234" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="250" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="266" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="282" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="298" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <!-- space -->
    <rect x="314" y="64" width="12" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <!-- sound -->
    <rect x="326" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="342" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="358" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="374" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <!-- space -->
    <rect x="390" y="64" width="12" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <!-- delightful -->
    <rect x="402" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="418" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="434" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="450" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="466" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="482" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="498" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="514" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="530" y="64" width="16" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>

  <!-- 字符文本（每格中心） -->
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="38" y="83">l</text>
    <text x="54" y="83">e</text>
    <text x="70" y="83">e</text>
    <text x="86" y="83">t</text>
    <text x="102" y="83">c</text>
    <text x="118" y="83">o</text>
    <text x="134" y="83">d</text>
    <text x="150" y="83" fill="#b85450" font-weight="bold">e</text>
    <text x="164" y="83" fill="#d6a040">_</text>
    <text x="178" y="83" fill="#4a7a3a" font-weight="bold">e</text>
    <text x="194" y="83">x</text>
    <text x="210" y="83">e</text>
    <text x="226" y="83">r</text>
    <text x="242" y="83">c</text>
    <text x="258" y="83">i</text>
    <text x="274" y="83">s</text>
    <text x="290" y="83">e</text>
    <text x="306" y="83" fill="#b85450" font-weight="bold">s</text>
    <text x="320" y="83" fill="#d6a040">_</text>
    <text x="334" y="83" fill="#4a7a3a" font-weight="bold">s</text>
    <text x="350" y="83">o</text>
    <text x="366" y="83">u</text>
    <text x="382" y="83" fill="#b85450" font-weight="bold">d</text>
    <text x="396" y="83" fill="#d6a040">_</text>
    <text x="410" y="83" fill="#4a7a3a" font-weight="bold">d</text>
    <text x="426" y="83">e</text>
    <text x="442" y="83">l</text>
    <text x="458" y="83">i</text>
    <text x="474" y="83">g</text>
    <text x="490" y="83">h</text>
    <text x="506" y="83">t</text>
    <text x="522" y="83">f</text>
    <text x="538" y="83">u</text>
    <text x="554" y="83" fill="#b85450" font-weight="bold">l</text>
  </g>

  <!-- 三个衔接点的检查标注 -->
  <g font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <!-- 空格1 @ x=158..170, 中心 164 -->
    <path d="M 164 92 L 164 112" stroke="#446688" stroke-width="1.4" fill="none"/>
    <text x="164" y="126" text-anchor="middle">衔接点①</text>
    <text x="164" y="142" text-anchor="middle" fill="#333" font-weight="normal">s[8]='e' ?= s[10]='e'</text>
    <text x="164" y="158" text-anchor="middle" fill="#4a7a3a">✓ 相等</text>

    <!-- 空格2 @ x=314..326, 中心 320 -->
    <path d="M 320 92 L 320 112" stroke="#446688" stroke-width="1.4" fill="none"/>
    <text x="320" y="126" text-anchor="middle">衔接点②</text>
    <text x="320" y="142" text-anchor="middle" fill="#333" font-weight="normal">s[18]='s' ?= s[20]='s'</text>
    <text x="320" y="158" text-anchor="middle" fill="#4a7a3a">✓ 相等</text>

    <!-- 空格3 @ x=390..402, 中心 396 -->
    <path d="M 396 92 L 396 112" stroke="#446688" stroke-width="1.4" fill="none"/>
    <text x="396" y="126" text-anchor="middle">衔接点③</text>
    <text x="396" y="142" text-anchor="middle" fill="#333" font-weight="normal">s[24]='d' ?= s[26]='d'</text>
    <text x="396" y="158" text-anchor="middle" fill="#4a7a3a">✓ 相等</text>
  </g>

  <!-- 首尾闭合检查 -->
  <rect x="30" y="190" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">首尾闭合检查（条件②）</text>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#333">s[n−1] = s[34] = 'l'  ?=  s[0] = 'l'  → ✓ 相等</text>

  <!-- 结论 -->
  <rect x="160" y="262" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">三个衔接点 + 首尾全部相等 → return true</text>

  <!-- 反例提示 -->
  <rect x="30" y="324" width="500" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">反例："Leetcode is cool" → 衔接点① s[7]='e' ?= s[9]='i' ✗ 不等</text>
  <text x="280" y="370" text-anchor="middle" font-size="11.5" fill="#666">第一个衔接点即失败，无需继续，直接 return false</text>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#888">（区分大小写：'e' 与 'L' 也算不同字符）</text>
</svg>
