<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">节点类型由「有无父节点」+「有无子节点」二维决定</text>

  <!-- ===== Tree (left) ===== -->
  <text x="140" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例树结构</text>

  <!-- edges (drawn first, nodes on top) -->
  <path d="M140 82 L95 150" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M140 82 L210 150" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M95 150 L65 218" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M95 150 L135 218" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- Node 1 Root (blue) -->
  <ellipse cx="140" cy="82" rx="24" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="172" y="74" font-size="9.5" fill="#446688" font-weight="bold">Root</text>
  <text x="172" y="86" font-size="8" fill="#888">p_id=NULL</text>

  <!-- Node 2 Inner (orange) -->
  <ellipse cx="95" cy="150" rx="22" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="95" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="120" y="146" font-size="9.5" fill="#d6a040" font-weight="bold">Inner</text>
  <text x="120" y="158" font-size="8" fill="#888">有父有子</text>

  <!-- Node 3 Leaf (green) -->
  <ellipse cx="210" cy="150" rx="22" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="210" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="238" y="146" font-size="9.5" fill="#4a7a3a" font-weight="bold">Leaf</text>
  <text x="238" y="158" font-size="8" fill="#888">有父无子</text>

  <!-- Node 4 Leaf (green) -->
  <ellipse cx="65" cy="218" rx="20" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="65" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Node 5 Leaf (green) -->
  <ellipse cx="135" cy="218" rx="20" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="135" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- ===== Classification matrix (right) ===== -->
  <text x="420" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">分类矩阵</text>

  <!-- column headers -->
  <rect x="340" y="64" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="80" text-anchor="middle" font-size="8.5" fill="#555">有子节点?</text>
  <rect x="404" y="64" width="52" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">Yes</text>
  <rect x="456" y="64" width="52" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="482" y="80" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">No</text>

  <!-- row 1: has_parent = No -->
  <rect x="340" y="88" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="104" text-anchor="middle" font-size="8.5" fill="#555">有父节点?</text>
  <text x="372" y="120" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">No</text>
  <rect x="404" y="88" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="430" y="114" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">Root</text>
  <rect x="456" y="88" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="482" y="108" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">Root</text>
  <text x="482" y="122" text-anchor="middle" font-size="7" fill="#888">(单节点)</text>

  <!-- row 2: has_parent = Yes -->
  <rect x="340" y="132" width="64" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="156" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="404" y="132" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="430" y="158" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">Inner</text>
  <rect x="456" y="132" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="482" y="158" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Leaf</text>

  <!-- arrow from tree to matrix -->
  <path d="M270 150 L340 110" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Bottom notes ===== -->
  <rect x="30" y="278" width="500" height="106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="300" font-size="10.5" fill="#333" font-weight="bold">核心观察</text>
  <text x="50" y="318" font-size="10" fill="#555">• Root ⟺ p_id IS NULL（无父节点，不论有无子节点）</text>
  <text x="50" y="335" font-size="10" fill="#555">• Leaf ⟺ p_id IS NOT NULL 且 没有任何节点的 p_id 指向它（有父无子）</text>
  <text x="50" y="352" font-size="10" fill="#555">• Inner ⟺ p_id IS NOT NULL 且 至少有一个子节点（有父有子）</text>
  <text x="50" y="370" font-size="10" fill="#b85450" font-weight="bold">→ 有效树有且仅有一个 Root（p_id 为 NULL 的节点唯一）</text>
</svg>
