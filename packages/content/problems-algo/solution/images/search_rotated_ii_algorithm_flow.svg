<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="620" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">搜索旋转排序数组 II 算法流程</text>

  <!-- Init -->
  <rect x="90" y="42" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="240" y="82" text-anchor="middle" font-size="11" fill="#555">left = 0,  right = n − 1</text>

  <path d="M 240 96 L 240 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="240,118 350,160 240,202 130,160" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left ≤ right ?</text>
  <text x="240" y="174" text-anchor="middle" font-size="10.5" fill="#777">区间非空？</text>

  <!-- No -> false -->
  <path d="M 350 160 L 410 160 L 410 238" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="368" y="152" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="328" y="242" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="393" y="267" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes down -->
  <path d="M 240 202 L 240 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="258" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- mid compute -->
  <rect x="110" y="224" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="240" y="249" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mid = left + (right−left)/2</text>

  <path d="M 240 264 L 240 282" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- hit check -->
  <polygon points="240,286 340,322 240,358 140,322" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[mid] == target ?</text>

  <!-- Yes hit -> return true -->
  <path d="M 140 322 L 70 322 L 70 386" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="88" y="314" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="16" y="390" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="76" y="415" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- No down -->
  <path d="M 240 358 L 240 376" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="258" y="372" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Diamond: nums[left] vs nums[mid] -->
  <polygon points="240,380 370,424 240,468 110,424" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="420" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[left] vs nums[mid]</text>
  <text x="240" y="438" text-anchor="middle" font-size="10" fill="#777">三路判定</text>

  <!-- Branch 1: nums[left] < nums[mid] → left half ordered -->
  <path d="M 110 424 L 50 424 L 50 490" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="56" y="416" font-size="9.5" fill="#446688" font-weight="bold">&lt;</text>
  <rect x="6" y="494" width="140" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="510" text-anchor="middle" font-size="9" fill="#555">左半有序</text>
  <text x="76" y="524" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">target∈[left,mid)?</text>
  <text x="76" y="536" text-anchor="middle" font-size="8.5" fill="#888">是→right=mid−1</text>

  <!-- Branch 2: nums[left] > nums[mid] → right half ordered -->
  <path d="M 370 424 L 430 424 L 430 490" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="436" y="416" font-size="9.5" fill="#b85450" font-weight="bold">&gt;</text>
  <rect x="334" y="494" width="140" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="404" y="510" text-anchor="middle" font-size="9" fill="#555">右半有序</text>
  <text x="404" y="524" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">target∈(mid,right]?</text>
  <text x="404" y="536" text-anchor="middle" font-size="8.5" fill="#888">是→left=mid+1</text>

  <!-- Branch 3: nums[left] == nums[mid] → ambiguous, left++ -->
  <path d="M 240 468 L 240 490" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="256" y="484" font-size="9.5" fill="#d6a040" font-weight="bold">==</text>
  <rect x="170" y="494" width="140" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="510" text-anchor="middle" font-size="9" fill="#555">歧义！无法判断</text>
  <text x="240" y="524" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">left++（跳过重复）</text>
  <text x="240" y="536" text-anchor="middle" font-size="8.5" fill="#888">安全：nums[mid]≠target</text>

  <!-- loop back arrows -->
  <path d="M 76 544 L 76 560 L 240 560" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 404 544 L 404 560 L 240 560" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 240 544 L 240 560" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 240 560 L 240 580 L 440 580 L 440 160 L 350 160" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <text x="240" y="600" text-anchor="middle" font-size="10" fill="#888" font-style="italic">三分支都回到循环顶部</text>
</svg>
