<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：O(n²) 线性 DP</text>

  <!-- Step 1: init -->
  <rect x="150" y="40" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333">初始化：dp[0]=0，其余 dp[i]=−1</text>
  <path d="M 260 80 L 260 96" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: outer loop -->
  <rect x="150" y="96" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#333">外层循环 i = 1 → n−1</text>
  <path d="M 260 136 L 260 152" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: inner loop -->
  <rect x="150" y="152" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12" fill="#333">内层循环 j = 0 → i−1</text>
  <path d="M 260 192 L 260 208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: decision -->
  <polygon points="260,208 380,244 260,280 140,244" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#333">dp[j]≠−1 且</text>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#333">|nums[i]−nums[j]|≤t?</text>

  <!-- Yes branch -->
  <path d="M 140 244 L 60 244 L 60 290" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="80" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="20" y="290" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="310" text-anchor="middle" font-size="11" fill="#333">dp[i] =</text>
  <text x="95" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max(dp[i], dp[j]+1)</text>

  <!-- No branch -->
  <path d="M 380 244 L 460 244 L 460 290" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="236" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="350" y="290" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="316" text-anchor="middle" font-size="11" fill="#333">跳过该 j</text>

  <!-- end -->
  <path d="M 95 334 L 95 350 L 260 350 L 260 336" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="190" y="330" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 dp[n−1]</text>
</svg>
