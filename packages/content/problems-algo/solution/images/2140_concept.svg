<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">反向一维 DP：位置 i 的两种选择</text>

  <!-- Question boxes row -->
  <text x="40" y="54" font-size="11.5" fill="#555" font-weight="bold">题目序列（示例 1）：</text>

  <!-- Q0 -->
  <rect x="60" y="66" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="92" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Q0</text>
  <text x="92" y="100" text-anchor="middle" font-size="9.5" fill="#888">3, 2</text>

  <!-- Q1 (skipped, dashed) -->
  <rect x="158" y="66" width="64" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="84" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">Q1</text>
  <text x="190" y="100" text-anchor="middle" font-size="9.5" fill="#bbb">4, 3</text>

  <!-- Q2 (skipped, dashed) -->
  <rect x="256" y="66" width="64" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="288" y="84" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">Q2</text>
  <text x="288" y="100" text-anchor="middle" font-size="9.5" fill="#bbb">4, 4</text>

  <!-- Q3 -->
  <rect x="354" y="66" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="386" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Q3</text>
  <text x="386" y="100" text-anchor="middle" font-size="9.5" fill="#888">2, 5</text>

  <!-- ===== Choice A: Skip (gray, straight down from Q0) ===== -->
  <path d="M 92 110 L 92 148" stroke="#888" stroke-width="2.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="34" y="152" width="116" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="92" y="172" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">选择 A：跳过</text>
  <text x="92" y="190" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">dp[i] = dp[i+1]</text>

  <!-- ===== Choice B: Solve (red, arc from Q0 to Q3) ===== -->
  <path d="M 92 110 C 92 40, 386 40, 386 148" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="239" y="36" text-anchor="middle" font-size="10" fill="#b85450">解决 Q0 → 跳过 brainpower=2 题 → 落到 Q3</text>

  <rect x="328" y="152" width="116" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="386" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">选择 B：解决</text>
  <text x="386" y="190" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">pts[i] + dp[j]</text>

  <!-- j formula -->
  <text x="280" y="224" text-anchor="middle" font-size="10.5" fill="#888" font-family="'Comic Sans MS', monospace">j = i + brainpower[i] + 1（解决后跳到的下一可做题）</text>

  <!-- Divider -->
  <path d="M 40 238 L 520 238" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Key formula ===== -->
  <rect x="40" y="250" width="480" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="272" font-size="11.5" fill="#333" font-weight="bold">核心转移方程（从右往左递推，dp[n] = 0 哨兵）：</text>
  <text x="56" y="296" font-size="13" fill="#446688" font-family="'Comic Sans MS', monospace" font-weight="bold">dp[i] = max( dp[i+1],  points[i] + dp[j] )</text>
  <text x="56" y="316" font-size="11" fill="#555">• 跳过：dp[i+1]——不拿分，进入下一题</text>
  <text x="56" y="334" font-size="11" fill="#555">• 解决：points[i] + dp[j]——拿分后跳到 j 继续</text>
  <text x="56" y="352" font-size="11" fill="#b85450" font-weight="bold">→ j &gt; i 恒成立，反向递推保证 dp[j] 已算好</text>
</svg>
