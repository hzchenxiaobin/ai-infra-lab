<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：pattern 是 query 的子序列 + 多余大写字母禁止</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">两条规则：① pattern 字符按序出现 ② query 多余字符必须全为小写</text>

  <!-- ===== Row 1: FooBar / FB → match ===== -->
  <text x="40" y="92" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 匹配</text>
  <text x="40" y="112" font-size="11" fill="#888" filter="url(#rough2)">pattern = "FB"</text>

  <g filter="url(#rough2)" font-size="18" font-weight="bold">
    <!-- query "FooBar" each char in a box -->
    <!-- F matched -->
    <rect x="120" y="80" width="38" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="139" y="108" text-anchor="middle" fill="#4a7a3a">F</text>
    <!-- o lowercase insert -->
    <rect x="158" y="80" width="32" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="174" y="108" text-anchor="middle" fill="#446688" font-size="15">o</text>
    <!-- o lowercase insert -->
    <rect x="190" y="80" width="32" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="206" y="108" text-anchor="middle" fill="#446688" font-size="15">o</text>
    <!-- B matched -->
    <rect x="222" y="80" width="38" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="241" y="108" text-anchor="middle" fill="#4a7a3a">B</text>
    <!-- a lowercase insert -->
    <rect x="260" y="80" width="32" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="276" y="108" text-anchor="middle" fill="#446688" font-size="15">a</text>
    <!-- r lowercase insert -->
    <rect x="292" y="80" width="32" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="308" y="108" text-anchor="middle" fill="#446688" font-size="15">r</text>
  </g>

  <!-- pattern "FB" below, aligned with matched positions -->
  <g filter="url(#rough2)" font-size="12" fill="#4a7a3a">
    <text x="139" y="138" text-anchor="middle">↑ F</text>
    <text x="241" y="138" text-anchor="middle">↑ B</text>
  </g>

  <!-- annotations for row 1 -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="360" y="78" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
    <text x="445" y="98" text-anchor="middle" fill="#4a7a3a">绿格 = pattern 匹配字符</text>
    <rect x="360" y="112" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="445" y="132" text-anchor="middle" fill="#446688">蓝格 = 插入的小写字母</text>
  </g>

  <!-- divider -->
  <path d="M 40 160 Q 280 168 520 160" stroke="#ddd" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Row 2: ForceFeedBack / FB → fail ===== -->
  <text x="40" y="196" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 失败</text>
  <text x="40" y="216" font-size="11" fill="#888" filter="url(#rough2)">pattern = "FB"</text>

  <g filter="url(#rough2)" font-size="18" font-weight="bold">
    <!-- F matched -->
    <rect x="100" y="184" width="38" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="119" y="212" text-anchor="middle" fill="#4a7a3a">F</text>
    <!-- o lowercase -->
    <rect x="138" y="184" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="152" y="212" text-anchor="middle" fill="#446688" font-size="15">o</text>
    <!-- r lowercase -->
    <rect x="166" y="184" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="180" y="212" text-anchor="middle" fill="#446688" font-size="15">r</text>
    <!-- c lowercase -->
    <rect x="194" y="184" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="208" y="212" text-anchor="middle" fill="#446688" font-size="15">c</text>
    <!-- e lowercase -->
    <rect x="222" y="184" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="236" y="212" text-anchor="middle" fill="#446688" font-size="15">e</text>
    <!-- F uppercase NOT matched → RED fail -->
    <rect x="250" y="184" width="38" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" rx="5"/>
    <text x="269" y="212" text-anchor="middle" fill="#b85450">F</text>
    <!-- e lowercase -->
    <rect x="288" y="184" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="302" y="212" text-anchor="middle" fill="#446688" font-size="15">e</text>
    <!-- e lowercase -->
    <rect x="316" y="184" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="330" y="212" text-anchor="middle" fill="#446688" font-size="15">e</text>
    <!-- d lowercase -->
    <rect x="344" y="184" width="28" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="358" y="212" text-anchor="middle" fill="#446688" font-size="15">d</text>
    <!-- B (would match but we already failed) -->
    <rect x="372" y="184" width="32" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="388" y="212" text-anchor="middle" fill="#bbb" font-size="15">B</text>
    <!-- a -->
    <rect x="404" y="184" width="28" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="418" y="212" text-anchor="middle" fill="#bbb" font-size="15">a</text>
    <!-- c -->
    <rect x="432" y="184" width="28" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="446" y="212" text-anchor="middle" fill="#bbb" font-size="15">c</text>
    <!-- k -->
    <rect x="460" y="184" width="28" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="474" y="212" text-anchor="middle" fill="#bbb" font-size="15">k</text>
  </g>

  <!-- arrow pointing to the offending F -->
  <g filter="url(#rough2)">
    <path d="M 269 248 L 269 230" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>
    <text x="269" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">多余大写 F</text>
    <text x="269" y="276" text-anchor="middle" font-size="10" fill="#b85450">≠ pattern[j]='B'</text>
  </g>

  <!-- legend / rule boxes at bottom -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="60" y="300" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="170" y="320" text-anchor="middle" fill="#d6a040" font-weight="bold">规则 ① 子序列</text>
    <text x="170" y="336" text-anchor="middle" fill="#d6a040">pattern 字符按序出现在 query</text>

    <rect x="300" y="300" width="220" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="410" y="320" text-anchor="middle" fill="#b85450" font-weight="bold">规则 ② 大写闸门</text>
    <text x="410" y="336" text-anchor="middle" fill="#b85450">多余大写字母 → 立即失败</text>
  </g>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">绿=pattern 匹配｜蓝=小写填充｜红=多余大写（禁止）｜灰=未扫描</text>
</svg>
