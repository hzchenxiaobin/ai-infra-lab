<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：author_id = viewer_id 即自浏览 → DISTINCT 去重 → ORDER BY</text>

  <!-- ===== Left: Views table (raw) ===== -->
  <text x="100" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Views 表（原始，无主键）</text>
  <!-- header -->
  <rect x="20" y="60" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="75" font-size="8" fill="#446688" font-weight="bold">article</text>
  <text x="78" y="75" font-size="8" fill="#446688" font-weight="bold">author</text>
  <text x="120" y="75" font-size="8" fill="#446688" font-weight="bold">viewer</text>
  <text x="160" y="75" font-size="8" fill="#446688" font-weight="bold">date</text>
  <line x1="58" y1="60" x2="58" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="98" y1="60" x2="98" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="140" y1="60" x2="140" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: 1,3,5 - not self -->
  <rect x="20" y="82" width="160" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="94" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="78" y="94" text-anchor="middle" font-size="8" fill="#888">3</text>
  <text x="120" y="94" text-anchor="middle" font-size="8" fill="#888">5</text>
  <text x="160" y="94" text-anchor="middle" font-size="7" fill="#aaa">08-01</text>
  <line x1="58" y1="82" x2="58" y2="98" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="98" y1="82" x2="98" y2="98" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="140" y1="82" x2="140" y2="98" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 2: 1,3,6 - not self -->
  <rect x="20" y="98" width="160" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="110" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="78" y="110" text-anchor="middle" font-size="8" fill="#888">3</text>
  <text x="120" y="110" text-anchor="middle" font-size="8" fill="#888">6</text>
  <text x="160" y="110" text-anchor="middle" font-size="7" fill="#aaa">08-02</text>
  <line x1="58" y1="98" x2="58" y2="114" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="98" y1="98" x2="98" y2="114" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="140" y1="98" x2="140" y2="114" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 3: 2,7,7 - SELF VIEW (highlighted) -->
  <rect x="20" y="114" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="126" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="78" y="126" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="120" y="126" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="160" y="126" text-anchor="middle" font-size="7" fill="#4a7a3a">08-01</text>
  <line x1="58" y1="114" x2="58" y2="130" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="98" y1="114" x2="98" y2="130" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="140" y1="114" x2="140" y2="130" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="188" y="126" font-size="8" fill="#4a7a3a" font-weight="bold">✓ 7=7</text>

  <!-- row 4: 2,7,6 - not self -->
  <rect x="20" y="130" width="160" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="142" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="78" y="142" text-anchor="middle" font-size="8" fill="#888">7</text>
  <text x="120" y="142" text-anchor="middle" font-size="8" fill="#888">6</text>
  <text x="160" y="142" text-anchor="middle" font-size="7" fill="#aaa">08-02</text>
  <line x1="58" y1="130" x2="58" y2="146" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="98" y1="130" x2="98" y2="146" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="140" y1="130" x2="140" y2="146" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 5: 4,7,1 - not self -->
  <rect x="20" y="146" width="160" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="158" text-anchor="middle" font-size="8" fill="#888">4</text>
  <text x="78" y="158" text-anchor="middle" font-size="8" fill="#888">7</text>
  <text x="120" y="158" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="160" y="158" text-anchor="middle" font-size="7" fill="#aaa">07-22</text>
  <line x1="58" y1="146" x2="58" y2="162" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="98" y1="146" x2="98" y2="162" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="140" y1="146" x2="140" y2="162" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 6: 3,4,4 - SELF VIEW (highlighted) -->
  <rect x="20" y="162" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="174" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="78" y="174" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="120" y="174" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="160" y="174" text-anchor="middle" font-size="7" fill="#4a7a3a">07-21</text>
  <line x1="58" y1="162" x2="58" y2="178" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="98" y1="162" x2="98" y2="178" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="140" y1="162" x2="140" y2="178" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="188" y="174" font-size="8" fill="#4a7a3a" font-weight="bold">✓ 4=4</text>

  <!-- row 7: 3,4,4 - SELF VIEW DUPLICATE (highlighted, dashed) -->
  <rect x="20" y="178" width="160" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="40" y="190" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="78" y="190" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">4</text>
  <text x="120" y="190" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">4</text>
  <text x="160" y="190" text-anchor="middle" font-size="7" fill="#d6a040">07-21</text>
  <line x1="58" y1="178" x2="58" y2="194" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="98" y1="178" x2="98" y2="194" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="140" y1="178" x2="140" y2="194" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="188" y="190" font-size="7" fill="#d6a040">⚠ 重复行</text>

  <!-- arrow from Views to step 1 -->
  <path d="M190 152 L228 152" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="209" y="146" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">WHERE</text>
  <text x="209" y="164" text-anchor="middle" font-size="7" fill="#d6a040">author=viewer</text>

  <!-- ===== Middle: After WHERE filter ===== -->
  <text x="310" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">WHERE 筛选后（3 行自浏览）</text>
  <rect x="240" y="60" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="75" font-size="8" fill="#4a7a3a" font-weight="bold">author</text>
  <text x="320" y="75" font-size="8" fill="#4a7a3a" font-weight="bold">viewer</text>
  <line x1="295" y1="60" x2="295" y2="82" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- filtered row 1: 7,7 -->
  <rect x="240" y="82" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="320" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <line x1="295" y1="82" x2="295" y2="102" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- filtered row 2: 4,4 -->
  <rect x="240" y="102" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="320" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <line x1="295" y1="102" x2="295" y2="122" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- filtered row 3: 4,4 (duplicate) -->
  <rect x="240" y="122" width="140" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="270" y="136" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4</text>
  <text x="320" y="136" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4</text>
  <text x="365" y="136" font-size="7" fill="#d6a040">⚠重复</text>
  <line x1="295" y1="122" x2="295" y2="142" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- arrow from middle to right -->
  <path d="M388 110 L426 110" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="407" y="104" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">DISTINCT</text>
  <text x="407" y="122" text-anchor="middle" font-size="7" fill="#b85450">+ORDER BY</text>

  <!-- ===== Right: Final result ===== -->
  <text x="490" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最终结果</text>
  <rect x="440" y="60" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="75" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">id</text>

  <rect x="440" y="82" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="96" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>

  <rect x="440" y="102" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7</text>

  <!-- ===== Bottom: Key insights ===== -->
  <rect x="20" y="210" width="540" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="230" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键洞察</text>

  <text x="40" y="250" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">author_id = viewer_id</tspan>：同一套用户 ID，相等 = 作者浏览了自己的文章</text>
  <text x="40" y="268" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">DISTINCT</tspan>：表无主键可能有重复行（如两行 4=4 完全相同），去重保证每人一条</text>
  <text x="40" y="286" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">AS id</tspan>：输出列重命名为 id；<tspan fill="#d6a040" font-weight="bold">ORDER BY id</tspan> 用别名排序（ORDER BY 在 SELECT 之后执行）</text>
  <text x="40" y="304" font-size="9.5" fill="#333">• <tspan fill="#888">灰色行</tspan> = 被过滤；<tspan fill="#4a7a3a">绿色行</tspan> = 自浏览；<tspan fill="#d6a040">橙色虚线</tspan> = 重复行被 DISTINCT 去掉</text>

  <!-- SQL snippet at bottom -->
  <rect x="20" y="330" width="540" height="50" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="35" y="348" font-size="9.5" fill="#446688" font-family="monospace">SELECT DISTINCT author_id AS id</text>
  <text x="35" y="362" font-size="9.5" fill="#446688" font-family="monospace">FROM Views</text>
  <text x="35" y="376" font-size="9.5" fill="#446688" font-family="monospace">WHERE author_id = viewer_id ORDER BY id;</text>
</svg>
