<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <g id="you">
      <polygon points="0,-8 1.88,-2.59 7.61,-2.47 3.04,0.99 4.70,6.47 0,3.2 -4.70,6.47 -3.04,0.99 -7.61,-2.47 -1.88,-2.59" fill="#b85450" stroke="#7a3030" stroke-width="0.8"/>
    </g>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：每辆车的「最晚上车时刻」</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">未满 → 发车时刻；已满 → 末位乘客前一刻（须跳过连续占位）</text>

  <!-- ============ Panel A: not full ============ -->
  <rect x="36" y="64" width="190" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="131" y="81" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">情况 A · 车未满 → 发车时刻上车</text>

  <rect x="430" y="64" width="92" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="476" y="79" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1/2 · 未满</text>

  <!-- timeline A -->
  <line x1="60" y1="130" x2="500" y2="130" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="506" y="134" font-size="10" fill="#888">时间</text>

  <!-- passenger dot at t=2 -->
  <circle cx="150" cy="130" r="6.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="150" y="116" text-anchor="middle" font-size="9" fill="#888">乘客</text>

  <!-- bus bar at t=10 -->
  <rect x="392" y="114" width="16" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="108" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">车·发车</text>
  <text x="400" y="162" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">10</text>

  <!-- you star at t=10 (on top of bus bar) -->
  <use href="#you" x="400" y="130" filter="url(#rough2)"/>
  <text x="400" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">你 → 10（有空位，到点即上）</text>

  <!-- divider -->
  <line x1="40" y1="200" x2="520" y2="200" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Panel B: full ============ -->
  <rect x="36" y="214" width="220" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="146" y="231" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">情况 B · 车已满 → 末位乘客前一刻</text>

  <rect x="430" y="214" width="92" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="476" y="229" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2/2 · 已满</text>
  <text x="430" y="252" font-size="10" fill="#888">末位乘客 = 16</text>

  <!-- timeline B -->
  <line x1="60" y1="290" x2="500" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="506" y="294" font-size="10" fill="#888">时间</text>

  <!-- passenger dots 15,16,17,18 consecutive -->
  <circle cx="190" cy="290" r="6.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">15</text>
  <circle cx="230" cy="290" r="6.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">16</text>
  <circle cx="270" cy="290" r="6.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">17</text>
  <circle cx="310" cy="290" r="6.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">18</text>

  <!-- block bracket -->
  <path d="M184 270 L184 264 L316 264 L316 270" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="250" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">连续占位块 15–18</text>

  <!-- bus bar at 20 -->
  <rect x="392" y="274" width="16" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="268" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">车·发车</text>
  <text x="400" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">20</text>

  <!-- you star at 14 (block start 15 minus 1) -->
  <use href="#you" x="150" y="290" filter="url(#rough2)"/>
  <text x="150" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">14</text>
  <text x="150" y="324" text-anchor="middle" font-size="9.5" fill="#b85450">你</text>

  <!-- skip arrow: 15 occupied -> jump to block start - 1 -->
  <path d="M184 348 L160 348" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="172" y="340" text-anchor="middle" font-size="9.5" fill="#b85450">15 被占</text>
  <text x="250" y="352" text-anchor="middle" font-size="10" fill="#b85450">块首 15 − 1 = 14（一次跳过整段连续占位）</text>

  <!-- summary box -->
  <rect x="40" y="372" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">答案 = max 每车候选：未满取发车时刻，已满取「末位 − 1」</text>
  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#446688">若该时刻被占，则取所属连续块的块首 − 1（预处理块首 + 二分定位）</text>
</svg>
