<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：逐行 LEFT JOIN 匹配 NPV，无匹配填 0</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">左表 Queries 的每一行去找 NPV 中 (id, year) 相同的行，找到取 npv，找不到填 0</text>

  <!-- Queries table header -->
  <rect x="40" y="60" width="220" height="24" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="76" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">id</text>
  <text x="140" y="76" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">year</text>
  <text x="225" y="76" text-anchor="end" font-size="9" fill="#c0d0e0">Queries（左表）</text>

  <!-- NPV table header -->
  <rect x="340" y="60" width="240" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="370" y="76" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">id</text>
  <text x="440" y="76" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">year</text>
  <text x="530" y="76" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">npv</text>
  <text x="565" y="76" text-anchor="end" font-size="9" fill="#b0d0a0">NPV（右表）</text>

  <!-- Row 1: (1, 2019) → 113 -->
  <rect x="40" y="86" width="220" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="100" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="140" y="100" text-anchor="middle" font-size="10" fill="#555">2019</text>
  <path d="M 264 96 L 340 96" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="86" width="240" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="370" y="100" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="440" y="100" text-anchor="middle" font-size="10" fill="#555">2019</text>
  <text x="530" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">113</text>

  <!-- Row 2: (2, 2008) → 50 -->
  <rect x="40" y="108" width="220" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="122" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="140" y="122" text-anchor="middle" font-size="10" fill="#555">2008</text>
  <path d="M 264 118 L 340 118" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="108" width="240" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="370" y="122" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="440" y="122" text-anchor="middle" font-size="10" fill="#555">2008</text>
  <text x="530" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">50</text>

  <!-- Row 3: (3, 2009) → 200 -->
  <rect x="40" y="130" width="220" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="144" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="140" y="144" text-anchor="middle" font-size="10" fill="#555">2009</text>
  <path d="M 264 140 L 340 140" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="130" width="240" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="370" y="144" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="440" y="144" text-anchor="middle" font-size="10" fill="#555">2009</text>
  <text x="530" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">200</text>

  <!-- Row 4: (7, 2020) → 30 -->
  <rect x="40" y="152" width="220" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="10" fill="#555">7</text>
  <text x="140" y="166" text-anchor="middle" font-size="10" fill="#555">2020</text>
  <path d="M 264 162 L 340 162" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="152" width="240" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="370" y="166" text-anchor="middle" font-size="10" fill="#555">7</text>
  <text x="440" y="166" text-anchor="middle" font-size="10" fill="#555">2020</text>
  <text x="530" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">30</text>

  <!-- Row 5: (13, 2019) → 40 -->
  <rect x="40" y="174" width="220" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="188" text-anchor="middle" font-size="10" fill="#555">13</text>
  <text x="140" y="188" text-anchor="middle" font-size="10" fill="#555">2019</text>
  <path d="M 264 184 L 340 184" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="174" width="240" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="370" y="188" text-anchor="middle" font-size="10" fill="#555">13</text>
  <text x="440" y="188" text-anchor="middle" font-size="10" fill="#555">2019</text>
  <text x="530" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">40</text>

  <!-- Row 6: (1, 2018) → 100 -->
  <rect x="40" y="196" width="220" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="140" y="210" text-anchor="middle" font-size="10" fill="#555">2018</text>
  <path d="M 264 206 L 340 206" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="196" width="240" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="370" y="210" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="440" y="210" text-anchor="middle" font-size="10" fill="#555">2018</text>
  <text x="530" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">100</text>

  <!-- Row 7: (2, 2019) → no match → 0 -->
  <rect x="40" y="218" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="232" text-anchor="middle" font-size="10" fill="#d6a040">2</text>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="#d6a040">2019</text>
  <text x="225" y="232" text-anchor="end" font-size="9" fill="#d6a040">⚠无匹配</text>
  <path d="M 264 228 L 340 228" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="218" width="240" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="460" y="232" text-anchor="middle" font-size="10" fill="#b85450">NULL → IFNULL → 0</text>

  <!-- Row 8: (13, 2018) → no match → 0 -->
  <rect x="40" y="240" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="254" text-anchor="middle" font-size="10" fill="#d6a040">13</text>
  <text x="140" y="254" text-anchor="middle" font-size="10" fill="#d6a040">2018</text>
  <text x="225" y="254" text-anchor="end" font-size="9" fill="#d6a040">⚠无匹配</text>
  <path d="M 264 250 L 340 250" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="240" width="240" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="460" y="254" text-anchor="middle" font-size="10" fill="#b85450">NULL → IFNULL → 0</text>

  <!-- Separator -->
  <line x1="40" y1="272" x2="580" y2="272" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Result table -->
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终输出结果</text>

  <rect x="120" y="302" width="380" height="24" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="318" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">id</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">year</text>
  <text x="430" y="318" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">npv</text>

  <rect x="120" y="326" width="380" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="160" y="340" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#555">2019</text>
  <text x="430" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">113</text>

  <rect x="120" y="346" width="380" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="160" y="360" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#555">2008</text>
  <text x="430" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">50</text>

  <rect x="120" y="366" width="380" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="160" y="380" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#555">2009</text>
  <text x="430" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">200</text>

  <rect x="120" y="386" width="380" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="160" y="400" text-anchor="middle" font-size="10" fill="#555">7</text>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#555">2020</text>
  <text x="430" y="400" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">30</text>

  <rect x="120" y="406" width="380" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="160" y="420" text-anchor="middle" font-size="10" fill="#555">13</text>
  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#555">2019</text>
  <text x="430" y="420" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">40</text>

  <rect x="120" y="426" width="380" height="20" fill="#e6f4ea" stroke="#a0c890" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="160" y="440" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#555">2018</text>
  <text x="430" y="440" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">100</text>

  <rect x="120" y="446" width="380" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="460" text-anchor="middle" font-size="10" fill="#d6a040">2</text>
  <text x="280" y="460" text-anchor="middle" font-size="10" fill="#d6a040">2019</text>
  <text x="430" y="460" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <rect x="120" y="466" width="380" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="480" text-anchor="middle" font-size="10" fill="#d6a040">13</text>
  <text x="280" y="480" text-anchor="middle" font-size="10" fill="#d6a040">2018</text>
  <text x="430" y="480" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <!-- Legend -->
  <rect x="40" y="498" width="540" height="32" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="55" y="508" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="519" font-size="10" fill="#555">匹配成功 → 取 npv 原值</text>
  <rect x="255" y="508" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="519" font-size="10" fill="#555">无匹配 → IFNULL 填 0</text>
  <text x="420" y="519" font-size="10" fill="#888">结果行数 = Queries 行数（8 行）</text>
</svg>
