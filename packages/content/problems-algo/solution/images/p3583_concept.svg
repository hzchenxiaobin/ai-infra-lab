<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：固定中间点 j —— 左右被同一个 t = 2·nums[j] 参数化</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以 nums = [8, 4, 2, 8, 4]、j = 1 为例（示例 3）</text>

  <!-- ===== 数组格子：左绿 / j 橙 / 右蓝 ===== -->
  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <rect x="130" y="52" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="184" y="52" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="238" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="292" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="346" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="152" y="73" filter="url(#rough2)">8</text>
    <text x="206" y="73" fill="#8a6d3a" filter="url(#rough2)">4</text>
    <text x="260" y="73" filter="url(#rough2)">2</text>
    <text x="314" y="73" filter="url(#rough2)">8</text>
    <text x="368" y="73" filter="url(#rough2)">4</text>
  </g>
  <g font-size="9" fill="#888" text-anchor="middle">
    <text x="152" y="96" filter="url(#rough2)">0</text>
    <text x="206" y="96" filter="url(#rough2)">1</text>
    <text x="260" y="96" filter="url(#rough2)">2</text>
    <text x="314" y="96" filter="url(#rough2)">3</text>
    <text x="368" y="96" filter="url(#rough2)">4</text>
  </g>

  <!-- 区域虚线框与 j 标记 -->
  <rect x="124" y="46" width="56" height="50" rx="6" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="232" y="46" width="170" height="50" rx="6" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="152" y="108" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">i &lt; j</text>
  <text x="317" y="108" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">k &gt; j</text>
  <text x="206" y="40" text-anchor="middle" font-size="11" fill="#b8860b" font-weight="bold" filter="url(#rough2)">j</text>
  <path d="M 206 42 L 206 50" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>

  <!-- 三张卡片：左计数 / 共同目标 / 右计数 -->
  <path d="M 152 112 L 96 128" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 206 90 L 254 128" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 317 112 L 424 128" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="16" y="132" width="150" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="91" y="150" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">左侧计数 pre（i &lt; j）</text>
    <text x="91" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">pre[8] = 1</text>
    <text x="91" y="193" text-anchor="middle" font-size="9" fill="#555">只有下标 0 的 8 等于 t</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="185" y="132" width="150" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="150" text-anchor="middle" font-size="10.5" fill="#8a6d3a" font-weight="bold">两侧共同目标</text>
    <text x="260" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t = 2 × 4 = 8</text>
    <text x="260" y="193" text-anchor="middle" font-size="9" fill="#555">nums[i] = t 且 nums[k] = t</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="354" y="132" width="150" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="429" y="150" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">右侧计数 nxt（k &gt; j）</text>
    <text x="429" y="173" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">nxt[8] = 1</text>
    <text x="429" y="193" text-anchor="middle" font-size="9" fill="#555">只有下标 3 的 8 等于 t</text>
  </g>

  <!-- 贡献公式 -->
  <path d="M 91 212 L 182 226" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 260 212 L 260 226" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 429 212 L 338 226" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="105" y="230" width="310" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="260" y="250" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">ans += pre[t] × nxt[t] = 1 × 1 = 1</text>
    <text x="260" y="267" text-anchor="middle" font-size="8.5" fill="#666">乘法原理：i 与 k 独立选取，任意组合都合法</text>
  </g>

  <!-- 两张说明卡 -->
  <g filter="url(#rough2)">
    <rect x="16" y="286" width="242" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="137" y="304" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">值域 [0, 10⁵] ⇒ 数组桶替哈希表</text>
    <text x="137" y="322" text-anchor="middle" font-size="9" fill="#555">t = 2x ≤ 2×10⁵：定长桶 O(1) 增减与查询</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="262" y="286" width="242" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="383" y="304" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">两桶一趟扫描动态维护</text>
    <text x="383" y="322" text-anchor="middle" font-size="9" fill="#555">出右 → 算贡献 → 进左，j 每右移一步</text>
  </g>

  <!-- 底部结论横幅 -->
  <g filter="url(#rough2)">
    <rect x="16" y="346" width="488" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="363" text-anchor="middle" font-size="10" fill="#8a6d3a" font-weight="bold">遍历所有 j 累加：j = 2（t = 4）再贡献 1 × 1 = 1，本例答案共 2 ✓</text>
  </g>
</svg>
