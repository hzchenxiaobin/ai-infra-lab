<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>

  <text x="370" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：target=5, k=2，BFS 逐层扩展</text>

  <!-- ===== 左：树（按层着色） ===== -->
  <text x="175" y="50" text-anchor="middle" font-size="11" fill="#888">无向图（颜色 = BFS 层）</text>

  <!-- 无向边 -->
  <line x1="175" y1="70" x2="120" y2="130" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="175" y1="70" x2="230" y2="130" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="120" y1="130" x2="90" y2="195" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="120" y1="130" x2="150" y2="195" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="230" y1="130" x2="210" y2="195" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="230" y1="130" x2="270" y2="195" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="150" y1="195" x2="120" y2="260" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="150" y1="195" x2="180" y2="260" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 节点 -->
  <!-- 3: layer1 绿 -->
  <circle cx="175" cy="70" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="75" text-anchor="middle" font-size="12" fill="#333">3</text>
  <!-- 5: layer0 红 target -->
  <circle cx="120" cy="130" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <!-- 1: layer2 橙 -->
  <circle cx="230" cy="130" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="135" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- 6: layer1 绿 -->
  <circle cx="90" cy="195" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="200" text-anchor="middle" font-size="11" fill="#333">6</text>
  <!-- 2: layer1 绿 -->
  <circle cx="150" cy="195" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#333">2</text>
  <!-- 0: layer3 灰 -->
  <circle cx="210" cy="195" r="13" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="210" y="200" text-anchor="middle" font-size="11" fill="#888">0</text>
  <!-- 8: layer3 灰 -->
  <circle cx="270" cy="195" r="13" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="270" y="200" text-anchor="middle" font-size="11" fill="#888">8</text>
  <!-- 7: layer2 橙 -->
  <circle cx="120" cy="260" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="265" text-anchor="middle" font-size="11" fill="#333">7</text>
  <!-- 4: layer2 橙 -->
  <circle cx="180" cy="260" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="265" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 层标注 -->
  <text x="120" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-style="italic">层0</text>
  <text x="40" y="195" font-size="9" fill="#4a7a3a" font-style="italic">层1</text>
  <text x="300" y="135" font-size="9" fill="#d6a040" font-style="italic">层2</text>
  <text x="300" y="200" font-size="9" fill="#bbb" font-style="italic">层3</text>

  <!-- ===== 右：逐层扩展表 ===== -->
  <text x="540" y="50" text-anchor="middle" font-size="11" fill="#888">BFS 逐层扩展过程</text>

  <!-- 表头 -->
  <rect x="370" y="60" width="50" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="78" text-anchor="middle" font-size="11" fill="#555">距离</text>
  <rect x="425" y="60" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="78" text-anchor="middle" font-size="11" fill="#555">frontier</text>
  <rect x="550" y="60" width="180" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="640" y="78" text-anchor="middle" font-size="11" fill="#555">新扩展邻居</text>

  <!-- 行：dist=0 -->
  <rect x="370" y="92" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="113" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="425" y="92" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="113" text-anchor="middle" font-size="11" fill="#333">{ 5 }</text>
  <rect x="550" y="92" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="640" y="113" text-anchor="middle" font-size="11" fill="#333">→ 3, 6, 2</text>

  <!-- 行：dist=1 -->
  <rect x="370" y="130" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="151" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="425" y="130" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="151" text-anchor="middle" font-size="11" fill="#333">{ 3, 6, 2 }</text>
  <rect x="550" y="130" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="640" y="151" text-anchor="middle" font-size="11" fill="#333">→ 1, 7, 4</text>

  <!-- 行：dist=2 -->
  <rect x="370" y="168" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="189" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="425" y="168" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="485" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">{ 1, 7, 4 }</text>
  <rect x="550" y="168" width="180" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="640" y="189" text-anchor="middle" font-size="11" fill="#888">停止（dist==k）</text>

  <!-- 答案框 -->
  <rect x="370" y="220" width="360" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="550" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k = 2 时队列内容 = 答案</text>
  <text x="550" y="260" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">输出：[7, 4, 1]</text>

  <!-- ===== 底部说明 ===== -->
  <rect x="40" y="290" width="690" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="11" fill="#333" font-weight="bold">扩展规则：每个节点最多 3 个邻居</text>
  <text x="70" y="334" font-size="11" fill="#555">• cur.left（左孩子）— 向下</text>
  <text x="70" y="352" font-size="11" fill="#555">• cur.right（右孩子）— 向下</text>
  <text x="300" y="334" font-size="11" fill="#555">• parent[cur]（父节点）— 向上</text>
  <text x="300" y="352" font-size="11" fill="#555">• 邻居未在 visited 中才入队</text>
  <text x="60" y="374" font-size="11" fill="#888">如 5 扩展出 3（父）、6（左）、2（右）；3 扩展出 1（另一侧子树）——这正是「向上再向下」的路径</text>
</svg>
