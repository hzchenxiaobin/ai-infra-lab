<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：m=3, n=3, ops=[[2,2],[3,3]] → 最大值个数 = 4</text>

  <!-- Stage 1: initial all 0 -->
  <text x="80" y="62" text-anchor="middle" font-size="11" fill="#888">初始 M</text>
  <g filter="url(#rough2)">
    <rect x="40" y="68" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="55" y="88" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="70" y="68" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="85" y="88" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="100" y="68" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="115" y="88" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="40" y="98" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="55" y="118" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="70" y="98" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="85" y="118" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="100" y="98" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="115" y="118" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="40" y="128" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="55" y="148" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="70" y="128" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="85" y="148" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="100" y="128" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="115" y="148" text-anchor="middle" font-size="12" fill="#333">0</text>
  </g>

  <!-- arrow to stage 2 -->
  <path d="M 140 113 L 168 113" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="154" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a">op[2,2]</text>

  <!-- Stage 2: after op [2,2], top-left 2x2 = 1 -->
  <text x="220" y="62" text-anchor="middle" font-size="11" fill="#888">执行 op[2,2]</text>
  <g filter="url(#rough2)">
    <rect x="180" y="68" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="195" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="210" y="68" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="225" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="240" y="68" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="255" y="88" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="180" y="98" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="195" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="210" y="98" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="225" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="240" y="98" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="255" y="118" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="180" y="128" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="195" y="148" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="210" y="128" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="225" y="148" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="240" y="128" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="255" y="148" text-anchor="middle" font-size="12" fill="#333">0</text>
  </g>

  <!-- arrow to stage 3 -->
  <path d="M 280 113 L 308 113" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a">op[3,3]</text>

  <!-- Stage 3: after op [3,3], top-left 2x2 = 2 (max), rest = 1 -->
  <text x="370" y="62" text-anchor="middle" font-size="11" fill="#888">执行 op[3,3]</text>
  <g filter="url(#rough2)">
    <rect x="320" y="68" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/><text x="335" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="350" y="68" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/><text x="365" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="380" y="68" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="395" y="88" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="320" y="98" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/><text x="335" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="350" y="98" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/><text x="365" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="380" y="98" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="395" y="118" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="320" y="128" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="335" y="148" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="350" y="128" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="365" y="148" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="380" y="128" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="395" y="148" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>

  <!-- legend -->
  <text x="335" y="180" text-anchor="middle" font-size="10" fill="#b85450">红色 = 最大值 2（共 4 个）</text>

  <!-- formula derivation box -->
  <rect x="40" y="200" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">无需模拟矩阵，直接求最小边：</text>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333">min_a = min(2, 3) = 2，  min_b = min(2, 3) = 2</text>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#666">答案 = min_a × min_b = 2 × 2 = 4 ⭐</text>

  <!-- insight box -->
  <rect x="40" y="272" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">关键：每个操作都从 (0,0) 出发，故矩形全部「左上对齐」</text>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#666">被覆盖次数最多的格子 = 落在每个矩形里 = 最小矩形的面积</text>

  <!-- bottom dashed insight -->
  <rect x="40" y="328" width="480" height="40" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#888">模拟法需 O(k·m·n)，当 m,n 达 4×10⁴ 时矩阵上亿格子，不可行</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#888">而求最小边只需 O(k) 时间、O(1) 空间，与矩阵大小无关</text>
</svg>
