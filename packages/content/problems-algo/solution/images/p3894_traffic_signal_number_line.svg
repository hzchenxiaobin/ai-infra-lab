<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：数轴一刀切成互斥段，边界就是全部考点</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">timer ∈ [0, 1000]，三个条件两两互斥，命中即返回</text>

  <!-- ===== number line ===== -->
  <!-- invalid segment (0,30): dashed gray -->
  <path d="M 82 150 L 148 150" stroke="#999" stroke-width="5" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <!-- red segment (30,90]: open at 30, closed at 90 -->
  <path d="M 174 150 L 334 150" stroke="#b85450" stroke-width="7" filter="url(#rough2)"/>
  <!-- invalid segment (90,1000): dashed gray with break -->
  <path d="M 348 150 L 388 150" stroke="#999" stroke-width="5" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <path d="M 408 150 L 448 150" stroke="#999" stroke-width="5" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <!-- axis main line -->
  <path d="M 60 150 L 470 150" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
  <!-- axis break marks (gap 388-408) -->
  <path d="M 392 142 L 404 158" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 400 142 L 412 158" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- green point at 0 -->
  <circle cx="70" cy="150" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="70" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- orange point at 30 -->
  <circle cx="160" cy="150" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="160" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">30</text>

  <!-- red closed endpoint at 90 -->
  <circle cx="340" cy="150" r="7" fill="#b85450" stroke="#8a3a36" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">90</text>

  <!-- open endpoint hint just right of 30 -->
  <circle cx="174" cy="150" r="6" fill="#fafafa" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- tick at 1000 -->
  <path d="M 448 144 L 448 156" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1000</text>

  <!-- labels above the line -->
  <text x="70" y="118" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">Green</text>
  <text x="160" y="106" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">Orange</text>
  <text x="255" y="128" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">Red（31~90）</text>
  <text x="396" y="128" text-anchor="middle" font-size="10" fill="#777" font-weight="bold" filter="url(#rough2)">Invalid</text>
  <text x="115" y="128" text-anchor="middle" font-size="10" fill="#777" font-weight="bold" filter="url(#rough2)">Invalid</text>

  <!-- labels below ticks -->
  <text x="115" y="196" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1~29</text>
  <text x="255" y="196" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">（开区间，30 不含）</text>
  <text x="396" y="196" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">91~1000</text>

  <!-- boundary callouts -->
  <path d="M 172 96 Q 200 82 226 88" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="238" y="82" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">30 归 Orange，不进 Red！</text>
  <path d="M 340 130 Q 340 116 348 108" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="352" y="104" text-anchor="start" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">90 ✓（右闭），91 ✗</text>

  <!-- interval table -->
  <rect x="30" y="216" width="460" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">{0}→Green ｜ {30}→Orange ｜ (30,90]→Red ｜ 其余全部→Invalid</text>

  <!-- pitfalls box -->
  <rect x="30" y="274" width="282" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="294" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">边界三坑</text>
  <text x="42" y="314" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">① Green 只认 0 这一个点：1~29 全 Invalid</text>
  <text x="42" y="332" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">② Red 左边界严格大于（开）：30 被 Orange 独占</text>
  <text x="42" y="350" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">③ Red 右边界含等号（闭）：90 是 Red、91 起 Invalid</text>
  <text x="42" y="370" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">   整数输入下 30 &lt; t ≤ 90 ⇔ 31 ≤ t ≤ 90</text>

  <!-- mutual exclusion box -->
  <rect x="325" y="274" width="165" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="294" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">互斥红利</text>
  <text x="335" y="314" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">三条件触发集合两两不相交</text>
  <text x="335" y="332" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">⟹ if-else 顺序随便换</text>
  <text x="335" y="350" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">⟹ 命中即 return 天然安全</text>
  <text x="335" y="368" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">时间 O(1) 空间 O(1)</text>
</svg>
