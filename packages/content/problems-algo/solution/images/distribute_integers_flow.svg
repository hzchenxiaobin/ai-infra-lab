<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：记忆化搜索 dfs(idx, mask)</text>

  <!-- step 1 -->
  <rect x="150" y="46" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计 nums 频次 freq，降序排序</text>
  <path d="M280,82 L280,100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="120" y="104" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">预处理 sub_sum[mask] = 子集内 quantity 之和</text>
  <path d="M280,140 L280,158" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- dfs entry -->
  <rect x="170" y="162" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dfs(idx, mask)</text>
  <path d="M280,198 L280,214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: mask == full ? -->
  <polygon points="280,218 380,258 280,298 180,258" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mask == full ?</text>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(全部满足)</text>

  <!-- yes branch -->
  <path d="M180,258 L120,258 L120,300" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="252" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="70" y="304" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 True</text>

  <!-- no branch -->
  <path d="M380,258 L440,258 L440,300" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="252" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- decision: idx == len(freq) ? -->
  <polygon points="440,304 540,336 440,368 340,336" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">idx == n ?</text>
  <text x="440" y="350" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">(频次用尽)</text>

  <path d="M340,336 L300,336 L300,360" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="330" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="250" y="364" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="384" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 False</text>

  <!-- no -> enumerate subsets -->
  <path d="M440,368 L440,392" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="384" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="318" y="396" width="244" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">枚举 remaining 的子集 sub：</text>
  <text x="440" y="426" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sub_sum[sub]≤freq[idx] 且 dfs(idx+1,mask|sub)</text>

  <!-- loop back arrow -->
  <path d="M318,413 C200,413 160,300 170,180" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="392" font-size="10" fill="#888" filter="url(#rough2)">递归下一频次</text>
</svg>
