<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序后两种情形各算一遍，取最大</text>

  <!-- 开始 -->
  <rect x="190" y="46" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">sort(nums)</text>

  <path d="M 260 76 L 260 92" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 情形一 -->
  <rect x="60" y="96" width="400" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">情形一：目标值不在数组里 → 滑窗找极差 ≤ 2k 的最宽窗口</text>
  <text x="260" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">r 从 0 扫到 n−1；只要 nums[r] − nums[l] &gt; 2k 就 l++；</text>
  <text x="260" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans = max(ans, min(numOperations, r − l + 1))</text>

  <path d="M 260 162 L 260 178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 情形二 -->
  <rect x="60" y="182" width="400" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">情形二：目标值就取数组里的去重值 x = nums[i]</text>
  <text x="260" y="224" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">L = 首个 ≥ x−k 的下标，R = 首个 &gt; x+k 的下标（各一次二分）</text>
  <text x="260" y="240" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">reach = R − L；cnt = 数组中 x 的个数（再两次二分）</text>
  <text x="260" y="256" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans = max(ans, cnt + min(numOperations, reach − cnt))</text>

  <path d="M 260 264 L 260 280" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="190" y="284" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <!-- 底部说明 -->
  <rect x="20" y="334" width="480" height="56" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="353" font-size="10" fill="#333" filter="url(#rough2)">💡 两情形恰好覆盖所有整数目标：x ∈ nums 由情形二精确计价（cnt 是白赚的底子）；</text>
  <text x="34" y="369" font-size="10" fill="#333" filter="url(#rough2)">x ∉ nums 时 cnt = 0，频率 ≤ min(numOperations, 最宽 2k 窗口)，由情形一封顶兜底。</text>
  <text x="34" y="385" font-size="10" fill="#555" filter="url(#rough2)">排序 O(n log n)；滑窗均摊 O(n)；二分合计 O(n log n)。</text>
</svg>
