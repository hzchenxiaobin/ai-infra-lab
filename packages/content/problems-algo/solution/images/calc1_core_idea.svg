<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个数带符号累加，括号 = 暂存外层上下文</text>

  <!-- Expression tokens: 1 + ( 4 + 5 + 2 ) -->
  <text x="30" y="62" font-size="12" fill="#888">表达式:</text>
  <rect x="96" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="148" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">+</text>
  <rect x="192" y="46" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="68" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">(</text>
  <rect x="236" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="288" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">+</text>
  <rect x="332" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="384" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">+</text>
  <rect x="428" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="480" y="46" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="498" y="68" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">)</text>

  <!-- legend -->
  <rect x="540" y="48" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="556" y="58" font-size="10" fill="#555">运算符</text>
  <rect x="540" y="64" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="556" y="74" font-size="10" fill="#555">括号</text>

  <!-- Step 1: read 1, sign + -->
  <text x="30" y="116" font-size="11" fill="#888" font-weight="bold">读 1，符号 +：</text>
  <text x="180" y="116" font-size="11" fill="#4a7a3a">res += (+1)×1 → res = 1</text>
  <rect x="380" y="100" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">res = 1</text>

  <path d="M 420 132 L 420 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: meet (  push context -->
  <text x="30" y="170" font-size="11" fill="#888" font-weight="bold">遇 ( ：</text>
  <text x="120" y="170" font-size="11" fill="#b85450" font-weight="bold">push (res=1, sign=+1)，重置 res=0</text>
  <!-- stack frame -->
  <rect x="380" y="150" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">(1, +1)</text>
  <text x="510" y="172" font-size="10" fill="#888">← 栈</text>

  <path d="M 440 184 L 440 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: inside parens accumulate -->
  <text x="30" y="222" font-size="11" fill="#888" font-weight="bold">括号内累加：</text>
  <text x="150" y="222" font-size="11" fill="#4a7a3a">res = 0 + 4 + 5 + 2 = 11</text>
  <rect x="380" y="206" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">res = 11</text>
  <rect x="380" y="150" width="120" height="34" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>

  <path d="M 440 240 L 440 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: meet ) combine -->
  <text x="30" y="274" font-size="11" fill="#888" font-weight="bold">遇 ) ：</text>
  <text x="90" y="274" font-size="11" fill="#b85450" font-weight="bold">res = 1 + (+1)×11 = 12（弹出栈合并）</text>
  <rect x="380" y="258" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">res = 12</text>
  <text x="510" y="280" font-size="10" fill="#888">栈空</text>

  <!-- combine formula arrow -->
  <path d="M 350 272 L 376 272" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom callout -->
  <rect x="30" y="316" width="540" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：只有 + −，每个数都能化成「符号 × 数」累加；括号像函数调用</text>
  <text x="300" y="356" text-anchor="middle" font-size="11" fill="#888">遇 ( 把当前 (res, sign) 压栈暂存，遇 ) 弹出并按外层符号合并 —— 一遍扫描、单栈搞定</text>
</svg>
