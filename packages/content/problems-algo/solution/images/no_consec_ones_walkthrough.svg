<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#fdfcf7"/>

  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 5（二进制 101）逐位累加</text>
  <path d="M 300 40 Q 440 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="58" text-anchor="middle" font-size="11" fill="#888">f[0]=1, f[1]=2, f[2]=3, f[3]=5</text>

  <!-- column 1: pos0 bit=1 -->
  <g filter="url(#sk)">
    <rect x="15" y="74" width="200" height="156" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="115" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">pos0 · bit = 1</text>
  <text x="115" y="120" text-anchor="middle" font-size="11" fill="#444">填 0 摘子树</text>
  <text x="115" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">+ f[2] = 3</text>
  <text x="115" y="176" text-anchor="middle" font-size="11" fill="#3a6a3a">覆盖 {0, 1, 2}</text>
  <line x1="35" y1="192" x2="195" y2="192" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="115" y="210" text-anchor="middle" font-size="10.5" fill="#666">紧贴填 1</text>
  <text x="115" y="224" text-anchor="middle" font-size="10.5" fill="#666">prev_one = True</text>

  <!-- arrow to col 2 -->
  <path d="M 215 152 L 223 152" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- column 2: pos1 bit=0 -->
  <g filter="url(#sk)">
    <rect x="225" y="74" width="200" height="156" rx="8" fill="#fff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="325" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">pos1 · bit = 0</text>
  <text x="325" y="120" text-anchor="middle" font-size="11" fill="#444">紧贴只能填 0</text>
  <text x="325" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#999">+ 0</text>
  <text x="325" y="176" text-anchor="middle" font-size="11" fill="#888">（无自由子树）</text>
  <line x1="245" y1="192" x2="405" y2="192" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="325" y="210" text-anchor="middle" font-size="10.5" fill="#666">prev_one = False</text>
  <text x="325" y="224" text-anchor="middle" font-size="10.5" fill="#aaa">（bit=0 不摘子树）</text>

  <path d="M 425 152 L 433 152" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- column 3: pos2 bit=1 -->
  <g filter="url(#sk)">
    <rect x="435" y="74" width="200" height="156" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="535" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">pos2 · bit = 1</text>
  <text x="535" y="120" text-anchor="middle" font-size="11" fill="#444">填 0 摘子树</text>
  <text x="535" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">+ f[0] = 1</text>
  <text x="535" y="176" text-anchor="middle" font-size="11" fill="#3a6a3a">覆盖 {4}</text>
  <line x1="455" y1="192" x2="615" y2="192" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="535" y="210" text-anchor="middle" font-size="10.5" fill="#666">紧贴填 1</text>
  <text x="535" y="224" text-anchor="middle" font-size="10.5" fill="#666">prev_one = True</text>

  <path d="M 635 152 L 643 152" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- column 4: end -->
  <g filter="url(#sk)">
    <rect x="645" y="74" width="220" height="156" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="755" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">循环走完</text>
  <text x="755" y="120" text-anchor="middle" font-size="11" fill="#444">n 本身合法</text>
  <text x="755" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">+ 1</text>
  <text x="755" y="176" text-anchor="middle" font-size="11" fill="#3a6a3a">覆盖 {5}</text>
  <line x1="665" y1="192" x2="845" y2="192" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="755" y="210" text-anchor="middle" font-size="10.5" fill="#666">n = 101</text>
  <text x="755" y="224" text-anchor="middle" font-size="10.5" fill="#2e6e2e">无连续 1 ✓</text>

  <!-- running sum bar -->
  <text x="44" y="262" font-size="11" fill="#666">累计：</text>
  <g filter="url(#sk)">
    <rect x="80" y="250" width="70" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="115" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <path d="M 150 264 L 178 264" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="290" y="250" width="70" height="28" rx="6" fill="#fff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="325" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">3</text>
  <path d="M 360 264 L 388 264" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="500" y="250" width="70" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="535" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">4</text>
  <path d="M 570 264 L 598 264" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="720" y="250" width="70" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="755" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>

  <!-- final answer -->
  <g filter="url(#sk)">
    <rect x="270" y="300" width="340" height="44" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="2"/>
  </g>
  <text x="440" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">答案 = 3 + 0 + 1 + 1 = 5</text>

  <text x="440" y="372" text-anchor="middle" font-size="11" fill="#888">每个「bit=1」位贡献一棵自由子树 f[L-i-1]；走完紧贴路径再 +1（n 自身合法）</text>
  <text x="440" y="392" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">bit=0 的位不摘子树，只沿紧贴路径填 0</text>
</svg>
