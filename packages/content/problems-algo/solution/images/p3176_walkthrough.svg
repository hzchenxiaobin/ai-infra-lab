<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,1,1,3]，k = 2</text>

  <rect x="10" y="50" width="500" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="58" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">元素 x</text>
  <text x="150" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[2][x]</text>
  <text x="240" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[1][x]</text>
  <text x="330" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[0][x]</text>
  <text x="442" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 层最优子序列</text>

  <rect x="10" y="82" width="500" height="28" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="101" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 (i=0)</text>
  <text x="150" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="442" y="101" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1]</text>

  <rect x="10" y="110" width="500" height="28" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 (i=1)</text>
  <text x="150" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="442" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,2]</text>

  <rect x="10" y="138" width="500" height="28" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 (i=2)</text>
  <text x="150" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="442" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,2,1]</text>

  <rect x="10" y="166" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="185" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 (i=3)</text>
  <text x="150" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="240" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="330" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="442" y="185" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[1,2,1,1]</text>

  <rect x="10" y="194" width="500" height="28" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="213" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3 (i=4)</text>
  <text x="150" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="240" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="330" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="442" y="213" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,1,1,3]</text>

  <rect x="20" y="234" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 4：[1,2,1,1]（花满 2 枪）与 [1,1,1,3]（第 1 层，只花 1 枪）并列最长</text>

  <rect x="20" y="284" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">示例 2：nums = [1,2,3,4,5,1]，k = 0</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">j = 0 没有预算 → 只能同值免费续，值 1 出现两次 → [1,1]，答案 2</text>
</svg>
