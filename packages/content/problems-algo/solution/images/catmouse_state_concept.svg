<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">猫鼠博弈：状态 ( m, c, turn ) 与三种终局</text>

  <text x="110" y="52" text-anchor="middle" font-size="11" fill="#888">无向图（示例）</text>

  <line x1="110" y1="93" x2="64" y2="142" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="110" y1="93" x2="110" y2="186" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="156" y1="142" x2="114" y2="186" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="110" cy="78" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="83" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">洞</text>
  <text x="110" y="110" text-anchor="middle" font-size="9" fill="#d6a040">0</text>

  <circle cx="55" cy="155" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="160" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="55" y="140" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">鼠</text>

  <circle cx="165" cy="155" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="165" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">猫</text>

  <circle cx="110" cy="200" r="14" fill="#f5f5f5" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="205" text-anchor="middle" font-size="10" fill="#888">3</text>

  <rect x="225" y="44" width="295" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="372" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">状态 = ( m, c, turn )</text>
  <text x="244" y="88" font-size="11" fill="#444">m = 老鼠所在节点（起点 1）</text>
  <text x="244" y="106" font-size="11" fill="#444">c = 猫所在节点（起点 2，禁止进洞）</text>
  <text x="244" y="124" font-size="11" fill="#444">turn = 0(鼠走) / 1(猫走)，鼠先走</text>
  <text x="244" y="142" font-size="10" fill="#888">状态总数 ≤ n × n × 2（n ≤ 50 → 5000）</text>

  <rect x="20" y="172" width="160" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">鼠到达洞</text>
  <text x="100" y="216" text-anchor="middle" font-size="11" fill="#444">m == 0</text>
  <text x="100" y="244" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">→ 鼠赢 (1)</text>

  <rect x="190" y="172" width="160" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">猫抓到鼠</text>
  <text x="270" y="216" text-anchor="middle" font-size="11" fill="#444">m == c</text>
  <text x="270" y="244" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">→ 猫赢 (2)</text>

  <rect x="360" y="172" width="160" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="196" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">状态重复</text>
  <text x="440" y="216" text-anchor="middle" font-size="11" fill="#444">(m, c, turn) 复现</text>
  <text x="440" y="244" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">→ 平局 (0)</text>

  <rect x="20" y="280" width="500" height="82" fill="#f5f5f5" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">核心思路：拓扑排序染色（反向 BFS）</text>
  <text x="270" y="324" text-anchor="middle" font-size="10" fill="#666">把每个状态当节点、转移关系当有向边，构成「状态转移图」</text>
  <text x="270" y="342" text-anchor="middle" font-size="10" fill="#666">从已知终态出发，逐步染色所有可判定胜负的前驱状态</text>
  <text x="270" y="360" text-anchor="middle" font-size="10" fill="#888">未被染色的状态 → 平局（draw）</text>
</svg>
