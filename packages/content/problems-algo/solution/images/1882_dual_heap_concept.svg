<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：双堆调度（空闲堆 + 忙碌堆）</text>

  <!-- Task timeline section -->
  <text x="40" y="58" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 任务按时间到达：第 j 项任务在 t=j 秒可处理</text>
  <line x1="40" y1="88" x2="540" y2="88" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="92" font-size="10" fill="#888" filter="url(#rough2)">t</text>

  <rect x="60" y="74" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=0</text>
  <text x="82" y="98" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1]</text>

  <rect x="124" y="74" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=1</text>
  <text x="146" y="98" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2]</text>

  <rect x="188" y="74" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=2</text>
  <text x="210" y="98" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3]</text>

  <rect x="252" y="74" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=3</text>
  <text x="274" y="98" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2]</text>

  <rect x="316" y="74" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=4</text>
  <text x="338" y="98" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1]</text>

  <rect x="380" y="74" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t=5</text>
  <text x="402" y="98" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2]</text>

  <!-- Free heap (left) -->
  <text x="40" y="146" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 空闲堆 free：(权重, 下标)</text>
  <rect x="70" y="162" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">(2, #2)</text>
  <text x="160" y="180" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 堆顶</text>
  <rect x="40" y="200" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="217" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(3, #0)</text>
  <rect x="120" y="200" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="217" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(3, #1)</text>
  <path d="M 110 192 L 75 200" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 110 192 L 155 200" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="244" font-size="9.5" fill="#888" filter="url(#rough2)">按权重最小、同则下标最小</text>

  <!-- Busy heap (right) -->
  <text x="320" y="146" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 忙碌堆 busy：(完成时间, 权重, 下标)</text>
  <rect x="360" y="162" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="182" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">(5, 2, #2)</text>
  <text x="470" y="180" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 最早完成</text>
  <rect x="300" y="200" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="217" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(5, 3, #0)</text>
  <rect x="400" y="200" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="217" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(5, 3, #1)</text>
  <path d="M 410 192 L 345 200" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 410 192 L 445 200" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="244" font-size="9.5" fill="#888" filter="url(#rough2)">按完成时间最小先出堆</text>

  <!-- Arrows between heaps -->
  <path d="M 360 178 L 200 178" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="240" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">完成 → 归还空闲</text>
  <text x="240" y="160" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">busy 顶.完成时间 ≤ t</text>

  <path d="M 200 270 L 360 270" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">分配任务 → 转入忙碌</text>
  <text x="280" y="284" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">free 顶出堆，push (t+任务时长, 权重, 下标)</text>

  <!-- Time jump note -->
  <rect x="40" y="300" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 空闲堆空时：time 跳到忙碌堆顶的完成时间，释放该时刻所有服务器，再分配</text>

  <!-- Key insights -->
  <path d="M 40 344 L 540 344" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="362" font-size="11" fill="#555" filter="url(#rough2)">• 空闲堆按 (权重, 下标) 取最小 → 满足「权重最小、同则下标最小」的选择规则</text>
  <text x="56" y="378" font-size="11" fill="#555" filter="url(#rough2)">• 忙碌堆按 (完成时间) 取最小 → 空闲堆空时能最快找到下一台可用服务器</text>
  <text x="56" y="394" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠ 同一时刻可有多台服务器同时完成 → 需用 while 循环全部释放</text>
</svg>
