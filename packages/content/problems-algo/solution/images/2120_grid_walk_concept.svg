<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个起点都从 startPos 出发，越界即停</text>

  <!-- ====== Left: 3x3 grid with example path i=0 ====== -->
  <text x="150" y="52" text-anchor="middle" font-size="12" fill="#888">n = 3, startPos = (0,1), s = "RRDDLU"</text>

  <!-- grid cells: cell 56x56, origin (38, 76) -->
  <!-- row 0 -->
  <rect x="38" y="76" width="56" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="76" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="76" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <!-- row 1 -->
  <rect x="38" y="132" width="56" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="132" width="56" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="132" width="56" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <!-- row 2 -->
  <rect x="38" y="188" width="56" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="188" width="56" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="150" y="188" width="56" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <!-- column indices -->
  <text x="66" y="72" text-anchor="middle" font-size="10" fill="#999">c=0</text>
  <text x="122" y="72" text-anchor="middle" font-size="10" fill="#999">c=1</text>
  <text x="178" y="72" text-anchor="middle" font-size="10" fill="#999">c=2</text>
  <!-- row indices -->
  <text x="30" y="108" text-anchor="end" font-size="10" fill="#999">r=0</text>
  <text x="30" y="164" text-anchor="end" font-size="10" fill="#999">r=1</text>
  <text x="30" y="220" text-anchor="end" font-size="10" fill="#999">r=2</text>

  <!-- startPos marker in (0,1) -->
  <circle cx="122" cy="104" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="122" y="108" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">S</text>

  <!-- path i=0: (0,1) -> R -> (0,2) -> R -> out -->
  <!-- step 1: R from (0,1) to (0,2) -->
  <path d="M 131 104 L 170 104" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="98" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">R ✓</text>
  <!-- robot at (0,2) -->
  <circle cx="178" cy="104" r="7" fill="#446688" filter="url(#rough2)"/>

  <!-- step 2: R from (0,2) to (0,3) -- OUT -->
  <path d="M 187 104 L 222 104" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- out-of-grid marker -->
  <text x="240" y="100" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="240" y="116" text-anchor="middle" font-size="9" fill="#b85450">越界</text>
  <text x="200" y="98" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R</text>

  <!-- answer[0] = 1 -->
  <rect x="38" y="262" width="170" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="123" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i=0: answer[0] = 1</text>

  <!-- ====== Right: explanation ====== -->
  <rect x="270" y="60" width="270" height="240" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>

  <text x="405" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">两个关键观察</text>

  <!-- observation 1 -->
  <circle cx="290" cy="116" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="308" y="114" font-size="12" fill="#333" font-weight="bold">每个起点独立</text>
  <text x="290" y="138" font-size="11" fill="#555">answer[i] 总是从 startPos 出发</text>
  <text x="290" y="154" font-size="11" fill="#555">执行 s[i:]，不是从上一轮</text>
  <text x="290" y="170" font-size="11" fill="#555">终点继续 → m 次模拟互不依赖</text>

  <!-- observation 2 -->
  <circle cx="290" cy="200" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="308" y="198" font-size="12" fill="#333" font-weight="bold">越界即停，且不计数</text>
  <text x="290" y="222" font-size="11" fill="#555">下一条指令会让机器人越界</text>
  <text x="290" y="238" font-size="11" fill="#555">→ 该条不计入 answer[i]</text>
  <text x="290" y="254" font-size="11" fill="#555">→ 立即停止后续指令</text>
  <text x="290" y="278" font-size="11" fill="#b85450" font-weight="bold">answer[i] = j - i（j 为最早越界下标）</text>

  <!-- bottom note -->
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#888">外层重置 (r, c) ← startPos，内层 break 即可实现两点</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#888">O(m²) 暴力，m ≤ 500 完全可接受</text>
</svg>
