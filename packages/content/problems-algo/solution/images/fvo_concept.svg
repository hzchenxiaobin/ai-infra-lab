<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：4 种操作本质只有 +1 / −1，看符号字符即可</text>

  <!-- Increment group label -->
  <text x="70" y="76" font-size="12" fill="#4a7a3a" font-weight="bold">加 1 类</text>

  <!-- ++X -->
  <rect x="120" y="56" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">++X</text>
  <!-- highlight the + char -->
  <rect x="128" y="60" width="14" height="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
  <rect x="142" y="60" width="14" height="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>

  <!-- X++ -->
  <rect x="210" y="56" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="245" y="78" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">X++</text>
  <rect x="236" y="60" width="14" height="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
  <rect x="250" y="60" width="14" height="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>

  <!-- arrow to +1 -->
  <path d="M 245 96 Q 245 110 245 122" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="126" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="245" y="146" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- Decrement group label -->
  <text x="380" y="76" font-size="12" fill="#b85450" font-weight="bold">减 1 类</text>

  <!-- --X -->
  <rect x="120" y="180" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="202" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">--X</text>
  <rect x="128" y="184" width="14" height="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
  <rect x="142" y="184" width="14" height="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>

  <!-- X-- -->
  <rect x="210" y="180" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="245" y="202" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">X--</text>
  <rect x="236" y="184" width="14" height="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
  <rect x="250" y="184" width="14" height="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>

  <!-- arrow to -1 -->
  <path d="M 245 220 Q 245 234 245 246" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="220" y="250" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="245" y="270" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">−1</text>

  <!-- Insight box on the right -->
  <rect x="330" y="180" width="210" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="435" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键洞察</text>
  <text x="435" y="226" text-anchor="middle" font-size="11" fill="#555">4 种操作都含 2 个符号字符</text>
  <text x="435" y="244" text-anchor="middle" font-size="11" fill="#555">只要看到 '+' → +1</text>
  <text x="435" y="262" text-anchor="middle" font-size="11" fill="#555">只要看到 '−' → −1</text>

  <!-- Bottom summary -->
  <rect x="60" y="300" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">无需解析位置，只需判断 op[1]（或任意字符）是 '+' 还是 '−'</text>
</svg>
