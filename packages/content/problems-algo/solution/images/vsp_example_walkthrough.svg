<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：跟踪 ID 池状态（示例 1 关键步骤）</text>

  <!-- ===== Table ===== -->
  <!-- header background -->
  <rect x="30" y="44" width="580" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- row 5 highlight (reuse) -->
  <rect x="30" y="218" width="580" height="36" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <!-- row 3 highlight (no-op remove) -->
  <rect x="30" y="146" width="580" height="36" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>

  <!-- table outer + grid lines -->
  <rect x="30" y="44" width="580" height="318" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- vertical column dividers -->
  <line x1="76" y1="44" x2="76" y2="362" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="226" y1="44" x2="226" y2="362" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="290" y1="44" x2="290" y2="362" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="382" y1="44" x2="382" y2="362" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="510" y1="44" x2="510" y2="362" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- horizontal row dividers -->
  <line x1="30" y1="110" x2="610" y2="110" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="30" y1="146" x2="610" y2="146" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="30" y1="182" x2="610" y2="182" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="30" y1="218" x2="610" y2="218" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="30" y1="254" x2="610" y2="254" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="30" y1="290" x2="610" y2="290" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="30" y1="326" x2="610" y2="326" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="30" y1="74" x2="610" y2="74" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- header text -->
  <text x="53" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">步骤</text>
  <text x="151" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">操作</text>
  <text x="258" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">nextId</text>
  <text x="336" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">recycled堆</text>
  <text x="446" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">videos(map)</text>
  <text x="560" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">返回</text>

  <!-- row 1 -->
  <text x="53" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">①</text>
  <text x="80" y="95" font-size="10.5" fill="#333">upload("123")</text>
  <text x="258" y="95" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="336" y="95" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <text x="390" y="95" font-size="10.5" fill="#333">{0:"123"}</text>
  <text x="560" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 2 -->
  <text x="53" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">②</text>
  <text x="80" y="131" font-size="10.5" fill="#333">upload("456")</text>
  <text x="258" y="131" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="336" y="131" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <text x="390" y="131" font-size="10.5" fill="#333">{0,1}</text>
  <text x="560" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 3 (no-op remove) -->
  <text x="53" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③</text>
  <text x="80" y="167" font-size="10.5" fill="#333">remove(4)</text>
  <text x="258" y="167" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="336" y="167" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <text x="390" y="167" font-size="10.5" fill="#333">{0,1}</text>
  <text x="560" y="167" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">—(无)</text>

  <!-- row 4 (remove 0 -> recycle) -->
  <text x="53" y="203" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④</text>
  <text x="80" y="203" font-size="10.5" fill="#333">remove(0)</text>
  <text x="258" y="203" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="336" y="203" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[0]</text>
  <text x="390" y="203" font-size="10.5" fill="#333">{1:"456"}</text>
  <text x="560" y="203" text-anchor="middle" font-size="10.5" fill="#888">—</text>

  <!-- row 5 (reuse!) -->
  <text x="53" y="239" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤</text>
  <text x="80" y="239" font-size="10.5" fill="#333">upload("789")</text>
  <text x="258" y="239" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="336" y="239" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <text x="390" y="239" font-size="10.5" fill="#333">{0:"789",1}</text>
  <text x="560" y="239" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ★</text>

  <!-- row 6 watch -->
  <text x="53" y="275" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑥</text>
  <text x="80" y="275" font-size="10.5" fill="#333">watch(1,0,5)</text>
  <text x="258" y="275" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="336" y="275" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <text x="390" y="275" font-size="10.5" fill="#333">views[1]=1</text>
  <text x="560" y="275" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">"456"</text>

  <!-- row 7 watch clamp -->
  <text x="53" y="311" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑦</text>
  <text x="80" y="311" font-size="10.5" fill="#333">watch(1,0,1)</text>
  <text x="258" y="311" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="336" y="311" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <text x="390" y="311" font-size="10.5" fill="#333">views[1]=2</text>
  <text x="560" y="311" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">"45"</text>

  <!-- row 8 like/dislike/get -->
  <text x="53" y="347" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑧</text>
  <text x="80" y="347" font-size="10.5" fill="#333">like×1,dis×2,get</text>
  <text x="258" y="347" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="336" y="347" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <text x="390" y="347" font-size="10.5" fill="#333">L1,D2</text>
  <text x="560" y="347" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[1,2]/2</text>

  <!-- bottom note -->
  <rect x="30" y="376" width="580" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：④ 删除 id=0 入回收堆 → ⑤ upload 优先 pop 出 0 复用（而非分配 nextId=2）</text>
  <text x="320" y="410" text-anchor="middle" font-size="10.5" fill="#888">⑦ watch 的 endMinute=1 被 clamp 到 min(1, len-1=2)=1，返回 "45"（第 0~1 位）</text>
</svg>
