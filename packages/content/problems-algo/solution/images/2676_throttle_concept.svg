<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">节流 = 首沿立即执行 + 尾沿补一次</text>

  <!-- 时间轴 -->
  <line x1="40" y1="200" x2="520" y2="200" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="525" y="205" font-size="12" fill="#446688" filter="url(#rough2)">time</text>

  <!-- 刻度 -->
  <line x1="100" y1="195" x2="100" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="225" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t₀</text>
  <line x1="280" y1="195" x2="280" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="225" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t₀+t</text>
  <line x1="380" y1="195" x2="380" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="225" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t₁</text>
  <line x1="480" y1="195" x2="480" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="225" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t₁+t</text>

  <!-- 冷却窗口 1 -->
  <rect x="100" y="100" width="180" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="190" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">冷却窗口 t（cooldown）</text>
  <text x="190" y="138" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">期间暂存 nextArgs</text>

  <!-- call@t₀ 首沿 -->
  <line x1="100" y1="150" x2="100" y2="200" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="60" y="65" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">call@t₀</text>

  <!-- 首沿执行 -->
  <text x="100" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">立即执行</text>
  <text x="100" y="175" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(leading)</text>

  <!-- call@x 冷却中暂存 -->
  <line x1="190" y1="150" x2="190" y2="200" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <rect x="150" y="65" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">call@x</text>
  <text x="190" y="170" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">暂存参数</text>

  <!-- 尾沿执行 at t₀+t -->
  <rect x="240" y="142" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">尾沿执行</text>
  <line x1="280" y1="170" x2="280" y2="195" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 冷却窗口 2 -->
  <rect x="280" y="100" width="200" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">新一轮冷却</text>

  <!-- call@t₁ 首沿 -->
  <line x1="380" y1="150" x2="380" y2="200" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="340" y="65" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">call@t₁</text>
  <text x="380" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">立即执行</text>

  <!-- 图例 -->
  <rect x="50" y="260" width="460" height="80" fill="none" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="60" y="275" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="84" y="285" font-size="11" fill="#333" filter="url(#rough2)">绿色 = fn 实际执行（首沿 / 尾沿）</text>
  <rect x="60" y="295" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="84" y="305" font-size="11" fill="#333" filter="url(#rough2)">橙色 = 冷却中的调用（暂存 nextArgs，覆盖旧值）</text>
  <rect x="60" y="315" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="84" y="325" font-size="11" fill="#333" filter="url(#rough2)">蓝色 = 冷却窗口 t（执行后开启，到期检查暂存）</text>
</svg>
