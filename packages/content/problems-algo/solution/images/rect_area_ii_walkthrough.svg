<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="290" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算: [[0,0,2,2],[1,0,2,3],[1,0,3,1]]</text>
  <text x="300" y="38" text-anchor="middle" font-size="10" fill="#888">ys = [0,1,2,3] → 条带 [0,1) [1,2) [2,3)</text>

  <!-- ===== Header row ===== -->
  <rect x="20" y="48" width="560" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">x 段</text>
  <text x="135" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">活跃矩形</text>
  <text x="222" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">[2,3)</text>
  <text x="277" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">[1,2)</text>
  <text x="332" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">[0,1)</text>
  <text x="387" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">y 长</text>
  <text x="465" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">面积</text>

  <!-- ===== Row 1: x in [0,1) ===== -->
  <rect x="20" y="80" width="560" height="32" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="100" text-anchor="middle" font-size="10" fill="#333">[0,1)</text>
  <text x="135" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">R1</text>
  <!-- band cells -->
  <rect x="200" y="84" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="222" y="100" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <rect x="255" y="84" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="277" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <rect x="310" y="84" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="332" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="387" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="465" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2×1 = 2</text>

  <!-- ===== Row 2: x in [1,2) ===== -->
  <rect x="20" y="116" width="560" height="32" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="136" text-anchor="middle" font-size="10" fill="#333">[1,2)</text>
  <text x="135" y="136" text-anchor="middle" font-size="9" fill="#333">R1,R2,R3</text>
  <rect x="200" y="120" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="222" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="255" y="120" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="277" y="136" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <rect x="310" y="120" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="332" y="136" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="387" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="465" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3×1 = 3</text>

  <!-- ===== Row 3: x in [2,3) ===== -->
  <rect x="20" y="152" width="560" height="32" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="172" text-anchor="middle" font-size="10" fill="#333">[2,3)</text>
  <text x="135" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">R3</text>
  <rect x="200" y="156" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="222" y="172" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <rect x="255" y="156" width="44" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="277" y="172" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <rect x="310" y="156" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="332" y="172" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="387" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="465" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1×1 = 1</text>

  <!-- Divider -->
  <line x1="20" y1="196" x2="580" y2="196" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Summary ===== -->
  <rect x="140" y="208" width="320" height="60" fill="#fce4ec" fill-opacity="0.65" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="230" text-anchor="middle" font-size="11" fill="#444">三个 x 段互不重叠，覆盖全部并集</text>
  <text x="300" y="254" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">总面积 = 2 + 3 + 1 = 6</text>
</svg>
