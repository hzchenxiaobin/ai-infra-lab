<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两个示例的逐步累加过程</text>

  <!-- 示例 1 -->
  <text x="50" y="52" font-size="12" fill="#666" font-weight="bold">示例 1：nums = [4,3,10,9,8]，total = 34</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="50" y="60" width="60" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="80" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
    <rect x="110" y="60" width="70" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="145" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">取元素</text>
    <rect x="180" y="60" width="80" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="220" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">cur_sum</text>
    <rect x="260" y="60" width="80" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="300" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">剩余和</text>
    <rect x="340" y="60" width="140" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="410" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">cur &gt; 剩余?</text>
  </g>

  <!-- 行1: 取10 -->
  <g filter="url(#rough2)">
    <rect x="50" y="86" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="80" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="110" y="86" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="145" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
    <rect x="180" y="86" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="220" y="104" text-anchor="middle" font-size="11" fill="#333">10</text>
    <rect x="260" y="86" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="300" y="104" text-anchor="middle" font-size="11" fill="#333">24</text>
    <rect x="340" y="86" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="410" y="104" text-anchor="middle" font-size="11" fill="#d6a040">否 (10&lt;24)</text>
  </g>

  <!-- 行2: 取9, 命中 -->
  <g filter="url(#rough2)">
    <rect x="50" y="112" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="80" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="110" y="112" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="145" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
    <rect x="180" y="112" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="220" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">19</text>
    <rect x="260" y="112" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="300" y="130" text-anchor="middle" font-size="11" fill="#333">15</text>
    <rect x="340" y="112" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="410" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓ → 停</text>
  </g>

  <!-- 示例 1 答案 -->
  <rect x="50" y="146" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="165" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 1：[10, 9]（取 2 个）</text>

  <!-- 示例 2 -->
  <text x="50" y="196" font-size="12" fill="#666" font-weight="bold">示例 2：nums = [4,4,7,6,7]，total = 28</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="50" y="204" width="60" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="80" y="222" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
    <rect x="110" y="204" width="70" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="145" y="222" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">取元素</text>
    <rect x="180" y="204" width="80" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="220" y="222" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">cur_sum</text>
    <rect x="260" y="204" width="80" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="300" y="222" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">剩余和</text>
    <rect x="340" y="204" width="140" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="410" y="222" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">cur &gt; 剩余?</text>
  </g>

  <!-- 行1: 取7 -->
  <g filter="url(#rough2)">
    <rect x="50" y="230" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="80" y="246" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="110" y="230" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="145" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
    <rect x="180" y="230" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="220" y="246" text-anchor="middle" font-size="11" fill="#333">7</text>
    <rect x="260" y="230" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="300" y="246" text-anchor="middle" font-size="11" fill="#333">21</text>
    <rect x="340" y="230" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="410" y="246" text-anchor="middle" font-size="11" fill="#d6a040">否 (7&lt;21)</text>
  </g>

  <!-- 行2: 取7, cur=14=剩余, 关键边界 -->
  <g filter="url(#rough2)">
    <rect x="50" y="254" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="80" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="110" y="254" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="145" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
    <rect x="180" y="254" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="220" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">14</text>
    <rect x="260" y="254" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="300" y="270" text-anchor="middle" font-size="11" fill="#333">14</text>
    <rect x="340" y="254" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="410" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 (= 非严格!)</text>
  </g>

  <!-- 行3: 取6, 命中 -->
  <g filter="url(#rough2)">
    <rect x="50" y="278" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="80" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
    <rect x="110" y="278" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="145" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
    <rect x="180" y="278" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="220" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">20</text>
    <rect x="260" y="278" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="300" y="294" text-anchor="middle" font-size="11" fill="#333">8</text>
    <rect x="340" y="278" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="410" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓ → 停</text>
  </g>

  <!-- 示例 2 答案 -->
  <rect x="50" y="312" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="331" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 2：[7, 7, 6]（取 3 个）</text>

  <!-- 关键提示 -->
  <rect x="50" y="354" width="430" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="265" y="375" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠ 关键：cur_sum 必须 严格大于 剩余和，等于时继续取（见示例 2 第 2 行）</text>
</svg>
