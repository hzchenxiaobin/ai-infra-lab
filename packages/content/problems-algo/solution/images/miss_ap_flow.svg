<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">公差法流程：算 d → 逐位比对 → 首个错位即答案</text>

  <!-- Step 1: n = arr.length -->
  <rect x="190" y="46" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n = arr.length</text>
  <path d="M 260 84 L 260 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute d -->
  <rect x="160" y="100" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="12" fill="#333">d = (arr[n−1] − arr[0]) / n</text>
  <path d="M 260 142 L 260 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: d == 0 ? -->
  <polygon points="260,158 340,196 260,234 180,196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="11" fill="#333">d == 0 ?</text>
  <text x="260" y="207" text-anchor="middle" font-size="10" fill="#888">(退化)</text>

  <!-- Yes branch -> return arr[0] -->
  <path d="M 180 196 L 90 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="135" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="178" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="55" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 arr[0]</text>

  <!-- No branch -> i = 0 -->
  <path d="M 340 196 L 430 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">否</text>
  <rect x="430" y="178" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="201" text-anchor="middle" font-size="11" fill="#333">i = 0</text>

  <!-- down to loop expect -->
  <path d="M 465 216 L 465 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop: expect = arr[0] + i*d -->
  <rect x="365" y="252" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="277" text-anchor="middle" font-size="12" fill="#333">expect = arr[0] + i · d</text>
  <path d="M 465 294 L 465 308" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: arr[i] != expect ? -->
  <polygon points="465,310 545,348 465,386 385,348" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="465" y="345" text-anchor="middle" font-size="11" fill="#333">arr[i] ≠</text>
  <text x="465" y="359" text-anchor="middle" font-size="11" fill="#333">expect ?</text>

  <!-- Yes -> return expect (answer) -->
  <path d="M 385 348 L 300 348" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是 ⭐</text>
  <rect x="150" y="330" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="225" y="355" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 expect（答案）</text>

  <!-- No -> i++ and loop back -->
  <path d="M 545 348 L 560 348" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="554" y="340" font-size="11" fill="#446688" font-weight="bold">否</text>
  <path d="M 560 348 L 560 235 L 465 235" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="540" y="285" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="561" y="302" text-anchor="middle" font-size="11" fill="#333">i++</text>

  <!-- loop-end fallback note -->
  <rect x="150" y="400" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="420" text-anchor="middle" font-size="11" fill="#444">若循环走完仍无错位（即 d=0 情形），</text>
  <text x="290" y="436" text-anchor="middle" font-size="11" fill="#444">兜底返回 arr[0]</text>

  <!-- Legend -->
  <rect x="20" y="400" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="412" font-size="10" fill="#555">处理</text>
  <rect x="20" y="420" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="432" font-size="10" fill="#555">判定</text>
  <rect x="80" y="400" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="412" font-size="10" fill="#555">返回</text>
  <rect x="80" y="420" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="432" font-size="10" fill="#555">变量</text>
</svg>
