<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=3 的 5 棵 BST</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">枚举根 1/2/3，左右子树独立计数后相乘求和</text>

  <!-- ===== Formula bar ===== -->
  <rect x="30" y="50" width="460" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">G(3) = G(0)·G(2) + G(1)·G(1) + G(2)·G(0) = 2 + 1 + 2 = 5</text>

  <!-- ===== Group backgrounds ===== -->
  <rect x="22" y="90" width="178" height="138" fill="#f4f8fe" stroke="#bcd" stroke-width="0.8" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <rect x="222" y="90" width="88" height="138" fill="#f3f9f3" stroke="#ccd" stroke-width="0.8" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <rect x="322" y="90" width="178" height="138" fill="#fef8ee" stroke="#dc6" stroke-width="0.8" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>

  <!-- ===== Edges (drawn before nodes) ===== -->
  <g stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <!-- Tree A: 1->2->3 right chain -->
    <line x1="60" y1="118" x2="78" y2="151"/>
    <line x1="78" y1="168" x2="96" y2="196"/>
    <!-- Tree B: 1->3, 3->2(left) -->
    <line x1="160" y1="118" x2="178" y2="151"/>
    <line x1="178" y1="168" x2="160" y2="196"/>
    <!-- Tree C: 2->1, 2->3 -->
    <line x1="260" y1="123" x2="242" y2="146"/>
    <line x1="260" y1="123" x2="278" y2="146"/>
    <!-- Tree D: 3->2->1 left chain -->
    <line x1="360" y1="118" x2="342" y2="151"/>
    <line x1="342" y1="168" x2="324" y2="196"/>
    <!-- Tree E: 3->1, 1->2(right) -->
    <line x1="460" y1="118" x2="442" y2="151"/>
    <line x1="442" y1="168" x2="460" y2="196"/>
  </g>

  <!-- ===== Nodes ===== -->
  <g font-size="11" fill="#fff" font-weight="bold">
    <!-- Tree A: 1(root,red), 2,3(blue) -->
    <circle cx="60" cy="112" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="60" y="116" text-anchor="middle">1</text>
    <circle cx="78" cy="157" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="78" y="161" text-anchor="middle" font-size="10">2</text>
    <circle cx="96" cy="202" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="96" y="206" text-anchor="middle" font-size="10">3</text>

    <!-- Tree B: 1(root,red), 3,2(blue) -->
    <circle cx="160" cy="112" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="160" y="116" text-anchor="middle">1</text>
    <circle cx="178" cy="157" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="178" y="161" text-anchor="middle" font-size="10">3</text>
    <circle cx="160" cy="202" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="160" y="206" text-anchor="middle" font-size="10">2</text>

    <!-- Tree C: 2(root,red), 1,3(blue) -->
    <circle cx="260" cy="112" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="260" y="116" text-anchor="middle">2</text>
    <circle cx="242" cy="157" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="242" y="161" text-anchor="middle" font-size="10">1</text>
    <circle cx="278" cy="157" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="278" y="161" text-anchor="middle" font-size="10">3</text>

    <!-- Tree D: 3(root,red), 2,1(blue) -->
    <circle cx="360" cy="112" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="360" y="116" text-anchor="middle">3</text>
    <circle cx="342" cy="157" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="342" y="161" text-anchor="middle" font-size="10">2</text>
    <circle cx="324" cy="202" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="324" y="206" text-anchor="middle" font-size="10">1</text>

    <!-- Tree E: 3(root,red), 1,2(blue) -->
    <circle cx="460" cy="112" r="11" fill="#b85450" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
    <text x="460" y="116" text-anchor="middle">3</text>
    <circle cx="442" cy="157" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="442" y="161" text-anchor="middle" font-size="10">1</text>
    <circle cx="460" cy="202" r="10" fill="#446688" filter="url(#rough2)"/>
    <text x="460" y="206" text-anchor="middle" font-size="10">2</text>
  </g>

  <!-- ===== Group labels ===== -->
  <g font-size="10">
    <text x="111" y="234" text-anchor="middle" fill="#446688" font-weight="bold">根 = 1</text>
    <text x="111" y="222" text-anchor="middle" fill="#446688" font-size="9">G(0)·G(2) = 2 棵</text>
    <text x="266" y="234" text-anchor="middle" fill="#4a7a3a" font-weight="bold">根 = 2</text>
    <text x="266" y="222" text-anchor="middle" fill="#4a7a3a" font-size="9">G(1)·G(1) = 1 棵</text>
    <text x="411" y="234" text-anchor="middle" fill="#d6a040" font-weight="bold">根 = 3</text>
    <text x="411" y="222" text-anchor="middle" fill="#d6a040" font-size="9">G(2)·G(0) = 2 棵</text>
  </g>

  <!-- ===== Legend / Result ===== -->
  <rect x="30" y="252" width="460" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">红圈 = 根节点，蓝圈 = 子树节点</text>
  <text x="260" y="292" text-anchor="middle" font-size="10" fill="#555">G(n) 序列：1, 1, 2, 5, 14, 42, 132, 429 … = 卡塔兰数 C_n</text>
  <text x="260" y="312" text-anchor="middle" font-family="monospace" font-size="11" fill="#333" font-weight="bold">G[i] += G[j-1] * G[i-j]</text>
  <text x="260" y="330" text-anchor="middle" font-size="9" fill="#888">双重循环：外层 i 算规模，内层 j 枚举根</text>
</svg>
