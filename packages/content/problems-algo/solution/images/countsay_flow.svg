<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">外观数列算法流程（迭代 + 游程编码）</text>

  <!-- Start -->
  <ellipse cx="270" cy="60" rx="78" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333">开始: cur = "1"</text>

  <path d="M 270 80 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Outer loop: i from 2 to n -->
  <polygon points="270,102 370,150 270,198 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">i &lt;= n ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(迭代 n−1 次)</text>

  <!-- No -> end -->
  <path d="M 370 150 L 460 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="488" cy="150" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="154" text-anchor="middle" font-size="12" fill="#333">返回 cur</text>

  <!-- Yes -> init inner -->
  <path d="M 270 198 L 270 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="212" font-size="11" fill="#82b366">是</text>

  <rect x="170" y="218" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#333">next = "", j = 0  (扫描 cur)</text>

  <path d="M 270 252 L 270 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Inner loop: j < len? -->
  <polygon points="270,274 370,318 270,362 170,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="12" fill="#333">j &lt; len(cur) ?</text>

  <!-- No -> assign cur=next, i++ -->
  <path d="M 370 318 L 440 318 L 440 235 L 370 235" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="278" font-size="10" fill="#888" transform="rotate(90 448 278)">cur=next, i++</text>

  <!-- Yes -> count run -->
  <path d="M 270 362 L 270 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="376" font-size="11" fill="#82b366">是</text>

  <rect x="120" y="384" width="300" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="11" fill="#333">cnt=1; while j+1&lt;len 且 cur[j]==cur[j+1]: cnt++, j++</text>
  <text x="270" y="418" text-anchor="middle" font-size="11" fill="#333">next += to_string(cnt) + cur[j];  j++</text>

  <!-- loop back inner -->
  <path d="M 120 405 L 60 405 L 60 318 L 170 318" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="360" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 360)">扫描下一组</text>
</svg>
