<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：前缀锁定奇偶模式，槽位内可任意排列</text>
  <text x="260" y="36" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以 n = 6、已放前缀 [2, 1] 为例：剩余 4 个位置的奇偶性被完全锁死</text>

  <!-- position strip -->
  <rect x="112" y="50" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="71" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="162" y="50" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="71" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="212" y="50" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="235" y="71" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">偶</text>
  <rect x="262" y="50" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="285" y="71" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">奇</text>
  <rect x="312" y="50" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="335" y="71" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">偶</text>
  <rect x="362" y="50" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="385" y="71" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">奇</text>
  <text x="135" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">位0</text>
  <text x="185" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">位1</text>
  <text x="235" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">位2</text>
  <text x="285" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">位3</text>
  <text x="335" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">位4</text>
  <text x="385" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">位5</text>
  <text x="260" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">前缀末位为奇 ⇒ 剩余奇偶一路交替：偶 奇 偶 奇（锁死，不可更改）</text>

  <!-- pools to slots -->
  <rect x="75" y="128" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="146" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">奇数池（剩 2 个）：{3, 5}</text>
  <path d="M 237 142 L 293 142" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="265" y="135" text-anchor="middle" font-size="9" fill="#4a6b3f" filter="url(#rough2)">恰好填满</text>
  <rect x="297" y="128" width="148" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="371" y="146" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">奇数槽：2 个 ✓</text>

  <rect x="75" y="164" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="182" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶数池（剩 2 个）：{4, 6}</text>
  <path d="M 237 178 L 293 178" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="265" y="171" text-anchor="middle" font-size="9" fill="#55677d" filter="url(#rough2)">恰好填满</text>
  <rect x="297" y="164" width="148" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="371" y="182" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶数槽：2 个 ✓</text>

  <!-- ways chip -->
  <rect x="150" y="202" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="221" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">恰好匹配 ⇒ ways = 2! × 2! = 4</text>

  <!-- completions -->
  <text x="260" y="252" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">以 [2, 1] 为前缀的全部 4 个排列：</text>
  <text x="160" y="270" text-anchor="middle" font-size="10" fill="#55677d" filter="url(#rough2)">[2, 1, 4, 3, 6, 5]</text>
  <text x="360" y="270" text-anchor="middle" font-size="10" fill="#55677d" filter="url(#rough2)">[2, 1, 4, 5, 6, 3]</text>
  <text x="160" y="286" text-anchor="middle" font-size="10" fill="#55677d" filter="url(#rough2)">[2, 1, 6, 3, 4, 5]</text>
  <text x="360" y="286" text-anchor="middle" font-size="10" fill="#55677d" filter="url(#rough2)">[2, 1, 6, 5, 4, 3]</text>

  <!-- bottom notes -->
  <g filter="url(#rough2)">
    <rect x="40" y="298" width="222" height="52" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="151" y="316" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b">① 数量不匹配 ⇒ ways = 0</text>
    <text x="151" y="331" text-anchor="middle" font-size="9.5" fill="#55677d">例：n = 3 首位放 2（偶），剩偶 0 个</text>
    <text x="151" y="344" text-anchor="middle" font-size="9.5" fill="#55677d">但偶槽还有 1 个 → 该前缀无解</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="278" y="298" width="222" height="52" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="389" y="316" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">② 总数预判 k 是否越界</text>
    <text x="389" y="331" text-anchor="middle" font-size="9.5" fill="#55677d">n = 2m：2·(m!)²；n = 2m+1：(m+1)!·m!</text>
    <text x="389" y="344" text-anchor="middle" font-size="9.5" fill="#55677d">n = 100 时约 1.9×10<tspan dy="-4" font-size="8">129</tspan>，远大于 10<tspan dy="-4" font-size="8">15</tspan></text>
  </g>
</svg>
