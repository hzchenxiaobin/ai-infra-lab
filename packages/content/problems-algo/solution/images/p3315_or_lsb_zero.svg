<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：x OR (x+1) 就是「把 x 的最低位 0 翻成 1」</text>
  <text x="260" y="37" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">正向看 x+1 的进位，反向看 p 尾部的连续 1 段</text>

  <!-- Section A：正向 -->
  <rect x="22" y="46" width="476" height="140" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">正向：x + 1 的进位只发生在尾部 —— 例 x = 23 = 10111₂</text>

  <g font-size="8" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="80">bit4</text>
    <text x="137" y="80">bit3</text>
    <text x="169" y="80">bit2</text>
    <text x="201" y="80">bit1</text>
    <text x="233" y="80">bit0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="92" y="84" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="124" y="84" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="156" y="84" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="188" y="84" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="220" y="84" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="105" y="100" text-anchor="middle" font-size="11" fill="#33506b">1</text>
    <text x="137" y="100" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold">0</text>
    <text x="169" y="100" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="201" y="100" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="233" y="100" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="86" y="100" text-anchor="end" font-size="10" fill="#333" font-weight="bold">x = 23</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="92" y="114" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="124" y="114" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="156" y="114" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="188" y="114" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="220" y="114" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="105" y="130" text-anchor="middle" font-size="11" fill="#33506b">1</text>
    <text x="137" y="130" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold">1</text>
    <text x="169" y="130" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="201" y="130" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="233" y="130" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="86" y="130" text-anchor="end" font-size="10" fill="#333" font-weight="bold">x + 1 = 24</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="92" y="144" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="124" y="144" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="156" y="144" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="188" y="144" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="220" y="144" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="105" y="160" text-anchor="middle" font-size="11" fill="#33506b">1</text>
    <text x="137" y="160" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold">1</text>
    <text x="169" y="160" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="201" y="160" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="233" y="160" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="86" y="160" text-anchor="end" font-size="10" fill="#333" font-weight="bold">x | (x+1)</text>
  </g>

  <text x="137" y="181" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">x 的最低位 0 在第 3 位</text>

  <g filter="url(#rough2)">
    <rect x="256" y="89" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="274" y="99" font-size="9.5" fill="#33506b">高位：两数完全相同 → 不变</text>
    <rect x="256" y="117" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="274" y="127" font-size="9.5" fill="#a07830">第 3 位：0 | 1 = 1，唯一变化</text>
    <rect x="256" y="145" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="274" y="155" font-size="9.5" fill="#2f5d24">尾部 111：1 | 0 = 1，保持</text>
    <text x="256" y="178" font-size="10" fill="#b85450" font-weight="bold">∴ x | (x+1) = x | (1≪t) = 23 | 8 = 31</text>
  </g>

  <!-- Section B：反向 -->
  <rect x="22" y="194" width="476" height="82" fill="#f6fbf6" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">反向：被清的位只能落在 p 的「尾部连续 1 段」内 —— 例 p = 11 = 1011₂</text>

  <g font-size="8" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="226">bit3</text>
    <text x="137" y="226">bit2</text>
    <text x="169" y="226">bit1</text>
    <text x="201" y="226">bit0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="92" y="230" width="26" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="124" y="230" width="26" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="156" y="230" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="188" y="230" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="105" y="246" text-anchor="middle" font-size="11" fill="#33506b">1</text>
    <text x="137" y="246" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="169" y="246" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">1</text>
    <text x="201" y="246" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <text x="86" y="246" text-anchor="end" font-size="10" fill="#333" font-weight="bold">p = 11</text>
    <rect x="156" y="230" width="26" height="24" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" rx="4"/>
    <path d="M 158 259 Q 185 266 212 259" fill="none" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="185" y="273" text-anchor="middle" font-size="8.5" fill="#2f5d24">尾部连续 1 段（m = 2）</text>
  </g>

  <path d="M 248 250 L 218 244" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="254" y="236" font-size="9.5" fill="#666">清第 0 位：x = 10 = 1010₂（满足，但更大）</text>
    <text x="254" y="254" font-size="9.5" fill="#2f5d24" font-weight="bold">清第 1 位：x = 9 = 1001₂ ← 最小 ✓</text>
    <text x="254" y="271" font-size="8.5" fill="#888">t 越大，p − 2ᵗ 越小 → 取 t = m−1</text>
  </g>

  <!-- Section C：公式 -->
  <rect x="22" y="284" width="476" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">公式：设 m = p 尾部连续 1 的个数，ans = p − 2ᵐ⁻¹（清段内最高位）</text>
  <text x="260" y="318" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">位运算版：p+1 的最低位 1 恰是 2ᵐ → ans = p − lowbit(p+1) / 2</text>
  <text x="260" y="334" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">偶数 p 无解（OR 结果必为奇数）→ 质数中仅 p = 2 → ans = −1</text>
  <text x="260" y="348" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">自检：3→1、5→4、7→3、11→9、13→12、31→15 ✓</text>
</svg>
