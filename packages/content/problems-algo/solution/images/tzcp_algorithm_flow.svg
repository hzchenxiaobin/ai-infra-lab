<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀和 + 遍历转角 × 4 方向（满臂延伸）</text>

  <!-- Step 1: factor precompute -->
  <rect x="60" y="48" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="68" font-size="12" fill="#446688" font-weight="bold">① 预处理因子</text>
  <text x="80" y="86" font-size="11.5" fill="#333">对每个 grid[i][j]，分解出 v₂、v₅（因子 2 / 5 的个数）→ c2[i][j]、c5[i][j]</text>

  <path d="M 280 96 L 280 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: prefix sums -->
  <rect x="60" y="110" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="130" font-size="12" fill="#446688" font-weight="bold">② 预处理前缀和（各多开一位）</text>
  <text x="80" y="148" font-size="11.5" fill="#333">行前缀 row2[i][·]、row5[i][·]：行 i 前 k 列的 v₂ / v₅ 之和</text>
  <text x="80" y="164" font-size="11.5" fill="#333">列前缀 col2[j][·]、col5[j][·]：列 j 前 k 行的 v₂ / v₅ 之和</text>

  <path d="M 280 170 L 280 182" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop corners -->
  <rect x="60" y="184" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="204" font-size="12" fill="#d6a040" font-weight="bold">③ 遍历每个格子 (i, j) 作为转角</text>
  <text x="80" y="220" font-size="11.5" fill="#333">对 4 种方向组合各做一次「满臂延伸」→ 不必枚举臂长</text>

  <path d="M 280 228 L 280 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: compute totals -->
  <rect x="60" y="242" width="440" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">④ 满臂段（含转角）O(1) 求和，转角减一份</text>
  <text x="80" y="280" font-size="11" fill="#333">水平左 row2[i][j+1]　水平右 row2[i][n]-row2[i][j]</text>
  <text x="80" y="296" font-size="11" fill="#333">竖直上 col2[j][i+1]　竖直下 col2[j][m]-col2[j][i]</text>
  <text x="80" y="312" font-size="11.5" fill="#b85450" font-weight="bold">total2 = H2 + V2 − c2[i][j]，total5 = H5 + V5 − c5[i][j]</text>

  <path d="M 280 316 L 280 328" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: update answer -->
  <rect x="60" y="330" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="350" font-size="12" fill="#b85450" font-weight="bold">⑤ 更新答案</text>
  <text x="80" y="366" font-size="11.5" fill="#333">ans = max(ans, min(total2, total5))</text>

  <path d="M 280 374 L 280 386" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: return -->
  <rect x="60" y="388" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">⑥ 返回 ans　整体 O(m·n)</text>

  <!-- side note: full-extension optimality -->
  <rect x="60" y="436" width="440" height="20" fill="#fafafa" stroke="none"/>
  <text x="280" y="452" text-anchor="middle" font-size="10.5" fill="#888">满臂最优：延伸加入 (Δv₂,Δv₅) ≥ 0 → min 单调不降，故不必枚举臂长</text>
</svg>
