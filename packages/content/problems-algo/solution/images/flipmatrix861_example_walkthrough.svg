<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="580" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid = [[0,0,1,1],[1,0,1,0],[1,1,0,0]]</text>

  <!-- ===== Matrix A: original ===== -->
  <text x="180" y="62" font-size="11" fill="#888">原始矩阵</text>
  <!-- col headers -->
  <text x="263" y="54" text-anchor="middle" font-size="10" fill="#888">col0</text>
  <text x="301" y="54" text-anchor="middle" font-size="10" fill="#888">col1</text>
  <text x="339" y="54" text-anchor="middle" font-size="10" fill="#888">col2</text>
  <text x="377" y="54" text-anchor="middle" font-size="10" fill="#888">col3</text>
  <!-- row 0: [0,0,1,1] (col0 highlighted red = triggers flip) -->
  <rect x="246" y="58" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="284" y="58" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="78" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="322" y="58" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="78" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="360" y="58" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="78" text-anchor="middle" font-size="13" fill="#333">1</text>
  <!-- row 1: [1,0,1,0] -->
  <rect x="246" y="90" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="110" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="284" y="90" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="110" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="322" y="90" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="110" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="360" y="90" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="110" text-anchor="middle" font-size="13" fill="#333">0</text>
  <!-- row 2: [1,1,0,0] -->
  <rect x="246" y="122" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="142" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="284" y="122" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="142" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="322" y="122" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="142" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="360" y="122" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="142" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- arrow A -> B -->
  <path d="M 320 158 L 320 180" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="174" font-size="11" fill="#b85450">阶段一：grid[0][0]==0 → 翻 row0</text>

  <!-- ===== Matrix B: after row flip ===== -->
  <text x="150" y="194" font-size="11" fill="#888">行翻后矩阵</text>
  <!-- row 0: [1,1,0,0] (flipped, green) -->
  <rect x="246" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="284" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="322" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="339" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="360" y="190" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <!-- row 1: [1,0,1,0] -->
  <rect x="246" y="222" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="284" y="222" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="242" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="322" y="222" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="242" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="360" y="222" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="242" text-anchor="middle" font-size="13" fill="#333">0</text>
  <!-- row 2: [1,1,0,0] -->
  <rect x="246" y="254" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="284" y="254" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="274" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="322" y="254" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="274" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="360" y="254" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="274" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- col0 all-1 note -->
  <text x="420" y="216" font-size="11" fill="#4a7a3a">第 0 列全 1 ✓</text>
  <text x="420" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">贡献 3 × 2³ = 24</text>

  <!-- arrow B -> C -->
  <path d="M 320 290 L 320 312" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="306" font-size="11" fill="#d6a040">阶段二：col2 ones=1→翻，col3 ones=0→翻</text>

  <!-- ===== Matrix C: final ===== -->
  <text x="150" y="326" font-size="11" fill="#888">最终矩阵</text>
  <!-- row 0: [1,1,1,1] = 15 -->
  <rect x="246" y="322" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="342" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="284" y="322" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="342" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="322" y="322" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="339" y="342" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="360" y="322" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="342" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="410" y="342" font-size="12" fill="#333">= 0b1111 =</text>
  <text x="486" y="342" font-size="13" fill="#b85450" font-weight="bold">15</text>
  <!-- row 1: [1,0,0,1] = 9 -->
  <rect x="246" y="354" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="374" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="284" y="354" width="34" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="374" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="322" y="354" width="34" height="28" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="374" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="360" y="354" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="374" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="410" y="374" font-size="12" fill="#333">= 0b1001 =</text>
  <text x="486" y="374" font-size="13" fill="#b85450" font-weight="bold">9</text>
  <!-- row 2: [1,1,1,1] = 15 -->
  <rect x="246" y="386" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="406" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="284" y="386" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="406" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="322" y="386" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="339" y="406" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="360" y="386" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="406" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="410" y="406" font-size="12" fill="#333">= 0b1111 =</text>
  <text x="486" y="406" font-size="13" fill="#b85450" font-weight="bold">15</text>

  <!-- divider -->
  <line x1="40" y1="430" x2="600" y2="430" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- sum box -->
  <rect x="160" y="446" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="471" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">总分 = 24 + 8 + 4 + 3 = 39</text>

  <!-- column contribution breakdown -->
  <rect x="60" y="502" width="520" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="522" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">各列贡献拆解（位权 n−1−j）</text>
  <text x="320" y="542" text-anchor="middle" font-size="11" fill="#444">col0: 3×2³=24  ·  col1: max(2,1)×2²=8  ·  col2: max(1,2)×2¹=4  ·  col3: max(0,3)×2⁰=3</text>
  <text x="320" y="560" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">col1 不翻（ones 多），col2/col3 翻（zeros 多）→ 全由 max(ones, m−ones) 吸收</text>
</svg>
