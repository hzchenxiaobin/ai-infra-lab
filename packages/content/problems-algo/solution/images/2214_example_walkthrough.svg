<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：damage=[2,7,4,3], armor=4, 初始生命=13
  </text>

  <!-- Table header -->
  <rect x="40" y="55" width="520" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">回合</text>
  <text x="160" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">伤害</text>
  <text x="260" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">护甲?</text>
  <text x="370" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">实际伤害</text>
  <text x="470" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">剩余生命</text>

  <!-- vertical separators -->
  <line x1="120" y1="55" x2="120" y2="255" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="55" x2="200" y2="255" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="55" x2="320" y2="255" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="55" x2="420" y2="255" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <rect x="40" y="89" width="520" height="34" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="260" y="111" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">否</text>
  <text x="370" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="470" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11</text>

  <!-- Row 2 -->
  <rect x="40" y="123" width="520" height="34" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="260" y="145" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">否</text>
  <text x="370" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="470" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- Row 3 (armor used - highlight) -->
  <rect x="40" y="157" width="520" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是★吸收4</text>
  <text x="370" y="179" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="470" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- Row 4 -->
  <rect x="40" y="191" width="520" height="34" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="213" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="213" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="260" y="213" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">否</text>
  <text x="370" y="213" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="470" y="213" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- outer border bottom -->
  <line x1="40" y1="225" x2="560" y2="225" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Summary -->
  <rect x="70" y="250" width="460" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="275" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    实际总伤害 = 2 + 7 + 0 + 3 = 12
  </text>
  <text x="300" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    累计伤害单调不减 ⟹ 末步累计最大 = 12
  </text>
  <text x="300" y="316" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    生命 = 13 > 12，每步均 &gt; 0 ✓ 末步恰好剩 1
  </text>
</svg>
