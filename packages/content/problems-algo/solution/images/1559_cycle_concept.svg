<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="600" height="420" fill="#fdfcf7"/>

  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">二维网格探测环：DFS 回边 = 已访问且非父的同值邻居</text>
  <path d="M 170 38 Q 300 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: example 1 4x4 grid ===== -->
  <text x="140" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">示例 1：a 外圈环(长12) + b 2×2 环(长4)</text>

  <!-- 4x4 grid, cell 48x48, origin (44, 76) -->
  <!-- row 0: a a a a -->
  <g filter="url(#sk)"><rect x="44" y="76" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="68" y="106" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="92" y="76" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="116" y="106" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="140" y="76" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="164" y="106" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="188" y="76" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="212" y="106" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>

  <!-- row 1: a b b a -->
  <g filter="url(#sk)"><rect x="44" y="124" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="68" y="154" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="92" y="124" width="48" height="48" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="116" y="154" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="140" y="124" width="48" height="48" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="164" y="154" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="188" y="124" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="212" y="154" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>

  <!-- row 2: a b b a -->
  <g filter="url(#sk)"><rect x="44" y="172" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="68" y="202" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="92" y="172" width="48" height="48" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="116" y="202" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="140" y="172" width="48" height="48" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="164" y="202" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="188" y="172" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="212" y="202" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>

  <!-- row 3: a a a a -->
  <g filter="url(#sk)"><rect x="44" y="220" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="68" y="250" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="92" y="220" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="116" y="250" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="140" y="220" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="164" y="250" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="188" y="220" width="48" height="48" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2"/></g>
  <text x="212" y="250" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>

  <!-- b 2x2 cycle arrows (red), cell centers: (116,148),(164,148),(164,196),(116,196) -->
  <!-- top: (1,1)->(1,2) -->
  <path d="M 130 148 L 150 148" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- right: (1,2)->(2,2) -->
  <path d="M 164 162 L 164 182" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- bottom: (2,2)->(2,1) -->
  <path d="M 150 196 L 130 196" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- left: (2,1)->(1,1)  BACK EDGE -->
  <path d="M 116 182 L 116 162" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="100" y="178" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">回边</text>

  <!-- a ring orange arrows along perimeter (just two segments to hint direction) -->
  <path d="M 56 92 L 56 252" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#ao)" filter="url(#sk)" opacity="0.8"/>
  <path d="M 224 252 L 224 92" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#ao)" filter="url(#sk)" opacity="0.8"/>

  <!-- labels -->
  <text x="232" y="270" font-size="10" fill="#d6a040" font-weight="bold">a 环 长12</text>
  <text x="140" y="284" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">b 环 长4</text>

  <!-- ===== Right: two insight boxes ===== -->
  <!-- Box 1: back edge -->
  <g filter="url(#sk)"><rect x="290" y="76" width="290" height="92" rx="10" fill="#fffdf3" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="306" y="100" font-size="13" font-weight="bold" fill="#b85450">① 回边判环</text>
  <text x="306" y="122" font-size="11" fill="#444">DFS 扫同值邻居时：</text>
  <text x="306" y="140" font-size="11" fill="#444">• 已访问 且 ≠ 父节点 → 回边 → 有环</text>
  <text x="306" y="156" font-size="11" fill="#444">• 已访问 且 = 父节点 → 合法回退，跳过</text>

  <!-- Box 2: bipartite length>=4 -->
  <g filter="url(#sk)"><rect x="290" y="184" width="290" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="306" y="208" font-size="13" font-weight="bold" fill="#446688">② 二分图 → 环长 ≥ 4</text>
  <text x="306" y="230" font-size="11" fill="#444">网格按 (i+j) 奇偶染色，每条边跨奇偶</text>
  <text x="306" y="248" font-size="11" fill="#444">→ 二分图无奇环，所有环长度为偶数</text>
  <text x="306" y="266" font-size="11" fill="#444">→ 父节点排除长度 2 → 环长 ≥ 4 ✓</text>
  <text x="306" y="282" font-size="10" fill="#888">无需额外做长度检查</text>

  <!-- mini bipartite illustration: 2x3 chessboard -->
  <g filter="url(#sk)"><rect x="510" y="300" width="26" height="26" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="536" y="300" width="26" height="26" rx="2" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="510" y="326" width="26" height="26" rx="2" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="536" y="326" width="26" height="26" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
  <text x="525" y="362" text-anchor="middle" font-size="9" fill="#888">偶</text>
  <text x="551" y="362" text-anchor="middle" font-size="9" fill="#888">奇</text>

  <!-- ===== Bottom: key insight ===== -->
  <g filter="url(#sk)"><rect x="30" y="300" width="460" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="50" y="324" font-size="12" font-weight="bold" fill="#4a7a3a">关键转化</text>
  <text x="50" y="346" font-size="11" fill="#444">把网格当隐式图：同值相邻格子之间连无向边。</text>
  <text x="50" y="364" font-size="11" fill="#444">问题 = 判断任一同值连通块是否含环。</text>
  <text x="50" y="382" font-size="11" fill="#444">无向 DFS 树无横跨边 → 已访问非父邻居必为祖先 → 回边即环。</text>
</svg>
