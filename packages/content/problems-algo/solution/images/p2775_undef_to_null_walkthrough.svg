<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">示例演算：{a: undefined, b:["a",undefined]} 的递归调用树</text>

  <!-- 根调用：普通对象 -->
  <rect x="160" y="44" width="300" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f( { a: undefined, b: ["a", undefined] } )</text>
  <text x="310" y="80" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">普通对象 → 逐键递归</text>

  <!-- 根到两个子节点的箭头 -->
  <path d="M 250 88 C 200 100, 160 100, 130 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 88 C 420 100, 460 100, 475 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 子节点1: key a → undefined（递归基） -->
  <rect x="30" y="112" width="200" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f(undefined)  ← key a</text>
  <text x="130" y="148" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">递归基 obj===undefined</text>
  <!-- 结果标签 -->
  <path d="M 230 134 L 262 134" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="264" y="118" width="64" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="296" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">null</text>

  <!-- 子节点2: key b → 数组 -->
  <rect x="360" y="112" width="230" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f(["a", undefined])  ← key b</text>
  <text x="475" y="148" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">数组 → 逐元素递归</text>

  <!-- 数组到两个元素的箭头 -->
  <path d="M 430 156 C 400 168, 380 172, 380 180" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 520 156 C 540 168, 560 172, 560 180" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 元素 idx0: "a"（原始值） -->
  <rect x="320" y="182" width="120" height="44" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f("a")  ← idx0</text>
  <text x="380" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">原始值 → 原样返回</text>
  <path d="M 440 204 L 472 204" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="474" y="188" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="502" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">"a"</text>

  <!-- 元素 idx1: undefined（递归基） -->
  <rect x="500" y="182" width="110" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="555" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f(undefined)</text>
  <text x="555" y="218" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">← idx1 递归基</text>
  <path d="M 555 226 L 555 248" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="510" y="250" width="90" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="555" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">null</text>

  <!-- 数组组装结果 b -->
  <path d="M 502 220 C 470 240, 460 270, 475 282" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="284" width="230" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">b = ["a", null]</text>

  <!-- 根组装结果 -->
  <path d="M 296 150 C 250 200, 230 300, 245 338" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 475 320 C 420 330, 400 340, 380 348" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="348" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="373" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)" font-weight="bold">输出 = { a: null, b: ["a", null] }</text>

  <!-- 递归细节框 -->
  <rect x="30" y="400" width="560" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="420" font-size="12" fill="#333" filter="url(#rough2)" font-weight="bold">💡 递归下钻细节</text>
  <text x="46" y="438" font-size="11" fill="#555" filter="url(#rough2)">两处 undefined（对象值位 a、数组元素位 b[1]）均由递归基 obj===undefined → null 统一收口；</text>
  <text x="46" y="456" font-size="11" fill="#555" filter="url(#rough2)">数组/对象只负责"逐元素/逐值递归"，本身不变换值——变换只发生在 undefined 叶子。</text>
</svg>
