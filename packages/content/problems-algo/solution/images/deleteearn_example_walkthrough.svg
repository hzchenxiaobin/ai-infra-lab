<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,2,3,3,3,4]，maxVal = 4</text>

  <!-- column headers -->
  <text x="40" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">i</text>
  <text x="120" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">points[i]</text>
  <text x="220" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">dp[i−2]</text>
  <text x="320" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">dp[i−1]</text>
  <text x="440" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">max(不取,取)</text>
  <text x="548" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">dp[i]</text>

  <line x1="10" y1="62" x2="570" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row i=1 -->
  <text x="40" y="84" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="84" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <text x="220" y="84" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="440" y="84" text-anchor="middle" font-size="11" fill="#333">max(0, 0)</text>
  <rect x="520" y="72" width="56" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="548" y="88" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Row i=2 -->
  <text x="40" y="114" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="114" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="220" y="114" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="320" y="114" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="440" y="114" text-anchor="middle" font-size="11" fill="#333">max(0, 0+4)</text>
  <rect x="520" y="102" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="548" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="440" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a">取 ↑</text>

  <!-- Row i=3 -->
  <text x="40" y="144" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="220" y="144" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="320" y="144" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="440" y="144" text-anchor="middle" font-size="11" fill="#333">max(4, 0+9)</text>
  <rect x="520" y="132" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="548" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="440" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a">取 ↑</text>

  <!-- Row i=4 -->
  <text x="40" y="174" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="120" y="174" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="220" y="174" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="320" y="174" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="440" y="174" text-anchor="middle" font-size="11" fill="#333">max(9, 4+4)</text>
  <rect x="520" y="162" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="548" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="440" y="160" text-anchor="middle" font-size="9" fill="#b85450">不取 ↑</text>

  <line x1="10" y1="190" x2="570" y2="190" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="120" y="206" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="231" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = dp[4] = 9（取值 3，得 9 点）⭐</text>

  <!-- decisions explanation -->
  <rect x="40" y="262" width="500" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="284" font-size="11.5" fill="#444" font-weight="bold">决策回顾：</text>
  <text x="60" y="304" font-size="11" fill="#555">• i=2：取 2 得 4 点，优于不取（0）</text>
  <text x="60" y="324" font-size="11" fill="#555">• i=3：取 3 得 0+9=9 点，优于不取（dp[2]=4）→ 选中值 3</text>
  <text x="60" y="344" font-size="11" fill="#555">• i=4：取 4 得 dp[2]+4=8，不如不取（dp[3]=9）→ 放弃值 4</text>
</svg>
