<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：传送边按质数分桶（隐式建图）</text>

  <!-- 相邻步（上方小弧） -->
  <text x="52" y="44" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">相邻步 ±1</text>
  <path d="M 144 51 Q 174 38 204 51" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 51 Q 234 38 264 51" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 51 Q 294 38 324 51" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 324 51 Q 354 38 384 51" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 数组格子（示例 2：nums = [2,3,4,7,9]） -->
  <rect x="115" y="54" width="58" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="175" y="54" width="58" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="235" y="54" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="295" y="54" width="58" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="355" y="54" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>

  <!-- 下标 -->
  <text x="144" y="107" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0 起点</text>
  <text x="204" y="107" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="264" y="107" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="324" y="107" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="384" y="107" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">i=4 终点</text>

  <!-- 图例 -->
  <text x="462" y="60" text-anchor="middle" font-size="9.5" fill="#a07820" filter="url(#rough2)">橙格 = 值为质数</text>
  <text x="462" y="76" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">绿箭 = 启用 / 传送</text>
  <text x="462" y="92" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">灰虚线 = 进桶</text>

  <!-- 进桶箭头（灰虚线） -->
  <path d="M 144 112 C 136 130, 108 138, 95 147" fill="none" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 264 112 C 256 132, 180 140, 143 147" fill="none" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 384 112 C 376 132, 342 140, 316 147" fill="none" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 324 112 C 332 130, 392 138, 412 147" fill="none" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- 启用箭头（绿实线）：站在质数 3 上 -->
  <path d="M 204 112 C 212 130, 226 140, 238 147" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 质数桶 -->
  <rect x="48" y="150" width="140" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="118" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">桶[2]</text>
  <text x="118" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">下标 {0, 2}</text>
  <text x="118" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">值 {2, 4}</text>

  <rect x="205" y="150" width="140" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="275" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">桶[3]（已启用）</text>
  <text x="275" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">下标 {1, 4}</text>
  <text x="275" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">值 {3, 9}</text>

  <rect x="362" y="150" width="140" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="432" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">桶[7]</text>
  <text x="432" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">下标 {3}</text>
  <text x="432" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">值 {7}</text>

  <text x="52" y="236" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">进桶规则：质数 p 整除 nums[j] ⇒ 下标 j 进桶[p]</text>

  <!-- 最优路径 -->
  <text x="52" y="250" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">示例 2 最优路径</text>
  <rect x="52" y="258" width="62" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="83" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=0</text>
  <path d="M 114 272 L 148 272" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="131" y="264" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">相邻</text>
  <rect x="152" y="258" width="62" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=1</text>
  <path d="M 214 272 L 248 272" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="231" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">传送</text>
  <rect x="252" y="258" width="62" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=4</text>
  <path d="M 314 272 L 348 272" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="352" y="256" width="104" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="404" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = 2</text>

  <!-- 关键剪枝说明 -->
  <rect x="48" y="300" width="424" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">关键剪枝：桶 p 第一次被整体扫描后立即清空（bucket[p].clear()）</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">⇒ 每个桶只整体扫一次，传送边总量 O(Σω(nums[i])) ≤ 7n</text>

  <text x="16" y="356" text-anchor="start" font-size="9.5" fill="#999" filter="url(#rough2)">ω(v)：v 的不同质因子个数；v ≤ 10^6 时 ω(v) ≤ 7（2·3·5·7·11·13·17 = 510510）</text>
</svg>
