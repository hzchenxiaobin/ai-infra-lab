<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：单次遍历，边查边存 O(n)</text>

  <!-- Loop start -->
  <rect x="200" y="46" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for x in nums: （遍历每个元素）</text>

  <path d="M 280 78 L 280 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: compute d -->
  <rect x="150" y="104" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 算关键字 d = x − rev(x)</text>
  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a">rev：算术翻转十进制位</text>

  <path d="M 280 146 L 280 168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: query cnt[d] -->
  <rect x="120" y="172" width="320" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 先查：ans += cnt[d]  （再 % MOD）</text>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#b85450">前面有几个相同 d，就以当前 j 配几对</text>

  <path d="M 280 220 L 280 242" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: update cnt[d] -->
  <rect x="150" y="246" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 后存：cnt[d] += 1</text>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#d6a040">把当前 d 计入（必须查完再存，防自配）</text>

  <!-- Loop back arrow -->
  <path d="M 410 266 Q 470 266 470 200 Q 470 60 360 60" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="160" font-size="10" fill="#888">下一个 x</text>

  <!-- End -->
  <path d="M 280 288 L 280 312" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="316" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans （已 % 10⁹+7）</text>

  <!-- Key invariants box -->
  <line x1="30" y1="370" x2="530" y2="370" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="392" font-size="12" fill="#444" font-weight="bold">关键顺序：先查 ② → 后存 ③</text>
  <text x="40" y="412" font-size="11" fill="#666">查询时 cnt 里只有「当前下标之前」的元素 → 天然保证 i &lt; j，无自配</text>
  <text x="40" y="432" font-size="11" fill="#666">ans 用 long long 承载，每步取余防溢出（最坏 C(n,2) ≈ 5×10⁹ &gt; INT_MAX）</text>
</svg>
