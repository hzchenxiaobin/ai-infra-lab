<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：k = 3（命中）与 k = 2（无解）</text>

  <!-- ===== Left: k = 3 walkthrough ===== -->
  <rect x="28" y="48" width="270" height="296" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="163" y="70" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">Case A：k = 3 → 返回 3</text>

  <!-- table header -->
  <rect x="44" y="82" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="67" y="99" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">L</text>
  <rect x="92" y="82" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="99" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">R(L)</text>
  <rect x="170" y="82" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="99" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r = R(L)%3</text>

  <!-- L=1 -->
  <rect x="44" y="110" width="46" height="26" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="67" y="128" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="92" y="110" width="76" height="26" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="128" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="170" y="110" width="100" height="26" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="128" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1 ≠ 0</text>

  <!-- L=2 -->
  <rect x="44" y="140" width="46" height="26" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="67" y="158" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="92" y="140" width="76" height="26" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">11</text>
  <rect x="170" y="140" width="100" height="26" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="158" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2 ≠ 0</text>

  <!-- L=3 (hit!) -->
  <rect x="44" y="170" width="46" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="67" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="92" y="170" width="76" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="130" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">111</text>
  <rect x="170" y="170" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0 ✓ 命中！</text>

  <!-- computation notes -->
  <text x="44" y="218" font-size="10.5" fill="#888">递推过程（只存余数）：</text>
  <text x="44" y="236" font-size="11" fill="#333">L=1: r = (0·10+1) % 3 = </text>
  <text x="206" y="236" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="44" y="256" font-size="11" fill="#333">L=2: r = (1·10+1) % 3 = </text>
  <text x="206" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="44" y="276" font-size="11" fill="#333">L=3: r = (2·10+1) % 3 = </text>
  <text x="206" y="276" font-size="11" fill="#b85450" font-weight="bold">0 → return 3</text>

  <rect x="44" y="292" width="238" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="163" y="310" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">全程最大数 = 21（余数递推中）</text>
  <text x="163" y="326" text-anchor="middle" font-size="10" fill="#888">无需构造 111，只跟踪 r ∈ [0,2]</text>

  <!-- ===== Right: k = 2 no solution ===== -->
  <rect x="312" y="48" width="200" height="296" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="412" y="70" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">Case B：k = 2 → 返回 −1</text>

  <!-- early exit -->
  <rect x="328" y="86" width="168" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="412" y="108" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k % 2 == 0 → 直接 −1</text>

  <!-- reason -->
  <text x="328" y="142" font-size="11" fill="#b85450" font-weight="bold">为什么无解？</text>

  <text x="328" y="166" font-size="10.5" fill="#333">R(L) 末位恒为 1：</text>
  <rect x="328" y="174" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="346" y="191" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="368" y="174" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="386" y="191" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">11</text>
  <rect x="408" y="174" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="428" y="191" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">111</text>
  <text x="456" y="191" font-size="11" fill="#888">...</text>

  <text x="328" y="222" font-size="10.5" fill="#333">→ R(L) 恒为奇数</text>
  <text x="328" y="240" font-size="10.5" fill="#333">→ 2 ∤ R(L)，永远</text>
  <text x="328" y="256" font-size="10.5" fill="#333">  不能被 2 整除</text>

  <rect x="328" y="270" width="168" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="412" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">同理 k%5==0 也无解</text>
  <text x="412" y="304" text-anchor="middle" font-size="10" fill="#888">R(L)%5 = 1（末位 1）</text>

  <text x="412" y="330" text-anchor="middle" font-size="10" fill="#888">gcd(k,10) &gt; 1 即无解</text>
</svg>
