<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐段切下前缀并追加到 comp</text>

  <text x="36" y="52" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：word = "aaaaaaaaaaaaaabb"（14 个 a + 2 个 b）</text>

  <!-- header row -->
  <rect x="40" y="62" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">轮次</text>
  <rect x="92" y="62" width="108" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="146" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">切下前缀</text>
  <rect x="200" y="62" width="68" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="234" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">len</text>
  <rect x="268" y="62" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="304" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">追加</text>
  <rect x="340" y="62" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">comp（追加后）</text>

  <!-- row 1 -->
  <rect x="40" y="88" width="52" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="92" y="88" width="108" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="109" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">aaaaaaaaa</text>
  <rect x="200" y="88" width="68" height="32" fill="#fff8e1" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="109" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9（封顶）</text>
  <rect x="268" y="88" width="72" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="109" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"9a"</text>
  <rect x="340" y="88" width="140" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"9a"</text>

  <!-- row 2 -->
  <rect x="40" y="120" width="52" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="120" width="108" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="141" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">aaaaa</text>
  <rect x="200" y="120" width="68" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="141" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="268" y="120" width="72" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="141" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"5a"</text>
  <rect x="340" y="120" width="140" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"9a5a"</text>

  <!-- row 3 -->
  <rect x="40" y="152" width="52" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="92" y="152" width="108" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="173" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">bb</text>
  <rect x="200" y="152" width="68" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="173" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="268" y="152" width="72" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="173" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"2b"</text>
  <rect x="340" y="152" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="173" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"9a5a2b"</text>

  <!-- example 1 -->
  <text x="36" y="220" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：word = "abcde"（互异字符 → 5 轮，每轮 len = 1）</text>

  <rect x="40" y="232" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">a→"1a"，b→"1b"，c→"1c"，d→"1d"，e→"1e" ⟹ "1a1b1c1d1e"</text>

  <!-- notes -->
  <rect x="40" y="288" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a 游程长 14 &gt; 9 → 强制拆成 9 + 5 两段，段数 = ⌈14/9⌉ = 2</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">同一字符的相邻两段（"9a"、"5a"）是合法输出，不需要合并</text>

  <rect x="40" y="348" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出长度 = 2 × 总段数：全互异最长（2n），全同字符最短（≈ 2n/9）</text>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">压缩不保证变短——最坏情况输出反而翻倍</text>
</svg>
