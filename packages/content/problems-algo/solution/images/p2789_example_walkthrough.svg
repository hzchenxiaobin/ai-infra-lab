<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF2789" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,3,7,9,3]，s 初值 = 3</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">从右向左逐个处理，记录每步累加器变化</text>

  <!-- Table header -->
  <rect x="20" y="58" width="55" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="47.5" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步</text>
  <rect x="75" y="58" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i</text>
  <rect x="125" y="58" width="65" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="157.5" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">nums[i]</text>
  <rect x="190" y="58" width="75" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="227.5" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">s (前)</text>
  <rect x="265" y="58" width="155" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="342.5" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">判定 / 动作</text>
  <rect x="420" y="58" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500" y="76" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">s (后)</text>

  <!-- Row 1: init (neutral) -->
  <rect x="20" y="88" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="47.5" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初值</text>
  <rect x="75" y="88" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="108" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="125" y="88" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157.5" y="108" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="190" y="88" width="75" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="227.5" y="108" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="265" y="88" width="155" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342.5" y="108" text-anchor="middle" font-size="10" fill="#333">s = nums[4] = 3</text>
  <rect x="420" y="88" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="500" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- Row 2: reset (red) -->
  <rect x="20" y="120" width="55" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="47.5" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="75" y="120" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="140" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="125" y="120" width="65" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157.5" y="140" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="190" y="120" width="75" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="227.5" y="140" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="265" y="120" width="155" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342.5" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">9 &gt; 3 ✗ 重置 s = 9</text>
  <rect x="420" y="120" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="500" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <!-- Row 3: merge (green) -->
  <rect x="20" y="152" width="55" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="47.5" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="75" y="152" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="172" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="125" y="152" width="65" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157.5" y="172" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="190" y="152" width="75" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="227.5" y="172" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="265" y="152" width="155" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342.5" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7 ≤ 9 ✓ 合并 s = 9+7</text>
  <rect x="420" y="152" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="500" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">16</text>

  <!-- Row 4: merge -->
  <rect x="20" y="184" width="55" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="47.5" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="75" y="184" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="204" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="125" y="184" width="65" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157.5" y="204" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="190" y="184" width="75" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="227.5" y="204" text-anchor="middle" font-size="11" fill="#333">16</text>
  <rect x="265" y="184" width="155" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342.5" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3 ≤ 16 ✓ 合并 s = 16+3</text>
  <rect x="420" y="184" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="500" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">19</text>

  <!-- Row 5: merge + highlight result -->
  <rect x="20" y="216" width="55" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="47.5" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="75" y="216" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="236" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="125" y="216" width="65" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="157.5" y="236" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="190" y="216" width="75" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="227.5" y="236" text-anchor="middle" font-size="11" fill="#333">19</text>
  <rect x="265" y="216" width="155" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342.5" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2 ≤ 19 ✓ 合并 s = 19+2</text>
  <rect x="420" y="216" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="500" y="236" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">21</text>

  <!-- Result line -->
  <path d="M 300 256 L 300 282" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2789)" filter="url(#rough2)"/>
  <rect x="150" y="286" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">s 全程递增：3 → 9 → 16 → 19 → 21</text>
  <text x="300" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终 s = 21 即答案 ✓</text>

  <!-- note -->
  <text x="40" y="356" font-size="11" fill="#666" font-weight="bold">对应操作序列（与示例 1 一致）：</text>
  <text x="60" y="376" font-size="10" fill="#888">i=0:[5,7,9,3] → i=1:[5,16,3] → i=0:[21,3]，最大元素 21</text>
  <text x="60" y="392" font-size="10" fill="#4a7a3a" font-weight="bold">贪心从右并：9←3 不行另起块，再 7+9、3+16、2+19 一路吞并到 21</text>
</svg>
