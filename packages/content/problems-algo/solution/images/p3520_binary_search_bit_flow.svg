<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">二分阈值 × 树状数组区间计数</text>

  <!-- 主流程 -->
  <rect x="170" y="38" width="180" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 离散化：排序去重得 vals</text>
  <path d="M 260 68 L 260 80" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="82" width="180" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">② count(max−min) &lt; k ?</text>
  <text x="260" y="115" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">（逆序对总数不足）</text>

  <path d="M 352 102 L 390 102" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="370" y="96" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="394" y="86" width="90" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="439" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 −1</text>

  <path d="M 260 122 L 260 132" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="132" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="170" y="134" width="180" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">③ 二分 x：lo=0, hi=max−min</text>
  <path d="M 260 164 L 260 176" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="178" width="180" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">④ mid = (lo+hi)/2</text>
  <text x="260" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">count(mid) ≥ k ?</text>

  <path d="M 260 222 L 260 236" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="233" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">lo = hi</text>

  <rect x="170" y="238" width="180" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">⑤ 返回 lo（最小阈值）</text>

  <!-- 分支：是 → hi = mid -->
  <rect x="20" y="186" width="110" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="205" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">hi = mid</text>
  <path d="M 168 200 L 134 200" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="151" y="194" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 75 216 L 75 149 L 164 149" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="118" y="143" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">继续二分</text>

  <!-- 分支：否 → lo = mid + 1 -->
  <rect x="390" y="186" width="110" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="205" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">lo = mid + 1</text>
  <path d="M 352 200 L 386 200" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="369" y="194" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">否</text>
  <path d="M 445 216 L 445 149 L 356 149" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="402" y="143" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">继续二分</text>

  <!-- 调用 count -->
  <path d="M 350 220 C 380 235, 375 258, 388 280" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="254" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">调用</text>

  <!-- count(x) 详解 -->
  <rect x="30" y="284" width="460" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">count(x)：④ 每轮调用一次，O(n log n)</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">从左往右扫 j：lo = 值 ≤ nums[j] 的排名，hi = 值 ≤ nums[j]+x 的排名</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">res += query(hi) − query(lo)（数已插入的 (nums[j], nums[j]+x]），update(lo) 插入 nums[j]</text>
</svg>
