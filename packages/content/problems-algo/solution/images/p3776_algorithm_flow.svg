<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：三个特判 + 排序贪心</text>

  <!-- 右上角注释框 -->
  <rect x="330" y="40" width="165" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="412" y="60" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d = i 到 p 的环距</text>
  <text x="412" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">= min(顺时针, 逆时针)</text>

  <!-- 开始 -->
  <rect x="115" y="34" width="110" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="51" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 170 60 L 170 70" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 找负点 -->
  <rect x="90" y="74" width="160" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">扫描找负值下标 p（至多一个）</text>
  <path d="M 170 102 L 170 112" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定 1：无负值？ -->
  <polygon points="170,112 238,142 170,172 102,142" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">无负值？</text>
  <path d="M 238 142 L 294 142" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="298" y="127" width="92" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">返回 0</text>
  <path d="M 170 172 L 170 182" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="180" y="181" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <!-- 判定 2：sum < 0？ -->
  <polygon points="170,184 238,214 170,244 102,214" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sum &lt; 0？</text>
  <path d="M 238 214 L 294 214" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="262" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="298" y="199" width="92" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="218" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">返回 −1</text>
  <path d="M 170 244 L 170 254" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="180" y="253" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <!-- 收集 + 排序 -->
  <rect x="58" y="258" width="224" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">need = −balance[p]，收集 (d, bal)</text>
  <text x="170" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">按 d 升序排序</text>
  <path d="M 170 300 L 170 310" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定 3：need > 0？ -->
  <polygon points="170,310 240,340 170,370 100,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="344" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">need &gt; 0？</text>
  <path d="M 240 340 L 294 340" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="334" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>
  <rect x="298" y="325" width="100" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="344" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">返回 cost</text>
  <path d="M 170 370 L 170 382" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="180" y="381" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>

  <!-- 取货循环 -->
  <rect x="85" y="386" width="170" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="400" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">t = min(bal, need)</text>
  <text x="170" y="415" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cost += t·d，need −= t</text>

  <!-- 回环箭头 -->
  <path d="M 85 404 L 44 404 L 44 340 L 94 340" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
</svg>
