<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按 k 切块，块是「原子」；保留出现最多的那块</text>

  <!-- 原字符串分块 -->
  <text x="260" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">word = "leetcoleet"，k = 2 → 切成 m = 5 块</text>

  <rect x="115" y="54" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="76" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">le</text>

  <rect x="181" y="54" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="76" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>

  <rect x="247" y="54" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="276" y="76" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">co</text>

  <rect x="313" y="54" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="76" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">le</text>

  <rect x="379" y="54" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="408" y="76" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>

  <text x="144" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">下标 0</text>
  <text x="210" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="276" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="342" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="408" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>

  <!-- 箭头到计数表 -->
  <path d="M 276 108 L 276 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="124" font-size="11" fill="#446688" filter="url(#rough2)">哈希表逐块计数</text>

  <!-- 计数哈希表 -->
  <rect x="140" y="134" width="280" height="104" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">cnt：块 → 出现次数</text>

  <rect x="168" y="162" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="178" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">le</text>
  <text x="252" y="178" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">×  2</text>
  <text x="352" y="178" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 并列最多</text>

  <rect x="168" y="190" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>
  <text x="252" y="206" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">×  2</text>
  <text x="352" y="206" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 并列最多</text>

  <rect x="168" y="218" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="234" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">co</text>
  <text x="252" y="234" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">×  1</text>

  <!-- 箭头到结论 -->
  <path d="M 280 242 L 280 260" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="55" y="264" width="410" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = 总块数 − 最大频率 = 5 − 2 = 3</text>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">留下并列最多的 le 或 et 当周期 s，其余 3 块各花一次操作改成它</text>

  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i、j 都必须是 k 的倍数 → 每次操作恰改写一个整块，块结构永不乱</text>
</svg>
