<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟建前缀，三情况各自查询取最大</text>

  <rect x="24" y="34" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="52" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">① 统计 cnt₀、cnt₁；一趟扫描建 bal[]</text>
  <text x="174" y="68" text-anchor="middle" font-size="10" fill="#3d5a80" filter="url(#rough2)">'1' 记 +1，'0' 记 −1，bal[0] = 0 是哨兵</text>

  <path d="M 174 76 L 174 90" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="92" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="110" text-anchor="middle" font-size="10.5" fill="#2f5c24" font-weight="bold" filter="url(#rough2)">② Case A（差 0）：哈希记每个 bal 值</text>
  <text x="174" y="126" text-anchor="middle" font-size="10" fill="#3a5c30" filter="url(#rough2)">首次出现位置，先查后存，同值最远间距 → ans</text>

  <path d="M 174 134 L 174 148" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="150" width="300" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="168" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ Case B/C（差 ±2）：按 bal 值</text>
  <text x="174" y="184" text-anchor="middle" font-size="10" fill="#7a5c1a" filter="url(#rough2)">归档全部出现下标 pos[v]（有序列表）</text>

  <path d="M 174 192 L 174 206" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="208" width="300" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="226" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">④ 对每个右端 i：在 pos[bal[i]±2] 中二分</text>
  <text x="174" y="242" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">找 ≥ i − 2·cntₓ 的最小 l（且 l &lt; i）</text>
  <text x="174" y="258" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">用 i − l 更新 ans（最小 l ⟹ 最长窗口）</text>

  <path d="M 174 266 L 174 280" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="282" width="300" height="36" rx="8" fill="#f0f0f0" stroke="#777" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="304" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans = max(A, B, C)</text>

  <rect x="344" y="92" width="162" height="82" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="112" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">为什么是 ±2？</text>
  <text x="425" y="130" text-anchor="middle" font-size="9.3" fill="#3d5a80" filter="url(#rough2)">换出 0 换入 1 ⟹</text>
  <text x="425" y="146" text-anchor="middle" font-size="9.3" fill="#3d5a80" filter="url(#rough2)">c₀−1 = c₁+1 ⟹ 原差为 −2</text>
  <text x="425" y="162" text-anchor="middle" font-size="9.3" fill="#3d5a80" filter="url(#rough2)">对称地，+2 是换 1 出换 0 入</text>

  <rect x="344" y="188" width="162" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="208" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">二分的两个细节</text>
  <text x="425" y="226" text-anchor="middle" font-size="9.3" fill="#7a5c1a" filter="url(#rough2)">下界 i−2·cntₓ 自带</text>
  <text x="425" y="242" text-anchor="middle" font-size="9.3" fill="#7a5c1a" filter="url(#rough2)">「长度不超上界」的保证</text>
  <text x="425" y="258" text-anchor="middle" font-size="9.3" fill="#7a5c1a" filter="url(#rough2)">l &lt; i 防"反方向窗口"</text>

  <rect x="344" y="280" width="162" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="300" text-anchor="middle" font-size="10" fill="#2f5c24" font-weight="bold" filter="url(#rough2)">复杂度与上界</text>
  <text x="425" y="318" text-anchor="middle" font-size="9.3" fill="#3a5c30" filter="url(#rough2)">时间 O(n log n) · 空间 O(n)</text>
  <text x="425" y="334" text-anchor="middle" font-size="9.3" fill="#3a5c30" filter="url(#rough2)">答案 ≤ 2·min(cnt₀, cnt₁)</text>

  <text x="174" y="340" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">n = 10⁵：约 3×10⁶ 次比较，轻松通过</text>
</svg>
