<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 252" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="252" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：skill=[3,2,5,1,3,4] → 排序 [1,2,3,3,4,5]，target=6</text>

  <!-- columns: 配对[30-140] 左[140-200] 右[200-260] 和[260-320] 乘积[320-390] 累计ans[390-510] -->
  <!-- header row y=40-70 -->
  <rect x="30" y="40" width="480" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">配对 (i, j)</text>
  <text x="170" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">左 a[i]</text>
  <text x="230" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">右 a[j]</text>
  <text x="290" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">和</text>
  <text x="355" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">乘积</text>
  <text x="450" y="59" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">累计 ans</text>

  <line x1="140" y1="40" x2="140" y2="148" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="40" x2="200" y2="148" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="40" x2="260" y2="148" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="40" x2="320" y2="148" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="40" x2="390" y2="148" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1 (1,5) -->
  <rect x="30" y="70" width="480" height="26" fill="#e8f0fe" stroke="#cdd8e8" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="87" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(1, 5)</text>
  <text x="170" y="87" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="230" y="87" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="290" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6 ✓</text>
  <text x="355" y="87" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="450" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- row 2 (2,4) -->
  <rect x="30" y="96" width="480" height="26" fill="#e6f4ea" stroke="#cfe8cf" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(2, 4)</text>
  <text x="170" y="113" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="230" y="113" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="290" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6 ✓</text>
  <text x="355" y="113" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="450" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">13</text>

  <!-- row 3 (3,3) -->
  <rect x="30" y="122" width="480" height="26" fill="#fff8e1" stroke="#f0e3c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="139" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(3, 3)</text>
  <text x="170" y="139" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="230" y="139" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="290" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6 ✓</text>
  <text x="355" y="139" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="450" y="139" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">22</text>

  <!-- outer table border -->
  <rect x="30" y="40" width="480" height="108" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- arrow to result -->
  <path d="M 270 150 L 270 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="40" y="170" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return 22（1×5 + 2×4 + 3×3 = 5 + 8 + 9 = 22）</text>

  <!-- note -->
  <text x="270" y="226" text-anchor="middle" font-size="11" fill="#888">每对和都等于 6，配对成立；若任一对和 ≠ target 则返回 −1</text>
</svg>
