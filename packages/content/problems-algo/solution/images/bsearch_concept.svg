<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">有序数组 → 每轮比较一次，区间折半</text>

  <!-- nums row -->
  <text x="20" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="60" y="58" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="125" y="58" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="78" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="190" y="58" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="255" y="58" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="320" y="58" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="385" y="58" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="78" text-anchor="middle" font-size="12" fill="#333">12</text>

  <!-- index labels -->
  <text x="90" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="155" y="104" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="285" y="104" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="350" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4</text>
  <text x="415" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- target -->
  <text x="460" y="74" font-size="11" fill="#d6a040" font-weight="bold">target=9</text>

  <!-- bracket over whole array = initial interval -->
  <path d="M 62 50 L 62 44 L 448 44 L 448 50" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="255" y="38" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始区间 [left, right] = [0, 5]</text>

  <!-- left / right pointers -->
  <text x="20" y="146" font-size="12" fill="#888">指针：</text>
  <text x="90" y="146" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left</text>
  <path d="M 90 150 L 90 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="415" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right</text>
  <path d="M 415 150 L 415 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- mid -->
  <text x="255" y="172" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">mid = left + (right-left)/2</text>
  <path d="M 255 176 L 255 162" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <!-- key idea box -->
  <rect x="40" y="196" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">比较 nums[mid] 与 target，丢弃不可能的一半</text>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#555">mid 偏小 → left = mid+1；mid 偏大 → right = mid−1</text>

  <!-- complexity -->
  <rect x="40" y="270" width="440" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">区间每轮折半 → log₂(n) 轮 → O(log n)</text>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#555">n = 10⁴ 时约 14 轮，远优于线性扫描的 10⁴ 次</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#888">前提：数组已升序、元素互不相同</text>
</svg>
