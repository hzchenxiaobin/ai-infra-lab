<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：按值计数 + gcd 转移，逐行滚动</text>

  <!-- 开始 -->
  <rect x="140" y="36" width="100" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="53" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 190 62 L 190 76" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 初始化 -->
  <rect x="80" y="78" width="220" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 第 0 行：每个 v 做 dp[v] += 1</text>
  <path d="M 190 106 L 190 118" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 判断 -->
  <polygon points="190,120 250,152 190,184 130,152" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 还有下一行？</text>

  <path d="M 190 184 L 190 202" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="198" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ③ 值计数 -->
  <rect x="80" y="204" width="220" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 统计本行值计数 cnt[v]</text>
  <path d="M 190 232 L 190 242" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 枚举 -->
  <rect x="80" y="244" width="220" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ ndp 清零；枚举 g、v（跳零）</text>
  <path d="M 190 272 L 190 282" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 转移 -->
  <rect x="80" y="284" width="220" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ ndp[gcd(g,v)] += dp[g]·cnt[v]</text>
  <path d="M 190 312 L 190 322" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑥ 滚动 -->
  <rect x="80" y="324" width="220" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑥ dp ← ndp，进入下一行</text>

  <!-- 循环回边 -->
  <path d="M 80 338 L 36 338 L 36 152 L 126 152" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="44" y="248" font-size="10" fill="#d6a040" filter="url(#rough2)">循环</text>
  <text x="44" y="262" font-size="10" fill="#d6a040" filter="url(#rough2)">m−1 轮</text>

  <!-- 否 → 输出 -->
  <path d="M 250 152 L 338 152" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="146" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="340" y="136" width="150" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="415" y="157" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回 dp[1]</text>
  <text x="415" y="182" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（m = 1 时初始化后直接返回）</text>

  <!-- 复杂度注记 -->
  <rect x="330" y="204" width="170" height="96" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="415" y="228" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">复杂度</text>
  <text x="415" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">时间 O(m·V² + m·n)</text>
  <text x="415" y="270" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">空间 O(V)</text>
  <text x="415" y="290" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">V = 150，共约 3.4×10⁶ 次 gcd</text>
</svg>
