<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 6, 9, 1]</text>

  <!-- step 1: params -->
  <rect x="40" y="44" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="64" font-size="11" fill="#333">n=4,  min=1,  max=9,  range=8</text>
  <text x="56" y="82" font-size="11" fill="#333">bucket_size = max(1, 8 // 3) = 2</text>
  <text x="56" y="96" font-size="11" fill="#333">bucket_count = 8 // 2 + 1 = 5</text>

  <!-- buckets -->
  <text x="40" y="124" font-size="11" fill="#555" font-weight="bold">5 个桶（每桶跨度 2）：</text>

  <!-- bucket 0: [1,3) -->
  <rect x="40" y="132" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="148" text-anchor="middle" font-size="10" fill="#888">桶0 [1,3)</text>
  <circle cx="85" cy="168" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="178" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>

  <!-- bucket 1: [3,5) -->
  <rect x="135" y="132" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="148" text-anchor="middle" font-size="10" fill="#888">桶1 [3,5)</text>
  <circle cx="180" cy="168" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="178" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>

  <!-- bucket 2: [5,7) -->
  <rect x="230" y="132" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="148" text-anchor="middle" font-size="10" fill="#888">桶2 [5,7)</text>
  <circle cx="275" cy="168" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="275" y="178" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">6</text>

  <!-- bucket 3: [7,9) empty -->
  <rect x="325" y="132" width="90" height="50" fill="#fafafa" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="370" y="148" text-anchor="middle" font-size="10" fill="#aaa">桶3 [7,9)</text>
  <text x="370" y="170" text-anchor="middle" font-size="11" fill="#aaa">空</text>

  <!-- bucket 4: [9,11) -->
  <rect x="420" y="132" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="148" text-anchor="middle" font-size="10" fill="#888">桶4 [9,11)</text>
  <circle cx="465" cy="168" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="178" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">9</text>

  <!-- gaps between adjacent non-empty buckets -->
  <text x="40" y="210" font-size="11" fill="#555" font-weight="bold">扫相邻非空桶，gap = 当前桶.min − 上一桶.max：</text>

  <!-- gap 0->1 -->
  <path d="M130 220 L135 220" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="160" y="225" font-size="11" fill="#333">3 − 1 = </text>
  <text x="215" y="225" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- gap 1->2 -->
  <path d="M225 220 L230 220" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="255" y="225" font-size="11" fill="#333">6 − 3 = </text>
  <text x="310" y="225" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- gap 2->4 (skip empty bucket 3) -->
  <path d="M320 240 L325 240 L415 240 L420 240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="370" y="256" text-anchor="middle" font-size="10" fill="#b85450">跳过空桶3</text>
  <text x="445" y="225" font-size="11" fill="#333">9 − 6 = </text>
  <text x="500" y="225" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- result -->
  <rect x="150" y="276" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="295" text-anchor="middle" font-size="12" fill="#333">三个 gap：2, 3, 3</text>
  <text x="280" y="311" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最大间距 = max = 3 ✓</text>

  <!-- note -->
  <rect x="60" y="336" width="440" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="356" font-size="11" fill="#555" font-weight="bold">关键观察：</text>
  <text x="76" y="374" font-size="11" fill="#555">· 排序后为 [1, 3, 6, 9]，相邻差为 2, 3, 3 → 最大 3</text>
  <text x="76" y="392" font-size="11" fill="#555">· 桶大小=2 = 平均间距下取整，故桶内任意两数差 &lt; 2</text>
  <text x="76" y="410" font-size="11" fill="#555">· 最大间距(3) ≥ 桶大小(2)，必落在相邻桶之间，无需桶内比较</text>
</svg>
