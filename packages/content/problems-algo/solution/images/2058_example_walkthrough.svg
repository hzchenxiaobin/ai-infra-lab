<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：head = [5, 3, 1, 2, 5, 1, 2]</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">维护 prev/curr 三元组，pos 从 2 起扫描（pos=1 的 head 无前驱）</text>

  <!-- Header row: pos / val / 判定 / 状态 -->
  <rect x="36" y="56" width="488" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76"  y="71" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">pos</text>
  <text x="146" y="71" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">prev,curr,next</text>
  <text x="280" y="71" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">判定</text>
  <text x="436" y="71" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">first / prevIdx / minGap</text>

  <!-- Row pos=2: prev=5, curr=3, next=1 -->
  <rect x="36" y="80" width="488" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76"  y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="146" y="101" text-anchor="middle" font-size="11" fill="#555">5, 3, 1</text>
  <text x="280" y="101" text-anchor="middle" font-size="10.5" fill="#888">3&lt;5 但 3&gt;1 → 非临界</text>
  <text x="436" y="101" text-anchor="middle" font-size="10.5" fill="#888">-1 / -1 / ∞</text>

  <!-- Row pos=3: prev=3, curr=1, next=2 → MINIMA -->
  <rect x="36" y="116" width="488" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76"  y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="146" y="137" text-anchor="middle" font-size="11" fill="#555">3, 1, 2</text>
  <text x="280" y="137" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1&lt;3 且 1&lt;2 → 极小 ✓</text>
  <text x="436" y="137" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3 / 3 / ∞</text>

  <!-- Row pos=4: prev=1, curr=2, next=5 -->
  <rect x="36" y="152" width="488" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76"  y="173" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="146" y="173" text-anchor="middle" font-size="11" fill="#555">1, 2, 5</text>
  <text x="280" y="173" text-anchor="middle" font-size="10.5" fill="#888">2&gt;1 但 2&lt;5 → 非临界</text>
  <text x="436" y="173" text-anchor="middle" font-size="10.5" fill="#888">3 / 3 / ∞</text>

  <!-- Row pos=5: prev=2, curr=5, next=1 → MAXIMA -->
  <rect x="36" y="188" width="488" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76"  y="209" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="146" y="209" text-anchor="middle" font-size="11" fill="#555">2, 5, 1</text>
  <text x="280" y="209" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">5&gt;2 且 5&gt;1 → 极大 ✓</text>
  <text x="436" y="209" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3 / 5 / min(∞,5-3)=2</text>

  <!-- Row pos=6: prev=5, curr=1, next=2 → MINIMA -->
  <rect x="36" y="224" width="488" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76"  y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="146" y="245" text-anchor="middle" font-size="11" fill="#555">5, 1, 2</text>
  <text x="280" y="245" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1&lt;5 且 1&lt;2 → 极小 ✓</text>
  <text x="436" y="245" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3 / 6 / min(2,6-5)=1</text>

  <!-- Row pos=7: curr.next==null, stop -->
  <rect x="36" y="260" width="488" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76"  y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="146" y="281" text-anchor="middle" font-size="11" fill="#555">1, 2, null</text>
  <text x="280" y="281" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">curr.next==null → 停</text>
  <text x="436" y="281" text-anchor="middle" font-size="10.5" fill="#888">尾节点无后继，不判定</text>

  <!-- Result box -->
  <rect x="36" y="308" width="488" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">收尾结算</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#555">first=3, 末个临界点 pos=6 → minGap=1, maxGap=6−3=3</text>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 [1, 3]</text>

  <!-- Gap illustration -->
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">临界点序列（按 pos 升序）：3 → 5 → 6</text>

  <!-- min gap arrow: between 5 and 6 -->
  <rect x="150" y="406" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="421" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <path d="M 210 417 L 258 417" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="258" y="406" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="421" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <path d="M 318 417 L 366 417" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="438" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">min=1</text>
  <rect x="366" y="406" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="421" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- max gap bracket: from 3 to 6 -->
  <path d="M 180 402 L 180 398 L 396 398 L 396 402" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="288" y="394" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">max=3</text>
</svg>
