<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：异或的两条性质</text>

  <!-- property 1: a ^ a = 0 -->
  <text x="40" y="68" font-size="12" fill="#446688" font-weight="bold">性质① 相同必抵消</text>
  <rect x="40" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="62" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="98" y="103" font-size="16" fill="#888" font-weight="bold">⊕</text>
  <rect x="112" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="170" y="103" font-size="16" fill="#888" font-weight="bold">=</text>
  <rect x="188" y="80" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="104" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="248" y="104" font-size="11" fill="#888">两个相同数异或 → 0</text>

  <!-- property 2: a ^ 0 = a -->
  <text x="40" y="148" font-size="12" fill="#446688" font-weight="bold">性质② 与零恒等</text>
  <rect x="40" y="160" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="62" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="98" y="183" font-size="16" fill="#888" font-weight="bold">⊕</text>
  <rect x="112" y="160" width="44" height="36" fill="#f0f0f0" stroke="#888" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="184" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">0</text>
  <text x="170" y="183" font-size="16" fill="#888" font-weight="bold">=</text>
  <rect x="188" y="160" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="248" y="184" font-size="11" fill="#888">异或 0 → 保持不变</text>

  <!-- divider -->
  <path d="M 40 220 L 480 220" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">推论：全体异或 → 成对抵消，只剩落单者</text>

  <!-- array [4,1,2,1,2] -->
  <rect x="60" y="262" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="286" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="108" y="262" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="286" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="262" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="286" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="204" y="262" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="286" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="252" y="262" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="274" y="286" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- bracket pairs -->
  <path d="M 108 306 L 108 314 L 152 314 L 152 306" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 204 306 L 204 314 L 248 314 L 248 306" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="130" y="330" text-anchor="middle" font-size="10.5" fill="#446688">1⊕1→0</text>
  <text x="226" y="330" text-anchor="middle" font-size="10.5" fill="#b85450">2⊕2→0</text>

  <!-- result -->
  <text x="312" y="286" font-size="18" fill="#888" font-weight="bold">⇒</text>
  <rect x="344" y="262" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="286" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>
  <text x="400" y="286" font-size="11" fill="#d6a040" font-weight="bold">← 落单者</text>

  <!-- footer -->
  <rect x="40" y="340" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">⊕ 满足交换律/结合律 → 顺序无关，成对的必相消</text>
</svg>
