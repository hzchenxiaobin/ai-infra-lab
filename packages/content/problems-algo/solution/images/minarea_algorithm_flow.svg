<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="540" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最小面积矩形：算法流程</text>

  <!-- Init: build set -->
  <rect x="80" y="40" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">建立哈希集合 point_set</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" fill="#555">把所有点加入集合，支持 O(1) 查点</text>

  <path d="M 230 100 L 230 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Init ans -->
  <rect x="110" y="122" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="147" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">ans = +∞</text>

  <path d="M 230 166 L 230 184" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Outer loop -->
  <rect x="80" y="188" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="208" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i in 0..n-1</text>
  <text x="230" y="224" text-anchor="middle" font-size="10.5" fill="#555">枚举第一个对角点 p₁</text>

  <path d="M 230 236 L 230 254" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Inner loop -->
  <rect x="80" y="258" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="278" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for j in i+1..n-1</text>
  <text x="230" y="294" text-anchor="middle" font-size="10.5" fill="#555">枚举第二个对角点 p₂</text>

  <path d="M 230 306 L 230 322" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: diagonal condition -->
  <polygon points="230,326 370,372 230,418 90,372" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="368" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">x₁≠x₂ 且 y₁≠y₂ ?</text>
  <text x="230" y="386" text-anchor="middle" font-size="10" fill="#777">可作对角线？</text>

  <!-- No branch -->
  <path d="M 90 372 L 40 372 L 40 412" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="50" y="365" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="2" y="416" width="76" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="440" text-anchor="middle" font-size="10.5" fill="#555">跳过</text>

  <!-- Yes branch -->
  <path d="M 370 372 L 410 372 L 410 412" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="382" y="365" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <rect x="330" y="416" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="436" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">查两角存在?</text>
  <text x="390" y="452" text-anchor="middle" font-size="9.5" fill="#555">(x₁,y₂) &amp; (x₂,y₁)</text>
  <text x="390" y="465" text-anchor="middle" font-size="9.5" fill="#82b366">都在 set 中?</text>

  <!-- Diamond: both exist -->
  <polygon points="390,480 450,505 390,530 330,505" fill="#f0f0f0" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="509" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">都在?</text>

  <!-- update ans -->
  <path d="M 450 505 L 455 505" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="390" y="535" text-anchor="middle" font-size="9" fill="#d6a040">Yes → ans = min(ans, |Δx|·|Δy|)</text>

  <!-- loop back arrows -->
  <path d="M 40 456 L 40 510 L 20 510 L 20 278 L 78 278" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="12" y="395" font-size="9" fill="#aaa" transform="rotate(-90 12 395)">内循环</text>

  <path d="M 430 530 L 430 522 L 440 522 L 440 208 L 382 208" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- final -->
  <rect x="120" y="500" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="210" y="521" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">return ans == ∞ ? 0 : ans</text>
</svg>
