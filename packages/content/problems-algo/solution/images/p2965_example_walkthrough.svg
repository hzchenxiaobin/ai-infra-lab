<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：入桶一遍 → 查桶一遍</text>

  <!-- ===== Example 2 ===== -->
  <!-- 3x3 grid -->
  <rect x="48" y="44" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="67" y="66" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="90" y="44" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="109" y="66" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="132" y="44" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="151" y="66" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">7</text>
  <rect x="48" y="82" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="67" y="104" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">8</text>
  <rect x="90" y="82" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="104" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="132" y="82" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="151" y="104" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <rect x="48" y="120" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="67" y="142" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">3</text>
  <rect x="90" y="120" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="109" y="142" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">4</text>
  <rect x="132" y="120" width="38" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="151" y="142" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">6</text>

  <text x="111" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">grid（n = 3）</text>

  <path d="M 174 100 L 194 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="185" y="90" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">入桶</text>

  <text x="200" y="44" font-size="11" fill="#555" filter="url(#rough2)">入桶后 cnt[v]：</text>

  <!-- count table header: v = 1..9 -->
  <rect x="200" y="52" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="214" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="230" y="52" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="260" y="52" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="274" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="290" y="52" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="304" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="320" y="52" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="334" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="350" y="52" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="364" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="380" y="52" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="394" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="410" y="52" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="440" y="52" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="454" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">9</text>

  <!-- count row -->
  <rect x="200" y="80" width="28" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="214" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="230" y="80" width="28" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="260" y="80" width="28" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="274" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="290" y="80" width="28" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="304" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="320" y="80" width="28" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="334" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="350" y="80" width="28" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="364" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="380" y="80" width="28" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="394" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="410" y="80" width="28" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="440" y="80" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="98" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- verdict arrows -->
  <path d="M 334 112 C 334 126, 320 126, 310 138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 454 112 C 454 126, 448 126, 444 138" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- verdict boxes -->
  <rect x="232" y="140" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="307" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">空桶 ⇒ b = 5</text>
  <rect x="366" y="140" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="441" y="162" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">两颗 ⇒ a = 9</text>

  <!-- answer -->
  <path d="M 307 176 L 307 186" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 441 176 L 441 186" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="232" y="190" width="284" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="374" y="213" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = [a, b] = [9, 5]</text>

  <!-- ===== Example 1 ===== -->
  <text x="48" y="252" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">快速验证示例 1：grid = [[1,3],[2,2]]（n = 2）</text>

  <rect x="48" y="266" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="287" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="88" y="266" width="36" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="106" y="287" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">3</text>
  <rect x="48" y="302" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="323" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="88" y="302" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="323" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 128 300 L 164 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- count table v=1..4 -->
  <rect x="170" y="266" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="284" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="204" y="266" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="284" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="238" y="266" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="254" y="284" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="272" y="266" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="284" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>

  <rect x="170" y="294" width="32" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="312" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="204" y="294" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="312" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="238" y="294" width="32" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="254" y="312" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="272" y="294" width="32" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <path d="M 308 300 L 324 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="330" y="266" width="168" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="414" y="290" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">cnt[2] = 2 ⇒ a = 2</text>
  <text x="414" y="310" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">cnt[4] = 0 ⇒ b = 4</text>
  <text x="414" y="330" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = [2, 4]</text>

  <!-- bottom note -->
  <rect x="48" y="356" width="424" height="60" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">① 第一遍把 n² 个值全部入桶，第二遍按 1..n² 顺序查桶；</text>
  <text x="260" y="396" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">② 题目保证恰好一个桶计数为 2（重复 a）、恰好一个为 0（缺失 b）；</text>
  <text x="260" y="414" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">③ 找齐 a、b 两问才能返回——只找到 a 就 return 会漏 b。</text>
</svg>
