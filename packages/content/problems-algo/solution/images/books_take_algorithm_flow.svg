<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单调栈 + DP 一次遍历 O(n)</text>

  <rect x="90" y="42" width="380" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 弹栈</text>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#333">while 栈非空 ∧ books[stk.top()] − stk.top() ≥ books[i] − i : pop()</text>

  <path d="M 280 88 L 280 102" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="90" y="104" width="380" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② 定位断点 j</text>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#333">j = 栈空 ? −1 : 栈顶</text>

  <path d="M 280 142 L 280 156" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="90" y="158" width="380" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 计算 dp[i]</text>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#333">len = i − j， last = books[i] − len + 1</text>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a">last &gt; 1 → dp[i] = dp[j] + (books[i] + last) × len / 2</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#d6a040">last ≤ 1 → dp[i] = books[i] × (books[i] + 1) / 2</text>

  <path d="M 280 244 L 280 258" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="90" y="260" width="380" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">④ 压栈 stk.push(i)</text>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#333">→ 处理 i + 1，直至遍历完</text>

  <rect x="90" y="310" width="380" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = max(dp[0..n−1])</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#888">每个下标至多入栈、出栈各一次 → 均摊 O(1) / 元素</text>
</svg>
