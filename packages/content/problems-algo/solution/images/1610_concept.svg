<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：点 → 极角 → 排序成环 → 滑动窗口取最大扇区</text>

  <!-- Step 1: points to angles -->
  <text x="30" y="68" font-size="12" fill="#888" font-weight="bold">① 求极角</text>
  <text x="30" y="86" font-size="10.5" fill="#666">对每个点 (xi,yi)：</text>
  <text x="30" y="102" font-size="10.5" fill="#666">dx=xi−px, dy=yi−py</text>
  <text x="30" y="118" font-size="10.5" fill="#666">θ = atan2(dy,dx) ∈[0,360)</text>

  <!-- location point -->
  <circle cx="150" cy="150" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="160" y="146" font-size="10" fill="#b85450" font-weight="bold">location</text>
  <!-- east arrow -->
  <path d="M150,150 L200,150" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="144" text-anchor="middle" font-size="9" fill="#888">东</text>
  <!-- some points -->
  <circle cx="210" cy="110" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="120" cy="120" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="180" cy="180" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="90" cy="170" r="4" fill="#446688" filter="url(#rough2)"/>
  <!-- angle arcs -->
  <path d="M170,150 A20,20 0 0,0 168,138" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="138" font-size="9" fill="#d6a040">θ₁</text>
  <path d="M150,170 A20,20 0 0,0 142,160" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="168" font-size="9" fill="#d6a040">θ₂</text>

  <!-- Step 2: sorted ring -->
  <text x="290" y="68" font-size="12" fill="#888" font-weight="bold">② 排序 + 拼接</text>
  <text x="290" y="86" font-size="10.5" fill="#666">排序后 θ₁≤θ₂≤…≤θₙ</text>
  <text x="290" y="102" font-size="10.5" fill="#666">复制一份 +360°：</text>
  <text x="290" y="118" font-size="10.5" fill="#666">θ_{n+i}=θ_i+360</text>

  <!-- ring visualization -->
  <circle cx="380" cy="170" r="44" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- ticks on ring -->
  <line x1="380" y1="126" x2="380" y2="118" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="114" text-anchor="middle" font-size="9" fill="#b85450">0°</text>
  <line x1="424" y1="170" x2="432" y2="170" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="174" font-size="9" fill="#446688">90°</text>
  <line x1="380" y1="214" x2="380" y2="222" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="234" text-anchor="middle" font-size="9" fill="#446688">180°</text>
  <line x1="336" y1="170" x2="328" y2="170" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="174" text-anchor="end" font-size="9" fill="#446688">270°</text>
  <!-- points on ring -->
  <circle cx="395" cy="132" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="410" cy="150" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="345" cy="195" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="360" cy="208" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="395" cy="205" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <!-- wrap dashed -->
  <path d="M424,170 A60,60 0 0,1 380,226" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="448" y="210" font-size="9" fill="#b85450">+360 拼接</text>

  <!-- Step 3: sliding window -->
  <text x="30" y="262" font-size="12" fill="#888" font-weight="bold">③ 滑动窗口</text>
  <text x="30" y="280" font-size="10.5" fill="#666">在拼接数组上双指针：</text>
  <text x="30" y="296" font-size="10.5" fill="#666">θ[r]−θ[l] ≤ angle</text>
  <text x="30" y="312" font-size="10.5" fill="#666">则 r++；否则 l++</text>
  <text x="30" y="328" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans=max(ans, r−l+1)</text>

  <!-- angle axis -->
  <line x1="60" y1="370" x2="540" y2="370" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="374" font-size="10" fill="#446688">角度</text>
  <!-- ticks -->
  <g filter="url(#rough2)">
    <line x1="100" y1="366" x2="100" y2="374" stroke="#446688" stroke-width="1.3"/>
    <line x1="160" y1="366" x2="160" y2="374" stroke="#446688" stroke-width="1.3"/>
    <line x1="220" y1="366" x2="220" y2="374" stroke="#446688" stroke-width="1.3"/>
    <line x1="280" y1="366" x2="280" y2="374" stroke="#446688" stroke-width="1.3"/>
    <line x1="340" y1="366" x2="340" y2="374" stroke="#446688" stroke-width="1.3"/>
    <line x1="400" y1="366" x2="400" y2="374" stroke="#446688" stroke-width="1.3"/>
    <line x1="460" y1="366" x2="460" y2="374" stroke="#446688" stroke-width="1.3"/>
    <line x1="520" y1="366" x2="520" y2="374" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="100" y="386" text-anchor="middle" font-size="9" fill="#666">θ₁</text>
  <text x="160" y="386" text-anchor="middle" font-size="9" fill="#666">θ₂</text>
  <text x="220" y="386" text-anchor="middle" font-size="9" fill="#666">θ₃</text>
  <text x="280" y="386" text-anchor="middle" font-size="9" fill="#666">θ₄</text>
  <text x="340" y="386" text-anchor="middle" font-size="9" fill="#666">θ₅</text>
  <text x="400" y="386" text-anchor="middle" font-size="9" fill="#666">θ₁+360</text>
  <text x="460" y="386" text-anchor="middle" font-size="9" fill="#666">θ₂+360</text>
  <!-- window bracket -->
  <rect x="190" y="346" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">窗口宽度 ≤ angle</text>
  <!-- l, r pointers -->
  <text x="220" y="406" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">l</text>
  <text x="340" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">r</text>

  <!-- Key insight box -->
  <rect x="30" y="262" width="0" height="0" fill="none"/>

  <!-- Bottom note -->
  <rect x="200" y="262" width="340" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="370" y="284" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">与 location 重合的点 → 永远可见</text>
  <text x="370" y="302" text-anchor="middle" font-size="11" fill="#444">单独计数 extra，最终 ans = 窗口最大值 + extra</text>
</svg>
