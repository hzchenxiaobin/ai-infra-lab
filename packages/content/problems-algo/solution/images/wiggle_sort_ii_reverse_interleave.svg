<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">正向 vs 反向穿插：中位数碰撞的消解</text>

  <!-- ====== Top: Forward interleave (FAILS) ====== -->
  <text x="36" y="58" font-size="12" fill="#b85450" font-weight="bold">✗ 正向穿插（中位数在中间碰撞）</text>

  <text x="36" y="80" font-size="10.5" fill="#888">S 正序：</text>
  <g filter="url(#rough2)">
    <rect x="90" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="124" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="158" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
  </g>
  <text x="107" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="141" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="175" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <text x="210" y="80" font-size="10.5" fill="#888">L 正序：</text>
  <g filter="url(#rough2)">
    <rect x="260" y="68" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="294" y="68" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="328" y="68" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <text x="277" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="311" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="345" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <!-- result row forward -->
  <text x="36" y="118" font-size="10.5" fill="#888">结果：</text>
  <g filter="url(#rough2)">
    <rect x="80" y="106" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="116" y="106" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="152" y="106" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="188" y="106" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="224" y="106" width="36" height="28" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="260" y="106" width="36" height="28" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <text x="98" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="134" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="170" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="206" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="242" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="278" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <text x="310" y="118" font-size="10" fill="#b85450">⚠ 下标 4,5：2&lt;3 ✓</text>
  <text x="310" y="132" font-size="10" fill="#b85450">但 S[-1]=2 与 L[0]=2 靠近</text>

  <!-- collision circle -->
  <ellipse cx="242" cy="120" rx="20" ry="16" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="380" y="118" font-size="10" fill="#b85450" font-weight="bold">若 S[-1]==L[0]</text>
  <text x="380" y="132" font-size="10" fill="#b85450">→ 谷峰等值碰撞！</text>

  <!-- divider -->
  <path d="M 36 152 L 524 152" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ====== Bottom: Reverse interleave (WORKS) ====== -->
  <text x="36" y="178" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 反向穿插（中位数推到两端，无碰撞）</text>

  <text x="36" y="200" font-size="10.5" fill="#888">S' 逆序：</text>
  <g filter="url(#rough2)">
    <rect x="90" y="188" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="124" y="188" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="158" y="188" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="107" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="141" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="175" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <text x="210" y="200" font-size="10.5" fill="#888">L' 逆序：</text>
  <g filter="url(#rough2)">
    <rect x="260" y="188" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="294" y="188" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="328" y="188" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <text x="277" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="311" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="345" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- arrows showing S[-1] goes to front, L[0] goes to end -->
  <path d="M 158 188 L 158 178 L 98 178 L 98 226" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="174" font-size="9" fill="#446688">S[-1]→前</text>

  <path d="M 260 188 L 260 178 L 345 178 L 345 226" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="174" font-size="9" fill="#b85450">L[0]→后</text>

  <!-- result row reverse -->
  <text x="36" y="240" font-size="10.5" fill="#888">结果：</text>
  <g filter="url(#rough2)">
    <rect x="80" y="228" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="116" y="228" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="152" y="228" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="188" y="228" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="224" y="228" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="260" y="228" width="36" height="28" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <text x="98" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="134" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="170" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="206" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="242" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="278" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <text x="310" y="240" font-size="10" fill="#4a7a3a">✓ 2&lt;3&gt;1&lt;3&gt;1&lt;2</text>
  <text x="310" y="254" font-size="10" fill="#4a7a3a">中位数 2 在下标 0 和 5</text>

  <!-- index labels for reverse result -->
  <text x="98" y="272" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="134" y="272" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="170" y="272" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="206" y="272" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="242" y="272" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="278" y="272" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- divider -->
  <path d="M 36 284 L 524 284" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ====== Proof sketch ====== -->
  <text x="36" y="308" font-size="12" fill="#446688" font-weight="bold">④ 为什么不碰撞？（证明直觉）</text>

  <!-- S' m zone -->
  <rect x="60" y="324" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="342" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">S' 中的 m</text>
  <text x="120" y="356" text-anchor="middle" font-size="9.5" fill="#555">占据前 s 个谷位（下标 0,2,…）</text>

  <!-- gap -->
  <rect x="190" y="324" width="140" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1.3" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#888">非中位数区</text>
  <text x="260" y="356" text-anchor="middle" font-size="9.5" fill="#888">（隔开两端 m）</text>

  <!-- L' m zone -->
  <rect x="340" y="324" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="342" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">L' 中的 m</text>
  <text x="400" y="356" text-anchor="middle" font-size="9.5" fill="#555">占据后 l 个峰位（下标 n-1,…）</text>

  <!-- condition box -->
  <rect x="60" y="380" width="400" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">碰撞条件：s + l &gt; ⌊n/2⌋</text>
  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#555">但有效答案保证：中位数频次 s + l ≤ ⌊n/2⌋</text>
  <text x="260" y="432" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ 矛盾！两端的 m 区域不重叠，无碰撞 ✓</text>
</svg>
