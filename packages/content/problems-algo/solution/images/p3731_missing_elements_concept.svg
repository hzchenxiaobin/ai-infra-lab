<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：区间 [lo, hi] 逐格点名，集合 O(1) 判定</text>

  <text x="260" y="44" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1,4,2,5]（元素互不相同）</text>

  <!-- 哈希集合 -->
  <rect x="100" y="54" width="250" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="124" y="83" font-size="13" fill="#446688" filter="url(#rough2)">S =</text>
  <rect x="150" y="63" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="190" y="63" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="63" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="270" y="63" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <path d="M 260 102 L 260 122" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="118" font-size="10" fill="#666" filter="url(#rough2)">每个候选 x 查集合（O(1)）</text>

  <!-- 范围括线 -->
  <text x="200" y="131" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">完整范围 [lo, hi] = [1, 5]</text>
  <path d="M 70 144 L 70 137 L 330 137 L 330 144" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- 数轴格子 -->
  <rect x="70" y="150" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="175" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="122" y="150" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="175" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="174" y="150" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="226" y="150" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="175" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="278" y="150" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="175" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <!-- 判定标记 -->
  <text x="96" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="148" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="200" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="252" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="304" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="346" y="164" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 存在 → 跳过</text>
  <text x="346" y="186" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 缺失 → 收入答案</text>

  <!-- 答案横幅 -->
  <rect x="130" y="220" width="260" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = [3]（升序枚举 ⇒ 免排序）</text>

  <!-- 说明框 -->
  <rect x="15" y="262" width="490" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">枚举范围由题设锁定：lo = min、hi = max 必在数组中，缺失只藏在内部</text>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">缺失个数 = (hi − lo + 1) − n = 5 − 4 = 1 ⇒ 可校验结果长度</text>

  <text x="16" y="338" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 常见 WA：枚举 [1, 100] 全值域会把范围外的数误报成缺失（nums = [5,1] 时 6~100 并不算缺失）</text>
  <text x="16" y="352" font-size="10" fill="#999" filter="url(#rough2)">💡 元素互不相同 ⇒ 每个值至多占集合一格，不存在重复计数问题</text>
</svg>
