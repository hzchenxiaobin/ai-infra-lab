<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心核心：每次取最短的前后匹配块 P</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">text = P + M + P，ans += 2，对 M 递归</text>

  <!-- text row: P | M | P -->
  <g font-size="13">
    <!-- P left (3 boxes) -->
    <rect x="60" y="72" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="92" y="72" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="124" y="72" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="108" y="93" text-anchor="middle" fill="#446688" font-weight="bold">P</text>
    <text x="108" y="60" text-anchor="middle" font-size="10" fill="#446688">前缀 i→</text>

    <!-- M middle (5 boxes) -->
    <rect x="156" y="72" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="188" y="72" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="220" y="72" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="252" y="72" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <rect x="284" y="72" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="236" y="93" text-anchor="middle" fill="#888" font-weight="bold">M（待递归）</text>

    <!-- P right (3 boxes) -->
    <rect x="316" y="72" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="348" y="72" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="380" y="72" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="364" y="93" text-anchor="middle" fill="#446688" font-weight="bold">P</text>
    <text x="364" y="60" text-anchor="middle" font-size="10" fill="#446688">←后缀 j</text>

    <!-- equality brackets -->
    <path d="M 60 116 L 60 122 L 156 122 L 156 116" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <path d="M 316 116 L 316 122 L 412 122 L 412 116" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <text x="108" y="138" text-anchor="middle" font-size="10" fill="#446688">前缀 P</text>
    <text x="364" y="138" text-anchor="middle" font-size="10" fill="#446688">后缀 P（相等）</text>
  </g>

  <!-- ans annotation -->
  <rect x="120" y="154" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="175" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">匹配成功 → ans += 2，对中间 M 递归</text>

  <!-- comparison: shortest vs longer -->
  <line x1="20" y1="202" x2="520" y2="202" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="222" font-size="12" fill="#b85450" font-weight="bold">为何取「最短」而非更长？</text>

  <!-- longer chunk illustration (crossed out) -->
  <g font-size="11">
    <rect x="60" y="236" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="92" y="236" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="124" y="236" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="156" y="236" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <rect x="188" y="236" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="140" y="255" text-anchor="middle" fill="#b85450" font-weight="bold">更长的首段 c1</text>
    <path d="M 55 232 L 225 268" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
    <text x="245" y="252" font-size="10" fill="#b85450">c1 含 P 为前后缀</text>
    <text x="245" y="266" font-size="10" fill="#b85450">→ 可再拆 ≥2 段 → 非最优</text>
  </g>

  <rect x="30" y="288" width="490" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="308" font-size="11" fill="#d6a040" font-weight="bold">交换论证（一句话）：</text>
  <text x="50" y="326" font-size="10" fill="#555">若最优解首段 c1 比 P 长，则 c1 含 P 为前后缀（border），c1 自身可拆成 ≥2 段，</text>
  <text x="50" y="342" font-size="10" fill="#555">替换后总段数增加 → 与最优矛盾。故最优首段 = P，贪心安全。</text>
</svg>
