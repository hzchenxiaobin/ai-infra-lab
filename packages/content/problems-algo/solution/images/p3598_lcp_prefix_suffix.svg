<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">删除 words[2]：只有两条相邻对消失，一条新对诞生</text>

  <!-- words 行：abc abd abc abd abc，删 #2 -->
  <rect x="32" y="44" width="74" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="69" y="60" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">#0</text>
  <text x="69" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">abc</text>

  <rect x="120" y="44" width="74" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="157" y="60" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">#1</text>
  <text x="157" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">abd</text>

  <rect x="208" y="44" width="74" height="46" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="245" y="60" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">#2</text>
  <text x="245" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#999" filter="url(#rough2)">abc</text>
  <path d="M 214 50 L 270 84" stroke="#c07070" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 270 50 L 214 84" stroke="#c07070" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="296" y="44" width="74" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="333" y="60" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">#3</text>
  <text x="333" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">abd</text>

  <rect x="384" y="44" width="74" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="421" y="60" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">#4</text>
  <text x="421" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">abc</text>

  <text x="32" y="112" font-size="11" fill="#888" filter="url(#rough2)">相邻对 j = (w[j], w[j+1]) 的 LCP 值：</text>

  <!-- 相邻对行：lcp = [2, 1, 2, 1] -->
  <rect x="81" y="126" width="64" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="113" y="147" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">① 2</text>

  <rect x="169" y="126" width="64" height="32" rx="4" fill="#f2f2f2" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="201" y="147" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">② 1</text>
  <path d="M 175 130 L 227 154" stroke="#c07070" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 227 130 L 175 154" stroke="#c07070" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="257" y="126" width="64" height="32" rx="4" fill="#f2f2f2" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="289" y="147" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">③ 2</text>
  <path d="M 263 130 L 315 154" stroke="#c07070" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 315 130 L 263 154" stroke="#c07070" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="345" y="126" width="64" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="377" y="147" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">④ 1</text>

  <text x="113" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">保留 → 左半段</text>
  <text x="201" y="172" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">随删除消失</text>
  <text x="289" y="172" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">随删除消失</text>
  <text x="377" y="172" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">保留 → 右半段</text>

  <!-- 三段结果 -->
  <rect x="28" y="192" width="145" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">左半段（①）</text>
  <text x="100" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">max = pre[0] = 2</text>

  <rect x="188" y="192" width="145" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">新对（②③ 处）</text>
  <text x="260" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">LCP(abd, abd) = 3</text>

  <rect x="348" y="192" width="144" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">右半段（④）</text>
  <text x="420" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">max = suf[3] = 1</text>

  <!-- 汇聚箭头 -->
  <path d="M 100 252 C 100 275, 180 278, 205 288" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 260 252 L 256 288" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 420 252 C 420 275, 330 278, 305 288" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="290" width="460" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">answer[2] = max( pre[0], LCP(w[1], w[3]), suf[3] ) = 3</text>

  <rect x="30" y="350" width="460" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">通用式：answer[i] = max( pre[i−2], LCP(w[i−1], w[i+1]), suf[i+1] )</text>
  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">缺项（i 在边界时）记 0；pre / suf 一趟预处理，每个 i 查询 O(1)</text>

  <text x="260" y="422" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">新对每个 i 只现算一次，总代价 ≤ Σ|words[j]| —— 整体仍是线性</text>
</svg>
