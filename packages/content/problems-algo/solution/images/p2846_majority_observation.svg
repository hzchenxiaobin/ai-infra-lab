<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察①：答案 = 路径长度 L − 众数权值的频次
  </text>

  <!-- path a..b, 5 edges with weights 1,1,2,2,1 -->
  <path d="M70,95 L125,95" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M155,95 L210,95" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M240,95 L295,95" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M325,95 L380,95" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M410,95 L465,95" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <text x="97" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="182" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="267" y="82" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="352" y="82" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="437" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- cross out the two w=2 edges -->
  <path d="M259,87 L275,103" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M275,87 L259,103" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M344,87 L360,103" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M360,87 L344,103" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="310" y="122" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">各改 1 次 → 变成 1</text>

  <!-- nodes -->
  <ellipse cx="55" cy="95" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="100" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <ellipse cx="140" cy="95" rx="12" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="225" cy="95" rx="12" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="310" cy="95" rx="12" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="395" cy="95" rx="12" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="480" cy="95" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="100" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">b</text>

  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    路径长度 L = 5，权值分布：1 出现 3 次、2 出现 2 次
  </text>

  <!-- freq bars -->
  <text x="42" y="174" font-size="12" fill="#4a7a3a" filter="url(#rough2)">w=1 频次</text>
  <rect x="118" y="157" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="157" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="194" y="157" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="176" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3 条 → 全保留（众数）</text>

  <text x="42" y="224" font-size="12" fill="#b85450" filter="url(#rough2)">w=2 频次</text>
  <rect x="118" y="207" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="207" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="226" font-size="12" fill="#b85450" filter="url(#rough2)">2 条 → 每条改 1 次</text>

  <!-- formula box -->
  <rect x="55" y="252" width="410" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    答案 = L − max cnt_w = 5 − 3 = 2
  </text>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    下界：最终值 t 固定后，权 ≠ t 的边每条至少改一次 ⇒ ≥ L − cnt_t ≥ L − max
  </text>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    达到：t 取出现最多的权值，恰好改 L − max 次
  </text>
</svg>
