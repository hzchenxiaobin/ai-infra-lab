<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：cur 一归零就切割</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 1：nums = [1, 0, 2, 0, 1, 2]，total = 1∧0∧2∧0∧1∧2 = 0</text>

  <!-- index row -->
  <text x="84" y="77" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">下标 i</text>
  <g filter="url(#rough2)" font-size="11" fill="#999">
    <text x="116" y="77" text-anchor="middle">0</text>
    <text x="178" y="77" text-anchor="middle">1</text>
    <text x="240" y="77" text-anchor="middle">2</text>
    <text x="302" y="77" text-anchor="middle">3</text>
    <text x="364" y="77" text-anchor="middle">4</text>
    <text x="426" y="77" text-anchor="middle">5</text>
  </g>

  <!-- element row -->
  <text x="84" y="117" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">元素 x</text>
  <g filter="url(#rough2)">
    <rect x="90" y="94" width="52" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="116" y="117" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">1</text>
    <rect x="152" y="94" width="52" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="178" y="117" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">0</text>
    <rect x="214" y="94" width="52" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="240" y="117" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">2</text>
    <rect x="276" y="94" width="52" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="302" y="117" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">0</text>
    <rect x="338" y="94" width="52" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="364" y="117" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">1</text>
    <rect x="400" y="94" width="52" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="426" y="117" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">2</text>
  </g>

  <!-- cur row -->
  <text x="84" y="161" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">cur（AND 后）</text>
  <g filter="url(#rough2)">
    <rect x="90" y="138" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="116" y="161" text-anchor="middle" font-size="14" fill="#446688">1</text>
    <rect x="152" y="138" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="178" y="161" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
    <rect x="214" y="138" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="240" y="161" text-anchor="middle" font-size="14" fill="#446688">2</text>
    <rect x="276" y="138" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="302" y="161" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
    <rect x="338" y="138" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="364" y="161" text-anchor="middle" font-size="14" fill="#446688">1</text>
    <rect x="400" y="138" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="426" y="161" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- action row -->
  <text x="84" y="204" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">动作</text>
  <g filter="url(#rough2)">
    <rect x="90" y="182" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="116" y="204" text-anchor="middle" font-size="11" fill="#888">继续</text>
    <rect x="152" y="182" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="178" y="196" text-anchor="middle" font-size="10" fill="#b07818" font-weight="bold">✂ 切割！</text>
    <text x="178" y="211" text-anchor="middle" font-size="10" fill="#b07818">cnt = 1</text>
    <rect x="214" y="182" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="240" y="204" text-anchor="middle" font-size="11" fill="#888">继续</text>
    <rect x="276" y="182" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="302" y="196" text-anchor="middle" font-size="10" fill="#b07818" font-weight="bold">✂ 切割！</text>
    <text x="302" y="211" text-anchor="middle" font-size="10" fill="#b07818">cnt = 2</text>
    <rect x="338" y="182" width="52" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="364" y="204" text-anchor="middle" font-size="11" fill="#888">继续</text>
    <rect x="400" y="182" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="426" y="196" text-anchor="middle" font-size="10" fill="#b07818" font-weight="bold">✂ 切割！</text>
    <text x="426" y="211" text-anchor="middle" font-size="10" fill="#b07818">cnt = 3</text>
  </g>

  <!-- segments -->
  <text x="84" y="256" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">分段</text>
  <g filter="url(#rough2)">
    <rect x="90" y="234" width="114" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="147" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,0] 分数 0</text>
    <rect x="214" y="234" width="114" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="271" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[2,0] 分数 0</text>
    <rect x="338" y="234" width="114" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="395" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2] 分数 0</text>
  </g>

  <rect x="90" y="280" width="362" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="271" y="303" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 3：每段分数 0，总和 0 已最小，段数最多</text>

  <!-- example 2 -->
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 2：nums = [5, 7, 1, 3]，total = 5∧7∧1∧3 = 1 &gt; 0</text>
  <g filter="url(#rough2)">
    <rect x="90" y="356" width="52" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="116" y="376" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">5</text>
    <rect x="152" y="356" width="52" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="178" y="376" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">7</text>
    <rect x="214" y="356" width="52" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="240" y="376" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">1</text>
    <rect x="276" y="356" width="52" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="302" y="376" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">3</text>

    <rect x="90" y="392" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="116" y="412" text-anchor="middle" font-size="13" fill="#446688">5</text>
    <rect x="152" y="392" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="178" y="412" text-anchor="middle" font-size="13" fill="#446688">5</text>
    <rect x="214" y="392" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="240" y="412" text-anchor="middle" font-size="13" fill="#446688">1</text>
    <rect x="276" y="392" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="302" y="412" text-anchor="middle" font-size="13" fill="#446688">1</text>
  </g>
  <text x="344" y="376" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">元素</text>
  <text x="344" y="412" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">cur：5 → 5 → 1 → 1，从未归零</text>

  <text x="280" y="452" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt = 0 → max(0, 1) = 1：total &gt; 0，只能整段抱团</text>
</svg>
