<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：互斥锁 + 条件变量</text>

  <text x="150" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">foo() 线程</text>
  <text x="410" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">bar() 线程</text>

  <rect x="60" y="62" width="180" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="150" y="81" text-anchor="middle" font-size="11" fill="#444">lock(mtx)</text>

  <polygon points="150,100 230,130 150,160 70,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="128" text-anchor="middle" font-size="10" fill="#444">turn==T ?</text>
  <text x="150" y="142" text-anchor="middle" font-size="9" fill="#999">(wait 谓词)</text>

  <rect x="60" y="172" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="150" y="191" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">printFoo()</text>

  <rect x="60" y="212" width="180" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="150" y="230" text-anchor="middle" font-size="11" fill="#444">foo_turn = false</text>

  <rect x="60" y="250" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="150" y="269" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cv.notify_one()</text>

  <rect x="60" y="290" width="180" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="150" y="308" text-anchor="middle" font-size="11" fill="#444">unlock(mtx)</text>

  <path d="M 150 316 Q 40 320 40 76 Q 40 62 60 76" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="32" y="200" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 32 200)">for i in 0..n</text>

  <rect x="320" y="62" width="180" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="81" text-anchor="middle" font-size="11" fill="#444">lock(mtx)</text>

  <polygon points="410,100 490,130 410,160 330,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="128" text-anchor="middle" font-size="10" fill="#444">turn==F ?</text>
  <text x="410" y="142" text-anchor="middle" font-size="9" fill="#999">(wait 谓词)</text>

  <rect x="320" y="172" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="410" y="191" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">printBar()</text>

  <rect x="320" y="212" width="180" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="230" text-anchor="middle" font-size="11" fill="#444">foo_turn = true</text>

  <rect x="320" y="250" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="410" y="269" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cv.notify_one()</text>

  <rect x="320" y="290" width="180" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="308" text-anchor="middle" font-size="11" fill="#444">unlock(mtx)</text>

  <path d="M 410 316 Q 520 320 520 76 Q 520 62 500 76" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="528" y="200" text-anchor="middle" font-size="10" fill="#888" transform="rotate(90 528 200)">for i in 0..n</text>

  <path d="M 240 264 Q 280 230 330 144" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="262" y="216" font-size="10" fill="#b85450">唤醒 bar.wait</text>

  <path d="M 320 264 Q 280 230 230 144" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrg2)" filter="url(#rough2)"/>
  <text x="276" y="250" font-size="10" fill="#4a7a3a" text-anchor="end">唤醒 foo.wait</text>

  <rect x="80" y="345" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11" fill="#444">wait 谓词为假时自动释放锁并阻塞；被唤醒后重新持锁再判定</text>

  <text x="280" y="405" text-anchor="middle" font-size="10" fill="#888">↑ 两个线程对称：唯一区别是谓词取反 + 翻转 turn 方向</text>
</svg>
