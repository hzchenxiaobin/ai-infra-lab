<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="700" height="440" fill="#fafafa"/>

  <text x="350" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s="aabaaaacaabc"，k=2 → 最少取走 8</text>
  <text x="350" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">limit: a≤6、b≤0、c≤0（窗口内不得有 b/c）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30" y="54" width="640" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="50" y="69" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="90" y="69" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">s[r]</text>
  <text x="170" y="69" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">窗口区间 [l..r]</text>
  <text x="295" y="69" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">win(a,b,c)</text>
  <text x="470" y="69" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="625" y="69" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">maxWin</text>

  <!-- 列分隔线 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1" fill="none">
    <path d="M 70 54 L 70 392"/>
    <path d="M 110 54 L 110 392"/>
    <path d="M 230 54 L 230 392"/>
    <path d="M 360 54 L 360 392"/>
    <path d="M 580 54 L 580 392"/>
    <path d="M 30 392 L 670 392" stroke-width="1.3"/>
  </g>

  <!-- 行底色 -->
  <g filter="url(#rough2)">
    <rect x="30" y="76" width="640" height="22" fill="#ffffff"/>
    <rect x="30" y="98" width="640" height="22" fill="#fafafa"/>
    <rect x="30" y="120" width="640" height="22" fill="#fce4ec" fill-opacity="0.5"/>
    <rect x="30" y="142" width="640" height="22" fill="#ffffff"/>
    <rect x="30" y="164" width="640" height="22" fill="#fafafa"/>
    <rect x="30" y="186" width="640" height="22" fill="#ffffff"/>
    <rect x="30" y="208" width="640" height="22" fill="#e6f4ea" fill-opacity="0.6"/>
    <rect x="30" y="230" width="640" height="22" fill="#fce4ec" fill-opacity="0.5"/>
    <rect x="30" y="252" width="640" height="22" fill="#ffffff"/>
    <rect x="30" y="274" width="640" height="22" fill="#fafafa"/>
    <rect x="30" y="296" width="640" height="22" fill="#fce4ec" fill-opacity="0.5"/>
    <rect x="30" y="318" width="640" height="22" fill="#fce4ec" fill-opacity="0.5"/>
    <rect x="30" y="340" width="640" height="22" fill="#e6f4ea" fill-opacity="0.6"/>
  </g>

  <!-- r=0 a -->
  <text x="50" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="90" y="91" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="170" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 0]</text>
  <text x="295" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 0, 0</text>
  <text x="375" y="91" font-size="10.5" fill="#333" filter="url(#rough2)">纳入</text>
  <text x="625" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- r=1 a -->
  <text x="50" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="90" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="170" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 1]</text>
  <text x="295" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 0, 0</text>
  <text x="375" y="113" font-size="10.5" fill="#333" filter="url(#rough2)">纳入</text>
  <text x="625" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- r=2 b (shrink) -->
  <text x="50" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="90" y="135" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="170" y="135" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">[3, 2] 空</text>
  <text x="295" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0, 0, 0</text>
  <text x="375" y="135" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">b&gt;limit→左缩3格清空</text>
  <text x="625" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- r=3 a -->
  <text x="50" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="90" y="157" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="170" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3, 3]</text>
  <text x="295" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 0, 0</text>
  <text x="375" y="157" font-size="10.5" fill="#333" filter="url(#rough2)">纳入</text>
  <text x="625" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- r=4 a -->
  <text x="50" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="90" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="170" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3, 4]</text>
  <text x="295" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 0, 0</text>
  <text x="375" y="179" font-size="10.5" fill="#333" filter="url(#rough2)">纳入</text>
  <text x="625" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- r=5 a -->
  <text x="50" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="90" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="170" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3, 5]</text>
  <text x="295" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3, 0, 0</text>
  <text x="375" y="201" font-size="10.5" fill="#333" filter="url(#rough2)">纳入</text>
  <text x="625" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- r=6 a (max reached) -->
  <text x="50" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="90" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="170" y="223" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">[3, 6] = aaaa</text>
  <text x="295" y="223" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">4, 0, 0</text>
  <text x="375" y="223" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">纳入，窗口最长</text>
  <text x="625" y="223" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">4 ← 最大</text>

  <!-- r=7 c (shrink) -->
  <text x="50" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="90" y="245" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="170" y="245" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">[8, 7] 空</text>
  <text x="295" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0, 0, 0</text>
  <text x="375" y="245" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">c&gt;limit→左缩4格清空</text>
  <text x="625" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- r=8 a -->
  <text x="50" y="267" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="90" y="267" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="170" y="267" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[8, 8]</text>
  <text x="295" y="267" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 0, 0</text>
  <text x="375" y="267" font-size="10.5" fill="#333" filter="url(#rough2)">纳入</text>
  <text x="625" y="267" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- r=9 a -->
  <text x="50" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="90" y="289" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="170" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[8, 9]</text>
  <text x="295" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 0, 0</text>
  <text x="375" y="289" font-size="10.5" fill="#333" filter="url(#rough2)">纳入</text>
  <text x="625" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- r=10 b (shrink) -->
  <text x="50" y="311" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="90" y="311" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="170" y="311" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">[11, 10] 空</text>
  <text x="295" y="311" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0, 0, 0</text>
  <text x="375" y="311" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">b&gt;limit→左缩2格清空</text>
  <text x="625" y="311" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- r=11 c (shrink) -->
  <text x="50" y="333" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="90" y="333" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="170" y="333" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">[12, 11] 空</text>
  <text x="295" y="333" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0, 0, 0</text>
  <text x="375" y="333" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">c&gt;limit→左缩1格清空</text>
  <text x="625" y="333" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- 结束行 -->
  <text x="50" y="355" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">结束</text>
  <text x="90" y="355" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="170" y="355" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">最长 = [3, 6]</text>
  <text x="295" y="355" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4, 0, 0</text>
  <text x="375" y="355" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">返回 n − maxWin = 12 − 4</text>
  <text x="625" y="355" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">→ 8</text>

  <!-- 底部说明 -->
  <rect x="30" y="376" width="640" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="350" y="394" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">窗口只能装纯 a（b、c 的 limit=0），遇 b/c 必清空</text>
  <text x="350" y="410" text-anchor="middle" font-size="10.5" fill="#7a5415" font-weight="bold" filter="url(#rough2)">最长保留窗口 [3,6]="aaaa"（4 个）→ 取走 12−4=8 分钟 ✓</text>
</svg>
