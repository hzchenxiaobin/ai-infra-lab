<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：encoded = [1,2,3]，first = 1
  </text>

  <!-- encoded array on top -->
  <text x="44" y="68" font-size="11" fill="#888" filter="url(#rough2)">encoded</text>
  <rect x="120" y="50" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="180" y="50" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="240" y="50" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- header row -->
  <rect x="40" y="100" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k</text>
  <rect x="100" y="100" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[k] 的来源</text>
  <rect x="280" y="100" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">计算</text>
  <rect x="400" y="100" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[k]</text>

  <!-- row 0: given first -->
  <rect x="40" y="128" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="128" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">已知 first</text>
  <rect x="280" y="128" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="146" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <rect x="400" y="128" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="146" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- row 1 -->
  <rect x="40" y="156" width="60" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="156" width="180" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[0] ⊕ encoded[0]</text>
  <rect x="280" y="156" width="120" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 ⊕ 1 = 0</text>
  <rect x="400" y="156" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- row 2 -->
  <rect x="40" y="184" width="60" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="100" y="184" width="180" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[1] ⊕ encoded[1]</text>
  <rect x="280" y="184" width="120" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 ⊕ 2 = 2</text>
  <rect x="400" y="184" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- row 3 -->
  <rect x="40" y="212" width="60" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="100" y="212" width="180" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[2] ⊕ encoded[2]</text>
  <rect x="280" y="212" width="120" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 ⊕ 3 = 1</text>
  <rect x="400" y="212" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- arrow to final result -->
  <path d="M435,238 L435,258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="120" y="262" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">arr = [1, 0, 2, 1] ✓</text>

  <!-- Insight -->
  <rect x="50" y="312" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    每步只用上一项与对应 encoded 项做一次 ⊕，O(1) 递推
  </text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    无需回溯、无需枚举，线性扫描即得全数组
  </text>
</svg>
