<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：定左端点扩右端点 + 哈希集合 O(1) 判存在</text>

  <!-- ① 外层枚举 -->
  <rect x="80" y="36" width="360" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">① ans = 0；枚举左端点 i = 0 … n−1</text>

  <path d="M 260 64 L 260 78" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 新建窗口 -->
  <rect x="80" y="78" width="360" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">② 新建窗口：sum = 0，seen = ∅，j = i</text>

  <path d="M 260 106 L 260 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 扩右端点 -->
  <rect x="80" y="120" width="360" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ 扩右端点：sum += nums[j]，seen 插入 nums[j]</text>

  <path d="M 260 148 L 260 162" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 判定计数 -->
  <rect x="80" y="162" width="360" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#8a3a3a" font-weight="bold" filter="url(#rough2)">④ 若 sum ∈ seen：ans++（O(1) 判存在）</text>

  <path d="M 260 190 L 260 204" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：j 枚举完？ -->
  <polygon points="260,204 350,236 260,268 170,236" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">j 枚举完？</text>

  <!-- 否：j++ 回到 ③ -->
  <path d="M 170 236 L 34 236 L 34 134 L 76 134" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="228" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否 · j++ 继续扩</text>

  <path d="M 260 268 L 260 282" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="280" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>

  <!-- 菱形 2：i 枚举完？ -->
  <polygon points="260,282 348,313 260,344 172,313" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">i 枚举完？</text>

  <!-- 否：i++ 回到 ① -->
  <path d="M 348 313 L 486 313 L 486 50 L 442 50" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="306" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否 · i++ 下一个</text>

  <path d="M 260 344 L 260 358" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="356" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>

  <!-- 返回 -->
  <rect x="160" y="358" width="200" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#8a3a3a" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans</text>
</svg>
