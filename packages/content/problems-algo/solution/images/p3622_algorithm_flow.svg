<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：拆位双累加 → 整除判定</text>

  <!-- 输入 n -->
  <rect x="70" y="42" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 n</text>
  <path d="M 130 72 L 130 90" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="55" y="94" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m = n,  s = 0,  p = 1</text>
  <path d="M 130 124 L 130 142" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 m > 0 -->
  <polygon points="130,146 182,178 130,210 78,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m &gt; 0 ?</text>

  <!-- 是：拆位累加 -->
  <path d="M 182 178 L 218 178" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="198" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="222" y="158" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = m % 10;  s += d;</text>
  <text x="312" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p *= d;  m /= 10</text>

  <!-- 循环回边 -->
  <path d="M 312 158 C 312 118, 130 118, 130 142" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="221" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">拆完所有位后 m = 0，退出循环</text>

  <!-- 否：整除判定 -->
  <path d="M 130 210 L 130 236" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="228" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <polygon points="130,240 202,270 130,300 58,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n % (s+p) == 0 ?</text>

  <!-- 返回 -->
  <path d="M 202 270 L 244 270" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="224" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="248" y="254" width="112" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="304" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return true</text>

  <path d="M 130 300 L 130 318" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="313" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="74" y="322" width="112" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="343" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return false</text>

  <!-- 侧注 -->
  <text x="432" y="66" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ 拆位用副本 m</text>
  <text x="432" y="86" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">原值 n 留给整除判定</text>
  <text x="432" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p 初值 = 1</text>
  <text x="432" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（乘法单位元）</text>

  <text x="440" y="342" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(位数)，空间 O(1)</text>
</svg>
