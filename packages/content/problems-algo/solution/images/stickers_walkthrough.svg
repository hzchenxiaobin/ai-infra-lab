<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：target = "thehat"，位序 t h e h a t</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">BFS 逐层扩展；绿框 = 最优路径，灰虚线 = 到达已访问状态（跳过）</text>

  <!-- ===== Level labels ===== -->
  <text x="30" y="68" font-size="10" fill="#aaa" font-weight="bold">L0</text>
  <text x="30" y="174" font-size="10" fill="#aaa" font-weight="bold">L1</text>
  <text x="30" y="294" font-size="10" fill="#aaa" font-weight="bold">L2</text>
  <text x="30" y="414" font-size="10" fill="#aaa" font-weight="bold">L3</text>

  <!-- ===== Level 0: 000000 ===== -->
  <rect x="232" y="50" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">000000</text>
  <text x="270" y="44" text-anchor="middle" font-size="9.5" fill="#888">dp=0</text>

  <!-- ===== Edges Level 0 -> Level 1 ===== -->
  <path d="M 248 82 L 138 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">with</text>

  <path d="M 270 82 L 270 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="120" font-size="10" fill="#4a7a3a" font-weight="bold">example</text>

  <path d="M 292 82 L 402 152" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="112" font-size="10" fill="#888">science</text>

  <!-- ===== Level 1 ===== -->
  <!-- 000011 (with: t,h) -->
  <rect x="100" y="156" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="138" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">000011</text>
  <text x="138" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a">t,h ✓</text>

  <!-- 010100 (example: e,a) -->
  <rect x="232" y="156" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">010100</text>
  <text x="270" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a">e,a ✓</text>

  <!-- 000100 (science: e) -->
  <rect x="394" y="156" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="432" y="176" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">000100</text>
  <text x="432" y="202" text-anchor="middle" font-size="9" fill="#446688">e ✓</text>

  <text x="270" y="148" text-anchor="middle" font-size="9.5" fill="#888">dp=1</text>

  <!-- ===== Edges Level 1 -> Level 2 ===== -->
  <!-- 000011 -> 101011 (with) -->
  <path d="M 130 188 L 150 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">with</text>

  <!-- 000011 -> 010111 (example) -->
  <path d="M 160 188 L 348 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="230" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">example</text>

  <!-- 010100 -> 010111 (with, already visited) -->
  <path d="M 290 188 L 358 272" stroke="#bbb" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="242" font-size="9" fill="#bbb">with（已访问）</text>

  <!-- 000100 -> 000111 (with) -->
  <path d="M 432 188 L 432 272" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="232" font-size="10" fill="#888">with</text>

  <!-- ===== Level 2 ===== -->
  <!-- 101011 (t,h,h,t) -->
  <rect x="112" y="276" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">101011</text>
  <text x="150" y="322" text-anchor="middle" font-size="9" fill="#4a7a3a">t,h,h,t ✓</text>

  <!-- 010111 (t,h,e,a) -->
  <rect x="332" y="276" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">010111</text>
  <text x="370" y="322" text-anchor="middle" font-size="9" fill="#4a7a3a">t,h,e,a ✓</text>

  <!-- 000111 (t,h,e) - non-optimal branch -->
  <rect x="394" y="276" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="432" y="296" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">000111</text>
  <text x="432" y="322" text-anchor="middle" font-size="9" fill="#446688">t,h,e</text>

  <text x="270" y="268" text-anchor="middle" font-size="9.5" fill="#888">dp=2</text>

  <!-- ===== Edges Level 2 -> Level 3 ===== -->
  <!-- 101011 -> 111111 (example) -->
  <path d="M 170 308 L 250 392" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="354" font-size="10" fill="#4a7a3a" font-weight="bold">example</text>

  <!-- 010111 -> 111111 (with) -->
  <path d="M 350 308 L 290 392" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="340" y="354" font-size="10" fill="#4a7a3a" font-weight="bold">with</text>

  <!-- 000111 -> 101111 (with) - non-optimal, dashed -->
  <path d="M 432 308 L 432 392" stroke="#bbb" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="354" font-size="9" fill="#bbb">with</text>

  <!-- ===== Level 3: 111111 ===== -->
  <rect x="232" y="394" width="76" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="414" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">111111</text>
  <text x="270" y="440" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">全部拼出 ✓  dp=3</text>

  <!-- 101111 (non-optimal) -->
  <rect x="394" y="394" width="76" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="432" y="414" text-anchor="middle" font-size="12" fill="#bbb" font-weight="bold">101111</text>
  <text x="432" y="440" text-anchor="middle" font-size="9" fill="#bbb">还差 a（需第 4 张）</text>

  <!-- ===== Conclusion ===== -->
  <rect x="30" y="452" width="490" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="468" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">BFS 首达 111111 在第 3 层 → 最少 3 张贴纸（with×2 + example×1 或 example×1 + with×2）</text>
</svg>
