<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "**|**|***|"，蜡烛在 2、5、9</text>

  <!-- ===== String row ===== -->
  <text x="40" y="74" font-size="11.5" fill="#555" font-weight="bold">s:</text>

  <!-- cells w=34, x start=88: 88,122,156,190,224,258,292,326,360,394 ; centers 105,139,173,207,241,275,309,343,377,411 -->
  <!-- i=0 '*' -->
  <rect x="88" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">*</text>
  <!-- i=1 '*' -->
  <rect x="122" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">*</text>
  <!-- i=2 '|' candle (p1 of q1) -->
  <rect x="156" y="52" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="74" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">|</text>
  <!-- i=3 '*' -->
  <rect x="190" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">*</text>
  <!-- i=4 '*' -->
  <rect x="224" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">*</text>
  <!-- i=5 '|' candle (p2 of q1, p1 of q2) -->
  <rect x="258" y="52" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="74" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">|</text>
  <!-- i=6 '*' -->
  <rect x="292" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">*</text>
  <!-- i=7 '*' -->
  <rect x="326" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">*</text>
  <!-- i=8 '*' -->
  <rect x="360" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">*</text>
  <!-- i=9 '|' candle (p2 of q2) -->
  <rect x="394" y="52" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="411" y="74" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">|</text>

  <!-- Index labels -->
  <text x="105" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="139" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="173" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="207" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="241" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="275" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>
  <text x="309" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">6</text>
  <text x="343" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">7</text>
  <text x="377" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">8</text>
  <text x="411" y="98" text-anchor="middle" font-size="9.5" fill="#aaa">9</text>

  <!-- Query brackets -->
  <!-- q1 [2,5] blue -->
  <path d="M 156 44 L 156 38 L 292 38 L 292 44" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="224" y="32" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">查询 [2,5]</text>
  <!-- q2 [5,9] red -->
  <path d="M 258 122 L 258 128 L 428 128 L 428 122" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="343" y="140" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">查询 [5,9]</text>

  <!-- Divider -->
  <path d="M 40 156 L 520 156" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Table ===== -->
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">逐查询 O(1) 求解</text>

  <!-- Header -->
  <rect x="40" y="188" width="480" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="204" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">查询 [l,r]</text>
  <text x="160" y="204" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">p1=right[l]</text>
  <text x="235" y="204" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">p2=left[r]</text>
  <text x="300" y="204" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">判定</text>
  <text x="395" y="204" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">pre[p2+1]−pre[p1]</text>
  <text x="490" y="204" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">答案</text>

  <!-- Row 1: q1 [2,5] blue -->
  <rect x="40" y="214" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[2, 5]</text>
  <text x="160" y="232" text-anchor="middle" font-size="11" fill="#333">right[2]=2</text>
  <text x="235" y="232" text-anchor="middle" font-size="11" fill="#333">left[5]=5</text>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 &lt; 5 ✓</text>
  <text x="395" y="232" text-anchor="middle" font-size="11" fill="#333">pre[6]−pre[2]=4−2</text>
  <text x="490" y="232" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>

  <!-- Row 2: q2 [5,9] red -->
  <rect x="40" y="244" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[5, 9]</text>
  <text x="160" y="262" text-anchor="middle" font-size="11" fill="#333">right[5]=5</text>
  <text x="235" y="262" text-anchor="middle" font-size="11" fill="#333">left[9]=9</text>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5 &lt; 9 ✓</text>
  <text x="395" y="262" text-anchor="middle" font-size="11" fill="#333">pre[10]−pre[5]=7−4</text>
  <text x="490" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- Divider -->
  <path d="M 40 284 L 520 284" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Zero case ===== -->
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">边界情况：子串内不足两支蜡烛 → 0</text>
  <text x="60" y="328" font-size="11" fill="#888">示例 2 的查询 [4,5]，s = "***||**|..."，蜡烛在 3、4、…：</text>

  <!-- Zero case row -->
  <rect x="40" y="338" width="480" height="28" fill="#f4f4f4" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="356" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">[4, 5]</text>
  <text x="160" y="356" text-anchor="middle" font-size="11" fill="#333">right[4]=4</text>
  <text x="235" y="356" text-anchor="middle" font-size="11" fill="#333">left[5]=4</text>
  <text x="300" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 == 4 ✗</text>
  <text x="395" y="356" text-anchor="middle" font-size="11" fill="#999">—（p1 ≥ p2，跳过）</text>
  <text x="490" y="356" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">0</text>

  <!-- Footnote -->
  <rect x="60" y="384" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#444">p1 == p2：子串内只有一支蜡烛，无"两支蜡烛之间"；</text>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#444">p1 &gt; p2：子串内无蜡烛。两种情况都返回 0。</text>
</svg>
