<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：(ed(et(oc))el) 逐层反转 → leetcode</text>

  <!-- ===== 输入串（带下标）===== -->
  <text x="20" y="58" font-size="10" fill="#888">输入：</text>
  <!-- 14 个格子，宽 26，从 x=70 起 -->
  <!-- i=0 ( -->
  <rect x="70" y="46" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(</text>
  <!-- i=1 e -->
  <rect x="96" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="109" y="64" text-anchor="middle" font-size="12" fill="#333">e</text>
  <!-- i=2 d -->
  <rect x="122" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="64" text-anchor="middle" font-size="12" fill="#333">d</text>
  <!-- i=3 ( -->
  <rect x="148" y="46" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(</text>
  <!-- i=4 e -->
  <rect x="174" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="187" y="64" text-anchor="middle" font-size="12" fill="#333">e</text>
  <!-- i=5 t -->
  <rect x="200" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="213" y="64" text-anchor="middle" font-size="12" fill="#333">t</text>
  <!-- i=6 ( -->
  <rect x="226" y="46" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(</text>
  <!-- i=7 o -->
  <rect x="252" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="64" text-anchor="middle" font-size="12" fill="#333">o</text>
  <!-- i=8 c -->
  <rect x="278" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="291" y="64" text-anchor="middle" font-size="12" fill="#333">c</text>
  <!-- i=9 ) -->
  <rect x="304" y="46" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="317" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">)</text>
  <!-- i=10 ) -->
  <rect x="330" y="46" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="343" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">)</text>
  <!-- i=11 e -->
  <rect x="356" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="369" y="64" text-anchor="middle" font-size="12" fill="#333">e</text>
  <!-- i=12 l -->
  <rect x="382" y="46" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="395" y="64" text-anchor="middle" font-size="12" fill="#333">l</text>
  <!-- i=13 ) -->
  <rect x="408" y="46" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="421" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">)</text>

  <!-- 下标标记三个 ')' -->
  <text x="317" y="40" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">①</text>
  <text x="343" y="40" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">②</text>
  <text x="421" y="40" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">③</text>

  <!-- ===== 里程碑 1 ===== -->
  <text x="20" y="106" font-size="10" fill="#444" font-weight="bold">① 遇 s[9]=')'</text>
  <text x="20" y="120" font-size="9" fill="#888">(oc)→co</text>
  <!-- 栈: ( e d ( e t c o  8 格 宽26 从 x=270 -->
  <rect x="270" y="94" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="112" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(</text>
  <rect x="296" y="94" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="309" y="112" text-anchor="middle" font-size="12" fill="#333">e</text>
  <rect x="322" y="94" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="335" y="112" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="348" y="94" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361" y="112" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(</text>
  <rect x="374" y="94" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="387" y="112" text-anchor="middle" font-size="12" fill="#333">e</text>
  <rect x="400" y="94" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="413" y="112" text-anchor="middle" font-size="12" fill="#333">t</text>
  <rect x="426" y="94" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="452" y="94" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">o</text>
  <text x="488" y="112" font-size="9" fill="#4a7a3a">← 反转段</text>

  <!-- ===== 里程碑 2 ===== -->
  <text x="20" y="156" font-size="10" fill="#444" font-weight="bold">② 遇 s[10]=')'</text>
  <text x="20" y="170" font-size="9" fill="#888">(etco)→octe</text>
  <!-- 栈: ( e d o c t e  7 格 -->
  <rect x="270" y="144" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(</text>
  <rect x="296" y="144" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="309" y="162" text-anchor="middle" font-size="12" fill="#333">e</text>
  <rect x="322" y="144" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="335" y="162" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="348" y="144" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="361" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">o</text>
  <rect x="374" y="144" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="387" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="400" y="144" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="413" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">t</text>
  <rect x="426" y="144" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
  <text x="488" y="162" font-size="9" fill="#4a7a3a">← 反转段</text>

  <!-- ===== 里程碑 3 ===== -->
  <text x="20" y="206" font-size="10" fill="#444" font-weight="bold">③ 遇 s[13]=')'</text>
  <text x="20" y="220" font-size="9" fill="#888">(edocteel)→leetcode</text>
  <!-- 栈: l e e t c o d e  8 格 全绿 -->
  <rect x="270" y="194" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="283" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">l</text>
  <rect x="296" y="194" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="309" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="322" y="194" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="348" y="194" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="361" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">t</text>
  <rect x="374" y="194" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="387" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="400" y="194" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="413" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">o</text>
  <rect x="426" y="194" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">d</text>
  <rect x="452" y="194" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
  <text x="488" y="212" font-size="9" fill="#4a7a3a">← 全部反转</text>

  <!-- ===== 结果 ===== -->
  <rect x="170" y="260" width="260" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="281" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">最终结果：leetcode</text>
</svg>
