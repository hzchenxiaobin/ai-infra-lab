<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">好友关系是双向的：每条记录给双方各 +1 好友</text>

  <!-- RequestAccepted table (left) -->
  <text x="130" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">RequestAccepted</text>
  <rect x="30" y="60" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="76" font-size="9.5" fill="#b85450" font-weight="bold">requester_id</text>
  <text x="145" y="76" font-size="9.5" fill="#4a7a3a" font-weight="bold">accepter_id</text>
  <line x1="110" y1="60" x2="110" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="84" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="98" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="145" y="98" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="110" y1="84" x2="110" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="104" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="118" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="145" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="110" y1="104" x2="110" y2="124" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="124" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="138" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="145" y="138" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="110" y1="124" x2="110" y2="144" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="144" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="158" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="145" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <line x1="110" y1="144" x2="110" y2="164" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrows: requester column -> UNION ALL -->
  <path d="M70 94 L260 120" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M70 114 L260 134" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M70 134 L260 148" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M70 154 L260 162" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- arrows: accepter column -> UNION ALL -->
  <path d="M160 94 L260 174" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M160 114 L260 188" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M160 134 L260 202" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M160 154 L260 216" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- UNION ALL box -->
  <rect x="240" y="106" width="70" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="275" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">UNION</text>
  <text x="275" y="142" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">ALL</text>
  <text x="275" y="160" text-anchor="middle" font-size="8.5" fill="#555">把两列</text>
  <text x="275" y="172" text-anchor="middle" font-size="8.5" fill="#555">拼成一列</text>
  <text x="275" y="194" text-anchor="middle" font-size="9" fill="#b85450">requester</text>
  <text x="275" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">accepter</text>
  <text x="275" y="222" text-anchor="middle" font-size="8" fill="#555">→ id 列</text>

  <!-- expanded id column (right) -->
  <text x="430" y="88" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">展开后的 id 列</text>
  <rect x="380" y="92" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="107" text-anchor="middle" font-size="9.5" fill="#333">id</text>

  <rect x="380" y="114" width="80" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="127" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="380" y="132" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="380" y="150" width="80" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="163" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="380" y="168" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="181" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="380" y="186" width="80" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="199" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <rect x="380" y="204" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="217" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="380" y="222" width="80" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="235" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="380" y="240" width="80" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="253" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- arrow from UNION ALL to id column -->
  <path d="M310 166 L380 166" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="30" y="284" width="500" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="306" font-size="10.5" fill="#333" font-weight="bold">核心观察：好友关系是双向的</text>
  <text x="50" y="324" font-size="10" fill="#555">• 一行 (1→2) 表示 1 和 2 互为好友 → 1 的好友数 +1，2 的好友数也 +1</text>
  <text x="50" y="340" font-size="10" fill="#555">• 不能只数 requester_id 或只数 accepter_id，会漏掉一半好友</text>
  <text x="50" y="356" font-size="10" fill="#b85450" font-weight="bold">UNION ALL（不去重）把两列合并 → 每个 id 出现一次 = 一个好友关系</text>
  <text x="50" y="372" font-size="10" fill="#555">再 GROUP BY id + COUNT(*) 即得每人的好友总数</text>
</svg>
