<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">全排列 II 去重原理：排序 + 同层剪枝（nums=[1,1,2]）</text>

  <!-- ============ LEFT: decision tree ============ -->
  <text x="30" y="52" font-size="12" fill="#888">决策树（排序后 nums=[1ₐ, 1_b, 2]）:</text>

  <!-- root -->
  <ellipse cx="180" cy="76" rx="36" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="80" text-anchor="middle" font-size="11" fill="#333">path=[]</text>

  <!-- Level 1: pick 1a / 1b(pruned) / 2 -->
  <line x1="180" y1="92" x2="100" y2="124" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="180" y1="92" x2="180" y2="124" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <line x1="180" y1="92" x2="260" y2="124" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="72" y="126" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="100" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1ₐ]</text>
  <text x="100" y="162" text-anchor="middle" font-size="9" fill="#4a7a3a">选 nums[0]</text>

  <rect x="148" y="126" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="5" filter="url(#rough2)"/>
  <text x="180" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1_b]✗</text>
  <text x="180" y="162" text-anchor="middle" font-size="9" fill="#b85450">跳过：同值已回溯</text>

  <rect x="232" y="126" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[2]</text>
  <text x="260" y="162" text-anchor="middle" font-size="9" fill="#d6a040">选 nums[2]</text>

  <!-- Level 2 from [1a]: pick 1b / 2 -->
  <line x1="100" y1="168" x2="72" y2="196" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="100" y1="168" x2="128" y2="196" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="46" y="198" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="72" y="214" text-anchor="middle" font-size="10" fill="#333">[1ₐ,1_b]</text>
  <rect x="104" y="198" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="128" y="214" text-anchor="middle" font-size="10" fill="#333">[1ₐ,2]</text>

  <!-- Level 2 from [2]: pick 1a / 1b(pruned) -->
  <line x1="260" y1="168" x2="240" y2="196" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="260" y1="168" x2="296" y2="196" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="214" y="198" width="52" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="214" text-anchor="middle" font-size="10" fill="#333">[2,1ₐ]</text>
  <rect x="270" y="198" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="298" y="214" text-anchor="middle" font-size="10" fill="#b85450">[2,1_b]✗</text>

  <!-- Level 3: leaves -->
  <line x1="72" y1="222" x2="72" y2="248" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="128" y1="222" x2="128" y2="248" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="240" y1="222" x2="240" y2="248" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="42" y="250" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="72" y="266" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[1,1,2] ✓</text>
  <rect x="98" y="250" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="266" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[1,2,1] ✓</text>
  <rect x="210" y="250" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="266" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[2,1,1] ✓</text>

  <text x="170" y="288" text-anchor="middle" font-size="10" fill="#888">✗ = 被剪枝的重复分支　　✓ = 合法排列（共 3 个）</text>

  <!-- ============ RIGHT: dedup rule ============ -->
  <text x="380" y="52" font-size="12" fill="#444" font-weight="bold">去重核心：同层不选重复值</text>

  <!-- Step 1: sort -->
  <rect x="380" y="68" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="500" y="88" text-anchor="middle" font-size="12" fill="#333">① 排序：让相同元素相邻</text>
  <text x="500" y="104" text-anchor="middle" font-size="10" fill="#888">[2,1,1] → [1,1,2]</text>

  <path d="M 500 112 L 500 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: prune condition -->
  <rect x="380" y="128" width="240" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 剪枝条件</text>
  <text x="500" y="166" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace">nums[i]==nums[i-1] &amp;&amp; !used[i-1]</text>
  <text x="500" y="180" text-anchor="middle" font-size="10" fill="#888">→ 跳过 nums[i]</text>

  <path d="M 500 186 L 500 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: why !used[i-1] -->
  <rect x="380" y="202" width="240" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="500" y="222" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">为什么是 !used[i-1]?</text>
  <text x="500" y="240" text-anchor="middle" font-size="10" fill="#555">used[i-1]==false：</text>
  <text x="500" y="254" text-anchor="middle" font-size="10" fill="#555">说明 nums[i-1] 已被选过</text>
  <text x="500" y="268" text-anchor="middle" font-size="10" fill="#555">又撤销了（回溯回来了）</text>
  <text x="500" y="282" text-anchor="middle" font-size="10" fill="#b85450">→ 同层再选同值 = 重复！</text>
  <text x="500" y="296" text-anchor="middle" font-size="10" fill="#888">used[i-1]==true 则不跳（不同位置）</text>

  <!-- bottom note -->
  <rect x="380" y="316" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="500" y="336" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">效果</text>
  <text x="500" y="352" text-anchor="middle" font-size="10" fill="#555">6 个分支剪掉 3 个，只走 3 条路</text>
  <text x="500" y="364" text-anchor="middle" font-size="10" fill="#555">不重复不遗漏</text>

  <text x="320" y="420" text-anchor="middle" font-size="11" fill="#888">关键直觉：排序让重复元素相邻，!used[i-1] 保证「同层只选第一个」</text>
  <text x="320" y="436" text-anchor="middle" font-size="11" fill="#888">对比 46 题：多了一行剪枝，其余完全相同</text>
</svg>
