<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">容斥原理：两矩形并集面积 = A + B − 重叠</text>

  <!-- Rectangle A (blue) -->
  <rect x="70" y="70" width="180" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="90" font-size="13" fill="#446688" font-weight="bold">矩形 A</text>
  <text x="86" y="106" font-size="10" fill="#888">|A| = 宽 × 高</text>

  <!-- Rectangle B (green) -->
  <rect x="190" y="135" width="200" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="153" font-size="13" fill="#4a7a3a" font-weight="bold">矩形 B</text>
  <text x="338" y="169" font-size="10" fill="#888">|B| = 宽 × 高</text>

  <!-- Overlap region (orange, drawn last to sit on top) -->
  <rect x="190" y="135" width="60" height="65" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">重叠</text>
  <text x="220" y="184" text-anchor="middle" font-size="9" fill="#888">A∩B</text>

  <!-- Arrows from A and B into the formula -->
  <text x="130" y="300" text-anchor="middle" font-size="10" fill="#446688">A 与 B 轴对齐</text>
  <text x="130" y="314" text-anchor="middle" font-size="10" fill="#446688">→ 重叠仍为矩形</text>

  <!-- Formula box -->
  <rect x="330" y="60" width="210" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="82" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">总面积公式</text>
  <text x="435" y="104" text-anchor="middle" font-size="12" fill="#333">|A∪B| = |A| + |B| − |A∩B|</text>
  <text x="435" y="120" text-anchor="middle" font-size="9" fill="#888">直接相加会重复算一次重叠</text>

  <!-- 1D interval intersection explanation -->
  <rect x="40" y="295" width="480" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：把重叠拆成 x、y 两个一维区间交集</text>

  <!-- 1D interval sketch -->
  <line x1="70" y1="345" x2="270" y2="345" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="150" y1="345" x2="300" y2="345" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="150" y="340" width="120" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="335" text-anchor="middle" font-size="9" fill="#446688">[a1,a2]</text>
  <text x="285" y="335" text-anchor="middle" font-size="9" fill="#4a7a3a">[b1,b2]</text>
  <text x="210" y="362" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">交集 = [max(a1,b1), min(a2,b2)]</text>

  <text x="330" y="345" font-size="10" fill="#444">长 = max(0, min(a2,b2) − max(a1,b1))</text>
  <text x="330" y="358" font-size="9" fill="#888">max(0,·) 处理不相交（差为负→0）</text>
</svg>
