<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 行 → 8 个 id → 4 组计数 → 取最大</text>

  <!-- Step 1: Source table -->
  <text x="110" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① RequestAccepted（4 行）</text>
  <rect x="20" y="56" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="71" font-size="9" fill="#b85450" font-weight="bold">req</text>
  <text x="120" y="71" font-size="9" fill="#4a7a3a" font-weight="bold">acc</text>
  <line x1="85" y1="56" x2="85" y2="78" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="78" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="91" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="120" y="91" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="85" y1="78" x2="85" y2="96" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="96" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="109" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="120" y="109" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="85" y1="96" x2="85" y2="114" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="114" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="127" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <text x="120" y="127" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="85" y1="114" x2="85" y2="132" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="132" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="145" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <text x="120" y="145" font-size="9.5" fill="#4a7a3a" font-weight="bold">4</text>
  <line x1="85" y1="132" x2="85" y2="150" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow to step 2 -->
  <path d="M200 105 L230 105" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: UNION ALL expanded id list -->
  <text x="310" y="50" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">② UNION ALL（8 个 id）</text>
  <rect x="240" y="56" width="60" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="8.5" fill="#333">req 列</text>

  <rect x="240" y="74" width="60" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="240" y="88" width="60" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="270" y="98" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="240" y="102" width="60" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="270" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <rect x="240" y="116" width="60" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>

  <rect x="320" y="56" width="60" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="69" text-anchor="middle" font-size="8.5" fill="#333">acc 列</text>

  <rect x="320" y="74" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="350" y="84" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="320" y="88" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="350" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="320" y="102" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="350" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="320" y="116" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="350" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- merged id column -->
  <path d="M300 81 L400 100" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M380 81 L400 115" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="460" y="50" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">合并后 id 列</text>
  <rect x="430" y="56" width="60" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="69" text-anchor="middle" font-size="8.5" fill="#333">id</text>

  <rect x="430" y="74" width="60" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="84" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="430" y="88" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="98" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="430" y="102" width="60" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="112" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="430" y="116" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="126" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="430" y="130" width="60" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="140" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="430" y="144" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="154" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="430" y="158" width="60" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="168" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="430" y="172" width="60" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="460" y="182" text-anchor="middle" font-size="9" fill="#333">4</text>

  <!-- arrow down to step 3 -->
  <path d="M460 190 L460 210 L280 210 L280 230" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Step 3: GROUP BY + COUNT -->
  <text x="280" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">③ GROUP BY id + COUNT(*)（4 组）</text>

  <rect x="80" y="232" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="247" font-size="9" fill="#333">id</text>
  <text x="150" y="247" font-size="9" fill="#333">num</text>
  <line x1="130" y1="232" x2="130" y2="254" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="254" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="268" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="150" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <line x1="130" y1="254" x2="130" y2="274" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="274" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="288" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="150" y="288" text-anchor="middle" font-size="10" fill="#333">2</text>
  <line x1="130" y1="274" x2="130" y2="294" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="294" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="308" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="150" y="308" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3 ★</text>
  <line x1="130" y1="294" x2="130" y2="314" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="314" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="105" y="328" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="150" y="328" text-anchor="middle" font-size="10" fill="#333">1</text>
  <line x1="130" y1="314" x2="130" y2="334" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- annotation: id=3 has 3 friends -->
  <path d="M180 304 L230 304" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="240" y="300" font-size="9" fill="#d6a040" font-weight="bold">num=3 最大</text>
  <text x="240" y="312" font-size="8.5" fill="#555">3 是 1,2,4 的好友</text>

  <!-- arrow to final result -->
  <path d="M280 338 L280 358" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">④ ORDER BY num DESC LIMIT 1</text>
  <rect x="210" y="362" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="378" font-size="9.5" fill="#333">id</text>
  <text x="315" y="378" font-size="9.5" fill="#333">num</text>
  <line x1="280" y1="362" x2="280" y2="386" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="210" y="386" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="402" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="315" y="402" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <line x1="280" y1="386" x2="280" y2="410" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="30" y="418" width="500" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="9" fill="#555">id=3 作为 requester 出现 1 次 + 作为 accepter 出现 2 次 = 3 个好友</text>
</svg>
