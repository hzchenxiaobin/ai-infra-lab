<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">拆分循环链表 · 概念</text>

  <!-- 原链表 -->
  <text x="36" y="58" font-size="11" fill="#888" filter="url(#rough2)">原链表 n=3</text>
  <rect x="180" y="52" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="52" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="320" y="52" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <path d="M230,68 L247,68" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,68 L317,68" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 循环回指 7 -> 1 -->
  <path d="M345,52 C345,18 205,18 205,50" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="275" y="15" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">尾.next 回指 head（循环）</text>

  <!-- 拆分箭头 -->
  <path d="M260,108 L260,150" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="134" font-size="12" fill="#d6a040" filter="url(#rough2)">拆分</text>

  <!-- 第一半 -->
  <text x="36" y="200" font-size="11" fill="#888" filter="url(#rough2)">第一半 ⌈n/2⌉=2</text>
  <rect x="70" y="212" width="50" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="212" width="50" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <path d="M120,228 L147,228" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M175,212 C175,182 95,182 95,210" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="135" y="182" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">成环</text>

  <!-- 第二半 -->
  <text x="300" y="200" font-size="11" fill="#888" filter="url(#rough2)">第二半 ⌊n/2⌋=1</text>
  <rect x="345" y="212" width="50" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <!-- 自环 -->
  <path d="M358,214 C338,184 402,184 382,214" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="370" y="182" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">自环</text>

  <!-- 说明 -->
  <rect x="70" y="280" width="380" height="60" rx="8" fill="#fff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两半各自成环：把尾节点的 .next 指回本半的 head</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">节点数为奇数时，第一半比第二半多 1 个节点</text>
</svg>
