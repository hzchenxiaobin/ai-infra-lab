<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：前缀和 + 枚举删除起点 + 哈希去重</text>

  <!-- 开始 -->
  <rect x="200" y="30" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 s, k</text>

  <path d="M 260 58 L 260 70" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1 -->
  <rect x="110" y="72" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 一趟扫描建前缀数组 px[0..n]、py[0..n]</text>

  <path d="M 260 102 L 260 114" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="140" y="116" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 枚举删除起点 i：0 … n−k</text>

  <path d="M 260 144 L 260 156" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3 -->
  <rect x="80" y="158" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="173" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 终点 = ( px[i] + px[n] − px[i+k] ,</text>
  <text x="250" y="187" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">py[i] + py[n] − py[i+k] )　← O(1)</text>

  <path d="M 260 192 L 260 204" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤4 -->
  <rect x="155" y="206" width="210" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 终点 (x, y) 加入哈希集合</text>

  <path d="M 260 234 L 260 246" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,248 340,280 260,312 180,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n−k ?</text>

  <!-- 是：i++ 回环 -->
  <path d="M 340 280 L 436 280" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="272" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="440" y="265" width="54" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="467" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++</text>
  <path d="M 467 265 L 467 175 L 426 175" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否：返回 -->
  <path d="M 260 312 L 260 324" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="322" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="170" y="326" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回哈希集合大小</text>

  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 每个 i 只做前缀和加减，全程 O(n)</text>
</svg>
