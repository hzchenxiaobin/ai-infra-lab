<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，落差累加（O(n) / O(1)）</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="62" y="40" width="96" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="110" y="57" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">开始</text>
  </g>
  <path d="M 110 66 L 110 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="40" y="86" width="140" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="110" y="105" text-anchor="middle" font-size="11" fill="#333">ans = 0；i = 1</text>
  </g>
  <path d="M 110 116 L 110 136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：判下降 -->
  <g filter="url(#rough2)">
    <polygon points="110,138 178,176 110,214 42,176" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="110" y="172" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">nums[i−1] &gt;</text>
    <text x="110" y="186" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">nums[i] ？</text>
  </g>

  <!-- 是 → 付款框 -->
  <path d="M 178 176 L 202 176" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="168" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="204" y="152" width="216" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="312" y="170" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">ans += nums[i−1] − nums[i]</text>
    <text x="312" y="188" text-anchor="middle" font-size="8.5" fill="#8a3030">（想象：后缀 [i..n−1] += 落差，只记账免模拟）</text>
  </g>
  <!-- 付款框回汇到 i++ -->
  <path d="M 312 200 L 312 226 L 152 226 L 152 236" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 直下 -->
  <path d="M 110 214 L 110 236" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="230" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- i++ -->
  <g filter="url(#rough2)">
    <rect x="60" y="238" width="100" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="110" y="256" text-anchor="middle" font-size="11" fill="#333">i += 1</text>
  </g>
  <path d="M 110 266 L 110 282" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：i < n ? -->
  <g filter="url(#rough2)">
    <polygon points="110,284 168,314 110,344 52,314" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="110" y="318" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">i &lt; n ？</text>
  </g>

  <!-- 是 → 左侧回边 -->
  <path d="M 52 314 L 24 314 L 24 176 L 40 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="304" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 否 → 返回 -->
  <path d="M 110 344 L 110 360" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="356" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="62" y="362" width="96" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="110" y="379" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">返回 ans</text>
  </g>

  <!-- 右侧注解 -->
  <g filter="url(#rough2)">
    <rect x="300" y="234" width="244" height="154" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="422" y="254" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">💡 一行式收工</text>
    <text x="422" y="274" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">ans = Σ max(0, nums[i] − nums[i+1])</text>
    <text x="422" y="296" text-anchor="middle" font-size="9.5" fill="#8a6d1a">[3,3,2,1] → 1 + 1 = 2 ✓</text>
    <text x="422" y="312" text-anchor="middle" font-size="9.5" fill="#8a6d1a">[5,1,2,3] → 4 ✓</text>
    <text x="312" y="334" font-size="9.5" fill="#8a6d1a">贪心不变式：cur = nums[i−1] + T（T 为累计</text>
    <text x="312" y="350" font-size="9.5" fill="#8a6d1a">付款），比较时 T 相消 ⇒ 付款条件与金额</text>
    <text x="312" y="366" font-size="9.5" fill="#8a6d1a">由原始数组唯一决定——每个落差恰付一次</text>
    <text x="312" y="382" font-size="9" fill="#8a3030">⚠️ 答案上界 ~10¹⁴，C++ 须 long long</text>
  </g>
</svg>
