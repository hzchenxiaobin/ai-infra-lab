<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：后缀整体 −1 ⇒ 一个计数器全包</text>

  <!-- Section A: brute force view -->
  <text x="48" y="48" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">暴力视角：测试成功一次 → 后缀整体 −1</text>

  <text x="110" y="64" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">测试成功 ✓</text>

  <rect x="88" y="68" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="93" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="142" y="68" width="44" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="93" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <rect x="196" y="68" width="44" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="218" y="93" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">2</text>
  <rect x="250" y="68" width="44" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="272" y="93" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <rect x="304" y="68" width="44" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="93" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>

  <text x="110" y="124" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="164" y="124" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <text x="218" y="124" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="272" y="124" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <text x="326" y="124" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>

  <path d="M 110 110 C 110 126 124 136 140 136" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 144 132 L 144 140 M 144 136 L 346 136 M 346 132 L 346 140" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="245" y="158" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">每次成功：后缀 [i+1, n−1] 全部 −1（不低于 0）</text>

  <text x="48" y="186" font-size="11.5" fill="#555" filter="url(#rough2)">测试 0 后：</text>

  <rect x="132" y="168" width="36" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="187" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="174" y="168" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="192" y="187" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="216" y="168" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="234" y="187" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="258" y="168" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="276" y="187" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="300" y="168" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="318" y="187" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Section B: counter view -->
  <text x="48" y="232" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">计数视角：不真减，只维护 tested</text>

  <rect x="64" y="246" width="392" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">到达设备 i 时：有效值 = max(0, b[i] − tested)</text>
  <text x="260" y="292" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">可测 ⇔ b[i] &gt; tested</text>

  <text x="260" y="324" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">例：设备 2，b = 2，tested = 1 → 2 &gt; 1 ✓，tested 变为 2</text>

  <rect x="48" y="340" width="424" height="68" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">① 顺序固定：测试是被动的，没有决策——纯模拟；</text>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">② clamp 与减法可交换：max(0, max(0, x−a) − b) = max(0, x−a−b)；</text>
  <text x="260" y="402" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">③ tested 单调不减，判定门槛只升不降。</text>
</svg>
