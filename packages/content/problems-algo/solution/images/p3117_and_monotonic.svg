<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">观察 2：按位 AND 只减不增 —— 跌破目标即整树剪枝</text>

  <!-- baseline -->
  <path d="M 70 252 L 510 252" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- target dashed line -->
  <path d="M 70 164 L 510 164" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="74" y="152" font-size="10.5" fill="#a07818" font-weight="bold" filter="url(#rough2)">目标 andValues[j] = 4</text>

  <!-- step line -->
  <path d="M 110 98 L 190 120 L 270 164 L 350 164 L 430 252" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- points -->
  <g filter="url(#rough2)">
    <circle cx="110" cy="98" r="7.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="190" cy="120" r="7.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="270" cy="164" r="7.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="350" cy="164" r="7.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="430" cy="252" r="7.5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="9" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="101.5">7</text>
    <text x="190" y="123.5">6</text>
    <text x="270" y="167.5">4</text>
    <text x="350" y="167.5">4</text>
    <text x="430" y="255.5">0</text>
  </g>

  <!-- element labels -->
  <g font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="80">并入 7</text>
    <text x="190" y="102">并入 6</text>
    <text x="270" y="146">并入 5</text>
    <text x="350" y="146">并入 13</text>
    <text x="430" y="234">并入 2</text>
  </g>

  <!-- binary row -->
  <g font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="274">111</text>
    <text x="190" y="274">110</text>
    <text x="270" y="274">100</text>
    <text x="350" y="274">100</text>
    <text x="430" y="274">000</text>
  </g>
  <text x="280" y="292" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">前缀 AND 的二进制：位只被清除，长不回来</text>

  <!-- plateau annotation -->
  <text x="310" y="188" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">AND == 目标 ✓ 此刻可闭合</text>

  <!-- drop annotation -->
  <text x="478" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">跌破目标</text>
  <text x="478" y="224" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">剪掉整棵子树</text>
  <path d="M 460 232 C 448 240, 442 246, 436 250" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="36" y="336" width="488" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">每出现一个新 AND 值至少消掉一个 1 位</text>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⇒ 以同一位置结尾的子数组，AND 至多 ⌊log₂10⁵⌋ + 1 = 17 种 —— 第三维状态天然稀疏</text>
</svg>
