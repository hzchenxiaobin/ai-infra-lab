<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两次前缀计数相减，O(1) 完成</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="58" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <!-- arrow -->
  <path d="M 260 78 L 260 98" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Input: low, high -->
  <path d="M 200 104 L 320 104 L 340 130 L 220 130 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333">输入 low, high</text>

  <!-- arrow -->
  <path d="M 260 132 L 260 152" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: a = (high+1)/2 -->
  <rect x="170" y="158" width="180" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a = (high + 1) / 2</text>
  <text x="260" y="193" text-anchor="middle" font-size="10" fill="#888">统计 [0..high] 内奇数个数</text>

  <!-- arrow -->
  <path d="M 260 202 L 260 222" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: b = low/2 -->
  <rect x="170" y="228" width="180" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b = low / 2</text>
  <text x="260" y="263" text-anchor="middle" font-size="10" fill="#888">统计 [0..low−1] 内奇数个数</text>

  <!-- arrow -->
  <path d="M 260 272 L 260 292" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: return a - b -->
  <rect x="170" y="298" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">返回 a − b</text>
  <text x="260" y="333" text-anchor="middle" font-size="10" fill="#4a7a3a">[low..high] 区间奇数个数</text>

  <!-- arrow -->
  <path d="M 260 342 L 260 362" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="260" cy="382" rx="46" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="387" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">结束</text>

  <!-- Side note: f(N) formula -->
  <rect x="372" y="158" width="136" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="180" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">前缀公式</text>
  <text x="440" y="198" text-anchor="middle" font-size="11" fill="#333">f(N) = ⌊(N+1)/2⌋</text>
  <text x="440" y="213" text-anchor="middle" font-size="10" fill="#888">整数除法下取整</text>

  <!-- Side note: equivalence -->
  <rect x="372" y="298" width="136" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="318" text-anchor="middle" font-size="10.5" fill="#555">f(low−1)</text>
  <text x="440" y="333" text-anchor="middle" font-size="10.5" fill="#333">= ⌊low / 2⌋</text>
</svg>
