<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：队列拆成 front / back 两段，中点恒落在边界上</text>

  <!-- ===== Row 1: even n=4 ===== -->
  <text x="40" y="100" font-size="12" fill="#4a7a3a" font-weight="bold">偶数 n=4</text>
  <text x="40" y="116" font-size="10.5" fill="#888">|front|=|back|=2</text>

  <text x="184" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">front（前一半）</text>
  <rect x="120" y="80" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="152" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="80" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="216" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="152" y="150" text-anchor="middle" font-size="10" fill="#888">下标 0</text>
  <text x="216" y="150" text-anchor="middle" font-size="10" fill="#888">下标 1</text>

  <!-- divider -->
  <path d="M 250 74 L 250 148" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="320" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">back（后一半）</text>
  <rect x="256" y="80" width="64" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="288" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="320" y="80" width="64" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="352" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="288" y="150" text-anchor="middle" font-size="10" fill="#888">下标 2</text>
  <text x="352" y="150" text-anchor="middle" font-size="10" fill="#888">下标 3</text>

  <!-- middle arrow pointing up at front.back (the 4 at center 216) -->
  <text x="216" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">中点 = front.back() = 4</text>
  <path d="M 216 188 L 216 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Row 2: odd n=5 ===== -->
  <text x="40" y="240" font-size="12" fill="#d6a040" font-weight="bold">奇数 n=5</text>
  <text x="40" y="256" font-size="10.5" fill="#888">|back|=|front|+1=3</text>

  <text x="184" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">front</text>
  <rect x="120" y="220" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="152" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="220" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="216" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="152" y="290" text-anchor="middle" font-size="10" fill="#888">下标 0</text>
  <text x="216" y="290" text-anchor="middle" font-size="10" fill="#888">下标 1</text>

  <path d="M 250 214 L 250 288" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="352" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">back</text>
  <rect x="256" y="220" width="64" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="288" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="320" y="220" width="64" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="352" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="384" y="220" width="64" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="416" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="288" y="290" text-anchor="middle" font-size="10" fill="#888">下标 2</text>
  <text x="352" y="290" text-anchor="middle" font-size="10" fill="#888">下标 3</text>
  <text x="416" y="290" text-anchor="middle" font-size="10" fill="#888">下标 4</text>

  <!-- middle arrow pointing up at back.front (the 3 at center 288) -->
  <text x="288" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">中点 = back.front() = 3</text>
  <path d="M 288 328 L 288 280" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Invariant box -->
  <rect x="40" y="358" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">不变式：|back| ∈ {|front|, |front|+1}，即 back 永远不少于 front、至多多一个</text>
  <text x="300" y="396" text-anchor="middle" font-size="10.5" fill="#888">中点 = front.back（两段等长时）/ back.front（back 多一个时），pushMiddle 就插在边界</text>
</svg>
