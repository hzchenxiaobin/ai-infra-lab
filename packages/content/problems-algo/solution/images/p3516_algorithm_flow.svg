<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">流程：两次绝对值 + 三分支比较</text>

  <!-- 起点 -->
  <rect x="205" y="36" width="110" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">输入 x, y, z</text>
  <path d="M 260 66 L 260 78" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 算距离 -->
  <rect x="155" y="82" width="210" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="12.5" fill="#8a6d3a" filter="url(#rough2)">d1 = |x−z|，d2 = |y−z|</text>
  <path d="M 260 118 L 260 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <polygon points="260,134 348,166 260,198 172,166" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">d1 &lt; d2 ?</text>
  <path d="M 172 166 L 142 166" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="156" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="24" y="148" width="114" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="81" y="171" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 1</text>
  <path d="M 260 198 L 260 212" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="272" y="209" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 判定 2 -->
  <polygon points="260,216 348,248 260,280 172,248" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">d1 &gt; d2 ?</text>
  <path d="M 348 248 L 380 248" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="364" y="240" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">是</text>
  <rect x="384" y="230" width="114" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="441" y="253" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">返回 2</text>
  <path d="M 260 280 L 260 294" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="272" y="291" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 平局兜底 -->
  <rect x="203" y="298" width="114" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">返回 0</text>

  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">同速 ⇒ 时间 = 距离 ÷ 速度，分母相同，比距离即可</text>
  <text x="260" y="371" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 绝对值别漏：x、y 可能在 z 的任意一侧</text>
</svg>
