<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：相邻字符差恰好 +1 才能续接，否则段断</text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#888">s = "abacaba"，逐间隙判定 s[i] == s[i-1] + 1</text>

  <!-- char boxes: x = 18,98,178,258,338,418,498 ; w=44 ; y=86 h=44 ; centers 40,120,200,280,360,440,520 -->
  <rect x="18" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="98" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="178" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="258" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
  <rect x="338" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="418" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="498" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="116" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>

  <!-- gap diff pills: gap centers 80,160,240,320,400,480 ; y=100..116 -->
  <rect x="64" y="100" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="112" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">+1 ✓</text>
  <rect x="144" y="100" width="32" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1 ✗</text>
  <rect x="224" y="100" width="32" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">+2 ✗</text>
  <rect x="304" y="100" width="32" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−2 ✗</text>
  <rect x="384" y="100" width="32" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="112" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">+1 ✓</text>
  <rect x="464" y="100" width="32" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1 ✗</text>

  <!-- cur (run length) below each box at y=150 -->
  <text x="40" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cur=1</text>
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cur=2</text>
  <text x="200" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cur=1</text>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cur=1</text>
  <text x="360" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cur=1</text>
  <text x="440" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cur=2</text>
  <text x="520" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cur=1</text>

  <!-- run brackets at y=168..176 ; runs [0,1] [2] [3] [4,5] [6] -->
  <path d="M 18 168 L 18 176 L 142 176 L 142 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="80" y="193" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">段长 2</text>
  <path d="M 178 168 L 178 176 L 222 176 L 222 168" stroke="#aaaaaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="200" y="193" text-anchor="middle" font-size="11" fill="#999">1</text>
  <path d="M 258 168 L 258 176 L 302 176 L 302 168" stroke="#aaaaaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="193" text-anchor="middle" font-size="11" fill="#999">1</text>
  <path d="M 338 168 L 338 176 L 462 176 L 462 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="400" y="193" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">段长 2</text>
  <path d="M 498 168 L 498 176 L 542 176 L 542 168" stroke="#aaaaaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="520" y="193" text-anchor="middle" font-size="11" fill="#999">1</text>

  <!-- ans -->
  <text x="280" y="228" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">ans = max(各段长) = 2</text>

  <!-- insight box -->
  <rect x="40" y="252" width="480" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">判定条件（仅此一式）</text>
  <text x="280" y="302" text-anchor="middle" font-size="14" fill="#333">s[i] == s[i-1] + 1  ⟹  cur += 1</text>
  <text x="280" y="324" text-anchor="middle" font-size="14" fill="#333">否则  ⟹  cur = 1（段断，从 s[i] 重起新段）</text>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#888">全程单趟扫描，每步 ans = max(ans, cur)</text>
</svg>
