<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrN" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="480" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">组合总和 III 决策树（k=3, n=9）：start 索引 + 和剪枝</text>
  <text x="350" y="44" text-anchor="middle" font-size="11" fill="#888">候选 1-9 各用一次；size==k 时验和；sum+i&gt;n 即 break（后续更大）</text>

  <!-- ===== Tree ===== -->
  <g font-size="11" filter="url(#rough2)">
    <!-- depth labels -->
    <text x="20" y="84" font-size="10" fill="#888" font-weight="bold">depth 0</text>
    <text x="20" y="164" font-size="10" fill="#888" font-weight="bold">depth 1</text>
    <text x="20" y="244" font-size="10" fill="#888" font-weight="bold">depth 2</text>
    <text x="20" y="324" font-size="10" fill="#888" font-weight="bold">depth 3</text>

    <!-- Root -->
    <rect x="300" y="65" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="350" y="85" text-anchor="middle" fill="#446688" font-weight="bold">[] sum=0 start=1</text>

    <!-- Layer 1 -->
    <rect x="90" y="145" width="80" height="30" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="130" y="165" text-anchor="middle" fill="#555" font-weight="bold">[1] sum=1</text>

    <rect x="260" y="145" width="80" height="30" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="300" y="165" text-anchor="middle" fill="#555" font-weight="bold">[2] sum=2</text>

    <rect x="430" y="145" width="80" height="30" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="470" y="165" text-anchor="middle" fill="#555" font-weight="bold">[3] sum=3</text>

    <rect x="580" y="145" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="6"/>
    <text x="625" y="165" text-anchor="middle" fill="#b85450" font-weight="bold">[4] ✂</text>

    <!-- edges root -> L1 -->
    <path d="M 320 95 L 135 145" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrN)"/>
    <path d="M 340 95 L 295 145" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrN)"/>
    <path d="M 365 95 L 465 145" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrN)"/>
    <path d="M 385 95 L 620 145" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)"/>
    <text x="100" y="120" font-size="9" fill="#888" font-weight="bold">i=1</text>
    <text x="270" y="120" font-size="9" fill="#888" font-weight="bold">i=2</text>
    <text x="430" y="120" font-size="9" fill="#888" font-weight="bold">i=3</text>
    <text x="560" y="120" font-size="9" fill="#b85450" font-weight="bold">i≥4 剪枝</text>

    <!-- Layer 2 under [1] -->
    <rect x="45" y="225" width="90" height="30" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="90" y="245" text-anchor="middle" fill="#555" font-weight="bold">[1,2] sum=3</text>

    <rect x="155" y="225" width="90" height="30" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="200" y="245" text-anchor="middle" fill="#555" font-weight="bold">[1,3] sum=4</text>

    <!-- Layer 2 under [2] -->
    <rect x="255" y="225" width="90" height="30" fill="#f5f5f5" stroke="#888" stroke-width="1.4" rx="6"/>
    <text x="300" y="245" text-anchor="middle" fill="#555" font-weight="bold">[2,3] sum=5</text>

    <!-- Layer 2 under [3] -->
    <rect x="425" y="225" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="6"/>
    <text x="470" y="245" text-anchor="middle" fill="#b85450" font-weight="bold">[3,4] ✂</text>

    <!-- edges [1]->L2 -->
    <path d="M 120 175 L 95 225" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrN)"/>
    <path d="M 145 175 L 195 225" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrN)"/>
    <text x="78" y="205" font-size="9" fill="#888">i=2</text>
    <text x="165" y="205" font-size="9" fill="#888">i=3</text>
    <!-- [1] -> i>=4 pruned (sum 1+4=5 still <9 but [1,4]->[1,4,5] sum=10>9, show as ✂ note) -->
    <path d="M 165 175 L 230 225" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arrR)"/>
    <text x="232" y="215" font-size="8" fill="#b85450">i≥4 后续和超</text>

    <!-- edges [2]->L2 -->
    <path d="M 300 175 L 300 225" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrN)"/>
    <text x="282" y="205" font-size="9" fill="#888">i=3</text>

    <!-- edges [3]->L2 -->
    <path d="M 470 175 L 470 225" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)"/>
    <text x="478" y="205" font-size="8" fill="#b85450">i=4 起全剪</text>

    <!-- ===== Layer 3 leaves: callout boxes listing z-loop outcomes ===== -->
    <!-- [1,2] callout -->
    <rect x="10" y="305" width="155" height="64" fill="#fff" stroke="#888" stroke-width="1" rx="6"/>
    <text x="87" y="322" text-anchor="middle" fill="#555" font-size="9" font-weight="bold">z 循环 (start=3)</text>
    <text x="20" y="338" fill="#888" font-size="9">3→sum6 ✗</text>
    <text x="92" y="338" fill="#888" font-size="9">4→7 ✗</text>
    <text x="20" y="352" fill="#888" font-size="9">5→8 ✗</text>
    <text x="92" y="352" fill="#4a7a3a" font-size="9" font-weight="bold">6→9 ✓</text>
    <text x="20" y="366" fill="#b85450" font-size="9" font-weight="bold">7→10 ✂break</text>

    <!-- [1,3] callout -->
    <rect x="175" y="305" width="135" height="50" fill="#fff" stroke="#888" stroke-width="1" rx="6"/>
    <text x="242" y="322" text-anchor="middle" fill="#555" font-size="9" font-weight="bold">z 循环 (start=4)</text>
    <text x="185" y="338" fill="#888" font-size="9">4→8 ✗</text>
    <text x="245" y="338" fill="#4a7a3a" font-size="9" font-weight="bold">5→9 ✓</text>
    <text x="185" y="352" fill="#b85450" font-size="9" font-weight="bold">6→10 ✂break</text>

    <!-- [2,3] callout -->
    <rect x="320" y="305" width="135" height="50" fill="#fff" stroke="#888" stroke-width="1" rx="6"/>
    <text x="387" y="322" text-anchor="middle" fill="#555" font-size="9" font-weight="bold">z 循环 (start=4)</text>
    <text x="330" y="338" fill="#4a7a3a" font-size="9" font-weight="bold">4→9 ✓</text>
    <text x="390" y="338" fill="#b85450" font-size="9" font-weight="bold">5→10 ✂break</text>

    <!-- [3,4] callout (all prune) -->
    <rect x="465" y="305" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" rx="6"/>
    <text x="525" y="322" text-anchor="middle" fill="#b85450" font-size="9" font-weight="bold">z 循环 (start=5)</text>
    <text x="475" y="338" fill="#b85450" font-size="9" font-weight="bold">5→12 ✂</text>
    <text x="525" y="338" fill="#b85450" font-size="9">和已超</text>

    <!-- edges L2 -> callouts -->
    <path d="M 90 255 L 87 305" stroke="#888" stroke-width="1.1" fill="none" marker-end="url(#arrN)"/>
    <path d="M 200 255 L 242 305" stroke="#888" stroke-width="1.1" fill="none" marker-end="url(#arrN)"/>
    <path d="M 300 255 L 387 305" stroke="#888" stroke-width="1.1" fill="none" marker-end="url(#arrN)"/>
    <path d="M 470 255 L 525 305" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arrR)"/>
  </g>

  <!-- ===== Pruning annotation ===== -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="540" y="380" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8"/>
    <text x="615" y="398" text-anchor="middle" fill="#b85450" font-weight="bold">✂ 两路剪枝</text>
    <text x="615" y="414" text-anchor="middle" fill="#555" font-size="9">① 长度：9−i+1 &lt; k−size</text>
    <text x="615" y="428" text-anchor="middle" fill="#555" font-size="9">② 和：sum+i &gt; n → break</text>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="20" y="380" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="36" y="396" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
  <text x="60" y="408" font-size="10" fill="#4a7a3a">收集（size==k 且 sum==n）</text>
  <rect x="220" y="396" width="16" height="14" fill="#f5f5f5" stroke="#888" stroke-width="1.3" rx="3"/>
  <text x="244" y="408" font-size="10" fill="#555">内部节点（继续递归）</text>
  <rect x="380" y="396" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="3"/>
  <text x="404" y="408" font-size="10" fill="#b85450">剪枝（长度/和不足）</text>
  <text x="270" y="426" text-anchor="middle" font-size="9" fill="#666">3 个合法组合：[1,2,6] [1,3,5] [2,3,4]；z 循环因 1-9 递增，sum 超限后直接 break</text>
</svg>
