<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="490" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：strs = ["abc","xyz"] → "zyxcba"</text>

  <!-- ====== 第一步：贪心定向 ====== -->
  <text x="30" y="52" font-size="12" fill="#4a7a3a" font-weight="bold">① 贪心定向</text>

  <!-- 表头 -->
  <rect x="30" y="60" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="45" y="75" text-anchor="middle" font-size="10" fill="#555">i</text>
  <rect x="62" y="60" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="90" y="75" text-anchor="middle" font-size="10" fill="#555">原串</text>
  <rect x="120" y="60" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="148" y="75" text-anchor="middle" font-size="10" fill="#555">反转</text>
  <rect x="178" y="60" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="213" y="75" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">定向后</text>

  <!-- 行 0 -->
  <rect x="30" y="84" width="30" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="99" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="62" y="84" width="56" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="99" text-anchor="middle" font-size="11" fill="#333">abc</text>
  <rect x="120" y="84" width="56" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="99" text-anchor="middle" font-size="11" fill="#333">cba</text>
  <rect x="178" y="84" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="213" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cba</text>

  <!-- 行 1 -->
  <rect x="30" y="108" width="30" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="123" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="62" y="108" width="56" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="123" text-anchor="middle" font-size="11" fill="#333">xyz</text>
  <rect x="120" y="108" width="56" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="123" text-anchor="middle" font-size="11" fill="#333">zyx</text>
  <rect x="178" y="108" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="213" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">zyx</text>

  <text x="260" y="99" font-size="10" fill="#888">取较大者</text>
  <text x="300" y="123" font-size="10" fill="#888">→ 环 = cba ↔ zyx</text>

  <!-- 分隔线 -->
  <path d="M 30 142 L 570 142" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ====== 第二步：枚举切点串 ====== -->
  <text x="30" y="160" font-size="12" fill="#b85450" font-weight="bold">② 枚举切点串 i / 朝向 cur / 切点 j</text>

  <!-- 左列 i=0 -->
  <rect x="20" y="168" width="270" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="183" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">i=0   s=cba   rest="zyx"</text>

  <text x="28" y="206" font-size="10" fill="#446688">cur=cba：</text>
  <rect x="92" y="196" width="62" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="123" y="210" text-anchor="middle" font-size="10.5" fill="#555">cbazyx</text>
  <rect x="160" y="196" width="62" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="191" y="210" text-anchor="middle" font-size="10.5" fill="#555">bazyxc</text>
  <rect x="228" y="196" width="56" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="256" y="210" text-anchor="middle" font-size="10.5" fill="#555">azyxcb</text>

  <text x="28" y="234" font-size="10" fill="#446688">cur=abc：</text>
  <rect x="92" y="224" width="62" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="123" y="238" text-anchor="middle" font-size="10.5" fill="#555">abczyx</text>
  <rect x="160" y="224" width="62" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="191" y="238" text-anchor="middle" font-size="10.5" fill="#555">bczyxa</text>
  <rect x="228" y="224" width="56" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="256" y="238" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">czyxab</text>

  <text x="155" y="260" text-anchor="middle" font-size="9.5" fill="#888">首字符 'c'，暂为当前最大</text>

  <!-- 右列 i=1 -->
  <rect x="310" y="168" width="270" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="183" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">i=1   s=zyx   rest="cba"</text>

  <text x="318" y="206" font-size="10" fill="#446688">cur=zyx：</text>
  <rect x="382" y="196" width="62" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="413" y="210" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">zyxcba</text>
  <rect x="450" y="196" width="62" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="481" y="210" text-anchor="middle" font-size="10.5" fill="#555">yxcbaz</text>
  <rect x="518" y="196" width="56" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="546" y="210" text-anchor="middle" font-size="10.5" fill="#555">xcbazy</text>

  <text x="318" y="234" font-size="10" fill="#446688">cur=xyz：</text>
  <rect x="382" y="224" width="62" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="413" y="238" text-anchor="middle" font-size="10.5" fill="#555">xyzcba</text>
  <rect x="450" y="224" width="62" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="481" y="238" text-anchor="middle" font-size="10.5" fill="#555">yzcbax</text>
  <rect x="518" y="224" width="56" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="546" y="238" text-anchor="middle" font-size="10.5" fill="#555">zcbaxy</text>

  <text x="445" y="260" text-anchor="middle" font-size="9.5" fill="#b85450">首字符 'z'（全局最大！）★</text>

  <!-- 比较 -->
  <path d="M 300 276 L 300 300" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="304" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="324" text-anchor="middle" font-size="11" fill="#333">候选首字符最大为 'z'：比较 "zyxcba" 与 "zcbaxy"</text>
  <text x="300" y="342" text-anchor="middle" font-size="11" fill="#b85450">第 2 位 'y' &gt; 'c'  ⇒  "zyxcba" 胜出</text>

  <!-- 最终答案 -->
  <rect x="160" y="370" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">答案 = "zyxcba"</text>

  <!-- 旁注 -->
  <text x="300" y="430" text-anchor="middle" font-size="10" fill="#888">等价于：把 xyz 翻成 zyx、abc 翻成 cba，在 zyx 开头处切开</text>
  <text x="300" y="446" text-anchor="middle" font-size="10" fill="#888">即「在 s₁ 的 j=0 处切开」⇒ zyx + cba</text>
</svg>
