<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：好标题 = 同字符段拼接，每段长度 ≥ 3</text>
  <text x="260" y="37" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">段内全同字符（代价 Σ|s[i]−c|），「组进度」只有 4 种状态 → 状态机后缀 DP</text>

  <!-- 好标题示例 -->
  <text x="105" y="57" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✔ 好标题</text>
  <rect x="40" y="64" width="22" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="62" y="64" width="22" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="84" y="64" width="22" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="51" y="82" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="73" y="82" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="95" y="82" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="112" y="64" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="64" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="64" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="64" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="145" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="167" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="189" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="206" y="64" width="22" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="64" width="22" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="250" y="64" width="22" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="82" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="239" y="82" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="261" y="82" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="73" y="102" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">段长 3 ✓</text>
  <text x="156" y="102" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">段长 4 ✓</text>
  <text x="239" y="102" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">段长 3 ✓</text>

  <!-- 坏标题示例 -->
  <text x="428" y="57" text-anchor="middle" font-size="10" fill="#99443f" font-weight="bold" filter="url(#rough2)">✘ 不是好标题</text>
  <rect x="340" y="64" width="22" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="362" y="64" width="22" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="82" text-anchor="middle" font-size="12" fill="#99443f" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="373" y="82" text-anchor="middle" font-size="12" fill="#99443f" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="392" y="64" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="414" y="64" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="64" width="22" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="403" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="425" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="447" y="82" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="362" y="102" text-anchor="middle" font-size="8" fill="#99443f" filter="url(#rough2)">段长 2 ＜ 3 ✗</text>
  <text x="432" y="102" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">段长 3 ✓</text>

  <!-- 状态机 -->
  <text x="30" y="127" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">按「当前组进度」定义状态（从右往左倒序递推）：</text>

  <rect x="28" y="142" width="92" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="74" y="165" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">F</text>
  <text x="74" y="181" text-anchor="middle" font-size="8" fill="#33506b" filter="url(#rough2)">待新起一组</text>

  <rect x="152" y="142" width="92" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="198" y="165" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">G1</text>
  <text x="198" y="181" text-anchor="middle" font-size="8" fill="#33506b" filter="url(#rough2)">组内已有 1 个 c</text>

  <rect x="276" y="142" width="92" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="322" y="165" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">G2</text>
  <text x="322" y="181" text-anchor="middle" font-size="8" fill="#33506b" filter="url(#rough2)">组内已有 2 个 c</text>

  <rect x="400" y="142" width="92" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="446" y="165" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="446" y="181" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">组已凑满 ≥ 3 个</text>

  <path d="M 121 162 L 149 162" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="135" y="153" text-anchor="middle" font-size="8" fill="#33506b" filter="url(#rough2)">填 c</text>
  <path d="M 245 162 L 273 162" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="259" y="153" text-anchor="middle" font-size="8" fill="#33506b" filter="url(#rough2)">被迫填 c</text>
  <path d="M 369 162 L 397 162" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="383" y="153" text-anchor="middle" font-size="8" fill="#33506b" filter="url(#rough2)">被迫填 c</text>

  <path d="M 421 142 C 424 118, 479 118, 483 142" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="452" y="114" text-anchor="middle" font-size="8" fill="#2f5d24" filter="url(#rough2)">延长：仍填 c</text>

  <path d="M 446 188 C 446 222, 198 222, 198 191" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="322" y="232" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">换字符 x ≠ c → 新开一组</text>

  <rect x="30" y="196" width="152" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="106" y="207" text-anchor="middle" font-size="8" fill="#99443f" font-weight="bold" filter="url(#rough2)">⚠ 组未满 3 个：</text>
  <text x="106" y="220" text-anchor="middle" font-size="8" fill="#99443f" filter="url(#rough2)">下一格被迫填同字符</text>

  <!-- 转移方程 -->
  <rect x="16" y="248" width="488" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="265" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">后缀 DP 转移（s 为原串，c 为组字符，倒序 i = n−1 → 0）</text>
  <text x="260" y="283" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">G2[i][c] = |s[i]−c| + H[i+1][c]　　G1[i][c] = |s[i]−c| + G2[i+1][c]</text>
  <text x="260" y="300" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">H[i][c] = min( |s[i]−c| + H[i+1][c] , F[i] )　　F[i] = min over c ( |s[i]−c| + G1[i+1][c] )</text>
  <text x="260" y="317" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">边界：H[n][c] = 0，F[n] = 0，G1[n][c] = G2[n][c] = +∞（组没凑满就到串尾 = 无效）</text>
  <text x="260" y="333" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">F[i] 即「在位置 i 新开一组」的最小代价，被 H 的「换字符」分支复用</text>

  <text x="260" y="353" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">最小总代价 = F[0]；时间 / 空间 O(26n)，n ＜ 3 时无解返回空串</text>
</svg>
