<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="445" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：Trie 求 match → 分层贪心（Python 可换 Z 函数求 match）</text>

  <!-- ① -->
  <rect x="140" y="32" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">① 所有 word 插入 Trie（每节点 26 个子指针）</text>
  <path d="M 260 60 L 260 72" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② -->
  <rect x="130" y="74" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">② 每个 i：从根沿 target[i:] 走到走不动 → match[i]</text>
  <path d="M 260 102 L 260 114" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ -->
  <rect x="175" y="116" width="170" height="26" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">③ end = farthest = ans = 0</text>
  <path d="M 260 142 L 260 154" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ④ 循环体 -->
  <rect x="105" y="156" width="310" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">④ i = 0..n−1：farthest = max(farthest, i + match[i])</text>
  <path d="M 260 184 L 260 196" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ⑤ i == end ? -->
  <polygon points="260,198 352,224 260,250 168,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="221" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i == end？</text>
  <text x="260" y="235" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">（当前层扫完）</text>

  <path d="M 260 250 L 260 262" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="268" y="260" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- ⑥ farthest == end ? -->
  <polygon points="260,264 348,290 260,316 172,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">farthest == end？</text>

  <path d="M 172 290 L 134 290" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="153" y="282" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是·卡死</text>
  <rect x="28" y="274" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="288" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">return −1</text>
  <text x="80" y="301" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（示例 3）</text>

  <path d="M 260 316 L 260 328" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="268" y="326" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ⑦ -->
  <rect x="160" y="330" width="200" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">⑦ end = farthest；ans++</text>
  <path d="M 260 356 L 260 368" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ⑧ end >= n ? -->
  <polygon points="260,370 342,394 260,418 178,394" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="398" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">end ≥ n？</text>

  <path d="M 342 394 L 386 394" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="364" y="386" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="390" y="380" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="399" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">return ans ✓</text>

  <!-- 回边：⑧ 否 与 ⑤ 否 汇入右侧通道，回到 ④ -->
  <path d="M 260 418 L 260 434 L 500 434" stroke="#999" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="272" y="432" font-size="9" fill="#777" filter="url(#rough2)">否</text>
  <path d="M 352 224 L 500 224" stroke="#999" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="436" y="217" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">否·下一个 i</text>
  <path d="M 500 434 L 500 170 L 421 170" stroke="#999" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
</svg>
