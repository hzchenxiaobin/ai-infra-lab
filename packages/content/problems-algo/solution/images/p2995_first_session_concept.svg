<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最早一场的身份定资格，资格通过者数主播场</text>

  <!-- 图例 -->
  <circle cx="30" cy="44" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="30" y="47.5" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">V</text>
  <text x="44" y="48" font-size="10.5" fill="#446688" filter="url(#rough2)">观众场 Viewer</text>
  <circle cx="152" cy="44" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="47.5" text-anchor="middle" font-size="9" fill="#a06a10" font-weight="bold" filter="url(#rough2)">S</text>
  <text x="166" y="48" font-size="10.5" fill="#a06a10" filter="url(#rough2)">主播场 Streamer</text>
  <circle cx="292" cy="44" r="11" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="308" y="48" font-size="10.5" fill="#b85450" filter="url(#rough2)">首场（资格判定）</text>

  <!-- lane 1: user 101 通过 -->
  <rect x="14" y="68" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">101</text>
  <line x1="78" y1="83" x2="386" y2="83" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="128" cy="83" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="87" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">V</text>
  <circle cx="128" cy="83" r="15.5" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="128" y="62" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">首场</text>
  <circle cx="256" cy="83" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="256" y="87" text-anchor="middle" font-size="10" fill="#a06a10" font-weight="bold" filter="url(#rough2)">S</text>
  <circle cx="344" cy="83" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="344" y="87" text-anchor="middle" font-size="10" fill="#a06a10" font-weight="bold" filter="url(#rough2)">S</text>
  <text x="128" y="104" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">11-06</text>
  <text x="256" y="104" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">11-20</text>
  <text x="344" y="104" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">11-22</text>
  <rect x="396" y="67" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="451" y="80" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 观众出身</text>
  <text x="451" y="93" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">主播 2 场 → 输出</text>

  <!-- lane 2: user 102 首场即主播 -->
  <rect x="14" y="134" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="154" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">102</text>
  <line x1="78" y1="149" x2="386" y2="149" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="140" cy="149" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="153" text-anchor="middle" font-size="10" fill="#a06a10" font-weight="bold" filter="url(#rough2)">S</text>
  <circle cx="140" cy="149" r="15.5" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <circle cx="312" cy="149" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="312" y="153" text-anchor="middle" font-size="10" fill="#a06a10" font-weight="bold" filter="url(#rough2)">S</text>
  <text x="140" y="170" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">11-16</text>
  <text x="312" y="170" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">11-17</text>
  <rect x="396" y="133" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="451" y="146" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ 首场即主播</text>
  <text x="451" y="159" text-anchor="middle" font-size="10" fill="#8f3a36" filter="url(#rough2)">整组排除</text>

  <!-- lane 3: user 103 仅一场主播 -->
  <rect x="14" y="200" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="220" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">103</text>
  <line x1="78" y1="215" x2="386" y2="215" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="216" cy="215" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="219" text-anchor="middle" font-size="10" fill="#a06a10" font-weight="bold" filter="url(#rough2)">S</text>
  <circle cx="216" cy="215" r="15.5" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="216" y="236" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">11-27</text>
  <rect x="396" y="199" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="451" y="212" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ 首场即主播</text>
  <text x="451" y="225" text-anchor="middle" font-size="10" fill="#8f3a36" filter="url(#rough2)">整组排除</text>

  <!-- lane 4: user 104 观众出身但 0 场主播 -->
  <rect x="14" y="266" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="286" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">104</text>
  <line x1="78" y1="281" x2="386" y2="281" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="216" cy="281" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="285" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">V</text>
  <circle cx="216" cy="281" r="15.5" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="216" y="302" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">11-27</text>
  <rect x="396" y="265" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="451" y="278" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ 0 场主播</text>
  <text x="451" y="291" text-anchor="middle" font-size="10" fill="#8f3a36" filter="url(#rough2)">整行不输出</text>

  <!-- 底部说明 -->
  <rect x="14" y="310" width="492" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">内连接妙处：观众出身但从未开播的用户（如 104）配不到任何主播行 → 整组消失</text>
  <text x="260" y="343" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">判定只看 session_start 与 session_type；session_end（时长）是干扰列</text>
</svg>
