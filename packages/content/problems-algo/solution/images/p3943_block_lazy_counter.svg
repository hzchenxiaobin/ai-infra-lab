<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：整块吃懒标记，散块改计数表</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例：nums2 分 4 块（B=3），更新 [1, 2, 10, +2]：首尾散块逐元素改，中间整块只改 lazy</text>

  <text x="290" y="52" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">更新区间 [x=2, y=10]</text>
  <path d="M 134 62 L 134 57 L 446 57 L 446 62" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="45" y="64" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="81" y="64" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="117" y="64" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="153" y="64" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="189" y="64" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="225" y="64" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="261" y="64" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="297" y="64" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="333" y="64" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="369" y="64" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="405" y="64" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="441" y="64" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="62" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="98" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="134" y="85" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="170" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="206" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="242" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="278" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="314" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="350" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="386" y="85" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="422" y="85" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="458" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="62" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="98" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="134" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="170" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="206" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="242" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="278" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="314" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="350" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">8</text>
  <text x="386" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">9</text>
  <text x="422" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">10</text>
  <text x="458" y="110" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">11</text>

  <line x1="151" y1="60" x2="151" y2="100" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="259" y1="60" x2="259" y2="100" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="367" y1="60" x2="367" y2="100" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="97" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">块 B₀</text>
  <text x="205" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">块 B₁</text>
  <text x="313" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">块 B₂</text>
  <text x="421" y="128" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">块 B₃</text>

  <path d="M 128 132 C 118 140, 104 136, 94 142" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 318 132 C 334 140, 350 136, 362 142" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="142" width="228" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="160" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">散块（首尾各至多 1 个）</text>
  <text x="36" y="180" font-size="9.5" fill="#555" filter="url(#rough2)">逐元素 a[k] += val，同步改计数表：</text>
  <text x="36" y="198" font-size="9.5" fill="#a0433f" filter="url(#rough2)">cnt₀ {1:1, 3:1, 8:1} → {1:1, 3:1, 10:1}</text>
  <text x="36" y="216" font-size="9.5" fill="#555" filter="url(#rough2)">（计数归零的键要删掉，防表膨胀）</text>
  <text x="36" y="238" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">花费 O(B)，B 是块大小</text>

  <rect x="268" y="142" width="228" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="160" text-anchor="middle" font-size="10.5" fill="#3d6330" font-weight="bold" filter="url(#rough2)">整块（中间连续若干个）</text>
  <text x="280" y="180" font-size="9.5" fill="#555" filter="url(#rough2)">只改一个整数：lazy_b += val</text>
  <text x="280" y="198" font-size="9.5" fill="#3d6330" filter="url(#rough2)">计数表原封不动：cnt₁ = {2:1, 5:1, 4:1}</text>
  <text x="280" y="216" font-size="9.5" fill="#555" filter="url(#rough2)">真实值 = 表中键 + lazy_b（查询时再合并）</text>
  <text x="280" y="238" font-size="10" fill="#3d6330" font-weight="bold" filter="url(#rough2)">花费 O(1) / 块 —— 懒标记的精髓</text>

  <rect x="24" y="262" width="472" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="34" y="282" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">查询 [2, tot]：对 nums1 的每个取值 a（不同值 ≤ 5 个）⇒ 目标 t = tot − a</text>
  <text x="34" y="302" font-size="10" fill="#444" filter="url(#rough2)">answer += w · Σ_b cnt_b[ t − lazy_b ]  —— 每块一次哈希查表，懒标记用一次减法吸收</text>
  <text x="34" y="322" font-size="10" fill="#4a7a3a" filter="url(#rough2)">例：tot=9, a=2 ⇒ t=7：B₁ 查 cnt₁[7−2] = cnt₁[5] = 1 ✓（基值 5 + lazy 2 = 7）</text>
  <text x="34" y="340" font-size="9.5" fill="#666" filter="url(#rough2)">B₂ 查 cnt₂[7−2] = cnt₂[5] = 0；B₀ / B₃ 查 cnt[7]；把各块命中数乘出现次数 w 后求和</text>
</svg>
