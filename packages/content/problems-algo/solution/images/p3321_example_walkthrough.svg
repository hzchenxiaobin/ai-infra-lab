<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 626"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="626" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,1,2,2,3,4,2,3]，k = 6，x = 2</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">条目记号 f×v（频率, 数值）按降序排队，虚线左侧为 L（top-2），右侧为 R（候补）</text>
  <text x="260" y="54" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">橙框 = 本轮新晋 L 的条目；绿 +N = 入窗值，红 −1 = 出窗值</text>

  <!-- ===== 窗口 0 ===== -->
  <text x="24" y="76" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">窗口 0：[1,1,2,2,3,4]</text>
  <rect x="60" y="80" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="99" y="80" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="80" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="177" y="80" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="80" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="255" y="80" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="294" y="80" width="36" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="333" y="80" width="36" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="78" y="99" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="117" y="99" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="156" y="99" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="195" y="99" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="234" y="99" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="273" y="99" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="312" y="99" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">2</text>
  <text x="351" y="99" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">3</text>
  <text x="78" y="120" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="117" y="120" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="156" y="120" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="195" y="120" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="234" y="120" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="273" y="120" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="312" y="120" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="351" y="120" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>

  <rect x="60" y="144" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="144" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <path d="M 190 140 L 190 178" fill="none" stroke="#a07830" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="204" y="144" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="144" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="164" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2×1</text>
  <text x="152" y="164" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2×2</text>
  <text x="232" y="164" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1×4</text>
  <text x="296" y="164" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1×3</text>
  <text x="425" y="159" text-anchor="middle" font-size="12" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">sumL = 2+4 = 6</text>
  <text x="425" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">answer[0] = 6</text>

  <!-- ===== 窗口 1 ===== -->
  <text x="24" y="218" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">窗口 1：[1,2,2,3,4,2]</text>
  <rect x="60" y="222" width="36" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="99" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="177" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="255" y="222" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="294" y="222" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="333" y="222" width="36" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="78" y="241" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="117" y="241" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="156" y="241" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="195" y="241" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="234" y="241" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="273" y="241" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="312" y="241" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="351" y="241" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">3</text>
  <text x="78" y="276" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1 出窗</text>
  <text x="311" y="276" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+2 入窗</text>

  <rect x="60" y="286" width="56" height="30" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="286" width="56" height="30" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <path d="M 190 282 L 190 320" fill="none" stroke="#a07830" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="204" y="286" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="286" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="306" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">3×2</text>
  <text x="152" y="306" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">1×4</text>
  <text x="232" y="306" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1×3</text>
  <text x="296" y="306" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1×1</text>
  <text x="425" y="301" text-anchor="middle" font-size="12" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">sumL = 6+4 = 10</text>
  <text x="425" y="318" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">answer[1] = 10</text>

  <rect x="60" y="326" width="330" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="225" y="340" text-anchor="middle" font-size="9.5" fill="#8f3a35" filter="url(#rough2)">✱ (1,4) 压过 (1,3)：频率同为 1，数值大者胜 —— 平局规则</text>

  <!-- ===== 窗口 2 ===== -->
  <text x="24" y="368" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">窗口 2：[2,2,3,4,2,3]</text>
  <rect x="60" y="372" width="36" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="99" y="372" width="36" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="372" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="177" y="372" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="372" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="255" y="372" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="294" y="372" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="333" y="372" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="391" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="117" y="391" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="156" y="391" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="195" y="391" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="234" y="391" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="273" y="391" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="312" y="391" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="351" y="391" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="117" y="426" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1 出窗</text>
  <text x="351" y="426" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+3 入窗</text>

  <rect x="60" y="436" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="436" width="56" height="30" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <path d="M 190 432 L 190 470" fill="none" stroke="#a07830" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="204" y="436" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="456" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">3×2</text>
  <text x="152" y="456" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">2×3</text>
  <text x="232" y="456" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1×4</text>
  <text x="425" y="451" text-anchor="middle" font-size="12" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">sumL = 6+6 = 12</text>
  <text x="425" y="468" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">answer[2] = 12</text>

  <!-- ===== 迁移细节面板 ===== -->
  <rect x="20" y="478" width="480" height="136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="498" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">窗口 0 → 窗口 1 的迁移（i = 6）：三板斧全用上</text>
  <text x="36" y="517" text-anchor="start" font-size="10" fill="#8a6a2a" filter="url(#rough2)">① 入窗 2：摘旧牌 (2,2)（在 L，sumL−4），频率 2→3，新牌 (3,2) 进 R</text>
  <text x="36" y="534" text-anchor="start" font-size="10" fill="#8a6a2a" filter="url(#rough2)">② 出窗 1：摘旧牌 (2,1)（在 L，sumL−2），频率 2→1，新牌 (1,1) 进 R —— 此时 L 空、R 积 4 条</text>
  <text x="36" y="551" text-anchor="start" font-size="10" fill="#8a6a2a" filter="url(#rough2)">③ 缺编晋级：连拉两个 R 最大者 —— (3,2) → sumL=6；(1,4) → sumL=10</text>
  <text x="36" y="568" text-anchor="start" font-size="10" fill="#8a6a2a" filter="url(#rough2)">④ 错位检查：min(L)=(1,4) &gt; max(R)=(1,3)，无需互换 → answer[1] = 10</text>
  <text x="36" y="590" text-anchor="start" font-size="9" fill="#a08040" filter="url(#rough2)">摘牌定位：旧牌 (2,2) ≥ min(L)=(2,1) ⟹ 在 L；新牌一律先进 R，由 balance 决定去留</text>
</svg>
