<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="240" fill="#fafafa"/>

  <!-- 输入 -->
  <rect x="110" y="20" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="44" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入：text = "Keep calm and code on"</text>

  <path d="M 290 64 L 290 84" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 五步流程 -->
  <g filter="url(#rough2)">
    <rect x="22" y="90" width="92" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="68" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 按空格</text>
    <text x="68" y="128" text-anchor="middle" font-size="12" fill="#333">切分</text>

    <rect x="130" y="90" width="92" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="176" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 整体</text>
    <text x="176" y="128" text-anchor="middle" font-size="12" fill="#333">转小写</text>

    <rect x="238" y="90" width="92" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="284" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 稳定</text>
    <text x="284" y="128" text-anchor="middle" font-size="12" fill="#333">排序</text>

    <rect x="346" y="90" width="92" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="392" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 首词</text>
    <text x="392" y="128" text-anchor="middle" font-size="12" fill="#333">大写</text>

    <rect x="454" y="90" width="92" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="500" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 单空格</text>
    <text x="500" y="128" text-anchor="middle" font-size="12" fill="#333">拼接</text>
  </g>

  <!-- 步骤间箭头 -->
  <g filter="url(#rough2)">
    <path d="M 114 115 L 128 115" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none"/>
    <path d="M 222 115 L 236 115" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none"/>
    <path d="M 330 115 L 344 115" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none"/>
    <path d="M 438 115 L 452 115" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none"/>
  </g>

  <path d="M 290 142 L 290 168" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="110" y="176" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出："On and keep calm code"</text>

  <text x="290" y="232" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">关键：步骤③ 必须用稳定排序（C++ stable_sort / Python sort）</text>
</svg>
