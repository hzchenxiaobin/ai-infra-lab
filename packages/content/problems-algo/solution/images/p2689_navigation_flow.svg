<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：用 len 字段导航，不建整串</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">每层只比一次 k 与左子树长度，O(树高) 定位第 k 个字符</text>

  <!-- start -->
  <rect x="200" y="66" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">getKthCharacter(node, k)</text>
  <line x1="280" y1="100" x2="280" y2="124" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: leaf? -->
  <polygon points="280,124 392,170 280,216 168,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">node 是叶子？</text>
  <text x="280" y="182" text-anchor="middle" font-size="10" fill="#888">无左右子节点</text>

  <!-- yes branch -> return val[k-1] -->
  <line x1="168" y1="170" x2="96" y2="170" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="152" width="76" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="58" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="58" y="181" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">val[k-1]</text>

  <!-- no branch down -->
  <line x1="280" y1="216" x2="280" y2="240" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="232" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- compute leftLen -->
  <rect x="170" y="240" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">leftLen = left.len（左子树串长）</text>
  <text x="280" y="272" text-anchor="middle" font-size="9" fill="#888">无左子则 leftLen = 0</text>
  <line x1="280" y1="280" x2="280" y2="304" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 2: k <= leftLen ? -->
  <polygon points="280,304 410,350 280,396 150,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k ≤ leftLen ?</text>
  <text x="280" y="362" text-anchor="middle" font-size="9" fill="#888">目标在左子树</text>

  <!-- yes -> recurse left -->
  <line x1="150" y1="350" x2="78" y2="350" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="100" y="342" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是</text>
  <rect x="6" y="332" width="72" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="42" y="348" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">递归左</text>
  <text x="42" y="361" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">getKth(left, k)</text>

  <!-- no -> recurse right with k-leftLen -->
  <line x1="410" y1="350" x2="482" y2="350" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="342" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="484" y="332" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="519" y="348" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">递归右</text>
  <text x="519" y="361" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">getKth(right,</text>
  <text x="519" y="372" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">k - leftLen)</text>

  <!-- bottom note -->
  <line x1="20" y1="412" x2="540" y2="412" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">关键：len 字段 = 该子树代表串的真实长度，省去「拼接整串」</text>
  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#888">k 减去跳过的左子树长度后，递归进入右子树继续定位</text>
</svg>
