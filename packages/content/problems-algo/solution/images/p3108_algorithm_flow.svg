<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：并查集 + 分量 AND，两遍扫边一遍答询</text>

  <!-- Step 1 -->
  <rect x="110" y="44" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化 pa[i] = i</text>
  <text x="260" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">comp_and[i] = -1（二进制全 1，AND 单位元）</text>

  <path d="M 260 84 L 260 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="110" y="102" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 第一遍扫边：pa[find(u)] = find(v)</text>
  <text x="260" y="132" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">只管合并，先不算 AND（避免丢历史累积）</text>

  <path d="M 260 138 L 260 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="110" y="156" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 第二遍扫边：comp_and[find(u)] &amp;= w</text>
  <text x="260" y="186" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">每条边权 AND 进所在分量的根</text>

  <path d="M 260 192 L 260 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision -->
  <polygon points="260,210 366,244 260,278 154,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">④ 逐查询</text>
  <text x="260" y="256" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">find(s) == find(t) ?</text>

  <!-- No branch -->
  <path d="M 366 244 L 428 244" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="432" y="228" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="462" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">-1</text>

  <!-- Yes branch -->
  <path d="M 260 278 L 260 302" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="276" y="294" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="150" y="306" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer = comp_and[根]</text>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">分量全体边权的 AND</text>

  <!-- Note box -->
  <rect x="60" y="366" width="400" height="58" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">边角案例全靠初值兜底：孤立点分量没有任何边，comp_and 保持 -1</text>
  <text x="260" y="404" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">s = t 落在孤立点 ⇒ 直接返回 -1，无需特判；</text>
  <text x="260" y="418" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">总复杂度 O((n + m + q)·α(n))，空间 O(n)</text>
</svg>
