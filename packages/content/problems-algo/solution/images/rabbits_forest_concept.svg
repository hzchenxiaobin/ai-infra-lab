<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：回答 x 的兔子，同色组规模恰为 x+1；超员则另开一组</text>

  <!-- ===== 情形 A：恰好 x+1 只回答 x ===== -->
  <text x="30" y="62" font-size="12" fill="#888" font-weight="bold">情形A：2 只兔子都回答 1</text>
  <rect x="30" y="72" width="220" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <!-- rabbit 1 -->
  <ellipse cx="70" cy="108" rx="14" ry="12" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="64" cy="104" r="2" fill="#446688"/>
  <circle cx="76" cy="104" r="2" fill="#446688"/>
  <text x="70" y="138" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">答:1</text>
  <!-- rabbit 2 -->
  <ellipse cx="120" cy="108" rx="14" ry="12" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="114" cy="104" r="2" fill="#446688"/>
  <circle cx="126" cy="104" r="2" fill="#446688"/>
  <text x="120" y="138" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">答:1</text>
  <!-- bracket：同色 -->
  <path d="M 56 86 Q 95 78 134 86" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="180" y="106" font-size="11" fill="#4a7a3a" font-weight="bold">同色组</text>
  <text x="180" y="122" font-size="11" fill="#4a7a3a" font-weight="bold">= 2 只</text>
  <text x="180" y="138" font-size="10" fill="#888">(x+1)</text>

  <!-- arrow down -->
  <path d="M 140 148 L 140 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="162" font-size="10" fill="#888">刚好一组</text>

  <!-- ===== 情形 B：3 只回答 1，超员 ===== -->
  <text x="300" y="62" font-size="12" fill="#b85450" font-weight="bold">情形B：3 只兔子都回答 1</text>
  <rect x="300" y="72" width="230" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <!-- rabbit 1 -->
  <ellipse cx="338" cy="108" rx="14" ry="12" fill="#fff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="332" cy="104" r="2" fill="#b85450"/>
  <circle cx="344" cy="104" r="2" fill="#b85450"/>
  <text x="338" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">答:1</text>
  <!-- rabbit 2 -->
  <ellipse cx="388" cy="108" rx="14" ry="12" fill="#fff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="382" cy="104" r="2" fill="#b85450"/>
  <circle cx="394" cy="104" r="2" fill="#b85450"/>
  <text x="388" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">答:1</text>
  <!-- rabbit 3 -->
  <ellipse cx="438" cy="108" rx="14" ry="12" fill="#fff" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <circle cx="432" cy="104" r="2" fill="#d6a040"/>
  <circle cx="444" cy="104" r="2" fill="#d6a040"/>
  <text x="438" y="138" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">答:1?</text>
  <text x="488" y="100" font-size="11" fill="#b85450" font-weight="bold">超员!</text>
  <text x="488" y="116" font-size="10" fill="#888">第3只无法</text>
  <text x="488" y="130" font-size="10" fill="#888">塞进2人组</text>

  <!-- arrow down -->
  <path d="M 415 148 L 415 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="425" y="162" font-size="10" fill="#888">必须拆组</text>

  <!-- ===== 拆组结果 ===== -->
  <text x="30" y="196" font-size="12" fill="#888" font-weight="bold">拆组后：2 组，每组 2 只 = 4 只</text>
  <rect x="30" y="206" width="230" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <!-- group 1 -->
  <ellipse cx="68" cy="234" rx="12" ry="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="96" cy="234" rx="12" ry="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="256" text-anchor="middle" font-size="9" fill="#446688">组1=2</text>
  <!-- group 2 -->
  <ellipse cx="168" cy="234" rx="12" ry="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="196" cy="234" rx="12" ry="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="256" text-anchor="middle" font-size="9" fill="#d6a040">组2=2</text>
  <text x="230" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">4 只</text>

  <!-- formula box -->
  <rect x="30" y="278" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">回答 x 的兔子共 c 只 → 组数 = ⌈c / (x+1)⌉ → 兔子数 = 组数 × (x+1)</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#666">每组上限 x+1（含它自己）；超员必属异色，无法「合并省钱」</text>

  <!-- legend -->
  <rect x="30" y="338" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="348" font-size="10" fill="#666">同色组</text>
  <rect x="100" y="338" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="348" font-size="10" fill="#666">另开异色组</text>
  <text x="200" y="348" font-size="10" fill="#888">「ceil 分组」贪心：能塞满就塞满，余数另起一组</text>
</svg>
