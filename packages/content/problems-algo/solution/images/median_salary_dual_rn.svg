<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双向行号对碰：rn_asc 与 rn_desc 在中点相遇</text>

  <!-- Company A dual row numbers -->
  <text x="140" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">公司 A（n=6）</text>
  <rect x="30" y="62" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="77" font-size="9" fill="#333">salary</text>
  <text x="110" y="77" font-size="9" fill="#333">rn_asc</text>
  <text x="160" y="77" font-size="9" fill="#333">rn_desc</text>
  <text x="210" y="77" font-size="9" fill="#333">|差|</text>
  <line x1="85" y1="62" x2="85" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="135" y1="62" x2="135" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="185" y1="62" x2="185" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="86" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="100" font-size="9" fill="#333">15</text>
  <text x="115" y="100" font-size="9.5" fill="#333">1</text>
  <text x="165" y="100" font-size="9.5" fill="#333">6</text>
  <text x="215" y="100" font-size="9.5" fill="#888">5</text>

  <rect x="30" y="106" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="120" font-size="9" fill="#333">341</text>
  <text x="115" y="120" font-size="9.5" fill="#333">2</text>
  <text x="165" y="120" font-size="9.5" fill="#333">5</text>
  <text x="215" y="120" font-size="9.5" fill="#888">3</text>

  <rect x="30" y="126" width="220" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="141" font-size="9.5" fill="#b85450" font-weight="bold">451</text>
  <text x="115" y="141" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="165" y="141" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="215" y="141" font-size="10" fill="#b85450" font-weight="bold">1 ✓</text>

  <rect x="30" y="148" width="220" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="163" font-size="9.5" fill="#b85450" font-weight="bold">513</text>
  <text x="115" y="163" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="165" y="163" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="215" y="163" font-size="10" fill="#b85450" font-weight="bold">1 ✓</text>

  <rect x="30" y="170" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="184" font-size="9" fill="#333">2341</text>
  <text x="115" y="184" font-size="9.5" fill="#333">5</text>
  <text x="165" y="184" font-size="9.5" fill="#333">2</text>
  <text x="215" y="184" font-size="9.5" fill="#888">3</text>

  <rect x="30" y="190" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="204" font-size="9" fill="#333">15314</text>
  <text x="115" y="204" font-size="9.5" fill="#333">6</text>
  <text x="165" y="204" font-size="9.5" fill="#333">1</text>
  <text x="215" y="204" font-size="9.5" fill="#888">5</text>

  <line x1="85" y1="86" x2="85" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="135" y1="86" x2="135" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="185" y1="86" x2="185" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="140" y="226" text-anchor="middle" font-size="9" fill="#b85450">|rn_asc − rn_desc| ≤ 1 即中位数行</text>

  <!-- Arrows meeting in the middle -->
  <path d="M270 90 L270 200" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="100" font-size="8" fill="#446688">rn_asc</text>
  <text x="276" y="112" font-size="8" fill="#446688">1→6</text>
  <path d="M290 200 L290 90" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="200" font-size="8" fill="#b85450">rn_desc</text>
  <text x="296" y="188" font-size="8" fill="#b85450">6→1</text>

  <!-- Company B dual row numbers -->
  <text x="460" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">公司 B（n=4）</text>
  <rect x="350" y="62" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="77" font-size="9" fill="#333">salary</text>
  <text x="430" y="77" font-size="9" fill="#333">rn_asc</text>
  <text x="480" y="77" font-size="9" fill="#333">rn_desc</text>
  <text x="530" y="77" font-size="9" fill="#333">|差|</text>
  <line x1="405" y1="62" x2="405" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="455" y1="62" x2="455" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="505" y1="62" x2="505" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="86" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="100" font-size="9" fill="#333">13</text>
  <text x="435" y="100" font-size="9.5" fill="#333">1</text>
  <text x="485" y="100" font-size="9.5" fill="#333">4</text>
  <text x="535" y="100" font-size="9.5" fill="#888">3</text>

  <rect x="350" y="106" width="220" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="121" font-size="9.5" fill="#b85450" font-weight="bold">15</text>
  <text x="435" y="121" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="485" y="121" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="535" y="121" font-size="10" fill="#b85450" font-weight="bold">1 ✓</text>

  <rect x="350" y="128" width="220" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="143" font-size="9.5" fill="#b85450" font-weight="bold">1154</text>
  <text x="435" y="143" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="485" y="143" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="535" y="143" font-size="10" fill="#b85450" font-weight="bold">1 ✓</text>

  <rect x="350" y="150" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="164" font-size="9" fill="#333">1345</text>
  <text x="435" y="164" font-size="9.5" fill="#333">4</text>
  <text x="485" y="164" font-size="9.5" fill="#333">1</text>
  <text x="535" y="164" font-size="9.5" fill="#888">3</text>

  <line x1="405" y1="86" x2="405" y2="170" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="455" y1="86" x2="455" y2="170" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="505" y1="86" x2="505" y2="170" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="460" y="186" text-anchor="middle" font-size="9" fill="#b85450">奇数 n 时 |差|=0 唯一命中</text>

  <!-- Key takeaway box -->
  <rect x="40" y="248" width="540" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="272" font-size="11.5" fill="#333" font-weight="bold">双向行号法核心：两条排序方向相反的行号「对碰」</text>
  <text x="60" y="294" font-size="10.5" fill="#555">• rn_asc：ORDER BY salary ASC, id ASC → 从小到大编号 1, 2, ..., n</text>
  <text x="60" y="312" font-size="10.5" fill="#555">• rn_desc：ORDER BY salary DESC, id DESC → 从大到小编号 n, ..., 2, 1</text>
  <text x="60" y="334" font-size="10.5" fill="#555">• 奇数 n：正中行 rn_asc = rn_desc（差=0），唯一命中</text>
  <text x="60" y="352" font-size="10.5" fill="#555">• 偶数 n：中间两行 rn_asc - rn_desc = ±1，两行命中</text>
  <text x="60" y="374" font-size="10.5" fill="#b85450" font-weight="bold">→ WHERE ABS(rn_asc - rn_desc) &lt;= 1 即可，无需 COUNT</text>
</svg>
