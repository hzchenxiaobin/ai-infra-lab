<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="240" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 隔位累加</text>

  <!-- Step 1: input -->
  <rect x="24" y="92" width="104" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="76" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">输入 nums</text>
  <text x="76" y="134" text-anchor="middle" font-size="10" fill="#666">(2n 个整数)</text>

  <!-- arrow 1 -->
  <path d="M 130 120 L 162 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="166" y="92" width="104" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="218" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">排序</text>
  <text x="218" y="134" text-anchor="middle" font-size="10" fill="#666">sort(nums.begin(), end)</text>

  <!-- arrow 2 -->
  <path d="M 272 120 L 304 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sum even indices -->
  <rect x="308" y="92" width="130" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="373" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">遍历偶数下标</text>
  <text x="373" y="130" text-anchor="middle" font-size="10" fill="#666">i = 0, 2, 4, …, 2n−2</text>
  <text x="373" y="143" text-anchor="middle" font-size="10" fill="#666">sum += nums[i]</text>

  <!-- arrow 3 -->
  <path d="M 440 120 L 472 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="476" y="92" width="64" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="508" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回</text>
  <text x="508" y="134" text-anchor="middle" font-size="10" fill="#666">sum</text>

  <!-- loop detail box -->
  <rect x="120" y="170" width="320" height="50" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">等价写法：步长 2 累加</text>
  <text x="280" y="208" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">for (int i = 0; i &lt; n; i += 2) sum += nums[i];</text>
</svg>
