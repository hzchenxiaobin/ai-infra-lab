<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：新增格数构成等差数列 4, 8, 12, 16 …</text>

  <!-- ===== 表格 ===== -->
  <!-- 列 x 边界: 40,130,225,320,420,560 ; 列中心: 85,177,272,375,490 -->
  <!-- 表头 -->
  <rect x="40" y="48" width="520" height="32" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">n</text>
  <text x="177" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">新增环</text>
  <text x="272" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">新增格数</text>
  <text x="375" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">累计 total</text>
  <text x="490" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2n(n−1)+1</text>

  <!-- 行分隔竖线 -->
  <line x1="130" y1="48" x2="130" y2="308" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="225" y1="48" x2="225" y2="308" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="48" x2="320" y2="308" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="48" x2="420" y2="308" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 n=1（起始） -->
  <rect x="40" y="80" width="520" height="32" fill="#e8f0fe" stroke="#ccc" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
  <text x="85" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="177" y="100" text-anchor="middle" font-size="11" fill="#888">—（起始中心）</text>
  <text x="272" y="100" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="375" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="490" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a">2·1·0 + 1 = 1 ✓</text>

  <!-- 行 n=2 -->
  <rect x="40" y="112" width="520" height="32" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
  <text x="85" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="177" y="132" text-anchor="middle" font-size="11" fill="#333">环 d=1</text>
  <text x="272" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="375" y="132" text-anchor="middle" font-size="12" fill="#333">1 + 4 = 5</text>
  <text x="490" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a">2·2·1 + 1 = 5 ✓</text>

  <!-- 行 n=3 -->
  <rect x="40" y="144" width="520" height="32" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)" opacity="0.5"/>
  <text x="85" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="177" y="164" text-anchor="middle" font-size="11" fill="#333">环 d=2</text>
  <text x="272" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="375" y="164" text-anchor="middle" font-size="12" fill="#333">5 + 8 = 13</text>
  <text x="490" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a">2·3·2 + 1 = 13 ✓</text>

  <!-- 行 n=4（高亮，与概念图对应） -->
  <rect x="40" y="176" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <text x="177" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">环 d=3</text>
  <text x="272" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">12</text>
  <text x="375" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">13 + 12 = 25</text>
  <text x="490" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2·4·3 + 1 = 25 ✓</text>

  <!-- 行 n=5 -->
  <rect x="40" y="208" width="520" height="32" fill="#fce4ec" stroke="#ccc" stroke-width="1" filter="url(#rough2)" opacity="0.5"/>
  <text x="85" y="228" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="177" y="228" text-anchor="middle" font-size="11" fill="#333">环 d=4</text>
  <text x="272" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">16</text>
  <text x="375" y="228" text-anchor="middle" font-size="12" fill="#333">25 + 16 = 41</text>
  <text x="490" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a">2·5·4 + 1 = 41 ✓</text>

  <!-- 外框 -->
  <rect x="40" y="48" width="520" height="192" fill="none" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <!-- ===== 底部说明 ===== -->
  <rect x="40" y="258" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="300" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新增格数 = 4, 8, 12, 16 … = 公差 4 的等差数列</text>
  <text x="300" y="294" text-anchor="middle" font-size="10" fill="#333">累计 = 1 + 4·(1+2+3+…+(n−1)) = 1 + 2n(n−1)</text>

  <rect x="40" y="316" width="520" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="300" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">每分钟恰好染满一环，故无需逐格模拟</text>
  <text x="300" y="352" text-anchor="middle" font-size="10" fill="#333">n = 10⁵ 时累计 ≈ 2×10¹⁰，逐格 BFS 不可行，必须用闭合公式</text>
</svg>
