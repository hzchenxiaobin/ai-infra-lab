<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：下标 i 处的缺失数 = arr[i] − (i+1)</text>

  <!-- ===== Row 1: ideal sequence i+1 ===== -->
  <text x="40" y="68" font-size="11" fill="#888" text-anchor="end">理想值</text>
  <text x="50" y="68" font-size="10" fill="#aaa">i+1</text>
  <rect x="70" y="52" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="72" text-anchor="middle" font-size="12" fill="#999">1</text>
  <rect x="135" y="52" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="72" text-anchor="middle" font-size="12" fill="#999">2</text>
  <rect x="200" y="52" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="72" text-anchor="middle" font-size="12" fill="#999">3</text>
  <rect x="265" y="52" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="72" text-anchor="middle" font-size="12" fill="#999">4</text>
  <rect x="330" y="52" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="72" text-anchor="middle" font-size="12" fill="#999">5</text>

  <!-- index labels -->
  <text x="100" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="165" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="230" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="295" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="360" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>

  <!-- ===== Row 2: actual arr ===== -->
  <text x="40" y="128" font-size="11" fill="#446688" font-weight="bold" text-anchor="end">实际值</text>
  <text x="50" y="128" font-size="10" fill="#446688">arr</text>
  <rect x="70" y="112" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="132" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="135" y="112" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="132" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="200" y="112" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="132" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="265" y="112" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="132" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="330" y="112" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="132" text-anchor="middle" font-size="12" fill="#333">11</text>

  <!-- ===== Row 3: missing count ===== -->
  <text x="40" y="176" font-size="11" fill="#d6a040" font-weight="bold" text-anchor="end">缺失数</text>
  <rect x="70" y="160" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="180" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="135" y="160" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="180" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="200" y="160" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="180" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="265" y="160" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="180" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="330" y="160" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>

  <!-- arrows from ideal to actual showing gaps -->
  <text x="270" y="212" text-anchor="middle" font-size="10" fill="#888">缺失数 = arr[i] − (i+1)：2−1=1, 3−2=1, 4−3=1, 7−4=3, 11−5=6</text>

  <!-- ===== Missing numbers sequence ===== -->
  <text x="40" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">缺失正整数序列：</text>
  <rect x="60" y="258" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="274" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="258" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="118" y="274" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="140" y="258" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="158" y="274" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="180" y="258" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="198" y="274" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="220" y="258" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="238" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <rect x="260" y="258" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="274" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="306" y="274" font-size="11" fill="#aaa">...</text>

  <!-- k=5 pointer to 9 -->
  <text x="238" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 第 k=5 个</text>

  <!-- ===== Key formula box ===== -->
  <rect x="40" y="318" width="460" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">二分找首个 i 使 arr[i] − (i+1) ≥ k，答案 = k + i</text>
  <text x="270" y="358" text-anchor="middle" font-size="10.5" fill="#555">i=4 时缺失数 6 ≥ 5 → ans = 5 + 4 = 9 ✓</text>
  <text x="270" y="374" text-anchor="middle" font-size="10.5" fill="#555">若全不满足 → ans = k + n（缺失在数组末尾之后）</text>
</svg>
