<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abc", shifts = [3, 5, 9]  →  "rpl"</text>

  <!-- Direction hint -->
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">从右向左滚动累加 suffix（红色 = 当前累加位）</text>

  <!-- Table header -->
  <rect x="60" y="64" width="90" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="86" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">下标 i</text>
  <rect x="150" y="64" width="90" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="86" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">s[i]</text>
  <rect x="240" y="64" width="110" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="86" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">shifts[i]</text>
  <rect x="350" y="64" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="86" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">suffix(累加)</text>
  <rect x="460" y="64" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果</text>

  <!-- Row i=2 (processed first) -->
  <rect x="60" y="102" width="90" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="128" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">2</text>
  <rect x="150" y="102" width="90" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="128" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">c</text>
  <rect x="240" y="102" width="110" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="295" y="128" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">9</text>
  <rect x="350" y="102" width="110" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="124" text-anchor="middle" font-size="11" fill="#b85450">0+9=</text>
  <text x="405" y="139" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">9</text>
  <rect x="460" y="102" width="80" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">l</text>

  <!-- Up arrow i=2 -> i=1 -->
  <path d="M 405 102 L 405 96 L 405 96" stroke="#b85450" stroke-width="1.5" fill="none"/>
  <text x="405" y="98" text-anchor="middle" font-size="9" fill="#b85450"></text>

  <!-- Row i=1 -->
  <rect x="60" y="156" width="90" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="182" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">1</text>
  <rect x="150" y="156" width="90" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="182" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">b</text>
  <rect x="240" y="156" width="110" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="295" y="182" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">5</text>
  <rect x="350" y="156" width="110" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="178" text-anchor="middle" font-size="11" fill="#b85450">9+5=</text>
  <text x="405" y="193" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">14</text>
  <rect x="460" y="156" width="80" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">p</text>

  <!-- Row i=0 -->
  <rect x="60" y="210" width="90" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="236" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">0</text>
  <rect x="150" y="210" width="90" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="236" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">a</text>
  <rect x="240" y="210" width="110" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="295" y="236" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">3</text>
  <rect x="350" y="210" width="110" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="232" text-anchor="middle" font-size="11" fill="#b85450">14+3=</text>
  <text x="405" y="247" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">17</text>
  <rect x="460" y="210" width="80" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="236" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">r</text>

  <!-- Right-to-left processing arrow on the left side -->
  <path d="M 105 144 L 105 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 105 198 L 105 204" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(-90 40 180)">处理顺序 ↓</text>

  <!-- Char shift detail -->
  <rect x="60" y="276" width="480" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">字符移位细节（mod 26 环绕）</text>
  <text x="300" y="322" text-anchor="middle" font-size="11" fill="#555">i=2: c(2) + 9 = 11 → 'l'     i=1: b(1) + 14 = 15 → 'p'     i=0: a(0) + 17 = 17 → 'r'</text>
  <text x="300" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果："rpl"（与示例一致 ✓）</text>
</svg>
