<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：回文只由前一半决定，后半只是影子</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">n = 7：自由位只有 h = ⌈n/2⌉ = 4 个（蓝），右边 3 格由镜像自动确定（绿虚线）</text>

  <!-- 镜像对的弧线 -->
  <path d="M 92 110 Q 260 8 428 110" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 148 110 Q 260 30 372 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 204 110 Q 260 52 316 110" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">d₁ 对</text>
  <text x="260" y="66" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">d₂ 对</text>
  <text x="260" y="77" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">d₃ 对</text>

  <!-- 7 个数位格子 -->
  <rect x="68" y="110" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="135" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">d₁</text>
  <rect x="124" y="110" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="135" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">d₂</text>
  <rect x="180" y="110" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="204" y="135" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">d₃</text>
  <rect x="236" y="110" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="13" fill="#a07830" filter="url(#rough2)">m</text>
  <rect x="292" y="110" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="316" y="135" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">d₃</text>
  <rect x="348" y="110" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="372" y="135" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">d₂</text>
  <rect x="404" y="110" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="428" y="135" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">d₁</text>

  <!-- 位值标注 -->
  <text x="92" y="163" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10⁶</text>
  <text x="148" y="163" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10⁵</text>
  <text x="204" y="163" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10⁴</text>
  <text x="260" y="163" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10³</text>
  <text x="316" y="163" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10²</text>
  <text x="372" y="163" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10¹</text>
  <text x="428" y="163" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">10⁰</text>

  <text x="176" y="176" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">← 自由位（决定一切）</text>
  <text x="388" y="176" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">镜像（白送）</text>

  <!-- 左：镜像对 → 合并系数 -->
  <text x="34" y="198" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">镜像对 → 合并成一个模 k 系数</text>
  <rect x="34" y="212" width="10" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="221" font-size="9" fill="#33506b" filter="url(#rough2)">d₁ 对：位值 10⁶ 和 10⁰ → w = (10⁶+10⁰) mod k</text>
  <rect x="34" y="236" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="245" font-size="9" fill="#2f5d24" filter="url(#rough2)">d₂ 对：位值 10⁵ 和 10¹ → w = (10⁵+10¹) mod k</text>
  <rect x="34" y="260" width="10" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="269" font-size="9" fill="#a07830" filter="url(#rough2)">d₃ 对：位值 10⁴ 和 10² → w = (10⁴+10²) mod k</text>
  <rect x="34" y="284" width="10" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="293" font-size="9" fill="#8c3a36" filter="url(#rough2)">中间位 m：只出现一次 → w = 10³ mod k</text>

  <!-- 右：自由位要点 -->
  <rect x="282" y="186" width="223" height="116" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="206" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">自由位只有 4 个</text>
  <text x="393" y="226" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">贪心只需定 d₁ d₂ d₃ m（各 0..9，首位 ≥ 1）</text>
  <text x="393" y="244" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">x mod k = 各位贡献 d·w 之和（按位独立）</text>
  <text x="393" y="262" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">系数 w 只看位置，与选什么数字无关</text>
  <text x="393" y="280" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">余数只有 k ≤ 9 种 → bitmask 可行性 DP</text>

  <!-- 底部结论 -->
  <rect x="30" y="314" width="460" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">贪心骨架：从左往右每位取「仍能补全成 k 的倍数」的最大数字</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">可行性 = 后缀集合 suf[i]：用第 i..h−1 个自由位能凑出的余数（k 位 bitmask）</text>
</svg>
