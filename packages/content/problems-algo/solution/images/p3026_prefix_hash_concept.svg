<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：条件只锁首尾——枚举右端点 j，左端点的值只能是 x ± k</text>

  <!-- array -->
  <rect x="45" y="48" width="50" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="70" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="100" y="48" width="50" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="125" y="70" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="155" y="48" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="70" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="210" y="48" width="50" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="235" y="70" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="265" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- index labels -->
  <text x="70" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="125" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="180" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="235" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="290" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- i / j annotations -->
  <path d="M 180 126 L 180 106" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="168" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i：值 2 = x − k ✓</text>
  <path d="M 290 126 L 290 106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="352" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j：x = 5（右端点）</text>

  <!-- k note -->
  <text x="180" y="164" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">k = 3 ⇒ 左端点值 ∈ {x−k, x+k} = {2, 8}</text>

  <!-- formula box -->
  <rect x="30" y="184" width="290" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="175" y="205" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">sum(i..j) = prefix[j+1] − prefix[i]</text>
  <text x="175" y="224" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">固定 j ⇒ 和最大 ⇔ prefix[i] 最小</text>

  <!-- hash table -->
  <text x="448" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">min_prefix：值 → 最小前缀和</text>
  <rect x="360" y="68" width="176" height="104" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <line x1="360" y1="94" x2="536" y2="94" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="400" y="86" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值</text>
  <text x="484" y="86" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最小前缀和</text>
  <text x="400" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="484" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="400" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="484" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="364" y="144" width="168" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="400" y="159" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="484" y="159" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="448" y="190" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">查 x+k = 8：无此键 ✗</text>

  <!-- query arrow from box j to row 2->2 -->
  <path d="M 318 62 C 340 66, 344 100, 362 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="336" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">查 x−k=2 ✓</text>

  <!-- computation box -->
  <rect x="30" y="252" width="500" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">固定 j = 4：候选和 = prefix[5] − min_prefix[2] = 13 − 2 = 11</text>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">对应子数组 nums[2..4] = [2, 4, 5]，|2 − 5| = 3 = k ✓</text>

  <!-- note -->
  <rect x="30" y="322" width="500" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 值 2 若出现多次，取「前缀和最小」的一次——中间可能有负数，</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最左出现的前缀和不一定最小（与 525 存最早下标求最长恰好镜像）</text>
</svg>
