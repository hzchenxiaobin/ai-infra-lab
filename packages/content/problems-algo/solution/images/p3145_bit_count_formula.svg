<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">c(n, i)：[1, n] 中第 i 位为 1 的数字个数</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">第 i 位沿 x = 0, 1, 2, … 周期变化，周期 2^(i+1)，每周期后 2^i 个为 1（图中 i = 2）</text>

  <!-- 16 个格子：x = 0..15，第 2 位为 1 的填蓝 -->
  <rect x="30" y="58" width="27" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="43.5" y="78" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="57" y="58" width="27" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70.5" y="78" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="84" y="58" width="27" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97.5" y="78" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="111" y="58" width="27" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124.5" y="78" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>
  <rect x="138" y="58" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="151.5" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="165" y="58" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178.5" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="192" y="58" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205.5" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="219" y="58" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232.5" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="246" y="58" width="27" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259.5" y="78" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">8</text>
  <rect x="273" y="58" width="27" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286.5" y="78" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">9</text>
  <rect x="300" y="58" width="27" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313.5" y="78" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">10</text>
  <rect x="327" y="58" width="27" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340.5" y="78" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">11</text>
  <rect x="354" y="58" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="367.5" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <rect x="381" y="58" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="394.5" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">13</text>
  <rect x="408" y="58" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="421.5" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">14</text>
  <rect x="435" y="58" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="448.5" y="78" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">15</text>

  <!-- 周期括号 -->
  <path d="M 30 96 L 246 96" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 30 92 L 30 100" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 246 92 L 246 100" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="138" y="114" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">周期 2^(i+1) = 8</text>
  <path d="M 246 96 L 462 96" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 462 92 L 462 100" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="354" y="114" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">周期 2^(i+1) = 8</text>
  <text x="260" y="132" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">蓝格＝第 i 位为 1（每周期后半 2^i = 4 个）</text>

  <!-- 公式框 -->
  <rect x="25" y="142" width="470" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">c(n, i) = ⌊n / 2^(i+1)⌋ × 2^i + max(0, n mod 2^(i+1) − 2^i + 1)</text>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">完整周期数 × 每周期 2^i 个 ＋ 尾部零头（落在周期后半段才算）</text>

  <!-- 例子框 -->
  <rect x="25" y="214" width="470" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">例：n = 13, i = 2：⌊13/8⌋×4 = 4 个（4,5,6,7）＋ 尾巴 13 mod 8 = 5 → 5−4+1 = 2 个（12,13）</text>
  <text x="260" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">c(13, 2) = 4 + 2 = 6 ✓</text>

  <text x="260" y="292" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">f(n) = Σ c(n,i)　→　1..n 的强数组元素总个数（popcount 之和）</text>
  <text x="260" y="316" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">g(n) = Σ i×c(n,i)　→　1..n 的指数总和（置位位置加权和）</text>
</svg>
