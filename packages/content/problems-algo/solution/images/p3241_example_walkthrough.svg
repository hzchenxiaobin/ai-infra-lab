<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3 演算：w = [2,1,2,1,2]，以 0 为根</text>

  <line x1="105" y1="80" x2="58" y2="165" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="105" y1="80" x2="160" y2="165" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="160" y1="165" x2="112" y2="250" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="160" y1="165" x2="210" y2="250" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>

  <line x1="58" y1="165" x2="105" y2="80" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="105" y1="80" x2="160" y2="165" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="160" y1="165" x2="210" y2="250" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <text x="68" y="116" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="142" y="116" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="122" y="204" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="196" y="204" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>

  <circle cx="105" cy="80" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="105" y="85" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="105" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">down=4</text>
  <text x="128" y="84" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">up=0</text>
  <text x="105" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w=2</text>

  <circle cx="58" cy="165" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="58" y="170" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="84" y="162" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">up=6</text>
  <text x="58" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w=1</text>

  <circle cx="160" cy="165" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="170" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="184" y="162" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">up=3</text>
  <text x="196" y="186" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">down=2</text>
  <text x="160" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w=2</text>

  <circle cx="112" cy="250" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="255" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="132" y="252" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">up=5</text>
  <text x="112" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w=1</text>

  <circle cx="210" cy="250" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="255" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="230" y="252" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">up=5</text>
  <text x="210" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w=2</text>

  <rect x="272" y="62" width="234" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="273" y="91" width="232" height="29" fill="#fce4ec" filter="url(#rough2)"/>

  <line x1="272" y1="90" x2="506" y2="90" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="272" y1="120" x2="506" y2="120" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="272" y1="150" x2="506" y2="150" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="272" y1="180" x2="506" y2="180" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="272" y1="210" x2="506" y2="210" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="272" y1="240" x2="506" y2="240" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="314" y1="62" x2="314" y2="240" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="354" y1="62" x2="354" y2="240" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="398" y1="62" x2="398" y2="240" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="444" y1="62" x2="444" y2="240" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="293" y="81" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">节点</text>
  <text x="334" y="81" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">w</text>
  <text x="376" y="81" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">down</text>
  <text x="421" y="81" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">up</text>
  <text x="475" y="81" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">times</text>

  <text x="293" y="109" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="334" y="109" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="376" y="109" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="421" y="109" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="475" y="109" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="293" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="334" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="376" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="421" y="139" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="475" y="139" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="293" y="169" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="334" y="169" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="376" y="169" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="421" y="169" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="475" y="169" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="293" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="334" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="376" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="421" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="475" y="199" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="293" y="229" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="334" y="229" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="376" y="229" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="421" y="229" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="475" y="229" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="30" y="296" font-size="10.5" fill="#888" filter="url(#rough2)">边旁数字 = w(孩子) + down[孩子]；红虚线 = up[1] 的路径</text>
  <text x="30" y="312" font-size="10.5" fill="#b85450" filter="url(#rough2)">up[1] = w(0) + w(2) + w(4) = 2 + 2 + 2 = 6</text>

  <rect x="170" y="320" width="330" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="335" y="343" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">times = max(down, up) → 输出 [4, 6, 3, 5, 5] ✓</text>
</svg>
