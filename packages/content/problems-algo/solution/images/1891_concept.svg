<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：绳长 L 越大 → 可得绳数 count(L) 越小（单调递减）</text>

  <!-- ===== Ribbons cutting section ===== -->
  <text x="40" y="52" font-size="12" fill="#888">绳子切割 (L=5, ribbons=[9,7,5], k=3):</text>

  <!-- Ribbon 1: length 9, cut at 5 -> [5, 4] -->
  <text x="68" y="80" text-anchor="end" font-size="10" fill="#666">r=9</text>
  <rect x="80" y="66" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="81" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="180" y="66" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="81" text-anchor="middle" font-size="10" fill="#aaa">4 (丢弃)</text>
  <line x1="180" y1="62" x2="180" y2="92" stroke="#b85450" stroke-width="1.5" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="268" y="80" font-size="10" fill="#4a7a3a">→ 1 条</text>

  <!-- Ribbon 2: length 7, cut at 5 -> [5, 2] -->
  <text x="68" y="110" text-anchor="end" font-size="10" fill="#666">r=7</text>
  <rect x="80" y="96" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="111" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="180" y="96" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="111" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <line x1="180" y1="92" x2="180" y2="122" stroke="#b85450" stroke-width="1.5" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="228" y="110" font-size="10" fill="#4a7a3a">→ 1 条</text>

  <!-- Ribbon 3: length 5, no cut -> [5] -->
  <text x="68" y="140" text-anchor="end" font-size="10" fill="#666">r=5</text>
  <rect x="80" y="126" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="186" y="140" font-size="10" fill="#4a7a3a">→ 1 条</text>

  <!-- count formula box -->
  <rect x="300" y="64" width="232" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="416" y="86" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">count(L) = Σ ribbons[i] ÷ L</text>
  <text x="416" y="106" text-anchor="middle" font-size="11" fill="#555">= 9÷5 + 7÷5 + 5÷5</text>
  <text x="416" y="124" text-anchor="middle" font-size="11" fill="#555">= 1 + 1 + 1 = 3</text>
  <text x="416" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">≥ k = 3  ✓ 可行</text>

  <!-- arrow down -->
  <path d="M 280 156 L 280 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="170" font-size="11" fill="#888">count(L) 单调递减</text>

  <!-- ===== Monotonic curve ===== -->
  <line x1="90" y1="190" x2="90" y2="380" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="380" x2="420" y2="380" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="196" text-anchor="end" font-size="10" fill="#888">count</text>
  <text x="424" y="384" font-size="10" fill="#888">L →</text>
  <text x="84" y="384" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- decreasing curve -->
  <path d="M 90 205 C 130 215 180 250 260 300 S 360 360 420 370" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="140" y="204" font-size="11" fill="#446688" font-weight="bold">L ↑ ⇒ count ↓</text>

  <!-- k threshold line -->
  <line x1="90" y1="280" x2="420" y2="280" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="424" y="284" font-size="11" fill="#b85450" font-weight="bold">k = 3</text>

  <!-- answer point at L=5, count=3 -->
  <circle cx="170" cy="280" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="170" y1="280" x2="170" y2="380" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="170" y="396" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">L* = 5</text>

  <!-- feasible / infeasible labels -->
  <text x="105" y="270" font-size="10" fill="#4a7a3a">可行 ✓</text>
  <text x="320" y="270" font-size="10" fill="#b85450">不够 ✗</text>

  <!-- search direction arrow: search right for max -->
  <path d="M 100 296 L 155 296" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="310" font-size="10" fill="#4a7a3a" font-weight="bold">找最大可行 →</text>

  <!-- right summary note -->
  <rect x="436" y="200" width="114" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="493" y="224" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="493" y="246" text-anchor="middle" font-size="11" fill="#666">L ∈ [1, max]</text>
  <text x="493" y="268" text-anchor="middle" font-size="11" fill="#666">求最大 L</text>
  <text x="493" y="286" text-anchor="middle" font-size="11" fill="#666">使 count ≥ k</text>
  <text x="493" y="312" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">找右端点</text>
  <text x="493" y="330" text-anchor="middle" font-size="10" fill="#999">(1011: 找左端点)</text>
  <text x="493" y="350" text-anchor="middle" font-size="10" fill="#999">镜像方向！</text>
</svg>
