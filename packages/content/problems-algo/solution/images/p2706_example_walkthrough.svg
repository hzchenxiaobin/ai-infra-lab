<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2706w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两块最便宜的花费 vs money</text>

  <!-- Example 1 -->
  <text x="60" y="64" font-size="13" fill="#446688" font-weight="bold">示例 1：prices = [1,2,2], money = 3</text>

  <text x="60" y="92" font-size="11" fill="#888" font-weight="bold">扫描维护 m1, m2：</text>

  <rect x="60" y="104" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="85" y="126" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="120" y="126" font-size="10" fill="#4a7a3a">m1=1, m2=+∞ → m1=1, m2=+∞</text>

  <rect x="60" y="146" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="85" y="168" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="120" y="168" font-size="10" fill="#4a7a3a">p≥m1, p&lt;m2 → m2=2</text>

  <rect x="60" y="188" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="85" y="210" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="120" y="210" font-size="10" fill="#888">不更新</text>

  <rect x="60" y="232" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="220" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cost = 1+2 = 3 ≤ 3 ⇒ 返回 3−3 = 0</text>

  <path d="M220,266 L220,288" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2706w)" filter="url(#rough2)"/>

  <!-- Example 2 -->
  <text x="60" y="316" font-size="13" fill="#446688" font-weight="bold">示例 2：prices = [3,2,3], money = 3</text>

  <rect x="60" y="328" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="85" y="350" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="120" y="350" font-size="10" fill="#4a7a3a">m1=3, m2=+∞</text>

  <rect x="60" y="366" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="85" y="388" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <text x="120" y="388" font-size="10" fill="#4a7a3a">p&lt;m1 ⇒ m2=3, m1=2</text>

  <text x="430" y="316" font-size="11" fill="#888">（3 不更新）</text>
  <text x="430" y="350" font-size="11" fill="#888">cost = 2+3 = 5</text>

  <rect x="300" y="372" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5 &gt; 3 ⇒ 返回 money = 3</text>
</svg>
