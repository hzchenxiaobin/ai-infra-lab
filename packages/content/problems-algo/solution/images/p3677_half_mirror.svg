<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：前一半「复印」出后一半 —— 每种长度恰有 2^(h−1) 个回文</text>

  <!-- 镜像弧线：bit0↔bit6, bit1↔bit5, bit2↔bit4 -->
  <path d="M 60 104 C 88 38, 320 38, 348 104" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 108 104 C 132 56, 276 56, 300 104" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 156 104 C 172 72, 236 72, 252 104" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="204" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">镜像反转</text>

  <!-- 7 个比特格子：1 0 1 1 | 1 0 1（L=7, h=4 的回文 1011101） -->
  <rect x="40" y="110" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="136" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="88" y="110" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="136" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>

  <rect x="136" y="110" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="136" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="184" y="110" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="136" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="232" y="110" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="136" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="280" y="110" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>

  <rect x="328" y="110" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="136" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <!-- 分组标签 -->
  <text x="132" y="176" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">前一半 h = ⌈L/2⌉ 位（信息源）</text>
  <text x="300" y="176" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后一半（被复印）</text>

  <text x="204" y="202" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ 首位必须为 1（除 0 外无前导零）⇒ 自由位恰 h−1 个</text>

  <!-- 右侧公式面板 -->
  <rect x="400" y="94" width="148" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="474" y="118" text-anchor="middle" font-size="12.5" fill="#b3541e" filter="url(#rough2)">长度 L 的回文总数</text>
  <text x="474" y="144" text-anchor="middle" font-size="15" fill="#b3541e" font-weight="bold" filter="url(#rough2)">2^(h−1)</text>
  <text x="474" y="168" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">首位钉死 1 ⇒ 自由位 h−1</text>

  <!-- 底部长度-个数对照表 -->
  <text x="280" y="232" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">各种长度的回文个数（L = 二进制位数）</text>

  <rect x="84" y="242" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">长度 L</text>
  <rect x="84" y="272" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">回文个数</text>

  <rect x="164" y="242" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="208" y="242" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="252" y="242" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="296" y="242" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="340" y="242" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="384" y="242" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="428" y="242" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="472" y="242" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="492" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>

  <rect x="164" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="290" text-anchor="middle" font-size="11.5" fill="#b3541e" filter="url(#rough2)">1</text>
  <rect x="208" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="290" text-anchor="middle" font-size="11.5" fill="#b3541e" filter="url(#rough2)">1</text>
  <rect x="252" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="290" text-anchor="middle" font-size="11.5" fill="#b3541e" filter="url(#rough2)">2</text>
  <rect x="296" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="290" text-anchor="middle" font-size="11.5" fill="#b3541e" filter="url(#rough2)">2</text>
  <rect x="340" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="290" text-anchor="middle" font-size="11.5" fill="#b3541e" filter="url(#rough2)">4</text>
  <rect x="384" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="290" text-anchor="middle" font-size="11.5" fill="#b3541e" filter="url(#rough2)">4</text>
  <rect x="428" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="448" y="290" text-anchor="middle" font-size="11.5" fill="#b3541e" filter="url(#rough2)">8</text>
  <rect x="472" y="272" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="492" y="290" text-anchor="middle" font-size="11.5" fill="#b3541e" filter="url(#rough2)">8</text>

  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">位数少 ⇒ 值更小：长度 &lt; L 的回文统统 &lt; n，按公式整批收入</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（k = 0 单独记 1；50 位以内的回文共 2^26 − 1 个）</text>
</svg>
