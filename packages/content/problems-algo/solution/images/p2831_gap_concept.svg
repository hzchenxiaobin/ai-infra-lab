<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 385" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="385" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：等值段 ↔ 下标表上的窗口</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">删除代价 = 跨度 − 个数，以 nums = [1,3,2,3,1,3]，x = 3 为例</text>

  <text x="302" y="66" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">窗口 [p₀, p₂] = [1, 5]，长度 p₂ − p₀ + 1 = 5</text>

  <!-- array cells -->
  <rect x="120" y="72" width="52" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="97" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="172" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="224" y="72" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="276" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="328" y="72" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="72" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- delete crosses on cells idx 2 and 4 -->
  <path d="M 234 76 L 266 108" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 266 76 L 234 108" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 338 76 L 370 108" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 370 76 L 338 108" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- index labels -->
  <text x="146" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="198" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="250" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="302" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="354" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="406" y="128" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- notes under cells -->
  <text x="146" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">窗口外·不删</text>
  <text x="250" y="146" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">异值·删</text>
  <text x="302" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 个 3 全保留</text>
  <text x="354" y="146" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">异值·删</text>

  <!-- window dashed rect over cells 1..5 -->
  <rect x="166" y="68" width="270" height="48" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>

  <!-- pos list -->
  <text x="310" y="176" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 3 的下标表 pos[3] = [1, 3, 5]</text>

  <rect x="200" y="184" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="232" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p₀ = 1</text>
  <rect x="300" y="184" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="332" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p₁ = 3</text>
  <rect x="400" y="184" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="432" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p₂ = 5</text>

  <!-- i / j pointers -->
  <path d="M 232 240 L 232 224" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="232" y="254" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M 432 240 L 432 224" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="432" y="254" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j</text>

  <!-- formula box -->
  <rect x="90" y="264" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="285" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">删除代价 = (p[j] − p[i]) − (j − i) = (5 − 1) − 2 = 2 ≤ k</text>
  <text x="310" y="304" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">保留长度 = j − i + 1 = 3，删掉 2 个异值后 3 个 3 连成等值段</text>

  <!-- conclusion -->
  <rect x="70" y="326" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="346" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">每个值独立做一遍双指针滑窗</text>
  <text x="310" y="364" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">代价 ≤ k 时最大化 j − i + 1，所有值取最大即为答案</text>
</svg>
