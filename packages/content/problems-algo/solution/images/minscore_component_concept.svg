<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：可绕路 → 答案 = 城市1所在连通块的最小边权</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">路径可重复经过边/点，故 1 连通块内任意边都能被纳入 1→n 路径</text>

  <!-- ===== Left connected component (contains 1 and n) ===== -->
  <text x="40" y="78" font-size="11" fill="#446688" font-weight="bold">城市1的连通块</text>

  <!-- edges -->
  <!-- 1-2 weight 9 -->
  <path d="M 110 175 L 180 120" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="128" y="132" width="22" height="16" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="139" y="144" text-anchor="middle" font-size="11" fill="#666">9</text>

  <!-- 2-3 weight 6 -->
  <path d="M 200 128 L 200 218" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="207" y="165" width="22" height="16" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="218" y="177" text-anchor="middle" font-size="11" fill="#666">6</text>

  <!-- 2-n weight 5  (MIN -> red) -->
  <path d="M 200 120 L 295 170" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <rect x="238" y="138" width="22" height="16" fill="#fff8e1" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="249" y="150" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">5</text>

  <!-- 1-n weight 7 -->
  <path d="M 115 188 L 290 180" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="192" y="194" width="22" height="16" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="203" y="206" text-anchor="middle" font-size="11" fill="#666">7</text>

  <!-- nodes -->
  <!-- node 1 -->
  <ellipse cx="100" cy="180" rx="18" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- node 2 -->
  <ellipse cx="200" cy="112" rx="17" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="117" text-anchor="middle" font-size="13" fill="#333">2</text>
  <!-- node 3 -->
  <ellipse cx="200" cy="228" rx="17" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="233" text-anchor="middle" font-size="13" fill="#333">3</text>
  <!-- node n -->
  <ellipse cx="305" cy="180" rx="18" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="305" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n</text>

  <!-- min edge annotation -->
  <path d="M 250 110 L 250 86" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="82" font-size="10.5" fill="#b85450" font-weight="bold">最小边权 = 5 → 即答案</text>

  <!-- ===== Right disconnected component ===== -->
  <text x="392" y="78" font-size="11" fill="#999" font-weight="bold">不连通的分量</text>
  <path d="M 415 100 L 470 150" stroke="#bbb" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <ellipse cx="408" cy="98" rx="16" ry="16" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="103" text-anchor="middle" font-size="12" fill="#999">5</text>
  <ellipse cx="478" cy="156" rx="16" ry="16" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="161" text-anchor="middle" font-size="12" fill="#999">6</text>
  <text x="463" y="118" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="445" y="186" text-anchor="middle" font-size="10" fill="#aaa">与1不连通 → 无关</text>

  <!-- ===== Insight box ===== -->
  <rect x="30" y="258" width="460" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="280" font-size="11.5" fill="#333" font-weight="bold">为什么答案 = 连通块最小边权？</text>
  <text x="48" y="300" font-size="10.5" fill="#555">下界：1→n 任一路径只走连通块内的边，其分数(最小边) ≥ 连通块最小边权</text>
  <text x="48" y="318" font-size="10.5" fill="#555">上界：取最小边 e*，先从1走到 e* 一端 → 过 e* → 再走到 n，分数恰 = e* 权</text>
  <text x="48" y="336" font-size="10.5" fill="#b85450" font-weight="bold">→ 二者夹逼，答案 = 城市1连通块的最小边权</text>
</svg>
