<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="384" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">路径在 LCA 处拆两段：一次比较定位中位</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">带权中位 = 路径上第一个 2·dist(u,x) ≥ tot 的节点（图示为示例 3 的查询 [3,4]）</text>

  <!-- 路径节点标签 -->
  <text x="70" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">u</text>
  <text x="260" y="74" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">l = LCA</text>
  <text x="440" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">v</text>
  <text x="350" y="74" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ans ✓</text>

  <!-- 路径的边 -->
  <line x1="86" y1="102" x2="144" y2="102" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="176" y1="102" x2="244" y2="102" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="276" y1="102" x2="334" y2="102" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="366" y1="102" x2="424" y2="102" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="94" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">w=1</text>
  <text x="210" y="94" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">w=2</text>
  <text x="305" y="94" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">w=5</text>
  <text x="395" y="94" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">w=3</text>

  <!-- 路径节点 -->
  <circle cx="70" cy="102" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="160" cy="102" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="260" cy="102" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="350" cy="102" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="350" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="440" cy="102" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- 两段距离括线 -->
  <path d="M 54 126 L 54 132 L 266 132 L 266 126" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="147" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">d(u→l) = 3</text>
  <path d="M 254 126 L 254 132 L 456 132 L 456 126" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="147" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">d(l→v) = 8</text>

  <!-- 判定框 -->
  <rect x="168" y="160" width="184" height="42" rx="8" fill="#ffffff" stroke="#555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2·d(u→l) ≥ tot ?</text>
  <text x="260" y="195" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">本例：6 ≥ 11 ✗</text>

  <!-- 分支箭头 -->
  <path d="M 222 202 Q 160 210 142 224" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="210" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>
  <path d="M 298 202 Q 360 210 378 224" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="210" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 左分支：u→l 段 -->
  <rect x="30" y="226" width="224" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="246" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">中位在 u→l 段（含 l）</text>
  <text x="142" y="264" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">从 u 起跳，找最后一个 y</text>
  <text x="142" y="280" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">满足 2·dist(u,y) &lt; tot</text>
  <text x="142" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">ans = parent(y)</text>

  <!-- 右分支：l→v 段 -->
  <rect x="266" y="226" width="224" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="246" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">中位在 l→v 段（含 v）</text>
  <text x="378" y="264" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">从 v 起跳，找最后一个 y</text>
  <text x="378" y="280" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">满足 2·dist(v,y) ≤ tot</text>
  <text x="378" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">ans = y 本身</text>

  <!-- 本例演算 -->
  <rect x="30" y="336" width="460" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本例 tot = 11，2·d(u→l) = 6 &lt; 11 → 右支：从 v=4 上跳</text>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dist(4→2)=3，2·3=6 ≤ 11 ✓ 再上 dist(4→0)=8，16 &gt; 11 ✗ → ans = 2</text>
</svg>
