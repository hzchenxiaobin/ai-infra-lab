<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：ghiabcdefhelloadamhelloabcdefghi → 7</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每次剥掉最短前后匹配块，逐层向内</text>

  <!-- Final decomposition row: ghi | abcdef | hello | adam | hello | abcdef | ghi -->
  <g font-size="12">
    <rect x="49" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="73" y="86" text-anchor="middle" fill="#446688" font-weight="bold">ghi</text>

    <rect x="101" y="66" width="78" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="140" y="86" text-anchor="middle" fill="#4a7a3a" font-weight="bold">abcdef</text>

    <rect x="183" y="66" width="66" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="216" y="86" text-anchor="middle" fill="#d6a040" font-weight="bold">hello</text>

    <rect x="253" y="66" width="54" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="280" y="86" text-anchor="middle" fill="#b85450" font-weight="bold">adam</text>

    <rect x="311" y="66" width="66" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="344" y="86" text-anchor="middle" fill="#d6a040" font-weight="bold">hello</text>

    <rect x="381" y="66" width="78" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="420" y="86" text-anchor="middle" fill="#4a7a3a" font-weight="bold">abcdef</text>

    <rect x="463" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="487" y="86" text-anchor="middle" fill="#446688" font-weight="bold">ghi</text>
  </g>

  <!-- match brackets per step -->
  <path d="M 49 106 L 49 112 L 511 112 L 511 106" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="9" fill="#446688">第 1 步：最短前后匹配 "ghi"（l=1,2 失败，l=3 命中）→ ans=2</text>

  <path d="M 101 134 L 101 140 L 459 140 L 459 134" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="9" fill="#4a7a3a">第 2 步：内层最短匹配 "abcdef"（l=1..5 失败，l=6 命中）→ ans=4</text>

  <path d="M 183 162 L 183 168 L 377 168 L 377 162" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="9" fill="#d6a040">第 3 步：再内层最短匹配 "hello"（l=1..4 失败，l=5 命中）→ ans=6</text>

  <path d="M 253 190 L 253 196 L 307 196 L 307 190" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="9" fill="#b85450">第 4 步：剩 "adam"，无更短匹配 → 中间单段 ans=7 ✓</text>

  <!-- summary box -->
  <rect x="40" y="226" width="480" height="138" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="248" font-size="12" fill="#444" font-weight="bold">逐步剥层（每层剥一对最短前后匹配块）：</text>

  <text x="60" y="270" font-size="11" fill="#446688">① text = [ghi] + "abcdefhelloadamhelloabcdef" + [ghi]   → 剥 ghi，ans = 2</text>
  <text x="60" y="290" font-size="11" fill="#4a7a3a">② 中段 = [abcdef] + "helloadamhello" + [abcdef]        → 剥 abcdef，ans = 4</text>
  <text x="60" y="310" font-size="11" fill="#d6a040">③ 中段 = [hello] + "adam" + [hello]                  → 剥 hello，ans = 6</text>
  <text x="60" y="330" font-size="11" fill="#b85450">④ 中段 = "adam"（无更短匹配，整段作中心）            → ans = 7</text>

  <text x="60" y="354" font-size="11" fill="#4a7a3a" font-weight="bold">总段数 = 2 + 2 + 2 + 1 = 7（奇数段，正中 "adam" 为对称中心）</text>
</svg>
