<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建表 → 逐学生计分 → 排序键 (−score, id) → 取前 k</text>

  <!-- ① 建表 -->
  <rect x="160" y="36" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="11.5" fill="#333">① 建哈希表 word→Δ（pos:+3 / neg:−1）</text>

  <path d="M 270 66 L 270 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 取学生 -->
  <rect x="170" y="84" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="104" text-anchor="middle" font-size="11.5" fill="#333">② 取下一名学生 i；score←0</text>

  <path d="M 270 114 L 270 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 遍历单词计分 -->
  <rect x="140" y="132" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="152" text-anchor="middle" font-size="11.5" fill="#333">③ 遍历 report[i] 每个单词 word</text>
  <text x="270" y="170" text-anchor="middle" font-size="11.5" fill="#333">score += map[word]（默认 0，O(1)/词）</text>

  <path d="M 270 176 L 270 192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 记录 -->
  <rect x="170" y="194" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="214" text-anchor="middle" font-size="11.5" fill="#333">④ 记录 (score, student_id[i])</text>

  <path d="M 270 224 L 270 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定：还有学生? -->
  <polygon points="270,240 370,270 270,300 170,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">还有学生 i&lt;n?</text>

  <!-- 是 → 回到 ② -->
  <path d="M 170 270 L 90 270 L 90 99 L 170 99" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是，回 ②</text>

  <!-- 否 → 右侧排序 -->
  <path d="M 370 270 L 398 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="384" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- ⑤ 排序 -->
  <rect x="400" y="256" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="276" text-anchor="middle" font-size="11" fill="#333">⑤ 排序 (−score, id)</text>

  <path d="M 460 286 L 460 302" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ⑥ 取前 k -->
  <rect x="390" y="304" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="324" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">⑥ 取前 k 个 id 返回</text>

  <rect x="30" y="340" width="480" height="16" fill="none" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="270" y="352" text-anchor="middle" font-size="10" fill="#888">建表 O(P+N) + 计分 O(W) + 排序 O(n log n)；n≤10⁴ 排序即可，大规模可换 Top-K 堆</text>
</svg>
