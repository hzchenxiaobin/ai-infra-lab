<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：可行性检查 → 情形一整串直比 → 情形二 3720 匹配-回退贪心 → 镜像拼接</text>

  <rect x="30" y="32" width="180" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="52" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">① 统计 s 的频次 cnt[26]</text>
  <path d="M 120 64 L 120 74" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="25,108 120,76 215,108 120,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="102" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">奇数频次的字符</text>
  <text x="120" y="116" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">个数 &gt; 1 ？</text>
  <path d="M 218 108 L 326 108" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="245" y="102" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="330" y="92" width="152" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="406" y="112" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">返回 ""（无回文排列）</text>
  <path d="M 120 140 L 120 150" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="150" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="30" y="154" width="180" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="174" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">② half = cnt//2，mid = 奇字符</text>
  <path d="M 120 186 L 120 198" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="25,232 120,200 215,232 120,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="226" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">target[:h] 恰为</text>
  <text x="120" y="240" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">half 的排列？</text>
  <path d="M 218 232 L 345 232 L 345 256" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="226" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="292" y="226" font-size="9" fill="#8a6d1f" filter="url(#rough2)">（情形一）</text>

  <polygon points="250,290 345,260 440,290 345,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="284" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">整串比较：</text>
  <text x="345" y="298" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">t &gt; target ？</text>
  <path d="M 345 320 L 345 334" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="353" y="332" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="275" y="338" width="140" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="357" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">返回 t</text>

  <path d="M 250 290 L 160 290 L 160 310" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="284" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 120 264 L 120 310" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="284" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="30" y="314" width="200" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="332" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">③ 3720 贪心：沿前缀匹配到最远 m，</text>
  <text x="130" y="348" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">从 p = min(m, h−1) 向左回退找提升位</text>
  <path d="M 130 360 L 130 374" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="25,408 130,378 235,408 130,438" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="412" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">找到提升位 f ？</text>
  <path d="M 238 408 L 274 408" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="402" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="278" y="392" width="205" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="411" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">返回 f + mid + rev(f)</text>
  <path d="M 130 438 L 130 452" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="138" y="450" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="30" y="454" width="200" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="473" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">返回 ""</text>
</svg>
