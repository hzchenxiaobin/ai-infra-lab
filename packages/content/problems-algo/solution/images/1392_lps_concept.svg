<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最长快乐前缀：既是非空前缀又是后缀（不含自身）的最长子串</text>

  <!-- ====== Original string row ====== -->
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">s = "ababab"（n = 6）</text>
  <!-- 6 boxes w=40, start x=160 -->
  <rect x="160" y="68" width="40" height="38" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="68" width="40" height="38" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="240" y="68" width="40" height="38" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="280" y="68" width="40" height="38" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="320" y="68" width="40" height="38" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="360" y="68" width="40" height="38" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <!-- index labels -->
  <text x="180" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="220" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="260" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="300" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="340" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="380" y="120" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>

  <!-- divider -->
  <path d="M 40 138 L 520 138" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Prefix view ====== -->
  <text x="110" y="170" text-anchor="end" font-size="11.5" fill="#335" font-weight="bold">前缀视角</text>
  <text x="110" y="184" text-anchor="end" font-size="9.5" fill="#888">s[0:4]</text>
  <!-- boxes 0-3 blue, 4-5 gray -->
  <rect x="160" y="152" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="176" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">a</text>
  <rect x="200" y="152" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="176" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">b</text>
  <rect x="240" y="152" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">a</text>
  <rect x="280" y="152" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="176" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">b</text>
  <rect x="320" y="152" width="40" height="38" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="152" width="40" height="38" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <!-- brace label -->
  <text x="240" y="208" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">↑ 长度 4 的前缀 = "abab"</text>

  <!-- ====== Suffix view ====== -->
  <text x="110" y="244" text-anchor="end" font-size="11.5" fill="#3a5a2a" font-weight="bold">后缀视角</text>
  <text x="110" y="258" text-anchor="end" font-size="9.5" fill="#888">s[2:6]</text>
  <!-- boxes 0-1 gray, 2-5 green -->
  <rect x="160" y="226" width="40" height="38" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="226" width="40" height="38" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="226" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="280" y="226" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">b</text>
  <rect x="320" y="226" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="250" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="360" y="226" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="250" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">b</text>
  <text x="320" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">↑ 长度 4 的后缀 = "abab"</text>

  <!-- overlap note: positions 2,3 -->
  <text x="470" y="176" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">允许重叠</text>
  <text x="470" y="190" text-anchor="middle" font-size="9.5" fill="#a87020">下标 2,3 共用</text>

  <!-- arrows down to answer -->
  <path d="M 240 214 L 240 300" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 320 288 L 320 300" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ====== Answer box ====== -->
  <rect x="140" y="304" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="329" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">最长快乐前缀 = "abab"（长度 π[n−1] = 4）</text>

  <!-- Key insight box -->
  <rect x="40" y="354" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="11" fill="#666">「既是前缀又是后缀」正是 KMP 前缀函数 π 的定义：</text>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">π[i] = s[0..i] 的最长「真前缀 = 后缀」长度，答案即 s[0 : π[n−1]]</text>
</svg>
