<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：阈值 mid 越大 → 分数 ≤ mid 的个数 count(mid) 越多（单调递增）</text>

  <!-- ===== sorted fractions chips ===== -->
  <text x="30" y="52" font-size="12" fill="#888">arr = [1,2,3,5]，全部 6 个分数 arr[i]/arr[j]（i&lt;j）按值升序：</text>

  <!-- chip 1: 1/5 -->
  <rect x="40" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1/5</text>
  <text x="68" y="102" text-anchor="middle" font-size="9" fill="#999">(0,3) .2</text>

  <!-- chip 2: 1/3 -->
  <rect x="106" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1/3</text>
  <text x="134" y="102" text-anchor="middle" font-size="9" fill="#999">(0,2) .33</text>

  <!-- chip 3: 2/5  answer -->
  <rect x="172" y="64" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2/5</text>
  <text x="200" y="102" text-anchor="middle" font-size="9" fill="#999">(1,3) .4</text>

  <!-- chip 4: 1/2 -->
  <rect x="238" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1/2</text>
  <text x="266" y="102" text-anchor="middle" font-size="9" fill="#999">(0,1) .5</text>

  <!-- chip 5: 3/5 -->
  <rect x="304" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3/5</text>
  <text x="332" y="102" text-anchor="middle" font-size="9" fill="#999">(2,3) .6</text>

  <!-- chip 6: 2/3 -->
  <rect x="370" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2/3</text>
  <text x="398" y="102" text-anchor="middle" font-size="9" fill="#999">(1,2) .67</text>

  <text x="448" y="78" font-size="11" fill="#888">k = 3</text>
  <text x="448" y="96" font-size="11" fill="#d6a040" font-weight="bold">第3小 = 2/5</text>

  <!-- arrow down -->
  <path d="M 290 116 L 290 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="128" font-size="11" fill="#888">count(mid) 单调递增</text>

  <!-- ===== axes ===== -->
  <line x1="70" y1="150" x2="70" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="330" x2="450" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="156" text-anchor="end" font-size="10" fill="#888">count</text>
  <text x="454" y="334" font-size="10" fill="#888">mid →</text>
  <text x="64" y="334" text-anchor="end" font-size="9" fill="#999">0</text>
  <text x="64" y="259" text-anchor="end" font-size="9" fill="#aaa">3</text>
  <text x="64" y="184" text-anchor="end" font-size="9" fill="#aaa">6</text>

  <!-- x ticks: mid 0..1 mapped to x 90..430 -->
  <text x="90" y="346" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="158" y="346" text-anchor="middle" font-size="9" fill="#aaa">.2</text>
  <text x="226" y="346" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">.4</text>
  <text x="260" y="346" text-anchor="middle" font-size="9" fill="#aaa">.5</text>
  <text x="317" y="346" text-anchor="middle" font-size="9" fill="#aaa">.67</text>
  <text x="430" y="346" text-anchor="middle" font-size="9" fill="#aaa">1</text>

  <!-- step curve: count(mid) -->
  <path d="M 90 330 L 158 330 L 158 305 L 203 305 L 203 280 L 226 280 L 226 255 L 260 255 L 260 230 L 294 230 L 294 205 L 317 205 L 317 180 L 430 180" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="350" y="222" font-size="11" fill="#446688" font-weight="bold">mid ↑ ⇒ count ↑</text>

  <!-- k threshold line at count=3 (y=255) -->
  <line x1="70" y1="255" x2="450" y2="255" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="454" y="259" font-size="11" fill="#b85450" font-weight="bold">k = 3</text>

  <!-- answer point at mid=0.4 (count jumps to 3) -->
  <circle cx="226" cy="255" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="226" y1="255" x2="226" y2="330" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="226" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mid* = 0.4 = 2/5</text>

  <!-- feasible / infeasible labels -->
  <text x="100" y="250" font-size="10" fill="#b85450">count &lt; k ✗</text>
  <text x="330" y="250" font-size="10" fill="#4a7a3a">count ≥ k ✓</text>

  <!-- right summary note -->
  <rect x="448" y="150" width="120" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="508" y="174" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="508" y="196" text-anchor="middle" font-size="11" fill="#666">mid ∈ [0, 1]</text>
  <text x="508" y="216" text-anchor="middle" font-size="11" fill="#666">求最小的 mid</text>
  <text x="508" y="236" text-anchor="middle" font-size="11" fill="#666">使 count(mid) ≥ k</text>
  <text x="508" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>

  <!-- note about jump -->
  <rect x="70" y="372" width="440" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a">mid=0.4 时 count 从 2 跳到 3，恰好命中第 3 小；故判定用 count ≥ k 而非 == k</text>
</svg>
