<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    逐字符构建：每个前缀都必须在词典中
  </text>

  <text x="40" y="70" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓ world 可构建</text>

  <rect x="30" y="85" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="52" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">w</text>

  <rect x="86" y="85" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">wo</text>

  <rect x="156" y="85" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">wor</text>

  <rect x="232" y="85" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="267" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">worl</text>

  <rect x="314" y="85" width="82" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="107" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">world ✓</text>

  <path d="M74,102 L86,102" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M144,102 L156,102" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M220,102 L232,102" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M302,102 L314,102" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="52" y="135" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">∈dict</text>
  <text x="115" y="135" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">∈dict</text>
  <text x="188" y="135" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">∈dict</text>
  <text x="267" y="135" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">∈dict</text>
  <text x="355" y="135" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">最长 ✓</text>

  <line x1="20" y1="165" x2="540" y2="165" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="40" y="195" font-size="13" fill="#b85450" filter="url(#rough2)">✗ banana 不可构建</text>

  <rect x="30" y="210" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="55" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>

  <rect x="92" y="210" width="62" height="34" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="123" y="232" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">ba?</text>

  <rect x="166" y="210" width="78" height="34" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="205" y="232" text-anchor="middle" font-size="12" fill="#aaaaaa" filter="url(#rough2)">ban?</text>

  <path d="M80,227 L92,227" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M154,227 L166,227" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="55" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">∉dict ✗</text>
  <text x="123" y="258" text-anchor="middle" font-size="10" fill="#aaaaaa" filter="url(#rough2)">断裂</text>
  <text x="205" y="258" text-anchor="middle" font-size="10" fill="#aaaaaa" filter="url(#rough2)">断裂</text>

  <rect x="30" y="285" width="510" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="45" y="308" font-size="12" fill="#333" filter="url(#rough2)">规则：</text>
  <text x="45" y="328" font-size="11.5" fill="#555" filter="url(#rough2)">1. 从空串 "" 出发，每次加一个字符，每步的前缀必须存在于词典</text>
  <text x="45" y="346" font-size="11.5" fill="#555" filter="url(#rough2)">2. 多个等长候选 → 取字典序最小；无解 → 返回 ""</text>
</svg>
