<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：operations = ["--X","X++","X++"]</text>

  <!-- Step labels -->
  <text x="60" y="62" font-size="11" fill="#888">步骤</text>
  <text x="140" y="62" font-size="11" fill="#888">操作</text>
  <text x="250" y="62" font-size="11" fill="#888">符号判定</text>
  <text x="400" y="62" font-size="11" fill="#888">X 变化</text>

  <!-- header underline -->
  <path d="M 50 70 L 510 70" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 0: initial -->
  <text x="70" y="100" font-size="12" fill="#555" font-weight="bold">初始</text>
  <text x="140" y="100" font-size="12" fill="#888">—</text>
  <text x="250" y="100" font-size="12" fill="#888">—</text>
  <rect x="380" y="86" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="105" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>

  <!-- Step 1: --X -->
  <text x="70" y="140" font-size="12" fill="#555" font-weight="bold">1</text>
  <rect x="130" y="126" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">--X</text>
  <text x="250" y="140" font-size="12" fill="#b85450">含 '−' → 减 1</text>
  <path d="M 360 140 L 378 140" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="126" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="145" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−1</text>

  <!-- Step 2: X++ -->
  <text x="70" y="190" font-size="12" fill="#555" font-weight="bold">2</text>
  <rect x="130" y="176" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">X++</text>
  <text x="250" y="190" font-size="12" fill="#4a7a3a">含 '+' → 加 1</text>
  <path d="M 360 190 L 378 190" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="176" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="195" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Step 3: X++ -->
  <text x="70" y="240" font-size="12" fill="#555" font-weight="bold">3</text>
  <rect x="130" y="226" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="245" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">X++</text>
  <text x="250" y="240" font-size="12" fill="#4a7a3a">含 '+' → 加 1</text>
  <path d="M 360 240 L 378 240" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="226" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="245" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Final result box -->
  <rect x="60" y="280" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">最终结果：X = 0 − 1 + 1 + 1 = 1</text>

  <!-- Insight -->
  <rect x="60" y="330" width="440" height="22" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="10" fill="#888">本质：把每个操作归约为 ±1，再做一次求和</text>
</svg>
