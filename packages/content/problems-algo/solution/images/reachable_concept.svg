<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：边压缩 + 按边整体计数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">不建新节点，只在原始节点上跑 Dijkstra，再按边公式统计</text>

  <!-- ===== Part A: 细分与压缩 ===== -->
  <text x="40" y="74" font-size="11" fill="#446688" font-weight="bold">① 一条边 (u, v, cnt=4) 被细分成 cnt 个新节点、cnt+1 段</text>

  <!-- subdivided edge line -->
  <path d="M 70 104 L 490 104" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- original node u -->
  <ellipse cx="70" cy="104" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="108" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">u</text>

  <!-- 4 new nodes -->
  <g>
    <circle cx="154" cy="104" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="238" cy="104" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="322" cy="104" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="406" cy="104" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  </g>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#888">cnt=4 个新节点</text>

  <!-- original node v -->
  <ellipse cx="490" cy="104" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="490" y="108" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">v</text>

  <!-- segment count bracket -->
  <path d="M 70 128 L 490 128" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 70 124 L 70 132" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 490 124 L 490 132" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">共 cnt+1 = 5 段 → Dijkstra 边权 = 5</text>

  <!-- compression arrow -->
  <path d="M 280 156 L 280 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="172" font-size="9" fill="#888">压缩</text>

  <!-- compressed edge -->
  <rect x="60" y="182" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">原图只留 n 个节点，边权 = cnt+1</text>

  <rect x="290" y="182" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="395" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Dijkstra → dist[u], dist[v]</text>

  <!-- ===== Part B: 按边整体计数 ===== -->
  <text x="40" y="246" font-size="11" fill="#446688" font-weight="bold">② 边上新节点 = min(cnt, a + b)，两端“夹击”同一条链</text>

  <!-- chain of new nodes between u and v -->
  <path d="M 70 286 L 490 286" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <ellipse cx="70" cy="286" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="290" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">u</text>
  <ellipse cx="490" cy="286" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="490" y="290" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">v</text>

  <!-- new nodes (cnt=6 for illustration) -->
  <g>
    <circle cx="134" cy="286" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="188" cy="286" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="242" cy="286" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="318" cy="286" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="372" cy="286" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <circle cx="426" cy="286" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  </g>

  <!-- a arrow from u going right -->
  <path d="M 92 268 L 240 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="166" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">a = max(0, maxMoves − dist[u])</text>

  <!-- b arrow from v going left -->
  <path d="M 468 308 L 320 308" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="394" y="322" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">b = max(0, maxMoves − dist[v])</text>

  <!-- formula box -->
  <rect x="80" y="338" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">该边新节点贡献 = min(cnt, a + b)</text>
  <text x="280" y="372" text-anchor="middle" font-size="9" fill="#888">a+b 超过 cnt 的部分是两端覆盖的重叠，取 min 去重</text>

  <!-- footer -->
  <text x="40" y="404" font-size="10" fill="#888">原始节点：dist[i] ≤ maxMoves 各计 1；新节点：按上式每边累加</text>
  <text x="40" y="422" font-size="10" fill="#b85450" font-weight="bold">注意：maxMoves 可达 1e9，a+b 用 long long 防溢出</text>
</svg>
