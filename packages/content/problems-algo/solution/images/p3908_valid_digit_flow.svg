<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：先查首位（一票否决），再查全串包含</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="232" y="36" width="96" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="54" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">开始</text>
    <path d="M280,64 L280,78" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="165" y="80" width="230" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="94" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">s = str(n)，c = str(x)</text>
    <text x="280" y="109" text-anchor="middle" font-size="9" fill="#66788a">十进制串，长度 L ≤ 6（10⁵ 是 6 位数）</text>
    <path d="M280,116 L280,132" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 菱形一：首位判定 -->
  <g filter="url(#rough2)">
    <polygon points="280,134 392,172 280,210 168,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="167" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">s[0] == c ？</text>
    <text x="280" y="183" text-anchor="middle" font-size="9.5" fill="#8a6d1a">（以 x 开头？）</text>

    <text x="330" y="165" font-size="11" fill="#b85450" font-weight="bold">是</text>
    <path d="M392,172 L432,172" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="436" y="150" width="112" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="492" y="168" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 false</text>
    <text x="492" y="184" text-anchor="middle" font-size="9.5" fill="#8a3030">一票否决</text>

    <text x="290" y="228" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
    <path d="M280,210 L280,238" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 菱形二：包含判定 -->
  <g filter="url(#rough2)">
    <polygon points="280,242 392,280 280,318 168,280" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="275" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">c 出现在 s 中 ？</text>
    <text x="280" y="291" text-anchor="middle" font-size="9.5" fill="#2f5d24">（存在量词：一次即真）</text>

    <text x="330" y="273" font-size="11" fill="#b85450" font-weight="bold">否</text>
    <path d="M392,280 L432,280" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="436" y="258" width="112" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="492" y="276" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 false</text>
    <text x="492" y="292" text-anchor="middle" font-size="9.5" fill="#8a3030">不含 x</text>

    <text x="290" y="336" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M280,318 L280,340" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="200" y="344" width="160" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="280" y="361" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">返回 true</text>
    <text x="280" y="376" text-anchor="middle" font-size="9.5" fill="#2f5d24">两条件齐备 ✓</text>
  </g>

  <!-- 边界备忘 -->
  <g filter="url(#rough2)">
    <rect x="18" y="240" width="138" height="122" rx="8" fill="#fff" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="87" y="262" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">边界备忘</text>
    <text x="87" y="282" text-anchor="middle" font-size="9.5" fill="#33506b">n = 0 ⇒ s = "0"</text>
    <text x="87" y="298" text-anchor="middle" font-size="9.5" fill="#33506b">x = 0 时 s[0] = c</text>
    <text x="87" y="314" text-anchor="middle" font-size="9.5" fill="#33506b">首个菱形直接否决</text>
    <text x="87" y="334" text-anchor="middle" font-size="9.5" fill="#33506b">非负整数无前导零，</text>
    <text x="87" y="350" text-anchor="middle" font-size="9.5" fill="#33506b">「以 0 开头」仅 n = 0</text>
  </g>
</svg>
