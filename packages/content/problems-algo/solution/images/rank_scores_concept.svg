<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分数排名 = DENSE_RANK：同分同名次，名次不跳号</text>

  <!-- Left: Scores table -->
  <text x="95" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Scores 表</text>

  <rect x="30" y="58" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="47" y="75" font-size="10" fill="#333">id</text>
  <text x="97" y="75" font-size="10" fill="#333">score</text>
  <line x1="65" y1="58" x2="65" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="84" width="130" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="99" font-size="10" fill="#333">1</text>
  <text x="97" y="99" font-size="10" fill="#333">3.50</text>
  <line x1="65" y1="84" x2="65" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="106" width="130" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="121" font-size="10" fill="#333">2</text>
  <text x="97" y="121" font-size="10" fill="#333">3.65</text>
  <line x1="65" y1="106" x2="65" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="128" width="130" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="143" font-size="10" fill="#333">3</text>
  <text x="97" y="143" font-size="10" fill="#333">4.00</text>
  <line x1="65" y1="128" x2="65" y2="150" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="150" width="130" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="165" font-size="10" fill="#333">4</text>
  <text x="97" y="165" font-size="10" fill="#333">3.85</text>
  <line x1="65" y1="150" x2="65" y2="172" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="172" width="130" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="187" font-size="10" fill="#333">5</text>
  <text x="97" y="187" font-size="10" fill="#333">4.00</text>
  <line x1="65" y1="172" x2="65" y2="194" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="194" width="130" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="209" font-size="10" fill="#333">6</text>
  <text x="97" y="209" font-size="10" fill="#333">3.65</text>
  <line x1="65" y1="194" x2="65" y2="216" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow -->
  <path d="M165 137 L335 137" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="250" y="129" text-anchor="middle" font-size="10" fill="#446688">ORDER BY score DESC</text>
  <text x="250" y="152" text-anchor="middle" font-size="9" fill="#888">+ DENSE_RANK()</text>

  <!-- Right: Result table -->
  <text x="420" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">排名结果</text>

  <rect x="350" y="58" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="75" text-anchor="middle" font-size="10" fill="#333">score</text>
  <text x="455" y="75" text-anchor="middle" font-size="10" fill="#333">rank</text>
  <line x1="420" y1="58" x2="420" y2="84" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="84" width="140" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="99" text-anchor="middle" font-size="10" fill="#333">4.00</text>
  <text x="455" y="99" text-anchor="middle" font-size="10" fill="#333">1</text>
  <line x1="420" y1="84" x2="420" y2="106" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="106" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="385" y="121" text-anchor="middle" font-size="10" fill="#333">4.00</text>
  <text x="455" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <line x1="420" y1="106" x2="420" y2="128" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="128" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="385" y="143" text-anchor="middle" font-size="10" fill="#333">3.85</text>
  <text x="455" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <line x1="420" y1="128" x2="420" y2="150" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="150" width="140" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="165" text-anchor="middle" font-size="10" fill="#333">3.65</text>
  <text x="455" y="165" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="420" y1="150" x2="420" y2="172" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="172" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="385" y="187" text-anchor="middle" font-size="10" fill="#333">3.65</text>
  <text x="455" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <line x1="420" y1="172" x2="420" y2="194" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="194" width="140" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="209" text-anchor="middle" font-size="10" fill="#333">3.50</text>
  <text x="455" y="209" text-anchor="middle" font-size="10" fill="#333">4</text>
  <line x1="420" y1="194" x2="420" y2="216" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Annotation arrows for tie and no-gap -->
  <path d="M495 117 L508 117" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="513" y="113" font-size="8" fill="#d6a040">同分</text>
  <text x="513" y="122" font-size="8" fill="#d6a040">同 rank</text>

  <path d="M495 139 L508 139" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="513" y="135" font-size="8" fill="#d6a040">不跳</text>
  <text x="513" y="144" font-size="8" fill="#d6a040">号→2</text>

  <!-- Bottom insight box -->
  <rect x="40" y="238" width="480" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">DENSE_RANK 语义 = 题目要求的排名规则</text>
  <text x="60" y="278" font-size="10" fill="#333">① 同分同名次：score=4.00 出现两次，都排第 1 名</text>
  <text x="60" y="296" font-size="10" fill="#333">② 名次不跳号：并列第 1 后，下一个是第 2（不是第 3）</text>
  <text x="60" y="314" font-size="10" fill="#333">③ 与 RANK 的唯一区别：RANK 并列后跳号（1,1,3…），DENSE_RANK 不跳（1,1,2…）</text>
  <text x="60" y="334" font-size="10" fill="#b85450" font-weight="bold">一句话：题目描述的就是 DENSE_RANK() 的定义</text>
</svg>
