<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">划分 DP：把 n 个工作切成 d 段连续区间</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">每段代价 = 段内最大值，总难度 = 各段代价之和</text>

  <!-- ===== Optimal partition (d=2) ===== -->
  <text x="60" y="82" font-size="11" fill="#4a7a3a" font-weight="bold">最优 (总=7)</text>

  <!-- segment backgrounds -->
  <rect x="104" y="88" width="246" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="352" y="88" width="54" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- job boxes (day1) -->
  <g font-size="13">
    <rect x="112" y="96" width="40" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="132" y="119" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="160" y="96" width="40" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="180" y="119" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <rect x="208" y="96" width="40" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="228" y="119" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="256" y="96" width="40" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="276" y="119" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="304" y="96" width="40" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="324" y="119" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <!-- job box (day2) -->
    <rect x="360" y="96" width="40" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="380" y="119" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- segment cost labels -->
  <text x="227" y="158" text-anchor="middle" font-size="11" fill="#446688">第1天 max=6</text>
  <text x="379" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a">第2天 max=1</text>
  <text x="448" y="119" font-size="13" fill="#444" font-weight="bold">6 + 1 = 7</text>
  <path d="M 416 114 L 432 114" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Suboptimal partition (d=2) ===== -->
  <text x="60" y="196" font-size="11" fill="#b85450" font-weight="bold">次优 (总=8)</text>

  <rect x="104" y="202" width="202" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="308" y="202" width="98" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <g font-size="13">
    <rect x="112" y="210" width="40" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="132" y="233" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="160" y="210" width="40" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="180" y="233" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <rect x="208" y="210" width="40" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="228" y="233" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="256" y="210" width="40" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="276" y="233" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="316" y="210" width="40" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="336" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="364" y="210" width="40" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="384" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <text x="205" y="272" text-anchor="middle" font-size="11" fill="#446688">第1天 max=6</text>
  <text x="357" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a">第2天 max=2</text>
  <text x="448" y="233" font-size="13" fill="#444" font-weight="bold">6 + 2 = 8</text>
  <path d="M 416 228 L 432 228" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="296" width="520" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="320" font-size="12" fill="#444" font-weight="bold">状态定义：dp[i][j] = 前 i 个工作分 j 天的最小总难度</text>
  <text x="60" y="342" font-size="11" fill="#555" font-family="monospace">dp[i][j] = min { dp[k][j-1] + max(jobs[k..i-1]) }   k ∈ [j-1, i-1]</text>
  <text x="60" y="362" font-size="10" fill="#888">关键：枚举「最后一天」的起点 k，把它前面的子问题答案 + 这一段的 max 拼起来</text>
  <text x="60" y="376" font-size="10" fill="#888">注：jobs 必须按序做、每天至少 1 个 → 切分点是连续的，天然适用划分型 DP</text>
</svg>
