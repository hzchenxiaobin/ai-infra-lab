<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：下标和的奇偶 = 颜色</text>
  <text x="60" y="52" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：coordinate1 = "a1"，coordinate2 = "c3"</text>
  <rect x="60" y="58" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95.0" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">坐标</text>
  <rect x="130" y="58" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165.0" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">列 c</text>
  <rect x="200" y="58" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="235.0" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">行 r</text>
  <rect x="270" y="58" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="305.0" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">c + r</text>
  <rect x="340" y="58" width="60" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370.0" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">奇偶</text>
  <rect x="400" y="58" width="60" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430.0" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">颜色</text>
  <rect x="60" y="82" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="130" y="82" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="200" y="82" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="82" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="340" y="82" width="60" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="400" y="82" width="60" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="95.0" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">a1</text>
  <text x="165.0" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="235.0" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="305.0" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="370.0" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="430.0" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">黑</text>
  <rect x="60" y="106" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="130" y="106" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="200" y="106" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="106" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="340" y="106" width="60" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="400" y="106" width="60" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="95.0" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">c3</text>
  <text x="165.0" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="235.0" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="305.0" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="370.0" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="430.0" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">黑</text>
  <rect x="60" y="134" width="400" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">同为偶数 → 同色 → 返回 true</text>
  <text x="60" y="180" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：coordinate1 = "a1"，coordinate2 = "h3"</text>
  <rect x="60" y="186" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95.0" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">坐标</text>
  <rect x="130" y="186" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165.0" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">列 c</text>
  <rect x="200" y="186" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="235.0" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">行 r</text>
  <rect x="270" y="186" width="70" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="305.0" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">c + r</text>
  <rect x="340" y="186" width="60" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370.0" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">奇偶</text>
  <rect x="400" y="186" width="60" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430.0" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">颜色</text>
  <rect x="60" y="210" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="130" y="210" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="200" y="210" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="210" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="340" y="210" width="60" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="400" y="210" width="60" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="95.0" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">a1</text>
  <text x="165.0" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="235.0" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="305.0" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="370.0" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="430.0" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">黑</text>
  <rect x="60" y="234" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="130" y="234" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="200" y="234" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="234" width="70" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="340" y="234" width="60" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="400" y="234" width="60" height="24" rx="3" fill="#ffffff" stroke="#b8c2cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="95.0" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">h3</text>
  <text x="165.0" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="235.0" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="305.0" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="370.0" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="430.0" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">白</text>
  <rect x="60" y="262" width="400" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">偶 ≠ 奇 → 异色 → 返回 false</text>
  <rect x="55" y="298" width="410" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">字符码直加复核：'a'+'1'=146 偶，'c'+'3'=150 偶，'h'+'3'=155 奇</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">四码之和：146+150=296 偶 → true；146+155=301 奇 → false</text>
</svg>