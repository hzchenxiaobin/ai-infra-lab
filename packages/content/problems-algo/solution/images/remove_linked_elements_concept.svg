<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">移除链表元素：哑节点 + 单指针「跳过」</text>

  <!-- Original list with val=6 -->
  <text x="32" y="62" font-size="12" fill="#888">原链表:</text>
  <rect x="90" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <line x1="140" y1="61" x2="168" y2="61" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="174" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="199" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <line x1="224" y1="61" x2="252" y2="61" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="258" y="46" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="283" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <line x1="308" y1="61" x2="336" y2="61" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="342" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="367" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <line x1="392" y1="61" x2="420" y2="61" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="426" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="451" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <line x1="476" y1="61" x2="504" y2="61" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="510" y="46" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="535" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <text x="32" y="86" font-size="11" fill="#888">val = 6（红色节点要删除）</text>

  <!-- With dummy node -->
  <text x="32" y="126" font-size="12" fill="#888">加哑节点:</text>
  <rect x="40" y="110" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="65" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">∅</text>
  <text x="56" y="124" font-size="9" fill="#d6a040">dummy</text>
  <line x1="90" y1="125" x2="118" y2="125" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="124" y="110" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="144" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="148" y="104" font-size="9" fill="#b85450" font-weight="bold">head</text>

  <!-- curr pointer -->
  <text x="32" y="160" font-size="11" fill="#b85450" font-weight="bold">curr →</text>
  <path d="M 86 156 L 65 142" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Key idea: compare curr.next.val -->
  <text x="32" y="184" font-size="12" fill="#444" font-weight="bold">核心：只看 curr.next，按值决定「跳过」或「前进」</text>

  <rect x="40" y="196" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="218" font-size="12" fill="#333">curr.next.val ≠ val  →  <tspan font-weight="bold">curr = curr.next</tspan> 前进</text>

  <rect x="40" y="236" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="258" font-size="12" fill="#333">curr.next.val == val  →  <tspan font-weight="bold">curr.next = curr.next.next</tspan> 跳过</text>

  <!-- Why not advance after skip -->
  <rect x="40" y="282" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough)"/>
  <text x="52" y="302" font-size="12" fill="#333">⚠️ 跳过后 <tspan font-weight="bold">不要</tspan>移动 curr！新的 curr.next 可能也要删</text>
  <text x="52" y="320" font-size="11" fill="#666">例：7→7→7，删第一个 7 后 curr.next 仍是 7，须继续跳过</text>

  <!-- dummy benefit -->
  <rect x="40" y="338" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="360" font-size="12" fill="#333">💡 哑节点让「删头节点」与「删中间节点」用同一套逻辑，最后返回 dummy.next</text>
</svg>
