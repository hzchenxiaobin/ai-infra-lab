<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3]，k = 2（条目 = AND 值 : 左端点个数）</text>

  <rect x="24" y="38" width="472" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="42" y="55" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="76" y="55" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="120" y="55" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">旧列表 ands</text>
  <text x="268" y="55" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">处理 x 后的新列表</text>
  <text x="470" y="55" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="24" y="70" width="472" height="66" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="42" y="107" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="76" y="107" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="126" y="107" font-size="12" fill="#aaa" filter="url(#rough2)">∅（空）</text>
  <rect x="268" y="92" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="294" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1 : 1</text>
  <text x="470" y="107" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="24" y="142" width="472" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)" opacity="0.35"/>
  <rect x="24" y="142" width="472" height="66" fill="none" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="42" y="179" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="76" y="179" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="126" y="164" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="152" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1 : 1</text>
  <text x="188" y="180" font-size="9.5" fill="#888" filter="url(#rough2)">1 &amp; 2 = 0</text>
  <rect x="268" y="164" width="52" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="294" y="180" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2 : 1</text>
  <rect x="330" y="164" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="356" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0 : 1</text>
  <path d="M 294 190 L 294 200" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="302" y="200" font-size="9" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">v == k，计入 1</text>
  <text x="470" y="179" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="24" y="214" width="472" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)" opacity="0.35"/>
  <rect x="24" y="214" width="472" height="66" fill="none" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="42" y="251" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="76" y="251" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="126" y="236" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="152" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2 : 1</text>
  <rect x="188" y="236" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="214" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0 : 1</text>
  <rect x="268" y="236" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="294" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3 : 1</text>
  <rect x="330" y="236" width="52" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="356" y="252" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2 : 1</text>
  <rect x="392" y="236" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="418" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0 : 1</text>
  <path d="M 356 262 L 356 272" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="364" y="272" font-size="9" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">v == k，计入 1</text>
  <text x="470" y="251" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="24" y="292" width="472" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">条目含义：以 i 结尾、AND 值为 v 的左端点恰有 c 个；命中 k 时把整段的 c 计入答案</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">值严格递减、长度恒 ≤ 30；ans = 2 与示例 3 吻合（子数组 [2] 与 [2,3]）</text>
</svg>
