<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">核心：双指针逐字符比对虚拟拼接串，无需显式建串</text>

  <!-- ===== Left column: word1 ===== -->
  <text x="36" y="74" font-size="11" fill="#666">word1</text>

  <!-- "ab" box -->
  <rect x="82" y="52" width="68" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="133" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <!-- "c" box -->
  <rect x="156" y="52" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <!-- brackets -->
  <text x="72" y="76" font-size="16" fill="#999">[</text>
  <text x="196" y="76" font-size="16" fill="#999">]</text>

  <!-- Down arrow + label -->
  <path d="M 130 90 L 130 104" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="101" font-size="9.5" fill="#888">虚拟拼接</text>

  <!-- word1 virtual [a][b][c] -->
  <rect x="88" y="108" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="128" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="122" y="108" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="128" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="156" y="108" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="128" text-anchor="middle" font-size="12" fill="#333">c</text>

  <!-- Pointer labels for word1 -->
  <text x="105" y="154" text-anchor="middle" font-size="9" fill="#446688">(0,0)</text>
  <text x="139" y="154" text-anchor="middle" font-size="9" fill="#446688">(0,1)</text>
  <text x="173" y="154" text-anchor="middle" font-size="9" fill="#446688">(1,0)</text>

  <!-- ===== Right column: word2 ===== -->
  <text x="436" y="74" font-size="11" fill="#666">word2</text>

  <!-- "a" box -->
  <rect x="316" y="52" width="34" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <!-- "bc" box -->
  <rect x="356" y="52" width="68" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <text x="407" y="76" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <!-- brackets -->
  <text x="306" y="76" font-size="16" fill="#999">[</text>
  <text x="430" y="76" font-size="16" fill="#999">]</text>

  <!-- Down arrow + label -->
  <path d="M 364 90 L 364 104" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="101" font-size="9.5" fill="#888">虚拟拼接</text>

  <!-- word2 virtual [a][b][c] -->
  <rect x="322" y="108" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="339" y="128" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="356" y="108" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="373" y="128" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="390" y="108" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="128" text-anchor="middle" font-size="12" fill="#333">c</text>

  <!-- Pointer labels for word2 -->
  <text x="339" y="154" text-anchor="middle" font-size="9" fill="#4a7a3a">(0,0)</text>
  <text x="373" y="154" text-anchor="middle" font-size="9" fill="#4a7a3a">(1,0)</text>
  <text x="407" y="154" text-anchor="middle" font-size="9" fill="#4a7a3a">(1,1)</text>

  <!-- Match signs between virtual rows -->
  <text x="222" y="132" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">=</text>
  <text x="256" y="132" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">=</text>
  <text x="290" y="132" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">=</text>

  <!-- Insight box -->
  <rect x="40" y="178" width="480" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="200" font-size="12" fill="#446688" font-weight="bold">关键洞察</text>
  <text x="58" y="222" font-size="11" fill="#555">• 双指针 (i, ci) 与 (j, cj) 分别在 word1、word2 上同步推进，逐字符比对</text>
  <text x="58" y="242" font-size="11" fill="#555">• (i, ci) = word1 第 i 个串的第 ci 个字符；ci 到末尾则 i++, ci = 0</text>
  <text x="58" y="262" font-size="11" fill="#555">• 不显式拼接字符串 → O(1) 额外空间（满足进阶要求）</text>
  <text x="58" y="282" font-size="11" fill="#555">• word1[i][ci] ≠ word2[j][cj] → 立即返回 false</text>
  <text x="58" y="302" font-size="11" fill="#555">• 两串同时耗尽 → true；一先一后 → false（总长度不等）</text>
  <text x="58" y="330" font-size="11" fill="#b85450" font-weight="bold">暴力法 join 后比较：同样 O(L) 时间，但需 O(L) 空间建串</text>
  <text x="58" y="348" font-size="11" fill="#b85450" font-weight="bold">双指针把「先拼接再比较」降为「边遍历边比较」，省去中间字符串</text>
</svg>
