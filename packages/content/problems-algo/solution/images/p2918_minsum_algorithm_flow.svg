<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描 + 常数判定</text>

  <!-- 开始 -->
  <rect x="185" y="46" width="150" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12.5" fill="#33507a" filter="url(#rough2)">扫描两数组</text>
  <path d="M 260 80 L 260 94" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算基线 -->
  <rect x="155" y="98" width="210" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">min₁ = s₁ + z₁（0 全换 1）</text>
  <text x="260" y="135" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">min₂ = s₂ + z₂</text>
  <path d="M 260 142 L 260 154" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <polygon points="260,156 388,196 260,236 132,196" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="191" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">min₁ &gt; min₂</text>
  <text x="260" y="209" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">且 z₂ = 0 ?</text>
  <text x="405" y="189" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 388 196 L 426 196" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="252" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 260 236 L 260 250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2 -->
  <polygon points="260,254 388,294 260,334 132,294" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">min₂ &gt; min₁</text>
  <text x="260" y="307" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">且 z₁ = 0 ?</text>
  <text x="405" y="287" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 388 294 L 465 294 L 465 216" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="350" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 260 334 L 260 348" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -1 -->
  <rect x="428" y="178" width="74" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="200" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 -1</text>

  <!-- 返回答案 -->
  <rect x="160" y="352" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 max(min₁, min₂)</text>

  <text x="260" y="410" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">两个判定完全对称：下界小的一侧若是定值（无 0）⇒ 无解</text>
</svg>
