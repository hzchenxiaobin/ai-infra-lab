<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描的「三步闸门」—— 出右 → 算贡献 → 进左</text>
  <text x="310" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">nxt 初始为全量频次；j 每右移一步，当前元素穿过闸门从右侧搬到左侧</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="170" y="48" width="280" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="310" y="65" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5d24">开始：nxt ← nums 全量频次；pre ← 空；ans ← 0</text>
  </g>
  <path d="M 310 74 L 310 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- D1 还有下标? -->
  <g filter="url(#rough2)">
    <polygon points="310,86 368,112 310,138 252,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="116" text-anchor="middle" font-size="10" fill="#333">j &lt; n ?</text>
  </g>
  <path d="M 368 112 L 440 112" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="106" text-anchor="middle" font-size="8" fill="#55677d" filter="url(#rough2)">否</text>
  <path d="M 310 138 L 310 148" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="318" y="148" font-size="8" fill="#55677d" filter="url(#rough2)">是</text>

  <!-- 退出 -->
  <g filter="url(#rough2)">
    <rect x="444" y="98" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <text x="519" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">返回 ans ✓</text>
  </g>

  <!-- B1 出右 -->
  <g filter="url(#rough2)">
    <rect x="200" y="152" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="310" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b">① nxt[nums[j]] ← nxt[nums[j]] − 1</text>
    <text x="310" y="181" text-anchor="middle" font-size="8.5" fill="#55677d">（当前元素退出右侧，防自计数）</text>
  </g>
  <path d="M 310 188 L 310 196" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- B2 算贡献 -->
  <g filter="url(#rough2)">
    <rect x="195" y="200" width="230" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="310" y="218" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a">t ← 2 × nums[j]</text>
    <text x="310" y="234" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d3a">ans ← (ans + pre[t] × nxt[t]) mod p</text>
    <text x="310" y="247" text-anchor="middle" font-size="8.5" fill="#55677d">（乘法原理：左计数 × 右计数）</text>
  </g>
  <path d="M 310 252 L 310 260" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- B3 进左 -->
  <g filter="url(#rough2)">
    <rect x="200" y="264" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="310" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">③ pre[nums[j]] ← pre[nums[j]] + 1</text>
    <text x="310" y="293" text-anchor="middle" font-size="8.5" fill="#55677d">（当前元素进入左侧，服务后续 j）</text>
  </g>

  <!-- 回环总线 -->
  <path d="M 310 300 L 310 312" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 310 312 L 60 312 L 60 112 L 248 112" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="170" y="326" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">取下一个 j，回到「j &lt; n ?」</text>

  <!-- 顺序警告 -->
  <g filter="url(#rough2)">
    <rect x="440" y="152" width="170" height="128" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="525" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">⚠ 三步顺序不可换</text>
    <text x="525" y="188" text-anchor="middle" font-size="8.5" fill="#8a3a36">算贡献的那一刻：</text>
    <text x="525" y="202" text-anchor="middle" font-size="9" fill="#8a3a36">pre 恰含下标 &lt; j 的元素</text>
    <text x="525" y="216" text-anchor="middle" font-size="9" fill="#8a3a36">nxt 恰含下标 &gt; j 的元素</text>
    <text x="525" y="234" text-anchor="middle" font-size="8.5" fill="#555">先出右：j 不会被右侧数到</text>
    <text x="525" y="248" text-anchor="middle" font-size="8.5" fill="#555">后进左：j 不会被左侧数到</text>
    <text x="525" y="268" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450">x = 0 时 t = x，写反立刻翻车</text>
  </g>

  <!-- 底部不变量横幅 -->
  <g filter="url(#rough2)">
    <rect x="16" y="344" width="588" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="310" y="363" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">不变量：处理完下标 j 后，pre 恰为 nums[0..j] 的频次、nxt 恰为 nums[j+1..n−1] 的频次</text>
  </g>
  <text x="310" y="392" text-anchor="middle" font-size="9" fill="#55677d" filter="url(#rough2)">每步仅两次桶加减 + 一次查表乘法；总复杂度 O(n + V)，V = 2×10⁵ + 1（t 的值域上界）</text>
</svg>
