<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：相邻奇偶不同 ⟺ 奇偶序列严格交替</text>

  <text x="32" y="86" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">nums =</text>

  <rect x="120" y="52" width="60" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="78" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="150" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶</text>

  <rect x="196" y="52" width="60" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="226" y="78" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="226" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">奇</text>

  <rect x="272" y="52" width="60" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="302" y="78" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="302" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">偶</text>

  <circle cx="188" cy="80" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="188" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <circle cx="264" cy="80" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="188" y="128" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2⊕1=3，末位 1 ✓</text>
  <text x="264" y="128" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1⊕4=5，末位 1 ✓</text>

  <text x="32" y="168" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">合法形态只有两种（起点任选，之后强制交替）：</text>

  <text x="32" y="198" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">形态①</text>
  <rect x="120" y="180" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="137" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <rect x="158" y="180" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <rect x="196" y="180" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="213" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <rect x="234" y="180" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <rect x="272" y="180" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="289" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <rect x="310" y="180" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="327" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>

  <text x="32" y="234" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">形态②</text>
  <rect x="120" y="216" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="137" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <rect x="158" y="216" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <rect x="196" y="216" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="213" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <rect x="234" y="216" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <rect x="272" y="216" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="289" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <rect x="310" y="216" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="327" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">偶</text>

  <rect x="32" y="262" width="456" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 反例 [2, 4, 1, 3]：奇偶各 2 个，但 (2,4) 同偶 → false</text>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">判定的是相邻「位置」的交替，不是奇偶「数量」的均衡</text>

  <rect x="32" y="328" width="456" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(a ⊕ b) &amp; 1 == 1 ⟺ 一奇一偶（异或末位 = 两数末位的异或）</text>

  <rect x="32" y="376" width="456" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="399" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 1：不存在相邻对，条件「空真」→ true</text>
</svg>
