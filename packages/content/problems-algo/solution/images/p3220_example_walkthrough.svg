<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：6 笔交易按天分流，单边日靠 ELSE 0 垫底</text>

  <text x="30" y="64" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2024-07-01</text>
  <rect x="24" y="72" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">150 偶</text>
  <rect x="96" y="72" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">200 偶</text>
  <rect x="168" y="72" width="66" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">75 奇</text>

  <text x="30" y="134" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2024-07-02</text>
  <rect x="24" y="142" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">300 偶</text>
  <rect x="96" y="142" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">50 偶</text>

  <text x="30" y="204" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2024-07-03</text>
  <rect x="24" y="212" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">120 偶</text>

  <path d="M 240 86 C 268 90, 286 96, 306 104" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 240 156 C 268 152, 286 146, 306 138" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 240 226 C 268 220, 286 190, 306 172" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="310" y="64" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="81" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">transaction_date</text>
  <rect x="410" y="64" width="43" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="431" y="81" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">odd</text>
  <rect x="453" y="64" width="43" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="81" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">even</text>

  <rect x="310" y="90" width="100" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2024-07-01</text>
  <rect x="410" y="90" width="43" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">75</text>
  <rect x="453" y="90" width="43" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">350</text>

  <rect x="310" y="122" width="100" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2024-07-02</text>
  <rect x="410" y="122" width="43" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="453" y="122" width="43" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">350</text>

  <rect x="310" y="154" width="100" height="32" fill="#fafafa" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="174" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2024-07-03</text>
  <rect x="410" y="154" width="43" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="431" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="453" y="154" width="43" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="174" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">120</text>

  <rect x="290" y="200" width="210" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="395" y="217" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">07-02 / 07-03 没有奇数交易</text>
  <text x="395" y="235" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 由 ELSE 0 垫出（非 NULL）</text>

  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">校验：每天 odd_sum + even_sum = 当天 SUM(amount)（解法 B 的依据）</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">奇偶两路互不干扰；输出天然按日期升序</text>
</svg>
