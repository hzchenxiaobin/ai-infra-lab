<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="580" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：查表 → 取计数器 → 试候选 → 双更新</text>

  <!-- Start: take name -->
  <rect x="210" y="40" width="120" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取 name</text>
  <path d="M 270 74 L 270 98" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond 1: name in d? -->
  <polygon points="270,104 360,150 270,196 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">name ∈ d ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="9.5" fill="#888">（已分配过？）</text>

  <!-- No branch: left -->
  <path d="M 180 150 L 96 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="138" y="142" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="20" y="134" width="76" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="150" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">d[name]=1</text>
  <text x="58" y="162" text-anchor="middle" font-size="9.5" fill="#333">分配 name</text>

  <!-- Yes branch: down -->
  <path d="M 270 196 L 270 220" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="214" font-size="10.5" fill="#b85450" font-weight="bold">是</text>

  <!-- k = d[name] -->
  <rect x="200" y="224" width="140" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="245" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">k = d[name]</text>
  <path d="M 270 256 L 270 278" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- cand = name(k) -->
  <rect x="190" y="282" width="160" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="303" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cand = name(k)</text>

  <!-- arrow down to diamond 2 -->
  <path d="M 270 314 L 270 338" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond 2: cand in d? -->
  <polygon points="270,344 360,390 270,436 180,390" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="386" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cand ∈ d ?</text>
  <text x="270" y="402" text-anchor="middle" font-size="9.5" fill="#888">（候选被占用？）</text>

  <!-- Yes branch: right, k++ then loop back up to cand=name(k) -->
  <path d="M 360 390 L 446 390" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="403" y="382" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="446" y="374" width="80" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="395" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">k ++</text>

  <!-- loop back arrow: from k++ box up to cand=name(k) box right side -->
  <path d="M 486 374 L 486 298 L 350 298" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="498" y="338" font-size="9.5" fill="#b85450">回到</text>
  <text x="498" y="350" font-size="9.5" fill="#b85450">构造候选</text>

  <!-- No branch: down -->
  <path d="M 270 436 L 270 462" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="456" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Two-step update + assign -->
  <rect x="120" y="466" width="300" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="486" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">双更新：d[cand] = 1 ；d[name] = k + 1</text>
  <text x="270" y="504" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">分配 cand</text>
  <text x="270" y="516" text-anchor="middle" font-size="9.5" fill="#888">（占候选 + 推计数器）</text>

  <!-- End -->
  <path d="M 270 522 L 270 544" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="560" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">下一个 name</text>

  <!-- legend -->
  <rect x="22" y="560" width="14" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="571" font-size="9.5" fill="#555">空闲/分配</text>
  <rect x="98" y="560" width="14" height="12" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="118" y="571" font-size="9.5" fill="#555">占用/递增</text>
</svg>
