<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">转移：上一个哨兵只能落在前 3 格</text>

  <!-- dp cells -->
  <text x="24" y="60" font-size="12" fill="#888">dp：</text>
  <rect x="70" y="46" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="66" text-anchor="middle" font-size="12" fill="#333">dp[i−3]</text>
  <rect x="152" y="46" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="66" text-anchor="middle" font-size="12" fill="#333">dp[i−2]</text>
  <rect x="234" y="46" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">dp[i−1]</text>
  <rect x="330" y="46" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="66" text-anchor="middle" font-size="12" fill="#333">dp[i]</text>

  <!-- arrows -->
  <path d="M 106 84 Q 200 130 330 84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 188 84 Q 260 112 344 84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 270 84 Q 312 100 358 84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="240" y="116" text-anchor="middle" font-size="11" fill="#b85450">三者取 min（间距 ≤ 3）</text>

  <!-- cost box -->
  <rect x="70" y="132" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a">cost(i) = max(0, k−nums[i])</text>
  <path d="M 194 146 L 216 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- formula -->
  <rect x="70" y="176" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp[i] = cost(i) + min(dp[i−1], dp[i−2], dp[i−3])</text>

  <!-- boundary & answer box -->
  <rect x="24" y="230" width="230" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="139" y="254" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">边界与答案</text>
  <text x="139" y="276" text-anchor="middle" font-size="10" fill="#555">dp[0] = cost(0)，dp[1] = cost(1)</text>
  <text x="139" y="294" text-anchor="middle" font-size="10" fill="#555">dp[2] = cost(2)（首哨兵 ≤ 2）</text>
  <text x="139" y="312" text-anchor="middle" font-size="10" fill="#555">末哨兵必须 ≥ n−3</text>
  <text x="139" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = min(dp[n−3], dp[n−2], dp[n−1])</text>

  <!-- rolling box -->
  <rect x="272" y="230" width="224" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="384" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">三变量滚动 → O(1) 空间</text>
  <text x="384" y="278" text-anchor="middle" font-size="11" fill="#555">a, b, c = dp[i−3], dp[i−2], dp[i−1]</text>
  <text x="384" y="300" text-anchor="middle" font-size="11" fill="#555">d = cost(i) + min(a, b, c)</text>
  <text x="384" y="322" text-anchor="middle" font-size="11" fill="#555">a ← b，b ← c，c ← d</text>
  <text x="384" y="342" text-anchor="middle" font-size="10" fill="#888">循环结束返回 min(a, b, c)</text>

  <rect x="24" y="362" width="472" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#555">把「i 是末哨兵」编进状态 → 合法性只看上一个哨兵 → 无后效性</text>
</svg>
