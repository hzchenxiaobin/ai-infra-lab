<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">按 mod k 分组：跨组差值必不为 k</text>

  <!-- Sorted nums -->
  <text x="30" y="58" font-size="12" fill="#888">排序后:</text>
  <rect x="90" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="63" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="138" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="63" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="186" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="63" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="234" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="63" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="292" y="60" font-size="11" fill="#888">k = 5</text>

  <!-- Group A: residue 0 -> {5} -->
  <text x="40" y="118" font-size="12" fill="#4a7a3a" font-weight="bold">组A (mod 5 = 0)</text>
  <rect x="150" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="123" text-anchor="middle" font-size="12" fill="#333">5</text>

  <!-- Group B: residue 2 -> {2} -->
  <text x="40" y="168" font-size="12" fill="#446688" font-weight="bold">组B (mod 5 = 2)</text>
  <rect x="150" y="154" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="173" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- Group C: residue 3 -> {3, 8} -->
  <text x="40" y="218" font-size="12" fill="#d6a040" font-weight="bold">组C (mod 5 = 3)</text>
  <rect x="150" y="204" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="223" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="206" y="204" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="223" text-anchor="middle" font-size="12" fill="#333">8</text>
  <!-- conflict edge 3-8 -->
  <path d="M 194 218 L 206 218" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="198" text-anchor="middle" font-size="10" fill="#b85450">diff=5=k 冲突</text>

  <!-- cross-group: no conflict -->
  <path d="M 194 118 Q 240 140 194 168" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="252" y="142" font-size="10" fill="#999">跨组差≠k</text>
  <path d="M 194 118 Q 280 160 206 204" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Insight box -->
  <rect x="310" y="100" width="190" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="122" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="405" y="140" text-anchor="middle" font-size="11" fill="#555">同余组内才可能</text>
  <text x="405" y="155" text-anchor="middle" font-size="11" fill="#555">出现差值 = k</text>
  <text x="405" y="172" text-anchor="middle" font-size="11" fill="#b85450">组间互相独立</text>

  <!-- Summary -->
  <rect x="30" y="270" width="460" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每组独立求 k-free 子集数 → 乘积即为答案</text>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#555">组A: 2  ×  组B: 2  ×  组C: 3  =  12</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#888">不同余数 → 差值不可能是 k 的整数倍中的恰好 k</text>
</svg>
