<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：跨行块注释</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">source = ["a/*comment", "line", "more_comment*/b"]</text>

  <!-- Header -->
  <text x="20" y="66" font-size="11" fill="#444" font-weight="bold">行</text>
  <text x="60" y="66" font-size="11" fill="#444" font-weight="bold">原始内容</text>
  <text x="260" y="66" font-size="11" fill="#444" font-weight="bold">状态/动作</text>
  <text x="450" y="66" font-size="11" fill="#444" font-weight="bold">buffer</text>
  <text x="540" y="66" font-size="11" fill="#444" font-weight="bold">输出</text>
  <line x1="14" y1="74" x2="600" y2="74" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Line 0: a/*comment -->
  <text x="20" y="98" font-size="11" fill="#333">0</text>
  <rect x="55" y="86" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="101" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="87" y="86" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="101" font-size="11" fill="#b85450">/*comment</text>
  <text x="260" y="101" font-size="11" fill="#333">读 'a' → 追加; 遇 /* → 进块</text>
  <rect x="448" y="86" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="453" y="101" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="540" y="101" font-size="11" fill="#999">—(块内)</text>

  <!-- Line 1: line (all in block) -->
  <text x="20" y="134" font-size="11" fill="#333">1</text>
  <rect x="55" y="122" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="137" font-size="11" fill="#b85450">line</text>
  <text x="260" y="137" font-size="11" fill="#b85450">块内 → 整行跳过</text>
  <rect x="448" y="122" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="453" y="137" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="540" y="137" font-size="11" fill="#999">—(块内)</text>

  <!-- Line 2: more_comment*/b -->
  <text x="20" y="170" font-size="11" fill="#333">2</text>
  <rect x="55" y="158" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="173" font-size="11" fill="#b85450">more_comment*/</text>
  <rect x="177" y="158" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="173" font-size="11" fill="#333" font-weight="bold">b</text>
  <text x="260" y="173" font-size="11" fill="#333">块内跳过 → 遇 */ → 出块; 读 'b' → 追加</text>
  <rect x="448" y="158" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="453" y="173" font-size="11" fill="#333" font-weight="bold">ab</text>
  <text x="540" y="173" font-size="11" fill="#4a7a3a" font-weight="bold">"ab"</text>

  <!-- Result box -->
  <line x1="14" y1="196" x2="600" y2="196" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="208" width="540" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="231" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">结果：["ab"]</text>

  <!-- Second example: line comment -->
  <text x="310" y="272" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">行注释演算："  // variable declaration "</text>

  <!-- Header -->
  <text x="20" y="296" font-size="11" fill="#444" font-weight="bold">步骤</text>
  <text x="70" y="296" font-size="11" fill="#444" font-weight="bold">字符</text>
  <text x="140" y="296" font-size="11" fill="#444" font-weight="bold">动作</text>
  <text x="340" y="296" font-size="11" fill="#444" font-weight="bold">buffer</text>
  <text x="450" y="296" font-size="11" fill="#444" font-weight="bold">说明</text>
  <line x1="14" y1="304" x2="600" y2="304" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: space -->
  <text x="20" y="326" font-size="11" fill="#333">1</text>
  <rect x="62" y="314" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="329" font-size="11" fill="#333">空</text>
  <text x="140" y="329" font-size="11" fill="#4a7a3a">追加</text>
  <rect x="334" y="314" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="329" font-size="11" fill="#333"> </text>
  <text x="450" y="329" font-size="11" fill="#888">普通字符</text>

  <!-- Step 2: space -->
  <text x="20" y="358" font-size="11" fill="#333">2</text>
  <rect x="62" y="346" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="361" font-size="11" fill="#333">空</text>
  <text x="140" y="361" font-size="11" fill="#4a7a3a">追加</text>
  <rect x="334" y="346" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="361" font-size="11" fill="#333">  </text>
  <text x="450" y="361" font-size="11" fill="#888">buffer = "  "</text>

  <!-- Step 3: // -->
  <text x="20" y="390" font-size="11" fill="#333">3</text>
  <rect x="55" y="378" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="393" font-size="11" fill="#b85450" font-weight="bold">//</text>
  <text x="140" y="393" font-size="11" fill="#b85450" font-weight="bold">跳过本行剩余!</text>
  <rect x="334" y="378" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="393" font-size="11" fill="#333">  </text>
  <text x="450" y="393" font-size="11" fill="#b85450">遇// → break</text>

  <!-- End of line: output -->
  <text x="20" y="422" font-size="11" fill="#333">行末</text>
  <text x="140" y="422" font-size="11" fill="#4a7a3a">buffer非空 → 输出</text>
  <text x="450" y="422" font-size="11" fill="#4a7a3a" font-weight="bold">输出 "  "</text>

  <!-- Result -->
  <rect x="40" y="432" width="540" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="448" text-anchor="middle" font-size="11" fill="#444">行注释后 "  " 非空 → 保留输出（空行不删除前导空格）</text>
</svg>
