<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">对称轴由最左最右两点唯一确定</text>

  <!-- Coordinate plane -->
  <line x1="60" y1="240" x2="500" y2="240" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="280" y1="300" x2="280" y2="60" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="505" y="244" font-size="10" fill="#888">x</text>
  <text x="276" y="56" font-size="10" fill="#888">y</text>

  <!-- Symmetry axis x = c (highlighted) -->
  <line x1="280" y1="290" x2="280" y2="80" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="288" y="76" font-size="11" fill="#b85450" font-weight="bold">x = c</text>

  <!-- Left points (min_x highlighted) -->
  <circle cx="160" cy="200" r="6" fill="#b85450" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="128" y="222" font-size="10" fill="#b85450" font-weight="bold">min_x</text>

  <circle cx="200" cy="160" r="5" fill="#446688" filter="url(#rough2)"/>

  <!-- Right points (max_x highlighted, mirror of min_x) -->
  <circle cx="400" cy="200" r="6" fill="#b85450" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="388" y="222" font-size="10" fill="#b85450" font-weight="bold">max_x</text>

  <circle cx="360" cy="160" r="5" fill="#446688" filter="url(#rough2)"/>

  <!-- Mirror arrows -->
  <path d="M 170 200 Q 280 252 390 200" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 160 Q 280 132 350 160" stroke="#446688" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="40" y="312" width="480" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="11" fill="#333" font-weight="bold">最左点镜像 ≤ max_x  ⇒  2c ≤ min_x + max_x</text>
  <text x="60" y="350" font-size="11" fill="#333" font-weight="bold">最右点镜像 ≥ min_x  ⇒  2c ≥ min_x + max_x   →   2c = min_x + max_x</text>
</svg>
