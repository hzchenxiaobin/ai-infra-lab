<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：6 条规则 → 一次遍历 + 4 个标志位</text>

  <!-- ===== 6 rules in 2x3 grid ===== -->
  <rect x="30" y="46" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">长度 ≥ 8</text>

  <rect x="200" y="46" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">含小写 a–z</text>

  <rect x="370" y="46" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">含大写 A–Z</text>

  <rect x="30" y="92" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="116" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">含数字 0–9</text>

  <rect x="200" y="92" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">含特殊字符</text>

  <rect x="370" y="92" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="116" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">无连续相同</text>

  <!-- down arrow with label -->
  <line x1="270" y1="132" x2="270" y2="158" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="150" font-size="11" fill="#888">压成一次遍历</text>

  <!-- ===== single pass box ===== -->
  <rect x="60" y="164" width="420" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">一次遍历 password</text>
  <text x="270" y="208" text-anchor="middle" font-size="11.5" fill="#333">每个字符 c：① 分类 → 置 4 标志之一</text>
  <text x="270" y="223" text-anchor="middle" font-size="11.5" fill="#333">② c == prev → 立即 return false（提前终止）</text>

  <!-- down arrow -->
  <line x1="270" y1="232" x2="270" y2="258" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 6 condition chips ===== -->
  <rect x="45" y="262" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">长度≥8</text>

  <rect x="121" y="262" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="156" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">小写</text>

  <rect x="197" y="262" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="232" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">大写</text>

  <rect x="273" y="262" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="308" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">数字</text>

  <rect x="349" y="262" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="384" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">特殊</text>

  <rect x="425" y="262" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">无重复</text>

  <!-- down arrow -->
  <line x1="270" y1="294" x2="270" y2="320" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== result ===== -->
  <rect x="150" y="324" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="349" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">全为真 → 强密码 ✓</text>

  <!-- ===== failure note ===== -->
  <rect x="60" y="374" width="420" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="393" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">任一为假或出现连续相同 → return false（可提前终止）</text>
</svg>
