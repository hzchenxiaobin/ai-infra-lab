<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">倒水：左扫机制与三段决策（左优先 → 右 → 原地）</text>

  <!-- baseline -->
  <line x1="70" y1="270" x2="400" y2="270" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- terrain bars: heights = [2,1,1,2,1,2,2] -->
  <rect x="90" y="210" width="42" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="132" y="240" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="174" y="240" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- water on index 2 (drop 1 landed here) -->
  <rect x="174" y="210" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="210" width="42" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="258" y="240" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="210" width="42" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="342" y="210" width="42" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- terrain height labels -->
  <text x="111" y="252" text-anchor="middle" font-size="11" fill="#3a5a2a">2</text>
  <text x="153" y="262" text-anchor="middle" font-size="11" fill="#3a5a2a">1</text>
  <text x="195" y="262" text-anchor="middle" font-size="11" fill="#3a5a2a">1</text>
  <text x="237" y="252" text-anchor="middle" font-size="11" fill="#3a5a2a">2</text>
  <text x="279" y="262" text-anchor="middle" font-size="11" fill="#3a5a2a">1</text>
  <text x="321" y="252" text-anchor="middle" font-size="11" fill="#3a5a2a">2</text>
  <text x="363" y="252" text-anchor="middle" font-size="11" fill="#3a5a2a">2</text>

  <!-- index labels -->
  <text x="111" y="288" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="153" y="288" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="195" y="288" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="237" y="288" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="279" y="288" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="321" y="288" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="363" y="288" text-anchor="middle" font-size="10" fill="#888">6</text>

  <!-- K marker + droplet -->
  <text x="237" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">K = 3</text>
  <circle cx="237" cy="192" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- flow arrow K -> index 2 -->
  <path d="M 232 196 Q 212 182 200 208" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="218" y="176" text-anchor="middle" font-size="10" fill="#446688">左能落下 → 走左</text>

  <!-- scan annotations -->
  <text x="195" y="206" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">↓落点</text>
  <text x="153" y="234" text-anchor="middle" font-size="9" fill="#888">同高·跳过</text>
  <text x="111" y="204" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑墙·停</text>

  <!-- three rule boxes -->
  <rect x="415" y="70" width="130" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 左能最终落下</text>
  <text x="480" y="106" text-anchor="middle" font-size="10" fill="#666">→ 走左（优先）</text>

  <rect x="415" y="126" width="130" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 否则右能落下</text>
  <text x="480" y="162" text-anchor="middle" font-size="10" fill="#666">→ 走右</text>

  <rect x="415" y="182" width="130" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 否则</text>
  <text x="480" y="218" text-anchor="middle" font-size="10" fill="#666">→ 原地上升</text>

  <!-- scan mechanism summary -->
  <rect x="40" y="304" width="370" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="225" y="325" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">左扫：从 K−1 向左，更低→更新 cur，更高→停（墙）</text>
  <text x="225" y="343" text-anchor="middle" font-size="11" fill="#666">同高不更新 cur 但继续扫；最终 cur = 最近最低点</text>
  <text x="225" y="359" text-anchor="middle" font-size="10" fill="#888">“最终落下” = 沿非递增方向能到达严格更低的水位</text>
</svg>
