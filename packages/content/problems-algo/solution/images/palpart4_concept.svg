<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分割回文串 IV：两刀切三段（预处理表 + 双重枚举切点）</text>

  <!-- String row with 3 colored segments: "a" | "bcb" | "dd" -->
  <text x="40" y="72" font-size="12" fill="#888">s =</text>
  <!-- segment 1: "a" [0..0] green -->
  <rect x="80" y="58" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="78" text-anchor="middle" font-size="13" fill="#333">a</text>
  <!-- segment 2: "bcb" [1..3] blue -->
  <rect x="124" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="78" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="168" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="78" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="212" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="78" text-anchor="middle" font-size="13" fill="#333">b</text>
  <!-- segment 3: "dd" [4..5] orange -->
  <rect x="256" y="58" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="276" y="78" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="300" y="58" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="#333">d</text>

  <!-- index labels -->
  <text x="100" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="144" y="104" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="188" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="232" y="104" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="276" y="104" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="320" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- Cut markers (scissors-like vertical dashed lines) -->
  <!-- First cut after i=0 (between index 0 and 1) at x=122 -->
  <path d="M 122 50 L 122 96" stroke="#b85450" stroke-width="2" stroke-dasharray="4,2" fill="none" filter="url(#rough2)"/>
  <text x="122" y="44" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第一刀 i</text>
  <!-- Second cut after j=3 (between index 3 and 4) at x=254 -->
  <path d="M 254 50 L 254 96" stroke="#b85450" stroke-width="2" stroke-dasharray="4,2" fill="none" filter="url(#rough2)"/>
  <text x="254" y="44" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第二刀 j</text>

  <!-- Segment labels below -->
  <text x="100" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"a"</text>
  <text x="188" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">"bcb"</text>
  <text x="288" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">"dd"</text>
  <text x="100" y="138" text-anchor="middle" font-size="9" fill="#888">回文 ✓</text>
  <text x="188" y="138" text-anchor="middle" font-size="9" fill="#888">回文 ✓</text>
  <text x="288" y="138" text-anchor="middle" font-size="9" fill="#888">回文 ✓</text>

  <!-- Phase 1 box -->
  <rect x="30" y="160" width="500" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Phase 1：预处理回文表 isPal[i][j]（区间 DP，O(n²)）</text>
  <text x="60" y="205" font-size="11" fill="#555">递推式：</text>
  <text x="60" y="223" font-size="11" fill="#333">isPal[i][j] = (s[i]==s[j]) &amp;&amp; (j−i&lt;2 || isPal[i+1][j−1])</text>
  <text x="330" y="205" font-size="10" fill="#888">填好后任意区间</text>
  <text x="330" y="220" font-size="10" fill="#888">O(1) 查是否回文</text>

  <!-- Arrow between phases -->
  <path d="M 280 240 L 280 258" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2 box -->
  <rect x="30" y="262" width="500" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Phase 2：枚举两刀 (i, j)，验证三段皆为回文</text>

  <!-- Three condition checks -->
  <rect x="50" y="298" width="150" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第一段</text>
  <text x="125" y="332" text-anchor="middle" font-size="10" fill="#555">isPal[0][i]</text>
  <text x="125" y="345" text-anchor="middle" font-size="9" fill="#888">s[0..i]</text>

  <rect x="215" y="298" width="150" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第二段</text>
  <text x="290" y="332" text-anchor="middle" font-size="10" fill="#555">isPal[i+1][j]</text>
  <text x="290" y="345" text-anchor="middle" font-size="9" fill="#888">s[i+1..j]</text>

  <rect x="380" y="298" width="130" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第三段</text>
  <text x="445" y="332" text-anchor="middle" font-size="10" fill="#555">isPal[j+1][n−1]</text>
  <text x="445" y="345" text-anchor="middle" font-size="9" fill="#888">s[j+1..n−1]</text>

  <!-- AND labels between conditions -->
  <text x="207" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&amp;&amp;</text>
  <text x="372" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&amp;&amp;</text>

  <!-- Result -->
  <rect x="150" y="368" width="260" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">三段皆 true → 返回 true ⭐</text>
</svg>
