<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">找到数组的中间位置：总和消去右侧和</text>

  <!-- Panel A: total = leftSum + nums[i] + rightSum -->
  <rect x="24" y="44" width="512" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">观察①：total = leftSum + nums[i] + rightSum</text>

  <!-- leftSum block -->
  <rect x="44" y="84" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">leftSum = 4</text>

  <!-- nums[i] block -->
  <rect x="170" y="84" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]=8</text>

  <!-- rightSum block -->
  <rect x="256" y="84" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">rightSum = 4</text>

  <!-- plus signs -->
  <text x="164" y="104" text-anchor="middle" font-size="13" fill="#555">+</text>
  <text x="250" y="104" text-anchor="middle" font-size="13" fill="#555">+</text>

  <!-- total bracket -->
  <line x1="44" y1="120" x2="376" y2="120" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="138" text-anchor="middle" font-size="11" fill="#446688">total = 4 + 8 + 4 = 16</text>

  <!-- right side note -->
  <text x="392" y="96" font-size="11" fill="#888">示例：</text>
  <text x="392" y="112" font-size="11" fill="#555">nums = [2,3,-1,</text>
  <text x="468" y="112" font-size="11" fill="#b85450" font-weight="bold">8</text>
  <text x="476" y="112" font-size="11" fill="#555">,4]</text>
  <text x="392" y="128" font-size="11" fill="#888">i = 3</text>

  <!-- Panel B: derivation -->
  <rect x="24" y="174" width="512" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">观察②：代入 leftSum = rightSum 消去右侧</text>

  <text x="44" y="222" font-size="11" fill="#555">条件：</text>
  <text x="84" y="222" font-size="11" fill="#446688" font-weight="bold">leftSum = rightSum</text>
  <text x="220" y="222" font-size="11" fill="#555">代入 rightSum = total − leftSum − nums[i]</text>

  <text x="44" y="244" font-size="11" fill="#555">得到：</text>
  <text x="84" y="244" font-size="11" fill="#4a7a3a" font-weight="bold">leftSum = total − leftSum − nums[i]</text>

  <text x="44" y="262" font-size="11" fill="#555">整理：</text>
  <text x="84" y="262" font-size="12" fill="#b85450" font-weight="bold">2 × leftSum + nums[i] = total</text>

  <!-- arrow from Panel A to Panel B -->
  <path d="M 210 162 q 0 6 0 12" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Insight box -->
  <rect x="24" y="284" width="512" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="306" font-size="11" fill="#4a7a3a" font-weight="bold">结论：</text>
  <text x="80" y="306" font-size="11" fill="#555">无需显式算右侧和——一次遍历滚动维护 leftSum，每步 O(1) 判等</text>
  <text x="40" y="328" font-size="11" fill="#888">命中即返回 i；</text>
  <text x="140" y="328" font-size="11" fill="#888">未命中则 leftSum += nums[i] 继续右移</text>
  <text x="40" y="350" font-size="11" fill="#b85450" font-weight="bold">时间 O(n)　空间 O(1)</text>
  <text x="160" y="350" font-size="11" fill="#555">（不开前缀和数组，一个标量滚动即可）</text>
</svg>
