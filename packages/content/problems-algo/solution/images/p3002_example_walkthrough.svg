<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：nums1=[1,2,3,4,5,6]，nums2=[2,3,2,3,2,3]（n=6，名额各 3）</text>

  <!-- step 1: sets -->
  <rect x="40" y="44" width="230" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s₁ = {1,2,3,4,5,6}</text>
  <text x="155" y="82" text-anchor="middle" font-size="10" fill="#666">6 个不同值（重复先去重）</text>

  <rect x="290" y="44" width="230" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">s₂ = {2,3}</text>
  <text x="405" y="82" text-anchor="middle" font-size="10" fill="#666">虽然 2、3 各出现 3 次</text>

  <path d="M 280 100 L 280 118" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: three parts -->
  <rect x="40" y="122" width="480" height="46" fill="#fafafa" stroke="#999" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">三分：only₁={1,4,5,6}（a=4）   common={2,3}（c=2）   only₂=∅（b=0）</text>
  <text x="280" y="158" text-anchor="middle" font-size="10" fill="#888">值 1、4、5、6 只在 nums1 出现；2、3 两边都有；nums2 没有独占值</text>

  <path d="M 280 168 L 280 186" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: keep exclusive -->
  <rect x="40" y="190" width="230" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k₁ = min(4, 3) = 3</text>
  <text x="155" y="228" text-anchor="middle" font-size="10" fill="#666">独占值有 4 个，名额只有 3 个</text>
  <text x="155" y="245" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">保留 {1,4,5}，舍弃 6，剩 c₁=0</text>

  <rect x="290" y="190" width="230" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k₂ = min(0, 3) = 0</text>
  <text x="405" y="228" text-anchor="middle" font-size="10" fill="#666">nums2 无独占值可保</text>
  <text x="405" y="245" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">名额全空：剩 c₂=3</text>

  <path d="M 280 256 L 280 274" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: fill common -->
  <rect x="40" y="278" width="480" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">补公共值：min(c, c₁+c₂) = min(2, 0+3) = 2</text>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#666">2、3 塞进 nums2 的空名额 → nums2 = [2,3,2]，公共值各赚 1 个</text>

  <path d="M 280 330 L 280 348" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="40" y="352" width="480" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">s = {1,4,5} ∪ {2,3}，|s| = 3 + 0 + 2 = 5 ✓</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888">上界论证：6 个独占值装不进 3 个名额 → 6 不可达</text>
</svg>
