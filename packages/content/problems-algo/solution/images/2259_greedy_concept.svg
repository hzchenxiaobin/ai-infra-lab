<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：贪心选「删后变大」的最左位置</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">删 number[i]=digit 后，位置 i 变成 number[i+1]：变大则赚，否则删最后</text>

  <!-- ===== Case A: number = "1231", digit = '1', gain at i=0 ===== -->
  <text x="28" y="76" font-size="11" fill="#4a7a3a" font-weight="bold">情况 A：number[i+1] &gt; digit → 删此处（赚）</text>

  <text x="28" y="100" font-size="10" fill="#666">number</text>
  <text x="92" y="94" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="152" y="94" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="212" y="94" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="272" y="94" text-anchor="middle" font-size="9" fill="#888">3</text>

  <!-- digit positions highlighted: i=0 and i=3 are '1' -->
  <rect x="72" y="98" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="120" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="120" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="192" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="120" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="252" y="98" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="120" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- comparison arrow: number[1]=2 > digit=1 -->
  <path d="M 112 114 L 128 114" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="106" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2&gt;1 ✓</text>

  <!-- "删 i=0" label -->
  <rect x="56" y="140" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="94" y="156" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">删此处 i=0</text>

  <!-- result -->
  <text x="28" y="180" font-size="10" fill="#666">结果</text>
  <rect x="72" y="162" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="112" y="162" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="152" y="162" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="184" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="210" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">= "231" 最大 ✓</text>

  <!-- divider -->
  <line x1="40" y1="212" x2="520" y2="212" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Case B: number = "551", digit = '5', no gain → remove last ===== -->
  <text x="28" y="238" font-size="11" fill="#d6a040" font-weight="bold">情况 B：所有 digit 处 number[i+1] ≤ digit → 删最后一个（止损）</text>

  <text x="28" y="262" font-size="10" fill="#666">number</text>
  <text x="112" y="256" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="172" y="256" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="232" y="256" text-anchor="middle" font-size="9" fill="#888">2</text>

  <!-- i=0: '5', next='5' == digit (no gain, pass) -->
  <rect x="92" y="260" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="282" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="132" y="260" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="282" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="172" y="260" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="282" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- comparison: 5==5 (pass), 1<5 (worse) -->
  <text x="120" y="252" text-anchor="middle" font-size="9" fill="#888">5=5 过</text>
  <path d="M 172 276 L 188 276" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="268" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1&lt;5 ✗</text>

  <!-- last digit = i=1 (the second '5'), highlight for removal -->
  <rect x="132" y="260" width="40" height="32" fill="none" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="302" width="72" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="152" y="318" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">删最后 i=1</text>

  <!-- result -->
  <text x="28" y="342" font-size="10" fill="#666">结果</text>
  <rect x="92" y="324" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="346" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="132" y="324" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="346" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="190" y="346" font-size="11" fill="#b85450" font-weight="bold">= "51" 损失最小</text>

  <!-- ===== Footer note ===== -->
  <rect x="40" y="370" width="485" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="282" y="391" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">贪心判定：number[i+1] &gt; digit → 立即删 i（最左增益最大）；否则删最后出现的 digit</text>
</svg>
