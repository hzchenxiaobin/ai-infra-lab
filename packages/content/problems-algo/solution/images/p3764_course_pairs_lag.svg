<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333"
        filter="url(#rough2)">核心观察：LAG 把「前一门课」拉到同行，切出相邻对再合并计数</text>

  <!-- 用户 1 时间线 -->
  <g filter="url(#rough2)">
    <text x="36" y="46" font-size="10.5" fill="#4a7a3a" font-weight="bold">用户 1：6 门 · 均分 4.5 ✓ 顶尖</text>
    <rect x="36" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="75" text-anchor="middle" font-size="9.5" fill="#446688">Python</text>
    <rect x="112" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="75" text-anchor="middle" font-size="9.5" fill="#446688">SQL</text>
    <rect x="188" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="75" text-anchor="middle" font-size="9.5" fill="#446688">JS</text>
    <rect x="264" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="292" y="75" text-anchor="middle" font-size="9.5" fill="#446688">React</text>
    <rect x="340" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="368" y="75" text-anchor="middle" font-size="9.5" fill="#446688">Node.js</text>
    <rect x="416" y="54" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="444" y="75" text-anchor="middle" font-size="9.5" fill="#446688">Docker</text>
    <path d="M 94 71 L 107 71" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 170 71 L 183 71" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 246 71 L 259 71" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 322 71 L 335 71" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)"/>
    <path d="M 398 71 L 411 71" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)"/>
  </g>

  <!-- 用户 2 时间线 -->
  <g filter="url(#rough2)">
    <text x="36" y="110" font-size="10.5" fill="#4a7a3a" font-weight="bold">用户 2：5 门 · 均分 4.4 ✓ 顶尖</text>
    <rect x="36" y="118" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="72" y="139" text-anchor="middle" font-size="9.5" fill="#446688">Python</text>
    <rect x="128" y="118" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="164" y="139" text-anchor="middle" font-size="9.5" fill="#446688">React</text>
    <rect x="220" y="118" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="139" text-anchor="middle" font-size="9.5" fill="#446688">Node.js</text>
    <rect x="312" y="118" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="348" y="139" text-anchor="middle" font-size="9.5" fill="#446688">Docker</text>
    <rect x="404" y="118" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="440" y="139" text-anchor="middle" font-size="9.5" fill="#446688">AWS</text>
    <path d="M 110 135 L 124 135" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 202 135 L 216 135" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)"/>
    <path d="M 294 135 L 308 135" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)"/>
    <path d="M 386 135 L 400 135" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- LAG 面板 -->
  <g filter="url(#rough2)">
    <rect x="32" y="166" width="228" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="146" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">LAG 取前驱（用户 1）</text>
    <text x="44" y="204" font-size="8.5" fill="#888">当前行</text>
    <text x="108" y="204" font-size="8.5" fill="#888">prev_course</text>
    <text x="176" y="204" font-size="8.5" fill="#888">产生的对</text>
    <text x="44" y="222" font-size="9" fill="#333">Python</text>
    <text x="108" y="222" font-size="9" fill="#999" font-style="italic">NULL</text>
    <text x="176" y="222" font-size="9" fill="#999">首行，无对</text>
    <text x="44" y="240" font-size="9" fill="#333">SQL</text>
    <text x="108" y="240" font-size="9" fill="#446688">Python</text>
    <text x="176" y="240" font-size="9" fill="#446688">Python→SQL</text>
    <text x="44" y="258" font-size="9" fill="#333">Docker</text>
    <text x="108" y="258" font-size="9" fill="#446688">Node.js</text>
    <text x="176" y="258" font-size="9" fill="#b85450" font-weight="bold">Node.js→Docker</text>
    <text x="146" y="274" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">n 门课 ⇒ n−1 个对</text>
  </g>

  <!-- 计数面板 -->
  <g filter="url(#rough2)">
    <rect x="276" y="166" width="212" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="382" y="186" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">GROUP BY (first, second)</text>
    <text x="290" y="208" font-size="9.5" fill="#b85450" font-weight="bold">React → Node.js = 2</text>
    <text x="290" y="226" font-size="9.5" fill="#b85450" font-weight="bold">Node.js → Docker = 2</text>
    <text x="290" y="244" font-size="9.5" fill="#666">Python → SQL = 1</text>
    <text x="290" y="260" font-size="9.5" fill="#666">其余 4 对各 = 1</text>
    <text x="382" y="274" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">9 个对折叠成 7 组</text>
  </g>

  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">两条时间线的公共转移 React→Node、Node→Docker 各计 2 → 最常见路径置顶</text>

  <!-- 陷阱提示 -->
  <rect x="36" y="312" width="448" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle" font-size="9.5" fill="#b85450">
    <text x="260" y="328">⚠️ 名单必须在配对之前：用户 3（均分 2.8）与用户 4（仅 3 门）的相邻对</text>
    <text x="260" y="344">一旦混入 GROUP BY 计数，用户维度已折叠、无法剔除！</text>
  </g>
</svg>
