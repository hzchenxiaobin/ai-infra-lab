<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：tasks = [[1,2],[2,4],[3,2],[4,1]]</text>
  <text x="310" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序后 = [(t=1,proc=2,#0), (t=2,proc=4,#1), (t=3,proc=2,#2), (t=4,proc=1,#3)]</text>

  <!-- Column headers -->
  <text x="36" y="68" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">轮</text>
  <text x="80" y="68" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">time</text>
  <text x="140" y="68" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">事件</text>
  <text x="340" y="68" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">就绪堆 (procTime, #idx)</text>
  <text x="560" y="68" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">result</text>
  <path d="M 20 76 L 600 76" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Round 1: time=1, task 0 arrives -->
  <text x="36" y="100" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="80" y="100" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="140" y="100" font-size="10" fill="#446688" filter="url(#rough2)">堆空 → 跳到 t=1；#0 入堆</text>
  <rect x="340" y="88" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(2,#0)</text>
  <text x="560" y="100" font-size="10" fill="#bbb" filter="url(#rough2)">[]</text>

  <!-- Round 1b: pop (2,0) -->
  <text x="36" y="128" font-size="10" fill="#888" filter="url(#rough2)">①b</text>
  <text x="80" y="128" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="140" y="128" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">pop (2,#0) → 执行 #0</text>
  <text x="368" y="128" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">∅</text>
  <text x="560" y="128" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[0]</text>
  <text x="80" y="142" font-size="9" fill="#d6a040" filter="url(#rough2)">→ 3</text>

  <!-- Round 2: time=3, tasks 1,2 arrive -->
  <text x="36" y="166" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="80" y="166" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="140" y="166" font-size="10" fill="#446688" filter="url(#rough2)">#1(t=2), #2(t=3) 同时入堆</text>
  <rect x="340" y="154" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="169" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">(2,#2)</text>
  <rect x="404" y="154" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="169" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(4,#1)</text>
  <text x="560" y="166" font-size="10" fill="#333" filter="url(#rough2)">[0]</text>

  <!-- Round 2b: pop (2,2) -->
  <text x="36" y="194" font-size="10" fill="#888" filter="url(#rough2)">②b</text>
  <text x="80" y="194" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="140" y="194" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">proc 同为 2 → index 小 → 选 #2</text>
  <rect x="404" y="182" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(4,#1)</text>
  <text x="560" y="194" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[0,2]</text>
  <text x="80" y="208" font-size="9" fill="#d6a040" filter="url(#rough2)">→ 5</text>

  <!-- Round 3: time=5, task 3 arrives -->
  <text x="36" y="232" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="80" y="232" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="140" y="232" font-size="10" fill="#446688" filter="url(#rough2)">#3(t=4) 入堆，proc=1 最短</text>
  <rect x="340" y="220" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="235" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">(1,#3)</text>
  <rect x="404" y="220" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="235" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(4,#1)</text>
  <text x="560" y="232" font-size="10" fill="#333" filter="url(#rough2)">[0,2]</text>

  <!-- Round 3b: pop (1,3) -->
  <text x="36" y="260" font-size="10" fill="#888" filter="url(#rough2)">③b</text>
  <text x="80" y="260" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="140" y="260" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">pop (1,#3) → 执行 #3</text>
  <rect x="404" y="248" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="263" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(4,#1)</text>
  <text x="560" y="260" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[0,2,3]</text>
  <text x="80" y="274" font-size="9" fill="#d6a040" filter="url(#rough2)">→ 6</text>

  <!-- Round 4: time=6, pop (4,1) -->
  <text x="36" y="298" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">④</text>
  <text x="80" y="298" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="140" y="298" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">无新任务，pop (4,#1) → 执行 #1</text>
  <text x="368" y="298" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">∅</text>
  <text x="560" y="298" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[0,2,3,1]</text>
  <text x="80" y="312" font-size="9" fill="#d6a040" filter="url(#rough2)">→ 10</text>

  <!-- Separator -->
  <path d="M 20 326 L 600 326" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="40" y="352" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">最终顺序：</text>
  <rect x="130" y="340" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">#0</text>
  <text x="190" y="358" font-size="11" fill="#555" filter="url(#rough2)">→</text>
  <rect x="208" y="340" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="233" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">#2</text>
  <text x="268" y="358" font-size="11" fill="#555" filter="url(#rough2)">→</text>
  <rect x="286" y="340" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="311" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">#3</text>
  <text x="346" y="358" font-size="11" fill="#555" filter="url(#rough2)">→</text>
  <rect x="364" y="340" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="389" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">#1</text>
  <text x="430" y="358" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">= [0,2,3,1]</text>

  <!-- Key observations -->
  <rect x="40" y="386" width="540" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="408" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">关键观察：</text>
  <text x="56" y="426" font-size="10" fill="#555" filter="url(#rough2)">• 轮 ②：#1 先到但 proc=4 更长，#2 后到但 proc=2 更短 → 选 #2（堆按 proc 排序，非按到达序）</text>
  <text x="56" y="442" font-size="10" fill="#555" filter="url(#rough2)">• 轮 ③：#3 入队时间 t=4，但 CPU 到 t=5 才空闲 → #3 在 t=5 入堆而非 t=4</text>
  <text x="56" y="458" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ time 由「上一次执行结束时间」驱动，入队时间只决定何时可入堆，不决定何时执行</text>
</svg>
