<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分答案 + 滑动窗口计数</text>

  <!-- Step 1: prefix sum -->
  <rect x="160" y="46" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">① 预处理前缀和 P[0..n]</text>
  <text x="280" y="79" text-anchor="middle" font-size="10.5" fill="#555">P[0]=0, P[i]=P[i−1]+nums[i−1]</text>

  <!-- arrow -->
  <path d="M 280 86 L 280 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: define sumFirstK -->
  <rect x="130" y="104" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">② 定义 sumFirstK(k)</text>
  <text x="280" y="137" text-anchor="middle" font-size="10.5" fill="#555">返回前 k 小子数组和之和</text>

  <!-- arrow -->
  <path d="M 280 144 L 280 158" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: binary search for v -->
  <rect x="120" y="162" width="320" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">③ 二分找第 k 小的值 v</text>
  <text x="280" y="198" text-anchor="middle" font-size="10.5" fill="#555">区间 [min(nums), sum(nums)]，找最小 v 使 count(≤v) ≥ k</text>

  <!-- arrow to diamond -->
  <path d="M 280 210 L 280 226" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond: count(mid) >= k ? -->
  <polygon points="280,230 400,288 280,346 160,288" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">count_and_sum(mid)</text>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">.count ≥ k ?</text>

  <!-- Yes branch (left): hi = mid -->
  <path d="M 160 288 L 110 288" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="138" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="6" y="266" width="104" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="284" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">v 可能更小</text>
  <text x="58" y="300" text-anchor="middle" font-size="10.5" fill="#555">hi = mid</text>

  <!-- No branch (right): lo = mid+1 -->
  <path d="M 400 288 L 450 288" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="422" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 ✗</text>
  <rect x="450" y="266" width="104" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="502" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v 更大</text>
  <text x="502" y="300" text-anchor="middle" font-size="10.5" fill="#555">lo = mid+1</text>

  <!-- loop back arrows -->
  <path d="M 58 266 L 58 190 L 120 190" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 502 266 L 502 190 L 440 190" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="280" y="252" text-anchor="middle" font-size="9.5" fill="#aaa">lo ≤ hi 时循环 ↑</text>

  <!-- arrow down to count_and_sum detail -->
  <path d="M 280 346 L 280 366" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="360" font-size="10" fill="#aaa">lo &gt; hi 结束</text>

  <!-- Step 4: count_and_sum(v) -->
  <rect x="110" y="370" width="340" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">④ 对 v 调用 count_and_sum(v)</text>
  <text x="280" y="405" text-anchor="middle" font-size="10.5" fill="#555">滑动窗口得 (cnt, sm)；sumFirstK(k) = sm − (cnt−k)×v</text>

  <!-- arrow -->
  <path d="M 280 418 L 280 432" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: final answer -->
  <rect x="120" y="436" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">⑤ ans = sumFirstK(right) − sumFirstK(left−1)</text>
  <text x="280" y="472" text-anchor="middle" font-size="10.5" fill="#555">对 10⁹+7 取模后返回</text>

  <!-- footer note -->
  <rect x="60" y="494" width="440" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="508" text-anchor="middle" font-size="10" fill="#888">nums 全正 → P 单调 → count_and_sum 内滑动窗口 O(n)</text>
</svg>
