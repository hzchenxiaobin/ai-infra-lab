<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：points=[[2,1],[2,2],[3,3]], angle=90, location=[1,1]</text>

  <!-- Step A: compute angles -->
  <text x="30" y="56" font-size="12" fill="#888" font-weight="bold">① 求极角（dx=xi−1, dy=yi−1）</text>

  <rect x="30" y="64" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="105" y="82" text-anchor="middle" font-size="11" fill="#333">[2,1]: dx=1,dy=0</text>
  <text x="105" y="97" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">θ=0°</text>

  <rect x="200" y="64" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="275" y="82" text-anchor="middle" font-size="11" fill="#333">[2,2]: dx=1,dy=1</text>
  <text x="275" y="97" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">θ=45°</text>

  <rect x="370" y="64" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="455" y="82" text-anchor="middle" font-size="11" fill="#333">[3,3]: dx=2,dy=2</text>
  <text x="455" y="97" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">θ=45°</text>

  <!-- Step B: sorted + duplicated -->
  <text x="30" y="130" font-size="12" fill="#888" font-weight="bold">② 排序 + 拼接（+360° 复制一份）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="140" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="70" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0°</text>
    <rect x="100" y="140" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="130" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">45°</text>
    <rect x="160" y="140" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="190" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">45°</text>
    <rect x="220" y="140" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="250" y="160" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">360°</text>
    <rect x="280" y="140" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="310" y="160" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">405°</text>
    <rect x="340" y="140" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="370" y="160" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">405°</text>
  </g>
  <text x="40" y="186" font-size="10" fill="#888">原数组（绿）</text>
  <text x="220" y="186" font-size="10" fill="#888">拼接 +360°（橙）</text>

  <!-- Step C: sliding window steps -->
  <text x="30" y="216" font-size="12" fill="#888" font-weight="bold">③ 滑动窗口（angle=90°，θ[r]−θ[l]≤90 即合法）</text>

  <!-- row 1: l=0, r=0,1,2 -->
  <text x="30" y="244" font-size="11" fill="#444">r=0,1,2：</text>
  <g filter="url(#rough2)">
    <rect x="90" y="230" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="120" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0°</text>
    <rect x="150" y="230" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="180" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">45°</text>
    <rect x="210" y="230" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="240" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">45°</text>
    <rect x="270" y="230" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="330" y="230" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="390" y="230" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <text x="90" y="272" font-size="10" fill="#b85450" font-weight="bold">↑l</text>
  <text x="250" y="272" font-size="10" fill="#4a7a3a" font-weight="bold">↑r</text>
  <rect x="460" y="232" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="520" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">跨度 45°≤90 ✓</text>
  <text x="460" y="272" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans = 3 ★</text>

  <!-- row 2: r=3 (360), l pushed -->
  <text x="30" y="312" font-size="11" fill="#444">r=3：</text>
  <g filter="url(#rough2)">
    <rect x="90" y="298" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="150" y="298" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="180" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">45°</text>
    <rect x="210" y="298" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="240" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">45°</text>
    <rect x="270" y="298" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="300" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">360°</text>
    <rect x="330" y="298" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="390" y="298" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <text x="180" y="340" font-size="10" fill="#b85450" font-weight="bold">↑l(被推到1)</text>
  <text x="300" y="340" font-size="10" fill="#4a7a3a" font-weight="bold">↑r</text>
  <rect x="460" y="300" width="130" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="525" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">360−0&gt;90 → l++</text>
  <text x="460" y="340" font-size="10.5" fill="#888">窗口缩到 3 个，ans 仍 3</text>

  <!-- Result -->
  <rect x="30" y="370" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="394" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">窗口最大 = 3，extra = 0（无重合点）</text>
  <text x="300" y="414" text-anchor="middle" font-size="12.5" fill="#333">答案 = 3 + 0 = 3 ✓</text>
</svg>
