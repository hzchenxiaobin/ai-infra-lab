<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4, 14, 2]，总距离 = 6</text>

  <!-- binary representation header -->
  <text x="40" y="58" font-size="12" fill="#888">4  = 0 1 0 0</text>
  <text x="40" y="76" font-size="12" fill="#888">14 = 1 1 1 0</text>
  <text x="40" y="94" font-size="12" fill="#888">2  = 0 0 1 0</text>
  <text x="40" y="112" font-size="10.5" fill="#4a7a3a" font-weight="bold">n = 3</text>

  <!-- table header -->
  <rect x="180" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">位 k</text>
  <rect x="260" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c (1 的个数)</text>
  <rect x="340" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n−c (0 的个数)</text>
  <rect x="420" y="44" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="475" y="63" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c × (n−c)</text>

  <!-- row bit3: 0,1,0 -> c=1, n-c=2, contrib=2 -->
  <rect x="180" y="76" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="95" text-anchor="middle" font-size="12.5" fill="#333">bit3</text>
  <rect x="260" y="76" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="95" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="340" y="76" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="95" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <rect x="420" y="76" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="95" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- row bit2: 1,1,0 -> c=2, n-c=1, contrib=2 -->
  <rect x="180" y="108" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="127" text-anchor="middle" font-size="12.5" fill="#333">bit2</text>
  <rect x="260" y="108" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="127" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="340" y="108" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="127" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="420" y="108" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="127" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- row bit1: 0,1,1 -> c=2, n-c=1, contrib=2 -->
  <rect x="180" y="140" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="159" text-anchor="middle" font-size="12.5" fill="#333">bit1</text>
  <rect x="260" y="140" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="159" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="340" y="140" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="159" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <rect x="420" y="140" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="159" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- row bit0: 0,0,0 -> c=0, n-c=3, contrib=0 -->
  <rect x="180" y="172" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="191" text-anchor="middle" font-size="12.5" fill="#333">bit0</text>
  <rect x="260" y="172" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="191" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <rect x="340" y="172" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="191" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <rect x="420" y="172" width="110" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="191" text-anchor="middle" font-size="12.5" fill="#888">0</text>

  <!-- sum row -->
  <rect x="180" y="214" width="230" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="295" y="235" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">总和 Σ</text>
  <rect x="420" y="214" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="475" y="235" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">6 ✓</text>

  <!-- verification: pairwise hamming -->
  <rect x="40" y="270" width="480" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">验证：与朴素两两异或一致</text>
  <text x="60" y="316" font-size="11.5" fill="#555">HD(4, 14) = popcount(0100 ⊕ 1110) = popcount(1010) = 2</text>
  <text x="60" y="336" font-size="11.5" fill="#555">HD(4, 2)  = popcount(0100 ⊕ 0010) = popcount(0110) = 2</text>
  <text x="60" y="356" font-size="11.5" fill="#555">HD(14, 2) = popcount(1110 ⊕ 0010) = popcount(1100) = 2</text>
  <text x="60" y="376" font-size="12.5" fill="#b85450" font-weight="bold">合计 = 2 + 2 + 2 = 6  ✓ 两种方法结果一致</text>
</svg>
