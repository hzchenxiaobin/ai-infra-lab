<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：后序 DFS + 维护 top-2 异字链</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">dfs(node) 返回「以本节点为起点的最长向下链长」，副作用更新全局 ans</text>

  <!-- Step 1 -->
  <rect x="100" y="52" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="11" fill="#333">① 建子节点表 children[]，全局 ans = 1</text>
  <!-- arrow -->
  <path d="M 260 80 L 260 90" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="100" y="92" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="11" fill="#333">② dfs(node)：max1 = 0, max2 = 0</text>
  <path d="M 260 120 L 260 130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 (loop start) -->
  <rect x="100" y="132" width="320" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#333">③ for child in children[node]  ←─────────┐</text>
  <path d="M 260 160 L 260 170" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 (recursive call) -->
  <rect x="100" y="172" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#333">④ chain = dfs(child)  ← 递归</text>
  <path d="M 260 200 L 260 210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 (key condition) -->
  <rect x="80" y="212" width="360" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤ if s[child] ≠ s[node]：更新 max1/max2（保留 top-2）</text>
  <text x="260" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold"></text>
  <path d="M 260 244 L 260 254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6 (loop back) -->
  <rect x="100" y="256" width="320" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#333">⑥ 还有 child? ── Y ── 回到 ③ ──────────┘</text>
  <path d="M 260 284 L 260 294" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop-back arrow (right side) -->
  <path d="M 420 269 L 450 269 L 450 145 L 420 145" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 7 (answer update) -->
  <rect x="100" y="296" width="320" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑦ ans = max(ans, 1 + max1 + max2)</text>
  <path d="M 260 324 L 260 334" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 8 (return) -->
  <rect x="100" y="336" width="320" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑧ return 1 + max1</text>

  <!-- Side annotations -->
  <text x="48" y="190" font-size="9" fill="#446688">递归</text>
  <text x="48" y="231" font-size="9" fill="#d6a040">关键</text>
  <text x="48" y="314" font-size="9" fill="#4a7a3a">聚合</text>
  <text x="48" y="354" font-size="9" fill="#4a7a3a">返回</text>
</svg>
