<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个 1 的耗时 = max(排队延迟 ans+1, 穿越代价 zeros)</text>

  <!-- divider -->
  <line x1="300" y1="46" x2="300" y2="250" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ============ Scenario A (left): 0001, crossing cost dominates ============ -->
  <text x="150" y="60" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">情形 A：0001（穿越代价主导）</text>

  <!-- cells 0 0 0 1 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="74" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="60"  y="97" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">0</text>
    <rect x="80"  y="74" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="100" y="97" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">0</text>
    <rect x="120" y="74" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="140" y="97" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">0</text>
    <rect x="160" y="74" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="180" y="97" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- arrow: the 1 leaping left over the three zeros -->
  <path d="M 180 70 Q 100 36 60 70" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="110" y="34" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">跨过 3 个 0，每秒 1 个</text>

  <!-- sim trace -->
  <text x="150" y="138" text-anchor="middle" font-size="11" fill="#666">0001 → 0010 → 0100 → 1000</text>

  <!-- constraint values -->
  <text x="150" y="166" text-anchor="middle" font-size="12" fill="#444">zeros = <tspan fill="#446688" font-weight="bold">3</tspan>，ans+1 = 0+1 = <tspan fill="#446688" font-weight="bold">1</tspan></text>
  <text x="150" y="186" text-anchor="middle" font-size="12" fill="#444">max(1, 3) = <tspan fill="#b85450" font-weight="bold">3</tspan></text>

  <!-- result -->
  <rect x="80" y="206" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">耗时 = 3 秒</text>

  <!-- ============ Scenario B (right): 0111, queueing delay dominates ============ -->
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">情形 B：0111（排队延迟主导）</text>

  <!-- cells 0 1 1 1 -->
  <g filter="url(#rough2)">
    <rect x="330" y="74" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="350" y="97" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">0</text>
    <rect x="370" y="74" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="390" y="97" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
    <rect x="410" y="74" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="430" y="97" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
    <rect x="450" y="74" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="470" y="97" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  </g>

  <!-- "train" bracket under the three 1s -->
  <path d="M 370 116 L 370 122 L 490 122 L 490 116" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="430" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">连串 1 排队，逐个放行</text>

  <!-- per-1 timing tags -->
  <text x="390" y="158" text-anchor="middle" font-size="11" fill="#888">第 1 个：1 秒</text>
  <text x="430" y="158" text-anchor="middle" font-size="11" fill="#888">第 2 个：2 秒</text>
  <text x="470" y="158" text-anchor="middle" font-size="11" fill="#888">第 3 个：3 秒</text>

  <!-- sim trace -->
  <text x="460" y="184" text-anchor="middle" font-size="11" fill="#666">0111 → 1011 → 1101 → 1110</text>

  <!-- constraint values -->
  <text x="460" y="206" text-anchor="middle" font-size="12" fill="#444">zeros = <tspan fill="#446688" font-weight="bold">1</tspan>，ans: 1 → 2 → 3</text>

  <!-- result -->
  <rect x="390" y="216" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="238" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">耗时 = 3 秒</text>

  <!-- ============ Formula box ============ -->
  <rect x="80" y="278" width="440" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="302" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">扫描到 1 且 zeros &gt; 0 时：</text>
  <text x="300" y="326" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">ans = max(ans + 1, zeros)</text>

  <!-- ============ Insight box ============ -->
  <rect x="80" y="356" width="440" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="378" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">两个约束的物理意义</text>
  <text x="300" y="400" text-anchor="middle" font-size="12" fill="#446688">穿越代价 zeros：1 每秒最多跨过一个 0，至少要 zeros 秒</text>
  <text x="300" y="420" text-anchor="middle" font-size="12" fill="#d6a040">排队延迟 ans+1：连串 1 必须逐个放行，后一个比前一个多 1 秒</text>
  <text x="300" y="438" text-anchor="middle" font-size="11" fill="#888">二者取大：瓶颈在哪边，耗时由哪边决定</text>
</svg>
