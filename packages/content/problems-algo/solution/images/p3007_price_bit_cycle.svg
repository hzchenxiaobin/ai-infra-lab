<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：只数计费位（x 的倍数位）上的 1；第 i 位以 2^i 为周期</text>

  <!-- Section A: bits of 13 -->
  <text x="260" y="58" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">例：num = 13 = 1101₂，x = 2 → 计费位 = 第 2, 4, 6, 8 位（橙色格子）</text>

  <text x="86" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="135" y="76" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="184" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="233" y="76" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="282" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="331" y="76" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="380" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <text x="429" y="76" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="42" y="76" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">位号</text>

  <rect x="66" y="80" width="41" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="86" y="102" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <rect x="115" y="80" width="41" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="102" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="80" width="41" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="184" y="102" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <rect x="213" y="80" width="41" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="102" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="262" y="80" width="41" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="282" y="102" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <rect x="311" y="80" width="41" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="102" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="360" y="80" width="41" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="380" y="102" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <rect x="409" y="80" width="41" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="429" y="102" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">price(13) = 位2 + 位4 + 位6 + 位8 = 0 + 1 + 0 + 0 = 1（数 1 的个数，不加权值）</text>

  <!-- Section B: period of bit i -->
  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">第 i 位的取值随整数 0, 1, 2, … 循环（以 i = 2 为例）：</text>

  <text x="67" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="102" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="137" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="172" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="207" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="242" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="277" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="312" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="347" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">8</text>
  <text x="382" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">9</text>
  <text x="415" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">10</text>
  <text x="450" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">11</text>

  <rect x="52" y="186" width="30" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="67" y="204" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="87" y="186" width="30" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="102" y="204" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="122" y="186" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="137" y="204" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="157" y="186" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="204" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="192" y="186" width="30" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="207" y="204" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="227" y="186" width="30" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="204" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="262" y="186" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="277" y="204" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="297" y="186" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="312" y="204" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="332" y="186" width="30" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="347" y="204" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="367" y="186" width="30" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="382" y="204" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="402" y="186" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="417" y="204" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="437" y="186" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="452" y="204" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- period dashed rects -->
  <rect x="48" y="182" width="140" height="34" fill="none" stroke="#4a7a3a" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="190" y="182" width="140" height="34" fill="none" stroke="#4a7a3a" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="332" y="182" width="140" height="34" fill="none" stroke="#4a7a3a" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- sub brackets under first period -->
  <path d="M 52 224 L 52 230 L 117 230 L 117 224" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="84" y="244" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2^(i−1) 个 0</text>
  <path d="M 122 224 L 122 230 L 187 230 L 187 224" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="154" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2^(i−1) 个 1</text>

  <text x="260" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">周期 2^i = 4</text>
  <text x="402" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">周期 2^i = 4</text>

  <text x="260" y="268" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">整数每走一个周期 2^i，第 i 位恰好贡献 2^(i−1) 个 1（零头先补齐 0 段，多出的才是 1）</text>

  <!-- Section C: formula -->
  <rect x="40" y="286" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">C(num, i) = ⌊(num+1) / 2^i⌋ × 2^(i−1) + max(0, (num+1) mod 2^i − 2^(i−1))</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">完整周期个数 × 每块的 1 数 ＋ 零头里超出 0 段的部分</text>

  <rect x="40" y="356" width="440" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">累加价格 acc(num) = Σ C(num, i)，其中 i 只取 x, 2x, 3x, …（计费位）</text>
  <text x="260" y="388" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">acc 单调不减 ⇒ 「acc ≤ k」有二段性 ⇒ 二分答案</text>
</svg>
