<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：坍缩成组号 0/1/2，答案 = 组号数组的逆序对数</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 2：nums = [9,7,5,3]，a = 4，b = 8 ⇒ 组号数组 g = [2,1,1,0]</text>

  <rect x="412" y="54" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="432" y="65" font-size="9.5" fill="#33507a" filter="url(#rough2)">x &lt; a → 0</text>
  <rect x="412" y="74" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="432" y="85" font-size="9.5" fill="#3a6130" filter="url(#rough2)">a ≤ x ≤ b → 1</text>
  <rect x="412" y="94" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="432" y="105" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">x &gt; b → 2</text>

  <text x="48" y="80" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">原数组</text>

  <rect x="112" y="60" width="60" height="34" rx="4" fill="#fffdf7" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="180" y="60" width="60" height="34" rx="4" fill="#fffdf7" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="60" width="60" height="34" rx="4" fill="#fffdf7" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="316" y="60" width="60" height="34" rx="4" fill="#fffdf7" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="142" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="210" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="278" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="346" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="142" y="106" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="210" y="106" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="278" y="106" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="346" y="106" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>

  <path d="M 142 110 L 142 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 210 110 L 210 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 278 110 L 278 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 346 110 L 346 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="48" y="126" font-size="9.5" fill="#888" filter="url(#rough2)">按与 a、b 的大小关系映射</text>

  <text x="48" y="154" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">组号 g</text>

  <rect x="112" y="132" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="180" y="132" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="248" y="132" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="316" y="132" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="142" y="154" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="210" y="154" text-anchor="middle" font-size="13" fill="#3a6130" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="278" y="154" text-anchor="middle" font-size="13" fill="#3a6130" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="346" y="154" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">0</text>

  <path d="M 142 168 C 142 192, 210 192, 210 168" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 142 168 C 142 216, 278 216, 278 168" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 142 168 C 142 242, 346 242, 346 168" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 210 168 C 210 208, 346 208, 346 168" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 278 168 C 278 190, 346 190, 346 168" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每条红弧 = 一对 i &lt; j 且 g[i] &gt; g[j]（前面的大数压住后面的小数）—— 共 5 个逆序对</text>

  <rect x="30" y="278" width="460" height="68" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans = 逆序对总数 = 5（输出前 mod 10⁹ + 7）</text>
  <text x="260" y="318" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">一次相邻交换至多消除 1 个逆序对 ⇒ 至少 5 次</text>
  <text x="260" y="336" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">冒泡式交换每次恰好消除 1 个 ⇒ 5 次一定可行，上下界在 5 处吻合</text>
</svg>
