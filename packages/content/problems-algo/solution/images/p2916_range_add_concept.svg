<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：右端点右移，D 数组只做一次「区间 +1」</text>

  <text x="383" y="48" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">r = 3，新来 x = 2</text>
  <path d="M 383 52 L 383 62" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>

  <text x="56" y="86" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">nums</text>
  <rect x="120" y="60" width="70" height="44" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="88" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="196" y="60" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="231" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="272" y="60" width="70" height="44" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="307" y="88" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="348" y="60" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <text x="155" y="120" text-anchor="middle" font-size="11" fill="#999">下标 0</text>
  <text x="231" y="120" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">下标 1</text>
  <text x="307" y="120" text-anchor="middle" font-size="11" fill="#999">下标 2</text>
  <text x="383" y="120" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">下标 3</text>

  <text x="231" y="147" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">↑ p = 1：x 上次出现的位置</text>

  <text x="56" y="190" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">D(r=2)</text>
  <rect x="120" y="170" width="70" height="32" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="191" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="196" y="170" width="70" height="32" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="231" y="191" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="272" y="170" width="70" height="32" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="307" y="191" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="348" y="170" width="70" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="383" y="191" text-anchor="middle" font-size="12" fill="#bbb">—</text>

  <path d="M 148 210 L 148 246" fill="none" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="164" y="226" font-size="12" fill="#d6a040" font-weight="bold">区间 [p+1, r] = [2, 3]</text>
  <text x="164" y="243" font-size="12" fill="#d6a040" font-weight="bold">整体 +1</text>

  <text x="56" y="274" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">D(r=3)</text>
  <rect x="120" y="254" width="70" height="32" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="275" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="196" y="254" width="70" height="32" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="231" y="275" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="272" y="254" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="307" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="348" y="254" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <text x="155" y="300" text-anchor="middle" font-size="11" fill="#999">不变</text>
  <text x="231" y="300" text-anchor="middle" font-size="11" fill="#999">不变</text>
  <text x="307" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="383" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>

  <rect x="30" y="318" width="500" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">为什么恰好是这一段？</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#555">起点 i ≥ 2 的子数组 nums[i..2] 里还没有 2 —— 新来的 2 是「新面孔」，D[i] 加一</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#555">起点 i ≤ 1 的子数组已经含有 2 —— 不同计数不变</text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#555">→ 每轮只需对 D 的区间 [p+1, r] 整体 +1（p = 新值的上次出现位置）</text>
</svg>
