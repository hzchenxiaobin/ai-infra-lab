<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：闭包 = 「函数 + 它捕获的外层变量」，状态藏在函数里</text>

  <!-- Outer scope: createCounter(n) -->
  <rect x="40" y="56" width="340" height="290" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="80" font-size="13" fill="#446688" font-weight="bold">createCounter(n)  ← 外层函数</text>

  <!-- captured variable n -->
  <rect x="70" y="100" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="118" text-anchor="middle" font-size="11" fill="#888">捕获的变量</text>
  <text x="140" y="134" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n</text>
  <text x="225" y="124" font-size="11" fill="#888">（来自参数，被内层函数</text>
  <text x="225" y="138" font-size="11" fill="#888">「随身携带」）</text>

  <!-- inner function -->
  <rect x="70" y="170" width="280" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="90" y="192" font-size="12" fill="#4a7a3a" font-weight="bold">内层函数 counter()</text>
  <text x="90" y="212" font-size="11" fill="#333">每次调用：返回当前 n，再 n += 1</text>
  <text x="90" y="228" font-size="11" fill="#888">它「记住」了外层的 n，外层已返回也不丢</text>

  <!-- return arrow -->
  <text x="370" y="200" font-size="11" fill="#b85450" font-weight="bold">return →</text>
  <path d="M 360 205 L 430 205" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- inner function references captured n -->
  <path d="M 140 170 L 140 140" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="158" font-size="10" fill="#4a7a3a">读+写</text>

  <!-- returned closure lives outside -->
  <rect x="430" y="150" width="150" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回的闭包</text>
  <text x="505" y="192" text-anchor="middle" font-size="11" fill="#333">= 函数 + 捕获的 n</text>
  <text x="505" y="208" text-anchor="middle" font-size="10" fill="#888">外部可反复 counter() 调用</text>

  <!-- key insight box -->
  <rect x="60" y="300" width="490" height="40" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="305" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：n 的「归属权」交给内层函数</text>
  <text x="305" y="334" text-anchor="middle" font-size="11" fill="#888">不靠全局变量，状态被封装进函数本身 → 调一次涨一次，互不干扰</text>

  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#888">⚠️ 对照反例：用全局变量 g 计数 → 多个 counter 会互相串台</text>
</svg>
