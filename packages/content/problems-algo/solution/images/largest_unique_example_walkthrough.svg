<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：计数 → 从高扫到低</text>

  <!-- ============ Example 1 ============ -->
  <text x="40" y="50" font-size="12" fill="#446688" font-weight="bold">示例 1：A = [5,7,3,9,4,9,8,4,9,3]</text>

  <!-- input row: 10 cells w=34 gap=2 start=82 -->
  <text x="40" y="72" font-size="10" fill="#888">输入：</text>
  <g filter="url(#rough2)">
    <rect x="82"  y="60" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="118" y="60" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="60" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="60" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="226" y="60" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="60" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="298" y="60" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="334" y="60" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="60" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="406" y="60" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">
    <text x="99"  y="75">5</text>
    <text x="135" y="75">7</text>
    <text x="171" y="75">3</text>
    <text x="207" y="75">9</text>
    <text x="243" y="75">4</text>
    <text x="279" y="75">9</text>
    <text x="315" y="75" fill="#b85450">8</text>
    <text x="351" y="75">4</text>
    <text x="387" y="75">9</text>
    <text x="423" y="75">3</text>
  </g>

  <!-- freq table header -->
  <text x="40" y="104" font-size="10" fill="#888">频率表（降序）：</text>
  <!-- 6 buckets: 9->3 8->1 7->1 5->1 4->2 3->2 ; w=60 gap=8 start=120 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="120" y="92" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="150" y="109" fill="#333" font-weight="bold">9: 3</text>
    <rect x="188" y="92" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="218" y="109" fill="#d6a040" font-weight="bold">8: 1</text>
    <rect x="256" y="92" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="286" y="109" fill="#333" font-weight="bold">7: 1</text>
    <rect x="324" y="92" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="354" y="109" fill="#333" font-weight="bold">5: 1</text>
    <rect x="392" y="92" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="422" y="109" fill="#333" font-weight="bold">4: 2</text>
    <rect x="460" y="92" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="490" y="109" fill="#333" font-weight="bold">3: 2</text>
  </g>

  <!-- scan -->
  <text x="40" y="136" font-size="10" fill="#888">从高扫：9(cnt=3 跳过) → 8(cnt=1 命中)</text>
  <rect x="160" y="144" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 8 ✓</text>

  <line x1="40" y1="186" x2="500" y2="186" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Example 2 ============ -->
  <text x="40" y="208" font-size="12" fill="#b85450" font-weight="bold">示例 2：A = [9,9,8,8]</text>

  <!-- input row: 4 cells -->
  <text x="40" y="230" font-size="10" fill="#888">输入：</text>
  <g filter="url(#rough2)">
    <rect x="82"  y="218" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="118" y="218" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="218" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="218" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" font-weight="bold" text-anchor="middle">
    <text x="99"  y="233">9</text>
    <text x="135" y="233">9</text>
    <text x="171" y="233">8</text>
    <text x="207" y="233">8</text>
  </g>

  <!-- freq table -->
  <text x="40" y="262" font-size="10" fill="#888">频率表（降序）：</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="150" y="250" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="185" y="267" fill="#333" font-weight="bold">9: 2</text>
    <rect x="230" y="250" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="265" y="267" fill="#333" font-weight="bold">8: 2</text>
    <rect x="310" y="250" width="120" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" stroke-dasharray="4,3"/>
    <text x="370" y="267" fill="#888">其余 cnt=0</text>
  </g>

  <!-- scan -->
  <text x="40" y="294" font-size="10" fill="#888">从高扫：9(cnt=2 跳过) → 8(cnt=2 跳过) → … → 0 全 0，无命中</text>
  <rect x="160" y="302" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 -1 ✗</text>

  <!-- takeaway -->
  <rect x="40" y="352" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="372" font-size="11" fill="#444" font-weight="bold">要点：</text>
  <text x="56" y="390" font-size="11" fill="#444">• 唯一数 = cnt == 1 的值；求"最大"的 → 从高往低扫，命中即停。</text>
  <text x="56" y="406" font-size="11" fill="#444">• 全程无需排序：频率表已隐含所有值的计数，扫描顺序即得最大。</text>
</svg>
