<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">栈迭代：孩子逆序入栈（右→左）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">栈是 LIFO，要让孩子从左到右出栈，必须从右到左入栈</text>

  <!-- 左侧：树 -->
  <text x="120" y="72" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">N 叉树</text>
  <circle cx="120" cy="96" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="101" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <circle cx="60" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="165" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <circle cx="120" cy="160" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="165" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <circle cx="180" cy="160" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <line x1="108" y1="108" x2="70" y2="148" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="120" y1="112" x2="120" y2="146" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="132" y1="108" x2="170" y2="148" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 孩子顺序标注 -->
  <text x="44" y="186" font-size="10" fill="#888">第1个</text>
  <text x="104" y="186" font-size="10" fill="#888">第2个</text>
  <text x="164" y="186" font-size="10" fill="#888">第3个</text>

  <!-- 中间箭头：访问顺序 左→右 -->
  <rect x="40" y="210" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="227" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">希望出栈顺序：3 → 2 → 4</text>

  <!-- 右侧：栈 -->
  <text x="380" y="72" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">显式栈（底→顶）</text>

  <!-- 入栈：先4 后2 后3 -->
  <rect x="340" y="96" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="115" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="430" y="115" font-size="10" fill="#888">先入（底）</text>

  <rect x="340" y="128" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="147" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="430" y="147" font-size="10" fill="#888">再入</text>

  <rect x="340" y="160" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="179" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="430" y="179" font-size="10" fill="#b85450" font-weight="bold">最后入（顶）⭐</text>

  <!-- 栈顶箭头 -->
  <path d="M 380 196 L 380 210" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="300" y="208" font-size="10" fill="#b85450" font-weight="bold">出栈先访问 → 3</text>

  <!-- 口诀框 -->
  <rect x="30" y="248" width="500" height="114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="272" font-size="12" fill="#333" font-weight="bold">核心口诀：访问顺序 = 从左到右，入栈顺序 = 从右到左（逆序）</text>
  <text x="50" y="294" font-size="11" fill="#555" font-family="monospace">node = stack.pop();  ans.append(node.val)</text>
  <text x="50" y="312" font-size="11" fill="#555" font-family="monospace">for c in reversed(node.children):  stack.append(c)</text>
  <text x="50" y="336" font-size="11" fill="#888">• 二叉树前序是「先右后左」入栈 → N 叉树推广为「所有孩子逆序」入栈</text>
  <text x="50" y="352" font-size="11" fill="#888">• reversed 保证第一个孩子（最左）最后入栈 → 在栈顶 → 最先出栈被访问</text>
</svg>
