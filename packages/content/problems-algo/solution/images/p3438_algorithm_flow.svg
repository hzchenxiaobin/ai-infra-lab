<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">两趟流程：先计数，再扫描相邻数对（O(n)）</text>

  <rect x="215" y="30" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 260 54 L 260 66" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="70" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="11" fill="#333">第一趟：一趟扫描统计频次</text>
  <text x="260" y="103" text-anchor="middle" font-size="11" fill="#333">cnt[c − '0']++</text>
  <path d="M 260 110 L 260 124" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="128" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#333">i = 0</text>
  <path d="M 260 152 L 260 164" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,168 335,196 260,224 185,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#333">i &lt; n − 1 ?</text>

  <path d="M 185 196 L 152 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="188" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="30" y="182" width="118" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="89" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ""</text>

  <path d="M 260 224 L 260 244" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="238" font-size="10" fill="#4a7a3a">是</text>

  <rect x="150" y="248" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#333">a = s[i]，b = s[i+1]</text>
  <path d="M 260 272 L 260 284" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,288 360,316 260,344 160,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="311" text-anchor="middle" font-size="10" fill="#333">a ≠ b 且 cnt[a] == a</text>
  <text x="260" y="325" text-anchor="middle" font-size="10" fill="#333">且 cnt[b] == b ?</text>

  <path d="M 360 316 L 386 316" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="390" y="298" width="95" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="437" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 "ab" ⭐</text>

  <path d="M 260 344 L 260 354 L 500 354 L 500 196 L 342 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="352" font-size="10" fill="#b85450">否</text>
  <text x="490" y="258" text-anchor="end" font-size="10" fill="#888">i++</text>
</svg>
