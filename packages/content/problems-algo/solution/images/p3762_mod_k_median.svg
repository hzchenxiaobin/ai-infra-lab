<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：±k 改不掉余数，商空间里找中位数</text>
  <text x="280" y="44" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1, 4, 7]，k = 3 —— 一次操作 = 某元素 ±k</text>

  <!-- 左侧：三行换算表 -->
  <text x="112" y="78" text-anchor="end" font-size="11.5" fill="#666" filter="url(#rough2)">x = nums[i]</text>
  <rect x="120" y="58" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="176" y="58" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="232" y="58" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <text x="112" y="126" text-anchor="end" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">商 b = x ÷ k</text>
  <rect x="120" y="106" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="176" y="106" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="232" y="106" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="112" y="174" text-anchor="end" font-size="11.5" fill="#d6a040" filter="url(#rough2)">余 r = x % k</text>
  <rect x="120" y="154" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="176" y="154" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="232" y="154" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="175" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="188" y="206" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">余数全同 ⇒ 可行；商每挪 1 = 一步</text>

  <!-- 右侧：观察要点框 -->
  <rect x="310" y="56" width="225" height="126" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="78" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">一次操作 = ±k</text>
  <text x="422" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⇒ x mod k 永不变（血统）</text>
  <text x="422" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⇒ 能相等 ⟺ 余数全同</text>
  <text x="422" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">血统相同才能在格点上会师</text>
  <text x="422" y="162" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">目标 T = r + k·t，t 取中位数最优</text>

  <!-- 数轴：同余格点 -->
  <text x="112" y="238" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">同余格点 …, 1, 4, 7, 10, …（模 3 余 1）</text>
  <text x="196" y="226" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">会师点 ⭐</text>
  <path d="M 70 250 L 500 250" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="70" cy="250" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="196" cy="250" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="322" cy="250" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="448" cy="250" r="7" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <circle cx="196" cy="250" r="12" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="70" y="270" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="196" y="270" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="322" y="270" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">7</text>
  <text x="448" y="270" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">10</text>

  <!-- 操作箭头 -->
  <path d="M 76 240 Q 133 210 188 242" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+k（1 步）</text>
  <path d="M 316 258 Q 262 298 208 258" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">−k（1 步）</text>

  <!-- 底部结论条 -->
  <rect x="70" y="330" width="420" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">中位数 med(b) = 1 ⇒ 会师值 = 1 + 1×3 = 4</text>
  <text x="280" y="366" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">ans = |0−1| + |1−1| + |2−1| = 2</text>
</svg>
