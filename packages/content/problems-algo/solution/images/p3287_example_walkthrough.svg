<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4,2,5,6,7]，k = 2 —— 四条分割线只有两条能出候选</text>

  <!-- 表头 -->
  <rect x="25" y="44" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="64" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">分割线 i</text>
  <rect x="85" y="44" width="152" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="64" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">F[i]（前缀恰选 2 个）</text>
  <rect x="237" y="44" width="152" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="64" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">G[i+1]（后缀恰选 2 个）</text>
  <rect x="389" y="44" width="106" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="64" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最大 s ⊕ t</text>

  <!-- 行 i=0 -->
  <rect x="25" y="76" width="60" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="85" y="76" width="152" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="161" y="101" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">∅（不足 2 个）</text>
  <rect x="237" y="76" width="152" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="313" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{6, 7}</text>
  <rect x="389" y="76" width="106" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="442" y="101" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 i=1 -->
  <rect x="25" y="118" width="60" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="85" y="118" width="152" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="161" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{6}（4|2）</text>
  <rect x="237" y="118" width="152" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="313" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7}（5|6 等）</text>
  <rect x="389" y="118" width="106" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="442" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 i=2（最优，高亮） -->
  <rect x="25" y="160" width="60" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="85" y="160" width="152" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">{5, 6, 7}</text>
  <rect x="237" y="160" width="152" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="313" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">{7}（6|7）</text>
  <rect x="389" y="160" width="106" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="185" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ★</text>

  <!-- 行 i=3 -->
  <rect x="25" y="202" width="60" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="85" y="202" width="152" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="161" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{5, 6, 7}</text>
  <rect x="237" y="202" width="152" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="313" y="227" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">∅（不足 2 个）</text>
  <rect x="389" y="202" width="106" height="42" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="442" y="227" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- 结论 -->
  <rect x="40" y="262" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 2：最优子序列 [4, 5, 6, 7]，(4 OR 5) ⊕ (6 OR 7) = 5 ⊕ 7 = 2</text>

  <!-- 备注 -->
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">F[2] 的来源：4|5 = 5，4|2 = 6，2|5 = 7</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一侧不足 k 个元素时集合为空，自动无候选，无需特判</text>
</svg>
