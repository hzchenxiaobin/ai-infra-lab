<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="700" height="430" fill="#fafafa"/>

  <text x="350" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：Friends → 分组计数 → 剔除极值 → Singing</text>

  <!-- ===== Step 1: Friends table ===== -->
  <text x="20" y="52" font-size="11" fill="#446688" font-weight="bold">① Friends 原表（6 行）</text>

  <!-- header -->
  <rect x="20" y="60" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="40" y="74" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">id</text>
  <rect x="60" y="60" width="110" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="115" y="74" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">name</text>
  <rect x="170" y="60" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="74" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">activity</text>

  <!-- row 1 Eating -->
  <rect x="20" y="80" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="93" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="60" y="80" width="110" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="93" text-anchor="middle" font-size="9" fill="#333">Jonathan D.</text>
  <rect x="170" y="80" width="100" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="220" y="93" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Eating</text>

  <!-- row 2 Singing -->
  <rect x="20" y="98" width="40" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="111" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="60" y="98" width="110" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="111" text-anchor="middle" font-size="9" fill="#333">Jade W.</text>
  <rect x="170" y="98" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="220" y="111" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Singing</text>

  <!-- row 3 Singing -->
  <rect x="20" y="116" width="40" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="129" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="60" y="116" width="110" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="129" text-anchor="middle" font-size="9" fill="#333">Victor J.</text>
  <rect x="170" y="116" width="100" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="220" y="129" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Singing</text>

  <!-- row 4 Eating -->
  <rect x="20" y="134" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="147" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="60" y="134" width="110" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="147" text-anchor="middle" font-size="9" fill="#333">Elvis Q.</text>
  <rect x="170" y="134" width="100" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="220" y="147" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Eating</text>

  <!-- row 5 Eating -->
  <rect x="20" y="152" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="165" text-anchor="middle" font-size="9" fill="#333">5</text>
  <rect x="60" y="152" width="110" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="165" text-anchor="middle" font-size="9" fill="#333">Daniel A.</text>
  <rect x="170" y="152" width="100" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="220" y="165" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Eating</text>

  <!-- row 6 Horse Riding -->
  <rect x="20" y="170" width="40" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="183" text-anchor="middle" font-size="9" fill="#333">6</text>
  <rect x="60" y="170" width="110" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="183" text-anchor="middle" font-size="9" fill="#333">Bob B.</text>
  <rect x="170" y="170" width="100" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="220" y="183" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">Horse Riding</text>

  <!-- arrow to step 2 -->
  <path d="M280 130 L325 130" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="302" y="122" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="302" y="144" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">COUNT(*)</text>

  <!-- ===== Step 2: counts table ===== -->
  <text x="345" y="52" font-size="11" fill="#4a7a3a" font-weight="bold">② 分组计数表 t（3 行）</text>

  <!-- header -->
  <rect x="345" y="60" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="410" y="74" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">activity</text>
  <rect x="475" y="60" width="55" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="502" y="74" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">cnt</text>

  <!-- Eating cnt=3 (MAX) -->
  <rect x="345" y="80" width="130" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="95" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Eating</text>
  <rect x="475" y="80" width="55" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="502" y="95" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <!-- Singing cnt=2 (KEEP) -->
  <rect x="345" y="102" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Singing</text>
  <rect x="475" y="102" width="55" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="502" y="117" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Horse Riding cnt=1 (MIN) -->
  <rect x="345" y="124" width="130" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="139" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Horse Riding</text>
  <rect x="475" y="124" width="55" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="502" y="139" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>

  <!-- MAX/MIN/keep labels -->
  <text x="545" y="95" font-size="10" fill="#b85450" font-weight="bold">← MAX</text>
  <text x="545" y="117" font-size="10" fill="#4a7a3a" font-weight="bold">← 保留</text>
  <text x="545" y="139" font-size="10" fill="#d6a040" font-weight="bold">← MIN</text>

  <!-- arrow to step 3 -->
  <path d="M550 113 L590 113" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="570" y="105" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">剔除</text>
  <text x="570" y="127" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">极值</text>

  <!-- ===== Step 3: result ===== -->
  <text x="595" y="52" font-size="11" fill="#d6a040" font-weight="bold">③ 结果</text>
  <rect x="595" y="88" width="95" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="595" y="88" width="95" height="18" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="642" y="101" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">results</text>
  <text x="642" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Singing</text>

  <!-- ===== bottom: edge case notes ===== -->
  <rect x="20" y="210" width="660" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="232" font-size="11" fill="#333" font-weight="bold">边界情况验证：</text>
  <text x="40" y="252" font-size="10.5" fill="#333">• 所有活动人数相同（如全部 cnt=2）→ MAX=MIN=2，每行都被剔除 → 结果为空 ✓（无「中间档」）</text>
  <text x="40" y="272" font-size="10.5" fill="#333">• 只有一个活动 → MAX=MIN=该活动人数 → 被剔除 → 结果为空 ✓</text>
  <text x="40" y="292" font-size="10.5" fill="#333">• 多个活动并列最大/最小 → 全部剔除，只保留严格介于之间的 ✓</text>
  <text x="40" y="304" font-size="10" fill="#b85450">⚠ 用 ≠ 而非 NOT BETWEEN：当 MAX=MIN 时 NOT BETWEEN 会误留该值，≠ 则严格剔除</text>

  <!-- ===== bottom summary ===== -->
  <rect x="20" y="324" width="660" height="96" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="346" font-size="11" fill="#446688" font-weight="bold">解法对照：</text>
  <text x="40" y="366" font-size="10.5" fill="#333">① CTE + 子查询：WITH t AS (SELECT activity, COUNT(*) cnt FROM Friends GROUP BY activity)</text>
  <text x="60" y="380" font-size="10" fill="#666">SELECT activity AS results FROM t WHERE cnt ≠ (SELECT MAX(cnt) FROM t) AND cnt ≠ (SELECT MIN(cnt) FROM t)</text>
  <text x="40" y="398" font-size="10.5" fill="#333">② 窗口函数：MAX(cnt) OVER() / MIN(cnt) OVER() 把全局极值广播到每行，外层 WHERE cnt ≠ mx AND cnt ≠ mn</text>
  <text x="40" y="414" font-size="10" fill="#d6a040">窗口写法无需子查询嵌套，语义最直观——「每行与全局极值比」</text>
</svg>
