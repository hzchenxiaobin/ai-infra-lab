<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    函数图：每人只有一个固定下家（出度 = 1）
  </text>

  <!-- left panel: example 1, pure cycle -->
  <rect x="18" y="46" width="230" height="206" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="6 5" rx="8" filter="url(#rough2)"/>
  <text x="133" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">示例① [2,0,1]：三人大环</text>

  <ellipse cx="110" cy="118" rx="17" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="123" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <ellipse cx="175" cy="195" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="200" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <ellipse cx="45" cy="195" rx="17" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="45" y="200" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">1</text>

  <path d="M121,129 L162,180" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M156,195 L66,195" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M56,181 L98,130" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="152" y="142" font-size="11" fill="#666" filter="url(#rough2)">r[0]=2</text>
  <text x="100" y="186" font-size="11" fill="#666" filter="url(#rough2)">r[2]=1</text>
  <text x="40" y="142" font-size="11" fill="#666" filter="url(#rough2)">r[1]=0</text>
  <text x="133" y="240" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">谁传给谁，唯一确定</text>

  <!-- right panel: example 2, tail + self loop -->
  <rect x="272" y="46" width="230" height="206" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="6 5" rx="8" filter="url(#rough2)"/>
  <text x="387" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">示例② [1,1,1,2,3]：尾巴 + 环</text>

  <ellipse cx="368" cy="94" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="99" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <ellipse cx="368" cy="138" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="143" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3</text>
  <ellipse cx="368" cy="182" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="187" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">2</text>
  <ellipse cx="368" cy="226" rx="16" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="368" y="231" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>

  <path d="M368,111 L368,119" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M368,155 L368,163" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M368,199 L368,207" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M382,218 C414,204 414,244 383,233" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="392" y="110" font-size="11" fill="#666" filter="url(#rough2)">r[4]=3</text>
  <text x="392" y="154" font-size="11" fill="#666" filter="url(#rough2)">r[3]=2</text>
  <text x="392" y="198" font-size="11" fill="#666" filter="url(#rough2)">r[2]=1</text>
  <text x="392" y="230" font-size="11" fill="#b85450" filter="url(#rough2)">r[1]=1 自环</text>

  <!-- shared note -->
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    从任意起点出发路线唯一 → 走足够多步后必然进环绕圈（内向基环森林）
  </text>

  <!-- f(x) meaning: touching sequence -->
  <text x="260" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    f(x)：触球序列求和（含起点 x，重复触球重复累加）
  </text>

  <text x="95" y="312" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">起点</text>
  <ellipse cx="95" cy="326" rx="14" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="331" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <ellipse cx="160" cy="326" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="331" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <ellipse cx="225" cy="326" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="331" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <ellipse cx="290" cy="326" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="331" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <ellipse cx="355" cy="326" rx="14" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="331" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <path d="M111,326 L143,326" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M176,326 L208,326" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M241,326 L273,326" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M306,326 L338,326" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="127" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">传1</text>
  <text x="192" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">传2</text>
  <text x="257" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">传3</text>
  <text x="322" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">传4</text>

  <text x="455" y="322" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">f(2) =</text>
  <text x="455" y="340" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2+1+0+2+1 = 6</text>
</svg>
