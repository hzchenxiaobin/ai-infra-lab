<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：字母产生 2 分支（小写/大写），数字只 1 分支（原样保留）</text>

  <text x="40" y="80" font-size="12" fill="#888">输入 s =</text>

  <rect x="110" y="58" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="88" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">a</text>
  <text x="145" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">字母→2 分支</text>

  <rect x="200" y="58" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="235" y="88" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="235" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">数字→1 分支</text>

  <rect x="290" y="58" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="325" y="88" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">b</text>
  <text x="325" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">字母→2 分支</text>

  <rect x="380" y="58" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="88" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="415" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">数字→1 分支</text>

  <path d="M 145 128 L 120 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 145 128 L 170 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="100" y="152" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="170" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <rect x="152" y="152" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="170" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">A</text>

  <path d="M 235 128 L 235 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="216" y="152" width="38" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <path d="M 325 128 L 300 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 325 128 L 350 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="280" y="152" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="170" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">b</text>
  <rect x="332" y="152" width="38" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="170" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>

  <path d="M 415 128 L 415 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="396" y="152" width="38" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="40" y="208" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">结果总数 = 2 × 1 × 2 × 1 = 4 = 2^k （k = 字母个数）</text>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#666">数字位不产生分支，原样追加；只有字母位让方案数翻倍</text>

  <rect x="40" y="288" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="298" font-size="10" fill="#666">字母（2 分支）</text>
  <rect x="170" y="288" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="298" font-size="10" fill="#666">数字（1 分支）</text>
  <text x="310" y="298" font-size="10" fill="#888">每个字母独立做「小写/大写」二选一，与子集的「选/不选」同构</text>
</svg>
