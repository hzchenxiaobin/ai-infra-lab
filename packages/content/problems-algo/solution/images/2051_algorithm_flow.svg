<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="580" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：三表 LEFT JOIN → GROUP BY → CASE WHEN 分级</text>

  <text x="40" y="50" font-size="9" fill="#888">SQL 执行顺序 ↓</text>

  <!-- Step 1: FROM + LEFT JOIN -->
  <rect x="90" y="54" width="360" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM Members m</text>
  <text x="270" y="88" text-anchor="middle" font-size="10" fill="#446688">LEFT JOIN Visits v ON m.mid = v.mid</text>
  <text x="270" y="102" text-anchor="middle" font-size="10" fill="#446688">LEFT JOIN Purchases p ON v.vid = p.vid</text>

  <path d="M 270 110 L 270 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY -->
  <rect x="90" y="128" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② GROUP BY member_id</text>
  <text x="270" y="160" text-anchor="middle" font-size="9" fill="#888">每位成员折叠为一组：COUNT(vid)=访问数, COUNT(amt)=购买数</text>

  <path d="M 270 170 L 270 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: CASE WHEN - decision diamond 1: Bronze check -->
  <polygon points="270,188 400,234 270,280 140,234" fill="#f3e5e5" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">③ COUNT(vid) = 0?</text>
  <text x="270" y="244" text-anchor="middle" font-size="9" fill="#999">从未访问？</text>
  <text x="270" y="260" text-anchor="middle" font-size="8" fill="#b85450">须最先判！避免除零</text>

  <!-- Yes branch (left) -> Bronze -->
  <path d="M 140 234 L 78 234" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="110" y="228" text-anchor="middle" font-size="9" fill="#999">是</text>
  <rect x="16" y="216" width="60" height="36" fill="#f3e5e5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="232" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">Bronze</text>
  <text x="46" y="246" text-anchor="middle" font-size="7" fill="#999">Narihan</text>

  <!-- No branch (down) -> next diamond -->
  <path d="M 270 280 L 270 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="294" font-size="8" fill="#888">否</text>

  <!-- Decision diamond 2: Diamond check (rate >= 80) -->
  <polygon points="270,302 400,348 270,394 140,348" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">rate ≥ 80?</text>
  <text x="270" y="358" text-anchor="middle" font-size="9" fill="#b85450">100×COUNT(amt)/COUNT(vid)</text>
  <text x="270" y="374" text-anchor="middle" font-size="8" fill="#888">≥ 80 → 钻石</text>

  <!-- Yes branch (right) -> Diamond -->
  <path d="M 400 348 L 460 348" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="342" text-anchor="middle" font-size="9" fill="#b85450">是</text>
  <rect x="464" y="330" width="62" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="346" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Diamond</text>
  <text x="495" y="360" text-anchor="middle" font-size="7" fill="#b85450">Hercy 100</text>

  <!-- No branch (down) -> next diamond -->
  <path d="M 270 394 L 270 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="408" font-size="8" fill="#888">否</text>

  <!-- Decision diamond 3: Gold check (rate >= 50) -->
  <polygon points="270,416 400,462 270,508 140,462" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="454" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">rate ≥ 50?</text>
  <text x="270" y="472" text-anchor="middle" font-size="9" fill="#d6a040">50 ≤ rate &lt; 80 → 黄金</text>

  <!-- Yes branch (right) -> Gold -->
  <path d="M 400 462 L 460 462" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="430" y="456" text-anchor="middle" font-size="9" fill="#d6a040">是</text>
  <rect x="464" y="444" width="62" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="460" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">Gold</text>
  <text x="495" y="474" text-anchor="middle" font-size="7" fill="#d6a040">Alice 50</text>

  <!-- No branch (down) -> Silver (ELSE) -->
  <path d="M 270 508 L 270 524" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="520" font-size="8" fill="#888">否</text>
  <rect x="210" y="528" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="544" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ELSE → Silver</text>
  <text x="270" y="558" text-anchor="middle" font-size="8" fill="#4a7a3a">rate &lt; 50：Bob 33 · Winston 0</text>

  <!-- side notes -->
  <rect x="16" y="128" width="66" height="120" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="22" y="142" font-size="7" fill="#888">CASE WHEN</text>
  <text x="22" y="154" font-size="7" fill="#888">顺序敏感：</text>
  <text x="22" y="166" font-size="7" fill="#999">①Bronze</text>
  <text x="22" y="178" font-size="7" fill="#b85450">②Diamond</text>
  <text x="22" y="190" font-size="7" fill="#d6a040">③Gold</text>
  <text x="22" y="202" font-size="7" fill="#4a7a3a">④Silver</text>
  <text x="22" y="218" font-size="7" fill="#b85450">Bronze 须在</text>
  <text x="22" y="230" font-size="7" fill="#b85450">除法之前判</text>
  <text x="22" y="242" font-size="7" fill="#b85450">（防除零）</text>

  <!-- bottom note -->
  <rect x="16" y="540" width="188" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="110" y="556" text-anchor="middle" font-size="9" fill="#d6a040">CASE WHEN 按顺序短路匹配</text>
  <text x="110" y="568" text-anchor="middle" font-size="8" fill="#d6a040">命中即跳后续 WHEN</text>
</svg>
