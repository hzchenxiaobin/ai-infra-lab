<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="436" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一次 O(n log n) 预处理，每查询 O(log n)</text>

  <!-- 预处理 -->
  <rect x="42" y="42" width="200" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 迭代 BFS（根 0）</text>
  <text x="142" y="79" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">parent · depth · dist（到根）</text>

  <path d="M 242 65 L 286 65" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="290" y="42" width="200" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 倍增表 up[k] 与 sw[k]</text>
  <text x="390" y="79" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2^k 级祖先 + 到它的边权和</text>

  <!-- 分隔线 -->
  <line x1="30" y1="106" x2="490" y2="106" stroke="#999" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以下对每个查询 [u, v]</text>

  <!-- 查询主链 -->
  <rect x="150" y="136" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l = LCA(u,v)（倍增）</text>
  <text x="260" y="172" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">tot = dist[u]+dist[v]−2·dist[l]</text>

  <path d="M 260 180 L 260 194" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,196 385,232 260,268 135,232" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2·d(u→l) ≥ tot ?</text>
  <text x="260" y="246" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">d(u→l) = dist[u]−dist[l]</text>

  <!-- 是 分支 -->
  <path d="M 135 232 L 134 268" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="256" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="26" y="272" width="216" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="292" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">中位在 u→l 段</text>
  <text x="134" y="310" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">y ← u；k 从高到低试跳：</text>
  <text x="134" y="327" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2·(cur+sw[k][y]) &lt; tot 才跳</text>
  <text x="134" y="348" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">ans = parent(y)</text>

  <!-- 否 分支 -->
  <path d="M 385 232 L 386 268" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="256" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="278" y="272" width="216" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="292" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">中位在 l→v 段</text>
  <text x="386" y="310" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">y ← v；k 从高到低试跳：</text>
  <text x="386" y="327" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2·(cur+sw[k][y]) ≤ tot 才跳</text>
  <text x="386" y="348" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">ans = y</text>

  <!-- 汇合 -->
  <path d="M 134 360 L 228 390" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 386 360 L 292 390" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="394" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="415" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">收集 ans（每查询 O(log n)）</text>
</svg>
