<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：建映射 → 过滤映射 → 耐心排序 LIS → 求差
  </text>

  <!-- ===== Step 1: build map ===== -->
  <rect x="60" y="50" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <ellipse cx="84" cy="78" rx="16" ry="14" fill="#4a7a3a" stroke="#2a5a1a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="82" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">1</text>
  <text x="112" y="74" font-size="12" fill="#3a5a2a" filter="url(#rough2)">建哈希映射 pos</text>
  <text x="112" y="92" font-size="10" fill="#5a5a5a" filter="url(#rough2)">遍历 target：pos[ target[i] ] = i   （target 互异 → 一一对应）</text>

  <path d="M280,108 L280,124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: filter + map ===== -->
  <rect x="60" y="128" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <ellipse cx="84" cy="156" rx="16" ry="14" fill="#446688" stroke="#224466" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="160" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">2</text>
  <text x="112" y="152" font-size="12" fill="#224466" filter="url(#rough2)">过滤 arr + 映射为下标序列 nums</text>
  <text x="112" y="170" font-size="10" fill="#5a5a5a" filter="url(#rough2)">for x in arr: if x in pos: nums.append(pos[x])   （跳过不在 target 的元素）</text>

  <path d="M280,186 L280,202" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: patience sort LIS (with decision diamond) ===== -->
  <rect x="60" y="206" width="440" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <ellipse cx="84" cy="248" rx="16" ry="14" fill="#d6a040" stroke="#8a6a1a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="252" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">3</text>
  <text x="112" y="230" font-size="12" fill="#5a4a1a" filter="url(#rough2)">耐心排序求 LIS（tails 数组 + 二分）</text>

  <!-- decision diamond -->
  <polygon points="200,252 250,240 300,252 250,264" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="256" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">x vs tails 末尾</text>

  <text x="160" y="278" font-size="9" fill="#4a7a3a" filter="url(#rough2)">≥ 末尾 → 追加</text>
  <text x="300" y="278" font-size="9" fill="#b85450" filter="url(#rough2)">&lt; 末尾 → 二分替换</text>

  <path d="M215,262 L185,272" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M285,262 L315,272" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M280,292 L280,308" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: answer ===== -->
  <rect x="60" y="312" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <ellipse cx="84" cy="340" rx="16" ry="14" fill="#b85450" stroke="#8a3030" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="344" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">4</text>
  <text x="112" y="336" font-size="12" fill="#8a3030" filter="url(#rough2)">返回答案</text>
  <text x="112" y="354" font-size="10" fill="#5a5a5a" filter="url(#rough2)">return len(target) − len(tails)   （LIS 长度 = len(tails)）</text>

  <!-- ===== Bottom: complexity ===== -->
  <rect x="60" y="380" width="440" height="32" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    时间 O(n + m log m)   空间 O(n + m)    n=len(target), m=len(arr)
  </text>
</svg>
