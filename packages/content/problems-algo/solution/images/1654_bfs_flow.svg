<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">BFS 算法流程</text>

  <!-- 起点：队列初始化 -->
  <rect x="170" y="45" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">队列 = [(0, 向前)]，jumps = 0</text>

  <!-- 箭头 -->
  <line x1="270" y1="80" x2="270" y2="95" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 弹出状态 -->
  <rect x="150" y="100" width="240" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">弹出 (pos, dir)，层内循环</text>

  <!-- 箭头 -->
  <line x1="270" y1="135" x2="270" y2="150" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断：pos == x ? -->
  <polygon points="270,155 340,185 270,215 200,185" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">pos == x ?</text>
  <text x="270" y="196" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)"></text>

  <!-- 是 → 返回 jumps -->
  <line x1="340" y1="185" x2="400" y2="185" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="358" y="178" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="400" y="170" width="100" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">return jumps</text>

  <!-- 否 → 向下 -->
  <line x1="270" y1="215" x2="270" y2="230" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="282" y="226" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 向前跳（始终允许） -->
  <rect x="30" y="235" width="220" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">向前跳（始终允许）</text>
  <text x="140" y="269" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">np = pos + a</text>
  <text x="140" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">np≤bound &amp; !ban &amp; !vis[np][0]</text>

  <!-- 向后跳（仅 dir==0） -->
  <rect x="290" y="235" width="220" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">向后跳（仅 dir==0）</text>
  <text x="400" y="269" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">np = pos − b</text>
  <text x="400" y="284" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">np≥0 &amp; !ban &amp; !vis[np][1]</text>

  <!-- 从判断到两个分支的连线 -->
  <line x1="270" y1="232" x2="140" y2="235" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="270" y1="232" x2="400" y2="235" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 条件满足 → 入队 -->
  <line x1="140" y1="295" x2="140" y2="310" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="50" y="312" width="180" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="329" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">vis[np][0]=true，入队 (np,0)</text>

  <line x1="400" y1="295" x2="400" y2="310" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="310" y="312" width="180" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="329" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">vis[np][1]=true，入队 (np,1)</text>

  <!-- 层结束 → jumps++ → 回到弹出 -->
  <line x1="140" y1="340" x2="140" y2="365" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="400" y1="340" x2="400" y2="365" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="365" x2="400" y2="365" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="170" y="370" width="200" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">层结束 → jumps++ → 继续弹出</text>

  <!-- 回环箭头到弹出 -->
  <path d="M 270 398 Q 270 415 270 415 L 50 415 Q 40 415 40 400 L 40 116 Q 40 100 150 116"
        fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 队列空 → -1 -->
  <rect x="380" y="370" width="120" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="388" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">队列空 → return -1</text>
  <line x1="380" y1="365" x2="380" y2="370" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
</svg>
