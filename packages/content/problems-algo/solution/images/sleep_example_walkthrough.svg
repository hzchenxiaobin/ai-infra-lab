<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：时间线（setTimeout 回调在 millis 后触发 resolve）</text>

  <!-- ===== Example 1: millis = 100 ===== -->
  <text x="40" y="64" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：millis = 100</text>

  <!-- timeline baseline -->
  <line x1="40" y1="120" x2="600" y2="120" stroke="#bbb" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- t=0 marker -->
  <line x1="60" y1="112" x2="60" y2="128" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">t = 0</text>

  <!-- t=100 marker -->
  <line x1="300" y1="112" x2="300" y2="128" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t = 100</text>

  <!-- call box at t=0 -->
  <rect x="40" y="78" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sleep(100) · pending</text>
  <path d="M 100 108 L 100 116" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- waiting band -->
  <rect x="60" y="158" width="240" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="176" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">⏱ setTimeout 等待 100ms</text>

  <!-- resolve box at t=100 -->
  <rect x="300" y="78" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="370" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">resolve() · fulfilled</text>
  <path d="M 370 108 L 370 116" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="370" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">.then → 100 − 0 = 100</text>

  <!-- ===== Example 2: millis = 200 ===== -->
  <text x="40" y="226" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：millis = 200</text>

  <line x1="40" y1="284" x2="600" y2="284" stroke="#bbb" stroke-width="1.8" filter="url(#rough2)"/>

  <line x1="60" y1="276" x2="60" y2="292" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="310" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">t = 0</text>

  <line x1="540" y1="276" x2="540" y2="292" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t = 200</text>

  <rect x="40" y="242" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">sleep(200) · pending</text>
  <path d="M 100 272 L 100 280" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="322" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">⏱ setTimeout 等待 200ms（更长延迟，pending 持续更久）</text>

  <rect x="470" y="242" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="545" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">resolve() · fulfilled</text>
  <path d="M 545 272 L 545 280" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="545" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">200ms 后敲定</text>

  <!-- footer note -->
  <rect x="40" y="368" width="560" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="386" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">实际睡眠 ≈ millis，微小偏差来自事件循环调度</text>
  <text x="320" y="402" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Date.now() - t ≈ millis（允许 ± 几 ms）</text>
</svg>
