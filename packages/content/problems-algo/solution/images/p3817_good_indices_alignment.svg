<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：候选子串唯一确定——以 i 结尾、长度 d = len(str(i))</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">终点 i 与位数 d 两个约束锁定唯一候选 s[i−d+1..i]，一次对齐比较即可判定</text>

  <!-- s cells -->
  <text x="34" y="84" font-size="10.5" fill="#666" filter="url(#rough2)">s</text>
  <rect x="52" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="84" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="116" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="148" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="180" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="212" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="244" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="276" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="308" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="340" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="372" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="404" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="436" y="66" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="85" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>

  <!-- index labels -->
  <text x="68" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="100" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="132" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="164" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="196" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="228" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="260" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="292" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">7</text>
  <text x="324" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">8</text>
  <text x="356" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">9</text>
  <text x="388" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">10</text>
  <text x="420" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">11</text>
  <text x="452" y="108" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#rough2)">12</text>

  <!-- i=11 window highlight -->
  <rect x="368" y="61" width="72" height="37" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="404" y="55" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">i=11 的窗口</text>

  <!-- Panel A: i = 11 (match) -->
  <rect x="48" y="126" width="204" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="144" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">i = 11：d = 2</text>
  <text x="60" y="167" font-size="9.5" fill="#555" filter="url(#rough2)">str(11)</text>
  <rect x="130" y="152" width="24" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="152" width="24" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="60" y="193" font-size="9.5" fill="#555" filter="url(#rough2)">窗口</text>
  <rect x="130" y="178" width="24" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="178" width="24" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="196" y="170" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">即</text>
  <text x="196" y="194" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">s[10..11]</text>
  <text x="150" y="212" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 相等 → 11 是好索引</text>

  <!-- Panel B: i = 10 (mismatch) -->
  <rect x="282" y="126" width="204" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="144" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">i = 10：d = 2</text>
  <text x="294" y="167" font-size="9.5" fill="#555" filter="url(#rough2)">str(10)</text>
  <rect x="364" y="152" width="24" height="22" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="392" y="152" width="24" height="22" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="404" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="294" y="193" font-size="9.5" fill="#555" filter="url(#rough2)">窗口</text>
  <rect x="364" y="178" width="24" height="22" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="376" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="392" y="178" width="24" height="22" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="404" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="430" y="170" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">即</text>
  <text x="430" y="194" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">s[9..10]</text>
  <text x="384" y="212" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">✗ 不等 → 10 不是好索引</text>

  <!-- Formula box -->
  <rect x="48" y="238" width="444" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">好索引 ⟺ i − d + 1 ≥ 0 且 s[i−d+1 .. i] == str(i)，d = len(str(i))</text>
  <text x="270" y="276" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">每个下标恰好一次 O(d) 对齐比较；首位不同即可短路返回</text>

  <!-- Answer box -->
  <rect x="48" y="306" width="444" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 1：好索引 = [0, 11, 12]</text>
  <text x="270" y="344" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">i=0 → "0"；i=11 → "11"；i=12 → "12"；一位数 1..9 与两位数 10 均不匹配</text>
</svg>
