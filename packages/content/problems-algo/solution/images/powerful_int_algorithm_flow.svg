<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双重枚举幂次 + break 防死循环</text>

  <!-- ===== Start ===== -->
  <ellipse cx="230" cy="50" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="55" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">xi = 1</text>
  <line x1="230" y1="68" x2="230" y2="84" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 1: xi <= bound? ===== -->
  <polygon points="230,86 300,112 230,138 160,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">xi ≤ bound?</text>
  <text x="230" y="122" text-anchor="middle" font-size="9.5" fill="#888">外层循环条件</text>

  <!-- Yes down -->
  <text x="240" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="230" y1="138" x2="230" y2="156" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No right to return -->
  <text x="306" y="106" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="300" y1="112" x2="378" y2="112" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return box -->
  <rect x="378" y="96" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="448" y="118" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 list(set) ✓</text>

  <!-- ===== Rect: yj = 1 ===== -->
  <rect x="180" y="158" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="177" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">yj = 1</text>
  <line x1="230" y1="186" x2="230" y2="202" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 2: xi + yj <= bound? ===== -->
  <polygon points="230,204 310,230 230,256 150,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="226" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">xi + yj ≤ bound?</text>
  <text x="230" y="240" text-anchor="middle" font-size="9.5" fill="#888">内层循环条件</text>

  <!-- Yes down -->
  <text x="240" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="230" y1="256" x2="230" y2="274" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No right to x==1? -->
  <text x="316" y="224" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="310" y1="230" x2="383" y2="230" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Rect: set.insert ===== -->
  <rect x="155" y="276" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="295" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">set.insert(xi + yj)</text>
  <line x1="230" y1="304" x2="230" y2="322" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 3: y == 1? ===== -->
  <polygon points="230,324 285,348 230,372 175,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">y == 1?</text>
  <text x="230" y="358" text-anchor="middle" font-size="9.5" fill="#888">防死循环</text>

  <!-- No down to yj *= y -->
  <text x="240" y="388" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="230" y1="372" x2="230" y2="390" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes right to x==1? (enters from right side) -->
  <text x="291" y="342" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 285 348 L 495 348 L 495 230" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="290" font-size="9.5" fill="#888">break 内层</text>

  <!-- ===== Rect: yj *= y ===== -->
  <rect x="180" y="392" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="411" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">yj *= y</text>

  <!-- yj loop back: left and up to Diamond 2 -->
  <path d="M 180 406 L 80 406 L 80 230 L 148 230" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="48" y="320" font-size="9.5" fill="#888" transform="rotate(-90 48 320)">回到内层循环</text>

  <!-- ===== Diamond 4: x == 1? (right side) ===== -->
  <polygon points="440,204 495,230 440,256 385,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="226" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">x == 1?</text>
  <text x="440" y="240" text-anchor="middle" font-size="9.5" fill="#888">防死循环</text>

  <!-- x==1 Yes up to return -->
  <text x="448" y="198" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 440 204 L 440 132" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="170" font-size="9.5" fill="#888">break 外层</text>

  <!-- x==1 No down to xi *= x -->
  <text x="448" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="440" y1="256" x2="440" y2="276" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Rect: xi *= x ===== -->
  <rect x="390" y="278" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="297" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">xi *= x</text>

  <!-- xi loop back: left and up to Diamond 1 -->
  <path d="M 390 292 L 110 292 L 110 112 L 158 112" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="86" y="200" font-size="9.5" fill="#888" transform="rotate(-90 86 200)">回到外层循环</text>

  <!-- ===== Bottom note ===== -->
  <rect x="130" y="450" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="470" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">时间 O(log² bound)，空间 O(log² bound)</text>
</svg>
