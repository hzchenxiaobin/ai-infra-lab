<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 414" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="414" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">示例演算：count(215) − count(14)（示例 2：limit = 6，s = "10"）</text>

  <!-- left panel: count(215) -->
  <rect x="20" y="36" width="300" height="212" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="60" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">count(215)：x = "215"，pre = 1</text>
  <g filter="url(#rough2)">
    <rect x="70" y="72" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="104" y="72" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="138" y="72" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="85" y="92" text-anchor="middle" font-size="12" fill="#33507a">2</text>
    <text x="119" y="92" text-anchor="middle" font-size="12" fill="#2e5c22">1</text>
    <text x="153" y="92" text-anchor="middle" font-size="12" fill="#2e5c22">5</text>
    <text x="85" y="116" text-anchor="middle" font-size="10" fill="#555">前缀区</text>
    <text x="136" y="116" text-anchor="middle" font-size="10" fill="#555">后缀区 "15"</text>
    <text x="36" y="142" font-size="11" fill="#333">① i=0：x[0]=2 ≤ 6 → 贴住</text>
    <text x="36" y="160" font-size="11" fill="#333">　 res += 2×7⁰ = 2（放 0→10，放 1→110）</text>
    <text x="36" y="182" font-size="11" fill="#333">② 前缀走完：后缀 "15" ≥ "10"</text>
    <text x="36" y="200" font-size="11" fill="#333">　 res += 1（拼出 210）</text>
  </g>
  <rect x="90" y="210" width="160" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="228" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">count(215) = 3 → {10, 110, 210}</text>

  <!-- right panel: count(14) -->
  <rect x="340" y="36" width="200" height="212" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="60" text-anchor="middle" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">count(14)：x = "14"</text>
  <g filter="url(#rough2)">
    <text x="440" y="84" text-anchor="middle" font-size="11" fill="#333">位数 = len(s) = 2</text>
    <text x="440" y="102" text-anchor="middle" font-size="11" fill="#333">候选只有 s 本身</text>
    <rect x="382" y="114" width="26" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <rect x="410" y="114" width="26" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="395" y="132" text-anchor="middle" font-size="11" fill="#33507a">1</text>
    <text x="423" y="132" text-anchor="middle" font-size="11" fill="#33507a">4</text>
    <text x="443" y="132" text-anchor="middle" font-size="12" fill="#8c3a36">≥</text>
    <rect x="454" y="114" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="482" y="114" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="467" y="132" text-anchor="middle" font-size="11" fill="#2e5c22">1</text>
    <text x="495" y="132" text-anchor="middle" font-size="11" fill="#2e5c22">0</text>
    <text x="440" y="164" text-anchor="middle" font-size="11" fill="#333">"14" ≥ "10" → 计入 10</text>
  </g>
  <rect x="392" y="180" width="120" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="198" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">count(14) = 1</text>
  <text x="440" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">（start − 1 = 14）</text>

  <!-- result -->
  <rect x="150" y="264" width="260" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="14" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">ans = 3 − 1 = 2 → {110, 210} ✓</text>

  <!-- example 1 strip -->
  <rect x="20" y="310" width="520" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle" fill="#b07818">
    <text x="280" y="332" font-size="12" font-weight="bold">顺带看示例 1：count(6000)，limit = 4，s = "124"，pre = 1</text>
    <text x="280" y="352" font-size="11">i=0：x[0]=6 &gt; 4 → 规则② 断开：res += 5¹ = 5，直接收工</text>
    <text x="280" y="372" font-size="11">{0124, 1124, 2124, 3124, 4124}；count(0) = 0 → 答案 5 ✓</text>
  </g>
</svg>
