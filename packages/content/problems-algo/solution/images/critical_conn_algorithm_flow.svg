<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Tarjan 算法流程（DFS 找桥）</text>

  <!-- init -->
  <rect x="200" y="44" width="160" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">建邻接表 + timer=0</text>
  <text x="280" y="78" text-anchor="middle" font-size="10.5" fill="#666">disc / low 数组初始化为 -1</text>
  <line x1="280" y1="88" x2="280" y2="108" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- DFS entry -->
  <rect x="190" y="108" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">DFS(u, parent)</text>
  <text x="280" y="141" text-anchor="middle" font-size="10.5" fill="#666">disc[u] = low[u] = timer++</text>
  <line x1="280" y1="148" x2="280" y2="168" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- iterate neighbors -->
  <rect x="170" y="168" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 u 的每个邻居 v</text>
  <line x1="280" y1="202" x2="280" y2="222" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: visited? -->
  <path d="M 280 222 L 392 262 L 280 302 L 168 262 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">disc[v]==-1 ?</text>
  <text x="280" y="274" text-anchor="middle" font-size="10" fill="#888">v 未访问</text>

  <!-- yes branch: tree edge -->
  <text x="406" y="258" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="392" y1="262" x2="442" y2="262" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="442" y="232" width="108" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="496" y="250" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">树边：DFS(v,u)</text>
  <text x="496" y="265" text-anchor="middle" font-size="10" fill="#666">low[u]=min(low[u],</text>
  <text x="496" y="278" text-anchor="middle" font-size="10" fill="#666">low[v])</text>
  <text x="496" y="290" text-anchor="middle" font-size="9.5" fill="#b85450">再判桥 ↓</text>

  <!-- no branch: back edge? -->
  <text x="120" y="258" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <line x1="168" y1="262" x2="120" y2="262" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 2: v != parent? -->
  <path d="M 120 262 L 64 300 L 120 338 L 176 300 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="296" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">v≠parent?</text>
  <text x="120" y="312" text-anchor="middle" font-size="9.5" fill="#888">是回边</text>

  <!-- back edge yes -->
  <text x="36" y="300" font-size="10.5" fill="#d6a040" font-weight="bold">是</text>
  <line x1="64" y1="300" x2="34" y2="300" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="10" y="282" width="22" height="36" fill="none" stroke="none"/>
  <rect x="6" y="348" width="228" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="366" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">回边：low[u]=min(low[u], disc[v])</text>
  <text x="120" y="380" text-anchor="middle" font-size="9.5" fill="#888">用 v 的发现时间更新，可绕回祖先</text>
  <line x1="120" y1="338" x2="120" y2="348" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- back edge no: skip -->
  <text x="188" y="300" font-size="10.5" fill="#888" font-weight="bold">否</text>
  <text x="206" y="320" font-size="9.5" fill="#888">跳过(父边)</text>

  <!-- bridge check after tree edge -->
  <line x1="496" y1="294" x2="496" y2="348" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 496 348 L 430 372 L 496 396 L 562 372 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="496" y="368" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">low[v] &gt; disc[u]?</text>
  <text x="496" y="384" text-anchor="middle" font-size="9.5" fill="#b85450">子树绕不回 u 或更上</text>

  <line x1="430" y1="372" x2="380" y2="372" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="366" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="248" y="354" width="130" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="313" y="371" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(u,v) 是桥</text>
  <text x="313" y="385" text-anchor="middle" font-size="9.5" fill="#888">加入答案</text>

  <!-- no bridge -->
  <text x="496" y="412" font-size="10" fill="#4a7a3a" font-weight="bold">否 → 非桥</text>

  <!-- loop back -->
  <path d="M 280 302 Q 280 410 280 186" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="400" font-size="9.5" fill="#888">继续下一邻居</text>

  <!-- summary -->
  <rect x="40" y="430" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="448" text-anchor="middle" font-size="10.5" fill="#444">核心判据：树边 (u,v) 为桥 ⟺ low[v] &gt; disc[u]（v 的子树无法绕回 u 或其祖先）</text>
</svg>
