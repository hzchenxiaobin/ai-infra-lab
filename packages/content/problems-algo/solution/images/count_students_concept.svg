<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="600" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：LEFT JOIN 保全部门 + COUNT(student_id) 空部门计 0</text>

  <!-- Department table (top-left) -->
  <text x="145" y="56" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">Department（左表，全保留）</text>
  <rect x="40" y="62" width="210" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="78" font-size="9.5" fill="#333">dept_id</text>
  <text x="160" y="78" font-size="9.5" fill="#333">dept_name</text>
  <line x1="110" y1="62" x2="110" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="86" width="210" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="101" font-size="9.5" fill="#333">1</text>
  <text x="160" y="101" font-size="9.5" fill="#333">Engineering</text>
  <line x1="110" y1="86" x2="110" y2="108" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="108" width="210" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="123" font-size="9.5" fill="#333">2</text>
  <text x="160" y="123" font-size="9.5" fill="#333">Science</text>
  <line x1="110" y1="108" x2="110" y2="130" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="130" width="210" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="145" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="160" y="145" font-size="9.5" fill="#d6a040" font-weight="bold">Law</text>
  <line x1="110" y1="130" x2="110" y2="152" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="145" y="170" text-anchor="middle" font-size="9" fill="#d6a040">↑ Law 无任何学生</text>

  <!-- Student table (top-right) -->
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">Student（右表）</text>
  <rect x="350" y="62" width="210" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="78" font-size="9" fill="#333">stu_id</text>
  <text x="425" y="78" font-size="9" fill="#333">name</text>
  <text x="480" y="78" font-size="9" fill="#333">gender</text>
  <text x="535" y="78" font-size="9" fill="#4a7a3a">dept_id</text>
  <line x1="395" y1="62" x2="395" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="62" x2="460" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="62" x2="515" y2="86" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="86" width="210" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="372" y="101" font-size="9.5" fill="#333">1</text>
  <text x="425" y="101" font-size="9.5" fill="#333">Jack</text>
  <text x="480" y="101" font-size="9.5" fill="#333">M</text>
  <text x="535" y="101" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="395" y1="86" x2="395" y2="108" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="86" x2="460" y2="108" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="86" x2="515" y2="108" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="108" width="210" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="372" y="123" font-size="9.5" fill="#333">2</text>
  <text x="425" y="123" font-size="9.5" fill="#333">Jane</text>
  <text x="480" y="123" font-size="9.5" fill="#333">F</text>
  <text x="535" y="123" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="395" y1="108" x2="395" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="108" x2="460" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="108" x2="515" y2="130" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="130" width="210" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="372" y="145" font-size="9.5" fill="#333">3</text>
  <text x="425" y="145" font-size="9.5" fill="#333">Mark</text>
  <text x="480" y="145" font-size="9.5" fill="#333">M</text>
  <text x="535" y="145" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="395" y1="130" x2="395" y2="152" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="460" y1="130" x2="460" y2="152" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="130" x2="515" y2="152" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="460" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">↑ dept_id=3 无匹配</text>

  <!-- Down arrow: LEFT JOIN -->
  <path d="M300 184 L300 214" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="318" y="204" font-size="10" fill="#446688" font-weight="bold">LEFT JOIN</text>
  <text x="318" y="216" font-size="9" fill="#446688">ON d.dept_id = s.dept_id</text>

  <!-- Joined result table -->
  <text x="300" y="234" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">JOIN 结果（4 行，Law 行被 NULL 补齐）</text>
  <rect x="100" y="240" width="400" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="256" font-size="9.5" fill="#333">dept_id</text>
  <text x="220" y="256" font-size="9.5" fill="#333">dept_name</text>
  <text x="335" y="256" font-size="9.5" fill="#333">student_id</text>
  <text x="445" y="256" font-size="9.5" fill="#333">student_name</text>
  <line x1="175" y1="240" x2="175" y2="264" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="285" y1="240" x2="285" y2="264" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="395" y1="240" x2="395" y2="264" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="100" y="264" width="400" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="279" font-size="9.5" fill="#333">1</text>
  <text x="220" y="279" font-size="9.5" fill="#333">Engineering</text>
  <text x="335" y="279" font-size="9.5" fill="#333">1</text>
  <text x="445" y="279" font-size="9.5" fill="#333">Jack</text>
  <line x1="175" y1="264" x2="175" y2="286" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="285" y1="264" x2="285" y2="286" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="395" y1="264" x2="395" y2="286" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="100" y="286" width="400" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="301" font-size="9.5" fill="#333">1</text>
  <text x="220" y="301" font-size="9.5" fill="#333">Engineering</text>
  <text x="335" y="301" font-size="9.5" fill="#333">2</text>
  <text x="445" y="301" font-size="9.5" fill="#333">Jane</text>
  <line x1="175" y1="286" x2="175" y2="308" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="285" y1="286" x2="285" y2="308" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="395" y1="286" x2="395" y2="308" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="100" y="308" width="400" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="323" font-size="9.5" fill="#333">2</text>
  <text x="220" y="323" font-size="9.5" fill="#333">Science</text>
  <text x="335" y="323" font-size="9.5" fill="#333">3</text>
  <text x="445" y="323" font-size="9.5" fill="#333">Mark</text>
  <line x1="175" y1="308" x2="175" y2="330" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="285" y1="308" x2="285" y2="330" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="395" y1="308" x2="395" y2="330" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="100" y="330" width="400" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="346" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <text x="220" y="346" font-size="9.5" fill="#b85450" font-weight="bold">Law</text>
  <text x="335" y="346" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <text x="445" y="346" font-size="9.5" fill="#b85450" font-weight="bold">NULL</text>
  <line x1="175" y1="330" x2="175" y2="354" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="285" y1="330" x2="285" y2="354" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="395" y1="330" x2="395" y2="354" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="300" y="370" text-anchor="middle" font-size="9" fill="#b85450">↑ LEFT JOIN 保留 Law，右表列填 NULL</text>

  <!-- Down arrow: GROUP BY + COUNT -->
  <path d="M300 376 L300 406" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="318" y="396" font-size="10" fill="#4a7a3a" font-weight="bold">GROUP BY</text>
  <text x="318" y="408" font-size="9" fill="#4a7a3a">dept_id, dept_name</text>

  <!-- Final result -->
  <text x="300" y="426" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">最终结果：COUNT(student_id) AS student_number</text>
  <rect x="160" y="432" width="280" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="448" font-size="9.5" fill="#333">dept_name</text>
  <text x="370" y="448" font-size="9.5" fill="#333">student_number</text>
  <line x1="300" y1="432" x2="300" y2="456" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="160" y="456" width="280" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="471" font-size="9.5" fill="#333">Engineering</text>
  <text x="370" y="471" font-size="9.5" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="300" y1="456" x2="300" y2="478" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="160" y="478" width="280" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="493" font-size="9.5" fill="#333">Science</text>
  <text x="370" y="493" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="300" y1="478" x2="300" y2="500" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="160" y="500" width="280" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="516" font-size="9.5" fill="#d6a040" font-weight="bold">Law</text>
  <text x="370" y="516" font-size="9.5" fill="#d6a040" font-weight="bold">0</text>
  <line x1="300" y1="500" x2="300" y2="524" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Callout -->
  <rect x="60" y="540" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="560" text-anchor="middle" font-size="10" fill="#333">COUNT(student_id) 只数非 NULL 行 → Law 的 NULL 行被忽略 → 计 0</text>
  <text x="300" y="578" text-anchor="middle" font-size="10" fill="#b85450">⚠ 若误用 COUNT(*)：Law 行虽 student 为 NULL 但行存在 → 错算成 1</text>
</svg>
