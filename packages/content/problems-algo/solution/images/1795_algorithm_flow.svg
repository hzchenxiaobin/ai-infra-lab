<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：三段 SELECT 用 UNION ALL 纵向拼接</text>
  <path d="M 140 34 Q 360 42 580 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Top: Products table ===== -->
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Products（源表）</text>
  <g filter="url(#rough2)">
    <rect x="250" y="64" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="278" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">product_id</text>
  <text x="334" y="80" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">store1</text>
  <text x="390" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">store2</text>
  <text x="446" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">store3</text>
  <g filter="url(#rough2)">
    <line x1="306" y1="64" x2="306" y2="112" stroke="#bbb" stroke-width="1"/>
    <line x1="362" y1="64" x2="362" y2="112" stroke="#bbb" stroke-width="1"/>
    <line x1="418" y1="64" x2="418" y2="112" stroke="#bbb" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)"><rect x="250" y="88" width="220" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="278" y="104" text-anchor="middle" font-size="10" fill="#333">0/1</text>
  <text x="334" y="104" text-anchor="middle" font-size="10" fill="#b85450">…</text>
  <text x="390" y="104" text-anchor="middle" font-size="10" fill="#d6a040">…</text>
  <text x="446" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a">…</text>

  <!-- ===== Three branches ===== -->
  <!-- branch 1: store1 -->
  <path d="M 334 112 Q 334 130 120 150" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="30" y="150" width="180" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="120" y="170" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">SELECT 段①</text>
  <text x="120" y="188" text-anchor="middle" font-size="9" fill="#333">SELECT product_id,</text>
  <text x="120" y="200" text-anchor="middle" font-size="9" fill="#333">'store1' AS store,</text>
  <text x="120" y="212" text-anchor="middle" font-size="9" fill="#333">store1 AS price</text>
  <text x="120" y="226" text-anchor="middle" font-size="9" fill="#b85450">WHERE store1 IS NOT NULL</text>

  <!-- branch 2: store2 -->
  <path d="M 390 112 Q 390 130 360 150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="270" y="150" width="180" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="360" y="170" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">SELECT 段②</text>
  <text x="360" y="188" text-anchor="middle" font-size="9" fill="#333">SELECT product_id,</text>
  <text x="360" y="200" text-anchor="middle" font-size="9" fill="#333">'store2' AS store,</text>
  <text x="360" y="212" text-anchor="middle" font-size="9" fill="#333">store2 AS price</text>
  <text x="360" y="226" text-anchor="middle" font-size="9" fill="#d6a040">WHERE store2 IS NOT NULL</text>

  <!-- branch 3: store3 -->
  <path d="M 446 112 Q 446 130 600 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="510" y="150" width="180" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="600" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT 段③</text>
  <text x="600" y="188" text-anchor="middle" font-size="9" fill="#333">SELECT product_id,</text>
  <text x="600" y="200" text-anchor="middle" font-size="9" fill="#333">'store3' AS store,</text>
  <text x="600" y="212" text-anchor="middle" font-size="9" fill="#333">store3 AS price</text>
  <text x="600" y="226" text-anchor="middle" font-size="9" fill="#4a7a3a">WHERE store3 IS NOT NULL</text>

  <!-- ===== merge arrows to UNION ALL ===== -->
  <path d="M 120 224 Q 120 250 320 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 224 L 360 268" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 600 224 Q 600 250 400 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- UNION ALL box -->
  <g filter="url(#rough2)">
    <rect x="280" y="270" width="160" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="360" y="295" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">UNION ALL</text>

  <!-- arrow to result -->
  <path d="M 360 312 L 360 330" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- ===== Result table ===== -->
  <text x="360" y="346" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">结果（纵向拼接，NULL 行已丢弃）</text>
  <g filter="url(#rough2)">
    <rect x="250" y="352" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="290" y="368" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">product_id</text>
  <text x="360" y="368" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">store</text>
  <text x="430" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">price</text>
  <g filter="url(#rough2)">
    <line x1="330" y1="352" x2="330" y2="448" stroke="#bbb" stroke-width="1"/>
    <line x1="395" y1="352" x2="395" y2="448" stroke="#bbb" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)"><rect x="250" y="376" width="220" height="14" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="386" text-anchor="middle" font-size="9" fill="#333">0</text><text x="360" y="386" text-anchor="middle" font-size="9" fill="#b85450">store1</text><text x="430" y="386" text-anchor="middle" font-size="9" fill="#333">95</text>
  <g filter="url(#rough2)"><rect x="250" y="390" width="220" height="14" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="400" text-anchor="middle" font-size="9" fill="#333">0</text><text x="360" y="400" text-anchor="middle" font-size="9" fill="#d6a040">store2</text><text x="430" y="400" text-anchor="middle" font-size="9" fill="#333">100</text>
  <g filter="url(#rough2)"><rect x="250" y="404" width="220" height="14" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="414" text-anchor="middle" font-size="9" fill="#333">0</text><text x="360" y="414" text-anchor="middle" font-size="9" fill="#4a7a3a">store3</text><text x="430" y="414" text-anchor="middle" font-size="9" fill="#333">105</text>
  <g filter="url(#rough2)"><rect x="250" y="418" width="220" height="14" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="428" text-anchor="middle" font-size="9" fill="#333">1</text><text x="360" y="428" text-anchor="middle" font-size="9" fill="#b85450">store1</text><text x="430" y="428" text-anchor="middle" font-size="9" fill="#333">70</text>
  <g filter="url(#rough2)"><rect x="250" y="432" width="220" height="14" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="442" text-anchor="middle" font-size="9" fill="#333">1</text><text x="360" y="442" text-anchor="middle" font-size="9" fill="#4a7a3a">store3</text><text x="430" y="442" text-anchor="middle" font-size="9" fill="#333">80</text>

  <text x="360" y="462" text-anchor="middle" font-size="10" fill="#aaa">行着色对应来源段①②③；UNION ALL 不去重（各段 store 列不同，天然无重复）</text>
</svg>
