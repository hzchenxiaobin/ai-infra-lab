<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：虚拟 Fisher-Yates —— 哈希表压缩 m·n 规模的候选池</text>

  <text x="40" y="70" font-size="11.5" fill="#888" font-weight="bold">初始：total = m·n = 6</text>
  <text x="40" y="86" font-size="10.5" fill="#888">虚拟数组：位置 i 存值 i（i = 行·n + 列）</text>

  <rect x="80" y="100" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="124" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <rect x="130" y="100" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="124" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <rect x="180" y="100" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="205" y="124" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <rect x="230" y="100" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="255" y="124" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>

  <rect x="280" y="100" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="124" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <rect x="330" y="100" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="124" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">5</text>

  <text x="105" y="152" text-anchor="middle" font-size="9.5" fill="#888">pos 0</text>
  <text x="155" y="152" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">pos 1 = r</text>
  <text x="205" y="152" text-anchor="middle" font-size="9.5" fill="#888">pos 2</text>
  <text x="255" y="152" text-anchor="middle" font-size="9.5" fill="#888">pos 3</text>
  <text x="305" y="152" text-anchor="middle" font-size="9.5" fill="#888">pos 4</text>
  <text x="355" y="152" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">pos 5 = total−1</text>

  <path d="M 155 96 C 180 60, 330 60, 355 96" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="226" y="48" width="64" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="258" y="62" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">swap r ↔ last</text>

  <text x="400" y="110" font-size="11" fill="#444">① r = rand(0, total−1) = 1</text>
  <text x="400" y="128" font-size="11" fill="#b85450" font-weight="bold">② actual = map[r] = 1</text>
  <text x="400" y="146" font-size="11" fill="#444">   → 返回 [1//n, 1%n]</text>
  <text x="400" y="164" font-size="11" fill="#4a7a3a">③ map[r] = map[last] = 5</text>
  <text x="400" y="182" font-size="11" fill="#d6a040">④ total−−  (6 → 5)</text>

  <path d="M 230 175 L 230 205" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="220" font-size="11.5" fill="#888" font-weight="bold">flip 后：total = 5</text>
  <text x="40" y="236" font-size="10.5" fill="#888">位置 1 的值被「末尾值 5」替换，原值 1 已返回</text>

  <rect x="80" y="250" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="274" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <rect x="130" y="250" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>

  <rect x="180" y="250" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="205" y="274" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <rect x="230" y="250" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="255" y="274" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>

  <rect x="280" y="250" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="274" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <rect x="330" y="250" width="50" height="36" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="355" y="274" text-anchor="middle" font-size="11" fill="#bbb">×</text>

  <text x="155" y="302" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">pos 1 现在 = 5</text>

  <text x="400" y="260" font-size="11.5" fill="#888" font-weight="bold">哈希表 map（仅存差异）</text>
  <rect x="400" y="270" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="460" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">{ 1 → 5 }</text>
  <text x="400" y="316" font-size="10" fill="#888">size = 1（≤ flip 调用次数）</text>

  <rect x="36" y="340" width="488" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="364" font-size="12" fill="#4a7a3a" font-weight="bold">为什么均匀且省空间？</text>
  <text x="56" y="386" font-size="11" fill="#555">• 每步从 [0, total−1] 等概率选 r，剩余 total 个未翻格子各占一个位置 → 概率 1/total</text>
  <text x="56" y="404" font-size="11" fill="#555">• 哈希表只记录「被换过的位置」：size ≤ flip 次数 ≤ 1000，与 m·n 无关</text>
  <text x="56" y="422" font-size="11" fill="#b85450" font-weight="bold">→ m·n = 10⁸ 也只需 O(1000) 空间，reset 只需 map.clear()</text>
</svg>
