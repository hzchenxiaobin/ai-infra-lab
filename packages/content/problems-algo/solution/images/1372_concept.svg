<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">ZigZag 路径：从任一节点出发，逐层「左右交替」向下走，计边数</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">高亮路径 2→4→6→8：方向 L→R→L，共 3 条边 = 长度 3</text>

  <!-- ===== Left: tree with highlighted zigzag ===== -->
  <text x="160" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 一棵二叉树与最长交错路径</text>

  <g font-size="12">
    <!-- normal edges -->
    <line x1="180" y1="98" x2="130" y2="150" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="180" y1="98" x2="250" y2="150" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="250" y1="160" x2="290" y2="212" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="290" y1="222" x2="330" y2="274" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

    <!-- zigzag edges: 2->4 (L), 4->6 (R), 6->8 (L) -->
    <line x1="130" y1="160" x2="90" y2="212" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <line x1="90" y1="222" x2="130" y2="274" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <line x1="130" y1="284" x2="100" y2="336" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>

    <!-- direction labels on zigzag edges -->
    <rect x="100" y="178" width="18" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="109" y="190" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">L</text>
    <rect x="100" y="238" width="18" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="109" y="250" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">R</text>
    <rect x="106" y="302" width="18" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="115" y="314" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">L</text>

    <!-- nodes: zigzag path nodes (2,4,6,8) orange, others blue -->
    <circle cx="180" cy="90" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="180" y="95" text-anchor="middle" fill="#446688" font-weight="bold">1</text>

    <circle cx="130" cy="155" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="130" y="160" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>

    <circle cx="250" cy="155" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="250" y="160" text-anchor="middle" fill="#446688" font-weight="bold">3</text>

    <circle cx="90" cy="217" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="90" y="222" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>

    <circle cx="290" cy="217" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="290" y="222" text-anchor="middle" fill="#446688" font-weight="bold">5</text>

    <circle cx="130" cy="279" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="130" y="284" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>

    <circle cx="330" cy="279" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="330" y="284" text-anchor="middle" fill="#446688" font-weight="bold">7</text>

    <circle cx="100" cy="341" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="100" y="346" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
  </g>

  <text x="160" y="380" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">起点 2，走左→右→左，3 条边</text>

  <!-- ===== Right: pair (L, R) concept ===== -->
  <text x="470" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 每个节点返回一对 (L, R)</text>

  <rect x="350" y="84" width="240" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dfs(node) → (L, R)</text>
  <text x="362" y="128" font-size="11" fill="#444">L：从 node 出发先走「左」的最长交错</text>
  <text x="362" y="146" font-size="11" fill="#444">R：从 node 出发先走「右」的最长交错</text>
  <text x="362" y="166" font-size="10" fill="#888">两个值各代表一种起始方向</text>

  <rect x="350" y="188" width="240" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="210" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">递推：交替的本质</text>
  <text x="362" y="232" font-size="11" fill="#333" font-family="monospace">L = 1 + dfs(left).R</text>
  <text x="362" y="250" font-size="11" fill="#333" font-family="monospace">R = 1 + dfs(right).L</text>
  <text x="362" y="270" font-size="10" fill="#888">走左后必须接「右」，走右后必须接「左」</text>

  <rect x="350" y="292" width="240" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">全局答案</text>
  <text x="362" y="336" font-size="11" fill="#333" font-family="monospace">ans = max(ans, L, R)</text>
  <text x="362" y="354" font-size="10" fill="#888">路径可从任意节点开始，逐节点取 max</text>

  <!-- bottom note -->
  <rect x="30" y="396" width="560" height="18" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="410" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">关键洞察：交错 = 「下一步方向由上一步决定」，dfs 返回 (L,R) 一对即可衔接</text>
</svg>
