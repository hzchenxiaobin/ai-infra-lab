<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：逐产品拆 3 行，NULL 行丢弃</text>
  <path d="M 140 34 Q 360 42 580 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Input table ===== -->
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">输入 Products</text>
  <g filter="url(#rough2)">
    <rect x="250" y="62" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="285" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">product_id</text>
  <text x="340" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">store1</text>
  <text x="395" y="78" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">store2</text>
  <text x="450" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">store3</text>
  <g filter="url(#rough2)">
    <line x1="320" y1="62" x2="320" y2="110" stroke="#bbb" stroke-width="1"/>
    <line x1="375" y1="62" x2="375" y2="110" stroke="#bbb" stroke-width="1"/>
    <line x1="425" y1="62" x2="425" y2="110" stroke="#bbb" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)"><rect x="250" y="86" width="220" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="285" y="102" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="340" y="102" text-anchor="middle" font-size="10" fill="#b85450">95</text>
  <text x="395" y="102" text-anchor="middle" font-size="10" fill="#d6a040">100</text>
  <text x="450" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a">105</text>

  <!-- arrows down to two columns -->
  <path d="M 300 110 Q 240 124 170 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 110 Q 480 124 550 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Left column: product 0 ===== -->
  <text x="170" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product 0 → 拆 3 行（全保留）</text>
  <!-- candidate row store1 -->
  <g filter="url(#rough2)"><rect x="60" y="140" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
  <text x="120" y="157" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="180" y="157" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">store1</text>
  <text x="245" y="157" text-anchor="middle" font-size="10" fill="#333">95</text>
  <text x="270" y="157" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- store2 -->
  <g filter="url(#rough2)"><rect x="60" y="168" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/></g>
  <text x="120" y="185" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="180" y="185" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">store2</text>
  <text x="245" y="185" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="270" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- store3 -->
  <g filter="url(#rough2)"><rect x="60" y="196" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="120" y="213" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="180" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">store3</text>
  <text x="245" y="213" text-anchor="middle" font-size="10" fill="#333">105</text>
  <text x="270" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- ===== Right column: product 1 ===== -->
  <text x="550" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product 1 → 拆 3 行（store2 丢弃）</text>
  <!-- store1 -->
  <g filter="url(#rough2)"><rect x="440" y="140" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
  <text x="500" y="157" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="560" y="157" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">store1</text>
  <text x="625" y="157" text-anchor="middle" font-size="10" fill="#333">70</text>
  <text x="650" y="157" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- store2 NULL -> crossed -->
  <g filter="url(#rough2)"><rect x="440" y="168" width="220" height="26" fill="#eee" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="3"/></g>
  <text x="500" y="185" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="560" y="185" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">store2</text>
  <text x="625" y="185" text-anchor="middle" font-size="10" fill="#999" font-style="italic">null</text>
  <text x="650" y="185" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <path d="M 448 174 L 656 188" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- store3 -->
  <g filter="url(#rough2)"><rect x="440" y="196" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="500" y="213" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="560" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">store3</text>
  <text x="625" y="213" text-anchor="middle" font-size="10" fill="#333">80</text>
  <text x="650" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- arrows to final result -->
  <path d="M 170 224 Q 170 250 300 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 550 224 Q 550 250 420 268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <text x="360" y="262" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">最终结果（5 行）</text>
  <g filter="url(#rough2)">
    <rect x="250" y="270" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="290" y="285" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">product_id</text>
  <text x="360" y="285" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">store</text>
  <text x="430" y="285" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">price</text>
  <g filter="url(#rough2)">
    <line x1="330" y1="270" x2="330" y2="392" stroke="#bbb" stroke-width="1"/>
    <line x1="395" y1="270" x2="395" y2="392" stroke="#bbb" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)"><rect x="250" y="292" width="220" height="20" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="306" text-anchor="middle" font-size="10" fill="#333">0</text><text x="360" y="306" text-anchor="middle" font-size="10" fill="#b85450">store1</text><text x="430" y="306" text-anchor="middle" font-size="10" fill="#333">95</text>
  <g filter="url(#rough2)"><rect x="250" y="312" width="220" height="20" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="326" text-anchor="middle" font-size="10" fill="#333">0</text><text x="360" y="326" text-anchor="middle" font-size="10" fill="#d6a040">store2</text><text x="430" y="326" text-anchor="middle" font-size="10" fill="#333">100</text>
  <g filter="url(#rough2)"><rect x="250" y="332" width="220" height="20" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="346" text-anchor="middle" font-size="10" fill="#333">0</text><text x="360" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a">store3</text><text x="430" y="346" text-anchor="middle" font-size="10" fill="#333">105</text>
  <g filter="url(#rough2)"><rect x="250" y="352" width="220" height="20" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="366" text-anchor="middle" font-size="10" fill="#333">1</text><text x="360" y="366" text-anchor="middle" font-size="10" fill="#b85450">store1</text><text x="430" y="366" text-anchor="middle" font-size="10" fill="#333">70</text>
  <g filter="url(#rough2)"><rect x="250" y="372" width="220" height="20" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" rx="2"/></g>
  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#333">1</text><text x="360" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a">store3</text><text x="430" y="386" text-anchor="middle" font-size="10" fill="#333">80</text>

  <!-- bottom note -->
  <g filter="url(#rough2)"><rect x="30" y="408" width="660" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="50" y="428" font-size="11" fill="#d6a040" font-weight="bold">💡 行数计算：</text>
  <text x="50" y="444" font-size="11" fill="#333">product 0 贡献 3 行（无 null），product 1 贡献 2 行（store2 为 null 被丢弃），合计 3 + 2 = 5 行。</text>
</svg>
