<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">决策流程：五档答案的判定链（全程 O(n)）</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="110" y="40" width="180" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="61" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">输入 s（mn=min, mx=max）</text>
    <path d="M200,74 L200,92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  </g>

  <!-- 菱形1：已非降序？ -->
  <g filter="url(#rough2)">
    <polygon points="200,94 282,120 200,146 118,120" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="124" text-anchor="middle" font-size="11.5" fill="#333">s 已非降序？</text>
    <path d="M282,120 L348,120" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
    <text x="300" y="112" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M200,146 L200,164" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
    <text x="208" y="160" font-size="10.5" fill="#999">否</text>
    <rect x="352" y="102" width="150" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="427" y="118" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">返回 0</text>
    <text x="427" y="133" text-anchor="middle" font-size="9.5" fill="#4a7a3a">本身就是目标串</text>
  </g>

  <!-- 菱形2：s[0]=mn 或 s[n-1]=mx？ -->
  <g filter="url(#rough2)">
    <polygon points="200,166 292,192 200,218 108,192" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="188" text-anchor="middle" font-size="11" fill="#333">s[0]=mn 或</text>
    <text x="200" y="202" text-anchor="middle" font-size="11" fill="#333">s[n-1]=mx？</text>
    <path d="M292,192 L348,192" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
    <text x="308" y="184" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M200,218 L200,236" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
    <text x="208" y="232" font-size="10.5" fill="#999">否</text>
    <rect x="352" y="174" width="150" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="427" y="190" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">返回 1</text>
    <text x="427" y="205" text-anchor="middle" font-size="9.5" fill="#446688">排序错位区间 [i,j] 即可</text>
  </g>

  <!-- 菱形3：n=2？ -->
  <g filter="url(#rough2)">
    <polygon points="200,238 268,264 200,290 132,264" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="268" text-anchor="middle" font-size="11.5" fill="#333">n = 2？</text>
    <path d="M268,264 L348,264" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
    <text x="290" y="256" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M200,290 L200,308" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
    <text x="208" y="304" font-size="10.5" fill="#999">否</text>
    <rect x="352" y="246" width="160" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="432" y="262" text-anchor="middle" font-size="12.5" fill="#8a3030" font-weight="bold">返回 -1</text>
    <text x="432" y="277" text-anchor="middle" font-size="9.5" fill="#b85450">真子串只有单字符，冻结</text>
  </g>

  <!-- 菱形4：mn/mx 在内部？ -->
  <g filter="url(#rough2)">
    <polygon points="200,310 296,336 200,362 104,336" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="332" text-anchor="middle" font-size="11" fill="#333">mn 或 mx 出现在</text>
    <text x="200" y="346" text-anchor="middle" font-size="11" fill="#333">内部 s[1..n-2]？</text>
    <path d="M296,336 L348,336" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
    <text x="310" y="328" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M200,362 L200,380" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
    <text x="208" y="376" font-size="10.5" fill="#999">否</text>
    <rect x="352" y="318" width="160" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="432" y="334" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">返回 2</text>
    <text x="432" y="349" text-anchor="middle" font-size="9.5" fill="#d6a040">先排 s[0..n-2]，再插回末字符</text>
  </g>

  <!-- 返回 3 -->
  <g filter="url(#rough2)">
    <rect x="90" y="382" width="220" height="40" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.8"/>
    <text x="200" y="398" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">返回 3：mx 只在开头、mn 只在结尾</text>
    <text x="200" y="414" text-anchor="middle" font-size="9.5" fill="#777">三步构造：排 s[1..n-1] → 排 s[0..n-2] → 排 s[1..n-1]</text>
  </g>

  <text x="452" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">② 与 ③ 的顺序可互换：n=2 未排序时</text>
  <text x="452" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s[0]=mx≠mn、s[n-1]=mn≠mx，</text>
  <text x="452" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">条件 ② 必不成立，二者不冲突</text>
</svg>
