<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    DFS(nestedList, depth) 算法流程
  </text>

  <!-- Start -->
  <rect x="210" y="55" width="140" height="34" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    入口：depthSum(list, 1)
  </text>
  <line x1="280" y1="89" x2="280" y2="108" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop over elements -->
  <rect x="180" y="110" width="200" height="34" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    遍历 list 中的每个 elem
  </text>
  <line x1="280" y1="144" x2="280" y2="163" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: isInteger? -->
  <polygon points="280,165 380,210 280,255 180,210" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    elem.isInteger()?
  </text>
  <text x="280" y="223" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">
    是 / 否
  </text>

  <!-- Yes branch -->
  <line x1="180" y1="210" x2="100" y2="210" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="250" width="170" height="50" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="105" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    sum += elem.getInteger()
  </text>
  <text x="105" y="288" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    × depth
  </text>

  <!-- No branch -->
  <line x1="380" y1="210" x2="460" y2="210" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="200" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="380" y="250" width="170" height="50" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="465" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    递归：
  </text>
  <text x="465" y="288" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    DFS(elem.getList(), depth+1)
  </text>

  <!-- Merge arrows -->
  <path d="M 105 300 L 105 330 L 280 330" fill="none" stroke="#446688"
        stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 465 300 L 465 330 L 280 330" fill="none" stroke="#446688"
        stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop back -->
  <rect x="200" y="335" width="160" height="30" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="355" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    下一个 elem
  </text>
  <path d="M 380 345 Q 430 345 430 125 L 380 125" fill="none" stroke="#446688"
        stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <line x1="280" y1="365" x2="280" y2="388" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="390" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    return sum
  </text>
</svg>
