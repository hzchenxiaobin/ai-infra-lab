<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">N 字形排列：按行读出结果（numRows = 3）</text>

  <!-- Row labels -->
  <text x="50" y="86" font-size="12" fill="#888">行 0:</text>
  <text x="50" y="140" font-size="12" fill="#888">行 1:</text>
  <text x="50" y="194" font-size="12" fill="#888">行 2:</text>

  <!-- Row 0: P A H N  (indices 0,4,8,12) -->
  <rect x="90" y="68" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">P</text>
  <text x="108" y="64" text-anchor="middle" font-size="9" fill="#aaa">0</text>

  <rect x="246" y="68" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <text x="264" y="64" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <rect x="402" y="68" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">H</text>
  <text x="420" y="64" text-anchor="middle" font-size="9" fill="#aaa">8</text>

  <rect x="480" y="68" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">N</text>
  <text x="498" y="64" text-anchor="middle" font-size="9" fill="#aaa">12</text>

  <!-- Row 1: A P L S I I G (indices 1,3,5,7,9,11,13) -->
  <rect x="128" y="122" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <text x="146" y="118" text-anchor="middle" font-size="9" fill="#aaa">1</text>

  <rect x="208" y="122" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">P</text>
  <text x="226" y="118" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <rect x="284" y="122" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">L</text>
  <text x="302" y="118" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <rect x="360" y="122" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">S</text>
  <text x="378" y="118" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <rect x="440" y="122" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">I</text>
  <text x="458" y="118" text-anchor="middle" font-size="9" fill="#aaa">9</text>

  <rect x="516" y="122" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="534" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">G</text>
  <text x="534" y="118" text-anchor="middle" font-size="9" fill="#aaa">13</text>

  <!-- Row 2: Y I R (indices 2,6,10) -->
  <rect x="166" y="176" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Y</text>
  <text x="184" y="172" text-anchor="middle" font-size="9" fill="#aaa">2</text>

  <rect x="322" y="176" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">I</text>
  <text x="340" y="172" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <rect x="462" y="176" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R</text>
  <text x="480" y="172" text-anchor="middle" font-size="9" fill="#aaa">10</text>

  <!-- Zigzag path showing the N shape -->
  <path d="M 108 98 Q 120 110 146 122 Q 170 140 184 176 Q 200 150 226 122 Q 250 110 264 98 Q 280 110 302 122 Q 320 140 340 176 Q 356 150 378 122 Q 392 110 420 98 Q 436 110 458 122 Q 472 140 480 176 Q 492 150 516 122 Q 526 110 534 122"
        stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Reading order arrows -->
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">按行读出 → 拼接结果</text>

  <!-- Reading boxes -->
  <rect x="60" y="268" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="286" text-anchor="middle" font-size="11" fill="#333">行0: PAHN</text>

  <rect x="200" y="268" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="286" text-anchor="middle" font-size="11" fill="#333">行1: APLSIIG</text>

  <rect x="400" y="268" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="286" text-anchor="middle" font-size="11" fill="#333">行2: YIR</text>

  <!-- Final result -->
  <rect x="120" y="312" width="320" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结果: PAHNAPLSIIGYIR</text>
</svg>
