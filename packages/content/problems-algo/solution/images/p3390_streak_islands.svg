<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：全局行号 rn_all − 队内行号 rn_team = 连击岛</text>

  <!-- legend -->
  <rect x="118" y="36" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="134" y="46" font-size="10.5" fill="#446688" filter="url(#rough2)">Arsenal 队内传球</text>
  <rect x="252" y="36" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="268" y="46" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">Chelsea 队内传球</text>
  <rect x="392" y="36" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="408" y="46" font-size="10.5" fill="#b85450" filter="url(#rough2)">被截获（跨队传球）</text>

  <!-- row labels -->
  <text x="62" y="78" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">传球序列</text>
  <text x="62" y="126" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">rn_all（全集）</text>
  <text x="62" y="150" text-anchor="end" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">rn_team（队内）</text>
  <text x="62" y="174" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">grp = 差值</text>
  <text x="62" y="212" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">连击岛</text>

  <!-- pass boxes: 10 cols, pitch 48, box w=42 h=42, y=56 -->
  <rect x="68" y="56" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="89" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1→2</text>
  <text x="89" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">00:05</text>

  <rect x="116" y="56" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2→3</text>
  <text x="137" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">00:07</text>

  <rect x="164" y="56" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3→4</text>
  <text x="185" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">00:08</text>

  <rect x="212" y="56" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="74" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4→5</text>
  <text x="233" y="90" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">00:10</text>

  <rect x="260" y="56" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6→7</text>
  <text x="281" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">00:15</text>

  <rect x="308" y="56" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7→8</text>
  <text x="329" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">00:17</text>

  <rect x="356" y="56" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8→6</text>
  <text x="377" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">00:20</text>

  <rect x="404" y="56" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6→5</text>
  <text x="425" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">00:22</text>

  <rect x="452" y="56" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="473" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1→2</text>
  <text x="473" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">00:25</text>

  <rect x="500" y="56" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="521" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2→3</text>
  <text x="521" y="90" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">00:27</text>

  <!-- rn_all row -->
  <text x="89" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="137" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="185" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="233" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="281" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="329" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="377" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="425" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="473" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="521" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- rn_team row -->
  <text x="89" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="137" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="185" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="233" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="281" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="329" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="377" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="425" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="473" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="521" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- grp row -->
  <text x="89" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="137" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="185" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="233" y="174" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="281" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="329" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="377" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="425" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="473" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="521" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- islands -->
  <rect x="68" y="190" width="138" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="137" y="211" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Arsenal 岛 × 3</text>

  <rect x="260" y="190" width="186" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="353" y="211" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Chelsea 岛 × 4</text>

  <rect x="452" y="190" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="497" y="211" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Arsenal × 2</text>

  <!-- annotation -->
  <rect x="24" y="238" width="512" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="262" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">⚠️ 关键：rn_all 要在【过滤前】的全集上编号——被截获的 4→5 也占一个行号</text>
  <text x="40" y="284" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">它不占任何队的 rn_team，于是 Arsenal 前后两段的 grp 从 0 跳到 5，正确断开成两段</text>
  <text x="40" y="312" font-size="11.5" fill="#b85450" filter="url(#rough2)">若先 WHERE 过滤再编号：4→5 不占行号，两段 grp 都是 0，被误并成 5 连击 ✗</text>

  <!-- result -->
  <rect x="24" y="348" width="512" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每队取岛长 MAX：Chelsea = 4，Arsenal = 3</text>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">按 pass_streak 降序、team_name 升序输出</text>
</svg>
