<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按位数分类，逐位选互不重复的数字</text>

  <!-- k 位数的 4 个数位方框（以 k=4 为例），每个 60x60，间距 18，起始 x=92 -->
  <!-- 位 1 -->
  <rect x="92" y="70" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="122" y="108" text-anchor="middle" font-size="22" fill="#446688" font-weight="bold">d₁</text>
  <!-- 位 2 -->
  <rect x="170" y="70" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="108" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold">d₂</text>
  <!-- 位 3 -->
  <rect x="248" y="70" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="278" y="108" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold">d₃</text>
  <!-- 位 4 -->
  <rect x="326" y="70" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="356" y="108" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold">d₄</text>

  <!-- 位数标签 k=4 -->
  <text x="410" y="108" font-size="13" fill="#888">（k = 4 位）</text>

  <!-- 每位可选数 量 pill -->
  <rect x="98" y="146" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="122" y="164" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">9</text>

  <rect x="176" y="146" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="200" y="164" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">9</text>

  <rect x="254" y="146" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="278" y="164" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">8</text>

  <rect x="332" y="146" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="356" y="164" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">7</text>

  <!-- 向下小箭头连接说明 -->
  <path d="M 122 174 L 122 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 174 L 200 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 说明：首位 -->
  <rect x="40" y="196" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="216" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">首位 d₁：1–9（非 0）</text>
  <text x="130" y="232" text-anchor="middle" font-size="11" fill="#333">9 种选择</text>

  <!-- 说明：其余位 -->
  <rect x="240" y="196" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">第 j 位：0–9 中去掉已用</text>
  <text x="380" y="232" text-anchor="middle" font-size="11" fill="#333">可选 = 10 − (j−1) = 11 − j 种</text>

  <!-- 公式结论 -->
  <rect x="40" y="262" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">g(k) = 9 × 9 × 8 × … × (11−k) ， k ≥ 2</text>

  <!-- 总数公式 -->
  <rect x="40" y="312" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#333">f(n) = 1 + Σ g(k) ， 其中 1 是数字「0」，f(1)=1+9=10</text>
</svg>
