<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrSwap" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">仅仅反转字母：双指针核心思想</text>

  <!-- Legend -->
  <rect x="60" y="40" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="82" y="54" font-size="11" fill="#555">字母（参与反转）</text>
  <rect x="220" y="40" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="242" y="54" font-size="11" fill="#555">非字母（锁定原位）</text>

  <!-- Original string: ab-cd -->
  <text x="24" y="100" font-size="12" fill="#888">原串</text>

  <!-- Swap arrow above cells -->
  <path d="M 94 80 Q 190 50 286 80" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrSwap)" marker-start="url(#arrSwap)" filter="url(#rough2)"/>
  <text x="190" y="50" text-anchor="middle" font-size="11" fill="#b85450">交换字母</text>

  <!-- Cells: a b - c d -->
  <rect x="70" y="82" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="104" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="118" y="82" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="104" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="166" y="82" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="104" text-anchor="middle" font-size="13" fill="#333">-</text>
  <rect x="214" y="82" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="104" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="262" y="82" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="104" text-anchor="middle" font-size="13" fill="#333">d</text>

  <!-- L pointer below cell 0 -->
  <path d="M 94 130 L 94 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="144" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">L</text>

  <!-- R pointer below cell 4 -->
  <path d="M 286 130 L 286 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="144" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">R</text>

  <!-- Direction arrows L→ and ←R -->
  <text x="190" y="144" text-anchor="middle" font-size="10" fill="#888">L→        ←R</text>

  <!-- Result string: dc-ba -->
  <text x="24" y="196" font-size="12" fill="#888">结果</text>

  <rect x="70" y="178" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="118" y="178" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="166" y="178" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="200" text-anchor="middle" font-size="13" fill="#333">-</text>
  <rect x="214" y="178" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="262" y="178" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <!-- Lock annotation on non-letter -->
  <text x="190" y="226" text-anchor="middle" font-size="10" fill="#d6a040">↑ 原位不动</text>

  <!-- Key insight box -->
  <rect x="40" y="244" width="440" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心：双指针从两端向中间扫描</text>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#555">字母 ↔ 字母：交换后 L++, R−−</text>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#555">非字母：跳过（L++ 或 R−−），保持原位</text>
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#888">L ≥ R 时停止</text>
</svg>
