<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：votes = ["WXYZ","XYZW"] → "XWYZ"</text>

  <!-- 2 张选票 -->
  <text x="30" y="54" font-size="12" fill="#666" font-weight="bold">2 张选票</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold">
    <rect x="30" y="62" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="70" y="79" text-anchor="middle" fill="#333">WXYZ</text>
    <rect x="118" y="62" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="158" y="79" text-anchor="middle" fill="#333">XYZW</text>
  </g>

  <!-- arrow 投票 → 矩阵 -->
  <path d="M158 92 L158 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="280" y="110" font-size="11" fill="#446688" font-weight="bold">统计每位次票数 → 位次计数矩阵</text>

  <!-- 位次计数矩阵 4×4 -->
  <text x="30" y="134" font-size="12" fill="#666" font-weight="bold">位次计数矩阵</text>
  <g filter="url(#rough2)">
    <!-- 列头 -->
    <rect x="80" y="142" width="46" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="103" y="159" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">团队</text>
    <rect x="126" y="142" width="46" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="149" y="159" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">位0</text>
    <rect x="172" y="142" width="46" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="195" y="159" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">位1</text>
    <rect x="218" y="142" width="46" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="241" y="159" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">位2</text>
    <rect x="264" y="142" width="46" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="287" y="159" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">位3</text>
    <!-- 行 W -->
    <rect x="80" y="166" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="103" y="183" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">W</text>
    <rect x="126" y="166" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="149" y="183" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <rect x="172" y="166" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="195" y="183" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="218" y="166" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="241" y="183" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="264" y="166" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="287" y="183" text-anchor="middle" font-size="12" fill="#888">1</text>
    <!-- 行 X -->
    <rect x="80" y="190" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="103" y="207" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">X</text>
    <rect x="126" y="190" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="149" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <rect x="172" y="190" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="195" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <rect x="218" y="190" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="241" y="207" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="264" y="190" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="287" y="207" text-anchor="middle" font-size="12" fill="#888">0</text>
    <!-- 行 Y -->
    <rect x="80" y="214" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="103" y="231" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Y</text>
    <rect x="126" y="214" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="149" y="231" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="172" y="214" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="195" y="231" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="218" y="214" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="241" y="231" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="264" y="214" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="287" y="231" text-anchor="middle" font-size="12" fill="#888">0</text>
    <!-- 行 Z -->
    <rect x="80" y="238" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="103" y="255" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Z</text>
    <rect x="126" y="238" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="149" y="255" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="172" y="238" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="195" y="255" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="218" y="238" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="241" y="255" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
    <rect x="264" y="238" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="287" y="255" text-anchor="middle" font-size="12" fill="#888">0</text>
  </g>

  <!-- W vs X 逐位次比较 -->
  <text x="350" y="134" font-size="12" fill="#666" font-weight="bold">W vs X 逐位次比较</text>
  <g filter="url(#rough2)" font-size="11">
    <!-- 位0 -->
    <rect x="350" y="142" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="360" y="160" fill="#333" font-weight="bold">位0：</text>
    <text x="408" y="160" fill="#446688" font-weight="bold">W=1</text>
    <text x="448" y="160" fill="#888">vs</text>
    <text x="478" y="160" fill="#b85450" font-weight="bold">X=1</text>
    <text x="556" y="160" text-anchor="end" fill="#d6a040" font-weight="bold">并列</text>
    <!-- 位1 -->
    <rect x="350" y="172" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="360" y="190" fill="#333" font-weight="bold">位1：</text>
    <text x="408" y="190" fill="#446688" font-weight="bold">W=0</text>
    <text x="448" y="190" fill="#888">vs</text>
    <text x="478" y="190" fill="#b85450" font-weight="bold">X=1</text>
    <text x="556" y="190" text-anchor="end" fill="#b85450" font-weight="bold">X 胜 →</text>
  </g>
  <text x="350" y="216" font-size="11" fill="#888">位0 并列 → 看位1：X 的 1 &gt; W 的 0，X 排在 W 前</text>

  <!-- 全员排序结果 -->
  <path d="M460 200 L460 244" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="350" y="252" font-size="12" fill="#666" font-weight="bold">全员排序（向量降序）</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="350" y="260" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="365" y="278" fill="#333" font-weight="bold">X</text>
    <text x="455" y="278" text-anchor="middle" fill="#b85450" font-weight="bold">[1,1,0,0]</text>
    <text x="556" y="278" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">第1</text>

    <rect x="350" y="290" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="365" y="308" fill="#333" font-weight="bold">W</text>
    <text x="455" y="308" text-anchor="middle" fill="#446688" font-weight="bold">[1,0,0,1]</text>
    <text x="556" y="308" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">第2</text>

    <rect x="350" y="320" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="365" y="338" fill="#333" font-weight="bold">Y</text>
    <text x="455" y="338" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[0,2,0,0]</text>
    <text x="556" y="338" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">第3</text>

    <rect x="350" y="350" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="365" y="368" fill="#333" font-weight="bold">Z</text>
    <text x="455" y="368" text-anchor="middle" fill="#d6a040" font-weight="bold">[0,0,2,0]</text>
    <text x="556" y="368" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">第4</text>
  </g>

  <!-- 答案框 -->
  <path d="M210 384 L210 410" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <rect x="140" y="416" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="442" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">结果 = "XWYZ"</text>
</svg>
