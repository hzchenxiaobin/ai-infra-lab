<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">通配符 * 与 ? 的语义</text>

  <!-- ? matches single char -->
  <text x="40" y="68" font-size="12" fill="#888">?</text>
  <rect x="70" y="50" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="71" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">?</text>
  <text x="138" y="71" font-size="11" fill="#888">→ 匹配任意</text>
  <text x="138" y="86" font-size="11" fill="#888">单个字符</text>
  <rect x="240" y="50" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="284" y="50" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="71" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Z</text>
  <rect x="328" y="50" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="71" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="378" y="71" font-size="10" fill="#4a7a3a">都行 ✓</text>

  <!-- * matches any sequence -->
  <text x="40" y="128" font-size="12" fill="#888">*</text>
  <rect x="70" y="110" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="131" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">*</text>
  <text x="138" y="126" font-size="11" fill="#888">→ 匹配任意长度</text>
  <text x="138" y="141" font-size="11" fill="#888">的任意字符序列</text>
  <rect x="268" y="110" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">""</text>
  <rect x="318" y="110" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"a"</text>
  <rect x="368" y="110" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"abc…"</text>
  <text x="432" y="131" font-size="10" fill="#4a7a3a">都行 ✓</text>

  <!-- Contrast with regex -->
  <rect x="30" y="166" width="520" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="190" font-size="12" fill="#b85450" font-weight="bold">⚠ 与正则（10 题）的 * 完全不同</text>
  <text x="50" y="212" font-size="11" fill="#555">正则 a* 中的 * 修饰前面的 a：表示 a 出现零次或多次</text>
  <text x="50" y="230" font-size="11" fill="#555">通配符 * 单独使用：不依赖任何前导字符，直接吞掉任意长度的串</text>
  <text x="50" y="248" font-size="11" fill="#b85450">→ DP 转移因此更简单：* 不需要看 p[j-2]</text>

  <!-- DP two branches for * -->
  <text x="290" y="284" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">遇到 * 时的两个分支（取「或」）</text>

  <path d="M 98 146 Q 98 200 155 294" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr1)" filter="url(#rough2)" stroke-dasharray="4,2"/>
  <path d="M 98 146 Q 280 200 405 294" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)" stroke-dasharray="4,2"/>

  <rect x="40" y="296" width="230" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="320" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">分支①：* 匹配空串</text>
  <text x="155" y="342" text-anchor="middle" font-size="11" fill="#555">跳过 *，模式前进一步</text>
  <text x="155" y="366" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">dp[i][j] |= dp[i][j-1]</text>

  <rect x="290" y="296" width="230" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="320" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">分支②：* 再吞一个字符</text>
  <text x="405" y="342" text-anchor="middle" font-size="11" fill="#555">串前进一步，模式不动</text>
  <text x="405" y="366" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">dp[i][j] |= dp[i-1][j]</text>
</svg>
