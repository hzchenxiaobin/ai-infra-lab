<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">一遍扫描：维护前缀最大值 cur，数有多少元素「顶得住」</text>

  <!-- 开始 -->
  <rect x="232" y="38" width="96" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 280 68 L 280 86" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="192" y="90" width="176" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cur = 0，ans = 0</text>
  <text x="382" y="113" font-size="10" fill="#999" filter="url(#rough2)">（值域 ≥ 1，0 当 −∞）</text>
  <path d="M 280 128 L 280 146" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="196" y="150" width="168" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个元素 x</text>
  <path d="M 280 188 L 280 206" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,210 384,244 280,278 176,244" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">x ≥ cur ?</text>

  <!-- 是：幸存 -->
  <path d="M 384 244 L 410 244" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">是</text>
  <rect x="414" y="220" width="132" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">ans += 1</text>
  <text x="480" y="258" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">cur = x（幸存）</text>

  <!-- 否：被吸收 -->
  <path d="M 176 244 L 150 244" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="14" y="220" width="132" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">跳过 x</text>
  <text x="80" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">并入相邻块（被吸收）</text>

  <!-- 汇合 -->
  <path d="M 80 270 L 80 298" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 480 270 L 480 298" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 80 298 L 480 298" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 280 298 L 280 304" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 还有元素? -->
  <polygon points="280,308 362,338 280,368 198,338" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">还有元素?</text>

  <!-- 是：回环 -->
  <path d="M 280 368 L 280 386 L 554 386 L 554 169 L 372 169" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="380" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是（继续）</text>

  <!-- 否：返回 -->
  <path d="M 362 338 L 402 338" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="406" y="323" width="104" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="343" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 ans</text>

  <!-- 底部注记 -->
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cur 只增不减：每个元素只和「左侧历史最大值」比一次 —— O(n) 时间 / O(1) 空间</text>
</svg>
