<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：十六进制 16 个数码分三类，仅 0/1/A-F 能拼成「单词」</text>

  <!-- ===== Section 1: 16-digit mapping table (stacked boxes) ===== -->
  <text x="40" y="50" font-size="11" fill="#888">十六进制数码 → 输出字符（每格上=hex 数码，下=映射结果）</text>

  <!-- 16 stacked boxes: x = 40 + i*30, width=26, y=58, height=52 -->
  <!-- box 0: 0 -> O (green) -->
  <rect x="40" y="58" width="26" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="53" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <path d="M 53 80 L 53 90" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="53" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">O</text>

  <!-- box 1: 1 -> I (green) -->
  <rect x="70" y="58" width="26" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="83" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <path d="M 83 80 L 83 90" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="83" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">I</text>

  <!-- boxes 2-9: digits 2-9 -> ✗ (red) -->
  <rect x="100" y="58" width="26" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="113" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <path d="M 113 80 L 113 90" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="113" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <rect x="130" y="58" width="26" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="143" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <path d="M 143 80 L 143 90" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="143" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <rect x="160" y="58" width="26" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="173" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <path d="M 173 80 L 173 90" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="173" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <rect x="190" y="58" width="26" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="203" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <path d="M 203 80 L 203 90" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="203" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <rect x="220" y="58" width="26" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="233" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <path d="M 233 80 L 233 90" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="233" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <rect x="250" y="58" width="26" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="263" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <path d="M 263 80 L 263 90" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="263" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <rect x="280" y="58" width="26" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="293" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <path d="M 293 80 L 293 90" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="293" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <rect x="310" y="58" width="26" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="323" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <path d="M 323 80 L 323 90" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="323" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- boxes 10-15: A-F -> keep (blue) -->
  <rect x="340" y="58" width="26" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="353" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <path d="M 353 80 L 353 90" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="353" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">A</text>

  <rect x="370" y="58" width="26" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="383" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>
  <path d="M 383 80 L 383 90" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="383" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>

  <rect x="400" y="58" width="26" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="413" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">C</text>
  <path d="M 413 80 L 413 90" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="413" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">C</text>

  <rect x="430" y="58" width="26" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="443" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">D</text>
  <path d="M 443 80 L 443 90" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="443" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">D</text>

  <rect x="460" y="58" width="26" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="473" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">E</text>
  <path d="M 473 80 L 473 90" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="473" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">E</text>

  <rect x="490" y="58" width="26" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="503" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">F</text>
  <path d="M 503 80 L 503 90" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="503" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">F</text>

  <!-- group brackets + labels -->
  <path d="M 40 116 L 40 122 L 96 122 L 96 116" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="68" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0/1 替换</text>

  <path d="M 100 116 L 100 122 L 336 122 L 336 116" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="218" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2-9 → 非法（直接 ERROR）</text>

  <path d="M 340 116 L 340 122 L 516 122 L 516 116" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="428" y="136" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">A-F 原样保留</text>

  <!-- ===== Section 2: Pipeline examples ===== -->
  <text x="40" y="164" font-size="11" fill="#888" font-weight="bold">转换管道（两个对照用例）：</text>

  <!-- Valid pipeline: 257 -> 101 -> IOI -->
  <rect x="40" y="176" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="68" y="190" text-anchor="middle" font-size="9" fill="#888">十进制串</text>
  <text x="68" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"257"</text>

  <path d="M 96 192 L 122 192" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="122" y="176" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="190" text-anchor="middle" font-size="9" fill="#d6a040">转 hex</text>
  <text x="150" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"101"</text>

  <path d="M 178 192 L 204 192" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="191" y="187" text-anchor="middle" font-size="8.5" fill="#4a7a3a">1→I 0→O</text>

  <rect x="204" y="176" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="234" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a">结果 ✓</text>
  <text x="234" y="203" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"IOI"</text>

  <!-- Invalid pipeline: 619 -> 26B -> ERROR -->
  <rect x="40" y="222" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="68" y="236" text-anchor="middle" font-size="9" fill="#888">十进制串</text>
  <text x="68" y="249" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"619"</text>

  <path d="M 96 238 L 122 238" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="122" y="222" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="9" fill="#d6a040">转 hex</text>
  <text x="150" y="249" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"26B"</text>

  <path d="M 178 238 L 204 238" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="191" y="233" text-anchor="middle" font-size="8.5" fill="#b85450">含 2,6</text>

  <rect x="204" y="222" width="76" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="242" y="236" text-anchor="middle" font-size="9" fill="#b85450">结果 ✗</text>
  <text x="242" y="249" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"ERROR"</text>

  <!-- ===== Section 3: Decision logic ===== -->
  <rect x="300" y="176" width="230" height="78" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="415" y="194" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">判定逻辑</text>
  <text x="415" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 全为 {0, 1, A-F}：替换 0→O、1→I</text>
  <text x="415" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a">　 返回替换后的字符串</text>
  <text x="415" y="242" text-anchor="middle" font-size="10" fill="#b85450">✗ 含任意 {2..9}：返回 "ERROR"</text>

  <!-- bottom note -->
  <rect x="40" y="280" width="490" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="285" y="298" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">本质：hex 数码中只有 0、1 能被「伪装成字母」（O、I），A-F 本身就是字母，</text>
  <text x="285" y="314" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">而 2-9 无法写成任何字母 → 出现即非法。</text>

  <!-- small ascii-art-free diagram note -->
  <text x="285" y="350" text-anchor="middle" font-size="10" fill="#aaa">合法 Hexspeak 字母表 = {A,B,C,D,E,F,I,O}　（恰好 8 个大写字母）</text>
  <text x="285" y="368" text-anchor="middle" font-size="10" fill="#aaa">十进制串 → long long → 大写 hex 串 → 逐字符校验 + 映射 → 返回</text>
</svg>
