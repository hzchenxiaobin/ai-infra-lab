<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：target = "code"</text>

  <!-- ===== Mini board (left) ===== -->
  <text x="110" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">字母板路径</text>

  <!-- Row 0: a b c d e -->
  <rect x="36" y="58" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="68" y="58" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="76" text-anchor="middle" font-size="10" fill="#bbb">b</text>
  <rect x="100" y="58" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="76" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">c</text>
  <rect x="132" y="58" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="76" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d</text>
  <rect x="164" y="58" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="76" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">e</text>

  <!-- Row 1: f g h i j -->
  <rect x="36" y="84" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="102" text-anchor="middle" font-size="10" fill="#bbb">f</text>
  <rect x="68" y="84" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="102" text-anchor="middle" font-size="10" fill="#bbb">g</text>
  <rect x="100" y="84" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="102" text-anchor="middle" font-size="10" fill="#bbb">h</text>
  <rect x="132" y="84" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="148" y="102" text-anchor="middle" font-size="10" fill="#bbb">i</text>
  <rect x="164" y="84" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="102" text-anchor="middle" font-size="10" fill="#bbb">j</text>

  <!-- Row 2: k l m n o -->
  <rect x="36" y="110" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="128" text-anchor="middle" font-size="10" fill="#bbb">k</text>
  <rect x="68" y="110" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="128" text-anchor="middle" font-size="10" fill="#bbb">l</text>
  <rect x="100" y="110" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="128" text-anchor="middle" font-size="10" fill="#bbb">m</text>
  <rect x="132" y="110" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="148" y="128" text-anchor="middle" font-size="10" fill="#bbb">n</text>
  <rect x="164" y="110" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">o</text>

  <!-- Row 3: p q r s t -->
  <rect x="36" y="136" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="154" text-anchor="middle" font-size="10" fill="#bbb">p</text>
  <rect x="68" y="136" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="154" text-anchor="middle" font-size="10" fill="#bbb">q</text>
  <rect x="100" y="136" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="154" text-anchor="middle" font-size="10" fill="#bbb">r</text>
  <rect x="132" y="136" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="148" y="154" text-anchor="middle" font-size="10" fill="#bbb">s</text>
  <rect x="164" y="136" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="154" text-anchor="middle" font-size="10" fill="#bbb">t</text>

  <!-- Row 4: u v w x y -->
  <rect x="36" y="162" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="180" text-anchor="middle" font-size="10" fill="#bbb">u</text>
  <rect x="68" y="162" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="180" text-anchor="middle" font-size="10" fill="#bbb">v</text>
  <rect x="100" y="162" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="180" text-anchor="middle" font-size="10" fill="#bbb">w</text>
  <rect x="132" y="162" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="148" y="180" text-anchor="middle" font-size="10" fill="#bbb">x</text>
  <rect x="164" y="162" width="32" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="180" text-anchor="middle" font-size="10" fill="#bbb">y</text>

  <!-- Row 5: z -->
  <rect x="36" y="188" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="52" y="206" text-anchor="middle" font-size="10" fill="#bbb">z</text>

  <!-- Path arrows: S→1→2→3→4 -->
  <!-- S(a)→1(c): RR along row 0 -->
  <path d="M 52 66 L 116 66" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- 1(c)→2(o): RR then DD -->
  <path d="M 116 70 L 180 70 L 180 110" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- 2(o)→3(d): L then UU -->
  <path d="M 180 118 L 148 118 L 148 84" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- 3(d)→4(e): R -->
  <path d="M 148 62 L 180 62" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Numbered circles -->
  <circle cx="52" cy="56" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="52" y="60" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">S</text>
  <circle cx="116" cy="52" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="116" y="56" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1</text>
  <circle cx="180" cy="104" r="9" fill="#446688" filter="url(#rough2)"/>
  <text x="180" y="108" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>
  <circle cx="148" cy="52" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="148" y="56" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">3</text>
  <circle cx="180" cy="52" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="180" y="56" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">4</text>

  <!-- ===== Step table (right) ===== -->
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">逐步演算</text>

  <!-- Header -->
  <rect x="270" y="58" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="285" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">#</text>
  <rect x="300" y="58" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="318" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ch</text>
  <rect x="336" y="58" width="68" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">起点→终点</text>
  <rect x="404" y="58" width="66" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="437" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">指令</text>

  <!-- Row 1: c -->
  <rect x="270" y="84" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="285" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <rect x="300" y="84" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="318" y="100" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">c</text>
  <rect x="336" y="84" width="68" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="370" y="100" text-anchor="middle" font-size="9.5" fill="#555">(0,0)→(0,2)</text>
  <rect x="404" y="84" width="66" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="437" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">RR!</text>

  <!-- Row 2: o -->
  <rect x="270" y="110" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="285" y="126" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <rect x="300" y="110" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="318" y="126" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">o</text>
  <rect x="336" y="110" width="68" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="370" y="126" text-anchor="middle" font-size="9.5" fill="#555">(0,2)→(2,4)</text>
  <rect x="404" y="110" width="66" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="437" y="126" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">RRDD!</text>

  <!-- Row 3: d -->
  <rect x="270" y="136" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="285" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="300" y="136" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="318" y="152" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">d</text>
  <rect x="336" y="136" width="68" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="370" y="152" text-anchor="middle" font-size="9.5" fill="#555">(2,4)→(0,3)</text>
  <rect x="404" y="136" width="66" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="437" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">LUU!</text>

  <!-- Row 4: e -->
  <rect x="270" y="162" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="285" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <rect x="300" y="162" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="318" y="178" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">e</text>
  <rect x="336" y="162" width="68" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="370" y="178" text-anchor="middle" font-size="9.5" fill="#555">(0,3)→(0,4)</text>
  <rect x="404" y="162" width="66" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="437" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">R!</text>

  <!-- Result -->
  <rect x="270" y="200" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">累计输出</text>
  <text x="370" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">RR!RRDD!LUU!R!</text>

  <!-- Note -->
  <rect x="40" y="250" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">关键：非 z 间移动顺序任意（水平/竖直均可先走）</text>
  <text x="270" y="286" text-anchor="middle" font-size="10" fill="#555">本解法统一「先水平后竖直」；去 z 时 L 先于 D，离 z 时 U 先于 R</text>
  <text x="270" y="300" text-anchor="middle" font-size="10" fill="#888">题目允许任意合法路径，输出不必与示例逐字符相同</text>
</svg>
