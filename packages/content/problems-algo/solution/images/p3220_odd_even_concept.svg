<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一次 GROUP BY，组内按 amount 奇偶分流到两个「桶」</text>

  <rect x="28" y="56" width="210" height="196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="133" y="80" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2024-07-01（一个分组）</text>

  <rect x="48" y="94" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">amount = 150（偶）</text>

  <rect x="48" y="136" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">amount = 200（偶）</text>

  <rect x="48" y="178" width="170" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">amount = 75（奇）</text>

  <rect x="350" y="70" width="145" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="422" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">odd_sum 桶（奇数）</text>
  <text x="422" y="122" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">75</text>

  <rect x="350" y="180" width="145" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="422" y="202" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">even_sum 桶（偶数）</text>
  <text x="422" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">150 + 200</text>
  <text x="422" y="248" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">= 350</text>

  <path d="M 218 108 C 280 118, 292 190, 346 212" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 218 150 C 282 162, 292 206, 346 226" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 218 192 C 292 186, 282 128, 346 110" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <text x="283" y="196" font-size="10" fill="#b85450" filter="url(#rough2)">奇数行只进奇桶</text>
  <text x="283" y="248" font-size="10" fill="#446688" filter="url(#rough2)">偶数行只进偶桶</text>

  <rect x="60" y="284" width="400" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">某天清一色偶数 → 奇数桶一粒米都没有（空集）</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">SUM(空集) = NULL ≠ 0，必须 ELSE 0 垫底</text>

  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个分组跑一遍：一趟 GROUP BY 同时产出两列小计</text>
</svg>
