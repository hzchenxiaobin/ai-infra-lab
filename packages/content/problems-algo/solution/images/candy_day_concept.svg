<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：前缀和定位糖果区间，日累积区间与之相交
  </text>

  <!-- ===== Row 1: candy sequence with type boundaries ===== -->
  <text x="40" y="60" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">糖果序列</text>

  <!-- 5 type blocks: widths proportional to [7,4,5,3,8]=27 total; scale ~14px/unit -->
  <!-- type0: x=70..168 (w=98) -->
  <rect x="70" y="44" width="98" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="65" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">类型0 (7颗)</text>
  <!-- type1: x=168..224 (w=56) -->
  <rect x="168" y="44" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="65" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">类型1(4)</text>
  <!-- type2: x=224..294 (w=70) -->
  <rect x="224" y="44" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="65" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">类型2(5)</text>
  <!-- type3: x=294..336 (w=42) -->
  <rect x="294" y="44" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="65" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">T3(3)</text>
  <!-- type4: x=336..448 (w=112) -->
  <rect x="336" y="44" width="112" height="34" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="65" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">类型4 (8颗)</text>

  <!-- prefix sum ticks below the sequence -->
  <text x="70" y="92" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">s[0]=0</text>
  <text x="168" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">s[1]=7</text>
  <text x="224" y="92" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">s[2]=11</text>
  <text x="294" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">s[3]=16</text>
  <text x="336" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s[4]=19</text>
  <text x="448" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s[5]=27</text>

  <!-- ===== Row 2: type t interval ===== -->
  <text x="40" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">类型t区间</text>

  <text x="300" y="124" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    第 t 类糖果 = 全局序号 [ s[t]+1 ,  s[t+1] ]
  </text>

  <!-- highlight type 2 interval [12,16] -> x 224..294 -->
  <rect x="224" y="138" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="259" y="157" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">[12, 16]</text>

  <!-- brace showing the interval -->
  <path d="M224,172 L224,180 L294,180 L294,172" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="259" y="194" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">favoriteType = 2 的序号区间</text>

  <!-- ===== Row 3: day cumulative interval ===== -->
  <text x="40" y="220" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第day天累积</text>

  <text x="300" y="216" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    第 day 天吃的序号 ∈ [ least+1 ,  most ]
  </text>

  <!-- a wide interval bar representing [least+1, most] overlapping type2 -->
  <rect x="120" y="230" width="320" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="249" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">least+1</text>
  <text x="425" y="249" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">most</text>
  <text x="280" y="249" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">第 day 天可能覆盖的序号范围</text>

  <!-- overlap region: intersection of [12,16] (x224..294) and day interval -->
  <rect x="224" y="230" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)" opacity="0.85"/>
  <text x="259" y="249" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">相交!</text>

  <!-- arrow showing overlap -->
  <path d="M259,264 L259,278" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Row 4: intersection condition ===== -->
  <rect x="60" y="284" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    相交 ⟺ most &gt; s[t]  (能到达)  且  least &lt; s[t+1]  (未越过)
  </text>
  <text x="300" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">
    最快到达 vs 最慢离开 —— 两个极端都成立则存在合法安排
  </text>

  <!-- ===== Row 5: extreme values explanation ===== -->
  <rect x="60" y="338" width="230" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="356" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">most = (day+1) × dailyCap</text>
  <text x="175" y="372" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">每天吃满 → 最快抵达类型 t</text>
  <text x="175" y="388" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不满足 ⇒ 吃太慢，到不了</text>

  <rect x="310" y="338" width="230" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="356" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">least = day</text>
  <text x="425" y="372" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">每天吃 1 颗 → 最慢离开类型 t</text>
  <text x="425" y="388" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不满足 ⇒ 吃太快，已越过</text>

</svg>
