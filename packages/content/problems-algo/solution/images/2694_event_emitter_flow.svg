<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">subscribe / emit / unsubscribe 流程</text>

  <!-- ============ subscribe 路径（绿，上半） ============ -->
  <text x="140" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">subscribe(eventName, callback)</text>

  <rect x="60" y="70" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="91" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">events.has(eventName) ?</text>

  <!-- 是 -->
  <path d="M 140 104 L 140 120" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="116" font-size="9" fill="#999" filter="url(#rough2)">否</text>
  <rect x="60" y="120" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="139" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">set(eventName, [])</text>

  <!-- 否（直接） -->
  <path d="M 220 87 L 260 87 L 260 158 L 220 158" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="235" y="82" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 140 150 L 140 165" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="60" y="165" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">listeners = get(eventName)</text>

  <path d="M 140 195 L 140 208" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="60" y="208" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="227" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">listeners.push(callback)</text>

  <path d="M 140 238 L 140 250" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="50" y="250" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return { unsubscribe }</text>

  <!-- ============ emit 路径（橙，右半） ============ -->
  <text x="400" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">emit(eventName, args = [])</text>

  <rect x="320" y="70" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="91" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">listeners = get(eventName)</text>

  <path d="M 400 104 L 400 120" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 判空菱形 -->
  <polygon points="400,120 470,150 400,180 330,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="148" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">为空 / 不存在?</text>
  <text x="400" y="161" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)"></text>

  <!-- 空 → [] -->
  <path d="M 330 150 L 290 150 L 290 210" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="298" y="145" font-size="9" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="230" y="210" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">return [ ]</text>

  <!-- 非空 → map -->
  <path d="M 400 180 L 400 200" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="408" y="195" font-size="9" fill="#d6a040" filter="url(#rough2)">否</text>
  <rect x="320" y="200" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="221" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">map(cb → cb(...args))</text>

  <path d="M 400 234 L 400 250" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="310" y="250" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">return [结果1, 结果2, ...]</text>

  <!-- ============ unsubscribe 路径（红，下方） ============ -->
  <text x="280" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">unsubscribe()（闭包）</text>

  <rect x="100" y="328" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="347" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">idx = listeners.indexOf(callback)</text>

  <path d="M 180 358 L 180 370" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="100" y="370" width="160" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="389" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">if idx≠-1: splice(idx, 1)</text>

  <!-- 闭包连接：unsubscribe 引用 listeners -->
  <path d="M 260 343 Q 340 343 400 284" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="330" y="340" font-size="9" fill="#b85450" filter="url(#rough2)">捕获 listeners + callback</text>

  <path d="M 340 385 L 380 385" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="380" y="370" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="389" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">return undefined</text>
</svg>
