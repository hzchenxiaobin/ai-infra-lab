<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：4 个账户的登录区间与禁止判定</text>
  <path d="M 160 36 Q 380 44 600 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- column headers -->
  <text x="60" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">账户</text>
  <text x="340" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">两条登录区间（IP 甲 / IP 乙）</text>
  <text x="660" y="62" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">判定</text>

  <!-- ===== Row 1: account 1 (banned - full overlap) ===== -->
  <g filter="url(#rough2)"><rect x="30" y="76" width="60" height="80" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="60" y="112" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <text x="60" y="132" text-anchor="middle" font-size="8" fill="#b85450">02-01</text>

  <!-- timeline -->
  <line x1="130" y1="116" x2="560" y2="116" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="100" font-size="8" fill="#888">08:00</text>
  <text x="556" y="100" font-size="8" fill="#888" text-anchor="end">11:30</text>
  <!-- ip2: 08:00-11:30 (full) -->
  <g filter="url(#rough2)"><rect x="130" y="106" width="430" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
  <text x="345" y="117" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">IP 2  08:00→11:30</text>
  <!-- ip1: 09:00-09:30 (middle, overlap) -->
  <g filter="url(#rough2)"><rect x="252" y="124" width="62" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="283" y="146" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">IP 1  09:00→09:30</text>
  <!-- overlap highlight -->
  <g filter="url(#rough2)"><rect x="252" y="106" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>

  <g filter="url(#rough2)"><rect x="600" y="100" width="120" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="660" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">完全包含</text>
  <text x="660" y="120" text-anchor="middle" font-size="0" fill="#b85450">.</text>

  <!-- ===== Row 2: account 2 (not banned - different days) ===== -->
  <g filter="url(#rough2)"><rect x="30" y="166" width="60" height="80" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="60" y="202" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="60" y="222" text-anchor="middle" font-size="8" fill="#4a7a3a">跨日</text>

  <line x1="130" y1="206" x2="560" y2="206" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- ip6: Feb1 20:30-22:00 -->
  <g filter="url(#rough2)"><rect x="140" y="196" width="160" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="220" y="207" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">IP 6  02-01 20:30→22:00</text>
  <!-- day boundary -->
  <line x1="345" y1="190" x2="345" y2="224" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="345" y="186" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">跨天</text>
  <!-- ip7: Feb2 20:30-22:00 -->
  <g filter="url(#rough2)"><rect x="390" y="214" width="160" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
  <text x="470" y="225" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">IP 7  02-02 20:30→22:00</text>

  <g filter="url(#rough2)"><rect x="600" y="190" width="120" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="660" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">不同日 不重叠</text>

  <!-- ===== Row 3: account 3 (not banned - 1-sec gap) ===== -->
  <g filter="url(#rough2)"><rect x="30" y="256" width="60" height="80" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="60" y="292" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="60" y="312" text-anchor="middle" font-size="8" fill="#4a7a3a">差 1 秒</text>

  <line x1="130" y1="296" x2="560" y2="296" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="282" font-size="8" fill="#888">16:00</text>
  <text x="556" y="282" font-size="8" fill="#888" text-anchor="end">17:59:59</text>
  <!-- ip9: 16:00-16:59:59 -->
  <g filter="url(#rough2)"><rect x="130" y="286" width="200" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="230" y="297" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">IP 9  16:00→16:59:59</text>
  <!-- ip13: 17:00-17:59:59 -->
  <g filter="url(#rough2)"><rect x="334" y="304" width="226" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
  <text x="447" y="315" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">IP 13  17:00→17:59:59</text>
  <!-- gap marker -->
  <circle cx="332" cy="296" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="332" y="338" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">16:59:59→17:00 空档 1s</text>

  <g filter="url(#rough2)"><rect x="600" y="280" width="120" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="660" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">有空档 不重叠</text>

  <!-- ===== Row 4: account 4 (banned - exact touch) ===== -->
  <g filter="url(#rough2)"><rect x="30" y="346" width="60" height="80" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="60" y="382" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">4</text>
  <text x="60" y="402" text-anchor="middle" font-size="8" fill="#b85450">端点相接</text>

  <line x1="130" y1="386" x2="560" y2="386" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="372" font-size="8" fill="#888">16:00</text>
  <text x="556" y="372" font-size="8" fill="#888" text-anchor="end">17:59:59</text>
  <!-- ip10: 16:00-17:00:00 -->
  <g filter="url(#rough2)"><rect x="130" y="376" width="206" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="233" y="387" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">IP 10  16:00→17:00:00</text>
  <!-- ip11: 17:00-17:59:59 -->
  <g filter="url(#rough2)"><rect x="336" y="394" width="224" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/></g>
  <text x="448" y="405" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">IP 11  17:00→17:59:59</text>
  <!-- touch point -->
  <circle cx="336" cy="386" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="336" y="428" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">17:00:00 端点相接 = 同时在线</text>

  <g filter="url(#rough2)"><rect x="600" y="370" width="120" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="660" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">端点相接 重叠</text>

  <!-- final output note -->
  <g filter="url(#rough2)"><rect x="130" y="440" width="430" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="146" y="460" font-size="11" fill="#a06a10" font-weight="bold">输出（ORDER BY account_id）：account_id = 1, 4</text>
</svg>
