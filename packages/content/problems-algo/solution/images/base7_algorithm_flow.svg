<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：除 7 取余 + 符号处理</text>

  <!-- Start node -->
  <ellipse cx="260" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 读入 num</text>

  <path d="M 260 82 L 260 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: num == 0 ? -->
  <polygon points="260,104 380,146 260,188 140,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#333">num == 0 ?</text>
  <text x="260" y="158" text-anchor="middle" font-size="10.5" fill="#666">(特判零)</text>

  <!-- Yes branch -> return "0" -->
  <path d="M 140 146 L 96 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="138" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="20" y="178" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="199" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return "0"</text>
  <path d="M 60 146 L 60 178" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- No branch down -->
  <path d="M 260 188 L 260 206" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="202" font-size="11" fill="#b85450">否</text>

  <!-- negative = num < 0 ; n = abs(num) -->
  <rect x="120" y="210" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">negative = num &lt; 0 ;  n = abs(num)</text>

  <path d="M 260 244 L 260 262" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n > 0 ? -->
  <polygon points="260,266 380,308 260,350 140,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#333">n &gt; 0 ?</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#666">(还有七进制位未抠)</text>

  <!-- No branch -> append sign + reverse + return -->
  <path d="M 380 308 L 440 308" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="300" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="424" y="328" width="86" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="467" y="346" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">if neg</text>
  <text x="467" y="360" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">append '-'</text>
  <text x="467" y="376" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">reverse</text>
  <path d="M 467 308 L 467 328" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Yes branch down -->
  <path d="M 260 350 L 260 368" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="364" font-size="11" fill="#82b366">是</text>

  <!-- d = n % 7 ; append '0'+d -->
  <rect x="140" y="372" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="11.5" fill="#333">d = n % 7       （取最低七进制位）</text>
  <text x="260" y="408" text-anchor="middle" font-size="11.5" fill="#333">ans.append( '0' + d )</text>

  <path d="M 260 416 L 260 432" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- n /= 7 -->
  <rect x="170" y="436" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="456" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">n /= 7  （舍掉最低位）</text>

  <!-- loop back arrow to decision -->
  <path d="M 170 451 L 70 451 L 70 308 L 140 308" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="380" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 58 380)">回到循环判断</text>
</svg>
