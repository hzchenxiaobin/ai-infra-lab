<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：行对压缩 + 有序集合逼近</text>

  <!-- 1. 枚举上界 top -->
  <rect x="40" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 枚举上界 top = 0..m−1</text>

  <!-- 2. colSum 清零 -->
  <rect x="40" y="104" width="200" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="140" y="130" text-anchor="middle" font-size="12" fill="#333">② colSum[0..n−1] = 0</text>

  <!-- 3. 枚举下界 bottom -->
  <rect x="40" y="160" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 枚举下界 bottom = top..m−1</text>

  <!-- 4. 增量压缩 -->
  <rect x="40" y="216" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="242" text-anchor="middle" font-size="12" fill="#333">④ colSum[c] += matrix[bottom][c]</text>

  <!-- 连接箭头 (左列纵向) -->
  <path d="M140 88 V104 M140 144 V160 M140 200 V216" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 1D 求解 (大框) -->
  <rect x="280" y="160" width="240" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="184" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">⑤ 1D：求 ≤ k 的最大子段和</text>

  <!-- 5a. 初始化 -->
  <rect x="296" y="196" width="208" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="214" text-anchor="middle" font-size="11" fill="#333">prefSet = {0},  pref = 0</text>

  <!-- 5b. 遍历 c -->
  <rect x="296" y="232" width="208" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="250" text-anchor="middle" font-size="11" fill="#333">for c = 0..n−1:</text>

  <!-- 5c. pref 累加 -->
  <rect x="312" y="266" width="176" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="400" y="282" text-anchor="middle" font-size="10" fill="#444">pref += colSum[c]</text>

  <!-- 5d. lower_bound -->
  <rect x="312" y="296" width="176" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="400" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">it = lower_bound(pref − k)</text>

  <!-- 5e. 更新 ans -->
  <rect x="312" y="326" width="176" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="400" y="342" text-anchor="middle" font-size="10" fill="#444">ans = max(ans, pref − *it)</text>

  <!-- ④ → ⑤ 横向箭头 -->
  <path d="M240 236 H296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 内部小箭头 -->
  <path d="M400 224 V232 M400 260 V266 M400 290 V296 M400 320 V326" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑥ 插入 pref + 回到 ③ -->
  <rect x="40" y="296" width="200" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="140" y="316" text-anchor="middle" font-size="11" fill="#333">⑥ prefSet.insert(pref)</text>
  <text x="140" y="330" text-anchor="middle" font-size="10" fill="#999">(命中 k 可提前返回)</text>

  <!-- ⑤ → ⑥ 箭头 -->
  <path d="M296 338 H240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑥ → ③ 回环箭头 (bottom 循环) -->
  <path d="M30 180 H24 V316 H30" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="250" text-anchor="middle" font-size="9" fill="#446688" transform="rotate(-90 20 250)">bottom++</text>

  <!-- ⑦ 返回 -->
  <rect x="180" y="408" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑦ 返回 ans</text>

  <!-- ③ → ⑦ (外层 top 循环结束) 虚线 -->
  <path d="M240 180 H300 V408 H380" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="320" y="172" font-size="9" fill="#b85450">top 循环结束</text>
</svg>
