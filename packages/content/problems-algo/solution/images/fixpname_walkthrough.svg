<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：6 行脏数据 → 清洗 → 分组</text>

  <!-- ===== Header row ===== -->
  <rect x="20" y="46" width="56" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="62" text-anchor="middle" font-size="9" fill="white" font-weight="bold">sale_id</text>

  <rect x="80" y="46" width="140" height="24" fill="#b85450" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="62" text-anchor="middle" font-size="9" fill="white" font-weight="bold">脏 product_name</text>

  <rect x="224" y="46" width="40" height="24" fill="#666" stroke="#666" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="244" y="62" text-anchor="middle" font-size="9" fill="white" font-weight="bold">清洗</text>

  <rect x="268" y="46" width="120" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="62" text-anchor="middle" font-size="9" fill="white" font-weight="bold">归一化名</text>

  <rect x="392" y="46" width="100" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="62" text-anchor="middle" font-size="9" fill="white" font-weight="bold">sale_date</text>

  <rect x="496" y="46" width="50" height="24" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="521" y="62" text-anchor="middle" font-size="9" fill="white" font-weight="bold">total</text>

  <!-- ===== Row 1: LCPHONE ===== -->
  <rect x="20" y="72" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="48" y="87" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="80" y="72" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="150" y="87" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LCPHONE</text>
  <path d="M 224 83 L 266 83" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <rect x="268" y="72" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="328" y="87" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Lcphone</text>
  <rect x="392" y="72" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="442" y="87" text-anchor="middle" font-size="9" fill="#333">2000-01-16</text>
  <rect x="496" y="72" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="521" y="87" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== Row 2: LCPhone ===== -->
  <rect x="20" y="96" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="48" y="111" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="80" y="96" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="150" y="111" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LCPhone</text>
  <path d="M 224 107 L 266 107" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <rect x="268" y="96" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="328" y="111" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Lcphone</text>
  <rect x="392" y="96" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="442" y="111" text-anchor="middle" font-size="9" fill="#333">2000-01-17</text>
  <rect x="496" y="96" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="521" y="111" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== Row 3: LcPhOnE ===== -->
  <rect x="20" y="120" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="48" y="135" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="80" y="120" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="150" y="135" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LcPhOnE</text>
  <path d="M 224 131 L 266 131" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <rect x="268" y="120" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="328" y="135" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Lcphone</text>
  <rect x="392" y="120" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="442" y="135" text-anchor="middle" font-size="9" fill="#333">2000-02-18</text>
  <rect x="496" y="120" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="521" y="135" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== Row 4: LCKeyCHAiN ===== -->
  <rect x="20" y="144" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="48" y="159" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="80" y="144" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="150" y="159" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LCKeyCHAiN</text>
  <path d="M 224 155 L 266 155" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <rect x="268" y="144" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="328" y="159" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Lckeychain</text>
  <rect x="392" y="144" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="442" y="159" text-anchor="middle" font-size="9" fill="#333">2000-02-19</text>
  <rect x="496" y="144" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="521" y="159" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== Row 5: LCKeyChain ===== -->
  <rect x="20" y="168" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="48" y="183" text-anchor="middle" font-size="9" fill="#333">5</text>
  <rect x="80" y="168" width="140" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="150" y="183" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LCKeyChain</text>
  <path d="M 224 179 L 266 179" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <rect x="268" y="168" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="328" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Lckeychain</text>
  <rect x="392" y="168" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="442" y="183" text-anchor="middle" font-size="9" fill="#333">2000-02-28</text>
  <rect x="496" y="168" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="521" y="183" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== Row 6: Matryoshka ===== -->
  <rect x="20" y="192" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="48" y="207" text-anchor="middle" font-size="9" fill="#333">6</text>
  <rect x="80" y="192" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="150" y="207" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Matryoshka</text>
  <path d="M 224 203 L 266 203" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <rect x="268" y="192" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="328" y="207" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Matryoshka</text>
  <rect x="392" y="192" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="442" y="207" text-anchor="middle" font-size="9" fill="#333">2000-03-31</text>
  <rect x="496" y="192" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="521" y="207" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== Grouping note ===== -->
  <path d="M 300 218 L 300 240" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <rect x="60" y="244" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="264" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">GROUP BY (归一化名, sale_date)</text>
  <text x="300" y="282" text-anchor="middle" font-size="10" fill="#666">前 3 行的脏名各不相同，但清洗后都归一为「Lcphone」</text>
  <text x="300" y="294" text-anchor="middle" font-size="10" fill="#666">因 sale_date 各异，未合并 → 各 total = 1</text>

  <!-- ===== Final output ===== -->
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">最终输出（ORDER BY product_name, sale_date）</text>

  <rect x="120" y="330" width="360" height="20" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="344" text-anchor="middle" font-size="9" fill="white" font-weight="bold">product_name</text>
  <text x="320" y="344" text-anchor="middle" font-size="9" fill="white" font-weight="bold">sale_date</text>
  <text x="420" y="344" text-anchor="middle" font-size="9" fill="white" font-weight="bold">total</text>

  <rect x="120" y="350" width="360" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="190" y="361" text-anchor="middle" font-size="8" fill="#333">Lckeychain</text>
  <text x="320" y="361" text-anchor="middle" font-size="8" fill="#333">2000-02-19</text>
  <text x="420" y="361" text-anchor="middle" font-size="8" fill="#333">1</text>

  <rect x="120" y="366" width="360" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="190" y="377" text-anchor="middle" font-size="8" fill="#333">Lckeychain</text>
  <text x="320" y="377" text-anchor="middle" font-size="8" fill="#333">2000-02-28</text>
  <text x="420" y="377" text-anchor="middle" font-size="8" fill="#333">1</text>

  <rect x="120" y="382" width="360" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="190" y="393" text-anchor="middle" font-size="8" fill="#333">Lcphone</text>
  <text x="320" y="393" text-anchor="middle" font-size="8" fill="#333">2000-01-16</text>
  <text x="420" y="393" text-anchor="middle" font-size="8" fill="#333">1</text>

  <rect x="120" y="398" width="360" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="190" y="409" text-anchor="middle" font-size="8" fill="#333">Lcphone</text>
  <text x="320" y="409" text-anchor="middle" font-size="8" fill="#333">2000-01-17</text>
  <text x="420" y="409" text-anchor="middle" font-size="8" fill="#333">1</text>

  <rect x="120" y="414" width="360" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="190" y="425" text-anchor="middle" font-size="8" fill="#333">Lcphone</text>
  <text x="320" y="425" text-anchor="middle" font-size="8" fill="#333">2000-02-18</text>
  <text x="420" y="425" text-anchor="middle" font-size="8" fill="#333">1</text>
</svg>
