<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = “catsanddog” 的记忆化 DFS 执行轨迹</text>

  <!-- Table header -->
  <rect x="24" y="40" width="512" height="26" fill="#446688" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="58" font-size="11" fill="#fff" font-weight="bold">步</text>
  <text x="130" y="58" font-size="11" fill="#fff" font-weight="bold">调用 / 返回</text>
  <text x="290" y="58" font-size="11" fill="#fff" font-weight="bold">关键动作</text>
  <text x="440" y="58" font-size="11" fill="#fff" font-weight="bold">memo 更新</text>

  <!-- Row 1: dfs(0) try "cat" -->
  <rect x="24" y="68" width="512" height="30" fill="#e8f0fe" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="44" y="88" font-size="11" fill="#333">①</text>
  <text x="90" y="88" font-size="10" fill="#333">dfs(0)</text>
  <text x="210" y="88" font-size="10" fill="#4a7a3a">试 “cat” → dfs(3)</text>
  <text x="420" y="88" font-size="9" fill="#888">—</text>

  <!-- Row 2: dfs(3) try "sand" -->
  <rect x="24" y="100" width="512" height="30" fill="#e8f0fe" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="44" y="120" font-size="11" fill="#333">②</text>
  <text x="90" y="120" font-size="10" fill="#333">dfs(3)</text>
  <text x="210" y="120" font-size="10" fill="#4a7a3a">试 “sand” → dfs(7)</text>
  <text x="420" y="120" font-size="9" fill="#888">—</text>

  <!-- Row 3: dfs(7) try "dog" -->
  <rect x="24" y="132" width="512" height="30" fill="#e8f0fe" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="44" y="152" font-size="11" fill="#333">③</text>
  <text x="90" y="152" font-size="10" fill="#333">dfs(7)</text>
  <text x="210" y="152" font-size="10" fill="#4a7a3a">试 “dog” → dfs(10)</text>
  <text x="420" y="152" font-size="9" fill="#888">—</text>

  <!-- Row 4: dfs(10) base case -->
  <rect x="24" y="164" width="512" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="44" y="184" font-size="11" fill="#333">④</text>
  <text x="90" y="184" font-size="10" fill="#333">dfs(10)</text>
  <text x="210" y="184" font-size="10" fill="#4a7a3a">start==n，返回 [“”]</text>
  <rect x="414" y="170" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="464" y="184" text-anchor="middle" font-size="9" fill="#333">[10]=[“”]</text>

  <!-- Row 5: return dfs(7) -->
  <rect x="24" y="196" width="512" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="44" y="216" font-size="11" fill="#333">⑤</text>
  <text x="90" y="216" font-size="10" fill="#333">回 dfs(7)</text>
  <text x="210" y="216" font-size="10" fill="#333">“dog” + [“”] = [“dog”]</text>
  <rect x="414" y="202" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="464" y="216" text-anchor="middle" font-size="9" fill="#333">[7]=[“dog”]</text>

  <!-- Row 6: return dfs(3) -->
  <rect x="24" y="228" width="512" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="44" y="248" font-size="11" fill="#333">⑥</text>
  <text x="90" y="248" font-size="10" fill="#333">回 dfs(3)</text>
  <text x="210" y="248" font-size="10" fill="#333">“sand” + [“dog”]</text>
  <rect x="414" y="234" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="464" y="248" text-anchor="middle" font-size="9" fill="#333">[3]=[“sand dog”]</text>

  <!-- Row 7: dfs(0) try "cats" -> dfs(4) -> "and" -> dfs(7) HIT -->
  <rect x="24" y="260" width="512" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="44" y="282" font-size="11" fill="#333">⑦</text>
  <text x="90" y="282" font-size="10" fill="#333">dfs(4)→dfs(7)</text>
  <text x="210" y="276" font-size="10" fill="#b85450" font-weight="bold">“cats”→dfs(4), “and”→dfs(7)</text>
  <text x="210" y="290" font-size="10" fill="#b85450" font-weight="bold">dfs(7) 命中缓存！直接返回</text>
  <rect x="414" y="268" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="464" y="283" text-anchor="middle" font-size="9" fill="#b85450">复用 [7]</text>

  <!-- Row 8: return dfs(4) -->
  <rect x="24" y="296" width="512" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="44" y="316" font-size="11" fill="#333">⑧</text>
  <text x="90" y="316" font-size="10" fill="#333">回 dfs(4)</text>
  <text x="210" y="316" font-size="10" fill="#333">“and” + [“dog”]</text>
  <rect x="414" y="302" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="464" y="316" text-anchor="middle" font-size="9" fill="#333">[4]=[“and dog”]</text>

  <!-- Row 9: return dfs(0) -->
  <rect x="24" y="328" width="512" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="44" y="348" font-size="11" fill="#333">⑨</text>
  <text x="90" y="348" font-size="10" fill="#333">回 dfs(0)</text>
  <text x="210" y="348" font-size="10" fill="#333">“cat”+[“sand dog”], “cats”+[“and dog”]</text>
  <rect x="414" y="334" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="464" y="348" text-anchor="middle" font-size="9" fill="#333">[0]=2 条</text>

  <!-- Annotation: cache hit -->
  <path d="M 380 277 Q 330 200 300 211" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="196" font-size="9" fill="#b85450">第⑤步已算好</text>
  <text x="338" y="208" font-size="9" fill="#b85450">第⑦步直接复用</text>

  <!-- Final answer box -->
  <rect x="60" y="378" width="440" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终答案 memo[0]：</text>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#333">[“cat sand dog”, “cats and dog”] ⭐</text>
  <text x="280" y="432" text-anchor="middle" font-size="9" fill="#888">dfs(7) 只计算 1 次，第⑦步命中缓存免重复搜索</text>
</svg>
