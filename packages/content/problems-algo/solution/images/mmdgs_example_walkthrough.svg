<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：stations = [0, 10, 30]，k = 3</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">两个 gap：g₂=20、g₁=10，maxgap=20，答案 = 20/3 ≈ 6.667</text>

  <!-- ===== 列头 ===== -->
  <text x="30" y="66" font-size="10" fill="#888" font-weight="bold">轮次</text>
  <text x="110" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">[lo, hi]</text>
  <text x="195" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">mid</text>
  <text x="300" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">need(mid)</text>
  <text x="410" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">判定</text>
  <text x="490" y="66" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">动作</text>
  <line x1="20" y1="72" x2="560" y2="72" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 轮1: mid=10, need=1 ✓ ===== -->
  <text x="30" y="100" font-size="10" fill="#888">1</text>
  <rect x="78" y="86" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="101" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[0, 20]</text>
  <rect x="170" y="86" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="101" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">10</text>
  <text x="300" y="101" text-anchor="middle" font-size="10" fill="#555">g₂:1  g₁:0 → 1</text>
  <text x="410" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ≤ 3 ✓</text>
  <text x="490" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">hi = 10</text>

  <!-- ===== 轮2: mid=5, need=4 ✗ ===== -->
  <text x="30" y="132" font-size="10" fill="#888">2</text>
  <rect x="78" y="118" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="133" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[0, 10]</text>
  <rect x="170" y="118" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="133" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="300" y="133" text-anchor="middle" font-size="10" fill="#555">g₂:3  g₁:1 → 4</text>
  <text x="410" y="133" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 &gt; 3 ✗</text>
  <text x="490" y="133" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lo = 5</text>

  <!-- ===== 轮3: mid=7.5, need=3 ✓ ===== -->
  <text x="30" y="164" font-size="10" fill="#888">3</text>
  <rect x="78" y="150" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="165" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[5, 10]</text>
  <rect x="170" y="150" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7.5</text>
  <text x="300" y="165" text-anchor="middle" font-size="10" fill="#555">g₂:2  g₁:1 → 3</text>
  <text x="410" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 ≤ 3 ✓</text>
  <text x="490" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">hi = 7.5</text>

  <!-- ===== 轮4: mid=6.25, need=4 ✗ ===== -->
  <text x="30" y="196" font-size="10" fill="#888">4</text>
  <rect x="78" y="182" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="197" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[5, 7.5]</text>
  <rect x="170" y="182" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6.25</text>
  <text x="300" y="197" text-anchor="middle" font-size="10" fill="#555">g₂:3  g₁:1 → 4</text>
  <text x="410" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 &gt; 3 ✗</text>
  <text x="490" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lo = 6.25</text>

  <!-- ===== 轮5: mid=6.875, need=3 ✓ ===== -->
  <text x="30" y="228" font-size="10" fill="#888">5</text>
  <rect x="78" y="214" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="229" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[6.25, 7.5]</text>
  <rect x="170" y="214" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6.875</text>
  <text x="300" y="229" text-anchor="middle" font-size="10" fill="#555">g₂:2  g₁:1 → 3</text>
  <text x="410" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 ≤ 3 ✓</text>
  <text x="490" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">hi = 6.875</text>

  <!-- ===== 收敛行 ===== -->
  <text x="30" y="260" font-size="10" fill="#888">…</text>
  <text x="300" y="260" text-anchor="middle" font-size="10" fill="#888">迭代 100 次后 hi 收敛</text>
  <rect x="424" y="246" width="132" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="261" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">hi → 20/3 ≈ 6.667</text>

  <!-- ===== 最终加油站布置 ===== -->
  <text x="30" y="300" font-size="11" fill="#444" font-weight="bold">最优布置：gap20 放 2 站（切 3 段 6.67）、gap10 放 1 站（切 2 段 5）</text>

  <!-- number line -->
  <line x1="60" y1="335" x2="480" y2="335" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- segments highlighting: 0-5(5), 5-10(5), 10-16.67(6.67*), 16.67-23.33(6.67*), 23.33-30(6.67*) -->
  <!-- 14px/unit: 0->60, 5->130, 10->200, 16.67->293, 23.33->387, 30->480 -->

  <!-- highlighted max segments (6.67) drawn as thick colored bars above line -->
  <line x1="200" y1="325" x2="293" y2="325" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="293" y1="325" x2="387" y2="325" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="387" y1="325" x2="480" y2="325" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>

  <!-- original stations (filled blue) -->
  <circle cx="60" cy="335" r="6" fill="#446688" stroke="#224466" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="360" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>
  <circle cx="200" cy="335" r="6" fill="#446688" stroke="#224466" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="360" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">10</text>
  <circle cx="480" cy="335" r="6" fill="#446688" stroke="#224466" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="360" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">30</text>

  <!-- new stations (hollow orange) -->
  <circle cx="130" cy="335" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="360" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">5</text>
  <circle cx="293" cy="335" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="293" y="360" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">16.7</text>
  <circle cx="387" cy="335" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="387" y="360" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">23.3</text>

  <!-- segment length labels -->
  <text x="95" y="319" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="165" y="319" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="246" y="316" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">6.67</text>
  <text x="340" y="316" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">6.67</text>
  <text x="433" y="316" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">6.67</text>

  <!-- legend -->
  <text x="60" y="386" font-size="9" fill="#446688">● 原有站</text>
  <text x="160" y="386" font-size="9" fill="#d6a040">○ 新增站</text>
  <text x="260" y="386" font-size="9" fill="#b85450">━ 最大段 6.67 = 20/3</text>

  <!-- ===== 结论 ===== -->
  <rect x="30" y="404" width="540" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="424" font-size="11" fill="#4a7a3a" font-weight="bold">答案 = 20/3 ≈ 6.66667 ✓</text>
  <text x="44" y="440" font-size="10" fill="#555">mid=7.5 时 need=3 恰好够；mid=6.25 时 need=4 不够 → 答案落在 (6.25, 7.5]，收敛到 6.667</text>
</svg>
