<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 366" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="366" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：red = 2, blue = 4</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">库存：红 ×2，蓝 ×4；两种方案逐行扣减对照</text>

  <!-- 方案A 红顶 -->
  <text x="130" y="64" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">方案A 红顶（奇红偶蓝）</text>
  <rect x="30" y="70" width="34" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="64" y="70" width="34" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="98" y="70" width="34" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="132" y="70" width="98" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="47" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行</text>
  <text x="81" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">需</text>
  <text x="115" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">色</text>
  <text x="181" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">库存变化</text>

  <rect x="30" y="96" width="34" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="64" y="96" width="34" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="98" y="96" width="34" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="132" y="96" width="98" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <text x="47" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="81" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="113" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">红</text>
  <text x="181" y="113" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2→1 ✓</text>

  <rect x="30" y="122" width="34" height="26" fill="#f7f7f7" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="64" y="122" width="34" height="26" fill="#f7f7f7" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="98" y="122" width="34" height="26" fill="#f7f7f7" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="132" y="122" width="98" height="26" fill="#f7f7f7" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <text x="47" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="81" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="115" y="139" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">蓝</text>
  <text x="181" y="139" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">4→2 ✓</text>

  <rect x="30" y="148" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="64" y="148" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="98" y="148" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="132" y="148" width="98" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="47" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="81" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="115" y="165" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">红</text>
  <text x="181" y="165" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1&lt;3 ✗ 停</text>

  <rect x="30" y="174" width="200" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="193" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">hA = 2</text>

  <!-- 方案B 蓝顶 -->
  <text x="390" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">方案B 蓝顶（奇蓝偶红）</text>
  <rect x="290" y="70" width="34" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="324" y="70" width="34" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="358" y="70" width="34" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="392" y="70" width="98" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="307" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行</text>
  <text x="341" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">需</text>
  <text x="375" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">色</text>
  <text x="441" y="87" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">库存变化</text>

  <rect x="290" y="96" width="34" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="324" y="96" width="34" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="358" y="96" width="34" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="392" y="96" width="98" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <text x="307" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="341" y="113" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="375" y="113" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">蓝</text>
  <text x="441" y="113" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">4→3 ✓</text>

  <rect x="290" y="122" width="34" height="26" fill="#f7f7f7" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="324" y="122" width="34" height="26" fill="#f7f7f7" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="358" y="122" width="34" height="26" fill="#f7f7f7" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="392" y="122" width="98" height="26" fill="#f7f7f7" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <text x="307" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="341" y="139" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="375" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">红</text>
  <text x="441" y="139" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2→0 ✓</text>

  <rect x="290" y="148" width="34" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="324" y="148" width="34" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="358" y="148" width="34" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <rect x="392" y="148" width="98" height="26" fill="#ffffff" stroke="#aab" stroke-width="1" filter="url(#rough2)"/>
  <text x="307" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="341" y="165" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="375" y="165" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">蓝</text>
  <text x="441" y="165" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3→0 ✓</text>

  <rect x="290" y="174" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="324" y="174" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="358" y="174" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="392" y="174" width="98" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="307" y="191" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="341" y="191" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="375" y="191" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">红</text>
  <text x="441" y="191" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0&lt;4 ✗ 停</text>

  <rect x="290" y="200" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="219" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">hB = 3 ✓ 更优</text>

  <!-- 汇总 -->
  <rect x="30" y="252" width="260" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="276" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">answer = max(hA, hB)</text>
  <text x="160" y="300" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">= max(2, 3) = 3 ✓</text>

  <!-- 方案B 实搭小三角 -->
  <text x="400" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">方案B 实搭：高度 3</text>
  <circle cx="400" cy="276" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="382" cy="302" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="418" cy="302" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="364" cy="328" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="400" cy="328" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="436" cy="328" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="354" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1 蓝 + 2 红 + 3 蓝，恰好用完</text>
</svg>
