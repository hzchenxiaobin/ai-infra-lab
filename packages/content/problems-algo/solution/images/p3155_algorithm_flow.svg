<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐数据中心独立求解（二分 ⇋ 除法，两条等价路径）</text>

  <rect x="172" y="40" width="176" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">取下一个数据中心 i</text>

  <path d="M 260 78 L 260 96" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="148" y="100" width="224" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="119" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">budget = money[i] + count[i]·sell[i]</text>
  <text x="260" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 乘积达 10^10，C++ 用 long long</text>

  <path d="M 260 148 L 260 164" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="172" y="168" width="176" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">unit = upgrade[i] + sell[i]</text>

  <path d="M 260 206 L 260 222" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="260,226 356,262 260,298 164,262" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="267" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">unit = 0 ?</text>

  <path d="M 358 262 L 382 262" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="370" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="386" y="244" width="122" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="447" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans[i] = count[i]</text>
  <text x="447" y="275" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（升级免费，全升）</text>

  <path d="M 260 300 L 260 318" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="272" y="314" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="120" y="322" width="256" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="248" y="341" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">二分最大 x ∈ [0, count[i]]</text>
  <text x="248" y="358" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">满足 x·unit ≤ budget</text>

  <text x="396" y="336" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">check 关于 x 单调</text>
  <text x="396" y="352" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">⇒ 二分合法；亦可一步</text>
  <text x="396" y="368" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x = ⌊budget / unit⌋</text>

  <path d="M 248 368 L 248 386" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="148" y="390" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="248" y="413" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans[i] = min(count[i], x)</text>
</svg>
