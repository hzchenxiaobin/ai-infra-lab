<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：r² 单调递增 ⇒ 二分查找精确匹配 r² == num</text>

  <!-- ===== Left panel: geometric meaning ===== -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">几何意义</text>

  <line x1="70" y1="300" x2="70" y2="120" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="300" x2="270" y2="300" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="116" text-anchor="end" font-size="10" fill="#888">r²</text>
  <text x="274" y="304" font-size="10" fill="#888">r →</text>
  <text x="64" y="304" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- parabola y = r^2 -->
  <path d="M 70 300 C 120 298 165 290 200 270 C 230 250 250 215 262 168" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="234" y="198" font-size="11" fill="#446688" font-weight="bold">y = r²</text>

  <!-- horizontal line y = num -->
  <line x1="70" y1="210" x2="270" y2="210" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="274" y="214" font-size="11" fill="#d6a040" font-weight="bold">y = num</text>

  <!-- intersection at integer r (perfect square) -->
  <circle cx="206" cy="210" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="206" y1="210" x2="206" y2="300" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="206" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">r = √num ∈ ℤ</text>
  <text x="170" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a">交点落在整数 r → 完全平方数 ✓</text>

  <!-- ===== Right panel: answer space number line ===== -->
  <text x="320" y="58" font-size="12" fill="#888" font-weight="bold">答案空间（在 r 上二分）</text>

  <line x1="320" y1="180" x2="540" y2="180" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- too small (green) -->
  <line x1="320" y1="180" x2="420" y2="180" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <!-- too big (red) -->
  <line x1="440" y1="180" x2="540" y2="180" stroke="#b85450" stroke-width="4" filter="url(#rough2)"/>

  <!-- target (if exists) -->
  <circle cx="430" cy="180" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>

  <circle cx="320" cy="180" r="3.5" fill="#888" filter="url(#rough2)"/>
  <circle cx="540" cy="180" r="3.5" fill="#888" filter="url(#rough2)"/>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="540" y="200" text-anchor="middle" font-size="10" fill="#999">num</text>

  <text x="370" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">r² &lt; num ✓ 太小</text>
  <text x="490" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">r² &gt; num ✗ 太大</text>
  <text x="430" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">r² == num</text>
  <text x="430" y="214" text-anchor="middle" font-size="10" fill="#d6a040">命中即 true</text>

  <!-- check function box -->
  <rect x="320" y="240" width="220" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">三段判定 check(mid)</text>
  <text x="430" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a">mid² &lt; num → lo = mid+1</text>
  <text x="430" y="304" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">mid² == num → return true</text>
  <text x="430" y="322" text-anchor="middle" font-size="11" fill="#b85450">mid² &gt; num → hi = mid−1</text>

  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#888">与 69 不同：69 求边界 ⌊√x⌋，本题求精确命中——找到即 true，搜完未命中即 false</text>
</svg>
