<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单变量滚动前缀和，停点为 0 才计数</text>

  <!-- init -->
  <rect x="185" y="38" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">pos = 0，ans = 0</text>

  <path d="M 260 72 L 260 86" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 1: more elements? -->
  <path d="M 260 92 L 336 124 L 260 156 L 184 124 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有未读元素 x？</text>
  <text x="260" y="139" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">按顺序读取 nums</text>

  <path d="M 336 124 L 390 124" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="362" y="116" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="394" y="106" width="102" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="129" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 156 L 260 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="168" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- pos += x -->
  <rect x="185" y="176" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">pos += x（滚动累加）</text>

  <path d="M 260 210 L 260 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 2: pos == 0 ? -->
  <path d="M 260 230 L 336 262 L 260 294 L 184 262 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">pos == 0 ?</text>
  <text x="260" y="277" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">（停点恰好在边界）</text>

  <path d="M 336 262 L 390 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="362" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="394" y="244" width="102" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="267" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <!-- loop back -->
  <path d="M 260 294 L 260 314" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="276" y="310" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 445 280 L 445 318 L 96 318 L 96 124 L 178 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">回到循环开头，读下一个元素</text>

  <!-- side note -->
  <rect x="150" y="348" width="220" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">nums[i] ≠ 0 ⇒ 每步必动，检查不落空；</text>
  <text x="260" y="380" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">检查永远发生在移动完成之后。</text>
</svg>
