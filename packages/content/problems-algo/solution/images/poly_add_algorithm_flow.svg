<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c6ade"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：哑节点 + 归并双指针</text>

  <!-- Start -->
  <g filter="url(#rough2)">
    <rect x="150" y="44" width="260" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dummy + tail；p1=poly1，p2=poly2</text>
  <line x1="280" y1="86" x2="280" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision -->
  <g filter="url(#rough2)">
    <polygon points="280,112 390,168 280,224 170,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">p1 &amp;&amp; p2 ?</text>
  <text x="280" y="182" text-anchor="middle" font-size="10" fill="#888">两者都非空</text>

  <!-- No branch -> finalize -->
  <line x1="390" y1="168" x2="438" y2="168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="442" y="140" width="108" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="496" y="164" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">接上剩余</text>
  <text x="496" y="180" text-anchor="middle" font-size="10" fill="#444">tail.next = p1?</text>
  <text x="496" y="194" text-anchor="middle" font-size="10" fill="#444">p1 : p2</text>
  <line x1="496" y1="198" x2="496" y2="232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="436" y="234" width="120" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="496" y="261" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return dummy.next</text>

  <!-- Yes branch -> compare powers -->
  <line x1="280" y1="224" x2="280" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="242" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <g filter="url(#rough2)">
    <polygon points="280,252 410,312 280,372 150,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">比较 p1.power</text>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">与 p2.power</text>

  <!-- Three branches -->
  <!-- Left: p1 > p2 -->
  <line x1="150" y1="312" x2="100" y2="312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="304" font-size="10" fill="#446688" font-weight="bold">&gt;</text>
  <g filter="url(#rough2)">
    <rect x="20" y="338" width="160" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="100" y="360" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">取 p1 项</text>
  <text x="100" y="378" text-anchor="middle" font-size="10.5" fill="#444">tail.next=p1; tail=p1</text>
  <text x="100" y="394" text-anchor="middle" font-size="10.5" fill="#888">p1 = p1.next</text>

  <!-- Middle: equal -->
  <line x1="280" y1="372" x2="280" y2="398" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="390" font-size="10" fill="#d6a040" font-weight="bold">==</text>
  <g filter="url(#rough2)">
    <rect x="200" y="400" width="160" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="422" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sum=c1+c2</text>
  <text x="280" y="440" text-anchor="middle" font-size="10.5" fill="#444">sum≠0：</text>
  <text x="280" y="455" text-anchor="middle" font-size="10.5" fill="#444">新建(sum,pow)接入</text>
  <text x="280" y="472" text-anchor="middle" font-size="10.5" fill="#b85450">sum==0：丢弃</text>
  <text x="280" y="487" text-anchor="middle" font-size="10.5" fill="#888">p1,p2 各进一步</text>

  <!-- Right: p2 > p1 -->
  <line x1="410" y1="312" x2="460" y2="312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="304" font-size="10" fill="#b85450" font-weight="bold">&lt;</text>
  <g filter="url(#rough2)">
    <rect x="380" y="338" width="160" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="460" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">取 p2 项</text>
  <text x="460" y="378" text-anchor="middle" font-size="10.5" fill="#444">tail.next=p2; tail=p2</text>
  <text x="460" y="394" text-anchor="middle" font-size="10.5" fill="#888">p2 = p2.next</text>

  <!-- Loop back arrows to top decision -->
  <path d="M 100 414 Q 40 470 40 168 Q 40 130 168 168" stroke="#9c6ade" stroke-width="1.5" fill="none" marker-end="url(#arrP)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 460 414 Q 530 470 530 168 Q 530 130 392 168" stroke="#9c6ade" stroke-width="1.5" fill="none" marker-end="url(#arrP)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 280 492 Q 280 510 150 510 Q 70 510 70 168 Q 70 132 170 168" stroke="#9c6ade" stroke-width="1.5" fill="none" marker-end="url(#arrP)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="30" y="250" font-size="10" fill="#9c6ade" font-weight="bold">回</text>
  <text x="30" y="264" font-size="10" fill="#9c6ade" font-weight="bold">到</text>
  <text x="30" y="278" font-size="10" fill="#9c6ade" font-weight="bold">判</text>
  <text x="30" y="292" font-size="10" fill="#9c6ade" font-weight="bold">定</text>
</svg>
