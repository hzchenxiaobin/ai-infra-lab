<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">定长滑动窗口：中心 i → i+1，出一进一</text>

  <!-- nums label -->
  <text x="36" y="74" font-size="12" fill="#888">nums：</text>

  <!-- nums cells [7,4,3,9,1,8,5,2,6], cell size 52x34, start x=86 -->
  <!-- index 0: leaves (red) -->
  <rect x="86" y="58" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <!-- index 1..6: shared window body (blue) -->
  <rect x="138" y="58" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="190" y="58" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="242" y="58" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="294" y="58" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="346" y="58" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="398" y="58" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- index 7: enters (green) -->
  <rect x="450" y="58" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- index 8: outside both windows -->
  <rect x="502" y="58" width="52" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="528" y="80" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">6</text>

  <!-- index labels -->
  <text x="112" y="106" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="164" y="106" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="216" y="106" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="268" y="106" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="320" y="106" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="372" y="106" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="424" y="106" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="476" y="106" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="528" y="106" text-anchor="middle" font-size="10" fill="#888">8</text>

  <!-- window i=3 bracket [0..6] -->
  <path d="M 86 116 L 86 124 L 450 124 L 450 116" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="268" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">窗口 i=3：[0, 6]，大小 2k+1=7，sum=37</text>

  <!-- window i=4 bracket [1..7] -->
  <path d="M 138 150 L 138 158 L 502 158 L 502 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 i=4：[1, 7]，sum = 37 − 7 + 2 = 32</text>

  <!-- leave / enter arrows -->
  <path d="M 112 188 L 112 214" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="112" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[0] 离开</text>
  <text x="112" y="246" text-anchor="middle" font-size="10" fill="#888">= nums[i−k−1]</text>

  <path d="M 476 188 L 476 214" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="476" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums[7] 进入</text>
  <text x="476" y="246" text-anchor="middle" font-size="10" fill="#888">= nums[i+k]</text>

  <!-- transition formula box -->
  <rect x="120" y="266" width="420" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">滑窗转移公式（中心 i → i+1）</text>
  <text x="330" y="312" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">S(i+1) = S(i) − nums[i−k] + nums[i+k+1]</text>
  <text x="330" y="324" text-anchor="middle" font-size="10" fill="#888">每步 O(1)，无需重新求和</text>

  <!-- boundary note -->
  <rect x="36" y="344" width="588" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="56" y="368" font-size="12" fill="#b85450" font-weight="bold">边界：两侧不足 k 个元素 → ans[i] = −1</text>
  <text x="56" y="390" font-size="11" fill="#555">• 合法中心范围：i ∈ [k, n−1−k]，本例 k=3 即 i ∈ [3, 5]</text>
  <text x="56" y="408" font-size="11" fill="#555">• i &lt; k（左侧不足）或 i &gt; n−1−k（右侧不足）→ 全填 −1</text>
  <text x="56" y="424" font-size="11" fill="#4a7a3a" font-weight="bold">  做法：先把 ans 全初始化为 −1，只对合法中心滑窗覆盖。</text>
</svg>
