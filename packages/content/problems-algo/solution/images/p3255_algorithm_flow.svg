<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，边走边写答案</text>

  <!-- 开始框 -->
  <rect x="160" y="42" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">初始化：cnt = 0，ans 预填 −1</text>
  <path d="M 260 76 L 260 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="130" y="98" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">对每个 i = 0 … n−1 依次处理</text>
  <path d="M 260 128 L 260 148" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 菱形1：链是否延续 -->
  <polygon points="260,150 380,186 260,222 140,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">i &gt; 0 且</text>
  <text x="260" y="198" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">nums[i] = nums[i−1]+1 ?</text>

  <!-- 分支：是 -->
  <path d="M 140 186 L 100 186 L 100 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="118" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="30" y="242" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="263" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">cnt = cnt + 1</text>

  <!-- 分支：否 -->
  <path d="M 380 186 L 420 186 L 420 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="402" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="350" y="242" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="263" text-anchor="middle" font-size="11" fill="#8c3a34" filter="url(#rough2)">cnt = 1（断链重起）</text>

  <!-- 汇合到菱形2 -->
  <path d="M 100 274 L 100 296 L 176 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 420 274 L 420 296 L 344 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 菱形2：cnt >= k -->
  <polygon points="260,272 344,298 260,324 176,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">cnt ≥ k ?</text>
  <path d="M 176 298 L 100 296" stroke="none"/>

  <!-- 是：写答案 -->
  <path d="M 260 324 L 260 342" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="338" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="130" y="344" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="365" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans[i−k+1] = nums[i]</text>

  <!-- 否：绕过 -->
  <path d="M 344 298 L 440 298 L 440 360 L 392 360" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="398" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="466" y="330" text-anchor="middle" font-size="9.5" fill="#8c3a34" filter="url(#rough2)">保持 −1</text>

  <!-- 返回 -->
  <path d="M 130 360 L 74 360" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="14" y="344" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="44" y="365" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">返回</text>

  <!-- 侧注 -->
  <text x="260" y="392" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">k = 1 时 cnt ≥ 1 恒成立 → ans[i] = nums[i]，单元素自然连续</text>
</svg>
