<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二次函数的对称性：两端的极值决定填充方向</text>

  <!-- ============ LEFT PANEL: a > 0 ============ -->
  <text x="145" y="48" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a &gt; 0：开口向上（凸）</text>

  <!-- Parabola path (vertex at 115,280; opens upward) -->
  <path d="M 55,253 L 65,261 L 75,268 L 85,273 L 95,277 L 105,279 L 115,280 L 125,279 L 135,277 L 145,273 L 155,268 L 165,261 L 175,253 L 185,243 L 195,232 L 205,219 L 215,205 L 225,189 L 235,172"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- X-axis -->
  <path d="M 45,300 L 245,300" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="304" font-size="10" fill="#888">x</text>

  <!-- Data points on parabola: (-4,9) (-2,3) (2,15) (4,33) -->
  <circle cx="65" cy="261" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="105" cy="279" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="185" cy="243" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="225" cy="189" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- f value labels next to dots -->
  <text x="65" y="252" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">9</text>
  <text x="105" y="295" text-anchor="middle" font-size="10" fill="#446688">3</text>
  <text x="185" y="234" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">15</text>
  <text x="225" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">33</text>

  <!-- x labels below axis -->
  <text x="65" y="316" text-anchor="middle" font-size="10" fill="#888">−4</text>
  <text x="105" y="316" text-anchor="middle" font-size="10" fill="#888">−2</text>
  <text x="185" y="316" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="225" y="316" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- Annotation: ends are largest -->
  <rect x="30" y="330" width="230" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="145" y="346" text-anchor="middle" font-size="11" fill="#444">两端最大 → 取较大者填到结果末尾</text>
  <text x="145" y="359" text-anchor="middle" font-size="10" fill="#666">从后往前填（pos = n−1 递减）</text>

  <!-- Result array (back-fill) -->
  <text x="145" y="382" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">结果 [3, 9, 15, 33] ← 从右往左填</text>

  <!-- ============ RIGHT PANEL: a < 0 ============ -->
  <text x="420" y="48" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a &lt; 0：开口向下（凹）</text>

  <!-- Parabola path (vertex at 445,120; opens downward) -->
  <path d="M 335,211 L 345,195 L 355,181 L 365,168 L 375,157 L 385,147 L 395,139 L 405,132 L 415,127 L 425,123 L 435,121 L 445,120 L 455,121 L 465,123 L 475,127 L 485,132 L 495,139 L 505,147"
        stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- X-axis -->
  <path d="M 325,240 L 515,240" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="522" y="244" font-size="10" fill="#888">x</text>

  <!-- Data points: (-4,-23) (-2,-5) (2,7) (4,1) -->
  <circle cx="335" cy="211" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="375" cy="157" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="455" cy="121" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="495" cy="139" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- f value labels -->
  <text x="335" y="225" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−23</text>
  <text x="375" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a">−5</text>
  <text x="455" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a">7</text>
  <text x="495" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>

  <!-- x labels below axis -->
  <text x="335" y="256" text-anchor="middle" font-size="10" fill="#888">−4</text>
  <text x="375" y="256" text-anchor="middle" font-size="10" fill="#888">−2</text>
  <text x="455" y="256" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="495" y="256" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- Annotation: ends are smallest -->
  <rect x="310" y="270" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="420" y="286" text-anchor="middle" font-size="11" fill="#444">两端最小 → 取较小者填到结果开头</text>
  <text x="420" y="299" text-anchor="middle" font-size="10" fill="#666">从前往后填（pos = 0 递增）</text>

  <!-- Result array (front-fill) -->
  <text x="420" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">结果 [−23, −5, 1, 7] ← 从左往右填</text>

  <!-- Bottom insight box -->
  <rect x="40" y="360" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">核心观察：有序数组经二次变换后，极值总在两端</text>
  <text x="280" y="389" text-anchor="middle" font-size="10" fill="#555">a &gt; 0 凸 → 两端最大 · a &lt; 0 凹 → 两端最小 · 对撞双指针 O(n)</text>
</svg>
