<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逆序扫描 s = "aabcbbca"（mx = 3）</text>

  <!-- original string reference -->
  <text x="72" y="54" font-size="11" fill="#888" filter="url(#rough2)">原串 →</text>
  <rect x="124" y="36" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="141" y="55" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="164" y="36" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="181" y="55" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="204" y="36" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="221" y="55" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="244" y="36" width="34" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="261" y="55" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">c</text>
  <rect x="284" y="36" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="301" y="55" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="324" y="36" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="341" y="55" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="364" y="36" width="34" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="381" y="55" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">c</text>
  <rect x="404" y="36" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="421" y="55" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="141" y="78" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="181" y="78" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="221" y="78" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="261" y="78" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="301" y="78" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="341" y="78" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="381" y="78" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="421" y="78" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="466" y="55" font-size="10.5" fill="#888" filter="url(#rough2)">a:3 b:3 c:2</text>

  <!-- table header -->
  <rect x="66" y="94" width="400" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="106" y="112" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">下标 i</text>
  <text x="176" y="112" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">字符</text>
  <text x="248" y="112" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt[c]</text>
  <text x="362" y="112" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>

  <!-- rows -->
  <rect x="66" y="120" width="400" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="106" y="138" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="176" y="138" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="248" y="138" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 = mx</text>
  <text x="282" y="138" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 收集 a，cnt[a] ← −1</text>

  <rect x="66" y="147" width="400" height="27" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="106" y="165" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="176" y="165" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c</text>
  <text x="248" y="165" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">2 &lt; mx</text>
  <text x="282" y="165" font-size="11.5" fill="#999" filter="url(#rough2)">跳过</text>

  <rect x="66" y="174" width="400" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="106" y="192" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="176" y="192" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="248" y="192" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 = mx</text>
  <text x="282" y="192" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 收集 b，cnt[b] ← −1</text>

  <rect x="66" y="201" width="400" height="27" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="106" y="219" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="176" y="219" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">b</text>
  <text x="248" y="219" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−1 已收</text>
  <text x="282" y="219" font-size="11.5" fill="#999" filter="url(#rough2)">跳过</text>

  <rect x="66" y="228" width="400" height="27" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="106" y="246" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="176" y="246" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">c</text>
  <text x="248" y="246" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">2 &lt; mx</text>
  <text x="282" y="246" font-size="11.5" fill="#999" filter="url(#rough2)">跳过</text>

  <rect x="66" y="255" width="400" height="27" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="106" y="273" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="176" y="273" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">b</text>
  <text x="248" y="273" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−1 已收</text>
  <text x="282" y="273" font-size="11.5" fill="#999" filter="url(#rough2)">跳过</text>

  <rect x="66" y="282" width="400" height="27" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="106" y="300" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="176" y="300" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">a</text>
  <text x="248" y="300" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−1 已收</text>
  <text x="282" y="300" font-size="11.5" fill="#999" filter="url(#rough2)">跳过</text>

  <rect x="66" y="309" width="400" height="27" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="106" y="327" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="176" y="327" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">a</text>
  <text x="248" y="327" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−1 已收</text>
  <text x="282" y="327" font-size="11.5" fill="#999" filter="url(#rough2)">跳过</text>

  <!-- scan direction annotation -->
  <path d="M 62 330 L 62 126" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="40" y="230" text-anchor="middle" font-size="10" fill="#b85450" transform="rotate(-90 40 230)" filter="url(#rough2)">逆序扫描方向</text>

  <!-- collected order -->
  <rect x="66" y="346" width="400" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">逆序收集得 ans = [a, b]（按最后出现位置 7、5 的降序）</text>

  <!-- conclusion -->
  <rect x="66" y="388" width="400" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="412" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">反转后返回 "ba" —— 与示例 1 一致 ✓</text>
  <text x="260" y="434" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">只有最大频率（3 次）的字母 a、b 活到了最后一轮之前</text>
</svg>
