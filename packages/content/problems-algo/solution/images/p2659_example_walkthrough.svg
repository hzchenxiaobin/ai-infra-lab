<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,4,3]，删除顺序 pos = [0,1,3,2]</text>

  <!-- table header -->
  <rect x="20" y="44" width="540" height="28" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="50" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">k</text>
  <text x="110" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">prev→cur</text>
  <text x="210" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">区间[prev,cur)</text>
  <text x="320" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">存活计数</text>
  <text x="420" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">旋转moves</text>
  <text x="510" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">累计</text>

  <!-- separators -->
  <line x1="80" y1="44" x2="80" y2="240" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="44" x2="150" y2="240" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="275" y1="44" x2="275" y2="240" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="44" x2="370" y2="240" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="44" x2="470" y2="240" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0: k=0, prev=0(init), cur=0, [0,0), 0, 0 -->
  <rect x="20" y="72" width="540" height="32" fill="#e8f0fe" rx="0" filter="url(#rough2)"/>
  <text x="50" y="93" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="110" y="93" text-anchor="middle" font-size="10" fill="#555">0 → 0</text>
  <text x="210" y="93" text-anchor="middle" font-size="10" fill="#555">[0, 0) 空</text>
  <text x="320" y="93" text-anchor="middle" font-size="10" fill="#555">—</text>
  <text x="420" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="510" y="93" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>

  <!-- row 1: k=1, prev=0, cur=1, [0,1), alive{0}=0(deleted) -->
  <rect x="20" y="104" width="540" height="32" fill="#fafafa" rx="0" filter="url(#rough2)"/>
  <text x="50" y="125" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="110" y="125" text-anchor="middle" font-size="10" fill="#555">0 → 1</text>
  <text x="210" y="125" text-anchor="middle" font-size="10" fill="#555">[0, 1)</text>
  <text x="320" y="125" text-anchor="middle" font-size="10" fill="#999">pos0 已删</text>
  <text x="420" y="125" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="510" y="125" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>

  <!-- row 2: k=2, prev=1, cur=3, [1,3), alive{1,2}={0,1}=1 -->
  <rect x="20" y="136" width="540" height="32" fill="#fff8e1" rx="0" filter="url(#rough2)"/>
  <text x="50" y="157" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="110" y="157" text-anchor="middle" font-size="10" fill="#555">1 → 3</text>
  <text x="210" y="157" text-anchor="middle" font-size="10" fill="#555">[1, 3)</text>
  <text x="320" y="157" text-anchor="middle" font-size="10" fill="#446688">pos2 存活</text>
  <text x="420" y="157" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="510" y="157" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <!-- row 3: k=3, prev=3, cur=2, [3,2) wrap, alive{3,0,1}=0 -->
  <rect x="20" y="168" width="540" height="32" fill="#fafafa" rx="0" filter="url(#rough2)"/>
  <text x="50" y="189" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="110" y="189" text-anchor="middle" font-size="10" fill="#555">3 → 2</text>
  <text x="210" y="189" text-anchor="middle" font-size="10" fill="#555">[3, 2) 绕回</text>
  <text x="320" y="189" text-anchor="middle" font-size="10" fill="#999">皆已删</text>
  <text x="420" y="189" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="510" y="189" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <line x1="20" y1="200" x2="560" y2="200" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- summary row -->
  <rect x="20" y="200" width="540" height="32" fill="#fce4ec" rx="4" filter="url(#rough2)"/>
  <text x="290" y="221" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">总操作 = n + Σmoves = 4 + 1 = 5</text>

  <!-- explanation -->
  <rect x="20" y="250" width="540" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="274" font-size="10" fill="#333" font-weight="bold">逐步解释：</text>
  <text x="40" y="292" font-size="9" fill="#555">k=0：最小值 1 在 pos0，已是队首 → 0 旋转，直接删除</text>
  <text x="40" y="308" font-size="9" fill="#555">k=1：次小 2 在 pos1，区间[0,1) 仅含 pos0（已删）→ 0 旋转，删除</text>
  <text x="40" y="324" font-size="9" fill="#555">k=2：3 在 pos3，区间[1,3) 含 pos1(删)、pos2(存活) → 旋转 1 次（4 移到队尾），删除</text>
  <text x="40" y="340" font-size="9" fill="#555">k=3：4 在 pos2，区间[3,2) 绕回 = {3,0,1} 全已删 → 0 旋转，删除</text>
  <text x="40" y="360" font-size="9" fill="#4a7a3a" font-weight="bold">共旋转 1 次 + 删除 4 次 = 5 次操作 ✓</text>
</svg>
