<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两阶段流程：正向建递减栈 → 反向结算最大宽度</text>

  <!-- ===== Phase 1 ===== -->
  <rect x="30" y="48" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段一：正向建栈（i: 0 → n−1）</text>

  <!-- start -->
  <rect x="110" y="90" width="60" height="26" fill="#f6f6f6" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="108" text-anchor="middle" font-size="10" fill="#555">st = []</text>
  <path d="M 140 116 L 140 132" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="90" y="134" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="152" text-anchor="middle" font-size="10" fill="#446688">for i = 0 .. n−1</text>
  <path d="M 140 160 L 140 174" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="140,176 196,206 140,236 84,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="204" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">A[i] &lt; A[栈顶]</text>
  <text x="140" y="216" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">或栈空？</text>

  <!-- yes -->
  <path d="M 84 206 L 50 206 L 50 250" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="200" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="252" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">st.push(i)</text>

  <!-- no -->
  <path d="M 196 206 L 230 206 L 230 250" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="200" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <rect x="200" y="252" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">跳过</text>

  <!-- result -->
  <rect x="50" y="294" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="140" y="314" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">栈 = 候选左端点（值严格递减）</text>

  <!-- divider arrow to phase 2 -->
  <path d="M 250 310 L 300 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2 ===== -->
  <rect x="300" y="48" width="230" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="67" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段二：反向结算（j: n−1 → 0）</text>

  <!-- start -->
  <rect x="385" y="90" width="60" height="26" fill="#f6f6f6" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="415" y="108" text-anchor="middle" font-size="10" fill="#555">maxW = 0</text>
  <path d="M 415 116 L 415 132" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="365" y="134" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a">for j = n−1 .. 0</text>
  <path d="M 415 160 L 415 174" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="415,176 471,206 415,236 359,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="415" y="204" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">A[栈顶] ≤ A[j]</text>
  <text x="415" y="216" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">且栈非空？</text>

  <!-- yes -->
  <path d="M 471 206 L 505 206 L 505 250" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="481" y="200" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="465" y="252" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="505" y="267" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">i = st.pop()</text>
  <text x="505" y="280" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">maxW=max(maxW,j−i)</text>

  <!-- no -->
  <path d="M 359 206 L 325 206 L 325 250" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="200" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <rect x="290" y="252" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j −− 停</text>

  <!-- result -->
  <rect x="320" y="294" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="415" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">栈空则提前终止</text>

  <!-- ===== Output ===== -->
  <path d="M 415 326 L 415 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="350" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="370" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">return maxW</text>

  <!-- ===== Key notes ===== -->
  <rect x="30" y="352" width="280" height="56" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="370" font-size="9" fill="#555">⚠ 建栈用 &lt;（严格小于，跳过等值）→ 严格递减</text>
  <text x="40" y="384" font-size="9" fill="#555">⚠ 结算用 ≤（小于等于，坡的定义允许等值）</text>
  <text x="40" y="398" font-size="9" fill="#555">💡 反向扫：最大 j 先试，弹掉的候选不会再有更优匹配</text>
</svg>
