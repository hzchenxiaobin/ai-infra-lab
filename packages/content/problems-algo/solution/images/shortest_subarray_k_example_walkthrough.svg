<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [3, −2, 5, −1, 4]，k = 6</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">前缀和 P = [0, 3, 1, 6, 5, 9]；答案 ans = 3（子数组 [3,−2,5] 或 [5,−1,4]）</text>

  <!-- ===== P array ===== -->
  <text x="24" y="68" font-size="10" fill="#446688" font-weight="bold">P[]</text>
  <g font-size="10">
    <rect x="50" y="56" width="42" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="71" y="72" text-anchor="middle">0</text>
    <rect x="96" y="56" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="117" y="72" text-anchor="middle">3</text>
    <rect x="142" y="56" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="163" y="72" text-anchor="middle">1</text>
    <rect x="188" y="56" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="209" y="72" text-anchor="middle">6</text>
    <rect x="234" y="56" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="255" y="72" text-anchor="middle">5</text>
    <rect x="280" y="56" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="301" y="72" text-anchor="middle">9</text>
  </g>
  <text x="50" y="92" font-size="8" fill="#888">下标 [0]</text>
  <text x="96" y="92" font-size="8" fill="#888">[1]</text>
  <text x="142" y="92" font-size="8" fill="#888">[2]</text>
  <text x="188" y="92" font-size="8" fill="#888">[3]</text>
  <text x="234" y="92" font-size="8" fill="#888">[4]</text>
  <text x="280" y="92" font-size="8" fill="#888">[5]</text>

  <!-- ===== Table header ===== -->
  <rect x="20" y="102" width="36" height="20" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="38" y="116" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">j</text>
  <rect x="58" y="102" width="44" height="20" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="116" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">P[j]</text>
  <rect x="104" y="102" width="280" height="20" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="244" y="116" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">deque 变化（存下标，P 值递增）</text>
  <rect x="386" y="102" width="180" height="20" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="476" y="116" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">动作 / ans</text>

  <!-- ===== Row j=0 ===== -->
  <text x="38" y="138" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="80" y="138" text-anchor="middle" font-size="10" fill="#333">0</text>
  <g font-size="9">
    <rect x="120" y="126" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="145" y="140" text-anchor="middle" fill="#446688" font-weight="bold">[0]·0</text>
  </g>
  <text x="180" y="140" font-size="9" fill="#888">← 入队</text>
  <text x="386" y="140" font-size="9" fill="#555">队空，直接入队</text>

  <!-- ===== Row j=1 ===== -->
  <text x="38" y="164" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="80" y="164" text-anchor="middle" font-size="10" fill="#333">3</text>
  <g font-size="9">
    <rect x="120" y="152" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="145" y="166" text-anchor="middle" fill="#4a7a3a">[0]·0</text>
    <rect x="174" y="152" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="199" y="166" text-anchor="middle" fill="#446688" font-weight="bold">[1]·3</text>
  </g>
  <text x="234" y="166" font-size="9" fill="#888">← 入队</text>
  <text x="386" y="166" font-size="9" fill="#555">0≤3−6? 否；3&gt;0 保单调</text>

  <!-- ===== Row j=2 ===== -->
  <text x="38" y="190" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="80" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <g font-size="9">
    <rect x="120" y="178" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="145" y="192" text-anchor="middle" fill="#b85450">[1]·3</text>
    <path d="M 145 200 L 145 206" stroke="#b85450" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="168" y="206" font-size="8" fill="#b85450" font-weight="bold">弹尾</text>
    <rect x="190" y="178" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="215" y="192" text-anchor="middle" fill="#446688" font-weight="bold">[2]·1</text>
  </g>
  <text x="250" y="192" font-size="9" fill="#888">← 入队</text>
  <text x="386" y="190" font-size="9" fill="#b85450" font-weight="bold">−2 使 P 降：3≥1 弹 [1]</text>
  <text x="386" y="202" font-size="9" fill="#555">[1] 被 [2] 支配</text>

  <!-- ===== Row j=3 ===== -->
  <text x="38" y="216" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="80" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
  <g font-size="9">
    <rect x="120" y="204" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="145" y="218" text-anchor="middle" fill="#b85450">[0]·0</text>
    <path d="M 145 226 L 145 232" stroke="#b85450" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="168" y="232" font-size="8" fill="#b85450" font-weight="bold">弹头</text>
    <rect x="190" y="204" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="215" y="218" text-anchor="middle" fill="#446688" font-weight="bold">[3]·6</text>
  </g>
  <text x="250" y="218" font-size="9" fill="#888">← 入队</text>
  <text x="386" y="216" font-size="9" fill="#4a7a3a" font-weight="bold">0≤6−6=0 ✓ ans=3</text>
  <text x="386" y="228" font-size="9" fill="#555">弹 [0]（已用尽）</text>

  <!-- ===== Row j=4 ===== -->
  <text x="38" y="242" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="80" y="242" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <g font-size="9">
    <rect x="120" y="230" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="145" y="244" text-anchor="middle" fill="#b85450">[3]·6</text>
    <path d="M 145 252 L 145 258" stroke="#b85450" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="168" y="258" font-size="8" fill="#b85450" font-weight="bold">弹尾</text>
    <rect x="190" y="230" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="215" y="244" text-anchor="middle" fill="#446688" font-weight="bold">[4]·5</text>
  </g>
  <text x="250" y="244" font-size="9" fill="#888">← 入队</text>
  <text x="386" y="242" font-size="9" fill="#b85450" font-weight="bold">−1 使 P 降：6≥5 弹 [3]</text>
  <text x="386" y="254" font-size="9" fill="#555">[2]·1 仍在队中</text>

  <!-- ===== Row j=5 ===== -->
  <text x="38" y="268" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="80" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">9</text>
  <g font-size="9">
    <rect x="120" y="256" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="145" y="270" text-anchor="middle" fill="#b85450">[2]·1</text>
    <path d="M 145 278 L 145 284" stroke="#b85450" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="168" y="284" font-size="8" fill="#b85450" font-weight="bold">弹头</text>
    <rect x="190" y="256" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="215" y="270" text-anchor="middle" fill="#446688" font-weight="bold">[5]·9</text>
  </g>
  <text x="250" y="270" font-size="9" fill="#888">← 入队</text>
  <text x="386" y="268" font-size="9" fill="#4a7a3a" font-weight="bold">1≤9−6=3 ✓ ans=3</text>
  <text x="386" y="280" font-size="9" fill="#555">5−2=3，并列最优</text>

  <!-- ===== Summary box ===== -->
  <rect x="20" y="300" width="560" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="322" font-size="11" fill="#d6a040" font-weight="bold">关键观察</text>

  <text x="40" y="342" font-size="10" fill="#555">• j=2 与 j=4：遇到负数（−2、−1）使前缀和下降，触发「弹尾」—— P 值更大的旧下标被支配，安全丢弃。</text>
  <text x="40" y="358" font-size="10" fill="#555">• j=3 与 j=5：前缀和足够大（6、9），触发「弹头」—— 队头 P 值最小最易满足 P[i]≤P[j]−k，命中即记录并丢弃。</text>
  <text x="40" y="374" font-size="10" fill="#555">• 队头查到一次就弹：未来 j'&gt;j 给出的 j'−front 只会更长，front 再无价值。</text>
  <text x="40" y="390" font-size="10" fill="#555">• 队尾弹掉被支配者：P[back]≥P[j] 且 back&lt;j，back「和更大、位更前」，对任何未来右端都不如 j。</text>
  <text x="40" y="408" font-size="10" fill="#4a7a3a" font-weight="bold">→ 每个下标入队 1 次、出队 1 次，总操作 O(n)，均摊每步 O(1)。</text>

  <text x="300" y="446" text-anchor="middle" font-size="10" fill="#888">最终 ans = 3（[3,−2,5] 或 [5,−1,4]，和均为 6/8 ≥ 6）</text>
</svg>
