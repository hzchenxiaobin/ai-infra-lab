<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：弹掉 ≤ 的障碍取 maxR，栈顶残留者即杀手</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">快照：处理 nums[i]=4，栈（自底向顶值递减）= [5, 4]</text>

  <!-- ===== Stack (vertical, bottom = largest = killer) ===== -->
  <!-- bottom cell: killer 5 -->
  <rect x="150" y="250" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="210" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="210" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a">r = 0</text>
  <text x="140" y="278" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">杀手</text>
  <text x="140" y="292" text-anchor="end" font-size="9.5" fill="#4a7a3a">5 &gt; 4</text>

  <!-- top cell: obstacle 4 (being popped) -->
  <rect x="150" y="196" width="120" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="210" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="210" y="234" text-anchor="middle" font-size="10" fill="#d6a040">r = 2</text>
  <text x="140" y="224" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">障碍</text>
  <text x="140" y="238" text-anchor="end" font-size="9.5" fill="#d6a040">4 ≤ 4</text>

  <!-- stack axis label -->
  <text x="120" y="190" text-anchor="end" font-size="9.5" fill="#888">栈顶↑</text>
  <text x="120" y="296" text-anchor="end" font-size="9.5" fill="#888">栈底</text>
  <line x1="130" y1="296" x2="130" y2="196" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- pop arrow: obstacle -> maxR box -->
  <path d="M 270 219 L 332 219" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="301" y="211" text-anchor="middle" font-size="9.5" fill="#d6a040">弹出</text>

  <!-- maxR box -->
  <rect x="334" y="196" width="96" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取 max</text>
  <text x="382" y="233" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">maxR = 2</text>

  <!-- ===== New element nums[i] on the right ===== -->
  <rect x="334" y="250" width="96" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="382" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">nums[i]=4</text>
  <text x="382" y="288" text-anchor="middle" font-size="10" fill="#446688">r[i] = ?</text>

  <!-- killer reaches new element after obstacle cleared -->
  <path d="M 270 273 Q 300 300 332 273" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="301" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">障碍清完→下手</text>

  <!-- ===== Formula box ===== -->
  <rect x="120" y="338" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">r[i] = maxR + 1 = 2 + 1 = 3</text>

  <!-- side note -->
  <text x="460" y="276" text-anchor="middle" font-size="9.5" fill="#888">栈空则</text>
  <text x="460" y="290" text-anchor="middle" font-size="9.5" fill="#888">r[i]=0</text>
  <text x="460" y="304" text-anchor="middle" font-size="9.5" fill="#888">(永存)</text>

  <!-- legend strip top-right -->
  <rect x="412" y="60" width="22" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="440" y="71" font-size="9.5" fill="#4a7a3a">杀手(&gt;)</text>
  <rect x="412" y="80" width="22" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="440" y="91" font-size="9.5" fill="#d6a040">障碍(≤)</text>
  <rect x="412" y="100" width="22" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="440" y="111" font-size="9.5" fill="#446688">新元素</text>
</svg>
