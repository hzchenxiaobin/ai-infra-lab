<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：基因变异图 = 最短路 BFS</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">每个合法基因为节点，相差 1 个字符就连边，BFS 分层即变异步数</text>

  <!-- level labels -->
  <g filter="url(#rough2)" font-size="11" fill="#888">
    <text x="40" y="89" text-anchor="middle">层 0</text>
    <text x="40" y="179" text-anchor="middle">层 1</text>
    <text x="40" y="279" text-anchor="middle">层 2</text>
  </g>

  <!-- edges -->
  <g filter="url(#rough2)">
    <path d="M 280 104 L 280 154" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 252 194 L 200 252" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 308 194 L 360 252" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- nodes -->
  <g filter="url(#rough2)" font-size="13" font-weight="bold">
    <!-- level 0: start -->
    <rect x="230" y="68" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <text x="280" y="92" text-anchor="middle" fill="#446688">AACCGGTT</text>
    <text x="280" y="60" text-anchor="middle" font-size="10" fill="#446688">起点 start</text>

    <!-- level 1 -->
    <rect x="230" y="158" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="280" y="182" text-anchor="middle"><tspan fill="#555">AACCGGT</tspan><tspan fill="#b85450">A</tspan></text>

    <!-- level 2 left -->
    <rect x="130" y="256" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="180" y="280" text-anchor="middle"><tspan fill="#555">AACCG</tspan><tspan fill="#b85450">C</tspan><tspan fill="#555">TA</tspan></text>

    <!-- level 2 right: end -->
    <rect x="330" y="256" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6"/>
    <text x="380" y="280" text-anchor="middle"><tspan fill="#555">AA</tspan><tspan fill="#b85450">A</tspan><tspan fill="#555">CGGTA</tspan></text>
    <text x="380" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a">终点 end</text>
  </g>

  <!-- legend box -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="448" y="120" width="104" height="96" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="8"/>
    <text x="500" y="139" text-anchor="middle" fill="#444" font-weight="bold" font-size="11">图构造规则</text>
    <text x="458" y="158" fill="#555" font-size="10">节点 = 合法基因</text>
    <text x="458" y="172" fill="#555" font-size="10">（bank ∪ {start}）</text>
    <text x="458" y="190" fill="#555" font-size="10">边 = 恰差 1 字符</text>
    <text x="458" y="206" fill="#555" font-size="10">BFS 层 = 变异步数</text>
  </g>

  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#888">红字 = 该步被改动的字符位｜只有落在 bank 中的变异才视为合法节点</text>
</svg>
