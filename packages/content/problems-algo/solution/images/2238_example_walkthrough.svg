<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：6 行 → 司机集合 {7,11} → 逐司机扫描乘客列</text>

  <!-- ===== Top: Rides table ===== -->
  <text x="110" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Rides 表</text>
  <rect x="20" y="56" width="190" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="71" font-size="8" fill="#446688" font-weight="bold">ride_id</text>
  <text x="105" y="71" font-size="8" fill="#446688" font-weight="bold">driver_id</text>
  <text x="165" y="71" font-size="8" fill="#446688" font-weight="bold">passenger</text>

  <rect x="20" y="80" width="190" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="93" font-size="8" fill="#4a7a3a">1</text><text x="105" y="93" font-size="8" fill="#4a7a3a" font-weight="bold">7</text><text x="165" y="93" font-size="8" fill="#555">1</text>

  <rect x="20" y="100" width="190" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="113" font-size="8" fill="#4a7a3a">2</text><text x="105" y="113" font-size="8" fill="#4a7a3a" font-weight="bold">7</text><text x="165" y="113" font-size="8" fill="#555">2</text>

  <rect x="20" y="120" width="190" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="133" font-size="8" fill="#d6a040">3</text><text x="105" y="133" font-size="8" fill="#d6a040" font-weight="bold">11</text><text x="165" y="133" font-size="8" fill="#555">1</text>

  <rect x="20" y="140" width="190" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="153" font-size="8" fill="#d6a040">4</text><text x="105" y="153" font-size="8" fill="#d6a040" font-weight="bold">11</text><text x="165" y="153" font-size="8" fill="#b85450" font-weight="bold">7</text>

  <rect x="20" y="160" width="190" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="173" font-size="8" fill="#d6a040">5</text><text x="105" y="173" font-size="8" fill="#d6a040" font-weight="bold">11</text><text x="165" y="173" font-size="8" fill="#b85450" font-weight="bold">7</text>

  <rect x="20" y="180" width="190" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="193" font-size="8" fill="#d6a040">6</text><text x="105" y="193" font-size="8" fill="#d6a040" font-weight="bold">11</text><text x="165" y="193" font-size="8" fill="#555">3</text>

  <text x="115" y="218" text-anchor="middle" font-size="8" fill="#888">DISTINCT driver_id →</text>
  <rect x="60" y="222" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="120" y="222" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="237" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">11</text>

  <!-- arrow from driver 7 to scan block -->
  <path d="M 210 120 C 250 120 250 110 286 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Middle: scan for driver 7 ===== -->
  <rect x="290" y="56" width="180" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="74" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">扫描乘客列找 7</text>
  <text x="380" y="88" text-anchor="middle" font-size="8" fill="#666">r.passenger_id = 7 ?</text>
  <line x1="302" y1="94" x2="458" y2="94" stroke="#d0e8d0" stroke-width="1" filter="url(#rough2)"/>

  <text x="302" y="108" font-size="8" fill="#999">ride1 乘客=1 ✗</text>
  <text x="302" y="122" font-size="8" fill="#999">ride2 乘客=2 ✗</text>
  <text x="302" y="136" font-size="8" fill="#999">ride3 乘客=1 ✗</text>
  <rect x="298" y="140" width="166" height="14" fill="#b85450" fill-opacity="0.18" rx="2" filter="url(#rough2)"/>
  <text x="302" y="151" font-size="8" fill="#b85450" font-weight="bold">ride4 乘客=7 ✓</text>
  <rect x="298" y="154" width="166" height="14" fill="#b85450" fill-opacity="0.18" rx="2" filter="url(#rough2)"/>
  <text x="302" y="165" font-size="8" fill="#b85450" font-weight="bold">ride5 乘客=7 ✓</text>

  <text x="380" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">命中 2 行 → cnt=2</text>

  <!-- arrow from driver 11 to scan block -->
  <path d="M 210 160 C 250 200 250 230 286 230" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Middle-lower: scan for driver 11 ===== -->
  <rect x="290" y="196" width="180" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="214" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">扫描乘客列找 11</text>
  <text x="380" y="228" text-anchor="middle" font-size="8" fill="#666">r.passenger_id = 11 ?</text>
  <line x1="302" y1="234" x2="458" y2="234" stroke="#f0e0c0" stroke-width="1" filter="url(#rough2)"/>

  <text x="302" y="248" font-size="8" fill="#999">6 行乘客：1,2,1,7,7,3</text>
  <text x="302" y="262" font-size="8" fill="#b85450" font-weight="bold">无一等于 11 → 0 命中</text>

  <!-- ===== Right: assemble result ===== -->
  <path d="M 470 110 C 510 110 510 130 524 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 470 234 C 510 234 510 160 524 160" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="528" y="56" width="90" height="200" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="573" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">结果</text>
  <rect x="538" y="80" width="70" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="555" y="94" font-size="8" fill="#446688" font-weight="bold">driver</text>
  <text x="590" y="94" font-size="8" fill="#446688" font-weight="bold">cnt</text>

  <rect x="538" y="124" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="555" y="139" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="590" y="139" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="538" y="154" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="555" y="169" font-size="11" fill="#d6a040" font-weight="bold">11</text>
  <text x="590" y="169" font-size="11" fill="#d6a040" font-weight="bold">0</text>

  <text x="573" y="194" text-anchor="middle" font-size="8" fill="#888">司机 7 当过</text>
  <text x="573" y="206" text-anchor="middle" font-size="8" fill="#888">2 次乘客</text>
  <text x="573" y="224" text-anchor="middle" font-size="8" fill="#888">司机 11 从未</text>
  <text x="573" y="236" text-anchor="middle" font-size="8" fill="#888">当过乘客</text>

  <!-- ===== Bottom note ===== -->
  <rect x="20" y="296" width="600" height="158" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">逐司机扫描乘客列 → COUNT(ride_id)，未命中靠 LEFT JOIN 补 NULL 计 0</text>

  <text x="38" y="340" font-size="9" fill="#4a7a3a" font-weight="bold">司机 7</text>
  <text x="38" y="354" font-size="8" fill="#666">driver_id=7 出现在 ride 1,2（开车 2 次）</text>
  <text x="38" y="368" font-size="8" fill="#666">passenger_id=7 出现在 ride 4,5（当乘客 2 次）</text>
  <text x="38" y="382" font-size="8" fill="#4a7a3a" font-weight="bold">LEFT JOIN 命中 2 行 → COUNT(r.ride_id)=2 ✓</text>

  <text x="38" y="406" font-size="9" fill="#d6a040" font-weight="bold">司机 11</text>
  <text x="38" y="420" font-size="8" fill="#666">driver_id=11 出现在 ride 3,4,5,6（开车 4 次）</text>
  <text x="38" y="434" font-size="8" fill="#666">passenger_id=11 全表无 → LEFT JOIN 补 1 行全 NULL</text>
  <text x="38" y="448" font-size="8" fill="#d6a040" font-weight="bold">COUNT(r.ride_id)=0（NULL 不计数）✓</text>
</svg>
