<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="940" height="480" fill="#fafafa"/>

  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反转偶数长度组：组大小 1→2→3→… 递增，偶数长度组反转</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">组号 i 预期长度 = i；最后一组可能不满，按实际长度判奇偶</text>

  <!-- Row 1: 原链表分组 -->
  <text x="40" y="92" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① 分组</text>

  <!-- group labels -->
  <text x="85" y="92" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">组1 len=1 奇</text>
  <text x="193" y="92" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">组2 len=2 偶</text>
  <text x="373" y="92" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">组3 len=3 奇</text>
  <text x="625" y="92" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">组4 len=4 偶</text>

  <!-- group background bands -->
  <rect x="52" y="100" width="72" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" filter="url(#rough2)"/>
  <rect x="124" y="100" width="152" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" filter="url(#rough2)"/>
  <rect x="296" y="100" width="224" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" filter="url(#rough2)"/>
  <rect x="568" y="100" width="224" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" filter="url(#rough2)"/>

  <!-- boxes row 1: 5,2,6,3,9,1,7,3,8,4 -->
  <g filter="url(#rough2)">
    <rect x="60" y="106" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="132" y="106" width="50" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="204" y="106" width="50" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="276" y="106" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="348" y="106" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="420" y="106" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="492" y="106" width="50" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="564" y="106" width="50" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="636" y="106" width="50" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="708" y="106" width="50" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="85" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="157" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="229" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="301" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="373" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="445" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="517" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="589" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="661" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="733" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- downward arrows for even groups -->
  <path d="M 193 148 L 193 178" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 625 148 L 625 178" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Row 2: 偶数组反转后 -->
  <text x="40" y="192" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② 偶数组反转</text>

  <!-- group background bands row 2 -->
  <rect x="52" y="200" width="72" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" filter="url(#rough2)"/>
  <rect x="124" y="200" width="152" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" filter="url(#rough2)"/>
  <rect x="296" y="200" width="224" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" filter="url(#rough2)"/>
  <rect x="568" y="200" width="224" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" filter="url(#rough2)"/>

  <!-- boxes row 2: 5,6,2,3,9,1,4,8,3,7 (even groups reversed) -->
  <g filter="url(#rough2)">
    <rect x="60" y="206" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="132" y="206" width="50" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="204" y="206" width="50" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="276" y="206" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="348" y="206" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="420" y="206" width="50" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="492" y="206" width="50" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="564" y="206" width="50" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="636" y="206" width="50" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="708" y="206" width="50" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="85" y="227" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="157" y="227" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="229" y="227" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="301" y="227" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="373" y="227" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="445" y="227" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="517" y="227" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="589" y="227" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="661" y="227" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="733" y="227" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- reverse labels -->
  <text x="193" y="196" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">2,6→6,2</text>
  <text x="625" y="196" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">7,3,8,4→4,8,3,7</text>

  <!-- downward arrow to result -->
  <path d="M 420 248 L 420 278" stroke="#4a8edb" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Row 3: 结果 -->
  <text x="40" y="292" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">③ 拼接结果</text>
  <g filter="url(#rough2)">
    <rect x="60" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="132" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="204" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="276" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="348" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="420" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="492" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="564" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="636" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="708" y="286" width="50" height="32" rx="4" fill="#bcd6f0" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="85" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="157" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="229" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="301" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="373" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="445" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="517" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="589" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="661" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="733" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- Bottom callout: last group actual length -->
  <rect x="40" y="338" width="860" height="128" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="60" y="362" font-size="13" font-weight="bold" fill="#7a2828" filter="url(#rough2)">⚠ 关键洞察：最后一组的实际长度可能 &lt; 预期，按实际长度判奇偶</text>
  <text x="60" y="384" font-size="11" fill="#444" filter="url(#rough2)">示例 3：head = [1,1,0,6,5]</text>
  <text x="60" y="404" font-size="11" fill="#444" filter="url(#rough2)">组1 预期1 实际1(奇) → [1] 保留</text>
  <text x="60" y="422" font-size="11" fill="#444" filter="url(#rough2)">组2 预期2 实际2(偶) → [1,0] 反转 → [0,1]</text>
  <text x="60" y="440" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">组3 预期3 实际2(偶) → [6,5] 反转 → [5,6]  ← 实际 &lt; 预期，仍按实际判奇偶</text>
  <text x="60" y="458" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">结果：[1,0,1,5,6]</text>
</svg>
