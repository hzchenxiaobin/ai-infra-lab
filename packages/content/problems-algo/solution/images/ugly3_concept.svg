<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">容斥原理：[1, x] 中能被 a/b/c 至少一个整除的个数</text>

  <!-- ===== Venn diagram ===== -->
  <!-- Circle A: multiples of a (blue) -->
  <circle cx="200" cy="150" r="66" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="120" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a 的倍数</text>
  <text x="160" y="150" text-anchor="middle" font-size="11" fill="#446688">⌊x/a⌋</text>

  <!-- Circle B: multiples of b (green) -->
  <circle cx="312" cy="150" r="66" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="348" y="120" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">b 的倍数</text>
  <text x="354" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">⌊x/b⌋</text>

  <!-- Circle C: multiples of c (orange) -->
  <circle cx="256" cy="220" r="66" fill="#fff8e1" fill-opacity="0.55" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="256" y="270" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">c 的倍数</text>
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#d6a040">⌊x/c⌋</text>

  <!-- overlap labels -->
  <text x="244" y="158" text-anchor="middle" font-size="9" fill="#888">a∩b</text>
  <text x="214" y="200" text-anchor="middle" font-size="9" fill="#888">a∩c</text>
  <text x="290" y="200" text-anchor="middle" font-size="9" fill="#888">b∩c</text>
  <text x="252" y="188" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">a∩b∩c</text>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="300" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">f(x) = ⌊x/a⌋ + ⌊x/b⌋ + ⌊x/c⌋</text>
  <text x="280" y="335" text-anchor="middle" font-size="11" fill="#b85450">  − ⌊x/lcm(a,b)⌋ − ⌊x/lcm(a,c)⌋ − ⌊x/lcm(b,c)⌋ + ⌊x/lcm(a,b,c)⌋</text>

  <!-- ===== Monotonic note ===== -->
  <path d="M 280 350 L 280 362" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="368" width="420" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">f(x) 关于 x 单调递增 ⇒ 二段性成立</text>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a">求最小的 x 使 f(x) ≥ n，即第 n 个「丑数」</text>
</svg>
