<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：六个 CTE 一条龙 —— 拆词 → 拆段 → 变形 → 两级拼回</text>

  <rect x="30" y="44" width="160" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">① numbers 数字表</text>
  <text x="110" y="77" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">WITH RECURSIVE 生成 n=1..1000</text>
  <text x="110" y="90" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">两层拆分共用同一张表</text>

  <path d="M 194 73 L 218 73" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="44" width="170" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="307" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">② words：拆词 explode</text>
  <text x="307" y="77" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">CROSS JOIN + n ≤ 词数(空格数+1)</text>
  <text x="307" y="90" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">"the QUICK-brown fox" → 3 行</text>

  <path d="M 396 73 L 420 73" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="424" y="44" width="116" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="482" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">③ parts：拆段</text>
  <text x="482" y="77" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">再 CROSS JOIN</text>
  <text x="482" y="90" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">m ≤ '-'数+1</text>

  <path d="M 482 106 L 482 124" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="424" y="128" width="116" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="482" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ capitalized</text>
  <text x="482" y="161" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">CONCAT(UPPER(LEFT(</text>
  <text x="482" y="173" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">part,1)),LOWER(…))</text>
  <text x="482" y="186" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">QUICK → Quick</text>

  <path d="M 420 161 L 396 161" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="128" width="170" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="307" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ cap_words：拼回词 implode①</text>
  <text x="307" y="161" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">GROUP BY content_id, word_pos</text>
  <text x="307" y="173" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">GROUP_CONCAT(ORDER BY part_pos</text>
  <text x="307" y="185" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">SEPARATOR '-')</text>

  <path d="M 216 161 L 192 161" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="128" width="158" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="109" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑥ 最终 SELECT：implode②</text>
  <text x="109" y="161" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">GROUP BY content_id, content_text</text>
  <text x="109" y="173" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">GROUP_CONCAT(ORDER BY word_pos</text>
  <text x="109" y="185" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">SEPARATOR ' ')，输出三列</text>

  <rect x="30" y="212" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="228" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">取词与取段是同一个 idiom：SUBSTRING_INDEX(SUBSTRING_INDEX(s, sep, k), sep, -1) = 第 k 段</text>
  <text x="290" y="244" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">外层取前 k 段、内层取最后一个 —— sep 换成 ' ' 或 '-' 就能复用</text>

  <rect x="30" y="264" width="520" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="282" text-anchor="middle" font-size="9.5" fill="#8a3030" font-weight="bold" filter="url(#rough2)">⚠️ 两级 GROUP_CONCAT 体内的 ORDER BY 都不可省</text>
  <text x="290" y="297" text-anchor="middle" font-size="9" fill="#8a3030" filter="url(#rough2)">内层丢 ORDER BY part_pos → "Brown-Quick"；外层丢 ORDER BY word_pos → 词序洗牌</text>
  <text x="290" y="310" text-anchor="middle" font-size="8.5" filter="url(#rough2)" fill="#888">组内物理顺序无语义保证，函数体内 ORDER BY 是唯一排序载体</text>

  <rect x="30" y="330" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="348" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">数据流一图流：句子行 → (词)行 → (词,段)行 → 变形段 → 段拼词 → 词拼句</text>
  <text x="290" y="364" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">普通词段数=1 自动退化；连字符词段数≥2 各自独立变形</text>
  <text x="290" y="378" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">GROUP BY 键逐级收窄：content_id ← (content_id, word_pos) ← 原 (行, 词, 段) 粒度</text>
</svg>
