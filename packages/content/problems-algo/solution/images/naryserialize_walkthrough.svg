<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：前序遍历，每节点写「值 孩子数」</text>

  <!-- 顶部 N 叉树，标注访问顺序 -->
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">原树（标注前序访问顺序 ①→⑥）</text>
  <circle cx="290" cy="72" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="76" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="312" y="68" font-size="10" fill="#b85450" font-weight="bold">①</text>
  <circle cx="215" cy="116" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215" y="120" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="234" y="112" font-size="9" fill="#b85450" font-weight="bold">②</text>
  <circle cx="290" cy="116" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="120" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="307" y="112" font-size="9" fill="#b85450" font-weight="bold">⑤</text>
  <circle cx="365" cy="116" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="365" y="120" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="383" y="112" font-size="9" fill="#b85450" font-weight="bold">⑥</text>
  <line x1="278" y1="83" x2="224" y2="106" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="290" y1="86" x2="290" y2="103" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="302" y1="83" x2="356" y2="106" stroke="#888" stroke-width="1.1" filter="url(#rough2)"/>
  <circle cx="190" cy="160" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="164" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="206" y="158" font-size="9" fill="#b85450" font-weight="bold">③</text>
  <circle cx="240" cy="160" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="164" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="256" y="158" font-size="9" fill="#b85450" font-weight="bold">④</text>
  <line x1="205" y1="127" x2="194" y2="150" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="225" y1="127" x2="236" y2="150" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="100" y="188" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="160" y="188" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">访问节点</text>
  <rect x="250" y="188" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">孩子数</text>
  <rect x="330" y="188" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="405" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">写入 token</text>

  <!-- 行 1 -->
  <rect x="100" y="212" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="227" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">①</text>
  <rect x="160" y="212" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="227" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="250" y="212" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="227" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="330" y="212" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="227" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1 3</text>

  <!-- 行 2 -->
  <rect x="100" y="234" width="60" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="249" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">②</text>
  <rect x="160" y="234" width="90" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="249" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="250" y="234" width="80" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="249" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="330" y="234" width="150" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="249" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">3 2</text>

  <!-- 行 3 -->
  <rect x="100" y="256" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="271" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③</text>
  <rect x="160" y="256" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="271" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="250" y="256" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="271" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="330" y="256" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="271" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">5 0</text>

  <!-- 行 4 -->
  <rect x="100" y="278" width="60" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="293" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <rect x="160" y="278" width="90" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="293" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="250" y="278" width="80" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="293" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="330" y="278" width="150" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="293" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">6 0</text>

  <!-- 行 5 -->
  <rect x="100" y="300" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="315" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤</text>
  <rect x="160" y="300" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="315" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="250" y="300" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="315" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="330" y="300" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="315" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2 0</text>

  <!-- 行 6 -->
  <rect x="100" y="322" width="60" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="337" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑥</text>
  <rect x="160" y="322" width="90" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="337" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="250" y="322" width="80" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="337" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="330" y="322" width="150" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="337" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">4 0</text>

  <!-- 最终序列 -->
  <rect x="100" y="360" width="380" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最终序列</text>
  <text x="290" y="394" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1 3 3 2 5 0 6 0 2 0 4 0</text>
</svg>
