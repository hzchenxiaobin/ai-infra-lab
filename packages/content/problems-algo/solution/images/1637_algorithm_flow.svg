<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：提取 x → 排序 → 找最大相邻差</text>

  <!-- Step 1: extract x -->
  <rect x="60" y="48" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 提取所有点的 x 坐标</text>

  <path d="M 170 90 L 170 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="60" y="112" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 对 x 数组升序排序</text>

  <path d="M 170 154 L 170 172" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop -->
  <rect x="40" y="176" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ for i = 1 to n−1</text>

  <path d="M 300 196 L 338 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute diff -->
  <rect x="340" y="176" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="195" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">gap = xs[i] − xs[i−1]</text>
  <text x="430" y="210" text-anchor="middle" font-size="11" fill="#666">ans = max(ans, gap)</text>

  <path d="M 430 216 L 430 234" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision -->
  <polygon points="430,238 490,268 430,298 370,268" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="265" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- Yes: loop back -->
  <path d="M 370 268 L 170 268 L 170 216" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是 → i++</text>

  <!-- No: return -->
  <path d="M 430 298 L 430 312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="308" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="60" y="314" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="170" y="337" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ return ans</text>

  <!-- note -->
  <rect x="340" y="314" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="337" text-anchor="middle" font-size="10" fill="#888">n ≥ 2 保证至少一个相邻差</text>
</svg>
