<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">车队算法流程（排序 + 一次遍历）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="58" rx="140" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">开始: 按 pos 降序排序, fleets=0, max_t=0</text>

  <!-- arrow down -->
  <path d="M 270 78 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n? -->
  <polygon points="270,100 370,146 270,192 170,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="270" y="158" text-anchor="middle" font-size="11" fill="#666">(还有车?)</text>

  <!-- No branch -> end -->
  <path d="M 370 146 L 452 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="138" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="146" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="150" text-anchor="middle" font-size="12" fill="#333">返回 fleets</text>

  <!-- Yes branch down -->
  <path d="M 270 192 L 270 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="206" font-size="11" fill="#82b366">是</text>

  <!-- Compute time -->
  <rect x="130" y="214" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="12" fill="#333">t = (target − pos[i]) / spd[i]</text>

  <!-- arrow down -->
  <path d="M 270 248 L 270 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: t > max_t? -->
  <polygon points="270,270 370,316 270,362 170,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#333">t &gt; max_t ?</text>
  <text x="270" y="328" text-anchor="middle" font-size="11" fill="#666">(追不上前面?)</text>

  <!-- Yes (new fleet) -> left -->
  <path d="M 170 316 L 110 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="308" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="14" y="296" width="96" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="314" text-anchor="middle" font-size="11" fill="#333">fleets++</text>
  <text x="62" y="330" text-anchor="middle" font-size="11" fill="#555">max_t = t</text>

  <!-- No (join fleet) -> right -->
  <path d="M 370 316 L 430 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="432" y="296" width="96" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="314" text-anchor="middle" font-size="11" fill="#333">跳过</text>
  <text x="480" y="330" text-anchor="middle" font-size="11" fill="#555">(并入车队)</text>

  <!-- i++ node (below) -->
  <path d="M 62 338 L 62 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 338 L 480 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="384" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="404" text-anchor="middle" font-size="12" fill="#333">i++</text>
  <path d="M 62 380 L 250 380 L 270 384" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 380 L 290 380 L 270 384" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow from i++ up to decision -->
  <path d="M 270 384 L 270 384" stroke="none"/>
  <path d="M 330 399 L 510 399 L 510 146 L 486 146" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 399 L 30 399 L 30 146 L 170 146" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary note -->
  <text x="270" y="440" text-anchor="middle" font-size="11" fill="#888">关键：按位置降序保证只看「前面的车」；t &gt; max_t 即追不上 → 新车队</text>
</svg>
