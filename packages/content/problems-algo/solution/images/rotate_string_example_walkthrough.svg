<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abcde" 的 5 次旋转</text>

  <!-- header row -->
  <rect x="40" y="44" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k</text>
  <rect x="90" y="44" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">旋转结果</text>
  <rect x="270" y="44" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">vs goal</text>
  <rect x="440" y="44" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">判定</text>

  <!-- Example 1 label -->
  <text x="40" y="92" font-size="11" fill="#4a7a3a" font-weight="bold">示例1：goal = "cdeab"</text>

  <!-- k=0 abcde -->
  <rect x="40" y="98" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="114" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="90" y="98" width="180" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="114" text-anchor="middle" font-size="11" fill="#333">a b c d e</text>
  <rect x="270" y="98" width="170" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="114" text-anchor="middle" font-size="11" fill="#888">≠ cdeab</text>
  <rect x="440" y="98" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="114" text-anchor="middle" font-size="11" fill="#b85450">✗</text>

  <!-- k=1 bcdea -->
  <rect x="40" y="124" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="140" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="90" y="124" width="180" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="#333">b c d e a</text>
  <rect x="270" y="124" width="170" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="140" text-anchor="middle" font-size="11" fill="#888">≠ cdeab</text>
  <rect x="440" y="124" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="140" text-anchor="middle" font-size="11" fill="#b85450">✗</text>

  <!-- k=2 cdeab MATCH -->
  <rect x="40" y="150" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="90" y="150" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">c d e a b</text>
  <rect x="270" y="150" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">== cdeab</text>
  <rect x="440" y="150" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ true</text>

  <!-- separator -->
  <line x1="40" y1="186" x2="520" y2="186" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- Example 2 label -->
  <text x="40" y="206" font-size="11" fill="#b85450" font-weight="bold">示例2：goal = "abced"（无旋转匹配）</text>

  <!-- k=0 abcde -->
  <rect x="40" y="212" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="227" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <rect x="90" y="212" width="180" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="227" text-anchor="middle" font-size="10.5" fill="#333">a b c d e</text>
  <rect x="270" y="212" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="227" text-anchor="middle" font-size="10.5" fill="#888">≠ abced</text>
  <rect x="440" y="212" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="227" text-anchor="middle" font-size="10.5" fill="#b85450">✗</text>

  <!-- k=1 bcdea -->
  <rect x="40" y="236" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="251" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <rect x="90" y="236" width="180" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="251" text-anchor="middle" font-size="10.5" fill="#333">b c d e a</text>
  <rect x="270" y="236" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="251" text-anchor="middle" font-size="10.5" fill="#888">≠ abced</text>
  <rect x="440" y="236" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="251" text-anchor="middle" font-size="10.5" fill="#b85450">✗</text>

  <!-- k=2 cdeab -->
  <rect x="40" y="260" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="275" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <rect x="90" y="260" width="180" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="275" text-anchor="middle" font-size="10.5" fill="#333">c d e a b</text>
  <rect x="270" y="260" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="275" text-anchor="middle" font-size="10.5" fill="#888">≠ abced</text>
  <rect x="440" y="260" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="275" text-anchor="middle" font-size="10.5" fill="#b85450">✗</text>

  <!-- k=3 deabc -->
  <rect x="40" y="284" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="299" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <rect x="90" y="284" width="180" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="299" text-anchor="middle" font-size="10.5" fill="#333">d e a b c</text>
  <rect x="270" y="284" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="299" text-anchor="middle" font-size="10.5" fill="#888">≠ abced</text>
  <rect x="440" y="284" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="299" text-anchor="middle" font-size="10.5" fill="#b85450">✗</text>

  <!-- k=4 eabcd -->
  <rect x="40" y="308" width="50" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="323" text-anchor="middle" font-size="10.5" fill="#888">4</text>
  <rect x="90" y="308" width="180" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="323" text-anchor="middle" font-size="10.5" fill="#333">e a b c d</text>
  <rect x="270" y="308" width="170" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="323" text-anchor="middle" font-size="10.5" fill="#888">≠ abced</text>
  <rect x="440" y="308" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="323" text-anchor="middle" font-size="10.5" fill="#b85450">✗</text>

  <!-- conclusion -->
  <rect x="40" y="350" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="372" font-size="11.5" fill="#b85450" font-weight="bold">结论："abced" 不在 s+s 的任何长度为 5 的窗口中</text>
  <text x="56" y="390" font-size="10.5" fill="#888">5 次旋转全部不等 → false（d/e 顺序不对，旋转不改字符相对环序）</text>

  <!-- tip box -->
  <rect x="40" y="416" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="438" font-size="11" fill="#d6a040" font-weight="bold">💡 旋转 = 字符在环上的相对顺序不变，只是起点不同。</text>
  <text x="56" y="456" font-size="10.5" fill="#888">"abced" 中 d→e 顺序与原串 e→d 相反，必非旋转；s+s 子串法一查即知。</text>
</svg>
