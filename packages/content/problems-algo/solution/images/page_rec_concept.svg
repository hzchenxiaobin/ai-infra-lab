<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：双向好友 → 朋友喜欢的页面 → 排除己有</text>

  <!-- ===== 步骤①：双向好友 ===== -->
  <text x="40" y="54" font-size="11.5" fill="#446688" font-weight="bold">① 好友关系是双向的：user1=1 或 user2=1 都算朋友</text>

  <!-- Friendship 表片段 -->
  <rect x="40" y="62" width="210" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="40" y1="86" x2="250" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="145" y1="62" x2="145" y2="148" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">user1</text>
  <text x="197" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">user2</text>
  <!-- user1=1 行（蓝色高亮） -->
  <rect x="42" y="88" width="206" height="20" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="92" y="102" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="197" y="102" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="42" y="108" width="206" height="20" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="92" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="197" y="122" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="42" y="128" width="206" height="20" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="92" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="197" y="142" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- 对策框 -->
  <rect x="270" y="68" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="284" y="86" font-size="11.5" fill="#d6a040" font-weight="bold">对策：UNION 合并双向</text>
  <text x="284" y="103" font-size="10.5" fill="#555">user1=1 取 user2 ∪ user2=1 取 user1</text>

  <path d="M 265 100 L 272 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分隔虚线 -->
  <line x1="40" y1="162" x2="540" y2="162" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== 步骤②：朋友喜欢的页面 ===== -->
  <text x="40" y="182" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 朋友喜欢的页面：JOIN Likes 获取 page_id</text>

  <!-- 朋友集合 -->
  <rect x="40" y="190" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="208" font-size="10.5" fill="#4a7a3a" font-weight="bold">朋友集合</text>
  <text x="60" y="225" font-size="11" fill="#333">{2, 3, 4}</text>
  <text x="60" y="240" font-size="9.5" fill="#888">用户 1 的全部好友</text>

  <!-- Likes 表片段 -->
  <rect x="40" y="256" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="10.5" fill="#4a7a3a" font-weight="bold">Likes（朋友行）</text>
  <text x="60" y="291" font-size="10.5" fill="#333">user 2 → page 23, 77</text>
  <text x="60" y="306" font-size="10.5" fill="#333">user 3 → page 24, 77</text>

  <rect x="270" y="196" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="284" y="214" font-size="11.5" fill="#d6a040" font-weight="bold">对策：JOIN Likes ON user_id = friend</text>
  <text x="284" y="231" font-size="10.5" fill="#555">得到候选页面 {23, 77, 24}</text>

  <path d="M 265 220 L 272 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="40" y1="324" x2="540" y2="324" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== 步骤③：排除用户已喜欢的页面 ===== -->
  <text x="40" y="344" font-size="11.5" fill="#b85450" font-weight="bold">③ 排除用户 1 已喜欢的页面：NOT IN / LEFT JOIN</text>

  <!-- 用户1喜欢的页面 -->
  <rect x="40" y="352" width="210" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="370" font-size="10.5" fill="#b85450" font-weight="bold">用户 1 已喜欢</text>
  <text x="60" y="387" font-size="11" fill="#333">page 88</text>
  <text x="60" y="402" font-size="9.5" fill="#888">候选 {23,77,24} 中无 88</text>

  <rect x="270" y="358" width="270" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="284" y="376" font-size="11.5" fill="#d6a040" font-weight="bold">对策：WHERE page_id NOT IN (...)</text>
  <text x="284" y="393" font-size="10.5" fill="#555">最终推荐 {23, 77, 24}</text>

  <path d="M 265 380 L 272 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部总结 -->
  <rect x="40" y="422" width="500" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="440" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">💡 三步链式：找朋友 → 取朋友喜欢的页面 → 排除自己已喜欢的</text>
  <text x="290" y="455" text-anchor="middle" font-size="10" fill="#888">难点在第一步：好友关系双向，需 UNION 合并两个方向</text>
</svg>
