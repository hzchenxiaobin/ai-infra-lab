<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">路径得分 = 路径上格子的最小值</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">目标是最大化这个最小值——找到「瓶颈尽可能高」的路径</text>

  <!-- ===== 3x3 grid: [[5,4,5],[1,2,6],[7,4,6]] ===== -->
  <text x="60" y="86" font-size="11" fill="#446688" font-weight="bold">A = [[5,4,5],[1,2,6],[7,4,6]]</text>

  <!-- cell (0,0)=5 起点 -->
  <rect x="80" y="98" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="132" text-anchor="middle" font-size="20" fill="#d6a040" font-weight="bold">5</text>
  <text x="108" y="170" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">起点</text>

  <!-- cell (0,1)=4 path1 green -->
  <rect x="140" y="98" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="132" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- cell (0,2)=5 path1 green -->
  <rect x="200" y="98" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="228" y="132" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- cell (1,0)=1 path2 red -->
  <rect x="80" y="158" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="192" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">1</text>

  <!-- cell (1,1)=2 -->
  <rect x="140" y="158" width="56" height="56" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="168" y="192" text-anchor="middle" font-size="20" fill="#999">2</text>

  <!-- cell (1,2)=6 path1 green -->
  <rect x="200" y="158" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="228" y="192" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- cell (2,0)=7 path2 red -->
  <rect x="80" y="218" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="252" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">7</text>

  <!-- cell (2,1)=4 path2 red -->
  <rect x="140" y="218" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="252" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">4</text>

  <!-- cell (2,2)=6 终点 -->
  <rect x="200" y="218" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="252" text-anchor="middle" font-size="20" fill="#d6a040" font-weight="bold">6</text>
  <text x="228" y="290" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">终点</text>

  <!-- path 1 arrows: (0,0)->(0,1)->(0,2)->(1,2)->(2,2) -->
  <path d="M 138 126 L 140 126" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 198 126 L 200 126" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 228 156 L 228 158" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 228 216 L 228 218" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- path 2 arrows: (0,0)->(1,0)->(2,0)->(2,1)->(2,2) -->
  <path d="M 108 156 L 108 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 108 216 L 108 218" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 138 246 L 140 246" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 198 246 L 200 246" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== explanation panel right ===== -->
  <rect x="300" y="86" width="220" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="410" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">路径①（最优）</text>
  <text x="312" y="124" font-size="10" fill="#4a7a3a">5 → 4 → 5 → 6 → 6</text>
  <text x="312" y="140" font-size="10" fill="#4a7a3a">得分 = min(5,4,5,6,6) = 4</text>
  <text x="312" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">瓶颈在 (0,1)=4</text>
  <text x="312" y="176" font-size="9" fill="#666">避开低值格子 1、2，走顶行</text>

  <rect x="300" y="196" width="220" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="410" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">路径②（次优）</text>
  <text x="312" y="234" font-size="10" fill="#b85450">5 → 1 → 7 → 4 → 6</text>
  <text x="312" y="250" font-size="10" fill="#b85450">得分 = min(5,1,7,4,6) = 1</text>
  <text x="312" y="268" font-size="9" fill="#666">经过 (1,0)=1 拖累全局</text>

  <!-- answer box -->
  <rect x="300" y="290" width="220" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="410" y="310" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">答案 = max(4, 1) = 4</text>
  <text x="410" y="326" text-anchor="middle" font-size="9" fill="#666">所有路径中最小值的最大者</text>

  <!-- footer note -->
  <text x="40" y="338" font-size="10" fill="#888">与 778 互为镜像：778 最小化路径最大值（min-heap, max 聚合）；本题最大化路径最小值（max-heap, min 聚合）</text>
  <text x="40" y="354" font-size="10" fill="#888">堆弹出最大得分者即确定该格最优——格值非负保证路径得分随延展单调不增，贪心正确</text>
</svg>
