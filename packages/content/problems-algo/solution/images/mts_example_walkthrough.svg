<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：sorted = [2,2,2,1,1], target=2</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">降序后逐根放边；红字 = 本步新放入的火柴；满边标 =2 ✓</text>

  <!-- column headers -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="36" y="64">步</text>
    <text x="76" y="64">放入</text>
    <text x="150" y="64">边0</text>
    <text x="250" y="64">边1</text>
    <text x="350" y="64">边2</text>
    <text x="450" y="64">边3</text>
  </g>

  <!-- ===== step 1: place 2 -> edge0 full ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="92" font-size="10.5" fill="#4a7a3a">1</text>
    <rect x="60" y="78" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="96" fill="#b85450">2</text>
    <rect x="105" y="74" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="150" y="96" fill="#b85450">2</text>
    <text x="185" y="88" font-size="9" fill="#4a7a3a">=2✓</text>
    <rect x="205" y="74" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="250" y="96" font-size="10" fill="#bbb">空</text>
    <rect x="305" y="74" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="350" y="96" font-size="10" fill="#bbb">空</text>
    <rect x="405" y="74" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="450" y="96" font-size="10" fill="#bbb">空</text>
  </g>

  <!-- ===== step 2: place 2 -> edge1 full ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="132" font-size="10.5" fill="#4a7a3a">2</text>
    <rect x="60" y="118" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="136" fill="#b85450">2</text>
    <rect x="105" y="114" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="150" y="136" fill="#446688">2</text>
    <rect x="205" y="114" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="250" y="136" fill="#b85450">2</text>
    <text x="285" y="128" font-size="9" fill="#4a7a3a">=2✓</text>
    <rect x="305" y="114" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="350" y="136" font-size="10" fill="#bbb">空</text>
    <rect x="405" y="114" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="450" y="136" font-size="10" fill="#bbb">空</text>
  </g>

  <!-- ===== step 3: place 2 -> edge2 full ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="172" font-size="10.5" fill="#4a7a3a">3</text>
    <rect x="60" y="158" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="176" fill="#b85450">2</text>
    <rect x="105" y="154" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="150" y="176" fill="#446688">2</text>
    <rect x="205" y="154" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="250" y="176" fill="#446688">2</text>
    <rect x="305" y="154" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="350" y="176" fill="#b85450">2</text>
    <text x="385" y="168" font-size="9" fill="#4a7a3a">=2✓</text>
    <rect x="405" y="154" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="450" y="176" font-size="10" fill="#bbb">空</text>
  </g>

  <!-- ===== step 4: place 1 -> edge3 ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="212" font-size="10.5" fill="#4a7a3a">4</text>
    <rect x="60" y="198" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="216" fill="#b85450">1</text>
    <rect x="105" y="194" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="150" y="216" fill="#446688">2</text>
    <rect x="205" y="194" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="250" y="216" fill="#446688">2</text>
    <rect x="305" y="194" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="350" y="216" fill="#446688">2</text>
    <rect x="405" y="194" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="450" y="216" fill="#b85450">1</text>
    <text x="485" y="208" font-size="9" fill="#d6a040">余1</text>
  </g>

  <!-- ===== step 5: place 1 -> edge3 full -> done ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="252" font-size="10.5" fill="#4a7a3a">5</text>
    <rect x="60" y="238" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="256" fill="#b85450">1</text>
    <rect x="105" y="234" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="150" y="256" fill="#446688">2</text>
    <rect x="205" y="234" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="250" y="256" fill="#446688">2</text>
    <rect x="305" y="234" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="350" y="256" fill="#446688">2</text>
    <rect x="405" y="234" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="438" y="256" fill="#446688">1,</text>
    <text x="462" y="256" fill="#b85450">1</text>
    <text x="490" y="248" font-size="9" fill="#4a7a3a">=2✓</text>
  </g>

  <!-- ===== conclusion ===== -->
  <rect x="40" y="284" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 边全满：{2}, {2}, {2}, {1,1}，每边和 = 2 → true ✓</text>

  <!-- ===== failing example ===== -->
  <rect x="40" y="330" width="460" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="350" font-size="11.5" fill="#b85450" font-weight="bold">反例：[3,3,3,3,4]，total=16，target=4，降序 [4,3,3,3,3]</text>
  <text x="60" y="368" font-size="10.5" fill="#555">4 → 边0(满)；3 → 边1(余1)；3 → 边2(余1)；3 → 边3(余1)</text>
  <text x="60" y="384" font-size="10.5" fill="#555">第 5 根 3：边0满✗；边1: 1+3&gt;4✗；边2: 1+3&gt;4✗；边3: 1+3&gt;4✗</text>
  <text x="60" y="400" font-size="10.5" fill="#555">放边3失败且边3非空→回溯；所有回溯均失败 → 无解</text>
  <text x="60" y="416" font-size="11" fill="#b85450" font-weight="bold">→ false ✗（4 个余 1 的缝塞不进一根 3）</text>
</svg>
