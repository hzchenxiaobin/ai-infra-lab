<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：行序列化建索引，列序列化查索引 → 计数配对</text>

  <!-- Symbolic 3x3 grid, cell=44, x0=50, y0=68 -->
  <!-- Row 0: a b c -->
  <rect x="50" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="94" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="138" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="96" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <!-- Row 1: d e f -->
  <rect x="50" y="112" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="140" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <rect x="94" y="112" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="140" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <rect x="138" y="112" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="140" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">f</text>
  <!-- Row 2: g h i -->
  <rect x="50" y="156" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="184" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">g</text>
  <rect x="94" y="156" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="184" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">h</text>
  <rect x="138" y="156" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="184" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">i</text>

  <!-- Row labels -->
  <text x="40" y="96" text-anchor="end" font-size="11" fill="#888">R₀</text>
  <text x="40" y="140" text-anchor="end" font-size="11" fill="#888">R₁</text>
  <text x="40" y="184" text-anchor="end" font-size="11" fill="#888">R₂</text>
  <!-- Col labels -->
  <text x="72" y="60" text-anchor="middle" font-size="11" fill="#888">C₀</text>
  <text x="116" y="60" text-anchor="middle" font-size="11" fill="#888">C₁</text>
  <text x="160" y="60" text-anchor="middle" font-size="11" fill="#888">C₂</text>

  <!-- rowMap box -->
  <rect x="300" y="70" width="230" height="130" fill="#fff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="92" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">rowMap：行序列 → 出现次数</text>
  <line x1="312" y1="100" x2="518" y2="100" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="316" y="122" font-size="12" fill="#446688">(a, b, c)</text>
  <text x="500" y="122" text-anchor="end" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="316" y="146" font-size="12" fill="#d6a040">(d, e, f)</text>
  <text x="500" y="146" text-anchor="end" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="316" y="170" font-size="12" fill="#4a7a3a">(g, h, i)</text>
  <text x="500" y="170" text-anchor="end" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="316" y="192" font-size="10.5" fill="#999">（相同行合并计数，键域 ≤ n）</text>

  <!-- Arrow ①: grid rows -> rowMap (build index) -->
  <path d="M 182 110 C 230 110, 250 96, 296 100" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="236" y="92" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">① 逐行序列化 → 入表</text>

  <!-- Arrow ②: grid columns -> rowMap (query) -->
  <path d="M 116 204 C 116 250, 240 250, 300 190" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="262" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">② 逐列序列化 → 查表 → 累加 ans</text>

  <!-- Bottom reduction note -->
  <path d="M 40 296 L 520 296" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">归约：n² 次「行 vs 列两两比较」 ⇒ 2n 次序列化 + 哈希查询</text>
  <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#888">时间 O(n³) → O(n²)；行、列都是长度 n 的整数序列，序列化后「相等」即「键相同」</text>
</svg>
