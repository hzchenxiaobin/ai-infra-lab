<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 3, presses = 1 → 4 种不同状态</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">初始全亮 [●●●]；按 1 次某开关，4 个开关各产出一种状态（互不相同）</text>

  <!-- ===== row 0: initial ===== -->
  <g filter="url(#rough2)">
    <text x="60" y="86" font-size="11" fill="#888" font-weight="bold" text-anchor="middle">初始</text>
    <circle cx="130" cy="82" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="130" y="86" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">●</text>
    <circle cx="190" cy="82" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="190" y="86" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">●</text>
    <circle cx="250" cy="82" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="250" y="86" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">●</text>
    <text x="300" y="86" font-size="10" fill="#888">[1,1,1]</text>
  </g>

  <!-- arrows down to 4 outcomes -->
  <g filter="url(#rough2)">
    <path d="M 130 96 L 90 124" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 170 96 L 230 124" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 210 96 L 370 124" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 250 96 L 510 124" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- ===== 4 outcomes: each row a switch ===== -->
  <!-- Switch 1: flip all → [0,0,0] -->
  <g filter="url(#rough2)">
    <rect x="20" y="128" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="50" y="144" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">开关 1</text>
    <circle cx="130" cy="140" r="12" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <text x="130" y="144" text-anchor="middle" font-size="11" fill="#bbb" font-weight="bold">○</text>
    <circle cx="190" cy="140" r="12" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <text x="190" y="144" text-anchor="middle" font-size="11" fill="#bbb" font-weight="bold">○</text>
    <circle cx="250" cy="140" r="12" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <text x="250" y="144" text-anchor="middle" font-size="11" fill="#bbb" font-weight="bold">○</text>
    <text x="300" y="144" font-size="10" fill="#446688">[关,关,关]</text>
  </g>

  <!-- Switch 2: flip even (bulb 2) → [1,0,1] -->
  <g filter="url(#rough2)">
    <rect x="20" y="172" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="50" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">开关 2</text>
    <circle cx="130" cy="184" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="130" y="188" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">●</text>
    <circle cx="190" cy="184" r="12" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <text x="190" y="188" text-anchor="middle" font-size="11" fill="#bbb" font-weight="bold">○</text>
    <circle cx="250" cy="184" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="250" y="188" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">●</text>
    <text x="300" y="188" font-size="10" fill="#4a7a3a">[开,关,开]</text>
  </g>

  <!-- Switch 3: flip odd (bulbs 1,3) → [0,1,0] -->
  <g filter="url(#rough2)">
    <rect x="20" y="216" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="50" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">开关 3</text>
    <circle cx="130" cy="228" r="12" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <text x="130" y="232" text-anchor="middle" font-size="11" fill="#bbb" font-weight="bold">○</text>
    <circle cx="190" cy="228" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="190" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">●</text>
    <circle cx="250" cy="228" r="12" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <text x="250" y="232" text-anchor="middle" font-size="11" fill="#bbb" font-weight="bold">○</text>
    <text x="300" y="232" font-size="10" fill="#d6a040">[关,开,关]</text>
  </g>

  <!-- Switch 4: flip 3k+1 (bulb 1) → [0,1,1] -->
  <g filter="url(#rough2)">
    <rect x="20" y="260" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <text x="50" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">开关 4</text>
    <circle cx="130" cy="272" r="12" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <text x="130" y="276" text-anchor="middle" font-size="11" fill="#bbb" font-weight="bold">○</text>
    <circle cx="190" cy="272" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="190" y="276" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">●</text>
    <circle cx="250" cy="272" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="250" y="276" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">●</text>
    <text x="300" y="276" font-size="10" fill="#b85450">[关,开,开]</text>
  </g>

  <!-- ===== bottom conclusion ===== -->
  <rect x="40" y="300" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 种状态两两不同 → 答案 = 4</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#4a7a3a">与答案表 (n=3, presses=1) 一致 ✓ ｜ 单次按压天然满足「奇偶约束」，每个开关都贡献独立结果</text>
</svg>
