<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：强度只依赖「出现过的字符集合」——先去重，再按类别定价</text>

  <!-- 左面板：原字符串 -->
  <g filter="url(#rough2)">
    <rect x="20" y="40" width="230" height="216" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="135" y="62" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">password = "bbB11#"</text>

    <rect x="31" y="76" width="30" height="34" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="46" y="98" text-anchor="middle" font-size="14" fill="#333">b</text>
    <rect x="65" y="76" width="30" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="80" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>
    <rect x="99" y="76" width="30" height="34" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="114" y="98" text-anchor="middle" font-size="14" fill="#333">B</text>
    <rect x="133" y="76" width="30" height="34" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="148" y="98" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="167" y="76" width="30" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="182" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <rect x="201" y="76" width="30" height="34" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="216" y="98" text-anchor="middle" font-size="14" fill="#333">#</text>

    <text x="135" y="132" text-anchor="middle" font-size="10" fill="#8a3030">红格 = 重复出现：已计过，直接跳过</text>
    <text x="135" y="154" text-anchor="middle" font-size="10" fill="#2f5d24">每个字符最多贡献一次分数</text>
    <text x="135" y="180" text-anchor="middle" font-size="10" fill="#4a6b5a">n = 6 个字符，其中只有 4 个「不同」</text>
    <text x="135" y="210" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">set("bbB11#") = { b, B, 1, # }</text>
    <text x="135" y="234" text-anchor="middle" font-size="9.5" fill="#4a6b5a">次数、顺序全部丢弃，只留「谁出现过」</text>
  </g>

  <path d="M254,148 L286,148" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">去重</text>

  <!-- 右面板：类别单价表 -->
  <g filter="url(#rough2)">
    <rect x="292" y="40" width="248" height="216" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="416" y="62" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">类别单价（每个「不同」字符）</text>

    <rect x="306" y="76" width="18" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="334" y="92" font-size="11" fill="#333">小写 a–z</text>
    <text x="522" y="92" text-anchor="end" font-size="12" fill="#2f5d24" font-weight="bold">1 分</text>

    <rect x="306" y="108" width="18" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="334" y="124" font-size="11" fill="#333">大写 A–Z</text>
    <text x="522" y="124" text-anchor="end" font-size="12" fill="#33506b" font-weight="bold">2 分</text>

    <rect x="306" y="140" width="18" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="334" y="156" font-size="11" fill="#333">数字 0–9</text>
    <text x="522" y="156" text-anchor="end" font-size="12" fill="#8a6d1a" font-weight="bold">3 分</text>

    <rect x="306" y="172" width="18" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="334" y="188" font-size="11" fill="#333">特殊 !@#$</text>
    <text x="522" y="188" text-anchor="end" font-size="12" fill="#8a3030" font-weight="bold">5 分</text>

    <text x="416" y="218" text-anchor="middle" font-size="9.5" fill="#33506b">单价挂在「类别」上，与具体是哪个字符无关</text>
    <text x="416" y="240" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">答案 = Σ 单价 × 该类不同字符数</text>
  </g>

  <!-- 合计条 -->
  <g filter="url(#rough2)">
    <rect x="20" y="272" width="520" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="294" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">strength = 1×b + 2×B + 3×1 + 5×#</text>
    <text x="280" y="314" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">= 1 + 2 + 3 + 5 = 11 ✓（4 个不同字符各计一次）</text>
  </g>

  <!-- 警示条 -->
  <g filter="url(#rough2)">
    <rect x="20" y="336" width="520" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">⚠️ 强度是「出现集合」的函数：与出现次数、出现顺序均无关</text>
    <text x="280" y="378" text-anchor="middle" font-size="10" fill="#8a3030">字符域仅 26+26+10+4 = 66 个 ⇒ 去重集合大小封顶 66，判重空间 O(1)</text>
  </g>
</svg>
