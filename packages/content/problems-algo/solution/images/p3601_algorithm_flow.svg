<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟条件聚合 → 连接 → 原始值过滤 → 独立舍入 → 排序输出</text>

  <rect x="28" y="46" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① trips 表</text>
  <text x="130" y="79" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">trip_date · distance_km · fuel_consumed</text>

  <rect x="28" y="108" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 派生效率列</text>
  <text x="130" y="141" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">eff = distance_km / fuel_consumed</text>

  <rect x="28" y="170" width="204" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="187" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ CASE WHEN 分流</text>
  <text x="130" y="203" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">MONTH ≤ 6 → h1，MONTH ≥ 7 → h2（其余 NULL）</text>

  <rect x="28" y="232" width="204" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="249" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ GROUP BY driver_id</text>
  <text x="130" y="265" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">AVG(h1)、AVG(h2)（各忽略 NULL，一趟产出两列）</text>

  <rect x="28" y="294" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="311" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ JOIN drivers</text>
  <text x="130" y="327" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">补上 driver_name</text>

  <rect x="288" y="294" width="204" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="311" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑥ WHERE second − first &gt; 0</text>
  <text x="390" y="327" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">缺半年 → NULL → 不为真；≤ 0 → 剔除</text>

  <rect x="288" y="232" width="204" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="249" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑦ ROUND(x, 2) 三列独立</text>
  <text x="390" y="265" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">提升量由原始值相减后再舍入</text>

  <rect x="288" y="170" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="187" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑧ ORDER BY</text>
  <text x="390" y="203" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">提升量 DESC，姓名 ASC</text>

  <rect x="288" y="108" width="204" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="125" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑨ 输出结果</text>
  <text x="390" y="141" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5 列（improvement 是 2.10 不是 2.09）</text>

  <rect x="288" y="44" width="204" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="390" y="61" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⚠ 顺序敏感</text>
  <text x="390" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">先过滤（原始值）、后舍入（显示值）</text>

  <path d="M 130 88 L 130 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 150 L 130 166" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 212 L 130 228" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 274 L 130 290" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 234 315 L 284 315" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 390 292 L 390 278" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 230 L 390 216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 168 L 390 154" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每步只做一件事：算效率 → 分流 → 聚合 → 连接 → 过滤 → 舍入 → 排序</text>
</svg>
