<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：123456 与 9288 的最大化/最小化过程</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888">两趟独立贪心，各自扫描找目标数位后全量替换</text>

  <!-- ===== Example 3: num = 123456 ===== -->
  <rect x="30" y="56" width="600" height="250" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="78" font-size="12" fill="#446688" font-weight="bold">示例 3：num = 123456</text>

  <!-- Maximize a -->
  <text x="50" y="100" font-size="10" fill="#4a7a3a" font-weight="bold">最大化 a：扫描 1→非9，命中 d=1，替换所有 1 为 9</text>
  <g font-size="12">
    <rect x="50" y="108" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="69" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="90" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="109" y="128" text-anchor="middle" fill="#999">2</text>
    <rect x="130" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="149" y="128" text-anchor="middle" fill="#999">3</text>
    <rect x="170" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="189" y="128" text-anchor="middle" fill="#999">4</text>
    <rect x="210" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="229" y="128" text-anchor="middle" fill="#999">5</text>
    <rect x="250" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="269" y="128" text-anchor="middle" fill="#999">6</text>
  </g>
  <text x="69" y="152" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">命中!</text>
  <path d="M 296 123 L 332 123" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="314" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">1→9</text>
  <g font-size="12">
    <rect x="340" y="108" width="38" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="359" y="128" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="380" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="399" y="128" text-anchor="middle" fill="#999">2</text>
    <rect x="420" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="439" y="128" text-anchor="middle" fill="#999">3</text>
    <rect x="460" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="479" y="128" text-anchor="middle" fill="#999">4</text>
    <rect x="500" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="519" y="128" text-anchor="middle" fill="#999">5</text>
    <rect x="540" y="108" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="559" y="128" text-anchor="middle" fill="#999">6</text>
  </g>
  <text x="600" y="128" font-size="12" fill="#4a7a3a" font-weight="bold">a=923456</text>

  <!-- Minimize b -->
  <text x="50" y="170" font-size="10" fill="#b85450" font-weight="bold">最小化 b：首位=1 不动；从第2位起：2→&gt;1，命中 d=2，替换所有 2 为 0</text>
  <g font-size="12">
    <rect x="50" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="69" y="198" text-anchor="middle" fill="#999">1</text>
    <rect x="90" y="178" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="109" y="198" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="130" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="149" y="198" text-anchor="middle" fill="#999">3</text>
    <rect x="170" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="189" y="198" text-anchor="middle" fill="#999">4</text>
    <rect x="210" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="229" y="198" text-anchor="middle" fill="#999">5</text>
    <rect x="250" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="269" y="198" text-anchor="middle" fill="#999">6</text>
  </g>
  <text x="69" y="222" text-anchor="middle" font-size="9" fill="#999">跳过</text>
  <text x="109" y="222" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">命中!</text>
  <path d="M 296 193 L 332 193" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="314" y="186" text-anchor="middle" font-size="9" fill="#b85450">2→0</text>
  <g font-size="12">
    <rect x="340" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="359" y="198" text-anchor="middle" fill="#999">1</text>
    <rect x="380" y="178" width="38" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="399" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="420" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="439" y="198" text-anchor="middle" fill="#999">3</text>
    <rect x="460" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="479" y="198" text-anchor="middle" fill="#999">4</text>
    <rect x="500" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="519" y="198" text-anchor="middle" fill="#999">5</text>
    <rect x="540" y="178" width="38" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="559" y="198" text-anchor="middle" fill="#999">6</text>
  </g>
  <text x="600" y="198" font-size="12" fill="#b85450" font-weight="bold">b=103456</text>

  <!-- diff -->
  <rect x="180" y="240" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="263" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">差值 = 923456 − 103456 = 820000</text>

  <!-- ===== Example 5: num = 9288 ===== -->
  <rect x="30" y="318" width="600" height="250" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="340" font-size="12" fill="#b85450" font-weight="bold">示例 5：num = 9288</text>

  <!-- Maximize a -->
  <text x="50" y="362" font-size="10" fill="#4a7a3a" font-weight="bold">最大化 a：扫描 9→跳过，2→非9，命中 d=2，替换所有 2 为 9</text>
  <g font-size="12">
    <rect x="50" y="370" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="72" y="390" text-anchor="middle" fill="#999">9</text>
    <rect x="98" y="370" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="120" y="390" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="146" y="370" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="168" y="390" text-anchor="middle" fill="#999">8</text>
    <rect x="194" y="370" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="216" y="390" text-anchor="middle" fill="#999">8</text>
  </g>
  <text x="72" y="414" text-anchor="middle" font-size="9" fill="#999">跳过</text>
  <text x="120" y="414" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">命中!</text>
  <path d="M 246 385 L 282 385" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="264" y="378" text-anchor="middle" font-size="9" fill="#4a7a3a">2→9</text>
  <g font-size="12">
    <rect x="290" y="370" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="312" y="390" text-anchor="middle" fill="#999">9</text>
    <rect x="338" y="370" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="360" y="390" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="386" y="370" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="408" y="390" text-anchor="middle" fill="#999">8</text>
    <rect x="434" y="370" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="456" y="390" text-anchor="middle" fill="#999">8</text>
  </g>
  <text x="500" y="390" font-size="12" fill="#4a7a3a" font-weight="bold">a=9988</text>

  <!-- Minimize b -->
  <text x="50" y="432" font-size="10" fill="#b85450" font-weight="bold">最小化 b：首位=9≠1，命中 d=9，替换所有 9 为 1</text>
  <g font-size="12">
    <rect x="50" y="440" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="72" y="460" text-anchor="middle" fill="#d6a040" font-weight="bold">9</text>
    <rect x="98" y="440" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="120" y="460" text-anchor="middle" fill="#999">2</text>
    <rect x="146" y="440" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="168" y="460" text-anchor="middle" fill="#999">8</text>
    <rect x="194" y="440" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="216" y="460" text-anchor="middle" fill="#999">8</text>
  </g>
  <text x="72" y="484" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">命中!</text>
  <path d="M 246 455 L 282 455" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="264" y="448" text-anchor="middle" font-size="9" fill="#b85450">9→1</text>
  <g font-size="12">
    <rect x="290" y="440" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="312" y="460" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="338" y="440" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="360" y="460" text-anchor="middle" fill="#999">2</text>
    <rect x="386" y="440" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="408" y="460" text-anchor="middle" fill="#999">8</text>
    <rect x="434" y="440" width="44" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="456" y="460" text-anchor="middle" fill="#999">8</text>
  </g>
  <text x="500" y="460" font-size="12" fill="#b85450" font-weight="bold">b=1288</text>

  <!-- diff -->
  <rect x="180" y="502" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="525" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">差值 = 9988 − 1288 = 8700</text>

  <!-- ===== Summary table ===== -->
  <text x="40" y="588" font-size="11" fill="#446688" font-weight="bold">汇总：</text>
  <g font-size="10" filter="url(#rough2)">
    <rect x="90" y="578" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="125" y="593" text-anchor="middle" fill="#333" font-weight="bold">num</text>
    <rect x="160" y="578" width="70" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="195" y="593" text-anchor="middle" fill="#333" font-weight="bold">a (最大)</text>
    <rect x="230" y="578" width="70" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="265" y="593" text-anchor="middle" fill="#333" font-weight="bold">b (最小)</text>
    <rect x="300" y="578" width="70" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="335" y="593" text-anchor="middle" fill="#333" font-weight="bold">差值</text>

    <rect x="90" y="600" width="70" height="16" rx="2" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="125" y="612" text-anchor="middle" fill="#333">123456</text>
    <rect x="160" y="600" width="70" height="16" rx="2" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="195" y="612" text-anchor="middle" fill="#333">923456</text>
    <rect x="230" y="600" width="70" height="16" rx="2" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="265" y="612" text-anchor="middle" fill="#333">103456</text>
    <rect x="300" y="600" width="70" height="16" rx="2" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="335" y="612" text-anchor="middle" fill="#333">820000</text>
  </g>
  <text x="400" y="612" font-size="10" fill="#888">9288: a=9988, b=1288, 差值=8700</text>
</svg>
