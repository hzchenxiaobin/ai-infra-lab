<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    示例演算：flowers = [1,2,3,1,2]
  </text>

  <!-- ===== flowers array ===== -->
  <text x="40" y="56" font-size="11" fill="#888" filter="url(#rough2)">flowers:</text>
  <rect x="100" y="42" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="42" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="196" y="42" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="244" y="42" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="292" y="42" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <text x="123" y="84" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="171" y="84" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1</text>
  <text x="219" y="84" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">2</text>
  <text x="267" y="84" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">3</text>
  <text x="315" y="84" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">4</text>

  <!-- ===== Table header ===== -->
  <rect x="40" y="98" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="114" text-anchor="middle" font-size="10" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="82" y="98" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="102" y="114" text-anchor="middle" font-size="10" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">v</text>
  <rect x="124" y="98" width="230" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="239" y="114" text-anchor="middle" font-size="10" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">操作 / 计算</text>
  <rect x="356" y="98" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="391" y="114" text-anchor="middle" font-size="10" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">beauty</text>
  <rect x="428" y="98" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="474" y="114" text-anchor="middle" font-size="10" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- ===== Row i=0 ===== -->
  <rect x="40" y="124" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="82" y="124" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="102" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="124" width="230" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="239" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">首次 → d[1]=0</text>
  <rect x="356" y="124" width="70" height="28" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="143" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="428" y="124" width="92" height="28" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="474" y="143" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">−∞</text>

  <!-- ===== Row i=1 ===== -->
  <rect x="40" y="154" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="82" y="154" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="102" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="124" y="154" width="230" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="239" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">首次 → d[2]=1</text>
  <rect x="356" y="154" width="70" height="28" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="173" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="428" y="154" width="92" height="28" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="474" y="173" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">−∞</text>

  <!-- ===== Row i=2 ===== -->
  <rect x="40" y="184" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="82" y="184" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="102" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="124" y="184" width="230" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="239" y="203" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">首次 → d[3]=2</text>
  <rect x="356" y="184" width="70" height="28" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="203" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="428" y="184" width="92" height="28" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="474" y="203" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">−∞</text>

  <!-- ===== Row i=3 (hit!) ===== -->
  <rect x="40" y="214" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="233" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="82" y="214" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="102" y="233" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="214" width="230" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="239" y="233" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">s[3]−s[d[1]+1]+2 = 6−1+2</text>
  <rect x="356" y="214" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="391" y="233" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="428" y="214" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="474" y="233" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- ===== Row i=4 (hit! best) ===== -->
  <rect x="40" y="244" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="263" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="82" y="244" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="102" y="263" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="124" y="244" width="230" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="239" y="263" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">s[4]−s[d[2]+1]+4 = 7−3+4</text>
  <rect x="356" y="244" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="391" y="263" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="428" y="244" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="474" y="263" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- ===== prefix sum array ===== -->
  <text x="40" y="298" font-size="11" fill="#888" filter="url(#rough2)">前缀和 s（仅累加正数）：</text>

  <text x="50" y="324" font-size="9" fill="#888" filter="url(#rough2)">s:</text>
  <rect x="74" y="310" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="327" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="118" y="310" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="139" y="327" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="162" y="310" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="327" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="206" y="310" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="227" y="327" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <rect x="250" y="310" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="271" y="327" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <rect x="294" y="310" width="42" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="327" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>

  <text x="95" y="346" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[0]</text>
  <text x="139" y="346" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[1]</text>
  <text x="183" y="346" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[2]</text>
  <text x="227" y="346" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[3]</text>
  <text x="271" y="346" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[4]</text>
  <text x="315" y="346" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">s[5]</text>

  <!-- ===== highlight s used in best answer ===== -->
  <rect x="160" y="306" width="136" height="46" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="360" y="330" font-size="10" fill="#b85450" filter="url(#rough2)">最优：s[4]−s[2] = 7−3</text>
  <text x="360" y="346" font-size="10" fill="#b85450" filter="url(#rough2)">+ 2·v = +4  →  8</text>

  <!-- ===== answer box ===== -->
  <rect x="40" y="372" width="480" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">
    最优花园：flowers[1..4] = [2, 3, 1, 2]
  </text>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    首尾 2 + 中间正数(3,1) + 2 = 2+3+1+2
  </text>
  <text x="280" y="432" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    答案 = 8
  </text>
</svg>
