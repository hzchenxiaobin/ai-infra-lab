<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描分块 —— 块内求「范围和 − 范围最小」</text>

  <ellipse cx="95" cy="42" rx="54" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="46" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">i = 0, ans = 0</text>

  <path d="M 95 55 L 96 91" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="150,72 203,97 150,122 97,97" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="101" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 203 97 L 249 97" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="224" y="90" text-anchor="middle" font-size="9.5" fill="#55688a" filter="url(#rough2)">否</text>
  <rect x="251" y="81" width="140" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="321" y="101" text-anchor="middle" font-size="11.5" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <path d="M 150 122 L 150 138" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="159" y="134" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <polygon points="150,140 210,165 150,190 90,165" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="169" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">s[i] = '1' ?</text>

  <path d="M 210 165 L 249 165" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="228" y="158" text-anchor="middle" font-size="9.5" fill="#55688a" filter="url(#rough2)">否</text>
  <rect x="251" y="148" width="92" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="297" y="168" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">i ← i + 1</text>

  <path d="M 150 190 L 150 204" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="159" y="201" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="62" y="206" width="176" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="225" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">扩展出极大 1 块 [i, j]</text>

  <path d="M 150 236 L 150 250" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="150,252 198,277 150,302 102,277" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="281" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">i == 0 ?</text>

  <path d="M 198 277 L 234 277" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="214" y="270" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="236" y="260" width="192" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="332" y="280" text-anchor="middle" font-size="10" fill="#3a6a2a" filter="url(#rough2)">ans += sum(nums[0..j])</text>

  <path d="M 150 302 L 150 314" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="159" y="311" font-size="9.5" fill="#55688a" filter="url(#rough2)">否</text>

  <rect x="55" y="316" width="195" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="333" text-anchor="middle" font-size="10" fill="#33507a" filter="url(#rough2)">ans += sum(nums[i−1..j])</text>
  <text x="152" y="347" text-anchor="middle" font-size="10" fill="#33507a" filter="url(#rough2)">− min(nums[i−1..j])</text>

  <path d="M 250 337 L 300 337" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="302" y="321" width="100" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="341" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">i ← j + 1</text>

  <path d="M 285 292 L 285 332" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <circle cx="285" cy="337" r="2.5" fill="#446688" filter="url(#rough2)"/>

  <path d="M 343 164 L 452 164" fill="none" stroke="#778899" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <circle cx="452" cy="164" r="2.5" fill="#778899" filter="url(#rough2)"/>

  <path d="M 402 337 L 452 337 L 452 66 L 150 66 L 150 70" fill="none" stroke="#778899" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="250" y="200" width="195" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="347" y="218" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">块内一趟同步维护 sum 与 min</text>
  <text x="347" y="234" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">O(n) 时间 · O(1) 额外空间</text>
</svg>
