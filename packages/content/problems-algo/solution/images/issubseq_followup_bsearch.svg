<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">进阶：预处理字符下标 + 二分查找（批量查询）</text>

  <!-- Part 1: preprocessing -->
  <text x="20" y="58" font-size="12" fill="#888">① 预处理 t = "ahbgdc"：</text>

  <!-- t cells with chars -->
  <rect x="40" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="87" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="100" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="87" text-anchor="middle" font-size="12" fill="#333">h</text>
  <rect x="160" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="87" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="220" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="87" text-anchor="middle" font-size="12" fill="#333">g</text>
  <rect x="280" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="87" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="340" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="87" text-anchor="middle" font-size="12" fill="#333">c</text>

  <!-- t index labels -->
  <text x="68" y="112" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="128" y="112" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="188" y="112" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="248" y="112" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="308" y="112" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="368" y="112" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- arrow down to pos map -->
  <path d="M 270 122 L 270 134" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- pos map entries -->
  <text x="20" y="154" font-size="11" fill="#888">pos:</text>
  <rect x="50" y="138" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="110" y="155" text-anchor="middle" font-size="11" fill="#333">a → [0]</text>
  <rect x="180" y="138" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="155" text-anchor="middle" font-size="11" fill="#333">b → [2]</text>
  <rect x="310" y="138" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="370" y="155" text-anchor="middle" font-size="11" fill="#333">c → [5]</text>
  <rect x="440" y="138" width="80" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="155" text-anchor="middle" font-size="10" fill="#999">其余 …</text>

  <!-- Part 2: query trace -->
  <text x="20" y="192" font-size="12" fill="#888">② 查询 s = "abc"：</text>

  <!-- Step 1 -->
  <rect x="40" y="202" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="220" font-size="11" fill="#333" font-weight="bold">s[0]='a'</text>
  <text x="50" y="236" font-size="10" fill="#555">pre=−1</text>
  <text x="115" y="220" font-size="10" fill="#555">upper_bound</text>
  <text x="115" y="236" font-size="10" fill="#555">([0], −1)→0</text>
  <text x="50" y="250" font-size="10" fill="#4a7a3a" font-weight="bold">pre=0 ✓</text>

  <path d="M 190 227 L 205 227" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="210" y="202" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="220" y="220" font-size="11" fill="#333" font-weight="bold">s[1]='b'</text>
  <text x="220" y="236" font-size="10" fill="#555">pre=0</text>
  <text x="285" y="220" font-size="10" fill="#555">upper_bound</text>
  <text x="285" y="236" font-size="10" fill="#555">([2], 0)→2</text>
  <text x="220" y="250" font-size="10" fill="#4a7a3a" font-weight="bold">pre=2 ✓</text>

  <path d="M 360 227 L 375 227" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="380" y="202" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="390" y="220" font-size="11" fill="#333" font-weight="bold">s[2]='c'</text>
  <text x="390" y="236" font-size="10" fill="#555">pre=2</text>
  <text x="455" y="220" font-size="10" fill="#555">upper_bound</text>
  <text x="455" y="236" font-size="10" fill="#555">([5], 2)→5</text>
  <text x="390" y="250" font-size="10" fill="#4a7a3a" font-weight="bold">pre=5 ✓</text>

  <!-- result -->
  <rect x="40" y="264" width="490" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="283" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">全部找到 → true</text>

  <!-- complexity box -->
  <rect x="40" y="302" width="490" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">复杂度对比</text>
  <text x="55" y="344" font-size="11" fill="#555">预处理 O(|t|)；每次查询 O(|s| log |t|)（二分代替线性扫 t）</text>
  <text x="55" y="362" font-size="11" fill="#555">k 次查询：O(|t| + k·|s|·log|t|) ≪ 双指针的 O(k·|t|)</text>
  <text x="55" y="378" font-size="10" fill="#888">前提：t 固定不变，可反复复用预处理的 pos 表</text>
</svg>
