<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：matrix = [[0,0,1],[1,1,1],[1,0,1]]
  </text>

  <!-- column group labels -->
  <text x="135" y="52" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">matrix 行 / sorted</text>
  <text x="315" y="52" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">heights / 面积</text>
  <text x="450" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">本行最大</text>

  <!-- ============ Row 0 block (base 70) ============ -->
  <!-- line1: matrix -> heights -->
  <text x="30" y="88" font-size="11" fill="#333" filter="url(#rough2)">第 0 行</text>
  <rect x="120" y="70" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="153" y="70" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="186" y="70" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="201" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="88" font-size="12" fill="#888" filter="url(#rough2)">→</text>
  <text x="262" y="88" font-size="10" fill="#888" filter="url(#rough2)">h=</text>
  <rect x="300" y="70" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="315" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="333" y="70" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="348" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="366" y="70" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="381" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- line2: sorted -> areas -> max -->
  <text x="30" y="122" font-size="10" fill="#4a7a3a" filter="url(#rough2)">排序↓</text>
  <rect x="120" y="104" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="153" y="104" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="122" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">×</text>
  <rect x="186" y="104" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="201" y="122" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">×</text>
  <text x="240" y="122" font-size="10" fill="#888" filter="url(#rough2)">面积</text>
  <rect x="300" y="104" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="333" y="104" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="348" y="122" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">break</text>
  <rect x="366" y="104" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="381" y="122" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">break</text>
  <text x="412" y="122" font-size="10" fill="#888" filter="url(#rough2)">max</text>
  <rect x="438" y="104" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="122" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- separator -->
  <line x1="20" y1="146" x2="540" y2="146" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ============ Row 1 block (base 170) ============ -->
  <text x="30" y="188" font-size="11" fill="#333" filter="url(#rough2)">第 1 行</text>
  <rect x="120" y="170" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="153" y="170" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="170" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="201" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="188" font-size="12" fill="#888" filter="url(#rough2)">→</text>
  <text x="262" y="188" font-size="10" fill="#888" filter="url(#rough2)">h=</text>
  <rect x="300" y="170" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="315" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="333" y="170" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="348" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="366" y="170" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="381" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="30" y="222" font-size="10" fill="#4a7a3a" filter="url(#rough2)">排序↓</text>
  <rect x="120" y="204" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="153" y="204" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="204" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="201" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="222" font-size="10" fill="#888" filter="url(#rough2)">面积</text>
  <rect x="300" y="204" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="333" y="204" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="348" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="366" y="204" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="381" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="412" y="222" font-size="10" fill="#888" filter="url(#rough2)">max</text>
  <rect x="438" y="204" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="222" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>

  <line x1="20" y1="246" x2="540" y2="246" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ============ Row 2 block (base 270) ============ -->
  <text x="30" y="288" font-size="11" fill="#333" filter="url(#rough2)">第 2 行</text>
  <rect x="120" y="270" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="153" y="270" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="186" y="270" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="201" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="288" font-size="12" fill="#888" filter="url(#rough2)">→</text>
  <text x="262" y="288" font-size="10" fill="#888" filter="url(#rough2)">h=</text>
  <rect x="300" y="270" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="315" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="333" y="270" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="348" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="366" y="270" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="381" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="30" y="322" font-size="10" fill="#4a7a3a" filter="url(#rough2)">排序↓</text>
  <rect x="120" y="304" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="153" y="304" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="186" y="304" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="201" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">×</text>
  <text x="240" y="322" font-size="10" fill="#888" filter="url(#rough2)">面积</text>
  <rect x="300" y="304" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="333" y="304" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="348" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="366" y="304" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="381" y="322" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">break</text>
  <text x="412" y="322" font-size="10" fill="#888" filter="url(#rough2)">max</text>
  <rect x="438" y="304" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="322" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- annotation: why 2x2=4 -->
  <path d="M348,304 L348,288 L300,288" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="316" y="280" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">h=2 × 宽2 = 4</text>

  <!-- ===== Final answer ===== -->
  <rect x="120" y="370" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    全局 max = max(1, 3, 4)
  </text>
  <text x="280" y="410" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    最终答案：4 ✓
  </text>
  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    蓝=matrix / 绿=1 / 橙=heights / 粉=面积 / 粗框=本行最大
  </text>
</svg>
