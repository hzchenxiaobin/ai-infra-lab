<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：交叉相乘定序 + 固定左端点 O(1) 递推</text>
    <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">示例 1：nums = [1,2,1,2]，a = 3，b = 2；考察窗口 nums[0..2] = [1,2,1]</text>

    <!-- left: array with window -->
    <text x="40" y="70" text-anchor="start" font-size="11" fill="#446688" font-weight="bold">数组：奇 = 橙，偶 = 蓝</text>

    <rect x="40" y="78" width="58" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="69" y="104" text-anchor="middle" font-size="14" fill="#7a5c1a" font-weight="bold">1</text>
    <text x="69" y="118" text-anchor="middle" font-size="8" fill="#a87020">奇</text>

    <rect x="102" y="78" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="131" y="104" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">2</text>
    <text x="131" y="118" text-anchor="middle" font-size="8" fill="#446688">偶</text>

    <rect x="164" y="78" width="58" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="193" y="104" text-anchor="middle" font-size="14" fill="#7a5c1a" font-weight="bold">1</text>
    <text x="193" y="118" text-anchor="middle" font-size="8" fill="#a87020">奇</text>

    <rect x="226" y="78" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="255" y="104" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">2</text>
    <text x="255" y="118" text-anchor="middle" font-size="8" fill="#446688">偶</text>

    <text x="69" y="138" text-anchor="middle" font-size="9" fill="#889">0</text>
    <text x="131" y="138" text-anchor="middle" font-size="9" fill="#889">1</text>
    <text x="193" y="138" text-anchor="middle" font-size="9" fill="#889">2</text>
    <text x="255" y="138" text-anchor="middle" font-size="9" fill="#889">3</text>

    <rect x="33" y="71" width="196" height="60" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7,5" rx="10"/>
    <text x="131" y="64" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">窗口（子数组）[1,2,1]</text>

    <path d="M 255 130 V 146" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none"/>
    <text x="40" y="162" text-anchor="start" font-size="8.5" fill="#555">r 每右移一格并入一个新元素，x 与 y 恰好一个 +1</text>
    <text x="40" y="176" text-anchor="start" font-size="8.5" fill="#a87020">（例：再并入 nums[3] = 2 是偶数 ⇒ x ← 2，y 不变）</text>

    <rect x="40" y="192" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="115" y="214" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">x = 1（偶数个数）</text>
    <rect x="210" y="192" width="150" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="285" y="214" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">y = 2（奇数个数）</text>

    <rect x="40" y="246" width="320" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="200" y="266" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">代入整数判据：b·x ≤ a·y ？</text>
    <text x="200" y="284" text-anchor="middle" font-size="9.5" fill="#2f5d24">y = 2 &gt; 0 ✓；b·x = 2·1 = 2 ≤ a·y = 3·2 = 6 ✓</text>
    <text x="200" y="302" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">⇒ [1,2,1] 有效，计入答案</text>

    <!-- right: cross-multiply box -->
    <rect x="380" y="56" width="210" height="194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="485" y="78" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold">比较的等价变形</text>

    <text x="425" y="102" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">x</text>
    <path d="M 408 109 H 442" stroke="#555" stroke-width="1.5"/>
    <text x="425" y="130" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">y</text>

    <text x="463" y="118" text-anchor="middle" font-size="14" fill="#555">≤</text>

    <text x="502" y="102" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">a</text>
    <path d="M 485 109 H 519" stroke="#555" stroke-width="1.5"/>
    <text x="502" y="130" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">b</text>

    <text x="485" y="150" text-anchor="middle" font-size="8.5" fill="#7a5c1a">y &gt; 0、b &gt; 0 ⇒ 同乘 b·y 不变号</text>
    <path d="M 485 158 V 172" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none"/>
    <text x="485" y="196" text-anchor="middle" font-size="14" font-weight="bold"><tspan fill="#2f5d24">b</tspan><tspan fill="#555">·</tspan><tspan fill="#33506b">x</tspan><tspan fill="#555"> ≤ </tspan><tspan fill="#2f5d24">a</tspan><tspan fill="#555">·</tspan><tspan fill="#a87020">y</tspan></text>
    <text x="485" y="216" text-anchor="middle" font-size="8.5" fill="#7a5c1a">精确有理数比较 → 纯整数乘法</text>
    <text x="485" y="232" text-anchor="middle" font-size="8.5" fill="#7a5c1a">本题乘积 ≤ 10⁶，int 精确无舍入</text>

    <!-- bottom takeaway -->
    <rect x="40" y="326" width="550" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="315" y="346" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">要点小结</text>
    <text x="58" y="366" text-anchor="start" font-size="9" fill="#33506b">① 交叉相乘：x/y ≤ a/b ⟺ b·x ≤ a·y，天然规避浮点舍入（题目要求按精确有理数比较）</text>
    <text x="58" y="384" text-anchor="start" font-size="9" fill="#33506b">② 全偶窗口 y = 0：b·x ≥ 1 &gt; 0 = a·y，判据自动为假——条件 y &gt; 0 其实可省</text>
    <text x="58" y="402" text-anchor="start" font-size="9" fill="#33506b">③ 固定左端点扫右端点：每步一次归类 + 一次比较 ⇒ 单窗口 O(1)，总计 O(n²)</text>
  </g>
</svg>
