<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="436" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：固定数字和，平方和「越悬殊越大」⟹ 尽量凑 9</text>

  <!-- 面板一：交换论证 -->
  <rect x="20" y="38" width="520" height="137" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="60" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 交换论证：把 1 从小数字挪给大数字</text>

  <!-- 左组：(5,3) -->
  <rect x="70" y="82" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="112" y="82" width="32" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="103" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">5</text>
  <text x="128" y="103" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">3</text>
  <path d="M 118 80 C 110 66, 82 66, 74 80" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="96" y="78" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">挪 1</text>
  <text x="96" y="132" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">5²+3² = 34</text>

  <!-- 中间大箭头 -->
  <path d="M 158 98 L 182 98" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右组：(6,2) -->
  <rect x="190" y="82" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="232" y="82" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="103" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="248" y="103" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="268" y="102" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">+6↑</text>
  <text x="223" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6²+2² = 40</text>

  <!-- 右侧公式 -->
  <text x="320" y="78" font-size="10.5" fill="#33506b" filter="url(#rough2)">(a+1)² + (b−1)²</text>
  <text x="320" y="97" font-size="10.5" fill="#33506b" filter="url(#rough2)">= a² + b² + 2(a−b) + 2</text>
  <text x="320" y="116" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">&gt; a² + b² （a ≥ b）</text>
  <text x="320" y="138" font-size="10" fill="#33506b" filter="url(#rough2)">数字和不变，平方和严格变大</text>
  <text x="320" y="158" font-size="10" fill="#33506b" filter="url(#rough2)">⟹ 最优解中不存在这样的对</text>

  <!-- 面板二：对比赛跑 -->
  <rect x="20" y="187" width="520" height="138" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="209" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 数字和固定为 17（4 位数）：悬殊完胜</text>

  <text x="40" y="252" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">悬殊</text>
  <rect x="84" y="230" width="32" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="122" y="230" width="32" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="230" width="32" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="198" y="230" width="32" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="251" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">9</text>
  <text x="138" y="251" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">8</text>
  <text x="176" y="251" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <text x="214" y="251" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <text x="252" y="251" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">81 + 64 = 145</text>
  <text x="356" y="251" font-size="10" fill="#b85450" filter="url(#rough2)">最大分!</text>

  <text x="40" y="300" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">均匀</text>
  <rect x="84" y="278" width="32" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="122" y="278" width="32" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="278" width="32" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="198" y="278" width="32" height="32" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="299" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <text x="138" y="299" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <text x="176" y="299" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <text x="214" y="299" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <text x="252" y="299" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">25 + 16×3 = 73</text>

  <text x="400" y="237" font-size="10" fill="#8a6d1f" filter="url(#rough2)">同样和 17：</text>
  <text x="400" y="257" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">145 ≫ 73</text>
  <text x="400" y="277" font-size="10" fill="#8a6d1f" filter="url(#rough2)">⟹ 至多一个数字在</text>
  <text x="400" y="297" font-size="10" fill="#8a6d1f" filter="url(#rough2)">1~8，其余非 9 即 0</text>

  <!-- 面板三：最优形态 -->
  <rect x="20" y="337" width="520" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="359" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 最优多重集唯一 ⟹ 降序排列即答案</text>

  <rect x="56" y="373" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="90" y="373" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="124" y="373" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="158" y="373" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="192" y="373" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="373" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="373" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="393" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">9</text>
  <text x="105" y="393" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">9</text>
  <text x="139" y="393" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">9</text>
  <text x="173" y="393" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">r</text>
  <text x="207" y="393" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="241" y="393" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="275" y="393" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <text x="105" y="416" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">k 个 9</text>
  <text x="173" y="416" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">余数位 r</text>
  <text x="241" y="416" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">补 0</text>

  <text x="340" y="389" font-size="10" fill="#b85450" filter="url(#rough2)">降序 ⇒ 同分中数值最大</text>
  <text x="340" y="407" font-size="10" fill="#b85450" filter="url(#rough2)">首位非零 ⇒ 恰好 num 位</text>
</svg>
