<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：每个起点 i 的有效子数组数 = 到「下一个更小元素」的距离</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">nums = [1, 4, 2, 5, 3]，左端不大于子数组内任何元素</text>

  <!-- ===== Array ===== -->
  <text x="30" y="76" font-size="11" fill="#446688" font-weight="bold">nums[]</text>
  <g font-size="11">
    <rect x="60" y="84" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="84" y="107" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="84" y="78" text-anchor="middle" font-size="8" fill="#888">[0]</text>

    <rect x="112" y="84" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="136" y="107" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <text x="136" y="78" text-anchor="middle" font-size="8" fill="#888">[1]</text>

    <rect x="164" y="84" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="188" y="107" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="188" y="78" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">[2] ← 2 &lt; 4</text>

    <rect x="216" y="84" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="240" y="107" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <text x="240" y="78" text-anchor="middle" font-size="8" fill="#888">[3]</text>

    <rect x="268" y="84" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="292" y="107" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="292" y="78" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">[4] ← 3 &lt; 5</text>
  </g>

  <!-- ===== Per-index analysis ===== -->
  <text x="30" y="146" font-size="11" fill="#d6a040" font-weight="bold">逐起点分析：起点 i → 找右侧首个更小元素 → 有效子数组数</text>

  <!-- i=0 -->
  <rect x="30" y="156" width="470" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="174" font-size="10" fill="#555">i=0, nums[0]=1：右侧无更小 → 计数 = n−0 = 5</text>
  <text x="330" y="174" font-size="9" fill="#4a7a3a">[1],[1,4],[1,4,2],[1,4,2,5],[1,4,2,5,3]</text>

  <!-- i=1 -->
  <rect x="30" y="188" width="470" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="206" font-size="10" fill="#555">i=1, nums[1]=4：next smaller = [2](值2) → 计数 = 2−1 = 1</text>
  <text x="330" y="206" font-size="9" fill="#d6a040">[4]</text>

  <!-- i=2 -->
  <rect x="30" y="220" width="470" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="238" font-size="10" fill="#555">i=2, nums[2]=2：右侧无更小 → 计数 = n−2 = 3</text>
  <text x="330" y="238" font-size="9" fill="#4a7a3a">[2],[2,5],[2,5,3]</text>

  <!-- i=3 -->
  <rect x="30" y="252" width="470" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="270" font-size="10" fill="#555">i=3, nums[3]=5：next smaller = [4](值3) → 计数 = 4−3 = 1</text>
  <text x="330" y="270" font-size="9" fill="#d6a040">[5]</text>

  <!-- i=4 -->
  <rect x="30" y="284" width="470" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="302" font-size="10" fill="#555">i=4, nums[4]=3：右侧无更小 → 计数 = n−4 = 1</text>
  <text x="330" y="302" font-size="9" fill="#4a7a3a">[3]</text>

  <!-- arrow from i=1 to i=2 (next smaller) -->
  <path d="M 136 120 Q 160 140 188 120" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 240 120 Q 256 140 292 120" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Summary ===== -->
  <rect x="30" y="324" width="470" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">转化：求「右侧下一个更小元素」→ 单调递增栈</text>
  <text x="50" y="362" font-size="10" fill="#555">count[i] = nextSmaller[i] − i（若无则为 n − i），答案 = Σ count[i]</text>
  <text x="50" y="378" font-size="10" fill="#4a7a3a" font-weight="bold">总计 = 5 + 1 + 3 + 1 + 1 = 11 ✓</text>
</svg>
