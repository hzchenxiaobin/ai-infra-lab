<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：只数战舰的「头」（左上端点）</text>

  <!-- Column labels -->
  <text x="85" y="56" text-anchor="middle" font-size="10" fill="#aaa">j=0</text>
  <text x="135" y="56" text-anchor="middle" font-size="10" fill="#aaa">j=1</text>
  <text x="185" y="56" text-anchor="middle" font-size="10" fill="#aaa">j=2</text>
  <text x="235" y="56" text-anchor="middle" font-size="10" fill="#aaa">j=3</text>
  <!-- Row labels -->
  <text x="46" y="100" text-anchor="middle" font-size="10" fill="#aaa">i=0</text>
  <text x="46" y="150" text-anchor="middle" font-size="10" fill="#aaa">i=1</text>
  <text x="46" y="200" text-anchor="middle" font-size="10" fill="#aaa">i=2</text>

  <!-- ===== Row 0 ===== -->
  <!-- (0,0) X head -->
  <rect x="60" y="70" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="104" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">X</text>
  <!-- (0,1) . -->
  <rect x="110" y="70" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="104" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <!-- (0,2) . -->
  <rect x="160" y="70" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="104" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <!-- (0,3) X head -->
  <rect x="210" y="70" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="104" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">X</text>

  <!-- ===== Row 1 ===== -->
  <!-- (1,0) . -->
  <rect x="60" y="120" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="154" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <!-- (1,1) . -->
  <rect x="110" y="120" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="154" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <!-- (1,2) . -->
  <rect x="160" y="120" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="154" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <!-- (1,3) X non-head -->
  <rect x="210" y="120" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235" y="154" text-anchor="middle" font-size="20" fill="#b85450">X</text>
  <!-- arrow from above showing continuation -->
  <path d="M 235 122 L 235 118" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2 ===== -->
  <!-- (2,0) . -->
  <rect x="60" y="170" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="204" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <!-- (2,1) . -->
  <rect x="110" y="170" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="204" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <!-- (2,2) . -->
  <rect x="160" y="170" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="204" text-anchor="middle" font-size="18" fill="#ccc">.</text>
  <!-- (2,3) X non-head -->
  <rect x="210" y="170" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235" y="204" text-anchor="middle" font-size="20" fill="#b85450">X</text>
  <path d="M 235 172 L 235 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- vertical ship bracket -->
  <path d="M 268 72 L 278 72 L 278 218 L 268 218" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="288" y="140" font-size="10" fill="#4a7a3a" font-weight="bold">竖</text>
  <text x="288" y="154" font-size="10" fill="#4a7a3a" font-weight="bold">船</text>
  <text x="288" y="168" font-size="9" fill="#4a7a3a">3×1</text>

  <!-- single ship label -->
  <text x="85" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">单格船</text>

  <!-- legend -->
  <rect x="320" y="68" width="220" height="184" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="92" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">「头」判定规则</text>

  <text x="335" y="118" font-size="11.5" fill="#333">board[i][j] == 'X'</text>
  <text x="335" y="140" font-size="11.5" fill="#333">且 上方不是 'X'：</text>
  <text x="345" y="156" font-size="10.5" fill="#888">i==0 或 board[i−1][j] ≠ 'X'</text>
  <text x="335" y="178" font-size="11.5" fill="#333">且 左方不是 'X'：</text>
  <text x="345" y="194" font-size="10.5" fill="#888">j==0 或 board[i][j−1] ≠ 'X'</text>
  <text x="335" y="216" font-size="11.5" fill="#4a7a3a" font-weight="bold">⇒ 新战舰起点 → count++</text>
  <text x="335" y="236" font-size="10.5" fill="#b85450">非头 X：上方或左方有 X → 续接</text>

  <!-- footer note -->
  <rect x="30" y="266" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">题目保证战舰不相邻 ⇒ 每艘船恰有一个「头」</text>
  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#666">数头 = 数船：一次扫描 O(1) 空间、不修改 board</text>

  <!-- answer -->
  <text x="280" y="346" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">count = 2 ✓</text>
</svg>
