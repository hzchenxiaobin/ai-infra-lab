<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：受限节点即“墙”，切断其后整棵子树</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">树中两点的路径唯一 → 路径上有受限节点则不可达</text>

  <!-- 受限边：0-4 / 0-5 / 5-6 用红色虚线 -->
  <line x1="272" y1="150" x2="150" y2="108" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="288" y1="150" x2="410" y2="108" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="428" y1="108" x2="472" y2="160" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- 可达边：0-1 / 1-2 / 1-3 用绿色实线 -->
  <line x1="280" y1="172" x2="280" y2="232" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="272" y1="252" x2="232" y2="308" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="288" y1="252" x2="328" y2="308" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 节点 0 起点（绿） -->
  <circle cx="280" cy="160" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="280" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">起点</text>

  <!-- 节点 1 可达 -->
  <circle cx="280" cy="240" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- 节点 2 可达 -->
  <circle cx="224" cy="320" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="224" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- 节点 3 可达 -->
  <circle cx="336" cy="320" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="336" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- 节点 4 受限 -->
  <circle cx="138" cy="96" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="156" y="88" font-size="11" fill="#b85450" font-weight="bold">✗受限</text>

  <!-- 节点 5 受限 -->
  <circle cx="422" cy="96" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="422" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="440" y="88" font-size="11" fill="#b85450" font-weight="bold">✗受限</text>

  <!-- 节点 6 不可达（灰） -->
  <circle cx="478" cy="170" r="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="478" y="174" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">6</text>
  <text x="496" y="162" font-size="10" fill="#999">不可达</text>

  <!-- 可达分量虚线圈 -->
  <ellipse cx="280" cy="240" rx="92" ry="108" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="372" y="300" font-size="10" fill="#4a7a3a" font-weight="bold">可达分量 = 4</text>

  <!-- 说明框 -->
  <rect x="40" y="354" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="378" font-size="11" fill="#555">从 0 出发 BFS/DFS，遇受限节点不入队 = 自动切断其后子树</text>
  <text x="60" y="398" font-size="11" fill="#b85450" font-weight="bold">树路径唯一 → 受限节点 5 一挡，子树 {6} 整体不可达</text>
</svg>
