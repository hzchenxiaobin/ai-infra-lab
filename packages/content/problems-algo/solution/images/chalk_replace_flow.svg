<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：取余 + 线性扫描</text>

  <!-- Start -->
  <ellipse cx="260" cy="56" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 260 74 L 260 88" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: total -->
  <rect x="170" y="90" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" fill="#333">total = sum(chalk)</text>

  <path d="M 260 126 L 260 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: rem -->
  <rect x="160" y="142" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="165" text-anchor="middle" font-size="12" fill="#333">rem = k % total  (long long)</text>

  <path d="M 260 178 L 260 192" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: i = 0 -->
  <rect x="200" y="194" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="12" fill="#333">i = 0</text>

  <path d="M 260 226 L 260 244" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,246 360,296 260,346 160,296" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#333">rem &lt; chalk[i] ?</text>
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#888">剩余不足</text>

  <!-- Yes branch: return i -->
  <path d="M 360 296 L 430 296 L 430 60" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="395" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="380" y="42" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="65" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return i</text>

  <!-- No branch -->
  <path d="M 160 296 L 90 296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- No: rem -= chalk[i], i++ -->
  <rect x="20" y="278" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="294" text-anchor="middle" font-size="10" fill="#333">rem −= chalk[i]</text>
  <text x="55" y="307" text-anchor="middle" font-size="10" fill="#333">i++</text>

  <!-- Loop back arrow -->
  <path d="M 55 278 L 55 230 L 200 230" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="222" text-anchor="middle" font-size="10" fill="#888">回到判定</text>

  <!-- Footnote -->
  <rect x="40" y="370" width="440" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#555">rem &lt; total 保证循环至多走一轮，必在 n 步内命中</text>
  <text x="260" y="403" text-anchor="middle" font-size="10" fill="#888">C++ 中 total / rem 用 long long 防 10^10 溢出</text>
</svg>
