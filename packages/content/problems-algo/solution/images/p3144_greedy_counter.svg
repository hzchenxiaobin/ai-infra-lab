<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">为什么不能贪心：示例 2 本身就是反例</text>
  <text x="260" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">s = a b a b a b a c c d d b</text>

  <!-- 贪心行 -->
  <text x="25" y="88" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">贪心（每步切出最长平衡前缀）</text>

  <rect x="40" y="96" width="132" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="106" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ababab</text>
  <rect x="178" y="96" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ac</text>
  <rect x="228" y="96" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cd</text>
  <rect x="278" y="96" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">db</text>
  <text x="340" y="118" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">→ 4 段 ✗</text>

  <!-- 最优行 -->
  <text x="25" y="168" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">最优（第一段「留一手」，少吞一个 a、b）</text>

  <rect x="40" y="176" width="88" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="84" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">abab</text>
  <rect x="134" y="176" width="176" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">abaccddb</text>
  <text x="326" y="198" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 2 段 ✓</text>

  <!-- 注解框 -->
  <rect x="25" y="224" width="470" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">贪心把第 7 个字符 a 吞进第一段后，剩下的 accddb 里 a、b 各 1 个，c、d 各 2 个</text>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">频次参差怎么切都配不齐，只能碎成 ac | cd | db 三小段</text>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">平衡段之间会互相「抢字符」：第一段多吞一个 a，后段就永远配不平</text>
  <text x="260" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">局部最长 ≠ 全局最少 —— 分割类问题要用 DP 枚举所有转移点</text>
</svg>
