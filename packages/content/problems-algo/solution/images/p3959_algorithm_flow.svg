<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：剥位循环累计 diff（n = 19 演算）</text>

  <!-- 左侧：主循环 -->
  <g filter="url(#rough2)">
    <rect x="50" y="42" width="130" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="63" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">开始：diff = 0</text>

    <path d="M115,74 L115,90" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="115,94 185,128 115,162 45,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="115" y="124" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">n &gt; 0 ?</text>
    <text x="115" y="141" text-anchor="middle" font-size="9" fill="#8a6d1a">还有数位没剥？</text>

    <path d="M115,162 L115,178" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="103" y="175" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

    <rect x="45" y="182" width="140" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="199" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">d = n % 10</text>
    <text x="115" y="214" text-anchor="middle" font-size="9" fill="#33506b">剥下个位</text>

    <path d="M115,220 L115,234" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="45" y="238" width="140" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="255" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">diff += d×(d−1)</text>
    <text x="115" y="270" text-anchor="middle" font-size="9" fill="#33506b">该数位贡献落袋</text>

    <path d="M115,276 L115,290" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="45" y="294" width="140" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="311" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">n //= 10</text>
    <text x="115" y="326" text-anchor="middle" font-size="9" fill="#33506b">丢掉个位</text>

    <path d="M45,313 L20,313 L20,128 L39,128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)"/>
    <text x="30" y="220" text-anchor="middle" font-size="9" fill="#2f5d24" transform="rotate(-90 30 220)">回边：继续剥</text>
  </g>

  <!-- 中间：收尾判定 -->
  <g filter="url(#rough2)">
    <path d="M185,128 L223,128" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)"/>
    <text x="204" y="119" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

    <polygon points="295,92 359,128 295,164 231,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="295" y="124" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">diff ≥ 50 ?</text>
    <text x="295" y="141" text-anchor="middle" font-size="9" fill="#8a6d1a">收尾一次比较</text>

    <path d="M295,164 L295,188" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)"/>
    <text x="283" y="182" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="235" y="192" width="120" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="295" y="213" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">return true</text>

    <path d="M359,128 L384,128 L384,260 L359,260" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)"/>
    <text x="372" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
    <rect x="235" y="244" width="120" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="295" y="265" text-anchor="middle" font-size="11.5" fill="#8a3030" font-weight="bold">return false</text>
  </g>

  <!-- 右侧：演算表 -->
  <g filter="url(#rough2)">
    <rect x="416" y="42" width="184" height="290" rx="8" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="508" y="64" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">n = 19 逐轮演算</text>

    <rect x="424" y="74" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="439" y="91" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">轮</text>
    <rect x="458" y="74" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="478" y="91" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">n</text>
    <rect x="502" y="74" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="522" y="91" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">d</text>
    <rect x="546" y="74" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="569" y="91" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">diff</text>

    <rect x="424" y="104" width="30" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="439" y="121" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <rect x="458" y="104" width="40" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="478" y="121" text-anchor="middle" font-size="10.5" fill="#333">19</text>
    <rect x="502" y="104" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="522" y="121" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">9</text>
    <rect x="546" y="104" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="569" y="121" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">72</text>

    <rect x="424" y="134" width="30" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="439" y="151" text-anchor="middle" font-size="10.5" fill="#333">2</text>
    <rect x="458" y="134" width="40" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="478" y="151" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <rect x="502" y="134" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="522" y="151" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">1</text>
    <rect x="546" y="134" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="569" y="151" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">72</text>

    <rect x="424" y="164" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="439" y="181" text-anchor="middle" font-size="10.5" fill="#8a3030">3</text>
    <rect x="458" y="164" width="40" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="478" y="181" text-anchor="middle" font-size="10.5" fill="#8a3030">0</text>
    <rect x="502" y="164" width="40" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="522" y="181" text-anchor="middle" font-size="9.5" fill="#888">停</text>
    <rect x="546" y="164" width="46" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1"/>
    <text x="569" y="181" text-anchor="middle" font-size="9.5" fill="#888">—</text>

    <text x="508" y="212" text-anchor="middle" font-size="10" fill="#4a6b5a">n = 0，循环终止</text>
    <text x="508" y="234" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">diff = 72 ≥ 50</text>
    <text x="508" y="252" text-anchor="middle" font-size="10.5" fill="#2f5d24">→ return true ✓</text>

    <rect x="426" y="266" width="164" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="508" y="288" text-anchor="middle" font-size="9.5" fill="#33506b">n = 1000：数位 1,0,0,0</text>
    <text x="508" y="308" text-anchor="middle" font-size="9.5" fill="#8a3030">贡献全 0 → diff = 0 &lt; 50 → false</text>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="20" y="348" width="580" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="370" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">要点：循环轮数 = 位数 L ≤ 10（10⁹ 是唯一 10 位数）；diff 上界 9×72 = 648，int 无压力</text>
    <text x="310" y="390" text-anchor="middle" font-size="10" fill="#8a6d1a">两个统计量合一个：每轮只加 d×(d−1)；n ≥ 1 ⇒ 循环至少跑一轮，无 n = 0 边界</text>
  </g>
</svg>
