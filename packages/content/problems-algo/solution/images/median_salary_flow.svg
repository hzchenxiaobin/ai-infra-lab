<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">执行流程：FROM → 窗口排序 → ROW_NUMBER + COUNT → 筛选中位数</text>

  <!-- Step 1: FROM -->
  <rect x="50" y="48" width="160" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① FROM Employee</text>
  <text x="130" y="86" text-anchor="middle" font-size="9.5" fill="#666">读取 10 行原始数据</text>

  <!-- Step 2: PARTITION + ORDER -->
  <rect x="300" y="48" width="220" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 窗口排序</text>
  <text x="410" y="84" text-anchor="middle" font-size="9.5" fill="#666">PARTITION BY company</text>
  <text x="410" y="95" text-anchor="middle" font-size="9.5" fill="#666">ORDER BY salary ASC, id ASC</text>

  <path d="M210 73 L300 73" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: ROW_NUMBER + COUNT -->
  <rect x="50" y="130" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 窗口函数计算</text>
  <text x="160" y="168" text-anchor="middle" font-size="9.5" fill="#666">ROW_NUMBER() → rn</text>
  <text x="160" y="180" text-anchor="middle" font-size="9.5" fill="#666">COUNT(*) → cnt</text>

  <path d="M410 98 L410 115 L160 115 L160 130" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: WHERE filter -->
  <rect x="300" y="130" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 筛选中位数</text>
  <text x="410" y="168" text-anchor="middle" font-size="9.5" fill="#666">WHERE rn BETWEEN</text>
  <text x="410" y="180" text-anchor="middle" font-size="9.5" fill="#666">⌊(cnt+1)/2⌋ AND ⌊(cnt+2)/2⌋</text>

  <path d="M270 158 L300 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 5: SELECT -->
  <rect x="170" y="210" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤ SELECT 输出</text>
  <text x="280" y="248" text-anchor="middle" font-size="9.5" fill="#666">id, company, salary</text>

  <path d="M410 186 L410 200 L280 200 L280 210" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Sorted detail box -->
  <rect x="30" y="280" width="500" height="165" fill="#fcfcf6" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口排序后的逐行视图（步骤 ②③④ 细节）</text>

  <!-- Company A section -->
  <text x="80" y="322" font-size="9.5" fill="#b85450" font-weight="bold">公司 A（cnt=6）</text>
  <rect x="40" y="326" width="220" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="340" font-size="8.5" fill="#333">id</text>
  <text x="90" y="340" font-size="8.5" fill="#333">salary</text>
  <text x="140" y="340" font-size="8.5" fill="#333">rn</text>
  <text x="175" y="340" font-size="8.5" fill="#333">cnt</text>
  <text x="225" y="340" font-size="8.5" fill="#333">命中?</text>

  <rect x="40" y="346" width="220" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="358" font-size="8.5" fill="#333">3</text>
  <text x="90" y="358" font-size="8.5" fill="#333">15</text>
  <text x="140" y="358" font-size="8.5" fill="#333">1</text>
  <text x="175" y="358" font-size="8.5" fill="#888">6</text>
  <text x="225" y="358" font-size="8.5" fill="#888">✗</text>

  <rect x="40" y="362" width="220" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="374" font-size="8.5" fill="#333">2</text>
  <text x="90" y="374" font-size="8.5" fill="#333">341</text>
  <text x="140" y="374" font-size="8.5" fill="#333">2</text>
  <text x="175" y="374" font-size="8.5" fill="#888">6</text>
  <text x="225" y="374" font-size="8.5" fill="#888">✗</text>

  <rect x="40" y="378" width="220" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="55" y="390" font-size="8.5" fill="#333">5</text>
  <text x="90" y="390" font-size="8.5" fill="#b85450" font-weight="bold">451</text>
  <text x="140" y="390" font-size="8.5" fill="#b85450" font-weight="bold">3</text>
  <text x="175" y="390" font-size="8.5" fill="#888">6</text>
  <text x="225" y="390" font-size="8.5" fill="#b85450" font-weight="bold">✓</text>

  <rect x="40" y="394" width="220" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="55" y="406" font-size="8.5" fill="#333">6</text>
  <text x="90" y="406" font-size="8.5" fill="#b85450" font-weight="bold">513</text>
  <text x="140" y="406" font-size="8.5" fill="#b85450" font-weight="bold">4</text>
  <text x="175" y="406" font-size="8.5" fill="#888">6</text>
  <text x="225" y="406" font-size="8.5" fill="#b85450" font-weight="bold">✓</text>

  <rect x="40" y="410" width="220" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="422" font-size="8.5" fill="#333">1</text>
  <text x="90" y="422" font-size="8.5" fill="#333">2341</text>
  <text x="140" y="422" font-size="8.5" fill="#333">5</text>
  <text x="175" y="422" font-size="8.5" fill="#888">6</text>
  <text x="225" y="422" font-size="8.5" fill="#888">✗</text>

  <rect x="40" y="426" width="220" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="55" y="438" font-size="8.5" fill="#333">4</text>
  <text x="90" y="438" font-size="8.5" fill="#333">15314</text>
  <text x="140" y="438" font-size="8.5" fill="#333">6</text>
  <text x="175" y="438" font-size="8.5" fill="#888">6</text>
  <text x="225" y="438" font-size="8.5" fill="#888">✗</text>

  <!-- Company B section -->
  <text x="350" y="322" font-size="9.5" fill="#4a7a3a" font-weight="bold">公司 B（cnt=4）</text>
  <rect x="310" y="326" width="200" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="325" y="340" font-size="8.5" fill="#333">id</text>
  <text x="360" y="340" font-size="8.5" fill="#333">salary</text>
  <text x="410" y="340" font-size="8.5" fill="#333">rn</text>
  <text x="445" y="340" font-size="8.5" fill="#333">cnt</text>
  <text x="490" y="340" font-size="8.5" fill="#333">命中?</text>

  <rect x="310" y="346" width="200" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="325" y="358" font-size="8.5" fill="#333">8</text>
  <text x="360" y="358" font-size="8.5" fill="#333">13</text>
  <text x="410" y="358" font-size="8.5" fill="#333">1</text>
  <text x="445" y="358" font-size="8.5" fill="#888">4</text>
  <text x="490" y="358" font-size="8.5" fill="#888">✗</text>

  <rect x="310" y="362" width="200" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="325" y="374" font-size="8.5" fill="#333">7</text>
  <text x="360" y="374" font-size="8.5" fill="#b85450" font-weight="bold">15</text>
  <text x="410" y="374" font-size="8.5" fill="#b85450" font-weight="bold">2</text>
  <text x="445" y="374" font-size="8.5" fill="#888">4</text>
  <text x="490" y="374" font-size="8.5" fill="#b85450" font-weight="bold">✓</text>

  <rect x="310" y="378" width="200" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="325" y="390" font-size="8.5" fill="#333">9</text>
  <text x="360" y="390" font-size="8.5" fill="#b85450" font-weight="bold">1154</text>
  <text x="410" y="390" font-size="8.5" fill="#b85450" font-weight="bold">3</text>
  <text x="445" y="390" font-size="8.5" fill="#888">4</text>
  <text x="490" y="390" font-size="8.5" fill="#b85450" font-weight="bold">✓</text>

  <rect x="310" y="394" width="200" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="325" y="406" font-size="8.5" fill="#333">10</text>
  <text x="360" y="406" font-size="8.5" fill="#333">1345</text>
  <text x="410" y="406" font-size="8.5" fill="#333">4</text>
  <text x="445" y="406" font-size="8.5" fill="#888">4</text>
  <text x="490" y="406" font-size="8.5" fill="#888">✗</text>
</svg>
