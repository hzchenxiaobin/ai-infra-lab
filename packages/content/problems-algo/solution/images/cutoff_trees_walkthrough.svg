<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：forest = [[1,2,3],[0,0,4],[7,6,5]] → 6 步</text>
  <path d="M 220 40 Q 380 48 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Left: grid with path arrows ===== -->
  <text x="135" y="72" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">砍树路径（按高度 2→3→4→5→6→7）</text>
  <g font-size="16" filter="url(#rough2)">
    <!-- row 0: 1 2 3 -->
    <rect x="60" y="88" width="50" height="50" fill="#fff" stroke="#bbb"/>
    <text x="85" y="120" text-anchor="middle" fill="#888">1</text>
    <rect x="110" y="88" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="135" y="120" text-anchor="middle" fill="#2e5e2e" font-weight="bold">2</text>
    <rect x="160" y="88" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="185" y="120" text-anchor="middle" fill="#2e5e2e" font-weight="bold">3</text>
    <!-- row 1: 0 0 4 -->
    <rect x="60" y="138" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="85" y="170" text-anchor="middle" fill="#b03a3a" font-weight="bold">0</text>
    <rect x="110" y="138" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="135" y="170" text-anchor="middle" fill="#b03a3a" font-weight="bold">0</text>
    <rect x="160" y="138" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="185" y="170" text-anchor="middle" fill="#2e5e2e" font-weight="bold">4</text>
    <!-- row 2: 7 6 5 -->
    <rect x="60" y="188" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="85" y="220" text-anchor="middle" fill="#2e5e2e" font-weight="bold">7</text>
    <rect x="110" y="188" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="135" y="220" text-anchor="middle" fill="#2e5e2e" font-weight="bold">6</text>
    <rect x="160" y="188" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="185" y="220" text-anchor="middle" fill="#2e5e2e" font-weight="bold">5</text>
  </g>

  <!-- start marker on (0,0) -->
  <circle cx="85" cy="113" r="9" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="40" y="117" font-size="10" fill="#d6a040" filter="url(#rough2)">起点</text>

  <!-- path arrows (orange) -->
  <g filter="url(#rough2)">
    <!-- (0,0)->(0,1) right -->
    <path d="M108 113 L116 113" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
    <!-- (0,1)->(0,2) right -->
    <path d="M158 113 L166 113" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
    <!-- (0,2)->(1,2) down -->
    <path d="M185 136 L185 144" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
    <!-- (1,2)->(2,2) down -->
    <path d="M185 186 L185 194" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
    <!-- (2,2)->(2,1) left -->
    <path d="M162 213 L154 213" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
    <!-- (2,1)->(2,0) left -->
    <path d="M112 213 L104 213" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
  </g>

  <text x="135" y="262" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">→ → ↓ ↓ ← ← 共 6 步</text>
  <text x="135" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每段 BFS 距离恰为 1</text>

  <!-- ===== Right: segment table ===== -->
  <text x="540" y="72" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">分段 BFS 距离表</text>
  <g filter="url(#rough2)">
    <rect x="320" y="88" width="420" height="222" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <!-- header -->
  <g font-size="11" fill="#444" filter="url(#rough2)">
    <text x="340" y="110" font-weight="bold">段</text>
    <text x="380" y="110" font-weight="bold">from → to</text>
    <text x="540" y="110" font-weight="bold">BFS 路径</text>
    <text x="680" y="110" font-weight="bold">步数</text>
    <text x="720" y="110" font-weight="bold">累计</text>
  </g>
  <path d="M335 118 L735 118" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <g font-size="11" fill="#444" filter="url(#rough2)">
    <text x="340" y="136">1</text>
    <text x="380" y="136">(0,0)→(0,1)</text>
    <text x="540" y="136">→右</text>
    <text x="680" y="136" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="720" y="136">1</text>

    <text x="340" y="156">2</text>
    <text x="380" y="156">(0,1)→(0,2)</text>
    <text x="540" y="156">→右</text>
    <text x="680" y="156" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="720" y="156">2</text>

    <text x="340" y="176">3</text>
    <text x="380" y="176">(0,2)→(1,2)</text>
    <text x="540" y="176">→下</text>
    <text x="680" y="176" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="720" y="176">3</text>

    <text x="340" y="196">4</text>
    <text x="380" y="196">(1,2)→(2,2)</text>
    <text x="540" y="196">→下</text>
    <text x="680" y="196" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="720" y="196">4</text>

    <text x="340" y="216">5</text>
    <text x="380" y="216">(2,2)→(2,1)</text>
    <text x="540" y="216">→左</text>
    <text x="680" y="216" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="720" y="216">5</text>

    <text x="340" y="236">6</text>
    <text x="380" y="236">(2,1)→(2,0)</text>
    <text x="540" y="236">→左</text>
    <text x="680" y="236" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="720" y="236">6</text>
  </g>
  <path d="M335 248 L735 248" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="680" y="270" fill="#b85450" font-weight="bold">合计</text>
    <text x="720" y="270" fill="#b85450" font-weight="bold">6</text>
  </g>
  <text x="540" y="294" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每段距离相加 = 总步数</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="328" width="680" height="72" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="380" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">关键：高度序列恰好沿网格单调走 → 每段距离都是 1</text>
  <g font-size="11" fill="#444" filter="url(#rough2)">
    <text x="80" y="376">· 树高 2,3,4 在顶行向右递增；4→5→6→7 沿右列向下再底行向左递增 → 砍树顺序天然沿连续路径</text>
    <text x="80" y="392">· 若高度分布打乱（如示例 3 中 8 在角落），则某些段需绕行，BFS 自动求出该段最短绕路距离</text>
  </g>
</svg>
