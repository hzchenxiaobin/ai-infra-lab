<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 z" fill="#446688"/>
    </marker>
    <marker id="arrUp" markerWidth="10" markerHeight="10" refX="5" refY="1" orient="auto">
      <path d="M0,9 L5,0 L10,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">递归分治树：x^10 的下降与合并 (深度 = O(log n))</text>

  <!-- Column headers -->
  <text x="150" y="50" text-anchor="middle" font-size="12" fill="#888">↓ 递归下降 (规模减半)</text>
  <text x="430" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a">↑ 合并返回</text>

  <!-- Level 0: pow(2,10) -->
  <rect x="90" y="60" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">pow(2, 10)</text>
  <!-- level0 return -->
  <rect x="360" y="60" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 32 · 32 = 1024 ⭐</text>
  <path d="M 360 77 L 210 77" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- down arrow 0->1 -->
  <path d="M 150 94 L 150 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="168" y="104" font-size="10" fill="#888">n/2=5</text>

  <!-- Level 1: pow(2,5) odd -->
  <rect x="90" y="112" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="134" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">pow(2, 5)</text>
  <text x="150" y="158" text-anchor="middle" font-size="10" fill="#b85450">奇：half² · x</text>
  <rect x="360" y="112" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="134" text-anchor="middle" font-size="12" fill="#333">= 4 · 4 · 2 = 32</text>
  <path d="M 360 129 L 210 129" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <path d="M 150 162 L 150 176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="168" y="172" font-size="10" fill="#888">n/2=2</text>

  <!-- Level 2: pow(2,2) even -->
  <rect x="90" y="180" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">pow(2, 2)</text>
  <text x="150" y="226" text-anchor="middle" font-size="10" fill="#446688">偶：half²</text>
  <rect x="360" y="180" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="202" text-anchor="middle" font-size="12" fill="#333">= 2 · 2 = 4</text>
  <path d="M 360 197 L 210 197" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <path d="M 150 230 L 150 244" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="168" y="240" font-size="10" fill="#888">n/2=1</text>

  <!-- Level 3: pow(2,1) odd -->
  <rect x="90" y="248" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="270" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">pow(2, 1)</text>
  <text x="150" y="294" text-anchor="middle" font-size="10" fill="#b85450">奇：half² · x</text>
  <rect x="360" y="248" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="12" fill="#333">= 1 · 1 · 2 = 2</text>
  <path d="M 360 265 L 210 265" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <path d="M 150 298 L 150 312" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <text x="168" y="308" font-size="10" fill="#888">n/2=0</text>

  <!-- Level 4: base case -->
  <rect x="90" y="316" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="338" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">pow(2, 0)</text>
  <rect x="360" y="316" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 1 (base case)</text>
  <path d="M 360 333 L 210 333" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- up arrow along right column -->
  <path d="M 430 312 L 430 96" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrUp)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="452" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 452 250)">逐层返回合并</text>
</svg>
