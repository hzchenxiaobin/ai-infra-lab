<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：每块排序 + 字典序排序 + 一维 DP</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: sort each cuboid -->
  <rect x="110" y="94" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">对每个 cuboids[i] 内部升序排序</text>
  <text x="270" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 固定朝向 (w_i ≤ l_i ≤ h_i)</text>

  <path d="M 270 138 L 270 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort all cuboids lexicographically -->
  <rect x="110" y="156" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">按 (w, l, h) 字典序升序排序全部块</text>
  <text x="270" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ j &lt; i 时 w_j ≤ w_i 自动成立</text>

  <path d="M 270 200 L 270 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: init dp -->
  <rect x="160" y="218" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 dp[i] = h_i, ans = 0</text>

  <path d="M 270 252 L 270 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: more cuboids? -->
  <polygon points="270,272 380,318 270,364 160,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有块 i?</text>
  <text x="270" y="330" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(i 从 0 到 n−1)</text>

  <!-- No branch -> return -->
  <path d="M 380 318 L 440 318 L 440 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="310" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="378" y="382" width="124" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="403" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Yes branch -> inner loop -->
  <path d="M 160 318 L 110 318 L 110 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="310" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Inner decision: j < i? -->
  <polygon points="110,378 200,418 110,458 20,418" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="415" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j &lt; i ?</text>
  <text x="110" y="430" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(j 从 0 起)</text>

  <!-- No: update ans, next i -->
  <path d="M 200 418 L 250 418 L 250 450" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="410" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="170" y="452" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="470" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = max(ans, dp[i])</text>
  <text x="280" y="486" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 处理下一个 i</text>

  <!-- Yes: check l_j<=l_i and h_j<=h_i -->
  <path d="M 110 458 L 110 478" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="472" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <polygon points="110,480 215,510 110,535 5,510" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="506" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">l_j≤l_i 且 h_j≤h_i?</text>
  <text x="110" y="520" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">(w 维已由排序保证)</text>

  <!-- Yes: update dp -->
  <path d="M 215 510 L 250 510 L 250 490" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="502" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- dp update box (floating right) -->
  <rect x="340" y="478" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="496" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[i] = max(dp[i],</text>
  <text x="430" y="512" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[j] + h_i)</text>
  <path d="M 250 490 L 340 490" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: skip j -->
  <path d="M 110 535 L 110 540 L 5 540 L 5 418" stroke="#999" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="20" y="534" font-size="9" fill="#999" filter="url(#rough2)">跳过 j</text>

  <!-- Loop back: j++ -->
  <path d="M 5 418 L 5 378" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="-10" y="400" font-size="9" fill="#4a7a3a" filter="url(#rough2)">j++</text>

  <!-- Loop back: i++ from ans update -->
  <path d="M 390 474 L 440 474 L 440 318" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="400" font-size="9" fill="#4a7a3a" filter="url(#rough2)">i++</text>

  <!-- Legend -->
  <rect x="350" y="94" width="180" height="50" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="358" y="110" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">图例</text>
  <rect x="358" y="116" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="378" y="125" font-size="10" fill="#555" filter="url(#rough2)">处理动作</text>
  <polygon points="458,114 478,114 468,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="484" y="125" font-size="10" fill="#555" filter="url(#rough2)">判定分支</text>
  <rect x="358" y="130" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="378" y="139" font-size="10" fill="#555" filter="url(#rough2)">更新/推进</text>
</svg>
