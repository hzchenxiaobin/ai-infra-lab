<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：逐回合滚动 DP</text>

  <!-- 开始 -->
  <rect x="195" y="32" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始：读入 s，n = |s|</text>

  <path d="M 260 58 L 260 70" stroke="#666" stroke-width="1.6" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>

  <!-- 建表开数组 -->
  <rect x="130" y="72" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">建 3×3 增量表 δ；开滚动数组 dp[0..2n][3]</text>

  <path d="M 260 100 L 260 110" stroke="#666" stroke-width="1.6" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="95" y="112" width="330" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">初始化第 0 回合：dp[δ(k, s[0]) + n][k] = 1（k = F/W/E）</text>

  <path d="M 260 140 L 260 156" stroke="#666" stroke-width="1.6" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,158 390,190 260,222 130,190" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">还有回合？</text>
  <text x="260" y="202" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">i ≤ n−1 ?</text>

  <!-- 是 → 循环体 -->
  <path d="M 260 222 L 260 238" stroke="#666" stroke-width="1.6" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>
  <text x="272" y="234" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="70" y="240" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">对每个 j、每个 k ≠ k′：ndp[j + δ(k, s[i])][k] += dp[j][k′]（取模）</text>
  <text x="270" y="276" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">swap(dp, ndp)，i ← i + 1</text>

  <!-- 循环回边 -->
  <path d="M 470 262 C 497 262, 497 200, 396 190" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="494" y="228" text-anchor="end" font-size="9" fill="#d6a040" filter="url(#rough2)">下一回合</text>

  <!-- 否 → 汇总 -->
  <path d="M 130 190 C 70 190, 35 200, 35 260 C 35 300, 60 312, 93 312" stroke="#666" stroke-width="1.6" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>
  <text x="48" y="248" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="95" y="298" width="330" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">ans = Σ(j &gt; n) Σ(k) dp[j][k]，mod 10⁹+7</text>

  <path d="M 260 326 L 260 336" stroke="#666" stroke-width="1.6" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="205" y="338" width="110" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
