<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定 B 后，max [XOR(A)+XOR(C)] = s + 2·max(x &amp; ~s)</text>

  <text x="128" y="64" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums：</text>
  <rect x="170" y="46" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="206" y="46" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="242" y="46" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="278" y="46" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <path d="M 200 76 L 110 98" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 76 L 260 98" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 280 76 L 410 98" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="102" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="105" y="119" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A：XOR 堆</text>
  <text x="105" y="134" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">XOR(A) = x</text>

  <rect x="185" y="102" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="119" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B：AND 堆（枚举 2ⁿ）</text>
  <text x="260" y="134" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">AND(B) 固定，空集记 0</text>

  <rect x="340" y="102" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="119" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">C：XOR 堆</text>
  <text x="415" y="134" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">XOR(C) = s ⊕ x</text>

  <rect x="60" y="160" width="400" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">R = nums∖B，s = XOR(R)。A、C 怎么分，x 都是 R 的某个子集异或</text>
  <text x="260" y="196" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">恒等式：x + (s ⊕ x) = s + 2·(x &amp; ~s)</text>

  <rect x="60" y="224" width="190" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="241" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s = 1 的位：xᵢ + (1⊕xᵢ) = 1</text>
  <text x="155" y="257" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">贡献固定，怎么分都一样</text>

  <rect x="270" y="224" width="190" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="365" y="241" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s = 0 的位：xᵢ + xᵢ = 2·xᵢ</text>
  <text x="365" y="257" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">才是能抢的分数（权重 ×2）</text>

  <rect x="60" y="282" width="400" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">掩码与异或可交换：(a ⊕ b) &amp; m = (a &amp; m) ⊕ (b &amp; m)</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⇒ x &amp; ~s = XOR(nums[j] &amp; ~s) → 建线性基贪心取最大</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">B 用 2ⁿ 枚举；A/C 的 2^|R| 种分法被线性基一趟吃掉</text>
</svg>
