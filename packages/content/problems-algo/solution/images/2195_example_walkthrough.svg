<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [5, 6], k = 6</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">排序去重后挡板序列 = [5, 6]</text>

  <!-- table header -->
  <rect x="20" y="56" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <text x="92" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v</text>
  <text x="146" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">next</text>
  <text x="236" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">缺口 [next,v−1]</text>
  <text x="330" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">gap</text>
  <text x="386" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">need(前)</text>
  <text x="468" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <text x="548" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum</text>

  <!-- row 1: v=5 -->
  <rect x="20" y="84" width="560" height="36" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="107" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="92" y="107" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="146" y="107" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="236" y="107" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1, 4]</text>
  <text x="330" y="107" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="386" y="107" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="468" y="107" text-anchor="middle" font-size="10" fill="#4a7a3a">取 1,2,3,4（全取）</text>
  <text x="548" y="107" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>

  <!-- row 2: v=6 -->
  <rect x="20" y="120" width="560" height="36" fill="#f6f8fb" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="92" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="146" y="143" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="236" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[6, 5] 空</text>
  <text x="330" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="386" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="468" y="143" text-anchor="middle" font-size="10" fill="#b85450">跳过 v=6</text>
  <text x="548" y="143" text-anchor="middle" font-size="11" fill="#333">10</text>

  <!-- row 3: after loop (tail) -->
  <rect x="20" y="156" width="560" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="179" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="92" y="179" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="146" y="179" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="236" y="179" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[7, +∞) 末尾</text>
  <text x="330" y="179" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="386" y="179" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="468" y="179" text-anchor="middle" font-size="10" fill="#d6a040">兜底取 7,8</text>
  <text x="548" y="179" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">25</text>

  <!-- arrow down -->
  <path d="M 300 192 L 300 212" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Verification block -->
  <rect x="20" y="214" width="560" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <text x="300" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">验证：1 + 2 + 3 + 4 + 7 + 8 = 25 ✓</text>
  <text x="300" y="258" text-anchor="middle" font-size="11" fill="#555">5, 6 在 nums 中被跳过 ✓ ｜ 全部互不相同 ✓ ｜ 均为正整数 ✓</text>
  <text x="300" y="276" text-anchor="middle" font-size="11" fill="#555">第1步：sum += (1+4)×4/2 = 10，need 6→2，next→6</text>

  <!-- visual bar label -->
  <text x="300" y="310" text-anchor="middle" font-size="11" fill="#888">可视化取数条：</text>

  <!-- bar segments: 1,2,3,4 taken | 5,6 blocked | 7,8 taken -->
  <rect x="44" y="322" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="345" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="92" y="322" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="345" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="140" y="322" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="345" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="188" y="322" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="345" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- blocked 5,6 -->
  <rect x="240" y="322" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="345" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <rect x="288" y="322" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="345" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>

  <!-- taken 7,8 -->
  <rect x="340" y="322" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="345" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="388" y="322" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="345" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <text x="448" y="345" font-size="13" fill="#4a7a3a" font-weight="bold">→ 和 = 25</text>

  <!-- sum breakdown -->
  <rect x="44" y="372" width="512" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="300" y="392" text-anchor="middle" font-size="11" fill="#555">缺口① [1,4]：sum += (1+4)×4/2 = 10　|　缺口② [7,8]：sum += (7+8)×2/2 = 15</text>
  <text x="300" y="410" text-anchor="middle" font-size="11" fill="#555">总计 10 + 15 = 25</text>

  <!-- bottom note -->
  <text x="300" y="442" text-anchor="middle" font-size="10" fill="#888">挡板 5,6 把数轴切成 [1,4] 与 [7,∞) 两段，分别等差求和 O(1)</text>
  <text x="300" y="460" text-anchor="middle" font-size="10" fill="#888">第2步 v=6 紧贴 next=6（gap=0），仅推进 next→7 不取数</text>
</svg>
