<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="510" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">案例分析：m₁（单字符）与 m₂（双字符）的合法方式数</text>

  <!-- m1 横条 -->
  <text x="290" y="58" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">单字符系数 m₁(c₁)</text>
  <rect x="130" y="68" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="84" text-anchor="middle" font-size="11" fill="#333">c₁ = '0'</text>
  <text x="180" y="100" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">m₁ = 0</text>
  <rect x="240" y="68" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="84" text-anchor="middle" font-size="11" fill="#333">c₁ = '1'..'9'</text>
  <text x="290" y="100" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">m₁ = 1</text>
  <rect x="350" y="68" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="84" text-anchor="middle" font-size="11" fill="#333">c₁ = '*'</text>
  <text x="400" y="100" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">m₁ = 9</text>

  <!-- m2 表标题 -->
  <text x="290" y="136" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">双字符系数 m₂(c₂, c₁)   ——   十位 c₂ 为行，个位 c₁ 为列</text>

  <!-- m2 网格：起点 x=60, y=150 -->
  <!-- 表头行：corner + 4 个 c1 列标签 -->
  <rect x="60" y="150" width="80" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="175" text-anchor="middle" font-size="10.5" fill="#555">c₂ ＼ c₁</text>
  <rect x="140" y="150" width="95" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="187" y="175" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">'0'</text>
  <rect x="235" y="150" width="95" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="175" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">'1'..'6'</text>
  <rect x="330" y="150" width="95" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="175" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">'7'..'9'</text>
  <rect x="425" y="150" width="95" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="472" y="175" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">'*'</text>

  <!-- 行 0: c2='0'  → 0,0,0,0 -->
  <rect x="60" y="190" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">'0'</text>
  <rect x="140" y="190" width="95" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="187" y="218" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="235" y="190" width="95" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="282" y="218" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="330" y="190" width="95" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="377" y="218" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="425" y="190" width="95" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="472" y="218" text-anchor="middle" font-size="13" fill="#b85450">0</text>

  <!-- 行 1: c2='1'  → 1,1,1,9 -->
  <rect x="60" y="236" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">'1'</text>
  <rect x="140" y="236" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="187" y="264" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="235" y="236" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="282" y="264" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="330" y="236" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="377" y="264" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="425" y="236" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="264" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- 行 2: c2='2'  → 1,1,0,6 -->
  <rect x="60" y="282" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">'2'</text>
  <rect x="140" y="282" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="187" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="235" y="282" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="282" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="330" y="282" width="95" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="377" y="310" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="425" y="282" width="95" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="310" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- 行 3: c2='3'..'9'  → 0,0,0,0 -->
  <rect x="60" y="328" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">'3'..'9'</text>
  <rect x="140" y="328" width="95" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="187" y="356" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="235" y="328" width="95" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="282" y="356" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="330" y="328" width="95" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="377" y="356" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="425" y="328" width="95" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="472" y="356" text-anchor="middle" font-size="13" fill="#b85450">0</text>

  <!-- 行 4: c2='*'  → 2,2,1,15  (高亮整行) -->
  <rect x="60" y="374" width="80" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="403" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">'*'</text>
  <rect x="140" y="374" width="95" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="187" y="403" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="235" y="374" width="95" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="403" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="330" y="374" width="95" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="403" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="425" y="374" width="95" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="403" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">15</text>

  <!-- 底部说明 -->
  <rect x="30" y="440" width="520" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="460" text-anchor="middle" font-size="11" fill="#555">粉色 = 0 种（十位非法或越界）；绿色 = 合法方式数</text>
  <text x="290" y="478" text-anchor="middle" font-size="11" fill="#555">'*' 行（橙框）= '1' 行 + '2' 行对应格之和</text>
  <text x="290" y="494" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">关键格：(1,*)=9  (2,*)=6  (*,*)=9+6=15</text>
</svg>
