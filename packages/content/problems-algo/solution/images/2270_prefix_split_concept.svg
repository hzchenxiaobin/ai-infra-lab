<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：左段和 leftSum 滚动累加，右段和 = total − leftSum</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">下标 i 处比较“前 i+1 个和”是否 ≥ “后 n−i−1 个和”，O(1) 维护</text>

  <!-- ===== Array nums = [10,4,-8,7], split at i=1 ===== -->
  <text x="28" y="80" font-size="10.5" fill="#666">nums</text>
  <text x="90" y="72" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="170" y="72" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="250" y="72" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="330" y="72" text-anchor="middle" font-size="9" fill="#888">3</text>

  <!-- left part (blue) i=0..1 -->
  <rect x="70" y="76" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="150" y="76" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- right part (green) i=2..3 -->
  <rect x="230" y="76" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−8</text>
  <rect x="310" y="76" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>

  <!-- split divider between i=1 and i=2 -->
  <line x1="230" y1="64" x2="230" y2="118" stroke="#b85450" stroke-width="2.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="230" y="58" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">分割 i=1</text>

  <!-- left segment brace -->
  <path d="M 70 118 Q 70 128 90 130 L 210 130 Q 230 128 230 118" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">前 2 个 (i+1=2)</text>
  <!-- right segment brace -->
  <path d="M 230 118 Q 230 128 250 130 L 370 130 Q 390 128 390 118" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">后 2 个 (n−i−1=2)</text>

  <!-- ===== leftSum row (blue) ===== -->
  <text x="28" y="178" font-size="10.5" fill="#666">leftSum</text>
  <rect x="70" y="156" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="176" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">10+4 = 14</text>
  <!-- leftSum recurrence arrow -->
  <path d="M 32 171 L 66 171" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="34" y="200" font-size="10" fill="#446688" font-weight="bold">leftSum += nums[i]</text>
  <text x="34" y="213" font-size="9" fill="#888">从 0 起逐个累加</text>

  <!-- ===== rightSum = total - leftSum (green) ===== -->
  <text x="28" y="240" font-size="10.5" fill="#666">rightSum</text>
  <rect x="310" y="218" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="238" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">−8+7 = −1</text>
  <path d="M 434 233 L 474 233" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="498" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">= total</text>
  <text x="498" y="243" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">− leftSum</text>

  <!-- total tag -->
  <rect x="430" y="156" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="173" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">total=13</text>
  <text x="470" y="195" text-anchor="middle" font-size="9" fill="#888">一次遍历求</text>

  <!-- ===== compare row (orange) ===== -->
  <text x="28" y="282" font-size="10.5" fill="#666">比较</text>
  <rect x="70" y="262" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="282" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">leftSum = 14</text>
  <rect x="310" y="262" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="282" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">rightSum = −1</text>
  <text x="440" y="282" font-size="11" fill="#d6a040" font-weight="bold">仅比和</text>

  <!-- ===== result ===== -->
  <line x1="190" y1="292" x2="190" y2="312" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="370" y1="292" x2="370" y2="312" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <rect x="70" y="312" width="360" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">14 ≥ −1 ？是 → 合法分割，ans++</text>

  <!-- ===== Footer note ===== -->
  <rect x="40" y="358" width="465" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="272" y="379" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">无须除法：直接比两段“和”；含负数 → 总和可能为负，必须用 long long</text>
</svg>
