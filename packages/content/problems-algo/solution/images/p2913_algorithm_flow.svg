<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双层枚举 + 增量维护集合，O(n²) 收工</text>

  <!-- start box -->
  <rect x="215" y="44" width="190" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans ← 0</text>

  <path d="M 310 80 L 310 100" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop box -->
  <rect x="95" y="102" width="430" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">外层：for i = 0 … n−1（枚举左端点）</text>
  <text x="310" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">清空 seen（集合归零）；d ← 0</text>
  <text x="310" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">⟲ 每轮换一个新窗口，从空集合出发</text>

  <path d="M 310 182 L 310 202" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop box -->
  <rect x="95" y="204" width="430" height="122" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="228" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">内层：for j = i … n−1（右端点逐步扩张）</text>
  <text x="310" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若 nums[j] ∉ seen：标记进集合，d ← d + 1</text>
  <text x="310" y="272" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">（老面孔：什么都不做，d 不变）</text>
  <text x="310" y="298" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans ← ans + d²</text>
  <text x="310" y="318" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">⟲ 每扩一格 O(1) 转移，顺手累加平方</text>

  <path d="M 310 326 L 310 344" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end box -->
  <rect x="215" y="346" width="190" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="369" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return ans</text>

  <text x="310" y="394" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">n ≤ 100 ⇒ ans ≤ 5050 × 100² ≈ 5×10⁷，int 不溢出</text>
</svg>
