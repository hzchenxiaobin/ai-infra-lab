<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M4,8 L0,0 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">信号量方案：h_sem(2) + o_sem(0) 协调流程</text>

  <text x="100" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Hydrogen 线程</text>
  <text x="420" y="55" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Oxygen 线程</text>

  <rect x="210" y="110" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">h_sem</text>
  <text x="260" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">初始 = 2</text>

  <rect x="210" y="240" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">o_sem</text>
  <text x="260" y="274" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">初始 = 0</text>

  <rect x="35" y="70" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="11" fill="#333">① acquire(h_sem)</text>

  <path d="M 100 100 L 100 115" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="35" y="120" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="140" text-anchor="middle" font-size="11" fill="#333">② releaseHydrogen()</text>

  <path d="M 100 150 L 100 165" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="35" y="170" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="190" text-anchor="middle" font-size="11" fill="#333">③ release(o_sem)</text>

  <path d="M 100 200 L 100 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="35" y="225" width="130" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="244" text-anchor="middle" font-size="10" fill="#888">线程结束</text>

  <path d="M 165 85 L 208 125" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="100" font-size="9" fill="#446688">acquire</text>

  <path d="M 165 185 L 208 255" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="172" y="225" font-size="9" fill="#4a7a3a">release</text>

  <rect x="355" y="70" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="90" text-anchor="middle" font-size="11" fill="#333">① acquire(o_sem) ×2</text>

  <path d="M 420 100 L 420 115" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="355" y="120" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="140" text-anchor="middle" font-size="11" fill="#333">② releaseOxygen()</text>

  <path d="M 420 150 L 420 165" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="355" y="170" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="190" text-anchor="middle" font-size="11" fill="#333">③ release(h_sem) ×2</text>

  <path d="M 420 200 L 420 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="355" y="225" width="130" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="244" text-anchor="middle" font-size="10" fill="#888">线程结束</text>

  <path d="M 355 85 L 312 125" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="325" y="100" font-size="9" fill="#b85450">acquire×2</text>

  <path d="M 355 185 L 312 125" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="325" y="170" font-size="9" fill="#d6a040">release×2</text>

  <path d="M 30 290 Q 260 288 490 290" stroke="#ddd" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="35" y="305" width="230" height="80" fill="#e8f0fe" fill-opacity="0.3" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="323" font-size="11" fill="#446688" font-weight="bold">H 线程流程：</text>
  <text x="50" y="340" font-size="10" fill="#555">acquire(h_sem) 限制每轮仅 2 个 H</text>
  <text x="50" y="355" font-size="10" fill="#555">releaseHydrogen 输出 "H"</text>
  <text x="50" y="370" font-size="10" fill="#555">release(o_sem) 通知 O 线程</text>

  <rect x="285" y="305" width="230" height="80" fill="#fce4ec" fill-opacity="0.3" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="323" font-size="11" fill="#b85450" font-weight="bold">O 线程流程：</text>
  <text x="300" y="340" font-size="10" fill="#555">acquire(o_sem)×2 等待 2 个 H</text>
  <text x="300" y="355" font-size="10" fill="#555">releaseOxygen 输出 "O"</text>
  <text x="300" y="370" font-size="10" fill="#555">release(h_sem)×2 重置下一轮</text>
</svg>
