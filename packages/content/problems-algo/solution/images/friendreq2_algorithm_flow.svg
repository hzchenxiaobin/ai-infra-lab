<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：UNION ALL → GROUP BY + COUNT → ORDER BY DESC LIMIT 1</text>

  <!-- Step 1: UNION ALL -->
  <rect x="50" y="50" width="460" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="72" font-size="11" fill="#446688" font-weight="bold">① UNION ALL：两列合并为一列</text>
  <text x="70" y="92" font-size="9.5" fill="#333">SELECT requester_id AS id FROM RequestAccepted</text>
  <text x="70" y="108" font-size="9.5" fill="#333">UNION ALL</text>
  <text x="70" y="124" font-size="9.5" fill="#333">SELECT accepter_id AS id FROM RequestAccepted</text>
  <text x="430" y="100" font-size="9" fill="#555">4 行 → 8 行</text>
  <text x="430" y="116" font-size="9" fill="#b85450" font-weight="bold">不去重！</text>

  <!-- arrow down -->
  <path d="M280 134 L280 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY + COUNT -->
  <rect x="50" y="156" width="460" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">② GROUP BY id + COUNT(*)：统计每人好友数</text>
  <text x="70" y="198" font-size="9.5" fill="#333">GROUP BY id</text>
  <text x="70" y="214" font-size="9.5" fill="#333">SELECT id, COUNT(*) AS num</text>
  <text x="400" y="195" font-size="9" fill="#555">8 行 → 4 组</text>

  <!-- mini table showing grouped result -->
  <rect x="380" y="200" width="50" height="20" fill="#fafafa" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="385" y="214" font-size="8.5" fill="#333">id | num</text>

  <!-- arrow down -->
  <path d="M280 230 L280 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: ORDER BY DESC + LIMIT 1 -->
  <rect x="50" y="252" width="460" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="274" font-size="11" fill="#d6a040" font-weight="bold">③ ORDER BY num DESC LIMIT 1：取好友最多的人</text>
  <text x="70" y="294" font-size="9.5" fill="#333">ORDER BY num DESC</text>
  <text x="70" y="310" font-size="9.5" fill="#333">LIMIT 1</text>
  <text x="400" y="290" font-size="9" fill="#555">4 行 → 1 行</text>

  <!-- arrow down -->
  <path d="M280 326 L280 346" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="180" y="348" width="200" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最终结果</text>
  <rect x="210" y="376" width="60" height="22" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="391" text-anchor="middle" font-size="10" fill="#333">id</text>
  <rect x="270" y="376" width="60" height="22" fill="#fafafa" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="391" text-anchor="middle" font-size="10" fill="#333">num</text>

  <!-- side note about UNION vs UNION ALL -->
  <rect x="50" y="156" width="460" height="0" fill="none"/>

  <!-- callout at bottom -->
  <rect x="30" y="340" width="0" height="0" fill="none"/>

  <!-- right-side note -->
  <rect x="430" y="50" width="80" height="0" fill="none"/>

  <!-- UNION vs UNION ALL warning box -->
  <rect x="50" y="348" width="120" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="366" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">⚠ UNION ALL</text>
  <text x="110" y="380" text-anchor="middle" font-size="8" fill="#555">不是 UNION！</text>
  <text x="110" y="394" text-anchor="middle" font-size="8" fill="#555">UNION 会去重</text>

  <rect x="390" y="348" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="366" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">进阶</text>
  <text x="450" y="380" text-anchor="middle" font-size="8" fill="#555">并列最多？</text>
  <text x="450" y="394" text-anchor="middle" font-size="8" fill="#555">用 RANK/DENSE_RANK</text>
</svg>
