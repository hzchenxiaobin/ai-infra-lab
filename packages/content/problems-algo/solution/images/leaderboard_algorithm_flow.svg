<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">排行榜三操作流程（方法二：双表联动）</text>
  <path d="M 300 40 Q 430 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: addScore ===== -->
  <g filter="url(#sk)">
    <rect x="20" y="55" width="260" height="345" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="150" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">addScore(p, s)</text>
  <line x1="40" y1="88" x2="260" y2="88" stroke="#4a8edb" stroke-width="1" filter="url(#sk)"/>

  <g filter="url(#sk)"><circle cx="45" cy="110" r="10" fill="#4a8edb"/></g>
  <text x="45" y="114" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1</text>
  <text x="62" y="114" font-size="11" fill="#333">查表①：p 是否已有分数？</text>

  <g filter="url(#sk)"><circle cx="45" cy="150" r="10" fill="#4a8edb"/></g>
  <text x="45" y="154" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">2</text>
  <text x="62" y="150" font-size="11" fill="#333">有 → old=score[p]</text>
  <text x="62" y="164" font-size="10" fill="#888">表② cnt[old]--（归0删键）</text>

  <g filter="url(#sk)"><circle cx="45" cy="195" r="10" fill="#4a8edb"/></g>
  <text x="45" y="199" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>
  <text x="62" y="195" font-size="11" fill="#333">无 → old=0（新玩家）</text>
  <text x="62" y="209" font-size="10" fill="#888">表②不动</text>

  <g filter="url(#sk)"><circle cx="45" cy="235" r="10" fill="#4a8edb"/></g>
  <text x="45" y="239" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">4</text>
  <text x="62" y="235" font-size="11" fill="#333">new = old + s</text>
  <text x="62" y="249" font-size="10" fill="#888">表① score[p] = new</text>

  <g filter="url(#sk)"><circle cx="45" cy="275" r="10" fill="#4a8edb"/></g>
  <text x="45" y="279" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">5</text>
  <text x="62" y="275" font-size="11" fill="#2e6e2e" font-weight="bold">表② cnt[new]++</text>

  <path d="M 45 122 L 45 138" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 45 162 L 45 183" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 45 207 L 45 223" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 45 247 L 45 263" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="62" y="305" font-size="10" fill="#7a5415">★ 两表同步：</text>
  <text x="62" y="323" font-size="10" fill="#7a5415">  旧分计数 -1，新分计数 +1</text>
  <text x="62" y="341" font-size="10" fill="#7a5415">  C++ map 增删 O(log n)</text>
  <text x="62" y="359" font-size="10" fill="#7a5415">  Py bisect 列表 O(n)</text>

  <!-- ===== Panel 2: top ===== -->
  <g filter="url(#sk)">
    <rect x="300" y="55" width="260" height="345" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">top(K)</text>
  <line x1="320" y1="88" x2="540" y2="88" stroke="#d6a040" stroke-width="1" filter="url(#sk)"/>

  <g filter="url(#sk)"><circle cx="325" cy="110" r="10" fill="#d6a040"/></g>
  <text x="325" y="114" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1</text>
  <text x="342" y="114" font-size="11" fill="#333">rem = K, ans = 0</text>

  <g filter="url(#sk)"><circle cx="325" cy="150" r="10" fill="#d6a040"/></g>
  <text x="325" y="154" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">2</text>
  <text x="342" y="150" font-size="11" fill="#333">从表②最高分往下遍历</text>
  <text x="342" y="164" font-size="9" fill="#888">map 自动降序 / 列表取末尾</text>

  <g filter="url(#sk)"><circle cx="325" cy="195" r="10" fill="#d6a040"/></g>
  <text x="325" y="199" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>
  <text x="342" y="195" font-size="11" fill="#333">take = min(人数, rem)</text>

  <g filter="url(#sk)"><circle cx="325" cy="235" r="10" fill="#d6a040"/></g>
  <text x="325" y="239" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">4</text>
  <text x="342" y="235" font-size="11" fill="#333">ans += take × 分数</text>

  <g filter="url(#sk)"><circle cx="325" cy="275" r="10" fill="#d6a040"/></g>
  <text x="325" y="279" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">5</text>
  <text x="342" y="275" font-size="11" fill="#7a5415" font-weight="bold">rem -= take；rem==0 停</text>

  <path d="M 325 122 L 325 138" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 325 162 L 325 183" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 325 207 L 325 223" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 325 247 L 325 263" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 305 275 Q 295 200 305 150" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="342" y="298" font-size="10" fill="#888">回退：未取满则回到步骤2</text>

  <text x="342" y="325" font-size="10" fill="#7a5415">★ 每步至少吃 1 人</text>
  <text x="342" y="343" font-size="10" fill="#7a5415">  最多 K 步即凑满</text>
  <text x="342" y="361" font-size="10" fill="#7a5415">  → top 是 O(K)</text>

  <!-- ===== Panel 3: reset ===== -->
  <g filter="url(#sk)">
    <rect x="580" y="55" width="260" height="345" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="710" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">reset(p)</text>
  <line x1="600" y1="88" x2="820" y2="88" stroke="#b85450" stroke-width="1" filter="url(#sk)"/>

  <g filter="url(#sk)"><circle cx="605" cy="110" r="10" fill="#b85450"/></g>
  <text x="605" y="114" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1</text>
  <text x="622" y="114" font-size="11" fill="#333">old = score[p]（表①）</text>

  <g filter="url(#sk)"><circle cx="605" cy="160" r="10" fill="#b85450"/></g>
  <text x="605" y="164" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">2</text>
  <text x="622" y="160" font-size="11" fill="#333">表② cnt[old]--</text>
  <text x="622" y="174" font-size="9" fill="#888">归 0 则删键</text>

  <g filter="url(#sk)"><circle cx="605" cy="210" r="10" fill="#b85450"/></g>
  <text x="605" y="214" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>
  <text x="622" y="210" font-size="11" fill="#b85450" font-weight="bold">表① 删键 p</text>

  <g filter="url(#sk)"><circle cx="605" cy="260" r="10" fill="#b85450"/></g>
  <text x="605" y="264" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">4</text>
  <text x="622" y="260" font-size="11" fill="#333">玩家从排行榜消失</text>
  <text x="622" y="274" font-size="9" fill="#888">再次 addScore 视作新玩家</text>

  <path d="M 605 122 L 605 148" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 605 172 L 605 198" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 605 222 L 605 248" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="622" y="310" font-size="10" fill="#7a5415">★ reset = addScore 的</text>
  <text x="622" y="328" font-size="10" fill="#7a5415">  「只减不增」特例：</text>
  <text x="622" y="346" font-size="10" fill="#7a5415">  减旧分计数 + 删哈希键</text>
  <text x="622" y="364" font-size="10" fill="#7a5415">  两表仍需同步</text>
</svg>
