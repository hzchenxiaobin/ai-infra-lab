<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [−1, 5, 2] → ok = [1,0,0]，仅 −1 保证可找</text>

  <!-- Array row -->
  <text x="40" y="58" font-size="11" fill="#888" filter="url(#rough2)">nums =</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="235" y="44" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="259" y="64" filter="url(#rough2)">−1</text>
    <rect x="290" y="44" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="314" y="64" filter="url(#rough2)">5</text>
    <rect x="345" y="44" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="369" y="64" filter="url(#rough2)">2</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="259" y="86" filter="url(#rough2)">i=0</text>
    <text x="314" y="86" filter="url(#rough2)">i=1</text>
    <text x="369" y="86" filter="url(#rough2)">i=2</text>
  </g>

  <!-- ===== Pass 1 table ===== -->
  <text x="40" y="106" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第一趟  左 → 右 （维护前缀最大 mx）</text>

  <!-- header row -->
  <rect x="30" y="112" width="540" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="55" y="127" filter="url(#rough2)">i</text>
    <text x="115" y="127" filter="url(#rough2)">nums[i]</text>
    <text x="190" y="127" filter="url(#rough2)">mx 前</text>
    <text x="305" y="127" filter="url(#rough2)">比较</text>
    <text x="420" y="127" filter="url(#rough2)">mx 后</text>
    <text x="515" y="127" filter="url(#rough2)">ok</text>
  </g>
  <!-- column separators (header) -->
  <g stroke="#446688" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.5">
    <path d="M 80 112 L 80 212" filter="url(#rough2)"/>
    <path d="M 150 112 L 150 212" filter="url(#rough2)"/>
    <path d="M 230 112 L 230 212" filter="url(#rough2)"/>
    <path d="M 380 112 L 380 212" filter="url(#rough2)"/>
    <path d="M 460 112 L 460 212" filter="url(#rough2)"/>
  </g>

  <!-- data rows -->
  <rect x="30" y="134" width="540" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="30" y="160" width="540" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="30" y="186" width="540" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- row i=0 -->
    <text x="55" y="152" filter="url(#rough2)">0</text>
    <text x="115" y="152" filter="url(#rough2)">−1</text>
    <text x="190" y="152" fill="#888" filter="url(#rough2)">−∞</text>
    <text x="305" y="152" fill="#4a7a3a" filter="url(#rough2)">−1 &lt; −∞ ?  否</text>
    <text x="420" y="152" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1</text>
    <text x="515" y="152" filter="url(#rough2)">[1,1,1]</text>
    <!-- row i=1 -->
    <text x="55" y="178" filter="url(#rough2)">1</text>
    <text x="115" y="178" filter="url(#rough2)">5</text>
    <text x="190" y="178" filter="url(#rough2)">−1</text>
    <text x="305" y="178" fill="#4a7a3a" filter="url(#rough2)">5 &lt; −1 ?  否</text>
    <text x="420" y="178" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
    <text x="515" y="178" filter="url(#rough2)">[1,1,1]</text>
    <!-- row i=2 (fails) -->
    <text x="55" y="204" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="115" y="204" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="190" y="204" filter="url(#rough2)">5</text>
    <text x="305" y="204" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 &lt; 5 ?  是 ✗</text>
    <text x="420" y="204" filter="url(#rough2)">5</text>
    <text x="515" y="204" filter="url(#rough2)">[1,1,<tspan fill="#b85450" font-weight="bold">0</tspan>]</text>
  </g>
  <!-- highlight compare cell of failing row -->
  <rect x="230" y="186" width="150" height="26" fill="#b85450" fill-opacity="0.10" stroke="none" rx="3" filter="url(#rough2)"/>

  <!-- ===== Pass 2 table ===== -->
  <text x="40" y="232" font-size="12.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">第二趟  右 → 左 （维护后缀最小 mi）</text>

  <rect x="30" y="238" width="540" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#7a5a20" font-weight="bold" text-anchor="middle">
    <text x="55" y="253" filter="url(#rough2)">i</text>
    <text x="115" y="253" filter="url(#rough2)">nums[i]</text>
    <text x="190" y="253" filter="url(#rough2)">mi 前</text>
    <text x="305" y="253" filter="url(#rough2)">比较</text>
    <text x="420" y="253" filter="url(#rough2)">mi 后</text>
    <text x="515" y="253" filter="url(#rough2)">ok</text>
  </g>
  <g stroke="#d6a040" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.5">
    <path d="M 80 238 L 80 338" filter="url(#rough2)"/>
    <path d="M 150 238 L 150 338" filter="url(#rough2)"/>
    <path d="M 230 238 L 230 338" filter="url(#rough2)"/>
    <path d="M 380 238 L 380 338" filter="url(#rough2)"/>
    <path d="M 460 238 L 460 338" filter="url(#rough2)"/>
  </g>

  <rect x="30" y="260" width="540" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="30" y="286" width="540" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="30" y="312" width="540" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- row i=2 -->
    <text x="55" y="278" filter="url(#rough2)">2</text>
    <text x="115" y="278" filter="url(#rough2)">2</text>
    <text x="190" y="278" fill="#888" filter="url(#rough2)">+∞</text>
    <text x="305" y="278" fill="#4a7a3a" filter="url(#rough2)">2 &gt; +∞ ?  否</text>
    <text x="420" y="278" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="515" y="278" filter="url(#rough2)">[1,1,<tspan fill="#b85450" font-weight="bold">0</tspan>]</text>
    <!-- row i=1 (fails) -->
    <text x="55" y="304" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="115" y="304" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
    <text x="190" y="304" filter="url(#rough2)">2</text>
    <text x="305" y="304" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 &gt; 2 ?  是 ✗</text>
    <text x="420" y="304" filter="url(#rough2)">2</text>
    <text x="515" y="304" filter="url(#rough2)">[1,<tspan fill="#b85450" font-weight="bold">0</tspan>,0]</text>
    <!-- row i=0 -->
    <text x="55" y="330" filter="url(#rough2)">0</text>
    <text x="115" y="330" filter="url(#rough2)">−1</text>
    <text x="190" y="330" filter="url(#rough2)">2</text>
    <text x="305" y="330" fill="#4a7a3a" filter="url(#rough2)">−1 &gt; 2 ?  否</text>
    <text x="420" y="330" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1</text>
    <text x="515" y="330" filter="url(#rough2)">[1,0,0]</text>
  </g>
  <rect x="230" y="286" width="150" height="26" fill="#b85450" fill-opacity="0.10" stroke="none" rx="3" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="30" y="350" width="540" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="371" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ok = [1, 0, 0]   →   ans = 1（仅 −1 保证可找）</text>

  <!-- Adversarial verification -->
  <text x="40" y="402" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">对手视角验证</text>

  <rect x="30" y="410" width="540" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="44" y="431" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 不保证 ✗：</text>
  <text x="124" y="431" font-size="11" fill="#7a3a3a" filter="url(#rough2)">对手选 2 → 2&lt;5 → 移除 2 及其左 → [−1,5,2] 全清空 → false</text>

  <rect x="30" y="448" width="540" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="44" y="469" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 不保证 ✗：</text>
  <text x="124" y="469" font-size="11" fill="#7a3a3a" filter="url(#rough2)">对手选 5 → 5&gt;2 → 移除 5 及其右 → 剩 [−1] → −1&lt;2 移除 → false</text>

  <rect x="30" y="486" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="44" y="507" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1 保证 ✓：</text>
  <text x="118" y="507" font-size="11" fill="#3a5a2a" filter="url(#rough2)">选 5/2 仅移除其右，−1 在左存活；选 −1 直接命中 → 必找到</text>
</svg>
