<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 332" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="332" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "the sky is blue"</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#aaa">同色 = 同一个单词，观察它的位置与字母如何变化</text>

  <!-- ============ 第 1 行：原串 the sky is blue ============ -->
  <text x="50" y="60" font-size="11" fill="#888" font-weight="bold">① 原串（已无多余空格）</text>
  <!-- the (blue) i=0,1,2 -->
  <rect x="50"  y="66" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66"  y="86" text-anchor="middle" font-size="13" fill="#333">t</text>
  <rect x="82"  y="66" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98"  y="86" text-anchor="middle" font-size="13" fill="#333">h</text>
  <rect x="114" y="66" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="86" text-anchor="middle" font-size="13" fill="#333">e</text>
  <!-- space -->
  <rect x="146" y="66" width="32" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="86" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <!-- sky (green) i=4,5,6 -->
  <rect x="178" y="66" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="86" text-anchor="middle" font-size="13" fill="#333">s</text>
  <rect x="210" y="66" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="86" text-anchor="middle" font-size="13" fill="#333">k</text>
  <rect x="242" y="66" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="86" text-anchor="middle" font-size="13" fill="#333">y</text>
  <!-- space -->
  <rect x="274" y="66" width="32" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="86" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <!-- is (orange) i=8,9 -->
  <rect x="306" y="66" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="86" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="338" y="66" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="86" text-anchor="middle" font-size="13" fill="#333">s</text>
  <!-- space -->
  <rect x="370" y="66" width="32" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="86" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <!-- blue (pink) i=11,12,13,14 -->
  <rect x="402" y="66" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="86" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="434" y="66" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="86" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="466" y="66" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="482" y="86" text-anchor="middle" font-size="13" fill="#333">u</text>
  <rect x="498" y="66" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="514" y="86" text-anchor="middle" font-size="13" fill="#333">e</text>

  <!-- arrow + label between row1 and row2 -->
  <path d="M 280 100 L 280 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="295" y="110" font-size="10.5" fill="#d6a040" font-weight="bold">整体翻转 reverse(0,n)</text>

  <!-- ============ 第 2 行：整体翻转后 eulb si yks eht ============ -->
  <text x="50" y="128" font-size="11" fill="#888" font-weight="bold">② 整体翻转后</text>
  <!-- eulb (pink) -->
  <rect x="50"  y="134" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66"  y="154" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="82"  y="134" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98"  y="154" text-anchor="middle" font-size="13" fill="#333">u</text>
  <rect x="114" y="134" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="154" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="146" y="134" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="154" text-anchor="middle" font-size="13" fill="#333">b</text>
  <!-- space -->
  <rect x="178" y="134" width="32" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="154" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <!-- si (orange) -->
  <rect x="210" y="134" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="154" text-anchor="middle" font-size="13" fill="#333">s</text>
  <rect x="242" y="134" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="154" text-anchor="middle" font-size="13" fill="#333">i</text>
  <!-- space -->
  <rect x="274" y="134" width="32" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="154" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <!-- yks (green) -->
  <rect x="306" y="134" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="154" text-anchor="middle" font-size="13" fill="#333">y</text>
  <rect x="338" y="134" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="154" text-anchor="middle" font-size="13" fill="#333">k</text>
  <rect x="370" y="134" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="154" text-anchor="middle" font-size="13" fill="#333">s</text>
  <!-- space -->
  <rect x="402" y="134" width="32" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="154" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <!-- eht (blue) -->
  <rect x="434" y="134" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="154" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="466" y="134" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="482" y="154" text-anchor="middle" font-size="13" fill="#333">h</text>
  <rect x="498" y="134" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="514" y="154" text-anchor="middle" font-size="13" fill="#333">t</text>

  <!-- arrow + label between row2 and row3 -->
  <path d="M 280 168 L 280 180" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="295" y="178" font-size="10.5" fill="#4a7a3a" font-weight="bold">逐词翻转 reverse(每个单词)</text>

  <!-- ============ 第 3 行：逐词翻转后 blue is sky the ============ -->
  <text x="50" y="196" font-size="11" fill="#888" font-weight="bold">③ 逐词翻转后 = 结果</text>
  <!-- blue (pink) -->
  <rect x="50"  y="202" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="66"  y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="82"  y="202" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98"  y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <rect x="114" y="202" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">u</text>
  <rect x="146" y="202" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <!-- space -->
  <rect x="178" y="202" width="32" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="222" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <!-- is (orange) -->
  <rect x="210" y="202" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i</text>
  <rect x="242" y="202" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s</text>
  <!-- space -->
  <rect x="274" y="202" width="32" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="222" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <!-- sky (green) -->
  <rect x="306" y="202" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s</text>
  <rect x="338" y="202" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">k</text>
  <rect x="370" y="202" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">y</text>
  <!-- space -->
  <rect x="402" y="202" width="32" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="222" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <!-- the (blue) -->
  <rect x="434" y="202" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t</text>
  <rect x="466" y="202" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="482" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">h</text>
  <rect x="498" y="202" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="514" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>

  <!-- ============ 说明 ============ -->
  <rect x="30" y="244" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">粉色 "blue"：①在最右 → ②变 eulb 跑到最左 → ③字母还原为 blue，位置留在最左</text>
  <text x="280" y="279" text-anchor="middle" font-size="11" fill="#888">字母被翻了两次（抵消），单词顺序被翻了一次（保留）</text>

  <!-- ============ 颜色图例 ============ -->
  <rect x="60"  y="296" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="84"  y="307" font-size="10.5" fill="#555">the</text>
  <rect x="130" y="296" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="154" y="307" font-size="10.5" fill="#555">sky</text>
  <rect x="200" y="296" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="224" y="307" font-size="10.5" fill="#555">is</text>
  <rect x="265" y="296" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="289" y="307" font-size="10.5" fill="#555">blue</text>
  <rect x="335" y="296" width="18" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="359" y="307" font-size="10.5" fill="#555">· = 空格</text>
  <text x="430" y="307" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 结果：blue is sky the</text>
</svg>
