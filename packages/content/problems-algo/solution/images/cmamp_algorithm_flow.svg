<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 逐对验证</text>

  <!-- Step 1: sort -->
  <rect x="60" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 对数组 arr 排序</text>

  <!-- arrow down -->
  <path d="M 160 90 L 160 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute d -->
  <rect x="60" y="112" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② d = arr[1] − arr[0]</text>

  <!-- arrow down -->
  <path d="M 160 154 L 160 172" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop check -->
  <rect x="40" y="176" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ for i = 2 to n−1</text>

  <!-- arrow right to decision -->
  <path d="M 280 196 L 318 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="380,166 440,196 380,226 320,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="193" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">arr[i]−arr[i−1]</text>
  <text x="380" y="207" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">== d ?</text>

  <!-- No branch: return false -->
  <path d="M 440 196 L 480 196" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="480" y="178" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="515" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- Yes branch: continue -->
  <path d="M 380 226 L 380 250" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="242" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="380" y="266" text-anchor="middle" font-size="10" fill="#888">i++，继续</text>

  <!-- loop back arrow -->
  <path d="M 380 272 L 380 290 L 160 290 L 160 216" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop ends -->
  <path d="M 160 216 L 160 310" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="300" font-size="10" fill="#888">循环结束</text>

  <!-- Step 4: return true -->
  <rect x="60" y="314" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="339" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ 全部通过 → return true</text>

  <!-- Note box -->
  <rect x="320" y="314" width="210" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="334" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">⚠️ 边界</text>
  <text x="425" y="350" text-anchor="middle" font-size="10" fill="#888">n ≤ 2 时任意数列</text>
  <text x="425" y="364" text-anchor="middle" font-size="10" fill="#888">必为等差，直接 true</text>
</svg>
