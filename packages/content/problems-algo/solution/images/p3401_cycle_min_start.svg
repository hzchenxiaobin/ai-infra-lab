<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：出入度皆 1 才在环上，每个环只认「最小成员」那趟</text>
  <text x="290" y="36" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">删掉出入度 ≠ 1 的边 → 图退化为不相交的简单路径 + 简单环；沿唯一后继走回起点即环</text>

  <text x="155" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">链 ①：员工 1→2→3→1（长 3，总价值 90）</text>

  <ellipse cx="100" cy="105" rx="17" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <ellipse cx="225" cy="105" rx="17" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <ellipse cx="162" cy="205" rx="17" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M 118 105 L 205 105" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="97" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">20</text>
  <path d="M 214 119 L 174 189" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="158" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">30</text>
  <path d="M 151 191 L 111 121" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="158" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">40</text>

  <text x="445" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">链 ②：员工 4⇄5（长 2，总价值 60）</text>

  <ellipse cx="385" cy="105" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <ellipse cx="505" cy="105" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <path d="M 392 91 Q 445 58 497 91" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="66" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)"></text>
  <text x="478" y="72" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">25</text>
  <path d="M 497 119 Q 445 152 392 119" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="146" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">35</text>

  <rect x="30" y="238" width="272" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="166" y="258" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">同一个环，k 个成员 = k 趟走圈</text>
  <text x="44" y="280" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">从 1 出发：路径最小 = 1 = start → ✓ 唯一保留</text>
  <text x="44" y="300" font-size="9.5" fill="#b85450" filter="url(#rough2)">从 2 出发：路径最小 = 1 ≠ 2 → ✗ 丢弃</text>
  <text x="44" y="320" font-size="9.5" fill="#b85450" filter="url(#rough2)">从 3 出发：路径最小 = 1 ≠ 3 → ✗ 丢弃</text>

  <rect x="320" y="238" width="230" height="102" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">「正好一份」是硬约束</text>
  <text x="336" y="280" font-size="9.5" fill="#333" filter="url(#rough2)">添一条边 2→9：员工 2 出度 = 2</text>
  <text x="336" y="300" font-size="9.5" fill="#333" filter="url(#rough2)">违反「正好向一位员工送一份」</text>
  <text x="336" y="320" font-size="9.5" fill="#b85450" filter="url(#rough2)">→ 2 出局，链 ① 整体消失</text>
  <path d="M 362 332 Q 280 352 240 330" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <rect x="30" y="354" width="520" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">min_seen 滚动记录路径最小 id：环的路径必覆盖全体成员 → min_seen = 环的最小成员</text>
  <text x="290" y="396" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">「cur = start AND min_seen = start」一步完成：识别环 + 每环恰好一行</text>
</svg>
