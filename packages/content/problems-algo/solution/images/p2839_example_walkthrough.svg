<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：从轨道视角看两个示例（+ 一个陷阱）</text>

  <!-- Example 1: abcd -> cbad -> cdab -->
  <text x="60" y="62" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：s1 = "abcd" → s2 = "cdab" ✓</text>

  <rect x="60" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="77" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="96" y="72" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="113" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="132" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="149" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="168" y="72" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="185" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <path d="M 212 89 L 252 89" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="80" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">swap(0,2)</text>

  <rect x="260" y="72" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="277" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="296" y="72" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="313" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="332" y="72" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="349" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="368" y="72" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="385" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <path d="M 412 89 L 452 89" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">swap(1,3)</text>

  <rect x="460" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="477" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="496" y="72" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="513" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="532" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="549" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="568" y="72" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="585" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <text x="310" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">"cdab" = s2，两组各自换一次即命中 → 返回 true ✓（橙色格 = 本次被交换的位置）</text>

  <!-- Example 2: even group mismatch -->
  <text x="60" y="166" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：s1 = "abcd" vs s2 = "dacb" ✗</text>

  <rect x="60" y="178" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">偶数位轨道 {0, 2}</text>
  <text x="180" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s1 给出 {a, c}，s2 给出 {d, b}</text>

  <path d="M 310 207 L 350 207" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 336 196 L 352 214 M 352 196 L 336 214" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="360" y="178" width="200" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">多重集合不相等</text>
  <text x="460" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a、c 困在偶数位，变不出 d、b</text>

  <text x="310" y="260" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">第一步就卡住 → 返回 false ✗</text>

  <!-- Trap: sorted equal but not reachable -->
  <text x="60" y="296" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">陷阱：s1 = "abab" vs s2 = "abba" —— 整体排序比较会误判</text>

  <rect x="60" y="308" width="250" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="185" y="330" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">整体多重集合：都是 {a,a,b,b}</text>
  <text x="185" y="350" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">sorted(s1) == sorted(s2) 通过</text>
  <text x="185" y="366" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">但这只是必要条件！</text>

  <rect x="330" y="308" width="230" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="330" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">分组再看：偶数位 {0,2}</text>
  <text x="445" y="350" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s1 = {a, b}，s2 = {a, a}</text>
  <text x="445" y="366" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不相等 → 答案是 false ✗</text>

  <text x="310" y="402" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">"abab" 两组字符各自成对相同，怎么换都纹丝不动——必须按奇偶分组分别比较</text>
</svg>
