<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预处理 supply → 逐词统计比较 → 累加好词长度</text>

  <!-- Phase 0: preprocess -->
  <text x="40" y="48" font-size="11" fill="#446688" font-weight="bold">预处理（只做一次）：统计 chars 频率</text>

  <rect x="120" y="58" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">遍历 chars，supply[ch−'a'] ++</text>

  <path d="M 270 88 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 1 label -->
  <text x="40" y="120" font-size="11" fill="#4a7a3a" font-weight="bold">主循环：遍历每个单词 words[i]</text>

  <!-- Start -->
  <ellipse cx="270" cy="138" rx="120" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="12" fill="#333">开始: ans = 0, i = 0</text>

  <path d="M 270 156 L 270 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: more words? -->
  <polygon points="270,170 390,200 270,230 150,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="12" fill="#333">还有单词</text>
  <text x="270" y="212" text-anchor="middle" font-size="11" fill="#666">words[i] ?</text>

  <!-- No -> right to end -->
  <path d="M 390 200 L 470 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="192" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <ellipse cx="490" cy="200" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="196" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="490" y="210" text-anchor="middle" font-size="11" fill="#333">ans</text>

  <!-- Yes -> down -->
  <path d="M 270 230 L 270 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="242" font-size="11" fill="#82b366">是</text>

  <!-- Diamond 2: length prune -->
  <polygon points="270,248 390,278 270,308 150,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="12" fill="#333">len(w) &gt;</text>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#666">len(chars) ?</text>

  <!-- Yes (too long) -> left skip -->
  <path d="M 150 278 L 100 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="270" text-anchor="middle" font-size="11" fill="#b85450">是</text>

  <rect x="36" y="266" width="64" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="68" y="282" text-anchor="middle" font-size="11" fill="#333">跳过</text>

  <!-- loop back from skip to diamond1 -->
  <path d="M 68 266 L 68 120 L 270 120 L 270 138" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="195" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 50 195)">下一词</text>

  <!-- No (length ok) -> down -->
  <path d="M 270 308 L 270 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="320" font-size="11" fill="#82b366">否</text>

  <!-- Count need box -->
  <rect x="110" y="326" width="320" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="12" fill="#333">统计 need[26]：遍历 w 的每个字符</text>

  <path d="M 270 356 L 270 368" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compare box -->
  <rect x="90" y="370" width="360" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="12" fill="#333">遍历 c=0..25：若 need[c] &gt; supply[c] 则 bad</text>

  <path d="M 270 400 L 270 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 3: good? -->
  <polygon points="270,414 360,438 270,462 180,438" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="442" text-anchor="middle" font-size="12" fill="#333">好词 ?</text>

  <!-- Yes -> left accumulate -->
  <path d="M 180 438 L 130 438" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="430" text-anchor="middle" font-size="11" fill="#82b366">是</text>

  <rect x="36" y="426" width="94" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="83" y="442" text-anchor="middle" font-size="11" fill="#333">ans += len(w)</text>

  <!-- No -> right -->
  <path d="M 360 438 L 410 438" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="430" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <rect x="410" y="426" width="80" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="450" y="442" text-anchor="middle" font-size="11" fill="#888">不计</text>

  <!-- loop back to diamond1 (from both branches) -->
  <path d="M 83 426 L 83 120 L 270 120" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 450 426 L 450 120 L 270 120" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- summary -->
  <text x="270" y="500" text-anchor="middle" font-size="10" fill="#888">预处理 O(L_chars) + 主循环 O(Σ L_w) → 总 O(L_chars + Σ L_w)；空间 O(26) = O(1)</text>
</svg>
