<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 368" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="368" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐位竖式看三种命运</text>
  <text x="290" y="38" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">橙色 = 要关掉的 1（n=1→k=0）· 绿色 = 双方一致 · 红色 = 造不出的 1（k=1 但 n=0）</text>

  <!-- 示例 1：n=13, k=4 -->
  <rect x="22" y="50" width="536" height="90" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="70" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1</text>
  <text x="44" y="88" font-size="10" fill="#555" filter="url(#rough2)">n = 13</text>
  <text x="44" y="106" font-size="10" fill="#555" filter="url(#rough2)">k = 4</text>

  <text x="136" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit3</text>
  <text x="176" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit2</text>
  <text x="216" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit1</text>
  <text x="256" y="60" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit0</text>

  <rect x="120" y="64" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="82" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="64" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="200" y="64" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="82" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="240" y="64" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="82" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="120" y="98" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="116" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="160" y="98" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="200" y="98" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="116" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="240" y="98" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="116" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="320" y="74" font-size="10.5" fill="#555" filter="url(#rough2)">k &amp; ~n = 0000₂ = 0 → 可行</text>
  <text x="320" y="96" font-size="10.5" fill="#555" filter="url(#rough2)">n ⊕ k = 1001₂（两个差异位）</text>
  <text x="320" y="120" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">popcount = 2 → 答案 2</text>

  <!-- 示例 2：n=21, k=21 -->
  <rect x="22" y="148" width="536" height="90" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="168" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2</text>
  <text x="44" y="186" font-size="10" fill="#555" filter="url(#rough2)">n = 21</text>
  <text x="44" y="204" font-size="10" fill="#555" filter="url(#rough2)">k = 21</text>

  <text x="136" y="158" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit4</text>
  <text x="176" y="158" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit3</text>
  <text x="216" y="158" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit2</text>
  <text x="256" y="158" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit1</text>
  <text x="296" y="158" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit0</text>

  <rect x="120" y="162" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="162" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="180" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="200" y="162" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="240" y="162" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="180" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="280" y="162" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="120" y="196" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="196" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="214" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="200" y="196" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="240" y="196" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="214" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="280" y="196" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="336" y="172" font-size="10.5" fill="#555" filter="url(#rough2)">k &amp; ~n = 0 → 可行</text>
  <text x="336" y="194" font-size="10.5" fill="#555" filter="url(#rough2)">n ⊕ k = 00000₂（零差异）</text>
  <text x="336" y="218" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">popcount = 0 → 答案 0</text>

  <!-- 示例 3：n=14, k=13 -->
  <rect x="22" y="246" width="536" height="90" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="266" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3</text>
  <text x="44" y="284" font-size="10" fill="#555" filter="url(#rough2)">n = 14</text>
  <text x="44" y="302" font-size="10" fill="#555" filter="url(#rough2)">k = 13</text>

  <text x="136" y="256" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit3</text>
  <text x="176" y="256" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit2</text>
  <text x="216" y="256" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit1</text>
  <text x="256" y="256" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">bit0</text>

  <rect x="120" y="260" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="260" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="200" y="260" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="278" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="240" y="260" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="278" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <rect x="120" y="294" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="160" y="294" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="200" y="294" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="312" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="240" y="294" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="320" y="270" font-size="10.5" fill="#b85450" filter="url(#rough2)">k &amp; ~n = 0001₂ ≠ 0 → 不可行</text>
  <text x="320" y="292" font-size="10.5" fill="#b85450" filter="url(#rough2)">bit0：k = 1 但 n = 0</text>
  <text x="320" y="316" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 变不出 1 → 返回 -1</text>
</svg>
