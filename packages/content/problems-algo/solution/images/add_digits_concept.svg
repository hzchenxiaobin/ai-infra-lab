<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：反复数位求和 → 数字根</text>

  <!-- ===== Panel A: iterative process for 38 ===== -->
  <text x="40" y="52" font-size="12" fill="#446688" font-weight="bold">模拟法：38 怎么变成 2</text>

  <!-- Row 1: 38 -> 3 + 8 = 11 -->
  <rect x="44" y="62" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">38</text>

  <text x="112" y="83" font-size="13" fill="#888">→</text>

  <rect x="128" y="62" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="83" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
  <text x="168" y="83" font-size="13" fill="#888">+</text>
  <rect x="180" y="62" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="196" y="83" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">8</text>

  <text x="224" y="83" font-size="13" fill="#888">=</text>

  <rect x="240" y="62" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="268" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">11</text>

  <text x="310" y="83" font-size="10.5" fill="#888">两位数，继续</text>

  <!-- arrow down -->
  <path d="M 268 96 Q 268 104 268 112" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: 11 -> 1 + 1 = 2 -->
  <rect x="44" y="118" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="139" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">11</text>

  <text x="112" y="139" font-size="13" fill="#888">→</text>

  <rect x="128" y="118" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="139" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="168" y="139" font-size="13" fill="#888">+</text>
  <rect x="180" y="118" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="196" y="139" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <text x="224" y="139" font-size="13" fill="#888">=</text>

  <rect x="240" y="118" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="268" y="139" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="310" y="139" font-size="10.5" fill="#4a7a3a" font-weight="bold">一位数，完成 ✓</text>

  <!-- divider -->
  <line x1="40" y1="170" x2="500" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel B: O(1) formula insight ===== -->
  <text x="40" y="192" font-size="12" fill="#4a7a3a" font-weight="bold">数学法：一次取模直达答案</text>

  <!-- 38 mod 9 = 2 -->
  <rect x="44" y="206" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="227" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">38</text>

  <text x="112" y="227" font-size="12.5" fill="#888">mod 9 =</text>

  <rect x="184" y="206" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="206" y="227" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="240" y="227" font-size="11" fill="#4a7a3a" font-weight="bold">← 与迭代结果一致！</text>

  <!-- formula box -->
  <rect x="44" y="258" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="264" y="282" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">数字根公式（num &gt; 0）</text>
  <text x="264" y="302" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">dr(n) = 1 + (n − 1) mod 9</text>

  <!-- verification: 1 + (38-1) % 9 = 1 + 37 % 9 = 1 + 1 = 2 -->
  <text x="40" y="338" font-size="11.5" fill="#555">验证：</text>
  <text x="84" y="338" font-size="11.5" fill="#333" font-weight="bold">1 + (38−1) mod 9 = 1 + 37 mod 9 = 1 + 1 =</text>
  <rect x="372" y="324" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="388" y="339" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- bottom note -->
  <rect x="100" y="362" width="340" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">迭代 2 轮 → O(1) 一次取模，结果相同</text>
</svg>
