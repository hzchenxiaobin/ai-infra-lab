<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,10,3,3,3]，k = 3</text>

  <!-- 表头 -->
  <rect x="20" y="40" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="120" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">取出 v（堆顶）</text>
  <text x="210" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">score</text>
  <text x="300" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">push ⌈v/3⌉</text>
  <text x="430" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">堆内剩余（降序）</text>

  <!-- 初始堆 -->
  <rect x="20" y="68" width="520" height="22" fill="#f3f3f3" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="83" font-size="10" fill="#888" font-weight="bold">初始</text>
  <text x="430" y="83" text-anchor="middle" font-size="10" fill="#666">{10, 3, 3, 3, 1}</text>

  <!-- 步1 -->
  <rect x="20" y="92" width="520" height="44" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="36" y="104" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="120" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="92" y="100" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="120" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">10</text>
  <text x="210" y="120" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">10</text>
  <rect x="272" y="100" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="120" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="430" y="120" text-anchor="middle" font-size="10" fill="#333">{4, 3, 3, 3, 1}</text>

  <!-- 步2 -->
  <rect x="20" y="138" width="520" height="44" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="36" y="150" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="92" y="146" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="166" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <text x="210" y="166" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">14</text>
  <rect x="272" y="146" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="166" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="430" y="166" text-anchor="middle" font-size="10" fill="#333">{3, 3, 3, 2, 1}</text>

  <!-- 步3 -->
  <rect x="20" y="184" width="520" height="44" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="36" y="196" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="92" y="192" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="210" y="212" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">17</text>
  <rect x="272" y="192" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="212" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="430" y="212" text-anchor="middle" font-size="10" fill="#333">{3, 3, 2, 1, 1}</text>

  <!-- 算式 -->
  <rect x="20" y="240" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="265" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">score = 10 + 4 + 3 = 17 ✓</text>

  <!-- 说明 -->
  <rect x="20" y="292" width="520" height="74" fill="none" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="30" y="310" font-size="10.5" fill="#888" font-weight="bold">要点</text>
  <text x="30" y="326" font-size="10" fill="#666">① 每步取堆顶最大值：第 1 步取 10，回写 ⌈10/3⌉=4；第 2 步 4 仍是最大，再取</text>
  <text x="30" y="342" font-size="10" fill="#666">② ⌈v/3⌉ 用整数算式 (v+2)/3：v=10→4，v=4→2，v=3→1，v=1→1（到 1 后恒为 1，堆不空）</text>
  <text x="30" y="358" font-size="10" fill="#666">③ 红色=取出累加，绿色=回写压栈；score 用 64 位，最坏 k·10⁹ ≈ 10¹⁴</text>
</svg>
