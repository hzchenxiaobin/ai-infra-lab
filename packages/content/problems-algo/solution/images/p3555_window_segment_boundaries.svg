<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">窗口内最短排序段 = 两个「越界位置」[a, b]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 nums = [1,3,2,4,5]，k = 3 的窗口 [1,3,2] 为例</text>

  <!-- 窗口括号线 -->
  <path d="M 46 62 L 46 54 L 246 54 L 246 62" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">滑动窗口 [l,r] = [0,2]</text>

  <!-- 五个格子 -->
  <rect x="46" y="66" width="66" height="58" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="80" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#0</text>
  <text x="79" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="#555" filter="url(#rough2)">1</text>

  <rect x="124" y="66" width="66" height="58" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="157" y="80" text-anchor="middle" font-size="9" fill="#8a6d3a" filter="url(#rough2)">#1</text>
  <text x="157" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">3</text>
  <ellipse cx="124" cy="66" rx="11" ry="11" fill="#d6a040" filter="url(#rough2)"/>
  <text x="124" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff" filter="url(#rough2)">a</text>

  <rect x="202" y="66" width="66" height="58" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="235" y="80" text-anchor="middle" font-size="9" fill="#a04a48" filter="url(#rough2)">#2</text>
  <text x="235" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="#a04a48" filter="url(#rough2)">2</text>
  <ellipse cx="268" cy="66" rx="11" ry="11" fill="#b85450" filter="url(#rough2)"/>
  <text x="268" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff" filter="url(#rough2)">b</text>

  <rect x="280" y="66" width="66" height="58" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="313" y="80" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#3</text>
  <text x="313" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="#555" filter="url(#rough2)">4</text>

  <rect x="358" y="66" width="66" height="58" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="391" y="80" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">#4</text>
  <text x="391" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="#555" filter="url(#rough2)">5</text>

  <!-- 越界箭头：3 的右边有 2 -->
  <path d="M 172 92 Q 196 132 224 96" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="198" y="140" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">2 &lt; 3</text>

  <!-- 两个判定框 -->
  <rect x="40" y="150" width="222" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="151" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">a：最靠左的「右边存在更小」</text>
  <text x="151" y="188" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">3 的右边有更小的 2 ⇒ 下标 1 必须进段</text>
  <path d="M 151 150 L 151 132" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="274" y="150" width="210" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="379" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48" filter="url(#rough2)">b：最靠右的「左边存在更大」</text>
  <text x="379" y="188" text-anchor="middle" font-size="10" fill="#a04a48" filter="url(#rough2)">2 的左边有更大的 3 ⇒ 下标 2 必须进段</text>
  <path d="M 379 150 L 250 128" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 段括号与答案 -->
  <path d="M 124 226 L 124 218 L 268 218 L 268 226" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="290" y="206" width="196" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">排序 [a,b]=[1,2] 即 [3,2]</text>
  <text x="388" y="242" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">答案 = b − a + 1 = 2</text>
  <text x="196" y="242" text-anchor="middle" font-size="10.5" fill="#a04a48" filter="url(#rough2)">最短排序段</text>

  <!-- 三个窗口的答案条 -->
  <text x="46" y="276" font-size="11" fill="#888" filter="url(#rough2)">k = 3 的全部三个窗口：</text>

  <rect x="46" y="286" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="73" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1 3 2</text>
  <rect x="104" y="286" width="34" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="121" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">2</text>

  <rect x="168" y="286" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="195" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">3 2 4</text>
  <rect x="226" y="286" width="34" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="243" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">2</text>

  <rect x="290" y="286" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="317" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">2 4 5</text>
  <rect x="348" y="286" width="34" height="34" rx="9" fill="#eeeeee" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#rough2)">0</text>
  <text x="398" y="308" font-size="9.5" fill="#888" filter="url(#rough2)">已有序 → 0</text>

  <!-- 门槛化公式 -->
  <rect x="40" y="336" width="444" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="356" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">a(l,r) = min{ i ≥ l : ns[i] ≤ r }（ns = 右侧第一个更小）</text>
  <text x="262" y="376" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">b(l,r) = max{ j ≤ r : pg[j] ≥ l }（pg = 左侧第一个更大）—— 窗口只改门槛</text>
</svg>
