<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：以队长为锚——相交人数 = 两个前缀计数之差</text>

  <!-- 面板一：队长为锚 -->
  <g filter="url(#rough2)">
    <rect x="24" y="34" width="512" height="170" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="36" y="56" font-size="11.5" fill="#33506b" font-weight="bold">① 团队以「队长」为锚——成员只需与队长相交（示例 3）</text>

    <rect x="125" y="66" width="275" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="262" y="81" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">员工 0（队长）[3, 8]</text>

    <rect x="180" y="98" width="55" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="245" y="113" font-size="10.5" fill="#33506b">员工 1 [4,5]　✓ 与队长相交</text>

    <rect x="290" y="130" width="55" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="355" y="145" font-size="10.5" fill="#33506b">员工 2 [6,7]　✓ 与队长相交</text>

    <path d="M70 158 L460 158" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="70" y1="158" x2="70" y2="163" stroke="#446688" stroke-width="1.2"/>
    <line x1="125" y1="158" x2="125" y2="163" stroke="#446688" stroke-width="1.2"/>
    <line x1="180" y1="158" x2="180" y2="163" stroke="#446688" stroke-width="1.2"/>
    <line x1="235" y1="158" x2="235" y2="163" stroke="#446688" stroke-width="1.2"/>
    <line x1="290" y1="158" x2="290" y2="163" stroke="#446688" stroke-width="1.2"/>
    <line x1="345" y1="158" x2="345" y2="163" stroke="#446688" stroke-width="1.2"/>
    <line x1="400" y1="158" x2="400" y2="163" stroke="#446688" stroke-width="1.2"/>
    <line x1="455" y1="158" x2="455" y2="163" stroke="#446688" stroke-width="1.2"/>
    <text x="70" y="176" text-anchor="middle" font-size="9.5" fill="#999">2</text>
    <text x="125" y="176" text-anchor="middle" font-size="9.5" fill="#999">3</text>
    <text x="180" y="176" text-anchor="middle" font-size="9.5" fill="#999">4</text>
    <text x="235" y="176" text-anchor="middle" font-size="9.5" fill="#999">5</text>
    <text x="290" y="176" text-anchor="middle" font-size="9.5" fill="#999">6</text>
    <text x="345" y="176" text-anchor="middle" font-size="9.5" fill="#999">7</text>
    <text x="400" y="176" text-anchor="middle" font-size="9.5" fill="#999">8</text>
    <text x="455" y="176" text-anchor="middle" font-size="9.5" fill="#999">9</text>

    <text x="36" y="194" font-size="10.5" fill="#33506b" font-weight="bold">员工 1 与员工 2 互不相交 ✗——但都与队长相交 ⇒ 全员入队，规模 3</text>
  </g>

  <!-- 面板二：前缀计数分解 -->
  <g filter="url(#rough2)">
    <rect x="24" y="210" width="512" height="134" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="36" y="230" font-size="11.5" fill="#2f5d24" font-weight="bold">② 队长 i 的相交人数 = 两个前缀计数之差（示例 3 取队长 i = 0）</text>

    <text x="36" y="262" font-size="10.5" fill="#2f5d24">排序起点 S</text>
    <rect x="150" y="246" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="192" y="246" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="234" y="246" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="167" y="262" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="209" y="262" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="251" y="262" text-anchor="middle" font-size="12" fill="#333">6</text>
    <text x="286" y="262" font-size="10.5" fill="#2f5d24" font-weight="bold">s ≤ e(0) = 8 → 3 个（upper_bound）</text>

    <text x="36" y="306" font-size="10.5" fill="#2f5d24">排序终点 E</text>
    <rect x="150" y="290" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="192" y="290" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="234" y="290" width="34" height="24" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="167" y="306" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="209" y="306" text-anchor="middle" font-size="12" fill="#333">7</text>
    <text x="251" y="306" text-anchor="middle" font-size="12" fill="#333">8</text>
    <text x="286" y="306" font-size="10.5" fill="#2f5d24" font-weight="bold">e &lt; s(0) = 3 → 0 个（lower_bound）</text>

    <text x="36" y="336" font-size="11.5" fill="#2f5d24" font-weight="bold">count(0) = 3 − 0 = 3 ⇒ 最大团队 3 人（答案）</text>
  </g>

  <!-- 底部：闭区间语义与口径区分 -->
  <g filter="url(#rough2)">
    <rect x="24" y="352" width="512" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">闭区间：端点相接算重叠（[1,3] 与 [3,5] 在时刻 3 相交）；队长自身恒被计入 ⇒ ans ≥ 1</text>
    <text x="280" y="384" text-anchor="middle" font-size="10.5" fill="#8a3030">与「最多同时重叠」不同：本例并发峰值仅 2 人，队长口径是 3 人</text>
  </g>
</svg>
