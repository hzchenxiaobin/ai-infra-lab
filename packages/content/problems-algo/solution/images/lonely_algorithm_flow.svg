<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建频次表 → 遍历键过滤</text>

  <!-- Step 1: build table -->
  <rect x="60" y="50" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第一遍：建频次表</text>
  <text x="160" y="90" text-anchor="middle" font-size="11" fill="#555">for x in nums: cnt[x] += 1</text>
  <text x="160" y="104" text-anchor="middle" font-size="10" fill="#888">O(n)</text>

  <path d="M 160 110 L 160 132" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="136" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">频次表 cnt 就绪</text>

  <path d="M 160 180 L 160 202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: iterate keys -->
  <rect x="60" y="206" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第二遍：遍历 cnt 的键 x</text>
  <text x="160" y="246" text-anchor="middle" font-size="11" fill="#555">for x in cnt.keys()</text>
  <text x="160" y="260" text-anchor="middle" font-size="10" fill="#888">O(不同值数) ≤ O(n)</text>

  <path d="M 260 234 L 310 234" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond 1: cnt[x] == 1? -->
  <polygon points="380,196 450,234 380,272 310,234" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt[x]</text>
  <text x="380" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">== 1 ?</text>

  <!-- No branch (down) -->
  <path d="M 380 272 L 380 306" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="292" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="330" y="310" width="100" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="380" y="329" text-anchor="middle" font-size="11" fill="#888">跳过 x</text>

  <!-- Yes branch (right) -->
  <path d="M 450 234 L 500 234" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="462" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision diamond 2: neighbors absent? -->
  <polygon points="570,190 640,234 570,278 500,234" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="570" y="216" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">cnt[x+1]==0</text>
  <text x="570" y="230" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">且</text>
  <text x="570" y="244" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">cnt[x−1]==0</text>
  <text x="570" y="258" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">?</text>

  <!-- Yes branch from diamond 2 (down to ans) -->
  <path d="M 570 278 Q 570 350 480 380" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="584" y="320" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="370" y="370" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="393" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans.append(x) ⭐ 孤独</text>

  <!-- No branch from diamond 2 (down to skip) -->
  <path d="M 640 234 Q 660 234 660 280 Q 660 324 510 324" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="648" y="270" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- final return -->
  <path d="M 160 264 L 160 380" stroke="#666" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="384" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="407" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束 → return ans</text>

  <text x="320" y="450" text-anchor="middle" font-size="11" fill="#888">每个键最多 3 次哈希查询（均摊 O(1)），总计 O(n)</text>
</svg>
