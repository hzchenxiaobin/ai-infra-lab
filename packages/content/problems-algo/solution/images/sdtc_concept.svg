<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrEnd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：从 index 出发向左/右找最近的 target color</text>

  <!-- query 1 label + arrow above cells -->
  <text x="198" y="40" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">query [1, 3] → 最近颜色 3 在 index 4</text>
  <path d="M 126 64 Q 198 44 270 64" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrEnd)" filter="url(#rough2)"/>

  <!-- colors array label -->
  <text x="30" y="90" font-size="11" fill="#888" font-weight="bold">colors：</text>

  <!-- 9 cells: [1,1,2,1,3,2,2,3,3] -->
  <rect x="56" y="68" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="78" y="122" text-anchor="middle" font-size="9" fill="#aaa">0</text>

  <rect x="104" y="68" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="126" y="122" text-anchor="middle" font-size="9" fill="#aaa">1</text>

  <rect x="152" y="68" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="174" y="122" text-anchor="middle" font-size="9" fill="#aaa">2</text>

  <rect x="200" y="68" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="222" y="122" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <rect x="248" y="68" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="270" y="122" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <rect x="296" y="68" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="318" y="122" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <rect x="344" y="68" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="366" y="122" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <rect x="392" y="68" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="414" y="122" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <rect x="440" y="68" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="462" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="462" y="122" text-anchor="middle" font-size="9" fill="#aaa">8</text>

  <!-- query 2 arrow below index labels -->
  <path d="M 366 130 Q 294 152 222 130" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrEnd)" filter="url(#rough2)"/>
  <text x="294" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">query [6, 1] → 最近颜色 1 在 index 3</text>

  <!-- key insight box -->
  <rect x="40" y="170" width="460" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：颜色只有 3 种 → 预处理每个位置到每种颜色的最短距离</text>
  <text x="270" y="212" text-anchor="middle" font-size="11" fill="#444">dist[i][c] = min( 向左最近 c 的距离, 向右最近 c 的距离 )</text>
  <text x="270" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">双向扫描：左→右记 left 最近，右→左记 right 最近，取 min</text>

  <!-- color legend -->
  <rect x="40" y="262" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="282" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">颜色 1（蓝）</text>
  <text x="110" y="300" text-anchor="middle" font-size="10" fill="#888">位置: 0, 1, 3</text>
  <text x="110" y="314" text-anchor="middle" font-size="9" fill="#aaa">3 个</text>

  <rect x="200" y="262" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">颜色 2（绿）</text>
  <text x="270" y="300" text-anchor="middle" font-size="10" fill="#888">位置: 2, 5, 6</text>
  <text x="270" y="314" text-anchor="middle" font-size="9" fill="#aaa">3 个</text>

  <rect x="360" y="262" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="282" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">颜色 3（橙）</text>
  <text x="430" y="300" text-anchor="middle" font-size="10" fill="#888">位置: 4, 7, 8</text>
  <text x="430" y="314" text-anchor="middle" font-size="9" fill="#aaa">3 个</text>

  <text x="270" y="350" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">仅 3 种颜色 → 预处理 O(n) · 查询 O(1)</text>
</svg>
