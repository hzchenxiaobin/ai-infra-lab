<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="780" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：stack 与 add 逐步变化</text>

  <!-- 列头 -->
  <text x="30" y="58" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="150" y="58" font-size="11" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">stack（原值）</text>
  <text x="340" y="58" font-size="11" fill="#7a5415" font-weight="bold" filter="url(#rough2)">add（懒标记）</text>
  <text x="540" y="58" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回</text>

  <line x1="20" y1="66" x2="620" y2="66" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Row 1: push(1) -->
  <text x="30" y="88" font-size="11" fill="#2b6e9e" filter="url(#rough2)">push(1)</text>
  <rect x="150" y="74" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="167" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="340" y="74" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="357" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="540" y="89" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <line x1="20" y1="100" x2="620" y2="100" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2: push(2) -->
  <text x="30" y="120" font-size="11" fill="#2b6e9e" filter="url(#rough2)">push(2)</text>
  <rect x="150" y="106" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="106" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="203" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="340" y="106" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="376" y="106" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="393" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="540" y="121" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <line x1="20" y1="132" x2="620" y2="132" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 3: pop() -> 2 -->
  <text x="30" y="152" font-size="11" fill="#b85450" filter="url(#rough2)">pop()</text>
  <rect x="150" y="138" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="153" font-size="10" fill="#b85450" filter="url(#rough2)">← 弹出 2</text>
  <rect x="340" y="138" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="380" y="153" font-size="10" fill="#888" filter="url(#rough2)">add[0]+=0 无变化</text>
  <rect x="530" y="138" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="552" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2 ✓</text>
  <line x1="20" y1="164" x2="620" y2="164" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 4: push(2) -->
  <text x="30" y="184" font-size="11" fill="#2b6e9e" filter="url(#rough2)">push(2)</text>
  <rect x="150" y="170" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="170" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="203" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="340" y="170" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="376" y="170" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="393" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="540" y="185" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <line x1="20" y1="196" x2="620" y2="196" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 5: push(3) -->
  <text x="30" y="216" font-size="11" fill="#2b6e9e" filter="url(#rough2)">push(3)</text>
  <rect x="150" y="202" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="202" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="203" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="222" y="202" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="239" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="340" y="202" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="376" y="202" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="393" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="412" y="202" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="429" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="540" y="217" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <line x1="20" y1="228" x2="620" y2="228" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 6: push(4) ignored -->
  <text x="30" y="248" font-size="11" fill="#888" filter="url(#rough2)">push(4)</text>
  <rect x="150" y="234" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="234" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="203" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="222" y="234" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="239" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="264" y="249" font-size="10" fill="#b85450" filter="url(#rough2)">栈满 cap=3，忽略</text>
  <text x="540" y="249" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <line x1="20" y1="260" x2="620" y2="260" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 7: increment(5,100) -->
  <text x="30" y="280" font-size="11" fill="#d6a040" filter="url(#rough2)">inc(5,100)</text>
  <rect x="150" y="266" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="281" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <rect x="186" y="266" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="203" y="281" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <rect x="222" y="266" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="239" y="281" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="264" y="281" font-size="10" fill="#888" filter="url(#rough2)">stack 不动</text>
  <rect x="340" y="266" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="281" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="376" y="266" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="393" y="281" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="412" y="266" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="429" y="281" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="452" y="281" font-size="10" fill="#d6a040" filter="url(#rough2)">i=2 记账</text>
  <text x="540" y="281" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <line x1="20" y1="292" x2="620" y2="292" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 8: increment(2,100) -->
  <text x="30" y="312" font-size="11" fill="#d6a040" filter="url(#rough2)">inc(2,100)</text>
  <rect x="150" y="298" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="313" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <rect x="186" y="298" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="203" y="313" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <rect x="222" y="298" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="239" y="313" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <rect x="340" y="298" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="313" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="376" y="298" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="393" y="313" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">100</text>
  <rect x="412" y="298" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="429" y="313" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">100</text>
  <text x="452" y="313" font-size="10" fill="#d6a040" filter="url(#rough2)">i=1 记账</text>
  <text x="540" y="313" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <line x1="20" y1="324" x2="620" y2="324" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 9: pop() -> 103 -->
  <text x="30" y="344" font-size="11" fill="#b85450" filter="url(#rough2)">pop()</text>
  <rect x="150" y="330" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="345" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="330" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="203" y="345" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="224" y="345" font-size="10" fill="#b85450" filter="url(#rough2)">弹 3</text>
  <rect x="340" y="330" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="345" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="376" y="330" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="393" y="345" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">200</text>
  <text x="416" y="345" font-size="10" fill="#b85450" filter="url(#rough2)">←下传 100</text>
  <rect x="524" y="330" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="552" y="345" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">103 ✓</text>
  <text x="150" y="362" font-size="9" fill="#888" filter="url(#rough2)">3+100=103</text>
  <line x1="20" y1="368" x2="620" y2="368" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 10: pop() -> 202 -->
  <text x="30" y="388" font-size="11" fill="#b85450" filter="url(#rough2)">pop()</text>
  <rect x="150" y="374" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="389" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="389" font-size="10" fill="#b85450" filter="url(#rough2)">弹 2</text>
  <rect x="340" y="374" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="357" y="389" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">200</text>
  <text x="380" y="389" font-size="10" fill="#b85450" filter="url(#rough2)">←下传 200</text>
  <rect x="524" y="374" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="552" y="389" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">202 ✓</text>
  <text x="150" y="406" font-size="9" fill="#888" filter="url(#rough2)">2+200=202</text>
  <line x1="20" y1="412" x2="620" y2="412" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 11: pop() -> 201 -->
  <text x="30" y="432" font-size="11" fill="#b85450" filter="url(#rough2)">pop()</text>
  <text x="150" y="432" font-size="10" fill="#b85450" filter="url(#rough2)">弹 1（空）</text>
  <text x="340" y="432" font-size="10" fill="#b85450" filter="url(#rough2)">弹 200（空，无下层可传）</text>
  <rect x="524" y="418" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="552" y="433" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">201 ✓</text>
  <text x="150" y="450" font-size="9" fill="#888" filter="url(#rough2)">1+200=201</text>
  <line x1="20" y1="456" x2="620" y2="456" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 12: pop() -> -1 -->
  <text x="30" y="476" font-size="11" fill="#888" filter="url(#rough2)">pop()</text>
  <text x="150" y="476" font-size="10" fill="#888" filter="url(#rough2)">空栈</text>
  <rect x="530" y="462" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="552" y="477" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">-1 ✓</text>

  <!-- 底部小结 -->
  <rect x="40" y="500" width="560" height="260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="524" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键观察小结</text>
  <text x="60" y="548" font-size="11" fill="#333" filter="url(#rough2)">① stack 永远存原值 [1,2,3]，真实值靠 add 叠加还原</text>
  <text x="60" y="570" font-size="11" fill="#333" filter="url(#rough2)">② increment 只在 add[min(k,n)-1] 记一笔：inc(5,100)→add[2]，inc(2,100)→add[1]</text>
  <text x="60" y="592" font-size="11" fill="#333" filter="url(#rough2)">③ 两次 increment 后 add=[0,100,100]，对照暴力法栈 [201,202,103]：</text>
  <text x="80" y="612" font-size="11" fill="#888" filter="url(#rough2)">真实值 stack[i] + Σ(add[t≥i])：1+(0+100+100)=201，2+(100+100)=202，3+100=103</text>
  <text x="60" y="636" font-size="11" fill="#b85450" filter="url(#rough2)">④ pop 时增量逐层下传：</text>
  <text x="80" y="656" font-size="11" fill="#888" filter="url(#rough2)">pop 第 3 层：add[1] += add[2]=100 → add[1]=200，返回 3+100=103</text>
  <text x="80" y="676" font-size="11" fill="#888" filter="url(#rough2)">pop 第 2 层：add[0] += add[1]=200 → add[0]=200，返回 2+200=202</text>
  <text x="80" y="696" font-size="11" fill="#888" filter="url(#rough2)">pop 第 1 层：无下层，返回 1+200=201</text>
  <text x="60" y="724" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 每个 add 标记一生只下传一次 → 所有操作均摊 O(1)</text>
  <text x="60" y="748" font-size="10" fill="#888" font-style="italic" filter="url(#rough2)">与 155 最小栈同骨架：辅助数组随 push/pop 同步维护，只是缓存"增量"而非"最小值"</text>

</svg>
