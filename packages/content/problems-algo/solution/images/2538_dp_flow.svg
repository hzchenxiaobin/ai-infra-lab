<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：两遍 DFS 换根 DP（O(n)）</text>

  <!-- ===== Pass 1: DFS1 bottom-up down[] ===== -->
  <rect x="30" y="50" width="280" height="220" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">DFS1：自底向上 求 down[u]</text>
  <text x="170" y="94" text-anchor="middle" font-size="10" fill="#5a8a5a">down[u] = 从 u 向下的最长路径和（含 u）</text>

  <!-- mini tree showing bottom-up -->
  <!-- root r -->
  <ellipse cx="170" cy="130" rx="22" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="135" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">u</text>
  <!-- children c1 c2 -->
  <ellipse cx="120" cy="190" rx="18" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="194" text-anchor="middle" font-size="10" fill="#446688">c₁</text>
  <ellipse cx="220" cy="190" rx="18" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="194" text-anchor="middle" font-size="10" fill="#446688">c₂</text>
  <!-- up arrows (bottom-up) -->
  <path d="M 130 174 L 162 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <path d="M 210 174 L 178 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <text x="170" y="232" text-anchor="middle" font-size="11" fill="#333">down[u] = price[u]</text>
  <text x="170" y="248" text-anchor="middle" font-size="11" fill="#333">  + max{ down[c] : c∈子 }</text>
  <text x="170" y="262" text-anchor="middle" font-size="10" fill="#5a8a5a">叶子无子 → max=0 → down=price[u]</text>

  <!-- ===== Pass 2: DFS2 top-down up[] ===== -->
  <rect x="330" y="50" width="280" height="220" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="74" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">DFS2：自顶向下 换根 求 up[v]</text>
  <text x="470" y="94" text-anchor="middle" font-size="10" fill="#a85a56">up[v] = 从 v 朝父方向出发的最长路径和（含 v）</text>

  <!-- mini tree: p with children v and sib -->
  <ellipse cx="470" cy="130" rx="22" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="135" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">p</text>
  <ellipse cx="420" cy="190" rx="18" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="194" text-anchor="middle" font-size="10" fill="#b85450">v</text>
  <ellipse cx="520" cy="190" rx="18" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a">sib</text>
  <!-- down arrows (top-down) -->
  <path d="M 458 148 L 428 174" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 482 148 L 512 174" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- up from p (dashed, parent side) -->
  <path d="M 470 112 L 470 84" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <text x="470" y="232" text-anchor="middle" font-size="11" fill="#333">up[v] = price[v]</text>
  <text x="470" y="248" text-anchor="middle" font-size="11" fill="#333">  + max( up[p], price[p]+down[sib] )</text>
  <text x="470" y="262" text-anchor="middle" font-size="10" fill="#a85a56">无兄弟 sib → 只取 up[p]；root: up=price[root]</text>

  <!-- arrow between two passes -->
  <path d="M 312 160 L 328 160" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Answer box ===== -->
  <rect x="60" y="290" width="520" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">从 u 出发的最长路径 = max(down[u], up[u])</text>
  <text x="320" y="338" text-anchor="middle" font-size="13" fill="#333">开销(u) = 最长路径 − price[u]   （最小路径恒为 {u}=price[u]）</text>
  <text x="320" y="360" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = max { 开销(u) : u ∈ 0..n−1 }</text>
</svg>
