<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：Gasoline 靠评分分胜负，Electric 唯一选手直接当选</text>
  <text x="290" y="36" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">rating = ROUND(AVG(评分), 2)（先舍入再比较）；distance = Σ 行程距离</text>

  <rect x="26" y="46" width="528" height="178" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">赛道 Gasoline：Alice(1) vs Charlie(3)</text>

  <rect x="46" y="76" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="94" y="91" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">选手</text>
  <rect x="142" y="76" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190" y="91" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">逐行程评分</text>
  <rect x="238" y="76" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="273" y="91" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">rating</text>
  <rect x="308" y="76" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="343" y="91" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">distance</text>
  <rect x="378" y="76" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="413" y="91" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">accidents</text>
  <rect x="448" y="76" width="86" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="491" y="91" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <rect x="46" y="98" width="488" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="94" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Alice (1)</text>
  <text x="190" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5, 4</text>
  <text x="273" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4.50</text>
  <text x="343" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">80</text>
  <text x="413" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="491" y="114" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 出局</text>

  <rect x="46" y="122" width="488" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="94" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Charlie (3)</text>
  <text x="190" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5, 5</text>
  <text x="273" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5.00</text>
  <text x="343" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">100</text>
  <text x="413" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="491" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 冠军</text>

  <text x="290" y="170" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">第一级评分 4.50 &lt; 5.00 直接分出胜负 —— 里程、事故两级根本没出场</text>
  <text x="290" y="188" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">若 Alice 也是 5.00：比里程 80 &lt; 100 仍 Charlie 胜；若里程也平：比事故 1 &gt; 0 仍 Charlie 胜</text>
  <text x="290" y="206" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">三级键像保险箱的三道锁，一道一道往下试 —— 且比较发生在舍入后的值上</text>

  <rect x="26" y="238" width="528" height="106" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">赛道 Electric：Bob(2) 唯一选手</text>

  <rect x="46" y="268" width="488" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="94" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Bob (2)</text>
  <text x="190" y="284" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4, 5</text>
  <text x="273" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4.50</text>
  <text x="343" y="284" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">180</text>
  <text x="413" y="284" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="491" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 冠军</text>

  <text x="290" y="314" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">「每种动力类型取最佳」只要求组内相对最优 —— 独苗直接当选，不设及格线</text>
  <text x="290" y="332" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（评分 4.50 不高、事故 3 不少，都不影响 Electric 赛道只有一个候选）</text>

  <text x="290" y="366" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">输出（按 fuel_type 升序）</text>

  <rect x="150" y="376" width="96" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="198" y="391" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">fuel_type</text>
  <rect x="246" y="376" width="96" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="294" y="391" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">driver_id</text>
  <rect x="342" y="376" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377" y="391" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">rating</text>
  <rect x="412" y="376" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="452" y="391" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">distance</text>

  <rect x="150" y="398" width="96" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="413" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Electric</text>
  <rect x="246" y="398" width="96" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="294" y="413" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="342" y="398" width="70" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="377" y="413" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4.50</text>
  <rect x="412" y="398" width="80" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="413" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">180</text>

  <rect x="150" y="420" width="96" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="198" y="435" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Gasoline</text>
  <rect x="246" y="420" width="96" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="294" y="435" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="342" y="420" width="70" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="377" y="435" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5.00</text>
  <rect x="412" y="420" width="80" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="435" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">100</text>

  <text x="290" y="462" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Electric 字典序在 Gasoline 之前 —— 输出排序与赛道内排名互不相干</text>
</svg>
