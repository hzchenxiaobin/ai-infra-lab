<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums=[5,1,1,2,0,0]，随机主元 2</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">先 swap(a[0],a[3]) 得 [2,1,1,5,0,0]，pivot=2；三指针扫描 7 步</text>

  <!-- Column headers -->
  <text x="40" y="72" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="90" y="72" font-size="10" fill="#888" font-weight="bold">i 值</text>
  <text x="150" y="72" font-size="10" fill="#888" font-weight="bold">比较</text>
  <text x="230" y="72" font-size="10" fill="#888" font-weight="bold">数组状态（lt/i/gt）</text>
  <text x="500" y="72" font-size="10" fill="#888" font-weight="bold">动作</text>

  <!-- helper: each row y starts at 80, step 46. cells: nums at x=230.., each cell width 40 -->

  <!-- Step 0: init -->
  <text x="48" y="98" font-size="11" fill="#446688" font-weight="bold">初值</text>
  <text x="95" y="98" font-size="10" fill="#888">—</text>
  <text x="150" y="98" font-size="10" fill="#888">—</text>
  <g font-size="10">
    <rect x="230" y="84" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="250" y="102" text-anchor="middle" fill="#333">2</text>
    <rect x="272" y="84" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="292" y="102" text-anchor="middle" fill="#333">1</text>
    <rect x="314" y="84" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="334" y="102" text-anchor="middle" fill="#333">1</text>
    <rect x="356" y="84" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="376" y="102" text-anchor="middle" fill="#333">5</text>
    <rect x="398" y="84" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="418" y="102" text-anchor="middle" fill="#333">0</text>
    <rect x="440" y="84" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="460" y="102" text-anchor="middle" fill="#333">0</text>
  </g>
  <text x="250" y="122" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">lt</text>
  <text x="250" y="120" text-anchor="middle" font-size="8" fill="#666" font-weight="bold">i</text>
  <text x="460" y="122" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">gt</text>
  <text x="500" y="98" font-size="9" fill="#888">lt=i=0, gt=5</text>

  <!-- Step 1: i=0, == pivot, i++ -->
  <text x="48" y="148" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="95" y="148" font-size="10" fill="#333">0→2</text>
  <text x="150" y="148" font-size="10" fill="#d6a040">2 == 2</text>
  <g font-size="10">
    <rect x="230" y="134" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="250" y="152" text-anchor="middle" fill="#333">2</text>
    <rect x="272" y="134" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="292" y="152" text-anchor="middle" fill="#333">1</text>
    <rect x="314" y="134" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="334" y="152" text-anchor="middle" fill="#333">1</text>
    <rect x="356" y="134" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="376" y="152" text-anchor="middle" fill="#333">5</text>
    <rect x="398" y="134" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="418" y="152" text-anchor="middle" fill="#333">0</text>
    <rect x="440" y="134" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="460" y="152" text-anchor="middle" fill="#333">0</text>
  </g>
  <text x="500" y="148" font-size="9" fill="#d6a040">i++</text>

  <!-- Step 2: i=1, 1<2, swap(a[0],a[1]); lt++; i++ -->
  <text x="48" y="186" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="95" y="186" font-size="10" fill="#333">1→1</text>
  <text x="150" y="186" font-size="10" fill="#4a7a3a">1 &lt; 2</text>
  <g font-size="10">
    <rect x="230" y="172" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="250" y="190" text-anchor="middle" fill="#333">1</text>
    <rect x="272" y="172" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="292" y="190" text-anchor="middle" fill="#333">2</text>
    <rect x="314" y="172" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="334" y="190" text-anchor="middle" fill="#333">1</text>
    <rect x="356" y="172" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="376" y="190" text-anchor="middle" fill="#333">5</text>
    <rect x="398" y="172" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="418" y="190" text-anchor="middle" fill="#333">0</text>
    <rect x="440" y="172" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="460" y="190" text-anchor="middle" fill="#333">0</text>
  </g>
  <text x="500" y="186" font-size="9" fill="#4a7a3a">swap;lt++,i++</text>

  <!-- Step 3: i=2, 1<2 -->
  <text x="48" y="224" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="95" y="224" font-size="10" fill="#333">2→1</text>
  <text x="150" y="224" font-size="10" fill="#4a7a3a">1 &lt; 2</text>
  <g font-size="10">
    <rect x="230" y="210" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="250" y="228" text-anchor="middle" fill="#333">1</text>
    <rect x="272" y="210" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="292" y="228" text-anchor="middle" fill="#333">1</text>
    <rect x="314" y="210" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="334" y="228" text-anchor="middle" fill="#333">2</text>
    <rect x="356" y="210" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="376" y="228" text-anchor="middle" fill="#333">5</text>
    <rect x="398" y="210" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="418" y="228" text-anchor="middle" fill="#333">0</text>
    <rect x="440" y="210" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="460" y="228" text-anchor="middle" fill="#333">0</text>
  </g>
  <text x="500" y="224" font-size="9" fill="#4a7a3a">swap;lt++,i++</text>

  <!-- Step 4: i=3, 5>2, swap(a[3],a[5]); gt--; i不动 -->
  <text x="48" y="262" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="95" y="262" font-size="10" fill="#333">3→5</text>
  <text x="150" y="262" font-size="10" fill="#b85450">5 &gt; 2</text>
  <g font-size="10">
    <rect x="230" y="248" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="250" y="266" text-anchor="middle" fill="#333">1</text>
    <rect x="272" y="248" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="292" y="266" text-anchor="middle" fill="#333">1</text>
    <rect x="314" y="248" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="334" y="266" text-anchor="middle" fill="#333">2</text>
    <rect x="356" y="248" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="376" y="266" text-anchor="middle" fill="#333">0</text>
    <rect x="398" y="248" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="418" y="266" text-anchor="middle" fill="#333">0</text>
    <rect x="440" y="248" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="460" y="266" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
  </g>
  <text x="500" y="262" font-size="9" fill="#b85450">swap a[3],a[5]</text>
  <text x="500" y="274" font-size="9" fill="#b85450">gt--; i 不动</text>

  <!-- Step 5: i=3, 0<2 -->
  <text x="48" y="300" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="95" y="300" font-size="10" fill="#333">3→0</text>
  <text x="150" y="300" font-size="10" fill="#4a7a3a">0 &lt; 2</text>
  <g font-size="10">
    <rect x="230" y="286" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="250" y="304" text-anchor="middle" fill="#333">1</text>
    <rect x="272" y="286" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="292" y="304" text-anchor="middle" fill="#333">1</text>
    <rect x="314" y="286" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="334" y="304" text-anchor="middle" fill="#333">0</text>
    <rect x="356" y="286" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="376" y="304" text-anchor="middle" fill="#333">2</text>
    <rect x="398" y="286" width="40" height="26" fill="#f6f6f6" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="418" y="304" text-anchor="middle" fill="#333">0</text>
    <rect x="440" y="286" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="460" y="304" text-anchor="middle" fill="#333">5</text>
  </g>
  <text x="500" y="300" font-size="9" fill="#4a7a3a">swap;lt++,i++</text>

  <!-- Step 6: i=4, 0<2 -->
  <text x="48" y="338" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="95" y="338" font-size="10" fill="#333">4→0</text>
  <text x="150" y="338" font-size="10" fill="#4a7a3a">0 &lt; 2</text>
  <g font-size="10">
    <rect x="230" y="324" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="250" y="342" text-anchor="middle" fill="#333">1</text>
    <rect x="272" y="324" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="292" y="342" text-anchor="middle" fill="#333">1</text>
    <rect x="314" y="324" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="334" y="342" text-anchor="middle" fill="#333">0</text>
    <rect x="356" y="324" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="376" y="342" text-anchor="middle" fill="#333">0</text>
    <rect x="398" y="324" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="418" y="342" text-anchor="middle" fill="#333">2</text>
    <rect x="440" y="324" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="460" y="342" text-anchor="middle" fill="#333">5</text>
  </g>
  <text x="500" y="338" font-size="9" fill="#4a7a3a">swap;lt++,i++</text>

  <!-- Step 7: end -->
  <text x="48" y="376" font-size="11" fill="#446688" font-weight="bold">7</text>
  <text x="95" y="376" font-size="10" fill="#888">i&gt;gt</text>
  <text x="150" y="376" font-size="10" fill="#888">结束</text>
  <g font-size="10">
    <rect x="230" y="362" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="250" y="380" text-anchor="middle" fill="#333">1</text>
    <rect x="272" y="362" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="292" y="380" text-anchor="middle" fill="#333">1</text>
    <rect x="314" y="362" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="334" y="380" text-anchor="middle" fill="#333">0</text>
    <rect x="356" y="362" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="376" y="380" text-anchor="middle" fill="#333">0</text>
    <rect x="398" y="362" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="418" y="380" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="440" y="362" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="460" y="380" text-anchor="middle" fill="#333">5</text>
  </g>
  <text x="500" y="376" font-size="9" fill="#d6a040">[lt..gt]=[4..4]</text>

  <!-- Summary box -->
  <rect x="30" y="404" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="424" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果：[1,1,0,0,  2,  5]  —— 2 归位，左段 [1,1,0,0]、右段 [5] 递归</text>
  <text x="290" y="440" text-anchor="middle" font-size="10" fill="#555">绿=&lt; pivot，黄==pivot，红=&gt; pivot；5 一次性换到末尾不再触碰</text>
</svg>
