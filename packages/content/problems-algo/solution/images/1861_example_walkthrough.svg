<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：box = [["#",".","*","."],["#","#","*","."]]</text>
  <text x="330" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m=2, n=4 → 结果为 4×2，初始化全 '.'</text>

  <!-- Header -->
  <g filter="url(#rough2)">
    <text x="34" y="70" font-size="10" fill="#446688" font-weight="bold">j</text>
    <text x="86" y="70" font-size="10" fill="#446688" font-weight="bold">box[r][j]</text>
    <text x="150" y="70" font-size="10" fill="#446688" font-weight="bold">动作</text>
    <text x="330" y="70" font-size="10" fill="#446688" font-weight="bold">bottom</text>
    <text x="445" y="70" font-size="10" fill="#446688" font-weight="bold">结果列（行 0→3）</text>
  </g>

  <!-- ===== r = 0 section ===== -->
  <rect x="20" y="78" width="620" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)" fill-opacity="0.4"/>
  <text x="36" y="94" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">处理 r=0：原行 = # . * .  →  结果列 col = m−1−0 = 1，bottom 初值 = 3</text>

  <!-- row j=3 -->
  <g filter="url(#rough2)">
    <text x="40" y="120" font-size="11" fill="#333" font-weight="bold">3</text>
    <rect x="76" y="106" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="88" y="121" text-anchor="middle" font-size="11" fill="#333">.</text>
    <text x="150" y="121" font-size="10" fill="#888">跳过（空位）</text>
    <rect x="324" y="108" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="341" y="122" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
    <!-- result col: . . . . -->
    <rect x="420" y="106" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="431" y="121" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="444" y="106" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="455" y="121" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="468" y="106" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="479" y="121" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="492" y="106" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="503" y="121" text-anchor="middle" font-size="10" fill="#bbb">.</text>
  </g>

  <!-- row j=2 : * -->
  <g filter="url(#rough2)">
    <text x="40" y="148" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="76" y="134" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="88" y="149" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">*</text>
    <text x="150" y="149" font-size="10" fill="#d6a040">写 result[2][1]='*'；bottom=1</text>
    <rect x="324" y="136" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="341" y="150" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
    <rect x="420" y="134" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="431" y="149" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="444" y="134" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="455" y="149" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="468" y="134" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/><text x="479" y="149" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">*</text>
    <rect x="492" y="134" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="503" y="149" text-anchor="middle" font-size="10" fill="#bbb">.</text>
  </g>

  <!-- row j=1 : . -->
  <g filter="url(#rough2)">
    <text x="40" y="176" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="76" y="162" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="88" y="177" text-anchor="middle" font-size="11" fill="#333">.</text>
    <text x="150" y="177" font-size="10" fill="#888">跳过</text>
    <rect x="324" y="164" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="341" y="178" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
    <rect x="420" y="162" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="431" y="177" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="444" y="162" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="455" y="177" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="468" y="162" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/><text x="479" y="177" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">*</text>
    <rect x="492" y="162" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="503" y="177" text-anchor="middle" font-size="10" fill="#bbb">.</text>
  </g>

  <!-- row j=0 : # -->
  <g filter="url(#rough2)">
    <text x="40" y="204" font-size="11" fill="#333" font-weight="bold">0</text>
    <rect x="76" y="190" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="88" y="205" text-anchor="middle" font-size="11" fill="#333">#</text>
    <text x="150" y="205" font-size="10" fill="#4a7a3a">写 result[1][1]='#'；bottom=0</text>
    <rect x="324" y="192" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="341" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="420" y="190" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="431" y="205" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="444" y="190" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="455" y="205" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">#</text>
    <rect x="468" y="190" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/><text x="479" y="205" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">*</text>
    <rect x="492" y="190" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="503" y="205" text-anchor="middle" font-size="10" fill="#bbb">.</text>
  </g>

  <!-- ===== r = 1 section ===== -->
  <rect x="20" y="220" width="620" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" fill-opacity="0.4"/>
  <text x="36" y="236" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">处理 r=1：原行 = # # * .  →  结果列 col = m−1−1 = 0，bottom 初值 = 3</text>

  <!-- j=3 . -->
  <g filter="url(#rough2)">
    <text x="40" y="262" font-size="11" fill="#333" font-weight="bold">3</text>
    <rect x="76" y="248" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="88" y="263" text-anchor="middle" font-size="11" fill="#333">.</text>
    <text x="150" y="263" font-size="10" fill="#888">跳过</text>
    <rect x="324" y="250" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="341" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
    <rect x="420" y="248" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="431" y="263" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="444" y="248" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="455" y="263" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="468" y="248" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="479" y="263" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="492" y="248" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="503" y="263" text-anchor="middle" font-size="10" fill="#bbb">.</text>
  </g>

  <!-- j=2 * -->
  <g filter="url(#rough2)">
    <text x="40" y="290" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="76" y="276" width="24" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="88" y="291" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">*</text>
    <text x="150" y="291" font-size="10" fill="#d6a040">写 result[2][0]='*'；bottom=1</text>
    <rect x="324" y="278" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="341" y="292" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
    <rect x="420" y="276" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="431" y="291" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="444" y="276" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="455" y="291" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="468" y="276" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/><text x="479" y="291" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">*</text>
    <rect x="492" y="276" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="503" y="291" text-anchor="middle" font-size="10" fill="#bbb">.</text>
  </g>

  <!-- j=1 # -->
  <g filter="url(#rough2)">
    <text x="40" y="318" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="76" y="304" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="88" y="319" text-anchor="middle" font-size="11" fill="#333">#</text>
    <text x="150" y="319" font-size="10" fill="#4a7a3a">写 result[1][0]='#'；bottom=0</text>
    <rect x="324" y="306" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="341" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="420" y="304" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="431" y="319" text-anchor="middle" font-size="10" fill="#bbb">.</text>
    <rect x="444" y="304" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="455" y="319" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">#</text>
    <rect x="468" y="304" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/><text x="479" y="319" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">*</text>
    <rect x="492" y="304" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="503" y="319" text-anchor="middle" font-size="10" fill="#bbb">.</text>
  </g>

  <!-- j=0 # -->
  <g filter="url(#rough2)">
    <text x="40" y="346" font-size="11" fill="#333" font-weight="bold">0</text>
    <rect x="76" y="332" width="24" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="88" y="347" text-anchor="middle" font-size="11" fill="#333">#</text>
    <text x="150" y="347" font-size="10" fill="#4a7a3a">写 result[0][0]='#'；bottom=−1</text>
    <rect x="324" y="334" width="34" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5"/>
    <text x="341" y="348" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1</text>
    <rect x="420" y="332" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="431" y="347" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">#</text>
    <rect x="444" y="332" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/><text x="455" y="347" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">#</text>
    <rect x="468" y="332" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/><text x="479" y="347" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">*</text>
    <rect x="492" y="332" width="22" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/><text x="503" y="347" text-anchor="middle" font-size="10" fill="#bbb">.</text>
  </g>

  <!-- ===== Final result ===== -->
  <rect x="20" y="370" width="620" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="392" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">合并两列，按行读出最终结果（4×2）：</text>
  <g filter="url(#rough2)">
    <!-- row 0 : # . -->
    <text x="44" y="416" font-size="9" fill="#888">行0</text>
    <rect x="80" y="404" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/><text x="93" y="419" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">#</text>
    <rect x="108" y="404" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/><text x="121" y="419" text-anchor="middle" font-size="11" fill="#333">.</text>
    <!-- row 1 : # # -->
    <text x="160" y="416" font-size="9" fill="#888">行1</text>
    <rect x="196" y="404" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/><text x="209" y="419" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">#</text>
    <rect x="224" y="404" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/><text x="237" y="419" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">#</text>
    <!-- row 2 : * * -->
    <text x="276" y="416" font-size="9" fill="#888">行2</text>
    <rect x="312" y="404" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="325" y="419" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">*</text>
    <rect x="340" y="404" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="353" y="419" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">*</text>
    <!-- row 3 : . . -->
    <text x="392" y="416" font-size="9" fill="#888">行3</text>
    <rect x="428" y="404" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/><text x="441" y="419" text-anchor="middle" font-size="11" fill="#333">.</text>
    <rect x="456" y="404" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/><text x="469" y="419" text-anchor="middle" font-size="11" fill="#333">.</text>
  </g>
  <text x="540" y="419" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓ 与示例 2 一致</text>
  <text x="330" y="442" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">bottom 每写一块石头左移一格；遇 * 跳到其左侧 → 一趟扫描完成旋转+重力</text>
</svg>
