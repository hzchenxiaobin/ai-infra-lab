<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：取末元素前的空数组判定</text>

  <!-- Start: pill -->
  <rect x="170" y="40" width="180" height="38" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">调用 array.last()</text>

  <!-- arrow down -->
  <path d="M 260 80 L 260 104" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- process: this binding -->
  <rect x="150" y="106" width="220" height="40" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">this 绑定为调用它的 array 实例</text>

  <!-- arrow down -->
  <path d="M 260 148 L 260 168" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,172 372,210 260,248 148,210" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">this.length</text>
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">=== 0 ?</text>

  <!-- left branch (yes / empty) -->
  <path d="M 148 210 L 96 210" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是（空）</text>
  <path d="M 96 210 L 96 280" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- left result -->
  <rect x="34" y="282" width="124" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="96" y="311" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">return -1</text>

  <!-- right branch (no / non-empty) -->
  <path d="M 372 210 L 424 210" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 424 210 L 424 280" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right result -->
  <rect x="362" y="282" width="124" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="424" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">return</text>
  <text x="424" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">this[len - 1]</text>
</svg>
