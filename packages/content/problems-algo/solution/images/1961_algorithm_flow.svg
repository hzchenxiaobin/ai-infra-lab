<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：初始化游标 → 逐词逐字符比对 → 三类检查返回</text>

  <!-- Start: init -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">开始：i = 0, n = |s|</text>

  <path d="M 280 80 L 280 100" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- For each word w -->
  <rect x="180" y="104" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">对 words 中每个词 w</text>

  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- For each char c in w -->
  <rect x="180" y="162" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">对 w 中每个字符 c</text>

  <path d="M 280 198 L 280 216" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: i >= n? -->
  <polygon points="280,220 370,260 280,300 190,260" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">i ≥ n ?</text>
  <text x="280" y="272" text-anchor="middle" font-size="9.5" fill="#888">(s 已耗尽)</text>

  <!-- Yes -> false (overflow) -->
  <path d="M 370 260 L 430 260" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="252" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="434" y="244" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="484" y="265" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- No -> continue to char compare -->
  <path d="M 280 300 L 280 318" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="314" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Decision: s[i] != c? -->
  <polygon points="280,322 380,362 280,402 180,362" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">s[i] ≠ c ?</text>
  <text x="280" y="374" text-anchor="middle" font-size="9.5" fill="#888">(字符失配)</text>

  <!-- Yes -> false (mismatch) -->
  <path d="M 380 362 L 430 362" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="388" y="354" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="434" y="346" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="484" y="367" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- No -> i++ -->
  <path d="M 280 402 L 280 420" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="416" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="220" y="424" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i++ (消费)</text>

  <!-- loop back to "for each char" -->
  <path d="M 220 439 L 140 439 L 140 179 L 178 179" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="100" y="312" font-size="10" fill="#888">下一字符</text>

  <!-- After word done: check i == n -->
  <path d="M 340 439 L 460 439 L 460 179 L 382 179" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="396" y="172" font-size="10" fill="#4a7a3a">词完毕</text>

  <!-- Decision: i == n? (word boundary) - placed on the right return path -->
  <polygon points="460,460 540,490 460,520 380,490" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="488" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i == n ?</text>
  <text x="460" y="502" text-anchor="middle" font-size="9" fill="#888">(词界命中)</text>

  <path d="M 460 439 L 460 460" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Yes -> true -->
  <path d="M 540 490 L 540 490" stroke="#4a7a3a" stroke-width="2" fill="none"/>
  <rect x="384" y="448" width="0" height="0" fill="none"/>

  <!-- true box -->
  <rect x="40" y="470" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="105" y="491" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>
  <path d="M 380 490 L 174 490" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="482" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- No -> loop back to next word -->
  <path d="M 460 520 L 460 528 L 280 528 L 280 530" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="480" y="516" font-size="10" fill="#888">否,下一词</text>

  <!-- All words done -> false -->
  <path d="M 180 121 L 100 121 L 100 470" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="60" y="200" font-size="10" fill="#888" transform="rotate(-90 60 200)">词全部用完</text>
  <rect x="40" y="436" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)" opacity="0"/>
</svg>
