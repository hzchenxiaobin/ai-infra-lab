<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,2,2,3,1,4,2]</text>
  <path d="M 200 42 Q 310 50 420 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- header -->
  <g filter="url(#rough2)"><rect x="75" y="80" width="70" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">i</text>
  <g filter="url(#rough2)"><rect x="145" y="80" width="80" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="185" y="100" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">nums[i]</text>
  <g filter="url(#rough2)"><rect x="225" y="80" width="220" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="335" y="100" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">更新条目 (count, first, last)</text>
  <g filter="url(#rough2)"><rect x="445" y="80" width="100" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="495" y="100" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">degree</text>

  <!-- row i=0 -->
  <g filter="url(#rough2)"><rect x="75" y="110" width="70" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="110" y="130" text-anchor="middle" font-size="12" fill="#444">0</text>
  <g filter="url(#rough2)"><rect x="145" y="110" width="80" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="185" y="130" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="225" y="110" width="220" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="335" y="130" text-anchor="middle" font-size="12" fill="#444">1 → (1, 0, 0)</text>
  <g filter="url(#rough2)"><rect x="445" y="110" width="100" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="495" y="130" text-anchor="middle" font-size="12" fill="#2b4a66" font-weight="bold">1</text>

  <!-- row i=1 -->
  <g filter="url(#rough2)"><rect x="75" y="140" width="70" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="110" y="160" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="145" y="140" width="80" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="185" y="160" text-anchor="middle" font-size="12" fill="#444">2</text>
  <g filter="url(#rough2)"><rect x="225" y="140" width="220" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="335" y="160" text-anchor="middle" font-size="12" fill="#444">2 → (1, 1, 1)</text>
  <g filter="url(#rough2)"><rect x="445" y="140" width="100" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="495" y="160" text-anchor="middle" font-size="12" fill="#444">1</text>

  <!-- row i=2 (degree -> 2) -->
  <g filter="url(#rough2)"><rect x="75" y="170" width="70" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="110" y="190" text-anchor="middle" font-size="12" fill="#7a5415">2</text>
  <g filter="url(#rough2)"><rect x="145" y="170" width="80" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="185" y="190" text-anchor="middle" font-size="12" fill="#7a5415">2</text>
  <g filter="url(#rough2)"><rect x="225" y="170" width="220" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="335" y="190" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">2 → (2, 1, 2)</text>
  <g filter="url(#rough2)"><rect x="445" y="170" width="100" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="495" y="190" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">2</text>

  <!-- row i=3 -->
  <g filter="url(#rough2)"><rect x="75" y="200" width="70" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="110" y="220" text-anchor="middle" font-size="12" fill="#444">3</text>
  <g filter="url(#rough2)"><rect x="145" y="200" width="80" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="185" y="220" text-anchor="middle" font-size="12" fill="#444">3</text>
  <g filter="url(#rough2)"><rect x="225" y="200" width="220" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="335" y="220" text-anchor="middle" font-size="12" fill="#444">3 → (1, 3, 3)</text>
  <g filter="url(#rough2)"><rect x="445" y="200" width="100" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="495" y="220" text-anchor="middle" font-size="12" fill="#444">2</text>

  <!-- row i=4 -->
  <g filter="url(#rough2)"><rect x="75" y="230" width="70" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="110" y="250" text-anchor="middle" font-size="12" fill="#444">4</text>
  <g filter="url(#rough2)"><rect x="145" y="230" width="80" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="185" y="250" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#rough2)"><rect x="225" y="230" width="220" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="335" y="250" text-anchor="middle" font-size="12" fill="#444">1 → (2, 0, 4)</text>
  <g filter="url(#rough2)"><rect x="445" y="230" width="100" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="495" y="250" text-anchor="middle" font-size="12" fill="#444">2</text>

  <!-- row i=5 -->
  <g filter="url(#rough2)"><rect x="75" y="260" width="70" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="110" y="280" text-anchor="middle" font-size="12" fill="#444">5</text>
  <g filter="url(#rough2)"><rect x="145" y="260" width="80" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="185" y="280" text-anchor="middle" font-size="12" fill="#444">4</text>
  <g filter="url(#rough2)"><rect x="225" y="260" width="220" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="335" y="280" text-anchor="middle" font-size="12" fill="#444">4 → (1, 5, 5)</text>
  <g filter="url(#rough2)"><rect x="445" y="260" width="100" height="30" rx="3" fill="#f5f5f5" stroke="#bbb"/></g>
  <text x="495" y="280" text-anchor="middle" font-size="12" fill="#444">2</text>

  <!-- row i=6 (degree -> 3) -->
  <g filter="url(#rough2)"><rect x="75" y="290" width="70" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="110" y="310" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <g filter="url(#rough2)"><rect x="145" y="290" width="80" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="185" y="310" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <g filter="url(#rough2)"><rect x="225" y="290" width="220" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="335" y="310" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 → (3, 1, 6)</text>
  <g filter="url(#rough2)"><rect x="445" y="290" width="100" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="495" y="310" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>

  <!-- answer callout -->
  <g filter="url(#rough2)">
    <rect x="120" y="350" width="380" height="64" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="140" y="374" font-size="13" font-weight="bold" fill="#444">遍历结束：degree = 3，值 2 满足 cnt == degree</text>
  <text x="140" y="394" font-size="12" fill="#444">最短子数组 = 从 first=1 到 last=6 的那段，长度 = 6 − 1 + 1 = </text>
  <text x="492" y="394" font-size="14" fill="#b85450" font-weight="bold">6</text>
</svg>
