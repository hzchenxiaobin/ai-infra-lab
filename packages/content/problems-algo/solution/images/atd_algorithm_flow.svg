<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：按奇点个数 k 分情况</text>

  <!-- compute box -->
  <rect x="170" y="36" width="220" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">统计 deg[]，收集奇点 odd，k=|odd|</text>
  <path d="M 280 62 L 280 76" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond k? -->
  <polygon points="280,78 360,104 280,130 200,104" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k = ?</text>

  <!-- k==0 -> true (right) -->
  <path d="M 360 104 L 374 104" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="367" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="374" y="92" width="160" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="108" text-anchor="middle" font-size="11" fill="#2c4a26" filter="url(#rough2)">k==0 ⇒ 全偶 return true</text>

  <!-- k>=6 -> false (left) -->
  <path d="M 200 104 L 186 104" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="193" y="98" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">≥6</text>
  <rect x="26" y="92" width="160" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="108" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">k≥6 ⇒ 减不完 return false</text>

  <!-- fan arrows to columns -->
  <path d="M 250 122 C 215 140, 180 144, 150 150" fill="none" stroke="#555" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="138" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <path d="M 310 122 C 345 140, 380 144, 410 150" fill="none" stroke="#555" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="138" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>

  <!-- ============ k==4 column (left, center x=150) ============ -->
  <rect x="110" y="150" width="80" height="22" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k == 4</text>
  <path d="M 150 172 L 150 188" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="150,190 222,214 150,238 78,214" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 种配对里</text>
  <text x="150" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">∃ 两边可加?</text>

  <!-- yes -> true (left) -->
  <path d="M 78 214 L 64 214" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="71" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="14" y="202" width="50" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="39" y="218" text-anchor="middle" font-size="11" fill="#2c4a26" filter="url(#rough2)">true</text>

  <!-- no -> false (right) -->
  <path d="M 222 214 L 236 214" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="229" y="208" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="236" y="202" width="56" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="218" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">false</text>

  <text x="150" y="256" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">配对：(ab|cd)(ac|bd)(ad|bc)</text>

  <!-- ============ k==2 column (right, center x=410) ============ -->
  <rect x="370" y="150" width="80" height="22" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k == 2</text>
  <path d="M 410 172 L 410 188" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="410,190 488,214 410,238 332,214" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">边 (a,b)</text>
  <text x="410" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">可加?</text>

  <!-- yes -> true (right) -->
  <path d="M 488 214 L 502 214" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="495" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="502" y="202" width="46" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="218" text-anchor="middle" font-size="11" fill="#2c4a26" filter="url(#rough2)">true</text>
  <text x="525" y="244" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">加 1 边</text>

  <!-- no -> down -->
  <path d="M 410 238 L 410 256" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="250" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 存在</text>

  <rect x="300" y="256" width="220" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="272" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">找 w：w≠a,b 且 (a,w)(b,w) 均无边</text>
  <path d="M 410 280 L 410 296" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="410,298 472,320 410,342 348,320" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">∃ w?</text>

  <!-- yes -> true (right) -->
  <path d="M 472 320 L 486 320" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="479" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="486" y="308" width="62" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="517" y="324" text-anchor="middle" font-size="11" fill="#2c4a26" filter="url(#rough2)">true</text>

  <!-- no -> down -> false -->
  <path d="M 410 342 L 410 358" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="358" width="76" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="374" text-anchor="middle" font-size="11" fill="#7a2a26" filter="url(#rough2)">false</text>

  <text x="150" y="374" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">两条边各消两个奇点，须覆盖全部 4 个奇点</text>
</svg>
