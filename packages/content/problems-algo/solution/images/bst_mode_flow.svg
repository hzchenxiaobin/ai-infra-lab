<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">中序遍历（左→根→右）+ 滚动 streak 计数</text>

  <!-- 入口 -->
  <rect x="170" y="44" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="65" text-anchor="middle" font-size="11" fill="#333">prev=−∞, count=0, maxCount=0, ans=[]；dfs(root)</text>

  <path d="M 290 76 L 290 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="290,96 388,134 290,172 192,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="130" text-anchor="middle" font-size="12" fill="#333">node == null ?</text>

  <!-- 是 → 返回 -->
  <path d="M 388 134 L 458 134" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="126" font-size="10" fill="#b85450">是</text>
  <rect x="458" y="118" width="90" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="503" y="139" text-anchor="middle" font-size="11" fill="#888">return</text>

  <!-- 否 ↓ -->
  <path d="M 290 172 L 290 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="186" font-size="10" fill="#82b366">否</text>

  <!-- ① 递归左 -->
  <rect x="150" y="192" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="212" text-anchor="middle" font-size="11" fill="#333">① dfs(node.left)   // 左子树</text>

  <path d="M 290 222 L 290 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 更新 streak（菱形：val == prev ?） -->
  <polygon points="290,242 408,278 290,314 172,278" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="290" y="274" text-anchor="middle" font-size="11" fill="#333">node.val == prev ?</text>

  <!-- 是 → count++ -->
  <path d="M 408 278 L 470 278" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="270" font-size="10" fill="#b85450">是</text>
  <rect x="470" y="262" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="283" text-anchor="middle" font-size="11" fill="#333">count++</text>

  <!-- 否 → count=1, prev=val -->
  <path d="M 172 278 L 110 278" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="270" font-size="10" fill="#b85450">否</text>
  <rect x="40" y="262" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="283" text-anchor="middle" font-size="11" fill="#333">count=1; prev=val</text>

  <!-- 汇合 ↓ 到 ③ -->
  <path d="M 510 294 L 510 322 L 290 322" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 80 294 L 80 322 L 290 322" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 290 322 L 290 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 比较 count 与 maxCount（菱形） -->
  <polygon points="290,342 408,376 290,410 172,376" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#333">count vs maxCount</text>

  <!-- > → 更新众数 -->
  <path d="M 408 376 L 446 376" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="368" font-size="10" fill="#b85450">&gt;</text>
  <rect x="446" y="360" width="118" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="505" y="382" text-anchor="middle" font-size="10" fill="#333">maxCount=count; ans=[val]</text>

  <!-- == → 追加 -->
  <path d="M 172 376 L 130 376" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="368" font-size="10" fill="#b85450">==</text>
  <rect x="20" y="360" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="382" text-anchor="middle" font-size="10" fill="#333">ans.push(val)</text>

  <!-- ④ 递归右（从 maxCount 菱形底部出） -->
  <path d="M 290 410 L 290 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="424" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="444" text-anchor="middle" font-size="11" fill="#333">④ dfs(node.right)   // 右子树</text>

  <!-- 回溯虚线 -->
  <path d="M 510 376 L 540 376 L 540 60 L 410 60" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="546" y="220" font-size="10" fill="#b85450" transform="rotate(-90 546 220)">逐层 return</text>
</svg>
