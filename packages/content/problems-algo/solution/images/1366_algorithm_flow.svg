<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建位次矩阵 → 按向量降序排序 → 拼串返回</text>

  <!-- ① 初始化矩阵 -->
  <rect x="70" y="46" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化 cnt[团队][位次] = 0（m 个团队 × m 个位次）</text>

  <path d="M270 90 L270 118" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ② 遍历选票累加 -->
  <rect x="70" y="120" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="147" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 遍历每张选票 v：对每个位次 i，cnt[v[i]][i]++</text>

  <path d="M270 164 L270 192" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ③ 排序 -->
  <rect x="70" y="194" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 按位次向量字典序降序排序团队</text>

  <path d="M270 238 L270 264" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- ④ 比较器菱形 -->
  <polygon points="270,266 380,308 270,350 160,308" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">逐位次比较</text>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt[a][i] vs cnt[b][i]</text>
  <text x="270" y="332" text-anchor="middle" font-size="10" fill="#888">全并列 → a &lt; b 字母序</text>

  <!-- 否：继续下一位次 (左侧回路) -->
  <path d="M160 308 L50 308 L50 230 L70 230" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="42" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 42 270)">并列，下一位</text>

  <!-- 是：定序 -->
  <path d="M380 308 L470 308 L470 216 L440 216" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="480" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" transform="rotate(-90 480 262)">分出高低</text>

  <!-- ⑤ 返回字符串 -->
  <rect x="440" y="194" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">拼串</text>
  <text x="480" y="230" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回</text>

  <!-- 底部说明 -->
  <text x="270" y="392" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">不变式：cnt[团队] 向量的字典序降序 = 官方排名规则</text>
  <text x="270" y="412" text-anchor="middle" font-size="11" fill="#888">先比位0票数→并列比位1→…→全并列按字母升序</text>
  <text x="270" y="432" text-anchor="middle" font-size="10" fill="#aaa">时间 O(n·m + m² log m) / 空间 O(m²)，m = 团队数 ≤ 26</text>
</svg>
