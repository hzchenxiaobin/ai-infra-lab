<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按 car_id 一把聚合，总量相除得平均费率</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6 笔交易 → 2 辆车 · lot_id 只是明细属性，不参与分组</text>

  <text x="120" y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">交易明细（原始行序）</text>

  <!-- 左列：6 笔交易 -->
  <rect x="22" y="66" width="196" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="83" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1001 · 1号场 · 2.5h · ¥5</text>

  <rect x="22" y="100" width="196" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="117" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1001 · 1号场 · 1.75h · ¥3</text>

  <rect x="22" y="134" width="196" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="151" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1001 · 2号场 · 1.25h · ¥6</text>

  <rect x="22" y="168" width="196" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="185" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">1002 · 2号场 · 2.5h · ¥4</text>

  <rect x="22" y="202" width="196" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="219" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1001 · 3号场 · 2h · ¥4</text>

  <rect x="22" y="236" width="196" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="253" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">1002 · 3号场 · 2h · ¥2</text>

  <!-- 分组汇聚箭头：蓝 → 车1001 -->
  <path d="M 218 79 Q 244 79 251 98" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 218 113 Q 240 113 250 112" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 218 147 Q 242 147 251 126" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 218 215 Q 244 215 251 136" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" opacity="0.75" filter="url(#rough2)"/>

  <!-- 分组汇聚箭头：绿 → 车1002 -->
  <path d="M 218 181 Q 242 181 250 226" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 218 249 Q 240 249 250 244" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" opacity="0.75" filter="url(#rough2)"/>

  <!-- 中列：分组桶 -->
  <rect x="254" y="70" width="132" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">车 1001（4 笔）</text>
  <text x="320" y="114" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">Σ时长 = 7.50 h</text>
  <text x="320" y="136" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">Σ费用 = ¥18.00</text>

  <rect x="254" y="198" width="132" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">车 1002（2 笔）</text>
  <text x="320" y="242" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">Σ时长 = 4.50 h</text>
  <text x="320" y="264" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">Σ费用 = ¥6.00</text>

  <!-- 桶 → 结果 -->
  <path d="M 386 112 Q 398 112 405 112" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 386 240 Q 398 240 405 240" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 右列：费率结果 -->
  <rect x="408" y="88" width="98" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="457" y="108" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">18.00 ÷ 7.50</text>
  <text x="457" y="127" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 2.40</text>

  <rect x="408" y="216" width="98" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="457" y="236" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">6.00 ÷ 4.50</text>
  <text x="457" y="255" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 1.33</text>

  <!-- 底部注解 -->
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">费率 = Σ费用 ÷ Σ时长 —— 先加总、再相除（加权平均）</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">逐笔费率直接取平均会得到 2.63 / 1.30 —— 口径错误！</text>
</svg>
