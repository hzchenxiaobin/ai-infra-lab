<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：edges=[[0,1,10],[0,2,1],[1,2,2]], maxMoves=6</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">压缩边权：0-1=11, 0-2=2, 1-2=3；从 0 出发跑 Dijkstra</text>

  <!-- ===== Dijkstra steps table ===== -->
  <text x="40" y="70" font-size="11" fill="#446688" font-weight="bold">Dijkstra 过程</text>

  <!-- headers -->
  <text x="56" y="92" font-size="9" fill="#888" font-weight="bold">步骤</text>
  <text x="120" y="92" font-size="9" fill="#888" font-weight="bold">弹出(d,u)</text>
  <text x="232" y="92" font-size="9" fill="#888" font-weight="bold">松弛动作</text>
  <text x="400" y="92" font-size="9" fill="#888" font-weight="bold">dist[]</text>
  <text x="510" y="92" font-size="9" fill="#888" font-weight="bold">堆</text>

  <!-- initial -->
  <rect x="20" y="98" width="520" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="116" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">初始</text>
  <text x="150" y="116" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="300" y="116" text-anchor="middle" font-size="9" fill="#888">dist[0]=0</text>
  <text x="420" y="116" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[0,∞,∞]</text>
  <text x="518" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a" font-family="monospace">[(0,0)]</text>

  <!-- step 1 -->
  <rect x="20" y="130" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="155" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="150" y="155" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(0, 0)</text>
  <text x="300" y="148" text-anchor="middle" font-size="9" fill="#555">0→1: 0+11=11 ✓</text>
  <text x="300" y="162" text-anchor="middle" font-size="9" fill="#555">0→2: 0+2=2 ✓</text>
  <text x="420" y="155" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[0,11,2]</text>
  <text x="518" y="155" text-anchor="middle" font-size="9" fill="#4a7a3a" font-family="monospace">[(2,2),(11,1)]</text>

  <!-- step 2 -->
  <rect x="20" y="174" width="520" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="150" y="194" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(2, 2)</text>
  <text x="300" y="194" text-anchor="middle" font-size="9" fill="#555">2→1: 2+3=5 &lt; 11 ✓ 优化!</text>
  <text x="420" y="194" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[0,5,2]</text>
  <text x="518" y="194" text-anchor="middle" font-size="9" fill="#4a7a3a" font-family="monospace">[(5,1),(11,1)]</text>

  <!-- step 3 -->
  <rect x="20" y="212" width="520" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="231" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="150" y="231" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(5, 1)</text>
  <text x="300" y="231" text-anchor="middle" font-size="9" fill="#888">1→2: 5+3=8 &gt; 2 ✗</text>
  <text x="420" y="231" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">[0,5,2]</text>
  <text x="518" y="231" text-anchor="middle" font-size="9" fill="#aaa" font-family="monospace">[(11,1)]</text>

  <!-- step 4 -->
  <rect x="20" y="248" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="150" y="266" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(11, 1)</text>
  <text x="300" y="266" text-anchor="middle" font-size="9" fill="#b85450">11&gt;5 过期，懒删除跳过</text>
  <text x="420" y="266" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">[0,5,2]</text>
  <text x="518" y="266" text-anchor="middle" font-size="9" fill="#aaa" font-family="monospace">[]</text>

  <!-- dist result -->
  <path d="M 280 280 L 280 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="302" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dist = [0, 5, 2] → 绕路 0→2→1(5步) 比直走 0→1(11步) 更近</text>

  <!-- ===== Per-edge counting ===== -->
  <text x="40" y="360" font-size="11" fill="#446688" font-weight="bold">按边统计新节点（maxMoves=6）</text>

  <!-- headers -->
  <text x="70" y="382" font-size="9" fill="#888" font-weight="bold">边(u,v,cnt)</text>
  <text x="180" y="382" font-size="9" fill="#888" font-weight="bold">a=6−dist[u]</text>
  <text x="280" y="382" font-size="9" fill="#888" font-weight="bold">b=6−dist[v]</text>
  <text x="380" y="382" font-size="9" fill="#888" font-weight="bold">min(cnt,a+b)</text>
  <text x="490" y="382" font-size="9" fill="#888" font-weight="bold">贡献</text>

  <!-- edge 0-1 -->
  <rect x="20" y="388" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="406" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">(0,1,10)</text>
  <text x="210" y="406" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">6−0=6</text>
  <text x="310" y="406" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">6−5=1</text>
  <text x="410" y="406" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">min(10,7)=7</text>
  <text x="500" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- edge 0-2 -->
  <rect x="20" y="420" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="438" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">(0,2,1)</text>
  <text x="210" y="438" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">6−0=6</text>
  <text x="310" y="438" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">6−2=4</text>
  <text x="410" y="438" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">min(1,10)=1</text>
  <text x="500" y="438" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- edge 1-2 -->
  <rect x="20" y="452" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="470" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">(1,2,2)</text>
  <text x="210" y="470" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">6−5=1</text>
  <text x="310" y="470" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">6−2=4</text>
  <text x="410" y="470" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">min(2,5)=2</text>
  <text x="500" y="470" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Final answer ===== -->
  <rect x="60" y="494" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="512" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">原始节点 3 + 新节点 (7+1+2) = 13</text>
  <text x="280" y="526" text-anchor="middle" font-size="9" fill="#666">dist 均 ≤6 → 3 个原始节点全可达</text>
</svg>
