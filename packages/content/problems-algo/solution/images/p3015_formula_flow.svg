<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：枚举点对 + O(1) 距离公式</text>

  <rect x="130" y="48" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 n, x, y</text>

  <path d="M 260 86 L 260 112" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="116" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">若 x &gt; y：交换 —— 统一 x ≤ y</text>

  <path d="M 260 154 L 260 180" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="184" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">枚举无序点对 1 ≤ i &lt; j ≤ n</text>

  <path d="M 260 222 L 260 248" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="252" width="260" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">d = min( j−i , |i−x| + 1 + |j−y| )</text>

  <path d="M 260 290 L 260 316" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="320" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">res[d−1] += 2 （(i,j) 与 (j,i)）</text>

  <path d="M 260 358 L 260 378" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,382 345,410 260,438 175,410" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="415" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">点对枚举完？</text>

  <path d="M 345 410 L 374 410" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="358" y="401" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="378" y="390" width="132" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="415" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">返回 res</text>

  <path d="M 175 410 L 92 410 L 92 203 L 124 203" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="160" y="401" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
</svg>
