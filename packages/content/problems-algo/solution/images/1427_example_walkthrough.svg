<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "abcdefg"，逐次移位 vs delta 累加（示例 2）</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">左图逐次搬运字符串；右图只累加 delta，最后取模切片，结果一致</text>

  <!-- column headers -->
  <text x="56" y="74" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="132" y="74" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">delta</text>
  <text x="288" y="74" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">字符串状态（红=右移到前，橙=左移到尾）</text>

  <!-- ===== Row: start ===== -->
  <rect x="24" y="86" width="64" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">初始</text>
  <text x="132" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <!-- a b c d e f g -->
  <rect x="180" y="86" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="194" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="211" y="86" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="225" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="242" y="86" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="256" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="273" y="86" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="287" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="304" y="86" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="318" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="335" y="86" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="349" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="366" y="86" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>

  <!-- ===== Row: step1 [1,1] right ===== -->
  <rect x="24" y="120" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="138" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">[1,1]右</text>
  <text x="132" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="150" y="138" font-size="9" fill="#b85450">+1</text>
  <!-- g a b c d e f ; g red -->
  <rect x="180" y="120" width="28" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>
  <rect x="211" y="120" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="225" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="242" y="120" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="256" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="273" y="120" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="287" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="304" y="120" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="318" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="335" y="120" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="349" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="366" y="120" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>

  <!-- ===== Row: step2 [1,1] right ===== -->
  <rect x="24" y="154" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="172" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">[1,1]右</text>
  <text x="132" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="150" y="172" font-size="9" fill="#b85450">+1</text>
  <!-- f g a b c d e ; f red -->
  <rect x="180" y="154" width="28" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="211" y="154" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="225" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>
  <rect x="242" y="154" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="256" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="273" y="154" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="287" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="304" y="154" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="318" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="335" y="154" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="349" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="366" y="154" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>

  <!-- ===== Row: step3 [0,2] left ===== -->
  <rect x="24" y="188" width="64" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="206" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[0,2]左</text>
  <text x="132" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <text x="150" y="206" font-size="9" fill="#d6a040">−2</text>
  <!-- a b c d e f g ; f,g orange (moved to end) -->
  <rect x="180" y="188" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="194" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="211" y="188" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="225" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="242" y="188" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="256" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="273" y="188" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="287" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="304" y="188" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="318" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="335" y="188" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="349" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="366" y="188" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>

  <!-- ===== Row: step4 [1,3] right ===== -->
  <rect x="24" y="222" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="240" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">[1,3]右</text>
  <text x="132" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="150" y="240" font-size="9" fill="#b85450">+3</text>
  <!-- e f g a b c d ; e,f,g red -->
  <rect x="180" y="222" width="28" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="211" y="222" width="28" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="225" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="242" y="222" width="28" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="256" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>
  <rect x="273" y="222" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="287" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="304" y="222" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="318" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="335" y="222" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="349" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="366" y="222" width="28" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>

  <!-- arrow down to slice -->
  <path d="M 132 252 L 132 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== mod + slice row ===== -->
  <rect x="24" y="268" width="64" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="286" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">取模切片</text>
  <rect x="96" y="268" width="100" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="286" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3 mod 7 = 3</text>
  <path d="M 200 281 L 224 281" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="228" y="268" width="180" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-family="monospace">s[7−3:] + s[:7−3]</text>
  <path d="M 410 281 L 434 281" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="438" y="268" width="120" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="498" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-family="monospace">"efg" + "abcd"</text>

  <!-- note: bypass middle -->
  <rect x="430" y="86" width="180" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" fill-opacity="0.6" filter="url(#rough2)"/>
  <text x="520" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">累加法：跳过中间态</text>
  <text x="442" y="128" font-size="9" fill="#555">不逐步搬运字符串，只更新 delta：</text>
  <text x="442" y="144" font-size="9" fill="#b85450" font-family="monospace">  delta = 0</text>
  <text x="442" y="158" font-size="9" fill="#b85450" font-family="monospace">  delta += 1  → 1</text>
  <text x="442" y="172" font-size="9" fill="#b85450" font-family="monospace">  delta += 1  → 2</text>
  <text x="442" y="186" font-size="9" fill="#d6a040" font-family="monospace">  delta -= 2  → 0</text>
  <text x="442" y="200" font-size="9" fill="#b85450" font-family="monospace">  delta += 3  → 3</text>

  <!-- final result -->
  <rect x="24" y="312" width="600" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="324" y="334" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终结果："efgabcd"  ✓ 两种路径一致</text>

  <!-- ===== Bottom: delta shortcut insight ===== -->
  <rect x="24" y="358" width="600" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="324" y="380" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">关键洞察：旋转是可叠加的代数量</text>
  <text x="40" y="400" font-size="10" fill="#555">• <tspan font-weight="bold" fill="#446688">右移 +amount，左移 −amount</tspan>：把方向编码为符号，amount 编码为大小，m 次移位塌缩成一次加法 delta = Σ ±amount。</text>
  <text x="40" y="416" font-size="10" fill="#555">• <tspan font-weight="bold" fill="#4a7a3a">取模消化巨大/负偏移</tspan>：n 位一循环，delta mod n 把任意整数归一到 [0,n)；右移 delta 等价于取末尾 delta 字符到开头。</text>
  <text x="40" y="432" font-size="10" fill="#555">• <tspan font-weight="bold" fill="#b85450">省去中间态</tspan>：无需逐步搬运字符串，O(m) 累加 + O(n) 一次切片 = O(n+m)，而暴力逐次搬运为 O(m·n)。</text>
  <text x="40" y="446" font-size="9" fill="#888">  注：右移 d ⇔ 左移 n−d，故也可统一记"净左移 L = −delta"，结果 s[L:] + s[:L]，两种记法等价。</text>
</svg>
