<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="320" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三种方案对比：update 与 sumRange 谁快？</text>

  <!-- header -->
  <rect x="40" y="48" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="48" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="48" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="48" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">方案</text>
  <text x="235" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">update</text>
  <text x="365" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">sumRange</text>
  <text x="490" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">适用场景</text>

  <!-- row 1: 原数组 -->
  <rect x="40" y="86" width="130" height="40" fill="#fff" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="86" width="130" height="40" fill="#fff" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="86" width="130" height="40" fill="#fff" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="86" width="120" height="40" fill="#fff" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="105" y="111" text-anchor="middle" font-size="12" fill="#333">原数组</text>
  <text x="235" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">O(1) ✓</text>
  <text x="365" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">O(n) ✗</text>
  <text x="490" y="111" text-anchor="middle" font-size="11" fill="#888">更新多、查询少</text>

  <!-- row 2: 前缀和 -->
  <rect x="40" y="130" width="130" height="40" fill="#fff" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="130" width="130" height="40" fill="#fff" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="130" width="130" height="40" fill="#fff" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="130" width="120" height="40" fill="#fff" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="105" y="155" text-anchor="middle" font-size="12" fill="#333">前缀和</text>
  <text x="235" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">O(n) ✗</text>
  <text x="365" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">O(1) ✓</text>
  <text x="490" y="155" text-anchor="middle" font-size="11" fill="#888">查询多、不更新</text>

  <!-- row 3: 树状数组 (highlight) -->
  <rect x="40" y="174" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="170" y="174" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="300" y="174" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="430" y="174" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="105" y="201" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">树状数组 BIT</text>
  <text x="235" y="201" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">O(log n) ✓</text>
  <text x="365" y="201" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">O(log n) ✓</text>
  <text x="490" y="201" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">两者兼顾 ★</text>

  <!-- bottom note -->
  <rect x="40" y="240" width="510" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="295" y="262" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">树状数组用 lowbit 把两种极端折中：</text>
  <text x="295" y="280" text-anchor="middle" font-size="11" fill="#555">单点更新只改 O(log n) 个汇总值，区间查询只累加 O(log n) 个汇总值</text>
  <text x="295" y="294" text-anchor="middle" font-size="10" fill="#888">调用次数与 n 同级时，累计 O(q·log n) 远优于 O(n²)</text>
</svg>
