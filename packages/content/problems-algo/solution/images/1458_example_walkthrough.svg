<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums1=[2,1,−2,5] × nums2=[3,0,−6]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">逐行填 dp 表，★ 标最优路径，答案 dp[4][3]=18</text>

  <!-- ===== dp table ===== -->
  <!-- corner -->
  <rect x="60" y="58" width="56" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="88" y="78" text-anchor="middle" font-size="10" fill="#888">nums1\2</text>

  <!-- column headers: −∞, 3, 0, −6 -->
  <rect x="116" y="58" width="56" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="144" y="78" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <rect x="172" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="228" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="256" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <rect x="284" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="312" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">−6</text>

  <!-- Row 0: −∞ (all -inf) -->
  <rect x="60" y="90" width="56" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="88" y="110" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <g font-size="10" fill="#bbb">
    <rect x="116" y="90" width="56" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="144" y="110" text-anchor="middle">−∞</text>
    <rect x="172" y="90" width="56" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="200" y="110" text-anchor="middle">−∞</text>
    <rect x="228" y="90" width="56" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="256" y="110" text-anchor="middle">−∞</text>
    <rect x="284" y="90" width="56" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="312" y="110" text-anchor="middle">−∞</text>
  </g>

  <!-- Row 1: nums1[0]=2 -->
  <rect x="60" y="120" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <g font-size="11" fill="#bbb">
    <rect x="116" y="120" width="56" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="144" y="140" text-anchor="middle">−∞</text>
  </g>
  <!-- dp[1][1]=6 ★ key -->
  <rect x="172" y="120" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6 ★</text>
  <!-- dp[1][2]=6 -->
  <rect x="228" y="120" width="56" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="140" text-anchor="middle" font-size="11" fill="#555">6</text>
  <!-- dp[1][3]=6 -->
  <rect x="284" y="120" width="56" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="140" text-anchor="middle" font-size="11" fill="#555">6</text>

  <!-- Row 2: nums1[1]=1 -->
  <rect x="60" y="150" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <g font-size="11" fill="#bbb">
    <rect x="116" y="150" width="56" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="144" y="170" text-anchor="middle">−∞</text>
  </g>
  <!-- dp[2][1]=6 -->
  <rect x="172" y="150" width="56" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="170" text-anchor="middle" font-size="11" fill="#555">6</text>
  <!-- dp[2][2]=6 (prefix for key step) -->
  <rect x="228" y="150" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="256" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <!-- dp[2][3]=6 -->
  <rect x="284" y="150" width="56" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="170" text-anchor="middle" font-size="11" fill="#555">6</text>

  <!-- Row 3: nums1[2]=-2 -->
  <rect x="60" y="180" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">−2</text>
  <g font-size="11" fill="#bbb">
    <rect x="116" y="180" width="56" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="144" y="200" text-anchor="middle">−∞</text>
  </g>
  <!-- dp[3][1]=6 -->
  <rect x="172" y="180" width="56" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="11" fill="#555">6</text>
  <!-- dp[3][2]=6 -->
  <rect x="228" y="180" width="56" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="200" text-anchor="middle" font-size="11" fill="#555">6</text>
  <!-- dp[3][3]=18 ★★ key cell -->
  <rect x="284" y="180" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="312" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">18 ★</text>

  <!-- Row 4: nums1[3]=5 -->
  <rect x="60" y="210" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <g font-size="11" fill="#bbb">
    <rect x="116" y="210" width="56" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="144" y="230" text-anchor="middle">−∞</text>
  </g>
  <!-- dp[4][1]=15 -->
  <rect x="172" y="210" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="230" text-anchor="middle" font-size="11" fill="#555">15</text>
  <!-- dp[4][2]=15 -->
  <rect x="228" y="210" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="256" y="230" text-anchor="middle" font-size="11" fill="#555">15</text>
  <!-- dp[4][3]=18 ★ answer -->
  <rect x="284" y="210" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="230" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">18 ★</text>

  <!-- ===== annotations on the right ===== -->
  <!-- key step callout -->
  <rect x="360" y="120" width="200" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="140" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键一步：dp[3][3]</text>
  <text x="460" y="158" text-anchor="middle" font-size="10" fill="#555">p=(−2)×(−6)=12</text>
  <text x="460" y="174" text-anchor="middle" font-size="10" fill="#555">② 12 + dp[2][2]=6 → 18</text>
  <text x="460" y="188" text-anchor="middle" font-size="9" fill="#888">负负得正，续接前缀增益</text>

  <!-- skip callout -->
  <rect x="360" y="206" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="460" y="224" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp[4][3]=18</text>
  <text x="460" y="240" text-anchor="middle" font-size="10" fill="#555">③ 跳过 5（5×−6=−30 拖累）</text>

  <!-- arrow from dp[2][2] to dp[3][3] -->
  <path d="M 256 180 L 256 172 L 312 172 L 312 180" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="262" y="168" font-size="9" fill="#4a7a3a">续接 +12</text>

  <!-- arrow from dp[3][3] to dp[4][3] -->
  <path d="M 312 210 L 312 210" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <path d="M 312 210 L 312 210" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- ===== answer banner ===== -->
  <rect x="60" y="262" width="500" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="310" y="283" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = dp[4][3] = 18 ✓</text>

  <!-- ===== optimal path trace ===== -->
  <rect x="60" y="306" width="500" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">最优路径回溯</text>
  <text x="310" y="344" text-anchor="middle" font-size="10" fill="#555">dp[1][1]=6 (2×3) → dp[2][2]=6 (沿用) → dp[3][3]=18 (② +12) → dp[4][3]=18 (③跳过5)</text>
  <text x="310" y="362" text-anchor="middle" font-size="10" fill="#4a7a3a">子序列 [2, −2] · [3, −6] = 2×3 + (−2)×(−6) = 6 + 12 = 18</text>

  <!-- ===== legend ===== -->
  <g font-size="9" fill="#888">
    <rect x="70" y="392" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="90" y="403">最优路径</text>
    <rect x="160" y="392" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="180" y="403">关键/答案格</text>
    <rect x="270" y="392" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="290" y="403">5×3 续接</text>
    <rect x="360" y="392" width="14" height="14" fill="#fafafa" stroke="#ddd" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="403">−∞ 不可达</text>
  </g>
  <text x="310" y="430" text-anchor="middle" font-size="9" fill="#888">注：dp[i][0] 与 dp[0][j] 全为 −∞（空数组无法构成非空子序列）</text>
</svg>
