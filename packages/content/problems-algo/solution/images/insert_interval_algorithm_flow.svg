<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">插入区间：三阶段算法流程</text>

  <!-- Start -->
  <ellipse cx="300" cy="56" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#333">开始: i=0, res=[], ns/ne=newInterval</text>

  <path d="M 300 76 L 300 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 1 ===== -->
  <text x="50" y="106" font-size="11" fill="#4a7a3a" font-weight="bold">① 左侧</text>
  <!-- Diamond: intervals[i].end < ns? -->
  <polygon points="300,92 460,130 300,168 140,130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="126" text-anchor="middle" font-size="11" fill="#333">i &lt; n &amp;&amp;</text>
  <text x="300" y="142" text-anchor="middle" font-size="11" fill="#333">intervals[i].end &lt; ns?</text>

  <!-- Yes: push and continue -->
  <path d="M 300 168 L 300 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="180" font-size="10" fill="#4a7a3a">是</text>
  <rect x="180" y="186" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="208" text-anchor="middle" font-size="11" fill="#333">res.push(intervals[i]), i++</text>

  <!-- loop back to phase 1 diamond -->
  <path d="M 180 203 L 100 203 L 100 130 L 140 130" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="72" y="170" font-size="9" fill="#888" transform="rotate(-90 72 170)">继续左侧</text>

  <!-- No: go to phase 2 -->
  <path d="M 460 130 L 510 130 L 510 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="122" font-size="10" fill="#b85450">否</text>

  <!-- ===== Phase 2 ===== -->
  <text x="50" y="232" font-size="11" fill="#d6a040" font-weight="bold">② 中间</text>
  <!-- Diamond: intervals[i].start <= ne? -->
  <polygon points="300,238 460,278 300,318 140,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="274" text-anchor="middle" font-size="11" fill="#333">i &lt; n &amp;&amp;</text>
  <text x="300" y="290" text-anchor="middle" font-size="11" fill="#333">intervals[i].start ≤ ne?</text>

  <!-- Yes: merge -->
  <path d="M 300 318 L 300 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="330" font-size="10" fill="#d6a040">是</text>
  <rect x="160" y="336" width="280" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="356" text-anchor="middle" font-size="11" fill="#333">ns = min(ns, intervals[i].start)</text>
  <text x="300" y="374" text-anchor="middle" font-size="11" fill="#333">ne = max(ne, intervals[i].end), i++</text>

  <!-- loop back to phase 2 diamond -->
  <path d="M 160 360 L 80 360 L 80 278 L 140 278" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="320" font-size="9" fill="#888" transform="rotate(-90 52 320)">继续合并</text>

  <!-- No: push merged interval, go to phase 3 -->
  <path d="M 460 278 L 510 278 L 510 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="270" font-size="10" fill="#b85450">否</text>

  <rect x="200" y="398" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="420" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">res.push([ns, ne])</text>

  <path d="M 300 432 L 300 448" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 3 ===== -->
  <text x="50" y="452" font-size="11" fill="#4a7a3a" font-weight="bold">③ 右侧</text>
  <!-- Diamond: i < n? -->
  <polygon points="300,450 430,484 300,518 170,484" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="488" text-anchor="middle" font-size="11" fill="#333">i &lt; n?</text>

  <!-- Yes: push remaining -->
  <path d="M 300 518 L 300 534" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="530" font-size="10" fill="#4a7a3a">是</text>
  <rect x="180" y="536" width="240" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="550" text-anchor="middle" font-size="10" fill="#333">res.push(intervals[i]), i++ → 回到③</text>

  <!-- No: return -->
  <path d="M 430 484 L 510 484" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="476" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="514" y="470" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="549" y="489" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">返回 res</text>
</svg>
