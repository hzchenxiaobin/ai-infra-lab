<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：n=8, roads=[[0,1],[1,2],[2,3],[2,4],[5,6],[5,7]]</text>

  <!-- Step 1 label -->
  <text x="24" y="60" font-size="11" fill="#446688" font-weight="bold">① 各城度数</text>

  <!-- Degree boxes: 8 boxes, width 50, height 44, start x=49, gap 6 -->
  <!-- City 0: deg 1 -->
  <rect x="49" y="68" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="86" text-anchor="middle" font-size="11" fill="#888">城 0</text>
  <text x="74" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- City 1: deg 2 (secondDeg candidate, green) -->
  <rect x="105" y="68" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a">城 1</text>
  <text x="130" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- City 2: deg 3 (maxDeg, orange) -->
  <rect x="161" y="68" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="86" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">城 2</text>
  <text x="186" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- City 3: deg 1 -->
  <rect x="217" y="68" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="86" text-anchor="middle" font-size="11" fill="#888">城 3</text>
  <text x="242" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- City 4: deg 1 -->
  <rect x="273" y="68" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="86" text-anchor="middle" font-size="11" fill="#888">城 4</text>
  <text x="298" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- City 5: deg 2 (secondDeg candidate, green) -->
  <rect x="329" y="68" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a">城 5</text>
  <text x="354" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- City 6: deg 1 -->
  <rect x="385" y="68" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="86" text-anchor="middle" font-size="11" fill="#888">城 6</text>
  <text x="410" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- City 7: deg 1 -->
  <rect x="441" y="68" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="86" text-anchor="middle" font-size="11" fill="#888">城 7</text>
  <text x="466" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- Legend -->
  <rect x="495" y="72" width="38" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="514" y="82" text-anchor="middle" font-size="8" fill="#d6a040">max</text>
  <rect x="495" y="88" width="38" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="514" y="98" text-anchor="middle" font-size="8" fill="#4a7a3a">次大</text>

  <!-- Step 2 -->
  <text x="24" y="146" font-size="11" fill="#446688" font-weight="bold">② maxDeg = 3</text>
  <rect x="150" y="132" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">first = [2]（仅 1 个）</text>

  <!-- Step 3 -->
  <text x="24" y="186" font-size="11" fill="#446688" font-weight="bold">③ u = 2</text>
  <rect x="80" y="172" width="430" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="295" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">secondDeg = 2 → 候选 v ∈ {1, 5}</text>

  <!-- Step 4: candidate evaluation -->
  <text x="24" y="226" font-size="11" fill="#446688" font-weight="bold">④ 评估候选</text>

  <!-- (2,1): connected -->
  <rect x="40" y="234" width="460" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="256" font-size="11" fill="#333" font-weight="bold">(2, 1)</text>
  <text x="130" y="256" font-size="11" fill="#888">直连? 是（道路 1-2）</text>
  <text x="320" y="256" font-size="11" fill="#333">rank = 3 + 2 − 1 =</text>
  <text x="450" y="256" font-size="13" fill="#555" font-weight="bold">4</text>

  <!-- (2,5): not connected -->
  <rect x="40" y="276" width="460" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="298" font-size="11" fill="#b85450" font-weight="bold">(2, 5)</text>
  <text x="130" y="298" font-size="11" fill="#888">直连? 否（无道路）</text>
  <text x="320" y="298" font-size="11" fill="#333">rank = 3 + 2 − 0 =</text>
  <text x="450" y="298" font-size="13" fill="#b85450" font-weight="bold">5 ✓</text>

  <!-- Result box -->
  <rect x="120" y="332" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">最大网络秩 = 5（命中上限，早停）</text>
</svg>
