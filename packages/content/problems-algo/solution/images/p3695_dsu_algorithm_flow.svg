<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">流程：并查集建分量 → 分组统计 E → 每分量降序排序 → 公式累加</text>

  <!-- start -->
  <rect x="215" y="38" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 280,66 L 280,84" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="155" y="88" width="250" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">① 并查集合并每个 swap 对 [p,q]</text>
  <text x="280" y="122" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">交换对 = 无向边，union(find(p), find(q))</text>
  <path d="M 280,130 L 280,148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="155" y="152" width="250" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">② 分组：值入桶 val[find(i)]</text>
  <text x="280" y="186" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i 为偶下标时 even[find(i)] += 1</text>
  <path d="M 280,194 L 280,212" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="155" y="216" width="250" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">③ 取一个未处理分量，值降序排序</text>
  <text x="280" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">各分量排序成本合计 ≤ n log n</text>
  <path d="M 280,258 L 280,276" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="155" y="280" width="250" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">④ topE = 前 E 个之和</text>
  <text x="280" y="314" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">ans += 2 × topE − sumAll</text>
  <path d="M 280,322 L 280,344" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,348 362,378 280,408 198,378" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">还有分量？</text>
  <text x="280" y="392" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（sumAll 顺路求出）</text>

  <!-- no branch: return -->
  <path d="M 362,378 L 415,378" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="370" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="418" y="361" width="122" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="479" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- yes branch: loop back to step 3 -->
  <path d="M 198,378 L 108,378 L 108,237 L 151,237" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="370" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="60" y="308" font-size="9.5" fill="#888" filter="url(#rough2)">下一分量</text>

  <!-- bottom note -->
  <rect x="30" y="416" width="500" height="20" fill="#fafafa" stroke="none" rx="0" filter="url(#rough2)"/>
  <text x="42" y="432" font-size="10" fill="#888" filter="url(#rough2)">⚠️ 答案绝对值可达 ~10¹⁴：C++ 用 long long；并查集路径压缩 + 按秩合并近 O(α(n))</text>
</svg>
