<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐行判定 5 个节点的类型</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="48" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="65" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">id</text>
  <rect x="70" y="48" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="95" y="65" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">p_id</text>
  <rect x="120" y="48" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="65" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">p_id IS NULL?</text>
  <rect x="220" y="48" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">id 出现在 p_id 列?</text>
  <rect x="340" y="48" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="375" y="65" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">type</text>
  <rect x="410" y="48" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="475" y="65" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">判定依据</text>

  <!-- ===== Row 1: id=1, p_id=NULL -> Root ===== -->
  <rect x="30" y="74" width="40" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="70" y="74" width="50" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="93" text-anchor="middle" font-size="10" fill="#888">NULL</text>
  <rect x="120" y="74" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Yes ✓</text>
  <rect x="220" y="74" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="93" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Yes (2,3 指向 1)</text>
  <rect x="340" y="74" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="375" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Root</text>
  <rect x="410" y="74" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="93" text-anchor="middle" font-size="9" fill="#b85450">p_id IS NULL → Root</text>

  <!-- ===== Row 2: id=2, p_id=1 -> Inner ===== -->
  <rect x="30" y="104" width="40" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="123" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="70" y="104" width="50" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="123" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="104" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="123" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="220" y="104" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">Yes (4,5 指向 2)</text>
  <rect x="340" y="104" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="375" y="123" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Inner</text>
  <rect x="410" y="104" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="123" text-anchor="middle" font-size="9" fill="#b85450">有父 + 有子 → Inner</text>

  <!-- ===== Row 3: id=3, p_id=1 -> Leaf ===== -->
  <rect x="30" y="134" width="40" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="153" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="70" y="134" width="50" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="153" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="134" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="220" y="134" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="153" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="340" y="134" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="375" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Leaf</text>
  <rect x="410" y="134" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="153" text-anchor="middle" font-size="9" fill="#b85450">有父 + 无子 → Leaf</text>

  <!-- ===== Row 4: id=4, p_id=2 -> Leaf ===== -->
  <rect x="30" y="164" width="40" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="70" y="164" width="50" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="120" y="164" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="220" y="164" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="340" y="164" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="375" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Leaf</text>
  <rect x="410" y="164" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="183" text-anchor="middle" font-size="9" fill="#b85450">有父 + 无子 → Leaf</text>

  <!-- ===== Row 5: id=5, p_id=2 -> Leaf ===== -->
  <rect x="30" y="194" width="40" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="70" y="194" width="50" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="95" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="120" y="194" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="220" y="194" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="213" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="340" y="194" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="375" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Leaf</text>
  <rect x="410" y="194" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="213" text-anchor="middle" font-size="9" fill="#b85450">有父 + 无子 → Leaf</text>

  <!-- ===== Arrow from table to conclusion ===== -->
  <path d="M280 232 L280 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Conclusion box ===== -->
  <rect x="60" y="256" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键转换：「有子节点」= id 出现在某行的 p_id 列中</text>
  <text x="280" y="296" text-anchor="middle" font-size="9.5" fill="#555">即 id IN (SELECT p_id FROM Tree WHERE p_id IS NOT NULL)</text>

  <!-- ===== Example 2 single node ===== -->
  <rect x="60" y="320" width="440" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="342" font-size="10.5" fill="#4a7a3a" font-weight="bold">示例 2（单节点树）：Tree 仅有一行 (id=1, p_id=NULL)</text>
  <text x="80" y="360" font-size="10" fill="#555">• p_id IS NULL → Yes → Root（不论有无子节点，无父即为根）</text>
  <text x="80" y="376" font-size="10" fill="#b85450" font-weight="bold">→ 单节点树中该节点既是 Root 也无子，但仍归类为 Root</text>
</svg>
