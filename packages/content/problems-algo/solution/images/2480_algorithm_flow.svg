<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：过滤 → 交叉连接 → 输出</text>
  <text x="340" y="42" text-anchor="middle" font-size="10.5" fill="#888">CROSS JOIN = 笛卡尔积：左表每行 × 右表每行</text>

  <!-- ============ Step 0: Elements source ============ -->
  <rect x="255" y="58" width="170" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="76" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">Elements 表（7 行）</text>
  <text x="340" y="91" text-anchor="middle" font-size="9.5" fill="#888">He, Na, Ca, La, Cl, O, N</text>

  <!-- split arrows down -->
  <path d="M 300 100 L 170 140" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 380 100 L 510 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ Step 1: filter Metal ============ -->
  <rect x="60" y="146" width="220" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① WHERE type = 'Metal'</text>
  <text x="78" y="186" font-size="10.5" fill="#333" filter="url(#rough2)">Na (e=1)</text>
  <text x="78" y="202" font-size="10.5" fill="#333" filter="url(#rough2)">Ca (e=2)</text>
  <text x="78" y="218" font-size="10.5" fill="#333" filter="url(#rough2)">La (e=3)</text>
  <text x="200" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 行</text>

  <!-- ============ Step 2: filter Nonmetal ============ -->
  <rect x="400" y="146" width="220" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="510" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② WHERE type = 'Nonmetal'</text>
  <text x="418" y="186" font-size="10.5" fill="#333" filter="url(#rough2)">Cl (e=1)</text>
  <text x="418" y="202" font-size="10.5" fill="#333" filter="url(#rough2)">O (e=2)</text>
  <text x="418" y="218" font-size="10.5" fill="#333" filter="url(#rough2)">N (e=3)</text>
  <text x="540" y="230" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3 行</text>

  <!-- arrows to CROSS JOIN -->
  <path d="M 170 240 L 290 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 510 240 L 390 282" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ Step 3: CROSS JOIN ============ -->
  <rect x="200" y="268" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="340" y="288" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ CROSS JOIN（笛卡尔积）</text>
  <text x="340" y="303" text-anchor="middle" font-size="10" fill="#888">3 × 3 = 9 对</text>

  <!-- arrow down to output -->
  <path d="M 340 314 L 340 338" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ Step 4: Output ============ -->
  <rect x="180" y="342" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ SELECT metal, nonmetal</text>
  <text x="340" y="374" text-anchor="middle" font-size="9.5" fill="#888">输出 9 行：(Na,Cl) (Na,O) (Na,N) (Ca,Cl) … (La,N)，顺序任意</text>
</svg>
