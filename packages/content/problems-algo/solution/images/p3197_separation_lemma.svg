<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">引理：两个不重叠的轴对齐矩形之间，必有一条贯通缝隙线</text>

  <!-- 左图：左右分离 -->
  <text x="135" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x 投影不交 → 左右分离</text>
  <!-- 背景网格示意 -->
  <rect x="30" y="62" width="210" height="160" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <line x1="100" y1="62" x2="100" y2="222" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="62" x2="170" y2="222" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="115" x2="240" y2="115" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="168" x2="240" y2="168" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- 矩形 A -->
  <rect x="42" y="88" width="52" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="126" text-anchor="middle" font-size="13" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">A</text>
  <!-- 矩形 B -->
  <rect x="176" y="128" width="52" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="163" text-anchor="middle" font-size="13" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">B</text>
  <!-- 贯通竖线 -->
  <line x1="136" y1="54" x2="136" y2="232" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="136" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">一条竖线贯通全网格</text>
  <!-- x 投影示意 -->
  <line x1="42" y1="36" x2="94" y2="36" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="176" y1="36" x2="228" y2="36" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <text x="135" y="40" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">投影不交</text>

  <!-- 右图：上下分离 -->
  <text x="385" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">y 投影不交 → 上下分离</text>
  <rect x="280" y="62" width="210" height="160" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <line x1="350" y1="62" x2="350" y2="222" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="62" x2="420" y2="222" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="115" x2="490" y2="115" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="168" x2="490" y2="168" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- 矩形 C（上） -->
  <rect x="308" y="76" width="98" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="101" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">C</text>
  <!-- 矩形 D（下） -->
  <rect x="338" y="150" width="86" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="181" text-anchor="middle" font-size="13" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">D</text>
  <!-- 贯通横线 -->
  <line x1="272" y1="138" x2="498" y2="138" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="385" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">一条横线贯通全网格</text>
  <!-- y 投影示意 -->
  <line x1="504" y1="76" x2="504" y2="116" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <line x1="504" y1="150" x2="504" y2="202" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <text x="508" y="140" font-size="11" fill="#888" filter="url(#rough2)">不交</text>

  <!-- 结论框 1 -->
  <rect x="30" y="262" width="460" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">两个投影都相交会怎样？x 有公共列、y 有公共行 → 有公共格子 → 矛盾！</text>
  <text x="260" y="297" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">所以不重叠的两矩形，二者必居其一：左右分离 或 上下分离</text>

  <!-- 结论框 2 -->
  <rect x="30" y="312" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">三矩形归约：先用一条贯通线分出 1 个矩形（一定能找到），</text>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">剩下 2 个再用引理切一刀 → 「川 / 三 / T」共 6 种规范形态</text>
</svg>
