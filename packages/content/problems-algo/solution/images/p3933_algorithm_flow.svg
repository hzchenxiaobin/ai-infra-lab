<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建 201 张阈值前缀表，每个非零格 O(1) 判定</text>

  <!-- step 1 -->
  <rect x="115" y="38" width="340" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="285" y="58" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 预处理：对每个阈值 v ∈ [0, 200] 建二维前缀计数表</text>
  <text x="285" y="76" text-anchor="middle" font-size="10.5" fill="#555">pre[v][i][j] = 矩形 [0,0)~[i,j) 内 值 &gt; v 的格子数</text>

  <path d="M 285 88 L 285 100" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="115" y="102" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="285" y="125" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 枚举每个非零格 (i,j)，令 x = matrix[i][j]</text>

  <path d="M 285 138 L 285 150" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="115" y="152" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="285" y="175" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 裁剪正方形：r1/r2/c1/c2 用 max、min 防越界</text>

  <path d="M 285 188 L 285 200" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="115" y="202" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="285" y="225" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">④ 用 pre[x] 容斥查询 cnt = 正方形内 值 &gt; x 的格子数</text>

  <path d="M 285 238 L 285 250" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="115" y="252" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="285" y="275" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">⑤ 界内角 (i±x, j±x) 值 &gt; x 则 cnt−−（挖角补正）</text>

  <path d="M 285 288 L 285 300" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="285,300 385,336 285,372 185,336" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="285" y="333" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">cnt == 0 ?</text>
  <text x="285" y="350" text-anchor="middle" font-size="10" fill="#8899aa">区域内没有更大的值</text>

  <!-- yes branch -->
  <path d="M 385 336 L 456 336" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="458" y="318" width="88" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="502" y="341" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">ans++ ✓</text>

  <!-- no branch -->
  <path d="M 285 372 L 285 392" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="297" y="387" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="285" y="408" text-anchor="middle" font-size="10.5" fill="#999">跳过</text>

  <!-- loop back to step 2 -->
  <path d="M 185 336 C 120 336, 96 300, 96 240 C 96 170, 96 122, 112 120" fill="none" stroke="#8899aa" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="56" y="232" font-size="10.5" fill="#8899aa">下一格</text>

  <!-- bottom panel -->
  <rect x="60" y="416" width="440" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">全部格子遍历完后 return ans</text>
  <text x="280" y="449" text-anchor="middle" font-size="10.5" fill="#a87020">建表 O(201·n·m) ≈ 8×10⁶；空间 O(V·n·m) ≈ 33 MB（按值分组复用可压到 O(n·m)）</text>
</svg>
