<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：三级优先匹配 + 三种规范化键</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">查询按优先级依次查三张哈希表，命中即返回；元音用通配符 * 归一</text>

  <!-- ===== 查询单词 ===== -->
  <text x="40" y="84" font-size="12" fill="#444" font-weight="bold">query = "keti"</text>
  <rect x="40" y="92" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">k</text>
  <rect x="92" y="92" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="115" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">e</text>
  <rect x="144" y="92" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">t</text>
  <rect x="196" y="92" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="115" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">i</text>

  <!-- ===== 三级优先链 ===== -->
  <text x="300" y="100" font-size="12" fill="#444" font-weight="bold">按优先级依次尝试 ↓</text>

  <!-- 第 1 级：精确匹配 -->
  <rect x="300" y="110" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="312" y="132" font-size="11" fill="#333"><tspan font-weight="bold" fill="#4a7a3a">① 精确</tspan>（区分大小写）原串作键 → 未命中</text>

  <!-- 第 2 级：大小写不敏感 -->
  <rect x="300" y="150" width="250" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="312" y="172" font-size="11" fill="#333"><tspan font-weight="bold" fill="#d6a040">② 小写化</tspan> lower(query) 作键 → 未命中</text>

  <!-- 第 3 级：元音通配 -->
  <rect x="300" y="190" width="250" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="312" y="212" font-size="11" fill="#333"><tspan font-weight="bold" fill="#b85450">③ 元音→*</tspan> lower 后元音替换为 * → 命中!</text>

  <!-- 三级之间的箭头 -->
  <line x1="425" y1="144" x2="425" y2="150" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="425" y1="184" x2="425" y2="190" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 命中后箭头到结果 -->
  <line x1="300" y1="207" x2="244" y2="207" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- ===== 三种规范化键示意 ===== -->
  <text x="40" y="170" font-size="12" fill="#444" font-weight="bold">三种规范化键：</text>

  <text x="40" y="190" font-size="11" fill="#4a7a3a">① exact key :</text>
  <rect x="120" y="180" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="140" y="196" text-anchor="middle" font-size="11" fill="#333">keti</text>

  <text x="40" y="218" font-size="11" fill="#d6a040">② lower key:</text>
  <rect x="120" y="208" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="140" y="224" text-anchor="middle" font-size="11" fill="#333">keti</text>

  <text x="40" y="246" font-size="11" fill="#b85450">③ vowel key:</text>
  <rect x="120" y="236" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="145" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k*t*</text>

  <text x="180" y="252" font-size="10" fill="#888">元音位全换成 *</text>

  <!-- ===== wordlist 中的 KiTe 如何归一 ===== -->
  <text x="40" y="288" font-size="12" fill="#444" font-weight="bold">wordlist = ["KiTe", "kite", ...]</text>
  <text x="40" y="308" font-size="11" fill="#555">"KiTe" 的三种键：</text>
  <text x="40" y="324" font-size="10" fill="#4a7a3a">  ① "KiTe"   </text>
  <text x="180" y="324" font-size="10" fill="#d6a040">② "kite"</text>
  <text x="300" y="324" font-size="10" fill="#b85450">③ "k*t*"  ← 与 query 的 ③ 相同！</text>

  <!-- ===== 关键观察框 ===== -->
  <rect x="40" y="338" width="510" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">关键观察：</text>
  <text x="54" y="376" font-size="10" fill="#555">把每个 word 归一成三种确定性键，预存「首次出现」的 word；查询时按优先级查表 O(1) 命中即返回</text>
</svg>
