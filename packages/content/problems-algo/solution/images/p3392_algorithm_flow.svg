<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="20" y="30" font-size="13" fill="#333" filter="url(#rough2)">单趟扫描 O(n)</text>

  <!-- start -->
  <rect x="200" y="18" width="120" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="39" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">开始</text>
  <path d="M260,50 L260,70" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="185" y="72" width="150" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">count = 0，i = 1</text>
  <path d="M260,106 L260,132" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- condition diamond -->
  <polygon points="260,136 352,172 260,208 168,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2×(nums[i−1]+nums[i+1])</text>
  <text x="260" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">== nums[i] ?</text>

  <!-- yes: count++ -->
  <text x="362" y="164" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M352,172 L388,172" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="155" width="96" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="438" y="177" text-anchor="middle" font-size="13" fill="#8c3a34" filter="url(#rough2)">count++</text>

  <!-- merge from count++ into main flow -->
  <path d="M438,189 L438,228 L260,228" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- no: down to i++ -->
  <text x="270" y="226" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M260,208 L260,240" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="205" y="242" width="110" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i++</text>
  <path d="M260,274 L260,292" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="260,296 325,330 260,364 195,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ≤ n−2 ?</text>

  <!-- yes: loop back -->
  <text x="150" y="322" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M195,330 L70,330 L70,172 L164,172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: return -->
  <text x="335" y="322" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M325,330 L361,330" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="363" y="313" width="122" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="335" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">返回 count</text>
</svg>
