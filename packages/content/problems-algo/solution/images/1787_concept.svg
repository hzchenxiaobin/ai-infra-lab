<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    核心观察：所有长度为 k 的窗口异或为 0 → 数组以 k 为周期
  </text>

  <!-- ===== Row 1: consecutive windows ===== -->
  <text x="60" y="60" font-size="11" fill="#888" filter="url(#rough2)">连续两个窗口</text>

  <!-- Window i: nums[0..2] = 3,4,5  (k=3) -->
  <rect x="110" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="152" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="194" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="172" y="88" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">窗口 i: 3⊕4⊕5 = 0?</text>

  <!-- Window i+1: nums[1..3] = 4,5,2 -->
  <rect x="152" y="100" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="194" y="100" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="236" y="100" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="214" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">窗口 i+1: 4⊕5⊕2 = 0?</text>

  <!-- XOR both windows -->
  <path d="M280,75 L280,115" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="300" y="98" font-size="10" fill="#b85450" filter="url(#rough2)">两式异或</text>

  <!-- Result: nums[i] = nums[i+k] -->
  <rect x="330" y="82" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">nums[i] ⊕ nums[i+k] = 0</text>
  <text x="470" y="130" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">⇒ nums[i] = nums[i+k]</text>

  <!-- ===== Row 2: periodicity ===== -->
  <text x="60" y="168" font-size="11" fill="#888" filter="url(#rough2)">数组以 k 为周期</text>

  <!-- nums = [3,4,5,2,1,7,3,4,7], k=3 -->
  <text x="60" y="190" font-size="10" fill="#888" filter="url(#rough2)">nums:</text>
  <rect x="100" y="176" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="140" y="176" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="180" y="176" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="220" y="176" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="260" y="176" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="300" y="176" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="340" y="176" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="380" y="176" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="399" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="420" y="176" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <!-- index labels -->
  <text x="119" y="218" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">0</text>
  <text x="159" y="218" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1</text>
  <text x="199" y="218" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">2</text>
  <text x="239" y="218" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">3</text>
  <text x="279" y="218" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">4</text>
  <text x="319" y="218" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">5</text>
  <text x="359" y="218" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">6</text>
  <text x="399" y="218" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">7</text>
  <text x="439" y="218" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">8</text>

  <!-- period arrows: 0→3→6, 1→4→7, 2→5→8 -->
  <path d="M119,224 Q119,236 239,236 Q239,236 359,224" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="239" y="240" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">i%k=0</text>
  <path d="M159,228 Q159,250 279,250 Q279,250 399,228" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="279" y="254" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">i%k=1</text>
  <path d="M199,232 Q199,264 319,264 Q319,264 439,232" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="319" y="268" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">i%k=2</text>

  <!-- ===== Row 3: groups ===== -->
  <text x="60" y="290" font-size="11" fill="#888" filter="url(#rough2)">按 i%k 分组</text>

  <rect x="100" y="280" width="130" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">组 0 (i%k=0)</text>
  <text x="165" y="314" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{3, 2, 3}</text>
  <text x="165" y="326" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3:2, 2:1</text>

  <rect x="240" y="280" width="130" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305" y="298" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">组 1 (i%k=1)</text>
  <text x="305" y="314" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{4, 1, 4}</text>
  <text x="305" y="326" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4:2, 1:1</text>

  <rect x="380" y="280" width="130" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">组 2 (i%k=2)</text>
  <text x="445" y="314" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{5, 7, 7}</text>
  <text x="445" y="326" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5:1, 7:2</text>

  <!-- ===== Bottom: insight ===== -->
  <rect x="40" y="346" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    每组选一个值 v[j]，使 v[0]⊕v[1]⊕…⊕v[k−1] = 0
  </text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    代价 = Σ (组大小 − v[j] 的频次)，求最小代价 → DP
  </text>
</svg>
