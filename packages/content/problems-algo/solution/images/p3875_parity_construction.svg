<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：减法奇偶法则 + 分类构造 —— 答案恒为 true</text>

  <!-- 引理 -->
  <rect x="48" y="28" width="424" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="45" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">减法奇偶法则：(a − b) 的奇偶 = a、b 奇偶的异或（同减得偶，异减得奇）</text>

  <!-- 三个口诀 chip -->
  <rect x="112" y="60" width="82" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="153" y="75" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">偶−偶 → 偶</text>
  <rect x="202" y="60" width="82" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="243" y="75" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">奇−奇 → 偶</text>
  <rect x="292" y="60" width="82" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="333" y="75" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">偶−奇 → 奇</text>
  <text x="384" y="75" font-size="9.5" fill="#b85450" filter="url(#rough2)">← 减奇数翻转奇偶</text>

  <!-- 分支箭头 -->
  <path d="M 140 86 L 140 96" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 86 L 380 96" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 情形 A 面板 -->
  <rect x="28" y="98" width="225" height="194" rx="10" fill="#f6f9fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="38" y="108" width="205" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="123" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">情形 A：nums1 全是偶数</text>

  <rect x="62" y="140" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="81" y="158" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="104" y="140" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="123" y="158" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="146" y="140" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="158" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="81" y="174" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="123" y="174" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="165" y="174" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>

  <path d="M 140 178 L 140 194" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="210" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">每个 i 都选操作一</text>
  <text x="140" y="226" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums2[i] = nums1[i]（原样照抄）</text>

  <rect x="38" y="236" width="205" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="252" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">nums2 = [4,6,8] → 全偶 ✓</text>
  <text x="140" y="278" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">连一次减法都不需要</text>

  <!-- 情形 B 面板 -->
  <rect x="267" y="98" width="225" height="194" rx="10" fill="#fdf9ef" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="277" y="108" width="205" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="123" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">情形 B：nums1 至少含一个奇数</text>

  <rect x="312" y="140" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="331" y="158" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="354" y="140" width="38" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="373" y="158" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="331" y="174" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="373" y="174" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>

  <text x="282" y="192" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">目标定为全奇：</text>
  <text x="282" y="210" font-size="10" fill="#333" filter="url(#rough2)">奇位(1)：选操作一 → 3 仍是奇</text>
  <text x="282" y="226" font-size="10" fill="#333" filter="url(#rough2)">偶位(0)：减奇数 → 2−3=−1 变奇</text>

  <rect x="277" y="236" width="205" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="379" y="252" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">nums2 = [−1, 3] → 全奇 ✓</text>
  <text x="379" y="278" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">偶位减的奇数必在别处 → j ≠ i 自动满足</text>

  <!-- 汇合箭头 -->
  <path d="M 140 292 L 226 316" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 292 L 294 316" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="30" y="318" width="460" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">情形 A ∪ 情形 B = 所有可能的输入 ⇒ 答案恒为 true</text>
  <text x="260" y="350" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">这正是官方 hint “There is only one possible answer” 的含义</text>
</svg>
