<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：中位钉死 k，左半压顶，右半托底</text>

  <!-- Section A: sorted array with three segments -->
  <text x="46" y="58" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序后按中位下标 m = n/2 切三段（示例 a = [2,5,5,6,8]，k = 4）</text>

  <text x="120" y="68" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">左半：终值 ≤ k</text>
  <text x="201" y="68" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">中位 = k</text>
  <text x="297" y="68" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">右半：终值 ≥ k</text>

  <rect x="70" y="76" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="124" y="76" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="147" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="178" y="76" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="98" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="232" y="76" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="286" y="76" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <text x="93" y="128" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">≤4 白嫖</text>
  <text x="147" y="128" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">5&gt;4 → 压到 4（+1）</text>
  <text x="201" y="128" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">|5−4| = +1</text>
  <text x="282" y="128" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">≥ 4 白嫖</text>

  <!-- Section B: three pricing rules -->
  <text x="46" y="164" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 三段各自的定价规则（逐位独立，直接求和）</text>

  <rect x="40" y="178" width="176" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="128" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i &lt; m（左半）</text>
  <text x="128" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cost = max(0, a[i] − k)</text>
  <text x="128" y="238" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">超标者压到恰好 k，多压纯亏</text>

  <rect x="222" y="178" width="176" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i = m（中位）</text>
  <text x="310" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cost = |a[m] − k|</text>
  <text x="310" y="238" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">必须恰好等于 k，一分不多</text>

  <rect x="404" y="178" width="176" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="492" y="198" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i &gt; m（右半）</text>
  <text x="492" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cost = max(0, k − a[i])</text>
  <text x="492" y="238" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">不足者抬到恰好 k，多抬纯亏</text>

  <text x="310" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">三段最优终值 min(a[i],k) / k / max(a[i],k) 拼接后仍有序 → 逐位最优可同时取到</text>

  <!-- bottom summary -->
  <rect x="40" y="296" width="540" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">✓ ans = |a[m]−k| + Σ max(0, a[i]−k) [i&lt;m] + Σ max(0, k−a[i]) [i&gt;m]</text>
  <text x="310" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 偶数长度：中位数取较大者 → m = n/2（不是 n/2 − 1）</text>
  <text x="310" y="366" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 答案上界 ≈ 2×10⁵ × 10⁹ = 2×10¹⁴ → C++/Java 用 long long</text>
</svg>
