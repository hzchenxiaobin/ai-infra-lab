<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 枚举 i → 双指针区间计数</text>

  <!-- step 1: sort -->
  <rect x="170" y="52" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 升序排序 nums</text>
  <text x="270" y="84" text-anchor="middle" font-size="9" fill="#888">O(n log n)，双射保下标三元组总数不变</text>
  <path d="M 270 96 L 270 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: outer loop i -->
  <rect x="120" y="116" width="300" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② for i in 0 .. n-3 ：固定第一个数 nums[i]</text>
  <text x="270" y="152" text-anchor="middle" font-size="9" fill="#888">枚举 i 作三元组首位（无需去重跳过）</text>
  <path d="M 270 168 L 270 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: init two pointers -->
  <rect x="150" y="188" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ left = i+1，right = n−1</text>
  <text x="270" y="220" text-anchor="middle" font-size="9" fill="#888">在 [i+1, n-1] 上双指针夹逼</text>
  <path d="M 270 232 L 270 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: while left < right -->
  <polygon points="270,252 360,300 270,348 180,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">left &lt; right ?</text>
  <text x="270" y="312" text-anchor="middle" font-size="10" fill="#555">s = nums[i]+nums[l]+nums[r]</text>

  <!-- left branch: s < target -->
  <path d="M 180 300 L 60 300 L 60 340" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">s &lt; target</text>
  <rect x="20" y="344" width="180" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="362" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">count += right − left</text>
  <text x="110" y="376" text-anchor="middle" font-size="9" fill="#555">[l+1 .. r] 全部命中</text>
  <text x="110" y="390" text-anchor="middle" font-size="9" fill="#555">left++</text>
  <!-- loop back to diamond -->
  <path d="M 110 406 L 110 430 L 270 430 L 270 348" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right branch: s >= target -->
  <path d="M 360 300 L 480 300 L 480 340" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="292" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">s ≥ target</text>
  <rect x="380" y="344" width="140" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="368" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">right--</text>
  <text x="450" y="384" text-anchor="middle" font-size="9" fill="#555">右端太大</text>
  <text x="450" y="396" text-anchor="middle" font-size="9" fill="#555">换更小值</text>
  <path d="M 450 406 L 450 430 L 270 430" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- exit -->
  <path d="M 270 348 L 270 348" stroke="none"/>
  <text x="270" y="456" text-anchor="middle" font-size="10" fill="#888">left ≥ right 退出循环 → 进入下一个 i</text>
</svg>
