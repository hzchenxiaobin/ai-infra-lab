<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两个输入的逐步执行</text>

  <!-- ============ Example 1 ============ -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">示例 1：s = "is2 sentence4 This1 a3"</text>

  <!-- table header -->
  <rect x="40" y="66" width="540" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步</text>
  <text x="190" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">当前词 w</text>
  <text x="300" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">末位 d</text>
  <text x="410" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">去尾词</text>
  <text x="520" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">bucket[d−1]</text>

  <!-- step 1: is2 -->
  <rect x="40" y="92" width="540" height="24" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="190" y="108" text-anchor="middle" font-size="11" fill="#333">is2</text>
  <text x="300" y="108" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="410" y="108" text-anchor="middle" font-size="11" fill="#333">is</text>
  <text x="520" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">bucket[1]=is</text>

  <!-- step 2: sentence4 -->
  <rect x="40" y="116" width="540" height="24" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="190" y="132" text-anchor="middle" font-size="11" fill="#333">sentence4</text>
  <text x="300" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#333">sentence</text>
  <text x="520" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">bucket[3]=sentence</text>

  <!-- step 3: This1 -->
  <rect x="40" y="140" width="540" height="24" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="156" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="190" y="156" text-anchor="middle" font-size="11" fill="#333">This1</text>
  <text x="300" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="410" y="156" text-anchor="middle" font-size="11" fill="#333">This</text>
  <text x="520" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">bucket[0]=This</text>

  <!-- step 4: a3 -->
  <rect x="40" y="164" width="540" height="24" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="190" y="180" text-anchor="middle" font-size="11" fill="#333">a3</text>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="410" y="180" text-anchor="middle" font-size="11" fill="#333">a</text>
  <text x="520" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">bucket[2]=a</text>

  <!-- result 1 -->
  <rect x="120" y="198" width="380" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="218" font-size="11" fill="#555">输出：</text>
  <text x="185" y="219" font-size="12" fill="#4a7a3a" font-weight="bold">"This is a sentence"</text>

  <!-- ============ Example 2 ============ -->
  <text x="40" y="252" font-size="12" fill="#446688" font-weight="bold">示例 2：s = "Myself2 Me1 I3 And4"</text>

  <!-- table header -->
  <rect x="40" y="260" width="540" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="275" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步</text>
  <text x="190" y="275" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">当前词 w</text>
  <text x="300" y="275" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">末位 d</text>
  <text x="410" y="275" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">去尾词</text>
  <text x="520" y="275" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">bucket[d−1]</text>

  <!-- step 1: Myself2 -->
  <rect x="40" y="282" width="540" height="20" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="296" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="190" y="296" text-anchor="middle" font-size="10" fill="#333">Myself2</text>
  <text x="300" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="410" y="296" text-anchor="middle" font-size="10" fill="#333">Myself</text>
  <text x="520" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bucket[1]=Myself</text>

  <!-- step 2: Me1 -->
  <rect x="40" y="302" width="540" height="20" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="316" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="190" y="316" text-anchor="middle" font-size="10" fill="#333">Me1</text>
  <text x="300" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="410" y="316" text-anchor="middle" font-size="10" fill="#333">Me</text>
  <text x="520" y="316" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">bucket[0]=Me</text>

  <!-- step 3: I3 -->
  <rect x="40" y="322" width="540" height="20" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="336" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="190" y="336" text-anchor="middle" font-size="10" fill="#333">I3</text>
  <text x="300" y="336" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="410" y="336" text-anchor="middle" font-size="10" fill="#333">I</text>
  <text x="520" y="336" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">bucket[2]=I</text>

  <!-- step 4: And4 -->
  <rect x="40" y="342" width="540" height="20" fill="#fff8e1" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="356" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="190" y="356" text-anchor="middle" font-size="10" fill="#333">And4</text>
  <text x="300" y="356" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="410" y="356" text-anchor="middle" font-size="10" fill="#333">And</text>
  <text x="520" y="356" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">bucket[3]=And</text>

  <!-- result 2 -->
  <rect x="140" y="370" width="340" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="386" font-size="11" fill="#555">输出：</text>
  <text x="205" y="387" font-size="12" fill="#4a7a3a" font-weight="bold">"Me Myself I And"</text>
</svg>
