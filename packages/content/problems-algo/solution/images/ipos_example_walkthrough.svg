<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：text = "ababa", words = ["aba", "ab"]</text>

  <!-- text chars with indices -->
  <text x="40" y="56" font-size="11" fill="#888">text：</text>
  <text x="100" y="48" text-anchor="middle" font-size="8" fill="#888">0</text>
  <rect x="84" y="52" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="132" y="48" text-anchor="middle" font-size="8" fill="#888">1</text>
  <rect x="116" y="52" width="32" height="28" fill="#fff8e1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="164" y="48" text-anchor="middle" font-size="8" fill="#888">2</text>
  <rect x="148" y="52" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="196" y="48" text-anchor="middle" font-size="8" fill="#888">3</text>
  <rect x="180" y="52" width="32" height="28" fill="#fff8e1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="228" y="48" text-anchor="middle" font-size="8" fill="#888">4</text>
  <rect x="212" y="52" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="71" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <!-- walkthrough table -->
  <text x="20" y="108" font-size="11.5" fill="#446688" font-weight="bold">逐起点扫描（沿 Trie 走，碰到 is_end 就记 [i, j]）</text>

  <rect x="24" y="116" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="49" y="133" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i</text>
  <rect x="74" y="116" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="139" y="133" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Trie 路径</text>
  <rect x="204" y="116" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="269" y="133" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">命中 [i, j]</text>
  <rect x="334" y="116" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="133" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">说明</text>

  <!-- row i=0 -->
  <rect x="24" y="140" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="49" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="74" y="140" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="160" text-anchor="middle" font-size="10.5" fill="#333">a→b→a</text>
  <rect x="204" y="140" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="269" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[0,1], [0,2]</text>
  <rect x="334" y="140" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="424" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a">b、a 均为 is_end</text>

  <!-- row i=1 -->
  <rect x="24" y="170" width="50" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="49" y="190" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="74" y="170" width="130" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="190" text-anchor="middle" font-size="10.5" fill="#888">b（断）</text>
  <rect x="204" y="170" width="130" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="269" y="190" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <rect x="334" y="170" width="180" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="424" y="190" text-anchor="middle" font-size="10" fill="#aaa">root 无 b 子节点</text>

  <!-- row i=2 -->
  <rect x="24" y="200" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="49" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="74" y="200" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="220" text-anchor="middle" font-size="10.5" fill="#333">a→b→a</text>
  <rect x="204" y="200" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="269" y="220" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[2,3], [2,4]</text>
  <rect x="334" y="200" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="424" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a">同 i=0 模式</text>

  <!-- row i=3 -->
  <rect x="24" y="230" width="50" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="49" y="250" text-anchor="middle" font-size="11" fill="#888">3</text>
  <rect x="74" y="230" width="130" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="250" text-anchor="middle" font-size="10.5" fill="#888">b（断）</text>
  <rect x="204" y="230" width="130" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="269" y="250" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <rect x="334" y="230" width="180" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="424" y="250" text-anchor="middle" font-size="10" fill="#aaa">root 无 b 子节点</text>

  <!-- row i=4 -->
  <rect x="24" y="260" width="50" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="49" y="280" text-anchor="middle" font-size="11" fill="#888">4</text>
  <rect x="74" y="260" width="130" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="280" text-anchor="middle" font-size="10.5" fill="#888">a（断）</text>
  <rect x="204" y="260" width="130" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="269" y="280" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <rect x="334" y="260" width="180" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="424" y="280" text-anchor="middle" font-size="10" fill="#aaa">a 后 text 结束</text>

  <!-- note -->
  <text x="270" y="312" text-anchor="middle" font-size="10" fill="#d6a040">↑ i=0 和 i=2 走同一条 Trie 路径，各命中两次（"ab" 和 "aba"）</text>

  <!-- final result -->
  <rect x="60" y="328" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="353" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">输出：[[0,1], [0,2], [2,3], [2,4]]</text>

  <!-- brute force comparison -->
  <rect x="60" y="378" width="420" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">对比暴力：n 个起点 × m 个 word 逐个比较 → O(n·m·L)</text>
  <text x="270" y="416" text-anchor="middle" font-size="10" fill="#b85450">Trie 把 m 个 word 压缩成一棵树 → O(n·L_max)，L_max = 最长 word 长度</text>
</svg>
