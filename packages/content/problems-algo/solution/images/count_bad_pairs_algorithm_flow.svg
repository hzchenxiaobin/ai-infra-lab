<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单次遍历增量计数：边扫边累加好对</text>

  <!-- Start ellipse -->
  <ellipse cx="260" cy="50" rx="44" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 260 65 L 260 78" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init box -->
  <rect x="110" y="80" width="300" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#666">total = n(n−1)/2,  good = 0,  freq = {}</text>

  <path d="M 260 120 L 260 132" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop box -->
  <rect x="160" y="134" width="200" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取下一个 i  (0 ≤ i &lt; n)</text>

  <path d="M 260 162 L 260 174" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- d box -->
  <rect x="160" y="176" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d = nums[i] − i</text>

  <path d="M 260 204 L 260 216" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- good += freq[d] box (key step) -->
  <rect x="110" y="218" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">good += freq[d]</text>
  <text x="260" y="253" text-anchor="middle" font-size="10" fill="#4a7a3a">之前同 d 的个数 = 新增好对</text>

  <path d="M 260 258 L 260 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- freq[d]++ box -->
  <rect x="160" y="272" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">freq[d] += 1</text>

  <path d="M 260 300 L 260 312" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 还有? -->
  <path d="M 260 312 L 320 352 L 260 392 L 200 352 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">还有元素?</text>

  <!-- 否 down to return -->
  <path d="M 260 392 L 260 406" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="403" font-size="11" fill="#666" font-weight="bold">否</text>

  <!-- return box -->
  <rect x="130" y="408" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="432" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回  total − good   (坏数对)</text>

  <!-- 是 loop back: right vertex -> right -> up -> into loop box right edge -->
  <path d="M 320 352 L 470 352 L 470 148 L 360 148" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="345" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="452" y="250" font-size="10" fill="#888" transform="rotate(-90 452 250)">循环</text>

  <!-- bottom callout -->
  <rect x="20" y="456" width="480" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="469" text-anchor="middle" font-size="10" fill="#666">total 与 good 均可能达 n(n−1)/2 ≈ 5×10⁹，须用 64 位整数</text>
</svg>
