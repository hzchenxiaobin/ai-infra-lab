<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：第一次操作「定终身」——分数只有 3 种候选</text>

  <!-- Row 1: front two -->
  <g filter="url(#rough2)">
    <rect x="46" y="48" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="84" y="48" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="122" y="48" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="160" y="48" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="198" y="48" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="236" y="48" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <text x="62" y="69" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="100" y="69" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="138" y="69" text-anchor="middle" font-size="13" fill="#999">1</text>
    <text x="176" y="69" text-anchor="middle" font-size="13" fill="#999">2</text>
    <text x="214" y="69" text-anchor="middle" font-size="13" fill="#999">3</text>
    <text x="252" y="69" text-anchor="middle" font-size="13" fill="#999">4</text>
  </g>
  <g filter="url(#rough2)" font-size="8" fill="#999" text-anchor="middle">
    <text x="62" y="90">0</text><text x="100" y="90">1</text><text x="138" y="90">2</text>
    <text x="176" y="90">3</text><text x="214" y="90">4</text><text x="252" y="90">5</text>
  </g>
  <text x="286" y="63" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s₁ = nums[0] + nums[1] = 3+2 = 5</text>
  <text x="286" y="80" font-size="10.5" fill="#666" filter="url(#rough2)">取法一：删最前面两个</text>

  <!-- Row 2: last two -->
  <g filter="url(#rough2)">
    <rect x="46" y="116" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="84" y="116" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="122" y="116" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="160" y="116" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="198" y="116" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="236" y="116" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="62" y="137" text-anchor="middle" font-size="13" fill="#999">3</text>
    <text x="100" y="137" text-anchor="middle" font-size="13" fill="#999">2</text>
    <text x="138" y="137" text-anchor="middle" font-size="13" fill="#999">1</text>
    <text x="176" y="137" text-anchor="middle" font-size="13" fill="#999">2</text>
    <text x="214" y="137" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="252" y="137" text-anchor="middle" font-size="13" fill="#333">4</text>
  </g>
  <text x="286" y="131" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s₂ = nums[n−2] + nums[n−1] = 3+4 = 7</text>
  <text x="286" y="148" font-size="10.5" fill="#666" filter="url(#rough2)">取法二：删最后两个</text>

  <!-- Row 3: first + last -->
  <g filter="url(#rough2)">
    <rect x="46" y="184" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="84" y="184" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="122" y="184" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="160" y="184" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="198" y="184" width="32" height="32" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" rx="4"/>
    <rect x="236" y="184" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="62" y="205" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="100" y="205" text-anchor="middle" font-size="13" fill="#999">2</text>
    <text x="138" y="205" text-anchor="middle" font-size="13" fill="#999">1</text>
    <text x="176" y="205" text-anchor="middle" font-size="13" fill="#999">2</text>
    <text x="214" y="205" text-anchor="middle" font-size="13" fill="#999">3</text>
    <text x="252" y="205" text-anchor="middle" font-size="13" fill="#333">4</text>
  </g>
  <text x="286" y="199" font-size="12.5" fill="#b07830" font-weight="bold" filter="url(#rough2)">s₃ = nums[0] + nums[n−1] = 3+4 = 7</text>
  <text x="286" y="216" font-size="10.5" fill="#666" filter="url(#rough2)">取法三：删第一个 + 最后一个</text>

  <!-- note box -->
  <rect x="36" y="232" width="488" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">第一次操作必是三种取法之一 → 它的分数就是后续所有操作的分数</text>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">分数一旦确定就全程不变，因此候选分数至多 3 个，逐个代入验证即可</text>

  <!-- answer box -->
  <rect x="36" y="316" width="488" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = max{ dfs(0, n−1, s) ： s ∈ {s₁, s₂, s₃} }</text>
  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">相同的候选先去重；每个 s 独立做一遍 O(n²) 区间 DP</text>
</svg>
