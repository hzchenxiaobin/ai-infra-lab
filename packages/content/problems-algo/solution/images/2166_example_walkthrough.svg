<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：size=5 完整操作序列</text>
  <text x="290" y="42" text-anchor="middle" font-size="10.5" fill="#888">物理数组只在 fix/unfix 时变，flip 只翻标志位</text>

  <!-- ===== Table header ===== -->
  <rect x="24" y="56" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="48" y="73" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold">步</text>
  <rect x="76" y="56" width="92" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="122" y="73" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold">操作</text>
  <rect x="172" y="56" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="73" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">bits（物理）</text>
  <rect x="326" y="56" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="354" y="73" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">flipped</text>
  <rect x="386" y="56" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="406" y="73" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">ones</text>
  <rect x="430" y="56" width="126" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="493" y="73" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">逻辑视图</text>

  <!-- ===== Row 0: init ===== -->
  <text x="48" y="98" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="122" y="98" text-anchor="middle" font-size="9.5" fill="#555">init(5)</text>
  <rect x="178" y="86" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="191" y="101" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="206" y="86" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="219" y="101" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="234" y="86" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="101" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="262" y="86" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="275" y="101" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="290" y="86" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="303" y="101" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="354" y="98" text-anchor="middle" font-size="9.5" fill="#888">F</text>
  <text x="406" y="98" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="493" y="98" text-anchor="middle" font-size="9.5" fill="#b85450">00000</text>

  <!-- ===== Row 1: fix(3) ===== -->
  <text x="48" y="126" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="122" y="126" text-anchor="middle" font-size="9.5" fill="#555">fix(3)</text>
  <rect x="178" y="114" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="191" y="129" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="206" y="114" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="219" y="129" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="234" y="114" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="129" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="262" y="114" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="129" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="290" y="114" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="303" y="129" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="354" y="126" text-anchor="middle" font-size="9.5" fill="#888">F</text>
  <text x="406" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="493" y="126" text-anchor="middle" font-size="9.5" fill="#b85450">00010</text>

  <!-- ===== Row 2: fix(1) ===== -->
  <text x="48" y="154" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="122" y="154" text-anchor="middle" font-size="9.5" fill="#555">fix(1)</text>
  <rect x="178" y="142" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="191" y="157" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="206" y="142" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="219" y="157" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="234" y="142" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="157" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="262" y="142" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="157" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="290" y="142" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="303" y="157" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="354" y="154" text-anchor="middle" font-size="9.5" fill="#888">F</text>
  <text x="406" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="493" y="154" text-anchor="middle" font-size="9.5" fill="#b85450">01010</text>

  <!-- ===== Row 3: flip() — KEY ===== -->
  <rect x="20" y="168" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="182" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="122" y="182" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">flip()</text>
  <rect x="178" y="172" width="26" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="191" y="185" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="206" y="172" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="219" y="185" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="234" y="172" width="26" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="185" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="262" y="172" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="275" y="185" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="290" y="172" width="26" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="303" y="185" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="322" y="184" font-size="8.5" fill="#4a7a3a">不变</text>
  <text x="354" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="406" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="430" y="184" font-size="8" fill="#4a7a3a">5−2=</text>
  <text x="493" y="182" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">10101</text>

  <!-- ===== Row 4: all() ===== -->
  <text x="48" y="210" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="122" y="210" text-anchor="middle" font-size="9.5" fill="#555">all()</text>
  <text x="247" y="210" text-anchor="middle" font-size="9" fill="#aaa">(同上)</text>
  <text x="354" y="210" text-anchor="middle" font-size="9.5" fill="#888">T</text>
  <text x="406" y="210" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="493" y="210" text-anchor="middle" font-size="9.5" fill="#b85450">→ false</text>

  <!-- ===== Row 5: unfix(0) — KEY (flipped=true) ===== -->
  <rect x="20" y="218" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="232" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="122" y="232" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">unfix(0)</text>
  <rect x="178" y="222" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="191" y="235" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <rect x="206" y="222" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="219" y="235" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="234" y="222" width="26" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="235" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="262" y="222" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="275" y="235" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="290" y="222" width="26" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="303" y="235" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="322" y="234" font-size="8" fill="#d6a040" font-weight="bold">0→1</text>
  <text x="354" y="232" text-anchor="middle" font-size="9.5" fill="#888">T</text>
  <text x="406" y="232" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="493" y="232" text-anchor="middle" font-size="9.5" fill="#b85450">00101</text>

  <!-- ===== Row 6: flip() — KEY ===== -->
  <rect x="20" y="250" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="264" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="122" y="264" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">flip()</text>
  <rect x="178" y="254" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="191" y="267" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="206" y="254" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="219" y="267" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="234" y="254" width="26" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="267" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="262" y="254" width="26" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="275" y="267" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="290" y="254" width="26" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="303" y="267" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="322" y="266" font-size="8.5" fill="#4a7a3a">不变</text>
  <text x="354" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="406" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="430" y="266" font-size="8" fill="#4a7a3a">5−2=</text>
  <text x="493" y="264" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">11010</text>

  <!-- ===== Row 7: one() ===== -->
  <text x="48" y="292" text-anchor="middle" font-size="9.5" fill="#888">7</text>
  <text x="122" y="292" text-anchor="middle" font-size="9.5" fill="#555">one()</text>
  <text x="247" y="292" text-anchor="middle" font-size="9" fill="#aaa">(同上)</text>
  <text x="354" y="292" text-anchor="middle" font-size="9.5" fill="#888">F</text>
  <text x="406" y="292" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="493" y="292" text-anchor="middle" font-size="9.5" fill="#b85450">→ true</text>

  <!-- ===== Row 8: unfix(0) ===== -->
  <text x="48" y="320" text-anchor="middle" font-size="9.5" fill="#888">8</text>
  <text x="122" y="320" text-anchor="middle" font-size="9.5" fill="#555">unfix(0)</text>
  <rect x="178" y="308" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="191" y="323" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="206" y="308" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="219" y="323" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="234" y="308" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="247" y="323" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="262" y="308" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="275" y="323" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="290" y="308" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="303" y="323" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="354" y="320" text-anchor="middle" font-size="9.5" fill="#888">F</text>
  <text x="406" y="320" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="493" y="320" text-anchor="middle" font-size="9.5" fill="#b85450">01010</text>

  <!-- ===== Row 9: count() ===== -->
  <text x="48" y="348" text-anchor="middle" font-size="9.5" fill="#888">9</text>
  <text x="122" y="348" text-anchor="middle" font-size="9.5" fill="#555">count()</text>
  <text x="247" y="348" text-anchor="middle" font-size="9" fill="#aaa">(同上)</text>
  <text x="354" y="348" text-anchor="middle" font-size="9.5" fill="#888">F</text>
  <text x="406" y="348" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="493" y="348" text-anchor="middle" font-size="9.5" fill="#b85450">→ 2 ✓</text>

  <!-- ===== Row 10: toString() ===== -->
  <text x="48" y="376" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="122" y="376" text-anchor="middle" font-size="9.5" fill="#555">toString</text>
  <text x="247" y="376" text-anchor="middle" font-size="9" fill="#aaa">(同上)</text>
  <text x="354" y="376" text-anchor="middle" font-size="9.5" fill="#888">F</text>
  <text x="406" y="376" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="493" y="376" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">"01010" ✓</text>

  <!-- ===== Bottom insight ===== -->
  <rect x="24" y="396" width="532" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="416" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：第3、6步 flip 只翻 flipped 标志，物理数组零改动</text>
  <text x="290" y="434" text-anchor="middle" font-size="10" fill="#888">第5步 unfix(0) 时 flipped=true，逻辑位0是1，物理反而写1（反着想）</text>
  <text x="290" y="448" text-anchor="middle" font-size="10" fill="#888">ones 在 flip 时 = n − ones，在 fix/unfix 时 ±1，始终跟踪逻辑 1 的个数</text>
</svg>
