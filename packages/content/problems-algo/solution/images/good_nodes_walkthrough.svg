<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[3,1,4,3,null,1,5] 前序遍历逐节点判定</text>

  <!-- 小树示意 前序顺序 -->
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#888">前序顺序</text>
  <circle cx="90" cy="74" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="108" y="68" font-size="8" fill="#4a7a3a">①</text>
  <line x1="82" y1="84" x2="62" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="98" y1="84" x2="118" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="58" cy="110" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="113" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="46" y="106" font-size="8" fill="#b85450">②</text>
  <circle cx="122" cy="110" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="113" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="134" y="106" font-size="8" fill="#4a7a3a">④</text>
  <line x1="52" y1="118" x2="40" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="116" y1="118" x2="104" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="128" y1="118" x2="140" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="37" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="37" y="145" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="26" y="138" font-size="8" fill="#4a7a3a">③</text>
  <circle cx="101" cy="142" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="101" y="145" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="90" y="138" font-size="8" fill="#b85450">⑤</text>
  <circle cx="143" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="143" y="145" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="132" y="138" font-size="8" fill="#4a7a3a">⑥</text>

  <!-- 表格 表头 -->
  <rect x="195" y="48" width="415" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="230" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="310" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">入口 pathMax</text>
  <text x="410" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">val≥max?</text>
  <text x="510" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">刷新 max</text>
  <text x="580" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">count</text>

  <!-- 行 ① 根3 good -->
  <rect x="195" y="74" width="415" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="92" text-anchor="middle" font-size="10" fill="#333">① 根 3</text>
  <text x="310" y="92" text-anchor="middle" font-size="9" fill="#888">−∞</text>
  <text x="410" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 3≥−∞</text>
  <text x="510" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a">→ 3</text>
  <text x="580" y="92" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- 行 ② 节点1 bad -->
  <rect x="195" y="102" width="415" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="230" y="120" text-anchor="middle" font-size="10" fill="#333">② 节点 1</text>
  <text x="310" y="120" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">❌ 1&lt;3</text>
  <text x="510" y="120" text-anchor="middle" font-size="9" fill="#888">不变 3</text>
  <text x="580" y="120" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- 行 ③ 叶3 good -->
  <rect x="195" y="130" width="415" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="148" text-anchor="middle" font-size="10" fill="#333">③ 叶 3</text>
  <text x="310" y="148" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="410" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 3≥3</text>
  <text x="510" y="148" text-anchor="middle" font-size="9" fill="#888">不变 3</text>
  <text x="580" y="148" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 行 ④ 节点4 good -->
  <rect x="195" y="158" width="415" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="176" text-anchor="middle" font-size="10" fill="#333">④ 节点 4</text>
  <text x="310" y="176" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="410" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 4≥3</text>
  <text x="510" y="176" text-anchor="middle" font-size="9" fill="#4a7a3a">→ 4</text>
  <text x="580" y="176" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- 行 ⑤ 叶1 bad -->
  <rect x="195" y="186" width="415" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="230" y="204" text-anchor="middle" font-size="10" fill="#333">⑤ 叶 1</text>
  <text x="310" y="204" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="410" y="204" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">❌ 1&lt;4</text>
  <text x="510" y="204" text-anchor="middle" font-size="9" fill="#888">不变 4</text>
  <text x="580" y="204" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- 行 ⑥ 叶5 good -->
  <rect x="195" y="214" width="415" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="232" text-anchor="middle" font-size="10" fill="#333">⑥ 叶 5</text>
  <text x="310" y="232" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="410" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 5≥4</text>
  <text x="510" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">→ 5</text>
  <text x="580" y="232" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- 表格边框 + 分隔线 -->
  <rect x="195" y="48" width="415" height="194" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="265" y1="74" x2="265" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="355" y1="74" x2="355" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="465" y1="74" x2="465" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="555" y1="74" x2="555" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="60" y="266" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 count = 4 ✓</text>
  <text x="310" y="306" text-anchor="middle" font-size="10" fill="#555">好节点 = 根3① + 叶3③ + 节点4④ + 叶5⑥（路径上无更大值）</text>

  <!-- 关键观察 -->
  <rect x="60" y="330" width="500" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="350" text-anchor="middle" font-size="10" fill="#555">② 1&lt;3 被压住 → 非好，但 pathMax 仍以 3 继续下传，故 ③ 3≥3 仍为好</text>
  <text x="310" y="368" text-anchor="middle" font-size="10" fill="#555">④ 4≥3 命中 → 刷新 pathMax=4，⑤ 1&lt;4 被新最值压住</text>
  <text x="310" y="384" text-anchor="middle" font-size="10" fill="#888">参数传递天然隔离：左子树（max=3）与右子树（max=3 起，遇 4 刷新）互不影响</text>
</svg>
