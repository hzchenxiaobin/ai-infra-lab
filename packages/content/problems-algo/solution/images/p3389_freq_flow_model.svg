<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">固定 c = 2：盈余右移搭桥，缺口补增</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">occ 上的操作：删 −1 · 增 +1 · 变换 = 右移一格（每格 1 次）</text>

  <!-- 目标线 t=2 -->
  <path d="M 70 228 L 395 228" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="400" y="232" font-size="11" fill="#4a7a3a" filter="url(#rough2)">目标线 t=2</text>

  <!-- 字母 a：3 格，最上一格盈余 -->
  <rect x="88" y="254" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="88" y="228" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="88" y="202" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">盈余 1</text>

  <!-- 字母 b：1 格 + 目标缺口 -->
  <rect x="208" y="254" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="228" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="246" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">缺口</text>

  <!-- 字母 c：1 格 + 目标缺口 -->
  <rect x="328" y="254" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="328" y="228" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="350" y="246" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">缺口</text>

  <!-- 基线与字母标注 -->
  <path d="M 70 280 L 395 280" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="110" y="300" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="230" y="300" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="350" y="300" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="110" y="317" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">occ=3</text>
  <text x="230" y="317" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">occ=1</text>
  <text x="350" y="317" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">occ=1</text>

  <!-- 操作3：盈余 a 搭桥到 b 的缺口 -->
  <path d="M 134 212 Q 182 210 202 234" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="185" y="202" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">操作3：a→b</text>

  <!-- 操作2：新增字符补 c 的缺口 -->
  <path d="M 432 172 Q 402 182 356 224" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="430" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">操作2：新增</text>

  <!-- 总结框 -->
  <rect x="60" y="330" width="400" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">基础代价 3 − 搭桥省 1 = 2 次操作（示例 aaabc）</text>
</svg>
