<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：commands=[4,-1,4,-2,4], obstacles=[[2,4]] → 65</text>

  <!-- ===== Left: coordinate grid ===== -->
  <rect x="24" y="36" width="210" height="408" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="129" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">机器人路径（XY 平面）</text>

  <!-- grid lines: x=0..3, y=0..8, cell=26, origin(0,0)=(72,360) -->
  <!-- vertical lines -->
  <line x1="72" y1="90" x2="72" y2="360" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="98" y1="90" x2="98" y2="360" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="124" y1="90" x2="124" y2="360" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="150" y1="90" x2="150" y2="360" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <!-- horizontal lines -->
  <line x1="72" y1="360" x2="176" y2="360" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="72" y1="334" x2="176" y2="334" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="72" y1="308" x2="176" y2="308" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="72" y1="282" x2="176" y2="282" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="72" y1="256" x2="176" y2="256" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="72" y1="230" x2="176" y2="230" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="72" y1="204" x2="176" y2="204" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="72" y1="178" x2="176" y2="178" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="72" y1="152" x2="176" y2="152" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- axes -->
  <line x1="72" y1="360" x2="180" y2="360" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="72" y1="360" x2="72" y2="84" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="364" font-size="9.5" fill="#446688">x</text>
  <text x="68" y="80" text-anchor="end" font-size="9.5" fill="#446688">y</text>
  <!-- axis ticks -->
  <text x="72" y="374" text-anchor="middle" font-size="8" fill="#888">0</text>
  <text x="98" y="374" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="124" y="374" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="150" y="374" text-anchor="middle" font-size="8" fill="#888">3</text>
  <text x="62" y="363" text-anchor="end" font-size="8" fill="#888">0</text>
  <text x="62" y="337" text-anchor="end" font-size="8" fill="#888">1</text>
  <text x="62" y="259" text-anchor="end" font-size="8" fill="#888">4</text>
  <text x="62" y="155" text-anchor="end" font-size="8" fill="#888">8</text>

  <!-- path cells (green) col x=0, y=0..4 -->
  <rect x="72" y="334" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="72" y="308" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="72" y="282" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="72" y="256" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="72" y="230" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <!-- path cells col x=1, y=4..8 -->
  <rect x="98" y="230" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="98" y="204" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="98" y="178" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="98" y="152" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>

  <!-- start (0,0) -->
  <rect x="72" y="334" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="85" y="352" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">起</text>

  <!-- obstacle (2,4) -->
  <rect x="124" y="230" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="137" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="137" y="220" text-anchor="middle" font-size="8" fill="#b85450">(2,4)障</text>

  <!-- max (1,8) -->
  <rect x="98" y="152" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <text x="111" y="170" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">max</text>
  <text x="111" y="146" text-anchor="middle" font-size="8" fill="#d6a040">(1,8)</text>

  <!-- movement arrows: north along x=0 -->
  <path d="M 85 332 L 85 312" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 85 282 L 85 234" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="64" y="294" font-size="8.5" fill="#4a7a3a">北4</text>
  <!-- east step to (1,4) then blocked -->
  <path d="M 100 243 L 124 243" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="112" y="236" text-anchor="middle" font-size="8" fill="#4a7a3a">东1</text>
  <!-- blocked arrow (dashed red) -->
  <path d="M 126 243 L 148 243" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="252" font-size="8" fill="#b85450">遇障停</text>
  <!-- north along x=1 -->
  <path d="M 111 228 L 111 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="116" y="200" font-size="8.5" fill="#4a7a3a">北4</text>

  <!-- ===== Right: step table ===== -->
  <rect x="246" y="36" width="270" height="408" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="381" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">指令逐步追踪</text>

  <!-- table header -->
  <rect x="262" y="62" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="279" y="76" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">#</text>
  <rect x="298" y="62" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="319" y="76" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">指令</text>
  <rect x="342" y="62" width="96" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="390" y="76" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">动作</text>
  <rect x="440" y="62" width="62" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="471" y="76" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">x²+y²</text>

  <!-- row 1: cmd 4 north -->
  <rect x="262" y="84" width="34" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="279" y="100" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="298" y="84" width="42" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="319" y="100" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="342" y="84" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="350" y="100" font-size="8.5" fill="#333">北走4步→(0,4)</text>
  <rect x="440" y="84" width="62" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="471" y="100" text-anchor="middle" font-size="9" fill="#333">16</text>

  <!-- row 2: -1 right -->
  <rect x="262" y="110" width="34" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="279" y="126" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="298" y="110" width="42" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="319" y="126" text-anchor="middle" font-size="9" fill="#333">−1</text>
  <rect x="342" y="110" width="96" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="350" y="126" font-size="8.5" fill="#333">右转→东</text>
  <rect x="440" y="110" width="62" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="471" y="126" text-anchor="middle" font-size="9" fill="#333">16</text>

  <!-- row 3: 4 east (blocked) -->
  <rect x="262" y="136" width="34" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="279" y="152" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="298" y="136" width="42" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="319" y="152" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="342" y="136" width="96" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="350" y="152" font-size="8" fill="#b85450">东走1,遇障停(1,4)</text>
  <rect x="440" y="136" width="62" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="471" y="152" text-anchor="middle" font-size="9" fill="#333">17</text>

  <!-- row 4: -2 left -->
  <rect x="262" y="162" width="34" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="279" y="178" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="298" y="162" width="42" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="319" y="178" text-anchor="middle" font-size="9" fill="#333">−2</text>
  <rect x="342" y="162" width="96" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="350" y="178" font-size="8.5" fill="#333">左转→北</text>
  <rect x="440" y="162" width="62" height="24" fill="#fff" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="471" y="178" text-anchor="middle" font-size="9" fill="#333">17</text>

  <!-- row 5: 4 north (max) -->
  <rect x="262" y="188" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="279" y="204" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">5</text>
  <rect x="298" y="188" width="42" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="319" y="204" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">4</text>
  <rect x="342" y="188" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="350" y="204" font-size="8.5" fill="#333" font-weight="bold">北走4步→(1,8)</text>
  <rect x="440" y="188" width="62" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="471" y="204" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">65</text>

  <!-- explanation -->
  <rect x="262" y="226" width="240" height="206" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="382" y="246" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键观察</text>
  <text x="270" y="266" font-size="9.5" fill="#555">• 起点 (0,0) 面朝北，ans 初始 0</text>
  <text x="270" y="284" font-size="9.5" fill="#555">• 指令 3 走东：第 1 步到 (1,4) 安全</text>
  <text x="270" y="300" font-size="9.5" fill="#555">  第 2 步欲往 (2,4) = 障碍物 → 停</text>
  <text x="270" y="316" font-size="9.5" fill="#b85450">  ⚠ 必须逐步检测，不能一次跳 k 步</text>
  <text x="270" y="336" font-size="9.5" fill="#555">• 停在 (1,4) 后左转朝北，再走 4 步</text>
  <text x="270" y="352" font-size="9.5" fill="#555">  到达 (1,8)：1² + 8² = 65</text>
  <text x="270" y="372" font-size="9.5" fill="#555">• 全程最大 = 65（出现在终点）</text>
  <text x="270" y="392" font-size="9.5" fill="#555">• 每移动一格都要更新 ans</text>
  <text x="270" y="412" font-size="9.5" fill="#d6a040" font-weight="bold">→ return 65</text>
</svg>
