<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每步消去最小非零值，不同非零值集合大小恰减 1</text>

  <!-- initial state -->
  <text x="60" y="62" font-size="12" fill="#446688" font-weight="bold">初始 S（不同非零值）</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="120" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="180" y="70" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="90"  y="92">1</text>
    <text x="150" y="92">3</text>
    <text x="210" y="92">5</text>
  </g>
  <text x="250" y="92" font-size="12.5" fill="#4a7a3a" font-weight="bold">|S| = 3</text>

  <!-- op1 -->
  <path d="M 120 108 L 120 128" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="135" y="124" font-size="11" fill="#b85450" font-weight="bold">① x=min(S)=1，所有正数减 1</text>

  <text x="60" y="156" font-size="12" fill="#446688" font-weight="bold">操作后 S</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="164" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="120" y="164" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="90"  y="186">2</text>
    <text x="150" y="186">4</text>
  </g>
  <text x="190" y="186" font-size="12.5" fill="#4a7a3a" font-weight="bold">|S| = 2   (最小值 1 归 0 被移出)</text>

  <!-- op2 -->
  <path d="M 120 202 L 120 222" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="135" y="218" font-size="11" fill="#b85450" font-weight="bold">② x=min(S)=2，所有正数减 2</text>

  <text x="60" y="250" font-size="12" fill="#446688" font-weight="bold">操作后 S</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="258" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="90"  y="280">2</text>
  </g>
  <text x="130" y="280" font-size="12.5" fill="#4a7a3a" font-weight="bold">|S| = 1   (平移保持互异，只消去最小值)</text>

  <!-- op3 -->
  <path d="M 120 296 L 120 316" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="135" y="312" font-size="11" fill="#b85450" font-weight="bold">③ x=min(S)=2，所有正数减 2</text>

  <text x="60" y="344" font-size="12" fill="#446688" font-weight="bold">操作后 S</text>
  <g filter="url(#rough2)">
    <rect x="60" y="352" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <g font-size="13" fill="#b85450" text-anchor="middle">
    <text x="120"  y="374">∅（空）</text>
  </g>
  <text x="190" y="374" font-size="12.5" fill="#4a7a3a" font-weight="bold">|S| = 0   全部归零，停止</text>

  <!-- conclusion -->
  <rect x="40" y="400" width="480" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">每轮 |S| 恰减 1  →  最少操作数 = 初始 |S|</text>
  <text x="280" y="440" text-anchor="middle" font-size="12" fill="#4a7a3a">答案 = nums 中「不同非零值」的个数</text>
</svg>
