<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">核心观察：高峰窗口判定 + 组内四个指标</text>

  <!-- 图例 -->
  <g filter="url(#rough2)" font-size="10.5">
    <circle cx="66" cy="42" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="76" y="46" fill="#4a7a3a">= 高峰订单（示例时刻）</text>
    <circle cx="220" cy="42" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="230" y="46" fill="#b85450">= 非高峰订单</text>
    <text x="330" y="46" fill="#446688">is_peak ∈ {1, 0}</text>
  </g>

  <!-- 两个高峰窗口 -->
  <g filter="url(#rough2)">
    <rect x="248" y="58" width="71" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="283" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">午高峰</text>
    <text x="283" y="89" text-anchor="middle" font-size="10" fill="#4a7a3a">11 – 14 点</text>
    <rect x="371" y="58" width="70" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="406" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">晚高峰</text>
    <text x="406" y="89" text-anchor="middle" font-size="10" fill="#4a7a3a">18 – 21 点</text>
  </g>

  <!-- 小时刻度轴 -->
  <g filter="url(#rough2)">
    <text x="56" y="102" font-size="10.5" fill="#446688">HOUR(ts) 落在窗口内</text>
    <text x="56" y="116" font-size="10.5" fill="#446688">⟹ 该行 is_peak = 1</text>
    <path d="M 56 138 L 458 138" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.2">
    <line x1="56" y1="134" x2="56" y2="142"/><line x1="73.5" y1="135" x2="73.5" y2="141"/>
    <line x1="91" y1="135" x2="91" y2="141"/><line x1="108.5" y1="135" x2="108.5" y2="141"/>
    <line x1="126" y1="134" x2="126" y2="142"/><line x1="143.5" y1="135" x2="143.5" y2="141"/>
    <line x1="161" y1="135" x2="161" y2="141"/><line x1="178.5" y1="135" x2="178.5" y2="141"/>
    <line x1="196" y1="134" x2="196" y2="142"/><line x1="213.5" y1="135" x2="213.5" y2="141"/>
    <line x1="231" y1="135" x2="231" y2="141"/><line x1="248.5" y1="135" x2="248.5" y2="141"/>
    <line x1="266" y1="134" x2="266" y2="142"/><line x1="283.5" y1="135" x2="283.5" y2="141"/>
    <line x1="301" y1="135" x2="301" y2="141"/><line x1="318.5" y1="135" x2="318.5" y2="141"/>
    <line x1="336" y1="134" x2="336" y2="142"/><line x1="353.5" y1="135" x2="353.5" y2="141"/>
    <line x1="371" y1="135" x2="371" y2="141"/><line x1="388.5" y1="135" x2="388.5" y2="141"/>
    <line x1="406" y1="134" x2="406" y2="142"/><line x1="423.5" y1="135" x2="423.5" y2="141"/>
    <line x1="441" y1="135" x2="441" y2="141"/><line x1="458.5" y1="134" x2="458.5" y2="142"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#446688" text-anchor="middle">
    <text x="56" y="152">0</text><text x="108.5" y="152">3</text><text x="161" y="152">6</text>
    <text x="213.5" y="152">9</text><text x="266" y="152">12</text><text x="318.5" y="152">15</text>
    <text x="371" y="152">18</text><text x="423.5" y="152">21</text><text x="458.5" y="152">23</text>
  </g>

  <!-- 订单时刻点（画在刻度轴上方） -->
  <g filter="url(#rough2)">
    <circle cx="267" cy="124" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="285" cy="124" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="305" cy="124" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="390" cy="124" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="410" cy="124" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="231" cy="124" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="327" cy="124" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="344" cy="124" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="267" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a">11:30 ✓</text>
    <text x="334" y="112" text-anchor="middle" font-size="9" fill="#b85450">15:30 ✗</text>
  </g>

  <!-- 四个指标 -->
  <text x="260" y="176" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold"
        filter="url(#rough2)">一趟 GROUP BY customer_id 算齐四个指标（分母各不相同！）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="186" width="225" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="152" y="204" text-anchor="middle" font-size="11.5" fill="#446688">total_orders = COUNT(*)</text>
    <text x="152" y="222" text-anchor="middle" font-size="10" fill="#446688">分母：全部订单（NULL 也算一行）</text>
    <text x="152" y="236" text-anchor="middle" font-size="10" fill="#446688">→ 过滤：≥ 3</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="275" y="186" width="205" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="377" y="204" text-anchor="middle" font-size="11.5" fill="#446688">peak_hour_percentage</text>
    <text x="377" y="222" text-anchor="middle" font-size="10" fill="#446688">= 100 × SUM(is_peak) / COUNT(*)</text>
    <text x="377" y="236" text-anchor="middle" font-size="10" fill="#446688">分母：全部订单 → 过滤：≥ 60</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="250" width="225" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="152" y="268" text-anchor="middle" font-size="11.5" fill="#4a7a3a">rated_ratio = COUNT(评分) / COUNT(*)</text>
    <text x="152" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a">COUNT(列) 只数非空 → 已评 ÷ 全部</text>
    <text x="152" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 过滤：≥ 0.5</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="275" y="250" width="205" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8"/>
    <text x="377" y="268" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">average_rating = AVG(评分)</text>
    <text x="377" y="286" text-anchor="middle" font-size="10" fill="#d6a040">AVG 自动跳过 NULL</text>
    <text x="377" y="300" text-anchor="middle" font-size="10" fill="#d6a040">分母：仅已评价！→ 过滤：≥ 4.0</text>
  </g>

  <!-- 陷阱提示 -->
  <rect x="40" y="314" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5" fill="#b85450">
    <text x="260" y="330">⚠️ 陷阱：写成 SUM(评分)/COUNT(*) 会把未评价当 0 分</text>
    <text x="260" y="346">客户 101 的 4.67 会被冤枉成 14/4 = 3.5，直接误杀！</text>
  </g>
</svg>
