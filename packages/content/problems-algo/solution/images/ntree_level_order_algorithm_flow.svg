<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrBack" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 层序 + 遍历 children 入队</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">在 102 模板上把 left/right 两行换成 for 循环遍历 children</text>

  <g font-size="10" fill="#333">
    <!-- Step 1 -->
    <rect x="40" y="64" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 初始化</text>
    <text x="140" y="84" font-family="monospace" font-size="10" fill="#555">if (!root) return {};  queue.push(root);</text>
    <text x="140" y="100" font-size="9" fill="#888">特判空树，根节点入队</text>

    <path d="M 260 110 L 260 124" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: while -->
    <rect x="40" y="128" width="440" height="158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#4a7a3a" font-weight="bold">② while 队列非空</text>
    <text x="54" y="166" font-family="monospace" font-size="10" fill="#555">while (!queue.empty()) {</text>
    <text x="70" y="182" font-family="monospace" font-size="10" fill="#d6a040">int size = queue.size();        // 当前层节点数快照</text>
    <text x="70" y="198" font-family="monospace" font-size="10" fill="#555">vector&lt;int&gt; level;</text>
    <text x="70" y="214" font-family="monospace" font-size="10" fill="#446688">for (int i = 0; i &lt; size; ++i) { // 恰好一整层</text>
    <text x="86" y="230" font-family="monospace" font-size="10" fill="#b85450">node = queue.front(); queue.pop();</text>
    <text x="86" y="244" font-family="monospace" font-size="10" fill="#b85450">level.push_back(node-&gt;val);</text>
    <text x="86" y="262" font-family="monospace" font-size="10" fill="#4a7a3a" font-weight="bold">for (auto c : node-&gt;children)  // ★ 与 102 的唯一差异</text>
    <text x="102" y="276" font-family="monospace" font-size="10" fill="#4a7a3a" font-weight="bold">queue.push(c);</text>
    <text x="70" y="282" font-family="monospace" font-size="10" fill="#555">}</text>

    <!-- Step 3: collect level -->
    <rect x="40" y="296" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="316" font-size="12" fill="#d6a040" font-weight="bold">③ 收集本层</text>
    <text x="150" y="316" font-family="monospace" font-size="10" fill="#b85450">result.push_back(level);</text>
    <text x="150" y="332" font-size="9" fill="#888">每层一个子列表，按层序追加</text>

    <path d="M 260 344 L 260 358" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrBack)" filter="url(#rough2)"/>

    <!-- Step 4 -->
    <rect x="40" y="362" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="382" font-size="12" fill="#b85450" font-weight="bold">④ 返回</text>
    <text x="110" y="382" font-family="monospace" font-size="10" fill="#555">return result;   // [[1],[3,2,4],[5,6]]</text>
  </g>

  <text x="260" y="402" text-anchor="middle" font-size="9" fill="#888">size 快照锁定层边界；children 顺序入队保证下一层左→右</text>
</svg>
