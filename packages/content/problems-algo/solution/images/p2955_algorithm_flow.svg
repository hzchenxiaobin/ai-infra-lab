<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预处理 26 行前缀计数 + 每查询 O(26) 差分累加</text>

  <ellipse cx="280" cy="56" rx="50" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 280 73 L 280 86" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="120" y="90" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">预处理 pre[0..n][26]：整行拷贝 + 当前字母 +1</text>

  <path d="M 280 126 L 280 138" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="150" y="142" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一查询 [l, r]：sum = 0，c = 0</text>

  <path d="M 280 178 L 280 190" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="130" y="194" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t = pre[r+1][c] − pre[l][c]；sum += t(t+1)/2</text>

  <path d="M 280 230 L 280 246" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="280,250 380,292 280,334 180,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c &lt; 25 ？</text>

  <path d="M 380 292 L 466 292 L 466 212 L 434 212" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="458" y="250" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">是，c++</text>

  <path d="M 280 334 L 280 350" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="290" y="348" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="150" y="354" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans[i] = sum（26 个字母累加完毕）</text>

  <path d="M 280 390 L 280 406" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="280,410 380,452 280,494 180,452" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="457" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有查询？</text>

  <path d="M 180 452 L 96 452 L 96 160 L 144 160" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="130" y="442" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <path d="M 280 494 L 280 510" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="290" y="508" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <ellipse cx="280" cy="532" rx="60" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="537" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>

  <rect x="414" y="420" width="126" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="477" y="442" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每查询 O(26)</text>
  <text x="477" y="462" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">与区间长度无关</text>

  <rect x="16" y="90" width="94" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="63" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">预处理 O(26n)</text>
</svg>
