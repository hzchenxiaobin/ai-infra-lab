<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序 + 相向双指针：有序数组上单调逼近最优和</text>

  <!-- Original array -->
  <text x="40" y="62" font-size="12" fill="#888">原始 A:</text>
  <rect x="100" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="66" text-anchor="middle" font-size="11" fill="#333">34</text>
  <rect x="148" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="66" text-anchor="middle" font-size="11" fill="#333">23</text>
  <rect x="196" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="66" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="244" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="66" text-anchor="middle" font-size="11" fill="#333">24</text>
  <rect x="292" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="66" text-anchor="middle" font-size="11" fill="#333">75</text>
  <rect x="340" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="363" y="66" text-anchor="middle" font-size="11" fill="#333">33</text>
  <rect x="388" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="411" y="66" text-anchor="middle" font-size="11" fill="#333">54</text>
  <rect x="436" y="46" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="66" text-anchor="middle" font-size="11" fill="#333">8</text>

  <!-- arrow: sort -->
  <path d="M280 82 L280 108" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="300" y="98" font-size="11" fill="#446688" font-weight="bold">排序 ↑</text>

  <!-- Sorted array -->
  <text x="40" y="140" font-size="12" fill="#888">排序后:</text>
  <rect x="100" y="124" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="144" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="148" y="124" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="144" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="196" y="124" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="144" text-anchor="middle" font-size="11" fill="#333">23</text>
  <rect x="244" y="124" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="144" text-anchor="middle" font-size="11" fill="#333">24</text>
  <rect x="292" y="124" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="144" text-anchor="middle" font-size="11" fill="#333">33</text>
  <rect x="340" y="124" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="363" y="144" text-anchor="middle" font-size="11" fill="#333">34</text>
  <rect x="388" y="124" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="411" y="144" text-anchor="middle" font-size="11" fill="#333">54</text>
  <rect x="436" y="124" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="144" text-anchor="middle" font-size="11" fill="#333">75</text>

  <!-- left pointer -->
  <text x="123" y="170" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">↑left</text>
  <!-- right pointer -->
  <text x="459" y="170" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑right</text>

  <!-- Sum bracket -->
  <path d="M123 176 Q 290 196 459 176" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="290" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">s = A[left] + A[right]</text>

  <!-- Decision box 1: s < K -->
  <rect x="60" y="218" width="220" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="170" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">s &lt; K  ✅</text>
  <text x="170" y="256" text-anchor="middle" font-size="11" fill="#333">ans = max(ans, s)</text>
  <text x="170" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a">left++ （尝试更大的和）</text>

  <!-- Decision box 2: s >= K -->
  <rect x="300" y="218" width="220" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">s ≥ K  ❌</text>
  <text x="410" y="256" text-anchor="middle" font-size="11" fill="#333">和太大，不合法</text>
  <text x="410" y="272" text-anchor="middle" font-size="11" fill="#b85450">right-- （缩小和）</text>

  <!-- arrows from sum to decisions -->
  <path d="M250 176 L170 216" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M330 176 L410 216" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Key insight box -->
  <rect x="40" y="300" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#333">有序性保证：left 右移 → 和增大；right 左移 → 和减小</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">因此合法时贪心推进 left 追求更大和，非法时回退 right 降压</text>

  <!-- Termination -->
  <rect x="120" y="366" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">left ≥ right 时终止，返回 ans（初始 −1 表示无解）</text>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#888">每个元素至多被 left 或 right 访问一次 → O(n) 扫描</text>
</svg>
