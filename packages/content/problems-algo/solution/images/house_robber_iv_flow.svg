<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分能力阈值 c，check(c) 贪心验证</text>

  <!-- Step 1: init -->
  <rect x="170" y="44" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo=1, hi=max(nums), ans=hi</text>
  <path d="M 280 80 L 280 102" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: loop -->
  <polygon points="280,104 380,150 280,196 180,150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo ≤ hi ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#888">循环</text>

  <!-- No branch -> return -->
  <path d="M 380 150 L 470 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="144" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="134" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="510" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes branch: mid -->
  <path d="M 280 196 L 280 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="195" y="224" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mid = (lo + hi) / 2</text>
  <path d="M 280 258 L 280 280" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: check(mid) -->
  <polygon points="280,282 415,334 280,386 145,334" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">check(mid): 贪心抢房</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">值 ≤ mid 且不邻，</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">能抢 ≥ k 间 ?</text>

  <!-- Yes: feasible -> ans=mid, hi=mid-1 (find smaller) -->
  <path d="M 145 334 L 60 334 L 60 276" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="326" font-size="11" fill="#4a7a3a" font-weight="bold">可行</text>
  <rect x="20" y="250" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans=mid</text>
  <text x="60" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">hi=mid-1</text>
  <path d="M 60 250 L 60 150 L 180 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="200" font-size="10" fill="#4a7a3a">向左找更小</text>

  <!-- No: infeasible -> lo=mid+1 -->
  <path d="M 415 334 L 500 334 L 500 276" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="326" font-size="11" fill="#b85450" font-weight="bold">不可行</text>
  <rect x="460" y="250" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="500" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lo=mid+1</text>
  <path d="M 500 250 L 500 150 L 380 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="508" y="200" font-size="10" fill="#b85450">放大阈值</text>

  <!-- check detail box -->
  <rect x="20" y="392" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">check：i=0 起扫，若 nums[i]≤c 则抢并 i+=2，否则 i+=1，统计 count，达 k 即真</text>
</svg>
