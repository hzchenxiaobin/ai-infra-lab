<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求 t=n(n+1)/2 → 判 t 是否完全平方数 → 返回 √t 或 −1</text>

  <rect x="210" y="40" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="13" fill="#333">输入正整数 n</text>

  <path d="M 270 80 L 270 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="106" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="123" text-anchor="middle" font-size="12" fill="#333">令 t = n(n+1)/2</text>
  <text x="270" y="139" text-anchor="middle" font-size="10.5" fill="#888">(即 1..n 的总和)</text>

  <path d="M 270 146 L 270 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,172 380,222 270,272 160,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t 是完全平方数？</text>
  <text x="270" y="234" text-anchor="middle" font-size="10.5" fill="#888">s = ⌊√t⌋; s·s == t ?</text>

  <path d="M 160 222 L 100 222 L 100 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="132" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="252" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="271" text-anchor="middle" font-size="12" fill="#333">存在中枢整数</text>
  <text x="100" y="288" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return s</text>

  <path d="M 380 222 L 440 222 L 440 250" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="408" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="380" y="252" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="271" text-anchor="middle" font-size="12" fill="#333">无整数解</text>
  <text x="440" y="288" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return −1</text>

  <rect x="50" y="316" width="440" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="270" y="338" text-anchor="middle" font-size="10.5" fill="#888">对照：枚举 x 逐个验算 O(n)；公式法把线性搜索压成 O(1) 开平方判定</text>
</svg>
