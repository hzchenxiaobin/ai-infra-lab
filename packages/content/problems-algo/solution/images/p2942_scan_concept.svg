<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">逐词独立判定：x = "a" 出现在哪些单词里？</text>

  <!-- Row 0: "abc" -->
  <text x="46" y="79" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="66" y="56" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="79" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="98" y="56" width="30" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="79" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="130" y="56" width="30" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="79" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">c</text>
  <text x="176" y="79" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">含 a ✓</text>

  <!-- Row 1: "bcd" -->
  <text x="46" y="147" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="66" y="124" width="30" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="81" y="147" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="98" y="124" width="30" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="147" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">c</text>
  <rect x="130" y="124" width="30" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="147" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">d</text>
  <text x="176" y="147" font-size="12.5" fill="#999" filter="url(#rough2)">无 a ✗</text>

  <!-- Row 2: "aaaa" -->
  <text x="46" y="215" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="66" y="192" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="215" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="98" y="192" width="30" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="113" y="215" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">a</text>
  <rect x="130" y="192" width="30" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="145" y="215" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">a</text>
  <rect x="162" y="192" width="30" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="177" y="215" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">a</text>
  <text x="129" y="243" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">命中后，其余位不再读</text>
  <text x="204" y="215" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">含 a ✓ 找到即停</text>

  <!-- Row 3: "cbc" -->
  <text x="46" y="283" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="66" y="260" width="30" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="81" y="283" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">c</text>
  <rect x="98" y="260" width="30" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="283" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">b</text>
  <rect x="130" y="260" width="30" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="283" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">c</text>
  <text x="176" y="283" font-size="12.5" fill="#999" filter="url(#rough2)">无 a ✗</text>

  <!-- Result box -->
  <rect x="372" y="124" width="134" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="439" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">收集命中下标</text>
  <text x="439" y="185" text-anchor="middle" font-size="17" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = [0, 2]</text>

  <!-- arrows into result -->
  <path d="M 236 74 C 300 74 330 140 368 156" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 330 210 C 345 210 352 206 368 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="48" y="322" width="424" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">每个单词判定独立、命中即短路；</text>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">最坏情况（x 从不出现）才需读完全部 n × m 个字符——这正是读取下界</text>
</svg>
