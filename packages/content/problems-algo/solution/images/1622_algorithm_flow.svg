<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：四种操作与变换系数维护</text>

  <!-- 初始化 -->
  <rect x="200" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化</text>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#446688">mult=1, add=0, seq=[]</text>

  <!-- 分发菱形 -->
  <path d="M 280 92 L 360 130 L 280 168 L 200 130 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">接到哪个操作？</text>

  <!-- 四条分支线 -->
  <path d="M 200 130 L 90 130 L 90 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 130 L 90 130" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="120" y="124" font-size="10" fill="#888">append</text>

  <path d="M 280 168 L 280 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="184" font-size="10" fill="#888">addAll</text>

  <path d="M 360 130 L 470 130 L 470 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="124" font-size="10" fill="#888">multAll</text>

  <path d="M 360 130 L 470 130" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="184" font-size="10" fill="#888">getIndex</text>
  <path d="M 470 130 L 470 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- append 分支 -->
  <rect x="30" y="196" width="180" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">append(val)</text>
  <text x="42" y="240" font-size="11" fill="#333">b = (val − add) % p</text>
  <text x="42" y="258" font-size="11" fill="#333">b = b · mult⁻¹ % p</text>
  <text x="42" y="278" font-size="11" fill="#4a7a3a" font-weight="bold">seq.push(b)</text>
  <text x="42" y="294" font-size="10" fill="#888">O(log p) 求逆</text>

  <!-- addAll 分支 -->
  <rect x="190" y="196" width="180" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">addAll(inc)</text>
  <text x="202" y="248" font-size="11" fill="#333">add = (add + inc) % p</text>
  <text x="202" y="278" font-size="11" fill="#4a7a3a" font-weight="bold">mult 不变</text>
  <text x="202" y="294" font-size="10" fill="#888">O(1)</text>

  <!-- multAll 分支 -->
  <rect x="380" y="196" width="150" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">multAll(m)</text>
  <text x="392" y="240" font-size="11" fill="#333">mult = mult·m % p</text>
  <text x="392" y="258" font-size="11" fill="#333">add = add·m % p</text>
  <text x="392" y="278" font-size="10" fill="#888">O(1)</text>

  <!-- getIndex 分支（下方独立） -->
  <rect x="190" y="316" width="340" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">getIndex(idx)</text>
  <text x="202" y="362" font-size="11" fill="#333">if idx &gt;= len(seq): return −1</text>
  <text x="202" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">return (seq[idx]·mult + add) % p</text>
  <text x="202" y="404" font-size="10" fill="#888">O(1)，查询不改 (mult, add)</text>

  <!-- 连接 getIndex 到下方 -->
  <path d="M 455 296 L 455 312 L 360 312 L 360 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左侧连接 append/addAll/multAll 回菱形循环（隐式，画一个汇总箭头） -->
  <path d="M 120 296 L 120 360 L 200 360 L 200 130" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="130" y="354" font-size="10" fill="#888">更新后回到等待</text>
</svg>
