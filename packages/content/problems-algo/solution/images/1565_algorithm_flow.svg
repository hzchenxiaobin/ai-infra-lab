<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程图：FROM → WHERE → GROUP BY → SELECT</text>

  <!-- ===== Start: FROM Orders ===== -->
  <rect x="200" y="40" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">FROM Orders</text>

  <!-- Arrow down -->
  <path d="M 260 78 L 260 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: invoice > 20? ===== -->
  <polygon points="260,96 360,140 260,184 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">invoice &gt; 20?</text>
  <text x="260" y="152" text-anchor="middle" font-size="9" fill="#888">行级过滤</text>

  <!-- No branch (right) -->
  <path d="M 360 140 L 420 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="134" text-anchor="middle" font-size="9" fill="#b85450">否</text>
  <rect x="420" y="124" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="144" text-anchor="middle" font-size="10" fill="#b85450">丢弃该行</text>

  <!-- Yes branch (down) -->
  <path d="M 260 184 L 260 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="194" font-size="9" fill="#4a7a3a">是</text>

  <!-- ===== GROUP BY month ===== -->
  <rect x="160" y="202" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY month</text>
  <text x="260" y="236" text-anchor="middle" font-size="9" fill="#888">DATE_FORMAT(order_date,'%Y-%m')</text>

  <!-- Arrow down -->
  <path d="M 260 248 L 260 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== SELECT aggregate ===== -->
  <rect x="120" y="266" width="280" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">SELECT 聚合输出</text>
  <text x="260" y="300" text-anchor="middle" font-size="9" fill="#555">COUNT(order_id) AS order_count</text>
  <text x="260" y="314" text-anchor="middle" font-size="9" fill="#555">COUNT(DISTINCT customer_id) AS customer_count</text>

  <!-- Arrow down -->
  <path d="M 260 324 L 260 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <rect x="180" y="342" width="160" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">month, order_count, customer_count</text>

  <!-- ===== Side note: execution order ===== -->
  <rect x="40" y="202" width="100" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">执行顺序</text>
  <text x="50" y="236" font-size="8" fill="#666">FROM</text>
  <text x="50" y="250" font-size="8" fill="#666">→ WHERE</text>
  <text x="50" y="264" font-size="8" fill="#666">→ GROUP BY</text>
  <text x="50" y="278" font-size="8" fill="#666">→ SELECT</text>
</svg>
