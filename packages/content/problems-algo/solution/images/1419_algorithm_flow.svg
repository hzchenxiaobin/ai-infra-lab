<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：读字符 → 定位状态 → 检查前驱 → 转移</text>

  <!-- Step 1: init -->
  <rect x="140" y="44" width="280" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 cnt[5]={0}, frogs=0, ans=0</text>

  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: read char -->
  <rect x="160" y="98" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">读取字符 ch，idx = "croak".find(ch)</text>

  <path d="M 280 134 L 280 150" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: compute prev -->
  <rect x="120" y="152" width="320" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">prev = (idx==0) ? 4 : idx-1   // c 的前驱是 k</text>

  <path d="M 280 188 L 280 204" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision diamond 1: cnt[prev] > 0 ? -->
  <polygon points="280,206 400,252 280,298 160,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">cnt[prev] > 0 ?</text>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#888">(有前驱状态青蛙)</text>

  <!-- Yes branch: transfer -->
  <path d="M 280 298 L 280 316" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="312" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="100" y="318" width="360" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cnt[prev]--, cnt[idx]++</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a">if (idx == 4) frogs--   // k: 叫完释放</text>

  <!-- No branch: check idx == 0 -->
  <path d="M 400 252 L 470 252 L 470 376" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="410" y="248" font-size="10" fill="#d6a040" font-weight="bold">否</text>

  <!-- Decision diamond 2: idx == 0 ? -->
  <polygon points="470,378 540,410 470,442 400,410" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="408" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">idx == 0 ?</text>
  <text x="470" y="422" text-anchor="middle" font-size="9" fill="#888">(是首字符 c)</text>

  <!-- idx==0 Yes: new frog -->
  <path d="M 400 410 L 340 410 L 340 376" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="348" y="404" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="250" y="380" width="90" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="295" y="400" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">新建: cnt[0]++</text>
  <text x="295" y="412" text-anchor="middle" font-size="9" fill="#4a7a3a">frogs++</text>

  <!-- idx==0 No: invalid -->
  <path d="M 540 410 L 545 410 L 545 470 L 400 470" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="548" y="442" font-size="9" fill="#b85450" font-weight="bold">否</text>

  <rect x="250" y="456" width="150" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="476" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return -1 (非法)</text>

  <!-- After transfer/new frog: update ans -->
  <path d="M 280 366 L 280 376 L 210 376 L 210 410" stroke="#666" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>

  <!-- Merge point: update ans -->
  <rect x="100" y="456" width="140" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="476" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans = max(ans, frogs)</text>

  <path d="M 170 456 L 170 440 L 100 440 L 100 115 L 158 115" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="50" y="280" font-size="10" fill="#4a7a3a">下一字符</text>

  <!-- End: check frogs == 0 -->
  <rect x="100" y="498" width="360" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="520" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">遍历结束: frogs == 0 ? return ans : return -1</text>
</svg>
