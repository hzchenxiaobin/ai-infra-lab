<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一趟建哈希 → 判 m → 一趟取前三大</text>

  <!-- 开始 -->
  <ellipse cx="150" cy="52" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="57" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M150,70 L150,84" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- P1 建哈希 -->
  <rect x="48" y="84" width="204" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">一趟扫描 i = 0 … n−1</text>
  <text x="150" y="124" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">best[x[i]] ← max(best[x[i]], y[i])</text>

  <path d="M150,136 L150,150" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D1 判断 -->
  <polygon points="150,150 254,196 150,242 46,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">不同 x 值个数</text>
  <text x="150" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">m &lt; 3 ?</text>

  <!-- 是：返回 -1 -->
  <path d="M254,196 L298,196" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="188" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="302" y="173" width="118" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361" y="201" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">return −1</text>

  <!-- 否：取前三大 -->
  <path d="M150,242 L150,258" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="162" y="256" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="48" y="258" width="204" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="279" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">组代表里取前三大</text>
  <text x="150" y="298" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">a ≥ b ≥ c（一趟三变量）</text>

  <path d="M150,310 L150,324" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- P3 返回 -->
  <rect x="48" y="324" width="204" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="351" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return a + b + c</text>

  <!-- 右侧面板 -->
  <rect x="302" y="258" width="196" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">取前三大的三种武器</text>
  <text x="400" y="299" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">排序取前 3：O(m log m)</text>
  <text x="400" y="317" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">三变量一趟：O(m) ← 本文</text>
  <text x="400" y="335" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3 长小根堆：O(m log 3)</text>
  <text x="400" y="353" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">堆可泛化任意 k / 流式数据</text>
</svg>
