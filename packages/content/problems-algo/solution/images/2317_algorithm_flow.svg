<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一趟累 OR</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">每位独立 → 直接 OR 即得所有可达的 1 位</text>

  <!-- start: ans = 0 -->
  <ellipse cx="160" cy="86" rx="56" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>

  <path d="M160 110 L160 128" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop: for x in nums -->
  <rect x="96" y="132" width="128" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="154" text-anchor="middle" font-size="11" fill="#333">for x in nums</text>

  <path d="M160 170 L160 188" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- core op: ans |= x -->
  <rect x="84" y="192" width="152" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans |= x</text>
  <text x="160" y="224" text-anchor="middle" font-size="9.5" fill="#888">把 x 的所有 1 位并入 ans</text>

  <!-- loop back arrow to for x -->
  <path d="M236 212 L300 212 L300 150 L224 150" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="182" text-anchor="middle" font-size="9.5" fill="#888">下一个 x</text>

  <!-- after loop arrow down to return -->
  <path d="M160 234 L160 262" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="252" text-anchor="middle" font-size="9.5" fill="#888">nums 用完</text>

  <!-- return -->
  <ellipse cx="160" cy="286" rx="64" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="291" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>

  <!-- side note box -->
  <rect x="332" y="120" width="180" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="422" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">为何一趟 OR 即解？</text>
  <text x="422" y="162" text-anchor="middle" font-size="10" fill="#333">① 操作只清位不置位</text>
  <text x="422" y="178" text-anchor="middle" font-size="10" fill="#333">② XOR 各位相互独立</text>
  <text x="422" y="194" text-anchor="middle" font-size="10" fill="#333">③ 每位可凑奇 → 取 1</text>
  <text x="422" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">OR = 上界 = 可达 = 答案</text>

  <!-- footer -->
  <text x="270" y="338" text-anchor="middle" font-size="10.5" fill="#888">无需真正执行操作，答案就是 nums 全员按位 OR</text>
</svg>
