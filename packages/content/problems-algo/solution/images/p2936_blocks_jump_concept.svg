<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心思路：逐块「一口吞」——二分找块尾，整块跳过</text>

  <!-- 块标注 -->
  <text x="113" y="52" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">块①</text>
  <text x="176" y="52" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">块②</text>
  <text x="261" y="52" text-anchor="middle" font-size="11" fill="#8a6414" font-weight="bold" filter="url(#rough2)">块③</text>
  <text x="324" y="52" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">块④</text>
  <text x="387" y="52" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">块⑤</text>

  <!-- 数组格子：[1,1,1,3,9,9,9,2,10,10] -->
  <rect x="50"  y="60" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="92"  y="60" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="60" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="60" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="218" y="60" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="60" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="60" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="344" y="60" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="386" y="60" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="428" y="60" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="71"  y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="113" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="155" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="197" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="239" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="281" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="323" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="365" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="407" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="449" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <!-- 下标 -->
  <text x="71"  y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="113" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="155" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="197" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="239" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="281" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="323" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="365" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="407" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>
  <text x="449" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">9</text>

  <!-- 块③的二分探测演示 -->
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#8a6414" font-weight="bold" filter="url(#rough2)">以块③为例：i=4，v=at(4)=9，在 [4,9] 上二分找块尾</text>
  <path d="M 281 100 L 281 150" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 323 100 L 323 150" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 365 100 L 365 150" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <circle cx="365" cy="160" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="365" y="164" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">F</text>
  <circle cx="281" cy="160" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281" y="164" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>
  <circle cx="323" cy="160" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="323" y="164" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">T</text>

  <text x="120" y="164" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">探测顺序：at(7)=2 ✗ → at(5)=9 ✓ → at(6)=9 ✓</text>
  <path d="M 334 160 L 350 160" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="407" y="164" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">块尾=6，跳到 i=7</text>

  <!-- 调用次数对比 -->
  <rect x="55" y="188" width="410" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">线性扫描：at() 调用 O(n) 次，n ≤ 10^15 → 天文数字 ✗</text>

  <rect x="55" y="232" width="410" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">块尾二分：每块 ≤ ⌈log₂n⌉ ≈ 50 次探测，B 块共 O(B·log n) 次 ✓</text>

  <!-- 跳跃循环示意 -->
  <text x="260" y="292" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">答案 = 跳跃轮数 = 块数 B</text>
  <path d="M 120 316 L 175 316" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="147" y="336" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">读块首</text>
  <path d="M 195 316 L 250 316" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="336" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">二分块尾</text>
  <path d="M 270 316 L 325 316" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="297" y="336" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">跳到下一块</text>
  <path d="M 345 316 L 400 316" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="336" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">循环 B 轮</text>
</svg>
