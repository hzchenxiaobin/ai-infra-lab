<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 522" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="520" height="522" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：收集两组匹配下标 + 双指针单向判定</text>

  <rect x="200" y="30" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s, a, b, k</text>
  <path d="M 260 56 L 260 64" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="100" y="68" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">A ← a 的全部匹配起点；B ← b 的全部匹配起点</text>
  <text x="260" y="104" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">两组天然升序；本题 |a|,|b| ≤ 10，逐位比较 O(n·L) 即可</text>
  <path d="M 260 112 L 260 120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <polygon points="260,124 356,156 260,188 164,156" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">A 或 B 为空？</text>
  <text x="260" y="170" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（无匹配 ⇒ 必无美丽下标）</text>
  <path d="M 356 156 L 392 156" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="148" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="392" y="142" width="82" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="433" y="160" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 [ ]</text>
  <path d="M 260 188 L 260 198" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="100" y="202" width="320" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">p = 0；依次遍历 i ∈ A（升序）</text>
  <path d="M 260 230 L 260 238" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <polygon points="260,242 366,276 260,310 154,276" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">p &lt; m 且</text>
  <text x="260" y="288" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">B[p] &lt; i − k ?</text>
  <path d="M 366 276 L 398 276" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="378" y="268" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="398" y="262" width="54" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="280" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">p++</text>
  <path d="M 425 262 C 425 238, 345 236, 306 252" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="412" y="240" text-anchor="start" font-size="9" fill="#d6a040" filter="url(#rough2)">循环</text>
  <path d="M 260 310 L 260 320" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">否</text>
  <polygon points="260,324 366,360 260,396 154,360" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="355" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">p &lt; m 且</text>
  <text x="260" y="372" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B[p] ≤ i + k ?</text>
  <path d="M 366 360 L 398 360" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="398" y="346" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="446" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans ← i</text>
  <path d="M 446 374 C 446 402, 330 414, 276 408" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrB)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 260 396 L 260 412 C 190 414, 120 404, 110 360 C 100 316, 100 280, 106 244 L 106 236" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="20" y="320" text-anchor="start" font-size="9.5" fill="#446688" filter="url(#rough2)">下一个 i</text>
  <path d="M 420 216 L 508 216 L 508 470 L 428 470" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="464" y="208" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">遍历完</text>
  <rect x="100" y="456" width="320" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="474" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans（A 升序 ⇒ 答案升序，无需排序）</text>
  <text x="260" y="506" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">💡 关键不变式：i 升序 ⇒ 下界 i−k 升序 ⇒ p 单向前进、永不回退</text>
</svg>
