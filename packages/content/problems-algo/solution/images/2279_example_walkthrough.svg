<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：缺口排序后逐个填补，预算耗尽即停</text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="56" font-size="12" fill="#446688" font-weight="bold">示例 1：capacity=[2,3,4,5], rocks=[1,2,4,4], additionalRocks=2</text>
  <text x="30" y="72" font-size="10.5" fill="#888">缺口 = [1,1,0,1] → 排序后 [0,1,1,1]</text>

  <!-- table header -->
  <g font-size="10.5" fill="#888">
    <rect x="30" y="80" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="55" y="95" text-anchor="middle">步 i</text>
    <rect x="80" y="80" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="110" y="95" text-anchor="middle">缺口</text>
    <rect x="140" y="80" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="195" y="95" text-anchor="middle">预算 ≥ 缺口？</text>
    <rect x="250" y="80" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="285" y="95" text-anchor="middle">花费</text>
    <rect x="320" y="80" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="365" y="95" text-anchor="middle">剩余预算</text>
    <rect x="410" y="80" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="445" y="95" text-anchor="middle">装满数</text>
  </g>

  <!-- row i=0 -->
  <g font-size="11" fill="#333">
    <rect x="30" y="104" width="50" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="55" y="119" text-anchor="middle">0</text>
    <rect x="80" y="104" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="110" y="119" text-anchor="middle">0</text>
    <rect x="140" y="104" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="195" y="119" text-anchor="middle" fill="#4a7a3a">是</text>
    <rect x="250" y="104" width="70" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="285" y="119" text-anchor="middle">0</text>
    <rect x="320" y="104" width="90" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="365" y="119" text-anchor="middle">2</text>
    <rect x="410" y="104" width="70" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="445" y="119" text-anchor="middle" font-weight="bold">1</text>
  </g>

  <!-- row i=1 -->
  <g font-size="11" fill="#333">
    <rect x="30" y="128" width="50" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="55" y="143" text-anchor="middle">1</text>
    <rect x="80" y="128" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="110" y="143" text-anchor="middle">1</text>
    <rect x="140" y="128" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="195" y="143" text-anchor="middle" fill="#4a7a3a">是</text>
    <rect x="250" y="128" width="70" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="285" y="143" text-anchor="middle">1</text>
    <rect x="320" y="128" width="90" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="365" y="143" text-anchor="middle">1</text>
    <rect x="410" y="128" width="70" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="445" y="143" text-anchor="middle" font-weight="bold">2</text>
  </g>

  <!-- row i=2 -->
  <g font-size="11" fill="#333">
    <rect x="30" y="152" width="50" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="55" y="167" text-anchor="middle">2</text>
    <rect x="80" y="152" width="60" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="110" y="167" text-anchor="middle">1</text>
    <rect x="140" y="152" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="195" y="167" text-anchor="middle" fill="#4a7a3a">是</text>
    <rect x="250" y="152" width="70" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="285" y="167" text-anchor="middle">1</text>
    <rect x="320" y="152" width="90" height="22" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="365" y="167" text-anchor="middle">0</text>
    <rect x="410" y="152" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="445" y="167" text-anchor="middle" font-weight="bold" fill="#4a7a3a">3</text>
  </g>

  <!-- row i=3 (stop) -->
  <g font-size="11" fill="#b85450">
    <rect x="30" y="176" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="55" y="191" text-anchor="middle">3</text>
    <rect x="80" y="176" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="110" y="191" text-anchor="middle">1</text>
    <rect x="140" y="176" width="110" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="195" y="191" text-anchor="middle">否 (0 &lt; 1)</text>
    <rect x="250" y="176" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="285" y="191" text-anchor="middle">—</text>
    <rect x="320" y="176" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="365" y="191" text-anchor="middle">0</text>
    <rect x="410" y="176" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="445" y="191" text-anchor="middle" font-weight="bold">停</text>
  </g>

  <!-- answer 1 -->
  <rect x="120" y="206" width="320" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 3（背包2本就满，2 块分给背包0、1）→ 输出 3</text>

  <!-- divider -->
  <line x1="20" y1="244" x2="540" y2="244" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="30" y="270" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2：capacity=[10,2,2], rocks=[2,2,0], additionalRocks=100</text>
  <text x="30" y="286" font-size="10.5" fill="#888">缺口 = [8,0,2] → 排序后 [0,2,8]，预算充裕全部装满</text>

  <!-- compact step chips -->
  <g font-size="10.5" fill="#333">
    <rect x="30" y="296" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="105" y="314" text-anchor="middle">i=0 缺口 0 → 花 0</text>
    <text x="105" y="332" text-anchor="middle" font-weight="bold" fill="#4a7a3a">剩余 100，装满 1</text>

    <rect x="190" y="296" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="265" y="314" text-anchor="middle">i=1 缺口 2 → 花 2</text>
    <text x="265" y="332" text-anchor="middle" font-weight="bold" fill="#4a7a3a">剩余 98，装满 2</text>

    <rect x="350" y="296" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="425" y="314" text-anchor="middle">i=2 缺口 8 → 花 8</text>
    <text x="425" y="332" text-anchor="middle" font-weight="bold" fill="#4a7a3a">剩余 90，装满 3</text>
  </g>

  <!-- answer 2 -->
  <rect x="120" y="352" width="320" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 3（预算充裕，不必用完，剩 90 块）→ 输出 3</text>

  <!-- footer -->
  <rect x="30" y="392" width="500" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="10.5" fill="#333">对比：示例1预算紧张(恰好够3个，第4个差1)，体现「先填小的」让有限预算覆盖更多背包</text>
  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#333">示例2预算充裕全部装满，break 不触发但结果仍正确</text>
  <text x="280" y="448" text-anchor="middle" font-size="10.5" fill="#888">deficit=0 的背包排序后沉到最左，花 0 即计入答案，与「本就装满」一致</text>
</svg>
