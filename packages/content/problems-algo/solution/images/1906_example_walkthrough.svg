<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：nums = [1,3,4,8]
  </text>

  <rect x="50" y="50" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="69" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">查询</text>
  <text x="190" y="69" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">子数组</text>
  <text x="320" y="69" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">出现的值（升序）</text>
  <text x="435" y="69" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">相邻差</text>
  <text x="515" y="69" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">答案</text>

  <rect x="50" y="78" width="500" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,1]</text>
  <text x="190" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 3]</text>
  <text x="320" y="97" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">1, 3</text>
  <text x="435" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="515" y="97" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="50" y="106" width="500" height="28" fill="#f7f7f7" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="190" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3, 4]</text>
  <text x="320" y="125" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">3, 4</text>
  <text x="435" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="515" y="125" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="50" y="134" width="500" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,3]</text>
  <text x="190" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4, 8]</text>
  <text x="320" y="153" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">4, 8</text>
  <text x="435" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="515" y="153" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="50" y="162" width="500" height="28" fill="#f7f7f7" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90"  y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,3]</text>
  <text x="190" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,3,4,8]</text>
  <text x="320" y="181" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">1, 3, 4, 8</text>
  <text x="435" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 1, 4</text>
  <text x="515" y="181" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <line x1="50" y1="205" x2="550" y2="205" stroke="#ddd" stroke-width="1" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <text x="300" y="228" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">
    示例 2 的 -1 场景：nums = [4,5,2,2,7,10]
  </text>

  <text x="60" y="252" font-size="11" fill="#333" filter="url(#rough2)">queries[0]=[2,3]，子数组：</text>
  <rect x="220" y="238" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="254" y="238" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#5a7a9a" filter="url(#rough2)">
    扫描 v=1..100：仅 v=2 出现（count=2），其余 count=0
  </text>

  <rect x="130" y="296" width="340" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="12" fill="#7a3a38" filter="url(#rough2)">
    出现的值仅 1 个（不足 2 个）→ ans = -1
  </text>
</svg>
