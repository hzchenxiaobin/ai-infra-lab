<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[1,1,1,1,1] + [1,0,1] = [1,0,0,0,0]（11 + 5 = 16）</text>

  <!-- setup note -->
  <rect x="40" y="36" width="480" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="52" text-anchor="middle" font-size="10.5" fill="#446688">逆序后从最低位起：a = [1,1,1,1,1]，b = [1,0,1,0,0]（补 0 对齐）</text>

  <!-- ===== table header ===== -->
  <rect x="40" y="66" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">轮次</text>

  <rect x="90" y="66" width="45" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a[i]</text>

  <rect x="135" y="66" width="45" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="157" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">b[i]</text>

  <rect x="180" y="66" width="55" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="207" y="84" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">carry↓</text>

  <rect x="235" y="66" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">sum</text>

  <rect x="285" y="66" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="307" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bit</text>

  <rect x="330" y="66" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">carry→</text>

  <rect x="390" y="66" width="130" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="84" text-anchor="middle" font-size="10" fill="#888">说明</text>

  <!-- ===== row 1: i=0, a=1, b=1, carry=0, sum=2, bit=0, carry=-1 ===== -->
  <rect x="40" y="94" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="112" text-anchor="middle" font-size="11" fill="#555">① i=0</text>
  <rect x="90" y="94" width="45" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="135" y="94" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="157" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="94" width="55" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="207" y="112" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="235" y="94" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="285" y="94" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="330" y="94" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="112" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="390" y="94" width="130" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="112" text-anchor="middle" font-size="9.5" fill="#888">1+1=2，进位 −1</text>

  <!-- ===== row 2: i=1, a=1, b=0, carry=-1, sum=0, bit=0, carry=0 ===== -->
  <rect x="40" y="122" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="140" text-anchor="middle" font-size="11" fill="#555">② i=1</text>
  <rect x="90" y="122" width="45" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="135" y="122" width="45" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="157" y="140" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="180" y="122" width="55" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="207" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="235" y="122" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="285" y="122" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="330" y="122" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="140" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="390" y="122" width="130" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="140" text-anchor="middle" font-size="9.5" fill="#888">进位 −1 抵消 a[i]=1</text>

  <!-- ===== row 3: i=2, a=1, b=1, carry=0, sum=2, bit=0, carry=-1 ===== -->
  <rect x="40" y="150" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="168" text-anchor="middle" font-size="11" fill="#555">③ i=2</text>
  <rect x="90" y="150" width="45" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="135" y="150" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="157" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="150" width="55" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="207" y="168" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="235" y="150" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="285" y="150" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="330" y="150" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="390" y="150" width="130" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="168" text-anchor="middle" font-size="9.5" fill="#888">同 ①，进位 −1</text>

  <!-- ===== row 4: i=3, a=1, b=0, carry=-1, sum=0, bit=0, carry=0 ===== -->
  <rect x="40" y="178" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="196" text-anchor="middle" font-size="11" fill="#555">④ i=3</text>
  <rect x="90" y="178" width="45" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="112" y="196" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="135" y="178" width="45" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="157" y="196" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="180" y="178" width="55" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="207" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="235" y="178" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="285" y="178" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="330" y="178" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="390" y="178" width="130" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="196" text-anchor="middle" font-size="9.5" fill="#888">同 ②，进位抵消</text>

  <!-- ===== row 5: i=4, a=1, b=0, carry=0, sum=1, bit=1, carry=0 ===== -->
  <rect x="40" y="206" width="50" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="224" text-anchor="middle" font-size="11" fill="#555">⑤ i=4</text>
  <rect x="90" y="206" width="45" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="112" y="224" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="135" y="206" width="45" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="157" y="224" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="180" y="206" width="55" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="207" y="224" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="235" y="206" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="285" y="206" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="330" y="206" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="224" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="390" y="206" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="224" text-anchor="middle" font-size="9.5" fill="#4a7a3a">最高位，写 1，停止</text>

  <!-- ===== result ===== -->
  <path d="M 307 234 L 307 246" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="248" width="360" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res = [0,0,0,0,1]（低位→高位）→ 逆序 → [1,0,0,0,0]</text>

  <!-- ===== verification ===== -->
  <rect x="100" y="286" width="360" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">验证：(−2)⁴ = 16 = 11 + 5 ✓</text>

  <!-- ===== carry pattern note ===== -->
  <rect x="40" y="330" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">规律：进位 −1 与 +1 交替抵消，形成 2 步周期</text>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#555">sum=2 → carry=−1 → 下一轮 sum=0 → carry=0（因 −(−1+1+0)=0 的进位被吃掉）</text>
  <text x="280" y="384" text-anchor="middle" font-size="10.5" fill="#555">本质：base −2 中 2 = (−2)(−1) + 0，−1 进位在下一高位贡献 (−2)(−1) = +2，恰好抵消</text>

  <!-- ===== decimal cross-check ===== -->
  <rect x="40" y="404" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">十进制交叉验证</text>
  <text x="280" y="444" text-anchor="middle" font-size="10.5" fill="#555">arr1 = 16−8+4−2+1 = 11，arr2 = 4+1 = 5，和 = 16</text>
  <text x="280" y="458" text-anchor="middle" font-size="10.5" fill="#555">[1,0,0,0,0] = (−2)⁴ = 16 ✓</text>
</svg>
