<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：SPF 筛 + 并查集（质因子哈希合并）</text>

  <!-- 1. input -->
  <rect x="240" y="46" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="69" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 nums</text>
  <path d="M 320 84 L 320 100" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. decision: n==1 -->
  <polygon points="320,104 420,140 320,176 220,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="136" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">n == 1 ？</text>
  <text x="320" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">无下标对</text>
  <!-- 是 -> true -->
  <path d="M 420 140 L 486 140" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="450" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="488" y="124" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="548" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>
  <!-- 否 -> down -->
  <path d="M 320 176 L 320 194" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="188" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- 3. decision: 含 1 -->
  <polygon points="320,198 430,236 320,274 210,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">含 nums[i]==1 ？</text>
  <text x="320" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(n≥2)</text>
  <!-- 是 -> false -->
  <path d="M 430 236 L 486 236" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="456" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="488" y="220" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="548" y="241" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>
  <path d="M 320 274 L 320 292" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="286" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- 4. SPF sieve -->
  <rect x="200" y="296" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="319" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">SPF 筛：预处理最小质因子</text>
  <path d="M 320 332 L 320 348" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. loop box -->
  <rect x="120" y="352" width="400" height="58" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">遍历每个 nums[i]，分解质因数</text>
  <text x="320" y="390" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">对每个质因子 p：若 p∈seen → union(i, seen[p])；否则 seen[p]=i</text>
  <path d="M 320 410 L 320 424" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. final decision: all same root -->
  <polygon points="320,428 460,428 390,460 250,460" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="450" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">全部同根？</text>
</svg>
