<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">差分数组：区间移位 [start, end] → 两端 ±δ 标记</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">dir=1 → δ=+1（向后/下一字母）；dir=0 → δ=−1（向前/上一字母）</text>

  <!-- String s row (indices 0..6) -->
  <text x="48" y="92" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">s</text>
  <!-- highlight range [start=2, end=4] -->
  <rect x="190" y="68" width="148" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="84" y="70" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="108" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s₀</text>
  <rect x="138" y="70" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="162" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s₁</text>
  <rect x="192" y="70" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s₂</text>
  <rect x="246" y="70" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s₃</text>
  <rect x="300" y="70" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="324" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s₄</text>
  <rect x="354" y="70" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="378" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s₅</text>
  <rect x="408" y="70" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="432" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s₆</text>
  <text x="264" y="60" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">shift [start=2, end=4, dir=1]</text>

  <!-- diff row -->
  <text x="40" y="148" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">diff</text>
  <rect x="84" y="124" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="108" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="138" y="124" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="162" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="192" y="124" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="216" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+δ</text>
  <rect x="246" y="124" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="300" y="124" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="324" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="354" y="124" width="48" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="378" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−δ</text>
  <rect x="408" y="124" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="432" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="216" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">start</text>
  <text x="378" y="120" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">end+1</text>

  <!-- connectors +δ / −δ from diff to s -->
  <path d="M 216 104 L 216 122" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 378 104 L 378 122" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- prefix sum arrow -->
  <path d="M 270 162 L 270 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="180" font-size="10" fill="#666" filter="url(#rough2)">前缀和</text>

  <!-- net shift row -->
  <text x="46" y="212" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">net</text>
  <rect x="190" y="188" width="148" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="84" y="190" width="48" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="108" y="210" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="138" y="190" width="48" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="162" y="210" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="192" y="190" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="216" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">δ</text>
  <rect x="246" y="190" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">δ</text>
  <rect x="300" y="190" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="324" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">δ</text>
  <rect x="354" y="190" width="48" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="378" y="210" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="408" y="190" width="48" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="432" y="210" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <!-- bottom note -->
  <rect x="56" y="250" width="428" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">net[i] = Σ diff[0..i]，区间 [start, end] 内恒为 δ</text>
  <text x="270" y="290" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最终字符 = (s[i] − 'a' + net[i]) mod 26 + 'a'，每次移位 O(1) 更新两端</text>

  <!-- recap arrows -->
  <path d="M 110 320 L 430 320" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m 次移位 → diff 上共 2m 次标记 → 一趟前缀和还原全部 net</text>
  <text x="270" y="356" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">O(n + m) / O(n)</text>
</svg>
