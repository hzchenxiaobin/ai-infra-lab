<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分图判定：相邻节点异色，能染完即二分图</text>

  <!-- ===== Left panel: success (4-cycle / K2,2) ===== -->
  <rect x="24" y="48" width="252" height="236" rx="10" fill="#f4faf6" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓ 可二着色（4-环 = 二分图）</text>
  <text x="80" y="96" text-anchor="middle" font-size="11" fill="#446688">集合 A（蓝）</text>
  <text x="220" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a">集合 B（绿）</text>

  <!-- edges (drawn before nodes) -->
  <path d="M 80 140 L 220 140" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 140 L 220 220" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 220 L 220 140" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 220 L 220 220" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nodes: A = {0,2} blue, B = {1,3} green -->
  <circle cx="80" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="145" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <circle cx="80" cy="220" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="225" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <circle cx="220" cy="140" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="145" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <circle cx="220" cy="220" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="225" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#555">每条边都横跨 A、B 两集合</text>

  <!-- ===== Right panel: failure (triangle / odd cycle) ===== -->
  <rect x="292" y="48" width="244" height="236" rx="10" fill="#fdf3f4" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="414" y="72" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">✗ 奇环（3-环）染色冲突</text>

  <!-- edges: 0-1 ok, 0-2 ok, 1-2 conflict (red) -->
  <path d="M 414 120 L 354 210" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 414 120 L 474 210" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 354 210 L 474 210" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- nodes: 0 blue, 1 green, 2 green -->
  <circle cx="414" cy="120" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="414" y="125" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <circle cx="354" cy="210" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="354" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <circle cx="474" cy="210" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="474" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <text x="414" y="250" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">边 1–2 两端同色 → 失败</text>
  <text x="414" y="268" text-anchor="middle" font-size="11" fill="#555">含奇数环 ⟹ 非二分图</text>

  <!-- ===== Bottom note box ===== -->
  <rect x="40" y="304" width="480" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">等价判定：二分图 ⟺ 可二着色 ⟺ 不含奇数长度的环</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#666">染色法：相邻必须异色；一旦同色相邻即发现奇环，返回 false</text>
</svg>
