<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：乘积的符号 = 各因子符号的乘积</text>

  <!-- Left labels -->
  <text x="42" y="84" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">nums</text>
  <text x="42" y="164" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">sign</text>

  <!-- Row 1: nums = [-1,-2,-3,-4,3,2,1], 7 cells width 54 height 38, y=60, x=81..405 -->
  <rect x="81"  y="60" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="135" y="60" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="189" y="60" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="243" y="60" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="297" y="60" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="351" y="60" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="405" y="60" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="162" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="216" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="270" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−4</text>
  <text x="324" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="378" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="432" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Row 2: sign(x), same x positions, y=140 -->
  <rect x="81"  y="140" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="135" y="140" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="189" y="140" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="243" y="140" width="54" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="297" y="140" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="351" y="140" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="405" y="140" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="164" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="162" y="164" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="216" y="164" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="270" y="164" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="324" y="164" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="378" y="164" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="432" y="164" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">+1</text>

  <!-- Convergence: horizontal brace line + down arrow -->
  <path d="M 81 190 L 459 190" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 270 190 L 270 216" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="60" y="220" width="420" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sign(∏ nums[i]) = ∏ sign(nums[i]) = (−1) × (−1) × (−1) × (−1) × (+1) × (+1) × (+1)</text>
  <text x="270" y="262" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">= (−1)⁴ = +1  →  返回 1   （4 个负数，偶数个 → 正）</text>

  <!-- Divider -->
  <path d="M 40 296 L 500 296" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- General rule box -->
  <rect x="60" y="306" width="420" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="328" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">一般规则</text>
  <text x="80" y="350" font-size="12" fill="#333" filter="url(#rough2)">• 若数组中存在 0   →  乘积为 0   →  返回 0</text>
  <text x="80" y="372" font-size="12" fill="#333" filter="url(#rough2)">• 否则  返回 (−1)^(负数个数)：奇 → −1，偶 → +1</text>
</svg>
