<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">核心直觉：深度相等 = 沿 JSON 文法「同构地」逐层递归比对</text>

  <!-- 左树标题 -->
  <text x="150" y="56" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)" font-weight="bold">o1</text>
  <!-- 右树标题 -->
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)" font-weight="bold">o2</text>

  <!-- L0 根对象 -->
  <rect x="110" y="64" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ obj }</text>
  <rect x="430" y="64" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ obj }</text>
  <!-- 配对：根 -->
  <path d="M 190 81 L 430 81" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="310" y="76" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">同型 ✓</text>

  <!-- L1 x:null -->
  <rect x="80" y="140" width="84" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="122" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x: null</text>
  <rect x="456" y="140" width="84" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="498" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x: null</text>
  <path d="M 164 156 L 456 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="310" y="151" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">null===null ✓</text>
  <!-- 根→x 连线（左） -->
  <path d="M 135 98 L 122 140" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 485 98 L 498 140" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- L2 y:[] 数组 -->
  <rect x="100" y="200" width="100" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y: [ … ]</text>
  <rect x="420" y="200" width="100" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y: [ … ]</text>
  <path d="M 200 216 L 420 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="310" y="211" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">数组·等长 ✓ → 逐 i 下钻</text>
  <!-- x→y 连线 -->
  <path d="M 150 172 L 150 200" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 470 172 L 470 200" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- L3 数组元素 1 2 3 -->
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <rect x="92" y="288" width="40" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="112" y="307" text-anchor="middle">1</text>
    <rect x="140" y="288" width="40" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="160" y="307" text-anchor="middle">2</text>
    <rect x="188" y="288" width="40" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="208" y="307" text-anchor="middle">3</text>

    <rect x="412" y="288" width="40" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="432" y="307" text-anchor="middle">1</text>
    <rect x="460" y="288" width="40" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="480" y="307" text-anchor="middle">2</text>
    <rect x="508" y="288" width="40" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="528" y="307" text-anchor="middle">3</text>
  </g>
  <!-- 数组→元素 连线 -->
  <path d="M 150 232 L 112 288" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 150 232 L 160 288" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 150 232 L 208 288" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 470 232 L 432 288" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 470 232 L 480 288" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 470 232 L 528 288" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <!-- 逐元素配对：一条大括号式连线 -->
  <path d="M 228 303 L 412 303" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="320" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i=0,1,2 同型同值 ✓</text>

  <!-- 递归箭头标注 -->
  <text x="20" y="86" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">递归</text>
  <text x="20" y="100" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">下钻</text>
  <path d="M 20 104 L 20 300 L 88 300" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="30" y="360" width="560" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="382" font-size="12" fill="#333" filter="url(#rough2)" font-weight="bold">关键：比较沿两棵 JSON 树并行下钻——</text>
  <text x="46" y="400" font-size="11" fill="#555" filter="url(#rough2)">每个配对节点须「同型 + 同值」；任一节点失配即整体 false（短路）。</text>
  <text x="46" y="416" font-size="11" fill="#888" filter="url(#rough2)">原始值（null/布尔/数/串）是递归基，数组/对象是递归步——这正是 JSON 文法的递归性。</text>
</svg>
