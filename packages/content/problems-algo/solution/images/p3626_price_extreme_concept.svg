<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：双向 ROW_NUMBER，rn = 1 的行就是两个极值行</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">rn_hi：ORDER BY price↓, qty↓　rn_lo：ORDER BY price↑, qty↓（平局都取数量最多）</text>

  <text x="22" y="70" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Suburb Mall（store_id = 2）店内存量按两个方向各排一次名：</text>

  <rect x="20" y="80" width="112" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="76" y="95" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">商品</text>
  <rect x="132" y="80" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="158" y="95" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">数量</text>
  <rect x="184" y="80" width="84" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="226" y="95" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">价格</text>
  <rect x="268" y="80" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="95" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">rn_hi</text>
  <rect x="308" y="80" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="328" y="95" text-anchor="middle" font-size="10.5" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">rn_lo</text>

  <rect x="20" y="104" width="112" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="121" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Phone</text>
  <rect x="132" y="104" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="121" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="184" y="104" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="121" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">699.99</text>
  <rect x="268" y="104" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="308" y="104" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="121" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">4</text>

  <rect x="20" y="132" width="112" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Headphones</text>
  <rect x="132" y="132" width="52" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">20</text>
  <rect x="184" y="132" width="84" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">149.99</text>
  <rect x="268" y="132" width="40" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="149" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="308" y="132" width="40" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="149" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>

  <rect x="20" y="160" width="112" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="177" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Charger</text>
  <rect x="132" y="160" width="52" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="177" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">100</text>
  <rect x="184" y="160" width="84" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="177" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">25.99</text>
  <rect x="268" y="160" width="40" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="177" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>
  <rect x="308" y="160" width="40" height="26" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="177" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>

  <rect x="20" y="188" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Case</text>
  <rect x="132" y="188" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">75</text>
  <rect x="184" y="188" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="205" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">15.99</text>
  <rect x="268" y="188" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="205" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">4</text>
  <rect x="308" y="188" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="366" y="96" width="140" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="118" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">rn_hi = 1 → 最贵</text>
  <text x="436" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Phone · 数量 3</text>

  <rect x="366" y="166" width="140" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="188" text-anchor="middle" font-size="11" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">rn_lo = 1 → 最便宜</text>
  <text x="436" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Case · 数量 75</text>

  <path d="M 352 117 Q 360 116 364 118" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>
  <path d="M 352 201 Q 360 200 364 198" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="366" y="238" width="140" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 &lt; 75 → 不平衡</text>
  <text x="436" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">比值 75 / 3</text>
  <text x="436" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 25.00</text>

  <path d="M 436 224 Q 436 232 436 236" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <path d="M 436 164 Q 436 232 436 236" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <path d="M 22 316 L 498 316" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>

  <text x="22" y="342" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">对照：Corner Shop（store_id = 4）</text>

  <rect x="20" y="352" width="220" height="46" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="130" y="370" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Watch 10 @299.99（最贵）</text>
  <text x="130" y="388" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Band 25 @49.99（最便宜）</text>

  <path d="M 244 375 Q 254 375 262 375" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <rect x="266" y="352" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="386" y="370" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">虽然 10 &lt; 25 满足不平衡</text>
  <text x="386" y="388" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">但不同商品仅 2 个 &lt; 3 → 剔除</text>

  <text x="260" y="428" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">平局规则编进第二排序键：price 并列 → quantity DESC，两个方向对称</text>
  <text x="260" y="448" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">MAX(CASE WHEN rn = 1 THEN … END) 把每组唯一的极值行「抽」出来</text>
</svg>
