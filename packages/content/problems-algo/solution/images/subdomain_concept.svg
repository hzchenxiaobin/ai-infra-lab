<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">子域名 = 域名按「.」切出的所有后缀</text>

  <!-- record -->
  <rect x="150" y="50" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="72" text-anchor="middle" font-size="12" fill="#333">记录："9001 discuss.leetcode.com"</text>

  <!-- split count / domain -->
  <text x="290" y="104" text-anchor="middle" font-size="11" fill="#888">按空格拆 → count=9001，domain=discuss.leetcode.com</text>

  <!-- domain segments -->
  <text x="40" y="150" font-size="11" fill="#888">domain 分段：</text>
  <rect x="130" y="134" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">discuss</text>
  <text x="226" y="154" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">.</text>
  <rect x="234" y="134" width="84" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">leetcode</text>
  <text x="322" y="154" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">.</text>
  <rect x="330" y="134" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">com</text>
  <text x="400" y="154" font-size="11" fill="#888">（红点 = 切分点）</text>

  <!-- arrows down to suffixes -->
  <path d="M 176 168 L 110 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 276 168 L 290 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 358 168 L 470 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- three suffix boxes -->
  <rect x="40" y="202" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">discuss.leetcode.com</text>
  <text x="125" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">i=0 起的后缀（完整域名）</text>

  <rect x="220" y="202" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">leetcode.com</text>
  <text x="290" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">i=1 起（去最底层段）</text>

  <rect x="410" y="202" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">com</text>
  <text x="470" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">i=2 起（顶层域名）</text>

  <!-- += count -->
  <text x="290" y="270" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每个后缀都 += 9001</text>
  <path d="M 125 252 L 125 280" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 252 L 290 280" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 252 L 470 280" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- hashmap -->
  <rect x="60" y="296" width="460" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="80" y="316" font-size="11" fill="#b85450" font-weight="bold">哈希表 cnt（聚合计数）：</text>
  <text x="80" y="336" font-size="11" fill="#333">cnt["discuss.leetcode.com"]=9001</text>
  <text x="80" y="354" font-size="11" fill="#333">cnt["leetcode.com"]=9001</text>
  <text x="320" y="336" font-size="11" fill="#333">cnt["com"]=9001</text>
  <text x="320" y="354" font-size="10" fill="#888">同后缀来自不同记录自动合并</text>
</svg>
