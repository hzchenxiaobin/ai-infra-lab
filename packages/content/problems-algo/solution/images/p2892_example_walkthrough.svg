<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：dp 逐行推进（b = [2,3,3,7,3,5]，k = 20）</text>
  <text x="310" y="44" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">单元素组先垫底，再向左扩展；乘积一旦超过 20 立即断</text>

  <!-- highlight rows 4,5 -->
  <rect x="44" y="192" width="532" height="72" fill="#fff8e1" opacity="0.8" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="44" y="58" width="532" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="59" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="95" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">b[i]</text>
  <text x="177" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">单元素组垫底</text>
  <text x="377" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">向左扩展（乘积 ≤ k 才继续）</text>
  <text x="546" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i]</text>

  <!-- grid lines -->
  <line x1="74" y1="58" x2="74" y2="300" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="116" y1="58" x2="116" y2="300" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="238" y1="58" x2="238" y2="300" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="516" y1="58" x2="516" y2="300" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="44" y1="120" x2="576" y2="120" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="44" y1="156" x2="576" y2="156" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="44" y1="192" x2="576" y2="192" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="44" y1="228" x2="576" y2="228" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="44" y1="264" x2="576" y2="264" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="44" y="58" width="532" height="242" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- rows -->
  <text x="59" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="95" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="177" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[0]+1 = 1</text>
  <text x="377" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（j 已到 0，无法再扩）</text>
  <text x="546" y="106" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="59" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="95" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="177" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[1]+1 = 2</text>
  <text x="377" y="142" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">p: 3→6 ✓ ⇒ dp[0]+1 = 1</text>
  <text x="546" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="59" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="95" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="177" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[2]+1 = 2</text>
  <text x="377" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">p: 3→9→18 ✓ ⇒ dp[1]+1=2、dp[0]+1=1</text>
  <text x="546" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="59" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="95" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="177" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[3]+1 = 2</text>
  <text x="377" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">7×3 = 21 &gt; 20 ✗ 立即断</text>
  <text x="546" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="59" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="95" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="177" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[4]+1 = 3</text>
  <text x="377" y="250" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">3×7 = 21 &gt; 20 ✗ 立即断</text>
  <text x="546" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="59" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="95" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="177" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[5]+1 = 4</text>
  <text x="377" y="286" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">p: 5→15 ✓ ⇒ dp[4]+1 = 3；15×7 = 105 ✗</text>
  <text x="546" y="286" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- summary box -->
  <rect x="70" y="314" width="480" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="332" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">dp = [0, 1, 1, 1, 2, 3, 3] → 答案 dp[6] = 3</text>
  <text x="310" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最优划分 [2,3,3 | 7 | 3,5] → [18, 7, 15]</text>

  <text x="310" y="374" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i=4、5 一步即断：合并 1 后段长 ≤ 2·log₂20 + 1 ≈ 9，回溯代价 O(log k)</text>
</svg>
