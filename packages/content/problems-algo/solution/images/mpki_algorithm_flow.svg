<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：最小堆贪心，k 轮「弹最小 → +1 → 回填」</text>

  <rect x="220" y="46" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 78 L 280 96" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="100" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">建最小堆：把 nums 全部入堆</text>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#888">priority_queue / heapify，O(n)</text>
  <path d="M 280 144 L 280 162" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,166 360,210 280,254 200,210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k &gt; 0 ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#888">还有操作次数</text>

  <path d="M 360 210 L 410 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="410" y="178" width="140" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">循环体（一次操作）</text>
  <text x="420" y="220" font-size="11" fill="#444">① 弹堆顶 x（最小）</text>
  <text x="420" y="240" font-size="11" fill="#444">② x ← x + 1</text>
  <text x="420" y="260" font-size="11" fill="#444">③ x 重新入堆</text>
  <text x="420" y="280" font-size="11" fill="#444">④ k ← k − 1</text>

  <path d="M 480 294 L 480 335 L 200 335 L 200 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a">回到判断</text>

  <path d="M 280 254 L 280 340" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="296" y="276" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="130" y="344" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">堆中所有元素求积</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#555">ans = ∏ aᵢ mod (10⁹+7)</text>
  <path d="M 280 394 L 280 412" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="416" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="437" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <text x="280" y="468" text-anchor="middle" font-size="10" fill="#888">每轮 O(log n)，共 k 轮 → O(k log n)</text>
</svg>
