<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三航班的入座/等待切分与入座率</text>

  <!-- header row -->
  <g font-size="11" fill="#888" font-weight="bold">
    <text x="56" y="56" text-anchor="middle">flight_id</text>
    <text x="110" y="56" text-anchor="middle">capacity</text>
    <text x="220" y="56" text-anchor="middle">旅客（按 id 升序，绿=入座 橙=等待）</text>
    <text x="372" y="56" text-anchor="middle">D=COUNT</text>
    <text x="424" y="56" text-anchor="middle">B=入座</text>
    <text x="476" y="56" text-anchor="middle">W=等待</text>
    <text x="528" y="56" text-anchor="middle">R=入座率</text>
  </g>

  <line x1="30" y1="64" x2="540" y2="64" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row 1: flight 1, cap 2, pax 101 102 103 -->
  <g font-size="13" font-weight="bold">
    <text x="56" y="100" text-anchor="middle" fill="#333">1</text>
    <text x="110" y="100" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="155" y="78" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="175" y="100" text-anchor="middle" fill="#333" font-size="12">101</text>
    <rect x="199" y="78" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="219" y="100" text-anchor="middle" fill="#333" font-size="12">102</text>
    <rect x="243" y="78" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="263" y="100" text-anchor="middle" fill="#333" font-size="12">103</text>
    <text x="372" y="100" text-anchor="middle" fill="#333">3</text>
    <text x="424" y="100" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="476" y="100" text-anchor="middle" fill="#d6a040">1</text>
    <text x="528" y="100" text-anchor="middle" fill="#446688">1.00</text>
  </g>
  <text x="175" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a">rn1</text>
  <text x="219" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a">rn2</text>
  <text x="263" y="126" text-anchor="middle" font-size="9" fill="#d6a040">rn3</text>

  <line x1="30" y1="136" x2="540" y2="136" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 2: flight 2, cap 2, pax 104 105 -->
  <g font-size="13" font-weight="bold">
    <text x="56" y="172" text-anchor="middle" fill="#333">2</text>
    <text x="110" y="172" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="155" y="150" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="175" y="172" text-anchor="middle" fill="#333" font-size="12">104</text>
    <rect x="199" y="150" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="219" y="172" text-anchor="middle" fill="#333" font-size="12">105</text>
    <text x="372" y="172" text-anchor="middle" fill="#333">2</text>
    <text x="424" y="172" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="476" y="172" text-anchor="middle" fill="#999">0</text>
    <text x="528" y="172" text-anchor="middle" fill="#446688">1.00</text>
  </g>
  <text x="175" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a">rn1</text>
  <text x="219" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a">rn2</text>

  <line x1="30" y1="208" x2="540" y2="208" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 3: flight 3, cap 1, pax 106 107 -->
  <g font-size="13" font-weight="bold">
    <text x="56" y="244" text-anchor="middle" fill="#333">3</text>
    <text x="110" y="244" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="155" y="222" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="175" y="244" text-anchor="middle" fill="#333" font-size="12">106</text>
    <rect x="199" y="222" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="219" y="244" text-anchor="middle" fill="#333" font-size="12">107</text>
    <text x="372" y="244" text-anchor="middle" fill="#333">2</text>
    <text x="424" y="244" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="476" y="244" text-anchor="middle" fill="#d6a040">1</text>
    <text x="528" y="244" text-anchor="middle" fill="#446688">1.00</text>
  </g>
  <text x="175" y="270" text-anchor="middle" font-size="9" fill="#4a7a3a">rn1</text>
  <text x="219" y="270" text-anchor="middle" font-size="9" fill="#d6a040">rn2</text>

  <!-- formula reminders -->
  <rect x="50" y="296" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">B = LEAST(D, capacity)    W = GREATEST(D−capacity, 0)    R = ROUND(B/C, 2)</text>

  <!-- takeaway -->
  <rect x="50" y="344" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">三航班入座率齐平 1.00，差异全在 waitlist_cnt → 双指标才完整</text>
</svg>
