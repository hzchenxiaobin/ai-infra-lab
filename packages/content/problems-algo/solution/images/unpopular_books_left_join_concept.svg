<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：「销量 &lt; 10」包含零销量 → 必须 LEFT JOIN</text>

  <!-- LEFT JOIN panel (top) -->
  <rect x="30" y="44" width="580" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="12" fill="#4a7a3a" font-weight="bold">LEFT JOIN + IFNULL（正确 ✓）</text>
  <text x="320" y="66" font-size="9.5" fill="#555">保留全部可售书，零销量行 SUM 为 NULL → IFNULL(,0)=0 &lt; 10</text>

  <!-- header -->
  <rect x="50" y="78" width="540" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="78" y="93" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">book_id</text>
  <text x="170" y="93" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">name</text>
  <text x="300" y="93" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">过去一年订单</text>
  <text x="420" y="93" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">SUM(qty)</text>
  <text x="520" y="93" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">&lt; 10?</text>
  <line x1="120" y1="78" x2="120" y2="102" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="78" x2="240" y2="102" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="78" x2="380" y2="102" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="470" y1="78" x2="470" y2="102" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row book 1 -->
  <rect x="50" y="102" width="540" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="117" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="170" y="117" text-anchor="middle" font-size="9.5" fill="#333">Kalila And Demna</text>
  <text x="300" y="117" text-anchor="middle" font-size="9.5" fill="#333">2 条 (qty 2+1)</text>
  <text x="420" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="520" y="117" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <line x1="120" y1="102" x2="120" y2="126" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="240" y1="102" x2="240" y2="126" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="380" y1="102" x2="380" y2="126" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="470" y1="102" x2="470" y2="126" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row book 2: key case -->
  <rect x="50" y="126" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="78" y="141" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="170" y="141" text-anchor="middle" font-size="9.5" fill="#333">28 Letters</text>
  <text x="300" y="141" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">无任何订单</text>
  <text x="420" y="141" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">NULL</text>
  <text x="520" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 0</text>
  <line x1="120" y1="126" x2="120" y2="150" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="240" y1="126" x2="240" y2="150" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="380" y1="126" x2="380" y2="150" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="470" y1="126" x2="470" y2="150" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row book 5: key case -->
  <rect x="50" y="150" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="78" y="165" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="170" y="165" text-anchor="middle" font-size="9.5" fill="#333">The Hunger Games</text>
  <text x="300" y="165" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">订单均超 1 年</text>
  <text x="420" y="165" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">NULL</text>
  <text x="520" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 0</text>
  <line x1="120" y1="150" x2="120" y2="174" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="240" y1="150" x2="240" y2="174" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="380" y1="150" x2="380" y2="174" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="470" y1="150" x2="470" y2="174" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="320" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果 → book 1, 2, 5（3 行，零销量书保留）</text>
  <text x="320" y="212" text-anchor="middle" font-size="9.5" fill="#555">IFNULL(SUM(o.quantity), 0) &lt; 10：NULL 视作 0，0 &lt; 10 命中</text>
  <text x="320" y="228" text-anchor="middle" font-size="9" fill="#888">注：book 3、4 因可售不足 1 月已被 WHERE 排除，不进入此表</text>

  <!-- INNER JOIN panel (bottom) -->
  <rect x="30" y="256" width="580" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="278" font-size="12" fill="#b85450" font-weight="bold">INNER JOIN（错误 ✗）</text>
  <text x="320" y="278" font-size="9.5" fill="#555">无匹配行被整行丢弃，零销量书消失</text>

  <rect x="50" y="290" width="540" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="78" y="305" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">book_id</text>
  <text x="170" y="305" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">name</text>
  <text x="300" y="305" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">过去一年订单</text>
  <text x="420" y="305" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">SUM(qty)</text>
  <text x="520" y="305" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">&lt; 10?</text>
  <line x1="120" y1="290" x2="120" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="290" x2="240" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="290" x2="380" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="470" y1="290" x2="470" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="314" width="540" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="329" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="170" y="329" text-anchor="middle" font-size="9.5" fill="#333">Kalila And Demna</text>
  <text x="300" y="329" text-anchor="middle" font-size="9.5" fill="#333">2 条</text>
  <text x="420" y="329" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="520" y="329" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <line x1="120" y1="314" x2="120" y2="338" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="240" y1="314" x2="240" y2="338" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="380" y1="314" x2="380" y2="338" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="470" y1="314" x2="470" y2="338" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="50" y="338" width="540" height="24" fill="#fcfcf6" stroke="#888" stroke-width="1" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="320" y="353" text-anchor="middle" font-size="9.5" fill="#888">book 2、book 5 被丢弃（无过去一年匹配行）</text>

  <text x="320" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结果 → 仅 book 1（漏掉 2、5）✗</text>
  <text x="320" y="400" text-anchor="middle" font-size="9.5" fill="#555">INNER JOIN 把「零销量」等同于「不存在」，丢失合格小众书</text>

  <!-- insight -->
  <rect x="30" y="430" width="580" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="450" font-size="10.5" fill="#555" font-weight="bold">💡 口诀：求「&lt; 阈值」要防零漏 → LEFT JOIN 保全集 + IFNULL(SUM, 0)</text>
</svg>
