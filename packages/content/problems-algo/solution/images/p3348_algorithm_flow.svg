<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：分解 → 三种情形依次构造</text>

  <!-- 分解 t -->
  <rect x="150" y="40" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">分解 t = 2^a·3^b·5^c·7^d</text>

  <path d="M 260 74 L 260 90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 菱形1：含 >7 质因子？ -->
  <polygon points="260,94 340,124 260,154 180,124" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">除尽 2,3,5,7 后</text>
  <text x="260" y="136" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">t 还 &gt; 1 ？</text>

  <path d="M 340 124 L 404 124" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="366" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="408" y="108" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="454" y="129" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">返回 "-1"</text>

  <path d="M 260 154 L 260 170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="166" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 菱形2：num 自身可行？ -->
  <polygon points="260,174 352,210 260,246 168,210" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">num 无 0 且</text>
  <text x="260" y="219" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">质因子 ≥ need？</text>

  <path d="M 352 210 L 404 210" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="376" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="408" y="194" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="454" y="215" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 num ✓</text>

  <path d="M 260 246 L 260 262" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="258" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 扫描 i -->
  <rect x="120" y="266" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">i 从 min(首个 0 下标, n−1) 往左扫</text>

  <path d="M 260 302 L 260 318" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 菱形3：存在可行放大位？ -->
  <polygon points="260,322 352,352 260,382 168,352" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">有 d∈[num[i]+1,9]</text>
  <text x="260" y="362" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">使 slots ≤ m？</text>

  <path d="M 352 352 L 404 352" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="376" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="408" y="330" width="94" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="348" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 前缀+d</text>
  <text x="455" y="365" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+贪心后缀 ✓</text>

  <!-- 回环：i 左移 -->
  <path d="M 168 352 C 120 352, 110 284, 118 284" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="86" y="330" font-size="10" fill="#446688" filter="url(#rough2)">否，i−1</text>

  <!-- 升长兜底 -->
  <path d="M 260 382 L 260 398" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="394" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">i &lt; 0</text>
  <rect x="120" y="400" width="280" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="418" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">升长 L = max(n+1, slots(need))，贪心填 L 位返回</text>
</svg>
