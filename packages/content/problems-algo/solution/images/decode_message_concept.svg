<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：key 去重后第 i 个字母 ↔ 字母表第 i 个字母</text>

  <!-- key原文 -->
  <text x="36" y="62" font-size="11.5" fill="#888">key 原文：</text>
  <rect x="92" y="46" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="342" y="68" text-anchor="middle" font-size="12.5" fill="#333">the quick brown fox jumps over the lazy dog</text>

  <!-- arrow down: 去重 -->
  <path d="M 320 82 L 320 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="336" y="100" font-size="11" fill="#888">跳过空格 + 跳过已出现</text>

  <!-- 去重后首次出现序列 -->
  <text x="36" y="138" font-size="11.5" fill="#888">去重序列：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="92" y="120" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="109" y="143" fill="#b85450" font-weight="bold">t</text>
    <rect x="130" y="120" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="147" y="143" fill="#b85450" font-weight="bold">h</text>
    <rect x="168" y="120" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="185" y="143" fill="#b85450" font-weight="bold">e</text>
    <rect x="206" y="120" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="223" y="143" fill="#b85450" font-weight="bold">q</text>
    <rect x="244" y="120" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="261" y="143" fill="#b85450" font-weight="bold">u</text>
    <rect x="282" y="120" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="299" y="143" fill="#b85450" font-weight="bold">i</text>
    <rect x="320" y="120" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="337" y="143" fill="#b85450" font-weight="bold">c</text>
    <rect x="358" y="120" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="375" y="143" fill="#b85450" font-weight="bold">k</text>
    <text x="408" y="143" font-size="14" fill="#888">...</text>
  </g>

  <!-- vertical arrows to alphabet -->
  <g stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)">
    <path d="M 109 156 L 109 188"/>
    <path d="M 147 156 L 147 188"/>
    <path d="M 185 156 L 185 188"/>
    <path d="M 223 156 L 223 188"/>
    <path d="M 261 156 L 261 188"/>
    <path d="M 299 156 L 299 188"/>
    <path d="M 337 156 L 337 188"/>
    <path d="M 375 156 L 375 188"/>
  </g>

  <!-- 字母表 -->
  <text x="36" y="214" font-size="11.5" fill="#888">字母表：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="92" y="192" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="109" y="215" font-weight="bold">a</text>
    <rect x="130" y="192" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="147" y="215" font-weight="bold">b</text>
    <rect x="168" y="192" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="185" y="215" font-weight="bold">c</text>
    <rect x="206" y="192" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="223" y="215" font-weight="bold">d</text>
    <rect x="244" y="192" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="261" y="215" font-weight="bold">e</text>
    <rect x="282" y="192" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="299" y="215" font-weight="bold">f</text>
    <rect x="320" y="192" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="337" y="215" font-weight="bold">g</text>
    <rect x="358" y="192" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="375" y="215" font-weight="bold">h</text>
    <text x="408" y="215" font-size="14" fill="#888">...</text>
  </g>

  <!-- mapping rule box -->
  <rect x="60" y="248" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">下标 i 的去重字母 ↔ 字母表第 i 个字母（'a'+i）</text>
  <text x="320" y="292" text-anchor="middle" font-size="11.5" fill="#555">key 含全部 26 个字母，故去重序列恰长 26</text>

  <!-- decode direction -->
  <path d="M 320 304 L 320 332" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="336" y="324" font-size="11" fill="#b85450">解码方向</text>

  <rect x="60" y="336" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="360" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">解码：在去重序列里查 message 字母的下标</text>
  <text x="320" y="380" text-anchor="middle" font-size="11.5" fill="#b85450">message[c] 是去重序列第 i 个 → 输出 'a'+i；空格原样输出</text>

  <text x="60" y="416" font-size="11.5" fill="#555">• 建表 O(|key|)：扫描一次，遇空格/已出现即跳，新字母登记下标</text>
  <text x="60" y="432" font-size="11.5" fill="#555">• 解码 O(|message|)：逐字查表，下标即字母表偏移，无需排序无需 DP</text>
</svg>
