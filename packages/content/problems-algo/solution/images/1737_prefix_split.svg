<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    前缀和 + 边界切分：把「该改的字母数」变成查表
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    以示例 2：a = "dabadd"，b = "cda" 为例
  </text>

  <!-- ===== alphabet axis with boundary c ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="62" width="240" height="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <rect x="280" y="62" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
  </g>
  <g font-size="9" fill="#444" filter="url(#rough2)">
    <text x="50"  y="77" text-anchor="middle">a</text>
    <text x="90"  y="77" text-anchor="middle">b</text>
    <text x="130" y="77" text-anchor="middle">c</text>
    <text x="170" y="77" text-anchor="middle">d</text>
    <text x="210" y="77" text-anchor="middle">e</text>
    <text x="250" y="77" text-anchor="middle">…</text>
    <text x="310" y="77" text-anchor="middle">…</text>
    <text x="400" y="77" text-anchor="middle">x</text>
    <text x="440" y="77" text-anchor="middle">y</text>
    <text x="490" y="77" text-anchor="middle">z</text>
  </g>
  <text x="160" y="100" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">a 落在此侧（≤ c）</text>
  <text x="400" y="100" text-anchor="middle" font-size="10" fill="#b03a3a" filter="url(#rough2)">b 落在此侧（&gt; c）</text>
  <path d="M 280,52 L 280,108" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="300" y="56" font-size="10" fill="#7a5415" filter="url(#rough2)">边界 c = 'd'</text>

  <!-- ===== freq tables ===== -->
  <text x="40" y="138" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">频次表 cntA / cntB（仅列 a–e）</text>

  <g filter="url(#rough2)">
    <!-- header row letters -->
    <rect x="40" y="148" width="40" height="26" fill="#f0f0f0" stroke="#bbb" rx="2"/>
    <text x="60" y="166" text-anchor="middle" font-size="10" fill="#555">字母</text>
    <rect x="80" y="148" width="40" height="26" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="100" y="166" text-anchor="middle" font-size="10" fill="#7a5415">a</text>
    <rect x="120" y="148" width="40" height="26" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="140" y="166" text-anchor="middle" font-size="10" fill="#7a5415">b</text>
    <rect x="160" y="148" width="40" height="26" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="180" y="166" text-anchor="middle" font-size="10" fill="#7a5415">c</text>
    <rect x="200" y="148" width="40" height="26" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="220" y="166" text-anchor="middle" font-size="10" fill="#7a5415">d</text>
    <rect x="240" y="148" width="40" height="26" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="260" y="166" text-anchor="middle" font-size="10" fill="#7a5415">e</text>
    <!-- cntA row -->
    <rect x="40" y="174" width="40" height="26" fill="#e8f0fe" stroke="#446688" rx="2"/>
    <text x="60" y="192" text-anchor="middle" font-size="10" fill="#446688">cntA</text>
    <rect x="80" y="174" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="100" y="192" text-anchor="middle" font-size="10" fill="#333">2</text>
    <rect x="120" y="174" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="140" y="192" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="160" y="174" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="180" y="192" text-anchor="middle" font-size="10" fill="#333">0</text>
    <rect x="200" y="174" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="220" y="192" text-anchor="middle" font-size="10" fill="#333">3</text>
    <rect x="240" y="174" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="260" y="192" text-anchor="middle" font-size="10" fill="#333">0</text>
    <!-- cntB row -->
    <rect x="40" y="200" width="40" height="26" fill="#fce4ec" stroke="#b85450" rx="2"/>
    <text x="60" y="218" text-anchor="middle" font-size="10" fill="#b03a3a">cntB</text>
    <rect x="80" y="200" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="100" y="218" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="120" y="200" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="140" y="218" text-anchor="middle" font-size="10" fill="#333">0</text>
    <rect x="160" y="200" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="180" y="218" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="200" y="200" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="220" y="218" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="240" y="200" width="40" height="26" fill="#fff" stroke="#bbb" rx="2"/>
    <text x="260" y="218" text-anchor="middle" font-size="10" fill="#333">0</text>
  </g>

  <!-- prefix sum highlight -->
  <rect x="80" y="174" width="160" height="26" fill="none" stroke="#4a8e4a" stroke-width="1.8" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/>
  <text x="160" y="244" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">preA['d'] = 2+1+0+3 = 6（a 中 ≤ 'd' 的字母数）</text>

  <!-- ===== formula panel ===== -->
  <rect x="300" y="138" width="220" height="116" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a4a1a" filter="url(#rough2)">条件 1 代价（边界 c）</text>
  <g font-size="10" fill="#444" filter="url(#rough2)">
    <text x="312" y="180">a 中 &gt; c 的字母数</text>
    <text x="312" y="196">= len(a) − preA[c]</text>
    <text x="312" y="216">b 中 ≤ c 的字母数</text>
    <text x="312" y="232">= preB[c]</text>
  </g>
  <rect x="312" y="240" width="196" height="0" fill="none"/>

  <!-- ===== compute for c='d' ===== -->
  <rect x="40" y="262" width="480" height="50" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="282" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">取 c = 'd' 代入（条件 1）：</text>
  <text x="56" y="302" font-size="11" fill="#333" filter="url(#rough2)">ops = (6 − preA['d']) + preB['d'] = (6 − 6) + 3 = 3 ✓</text>
  <text x="320" y="292" font-size="10" fill="#888" filter="url(#rough2)">a 不动（已全 ≤ 'd'）</text>
  <text x="320" y="306" font-size="10" fill="#888" filter="url(#rough2)">b 的 c/d/a 全改成 'e'+</text>

  <!-- ===== bottom insight ===== -->
  <rect x="40" y="326" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">
    preA[c] / preB[c]：一次前缀和，O(1) 查任意边界代价
  </text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    条件 2 同理对调 a/b；条件 3 直接 (len−cntA[c])+(len−cntB[c])
  </text>
</svg>
