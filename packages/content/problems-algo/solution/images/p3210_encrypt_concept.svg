<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">加密 = 每个字符换成「往后第 k 个」字符（循环数）</text>

  <!-- 环 -->
  <circle cx="150" cy="200" r="88" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="150" y="196" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">n = 4</text>
  <text x="150" y="213" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">越界回头继续数</text>

  <!-- 节点 0 d（起点，高亮） -->
  <circle cx="150" cy="112" r="24" fill="#e8f0fe" stroke="#d6a040" stroke-width="3.5" filter="url(#rough2)"/>
  <text x="150" y="112" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">d</text>
  <text x="150" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">下标0</text>

  <!-- 节点 1 a -->
  <circle cx="238" cy="200" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="238" y="200" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="238" y="214" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">下标1</text>

  <!-- 节点 2 r -->
  <circle cx="150" cy="288" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="288" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">r</text>
  <text x="150" y="302" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">下标2</text>

  <!-- 节点 3 t（落点，高亮） -->
  <circle cx="62" cy="200" r="24" fill="#e6f4ea" stroke="#d6a040" stroke-width="3.5" filter="url(#rough2)"/>
  <text x="62" y="200" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">t</text>
  <text x="62" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">下标3</text>

  <!-- 走 k=3 步的弧线：0 → 1 → 2 → 3（顺时针 3/4 圈） -->
  <path d="M 176 108 A 96 96 0 1 1 58 174" stroke="#d6a040" stroke-width="2.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="130" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#rough2)">往后数 3 步</text>
  <text x="252" y="147" font-size="10" fill="#a06a10" filter="url(#rough2)">d→a→r→t ✓</text>

  <text x="150" y="60" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#rough2)">res[0] = t</text>
  <path d="M150,66 L150,84" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="150" y="344" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "dart"，k = 3：从 d 顺时针走 3 格正好落在 t 上</text>

  <!-- 框 A：一步取模 -->
  <rect x="315" y="52" width="190" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">不用真走 k 步！</text>
  <text x="410" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">res[i] = s[(i+k) mod n]</text>
  <text x="410" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（一步取模 = 直接瞬移到落点）</text>

  <!-- 框 B：k 先取余 -->
  <rect x="315" y="152" width="190" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">k 可达 10⁴ ≫ n ≤ 100</text>
  <text x="410" y="198" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">走 k 步 ≡ 走 k mod n 步</text>
  <text x="410" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">先 k %= n 消掉整圈</text>

  <!-- 框 C：本题彩蛋 -->
  <rect x="315" y="252" width="190" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">本题 k=3, n=4</text>
  <text x="410" y="296" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">+3 ≡ −1 (mod 4)</text>
  <text x="410" y="316" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">= 末字符挪到最前</text>
  <text x="410" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">"dart" → "tdar"</text>
</svg>
