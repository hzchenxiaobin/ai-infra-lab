<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s1="ab", s2="eidbaooo"</text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#888">m=2，need={a:1, b:1}，目标 match=2</text>

  <!-- column headers -->
  <text x="28" y="78" font-size="10.5" fill="#888">窗口</text>
  <text x="300" y="78" font-size="10.5" fill="#888">match</text>
  <text x="380" y="78" font-size="10.5" fill="#888">合法?</text>
  <text x="470" y="78" font-size="10.5" fill="#888">动作</text>

  <!-- helper: each row draws 8 cells e i d b a o o o; highlight window -->
  <!-- Row 1: i=1, window [0,1]="ei" -->
  <text x="22" y="112" font-size="10.5" fill="#888">i=1</text>
  <!-- cells: e(hi) i(hi) d b a o o o -->
  <rect x="44" y="94" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="112" text-anchor="middle" font-size="11" fill="#333">e</text>
  <rect x="74" y="94" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="112" text-anchor="middle" font-size="11" fill="#333">i</text>
  <rect x="104" y="94" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="118" y="112" text-anchor="middle" font-size="11" fill="#bbb">d</text>
  <rect x="134" y="94" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="148" y="112" text-anchor="middle" font-size="11" fill="#bbb">b</text>
  <rect x="164" y="94" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="112" text-anchor="middle" font-size="11" fill="#bbb">a</text>
  <rect x="194" y="94" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="208" y="112" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <rect x="224" y="94" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="238" y="112" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <rect x="254" y="94" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="112" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <text x="300" y="112" font-size="11" fill="#333">0</text>
  <text x="380" y="112" font-size="11" fill="#b85450">✗</text>
  <text x="470" y="112" font-size="11" fill="#888">继续</text>

  <!-- Row 2: i=2, window [1,2]="id" -->
  <text x="22" y="160" font-size="10.5" fill="#888">i=2</text>
  <rect x="44" y="142" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="160" text-anchor="middle" font-size="11" fill="#bbb">e</text>
  <rect x="74" y="142" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="160" text-anchor="middle" font-size="11" fill="#333">i</text>
  <rect x="104" y="142" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="160" text-anchor="middle" font-size="11" fill="#333">d</text>
  <rect x="134" y="142" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="148" y="160" text-anchor="middle" font-size="11" fill="#bbb">b</text>
  <rect x="164" y="142" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="160" text-anchor="middle" font-size="11" fill="#bbb">a</text>
  <rect x="194" y="142" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="208" y="160" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <rect x="224" y="142" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="238" y="160" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <rect x="254" y="142" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="160" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <text x="300" y="160" font-size="11" fill="#333">0</text>
  <text x="380" y="160" font-size="11" fill="#b85450">✗</text>
  <text x="470" y="160" font-size="11" fill="#888">继续</text>

  <!-- Row 3: i=3, window [2,3]="db" -->
  <text x="22" y="208" font-size="10.5" fill="#888">i=3</text>
  <rect x="44" y="190" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="208" text-anchor="middle" font-size="11" fill="#bbb">e</text>
  <rect x="74" y="190" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="88" y="208" text-anchor="middle" font-size="11" fill="#bbb">i</text>
  <rect x="104" y="190" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="118" y="208" text-anchor="middle" font-size="11" fill="#333">d</text>
  <rect x="134" y="190" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="208" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="164" y="190" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="208" text-anchor="middle" font-size="11" fill="#bbb">a</text>
  <rect x="194" y="190" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="208" y="208" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <rect x="224" y="190" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="238" y="208" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <rect x="254" y="190" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="208" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <text x="300" y="208" font-size="11" fill="#333">1</text>
  <text x="312" y="208" font-size="9.5" fill="#888">(b✓)</text>
  <text x="380" y="208" font-size="11" fill="#b85450">✗</text>
  <text x="470" y="208" font-size="11" fill="#888">继续</text>

  <!-- Row 4: i=4, window [3,4]="ba" -->
  <text x="22" y="256" font-size="10.5" fill="#888">i=4</text>
  <rect x="44" y="238" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="58" y="256" text-anchor="middle" font-size="11" fill="#bbb">e</text>
  <rect x="74" y="238" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="88" y="256" text-anchor="middle" font-size="11" fill="#bbb">i</text>
  <rect x="104" y="238" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="118" y="256" text-anchor="middle" font-size="11" fill="#bbb">d</text>
  <rect x="134" y="238" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="164" y="238" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="194" y="238" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="208" y="256" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <rect x="224" y="238" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="238" y="256" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <rect x="254" y="238" width="28" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="256" text-anchor="middle" font-size="11" fill="#bbb">o</text>
  <text x="300" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="312" y="256" font-size="9.5" fill="#4a7a3a">(b✓a✓)</text>
  <text x="380" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">返回 true</text>

  <!-- arrow connecting rows -->
  <path d="M 282 270 L 282 286" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- summary -->
  <rect x="60" y="300" width="440" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">第 4 个窗口即命中 "ba"，提前返回 true</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#555">无需扫描剩余 "ooo"——这是相对 438「列全部起点」的优化</text>
</svg>
