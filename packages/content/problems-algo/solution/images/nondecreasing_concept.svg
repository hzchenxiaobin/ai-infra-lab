<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：遇下降处，两种修法择优</text>

  <!-- Section 1: the violation -->
  <text x="40" y="62" font-size="12" fill="#b85450" font-weight="bold">① 发现下降：nums[i] &lt; nums[i−1]</text>

  <!-- three cells: i-2, i-1, i -->
  <rect x="50" y="76" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="100" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">i−2</text>
  <text x="78" y="128" text-anchor="middle" font-size="9.5" fill="#888">前驱的前驱</text>

  <rect x="150" y="76" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="100" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">i−1</text>
  <text x="178" y="128" text-anchor="middle" font-size="9.5" fill="#888">较高</text>

  <rect x="250" y="76" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="100" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">i</text>
  <text x="278" y="128" text-anchor="middle" font-size="9.5" fill="#b85450">较低 ★</text>

  <!-- dip arrow -->
  <path d="M 178 70 L 278 70" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="228" y="64" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">下降</text>

  <!-- divider -->
  <path d="M 40 144 L 500 144" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 2: Strategy A -->
  <text x="40" y="172" font-size="12" fill="#4a7a3a" font-weight="bold">② 修法 A（优先）：压低前驱 nums[i−1] = nums[i]</text>

  <rect x="50" y="186" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i−2</text>

  <rect x="150" y="186" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">↓压低</text>

  <rect x="250" y="186" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="208" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i</text>

  <!-- down arrow on i-1 -->
  <path d="M 178 182 L 178 168" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" transform="rotate(180 178 175)"/>

  <!-- condition box -->
  <rect x="330" y="186" width="180" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="206" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">前提：不破坏 i−2 关系</text>
  <text x="420" y="222" text-anchor="middle" font-size="10" fill="#555">i &lt; 2 或 nums[i] ≥ nums[i−2]</text>

  <!-- divider -->
  <path d="M 40 250 L 500 250" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 3: Strategy B -->
  <text x="40" y="278" font-size="12" fill="#d6a040" font-weight="bold">③ 修法 B（兜底）：抬高当前 nums[i] = nums[i−1]</text>

  <rect x="50" y="292" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="314" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i−2</text>

  <rect x="150" y="292" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="314" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i−1</text>

  <rect x="250" y="292" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="314" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">↑抬高</text>

  <!-- up arrow on i -->
  <path d="M 278 288 L 278 304" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- condition box -->
  <rect x="330" y="292" width="180" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="312" text-anchor="middle" font-size="10.5" fill="#a07820" font-weight="bold">何时用：A 的前提不成立</text>
  <text x="420" y="328" text-anchor="middle" font-size="10" fill="#555">nums[i] &lt; nums[i−2]</text>

  <!-- footer summary -->
  <rect x="40" y="356" width="460" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">选择口诀：能压低就压低，不能压低才抬高</text>
  <text x="270" y="400" text-anchor="middle" font-size="10.5" fill="#555">压低前驱 → 前缀最大值变小，后续更不易下降（局部最优）</text>
  <text x="270" y="418" text-anchor="middle" font-size="10.5" fill="#555">抬高当前 → 当前值变大，可能压住后续元素（仅作兜底）</text>
  <text x="270" y="434" text-anchor="middle" font-size="10" fill="#888">每修一次 cnt+1，cnt &gt; 1 立即返回 false</text>
</svg>
