<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">空格候选 = {1..9} − 行已用 − 列已用 − 宫已用</text>

  <!-- row 0 band (blue) -->
  <rect x="40" y="50" width="270" height="30" fill="#446688" fill-opacity="0.14" filter="url(#rough2)"/>
  <!-- col 2 band (green) -->
  <rect x="110" y="50" width="30" height="270" fill="#4a7a3a" fill-opacity="0.14" filter="url(#rough2)"/>
  <!-- box 0 (orange) -->
  <rect x="40" y="50" width="90" height="90" fill="#d6a040" fill-opacity="0.18" filter="url(#rough2)"/>

  <!-- thin grid lines -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="50" x2="70" y2="320"/>
    <line x1="100" y1="50" x2="100" y2="320"/>
    <line x1="160" y1="50" x2="160" y2="320"/>
    <line x1="190" y1="50" x2="190" y2="320"/>
    <line x1="250" y1="50" x2="250" y2="320"/>
    <line x1="280" y1="50" x2="280" y2="320"/>
    <line x1="40" y1="80" x2="310" y2="80"/>
    <line x1="40" y1="110" x2="310" y2="110"/>
    <line x1="40" y1="170" x2="310" y2="170"/>
    <line x1="40" y1="200" x2="310" y2="200"/>
    <line x1="40" y1="260" x2="310" y2="260"/>
    <line x1="40" y1="290" x2="310" y2="290"/>
  </g>
  <!-- thick box boundaries -->
  <g stroke="#888" stroke-width="2" filter="url(#rough2)">
    <rect x="40" y="50" width="270" height="270" fill="none"/>
    <line x1="130" y1="50" x2="130" y2="320"/>
    <line x1="220" y1="50" x2="220" y2="320"/>
    <line x1="40" y1="140" x2="310" y2="140"/>
    <line x1="40" y1="230" x2="310" y2="230"/>
  </g>

  <!-- board digits (example row 0/1/2 partial) -->
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="55" y="71" fill="#333">5</text>
    <text x="85" y="71" fill="#333">3</text>
    <text x="205" y="71" fill="#333">7</text>
    <text x="55" y="101" fill="#333">6</text>
    <text x="145" y="101" fill="#333">1</text>
    <text x="175" y="101" fill="#333">9</text>
    <text x="205" y="101" fill="#333">5</text>
    <text x="85" y="131" fill="#333">9</text>
    <text x="115" y="131" fill="#333">8</text>
    <text x="265" y="131" fill="#333">6</text>
  </g>

  <!-- target empty cell (0,2) red -->
  <rect x="110" y="50" width="30" height="30" fill="none" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">?</text>

  <!-- labels -->
  <text x="36" y="70" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">行0</text>
  <text x="125" y="44" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">列2</text>
  <text x="88" y="44" font-size="10" fill="#d6a040" font-weight="bold">宫0</text>

  <!-- right panel: candidate computation -->
  <rect x="350" y="56" width="200" height="252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="450" y="78" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">求 (0,2) 的候选</text>
  <line x1="366" y1="88" x2="534" y2="88" stroke="#e0c878" stroke-width="1" filter="url(#rough2)"/>

  <!-- full set -->
  <text x="366" y="108" font-size="10.5" fill="#555" font-weight="bold">全集 {1..9}：</text>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <rect x="366" y="116" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="377" y="132" fill="#333">1</text>
    <rect x="390" y="116" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="401" y="132" fill="#333">2</text>
    <rect x="414" y="116" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="425" y="132" fill="#333">3</text>
    <rect x="438" y="116" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="449" y="132" fill="#333">4</text>
    <rect x="462" y="116" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="473" y="132" fill="#333">5</text>
    <rect x="486" y="116" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="497" y="132" fill="#333">6</text>
    <rect x="510" y="116" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="521" y="132" fill="#333">7</text>
  </g>
  <text x="366" y="156" font-size="9.5" fill="#888">8、9 同理…</text>

  <line x1="366" y1="166" x2="534" y2="166" stroke="#e0c878" stroke-width="1" filter="url(#rough2)"/>

  <!-- row used -->
  <text x="366" y="184" font-size="10.5" fill="#446688" font-weight="bold">行 0 已用：{5, 3, 7}</text>
  <!-- col used -->
  <text x="366" y="204" font-size="10.5" fill="#4a7a3a" font-weight="bold">列 2 已用：{8}</text>
  <!-- box used -->
  <text x="366" y="224" font-size="10.5" fill="#d6a040" font-weight="bold">宫 0 已用：{5,3,6,9,8}</text>

  <line x1="366" y1="234" x2="534" y2="234" stroke="#e0c878" stroke-width="1" filter="url(#rough2)"/>

  <!-- candidates result -->
  <text x="366" y="252" font-size="10.5" fill="#555" font-weight="bold">候选 = 差集：</text>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <rect x="372" y="260" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="385" y="278" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="402" y="260" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="415" y="278" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="432" y="260" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="445" y="278" fill="#4a7a3a" font-weight="bold">4</text>
  </g>
  <text x="466" y="278" font-size="10" fill="#888">逐一尝试</text>

  <!-- bottom note -->
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#888">三张布尔表把「求候选」压成 O(9) 遍历——每个数字查三张表即可</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#888">回溯时依次试每个候选，冲突即剪枝</text>

  <!-- legend -->
  <rect x="60" y="390" width="12" height="12" fill="#446688" fill-opacity="0.14" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="400" font-size="9.5" fill="#555">行</text>
  <rect x="110" y="390" width="12" height="12" fill="#4a7a3a" fill-opacity="0.14" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="128" y="400" font-size="9.5" fill="#555">列</text>
  <rect x="160" y="390" width="12" height="12" fill="#d6a040" fill-opacity="0.18" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="178" y="400" font-size="9.5" fill="#555">宫</text>
  <rect x="210" y="390" width="12" height="12" fill="none" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="228" y="400" font-size="9.5" fill="#555">空格</text>
  <rect x="270" y="390" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="288" y="400" font-size="9.5" fill="#555">候选</text>
</svg>
