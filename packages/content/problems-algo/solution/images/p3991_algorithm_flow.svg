<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：编码状态 → 特判 → BFS 主循环（生成 v 即查目标）</text>

  <ellipse cx="260" cy="40" rx="55" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">开始</text>

  <path d="M 260 54 L 260 62" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="64" width="240" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">① 编码 start 与 target（排列 → 可哈希串）</text>
  <text x="396" y="76" font-size="8.5" fill="#888" filter="url(#rough2)">start == target</text>
  <text x="396" y="88" font-size="8.5" fill="#888" filter="url(#rough2)">⟹ 直接返回 0（示例 3）</text>

  <path d="M 260 92 L 260 100" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="125" y="102" width="270" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">② dist[start] = 0；start 入队；pre 去重</text>
  <text x="398" y="114" font-size="8.5" fill="#888" filter="url(#rough2)">rev 1 是自环，</text>
  <text x="398" y="126" font-size="8.5" fill="#888" filter="url(#rough2)">去重即可（留着也无害）</text>

  <path d="M 260 130 L 260 138" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,138 350,163 260,188 170,163" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="167" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">队列为空？</text>

  <path d="M 350 163 L 384 163" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="366" y="156" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="386" y="147" width="104" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="438" y="167" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <path d="M 260 188 L 260 197" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="197" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="110" y="199" width="300" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">③ u ← 队首出队</text>
  <text x="260" y="227" text-anchor="middle" font-size="9.5" fill="#55688a" filter="url(#rough2)">枚举 p ∈ pre：v ← 反转 u 的前 p 位（双指针 O(n)）</text>

  <path d="M 260 235 L 260 243" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,243 350,268 260,293 170,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">v == target ？</text>

  <path d="M 350 268 L 384 268" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="366" y="261" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="386" y="252" width="104" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="438" y="272" text-anchor="middle" font-size="11" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">返回 dist[u]+1</text>

  <path d="M 260 293 L 260 302" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="302" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="140" y="304" width="240" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">④ v 未访问 ⟹ dist[v] = dist[u] + 1，v 入队</text>

  <path d="M 140 318 L 58 318 L 58 163 L 166 163" fill="none" stroke="#778899" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="310" text-anchor="middle" font-size="9" fill="#778899" filter="url(#rough2)">继续循环</text>

  <text x="430" y="344" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">单位边权：首达即最短</text>
  <text x="430" y="356" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">队列耗尽：不可排序 → −1</text>
</svg>
