<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">镜像反射法：从 n−1 位格雷码构造 n 位格雷码</text>

  <!-- ====== n = 1 row ====== -->
  <text x="40" y="62" font-size="12" fill="#888">n=1:</text>
  <rect x="80" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="66" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="136" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="66" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- arrow down -->
  <path d="M 161 82 L 161 98" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="92" font-size="10" fill="#888">镜像 + 前缀加 2</text>

  <!-- ====== n = 2 row ====== -->
  <text x="40" y="120" font-size="12" fill="#888">n=2:</text>
  <!-- left half (original, prefix 0) -->
  <rect x="80" y="104" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="124" text-anchor="middle" font-size="12" fill="#333">00</text>
  <rect x="136" y="104" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="124" text-anchor="middle" font-size="12" fill="#333">01</text>
  <!-- mirror line -->
  <line x1="192" y1="96" x2="192" y2="142" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="192" y="94" text-anchor="middle" font-size="9" fill="#b85450">镜面</text>
  <!-- right half (reversed, prefix 1) -->
  <rect x="200" y="104" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="124" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="256" y="104" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="124" text-anchor="middle" font-size="12" fill="#333">10</text>

  <!-- labels -->
  <text x="161" y="150" text-anchor="middle" font-size="10" fill="#446688">正序（前缀 0）</text>
  <text x="248" y="150" text-anchor="middle" font-size="10" fill="#b85450">逆序 + 前缀 1</text>

  <!-- arrow down -->
  <path d="M 248 156 L 248 172" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="166" font-size="10" fill="#888">镜像 + 前缀加 4</text>

  <!-- ====== n = 3 row ====== -->
  <text x="40" y="200" font-size="12" fill="#888">n=3:</text>
  <!-- left half: 000 001 011 010 -->
  <rect x="60" y="184" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="203" text-anchor="middle" font-size="11" fill="#333">000</text>
  <rect x="110" y="184" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="203" text-anchor="middle" font-size="11" fill="#333">001</text>
  <rect x="160" y="184" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="203" text-anchor="middle" font-size="11" fill="#333">011</text>
  <rect x="210" y="184" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="203" text-anchor="middle" font-size="11" fill="#333">010</text>
  <!-- mirror line -->
  <line x1="262" y1="176" x2="262" y2="220" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="262" y="174" text-anchor="middle" font-size="9" fill="#b85450">镜面</text>
  <!-- right half: 110 111 101 100 -->
  <rect x="270" y="184" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="203" text-anchor="middle" font-size="11" fill="#333">110</text>
  <rect x="320" y="184" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="203" text-anchor="middle" font-size="11" fill="#333">111</text>
  <rect x="370" y="184" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="203" text-anchor="middle" font-size="11" fill="#333">101</text>
  <rect x="420" y="184" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="203" text-anchor="middle" font-size="11" fill="#333">100</text>

  <!-- labels -->
  <text x="161" y="230" text-anchor="middle" font-size="10" fill="#446688">n=2 原序列（前缀 0）</text>
  <text x="366" y="230" text-anchor="middle" font-size="10" fill="#b85450">n=2 逆序（前缀 1）</text>

  <!-- Insight box -->
  <rect x="40" y="250" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">三步走：① 正序拷贝前缀加 0　② 逆序拷贝前缀加 1</text>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#666">逆序保证：左半尾与右半头仅最高位不同（衔接处只翻 1 位）</text>

  <!-- transition verification -->
  <rect x="40" y="318" width="460" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a">衔接处验证：010 → 110，仅最高位 0→1，其余相同 ✓</text>
  <text x="270" y="356" text-anchor="middle" font-size="11" fill="#666">首尾也仅差 1 位：000 → 100，仅最高位不同（格雷码循环性）</text>
</svg>
