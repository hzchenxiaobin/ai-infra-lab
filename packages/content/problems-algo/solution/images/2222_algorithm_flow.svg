<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：预扫描总数 + 正向遍历贡献累加</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">O(n) 时间 / O(1) 空间</text>

  <!-- ===== Step 1: prescan ===== -->
  <rect x="40" y="56" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="76" font-size="11" fill="#446688" font-weight="bold">① 预扫描</text>
  <text x="56" y="94" font-size="10.5" fill="#333">统计 total0（'0' 总数）、total1（'1' 总数）  ——  一次遍历 O(n)</text>
  <text x="460" y="84" text-anchor="end" font-size="10" fill="#888" font-style="italic">全局计数</text>

  <path d="M 260 108 L 260 124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: init ===== -->
  <rect x="40" y="128" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="148" font-size="11" fill="#d6a040" font-weight="bold">② 初始化</text>
  <text x="56" y="164" font-size="10.5" fill="#333">pre0 = 0, pre1 = 0, ans = 0   （左侧计数 + 答案累加器）</text>

  <path d="M 260 174 L 260 190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: loop ===== -->
  <rect x="40" y="194" width="440" height="158" fill="#fafafa" stroke="#666" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="214" font-size="11" fill="#444" font-weight="bold">③ 正向遍历每个位置 j（先贡献后更新）</text>

  <!-- decision diamond -->
  <polygon points="260,224 320,252 260,280 200,252" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">s[j] == ?</text>
  <text x="260" y="264" text-anchor="middle" font-size="9.5" fill="#888">中间元素</text>

  <!-- left branch: s[j]=='1' -> 010 -->
  <path d="M 200 252 L 130 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="246" text-anchor="middle" font-size="9.5" fill="#446688">'1'</text>
  <rect x="50" y="262" width="160" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="282" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">形态 010</text>
  <text x="130" y="300" text-anchor="middle" font-size="10" fill="#333">ans += pre0</text>
  <text x="130" y="314" text-anchor="middle" font-size="10" fill="#333">     × (total0−pre0)</text>
  <text x="130" y="330" text-anchor="middle" font-size="9.5" fill="#888">左0 × 右0</text>
  <!-- update -->
  <text x="130" y="350" text-anchor="middle" font-size="9.5" fill="#4a7a3a">然后 pre1++</text>

  <!-- right branch: s[j]=='0' -> 101 -->
  <path d="M 320 252 L 390 252" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="246" text-anchor="middle" font-size="9.5" fill="#b85450">'0'</text>
  <rect x="310" y="262" width="160" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">形态 101</text>
  <text x="390" y="300" text-anchor="middle" font-size="10" fill="#333">ans += pre1</text>
  <text x="390" y="314" text-anchor="middle" font-size="10" fill="#333">     × (total1−pre1)</text>
  <text x="390" y="330" text-anchor="middle" font-size="9.5" fill="#888">左1 × 右1</text>
  <!-- update -->
  <text x="390" y="350" text-anchor="middle" font-size="9.5" fill="#4a7a3a">然后 pre0++</text>

  <!-- loop back arrow -->
  <path d="M 130 358 Q 130 372 200 372 Q 260 372 320 372 Q 390 372 390 358" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="9" fill="#888">下一个 j</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="372" width="440" height="0" fill="none"/>

  <!-- ===== Final return ===== -->
  <rect x="40" y="372" width="440" height="22" fill="none"/>
</svg>
