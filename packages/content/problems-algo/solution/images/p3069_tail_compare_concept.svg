<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：末位对决——谁家「尾巴」大，新元素进谁家</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">规则只看两个数组的最后一个元素，与数组其他部分、与长度统统无关</text>

  <!-- nums row -->
  <text x="52" y="80" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="120" y="60" width="34" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="137" y="79" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">5</text>
  <rect x="158" y="60" width="34" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="79" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">4</text>
  <rect x="196" y="60" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="213" y="79" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="234" y="60" width="34" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="79" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">8</text>
  <text x="284" y="79" font-size="10.5" fill="#b85450" filter="url(#rough2)">← 当前待分配</text>
  <text x="213" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">nums[3]（前两次操作已固定分走了 5 和 4）</text>

  <!-- comparison badge -->
  <path d="M 213 112 L 213 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="196" y="136" width="128" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">arr1 尾 5 &gt; arr2 尾 4 ?</text>

  <!-- arr1 panel -->
  <rect x="42" y="186" width="200" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="142" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">arr1（是 → 进这里）</text>
  <rect x="78" y="216" width="34" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="235" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="120" y="216" width="34" height="28" fill="#cde8d2" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="235" text-anchor="middle" font-size="13" fill="#2f5d27" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="165" y="235" font-size="10" fill="#4a7a3a" filter="url(#rough2)">← 新尾巴！</text>
  <text x="142" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">追加后 arr1 的尾元素即时更新为 3</text>

  <!-- arr2 panel -->
  <rect x="278" y="186" width="200" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="378" y="206" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">arr2（否 → 进这里）</text>
  <rect x="330" y="216" width="34" height="28" fill="#fde9c8" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="347" y="235" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="380" y="235" font-size="10" fill="#8a6d3b" filter="url(#rough2)">← 尾巴不变</text>
  <text x="378" y="266" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">这次没轮到它，原封不动</text>

  <!-- arrows from badge to panels -->
  <path d="M 214 162 L 152 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="176" y="174" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 306 162 L 368 182" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="330" y="174" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- summary box -->
  <rect x="48" y="294" width="424" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">整个分配过程的状态只有两个变量：arr1 尾 与 arr2 尾</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">元素互不相同 ⇒ 两尾必不相等，判定非黑即白，无平局分支</text>
</svg>
