<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">子序列 ≠ 子串：只含 a/b 故至多 2 次</text>

  <text x="60" y="78" font-size="13" fill="#4a7a3a" filter="url(#rough2)">原串 s =</text>
  <rect x="120" y="50" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <rect x="162" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="78" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">a</text>
  <rect x="204" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="78" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">a</text>
  <rect x="246" y="50" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="78" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <rect x="288" y="50" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="78" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>

  <text x="150" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">↑ b</text>
  <text x="213" y="112" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">↑ 全部 a</text>
  <text x="277" y="112" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">↑ 全部 b</text>

  <path d="M182,118 L182,148" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M224,118 L224,148" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="350" y="142" font-size="12" fill="#b85450" filter="url(#rough2)">第 1 次</text>

  <text x="60" y="178" font-size="13" fill="#4a7a3a" filter="url(#rough2)">删 a 后 =</text>
  <rect x="140" y="150" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="178" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <rect x="182" y="150" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="178" text-anchor="middle" font-size="18" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="224" y="150" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="178" text-anchor="middle" font-size="18" fill="#4a7a3a" filter="url(#rough2)">b</text>

  <path d="M244,194 L244,224" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="350" y="218" font-size="12" fill="#b85450" filter="url(#rough2)">第 2 次</text>

  <text x="60" y="254" font-size="13" fill="#4a7a3a" filter="url(#rough2)">删 b 后 =</text>
  <rect x="170" y="226" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="254" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">空串</text>

  <rect x="30" y="290" width="460" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">关键：子序列可不连续，同字符子序列必为回文</text>
  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">字母表只有 {a, b} → 至多 2 次必删空</text>
  <text x="260" y="354" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">若 s 本身回文 → 1 次即可</text>
</svg>
