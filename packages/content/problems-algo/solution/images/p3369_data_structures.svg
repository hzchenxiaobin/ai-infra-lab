<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：一份逻辑数组，四套「影子」结构</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">hint: Maintain separate data structures for each statistic</text>

  <!-- 逻辑数组（队列） -->
  <text x="30" y="78" font-size="10" fill="#666" filter="url(#rough2)">逻辑数组 = FIFO 队列</text>
  <rect x="28" y="84" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="104" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="88" y="84" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="148" y="84" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="208" y="84" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="30" y="132" font-size="9.5" fill="#b85450" filter="url(#rough2)">↑ 队头（remove 弹这里）</text>
  <text x="212" y="132" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">↑ 队尾（add 入这里）</text>

  <!-- 分叉箭头 -->
  <path d="M 110 140 C 100 160, 88 170, 80 182" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 180 140 C 200 160, 330 168, 400 182" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 110 140 C 90 230, 85 270, 80 292" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 180 140 C 240 240, 360 268, 412 292" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 左上：sum 累加器 -->
  <rect x="18" y="184" width="230" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="133" y="206" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sum 累加器（long long）</text>
  <text x="133" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">add: sum += x ｜ remove: sum -= x</text>
  <text x="133" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">getMean = sum / n</text>
  <rect x="88" y="258" width="90" height="16" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="133" y="271" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">getMean: O(1)</text>

  <!-- 右上：low/high 双多重集合 -->
  <rect x="272" y="184" width="230" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="387" y="206" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">有序多重集合（low | high）</text>
  <rect x="292" y="216" width="88" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="232" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">low: 2 3</text>
  <rect x="394" y="216" width="88" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="232" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">high: 4 4</text>
  <text x="387" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">getMedian = (3+4)/2 = 3</text>
  <text x="387" y="271" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">增删 O(log n)，查询 O(1)</text>

  <!-- 左下：freq 哈希 -->
  <rect x="18" y="294" width="230" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="133" y="316" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">freq 哈希表</text>
  <text x="133" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 → 2 ｜ 2 → 1 ｜ 3 → 1</text>
  <text x="133" y="360" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">add: freq[x]++ ｜ remove: freq[x]--</text>
  <text x="133" y="379" text-anchor="middle" font-size="10" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">更新 O(1)</text>

  <!-- 右下：懒删除堆 -->
  <rect x="272" y="294" width="230" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="387" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">懒删除堆（键 = (−freq, x)）</text>
  <text x="387" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">堆顶 (−2, 4)：freq 最大、同频 x 最小</text>
  <text x="387" y="360" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">查询时校验堆顶，过期即弹</text>
  <text x="387" y="379" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">getMode: 均摊 O(log n)</text>
</svg>
