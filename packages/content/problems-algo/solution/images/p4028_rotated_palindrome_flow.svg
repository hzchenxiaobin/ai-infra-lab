<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：13 趟「FFT 自卷积」流水线 + 一次 min 扫描</text>
    <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888">例：s = "abc" → P = [1, 1, 2]，ans = min(0+2, 1+1, 2+1) = 2；s = "yb" → P[1] = 3，ans = 3</text>

    <!-- ===== main pipeline ===== -->
    <rect x="40" y="58" width="360" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="60" y="78" text-anchor="start" font-size="10" fill="#33506b" font-weight="bold">① 构造 13 个 0/1 特征数组（k = 0 … 12）</text>
    <text x="60" y="96" text-anchor="start" font-size="9" fill="#33506b">a_k[i] = 1 ⟺ (s[i] − k) mod 26 ≤ 12；total += cnt_k（= Σ a_k）</text>

    <path d="M 220 116 V 130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <rect x="40" y="134" width="360" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="60" y="154" text-anchor="start" font-size="10" fill="#7a5c1a" font-weight="bold">② 逐特征自卷积：零填充到 L ≥ 2n−1（2 的幂）</text>
    <rect x="60" y="166" width="70" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="95" y="183" text-anchor="middle" font-size="8.5" fill="#7a5c1a">FFT 正变换</text>
    <path d="M 130 179 H 146" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <rect x="150" y="166" width="70" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="185" y="183" text-anchor="middle" font-size="8.5" fill="#7a5c1a">逐点平方</text>
    <path d="M 220 179 H 236" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <rect x="240" y="166" width="70" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="275" y="183" text-anchor="middle" font-size="8.5" fill="#7a5c1a">IFFT 逆变换</text>
    <path d="M 310 179 H 322" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="328" y="183" text-anchor="start" font-size="9" fill="#7a5c1a" font-weight="bold">lin[m]</text>
    <text x="60" y="212" text-anchor="start" font-size="9" fill="#7a5c1a">得线性卷积 lin[m]（m = 0 … 2n−2），13 个特征累加进 Q[m]</text>

    <path d="M 220 226 V 240" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <rect x="40" y="244" width="360" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="60" y="264" text-anchor="start" font-size="10" fill="#33506b" font-weight="bold">③ 折叠成循环卷积，13 个特征汇总</text>
    <text x="60" y="280" text-anchor="start" font-size="9" fill="#33506b">conv_k[c] = lin[c] + lin[c+n]（c ≤ n−2）；Q[c] += conv_k[c]</text>
    <text x="60" y="295" text-anchor="start" font-size="9" fill="#33506b">P[c] = total − Q[c]（c = 0 … n−1）</text>

    <path d="M 220 304 V 318" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <rect x="40" y="322" width="360" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="60" y="342" text-anchor="start" font-size="10" fill="#2f5d24" font-weight="bold">④ 枚举旋转取最小：ans = min ( r + P[(2r − 1) mod n] )</text>
    <text x="60" y="358" text-anchor="start" font-size="9" fill="#2f5d24">0 ≤ r &lt; n；返回 ans</text>

    <!-- ===== right column ===== -->
    <rect x="420" y="58" width="180" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="510" y="76" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">复杂度</text>
    <text x="432" y="94" text-anchor="start" font-size="8.5" fill="#33506b">① O(13n)：建 13 个数组</text>
    <text x="432" y="108" text-anchor="start" font-size="8.5" fill="#33506b">② 13 × O(L log L)：主体</text>
    <text x="432" y="122" text-anchor="start" font-size="8.5" fill="#33506b">③④ O(n)：折叠 + min</text>
    <text x="432" y="142" text-anchor="start" font-size="10" fill="#446688" font-weight="bold">总计 O(13·n log n)</text>
    <text x="432" y="160" text-anchor="start" font-size="8.5" fill="#33506b">L &lt; 4n；n = 10⁵ ⇒ L = 2¹⁸</text>

    <rect x="420" y="186" width="180" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="510" y="204" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold">实现要点</text>
    <text x="432" y="222" text-anchor="start" font-size="8.5" fill="#7a5c1a">· NTT 模 998244353：系数</text>
    <text x="436" y="234" text-anchor="start" font-size="8.5" fill="#7a5c1a">≤ n &lt; 模数，精确无舍入</text>
    <text x="432" y="250" text-anchor="start" font-size="8.5" fill="#7a5c1a">· double FFT 亦可：0/1 数组</text>
    <text x="436" y="262" text-anchor="start" font-size="8.5" fill="#7a5c1a">误差 ~ 10⁻⁹，四舍五入无忧</text>
    <text x="432" y="278" text-anchor="start" font-size="8.5" fill="#7a5c1a">· Python 用 numpy.fft 同理</text>
    <text x="432" y="294" text-anchor="start" font-size="8.5" fill="#7a5c1a">· 偶数 n：c 只取奇数，r 与</text>
    <text x="436" y="306" text-anchor="start" font-size="8.5" fill="#7a5c1a">r+n/2 同 c，min 自动处理</text>

    <rect x="420" y="326" width="180" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="510" y="344" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">正确性验证</text>
    <text x="432" y="362" text-anchor="start" font-size="8.5" fill="#2f5d24">· "abc" → 2、"yb" → 3</text>
    <text x="436" y="374" text-anchor="start" font-size="8.5" fill="#2f5d24">与 Part I 示例一致</text>
    <text x="432" y="392" text-anchor="start" font-size="8.5" fill="#2f5d24">· 与 O(n²) 暴力随机对拍</text>
    <text x="436" y="404" text-anchor="start" font-size="8.5" fill="#2f5d24">（数百组、n ≤ 2000 全过）</text>
    <text x="432" y="422" text-anchor="start" font-size="8.5" fill="#2f5d24">· n = 10⁵ 大串实测 0.45s</text>

    <!-- ===== bottom takeaway ===== -->
    <rect x="40" y="384" width="360" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <text x="220" y="404" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">镜像对归属由 p+q ≡ 2r−1 (mod n) 刻画</text>
    <text x="220" y="420" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">⇒ 代价拆成 13 个「半圈特征」的循环自卷积 ⇒ FFT 一批算完</text>
  </g>
</svg>
