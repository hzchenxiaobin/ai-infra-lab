<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：逐人两次二分</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">flowers=[[1,6],[3,7],[9,12],[4,13]], people=[2,3,7,11]</text>

  <!-- ===== Sorted arrays (shown once) ===== -->
  <text x="70" y="74" font-size="11" fill="#4a7a3a" font-weight="bold">starts =</text>
  <rect x="140" y="58" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="178" y="58" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="216" y="58" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="254" y="58" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <text x="320" y="74" font-size="11" fill="#d6a040" font-weight="bold">ends =</text>
  <rect x="380" y="58" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="418" y="58" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="456" y="58" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="473" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <rect x="494" y="58" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="511" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">13</text>

  <!-- ===== Table ===== -->
  <!-- column x ranges: t 40-150 | a 150-300 | b 300-440 | ans 440-530 -->
  <!-- header -->
  <rect x="40" y="100" width="490" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="119" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">人 t</text>
  <text x="225" y="119" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">a = #start ≤ t</text>
  <text x="370" y="119" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">b = #end &lt; t</text>
  <text x="485" y="119" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">ans = a−b</text>

  <!-- row 1 t=2 -->
  <rect x="40" y="128" width="490" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="225" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a">1</text>
  <text x="370" y="148" text-anchor="middle" font-size="12" fill="#d6a040">0</text>
  <text x="485" y="148" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">1</text>

  <!-- row 2 t=3 -->
  <rect x="40" y="158" width="490" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="225" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a">2</text>
  <text x="370" y="178" text-anchor="middle" font-size="12" fill="#d6a040">0</text>
  <text x="485" y="178" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- row 3 t=7 (highlighted) -->
  <rect x="40" y="188" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <text x="225" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="370" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="485" y="208" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- row 4 t=11 -->
  <rect x="40" y="218" width="490" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">11</text>
  <text x="225" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a">4</text>
  <text x="370" y="238" text-anchor="middle" font-size="12" fill="#d6a040">2</text>
  <text x="485" y="238" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== Detailed callout for t=7 ===== -->
  <rect x="40" y="262" width="490" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="282" font-size="11" fill="#333" font-weight="bold">t=7 详解：</text>
  <text x="60" y="300" font-size="10.5" fill="#4a7a3a">starts 中 ≤7 的元素：1, 3, 4 → 共 3 个（bisect_right 定位首个 &gt;7 的下标 = 3）</text>
  <text x="60" y="316" font-size="10.5" fill="#d6a040">ends 中 &lt;7 的元素：6 → 共 1 个（bisect_left 定位首个 ≥7 的下标 = 1，end=7 算未结束）</text>
  <text x="60" y="332" font-size="10.5" fill="#b85450" font-weight="bold">盛开 = 3 − 1 = 2（花1、花3 正在开，花0 已谢，花2 未开）</text>

  <!-- Footer -->
  <text x="285" y="352" text-anchor="middle" font-size="9.5" fill="#888">输出 answer = [1, 2, 2, 2] ✓ | 注意 end=t 算「未结束」，故用 bisect_left 数 &lt;t</text>
</svg>
