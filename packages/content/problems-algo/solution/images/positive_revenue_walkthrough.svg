<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：7 行 → 两阶段过滤 → 输出 {1, 4}</text>

  <!-- ===== Stage 1: original 7 rows ===== -->
  <text x="110" y="52" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">阶段 0：原始 Customers（7 行）</text>
  <rect x="20" y="58" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="40" y="73" font-size="8" fill="#446688" font-weight="bold">cust_id</text>
  <text x="110" y="73" font-size="8" fill="#446688" font-weight="bold">year</text>
  <text x="175" y="73" font-size="8" fill="#446688" font-weight="bold">revenue</text>
  <line x1="75" y1="58" x2="75" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="145" y1="58" x2="145" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- 7 rows compact -->
  <rect x="20" y="80" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="92" font-size="8" fill="#888">1</text><text x="110" y="92" font-size="8" fill="#888">2018</text><text x="175" y="92" font-size="8" fill="#888">50</text>
  <line x1="75" y1="80" x2="75" y2="96" stroke="#888" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="145" y1="80" x2="145" y2="96" stroke="#888" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="20" y="96" width="220" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="40" y="108" font-size="8" fill="#333">1</text><text x="110" y="108" font-size="8" fill="#4a7a3a" font-weight="bold">2021</text><text x="175" y="108" font-size="8" fill="#4a7a3a" font-weight="bold">30</text>
  <line x1="75" y1="96" x2="75" y2="112" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="96" x2="145" y2="112" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="20" y="112" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="124" font-size="8" fill="#888">1</text><text x="110" y="124" font-size="8" fill="#888">2020</text><text x="175" y="124" font-size="8" fill="#888">70</text>
  <line x1="75" y1="112" x2="75" y2="128" stroke="#888" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="145" y1="112" x2="145" y2="128" stroke="#888" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="20" y="128" width="220" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="40" y="140" font-size="8" fill="#b85450">2</text><text x="110" y="140" font-size="8" fill="#4a7a3a" font-weight="bold">2021</text><text x="175" y="140" font-size="8" fill="#b85450" font-weight="bold">-50</text>
  <line x1="75" y1="128" x2="75" y2="144" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="128" x2="145" y2="144" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="20" y="144" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="156" font-size="8" fill="#888">3</text><text x="110" y="156" font-size="8" fill="#888">2018</text><text x="175" y="156" font-size="8" fill="#888">10</text>
  <line x1="75" y1="144" x2="75" y2="160" stroke="#888" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="145" y1="144" x2="145" y2="160" stroke="#888" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="20" y="160" width="220" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="172" font-size="8" fill="#888">3</text><text x="110" y="172" font-size="8" fill="#888">2016</text><text x="175" y="172" font-size="8" fill="#888">50</text>
  <line x1="75" y1="160" x2="75" y2="176" stroke="#888" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="145" y1="160" x2="145" y2="176" stroke="#888" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="20" y="176" width="220" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="40" y="188" font-size="8" fill="#333">4</text><text x="110" y="188" font-size="8" fill="#4a7a3a" font-weight="bold">2021</text><text x="175" y="188" font-size="8" fill="#4a7a3a" font-weight="bold">20</text>
  <line x1="75" y1="176" x2="75" y2="192" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="145" y1="176" x2="145" y2="192" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- arrow to stage 1 -->
  <path d="M130 200 L130 220" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="214" font-size="8" fill="#4a7a3a" font-weight="bold">year=2021</text>

  <!-- ===== Stage 1: 3 rows after year filter ===== -->
  <text x="110" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">阶段 ①：year = 2021（剩 3 行）</text>
  <rect x="20" y="240" width="220" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="40" y="253" font-size="8" fill="#4a7a3a" font-weight="bold">cust_id</text>
  <text x="110" y="253" font-size="8" fill="#4a7a3a" font-weight="bold">year</text>
  <text x="175" y="253" font-size="8" fill="#4a7a3a" font-weight="bold">revenue</text>
  <line x1="75" y1="240" x2="75" y2="260" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="145" y1="240" x2="145" y2="260" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="20" y="260" width="220" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="272" font-size="8" fill="#333">1</text><text x="110" y="272" font-size="8" fill="#4a7a3a">2021</text><text x="175" y="272" font-size="8" fill="#4a7a3a">30</text>
  <line x1="75" y1="260" x2="75" y2="278" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="145" y1="260" x2="145" y2="278" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="20" y="278" width="220" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="290" font-size="8" fill="#b85450">2</text><text x="110" y="290" font-size="8" fill="#4a7a3a">2021</text><text x="175" y="290" font-size="8" fill="#b85450">-50</text>
  <line x1="75" y1="278" x2="75" y2="296" stroke="#b85450" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="145" y1="278" x2="145" y2="296" stroke="#b85450" stroke-width="0.4" filter="url(#rough2)"/>

  <rect x="20" y="296" width="220" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="308" font-size="8" fill="#333">4</text><text x="110" y="308" font-size="8" fill="#4a7a3a">2021</text><text x="175" y="308" font-size="8" fill="#4a7a3a">20</text>
  <line x1="75" y1="296" x2="75" y2="314" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="145" y1="296" x2="145" y2="314" stroke="#4a7a3a" stroke-width="0.4" filter="url(#rough2)"/>

  <!-- arrow to stage 2 -->
  <path d="M130 318 L130 338" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="332" font-size="8" fill="#d6a040" font-weight="bold">revenue&gt;0</text>

  <!-- ===== Stage 2: result ===== -->
  <rect x="20" y="342" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="360" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">阶段 ②：revenue &gt; 0（剩 2 行）</text>
  <text x="130" y="378" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">customer_id = {1, 4}</text>

  <!-- ===== Right: per-row verdict table ===== -->
  <rect x="270" y="58" width="270" height="328" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">逐行判定明细</text>
  <line x1="285" y1="84" x2="540" y2="84" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="285" y="100" font-size="8" fill="#888" font-weight="bold">行</text>
  <text x="315" y="100" font-size="8" fill="#888" font-weight="bold">cust</text>
  <text x="350" y="100" font-size="8" fill="#888" font-weight="bold">year</text>
  <text x="390" y="100" font-size="8" fill="#888" font-weight="bold">rev</text>
  <text x="430" y="100" font-size="8" fill="#888" font-weight="bold">year=2021?</text>
  <text x="500" y="100" font-size="8" fill="#888" font-weight="bold">结论</text>

  <text x="285" y="118" font-size="8" fill="#888">1</text><text x="315" y="118" font-size="8" fill="#888">1</text><text x="350" y="118" font-size="8" fill="#888">2018</text><text x="390" y="118" font-size="8" fill="#888">50</text><text x="430" y="118" font-size="8" fill="#b85450">✗</text><text x="500" y="118" font-size="8" fill="#888">排除</text>
  <text x="285" y="134" font-size="8" fill="#4a7a3a">2</text><text x="315" y="134" font-size="8" fill="#4a7a3a">1</text><text x="350" y="134" font-size="8" fill="#4a7a3a">2021</text><text x="390" y="134" font-size="8" fill="#4a7a3a">30</text><text x="430" y="134" font-size="8" fill="#4a7a3a">✓</text><text x="500" y="134" font-size="8" fill="#4a7a3a" font-weight="bold">保留→1</text>
  <text x="285" y="150" font-size="8" fill="#888">3</text><text x="315" y="150" font-size="8" fill="#888">1</text><text x="350" y="150" font-size="8" fill="#888">2020</text><text x="390" y="150" font-size="8" fill="#888">70</text><text x="430" y="150" font-size="8" fill="#b85450">✗</text><text x="500" y="150" font-size="8" fill="#888">排除</text>
  <text x="285" y="166" font-size="8" fill="#b85450">4</text><text x="315" y="166" font-size="8" fill="#b85450">2</text><text x="350" y="166" font-size="8" fill="#4a7a3a">2021</text><text x="390" y="166" font-size="8" fill="#b85450">-50</text><text x="430" y="166" font-size="8" fill="#4a7a3a">✓</text><text x="500" y="166" font-size="8" fill="#b85450" font-weight="bold">排除(负)</text>
  <text x="285" y="182" font-size="8" fill="#888">5</text><text x="315" y="182" font-size="8" fill="#888">3</text><text x="350" y="182" font-size="8" fill="#888">2018</text><text x="390" y="182" font-size="8" fill="#888">10</text><text x="430" y="182" font-size="8" fill="#b85450">✗</text><text x="500" y="182" font-size="8" fill="#888">排除</text>
  <text x="285" y="198" font-size="8" fill="#888">6</text><text x="315" y="198" font-size="8" fill="#888">3</text><text x="350" y="198" font-size="8" fill="#888">2016</text><text x="390" y="198" font-size="8" fill="#888">50</text><text x="430" y="198" font-size="8" fill="#b85450">✗</text><text x="500" y="198" font-size="8" fill="#888">排除</text>
  <text x="285" y="214" font-size="8" fill="#4a7a3a">7</text><text x="315" y="214" font-size="8" fill="#4a7a3a">4</text><text x="350" y="214" font-size="8" fill="#4a7a3a">2021</text><text x="390" y="214" font-size="8" fill="#4a7a3a">20</text><text x="430" y="214" font-size="8" fill="#4a7a3a">✓</text><text x="500" y="214" font-size="8" fill="#4a7a3a" font-weight="bold">保留→4</text>

  <line x1="285" y1="224" x2="540" y2="224" stroke="#d6a040" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="285" y="244" font-size="9" fill="#d6a040" font-weight="bold">关键观察：</text>
  <text x="285" y="262" font-size="8.5" fill="#333">• 客户 1 有 3 行（3 个年份），只有</text>
  <text x="285" y="276" font-size="8.5" fill="#333">  2021 那行参与判定 → revenue=30&gt;0 ✓</text>
  <text x="285" y="294" font-size="8.5" fill="#333">• 客户 3 完全没有 2021 记录，</text>
  <text x="285" y="308" font-size="8.5" fill="#333">  无需额外处理 → 自然不在结果中</text>
  <text x="285" y="326" font-size="8.5" fill="#333">• 客户 2 的 2021 收入为 -50（负），</text>
  <text x="285" y="340" font-size="8.5" fill="#333">  不满足 &gt;0 → 排除</text>
  <text x="285" y="358" font-size="8.5" fill="#b85450">⚠ revenue = 0 也不算「正收入」，</text>
  <text x="285" y="372" font-size="8.5" fill="#b85450">  必须严格 &gt; 0</text>

  <!-- bottom note -->
  <rect x="20" y="396" width="520" height="32" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="9" fill="#888">7 行 → year=2021 过滤剩 3 行 → revenue&gt;0 过滤剩 2 行 → 投影得 customer_id = {1, 4}</text>
</svg>
