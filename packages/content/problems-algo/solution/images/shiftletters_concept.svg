<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：后缀和——位置 i 的总移位 = Σ shifts[j], j ≥ i</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">shifts[i] 作用于前 i+1 个字母 → 位置 k 被所有 shifts[j] (j ≥ k) 覆盖</text>

  <!-- Column headers: position index + char. Grid origin x0=176, y0=120, cell 78x48 -->
  <text x="215" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">位置 0 (a)</text>
  <text x="293" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">位置 1 (b)</text>
  <text x="371" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">位置 2 (c)</text>

  <!-- Row labels (shifts[j]) -->
  <text x="168" y="150" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">shifts[0]=3</text>
  <text x="168" y="198" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">shifts[1]=5</text>
  <text x="168" y="246" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">shifts[2]=9</text>

  <!-- Row j=0: covers only pos 0 -->
  <rect x="176" y="124" width="78" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="154" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
  <rect x="254" y="124" width="78" height="48" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="293" y="154" text-anchor="middle" font-size="13" fill="#ddd">·</text>
  <rect x="332" y="124" width="78" height="48" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="371" y="154" text-anchor="middle" font-size="13" fill="#ddd">·</text>

  <!-- Row j=1: covers pos 0,1 -->
  <rect x="176" y="172" width="78" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="202" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>
  <rect x="254" y="172" width="78" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="293" y="202" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>
  <rect x="332" y="172" width="78" height="48" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="371" y="202" text-anchor="middle" font-size="13" fill="#ddd">·</text>

  <!-- Row j=2: covers pos 0,1,2 -->
  <rect x="176" y="220" width="78" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="250" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">9</text>
  <rect x="254" y="220" width="78" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="293" y="250" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">9</text>
  <rect x="332" y="220" width="78" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="250" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">9</text>

  <!-- Down arrow indicating column sum -->
  <path d="M 215 274 L 215 296" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 293 274 L 293 296" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 371 274 L 371 296" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="288" font-size="10" fill="#888">↓ 各列求和</text>

  <!-- Suffix sum row -->
  <rect x="176" y="300" width="78" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="215" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">后缀和</text>
  <text x="215" y="335" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">17</text>
  <rect x="254" y="300" width="78" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="293" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">后缀和</text>
  <text x="293" y="335" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">14</text>
  <rect x="332" y="300" width="78" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="371" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">后缀和</text>
  <text x="371" y="335" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">9</text>

  <!-- Result chars -->
  <text x="215" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a→r</text>
  <text x="293" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">b→p</text>
  <text x="371" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">c→l</text>

  <!-- Insight box on right -->
  <rect x="430" y="120" width="120" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">覆盖关系</text>
  <text x="490" y="170" text-anchor="middle" font-size="10" fill="#555">shifts[i] 覆盖</text>
  <text x="490" y="184" text-anchor="middle" font-size="10" fill="#555">前缀 [0 .. i]</text>
  <text x="490" y="212" text-anchor="middle" font-size="10" fill="#555">→ 位置 k 被</text>
  <text x="490" y="226" text-anchor="middle" font-size="10" fill="#555">所有 j ≥ k 覆盖</text>
  <text x="490" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">total[k] =</text>
  <text x="490" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Σ shifts[j]</text>
  <text x="490" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(j = k..n−1)</text>
  <text x="490" y="312" text-anchor="middle" font-size="9" fill="#888">= 后缀和</text>
</svg>
