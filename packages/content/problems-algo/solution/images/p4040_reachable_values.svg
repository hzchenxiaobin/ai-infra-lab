<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    单个元素 x = 10 的全部可达值（sum = 13）
  </text>

  <!-- 减半链（向左） -->
  <rect x="42" y="96" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="121" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="66" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 次</text>

  <rect x="122" y="96" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="121" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="146" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2 次</text>

  <rect x="202" y="96" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="121" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="226" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 次</text>

  <!-- 原值 -->
  <rect x="276" y="92" width="56" height="44" fill="#e8f0fe" stroke="#446688"
        stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="120" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">10</text>
  <text x="304" y="152" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0 次</text>

  <!-- 翻倍链（向右，越界截断） -->
  <rect x="360" y="96" width="52" height="38" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="386" y="121" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">20</text>
  <text x="386" y="152" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">&gt; sum ✗</text>

  <!-- 箭头 -->
  <path d="M 272 115 L 258 115" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">÷2</text>
  <path d="M 192 115 L 178 115" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">÷2</text>
  <path d="M 112 115 L 98 115" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">÷2</text>
  <path d="M 340 115 L 352 115" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="347" y="88" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">×2</text>

  <text x="120" y="180" font-size="12" fill="#4a7a3a" filter="url(#rough2)">← 减半链：一路 ÷2</text>
  <text x="330" y="180" font-size="12" fill="#b85450" filter="url(#rough2)">翻倍链：一路 ×2 →</text>

  <!-- 说明框 1 -->
  <rect x="40" y="204" width="440" height="58" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="227" font-size="12.5" fill="#333" filter="url(#rough2)">
    「先乘 a 次再除 b 次」是绕路：
  </text>
  <text x="56" y="248" font-size="12.5" fill="#333" filter="url(#rough2)">
    a ≥ b 时结果 = x·2^(a−b)（纯乘 a−b 次）；a &lt; b 时 = ⌊x/2^(b−a)⌋（纯除 b−a 次）
  </text>

  <!-- 说明框 2 -->
  <rect x="40" y="280" width="440" height="58" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="303" font-size="12.5" fill="#333" filter="url(#rough2)">
    所以选项表只有两条链：翻倍链（值 ≤ sum）∪ 减半链（值 ≥ 1）
  </text>
  <text x="56" y="324" font-size="12.5" fill="#333" filter="url(#rough2)">
    每个元素只有 O(log sum + log x) 个 (值, 代价) 选项 → 直接上分组背包！
  </text>
</svg>
