<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">shortestPath(s, t) 流程：堆优化 Dijkstra</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">边权非负 → 弹出的最小 dist 节点已确定，可提前返回</text>

  <!-- start -->
  <ellipse cx="280" cy="74" rx="54" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx2="8" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">调用 shortestPath(s, t)</text>

  <path d="M 280 96 L 280 118" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="188" y="122" width="184" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">初始化</text>
  <text x="280" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">dist=∞, dist[s]=0; 堆=[(0,s)]</text>
  <text x="280" y="168" text-anchor="middle" font-size="9" fill="#666">懒删除：旧记录弹出即丢</text>

  <path d="M 280 174 L 280 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: heap empty? -->
  <polygon points="280,200 376,248 280,296 184,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">堆空？</text>
  <text x="280" y="260" text-anchor="middle" font-size="9" fill="#888">或弹出 d&gt;dist[u]</text>

  <!-- yes -> -1 -->
  <path d="M 184 248 L 96 248" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="22" y="232" width="74" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="59" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return -1</text>

  <!-- no -->
  <path d="M 280 296 L 280 318" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="312" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- diamond: u == t? -->
  <polygon points="280,322 372,366 280,410 188,366" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">u == t？</text>
  <text x="280" y="378" text-anchor="middle" font-size="9" fill="#888">终点已确定</text>

  <!-- yes -> dist[t] -->
  <path d="M 372 366 L 456 366" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="358" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="456" y="350" width="86" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="499" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return dist[t]</text>

  <!-- no -> relax -->
  <path d="M 188 366 L 96 366" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="358" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">否</text>
  <rect x="22" y="350" width="74" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="59" y="366" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">松弛出边</text>
  <text x="59" y="378" text-anchor="middle" font-size="9" fill="#666">u→v 更优则入堆</text>

  <!-- loop back -->
  <path d="M 59 350 L 59 248 L 184 248" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#888">堆空仍没到 t → 不可达 → -1</text>
</svg>
