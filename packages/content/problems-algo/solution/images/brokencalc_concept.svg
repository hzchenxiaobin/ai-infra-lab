<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="520" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">坏了的计算器：正向分支 vs 反向确定</text>
  <path d="M 250 42 Q 430 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left half: forward branching ===== -->
  <text x="210" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">正向：X → Y（分支爆炸）</text>

  <!-- X node -->
  <g filter="url(#sk2)">
    <ellipse cx="210" cy="120" rx="32" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="210" y="125" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">X</text>

  <!-- two branches -->
  <path d="M 185 135 Q 140 165 120 195" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 235 135 Q 280 165 300 195" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="118" y="158" text-anchor="middle" font-size="10" fill="#b03a3a">×2</text>
  <text x="302" y="158" text-anchor="middle" font-size="10" fill="#b03a3a">−1</text>

  <!-- level 1 nodes -->
  <g filter="url(#sk2)">
    <ellipse cx="110" cy="215" rx="30" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="110" y="220" text-anchor="middle" font-size="11" fill="#b03a3a">2X</text>
  <g filter="url(#sk2)">
    <ellipse cx="310" cy="215" rx="30" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="310" y="220" text-anchor="middle" font-size="11" fill="#b03a3a">X−1</text>

  <!-- four branches -->
  <path d="M 90 232 Q 70 255 60 275" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 130 232 Q 150 255 160 275" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 290 232 Q 270 255 260 275" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 330 232 Q 350 255 360 275" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk2)">
    <ellipse cx="55" cy="292" rx="26" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="55" y="296" text-anchor="middle" font-size="10" fill="#b03a3a">4X</text>
  <g filter="url(#sk2)">
    <ellipse cx="165" cy="292" rx="26" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="165" y="296" text-anchor="middle" font-size="10" fill="#b03a3a">2X−1</text>
  <g filter="url(#sk2)">
    <ellipse cx="260" cy="292" rx="26" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="260" y="296" text-anchor="middle" font-size="10" fill="#b03a3a">2X−2</text>
  <g filter="url(#sk2)">
    <ellipse cx="365" cy="292" rx="26" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="365" y="296" text-anchor="middle" font-size="10" fill="#b03a3a">X−2</text>

  <!-- dots -->
  <text x="210" y="340" text-anchor="middle" font-size="20" fill="#b03a3a">⋮</text>
  <text x="210" y="372" text-anchor="middle" font-size="11" fill="#888">每步 2 分支 → 2^k 种状态</text>
  <text x="210" y="390" text-anchor="middle" font-size="10" fill="#888">X,Y ≤ 10⁹ → BFS 不可行</text>

  <!-- divider -->
  <path d="M 430 90 L 430 400" stroke="#ccc" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#sk)"/>

  <!-- ===== Right half: backward deterministic ===== -->
  <text x="620" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a8edb">反向：Y → X（每步唯一）</text>

  <!-- Y node -->
  <g filter="url(#sk2)">
    <ellipse cx="620" cy="120" rx="32" ry="20" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="620" y="125" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">Y</text>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <path d="M 620 150 L 660 180 L 620 210 L 580 180 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="620" y="178" text-anchor="middle" font-size="10" fill="#7a5415">Y 偶?</text>
  <text x="620" y="192" text-anchor="middle" font-size="10" fill="#7a5415">&amp; Y&gt;X?</text>
  <path d="M 620 140 L 620 148" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>

  <!-- yes branch: /2 -->
  <path d="M 580 180 Q 540 195 520 215" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="535" y="190" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">÷2</text>

  <!-- no branch: +1 -->
  <path d="M 660 180 Q 700 195 720 215" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="705" y="190" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">+1</text>

  <!-- yes path node -->
  <g filter="url(#sk2)">
    <rect x="475" y="225" width="90" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="520" y="245" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Y ÷ 2</text>

  <!-- no path node -->
  <g filter="url(#sk2)">
    <rect x="675" y="225" width="90" height="30" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="720" y="245" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">Y + 1</text>

  <!-- both loop back to decision -->
  <path d="M 520 255 Q 520 175 580 180" stroke="#4a8e4a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 720 255 Q 720 175 660 180" stroke="#c98a2b" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="620" y="300" text-anchor="middle" font-size="10" fill="#888">不断缩小 Y，直到 Y ≤ X</text>

  <!-- Y <= X terminal -->
  <path d="M 620 210 Q 620 320 620 340" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="640" y="278" font-size="10" fill="#888">Y ≤ X 时退出</text>
  <g filter="url(#sk2)">
    <rect x="545" y="350" width="150" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="620" y="372" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">答案 += (X − Y)</text>

  <!-- footer -->
  <g filter="url(#sk)">
    <rect x="60" y="420" width="740" height="68" rx="8" fill="#f4f4f4" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="448" text-anchor="middle" font-size="12" fill="#555">核心洞察：正向操作可逆，但反向时<tspan font-weight="bold" fill="#2b6e9e">每步选择唯一</tspan></text>
  <text x="430" y="470" text-anchor="middle" font-size="11" fill="#888">Y 偶 → 只能 ÷2（最优）；Y 奇 → 只能 +1（凑偶再 ÷2）；Y ≤ X → 只剩 +1 补差</text>
</svg>
