<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="436" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">四类点对：每一类都能整段计数</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">按「在不在环内 × 同侧还是异侧」切分，互斥且完备</text>

  <!-- 面板 ① -->
  <rect x="10" y="58" width="246" height="176" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="133" y="80" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">① 同侧尾巴（左左 / 右右）</text>
  <rect x="60" y="96" width="32" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="140" y="96" width="32" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <text x="156" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j</text>
  <path d="M 96 109 L 136 109" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="133" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = j − i（弦帮不上忙）</text>
  <text x="133" y="163" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">m 个点的链：距离 k 有 max(m−k, 0) 对</text>
  <text x="133" y="181" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 对 k = 1..m−1 逐点打标，O(m)</text>

  <!-- 面板 ② -->
  <rect x="264" y="58" width="246" height="176" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="387" y="80" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">② 环内 × 环内</text>
  <circle cx="387" cy="109" r="21" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 387 88 A 21 21 0 0 1 387 130" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 387 88 A 21 21 0 0 0 387 130" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="387" cy="88" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="387" cy="130" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="408" y="112" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">s</text>
  <text x="366" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">L−s</text>
  <text x="387" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = min(s, L−s)，s = j − i</text>
  <text x="387" y="163" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">环距 t &lt; L/2 → 恰 L 对</text>
  <text x="387" y="181" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">L 偶且 t = L/2 → L/2 对（对跖点）</text>
  <text x="387" y="199" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 按 t 逐点打标，O(L)</text>

  <!-- 面板 ③ -->
  <rect x="10" y="244" width="246" height="176" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="133" y="266" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">③ 尾巴 ↔ 环（以左尾为例）</text>
  <rect x="46" y="282" width="28" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="282" width="28" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="174" cy="294" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <text x="114" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x</text>
  <text x="174" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j</text>
  <path d="M 76 294 L 96 294" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 130 294 L 158 294" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="133" y="326" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">a = x−i 步进环，再走环距 c(j)</text>
  <text x="133" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = a + c(j)，c(j) = 环距(j, x)</text>
  <text x="133" y="364" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c 帐篷形：0→1 个，1..h→2 个</text>
  <text x="133" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">L 偶时最远的 L/2 → 1 个</text>
  <text x="133" y="400" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">固定 t：区间 [t+1, t+m1] 整段加 cnt(t)</text>
  <text x="133" y="415" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">右尾对称（换成 y 与 m2）</text>

  <!-- 面板 ④ -->
  <rect x="264" y="244" width="246" height="176" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="387" y="266" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">④ 左尾 ↔ 右尾</text>
  <rect x="316" y="282" width="26" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="366" y="282" width="26" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="426" y="282" width="26" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="476" y="282" width="26" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="329" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <text x="379" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x</text>
  <text x="439" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y</text>
  <text x="489" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j</text>
  <path d="M 342 294 L 362 294" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 452 294 L 472 294" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 379 280 Q 409 258 439 280" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="409" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">弦</text>
  <text x="387" y="326" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">必经割点 x 与 y，环内 x→y 走弦</text>
  <text x="387" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = a + 1 + b（a、b 为两侧尾深）</text>
  <text x="387" y="364" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">固定 a：b 取遍 [1, m2]</text>
  <text x="387" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 距离区间 [a+2, a+m2+1] 各 1 对</text>
  <text x="387" y="400" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 区间整段加 1，共 O(m1) 个区间</text>
</svg>
