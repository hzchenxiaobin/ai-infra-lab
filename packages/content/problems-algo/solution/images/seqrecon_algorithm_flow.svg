<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：拓扑排序 + 唯一性校验</text>

  <!-- ===== Main flow boxes (center-left, cx=180) ===== -->
  <!-- ① 建图 -->
  <rect x="80" y="48" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190" y="72" text-anchor="middle" font-size="12" fill="#333">① 建图：相邻对 (a,b)→边 a→b（去重），校验值域</text>

  <!-- arrow -->
  <path d="M 190 86 L 190 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 入度/入队 -->
  <rect x="80" y="104" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190" y="128" text-anchor="middle" font-size="12" fill="#333">② 算入度，indeg=0 的节点入队</text>

  <!-- arrow to diamond1 -->
  <path d="M 190 142 L 190 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond1: 队列空? center (190, 184) -->
  <polygon points="135,184 190,160 245,184 190,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="188" text-anchor="middle" font-size="12" fill="#333">队列空?</text>

  <!-- diamond1 Yes -> right (i==n?) -->
  <path d="M 245 184 L 358 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="360" y="166" width="160" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="184" text-anchor="middle" font-size="11" fill="#333">i == n ?</text>
  <text x="440" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true : false</text>

  <!-- diamond1 No -> down -->
  <path d="M 190 208 L 190 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="218" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- diamond2: size==1? center (190, 248) -->
  <polygon points="125,248 190,222 255,248 190,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="252" text-anchor="middle" font-size="12" fill="#333">队列 size==1?</text>

  <!-- diamond2 No -> right (return false 不唯一) -->
  <path d="M 255 248 L 358 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="360" y="230" width="160" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="254" text-anchor="middle" font-size="11" fill="#333">return false</text>
  <text x="440" y="266" text-anchor="middle" font-size="10" fill="#888">(拓扑序不唯一)</text>

  <!-- diamond2 Yes -> down -->
  <path d="M 190 274 L 190 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="284" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- box3: 弹出 u -->
  <rect x="110" y="290" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190" y="311" text-anchor="middle" font-size="12" fill="#333">③ 弹出 u</text>

  <!-- arrow to diamond3 -->
  <path d="M 190 322 L 190 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond3: u==org[i]? center (190, 362) -->
  <polygon points="125,362 190,336 255,362 190,388" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="366" text-anchor="middle" font-size="12" fill="#333">u == org[i]?</text>

  <!-- diamond3 No -> right (return false 不符) -->
  <path d="M 255 362 L 358 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="360" y="344" width="160" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="368" text-anchor="middle" font-size="11" fill="#333">return false</text>
  <text x="440" y="380" text-anchor="middle" font-size="10" fill="#888">(顺序不符 org)</text>

  <!-- diamond3 Yes -> down -->
  <path d="M 190 388 L 190 402" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="398" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- box4: i++ / 邻点 indeg -->
  <rect x="60" y="404" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190" y="428" text-anchor="middle" font-size="12" fill="#333">④ i++; u 的邻点 indeg−−，归 0 入队</text>

  <!-- loop back arrow: from box4 left side up to diamond1 left side -->
  <path d="M 60 423 L 36 423 L 36 184 L 135 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="44" y="300" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">回循环</text>

  <!-- legend -->
  <rect x="360" y="404" width="160" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="440" y="420" text-anchor="middle" font-size="10" fill="#555">每步队列恰 1 节点 +</text>
  <text x="440" y="434" text-anchor="middle" font-size="10" fill="#555">弹出顺序 = org ⇒ true</text>
</svg>
