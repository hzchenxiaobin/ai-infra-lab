<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：seen 集合 + 双层循环 + 超限即 break</text>

  <!-- Step 1: init -->
  <rect x="160" y="42" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① seen = 空集合；n = len(nums)</text>

  <line x1="270" y1="78" x2="270" y2="94" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: outer for i -->
  <rect x="140" y="98" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for i = 0 .. n−1：</text>

  <line x1="270" y1="132" x2="270" y2="148" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: reset divCount, cur -->
  <rect x="120" y="152" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">divCount = 0；cur = []（当前子数组）</text>

  <line x1="270" y1="186" x2="270" y2="202" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: inner for j -->
  <rect x="140" y="206" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ for j = i .. n−1：</text>

  <line x1="270" y1="240" x2="270" y2="256" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: check divisible -->
  <rect x="100" y="260" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">若 nums[j] % p == 0：divCount += 1</text>

  <line x1="270" y1="294" x2="270" y2="308" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: divCount > k? -->
  <polygon points="270,312 360,346 270,380 180,346" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">divCount</text>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">&gt; k ?</text>

  <!-- Yes branch (right) -> break -->
  <line x1="360" y1="346" x2="410" y2="346" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="340" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="414" y="330" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="472" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">break 内层</text>

  <!-- No branch (left) -->
  <line x1="180" y1="346" x2="130" y2="346" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="340" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="14" y="330" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="72" y="350" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">cur.append(nums[j])</text>

  <!-- converge -->
  <line x1="72" y1="362" x2="72" y2="386" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="472" y1="362" x2="472" y2="386" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="72" y1="386" x2="472" y2="386" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- break path: jump to next i -->
  <path d="M 472 386 Q 510 386 510 115 L 402 115" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="250" font-size="9.5" fill="#b85450">跳到下一 i</text>

  <!-- no-break path: down to add -->
  <line x1="270" y1="386" x2="270" y2="398" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: seen.add(cur) -->
  <rect x="110" y="402" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">seen.add(cur)；继续下一 j（回到 ③）</text>

  <!-- loop back j -->
  <path d="M 430 418 Q 470 418 470 224 L 402 224" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="320" font-size="9.5" fill="#888">下一 j</text>

  <!-- loop back i -->
  <path d="M 110 418 Q 60 418 60 115 L 138 115" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="250" font-size="9.5" fill="#888">下一 i</text>

  <!-- Footer -->
  <rect x="80" y="446" width="380" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="460" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">遍历结束返回 len(seen)；集合自动去重，重复子数组只计一次</text>
</svg>
