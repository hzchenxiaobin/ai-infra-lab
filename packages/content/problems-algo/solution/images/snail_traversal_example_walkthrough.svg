<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：1D 下标 → 蜗牛 2D 格的映射（rowsCount=5）</text>

  <!-- 1D array strip: 20 cells, x0=20, cw=29, ch=28, y=50 -->
  <text x="20" y="44" font-size="11" fill="#888">nums（每格右上角小数字为下标）：</text>
  <g filter="url(#rough2)">
    <rect x="20" y="50" width="580" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3"/>
    <!-- 20 cells -->
    <rect x="20" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="49" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="78" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="107" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="136" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="165" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="194" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="223" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="252" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="281" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="310" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="339" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="368" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="397" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="426" y="50" width="29" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="455" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="484" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="513" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="542" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="571" y="50" width="29" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
  </g>
  <!-- values -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="34.5" y="68">19</text><text x="63.5" y="68">10</text><text x="92.5" y="68">3</text><text x="121.5" y="68">7</text><text x="150.5" y="68">9</text>
    <text x="179.5" y="68">8</text><text x="208.5" y="68">5</text><text x="237.5" y="68">2</text><text x="266.5" y="68">1</text><text x="295.5" y="68">17</text>
    <text x="324.5" y="68">16</text><text x="353.5" y="68">14</text><text x="382.5" y="68">12</text><text x="411.5" y="68">18</text><text x="440.5" y="68">6</text>
    <text x="469.5" y="68">13</text><text x="498.5" y="68">11</text><text x="527.5" y="68">20</text><text x="556.5" y="68">4</text><text x="585.5" y="68">15</text>
  </g>
  <!-- indices below -->
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <text x="34.5" y="92">0</text><text x="63.5" y="92">1</text><text x="92.5" y="92">2</text><text x="121.5" y="92">3</text><text x="150.5" y="92">4</text>
    <text x="179.5" y="92">5</text><text x="208.5" y="92">6</text><text x="237.5" y="92">7</text><text x="266.5" y="92">8</text><text x="295.5" y="92">9</text>
    <text x="324.5" y="92">10</text><text x="353.5" y="92">11</text><text x="382.5" y="92">12</text><text x="411.5" y="92">13</text><text x="440.5" y="92">14</text>
    <text x="469.5" y="92">15</text><text x="498.5" y="92">16</text><text x="527.5" y="92">17</text><text x="556.5" y="92">18</text><text x="585.5" y="92">19</text>
  </g>

  <!-- arrow down -->
  <path d="M 310 100 L 310 120" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="116" font-size="10" fill="#888">idx = c×5 + (c偶? r : 4−r)</text>

  <!-- 2D grid: 4 cols x 5 rows; cell 90x40; origin gx=160, gy=130 -->
  <!-- col c left x = 160 + c*90 ; row r top y = 130 + r*40 -->
  <g filter="url(#rough2)">
    <!-- column 0 (even) -->
    <rect x="160" y="130" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="160" y="170" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4"/>
    <rect x="160" y="210" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4"/>
    <rect x="160" y="250" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4"/>
    <rect x="160" y="290" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <!-- column 1 (odd) -->
    <rect x="250" y="130" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <rect x="250" y="170" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <rect x="250" y="210" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <rect x="250" y="250" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <rect x="250" y="290" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <!-- column 2 (even) -->
    <rect x="340" y="130" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="340" y="170" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4"/>
    <rect x="340" y="210" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4"/>
    <rect x="340" y="250" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="4"/>
    <rect x="340" y="290" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <!-- column 3 (odd) -->
    <rect x="430" y="130" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <rect x="430" y="170" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <rect x="430" y="210" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <rect x="430" y="250" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4"/>
    <rect x="430" y="290" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
  </g>
  <!-- cell center x: col0=205, col1=295, col2=385, col3=475 ; row center y: 150,190,230,270,310 -->

  <!-- column labels -->
  <text x="205" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c=0 ↓</text>
  <text x="295" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">c=1 ↑</text>
  <text x="385" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c=2 ↓</text>
  <text x="475" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">c=3 ↑</text>

  <!-- values + source idx in each cell -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="205" y="156" font-weight="bold">19</text><text x="295" y="156" font-weight="bold">17</text><text x="385" y="156" font-weight="bold">16</text><text x="475" y="156" font-weight="bold">15</text>
    <text x="205" y="196">10</text><text x="295" y="196">1</text><text x="385" y="196">14</text><text x="475" y="196">4</text>
    <text x="205" y="236">3</text><text x="295" y="236">2</text><text x="385" y="236">12</text><text x="475" y="236">20</text>
    <text x="205" y="276">7</text><text x="295" y="276">5</text><text x="385" y="276">18</text><text x="475" y="276">11</text>
    <text x="205" y="316" font-weight="bold">9</text><text x="295" y="316" font-weight="bold">8</text><text x="385" y="316" font-weight="bold">6</text><text x="475" y="316" font-weight="bold">13</text>
  </g>
  <!-- source idx small superscript at top-right of each cell -->
  <g font-size="9" fill="#888" text-anchor="start">
    <text x="238" y="142">0</text><text x="328" y="142">9</text><text x="418" y="142">10</text><text x="508" y="142">19</text>
    <text x="238" y="182">1</text><text x="328" y="182">8</text><text x="418" y="182">11</text><text x="508" y="182">18</text>
    <text x="238" y="222">2</text><text x="328" y="222">7</text><text x="418" y="222">12</text><text x="508" y="222">17</text>
    <text x="238" y="262">3</text><text x="328" y="262">6</text><text x="418" y="262">13</text><text x="508" y="262">16</text>
    <text x="238" y="302">4</text><text x="328" y="302">5</text><text x="418" y="302">14</text><text x="508" y="302">15</text>
  </g>

  <!-- legend -->
  <rect x="40" y="350" width="540" height="80" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="372" font-size="11" fill="#333" font-weight="bold">读法：</text>
  <text x="92" y="372" font-size="11" fill="#333">格子右上小数字 = 该值来自 nums 的下标</text>
  <text x="50" y="392" font-size="11" fill="#333">列 c=0,2（蓝）正序：idx = c×5 + r → 0,1,2,3,4 / 10,11,12,13,14</text>
  <text x="50" y="412" font-size="11" fill="#333">列 c=1,3（橙）逆序：idx = c×5 + (4−r) → 9,8,7,6,5 / 19,18,17,16,15</text>
</svg>
