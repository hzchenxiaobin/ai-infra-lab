<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遍历差值 → 入堆 → 溢出弹最小 → 砖块不足即停</text>

  <!-- Start -->
  <rect x="210" y="44" width="140" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 heap=[]，i=0</text>

  <!-- arrow -->
  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Loop condition: i < n-1 ? -->
  <polygon points="280,100 390,140 280,180 170,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i &lt; n−1 ?</text>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#888">还有楼要爬？</text>

  <!-- No: return n-1 -->
  <path d="M 390 140 L 460 140" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="405" y="134" font-size="10" fill="#888">否</text>
  <rect x="460" y="124" width="90" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return n−1</text>

  <!-- Yes: gap = h[i+1]-h[i] -->
  <path d="M 280 180 L 280 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="290" y="192" font-size="10" fill="#888">是</text>
  <rect x="180" y="198" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#446688">gap = heights[i+1] − heights[i]</text>

  <!-- arrow -->
  <path d="M 280 234 L 280 250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- gap <= 0 ? -->
  <polygon points="280,254 380,290 280,326 180,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">gap ≤ 0 ?</text>
  <text x="280" y="304" text-anchor="middle" font-size="10" fill="#888">下坡/平地？</text>

  <!-- Yes: continue (free) -->
  <path d="M 180 290 L 110 290 L 110 56 L 170 56" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="120" y="282" font-size="10" fill="#4a7a3a" font-weight="bold">是 免费通行</text>
  <text x="120" y="295" font-size="9" fill="#888">→ i++ 回循环</text>

  <!-- No: push gap to heap -->
  <path d="M 280 326 L 280 342" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="290" y="338" font-size="10" fill="#888">否（上坡）</text>
  <rect x="180" y="344" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#446688">heap.push(gap)  ← 先占梯子位</text>

  <!-- arrow -->
  <path d="M 280 380 L 280 396" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- heap.size > ladders ? -->
  <polygon points="280,400 390,438 280,476 170,438" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">heap.size &gt; ladders ?</text>
  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#888">梯子不够？</text>

  <!-- Yes: pop min, bricks -= min -->
  <path d="M 390 438 L 460 438" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="405" y="432" font-size="10" fill="#888">是</text>
  <rect x="460" y="422" width="90" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505" y="438" text-anchor="middle" font-size="10" fill="#d6a040">bricks −=</text>
  <text x="505" y="450" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">heap.pop()</text>

  <!-- arrow from pop box back down -->
  <path d="M 505 456 L 505 510 L 280 510" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No path: directly down to bricks check -->
  <path d="M 280 476 L 280 492" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="290" y="488" font-size="10" fill="#888">否</text>

  <!-- bricks < 0 ? -->
  <polygon points="280,496 380,530 280,564 180,530" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="530" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">bricks &lt; 0 ?</text>
  <text x="280" y="546" text-anchor="middle" font-size="10" fill="#888">砖块不够？</text>

  <!-- Yes: return i -->
  <path d="M 180 530 L 110 530 L 110 588 L 180 588" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" fill="none" filter="url(#rough2)"/>
  <text x="115" y="522" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="180" y="574" width="110" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="596" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return i</text>

  <!-- No: i++ back to loop -->
  <path d="M 380 530 L 430 530 L 430 56 L 390 56" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="395" y="522" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="440" y="300" font-size="10" fill="#4a7a3a">i++，回循环顶</text>
</svg>
