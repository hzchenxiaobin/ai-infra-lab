<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ROW_NUMBER 打序号后过滤 rn ≤ 3</text>

  <!-- ===== Winston panel (top-left) ===== -->
  <rect x="20" y="44" width="255" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Winston (id=1) · 4 笔</text>
  <line x1="30" y1="68" x2="265" y2="68" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="40" y="84" font-size="9" fill="#888">rn</text>
  <text x="80" y="84" font-size="9" fill="#888">order_id</text>
  <text x="160" y="84" font-size="9" fill="#888">order_date</text>
  <text x="245" y="84" font-size="9" fill="#888" text-anchor="end">保留?</text>

  <text x="40" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="80" y="102" font-size="10" fill="#333">#8</text>
  <text x="160" y="102" font-size="10" fill="#333">2020-08-03</text>
  <text x="245" y="102" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="40" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="80" y="118" font-size="10" fill="#333">#1</text>
  <text x="160" y="118" font-size="10" fill="#333">2020-07-31</text>
  <text x="245" y="118" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="40" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="80" y="134" font-size="10" fill="#333">#10</text>
  <text x="160" y="134" font-size="10" fill="#333">2020-07-15</text>
  <text x="245" y="134" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="40" y="150" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="80" y="150" font-size="10" fill="#999">#5</text>
  <text x="160" y="150" font-size="10" fill="#999">2020-06-10</text>
  <text x="245" y="150" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">✗ 丢</text>
  <text x="40" y="166" font-size="9" fill="#b85450">超出前 3，最老订单被排除</text>

  <!-- ===== Jonathan panel (top-right) ===== -->
  <rect x="285" y="44" width="255" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Jonathan (id=2) · 3 笔</text>
  <line x1="295" y1="68" x2="530" y2="68" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="305" y="84" font-size="9" fill="#888">rn</text>
  <text x="345" y="84" font-size="9" fill="#888">order_id</text>
  <text x="425" y="84" font-size="9" fill="#888">order_date</text>
  <text x="525" y="84" font-size="9" fill="#888" text-anchor="end">保留?</text>

  <text x="305" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="345" y="102" font-size="10" fill="#333">#9</text>
  <text x="425" y="102" font-size="10" fill="#333">2020-08-07</text>
  <text x="525" y="102" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="305" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="345" y="118" font-size="10" fill="#333">#6</text>
  <text x="425" y="118" font-size="10" fill="#333">2020-08-01</text>
  <text x="525" y="118" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="305" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="345" y="134" font-size="10" fill="#333">#2</text>
  <text x="425" y="134" font-size="10" fill="#333">2020-07-30</text>
  <text x="525" y="134" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>
  <text x="305" y="156" font-size="9" fill="#4a7a3a">恰好 3 笔，全部保留</text>

  <!-- ===== Annabelle panel (bottom-left) ===== -->
  <rect x="20" y="184" width="255" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Annabelle (id=3) · 2 笔</text>
  <line x1="30" y1="208" x2="265" y2="208" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="40" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="80" y="226" font-size="10" fill="#333">#7</text>
  <text x="160" y="226" font-size="10" fill="#333">2020-08-01</text>
  <text x="245" y="226" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="40" y="242" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="80" y="242" font-size="10" fill="#333">#3</text>
  <text x="160" y="242" font-size="10" fill="#333">2020-07-31</text>
  <text x="245" y="242" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>
  <text x="40" y="264" font-size="9" fill="#4a7a3a">不足 3 笔，全部保留</text>

  <!-- ===== Marwan panel (bottom-right) ===== -->
  <rect x="285" y="184" width="255" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Marwan (id=4) · 1 笔</text>
  <line x1="295" y1="208" x2="530" y2="208" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="305" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="345" y="226" font-size="10" fill="#333">#4</text>
  <text x="425" y="226" font-size="10" fill="#333">2020-07-29</text>
  <text x="525" y="226" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>
  <text x="305" y="250" font-size="9" fill="#4a7a3a">仅 1 笔，保留</text>

  <text x="305" y="270" font-size="9" fill="#888">Khaled (id=5) 无订单 → 不出现</text>

  <!-- ===== Bottom: final output ordering ===== -->
  <rect x="40" y="304" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最终输出：9 行（4+3+2，Khaled 无订单不计）</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#666">ORDER BY customer_name, customer_id, order_date DESC</text>

  <!-- output rows preview -->
  <rect x="120" y="358" width="320" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="373" text-anchor="middle" font-size="9" fill="white" font-weight="bold">customer_name</text>
  <text x="265" y="373" text-anchor="middle" font-size="9" fill="white" font-weight="bold">order_id</text>
  <text x="365" y="373" text-anchor="middle" font-size="9" fill="white" font-weight="bold">order_date</text>

  <rect x="120" y="380" width="320" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="394" text-anchor="middle" font-size="9" fill="#333">Annabelle</text>
  <text x="265" y="394" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="365" y="394" text-anchor="middle" font-size="9" fill="#333">2020-08-01</text>

  <rect x="120" y="400" width="320" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="414" text-anchor="middle" font-size="9" fill="#333">Winston</text>
  <text x="265" y="414" text-anchor="middle" font-size="9" fill="#333">8</text>
  <text x="365" y="414" text-anchor="middle" font-size="9" fill="#333">2020-08-03</text>

  <text x="280" y="432" text-anchor="middle" font-size="9" fill="#888">…（共 9 行，按客户名升序排列）</text>
</svg>
