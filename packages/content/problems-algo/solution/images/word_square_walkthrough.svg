<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：合法方块 vs 非法方块</text>

  <!-- ===================== Top: valid example ===================== -->
  <rect x="24" y="38" width="512" height="240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 合法：words = ["abcd","bnrt","crm","dt"] → true</text>

  <!-- grid 4 rows, max 4 cols; cell 32 wide, 28 tall, origin (60, 76) -->
  <!-- col header j -->
  <text x="60" y="72" text-anchor="middle" font-size="8" fill="#aaa">j</text>
  <text x="84" y="72" text-anchor="middle" font-size="8" fill="#aaa">0</text>
  <text x="116" y="72" text-anchor="middle" font-size="8" fill="#aaa">1</text>
  <text x="148" y="72" text-anchor="middle" font-size="8" fill="#aaa">2</text>
  <text x="180" y="72" text-anchor="middle" font-size="8" fill="#aaa">3</text>
  <!-- row header i -->
  <text x="48" y="94" text-anchor="middle" font-size="8" fill="#aaa">0</text>
  <text x="48" y="122" text-anchor="middle" font-size="8" fill="#aaa">1</text>
  <text x="48" y="150" text-anchor="middle" font-size="8" fill="#aaa">2</text>
  <text x="48" y="178" text-anchor="middle" font-size="8" fill="#aaa">3</text>

  <!-- Row 0: a b c d -->
  <rect x="68" y="82" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="100" y="82" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="132" y="82" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="164" y="82" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>

  <!-- Row 1: b n r t -->
  <rect x="68" y="110" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="100" y="110" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n</text>
  <rect x="132" y="110" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r</text>
  <rect x="164" y="110" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>

  <!-- Row 2: c r m -->
  <rect x="68" y="138" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="157" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="100" y="138" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="157" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r</text>
  <rect x="132" y="138" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="157" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">m</text>

  <!-- Row 3: d t -->
  <rect x="68" y="166" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="100" y="166" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t</text>

  <!-- diagonal -->
  <path d="M 68 82 L 196 210" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- check trace table on the right -->
  <text x="230" y="86" font-size="10" fill="#888" font-weight="bold">逐位核对（节选）</text>
  <text x="230" y="104" font-size="10" fill="#555">(0,1): words[0][1]='b' = words[1][0]='b' ✓</text>
  <text x="230" y="120" font-size="10" fill="#555">(0,2): 'c' = words[2][0]='c' ✓</text>
  <text x="230" y="136" font-size="10" fill="#555">(0,3): 'd' = words[3][0]='d' ✓</text>
  <text x="230" y="152" font-size="10" fill="#555">(1,2): 'r' = words[2][1]='r' ✓</text>
  <text x="230" y="168" font-size="10" fill="#555">(1,3): 't' = words[3][1]='t' ✓</text>
  <text x="230" y="184" font-size="10" fill="#2e6e2e" font-weight="bold">行 2 仅 3 字符、行 3 仅 2 字符</text>
  <text x="230" y="198" font-size="10" fill="#555">被查位置镜像皆存在 → 无越界</text>
  <text x="230" y="214" font-size="10" fill="#555">行 2 的 j=3 不遍历（len=3）</text>
  <text x="230" y="230" font-size="10" fill="#555">行 3 的 j=2,3 不遍历（len=2）</text>

  <text x="60" y="250" font-size="11" fill="#4a7a3a" font-weight="bold">→ 全部通过，return true ✓</text>

  <!-- ===================== Bottom: invalid example ===================== -->
  <rect x="24" y="294" width="512" height="286" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 非法：words = ["ball","area","read","lady"] → false</text>

  <!-- col header -->
  <text x="60" y="328" text-anchor="middle" font-size="8" fill="#aaa">j</text>
  <text x="84" y="328" text-anchor="middle" font-size="8" fill="#aaa">0</text>
  <text x="116" y="328" text-anchor="middle" font-size="8" fill="#aaa">1</text>
  <text x="148" y="328" text-anchor="middle" font-size="8" fill="#aaa">2</text>
  <text x="180" y="328" text-anchor="middle" font-size="8" fill="#aaa">3</text>
  <text x="48" y="350" text-anchor="middle" font-size="8" fill="#aaa">0</text>
  <text x="48" y="378" text-anchor="middle" font-size="8" fill="#aaa">1</text>
  <text x="48" y="406" text-anchor="middle" font-size="8" fill="#aaa">2</text>
  <text x="48" y="434" text-anchor="middle" font-size="8" fill="#aaa">3</text>

  <!-- Row 0: b a l l  (highlight (0,2)='l' red) -->
  <rect x="68" y="338" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="357" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="100" y="338" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="357" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="132" y="338" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="148" y="357" text-anchor="middle" font-size="12" fill="#a33a36" font-weight="bold">l</text>
  <rect x="164" y="338" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="357" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>

  <!-- Row 1: a r e a -->
  <rect x="68" y="366" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="385" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="100" y="366" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="385" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r</text>
  <rect x="132" y="366" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="385" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="164" y="366" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="385" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>

  <!-- Row 2: r e a d  (highlight (2,0)='r' red) -->
  <rect x="68" y="394" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="84" y="413" text-anchor="middle" font-size="12" fill="#a33a36" font-weight="bold">r</text>
  <rect x="100" y="394" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="413" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <rect x="132" y="394" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="413" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="164" y="394" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="413" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>

  <!-- Row 3: l a d y -->
  <rect x="68" y="422" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="441" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
  <rect x="100" y="422" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="441" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="132" y="422" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="148" y="441" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
  <rect x="164" y="422" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="441" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">y</text>

  <!-- diagonal -->
  <path d="M 68 338 L 196 466" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- mirror arrows between (0,2) and (2,0) -->
  <path d="M 148 338 Q 220 360 220 394 Q 220 410 100 410" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- trace text -->
  <text x="230" y="346" font-size="10" fill="#888" font-weight="bold">逐位核对</text>
  <text x="230" y="364" font-size="10" fill="#555">(0,0): 'b'='b' ✓</text>
  <text x="230" y="380" font-size="10" fill="#555">(0,1): 'a'=words[1][0]='a' ✓</text>
  <text x="230" y="396" font-size="10" fill="#b85450" font-weight="bold">(0,2): 'l' vs words[2][0]='r' ✗</text>
  <text x="230" y="412" font-size="10" fill="#b85450">  → 字符不等，return false</text>
  <text x="230" y="432" font-size="10" fill="#888">（边界①②均通过：j=2&lt;4、i=0&lt;len(words[2])=4）</text>
  <text x="230" y="450" font-size="10" fill="#888">（即便继续查，(2,0) 处 r≠l 也会被同一规则捕获）</text>

  <!-- row0 vs col0 string compare -->
  <text x="60" y="478" font-size="11" fill="#555" font-weight="bold">行 0 "ball"  vs  列 0 "barl"：</text>
  <text x="60" y="498" font-size="11" fill="#555">b=a? ✓  a=a? ✓  </text>
  <text x="148" y="498" font-size="11" fill="#b85450" font-weight="bold">l vs r ✗</text>
  <text x="60" y="518" font-size="11" fill="#b85450" font-weight="bold">→ 第 2 位即不匹配，return false</text>

  <text x="60" y="548" font-size="10" fill="#888">注：行=列 对所有 k 成立才合法；任一 (i,j) 镜像不等即整体非法</text>
  <text x="60" y="566" font-size="10" fill="#888">扫描在首个不匹配处提前返回，无需遍历全部字符</text>
</svg>
