<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [3,1,5,4,2]，k = 2（掩码只需 2 个二进制位）</text>

  <!-- mini array -->
  <g filter="url(#rough2)">
    <rect x="120" y="40" width="48" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="144" y="61" text-anchor="middle" font-size="13" fill="#777">3</text>
    <rect x="176" y="40" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="200" y="61" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold">1</text>
    <rect x="232" y="40" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="256" y="61" text-anchor="middle" font-size="13" fill="#b07818">5</text>
    <rect x="288" y="40" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="312" y="61" text-anchor="middle" font-size="13" fill="#b07818">4</text>
    <rect x="344" y="40" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="368" y="61" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold">2</text>
  </g>
  <path d="M 368 84 L 154 84" fill="none" stroke="#999" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">倒序依次弹出</text>

  <!-- table header -->
  <rect x="36" y="112" width="488" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#446688" font-weight="bold">
    <text x="65" y="129" text-anchor="middle">操作 t</text>
    <text x="123" y="129" text-anchor="middle">下标 i</text>
    <text x="184" y="129" text-anchor="middle">弹出 v</text>
    <text x="271" y="129" text-anchor="middle">判定</text>
    <text x="376" y="129" text-anchor="middle">mask（二进制）</text>
    <text x="475" y="129" text-anchor="middle">进度</text>
  </g>

  <!-- table body -->
  <rect x="36" y="138" width="488" height="136" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="36" y="240" width="488" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1">
    <line x1="94" y1="138" x2="94" y2="274"/>
    <line x1="152" y1="138" x2="152" y2="274"/>
    <line x1="216" y1="138" x2="216" y2="274"/>
    <line x1="326" y1="138" x2="326" y2="274"/>
    <line x1="426" y1="138" x2="426" y2="274"/>
    <line x1="36" y1="172" x2="524" y2="172"/>
    <line x1="36" y1="206" x2="524" y2="206"/>
    <line x1="36" y1="240" x2="524" y2="240"/>
  </g>

  <g filter="url(#rough2)" font-size="12" fill="#444">
    <text x="65" y="160" text-anchor="middle">1</text>
    <text x="123" y="160" text-anchor="middle">4</text>
    <text x="184" y="160" text-anchor="middle">2</text>
    <text x="271" y="160" text-anchor="middle" fill="#4a7a3a">2 ≤ 2，置位 ✓</text>
    <text x="376" y="160" text-anchor="middle">10</text>
    <text x="475" y="160" text-anchor="middle">1 / 2</text>

    <text x="65" y="194" text-anchor="middle">2</text>
    <text x="123" y="194" text-anchor="middle">3</text>
    <text x="184" y="194" text-anchor="middle">4</text>
    <text x="271" y="194" text-anchor="middle" fill="#999">4 &gt; 2，跳过 ✗</text>
    <text x="376" y="194" text-anchor="middle">10</text>
    <text x="475" y="194" text-anchor="middle">1 / 2</text>

    <text x="65" y="228" text-anchor="middle">3</text>
    <text x="123" y="228" text-anchor="middle">2</text>
    <text x="184" y="228" text-anchor="middle">5</text>
    <text x="271" y="228" text-anchor="middle" fill="#999">5 &gt; 2，跳过 ✗</text>
    <text x="376" y="228" text-anchor="middle">10</text>
    <text x="475" y="228" text-anchor="middle">1 / 2</text>

    <text x="65" y="262" text-anchor="middle" font-weight="bold">4</text>
    <text x="123" y="262" text-anchor="middle" font-weight="bold">1</text>
    <text x="184" y="262" text-anchor="middle" font-weight="bold">1</text>
    <text x="271" y="262" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1 ≤ 2，置位 ✓</text>
    <text x="376" y="262" text-anchor="middle" fill="#b85450" font-weight="bold">11 = full</text>
    <text x="475" y="262" text-anchor="middle" fill="#b85450" font-weight="bold">2 / 2 集齐</text>
  </g>

  <!-- bottom note -->
  <rect x="66" y="292" width="428" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="12" fill="#b07818" font-weight="bold" filter="url(#rough2)">第 4 步置位后 mask == (11)₂ = full，集齐 1..2</text>
  <text x="280" y="327" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#rough2)">返回 n − i = 5 − 1 = 4</text>
</svg>
