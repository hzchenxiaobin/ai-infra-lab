<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">核心直觉：只比共有键/下标，相同处省略，不同的叶记为 [v₁, v₂]</text>

  <text x="160" y="54" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)" font-weight="bold">obj1</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)" font-weight="bold">obj2</text>

  <rect x="110" y="62" width="100" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ a, v, x, z }</text>
  <rect x="450" y="62" width="100" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ a, v, x, z }</text>
  <text x="330" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">只看共有键 = {a,v,x,z}（独有键忽略）</text>

  <rect x="110" y="120" width="100" height="28" rx="5" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a: 1</text>
  <rect x="450" y="120" width="100" height="28" rx="5" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="500" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a: 2</text>
  <path d="M 210 134 L 450 134" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="129" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">1 ≠ 2 → 叶差异 [1, 2]</text>

  <rect x="110" y="165" width="100" height="28" rx="5" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v: 3</text>
  <rect x="450" y="165" width="100" height="28" rx="5" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="500" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v: 4</text>
  <path d="M 210 179 L 450 179" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="174" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">3 ≠ 4 → 叶差异 [3, 4]</text>

  <rect x="110" y="210" width="100" height="28" rx="5" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="160" y="229" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">x: [ ]</text>
  <rect x="450" y="210" width="100" height="28" rx="5" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="500" y="229" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">x: [ ]</text>
  <path d="M 210 224 L 450 224" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="3,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="219" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两空数组·下标交集为空 → 无差异 → 省略</text>

  <rect x="110" y="255" width="100" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">z: { a:null }</text>
  <rect x="450" y="255" width="100" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">z: { a:2 }</text>
  <path d="M 210 269 L 450 269" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">同为对象 → 递归求差异 ↓</text>

  <rect x="110" y="305" width="100" height="26" rx="5" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="323" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">z.a: null</text>
  <rect x="450" y="305" width="100" height="26" rx="5" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="500" y="323" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">z.a: 2</text>
  <path d="M 210 318 L 450 318" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="313" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">null ≠ 2 → 叶差异 [null, 2]</text>

  <rect x="40" y="352" width="580" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="376" font-size="12" fill="#333" filter="url(#rough2)" font-weight="bold">差异 = 收集所有「共有键中取值不同」的叶，相同处与空容器一并省略：</text>
  <text x="56" y="398" font-size="12" fill="#333" filter="url(#rough2)">  a → [1,2]   v → [3,4]   z → { a: [null,2] }   （x 无差异被省略）</text>
  <text x="56" y="418" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">→ { "a":[1,2], "v":[3,4], "z":{"a":[null,2]} }</text>
  <text x="56" y="440" font-size="10" fill="#888" filter="url(#rough2)">规则：① 只看共有键/下标；② 相同 → 省略；③ 不同叶 → [v₁,v₂]；④ 嵌套 → 递归，空则省略。</text>
</svg>
