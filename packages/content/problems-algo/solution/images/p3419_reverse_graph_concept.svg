<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：反图一把 BFS + threshold 自动满足（示例 1）</text>

  <!-- 左：原图 -->
  <rect x="12" y="32" width="240" height="200" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="132" y="50" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">原图：所有点都要走到 0</text>

  <circle cx="58" cy="132" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="58" y="136" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="58" y="158" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">目标</text>

  <circle cx="132" cy="74" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="78" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <circle cx="222" cy="74" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="78" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <circle cx="132" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="194" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <circle cx="222" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="194" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>

  <path d="M 209 74 L 148 74" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="177" y="66" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 209 190 L 148 190" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="177" y="182" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 122 82 L 70 123" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="91" y="95" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 122 182 L 70 141" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="95" y="177" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 210 78 L 72 127" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="141" y="95" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="132" y="224" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">红虚线 = 唯一 w=2 的边，答案为 1 时删掉</text>

  <!-- 右：反图 -->
  <rect x="268" y="32" width="240" height="200" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="388" y="50" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">反图：从 0 出发一把 BFS 点亮</text>

  <circle cx="314" cy="132" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="314" y="136" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="314" y="158" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">源点</text>

  <circle cx="388" cy="74" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="78" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1</text>
  <circle cx="478" cy="74" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="78" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <circle cx="388" cy="190" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="194" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">3</text>
  <circle cx="478" cy="190" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="194" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">4</text>

  <path d="M 324 124 L 376 83" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="107" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 324 140 L 376 181" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="342" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 401 74 L 465 74" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="433" y="66" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 401 190 L 465 190" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="433" y="182" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 326 128 L 464 79" fill="none" stroke="#999999" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="392" y="95" text-anchor="middle" font-size="9.5" fill="#999999" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="445" y="110" text-anchor="middle" font-size="8.5" fill="#999999" filter="url(#rough2)">w=2 太大，弃用</text>

  <text x="388" y="224" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">绿实线 = BFS 树（全 w=1）→ 答案 1</text>

  <!-- 底部两张说明卡 -->
  <rect x="16" y="246" width="240" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="266" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">观察①②：反图 + 单调性</text>
  <text x="136" y="284" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">「所有点都能到 0」⇔ 反图「0 到所有点」</text>
  <text x="136" y="298" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">x 越大，可用边只多不少</text>
  <text x="136" y="312" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">从 0 可达的点集单调不减</text>
  <text x="136" y="326" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">⇒ 可行性单调，二分最小可行 x</text>

  <rect x="272" y="246" width="232" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="266" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">观察③：threshold 是烟雾弹</text>
  <text x="388" y="284" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">反图 BFS 树：每点恰 1 条入边</text>
  <text x="388" y="298" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">⇒ 原图每点恰 1 条出边（≤ 1）</text>
  <text x="388" y="312" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">约束保证 threshold ≥ 1</text>
  <text x="388" y="326" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">⇒ 出度约束天然满足，无需处理</text>

  <text x="260" y="357" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">示例 1：n=5, threshold=2，答案 1——只删 w=2 的边 2→0</text>
</svg>
