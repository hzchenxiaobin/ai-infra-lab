<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">「紧密更大」= 字典序更大 ＋ 首字母原地或后移一位</text>

  <!-- left: two conditions -->
  <rect x="24" y="46" width="252" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">条件①  字典序严格更大</text>
  <text x="150" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">w &gt; z</text>

  <rect x="24" y="104" width="252" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">条件②  首字母只许原地或 +1</text>
  <text x="150" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">w 的首字母 = z 的首字母，或其后一位</text>

  <!-- life-saving key box -->
  <rect x="24" y="170" width="252" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="9" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">保命钥匙</text>
  <text x="150" y="212" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">手里只要有「首字母恰好大 1」的词，</text>
  <text x="150" y="230" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">本轮必不死：首字母大一档，字典序必然更大，</text>
  <text x="150" y="248" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">两个条件自动全部满足</text>

  <!-- right: care examples -->
  <text x="432" y="56" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">以 care 为例：它紧密大于右边的词吗？</text>

  <rect x="312" y="68" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="343" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">care</text>
  <text x="386" y="86" font-size="11" fill="#999" filter="url(#rough2)">vs</text>
  <rect x="404" y="68" width="62" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">book</text>
  <text x="486" y="87" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="504" y="86" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">c 是 b 的下一位</text>

  <rect x="312" y="104" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="343" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">care</text>
  <text x="386" y="122" font-size="11" fill="#999" filter="url(#rough2)">vs</text>
  <rect x="404" y="104" width="62" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">car</text>
  <text x="486" y="123" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="504" y="122" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">同 c，care 更长更大</text>

  <rect x="312" y="140" width="62" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="343" y="158" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">care</text>
  <text x="386" y="158" font-size="11" fill="#999" filter="url(#rough2)">vs</text>
  <rect x="404" y="140" width="62" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ant</text>
  <text x="486" y="159" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="504" y="158" font-size="10.5" fill="#b85450" filter="url(#rough2)">首字母 a 太靠前</text>

  <rect x="312" y="176" width="62" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="343" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">care</text>
  <text x="386" y="194" font-size="11" fill="#999" filter="url(#rough2)">vs</text>
  <rect x="404" y="176" width="62" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cook</text>
  <text x="486" y="195" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="504" y="194" font-size="10.5" fill="#b85450" filter="url(#rough2)">care &lt; cook，条件①败</text>

  <!-- bottom: legal trajectory of first letters -->
  <text x="300" y="290" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">首字母的合法轨迹 —— 字母阶段单调推进，从不跳字母</text>

  <rect x="30" y="308" width="94" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="77" y="328" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ananas</text>
  <path d="M 128 324 L 158 324" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="143" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">原地</text>

  <rect x="162" y="308" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="328" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">atlas</text>
  <path d="M 244 324 L 274 324" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="259" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="278" y="308" width="88" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="322" y="328" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">banana</text>
  <path d="M 370 324 L 400 324" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="385" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="404" y="308" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="440" y="328" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cikla</text>

  <text x="530" y="328" font-size="11" fill="#999" filter="url(#rough2)">a→b→c</text>

  <text x="300" y="372" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 不允许从 a 直接跳到 c —— 每步首字母至多后移一位，阶段只能依次摊牌</text>
</svg>
