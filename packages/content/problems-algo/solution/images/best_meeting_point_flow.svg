<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="300" fill="#fafafa"/>

  <text x="300" y="32" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">算法流程：收集 → 排序 → 取中位数 → 累加距离</text>
  <path d="M 120 42 Q 300 52 480 42" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Box 1 -->
  <g filter="url(#rough2)">
    <rect x="20" y="80" width="120" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="80" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 收集坐标</text>
  <text x="80" y="126" text-anchor="middle" font-size="10" fill="#555">扫描 grid</text>
  <text x="80" y="140" text-anchor="middle" font-size="10" fill="#555">遇 1 记 (i,j)</text>
  <text x="80" y="160" text-anchor="middle" font-size="9" fill="#888">xs.append(i)</text>
  <text x="80" y="172" text-anchor="middle" font-size="9" fill="#888">ys.append(j)</text>

  <!-- arrow 1->2 -->
  <path d="M 144 128 L 178 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2 -->
  <g filter="url(#rough2)">
    <rect x="180" y="80" width="120" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="240" y="104" text-anchor="middle" font-size="11" fill="#b07a20" font-weight="bold">② 分别排序</text>
  <text x="240" y="126" text-anchor="middle" font-size="10" fill="#555">xs.sort()</text>
  <text x="240" y="140" text-anchor="middle" font-size="10" fill="#555">ys.sort()</text>
  <text x="240" y="162" text-anchor="middle" font-size="9" fill="#888">xs 按行扫描</text>
  <text x="240" y="174" text-anchor="middle" font-size="9" fill="#888">已天然有序</text>

  <!-- arrow 2->3 -->
  <path d="M 304 128 L 338 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3 -->
  <g filter="url(#rough2)">
    <rect x="340" y="80" width="120" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <text x="400" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 取中位数</text>
  <text x="400" y="126" text-anchor="middle" font-size="10" fill="#555">k = len(xs)</text>
  <text x="400" y="142" text-anchor="middle" font-size="10" fill="#555">mx = xs[k/2]</text>
  <text x="400" y="158" text-anchor="middle" font-size="10" fill="#555">my = ys[k/2]</text>
  <text x="400" y="174" text-anchor="middle" font-size="9" fill="#888">绝对偏差最小点</text>

  <!-- arrow 3->4 -->
  <path d="M 464 128 L 498 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4 -->
  <g filter="url(#rough2)">
    <rect x="460" y="80" width="120" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <text x="520" y="104" text-anchor="middle" font-size="11" fill="#a03040" font-weight="bold">④ 累加距离</text>
  <text x="520" y="126" text-anchor="middle" font-size="9" fill="#555">ans = Σ|xi−mx|</text>
  <text x="520" y="140" text-anchor="middle" font-size="9" fill="#555">    + Σ|yj−my|</text>
  <text x="520" y="160" text-anchor="middle" font-size="9" fill="#888">两维独立求和</text>
  <text x="520" y="172" text-anchor="middle" font-size="9" fill="#a03040" font-weight="bold">→ 答案</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="40" y="210" width="520" height="62" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="8"/>
  </g>
  <text x="300" y="234" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">核心：曼哈顿距离 = |Δx| + |Δy|，两维无耦合 → 各自最小化 → 中位数最优</text>
  <text x="300" y="254" text-anchor="middle" font-size="10" fill="#888">中位数使「绝对偏差之和」最小；均值使「平方偏差之和」最小（两者不要混淆）</text>
</svg>
