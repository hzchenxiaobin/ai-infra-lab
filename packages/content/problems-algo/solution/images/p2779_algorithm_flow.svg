<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2779f" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序 + 滑动窗口算法流程</text>

  <!-- Step 1: sort -->
  <rect x="200" y="44" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1. 排序 A = sort(nums)</text>

  <path d="M 280 80 L 280 96" stroke="#888" stroke-width="1.4" marker-end="url(#arr2779f)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="200" y="96" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2. left=0, ans=0</text>

  <path d="M 280 132 L 280 148" stroke="#888" stroke-width="1.4" marker-end="url(#arr2779f)" filter="url(#rough2)"/>

  <!-- Step 3: right++ (loop header) -->
  <rect x="190" y="148" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="171" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3. for right = 0 → n−1</text>

  <path d="M 280 184 L 280 200" stroke="#888" stroke-width="1.4" marker-end="url(#arr2779f)" filter="url(#rough2)"/>

  <!-- Decision: A[right]-A[left] > 2k? -->
  <polygon points="280,200 380,236 280,272 180,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">A[right]−A[left]</text>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">&gt; 2k ?</text>

  <!-- Yes branch: left++ -->
  <path d="M 380 236 L 430 236 L 430 200 L 430 168" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr2779f)" filter="url(#rough2)"/>
  <rect x="372" y="170" width="116" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是 → left++</text>
  <text x="430" y="199" text-anchor="middle" font-size="9" fill="#888">收缩窗口</text>

  <!-- Loop back from left++ to decision -->
  <path d="M 430 170 L 430 236 L 380 236" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr2779f)" filter="url(#rough2)"/>
  <text x="442" y="208" font-size="9" fill="#b85450">重判</text>

  <!-- No branch -->
  <path d="M 280 272 L 280 288" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr2779f)" filter="url(#rough2)"/>
  <text x="296" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step 4: update ans -->
  <rect x="180" y="288" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4. ans = max(ans, right−left+1)</text>

  <!-- Loop back to for -->
  <path d="M 180 305 L 130 305 L 130 166 L 190 166" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr2779f)" filter="url(#rough2)"/>
  <text x="120" y="240" font-size="9" fill="#888" transform="rotate(-90 120 240)">下一轮 right++</text>

  <!-- End -->
  <path d="M 280 322 L 280 338" stroke="#888" stroke-width="1.4" marker-end="url(#arr2779f)" filter="url(#rough2)"/>
  <rect x="210" y="338" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5. return ans</text>

  <!-- Complexity note -->
  <rect x="380" y="280" width="160" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="300" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">复杂度</text>
  <text x="390" y="318" font-size="10" fill="#666">排序: O(n log n)</text>
  <text x="390" y="334" font-size="10" fill="#666">滑窗: O(n)（双指针</text>
  <text x="390" y="348" font-size="10" fill="#666">各只增不减）</text>
</svg>
