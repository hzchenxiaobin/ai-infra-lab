<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：balls = [3,2,3,2,3] → 频率 {3:3, 2:2}，minFreq = 2</text>

  <!-- table header -->
  <g filter="url(#rough2)" font-size="12" font-weight="bold" fill="#2c4a6e">
    <rect x="60" y="44" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="92" y="64" text-anchor="middle">x</text>
    <rect x="124" y="44" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="199" y="64" text-anchor="middle">f=3：g=⌈3/(x+1)⌉</text>
    <rect x="274" y="44" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="349" y="64" text-anchor="middle">f=2：g=⌈2/(x+1)⌉</text>
    <rect x="424" y="44" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="462" y="64" text-anchor="middle">total</text>
  </g>

  <!-- row x=1 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="78" width="64" height="32" fill="#fff" stroke="#888" stroke-width="1.4" rx="4"/>
    <text x="92" y="99" text-anchor="middle" fill="#333">1</text>
    <rect x="124" y="78" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="199" y="99" text-anchor="middle" fill="#2e5c22">g=2，2·1≤3 ✓</text>
    <rect x="274" y="78" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="349" y="99" text-anchor="middle" fill="#2e5c22">g=1，1·1≤2 ✓</text>
    <rect x="424" y="78" width="76" height="32" fill="#fff" stroke="#888" stroke-width="1.4" rx="4"/>
    <text x="462" y="99" text-anchor="middle" fill="#333">3</text>
  </g>

  <!-- row x=2 (answer) -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="116" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="92" y="137" text-anchor="middle" fill="#b07818" font-weight="bold">2</text>
    <rect x="124" y="116" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="199" y="137" text-anchor="middle" fill="#2e5c22">g=1，1·2≤3 ✓</text>
    <rect x="274" y="116" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="349" y="137" text-anchor="middle" fill="#2e5c22">g=1，1·2≤2 ✓</text>
    <rect x="424" y="116" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="462" y="137" text-anchor="middle" fill="#2e5c22" font-weight="bold">2 ←ans</text>
  </g>

  <text x="280" y="170" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">x=2 → 盒大小 {2,3}：编号3 拆 [3,3,3]？不，是 g=1 盒 size 3；编号2 拆 [2,2] → 共 2 盒 ✓</text>

  <!-- example 2 box -->
  <rect x="36" y="188" width="252" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#2c4a6e">
    <text x="162" y="210" text-anchor="middle" font-weight="bold">示例 2：[10,10,10,3,1,1]</text>
    <text x="162" y="232" text-anchor="middle">频率 {10:3, 3:1, 1:2}，minFreq=1 ⟹ 只试 x=1</text>
    <text x="162" y="252" text-anchor="middle">f=3→g=2 ✓，f=1→g=1 ✓，f=2→g=1 ✓</text>
    <text x="162" y="272" text-anchor="middle">total = 4，即答案 4 ✓</text>
  </g>

  <!-- hole in feasible set box -->
  <rect x="304" y="188" width="222" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#8c3a36">
    <text x="415" y="210" text-anchor="middle" font-weight="bold">⚠ 可行集可能有「洞」</text>
    <text x="415" y="232" text-anchor="middle">单一编号 f = 7 时逐个 x 验证：</text>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <rect x="318" y="244" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="332" y="262" text-anchor="middle" fill="#2e5c22">1</text>
    <rect x="350" y="244" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="364" y="262" text-anchor="middle" fill="#2e5c22">2</text>
    <rect x="382" y="244" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="396" y="262" text-anchor="middle" fill="#2e5c22">3</text>
    <rect x="414" y="244" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="428" y="262" text-anchor="middle" fill="#8c3a36">4</text>
    <rect x="446" y="244" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="460" y="262" text-anchor="middle" fill="#8c3a36">5</text>
    <rect x="478" y="244" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="492" y="262" text-anchor="middle" fill="#2e5c22">6</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#8c3a36">
    <text x="415" y="290" text-anchor="middle">x=4：g=⌈7/5⌉=2，2·4=8 &gt; 7 ✗</text>
    <text x="415" y="310" text-anchor="middle">x=5：g=⌈7/6⌉=2，2·5=10 &gt; 7 ✗</text>
    <text x="415" y="332" text-anchor="middle">可行集 {1,2,3,6,7} 不是区间</text>
    <text x="415" y="350" text-anchor="middle">⟹ 不能对可行性二分！</text>
  </g>

  <text x="162" y="308" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">x=1 时盒大小 {1,2}，任何频率都能拆</text>
  <text x="162" y="330" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">（g=⌈f/2⌉ 个盒，g·1≤f 恒成立）</text>
  <text x="162" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">所以 x=1 恒可行，答案必然存在 ✓</text>
</svg>
