<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：解析 → 闰年计数 → 前缀和 → 修正 → 取余映射</text>

  <!-- Box 1: parse -->
  <rect x="130" y="42" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333">① 解析 year, month, day</text>

  <path d="M 260 78 L 260 90" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: leap count + full year days -->
  <rect x="80" y="90" width="360" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="10.5" fill="#333">② leap = ⌊(y−1)/4⌋ − ⌊(y−1)/100⌋ + ⌊(y−1)/400⌋ − 477</text>

  <path d="M 260 126 L 260 138" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3: days in full years -->
  <rect x="130" y="138" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="161" text-anchor="middle" font-size="11.5" fill="#333">③ days_years = (year−1971)×365 + leap</text>

  <path d="M 260 174 L 260 186" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4: total = days_years + prefix + day - 1 -->
  <rect x="80" y="186" width="360" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="11" fill="#333">④ total = days_years + prefix[M−1] + D − 1</text>

  <path d="M 260 222 L 260 234" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: leap ∧ M>2? -->
  <polygon points="260,236 340,260 260,284 180,260" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">leap ∧ M&gt;2?</text>

  <!-- Yes branch (right) -->
  <path d="M 340 260 L 365 260" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="353" y="254" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="367" y="244" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="417" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">total += 1</text>
  <path d="M 417 276 L 417 306 L 260 306" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- No branch (down) -->
  <path d="M 260 284 L 260 306" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="272" y="298" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Arrow merge → box5 -->
  <path d="M 260 306 L 260 316" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 5: return -->
  <rect x="130" y="316" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ return weekday[total % 7]</text>
</svg>
