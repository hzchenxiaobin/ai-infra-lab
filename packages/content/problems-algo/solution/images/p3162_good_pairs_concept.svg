<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：优质数对 ⟺ nums1[i] mod (nums2[j]·k) = 0</text>

  <text x="138" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1[i]</text>
  <text x="276" y="46" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums2[j] × k</text>

  <text x="230" y="53" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">j = 0</text>
  <text x="322" y="53" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">j = 1</text>

  <rect x="190" y="58" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="77" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">6 = 2×3</text>

  <rect x="282" y="58" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="77" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">12 = 4×3</text>

  <text x="96" y="123" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">i = 0</text>
  <rect x="106" y="98" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="138" y="123" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="190" y="98" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="124" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="282" y="98" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="124" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="96" y="173" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">i = 1</text>
  <rect x="106" y="148" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="138" y="173" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="190" y="148" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="174" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="282" y="148" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="174" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="96" y="223" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">i = 2</text>
  <rect x="106" y="198" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="138" y="223" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="190" y="198" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="224" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="282" y="198" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="224" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="96" y="273" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">i = 3</text>
  <rect x="106" y="248" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="273" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="190" y="248" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="274" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="282" y="248" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="274" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="230" y="300" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">12 mod 6 = 0</text>
  <text x="322" y="300" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">12 mod 12 = 0</text>

  <rect x="32" y="312" width="456" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = ✓ 格子的总数：只有 12 同时整除 6 与 12 → ans = 2</text>

  <rect x="32" y="356" width="456" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">「A 除尽 B」⟺ B 是 A 的约数：被除数是 nums1[i]，除数是 nums2[j]·k</text>
  <text x="260" y="388" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">方向勿反：是 12 mod 6 == 0，不是 6 mod 12 == 0</text>
</svg>
