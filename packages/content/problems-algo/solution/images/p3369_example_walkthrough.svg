<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 全流程演算：4, 4, 2, 3 → 查询三连 → remove → 再查 mode</text>

  <!-- 表头 -->
  <rect x="20" y="40" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="34" y="57" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="122" y="57" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">队列</text>
  <text x="216" y="57" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">有序多重集</text>
  <text x="336" y="57" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">sum</text>
  <text x="386" y="57" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">freq</text>
  <text x="484" y="57" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">返回</text>

  <!-- 行模板 y=70 起，行高 34 -->
  <!-- r1 -->
  <rect x="20" y="70" width="520" height="32" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="34" y="91" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 4</text>
  <text x="122" y="91" font-size="10.5" fill="#333" filter="url(#rough2)">[4]</text>
  <text x="216" y="91" font-size="10.5" fill="#333" filter="url(#rough2)">{4}</text>
  <text x="336" y="91" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="386" y="91" font-size="10.5" fill="#333" filter="url(#rough2)">4:1</text>
  <text x="484" y="91" font-size="10.5" fill="#999" filter="url(#rough2)">null</text>

  <!-- r2 -->
  <rect x="20" y="102" width="520" height="32" fill="#f7fafc" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="34" y="123" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 4</text>
  <text x="122" y="123" font-size="10.5" fill="#333" filter="url(#rough2)">[4,4]</text>
  <text x="216" y="123" font-size="10.5" fill="#333" filter="url(#rough2)">{4,4}</text>
  <text x="336" y="123" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="386" y="123" font-size="10.5" fill="#333" filter="url(#rough2)">4:2</text>
  <text x="484" y="123" font-size="10.5" fill="#999" filter="url(#rough2)">null</text>

  <!-- r3 -->
  <rect x="20" y="134" width="520" height="32" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="34" y="155" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 2</text>
  <text x="122" y="155" font-size="10.5" fill="#333" filter="url(#rough2)">[4,4,2]</text>
  <text x="216" y="155" font-size="10.5" fill="#333" filter="url(#rough2)">{2,4,4}</text>
  <text x="336" y="155" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="386" y="155" font-size="10.5" fill="#333" filter="url(#rough2)">4:2, 2:1</text>
  <text x="484" y="155" font-size="10.5" fill="#999" filter="url(#rough2)">null</text>

  <!-- r4 -->
  <rect x="20" y="166" width="520" height="32" fill="#f7fafc" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="34" y="187" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">add 3</text>
  <text x="122" y="187" font-size="10.5" fill="#333" filter="url(#rough2)">[4,4,2,3]</text>
  <text x="216" y="187" font-size="10.5" fill="#333" filter="url(#rough2)">{2,3,4,4}</text>
  <text x="336" y="187" font-size="10.5" fill="#333" filter="url(#rough2)">13</text>
  <text x="386" y="187" font-size="10.5" fill="#333" filter="url(#rough2)">4:2, 2:1, 3:1</text>
  <text x="484" y="187" font-size="10.5" fill="#999" filter="url(#rough2)">null</text>

  <!-- r5 getMean -->
  <rect x="20" y="198" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="34" y="219" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">getMean</text>
  <text x="122" y="219" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">13 // 4 = 3.25 → 取 3</text>
  <text x="484" y="219" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- r6 getMedian -->
  <rect x="20" y="230" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="34" y="251" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">getMedian</text>
  <text x="122" y="251" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">n=4 偶：(3+4)//2 = 3.5 → 取 3</text>
  <text x="484" y="251" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- r7 getMode -->
  <rect x="20" y="262" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="34" y="283" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">getMode</text>
  <text x="122" y="283" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">4 出现 2 次最多</text>
  <text x="484" y="283" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- r8 remove -->
  <rect x="20" y="294" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="34" y="315" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">removeFirst</text>
  <text x="122" y="315" font-size="10.5" fill="#333" filter="url(#rough2)">[4,2,3]</text>
  <text x="216" y="315" font-size="10.5" fill="#333" filter="url(#rough2)">{2,3,4}</text>
  <text x="336" y="315" font-size="10.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="386" y="315" font-size="10.5" fill="#333" filter="url(#rough2)">4:1, 2:1, 3:1</text>
  <text x="484" y="315" font-size="10.5" fill="#999" filter="url(#rough2)">null</text>

  <!-- r9 getMode -->
  <rect x="20" y="326" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="34" y="347" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">getMode</text>
  <text x="122" y="347" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">全都 1 次 → 并列取最小 = 2（堆弹掉过期 (−2,4)）</text>
  <text x="484" y="347" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 底部注 -->
  <rect x="30" y="372" width="500" height="46" fill="#f4f4f4" stroke="#999" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="391" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">输出序列：[null, null, null, null, null, 3, 3, 4, null, 2]</text>
  <text x="280" y="409" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">四个「影子」全程同步：队列管 FIFO、sum 管均值、多重集管中位、哈希+堆管众数</text>
</svg>
