  <rect x="142" y="106" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="121" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">200</text>
