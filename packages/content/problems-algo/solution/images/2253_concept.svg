  <text x="114" y="72" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">LC_Store</text>
  <rect x="142" y="56" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="72" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">Nozama</text>
