  <text x="576" y="192" text-anchor="middle" font-size="8" fill="#4a7a3a">1900</text>

  <text x="520" y="212" text-anchor="middle" font-size="7" fill="#888">null 行已丢弃，只剩 6 行</text>

  <!-- ===== Bottom: core challenge note ===== -->
  <rect x="30" y="226" width="600" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="330" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">核心挑战：列名（商店名）动态未知，无法硬编码</text>

  <text x="48" y="270" font-size="9" fill="#446688" font-weight="bold">① 静态 UNPIVOT（列名已知时）</text>
  <text x="48" y="284" font-size="8" fill="#666" font-family="monospace">SELECT product_id, 'LC_Store' store, LC_Store price FROM Products WHERE LC_Store IS NOT NULL</text>
  <text x="48" y="296" font-size="8" fill="#666" font-family="monospace">UNION ALL SELECT product_id, 'Nozama' store, Nozama price FROM Products WHERE Nozama IS NOT NULL</text>
  <text x="48" y="308" font-size="8" fill="#b85450">→ 每个商店一列，手写 N 个 SELECT...UNION ALL。但本题商店名动态变化，此法不通！</text>

  <text x="48" y="332" font-size="9" fill="#b85450" font-weight="bold">② 动态 SQL（列名未知时）—— 本题正解</text>
  <text x="48" y="346" font-size="8" fill="#666">从 information_schema.columns 动态发现列名 → GROUP_CONCAT 拼出 UNION 字符串 → PREPARE + EXECUTE</text>
  <text x="48" y="358" font-size="8" fill="#888">列名不再是代码字面量，而是运行时从 schema 读取的数据 —— 把「列名」数据化</text>

  <text x="48" y="382" font-size="9" fill="#4a7a3a" font-weight="bold">③ 三步合一</text>
  <rect x="48" y="388" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="133" y="400" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">information_schema</text>
  <text x="133" y="411" text-anchor="middle" font-size="7" fill="#4a7a3a">发现列名</text>
  <text x="222" y="402" font-size="12" fill="#666">→</text>
  <rect x="240" y="388" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="325" y="400" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">GROUP_CONCAT</text>
  <text x="325" y="411" text-anchor="middle" font-size="7" fill="#d6a040">拼 UNION 字符串</text>
  <text x="414" y="402" font-size="12" fill="#666">→</text>
  <rect x="432" y="388" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="517" y="400" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">PREPARE + EXECUTE</text>
  <text x="517" y="411" text-anchor="middle" font-size="7" fill="#b85450">执行动态 SQL</text>
</svg>
