  <text x="282" y="72" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">Souq</text>

  <!-- Row 1: 1, 100, null, 110, null -->
  <rect x="30" y="82" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="97" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <rect x="86" y="82" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
