  <rect x="40" y="168" width="12" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="176" font-size="8" fill="#4a7a3a">有价格</text>
  <rect x="110" y="168" width="12" height="10" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="128" y="176" font-size="8" fill="#b85450">null = 无此商品 → 丢弃</text>

  <!-- ===== Middle: UNPIVOT arrow ===== -->
  <rect x="312" y="92" width="76" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="350" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">UNPIVOT</text>
  <text x="350" y="120" text-anchor="middle" font-size="7" fill="#888">列→行</text>
  <path d="M 312 110 L 300 110" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 400 110 L 420 110" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Right: Result table (long) ===== -->
  <text x="520" y="50" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">结果（长表 / unpivot 格式）</text>

  <rect x="424" y="56" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="452" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">product_id</text>
  <rect x="480" y="56" width="72" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="516" y="70" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">store</text>
  <rect x="552" y="56" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="576" y="70" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">price</text>

  <!-- 6 result rows -->
  <rect x="424" y="80" width="56" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="92" text-anchor="middle" font-size="8" fill="#446688">1</text>
  <rect x="480" y="80" width="72" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="92" text-anchor="middle" font-size="8" fill="#d6a040">LC_Store</text>
  <rect x="552" y="80" width="48" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="576" y="92" text-anchor="middle" font-size="8" fill="#4a7a3a">100</text>

  <rect x="424" y="100" width="56" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="112" text-anchor="middle" font-size="8" fill="#446688">1</text>
  <rect x="480" y="100" width="72" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="112" text-anchor="middle" font-size="8" fill="#d6a040">Shop</text>
  <rect x="552" y="100" width="48" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="576" y="112" text-anchor="middle" font-size="8" fill="#4a7a3a">110</text>

  <rect x="424" y="120" width="56" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="132" text-anchor="middle" font-size="8" fill="#446688">2</text>
  <rect x="480" y="120" width="72" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="132" text-anchor="middle" font-size="8" fill="#d6a040">Nozama</text>
  <rect x="552" y="120" width="48" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="576" y="132" text-anchor="middle" font-size="8" fill="#4a7a3a">200</text>

  <rect x="424" y="140" width="56" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="152" text-anchor="middle" font-size="8" fill="#446688">2</text>
  <rect x="480" y="140" width="72" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="152" text-anchor="middle" font-size="8" fill="#d6a040">Souq</text>
  <rect x="552" y="140" width="48" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="576" y="152" text-anchor="middle" font-size="8" fill="#4a7a3a">190</text>

  <rect x="424" y="160" width="56" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="172" text-anchor="middle" font-size="8" fill="#446688">3</text>
  <rect x="480" y="160" width="72" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="172" text-anchor="middle" font-size="8" fill="#d6a040">Shop</text>
  <rect x="552" y="160" width="48" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="576" y="172" text-anchor="middle" font-size="8" fill="#4a7a3a">1000</text>

  <rect x="424" y="180" width="56" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="192" text-anchor="middle" font-size="8" fill="#446688">3</text>
  <rect x="480" y="180" width="72" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="192" text-anchor="middle" font-size="8" fill="#d6a040">Souq</text>
