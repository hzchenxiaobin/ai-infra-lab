<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算</text>

  <!-- Left: DFS order grid -->
  <text x="130" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">DFS 探索顺序 + 格子消耗</text>

  <!-- Row 0 -->
  <rect x="40" y="55" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">①</text>
  <text x="65" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a">S/0</text>

  <rect x="115" y="55" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="76" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">④</text>
  <text x="140" y="93" text-anchor="middle" font-size="9" fill="#d6a040">5</text>

  <rect x="190" y="55" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑤</text>
  <text x="215" y="93" text-anchor="middle" font-size="9" fill="#b85450">T/1</text>

  <!-- Row 1 -->
  <rect x="40" y="130" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="151" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">②</text>
  <text x="65" y="168" text-anchor="middle" font-size="9" fill="#d6a040">1</text>

  <rect x="115" y="130" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="151" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③</text>
  <text x="140" y="168" text-anchor="middle" font-size="9" fill="#d6a040">1</text>

  <rect x="190" y="130" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="151" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⑥</text>
  <text x="215" y="168" text-anchor="middle" font-size="9" fill="#d6a040">2</text>

  <text x="130" y="200" text-anchor="middle" font-size="10" fill="#888">move(d) 返回消耗 → 记入 cost[]，move(oppo) 回溯</text>

  <!-- Arrow to Dijkstra table -->
  <path d="M248 155 L285 155" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right: Dijkstra step table -->
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Dijkstra 逐步松弛</text>

  <!-- Table header -->
  <rect x="290" y="55" width="210" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="70" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">pop</text>
  <text x="355" y="70" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">d</text>
  <text x="425" y="70" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">relax</text>
  <text x="485" y="70" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">result</text>

  <!-- Row 1: (0,0) d=0 -->
  <rect x="290" y="77" width="210" height="20" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="91" text-anchor="middle" font-size="9.5" fill="#333">(0,0)</text>
  <text x="355" y="91" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="425" y="91" text-anchor="middle" font-size="9.5" fill="#333">(1,0)→1, (0,1)→5</text>
  <text x="485" y="91" text-anchor="middle" font-size="9.5" fill="#888">—</text>

  <!-- Row 2: (1,0) d=1 -->
  <rect x="290" y="97" width="210" height="20" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="111" text-anchor="middle" font-size="9.5" fill="#333">(1,0)</text>
  <text x="355" y="111" text-anchor="middle" font-size="9.5" fill="#333">1</text>
  <text x="425" y="111" text-anchor="middle" font-size="9.5" fill="#333">(1,1)→2</text>
  <text x="485" y="111" text-anchor="middle" font-size="9.5" fill="#888">—</text>

  <!-- Row 3: (1,1) d=2 -->
  <rect x="290" y="117" width="210" height="20" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="131" text-anchor="middle" font-size="9.5" fill="#333">(1,1)</text>
  <text x="355" y="131" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="425" y="131" text-anchor="middle" font-size="9.5" fill="#333">(1,2)→4</text>
  <text x="485" y="131" text-anchor="middle" font-size="9.5" fill="#888">—</text>

  <!-- Row 4: (1,2) d=4 -->
  <rect x="290" y="137" width="210" height="20" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="151" text-anchor="middle" font-size="9.5" fill="#333">(1,2)</text>
  <text x="355" y="151" text-anchor="middle" font-size="9.5" fill="#333">4</text>
  <text x="425" y="151" text-anchor="middle" font-size="9.5" fill="#333">(0,2)→5</text>
  <text x="485" y="151" text-anchor="middle" font-size="9.5" fill="#888">—</text>

  <!-- Row 5: (0,1) d=5, no update -->
  <rect x="290" y="157" width="210" height="20" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="171" text-anchor="middle" font-size="9.5" fill="#333">(0,1)</text>
  <text x="355" y="171" text-anchor="middle" font-size="9.5" fill="#333">5</text>
  <text x="425" y="171" text-anchor="middle" font-size="9.5" fill="#888">无更新</text>
  <text x="485" y="171" text-anchor="middle" font-size="9.5" fill="#888">—</text>

  <!-- Row 6: (0,2)=T d=5, return -->
  <rect x="290" y="177" width="210" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="192" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">(0,2)=T</text>
  <text x="355" y="192" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">5</text>
  <text x="425" y="192" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <text x="485" y="192" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">return 5 ✓</text>

  <!-- column lines -->
  <line x1="330" y1="55" x2="330" y2="199" stroke="#ddd" stroke-width="1"/>
  <line x1="380" y1="55" x2="380" y2="199" stroke="#ddd" stroke-width="1"/>
  <line x1="470" y1="55" x2="470" y2="199" stroke="#ddd" stroke-width="1"/>

  <text x="400" y="214" text-anchor="middle" font-size="10" fill="#888">弹出目标时 d=5 即最小消耗</text>

  <!-- Bottom: path comparison -->
  <rect x="30" y="230" width="460" height="135" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：步数少 ≠ 消耗小</text>

  <!-- Path A (red) -->
  <rect x="50" y="262" width="200" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="150" y="280" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">路径 A：(0,0)→(0,1)→(0,2)</text>
  <text x="150" y="296" text-anchor="middle" font-size="10" fill="#b85450">2 步，消耗 5+1 = 6 ✗</text>

  <!-- Path B (green) -->
  <rect x="270" y="262" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="370" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">路径 B：(0,0)→(1,0)→(1,1)→(1,2)→(0,2)</text>
  <text x="370" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a">4 步，消耗 1+1+2+1 = 5 ✓</text>

  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#888">BFS 按步数选 A（6），Dijkstra 按消耗选 B（5）→ 加权必须 Dijkstra</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#aaa">两阶段解耦：DFS 收集加权图 → Dijkstra 在已知图上求最小消耗路径</text>
</svg>
