<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：DFS 逐位构造数字</text>

  <!-- Start: enumerate first digit -->
  <rect x="190" y="44" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">枚举首位 first ∈ [1, 9]</text>
  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Call dfs(first, n−1) -->
  <rect x="190" y="98" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333">调用 dfs(num, remain)</text>
  <path d="M 280 132 L 280 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: remain == 0? -->
  <polygon points="280,150 410,196 280,242 150,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#444">remain == 0 ?</text>
  <text x="280" y="208" text-anchor="middle" font-size="10" fill="#888">(已填满 n 位)</text>

  <!-- Yes: collect -->
  <path d="M 410 196 L 460 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="428" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="464" y="178" width="84" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="506" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">收集 num</text>
  <text x="506" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a">加入 ans</text>
  <!-- return after collect -->
  <path d="M 506 218 L 506 452 L 300 452" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="510" y="340" font-size="10" fill="#4a7a3a">return</text>

  <!-- No: compute last digit -->
  <path d="M 280 242 L 280 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="256" font-size="11" fill="#888">否</text>

  <rect x="190" y="264" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="285" text-anchor="middle" font-size="12" fill="#333">last = num % 10</text>
  <path d="M 280 296 L 280 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Candidate set -->
  <rect x="150" y="318" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#444">候选 cands = { last + k,  last − k }</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888">（集合自动去重，k=0 时合并为一个）</text>
  <path d="M 280 358 L 280 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: for each d in cands, 0<=d<=9? -->
  <polygon points="280,378 420,420 280,462 140,420" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#444">对每个 d ∈ cands：</text>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#444">0 ≤ d ≤ 9 ?</text>

  <!-- Yes: recurse -->
  <path d="M 140 420 L 70 420 L 70 116 L 190 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="412" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="36" y="256" width="68" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a">递归</text>
  <text x="70" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a">dfs(num·10+d,</text>
  <text x="70" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a"> remain−1)</text>

  <!-- No: skip -->
  <path d="M 420 420 L 470 420" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="414" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="474" y="408" width="74" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="511" y="426" text-anchor="middle" font-size="11" fill="#b85450">跳过（丢弃）</text>

  <!-- End -->
  <rect x="220" y="442" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="461" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>
</svg>
