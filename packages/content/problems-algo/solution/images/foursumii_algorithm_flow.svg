<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建表 → 遍历 B 组 → 查表累加</text>

  <!-- Step 1: Build hash -->
  <rect x="120" y="46" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 建表：count = {}</text>
  <path d="M 260 82 L 260 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: enumerate i -->
  <rect x="60" y="102" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="122" text-anchor="middle" font-size="11" fill="#333">for a in nums1:</text>
  <path d="M 150 134 L 150 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: enumerate j -->
  <rect x="100" y="150" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="170" text-anchor="middle" font-size="11" fill="#333">for b in nums2:</text>
  <path d="M 190 182 L 190 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: store sum -->
  <rect x="120" y="198" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="218" text-anchor="middle" font-size="11" fill="#333">count[a + b] += 1</text>
  <path d="M 230 230 L 230 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- divider -->
  <line x1="40" y1="260" x2="480" y2="260" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- Step 5: query -->
  <rect x="120" y="272" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 查表：ans = 0</text>
  <path d="M 260 308 L 260 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: enumerate k, l -->
  <rect x="100" y="328" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="348" text-anchor="middle" font-size="11" fill="#333">for c, d in nums3 × nums4:</text>
  <path d="M 210 360 L 210 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 7: query and accumulate -->
  <rect x="100" y="376" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="220" y="396" text-anchor="middle" font-size="11" fill="#333">ans += count[−(c + d)]</text>
  <path d="M 220 408 L 220 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="160" y="424" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="444" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- side annotations -->
  <text x="370" y="218" font-size="10" fill="#888">← O(n²) 次</text>
  <text x="370" y="396" font-size="10" fill="#888">← O(n²) 次</text>
</svg>
