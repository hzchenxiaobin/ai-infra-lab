<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：生成斐波那契数列 + 贪心相减</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">两阶段：① 生成 ≤ k 的斐波那契数 ② 从大到小贪心减</text>

  <!-- ===== Phase 1: Generate Fibonacci ===== -->
  <rect x="30" y="64" width="270" height="180" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.4" filter="url(#rough2)"/>
  <text x="165" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段 ① 生成斐波那契数列</text>

  <!-- Start node -->
  <rect x="120" y="98" width="90" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="118" text-anchor="middle" font-size="11" fill="#333">fib = [1, 1]</text>

  <path d="M 165 132 L 165 152" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop diamond -->
  <polygon points="165,156 235,186 165,216 95,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="184" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">fib.back()</text>
  <text x="165" y="196" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">≤ k ?</text>

  <!-- Yes branch -->
  <path d="M 235 186 L 268 186" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="232" y="208" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a">追加 F_n =</text>
  <text x="262" y="233" text-anchor="middle" font-size="9" fill="#4a7a3a">F_{n-1}+F_{n-2}</text>
  <path d="M 262 208 L 262 196 L 235 190" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- No branch (down) -->
  <path d="M 165 216 L 165 232" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="228" font-size="10" fill="#b85450" font-weight="bold">否, 结束</text>

  <!-- Phase 1 done -->
  <rect x="105" y="234" width="120" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">得到升序 fib 列表</text>

  <!-- ===== Phase 2: Greedy subtraction ===== -->
  <rect x="320" y="64" width="270" height="300" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.4" filter="url(#rough2)"/>
  <text x="455" y="86" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">阶段 ② 贪心相减</text>

  <!-- Init node -->
  <rect x="400" y="98" width="110" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="455" y="118" text-anchor="middle" font-size="11" fill="#333">rem = k, ans = 0</text>

  <path d="M 455 132 L 455 152" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop: for f in reversed(fib) -->
  <rect x="380" y="156" width="150" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="455" y="176" text-anchor="middle" font-size="10" fill="#333">for f in reversed(fib)</text>

  <path d="M 455 190 L 455 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: f <= rem? -->
  <polygon points="455,214 535,244 455,274 375,244" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="242" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">f ≤ rem ?</text>
  <text x="455" y="254" text-anchor="middle" font-size="9" fill="#888">(倒序遍历)</text>

  <!-- Yes: subtract -->
  <path d="M 375 244 L 345 244" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="328" y="256" width="80" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="368" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a">rem -= f</text>
  <text x="368" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <!-- loop back up -->
  <path d="M 368 256 L 368 240 L 380 234" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- No: skip (next iteration) -->
  <path d="M 535 244 L 560 244" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="238" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="560" y="258" font-size="9" fill="#888">跳过,</text>
  <text x="560" y="270" font-size="9" fill="#888">下一个</text>
  <path d="M 560 258 L 560 190 L 530 186" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- rem == 0? exit -->
  <path d="M 455 274 L 455 300" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="455,304 515,324 455,344 395,324" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">rem == 0 ?</text>
  <text x="455" y="335" text-anchor="middle" font-size="9" fill="#888">可提前 break</text>

  <path d="M 395 324 L 365 324" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="318" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="335" y="336" width="60" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="365" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- ===== Bottom: complexity ===== -->
  <rect x="30" y="340" width="270" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">复杂度</text>
  <text x="165" y="380" text-anchor="middle" font-size="11" fill="#333">时间 O(log k)：约 44 个斐波那契数</text>
  <text x="165" y="394" text-anchor="middle" font-size="11" fill="#333">空间 O(log k)：存 fib 列表</text>

  <text x="310" y="428" text-anchor="middle" font-size="10" fill="#888">两阶段一趟扫完：生成时多生成一个 &gt; k 的数无妨，相减时自动跳过</text>
</svg>
