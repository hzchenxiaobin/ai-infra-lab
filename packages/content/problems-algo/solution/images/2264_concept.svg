<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：长度 3 的滑动窗口，三字符相同即「好整数」</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">只需记录出现过的最大数字 d，答案 = ddd 或空串</text>

  <!-- ===== String num = "6777133339" ===== -->
  <text x="28" y="86" font-size="10.5" fill="#666">num</text>
  <!-- index labels -->
  <text x="70" y="76" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="114" y="76" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="158" y="76" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="202" y="76" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="246" y="76" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="290" y="76" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="334" y="76" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="378" y="76" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="422" y="76" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="466" y="76" text-anchor="middle" font-size="9" fill="#888">9</text>

  <!-- boxes; highlight 777 (i=1..3) orange, 333 (i=5..7) green -->
  <rect x="50"  y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70"  y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="94"  y="80" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="138" y="80" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="182" y="80" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="226" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="80" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="314" y="80" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="358" y="80" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="402" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="446" y="80" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>

  <!-- sliding window bracket at i=1 (boxes 1,2,3) -->
  <path d="M 94 122 Q 94 132 114 134 L 202 134 Q 222 132 222 122" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="158" y="150" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">窗口 i=1：777 ✓</text>

  <!-- sliding window bracket at i=5 (boxes 5,6,7) -->
  <path d="M 270 122 Q 270 132 290 134 L 378 134 Q 398 132 398 122" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="334" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 i=5：333 ✓</text>

  <!-- ===== two candidates row ===== -->
  <text x="28" y="186" font-size="10.5" fill="#666">候选</text>
  <!-- 777 orange -->
  <rect x="80" y="170" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">777</text>
  <text x="140" y="216" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">数字 d = 7</text>
  <!-- 333 green -->
  <rect x="300" y="170" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">333</text>
  <text x="360" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">数字 d = 3</text>

  <!-- compare arrow -->
  <text x="270" y="192" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">VS</text>

  <!-- ===== max selection ===== -->
  <line x1="140" y1="224" x2="140" y2="248" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="360" y1="224" x2="360" y2="248" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="250" y="244" font-size="11" fill="#b85450" font-weight="bold">max(7, 3) = 7 → 取较大数字</text>

  <!-- best tracker -->
  <rect x="120" y="256" width="300" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="279" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">best = max(best, num[i]) = 7</text>

  <!-- arrow to result -->
  <line x1="270" y1="292" x2="270" y2="312" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="150" y="318" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="345" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">返回 "777"</text>

  <!-- footer note -->
  <rect x="40" y="370" width="465" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="272" y="387" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">一次遍历 O(n)：遇三连相同即比 max，无需收集全部子串</text>
</svg>
