<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">双数组不等式 → 单数组数对计数</text>

  <!-- Box A: original inequality -->
  <rect x="50" y="50" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">nums1[i] − nums1[j]  ≤  nums2[i] − nums2[j] + diff</text>

  <!-- arrow down + note -->
  <path d="M280 96 L280 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="110" font-size="11" fill="#666" filter="url(#rough2)">移项：把含 nums2 的项移到左、含 nums1 的项合并</text>

  <!-- Box B: grouped -->
  <rect x="50" y="124" width="460" height="50" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">( <tspan fill="#4a7a3a" font-weight="bold">nums1[i] − nums2[i]</tspan> ) ≤ ( <tspan fill="#d6a040" font-weight="bold">nums1[j] − nums2[j]</tspan> ) + diff</text>
  <!-- underbrace labels -->
  <path d="M150 174 L150 168 L210 168 L210 174" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="190" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b[i]</text>
  <path d="M350 174 L350 168 L410 168 L410 174" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="190" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">b[j]</text>

  <!-- arrow down + note -->
  <path d="M280 198 L280 218" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="212" font-size="11" fill="#666" filter="url(#rough2)">令 b[k] = nums1[k] − nums2[k]（一次预处理）</text>

  <!-- Box C: simplified -->
  <rect x="60" y="226" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)"><tspan fill="#4a7a3a" font-weight="bold">b[i]</tspan> ≤ <tspan fill="#d6a040" font-weight="bold">b[j]</tspan> + diff</text>
  <text x="280" y="278" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0 ≤ i &lt; j &lt; n  →  数 (i, j) 对，单数组计数问题</text>

  <!-- footer note -->
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">即统计 b[i] − b[j] ≤ diff 且 i &lt; j 的数对个数</text>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">与 493 翻转对 / 315 右侧小于当前 同为「跨段计数」家族</text>
</svg>
