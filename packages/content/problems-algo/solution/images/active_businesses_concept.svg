<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：算每种事件均值 → 逐行比较 → 统计超过均值的事件种类数 ≥ 2</text>

  <!-- ===== Left: Events table ===== -->
  <text x="105" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Events 表（原始）</text>
  <rect x="20" y="58" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="73" font-size="7.5" fill="#446688" font-weight="bold">biz_id</text>
  <text x="85" y="73" font-size="7.5" fill="#446688" font-weight="bold">event_type</text>
  <text x="155" y="73" font-size="7.5" fill="#446688" font-weight="bold">occ</text>
  <line x1="55" y1="58" x2="55" y2="80" stroke="#446688" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="125" y1="58" x2="125" y2="80" stroke="#446688" stroke-width="0.7" filter="url(#rough2)"/>

  <!-- row: biz1 reviews 7 -->
  <rect x="20" y="80" width="170" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="92" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="85" y="92" text-anchor="middle" font-size="8" fill="#333">reviews</text>
  <text x="155" y="92" text-anchor="middle" font-size="8" fill="#333">7</text>

  <!-- row: biz3 reviews 3 -->
  <rect x="20" y="96" width="170" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="108" text-anchor="middle" font-size="8" fill="#888">3</text>
  <text x="85" y="108" text-anchor="middle" font-size="8" fill="#888">reviews</text>
  <text x="155" y="108" text-anchor="middle" font-size="8" fill="#888">3</text>

  <!-- row: biz1 ads 11 -->
  <rect x="20" y="112" width="170" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="124" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="85" y="124" text-anchor="middle" font-size="8" fill="#333">ads</text>
  <text x="155" y="124" text-anchor="middle" font-size="8" fill="#333">11</text>

  <!-- row: biz2 ads 7 -->
  <rect x="20" y="128" width="170" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="140" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="85" y="140" text-anchor="middle" font-size="8" fill="#888">ads</text>
  <text x="155" y="140" text-anchor="middle" font-size="8" fill="#888">7</text>

  <!-- row: biz3 ads 6 -->
  <rect x="20" y="144" width="170" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="156" text-anchor="middle" font-size="8" fill="#888">3</text>
  <text x="85" y="156" text-anchor="middle" font-size="8" fill="#888">ads</text>
  <text x="155" y="156" text-anchor="middle" font-size="8" fill="#888">6</text>

  <!-- row: biz1 page views 3 -->
  <rect x="20" y="160" width="170" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="172" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="85" y="172" text-anchor="middle" font-size="8" fill="#888">page views</text>
  <text x="155" y="172" text-anchor="middle" font-size="8" fill="#888">3</text>

  <!-- row: biz2 page views 12 -->
  <rect x="20" y="176" width="170" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="188" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="85" y="188" text-anchor="middle" font-size="8" fill="#888">page views</text>
  <text x="155" y="188" text-anchor="middle" font-size="8" fill="#888">12</text>

  <!-- arrow ① from Events to avg -->
  <path d="M192 128 L225 128" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="208" y="122" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">①</text>
  <text x="208" y="140" text-anchor="middle" font-size="7" fill="#d6a040">AVG</text>

  <!-- ===== Middle: avg per event_type ===== -->
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每种事件平均次数</text>
  <rect x="225" y="58" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="73" font-size="8" fill="#4a7a3a" font-weight="bold">event_type</text>
  <text x="345" y="73" font-size="8" fill="#4a7a3a" font-weight="bold">avg_occ</text>
  <line x1="305" y1="58" x2="305" y2="80" stroke="#4a7a3a" stroke-width="0.7" filter="url(#rough2)"/>

  <rect x="225" y="80" width="170" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="93" text-anchor="middle" font-size="9" fill="#333">reviews</text>
  <text x="345" y="93" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">5</text>

  <rect x="225" y="98" width="170" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="111" text-anchor="middle" font-size="9" fill="#333">ads</text>
  <text x="345" y="111" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">8</text>

  <rect x="225" y="116" width="170" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="129" text-anchor="middle" font-size="9" fill="#333">page views</text>
  <text x="345" y="129" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">7.5</text>

  <rect x="225" y="140" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="156" text-anchor="middle" font-size="8" fill="#4a7a3a">reviews: (7+3)/2=5</text>
  <text x="310" y="170" text-anchor="middle" font-size="8" fill="#4a7a3a">ads: (11+7+6)/3=8</text>

  <!-- arrow ② from avg to exceed rows -->
  <path d="M397 110 L430 110" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="413" y="104" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">②</text>
  <text x="413" y="122" text-anchor="middle" font-size="7" fill="#d6a040">JOIN</text>

  <!-- ===== Right: exceed rows ===== -->
  <text x="525" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">超过均值的行</text>
  <rect x="430" y="58" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="73" font-size="8" fill="#b85450" font-weight="bold">biz_id</text>
  <text x="520" y="73" font-size="8" fill="#b85450" font-weight="bold">event_type</text>
  <text x="575" y="73" font-size="8" fill="#b85450" font-weight="bold">occ</text>
  <line x1="485" y1="58" x2="485" y2="80" stroke="#b85450" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="550" y1="58" x2="550" y2="80" stroke="#b85450" stroke-width="0.7" filter="url(#rough2)"/>

  <rect x="430" y="80" width="170" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="93" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="520" y="93" text-anchor="middle" font-size="9" fill="#333">reviews</text>
  <text x="575" y="93" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">7&gt;5</text>

  <rect x="430" y="98" width="170" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="111" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="520" y="111" text-anchor="middle" font-size="9" fill="#333">ads</text>
  <text x="575" y="111" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">11&gt;8</text>

  <rect x="430" y="116" width="170" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="129" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="520" y="129" text-anchor="middle" font-size="9" fill="#333">page views</text>
  <text x="575" y="129" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">12&gt;7.5</text>

  <!-- arrow ③ down to count -->
  <path d="M515 142 L515 175" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="540" y="160" font-size="8" fill="#d6a040" font-weight="bold">③</text>
  <text x="548" y="160" font-size="7" fill="#d6a040">COUNT</text>

  <!-- ===== Bottom: count per business + HAVING ===== -->
  <rect x="20" y="200" width="580" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY business_id + HAVING COUNT(event_type) &gt; 1</text>

  <rect x="50" y="228" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="243" text-anchor="middle" font-size="9" fill="#333">biz 1: 超过 <tspan fill="#b85450" font-weight="bold">2</tspan> 种 → <tspan fill="#4a7a3a" font-weight="bold">活跃 ✓</tspan></text>

  <rect x="230" y="228" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="243" text-anchor="middle" font-size="9" fill="#333">biz 2: 超过 <tspan fill="#b85450" font-weight="bold">1</tspan> 种 → <tspan fill="#888">不活跃 ✗</tspan></text>

  <rect x="410" y="228" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="490" y="243" text-anchor="middle" font-size="9" fill="#333">biz 3: 超过 <tspan fill="#b85450" font-weight="bold">0</tspan> 种 → <tspan fill="#888">不活跃 ✗</tspan></text>

  <!-- ===== Key insight box ===== -->
  <rect x="20" y="272" width="580" height="172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="292" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键洞察：活跃 = 超过均值的事件种类 ≥ 2</text>

  <text x="40" y="314" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">① GROUP BY event_type + AVG(occurences)</tspan> 算出每种事件的平均次数（reviews=5, ads=8, page views=7.5）</text>
  <text x="40" y="334" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">② JOIN</tspan> 回 Events 表，<tspan fill="#b85450" font-weight="bold">WHERE occ &gt; avg_occ</tspan> 筛出每个业务超过均值的事件行</text>
  <text x="40" y="354" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">③ GROUP BY business_id + HAVING COUNT(*) &gt; 1</tspan> 统计每业务超过几种 → 只留 ≥ 2 种的</text>
  <text x="40" y="376" font-size="9.5" fill="#333">• ⚠️ <tspan fill="#b85450" font-weight="bold">"more than one" = 种类数 ≥ 2</tspan>，不是"至少一种"。biz 2 虽然 page views 超均值，但只 1 种 → 不活跃</text>
  <text x="40" y="396" font-size="9.5" fill="#333">• <tspan fill="#446688" font-weight="bold">窗口函数替代</tspan>：occ &gt; AVG(occ) OVER (PARTITION BY event_type) 直接在行级打标记，免去 JOIN</text>
  <text x="40" y="416" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">复合主键 (business_id, event_type)</tspan> 保证同业务同事件只有一行，COUNT(*) 即种类数</text>
  <text x="40" y="436" font-size="9.5" fill="#333">• 输出仅 <tspan fill="#b85450" font-weight="bold">business_id</tspan> 列，结果无特定顺序要求</text>
</svg>
