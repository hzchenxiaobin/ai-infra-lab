<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：打标记 → 前缀和还原 → 逐位比较</text>

  <!-- 开始 -->
  <rect x="200" y="38" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 66 L 260 84" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1：建 diff -->
  <rect x="150" y="88" width="220" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">建差分数组 diff[0..n] 全 0</text>
  <text x="260" y="118" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">长度 n+1，末位是哨兵</text>
  <path d="M 260 124 L 260 142" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：遍历查询 -->
  <rect x="118" y="146" width="284" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">遍历每条查询 [l, r]（每条 O(1)）</text>
  <text x="260" y="181" text-anchor="middle" font-size="11" fill="#7a5a1a" filter="url(#rough2)">diff[l] += 1 ； diff[r+1] −= 1</text>
  <text x="260" y="194" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">只在端点打 ±1 标记，不碰区间内部</text>
  <path d="M 260 198 L 260 216" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3：前缀和 + 比较 -->
  <rect x="106" y="220" width="308" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">一遍扫描：cov += diff[i]（滚动前缀和）</text>
  <text x="260" y="255" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">当场与 nums[i] 比较，不足立即判负</text>
  <text x="260" y="268" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">i = 0, 1, …, n−1</text>
  <path d="M 260 272 L 260 290" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,294 372,330 260,366 148,330" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">所有 i 都满足</text>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cov[i] ≥ nums[i] ？</text>

  <!-- true 分支 -->
  <path d="M 372 330 L 408 330" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="388" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="412" y="314" width="88" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="456" y="335" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">true ✓</text>

  <!-- false 分支 -->
  <path d="M 148 330 L 112 330" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="132" y="322" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="20" y="314" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="65" y="335" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false ✗</text>

  <!-- 底部注 -->
  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">时间 O(n + q)：打标记 O(q) + 还原比较 O(n)；diff 多开一位哨兵吸收 diff[r+1]</text>
</svg>
