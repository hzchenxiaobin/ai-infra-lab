<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3（zero=3, one=3, limit=2）：dp 表逐格填</text>

  <!-- header row -->
  <rect x="100" y="46" width="48" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="124" y="70" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">i＼j</text>
  <rect x="148" y="46" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="70" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">j=0</text>
  <rect x="196" y="46" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="70" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">j=1</text>
  <rect x="244" y="46" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="70" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">j=2</text>
  <rect x="292" y="46" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="70" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">j=3</text>

  <!-- row labels -->
  <rect x="100" y="84" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="108" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">i=0</text>
  <rect x="100" y="124" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="148" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">i=1</text>
  <rect x="100" y="164" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="188" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">i=2</text>
  <rect x="100" y="204" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="228" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">i=3</text>

  <!-- row 0 -->
  <rect x="148" y="84" width="48" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="172" y="108" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">空</text>
  <rect x="196" y="84" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="244" y="84" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="268" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="292" y="84" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="316" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- row 1 -->
  <rect x="148" y="124" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="196" y="124" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="244" y="124" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="268" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="292" y="124" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="316" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 2 -->
  <rect x="148" y="164" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="196" y="164" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="244" y="164" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="268" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="292" y="164" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="316" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- row 3 -->
  <rect x="148" y="204" width="48" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="196" y="204" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="244" y="204" width="48" height="38" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="268" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="292" y="204" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="316" y="229" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">14</text>

  <text x="220" y="260" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">表值 = dp[i][j][0] + dp[i][j][1]（末尾 0 的方案数 + 末尾 1 的方案数）</text>

  <!-- right annotations -->
  <line x1="342" y1="223" x2="356" y2="223" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="360" y="84" width="190" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="102" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">(0,3) = 0：[1,1,1]</text>
  <text x="455" y="119" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">连续 3 个 1 &gt; 2 ✗</text>

  <rect x="360" y="140" width="190" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="158" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">(3,0) = 0：[0,0,0]</text>
  <text x="455" y="175" text-anchor="middle" font-size="11.5" fill="#8c2f28" filter="url(#rough2)">对称同理 ✗</text>

  <rect x="360" y="196" width="190" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="219" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">(3,3) = 14 = 7 + 7</text>
  <text x="455" y="239" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">末尾 0 与末尾 1 各 7 个</text>

  <!-- bottom trace -->
  <rect x="30" y="272" width="500" height="114" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">手推 (3,3)：dp[3][3][0] = dp[2][3][1] + dp[1][3][1] = 5 + 2 = 7</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· L=1：给「2 个 0、3 个 1、末尾 1」的 5 个数组各接 1 个 0</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">· L=2：给「1 个 0、3 个 1、末尾 1」的 2 个（[1,0,1,1]、[1,1,0,1]）各接 2 个 0</text>
  <text x="280" y="352" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">对称地 dp[3][3][1] = dp[3][2][0] + dp[3][1][0] = 5 + 2 = 7，合计 7 + 7 = 14 ✓</text>
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">官方列出的 14 个数组恰好 7 个以 0 结尾、7 个以 1 结尾；(0,0) 为空数组哨兵</text>
</svg>
