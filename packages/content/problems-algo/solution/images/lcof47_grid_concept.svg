<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">礼物的最大价值：每步只能「向右」或「向下」走一格</text>

  <!-- Grid 3x3, cell 56x46, origin (160, 60) -->
  <!-- row 0: 1,3,1 -->
  <rect x="160" y="60" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="216" y="60" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="272" y="60" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="90" text-anchor="middle" font-size="16" fill="#333">1</text>
  <!-- row 1: 1,5,1 -->
  <rect x="160" y="106" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="136" text-anchor="middle" font-size="16" fill="#333">1</text>
  <rect x="216" y="106" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="136" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  <rect x="272" y="106" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="16" fill="#333">1</text>
  <!-- row 2: 4,2,1 -->
  <rect x="160" y="152" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="182" text-anchor="middle" font-size="16" fill="#333">4</text>
  <rect x="216" y="152" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="182" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="272" y="152" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="182" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>

  <!-- coordinate labels -->
  <text x="150" y="88" text-anchor="end" font-size="10" fill="#888">(0,0)</text>
  <text x="150" y="134" text-anchor="end" font-size="10" fill="#888">(1,0)</text>
  <text x="150" y="180" text-anchor="end" font-size="10" fill="#888">(2,0)</text>
  <text x="188" y="216" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <text x="244" y="216" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <text x="300" y="216" text-anchor="middle" font-size="10" fill="#888">j=2</text>

  <!-- optimal path arrows (orange): (0,0)->(0,1)->(1,1)->(2,1)->(2,2) -->
  <path d="M 216 83 L 214 83" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 244 106 L 244 104" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 244 152 L 244 150" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 272 175 L 270 175" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- movement rule illustration on a sample cell (1,1)=5 -->
  <!-- arrow from (0,1)=3 down to (1,1)=5 : "from above" -->
  <path d="M 360 60 L 360 106" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="86" font-size="11" fill="#446688">上方</text>
  <!-- arrow from (1,0)=1 right to (1,1)=5 : "from left" -->
  <path d="M 340 129 L 386 129" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="122" font-size="11" fill="#446688">左方</text>

  <!-- sample mini grid for dependency illustration -->
  <rect x="334" y="40" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="70" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="390" y="40" width="56" height="46" fill="#f6f6f6" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="70" text-anchor="middle" font-size="11" fill="#888">?</text>
  <rect x="334" y="86" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="116" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="390" y="86" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="418" y="116" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <text x="446" y="116" font-size="10" fill="#888">(i,j)</text>

  <!-- right/down move legend -->
  <rect x="334" y="150" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="394" y="168" text-anchor="middle" font-size="11" fill="#333">每步只能</text>
  <text x="394" y="183" text-anchor="middle" font-size="11" fill="#333">→ 向右 或 ↓ 向下</text>

  <!-- legend boxes -->
  <rect x="40" y="240" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="262" text-anchor="middle" font-size="11.5" fill="#444">橙色 = 最优路径 1→3→5→2→1 = 12</text>

  <rect x="270" y="240" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="262" text-anchor="middle" font-size="11.5" fill="#444">虚线 = (i,j) 的值只能来自「上方」或「左方」</text>

  <!-- summary -->
  <rect x="40" y="290" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#444">只能向右/向下 → 路径无环、无后效性 → dp[i][j] = max(上, 左) + grid[i][j]</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#888">与 64 最小路径和互为 max/min 镜像，骨架完全一致</text>
</svg>
