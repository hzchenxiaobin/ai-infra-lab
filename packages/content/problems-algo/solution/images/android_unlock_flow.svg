<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">安卓手势解锁：回溯剪枝算法流程</text>

  <!-- Start -->
  <rect x="220" y="44" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始：枚举长度 len ∈ [m,n]</text>

  <path d="M 300 76 L 300 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Outer loop: start point -->
  <rect x="200" y="94" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="12" fill="#333">枚举起点 start ∈ {1..9}</text>

  <path d="M 300 130 L 300 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="210" y="148" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="#333">visited[start]=true，调用 backtrack</text>

  <path d="M 300 180 L 300 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: step == target? -->
  <polygon points="300,200 380,240 300,280 220,240" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">step ==</text>
  <text x="300" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">target?</text>

  <!-- Yes branch -->
  <path d="M 380 240 L 430 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="405" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="432" y="226" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="472" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 1</text>

  <!-- No branch -->
  <path d="M 300 280 L 300 296" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="292" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Loop next -->
  <rect x="190" y="298" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#333">遍历 next ∈ {1..9}</text>

  <path d="M 300 330 L 300 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: visited[next]? -->
  <polygon points="300,346 380,380 300,414 220,380" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="378" text-anchor="middle" font-size="10" fill="#333">visited[next]?</text>

  <path d="M 380 380 L 430 380" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="405" y="374" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="432" y="366" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="472" y="384" text-anchor="middle" font-size="10" fill="#b85450">跳过</text>

  <path d="M 300 414 L 300 428" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="424" font-size="10" fill="#4a7a3a">否</text>

  <!-- Decision: skip check -->
  <polygon points="300,430 390,466 300,502 210,466" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="460" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">skip[cur][next]!=0</text>
  <text x="300" y="474" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">&amp;&amp; !visited[mid]?</text>
  <text x="300" y="488" text-anchor="middle" font-size="9" fill="#888">（中间点未访问）</text>

  <!-- Yes: prune -->
  <path d="M 390 466 L 430 466" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="410" y="460" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="432" y="452" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="482" y="470" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">剪枝！跳过</text>

  <!-- No: recurse -->
  <path d="M 210 466 L 150 466" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="460" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="20" y="446" width="128" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="84" y="464" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">选 → 递归 → 撤销</text>
  <text x="84" y="480" text-anchor="middle" font-size="9" fill="#555">visited[next]=true</text>

  <!-- back arrow to loop -->
  <path d="M 84 446 L 84 314 L 190 314" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="306" font-size="9" fill="#888">回溯返回，继续遍历</text>

  <text x="300" y="514" text-anchor="middle" font-size="11" fill="#888">核心：step==target 返回 1；否则遍历 next，查 skip 矩阵剪掉「中间点未访问」的非法跳转</text>
</svg>
