<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 取前 k → 反悔替换</text>

  <!-- Step 1: sort -->
  <rect x="200" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 按 profit 降序排序</text>
  <path d="M 280 88 L 280 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: take top-k -->
  <rect x="170" y="106" width="220" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 取前 k 项作骨架</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#555">累计 total；新类别入 set</text>
  <text x="280" y="160" text-anchor="middle" font-size="10" fill="#b85450">重复项 profit 压入反悔栈</text>
  <path d="M 280 172 L 280 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: initial ans -->
  <rect x="170" y="190" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = total + |set|²</text>
  <path d="M 280 234 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: loop -->
  <rect x="150" y="252" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 遍历剩余项 (i = k .. n−1)</text>
  <path d="M 280 296 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: new category? -->
  <path d="M 280 312 L 360 348 L 280 384 L 200 348 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">类别不在 set</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">且栈非空？</text>

  <!-- No branch -->
  <path d="M 200 348 L 110 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="340" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="40" y="332" width="68" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="74" y="353" text-anchor="middle" font-size="10" fill="#666">跳过</text>
  <path d="M 74 332 L 74 300 L 280 300" stroke="#bbb" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="294" text-anchor="middle" font-size="9" fill="#888">继续下一项</text>

  <!-- Yes branch -->
  <path d="M 280 384 L 280 400" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="396" font-size="10" fill="#4a7a3a">是</text>

  <!-- replace box -->
  <rect x="120" y="404" width="320" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">替换：弹出栈顶 removed</text>
  <text x="280" y="444" text-anchor="middle" font-size="11" fill="#555">total += p − removed；set.add(c)</text>
  <text x="280" y="462" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = max(ans, total + |set|²)</text>

  <!-- loop back arrow -->
  <path d="M 440 440 L 500 440 L 500 272 L 410 272" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="506" y="356" text-anchor="middle" font-size="9" fill="#888" transform="rotate(90 506 356)">循环下一项</text>

  <!-- end -->
  <path d="M 280 476 L 280 492" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="496" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="518" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>
</svg>
