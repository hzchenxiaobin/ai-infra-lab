<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">按 nums2 降序扫描：之前都已 ≥ 当前，用小顶堆保留前缀最大的 k−1 个 nums1</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">钦定当前 i 的 nums2[i] 作 min，配前面最大的 k−1 个 nums1 凑成 k 个</text>

  <!-- sorted sequence of pairs -->
  <text x="40" y="84" font-size="11" fill="#446688" font-weight="bold">已排序（nums2↓）：</text>
  <g font-size="12">
    <!-- index labels -->
    <text x="70" y="118" text-anchor="middle" font-size="9" fill="#888">i=3</text>
    <text x="140" y="118" text-anchor="middle" font-size="9" fill="#888">i=2</text>
    <text x="210" y="118" text-anchor="middle" font-size="9" fill="#888">i=0</text>
    <text x="280" y="118" text-anchor="middle" font-size="9" fill="#888">i=1</text>

    <!-- nums1 row (blue) -->
    <text x="40" y="142" font-size="10" fill="#446688" font-weight="bold">nums1</text>
    <rect x="48" y="128" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="147" text-anchor="middle" fill="#333">2</text>
    <rect x="118" y="128" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="147" text-anchor="middle" fill="#333">3</text>
    <rect x="188" y="128" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="210" y="147" text-anchor="middle" fill="#333">1</text>
    <rect x="258" y="128" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="147" text-anchor="middle" fill="#333">3</text>

    <!-- nums2 row (orange) -->
    <text x="40" y="178" font-size="10" fill="#d6a040" font-weight="bold">nums2</text>
    <rect x="48" y="164" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="183" text-anchor="middle" fill="#333">4</text>
    <rect x="118" y="164" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="183" text-anchor="middle" fill="#333">3</text>
    <rect x="188" y="164" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="210" y="183" text-anchor="middle" fill="#333">2</text>
    <rect x="258" y="164" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="183" text-anchor="middle" fill="#333">1</text>
  </g>

  <!-- descending arrow -->
  <path d="M 70 100 L 270 100" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="170" y="94" text-anchor="middle" font-size="9" fill="#888">nums2 由大到小</text>

  <!-- current i marker at i=0 (third column) -->
  <rect x="184" y="120" width="52" height="78" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="210" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">当前 i=0</text>
  <text x="210" y="230" text-anchor="middle" font-size="9" fill="#b85450">nums2[0]=2 作 min</text>

  <!-- "已扫过" bracket over first two -->
  <path d="M 70 108 Q 70 96 105 96 L 105 96 Q 140 96 140 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="105" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">前面都 ≥ 2 ✓</text>

  <!-- min-heap box -->
  <text x="430" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">小顶堆（容量 k−1=2）</text>
  <text x="430" y="98" text-anchor="middle" font-size="9" fill="#888">存已扫过的最大 k−1 个 nums1</text>
  <g font-size="12">
    <rect x="378" y="118" width="104" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="430" y="140" text-anchor="middle" fill="#333" font-weight="bold">堆顶 = 最小者</text>
    <text x="400" y="170" text-anchor="middle" fill="#4a7a3a" font-size="11">2</text>
    <text x="460" y="170" text-anchor="middle" fill="#4a7a3a" font-size="11">3</text>
    <text x="430" y="184" text-anchor="middle" font-size="9" fill="#888">↑ sum=5</text>
  </g>

  <!-- arrow from heap to current: sum + nums1[i] -->
  <path d="M 378 135 L 236 135" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="306" y="128" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">sum + nums1[i]</text>

  <!-- bottom note box -->
  <rect x="30" y="258" width="540" height="134" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="284" font-size="12" fill="#444" font-weight="bold">解耦要点：分数 = (nums1 之和) × (nums2 之最小)</text>
  <text x="50" y="306" font-size="11" fill="#555">① 排序定极值：按 nums2 降序，使当前 i 自然成为子序列里 nums2 的最小</text>
  <text x="50" y="324" font-size="11" fill="#555">② 堆维护前缀 Top：小顶堆容量 k−1，存"已扫过中最大的 k−1 个 nums1"</text>
  <text x="50" y="342" font-size="11" fill="#555">③ 候选 = (堆和 + nums1[i]) × nums2[i]，取所有候选的最大</text>
  <text x="50" y="362" font-size="10" fill="#888">把"选哪 k 个"的指数搜索 → "枚举 min 来自谁"的线性扫描 + 堆</text>
  <text x="50" y="380" font-size="10" fill="#888">同构题：857 雇佣 K 名工人（ratio 升序 + 大顶堆，方向相反）</text>
</svg>
