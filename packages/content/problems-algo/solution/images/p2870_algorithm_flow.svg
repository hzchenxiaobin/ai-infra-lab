<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：计数 → 逐组判定 → 累加 ⌈f/3⌉</text>

  <!-- start -->
  <rect x="228" y="46" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 280 80 L 280 98" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count -->
  <rect x="185" y="102" width="190" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">哈希表统计频率 cnt</text>

  <path d="M 280 140 L 280 158" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop head -->
  <rect x="185" y="162" width="190" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">取下一个值的频率 f</text>

  <path d="M 280 200 L 280 218" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: f == 1 ? -->
  <polygon points="280,222 358,266 280,310 202,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold" filter="url(#rough2)">f == 1 ?</text>

  <!-- yes branch -->
  <path d="M 358 266 L 416 266" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="384" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="420" y="244" width="112" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="476" y="271" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <!-- no branch -->
  <path d="M 280 310 L 280 328" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="324" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- accumulate -->
  <rect x="185" y="332" width="190" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">ans += (f + 2) / 3</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">即 ⌈f / 3⌉，整数向上取整</text>

  <path d="M 280 372 L 280 388" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: done ? -->
  <polygon points="280,392 352,434 280,476 208,434" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="439" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold" filter="url(#rough2)">还有值?</text>

  <!-- loop back -->
  <path d="M 208 434 L 128 434 L 128 181 L 181 181" fill="none" stroke="#666" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="310" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">有</text>

  <!-- yes -> return -->
  <path d="M 280 476 L 280 494" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="490" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">没有了</text>

  <rect x="213" y="498" width="134" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="525" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
