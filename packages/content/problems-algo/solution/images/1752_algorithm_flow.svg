<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟遍历统计环下降数，drops ≤ 1 即合法</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="56" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <!-- arrow start -> init -->
  <path d="M 260 74 L 260 84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init rect -->
  <rect x="160" y="88" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">drops = 0, n = len(nums)</text>
  <text x="260" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">下降计数器清零</text>

  <!-- arrow init -> diamond1 -->
  <path d="M 260 130 L 260 138" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: i < n ? center (260, 168) -->
  <polygon points="260,140 332,168 260,196 188,168" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ？</text>
  <text x="260" y="180" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">遍历下标</text>

  <!-- 是: diamond1 bottom -> process top -->
  <path d="M 260 196 L 260 216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="212" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Process rect -->
  <rect x="120" y="220" width="280" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">比较 nums[i] 与 nums[(i+1) % n]</text>
  <text x="260" y="262" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">if nums[i] &gt; nums[(i+1) % n]：</text>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">drops += 1</text>

  <!-- loop back: process right -> up -> diamond1 right -->
  <path d="M 400 257 L 448 257 L 448 168 L 332 168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="216" font-size="10" fill="#888" filter="url(#rough2)">i++，重复</text>

  <!-- 否: diamond1 left -> left margin -> down -> diamond2 left -->
  <path d="M 188 168 L 110 168 L 110 380 L 180 380" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="162" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="64" y="278" font-size="9.5" fill="#888" filter="url(#rough2)">遍历完</text>

  <!-- Diamond2: drops <= 1 ? center (260, 380) -->
  <polygon points="260,350 340,380 260,410 180,380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">drops ≤ 1 ？</text>
  <text x="260" y="392" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">下降数至多 1</text>

  <!-- 是: diamond2 right -> return true -->
  <path d="M 340 380 L 392 380" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="374" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <ellipse cx="438" cy="380" rx="52" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="438" y="385" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- 否: diamond2 bottom -> return false -->
  <path d="M 260 410 L 260 432" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="428" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <ellipse cx="260" cy="454" rx="56" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="459" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>
</svg>
