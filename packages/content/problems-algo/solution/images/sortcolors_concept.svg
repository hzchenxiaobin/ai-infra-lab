<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三指针把数组切成四段</text>

  <!-- four segments -->
  <!-- [0,p0): 0s (blue-ish fill) -->
  <rect x="40" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="88" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <!-- [p0,i): 1s (green) -->
  <rect x="136" y="58" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="58" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- [i,p2]: unscanned (grey) -->
  <rect x="232" y="58" width="44" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="79" text-anchor="middle" font-size="12" fill="#aaa">?</text>
  <rect x="280" y="58" width="44" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="79" text-anchor="middle" font-size="12" fill="#aaa">?</text>
  <!-- (p2,n]: 2s (red) -->
  <rect x="328" y="58" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="376" y="58" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- segment brackets + labels -->
  <path d="M 42 50 L 42 44 L 130 44 L 130 50" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="86" y="38" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">已放好的 0</text>
  <path d="M 138 50 L 138 44 L 226 44 L 226 50" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="182" y="38" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">已放好的 1</text>
  <path d="M 234 50 L 234 44 L 322 44 L 322 50" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="278" y="38" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">未扫描</text>
  <path d="M 330 50 L 330 44 L 418 44 L 418 50" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="374" y="38" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">已放好的 2</text>

  <!-- pointer labels -->
  <text x="136" y="116" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">p0</text>
  <path d="M 136 120 L 136 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="232" y="116" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">i</text>
  <path d="M 232 120 L 232 100" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="328" y="116" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">p2</text>
  <path d="M 328 120 L 328 100" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <!-- invariant box -->
  <rect x="30" y="140" width="480" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="162" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">循环不变量（始终成立）</text>
  <text x="50" y="184" font-size="11.5" fill="#446688">• [0, p0) 全是 0</text>
  <text x="50" y="202" font-size="11.5" fill="#4a7a3a">• [p0, i) 全是 1</text>
  <text x="50" y="220" font-size="11.5" fill="#b85450">• (p2, n) 全是 2</text>
  <text x="280" y="184" font-size="11.5" fill="#888">• [i, p2] 待处理</text>
  <text x="280" y="208" font-size="11" fill="#555">p0：下一个 0 的位置</text>
  <text x="280" y="224" font-size="11" fill="#555">p2：下一个 2 的位置</text>

  <!-- footer -->
  <rect x="30" y="248" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">一趟扫描 + 原地交换 → 0/1/2 各自归位</text>
  <text x="270" y="286" text-anchor="middle" font-size="11" fill="#888">荷兰国旗问题（Dijkstra 三向划分）</text>

  <rect x="30" y="304" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="328" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">O(n) 时间，O(1) 空间，一趟完成</text>
</svg>
