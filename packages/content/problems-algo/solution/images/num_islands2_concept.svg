<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：加一块地 → 先 +1，再与陆地邻居 union 抵消</text>

  <!-- left: grid with new land + 4 neighbors -->
  <text x="120" y="58" text-anchor="middle" font-size="11.5" fill="#888">在 (r,c) 新加陆地（红框）</text>

  <!-- 3x3 grid centered at x=120 -->
  <!-- row 0 -->
  <rect x="72" y="70" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="88" y="90" text-anchor="middle" font-size="11" fill="#333">L</text>
  <rect x="104" y="70" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="120" y="90" text-anchor="middle" font-size="11" fill="#333">L</text>
  <rect x="136" y="70" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="90" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <!-- row 1 -->
  <rect x="72" y="102" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="88" y="122" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <!-- new land highlight -->
  <rect x="104" y="102" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">L</text>
  <rect x="136" y="102" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="152" y="122" text-anchor="middle" font-size="11" fill="#333">L</text>
  <!-- row 2 -->
  <rect x="72" y="134" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="88" y="154" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="104" y="134" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="154" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="136" y="134" width="32" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="152" y="154" text-anchor="middle" font-size="11" fill="#aaa">~</text>

  <!-- neighbor arrows: up / down / left / right from new land center (120,118) -->
  <text x="120" y="68" text-anchor="middle" font-size="9.5" fill="#b85450">↑ 上</text>
  <text x="120" y="178" text-anchor="middle" font-size="9.5" fill="#b85450">↓ 下</text>
  <text x="62" y="122" text-anchor="middle" font-size="9.5" fill="#b85450">←左</text>
  <text x="178" y="122" text-anchor="middle" font-size="9.5" fill="#b85450">右→</text>

  <text x="120" y="190" text-anchor="middle" font-size="10.5" fill="#888">查 4 邻居，是陆地就 union</text>

  <!-- right: union-find tree -->
  <text x="380" y="58" text-anchor="middle" font-size="11.5" fill="#888">并查集（一维 parent 数组）</text>

  <!-- index mapping note -->
  <rect x="290" y="68" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="400" y="86" text-anchor="middle" font-size="10.5" fill="#444">idx = r × n + c （二维展平一维）</text>

  <!-- before union: two trees -->
  <text x="320" y="116" font-size="10.5" fill="#888">加地前：</text>
  <!-- tree A: root 0 with child 1 -->
  <circle cx="300" cy="138" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="300" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="350" cy="138" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="350" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <line x1="336" y1="138" x2="314" y2="138" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- tree B: root 5 (the (1,2) land) -->
  <circle cx="450" cy="138" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="450" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- new node 4 = (1,1) joins -->
  <text x="320" y="178" font-size="10.5" fill="#b85450" font-weight="bold">加 (1,1)→idx 4：</text>
  <circle cx="380" cy="196" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="402" y="200" font-size="10" fill="#b85450">count+1</text>

  <!-- arrows to neighbors (0-root tree via 1, and 5) -->
  <path d="M 368 196 Q 340 168 318 152" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="328" y="176" font-size="9.5" fill="#b85450">邻居1</text>
  <path d="M 394 196 Q 422 168 446 152" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="176" font-size="9.5" fill="#b85450">邻居5</text>

  <!-- after union -->
  <text x="320" y="236" font-size="10.5" fill="#4a7a3a" font-weight="bold">union 后：</text>
  <circle cx="300" cy="258" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="340" cy="288" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="292" text-anchor="middle" font-size="10" fill="#333">1</text>
  <circle cx="380" cy="288" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <circle cx="420" cy="288" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="292" text-anchor="middle" font-size="10" fill="#333">5</text>
  <line x1="340" y1="278" x2="308" y2="266" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="380" y1="278" x2="308" y2="266" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="420" y1="278" x2="308" y2="266" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a">异根 → union → count−1×2</text>

  <!-- key insight box -->
  <rect x="20" y="328" width="500" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每加一块地：count+1，再对每个陆地邻居 union 抵消</text>
  <text x="270" y="363" text-anchor="middle" font-size="11" fill="#555">异根才 union（count−1），同根不动——避免重复减</text>
</svg>
