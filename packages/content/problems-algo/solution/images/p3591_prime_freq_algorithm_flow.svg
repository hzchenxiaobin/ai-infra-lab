<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次桶计数 + 逐桶判质数</text>

  <!-- ============ 主流程 ============ -->
  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="170" y="36" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14"/>
    <text x="240" y="55" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">开始：读入 nums</text>
  </g>
  <path d="M 240 66 L 240 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 桶计数 -->
  <g filter="url(#rough2)">
    <rect x="150" y="86" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="240" y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">for x in nums：</text>
    <text x="240" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt[x] += 1</text>
  </g>
  <path d="M 240 120 L 240 136" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一个频次 -->
  <g filter="url(#rough2)">
    <rect x="150" y="140" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="240" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取下一个桶的频次 f</text>
  </g>
  <path d="M 240 172 L 240 188" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：还有 f？ -->
  <g filter="url(#rough2)">
    <polygon points="240,192 296,224 240,256 184,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="240" y="228" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">还有 f？</text>
  </g>

  <!-- 否 → return false -->
  <path d="M 296 224 L 330 224" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="216" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="334" y="206" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="394" y="228" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return false</text>
  </g>

  <!-- 是 ↓ -->
  <path d="M 240 256 L 240 272" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="268" font-size="9.5" fill="#999" filter="url(#rough2)">是</text>

  <!-- 菱形2：isPrime(f)？ -->
  <g filter="url(#rough2)">
    <polygon points="240,276 302,310 240,344 178,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="240" y="306" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">isPrime(f)？</text>
    <text x="240" y="320" text-anchor="middle" font-size="8.5" fill="#8a6d1f">见右侧拆解</text>
  </g>

  <!-- 是 → return true -->
  <path d="M 178 310 L 148 310" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="302" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="28" y="292" width="118" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="87" y="314" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">return true ✓</text>
  </g>

  <!-- 否 → 回环到「取下一个」 -->
  <path d="M 302 310 L 360 310 L 360 156 L 334 156" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="352" y="240" font-size="9.5" fill="#999" filter="url(#rough2)">否</text>

  <!-- ============ isPrime 拆解框 ============ -->
  <g filter="url(#rough2)">
    <rect x="348" y="46" width="152" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" rx="8"/>
    <text x="424" y="64" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">isPrime(f) 拆解</text>
    <text x="358" y="84" font-size="9.5" fill="#333">1. f &lt; 2（0 或 1）→ ✗</text>
    <text x="358" y="102" font-size="9.5" fill="#333">2. d = 2 开始试除：</text>
    <text x="368" y="118" font-size="9.5" fill="#333">d·d ≤ f 期间：</text>
    <text x="378" y="134" font-size="9.5" fill="#333">f % d == 0 → ✗</text>
    <text x="358" y="154" font-size="9.5" fill="#333">3. 循环跑完无因子 → ✓</text>
    <text x="358" y="170" font-size="8" fill="#666">f ≤ 100 ⇒ 至多试除到 10</text>
  </g>

  <!-- ============ 底部注解 ============ -->
  <g filter="url(#rough2)">
    <rect x="60" y="362" width="400" height="28" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="8"/>
    <text x="260" y="380" text-anchor="middle" font-size="8.5" fill="#666">桶共 101 个，先扫一遍 O(n) 计数，再对非零频次逐个判质数，发现一个质数频次即提前返回</text>
  </g>
</svg>
