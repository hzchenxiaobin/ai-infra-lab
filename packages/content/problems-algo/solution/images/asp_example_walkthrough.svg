<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：按日期区间匹配 → 逐产品加权平均</text>

  <!-- ===== 产品 1 ===== -->
  <rect x="30" y="44" width="520" height="190" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="64" font-size="12" fill="#446688" font-weight="bold">产品 1</text>

  <text x="44" y="88" font-size="10.5" fill="#333">价格段: 02/17–02/28 ¥5</text>
  <text x="240" y="88" font-size="10.5" fill="#333">← 销售: 02/25 × 100 件</text>
  <text x="430" y="88" font-size="10.5" fill="#4a7a3a" font-weight="bold">5 × 100 = 500</text>

  <text x="44" y="110" font-size="10.5" fill="#333">价格段: 03/01–03/22 ¥20</text>
  <text x="240" y="110" font-size="10.5" fill="#333">← 销售: 03/01 × 15 件</text>
  <text x="430" y="110" font-size="10.5" fill="#4a7a3a" font-weight="bold">20 × 15 = 300</text>

  <line x1="44" y1="122" x2="536" y2="122" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="44" y="142" font-size="10.5" fill="#555">总收入 = 500 + 300 =</text>
  <text x="200" y="142" font-size="11" fill="#b85450" font-weight="bold">800</text>
  <text x="300" y="142" font-size="10.5" fill="#555">总销量 = 100 + 15 =</text>
  <text x="440" y="142" font-size="11" fill="#b85450" font-weight="bold">115</text>

  <text x="44" y="166" font-size="11" fill="#555">average_price = 800 / 115 = 6.956...</text>
  <text x="310" y="166" font-size="12" fill="#4a7a3a" font-weight="bold">→ ROUND = 6.96 ✓</text>

  <text x="44" y="190" font-size="9.5" fill="#888">💡 100 件按低价 ¥5 卖，仅 15 件按高价 ¥20 卖 → 加权均价远低于简单平均 (5+20)/2=12.5</text>

  <!-- ===== 产品 2 ===== -->
  <rect x="30" y="248" width="520" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="268" font-size="12" fill="#4a7a3a" font-weight="bold">产品 2</text>

  <text x="44" y="292" font-size="10.5" fill="#333">价格段: 02/01–02/20 ¥15</text>
  <text x="240" y="292" font-size="10.5" fill="#333">← 销售: 02/10 × 200 件</text>
  <text x="430" y="292" font-size="10.5" fill="#4a7a3a" font-weight="bold">15 × 200 = 3000</text>

  <text x="44" y="314" font-size="10.5" fill="#333">价格段: 02/21–03/31 ¥30</text>
  <text x="240" y="314" font-size="10.5" fill="#333">← 销售: 03/22 × 30 件</text>
  <text x="430" y="314" font-size="10.5" fill="#4a7a3a" font-weight="bold">30 × 30 = 900</text>

  <line x1="44" y1="326" x2="536" y2="326" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="44" y="346" font-size="10.5" fill="#555">总收入 = 3000 + 900 =</text>
  <text x="210" y="346" font-size="11" fill="#b85450" font-weight="bold">3900</text>
  <text x="300" y="346" font-size="10.5" fill="#555">总销量 = 200 + 30 =</text>
  <text x="450" y="346" font-size="11" fill="#b85450" font-weight="bold">230</text>

  <text x="44" y="370" font-size="11" fill="#555">average_price = 3900 / 230 = 16.956...</text>
  <text x="320" y="370" font-size="12" fill="#4a7a3a" font-weight="bold">→ ROUND = 16.96 ✓</text>

  <text x="44" y="394" font-size="9.5" fill="#888">💡 200 件按 ¥15 卖占绝大多数 → 加权均价接近低价，远离简单平均 (15+30)/2=22.5</text>

  <rect x="30" y="452" width="520" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="470" text-anchor="middle" font-size="10.5" fill="#555">💡 公式：average_price = ROUND( Σ(price × units) / Σ(units) , 2 )</text>
</svg>
