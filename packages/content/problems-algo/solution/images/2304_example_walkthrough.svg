<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1：grid=[[5,3],[4,0],[2,1]]  逐行 DP 表</text>

  <!-- ===== Header row (y=46..78) ===== -->
  <rect x="40" y="46" width="460" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="110" y1="46" x2="110" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="46" x2="270" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="46" x2="370" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="75"  y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">行 i</text>
  <text x="190" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">grid[i][0], grid[i][1]</text>
  <text x="320" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">dp[i][0]</text>
  <text x="425" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">dp[i][1]</text>

  <!-- ===== Data area (y=78..210, 3 rows × 44) ===== -->
  <rect x="40" y="78" width="460" height="132" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <!-- row separators -->
  <line x1="40" y1="122" x2="500" y2="122" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="166" x2="500" y2="166" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <!-- column separators -->
  <line x1="110" y1="78" x2="110" y2="210" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="78" x2="270" y2="210" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="78" x2="370" y2="210" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- highlight path cells: (0,0) value col0 row0; (1,1) dp col1 row1; (2,1) dp col1 row2 -->
  <rect x="110" y="78" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="370" y="122" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <rect x="370" y="166" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="75"  y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">5, 3</text>
  <text x="320" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="425" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <!-- row 1 -->
  <text x="75"  y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4, 0</text>
  <text x="320" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">23</text>
  <text x="425" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">8</text>
  <!-- row 2 -->
  <text x="75"  y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2, 1</text>
  <text x="320" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">19</text>
  <text x="425" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">17</text>

  <!-- path arrows along highlighted path: (0,0)val -> (1,1)dp -> (2,1)dp -->
  <path d="M150,122 C 250,140 350,140 425,122" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M425,166 L425,166" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="226" width="460" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="248" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">最优路径：(0,0)=5 —→ (1,1)=0 —→ (2,1)=1</text>
  <text x="60" y="268" font-size="12" fill="#333" filter="url(#rough2)">单元格值之和：5 + 0 + 1 = 6</text>
  <text x="60" y="286" font-size="12" fill="#333" filter="url(#rough2)">移动代价：moveCost[5][1]=3（5→0列1） + moveCost[0][1]=8（0→1列1）= 11</text>
  <text x="60" y="304" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">总代价 = 6 + 11 = 17  ✓  （= dp[2][1]）</text>

  <!-- arrow path along dp column -->
  <path d="M425,110 L425,150" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M425,154 L425,192" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
