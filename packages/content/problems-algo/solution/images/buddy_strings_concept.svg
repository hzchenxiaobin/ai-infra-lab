<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">亲密字符串：两种成立情形</text>

  <!-- ============ Case 1: s == goal ============ -->
  <rect x="24" y="42" width="472" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="12" fill="#d6a040" font-weight="bold">情形一：s == goal → 需存在重复字符</text>

  <!-- positive: s="aa" goal="aa" -->
  <text x="40" y="96" font-size="11" fill="#555" font-weight="bold">s=goal=</text>
  <rect x="100" y="82" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="138" y="82" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <!-- swap arc -->
  <path d="M 117 82 Q 136 64 155 82" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <text x="186" y="102" font-size="10.5" fill="#4a7a3a" font-weight="bold">交换两相同字符 → 不变</text>
  <rect x="360" y="86" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ true ✓</text>

  <!-- negative: s="ab" goal="ab" -->
  <text x="40" y="146" font-size="11" fill="#555" font-weight="bold">s=goal=</text>
  <rect x="100" y="132" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <rect x="138" y="132" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>
  <path d="M 117 132 Q 136 114 155 132" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" marker-start="url(#arrL)" filter="url(#rough2)"/>
  <text x="186" y="152" font-size="10.5" fill="#b85450" font-weight="bold">交换 → "ba" ≠ "ab"</text>
  <rect x="360" y="136" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ false ✗</text>

  <!-- ============ Case 2: s != goal ============ -->
  <rect x="24" y="196" width="472" height="164" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="218" font-size="12" fill="#446688" font-weight="bold">情形二：s != goal → 恰两处不同且交叉相等</text>

  <!-- positive: s="ab" goal="ba" -->
  <text x="40" y="248" font-size="11" fill="#555" font-weight="bold">s=</text>
  <rect x="64" y="234" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="254" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <rect x="102" y="234" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="254" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">b</text>
  <text x="40" y="290" font-size="11" fill="#555" font-weight="bold">g=</text>
  <rect x="64" y="276" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="296" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">b</text>
  <rect x="102" y="276" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="296" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <!-- diff rings -->
  <circle cx="81" cy="249" r="20" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <circle cx="119" cy="249" r="20" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <!-- cross arrows -->
  <path d="M 81 264 Q 100 270 119 276" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 119 264 Q 100 270 81 276" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="148" y="268" font-size="10" fill="#4a7a3a" font-weight="bold">2 处不同</text>
  <text x="148" y="282" font-size="10" fill="#4a7a3a" font-weight="bold">交叉相等</text>
  <rect x="232" y="250" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="292" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ true ✓</text>

  <!-- negative: s="abc" goal="adc" only 1 diff -->
  <text x="370" y="248" font-size="11" fill="#555" font-weight="bold">s=</text>
  <rect x="394" y="234" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="409" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <rect x="426" y="234" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="441" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <rect x="458" y="234" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="473" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c</text>
  <text x="370" y="290" font-size="11" fill="#555" font-weight="bold">g=</text>
  <rect x="394" y="276" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="409" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <rect x="426" y="276" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="441" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">d</text>
  <rect x="458" y="276" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="473" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c</text>
  <circle cx="441" cy="249" r="18" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="370" y="320" font-size="10" fill="#b85450" font-weight="bold">仅 1 处不同 → false ✗</text>

  <!-- bottom prerequisite -->
  <rect x="120" y="370" width="280" height="24" fill="#f8f8f8" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="387" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">前提：len(s) == len(goal)，否则直接 false</text>
</svg>
