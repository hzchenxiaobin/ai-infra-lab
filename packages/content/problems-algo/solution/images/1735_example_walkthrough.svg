<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：queries = [[2,6], [5,1], [73,660]]</text>

  <!-- ===== Example 1: [2, 6] ===== -->
  <rect x="30" y="44" width="540" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="66" font-size="12" fill="#446688" font-weight="bold">查询 [n=2, k=6]</text>

  <text x="50" y="88" font-size="11" fill="#333">分解：6 = 2¹ × 3¹</text>

  <!-- p=2, e=1 -->
  <rect x="50" y="98" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="117" text-anchor="middle" font-size="11" fill="#333">p=2, e=1: C(2+1−1, 1) = C(2,1) = 2</text>

  <text x="262" y="116" font-size="14" fill="#888" font-weight="bold">×</text>

  <!-- p=3, e=1 -->
  <rect x="280" y="98" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="380" y="117" text-anchor="middle" font-size="11" fill="#333">p=3, e=1: C(2+1−1, 1) = C(2,1) = 2</text>

  <text x="492" y="116" font-size="14" fill="#888" font-weight="bold">=</text>

  <rect x="440" y="130" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="500" y="149" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 4 ✓</text>

  <!-- ===== Example 2: [5, 1] ===== -->
  <rect x="30" y="176" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="198" font-size="12" fill="#4a7a3a" font-weight="bold">查询 [n=5, k=1]</text>
  <text x="50" y="218" font-size="11" fill="#333">k=1 → 无质因子 → 全 1 数组 [1,1,1,1,1] → 唯一方案</text>
  <rect x="430" y="190" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="209" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 1 ✓</text>

  <!-- ===== Example 3: [73, 660] ===== -->
  <rect x="30" y="244" width="540" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="266" font-size="12" fill="#d6a040" font-weight="bold">查询 [n=73, k=660]</text>

  <text x="50" y="288" font-size="11" fill="#333">分解：660 = 2² × 3¹ × 5¹ × 11¹</text>

  <!-- 4 factor rows -->
  <rect x="50" y="298" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="316" text-anchor="middle" font-size="10" fill="#333">p=2, e=2: C(74, 2) = 2701</text>

  <rect x="50" y="330" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="348" text-anchor="middle" font-size="10" fill="#333">p=3, e=1: C(73, 1) = 73</text>

  <rect x="50" y="362" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="380" text-anchor="middle" font-size="10" fill="#333">p=5, e=1: C(73, 1) = 73</text>

  <rect x="50" y="394" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="412" text-anchor="middle" font-size="10" fill="#333">p=11, e=1: C(73, 1) = 73</text>

  <!-- multiply arrow -->
  <path d="M 300 411 Q 340 411 360 411" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result calc -->
  <rect x="370" y="310" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2701 × 73³</text>
  <text x="460" y="350" text-anchor="middle" font-size="11" fill="#333">= 1050734917</text>

  <!-- mod result -->
  <path d="M 460 372 Q 460 384 460 396" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="370" y="400" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="423" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mod 1e9+7 = 50734910 ✓</text>
</svg>
