<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：埃氏筛预处理 + 顺序枚举配对</text>

  <!-- step 1: early return -->
  <polygon points="280,52 380,82 280,112 180,82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n &lt; 4 ?</text>

  <rect x="410" y="66" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="88" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return []</text>
  <path d="M 380 82 L 408 82" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="394" y="76" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <text x="190" y="100" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 280 112 L 280 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: sieve -->
  <rect x="150" y="142" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">埃氏筛：标记 isPrime[0..n]</text>
  <text x="280" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">isPrime[0]=isPrime[1]=false；i 遍历 2..√n，划 i 的倍数</text>

  <path d="M 280 182 L 280 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: init x -->
  <rect x="200" y="212" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = 2（从最小质数起）</text>

  <path d="M 280 246 L 280 272" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: loop condition -->
  <polygon points="280,276 400,306 280,336 160,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x ≤ n/2 ?</text>

  <text x="150" y="302" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 160 306 L 96 306 L 96 408" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="392" y="302" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 400 306 L 410 306" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5: check pair (right side, loop body) -->
  <polygon points="470,276 540,306 470,336 400,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="304" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">两数</text>
  <text x="470" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">皆质?</text>

  <!-- yes branch -> collect -->
  <text x="540" y="352" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="430" y="356" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="505" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans.push([x, n−x])</text>
  <path d="M 505 356 L 505 336" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)" transform="rotate(180 505 346)"/>

  <!-- no branch back to x++ -->
  <text x="448" y="350" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 470 336 L 470 352" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- x++ then back to loop -->
  <rect x="200" y="356" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x = x + 1</text>
  <path d="M 280 356 L 280 336" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)" transform="rotate(180 280 346)"/>
  <text x="248" y="392" font-size="10" fill="#888" filter="url(#rough2)">（x 递增 ⇒ 答案按 x 非递减）</text>

  <!-- step 6: return -->
  <rect x="36" y="410" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="96" y="432" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">复杂度：筛 O(n log log n) + 配对 O(n/2)；空间 O(n)</text>
</svg>
