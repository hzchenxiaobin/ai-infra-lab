<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">复原 IP 地址：回溯 + 剩余字符数剪枝流程</text>

  <!-- dfs 入口 -->
  <rect x="180" y="46" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333">dfs(start, seg)</text>

  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 终止判定 seg==4 -->
  <polygon points="280,98 400,138 280,178 160,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333">seg == 4 ?</text>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#888">已切 4 段</text>

  <!-- 是 -->
  <path d="M 280 178 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="192" font-size="10" fill="#82b366">是</text>

  <polygon points="280,198 380,228 280,258 180,228" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#333">start == n ?</text>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#888">串用完?</text>

  <path d="M 280 258 L 280 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="272" font-size="10" fill="#82b366">是</text>
  <rect x="200" y="280" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="301" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans.add(path) 返回</text>

  <path d="M 180 228 L 120 228 L 120 301" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="222" font-size="10" fill="#b85450">否</text>
  <text x="60" y="295" font-size="10" fill="#888">串有剩余 →</text>
  <text x="60" y="309" font-size="10" fill="#888">非法，返回</text>

  <!-- 否：剪枝 -->
  <path d="M 400 138 L 470 138 L 470 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="132" font-size="10" fill="#b85450">否</text>

  <polygon points="470,198 550,224 470,250 390,224" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="222" text-anchor="middle" font-size="10" fill="#333">need≤remain</text>
  <text x="470" y="238" text-anchor="middle" font-size="10" fill="#333">≤3·need?</text>

  <path d="M 390 224 L 340 224" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="218" font-size="9" fill="#b85450">否→剪枝</text>

  <!-- 循环 -->
  <path d="M 470 250 L 470 290" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="276" font-size="10" fill="#82b366">是</text>

  <rect x="380" y="294" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="316" text-anchor="middle" font-size="11" fill="#333">for len = 1 .. 3</text>

  <path d="M 460 328 L 460 344" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="460,346 540,372 460,398 380,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="370" text-anchor="middle" font-size="10" fill="#333">段合法?</text>
  <text x="460" y="386" text-anchor="middle" font-size="9" fill="#888">前导零/≤255</text>

  <!-- 是→push dfs pop -->
  <path d="M 380 372 L 320 372 L 320 330" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="366" font-size="10" fill="#82b366">是</text>

  <rect x="220" y="312" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="10" fill="#333">path.push(段)</text>
  <text x="280" y="341" text-anchor="middle" font-size="10" fill="#333">dfs(start+len, seg+1)</text>

  <path d="M 220 330 L 180 330" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="356" font-size="10" fill="#888">回溯：</text>
  <text x="150" y="370" font-size="10" fill="#888">path.pop()</text>

  <text x="380" y="406" font-size="10" fill="#888">搜索树 ≤ 3⁴=81 叶，常数级</text>
  <text x="40" y="406" font-size="10" fill="#888">两个终止条件：seg==4 且 start==n 缺一不可</text>
</svg>
