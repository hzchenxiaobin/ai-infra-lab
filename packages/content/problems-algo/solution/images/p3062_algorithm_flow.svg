<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次遍历 · 双跳取对 · 三路计分</text>
  <text x="360" y="42" text-anchor="middle" font-size="10.5" fill="#888">长度为偶数 ⇒ head 非空时 head.next 必非空，双跳 head = head.next.next 永不踩空</text>

  <!-- 1 init -->
  <rect x="60" y="64" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 初始化 even = odd = 0</text>

  <path d="M 160 96 L 160 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="160,112 236,140 160,168 84,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="144" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">head != null？</text>

  <text x="170" y="182" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 160 168 L 160 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2 read pair -->
  <rect x="60" y="184" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="202" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② 取当前一对</text>
  <text x="160" y="220" text-anchor="middle" font-size="9.5" fill="#555">a = head.val，b = head.next.val</text>

  <!-- branch arrows -->
  <path d="M 260 208 L 314 148" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 208 L 314 208" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 208 L 314 268" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3-way scoring -->
  <rect x="318" y="130" width="192" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="414" y="152" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">a &gt; b → even += 1</text>

  <rect x="318" y="190" width="192" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="414" y="212" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">a &lt; b → odd += 1</text>

  <rect x="318" y="250" width="192" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="414" y="272" text-anchor="middle" font-size="10.5" fill="#777" font-weight="bold">a = b → 平局，不计分</text>

  <!-- convergence to advance -->
  <path d="M 510 148 L 524 148" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 510 208 L 524 208" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 510 268 L 524 268" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 524 148 L 524 332 L 266 332" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3 advance -->
  <rect x="60" y="312" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="336" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">③ head = head.next.next</text>

  <!-- loop back -->
  <path d="M 60 332 L 34 332 L 34 140 L 78 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="24" y="236" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 24 236)">回到 ① · 取下一对</text>

  <!-- no branch -->
  <text x="242" y="130" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 236 140 L 272 140 L 272 82 L 625 82 L 625 104" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 4 verdict -->
  <rect x="532" y="108" width="182" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="623" y="128" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">④ 遍历结束，终局判定</text>
  <text x="623" y="150" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">even &gt; odd → "Even"</text>
  <text x="623" y="172" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">odd &gt; even → "Odd"</text>
  <text x="623" y="194" text-anchor="middle" font-size="10.5" fill="#777" font-weight="bold">otherwise → "Tie"</text>

  <!-- Takeaway -->
  <rect x="40" y="366" width="645" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="362" y="386" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">偶数长度是「安全双跳」的护身符：head 非空 ⇒ head.next 必非空，next.next 不会解引用空指针</text>
  <text x="362" y="404" text-anchor="middle" font-size="10" fill="#555">防御式写法 while (cur &amp;&amp; cur-&gt;next)：题目若放宽为任意长度，落单尾节点自动跳过，语义不变</text>
</svg>
