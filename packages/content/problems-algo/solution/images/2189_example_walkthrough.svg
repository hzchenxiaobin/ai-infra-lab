<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 16，输出 2</text>

  <!-- ====== Top: Two valid configurations ====== -->
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">两种合法纸牌屋</text>

  <!-- Config 1: {1 tri, 5 tri} = 2 + 14 = 16 -->
  <rect x="30" y="60" width="240" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.45"/>
  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">方案一：1 + 5 个三角形</text>

  <!-- mini house: top 1 triangle, bottom 5 triangles (simplified) -->
  <!-- top tri -->
  <line x1="90" y1="90" x2="78" y2="104" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="90" y1="90" x2="102" y2="104" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="78" y1="104" x2="102" y2="104" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- bottom row: 5 small triangles -->
  <g filter="url(#rough2)">
    <line x1="78" y1="104" x2="70" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="78" y1="104" x2="86" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="78" y1="104" x2="102" y2="104" stroke="#d6a040" stroke-width="2.5"/>
    <line x1="102" y1="104" x2="94" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="102" y1="104" x2="110" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="102" y1="104" x2="126" y2="104" stroke="#d6a040" stroke-width="2.5"/>
    <line x1="126" y1="104" x2="118" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="126" y1="104" x2="134" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="126" y1="104" x2="150" y2="104" stroke="#d6a040" stroke-width="2.5"/>
    <line x1="150" y1="104" x2="142" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="150" y1="104" x2="158" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="150" y1="104" x2="174" y2="104" stroke="#d6a040" stroke-width="2.5"/>
    <line x1="174" y1="104" x2="166" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="174" y1="104" x2="182" y2="118" stroke="#446688" stroke-width="2"/>
  </g>

  <text x="150" y="138" text-anchor="middle" font-size="10" fill="#333">2 + 14 = 16 ✓</text>
  <text x="150" y="152" text-anchor="middle" font-size="9" fill="#888">1 ≤ 5−1 = 4 ✓</text>

  <!-- Config 2: {2 tri, 4 tri} = 5 + 11 = 16 -->
  <rect x="290" y="60" width="240" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.45"/>
  <text x="410" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">方案二：2 + 4 个三角形</text>

  <!-- top row: 2 triangles -->
  <g filter="url(#rough2)">
    <line x1="370" y1="90" x2="358" y2="104" stroke="#446688" stroke-width="2"/>
    <line x1="370" y1="90" x2="382" y2="104" stroke="#446688" stroke-width="2"/>
    <line x1="382" y1="90" x2="394" y2="104" stroke="#446688" stroke-width="2"/>
    <line x1="394" y1="90" x2="382" y2="104" stroke="#446688" stroke-width="2"/>
    <line x1="358" y1="104" x2="394" y2="104" stroke="#d6a040" stroke-width="2.5"/>
  </g>

  <!-- bottom row: 4 triangles -->
  <g filter="url(#rough2)">
    <line x1="358" y1="104" x2="350" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="358" y1="104" x2="366" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="358" y1="104" x2="382" y2="104" stroke="#d6a040" stroke-width="2.5"/>
    <line x1="382" y1="104" x2="374" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="382" y1="104" x2="390" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="382" y1="104" x2="406" y2="104" stroke="#d6a040" stroke-width="2.5"/>
    <line x1="406" y1="104" x2="398" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="406" y1="104" x2="414" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="406" y1="104" x2="430" y2="104" stroke="#d6a040" stroke-width="2.5"/>
    <line x1="430" y1="104" x2="422" y2="118" stroke="#446688" stroke-width="2"/>
    <line x1="430" y1="104" x2="438" y2="118" stroke="#446688" stroke-width="2"/>
  </g>

  <text x="410" y="138" text-anchor="middle" font-size="10" fill="#333">5 + 11 = 16 ✓</text>
  <text x="410" y="152" text-anchor="middle" font-size="9" fill="#888">2 ≤ 4−1 = 3 ✓</text>

  <!-- ====== Middle: DP table evolution ====== -->
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Bottom-up DP 演化（dp[j] = 凑出和 j 的方案数）</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="30" y="192" width="500" height="22" fill="#446688" rx="3"/>
  </g>
  <text x="55" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">j</text>
  <text x="100" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">0</text>
  <text x="140" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>
  <text x="180" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">5</text>
  <text x="220" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">7</text>
  <text x="260" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">8</text>
  <text x="300" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">10</text>
  <text x="340" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">11</text>
  <text x="380" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">13</text>
  <text x="420" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">14</text>
  <text x="460" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">15</text>
  <text x="500" y="207" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">16</text>

  <!-- Row: init -->
  <g filter="url(#rough2)">
    <rect x="30" y="214" width="500" height="20" fill="#f0f0f0" stroke="#ddd" stroke-width="0.5" rx="2"/>
  </g>
  <text x="55" y="228" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">init</text>
  <text x="100" y="228" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="140" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="180" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="220" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="260" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="300" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="340" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="380" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="420" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="460" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="500" y="228" text-anchor="middle" font-size="9" fill="#ccc">0</text>

  <!-- Row: t=1 cost=2 -->
  <g filter="url(#rough2)">
    <rect x="30" y="234" width="500" height="20" fill="#e8f0fe" stroke="#ddd" stroke-width="0.5" rx="2" opacity="0.6"/>
  </g>
  <text x="55" y="248" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">t=1</text>
  <text x="100" y="248" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="132" y="238" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="140" y="248" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="180" y="248" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="220" y="248" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="260" y="248" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="300" y="248" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="340" y="248" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="380" y="248" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="420" y="248" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="460" y="248" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="500" y="248" text-anchor="middle" font-size="9" fill="#ccc">0</text>

  <!-- Row: t=2 cost=5 -->
  <g filter="url(#rough2)">
    <rect x="30" y="254" width="500" height="20" fill="#e8f0fe" stroke="#ddd" stroke-width="0.5" rx="2" opacity="0.6"/>
  </g>
  <text x="55" y="268" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">t=2</text>
  <text x="100" y="268" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="140" y="268" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="172" y="258" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="180" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="212" y="258" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="220" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="260" y="268" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="300" y="268" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="340" y="268" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="380" y="268" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="420" y="268" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="460" y="268" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="500" y="268" text-anchor="middle" font-size="9" fill="#ccc">0</text>

  <!-- Row: t=3 cost=8 -->
  <g filter="url(#rough2)">
    <rect x="30" y="274" width="500" height="20" fill="#e8f0fe" stroke="#ddd" stroke-width="0.5" rx="2" opacity="0.6"/>
  </g>
  <text x="55" y="288" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">t=3</text>
  <text x="100" y="288" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="140" y="288" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="180" y="288" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="220" y="288" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="252" y="278" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="292" y="278" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="300" y="288" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="340" y="288" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <rect x="372" y="278" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="380" y="288" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="420" y="288" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <rect x="452" y="278" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="460" y="288" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="500" y="288" text-anchor="middle" font-size="9" fill="#ccc">0</text>

  <!-- Row: t=4 cost=11 -->
  <g filter="url(#rough2)">
    <rect x="30" y="294" width="500" height="20" fill="#e8f0fe" stroke="#ddd" stroke-width="0.5" rx="2" opacity="0.6"/>
  </g>
  <text x="55" y="308" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">t=4</text>
  <text x="100" y="308" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="140" y="308" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="180" y="308" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="220" y="308" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="260" y="308" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="300" y="308" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="332" y="298" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="340" y="308" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="372" y="298" width="16" height="14" fill="#fff8e1" stroke="#d6a040" rx="2" filter="url(#rough2)"/>
  <text x="380" y="308" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text>
  <text x="420" y="308" text-anchor="middle" font-size="9" fill="#ccc">0</text>
  <text x="460" y="308" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="492" y="298" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="500" y="308" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row: t=5 cost=14 -->
  <g filter="url(#rough2)">
    <rect x="30" y="314" width="500" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" opacity="0.6"/>
  </g>
  <text x="55" y="328" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">t=5</text>
  <text x="100" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="140" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="180" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="220" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="260" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="300" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="340" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="380" y="328" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="412" y="318" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="420" y="328" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="460" y="328" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="492" y="318" width="16" height="14" fill="#b85450" stroke="#b85450" rx="2" filter="url(#rough2)"/>
  <text x="500" y="328" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>

  <!-- highlight answer -->
  <path d="M 500 314 L 500 296" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="310" font-size="9" fill="#b85450" font-weight="bold">答案</text>

  <!-- ====== Bottom: explanation ====== -->
  <rect x="20" y="346" width="520" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">读表说明</text>
  <text x="40" y="386" font-size="10" fill="#444">• t=4 时 dp[16]=1：取 t=4(cost=11) + 此前 dp[5]=1（即 {t=2}），方案 = {2, 4} 个三角形</text>
  <text x="40" y="404" font-size="10" fill="#444">• t=5 时 dp[16]=2：取 t=5(cost=14) + 此前 dp[2]=1（即 {t=1}），方案 = {1, 5} 个三角形</text>
  <text x="40" y="422" font-size="10" fill="#444">　 dp[13] 在 t=4 升至 2：{t=2,t=3}(5+8) 与 {t=4}(11+dp[2]=2)，但 dp[2] 只有 {t=1} 故 {1,4}</text>
  <text x="40" y="440" font-size="10" fill="#888">　 绿底 = 本轮新增/更新；橙底 = 关键行；红底 = 最终答案 dp[16] = 2</text>
</svg>
