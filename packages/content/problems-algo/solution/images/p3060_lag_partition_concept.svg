<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 (user_id, session_type) 分区，LAG 只比「相邻同类型会话」</text>
  <text x="290" y="38" text-anchor="middle" font-size="9" fill="#888">以用户 102 为例：混排时间线拆成 Viewer / Streamer 两个分区，每个分区内用 LAG 取上一条的 session_end</text>

  <!-- ===== Left: raw mixed timeline ===== -->
  <rect x="20" y="52" width="150" height="180" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="70" text-anchor="middle" font-size="10" fill="#777" font-weight="bold">用户 102 原始会话</text>
  <text x="95" y="82" text-anchor="middle" font-size="8" fill="#888">（按时间混排）</text>
  <rect x="32" y="90" width="126" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="103" text-anchor="middle" font-size="8" fill="#446688">#3 Viewer 13:00–14:00</text>
  <rect x="32" y="114" width="126" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="127" text-anchor="middle" font-size="8" fill="#446688">#4 Viewer 15:00–16:00</text>
  <rect x="32" y="138" width="126" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="151" text-anchor="middle" font-size="8" fill="#d6a040">#6 Streamer 12:00–13:00</text>
  <rect x="32" y="162" width="126" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="175" text-anchor="middle" font-size="8" fill="#446688">#8 Viewer 16:00–17:00</text>
  <text x="95" y="200" text-anchor="middle" font-size="8" fill="#888">类型交错，整体看</text>
  <text x="95" y="212" text-anchor="middle" font-size="8" fill="#888">「相邻」无从下手 →</text>
  <text x="95" y="224" text-anchor="middle" font-size="8" fill="#888">先分区再谈相邻</text>

  <!-- arrows to partitions -->
  <path d="M 172 110 C 210 110, 218 100, 250 96" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 172 175 C 210 175, 218 200, 250 208" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right top: Viewer partition ===== -->
  <rect x="254" y="52" width="306" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="407" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">PARTITION BY user_id=102, session_type='Viewer'</text>
  <text x="407" y="82" text-anchor="middle" font-size="8" fill="#888">ORDER BY session_end → LAG(session_end) AS prev_end</text>
  <rect x="266" y="90" width="70" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="301" y="103" text-anchor="middle" font-size="8" fill="#333">#3 start 13:00</text>
  <rect x="340" y="90" width="86" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="383" y="103" text-anchor="middle" font-size="8" fill="#888">prev_end = NULL</text>
  <rect x="430" y="90" width="118" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="489" y="103" text-anchor="middle" font-size="8" fill="#888">首行，跳过</text>
  <rect x="266" y="114" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="127" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">#4 start 15:00</text>
  <rect x="340" y="114" width="86" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="383" y="127" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">prev_end 14:00</text>
  <rect x="430" y="114" width="118" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="489" y="127" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">gap 1h ≤ 12h ✓</text>
  <rect x="266" y="138" width="70" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="301" y="151" text-anchor="middle" font-size="8" fill="#333">#8 start 16:00</text>
  <rect x="340" y="138" width="86" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="383" y="151" text-anchor="middle" font-size="8" fill="#333">prev_end 16:00</text>
  <rect x="430" y="138" width="118" height="18" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="489" y="151" text-anchor="middle" font-size="8" fill="#b85450">gap 24h &gt; 12h ✗</text>

  <!-- ===== Right bottom: Streamer partition ===== -->
  <rect x="254" y="184" width="306" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="407" y="202" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">PARTITION BY user_id=102, session_type='Streamer'</text>
  <rect x="266" y="208" width="120" height="18" fill="#fff" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="326" y="221" text-anchor="middle" font-size="8" fill="#333">#6 start 12:00（次日）</text>
  <rect x="390" y="208" width="158" height="18" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="469" y="221" text-anchor="middle" font-size="8" fill="#888">区内仅 1 行，prev_end=NULL 跳过</text>

  <!-- ===== Lemma box ===== -->
  <rect x="20" y="248" width="540" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">单调性引理：非相邻对的间隔 ≥ 夹在中间的相邻对的间隔</text>
  <text x="290" y="288" text-anchor="middle" font-size="9" fill="#446688">同分区按 session_end 排成 S1..Sk，对 i &lt; j：start(Sj) − end(Si) ≥ start(Sj) − end(Sj−1)（因为 end(Si) ≤ end(Sj−1)）</text>
  <text x="290" y="306" text-anchor="middle" font-size="9" fill="#446688">⇒ 若所有相邻对 gap &gt; 12h，则任意对 gap &gt; 12h</text>
  <text x="290" y="326" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">逆否命题：存在 gap ≤ 12h 的同类型对 ⟺ 存在 gap ≤ 12h 的相邻对 → 只查 LAG 相邻行足矣</text>

  <!-- ===== Conclusion box ===== -->
  <rect x="20" y="350" width="540" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">一趟 LAG 把「任意两同类型会话间隔 ≤ 12h」的判定压缩为「相邻两行间隔 ≤ 12h」</text>
  <text x="290" y="392" text-anchor="middle" font-size="9" fill="#4a7a3a">O(n²) 的两两配对 → O(n log n) 的分区排序 + 一次扫描；用户 102 由 #3→#4 这对相邻 Viewer 会话命中</text>
  <text x="290" y="408" text-anchor="middle" font-size="9" fill="#666">判据：TIMESTAMPDIFF(HOUR, prev_end, session_start) ≤ 12</text>
</svg>
