<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：每个 r 只做 O(log n) 的几件事</text>

  <!-- 左列流程 -->
  <g filter="url(#rough2)">
    <rect x="24" y="36" width="276" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="162" y="52" text-anchor="middle" font-size="10.5" fill="#33506b">初始化：线段树 cnt / mn（叶子按位置 0..n−1）</text>
    <text x="162" y="67" text-anchor="middle" font-size="10.5" fill="#33506b">＋ occ[v] 出现位置表</text>

    <path d="M162 74 L162 86" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="92" y="88" width="140" height="24" rx="12" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="162" y="104" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">for r = 0 … n−1</text>

    <path d="M162 112 L162 124" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="24" y="126" width="276" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="162" y="142" text-anchor="middle" font-size="10.5" fill="#8a6d1a">x = nums[r]：x 的占用位从旧 last 移到 r</text>
    <text x="162" y="158" text-anchor="middle" font-size="10.5" fill="#8a6d1a">f(x) ← occ[x] 倒数第 m 个出现（不足为 −1）</text>

    <path d="M162 170 L162 182" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <polygon points="162,184 244,212 162,240 80,212" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="162" y="217" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">不同值总数 D &lt; k ?</text>

    <path d="M244 212 L272 212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="252" y="204" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold">是</text>
    <rect x="276" y="200" width="58" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="305" y="216" text-anchor="middle" font-size="10" fill="#8a3030">跳过</text>

    <path d="M162 240 L162 252" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="172" y="250" font-size="10" fill="#2f5d24" font-weight="bold">否</text>

    <rect x="24" y="254" width="276" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="162" y="270" text-anchor="middle" font-size="10.5" fill="#33506b">x<tspan dy="3" font-size="8.5">k</tspan><tspan dy="-3"> ← 第 (D−k+1) 小占用位（树上下降）</tspan></text>
    <text x="162" y="286" text-anchor="middle" font-size="10.5" fill="#33506b">x<tspan dy="3" font-size="8.5">k+1</tspan><tspan dy="-3"> ← 第 (D−k) 小占用位（无则 −1）</tspan></text>

    <path d="M162 294 L162 304" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="24" y="306" width="276" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="162" y="323" text-anchor="middle" font-size="10.5" fill="#33506b">M ← [x<tspan dy="3" font-size="8.5">k</tspan><tspan dy="-3">, n−1] 的 mn 最小（= 前 k 近值的 f 最小）</tspan></text>

    <path d="M162 332 L162 342" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="24" y="344" width="276" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="162" y="361" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">ans += max(0, min(x<tspan dy="3" font-size="8.5">k</tspan><tspan dy="-3">, M) − x</tspan><tspan dy="3" font-size="8.5">k+1</tspan><tspan dy="-3">)　（long long）</tspan></text>

    <path d="M300 357 L344 357 L344 100 L236 100" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    <text x="290" y="95" text-anchor="middle" font-size="9" fill="#999">下一个 r</text>
  </g>

  <!-- 右侧：线段树示意 -->
  <g filter="url(#rough2)">
    <text x="442" y="46" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">线段树按「位置」开</text>

    <rect x="404" y="60" width="128" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="468" y="76" text-anchor="middle" font-size="9" fill="#2f5d24">前 k 近的占用位</text>
    <line x1="352" y1="86" x2="536" y2="86" stroke="#888" stroke-width="1.4"/>
    <line x1="352" y1="81" x2="352" y2="91" stroke="#888" stroke-width="1.2"/>
    <line x1="375" y1="81" x2="375" y2="91" stroke="#888" stroke-width="1.2"/>
    <line x1="398" y1="81" x2="398" y2="91" stroke="#888" stroke-width="1.2"/>
    <line x1="421" y1="81" x2="421" y2="91" stroke="#888" stroke-width="1.2"/>
    <line x1="444" y1="81" x2="444" y2="91" stroke="#888" stroke-width="1.2"/>
    <line x1="467" y1="81" x2="467" y2="91" stroke="#888" stroke-width="1.2"/>
    <line x1="490" y1="81" x2="490" y2="91" stroke="#888" stroke-width="1.2"/>
    <line x1="513" y1="81" x2="513" y2="91" stroke="#888" stroke-width="1.2"/>
    <line x1="536" y1="81" x2="536" y2="91" stroke="#888" stroke-width="1.2"/>

    <circle cx="398" cy="86" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="467" cy="86" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="513" cy="86" r="5" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="536" cy="86" r="5" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2"/>

    <text x="398" y="106" text-anchor="middle" font-size="8" fill="#999">2</text>
    <text x="467" y="106" text-anchor="middle" font-size="8" fill="#999">5</text>
    <text x="513" y="106" text-anchor="middle" font-size="8" fill="#999">7</text>
    <text x="536" y="106" text-anchor="middle" font-size="8" fill="#999">8</text>

    <text x="513" y="122" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">x<tspan dy="2.5" font-size="7.5">k</tspan></text>
    <text x="467" y="122" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">x<tspan dy="2.5" font-size="7.5">k+1</tspan></text>

    <text x="442" y="140" text-anchor="middle" font-size="9.5" fill="#666">● 占用位 = 各值的 last（互不相同）</text>
    <text x="442" y="155" text-anchor="middle" font-size="9.5" fill="#666">cnt 做次序统计，mn 做区间最小</text>

    <rect x="352" y="166" width="192" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="448" y="180" text-anchor="middle" font-size="9.5" fill="#8a6d1a">不变量：一个位置 ≤ 一个值占用</text>
    <text x="448" y="194" text-anchor="middle" font-size="9.5" fill="#8a6d1a">f 只在值出现的那一步变化</text>

    <rect x="352" y="208" width="192" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="448" y="225" text-anchor="middle" font-size="9.5" fill="#8a3030">答案上限 ~ n²/2 → 必须 long long</text>

    <rect x="352" y="242" width="192" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="448" y="259" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">时间 O(n log n)</text>
    <text x="448" y="277" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">空间 O(n)</text>

    <rect x="352" y="294" width="192" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="448" y="310" text-anchor="middle" font-size="9.5" fill="#33506b">退化检查：m = 1 时 f(v) = last(v)，</text>
    <text x="448" y="326" text-anchor="middle" font-size="9.5" fill="#33506b">M = x<tspan dy="2.5" font-size="7.5">k</tspan><tspan dy="-2.5">，退化为 992 的恰好计数</tspan></text>
  </g>
</svg>
