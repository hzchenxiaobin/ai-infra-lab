<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：降序排序 + 双指针归并，每次取单价大者先切</text>

  <!-- 开始：排序 -->
  <rect x="185" y="38" width="150" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">h、v 各自降序排序</text>
  <line x1="260" y1="68" x2="260" y2="86" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="185" y="88" width="150" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = j = 0，ans = 0</text>
  <line x1="260" y1="118" x2="260" y2="136" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：比较 -->
  <polygon points="260,138 345,176 260,214 175,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">h[i] ≥ v[j] ？</text>
  <text x="260" y="188" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（一侧耗尽则选另一侧）</text>

  <!-- 左分支：切垂直线 -->
  <line x1="175" y1="176" x2="150" y2="176" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="176" x2="150" y2="196" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="30" y="198" width="240" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += v[j] × (i + 1)</text>
  <text x="150" y="234" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i 条水平线已把它断成 i+1 段</text>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j++（切垂直线）</text>

  <!-- 右分支：切水平线 -->
  <line x1="345" y1="176" x2="370" y2="176" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="370" y1="176" x2="370" y2="196" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="357" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="250" y="198" width="240" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += h[i] × (j + 1)</text>
  <text x="370" y="234" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">j 条垂直线已把它断成 j+1 段</text>
  <text x="370" y="252" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">i++（切水平线）</text>

  <!-- 汇合到判断 -->
  <line x1="150" y1="262" x2="150" y2="284" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="370" y1="262" x2="370" y2="284" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="284" x2="370" y2="284" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="260" y1="284" x2="260" y2="296" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：结束判断 -->
  <polygon points="260,298 330,322 260,346 190,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">都切完了？</text>

  <!-- 否：回环到比较菱形 -->
  <path d="M 190 322 L 60 322 L 60 176 L 171 176" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="112" y="314" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 是：返回 -->
  <line x1="330" y1="322" x2="380" y2="322" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="380" y1="322" x2="380" y2="340" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="392" y="330" width="108" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="446" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>
</svg>
