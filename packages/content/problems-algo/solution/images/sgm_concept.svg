<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：余数等价类去重 — 同余只留最小者</text>

  <!-- Left: number space (exponential) -->
  <rect x="30" y="50" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="73" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">数值空间：2^L 个候选</text>

  <!-- some numbers -->
  <text x="40" y="106" font-size="10.5" fill="#888">10, 100, 1000, ... 都余 3</text>
  <text x="40" y="122" font-size="10.5" fill="#888">11, 110, 1100, ... 都余 4</text>
  <text x="40" y="138" font-size="10.5" fill="#888">→ 大量重复余数！</text>

  <path d="M 130 150 L 130 178" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Arrow to right -->
  <path d="M 230 68 L 310 68" stroke="#888" stroke-width="2.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">取余映射</text>
  <text x="270" y="84" text-anchor="middle" font-size="10" fill="#888">n mod k</text>

  <!-- Right: remainder space (linear) -->
  <rect x="310" y="50" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="73" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">余数空间：≤ k 个状态</text>

  <!-- remainder nodes row -->
  <g filter="url(#rough2)">
    <circle cx="340" cy="120" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="340" y="124" text-anchor="middle" font-size="10" fill="#333">1</text>
    <circle cx="380" cy="120" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="380" y="124" text-anchor="middle" font-size="10" fill="#333">2</text>
    <circle cx="420" cy="120" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="420" y="124" text-anchor="middle" font-size="10" fill="#333">3</text>
    <circle cx="460" cy="120" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="460" y="124" text-anchor="middle" font-size="10" fill="#333">...</text>
    <circle cx="500" cy="120" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="500" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  </g>

  <text x="420" y="156" text-anchor="middle" font-size="10.5" fill="#4a7a3a">每个余数只保留首次到达（最小数）</text>

  <!-- transition example -->
  <path d="M 354 120 L 366 120" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 394 120 L 406 120" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="373" y="112" text-anchor="middle" font-size="8" fill="#888">×10+d</text>

  <!-- Divider -->
  <path d="M 30 180 L 530 180" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Bottom: two strategies -->
  <text x="280" y="202" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">余数 0 的特殊处理：严格大于 k</text>

  <!-- r=0, n <= k -->
  <rect x="40" y="216" width="220" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="238" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">余数 0，但 n ≤ k</text>
  <text x="150" y="256" text-anchor="middle" font-size="10.5" fill="#888">不标记 visited，继续扩展</text>

  <path d="M 260 242 L 300 242" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- r=0, n > k -->
  <rect x="300" y="216" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="238" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">余数 0，且 n > k</text>
  <text x="410" y="256" text-anchor="middle" font-size="10.5" fill="#4a7a3a">命中！返回 n ✓</text>

  <!-- notes -->
  <text x="40" y="294" font-size="10.5" fill="#555">• 非零余数：首次到达即标记，后续同余直接跳过</text>
  <text x="40" y="312" font-size="10.5" fill="#555">• 余数 0：不标记，弹出时判 n &gt; k（因 k 本身余 0 但不算）</text>
  <text x="40" y="330" font-size="10.5" fill="#555">• 首位非零：0 可出现在非首位，但不能作为数字首位</text>

  <!-- complexity comparison -->
  <rect x="40" y="348" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="371" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">暴力枚举</text>
  <text x="150" y="390" text-anchor="middle" font-size="10.5" fill="#888">O(2^L) 候选，逐个取余</text>

  <rect x="300" y="348" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="371" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">同余 BFS 剪枝</text>
  <text x="410" y="390" text-anchor="middle" font-size="10.5" fill="#4a7a3a">O(min(k, 2^L)) 状态，每态 O(1)</text>
</svg>
