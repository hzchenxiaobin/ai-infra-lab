<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fafafa"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">find(value) 算法流程（HashMap 方案）</text>
  <path d="M 260 40 Q 430 48 600 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- add 流程 -->
  <g filter="url(#sk2)">
    <rect x="60" y="60" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="160" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">add(number)</text>
  <text x="160" y="108" text-anchor="middle" font-size="11" fill="#444">map[number] += 1</text>
  <text x="160" y="124" text-anchor="middle" font-size="10" fill="#2e6e2e">O(1) 一次哈希自增</text>

  <path d="M 160 130 L 160 150" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- find 开始 -->
  <g filter="url(#sk2)">
    <ellipse cx="430" cy="155" rx="75" ry="22" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="430" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">find(value)</text>

  <path d="M 430 177 L 430 200" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 遍历 map -->
  <g filter="url(#sk2)">
    <rect x="330" y="200" width="200" height="40" rx="6" fill="#fff" stroke="#446688"/>
  </g>
  <text x="430" y="216" text-anchor="middle" font-size="12" fill="#333">遍历 map 中每个 key</text>
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#666">comp = value - key</text>

  <path d="M 430 240 L 430 264" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断菱形: comp in map? -->
  <g filter="url(#sk2)">
    <polygon points="430,264 560,320 430,376 300,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="430" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">comp in map?</text>
  <text x="430" y="328" text-anchor="middle" font-size="10" fill="#666">（哈希 O(1) 查找）</text>

  <!-- 否：继续下一个 key -->
  <path d="M 300 320 L 220 320 L 220 220 L 330 220" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="312" font-size="11" font-weight="bold" fill="#b03a3a">否</text>
  <text x="190" y="276" font-size="10" fill="#999">下一个 key</text>

  <!-- 是：判断 comp == key? -->
  <path d="M 560 320 L 650 320" stroke="#2e6e2e" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="575" y="312" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <g filter="url(#sk2)">
    <polygon points="730,290 800,320 730,350 660,320" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="730" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">comp==key?</text>
  <text x="730" y="330" text-anchor="middle" font-size="10" fill="#666">自配对?</text>

  <!-- comp != key: 直接返回 true -->
  <path d="M 800 320 L 830 320 L 830 400" stroke="#2e6e2e" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="805" y="360" font-size="10" font-weight="bold" fill="#2e6e2e">否</text>

  <g filter="url(#sk2)">
    <rect x="740" y="400" width="100" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="790" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">return true</text>

  <!-- comp == key: 判断 map[key] >= 2 -->
  <path d="M 730 350 L 730 400" stroke="#446688" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="738" y="380" font-size="10" font-weight="bold" fill="#2b6e9e">是</text>

  <g filter="url(#sk2)">
    <polygon points="730,400 800,425 730,450 660,425" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="730" y="422" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a2828">map[key]≥2?</text>

  <path d="M 730 450 L 730 470" stroke="#2e6e2e" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="738" y="465" font-size="10" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 660 425 L 580 425 L 580 390" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="620" y="418" font-size="10" font-weight="bold" fill="#b03a3a">否 → 下一个</text>

  <g filter="url(#sk2)">
    <rect x="680" y="470" width="100" height="28" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="730" y="489" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">return true</text>

  <!-- 遍历结束: return false -->
  <path d="M 220 220 L 160 220 L 160 480 L 320 480" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="175" y="350" font-size="10" fill="#999">遍历完</text>

  <g filter="url(#sk2)">
    <rect x="320" y="470" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="380" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828">return false</text>

  <!-- 底部注释 -->
  <g filter="url(#sk2)">
    <rect x="40" y="514" width="780" height="38" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-dasharray="4 3"/>
  </g>
  <text x="430" y="532" text-anchor="middle" font-size="11" fill="#7a5415">⚠️ 自配对陷阱：当 comp == key（如 add(2) 后 find(4)），必须检查 map[key] ≥ 2，否则单个元素被自己配对</text>
  <text x="430" y="548" text-anchor="middle" font-size="11" fill="#444">find 遍历 map 全部 key，每个 key 做 O(1) 哈希查找 → 总 O(n)</text>
</svg>
