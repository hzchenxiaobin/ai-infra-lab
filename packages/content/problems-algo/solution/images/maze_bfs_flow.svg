<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 在「停止状态」图上搜索</text>

  <!-- Start: init queue -->
  <g filter="url(#rough2)">
    <rect x="190" y="48" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="18"/>
    <text x="280" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始：queue=[start]，visited={start}</text>
  </g>
  <path d="M 280 88 L 280 104" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond: queue empty? -->
  <g filter="url(#rough2)">
    <polygon points="280,108 360,148 280,188 200,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">queue 为空?</text>
    <text x="280" y="160" text-anchor="middle" font-size="10" fill="#888">是 → 右出</text>
  </g>

  <!-- Yes branch -> return false -->
  <path d="M 360 148 L 420 148" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="420" y="128" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="480" y="153" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  </g>
  <text x="384" y="142" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- No branch -> down -->
  <path d="M 280 188 L 280 204" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="288" y="200" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Box: dequeue (r,c) -->
  <g filter="url(#rough2)">
    <rect x="190" y="208" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="280" y="230" text-anchor="middle" font-size="12" fill="#446688">出队 (r, c) ← queue.front()</text>
  </g>
  <path d="M 280 242 L 280 258" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond: (r,c)==dest? -->
  <g filter="url(#rough2)">
    <polygon points="280,262 370,300 280,338 190,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(r,c) == dest?</text>
    <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888">是 → 右出</text>
  </g>

  <!-- Yes -> return true -->
  <path d="M 370 300 L 420 300" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="420" y="280" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="480" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true ✓</text>
  </g>
  <text x="394" y="294" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- No -> down to for loop -->
  <path d="M 280 338 L 280 354" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="288" y="350" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Box: for each dir, roll until wall -> (nr,nc) -->
  <g filter="url(#rough2)">
    <rect x="150" y="358" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="280" y="378" text-anchor="middle" font-size="12" fill="#446688">for dir ∈ {上,下,左,右}：</text>
    <text x="280" y="395" text-anchor="middle" font-size="11" fill="#555">沿 dir 滚动直到越界/撞墙 → 停止格 (nr,nc)</text>
  </g>

  <!-- Diamond: visited? -->
  <g filter="url(#rough2)">
    <polygon points="280,412 360,432 280,452 200,432" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="280" y="436" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(nr,nc) 已访问?</text>
  </g>

  <!-- No -> mark visited, enqueue (left side, loop back up) -->
  <path d="M 200 432 L 120 432 L 120 148 L 198 148" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="392" width="84" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="82" y="408" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否 → 标记 visited</text>
    <text x="82" y="421" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">入队 queue</text>
  </g>
  <text x="148" y="425" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Yes -> skip (small note) -->
  <path d="M 280 452 L 280 458" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="296" y="452" font-size="10" fill="#888" filter="url(#rough2)">是 → 跳过该方向</text>
</svg>
