<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">交换一对字符 →「不同字符数」的四重影响</text>

  <!-- word1 box -->
  <rect x="40" y="56" width="200" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">word1</text>
  <!-- cells: ... x ... (y虚格) -->
  <rect x="56" y="98" width="34" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="121" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">…</text>
  <rect x="96" y="98" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="113" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">x</text>
  <rect x="136" y="98" width="34" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="121" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">…</text>
  <rect x="176" y="98" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="193" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">y</text>
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">红 x 离开 · 绿虚 y 进入</text>

  <!-- word2 box -->
  <rect x="320" y="56" width="200" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">word2</text>
  <rect x="336" y="98" width="34" height="34" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="121" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">…</text>
  <rect x="376" y="98" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="393" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">y</text>
  <rect x="416" y="98" width="34" height="34" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="121" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">…</text>
  <rect x="456" y="98" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="473" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">x</text>
  <text x="420" y="160" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">红 y 离开 · 蓝虚 x 进入</text>

  <!-- swap arrows in the gap -->
  <path d="M 244 110 L 316 110" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">送出 x</text>
  <path d="M 316 138 L 244 138" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">送出 y</text>

  <!-- four delta cards 2x2 -->
  <rect x="40" y="196" width="235" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="220" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">word1 失去 x</text>
  <text x="55" y="240" font-size="12" fill="#333" filter="url(#rough2)">cnt1[x] 减一</text>
  <text x="55" y="260" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">cnt1[x]==1 ⇒ d1 −1</text>

  <rect x="285" y="196" width="235" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="220" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">word1 得到 y</text>
  <text x="300" y="240" font-size="12" fill="#333" filter="url(#rough2)">cnt1[y] 加一</text>
  <text x="300" y="260" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">cnt1[y]==0 ⇒ d1 +1</text>

  <rect x="40" y="290" width="235" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="314" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">word2 失去 y</text>
  <text x="55" y="334" font-size="12" fill="#333" filter="url(#rough2)">cnt2[y] 减一</text>
  <text x="55" y="354" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">cnt2[y]==1 ⇒ d2 −1</text>

  <rect x="285" y="290" width="235" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="314" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">word2 得到 x</text>
  <text x="300" y="334" font-size="12" fill="#333" filter="url(#rough2)">cnt2[x] 加一</text>
  <text x="300" y="354" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">cnt2[x]==0 ⇒ d2 +1</text>

  <!-- bottom summary -->
  <rect x="40" y="380" width="480" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">nd1 = d1 + Δ1，nd2 = d2 + Δ2；nd1 == nd2 ⇒ true（x≠y 时四项独立）</text>
</svg>
