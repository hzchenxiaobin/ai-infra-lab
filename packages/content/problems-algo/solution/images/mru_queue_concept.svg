<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：fetch(k) = 取出第 k 个元素，追加到队尾</text>

  <!-- Initial queue label -->
  <text x="56" y="78" font-size="12" fill="#888" filter="url(#rough2)">初始队列</text>

  <!-- Initial queue cells: 1 2 3 4 5 6 7 8, 3rd highlighted -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="104" y="64" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="126" y="88" filter="url(#rough2)">1</text>
    <rect x="148" y="64" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="88" filter="url(#rough2)">2</text>
    <rect x="192" y="64" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="214" y="88" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="236" y="64" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="88" filter="url(#rough2)">4</text>
    <rect x="280" y="64" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="302" y="88" filter="url(#rough2)">5</text>
    <rect x="324" y="64" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="346" y="88" filter="url(#rough2)">6</text>
    <rect x="368" y="64" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="88" filter="url(#rough2)">7</text>
    <rect x="412" y="64" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="434" y="88" filter="url(#rough2)">8</text>
  </g>

  <!-- k=3 pointer to 3rd cell -->
  <text x="214" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↑ k=3</text>
  <path d="M 192 124 L 192 108 L 236 108 L 236 124" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- fetch(3) action box -->
  <rect x="180" y="132" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">fetch(3)：取出第 3 个（值 3）</text>

  <!-- down arrow -->
  <path d="M 280 166 L 280 186" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result queue label -->
  <text x="56" y="216" font-size="12" fill="#888" filter="url(#rough2)">操作后</text>

  <!-- Result queue: 1 2 4 5 6 7 8 3, last highlighted green -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="104" y="200" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="126" y="224" filter="url(#rough2)">1</text>
    <rect x="148" y="200" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="224" filter="url(#rough2)">2</text>
    <rect x="192" y="200" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="214" y="224" filter="url(#rough2)">4</text>
    <rect x="236" y="200" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="224" filter="url(#rough2)">5</text>
    <rect x="280" y="200" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="302" y="224" filter="url(#rough2)">6</text>
    <rect x="324" y="200" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="346" y="224" filter="url(#rough2)">7</text>
    <rect x="368" y="200" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="224" filter="url(#rough2)">8</text>
    <rect x="412" y="200" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="434" y="224" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  </g>

  <!-- return 3 note -->
  <text x="434" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑ 返回 3</text>

  <!-- dashed separator -->
  <path d="M 40 274 L 520 274" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- key insights -->
  <text x="56" y="296" font-size="11.5" fill="#555" filter="url(#rough2)">• 队列长度恒为 n：fetch 只 <tspan fill="#b85450" font-weight="bold">移动</tspan> 不增删</text>
  <text x="56" y="314" font-size="11.5" fill="#555" filter="url(#rough2)">• 朴素数组：pop 第 k 个 + append，O(n) 次 fetch 共 O(n·q)</text>
  <text x="56" y="332" font-size="11.5" fill="#555" filter="url(#rough2)">• 进阶：用 <tspan fill="#446688" font-weight="bold">BIT 第 k 小</tspan> 定位，O(log n) 每次</text>
</svg>
