<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">n=3, edgeList=[[0,1,2],[1,2,4],[2,0,8],[1,0,16]], queries=[[0,1,2],[0,2,5]]</text>

  <!-- Sort phase -->
  <rect x="20" y="58" width="540" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="11" fill="#d6a040" font-weight="bold">排序后：</text>
  <text x="40" y="92" font-size="10.5" fill="#444">边: [0,1,2]→[1,2,4]→[2,0,8]→[1,0,16]</text>
  <text x="310" y="92" font-size="10.5" fill="#444">查询: [0,1,2](idx0)→[0,2,5](idx1)</text>

  <!-- Query 1 -->
  <rect x="20" y="112" width="540" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="132" font-size="12" fill="#b85450" font-weight="bold">查询① [0,1,2]  limit=2</text>

  <text x="40" y="152" font-size="10.5" fill="#444">加边 dis &lt; 2：</text>
  <rect x="150" y="140" width="90" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="195" y="155" text-anchor="middle" font-size="10" fill="#888">无（最小=2）</text>

  <text x="40" y="184" font-size="10.5" fill="#444">UF 状态：</text>
  <circle cx="120" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="201" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="170" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="201" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="220" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="201" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="260" y="200" font-size="10" fill="#888">三者各自为根</text>

  <rect x="360" y="186" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">find(0)≠find(1) → false</text>
  <text x="40" y="232" font-size="10" fill="#888">→ ans[0] = false</text>

  <!-- Query 2 -->
  <rect x="20" y="252" width="540" height="156" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="272" font-size="12" fill="#4a7a3a" font-weight="bold">查询② [0,2,5]  limit=5</text>

  <text x="40" y="292" font-size="10.5" fill="#444">加边 dis &lt; 5：</text>
  <rect x="150" y="280" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="205" y="295" text-anchor="middle" font-size="10" fill="#333">union(0,1) dis=2</text>
  <rect x="270" y="280" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="325" y="295" text-anchor="middle" font-size="10" fill="#333">union(1,2) dis=4</text>
  <rect x="390" y="280" width="90" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="435" y="295" text-anchor="middle" font-size="10" fill="#888">8≥5 停止</text>

  <text x="40" y="324" font-size="10.5" fill="#444">UF 状态：</text>
  <circle cx="120" cy="336" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="341" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <circle cx="170" cy="336" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="341" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="220" cy="336" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="341" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="134" y1="336" x2="156" y2="336" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="184" y1="336" x2="206" y2="336" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" font-size="10" fill="#4a7a3a">0—1—2 全连通</text>

  <rect x="360" y="326" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">find(0)==find(2) → true</text>
  <text x="40" y="372" font-size="10" fill="#888">→ ans[1] = true</text>

  <text x="40" y="394" font-size="10.5" fill="#888">边指针 e 停在 edge[2]（dis=8），下个查询复用 e=2</text>

  <!-- Result -->
  <rect x="20" y="420" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="440" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">还原原序：ans = [false, true] ✓</text>
</svg>
