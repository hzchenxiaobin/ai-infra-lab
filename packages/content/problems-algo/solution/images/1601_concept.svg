<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：选请求子集 → delta 全零 → 最大化数量</text>

  <!-- Buildings row -->
  <text x="36" y="66" font-size="12" fill="#888">楼栋:</text>
  <rect x="80" y="50" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="75" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="240" y="50" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="75" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="400" y="50" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="75" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- Request arrows -->
  <text x="36" y="116" font-size="12" fill="#888">请求:</text>
  <!-- [0,1] -->
  <path d="M140,66 Q200,54 238,64" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="50" text-anchor="middle" font-size="10" fill="#4a7a3a">[0,1]</text>
  <!-- [1,0] -->
  <path d="M238,76 Q200,88 142,78" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="98" text-anchor="middle" font-size="10" fill="#d6a040">[1,0]</text>
  <!-- [0,2] -->
  <path d="M140,80 Q270,130 398,80" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="10" fill="#b85450">[0,2]</text>

  <!-- Delta array section -->
  <text x="36" y="176" font-size="12" fill="#888">delta:</text>
  <text x="92" y="176" font-size="11" fill="#444">选 {[0,1],[1,0]}</text>
  <rect x="200" y="162" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="218" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="238" y="162" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="256" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="276" y="162" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="294" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="330" y="166" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="380" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">全零 ✓ ans=2</text>

  <text x="92" y="212" font-size="11" fill="#444">选 {[0,1],[1,0],[0,2]}</text>
  <rect x="200" y="198" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="218" y="216" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
  <rect x="238" y="198" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="256" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="276" y="198" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="294" y="216" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">+1</text>
  <rect x="330" y="202" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="380" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">非零 ✗ 不合法</text>

  <!-- Key insight box -->
  <rect x="40" y="246" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">请求 [f,t]：delta[f]−−, delta[t]++</text>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#444">目标：选尽量多的请求，使 delta 全部归零</text>

  <!-- Constraint box -->
  <rect x="40" y="322" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">m ≤ 16 → 2^m ≤ 65536，可回溯枚举子集</text>
  <text x="280" y="364" text-anchor="middle" font-size="11.5" fill="#4a7a3a">增量维护 delta + 剪枝：当前 cnt + 剩余 ≤ ans 则剪</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#888">每个节点检查 delta 全零即更新 ans（不必走到叶子）</text>
</svg>
