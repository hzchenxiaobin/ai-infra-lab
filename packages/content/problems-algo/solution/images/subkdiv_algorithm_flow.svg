<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="520" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">和可被 K 整除的子数组：算法流程</text>

  <!-- Init -->
  <rect x="80" y="40" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#555">count = {0:1}, ans = 0, S = 0</text>

  <path d="M 220 100 L 220 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="80" y="122" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for x in nums</text>
  <text x="220" y="158" text-anchor="middle" font-size="10.5" fill="#555">遍历每个元素</text>

  <path d="M 220 170 L 220 188" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- S += x -->
  <rect x="110" y="192" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="220" y="217" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">S += x</text>

  <path d="M 220 236 L 220 254" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Compute remainder -->
  <rect x="100" y="258" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="220" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r = (S % K + K) % K</text>
  <text x="220" y="294" text-anchor="middle" font-size="10" fill="#b85450">⚠ 负数取模需修正</text>

  <path d="M 220 306 L 220 322" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: count[r] exists? -->
  <polygon points="220,326 340,370 220,414 100,370" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="366" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count 中有 r ?</text>
  <text x="220" y="384" text-anchor="middle" font-size="10.5" fill="#777">之前有同余前缀和？</text>

  <!-- Yes branch -->
  <path d="M 100 370 L 50 370 L 50 420" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="62" y="363" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="6" y="424" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="61" y="442" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累加答案</text>
  <text x="61" y="458" text-anchor="middle" font-size="10" fill="#555">ans += count[r]</text>

  <!-- No branch -->
  <path d="M 340 370 L 390 370 L 390 420" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="362" y="363" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="324" y="424" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="379" y="442" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">跳过</text>
  <text x="379" y="458" text-anchor="middle" font-size="10" fill="#555">命中数为 0</text>

  <!-- merge to write -->
  <path d="M 61 468 L 61 482 L 160 482" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 379 468 L 379 482 L 280 482" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- write count[r] -->
  <rect x="100" y="466" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="488" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count[r] += 1   （先查再写）</text>

  <!-- loop back -->
  <path d="M 340 484 L 410 484 L 410 144 L 360 144" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="416" y="320" font-size="9.5" fill="#aaa" transform="rotate(-90 416 320)">循环</text>

  <!-- final -->
  <text x="220" y="514" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">遍历结束 → return ans  （O(n), O(K)）</text>
</svg>
