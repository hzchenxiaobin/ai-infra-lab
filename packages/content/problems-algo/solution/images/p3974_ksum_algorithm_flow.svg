<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序取 top-k，前 t 个配乘法系数</text>

  <!-- 开始 -->
  <rect x="200" y="36" width="120" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="10.5" fill="#2f5527" filter="url(#rough2)">输入 nums, k, mul</text>
  <path d="M 260 64 L 260 78" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ① 排序 -->
  <rect x="175" y="82" width="170" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">① nums 降序排序</text>
  <path d="M 260 112 L 260 126" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② top-k -->
  <rect x="160" y="130" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="149" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">② 取前 k 个 a[0..k−1]</text>
  <path d="M 260 160 L 260 174" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ t -->
  <rect x="160" y="178" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">③ t = min(k, mul−1)</text>
  <path d="M 260 208 L 260 222" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="260,226 336,254 260,282 184,254" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; t ?</text>

  <!-- 左分支：乘法 -->
  <path d="M 184 254 L 172 254" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="178" y="246" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="18" y="232" width="150" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="93" y="251" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans += a[i]×(mul−i)</text>
  <text x="93" y="269" text-anchor="middle" font-size="8.5" fill="#a08030" filter="url(#rough2)">（系数 ≥ 2，走乘法）</text>

  <!-- 右分支：加法 -->
  <path d="M 336 254 L 348 254" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="342" y="246" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="352" y="232" width="150" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="427" y="251" text-anchor="middle" font-size="10" fill="#2f5527" font-weight="bold" filter="url(#rough2)">ans += a[i]</text>
  <text x="427" y="269" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">（系数 1，走加法）</text>

  <!-- 汇合 -->
  <path d="M 93 278 L 93 296 L 260 296" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 427 278 L 427 296 L 260 296" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 260 296 L 260 308" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="170" y="312" width="180" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">i += 1，直到 i = k</text>
  <path d="M 260 340 L 260 352" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="185" y="356" width="150" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold" filter="url(#rough2)">返回 ans（long long）</text>

  <!-- 小抄 -->
  <rect x="380" y="82" width="128" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="444" y="100" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">小抄</text>
  <text x="444" y="118" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· mul ≥ 1 ⇒ t ≥ 0</text>
  <text x="444" y="136" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 系数 mul−i ≥ 2</text>
  <text x="444" y="154" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 排序 O(n log n)</text>
  <text x="444" y="172" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 可换 nth_element</text>
  <text x="444" y="186" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  做平均 O(n) 选择</text>
</svg>
