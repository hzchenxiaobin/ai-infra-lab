<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分 k + O(n) 子序列验证</text>

  <!-- ===== Preprocess box ===== -->
  <rect x="60" y="44" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">预处理：removeTime[idx] = removable 中第几个命中</text>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#666">removeTime[removable[t]] = t （其余为 -1 表示不移除）</text>

  <path d="M 280 100 L 280 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init box ===== -->
  <rect x="150" y="120" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化：lo = 0, hi = m, ans = 0</text>

  <path d="M 280 160 L 280 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop diamond ===== -->
  <polygon points="280,178 360,212 280,246 200,212" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lo ≤ hi ?</text>

  <!-- No branch -->
  <path d="M 360 212 L 440 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="206" font-size="10" fill="#b85450">否</text>
  <rect x="440" y="194" width="92" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="486" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ans</text>
  <text x="486" y="226" text-anchor="middle" font-size="10" fill="#666">最大可行 k</text>

  <!-- Yes branch -->
  <path d="M 280 246 L 280 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="260" font-size="10" fill="#4a7a3a">是</text>

  <!-- ===== mid compute ===== -->
  <rect x="180" y="266" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mid = lo + (hi - lo) / 2</text>

  <path d="M 280 302 L 280 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== check box ===== -->
  <rect x="80" y="320" width="400" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">check(mid)：跳过 removeTime[i] &lt; mid 的字符</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#666">双指针扫 s：未移除且 s[i]==p[j] 则 j++</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#666">返回 j == p.length()</text>

  <!-- branch from check -->
  <path d="M 200 388 L 150 388 L 150 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="404" font-size="10" fill="#4a7a3a">✓ 可行</text>
  <rect x="86" y="412" width="128" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="430" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = mid</text>
  <text x="150" y="444" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lo = mid + 1</text>

  <path d="M 360 388 L 410 388 L 410 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="404" font-size="10" fill="#b85450">✗ 不可行</text>
  <rect x="346" y="412" width="128" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="430" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">hi = mid - 1</text>
  <text x="410" y="444" text-anchor="middle" font-size="11" fill="#999">缩小上界</text>

  <!-- loop back arrow to diamond -->
  <path d="M 150 450 L 150 460 L 110 460 L 110 212 L 200 212" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 450 L 410 460 L 466 460 L 466 212 L 360 212" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
