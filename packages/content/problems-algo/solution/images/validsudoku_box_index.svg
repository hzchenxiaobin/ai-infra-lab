<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">宫编号公式：box = (i ÷ 3) × 3 + (j ÷ 3)</text>

  <!-- col indices 0..8 on top -->
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="126" y="46">0</text><text x="162" y="46">1</text><text x="198" y="46">2</text>
    <text x="234" y="46">3</text><text x="270" y="46">4</text><text x="306" y="46">5</text>
    <text x="342" y="46">6</text><text x="378" y="46">7</text><text x="414" y="46">8</text>
  </g>
  <!-- row indices 0..8 on left -->
  <g font-size="10" fill="#999" text-anchor="end">
    <text x="100" y="84">0</text><text x="100" y="120">1</text><text x="100" y="156">2</text>
    <text x="100" y="192">3</text><text x="100" y="228">4</text><text x="100" y="264">5</text>
    <text x="100" y="300">6</text><text x="100" y="336">7</text><text x="100" y="372">8</text>
  </g>

  <!-- thin grid lines -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="144" y1="54" x2="144" y2="378"/>
    <line x1="180" y1="54" x2="180" y2="378"/>
    <line x1="288" y1="54" x2="288" y2="378"/>
    <line x1="324" y1="54" x2="324" y2="378"/>
    <line x1="396" y1="54" x2="396" y2="378"/>
    <line x1="108" y1="90" x2="432" y2="90"/>
    <line x1="108" y1="126" x2="432" y2="126"/>
    <line x1="108" y1="234" x2="432" y2="234"/>
    <line x1="108" y1="270" x2="432" y2="270"/>
    <line x1="108" y1="342" x2="432" y2="342"/>
  </g>
  <!-- thick box boundaries -->
  <g stroke="#888" stroke-width="2" filter="url(#rough2)">
    <rect x="108" y="54" width="324" height="324" fill="none"/>
    <line x1="216" y1="54" x2="216" y2="378"/>
    <line x1="324" y1="54" x2="324" y2="378"/>
    <line x1="108" y1="162" x2="432" y2="162"/>
    <line x1="108" y1="270" x2="432" y2="270"/>
  </g>

  <!-- box numbers 0..8 centered in each 3x3 box -->
  <g font-size="26" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="162" y="124">0</text>
    <text x="270" y="124">1</text>
    <text x="378" y="124">2</text>
    <text x="162" y="232">3</text>
    <text x="270" y="232">4</text>
    <text x="378" y="232">5</text>
    <text x="162" y="340">6</text>
    <text x="270" y="340">7</text>
    <text x="378" y="340">8</text>
  </g>

  <!-- example cells with arrows -->
  <!-- (0,0) -> box 0 -->
  <circle cx="120" cy="66" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="69" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">●</text>
  <text x="60" y="70" font-size="10" fill="#446688">(0,0)→0</text>

  <!-- (4,4) -> box 4 -->
  <rect x="264" y="222" width="12" height="12" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="232" font-size="10.5" fill="#b85450" font-weight="bold">(4,4)→4</text>
  <path d="M 276 228 L 444 228" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- (7,8) -> box 8 -->
  <rect x="408" y="354" width="12" height="12" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="364" font-size="10.5" fill="#b85450" font-weight="bold">(7,8)→8</text>
  <path d="M 420 360 L 444 360" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box at bottom -->
  <rect x="90" y="388" width="360" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="406" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">box_index = ⌊i / 3⌋ × 3 + ⌊j / 3⌋</text>
</svg>
