<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：行和=1 且 列和=1 的 1 即特殊位置</text>

  <!-- ====== Matrix 3x3, cell size 52, start x=100, y=70 ====== -->
  <text x="176" y="60" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">mat（示例 1）</text>

  <!-- Row 0 -->
  <rect x="100" y="70" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="102" text-anchor="middle" font-size="16" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <rect x="152" y="70" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="102" text-anchor="middle" font-size="13" fill="#bbb" font-family="monospace">0</text>
  <rect x="204" y="70" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="102" text-anchor="middle" font-size="13" fill="#bbb" font-family="monospace">0</text>
  <!-- Row 1 -->
  <rect x="100" y="122" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="126" y="154" text-anchor="middle" font-size="13" fill="#bbb" font-family="monospace">0</text>
  <rect x="152" y="122" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="154" text-anchor="middle" font-size="13" fill="#bbb" font-family="monospace">0</text>
  <rect x="204" y="122" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="154" text-anchor="middle" font-size="16" fill="#4a7a3a" font-family="monospace" font-weight="bold">1</text>
  <!-- Row 2 -->
  <rect x="100" y="174" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="206" text-anchor="middle" font-size="16" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <rect x="152" y="174" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="178" y="206" text-anchor="middle" font-size="13" fill="#bbb" font-family="monospace">0</text>
  <rect x="204" y="174" width="52" height="52" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="206" text-anchor="middle" font-size="13" fill="#bbb" font-family="monospace">0</text>

  <!-- ====== Row sum column (right of matrix) ====== -->
  <text x="290" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">rowSum</text>
  <rect x="266" y="70" width="48" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="102" text-anchor="middle" font-size="14" fill="#446688" font-family="monospace" font-weight="bold">1</text>
  <rect x="266" y="122" width="48" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="154" text-anchor="middle" font-size="14" fill="#446688" font-family="monospace" font-weight="bold">1</text>
  <rect x="266" y="174" width="48" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="206" text-anchor="middle" font-size="14" fill="#446688" font-family="monospace" font-weight="bold">1</text>

  <!-- ====== Col sum row (below matrix) ====== -->
  <text x="68" y="240" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">colSum</text>
  <rect x="100" y="232" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="258" text-anchor="middle" font-size="14" fill="#b85450" font-family="monospace" font-weight="bold">2</text>
  <rect x="152" y="232" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="258" text-anchor="middle" font-size="14" fill="#446688" font-family="monospace" font-weight="bold">0</text>
  <rect x="204" y="232" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="258" text-anchor="middle" font-size="14" fill="#4a7a3a" font-family="monospace" font-weight="bold">1</text>

  <!-- ====== Right side: legend & explanation ====== -->
  <!-- Special position note -->
  <rect x="350" y="80" width="180" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 特殊位置 (1,2)</text>
  <text x="440" y="118" text-anchor="middle" font-size="10" fill="#555">mat[1][2]=1</text>
  <text x="440" y="132" text-anchor="middle" font-size="10" fill="#555">rowSum[1]=1 且 colSum[2]=1</text>
  <text x="440" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ 行列均唯一 1</text>

  <!-- Non-special note -->
  <rect x="350" y="164" width="180" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="184" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">✗ 非特殊 (0,0) 与 (2,0)</text>
  <text x="440" y="202" text-anchor="middle" font-size="10" fill="#555">mat=1, rowSum=1</text>
  <text x="440" y="216" text-anchor="middle" font-size="10" fill="#555">但 colSum[0]=2</text>
  <text x="440" y="230" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">→ 列里有 2 个 1</text>

  <!-- ===== Bottom summary ===== -->
  <rect x="60" y="300" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">判定：(i,j) 特殊 ⟺ mat[i][j]=1 ∧ rowSum[i]=1 ∧ colSum[j]=1</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#888">行和=1 保证行内唯一 1；列和=1 保证列内唯一 1；二者同时成立即特殊</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#888">预处理 rowSum/colSum 各 O(mn)，扫描判定 O(mn)，总计 O(mn)</text>
</svg>
