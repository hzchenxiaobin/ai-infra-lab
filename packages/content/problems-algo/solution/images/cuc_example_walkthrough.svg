<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "ABA"（n=3）</text>

  <!-- string row: A B A, positions 0 1 2 -->
  <rect x="150" y="50" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="80" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">A</text>

  <rect x="210" y="50" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="80" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">B</text>

  <rect x="270" y="50" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="80" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">A</text>

  <text x="180" y="110" text-anchor="middle" font-size="11" fill="#888">pos 0</text>
  <text x="240" y="110" text-anchor="middle" font-size="11" fill="#888">pos 1</text>
  <text x="300" y="110" text-anchor="middle" font-size="11" fill="#888">pos 2</text>

  <!-- table header -->
  <rect x="60" y="130" width="80" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="150" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">位置 i</text>
  <rect x="140" y="130" width="80" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">字符</text>
  <rect x="220" y="130" width="90" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="150" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">prev</text>
  <rect x="310" y="130" width="90" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="150" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">next</text>
  <rect x="400" y="130" width="80" height="30" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="150" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">贡献</text>

  <!-- row 0 -->
  <rect x="60" y="162" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="140" y="162" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A</text>
  <rect x="220" y="162" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="184" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="310" y="162" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="184" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="400" y="162" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="184" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- row 1 -->
  <rect x="60" y="198" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="220" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="140" y="198" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="220" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>
  <rect x="220" y="198" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="220" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="310" y="198" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="220" text-anchor="middle" font-size="12" fill="#333">3 (=n)</text>
  <rect x="400" y="198" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>

  <!-- row 2 -->
  <rect x="60" y="234" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="256" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="140" y="234" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">A</text>
  <rect x="220" y="234" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="256" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="310" y="234" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="256" text-anchor="middle" font-size="12" fill="#333">3 (=n)</text>
  <rect x="400" y="234" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="256" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- computation notes -->
  <rect x="60" y="284" width="420" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="305" text-anchor="middle" font-size="11" fill="#444">i=0: (0−(−1))×(2−0) = 1×2 = 2</text>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#444">i=1: (1−(−1))×(3−1) = 2×2 = 4</text>
  <text x="270" y="339" text-anchor="middle" font-size="11" fill="#444">i=2: (2−0)×(3−2) = 2×1 = 2</text>

  <!-- answer -->
  <rect x="60" y="358" width="420" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = 2 + 4 + 2 = 8 ✓</text>
</svg>
