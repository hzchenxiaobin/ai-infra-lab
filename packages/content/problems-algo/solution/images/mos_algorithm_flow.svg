<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历计数 + 贪心选最优插入</text>

  <!-- Step 1: Init -->
  <rect x="170" y="46" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 cntA=0, cntB=0, existing=0</text>

  <line x1="260" y1="84" x2="260" y2="100" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop header -->
  <polygon points="180,104 340,104 360,128 340,152 180,152 160,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">遍历 text 中每个字符 ch</text>

  <line x1="260" y1="154" x2="260" y2="168" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Check ch == b -->
  <polygon points="190,172 330,172 350,196 330,220 190,220 170,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ch == pattern[1] (b)?</text>

  <!-- Yes branch -->
  <line x1="350" y1="196" x2="380" y2="196" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="190" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="380" y="178" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">existing += cntA</text>
  <text x="440" y="208" text-anchor="middle" font-size="10" fill="#b85450">cntB += 1</text>

  <line x1="440" y1="214" x2="440" y2="236" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="440" y1="236" x2="260" y2="236" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- No branch: fall through -->
  <line x1="260" y1="222" x2="260" y2="238" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="232" font-size="10" fill="#888">否</text>

  <!-- Step 4: Check ch == a -->
  <polygon points="190,242 330,242 350,266 330,290 190,290 170,266" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ch == pattern[0] (a)?</text>

  <!-- Yes branch -->
  <line x1="350" y1="266" x2="380" y2="266" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="260" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="380" y="248" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cntA += 1</text>

  <line x1="440" y1="284" x2="440" y2="306" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="440" y1="306" x2="260" y2="306" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- No branch: fall through -->
  <line x1="260" y1="292" x2="260" y2="308" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="302" font-size="10" fill="#888">否</text>

  <!-- Step 5: Loop back -->
  <line x1="260" y1="310" x2="260" y2="322" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="324" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">回到遍历下一个字符</text>

  <line x1="260" y1="356" x2="260" y2="370" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: Compute gain -->
  <rect x="150" y="374" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="396" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">gain = max(cntA, cntB)</text>

  <line x1="260" y1="412" x2="260" y2="424" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 7: Return -->
  <rect x="120" y="428" width="280" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="446" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">return existing + gain</text>

  <!-- Note about order -->
  <rect x="370" y="172" width="140" height="50" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="376" y="186" font-size="8" fill="#b85450" font-weight="bold">⚠ 判断顺序</text>
  <text x="376" y="198" font-size="8" fill="#666">先判 b 再判 a</text>
  <text x="376" y="210" font-size="8" fill="#666">a==b 时避免自配对</text>
</svg>
