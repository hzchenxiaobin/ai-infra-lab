<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#6a9acc"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：n = 6 (110₂)</text>

  <!-- 上半：递归推导 -->
  <rect x="30" y="40" width="480" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="62" font-size="12" fill="#4a7a3a" font-weight="bold">递归推导</text>

  <text x="50" y="86" font-size="12" fill="#333">n = 110₂，最高位 k = 2，m = 010₂（去掉 bit 2）</text>
  <text x="50" y="106" font-size="12" fill="#333">m ⊕ 2^(k−1) = 010₂ ⊕ 010₂ = 000₂</text>
  <text x="50" y="126" font-size="12" fill="#b85450" font-weight="bold">f(6) = f(0) + 2^2 = 0 + 4 = 4</text>
  <text x="50" y="146" font-size="11" fill="#888">阶段A: 010→010 花 0 次 | 阶段B: 翻 bit2 花 1 次 | 阶段C: 清 010 花 3 次</text>

  <!-- 下半：操作序列 -->
  <rect x="30" y="172" width="480" height="210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="194" font-size="12" fill="#a87020" font-weight="bold">实际操作序列（4 步）</text>

  <!-- 状态1: 110 -->
  <g filter="url(#rough2)">
    <rect x="50" y="210" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="67" y="232" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <rect x="84" y="210" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="101" y="232" text-anchor="middle" font-size="14" fill="#a87020" font-weight="bold">1</text>
    <rect x="118" y="210" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="135" y="232" text-anchor="middle" font-size="14" fill="#446688">0</text>
  </g>
  <text x="101" y="262" text-anchor="middle" font-size="10" fill="#888">110</text>

  <!-- 箭头1: flip bit 2 -->
  <path d="M 156 227 L 188 227" stroke="#6a9acc" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="220" text-anchor="middle" font-size="9.5" fill="#6a9acc">翻bit2</text>
  <text x="172" y="244" text-anchor="middle" font-size="9" fill="#888">op2</text>

  <!-- 状态2: 010 -->
  <g filter="url(#rough2)">
    <rect x="190" y="210" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="207" y="232" text-anchor="middle" font-size="14" fill="#446688">0</text>
    <rect x="224" y="210" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="241" y="232" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <rect x="258" y="210" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="275" y="232" text-anchor="middle" font-size="14" fill="#446688">0</text>
  </g>
  <text x="241" y="262" text-anchor="middle" font-size="10" fill="#888">010</text>

  <!-- 箭头2: flip bit 0 -->
  <path d="M 296 227 L 328 227" stroke="#6a9acc" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="220" text-anchor="middle" font-size="9.5" fill="#6a9acc">翻bit0</text>
  <text x="312" y="244" text-anchor="middle" font-size="9" fill="#888">op1</text>

  <!-- 状态3: 011 -->
  <g filter="url(#rough2)">
    <rect x="330" y="210" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="347" y="232" text-anchor="middle" font-size="14" fill="#446688">0</text>
    <rect x="364" y="210" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="381" y="232" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <rect x="398" y="210" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="415" y="232" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  </g>
  <text x="381" y="262" text-anchor="middle" font-size="10" fill="#888">011</text>

  <!-- 换行箭头到状态4 -->
  <path d="M 415 248 L 415 278 L 67 278 L 67 300" stroke="#6a9acc" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="294" text-anchor="middle" font-size="9.5" fill="#6a9acc">翻bit1 (op2，因 bit0=1)</text>

  <!-- 状态4: 001 -->
  <g filter="url(#rough2)">
    <rect x="50" y="304" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="67" y="326" text-anchor="middle" font-size="14" fill="#446688">0</text>
    <rect x="84" y="304" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="101" y="326" text-anchor="middle" font-size="14" fill="#446688">0</text>
    <rect x="118" y="304" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="135" y="326" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  </g>
  <text x="101" y="356" text-anchor="middle" font-size="10" fill="#888">001</text>

  <!-- 箭头4: flip bit 0 -->
  <path d="M 156 321 L 188 321" stroke="#6a9acc" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="314" text-anchor="middle" font-size="9.5" fill="#6a9acc">翻bit0</text>
  <text x="172" y="338" text-anchor="middle" font-size="9" fill="#888">op1</text>

  <!-- 状态5: 000 -->
  <g filter="url(#rough2)">
    <rect x="190" y="304" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="207" y="326" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="224" y="304" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="241" y="326" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="258" y="304" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="275" y="326" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  </g>
  <text x="241" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">000 ✓</text>

  <!-- 结论框 -->
  <rect x="330" y="304" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="324" text-anchor="middle" font-size="11" fill="#333">共 4 次操作</text>
  <text x="420" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">与递归 f(6)=4 一致</text>
</svg>
