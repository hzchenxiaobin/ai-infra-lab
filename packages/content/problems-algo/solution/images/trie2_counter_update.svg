<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c04050"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">insert / erase 沿路径更新计数器</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="58" text-anchor="middle" font-size="11" fill="#888">insert 沿路径每个节点 cnt_pass+1，末节点 cnt_end+1；erase 对称地 −1</text>

  <!-- ===== Left: insert flow ===== -->
  <text x="240" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e8b57">insert("apple")</text>

  <!-- path nodes for insert -->
  <g filter="url(#sk)">
    <circle cx="80" cy="130" r="18" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.4"/>
  </g>
  <text x="80" y="134" text-anchor="middle" font-size="9" fill="#2e6e2e">root</text>
  <text x="80" y="160" text-anchor="middle" font-size="8" fill="#2e8b57" font-weight="bold">pass+1</text>

  <path d="M 98 130 L 142 130" stroke="#2e8b57" stroke-width="1.3" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="120" y="122" font-size="9" fill="#2e8b57">a</text>
  <g filter="url(#sk)">
    <circle cx="160" cy="130" r="18" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.4"/>
  </g>
  <text x="160" y="134" text-anchor="middle" font-size="9" fill="#2e6e2e">a</text>
  <text x="160" y="160" text-anchor="middle" font-size="8" fill="#2e8b57" font-weight="bold">pass+1</text>

  <path d="M 178 130 L 222 130" stroke="#2e8b57" stroke-width="1.3" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="200" y="122" font-size="9" fill="#2e8b57">p</text>
  <g filter="url(#sk)">
    <circle cx="240" cy="130" r="18" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.4"/>
  </g>
  <text x="240" y="134" text-anchor="middle" font-size="9" fill="#2e6e2e">p</text>
  <text x="240" y="160" text-anchor="middle" font-size="8" fill="#2e8b57" font-weight="bold">pass+1</text>

  <path d="M 258 130 L 302 130" stroke="#2e8b57" stroke-width="1.3" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="280" y="122" font-size="9" fill="#2e8b57">p</text>
  <g filter="url(#sk)">
    <circle cx="320" cy="130" r="18" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.4"/>
  </g>
  <text x="320" y="134" text-anchor="middle" font-size="9" fill="#2e6e2e">p</text>
  <text x="320" y="160" text-anchor="middle" font-size="8" fill="#2e8b57" font-weight="bold">pass+1</text>

  <path d="M 338 130 L 382 130" stroke="#2e8b57" stroke-width="1.3" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="360" y="122" font-size="9" fill="#2e8b57">l</text>
  <g filter="url(#sk)">
    <circle cx="400" cy="130" r="18" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.4"/>
  </g>
  <text x="400" y="134" text-anchor="middle" font-size="9" fill="#2e6e2e">l</text>
  <text x="400" y="160" text-anchor="middle" font-size="8" fill="#2e8b57" font-weight="bold">pass+1</text>

  <path d="M 418 130 L 462 130" stroke="#2e8b57" stroke-width="1.3" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="440" y="122" font-size="9" fill="#2e8b57">e</text>
  <g filter="url(#sk)">
    <circle cx="480" cy="130" r="20" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="480" y="134" text-anchor="middle" font-size="9" fill="#8a6a1a" font-weight="bold">e</text>
  <text x="480" y="162" text-anchor="middle" font-size="8" fill="#c98a2b" font-weight="bold">pass+1</text>
  <text x="480" y="176" text-anchor="middle" font-size="8" fill="#c04050" font-weight="bold">end+1 ★</text>

  <!-- insert pseudo -->
  <g filter="url(#sk)">
    <rect x="40" y="210" width="500" height="130" rx="8" fill="#f6f6f6" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="60" y="232" font-size="11" font-weight="bold" fill="#2e8b57">insert(word):</text>
  <g font-size="10" fill="#444" font-family="'Comic Sans MS','Segoe UI',monospace">
    <text x="60" y="252">node = root</text>
    <text x="60" y="270">for c in word:</text>
    <text x="76" y="288">idx = c - 'a'</text>
    <text x="76" y="306">if !node.children[idx]: 新建</text>
    <text x="76" y="324">node = node.children[idx]</text>
    <text x="76" y="342" fill="#2e8b57" font-weight="bold">node.cnt_pass += 1   # 每经过一节点 +1</text>
  </g>

  <!-- ===== Right: erase flow ===== -->
  <text x="720" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#c04050">erase("apple")</text>

  <g filter="url(#sk2)">
    <circle cx="560" cy="130" r="18" fill="#fce4ec" stroke="#c04050" stroke-width="1.4"/>
  </g>
  <text x="560" y="134" text-anchor="middle" font-size="9" fill="#8a3030">root</text>
  <text x="560" y="160" text-anchor="middle" font-size="8" fill="#c04050" font-weight="bold">pass−1</text>

  <path d="M 578 130 L 622 130" stroke="#c04050" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="600" y="122" font-size="9" fill="#c04050">a</text>
  <g filter="url(#sk2)">
    <circle cx="640" cy="130" r="18" fill="#fce4ec" stroke="#c04050" stroke-width="1.4"/>
  </g>
  <text x="640" y="134" text-anchor="middle" font-size="9" fill="#8a3030">a</text>
  <text x="640" y="160" text-anchor="middle" font-size="8" fill="#c04050" font-weight="bold">pass−1</text>

  <path d="M 658 130 L 702 130" stroke="#c04050" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="680" y="122" font-size="9" fill="#c04050">p</text>
  <g filter="url(#sk2)">
    <circle cx="720" cy="130" r="18" fill="#fce4ec" stroke="#c04050" stroke-width="1.4"/>
  </g>
  <text x="720" y="134" text-anchor="middle" font-size="9" fill="#8a3030">p</text>
  <text x="720" y="160" text-anchor="middle" font-size="8" fill="#c04050" font-weight="bold">pass−1</text>

  <path d="M 738 130 L 782 130" stroke="#c04050" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="760" y="122" font-size="9" fill="#c04050">p</text>
  <g filter="url(#sk2)">
    <circle cx="800" cy="130" r="18" fill="#fce4ec" stroke="#c04050" stroke-width="1.4"/>
  </g>
  <text x="800" y="134" text-anchor="middle" font-size="9" fill="#8a3030">p</text>
  <text x="800" y="160" text-anchor="middle" font-size="8" fill="#c04050" font-weight="bold">pass−1</text>

  <path d="M 818 130 L 862 130" stroke="#c04050" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="840" y="122" font-size="9" fill="#c04050">l</text>
  <g filter="url(#sk2)">
    <circle cx="880" cy="130" r="18" fill="#fce4ec" stroke="#c04050" stroke-width="1.4"/>
  </g>
  <text x="880" y="134" text-anchor="middle" font-size="9" fill="#8a3030">l</text>
  <text x="880" y="160" text-anchor="middle" font-size="8" fill="#c04050" font-weight="bold">pass−1</text>

  <!-- e node (end) -->
  <g filter="url(#sk2)">
    <circle cx="880" cy="200" r="20" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="880" y="204" text-anchor="middle" font-size="9" fill="#8a6a1a" font-weight="bold">e</text>
  <text x="880" y="230" text-anchor="middle" font-size="8" fill="#c04050" font-weight="bold">pass−1</text>
  <text x="880" y="244" text-anchor="middle" font-size="8" fill="#c04050" font-weight="bold">end−1 ★</text>
  <path d="M 880 148 L 880 180" stroke="#c04050" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="892" y="170" font-size="9" fill="#c04050">e</text>

  <!-- erase pseudo -->
  <g filter="url(#sk2)">
    <rect x="560" y="270" width="360" height="120" rx="8" fill="#f6f6f6" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="580" y="292" font-size="11" font-weight="bold" fill="#c04050">erase(word):</text>
  <g font-size="10" fill="#444" font-family="'Comic Sans MS','Segoe UI',monospace">
    <text x="580" y="312">node = root</text>
    <text x="580" y="330">for c in word:</text>
    <text x="596" y="348">node = node.children[idx]</text>
    <text x="596" y="366" fill="#c04050" font-weight="bold">node.cnt_pass -= 1</text>
    <text x="580" y="384" fill="#c04050" font-weight="bold">node.cnt_end -= 1   # 末节点</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="370" width="500" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 insert 与 erase 完全对称：沿路径逐节点改 cnt_pass，</text>
  <text x="290" y="400" text-anchor="middle" font-size="10" fill="#2b6e9e">末节点额外改 cnt_end。无需真正删节点，cnt_pass=0 即等价于回收。</text>
</svg>
