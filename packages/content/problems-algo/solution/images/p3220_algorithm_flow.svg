<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：按天分组 → 组内判奇偶分流 → 两列聚合 → 升序输出</text>

  <rect x="155" y="44" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">FROM transactions（n 行流水）</text>

  <path d="M 260 76 L 260 94" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="98" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">GROUP BY transaction_date</text>

  <path d="M 260 130 L 260 154" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,160 350,196 260,232 170,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">amount 奇？</text>

  <path d="M 170 196 L 150 196" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="160" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="22" y="176" width="126" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="85" y="193" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">odd_sum</text>
  <text x="85" y="209" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+= amount</text>

  <path d="M 350 196 L 370 196" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="188" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="372" y="176" width="126" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="435" y="193" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">even_sum</text>
  <text x="435" y="209" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+= amount</text>

  <path d="M 85 216 C 85 258, 180 262, 233 286" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <path d="M 435 216 C 435 258, 340 262, 287 286" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="140" y="290" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每天一行 (date, odd_sum, even_sum)</text>

  <path d="M 260 326 L 260 346" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="350" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ORDER BY transaction_date 升序</text>

  <rect x="70" y="404" width="380" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="426" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">CASE 的 ELSE 0 分支：另一路记 0，空集不会以 NULL 露脸</text>
</svg>
