<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">富有关系建 DAG：边 穷→富，answer[x] = x 富有锥里最安静的人</text>

  <!-- Shaded "richer cone" of node 0 (reachable set {0,1,2,3,4,5,6}) -->
  <path d="M 40 170 Q 30 200 40 240 Q 150 270 290 250 Q 410 260 470 200 Q 470 110 290 90 Q 150 80 40 170 Z"
        fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="150" y="345" text-anchor="middle" font-size="10" fill="#4a7a3a">person 0 的富有锥（0 及所有比 0 富的人）→ 最安静 = person 5</text>

  <!-- Edges (poorer -> richer) -->
  <!-- 0 -> 1 -->
  <path d="M 92 200 L 158 200" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 1 -> 2 -->
  <path d="M 198 188 Q 240 150 282 122" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 1 -> 3 -->
  <path d="M 198 212 Q 240 240 282 252" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 7 -> 3 (green, outside cone) -->
  <path d="M 198 300 Q 240 280 282 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 3 -> 4 -->
  <path d="M 332 238 Q 370 200 410 162" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 3 -> 5 (highlight, leads to answer) -->
  <path d="M 334 250 L 408 230" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 3 -> 6 -->
  <path d="M 332 262 Q 370 290 410 312" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Nodes: id big, quiet value small. layout: poor(left) -> rich(right) -->
  <!-- Node 0 (start, poorest in cone) -->
  <circle cx="70" cy="200" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="70" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="70" y="240" text-anchor="middle" font-size="9" fill="#446688">q=3</text>

  <!-- Node 1 -->
  <circle cx="180" cy="200" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="180" y="232" text-anchor="middle" font-size="9" fill="#446688">q=2</text>

  <!-- Node 2 -->
  <circle cx="300" cy="110" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="300" y="88" text-anchor="middle" font-size="9" fill="#446688">q=5</text>

  <!-- Node 3 -->
  <circle cx="300" cy="250" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="255" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="300" y="282" text-anchor="middle" font-size="9" fill="#446688">q=4</text>

  <!-- Node 7 (outside cone, green) -->
  <circle cx="180" cy="310" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="315" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <text x="180" y="342" text-anchor="middle" font-size="9" fill="#4a7a3a">q=0 最静</text>

  <!-- Node 4 -->
  <circle cx="430" cy="150" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="430" y="128" text-anchor="middle" font-size="9" fill="#446688">q=6</text>

  <!-- Node 5 (answer for cone, highlighted) -->
  <circle cx="430" cy="230" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="430" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="430" y="262" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">q=1 答案</text>

  <!-- Node 6 -->
  <circle cx="430" cy="320" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="325" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="430" y="352" text-anchor="middle" font-size="9" fill="#446688">q=7</text>

  <!-- Annotation box -->
  <rect x="30" y="36" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="52" text-anchor="middle" font-size="10" fill="#444">[ai,bi]=ai 比 bi 富 → 建边 bi→ai（穷指富）</text>
  <text x="150" y="65" text-anchor="middle" font-size="10" fill="#666">从 x 出发能到的点 = 所有比 x 富的人</text>
</svg>
