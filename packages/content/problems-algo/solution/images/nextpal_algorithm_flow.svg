<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="500" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">下个由相同数字构成的回文串 — 算法流程</text>

  <!-- Start -->
  <rect x="110" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="69" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入：num（回文串）</text>

  <path d="M 230 88 L 230 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: Split -->
  <rect x="50" y="108" width="360" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 切分前半</text>
  <text x="230" y="148" text-anchor="middle" font-size="10.5" fill="#555">half = num[:n//2]</text>
  <text x="230" y="160" text-anchor="middle" font-size="10.5" fill="#b85450">奇数长度额外取 mid = num[n//2]</text>

  <path d="M 230 168 L 230 184" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: next_permutation -->
  <rect x="50" y="188" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 对 half 执行 next_permutation</text>
  <text x="230" y="228" text-anchor="middle" font-size="10.5" fill="#555">从右找升序对 i → 找后继 j → 交换 → 反转</text>
  <text x="230" y="240" text-anchor="middle" font-size="10" fill="#888">复用 31 题算法，O(n) 原地修改</text>

  <path d="M 230 248 L 230 264" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: has next perm? -->
  <polygon points="230,268 340,308 230,348 120,308" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">存在下个排列？</text>
  <text x="230" y="322" text-anchor="middle" font-size="10" fill="#777">（half 非降序）</text>

  <!-- No branch -->
  <path d="M 340 308 L 410 308 L 410 392" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="352" y="300" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="350" y="396" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="421" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 ""</text>

  <!-- Yes branch -->
  <path d="M 230 348 L 230 364" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="248" y="360" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Step 3: mirror -->
  <rect x="50" y="368" width="280" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="190" y="390" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 拼接回文并返回</text>
  <text x="190" y="408" text-anchor="middle" font-size="10.5" fill="#555">偶数：half + reverse(half)</text>
  <text x="190" y="420" text-anchor="middle" font-size="10.5" fill="#555">奇数：half + mid + reverse(half)</text>

  <!-- footer note -->
  <rect x="30" y="452" width="400" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="230" y="475" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键前提：num 本身是回文 → 前半即半频数字</text>
</svg>
