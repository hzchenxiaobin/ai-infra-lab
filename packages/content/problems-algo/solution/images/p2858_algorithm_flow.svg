<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="404" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：BFS 定序 + 两趟线性扫描（全程无递归）</text>

  <!-- ① 建带权邻接表 -->
  <rect x="90" y="44" width="380" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">① 建带权邻接表</text>
  <text x="280" y="90" text-anchor="middle" font-size="10.5" fill="#446688">原边 u→v：adj[u] += (v, 0)；adj[v] += (u, 1)　← 权重 = 从本端走向邻居的代价</text>

  <path d="M 280 102 L 280 118" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② BFS 定序 -->
  <rect x="90" y="122" width="380" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">② BFS 定序（根 = 0）</text>
  <text x="280" y="163" text-anchor="middle" font-size="10.5" fill="#446688">order[]：父先于子；parent[]：记录每个点的父亲</text>

  <!-- 分叉箭头 -->
  <path d="M 280 172 L 280 184" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 150 184 L 410 184" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 150 184 L 150 200" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 184 L 410 200" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 第一趟 -->
  <rect x="30" y="204" width="240" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 第一趟：逆序扫 order</text>
  <text x="150" y="244" text-anchor="middle" font-size="10" fill="#888">（孩子先于父亲 = 后序效果）</text>
  <text x="150" y="264" text-anchor="middle" font-size="11" fill="#446688">dp[u] += dp[v] + w(u→v)</text>
  <text x="150" y="284" text-anchor="middle" font-size="11" fill="#446688">收尾：answer[0] = dp[0]</text>

  <!-- ④ 第二趟 -->
  <rect x="290" y="204" width="240" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 第二趟：正序扫 order</text>
  <text x="410" y="244" text-anchor="middle" font-size="10" fill="#888">（父亲先于孩子 = 前序效果）</text>
  <text x="410" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a">answer[v] = answer[u]</text>
  <text x="410" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a">− w(u→v) + (1 − w(u→v))</text>

  <!-- 汇合箭头 -->
  <path d="M 150 300 L 150 318" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 300 L 410 318" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 返回 -->
  <rect x="90" y="322" width="380" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 返回 answer[]</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#888">answer[i] = 从 i 出发到达全部节点的最少反转次数</text>

  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#b85450">全程迭代无递归：n ≤ 10⁵ 的链状树也不会爆栈</text>
</svg>
