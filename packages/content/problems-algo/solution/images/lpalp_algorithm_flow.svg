<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="640" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：构造回文 + 因式验证</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>
  <line x1="270" y1="76" x2="270" y2="92" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- n==1 diamond -->
  <polygon points="270,94 340,128 270,162 200,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">n == 1 ?</text>

  <!-- Yes branch to return 9 -->
  <line x1="340" y1="128" x2="392" y2="128" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="394" y="110" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="449" y="133" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return 9</text>

  <!-- No branch down -->
  <line x1="270" y1="162" x2="270" y2="178" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="174" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- upper/lower -->
  <rect x="130" y="180" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">upper = 10^n − 1；lower = 10^(n−1)</text>
  <line x1="270" y1="220" x2="270" y2="236" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- x = upper (outer loop start) -->
  <rect x="130" y="238" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="263" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">x = upper （外层：x 从大到小）</text>
  <line x1="270" y1="278" x2="270" y2="294" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- construct P -->
  <rect x="130" y="296" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="321" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">P = x · 10^n + reverse(x)</text>
  <line x1="270" y1="336" x2="270" y2="352" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- y = upper (inner loop start) -->
  <rect x="130" y="354" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="379" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">y = upper （内层：y 从大到小）</text>
  <line x1="270" y1="394" x2="270" y2="410" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- y*y >= P ? -->
  <polygon points="270,412 350,448 270,484 190,448" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="445" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">y · y ≥ P ?</text>
  <text x="270" y="460" text-anchor="middle" font-size="10" fill="#888">（y ≥ √P）</text>

  <!-- No: x = x - 1, loop back to outer -->
  <path d="M 190 448 L 80 448 L 80 258 L 128 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="84" y="352" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <text x="84" y="368" font-size="10" fill="#b85450">x ← x−1</text>
  <text x="84" y="382" font-size="10" fill="#b85450">换下一个</text>
  <text x="84" y="396" font-size="10" fill="#b85450">回文</text>

  <!-- Yes down -->
  <line x1="270" y1="484" x2="270" y2="500" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="496" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- P % y == 0 and range ? -->
  <polygon points="270,502 380,548 270,594 160,548" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="542" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">P % y == 0</text>
  <text x="270" y="558" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">且 lower ≤ P/y ≤ upper ?</text>

  <!-- No: y = y - 1, loop back to inner -->
  <path d="M 380 548 L 460 548 L 460 374 L 412 374" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="466" y="458" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <text x="466" y="474" font-size="10" fill="#b85450">y ← y−1</text>

  <!-- Yes: return P % 1337 -->
  <line x1="270" y1="594" x2="270" y2="606" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="602" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="170" y="608" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="628" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return P mod 1337</text>
</svg>
