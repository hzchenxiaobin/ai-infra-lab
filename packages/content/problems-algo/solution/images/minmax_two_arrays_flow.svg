<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分答案 M + O(1) 可行性判定</text>

  <!-- 单调性带 -->
  <text x="30" y="52" font-size="11.5" fill="#d6a040" font-weight="bold">feasible(M) 单调：M 越大三池越大 → 前段 ✗，后段 ✓，取首个 ✓</text>

  <!-- 13 个候选格 -->
  <!-- 7 个 infeasible -->
  <rect x="30" y="62" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="44" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="60" y="62" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="74" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="90" y="62" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="104" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="120" y="62" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="134" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="150" y="62" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="180" y="62" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="194" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="210" y="62" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="224" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <!-- 首个 feasible -->
  <rect x="240" y="62" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="270" y="62" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="284" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="300" y="62" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="314" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="330" y="62" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="344" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="360" y="62" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="374" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="390" y="62" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="404" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 答案指针 -->
  <path d="M 254 96 L 254 112 L 254 116" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="108" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">答案</text>
  <text x="430" y="80" font-size="10.5" fill="#888">M ↑</text>

  <!-- 可行性判定框 -->
  <rect x="30" y="128" width="480" height="158" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="150" font-size="12" fill="#446688" font-weight="bold">feasible(M)：三条件同时成立即可分配（贪心：arr1 先用左月牙，余量取共享池）</text>

  <text x="50" y="176" font-size="11.5" fill="#446688" font-weight="bold">① A = M − ⌊M/d₁⌋ ≥ uniqueCnt1</text>
  <text x="320" y="176" font-size="10.5" fill="#888">arr1 池够装下 arr1 需要量</text>

  <text x="50" y="200" font-size="11.5" fill="#4a7a3a" font-weight="bold">② B = M − ⌊M/d₂⌋ ≥ uniqueCnt2</text>
  <text x="320" y="200" font-size="10.5" fill="#888">arr2 池够装下 arr2 需要量</text>

  <text x="50" y="224" font-size="11.5" fill="#b85450" font-weight="bold">③ A + B − C = M − ⌊M/lcm⌋ ≥ uniqueCnt1 + uniqueCnt2</text>
  <text x="380" y="224" font-size="10.5" fill="#888">并集 ≥ 总需求</text>

  <text x="50" y="250" font-size="10.5" fill="#333">⌊·⌋ 为整除取整；lcm = d₁·d₂ / gcd(d₁,d₂)。①②管“各自够”，③管“共享池够分”。</text>
  <text x="50" y="270" font-size="10.5" fill="#333">三条同时 ⇒ 共享池 C 够吸收两端的溢出（见正文证），故充要。</text>

  <!-- 输入/输出 -->
  <rect x="30" y="300" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="105" y="318" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">候选 M</text>
  <text x="105" y="334" text-anchor="middle" font-size="10" fill="#888">（二分中点）</text>

  <path d="M 180 320 L 210 320" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="314" text-anchor="middle" font-size="9.5" fill="#888">代入</text>

  <rect x="210" y="300" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="318" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">feasible(M)?</text>
  <text x="285" y="334" text-anchor="middle" font-size="10" fill="#888">① ∧ ② ∧ ③</text>

  <path d="M 360 320 L 390 320" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="390" y="300" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true / false</text>
  <text x="450" y="334" text-anchor="middle" font-size="10" fill="#888">收窄二分</text>

  <text x="270" y="366" text-anchor="middle" font-size="10" fill="#888">区间 [1, 2·(cnt1+cnt2)]；每步 O(1)，共 O(log(cnt1+cnt2)) ≈ 31 次</text>
</svg>
