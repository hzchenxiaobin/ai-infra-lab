<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历 patterns，子串命中即计数</text>

  <!-- ===== Start ===== -->
  <rect x="200" y="40" width="140" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 270 70 L 270 82" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== count = 0 ===== -->
  <rect x="200" y="84" width="140" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="104" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">count = 0</text>
  <path d="M 270 114 L 270 126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop container ===== -->
  <rect x="60" y="128" width="420" height="206" rx="10" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#888" font-style="italic">对每个 pattern p ∈ patterns 重复</text>

  <!-- ===== 取 pattern p ===== -->
  <rect x="210" y="158" width="120" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取 pattern p</text>
  <path d="M 270 188 L 270 202" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: p 是 word 子串? ===== -->
  <path d="M 270 204 L 340 240 L 270 276 L 200 240 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="237" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p 是 word</text>
  <text x="270" y="251" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">子串?</text>

  <!-- Yes branch: left -->
  <path d="M 200 240 L 150 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="175" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="80" y="226" width="68" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="114" y="245" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count++</text>
  <path d="M 114 254 L 114 290 L 270 290" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- No branch: right -->
  <path d="M 340 240 L 390 240" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="234" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">否</text>
  <rect x="392" y="226" width="68" height="28" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="245" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">跳过</text>
  <path d="M 426 254 L 426 290 L 270 290" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge → 下一个 pattern -->
  <path d="M 270 290 L 270 304" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="306" width="120" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#555">下一个 pattern</text>

  <!-- loop back arrow -->
  <path d="M 330 318 L 500 318 L 500 173 L 332 173" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="508" y="248" font-size="10" fill="#888" font-style="italic">循环</text>

  <!-- ===== After loop: return count ===== -->
  <path d="M 270 334 L 270 356" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="200" y="358" width="140" height="32" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="379" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return count</text>
</svg>
