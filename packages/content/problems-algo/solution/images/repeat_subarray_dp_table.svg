<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">dp 填表演算：nums1=[1,2,3,2,1] × nums2=[3,2,1,4,7]</text>
  <path d="M 130 38 Q 280 46 430 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- column headers (nums2) -->
  <text x="78" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">nums2→</text>
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold" text-anchor="middle">
    <rect x="92" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="148" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="204" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="260" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="316" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="372" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <text x="120" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">""</text>
  <text x="176" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="232" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="288" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="344" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="400" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">7</text>

  <!-- row headers (nums1) -->
  <text x="58" y="200" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">nums1</text>
  <text x="58" y="214" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">↓</text>
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold" text-anchor="middle">
    <rect x="36" y="84" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="36" y="118" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="36" y="152" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="36" y="186" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="36" y="220" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="36" y="254" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <text x="64" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">""</text>
  <text x="64" y="136" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="64" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="64" y="204" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="64" y="238" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="64" y="272" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <!-- data cells: 6 rows x 6 cols. cell w=56 h=34. origin x=92 y=84 -->
  <!-- Row 0 ("" boundary): all 0 gray dashed -->
  <g filter="url(#rough2)">
    <rect x="92" y="84" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="148" y="84" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="204" y="84" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="260" y="84" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="316" y="84" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="372" y="84" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
  </g>
  <g font-size="12" fill="#bbb" text-anchor="middle">
    <text x="120" y="102">0</text><text x="176" y="102">0</text><text x="232" y="102">0</text>
    <text x="288" y="102">0</text><text x="344" y="102">0</text><text x="400" y="102">0</text>
  </g>

  <!-- Row 1 (nums1="1"): match at j=3 (col "1") → 1 -->
  <g filter="url(#rough2)">
    <rect x="92" y="118" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="148" y="118" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="204" y="118" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="260" y="118" width="56" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="3"/>
    <rect x="316" y="118" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="372" y="118" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>
  <g font-size="12.5" fill="#bbb" text-anchor="middle"><text x="120" y="136">0</text></g>
  <text x="288" y="136" text-anchor="middle" font-size="12.5" fill="#4a8e4a" font-weight="bold">1</text>
  <g font-size="12" fill="#ccc" text-anchor="middle"><text x="176" y="136">0</text><text x="232" y="136">0</text><text x="344" y="136">0</text><text x="400" y="136">0</text></g>

  <!-- Row 2 (nums1="2"): match at j=2 (col "2") → 1 (isolated) -->
  <g filter="url(#rough2)">
    <rect x="92" y="152" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="148" y="152" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="204" y="152" width="56" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="3"/>
    <rect x="260" y="152" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="316" y="152" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="372" y="152" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>
  <g font-size="12" fill="#bbb" text-anchor="middle"><text x="120" y="170">0</text></g>
  <text x="232" y="170" text-anchor="middle" font-size="12.5" fill="#4a8e4a" font-weight="bold">1</text>
  <g font-size="12" fill="#ccc" text-anchor="middle"><text x="176" y="170">0</text><text x="288" y="170">0</text><text x="344" y="170">0</text><text x="400" y="170">0</text></g>

  <!-- Row 3 (nums1="3"): match at j=1 (col "3") → 1 (diagonal start) -->
  <g filter="url(#rough2)">
    <rect x="92" y="186" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="148" y="186" width="56" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="3"/>
    <rect x="204" y="186" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="260" y="186" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="316" y="186" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="372" y="186" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>
  <g font-size="12" fill="#bbb" text-anchor="middle"><text x="120" y="204">0</text></g>
  <text x="176" y="204" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">1</text>
  <g font-size="12" fill="#ccc" text-anchor="middle"><text x="232" y="204">0</text><text x="288" y="204">0</text><text x="344" y="204">0</text><text x="400" y="204">0</text></g>

  <!-- Row 4 (nums1="2"): match at j=2 → 2 (diagonal) -->
  <g filter="url(#rough2)">
    <rect x="92" y="220" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="148" y="220" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="204" y="220" width="56" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="3"/>
    <rect x="260" y="220" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="316" y="220" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="372" y="220" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>
  <g font-size="12" fill="#bbb" text-anchor="middle"><text x="120" y="238">0</text></g>
  <text x="232" y="238" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">2</text>
  <g font-size="12" fill="#ccc" text-anchor="middle"><text x="176" y="238">0</text><text x="288" y="238">0</text><text x="344" y="238">0</text><text x="400" y="238">0</text></g>

  <!-- Row 5 (nums1="1"): match at j=3 → 3 (diagonal, ANSWER) -->
  <g filter="url(#rough2)">
    <rect x="92" y="254" width="56" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="3"/>
    <rect x="148" y="254" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="204" y="254" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="260" y="254" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="3"/>
    <rect x="316" y="254" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="372" y="254" width="56" height="26" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>
  <g font-size="12" fill="#bbb" text-anchor="middle"><text x="120" y="272">0</text></g>
  <text x="288" y="272" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3 ⭐</text>
  <g font-size="12" fill="#ccc" text-anchor="middle"><text x="176" y="272">0</text><text x="232" y="272">0</text><text x="344" y="272">0</text><text x="400" y="272">0</text></g>

  <!-- diagonal arrows: (3,1)->(4,2)->(5,3) -->
  <path d="M 196 210 Q 214 220 228 232" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 252 244 Q 270 254 284 266" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend / annotation -->
  <g filter="url(#rough2)">
    <rect x="440" y="118" width="108" height="156" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="494" y="138" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">图例</text>
  <rect x="452" y="148" width="16" height="12" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="476" y="158" font-size="10.5" fill="#666">空边界 0</text>
  <rect x="452" y="170" width="16" height="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="476" y="180" font-size="10.5" fill="#4a8e4a">匹配段递增</text>
  <rect x="452" y="192" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="476" y="202" font-size="10.5" fill="#b85450">答案 max</text>
  <rect x="452" y="214" width="16" height="12" fill="#fdfcf7" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="476" y="224" font-size="10.5" fill="#888">不匹配 0</text>
  <text x="494" y="248" text-anchor="middle" font-size="10" fill="#888" font-style="italic">对角线递增 =</text>
  <text x="494" y="262" text-anchor="middle" font-size="10" fill="#888" font-style="italic">连续匹配段</text>

  <text x="280" y="372" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = 3　对应 nums1[2..4]=[3,2,1] 与 nums2[0..2]=[3,2,1]　时间 O(mn)，空间 O(n)</text>
</svg>
