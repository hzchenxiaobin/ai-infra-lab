<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "5525", a = 9, b = 2</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#999">gcd(4,2)=2 → 2 种轮转；gcd(9,10)=1 → 10 种累加；共 2×10=20 个可达状态</text>

  <!-- Left column header: 轮转偏移 0 -->
  <rect x="40" y="56" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="75" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">轮转偏移 0（原始串）</text>

  <!-- Right column header: 轮转偏移 2 -->
  <rect x="290" y="56" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="75" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">轮转偏移 2（右移 2 位）</text>

  <!-- Column sub-headers -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="90" y="98">累加次数</text>
    <text x="190" y="98">字符串</text>
    <text x="340" y="98">累加次数</text>
    <text x="440" y="98">字符串</text>
  </g>

  <!-- Left column rows: rotation 0, additions 0-5 -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <!-- Row 0: add 0 times -->
    <text x="90" y="122">0</text>
    <text x="190" y="122" font-weight="bold">5525</text>
    <!-- Row 1: add 1 time -->
    <text x="90" y="146">1</text>
    <text x="190" y="146" font-weight="bold">5424</text>
    <!-- Row 2: add 2 times -->
    <text x="90" y="170">2</text>
    <text x="190" y="170" font-weight="bold">5323</text>
    <!-- Row 3: add 3 times -->
    <text x="90" y="194">3</text>
    <text x="190" y="194" font-weight="bold">5222</text>
    <!-- Row 4: add 4 times -->
    <text x="90" y="218">4</text>
    <text x="190" y="218" font-weight="bold">5121</text>
    <!-- Row 5: add 5 times -->
    <text x="90" y="242">5</text>
    <text x="190" y="242" font-weight="bold">5020</text>
  </g>
  <text x="190" y="262" font-size="10" fill="#999" text-anchor="middle">… 累加 6-9 次循环回 5525</text>

  <!-- Right column rows: rotation 1, additions 0-5 -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <!-- Row 0: add 0 times -->
    <text x="340" y="122">0</text>
    <text x="440" y="122" font-weight="bold">2555</text>
    <!-- Row 1: add 1 time -->
    <text x="340" y="146">1</text>
    <text x="440" y="146" font-weight="bold">2454</text>
    <!-- Row 2: add 2 times -->
    <text x="340" y="170">2</text>
    <text x="440" y="170" font-weight="bold">2353</text>
    <!-- Row 3: add 3 times -->
    <text x="340" y="194">3</text>
    <text x="440" y="194" font-weight="bold">2252</text>
    <!-- Row 4: add 4 times -->
    <text x="340" y="218">4</text>
    <text x="440" y="218" font-weight="bold">2151</text>
    <!-- Row 5: add 5 times -->
    <rect x="380" y="228" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="246" font-weight="bold">5</text>
    <text x="440" y="248" font-weight="bold" fill="#b85450" font-size="15">2050</text>
  </g>
  <text x="440" y="262" font-size="10" fill="#999" text-anchor="middle">… 累加 6-9 次循环回 2555</text>

  <!-- Row separators for left column -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="128" x2="260" y2="128"/>
    <line x1="40" y1="152" x2="260" y2="152"/>
    <line x1="40" y1="176" x2="260" y2="176"/>
    <line x1="40" y1="200" x2="260" y2="200"/>
    <line x1="40" y1="224" x2="260" y2="224"/>
    <line x1="40" y1="248" x2="260" y2="248"/>
  </g>
  <!-- Row separators for right column -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="290" y1="128" x2="510" y2="128"/>
    <line x1="290" y1="152" x2="510" y2="152"/>
    <line x1="290" y1="176" x2="510" y2="176"/>
    <line x1="290" y1="200" x2="510" y2="200"/>
    <line x1="290" y1="224" x2="510" y2="224"/>
  </g>
  <!-- Column separator -->
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="140" y1="92" x2="140" y2="258"/>
    <line x1="390" y1="92" x2="390" y2="258"/>
  </g>

  <!-- Highlight arrow pointing to 2050 -->
  <text x="440" y="284" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 字典序最小</text>

  <!-- Observation box -->
  <rect x="40" y="300" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="320" font-size="11" fill="#d6a040" font-weight="bold">观察</text>
  <text x="58" y="338" font-size="11" fill="#555">• 左列首字符恒为 5，右列首字符恒为 2 → 2 &lt; 5，最小值必在右列（轮转偏移 2）</text>
  <text x="58" y="354" font-size="11" fill="#555">• 右列中第二个字符（奇数位）随累加递减：5→4→3→2→1→0，累加 5 次到 0 最优</text>
  <text x="58" y="370" font-size="11" fill="#b85450" font-weight="bold">→ "2050"：首字符 2（最优轮转）+ 第二字符 0（最优累加）= 全局字典序最小</text>

  <!-- Comparison: two rotation orbits -->
  <rect x="40" y="392" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="412" font-size="11" fill="#446688" font-weight="bold">状态空间结构</text>
  <text x="58" y="430" font-size="11" fill="#555">• b=2 为偶数 → 轮转保持奇偶性，累加只影响同一组奇数位字符</text>
  <text x="58" y="444" font-size="11" fill="#555">• 2 种轮转 × 10 种累加 = 20 个状态，BFS 全部遍历后取最小</text>
</svg>
