<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">按窗口内 B 的个数 cnt 直接判定（改 ≤ 1 格）</text>

  <!-- helper: five mini 2x2 grids, cell 34, x = 30,134,238,342,446 ; y = 60 -->
  <!-- cnt = 0 -->
  <rect x="30" y="60" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="64" y="60" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="30" y="94" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="64" y="94" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="152" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">cnt = 0</text>
  <text x="64" y="176" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✅</text>
  <text x="64" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">全 W，已同色</text>

  <!-- cnt = 1 -->
  <rect x="134" y="60" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="82" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="168" y="60" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="134" y="94" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="168" y="94" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="152" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">cnt = 1</text>
  <text x="168" y="176" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✅</text>
  <text x="168" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">改 1 格：B → W</text>

  <!-- cnt = 2 -->
  <rect x="238" y="60" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="82" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="272" y="60" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="238" y="94" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="272" y="94" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="289" y="116" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="234" y="56" width="76" height="76" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="272" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt = 2</text>
  <text x="272" y="176" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">❌</text>
  <text x="272" y="198" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">改 1 格最多变 1 / 3</text>

  <!-- cnt = 3 -->
  <rect x="342" y="60" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="359" y="82" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="376" y="60" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="82" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="342" y="94" width="34" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="376" y="94" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="116" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <text x="376" y="152" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">cnt = 3</text>
  <text x="376" y="176" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✅</text>
  <text x="376" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">改 1 格：W → B</text>

  <!-- cnt = 4 -->
  <rect x="446" y="60" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="82" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="480" y="60" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="497" y="82" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="446" y="94" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="116" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <rect x="480" y="94" width="34" height="34" fill="#666" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="497" y="116" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">B</text>
  <text x="480" y="152" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">cnt = 4</text>
  <text x="480" y="176" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✅</text>
  <text x="480" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">全 B，已同色</text>

  <!-- summary note -->
  <rect x="90" y="228" width="380" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">判定式：min(cnt, 4 − cnt) ≤ 1 ⇔ cnt ≠ 2</text>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">任一个窗口满足即可返回 true；4 个窗口全是 cnt = 2 才 false</text>
</svg>
