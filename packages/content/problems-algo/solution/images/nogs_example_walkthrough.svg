<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,3,4]，答案 = 6</text>

  <!-- Column headers: mask state table -->
  <text x="30" y="56" font-size="11" fill="#888" font-weight="bold">阶段</text>
  <text x="120" y="56" font-size="11" fill="#888" font-weight="bold">mask=000</text>
  <text x="220" y="56" font-size="11" fill="#888" font-weight="bold">mask=001({2})</text>
  <text x="340" y="56" font-size="11" fill="#888" font-weight="bold">mask=010({3})</text>
  <text x="460" y="56" font-size="11" fill="#888" font-weight="bold">mask=011({2,3})</text>

  <!-- header underline -->
  <path d="M 24 62 L 540 62" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: init -->
  <text x="30" y="84" font-size="11" fill="#333">初始</text>
  <g filter="url(#rough2)">
    <rect x="110" y="70" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="230" y="70" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="350" y="70" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="470" y="70" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="140" y="88" font-weight="bold">1</text>
    <text x="260" y="88" fill="#999">0</text>
    <text x="380" y="88" fill="#999">0</text>
    <text x="500" y="88" fill="#999">0</text>
  </g>

  <!-- Row 1: after v=2, m_v=001, w_v=2^1-1=1 -->
  <text x="30" y="124" font-size="11" fill="#4a7a3a">v=2</text>
  <text x="30" y="138" font-size="9" fill="#888">m=001,w=1</text>
  <g filter="url(#rough2)">
    <rect x="110" y="110" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="230" y="110" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="350" y="110" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="470" y="110" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="140" y="128" font-weight="bold">1</text>
    <text x="260" y="128" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="380" y="128" fill="#999">0</text>
    <text x="500" y="128" fill="#999">0</text>
  </g>
  <!-- arrow showing transition: mask 000 -> 001 -->
  <path d="M 170 123 L 230 123" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 2: after v=3, m_v=010, w_v=1 -->
  <text x="30" y="168" font-size="11" fill="#4a7a3a">v=3</text>
  <text x="30" y="182" font-size="9" fill="#888">m=010,w=1</text>
  <g filter="url(#rough2)">
    <rect x="110" y="154" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="230" y="154" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="350" y="154" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="470" y="154" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="140" y="172" font-weight="bold">1</text>
    <text x="260" y="172" font-weight="bold">1</text>
    <text x="380" y="172" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="500" y="172" font-weight="bold" fill="#4a7a3a">1</text>
  </g>
  <!-- arrows: 000->010, 001->011 -->
  <path d="M 170 167 L 350 167" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 290 167 L 470 167" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 3: v=4 invalid -->
  <text x="30" y="212" font-size="11" fill="#b85450">v=4</text>
  <text x="30" y="226" font-size="9" fill="#888">2²→舍弃</text>
  <g filter="url(#rough2)">
    <rect x="110" y="198" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="230" y="198" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="350" y="198" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="470" y="198" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" fill="#999" text-anchor="middle">
    <text x="140" y="216">1</text>
    <text x="260" y="216">1</text>
    <text x="380" y="216">1</text>
    <text x="500" y="216">1</text>
  </g>
  <text x="540" y="216" font-size="10" fill="#b85450">跳过</text>

  <!-- divider -->
  <path d="M 24 240 L 540 240" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Summary box -->
  <rect x="30" y="250" width="500" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">汇总答案</text>
  <text x="40" y="294" font-size="11" fill="#555">非空掩码方式数之和 = dp[001] + dp[010] + dp[011] = 1 + 1 + 1 = 3</text>
  <text x="40" y="314" font-size="11" fill="#555">cnt[1] = 1  →  自由挂上若干个 1：2^1 = 2 种</text>
  <text x="40" y="334" font-size="11" fill="#555">最终答案 = 3 × 2 = </text>
  <text x="200" y="334" font-size="14" fill="#b85450" font-weight="bold">6 ✓</text>
  <text x="40" y="352" font-size="10" fill="#888">好子集：{2},{3},{2,3} 各自可挂上或不挂那个 1 → 6 个</text>

</svg>
