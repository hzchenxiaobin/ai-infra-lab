<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 408" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="408" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举递推全灭，一个公式 O(1) 收工</text>

  <rect x="130" y="44" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333">输入 n（加强版：数据范围大幅放大）</text>

  <path d="M260,74 L260,90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="88" y="92" width="344" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="11.5" fill="#b85450">O(n²) DP / O(n) 贪心链：n 太大，全部阵亡 ✗</text>

  <path d="M260,122 L260,140" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="88" y="142" width="344" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="161" text-anchor="middle" font-size="12" fill="#333">换视角：总代价是不变量，任何拆法都等于 C(n,2)</text>

  <path d="M260,172 L260,190" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="170" y="192" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">ans = n(n−1) / 2</text>

  <path d="M260,226 L260,242" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,244 400,272 260,300 120,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11.5" fill="#a0721a">精确答案装得下 64 位吗？</text>

  <path d="M120,272 C110,294 110,306 110,322" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="97" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="25" y="322" width="170" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="341" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">long long 精确直算</text>
  <text x="110" y="359" text-anchor="middle" font-size="10" fill="#444">先除后乘：n ≤ 约 43 亿</text>

  <path d="M400,272 C410,294 410,306 410,322" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="423" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">否</text>

  <rect x="325" y="322" width="170" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="341" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按题意取模再返回</text>
  <text x="410" y="359" text-anchor="middle" font-size="10" fill="#444">必有一偶：先除 2 后乘</text>

  <text x="260" y="392" text-anchor="middle" font-size="11" fill="#b85450">Python：n * (n-1) // 2 原生大整数，一行通吃所有上界</text>
</svg>
