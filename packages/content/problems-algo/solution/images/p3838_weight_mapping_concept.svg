<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：求和 → 取模 26 → 倒序映射（0→z，25→a）</text>

  <!-- 左侧流水线：字符行 -->
  <text x="34" y="64" font-size="11" fill="#888" filter="url(#rough2)">word =</text>

  <rect x="92" y="40" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="113" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="140" y="40" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="161" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>

  <rect x="188" y="40" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="209" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <rect x="236" y="40" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="257" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>

  <text x="113" y="96" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">+5</text>
  <text x="161" y="96" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">+3</text>
  <text x="209" y="96" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">+12</text>
  <text x="257" y="96" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">+14</text>

  <path d="M 185 100 L 185 112" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 求和 -->
  <rect x="60" y="116" width="230" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="137" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 求和：w = 5+3+12+14 = 34</text>

  <path d="M 175 150 L 175 162" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 取模 -->
  <rect x="60" y="166" width="230" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="187" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 取模：r = 34 % 26 = 8</text>

  <path d="M 175 200 L 175 212" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 倒序映射 -->
  <rect x="60" y="216" width="230" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="175" y="240" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ 倒序映射：'z' − r = 'r'</text>

  <!-- 查表虚线箭头 -->
  <path d="M 292 183 L 346 148" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="156" font-size="10" fill="#b85450" filter="url(#rough2)">查 r=8</text>

  <!-- 右侧倒序映射表 -->
  <text x="422" y="44" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">倒序映射表（Atbash 镜像）</text>

  <rect x="352" y="52" width="140" height="24" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="422" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 → z</text>

  <rect x="352" y="80" width="140" height="24" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="422" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 → y</text>

  <text x="422" y="122" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">⋮</text>

  <rect x="352" y="130" width="140" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="422" y="147" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">8 → r ✓</text>

  <text x="422" y="176" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">⋮</text>

  <rect x="352" y="184" width="140" height="24" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="422" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">25 → a</text>

  <text x="422" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">公式：'z' − r（即 'a' + 25 − r）</text>

  <!-- 底部警告 -->
  <rect x="36" y="262" width="448" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">⚠️ 两个高频翻车点</text>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#a0433f" filter="url(#rough2)">① 方向是倒序：0 → 'z' 不是 0 → 'a'，顺手写 'a' + r 必错</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#a0433f" filter="url(#rough2)">② C++ 勿写 (25 − w) % 26：w &gt; 25 时负数取模得负值</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">先 r = w % 26（恒非负）再 'z' − r；Python 的 % 是 floor，(25 − w) % 26 反而合法</text>
</svg>
