<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例 2 演算：nums1=[0,1]，nums2=[1,0]，s₁=1，s₂=1，offset=1</text>

  <!-- Table label -->
  <text x="40" y="50" font-size="11.5" fill="#555" font-weight="bold">f[i][j] 表（j = 差值 + s₂；j = 1 即差值 0 = 平衡，红色高亮）</text>

  <!-- ===== Table ===== -->
  <!-- header row -->
  <rect x="80" y="60" width="100" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">i \ j</text>

  <rect x="180" y="60" width="100" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="78" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">j=0 (d=−1)</text>

  <rect x="280" y="60" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j=1 (d=0) ✓</text>

  <rect x="380" y="60" width="100" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="78" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">j=2 (d=+1)</text>

  <!-- row i=0 -->
  <rect x="80" y="90" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i=0</text>

  <rect x="180" y="90" width="100" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="280" y="90" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="110" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <rect x="380" y="90" width="100" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="110" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">0</text>

  <!-- row i=1 -->
  <rect x="80" y="124" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i=1</text>

  <rect x="180" y="124" width="100" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="280" y="124" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="144" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>

  <rect x="380" y="124" width="100" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="430" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- annotation for f[1][1]=3 -->
  <text x="280" y="172" text-anchor="middle" font-size="9.5" fill="#888">f[1][1]=3：单独选 nums2[1](+1) + 从 f[0][0] 选 nums1[1](+1) + 从 f[0][1] 选 nums2[1](+1)</text>

  <!-- ===== ans accumulation ===== -->
  <rect x="40" y="186" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="206" font-size="11" fill="#333">i=0：f[0][s₂] = f[0][1] = <tspan font-weight="bold" fill="#b85450">1</tspan> → ans = 1</text>
  <text x="56" y="222" font-size="11" fill="#333">i=1：f[1][s₂] = f[1][1] = <tspan font-weight="bold" fill="#b85450">3</tspan> → ans = 1 + 3 = <tspan font-weight="bold" fill="#4a7a3a">4</tspan></text>

  <!-- Divider -->
  <path d="M 40 240 L 520 240" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== 4 balanced ranges ===== -->
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">4 个平衡区间（sum₁ = sum₂）</text>

  <!-- range 1 -->
  <rect x="40" y="270" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="56" y="290" font-size="10.5" fill="#333">① [0,0] 选 nums1[0]=0：<tspan fill="#446688" font-weight="bold">sum₁=0</tspan>，sum₂=0 ✓</text>

  <!-- range 2 -->
  <rect x="40" y="310" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="56" y="330" font-size="10.5" fill="#333">② [1,1] 选 nums2[1]=0：sum₁=0，<tspan fill="#b85450" font-weight="bold">sum₂=0</tspan> ✓</text>

  <!-- range 3 -->
  <rect x="40" y="350" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="56" y="370" font-size="10.5" fill="#333">③ [0,1] 选 nums1[0]=0, nums2[1]=0：<tspan fill="#446688" font-weight="bold">sum₁=0</tspan>，<tspan fill="#b85450" font-weight="bold">sum₂=0</tspan> ✓</text>

  <!-- range 4 -->
  <rect x="40" y="390" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="56" y="410" font-size="10.5" fill="#333">④ [0,1] 选 nums2[0]=1, nums1[1]=1：<tspan fill="#446688" font-weight="bold">sum₁=1</tspan>，<tspan fill="#b85450" font-weight="bold">sum₂=1</tspan> ✓</text>

  <!-- result -->
  <rect x="40" y="432" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 4（③④ 区间相同 [0,1] 但选法不同，计为不同）</text>
</svg>
