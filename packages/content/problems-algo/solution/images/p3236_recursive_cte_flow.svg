<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 486" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="486" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：锚点定根 → 递归体逐层扩 → 终止后过滤 · 求差 · 排序</text>

  <rect x="200" y="38" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Employees 表</text>

  <path d="M 260 66 L 260 80" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="84" width="260" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 锚点：SELECT …, 0 AS hierarchy_level</text>
  <text x="260" y="119" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">FROM Employees WHERE manager_id IS NULL</text>

  <path d="M 260 130 L 260 144" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="118" y="148" width="284" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 递归体：SELECT e.…, hierarchy_level + 1</text>
  <text x="260" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">FROM T JOIN Employees e</text>
  <text x="260" y="199" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ON T.employee_id = e.manager_id</text>

  <path d="M 260 206 L 260 218" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <polygon points="185,254 260,220 335,254 260,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">本轮产出新行？</text>
  <text x="260" y="267" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">（JOIN 还能匹配到孩子）</text>

  <path d="M 335 254 L 432 254 L 432 177 L 406 177" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="438" y="228" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="438" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">扩下一层</text>

  <path d="M 260 288 L 260 306" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>
  <text x="272" y="302" text-anchor="start" font-size="9.5" fill="#d6a040" filter="url(#rough2)">否 · 递归终止</text>

  <rect x="130" y="310" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 过滤：WHERE hierarchy_level &gt; 0</text>
  <text x="260" y="343" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">剔除锚点里的 CEO 行（Alice, level 0）</text>

  <path d="M 260 350 L 260 362" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>

  <rect x="104" y="366" width="312" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="383" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 求差：salary − (SELECT salary FROM Employees</text>
  <text x="260" y="400" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">WHERE manager_id IS NULL) AS salary_difference</text>

  <path d="M 260 412 L 260 424" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="428" width="260" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="445" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ ORDER BY hierarchy_level,</text>
  <text x="260" y="462" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">subordinate_id → 输出 7 行</text>

  <rect x="16" y="150" width="92" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="62" y="168" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">每轮只拿「上一轮</text>
  <text x="62" y="180" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">的新行」当爹，</text>
  <text x="62" y="192" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">而不是全表</text>
</svg>
