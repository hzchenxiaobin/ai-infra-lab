<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    全正数组：首元素决定字典序 → 答案从 max 开始
  </text>

  <!-- Original array [1, 4, 5, 2, 3] -->
  <text x="58" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">数组</text>
  <rect x="100" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="152" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="204" y="58" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">5</text>
  <rect x="256" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="308" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- Index labels -->
  <text x="125" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="177" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="229" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="281" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="333" y="102" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <!-- Valid start range bracket -->
  <text x="58" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=3</text>
  <path d="M100,114 L100,120 L334,120 L334,114" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="217" y="132" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">有效起点 ∈ [0, n−k] = [0, 2]</text>

  <!-- Subarray row 1: [1, 4, 5] at positions 0-2 -->
  <text x="58" y="162" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">子数组</text>
  <rect x="100" y="146" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="152" y="146" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="204" y="146" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="380" y="165" font-size="11" fill="#b85450" filter="url(#rough2)">首元素 1 &lt; 5 ✗</text>

  <!-- Subarray row 2: [4, 5, 2] at positions 1-3 -->
  <rect x="152" y="182" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="204" y="182" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="256" y="182" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="380" y="201" font-size="11" fill="#b85450" filter="url(#rough2)">首元素 4 &lt; 5 ✗</text>

  <!-- Subarray row 3: [5, 2, 3] at positions 2-4 (WINNER) -->
  <rect x="204" y="218" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="256" y="218" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="308" y="218" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="380" y="237" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">首元素 5 = max ✓</text>

  <!-- Arrow from max cell down to winner row -->
  <path d="M229,90 L229,142 L229,216" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- max label -->
  <text x="245" y="55" font-size="10" fill="#d6a040" filter="url(#rough2)">↑ max</text>

  <!-- Comparison chain -->
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    字典序逐位比较：5 &gt; 4 &gt; 1 → 首元素最大者即胜
  </text>

  <!-- Insight box -->
  <rect x="40" y="295" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    字典序从左到右逐位比较，首元素不同时首元素大者立即胜出。
  </text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    因此答案必从 nums[0..n−k] 中的最大值开始；并列时再逐位比较后续。
  </text>
</svg>
