<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：vec = [[1,2],[3],[],[4,5,6]] 逐次调用</text>

  <!-- Table header -->
  <rect x="30" y="46" width="570" height="28" fill="#446688" filter="url(#rough2)"/>
  <text x="45" y="64" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">#</text>
  <text x="117" y="64" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">调用</text>
  <text x="255" y="64" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">(row, col) 变化</text>
  <text x="375" y="64" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">返回</text>
  <text x="507" y="64" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">关键动作</text>

  <!-- Column dividers in header -->
  <line x1="60" y1="46" x2="60" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="175" y1="46" x2="175" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="335" y1="46" x2="335" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="415" y1="46" x2="415" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- Row 1: Vector2D() -->
  <rect x="30" y="74" width="570" height="26" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="45" y="91" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="117" y="91" text-anchor="middle" font-size="10" fill="#333">Vector2D()</text>
  <text x="255" y="91" text-anchor="middle" font-size="10" fill="#333">→ (0, 0)</text>
  <text x="375" y="91" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="507" y="91" text-anchor="middle" font-size="9" fill="#555">初始化双指针</text>

  <!-- Row 2: next() → 1 -->
  <rect x="30" y="100" width="570" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="45" y="117" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="117" y="117" text-anchor="middle" font-size="10" fill="#333">next()</text>
  <text x="255" y="117" text-anchor="middle" font-size="10" fill="#333">(0,0) → (0,1)</text>
  <text x="375" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="507" y="117" text-anchor="middle" font-size="9" fill="#555">读 vec[0][0]</text>

  <!-- Row 3: next() → 2 -->
  <rect x="30" y="126" width="570" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="45" y="143" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="117" y="143" text-anchor="middle" font-size="10" fill="#333">next()</text>
  <text x="255" y="143" text-anchor="middle" font-size="10" fill="#333">(0,1) → (0,2)</text>
  <text x="375" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="507" y="143" text-anchor="middle" font-size="9" fill="#555">读 vec[0][1]，col 越界</text>

  <!-- Row 4: next() → 3 (hasNext skips) -->
  <rect x="30" y="152" width="570" height="26" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="45" y="169" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="117" y="169" text-anchor="middle" font-size="10" fill="#333">next()</text>
  <text x="255" y="169" text-anchor="middle" font-size="10" fill="#333">(0,2) → (1,1)</text>
  <text x="375" y="169" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="507" y="169" text-anchor="middle" font-size="9" fill="#d6a040">hasNext 跳到 row=1</text>

  <!-- Row 5: hasNext() → true (skip empty) -->
  <rect x="30" y="178" width="570" height="26" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="45" y="195" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="117" y="195" text-anchor="middle" font-size="10" fill="#333">hasNext()</text>
  <text x="255" y="195" text-anchor="middle" font-size="10" fill="#333">(1,1) → (3,0)</text>
  <text x="375" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true</text>
  <text x="507" y="195" text-anchor="middle" font-size="9" fill="#d6a040">跳过空 row=2</text>

  <!-- Row 6: next() → 4 -->
  <rect x="30" y="204" width="570" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="45" y="221" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="117" y="221" text-anchor="middle" font-size="10" fill="#333">next()</text>
  <text x="255" y="221" text-anchor="middle" font-size="10" fill="#333">(3,0) → (3,1)</text>
  <text x="375" y="221" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="507" y="221" text-anchor="middle" font-size="9" fill="#555">读 vec[3][0]</text>

  <!-- Row 7: next() → 5 -->
  <rect x="30" y="230" width="570" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="45" y="247" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="117" y="247" text-anchor="middle" font-size="10" fill="#333">next()</text>
  <text x="255" y="247" text-anchor="middle" font-size="10" fill="#333">(3,1) → (3,2)</text>
  <text x="375" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="507" y="247" text-anchor="middle" font-size="9" fill="#555">读 vec[3][1]</text>

  <!-- Row 8: next() → 6 -->
  <rect x="30" y="256" width="570" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="45" y="273" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="117" y="273" text-anchor="middle" font-size="10" fill="#333">next()</text>
  <text x="255" y="273" text-anchor="middle" font-size="10" fill="#333">(3,2) → (3,3)</text>
  <text x="375" y="273" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="507" y="273" text-anchor="middle" font-size="9" fill="#555">读 vec[3][2]，col 越界</text>

  <!-- Row 9: hasNext() → false -->
  <rect x="30" y="282" width="570" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="45" y="299" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="117" y="299" text-anchor="middle" font-size="10" fill="#333">hasNext()</text>
  <text x="255" y="299" text-anchor="middle" font-size="10" fill="#333">(3,3) → (4,0)</text>
  <text x="375" y="299" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">false</text>
  <text x="507" y="299" text-anchor="middle" font-size="9" fill="#b85450">row≥n，遍历结束</text>

  <!-- Table border -->
  <rect x="30" y="46" width="570" height="262" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- Column dividers -->
  <line x1="60" y1="74" x2="60" y2="308" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="74" x2="175" y2="308" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="335" y1="74" x2="335" y2="308" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="415" y1="74" x2="415" y2="308" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Conclusion box -->
  <rect x="60" y="324" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键观察：第 5 步一次 hasNext() 同时跳过了「行尾越界」(row 1) 和「空行」(row 2)</text>
  <text x="310" y="366" text-anchor="middle" font-size="10" fill="#555">→ 惰性遍历的价值：按需推进，不做无用预处理，O(1) 额外空间</text>
</svg>
