<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：两个极端位置一比即判</text>

  <!-- example 1 -->
  <text x="60" y="52" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">word = "aaAbcBC"（下标 0–6）</text>

  <rect x="60" y="60" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="83" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">字母</text>
  <rect x="106" y="60" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="144" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">末小写</text>
  <rect x="182" y="60" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">首大写</text>
  <rect x="258" y="60" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <rect x="60" y="86" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="83" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="106" y="86" width="76" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="182" y="86" width="76" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="103" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="258" y="86" width="210" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="363" y="103" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 &lt; 2 → 特殊 ✓</text>

  <rect x="60" y="112" width="46" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="83" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="106" y="112" width="76" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="129" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="182" y="112" width="76" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="129" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="258" y="112" width="210" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="363" y="129" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 &lt; 5 → 特殊 ✓</text>

  <rect x="60" y="138" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="83" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="106" y="138" width="76" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="155" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="182" y="138" width="76" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="155" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="258" y="138" width="210" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="363" y="155" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 &lt; 6 → 特殊 ✓</text>

  <rect x="300" y="170" width="168" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="384" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全员达标 → ans = 3</text>

  <!-- example 3 -->
  <text x="60" y="222" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">word = "AbBCab"（下标 0–5）</text>

  <rect x="60" y="230" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="83" y="247" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">字母</text>
  <rect x="106" y="230" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="144" y="247" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">末小写</text>
  <rect x="182" y="230" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="247" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">首大写</text>
  <rect x="258" y="230" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363" y="247" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <rect x="60" y="256" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="83" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="106" y="256" width="76" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="273" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="182" y="256" width="76" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="273" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="258" y="256" width="210" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="363" y="273" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 &gt; 0：小写在大写之后 ✗</text>

  <rect x="60" y="282" width="46" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="83" y="299" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="106" y="282" width="76" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="299" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="182" y="282" width="76" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="299" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="258" y="282" width="210" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="363" y="299" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 &gt; 2：小写在大写之后 ✗</text>

  <rect x="60" y="308" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="83" y="325" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="106" y="308" width="76" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="325" text-anchor="middle" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="182" y="308" width="76" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="325" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="258" y="308" width="210" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="363" y="325" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">小写缺席：双形态不齐 ✗</text>

  <rect x="300" y="340" width="168" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="384" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">全军覆没 → ans = 0</text>

  <!-- bottom note -->
  <rect x="60" y="368" width="408" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="264" y="385" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">链式判定 −1 &lt; 末小写 &lt; 首大写 &lt; n：存在性（两端）+ 次序（中段）</text>
</svg>
