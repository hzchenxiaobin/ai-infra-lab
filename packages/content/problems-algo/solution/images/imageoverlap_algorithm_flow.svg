<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">偏移量计数算法流程</text>

  <!-- Start node -->
  <ellipse cx="270" cy="58" rx="90" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- arrow down -->
  <path d="M 270 76 L 270 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Collect A -->
  <rect x="130" y="92" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="112" text-anchor="middle" font-size="11" fill="#333">A = [(r,c) | img1[r][c] = 1]</text>

  <!-- arrow down -->
  <path d="M 270 122 L 270 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Collect B -->
  <rect x="130" y="138" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="11" fill="#333">B = [(r,c) | img2[r][c] = 1]</text>

  <!-- arrow down -->
  <path d="M 270 168 L 270 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init cnt and ans -->
  <rect x="130" y="184" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="11" fill="#333">cnt = {}, ans = 0</text>

  <!-- arrow down -->
  <path d="M 270 214 L 270 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: pairs remaining? -->
  <polygon points="270,230 380,268 270,306 160,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="11" fill="#333">还有未处理的</text>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#333">(r1,c1)∈A × (r2,c2)∈B ?</text>

  <!-- No branch -> end -->
  <path d="M 380 268 L 440 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="260" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="482" cy="268" rx="48" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="482" y="272" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 306 L 270 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="316" font-size="11" fill="#82b366">是</text>

  <!-- Compute offset -->
  <rect x="130" y="322" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#333">offset = (r2 − r1, c2 − c1)</text>

  <!-- arrow down -->
  <path d="M 270 352 L 270 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Increment counter -->
  <rect x="130" y="368" width="280" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="11" fill="#333">cnt[offset]++; ans = max(ans, cnt[offset])</text>

  <!-- loop back arrow from left side up to decision -->
  <path d="M 130 383 L 56 383 L 56 268 L 160 268" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="325" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 325)">继续下一对</text>

  <!-- summary note -->
  <text x="270" y="412" text-anchor="middle" font-size="11" fill="#888">时间 O(P × Q)，空间 O(P × Q)；P / Q 为两张图中 1 的个数</text>
</svg>
