<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：s[0]='1'，合法串必为 1*0* —— 禁止出现 "01" 子串</text>

  <!-- ====== Row 1: valid string "1100" ====== -->
  <text x="56" y="74" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 合法：s = "1100"</text>

  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="120" y="60" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="142" y="84" filter="url(#rough2)">1</text>
    <rect x="164" y="60" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="186" y="84" filter="url(#rough2)">1</text>
    <rect x="208" y="60" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="230" y="84" filter="url(#rough2)">0</text>
    <rect x="252" y="60" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="84" filter="url(#rough2)">0</text>
  </g>

  <!-- bracket: one segment of 1s -->
  <path d="M 120 104 Q 120 112 142 112 Q 186 112 186 112 Q 208 112 208 104" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="164" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">唯一一段 1</text>
  <path d="M 208 104 Q 208 112 230 112 Q 274 112 274 112 Q 296 112 296 104" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="252" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后续全 0</text>

  <!-- ====== Row 2: invalid string "1001" ====== -->
  <text x="56" y="180" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 非法：s = "1001"</text>

  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="120" y="166" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="142" y="190" filter="url(#rough2)">1</text>
    <rect x="164" y="166" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="186" y="190" filter="url(#rough2)">0</text>
    <rect x="208" y="166" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="230" y="190" filter="url(#rough2)">0</text>
    <rect x="252" y="166" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="190" filter="url(#rough2)">1</text>
  </g>

  <!-- highlight the "01" substring (index 2-3: '0','1') in red -->
  <rect x="206" y="164" width="92" height="40" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="252" y="158" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">出现 "01" → 0 之后又来 1</text>

  <!-- brackets: two segments of 1s -->
  <rect x="118" y="214" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="142" y="231" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第一段 1</text>
  <rect x="250" y="214" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="274" y="231" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第二段 1</text>

  <!-- arrow connecting the "01" to the second segment -->
  <path d="M 252 206 Q 274 210 274 214" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr1784a)" filter="url(#rough2)"/>

  <!-- ====== conclusion box ====== -->
  <rect x="104" y="262" width="352" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s[0]='1' ⇒ 已有一段 1；<tspan fill="#b85450" font-weight="bold">"01" 子串</tspan>即"0 后又 1"</text>
  <text x="280" y="303" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">无 "01" ⇔ 1*0* 形式 ⇔ 至多一段 1</text>

  <defs>
    <marker id="arr1784a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
</svg>
