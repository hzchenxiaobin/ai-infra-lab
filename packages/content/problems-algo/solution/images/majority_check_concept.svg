<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：有序数组中只查一个位置</text>

  <!-- nums row -->
  <text x="40" y="72" font-size="12" fill="#666" filter="url(#rough2)">nums:</text>
  <!-- index labels -->
  <text x="100" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="144" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="188" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="232" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="276" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="320" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="364" y="62" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">6</text>
  <text x="408" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <text x="452" y="62" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">8</text>

  <!-- cells: 2,4,5,5,5,5,5,6,6 ; width 44 starting x=78 -->
  <rect x="78" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="122" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <!-- first occurrence index 2 -->
  <rect x="166" y="70" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="210" y="70" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="254" y="70" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="298" y="70" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <!-- check position index 6 = first + n/2 -->
  <rect x="342" y="70" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="386" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="430" y="70" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- first occurrence annotation -->
  <path d="M 188 108 L 188 128" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="130" width="136" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="188" y="146" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">first = 2（首次出现）</text>

  <!-- check position annotation -->
  <path d="M 364 108 L 364 128" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="130" width="150" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="365" y="146" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">first + n/2 = 2+4 = 6</text>

  <!-- span bracket from 2 to 6 -->
  <path d="M 166 180 Q 166 190 176 190 L 354 190 Q 364 190 364 180" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="265" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">区间 [2, 6] 共 5 个 5</text>

  <!-- reasoning box -->
  <rect x="80" y="225" width="400" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">数组有序 → 5 连续 → nums[6]==5 即 ≥5 个 &gt; 9/2</text>

  <!-- key insight box -->
  <rect x="80" y="270" width="400" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">一次 lower_bound 找 first，</text>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">再判 nums[first + n/2] == target</text>
</svg>
