<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：GROUP BY managerId 分桶 + COUNT 计下属数 + HAVING ≥5 筛经理</text>

  <!-- Employee table (left) -->
  <text x="145" y="50" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">Employee（原始表）</text>
  <rect x="30" y="56" width="230" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="73" font-size="9.5" fill="#333">id</text>
  <text x="85" y="73" font-size="9.5" fill="#333">name</text>
  <text x="145" y="73" font-size="9.5" fill="#333">dept</text>
  <text x="200" y="73" font-size="9.5" fill="#b85450">managerId</text>
  <line x1="65" y1="56" x2="65" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="56" x2="125" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="56" x2="170" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="82" width="230" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="97" font-size="9.5" fill="#333">101</text>
  <text x="85" y="97" font-size="9.5" fill="#333">John</text>
  <text x="145" y="97" font-size="9.5" fill="#333">A</text>
  <text x="200" y="97" font-size="9.5" fill="#888">NULL</text>
  <line x1="65" y1="82" x2="65" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="82" x2="125" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="82" x2="170" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="104" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="45" y="119" font-size="9.5" fill="#333">102</text>
  <text x="85" y="119" font-size="9.5" fill="#333">Dan</text>
  <text x="145" y="119" font-size="9.5" fill="#333">A</text>
  <text x="200" y="119" font-size="9.5" fill="#b85450" font-weight="bold">101</text>
  <line x1="65" y1="104" x2="65" y2="126" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="104" x2="125" y2="126" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="104" x2="170" y2="126" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="126" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="45" y="141" font-size="9.5" fill="#333">103</text>
  <text x="85" y="141" font-size="9.5" fill="#333">James</text>
  <text x="145" y="141" font-size="9.5" fill="#333">A</text>
  <text x="200" y="141" font-size="9.5" fill="#b85450" font-weight="bold">101</text>
  <line x1="65" y1="126" x2="65" y2="148" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="126" x2="125" y2="148" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="126" x2="170" y2="148" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="148" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="45" y="163" font-size="9.5" fill="#333">104</text>
  <text x="85" y="163" font-size="9.5" fill="#333">Amy</text>
  <text x="145" y="163" font-size="9.5" fill="#333">A</text>
  <text x="200" y="163" font-size="9.5" fill="#b85450" font-weight="bold">101</text>
  <line x1="65" y1="148" x2="65" y2="170" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="148" x2="125" y2="170" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="148" x2="170" y2="170" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="170" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="45" y="185" font-size="9.5" fill="#333">105</text>
  <text x="85" y="185" font-size="9.5" fill="#333">Anne</text>
  <text x="145" y="185" font-size="9.5" fill="#333">A</text>
  <text x="200" y="185" font-size="9.5" fill="#b85450" font-weight="bold">101</text>
  <line x1="65" y1="170" x2="65" y2="192" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="170" x2="125" y2="192" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="170" x2="170" y2="192" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="192" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="45" y="207" font-size="9.5" fill="#333">106</text>
  <text x="85" y="207" font-size="9.5" fill="#333">Ron</text>
  <text x="145" y="207" font-size="9.5" fill="#333">B</text>
  <text x="200" y="207" font-size="9.5" fill="#b85450" font-weight="bold">101</text>
  <line x1="65" y1="192" x2="65" y2="214" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="125" y1="192" x2="125" y2="214" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="192" x2="170" y2="214" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="200" y="226" text-anchor="middle" font-size="9" fill="#b85450">↑ 5 行 managerId = 101，1 行 managerId = NULL</text>

  <!-- Arrow: GROUP BY -->
  <path d="M260 145 L340 145" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="300" y="138" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="300" y="158" text-anchor="middle" font-size="9" fill="#446688">managerId</text>

  <!-- Aggregated buckets (right) -->
  <text x="450" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">分桶计数结果</text>

  <rect x="350" y="76" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="93" font-size="9.5" fill="#333">managerId</text>
  <text x="480" y="93" font-size="9.5" fill="#333">COUNT(*)</text>
  <line x1="440" y1="76" x2="440" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="102" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="380" y="119" font-size="9.5" fill="#4a7a3a" font-weight="bold">101</text>
  <text x="480" y="119" font-size="9.5" fill="#b85450" font-weight="bold">5</text>
  <text x="510" y="119" font-size="9.5" fill="#b85450" font-weight="bold">≥5 ✓</text>
  <line x1="440" y1="102" x2="440" y2="128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="350" y="128" width="200" height="26" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="145" font-size="9.5" fill="#888">NULL</text>
  <text x="480" y="145" font-size="9.5" fill="#888">1</text>
  <text x="510" y="145" font-size="9.5" fill="#888">&lt;5 ✗</text>
  <line x1="440" y1="128" x2="440" y2="154" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="450" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">HAVING COUNT(*) ≥ 5 → 仅留 101</text>

  <!-- Down arrow to lookup -->
  <path d="M450 178 L450 206" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="470" y="196" font-size="9" fill="#d6a040">id IN (101)</text>

  <!-- Result callout -->
  <rect x="120" y="300" width="320" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">外层：SELECT name WHERE id IN (101)</text>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#333">查 Employee 表 id=101 的那行 → name = John</text>
  <rect x="240" y="354" width="80" height="28" fill="#fff" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">John</text>
  <text x="280" y="398" text-anchor="middle" font-size="9" fill="#888">managerId=101 是 John 自己的 id → John 即待找的经理</text>
</svg>
