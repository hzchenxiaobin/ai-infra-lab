<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举 m 从大到小，每个 m 二分 k</text>

  <!-- Start node -->
  <ellipse cx="280" cy="62" rx="130" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 解析 n, m_max = ⌊log₂(n+1)⌋</text>

  <!-- arrow down -->
  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: m >= 3? -->
  <polygon points="280,104 400,152 280,200 160,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#333">m &gt;= 3 ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#666">(从 m_max 递减)</text>

  <!-- No branch -> fallback m=2 -->
  <path d="M 400 152 L 472 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="144" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="470" y="132" width="80" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">m = 2</text>
  <text x="510" y="166" text-anchor="middle" font-size="10" fill="#555">k = n − 1</text>
  <path d="M 510 174 L 510 430" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch down -->
  <path d="M 280 200 L 280 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="214" font-size="11" fill="#82b366">是</text>

  <!-- Binary search setup -->
  <rect x="150" y="222" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#333">lo = 2, hi = ⌊n^(1/(m−1))⌋ + 2</text>

  <!-- arrow down -->
  <path d="M 280 256 L 280 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo <= hi? -->
  <polygon points="280,278 380,320 280,362 180,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#333">lo &lt;= hi ?</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#666">(二分未结束)</text>

  <!-- No branch -> m-- and loop back -->
  <path d="M 180 320 L 120 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="312" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="34" y="300" width="84" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="318" text-anchor="middle" font-size="11" fill="#333">m −−</text>
  <text x="76" y="334" text-anchor="middle" font-size="10" fill="#555">试更小 m</text>
  <!-- loop back to m>=3 decision -->
  <path d="M 76 300 L 76 152 L 160 152" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="226" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 66 226)">下一个 m</text>

  <!-- Yes branch down -->
  <path d="M 280 362 L 280 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="376" font-size="11" fill="#82b366">是</text>

  <!-- mid computation + check -->
  <rect x="120" y="384" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#333">mid = lo+(hi−lo)/2; check(mid, m, n)</text>

  <!-- Three-way result -->
  <!-- check == 0 -> found (return k=mid) -->
  <rect x="390" y="384" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">==0 → 返回 mid</text>

  <!-- check < 0 -> lo = mid+1 -->
  <rect x="120" y="428" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="185" y="446" text-anchor="middle" font-size="10" fill="#446688">&lt;0: lo = mid+1</text>

  <!-- check > 0 -> hi = mid-1 -->
  <rect x="260" y="428" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="325" y="446" text-anchor="middle" font-size="10" fill="#b85450">&gt;0: hi = mid−1</text>

  <!-- loop back from lo/hi boxes to lo<=hi decision -->
  <path d="M 185 428 L 185 416 L 250 416 L 250 362" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 325 428 L 325 416 L 310 416 L 310 362" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End node -->
  <ellipse cx="510" cy="448" rx="46" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="452" text-anchor="middle" font-size="11" fill="#333">返回 k</text>
</svg>
