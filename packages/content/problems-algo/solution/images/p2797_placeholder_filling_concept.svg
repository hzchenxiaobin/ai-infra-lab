<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#aaa"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：占位符 _ 按序吸纳 newArgs，剩余 newArgs 追加到尾部</text>

  <!-- ===== args row (with placeholders) ===== -->
  <text x="40" y="62" font-size="11" fill="#888">args（预填，含占位符）</text>
  <!-- [2] -->
  <rect x="56" y="68" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="84" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <!-- [_] placeholder -->
  <rect x="154" y="68" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" rx="5" filter="url(#rough2)"/>
  <text x="182" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">_</text>
  <!-- [6] -->
  <rect x="252" y="68" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <!-- [_] placeholder -->
  <rect x="350" y="68" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" rx="5" filter="url(#rough2)"/>
  <text x="378" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">_</text>

  <!-- dashed connectors: placeholder -> its filler in newArgs (vertical, same column) -->
  <path d="M 182 106 L 182 138" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 378 106 L 378 138" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="188" y="126" font-size="9" fill="#d6a040">填入</text>
  <text x="384" y="126" font-size="9" fill="#d6a040">填入</text>

  <!-- ===== newArgs row ===== -->
  <text x="40" y="132" font-size="11" fill="#888">newArgs（运行时传入）</text>
  <!-- 4 -->
  <rect x="154" y="138" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="182" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>
  <!-- 8 -->
  <rect x="350" y="138" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="378" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">8</text>
  <!-- 10 (leftover, appended) -->
  <rect x="448" y="138" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="476" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="430" y="130" font-size="9" fill="#888">剩余</text>

  <!-- green arrows: newArgs -> combined slots -->
  <path d="M 182 176 L 182 216" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 378 176 L 378 216" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 476 176 L 476 216" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="486" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">追加</text>

  <!-- gray arrows: fixed args straight down to combined -->
  <path d="M 84 106 L 84 216" stroke="#bbb" stroke-width="1.2" fill="none" stroke-dasharray="2,2" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 280 106 L 280 216" stroke="#bbb" stroke-width="1.2" fill="none" stroke-dasharray="2,2" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="88" y="160" font-size="9" fill="#999">原样保留</text>

  <!-- ===== combined row ===== -->
  <text x="40" y="214" font-size="11" fill="#888">combined（拼装后调用 fn）</text>
  <rect x="56" y="220" width="56" height="38" fill="#f5f5f5" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="84" y="244" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="154" y="220" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="182" y="244" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="252" y="220" width="56" height="38" fill="#f5f5f5" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="350" y="220" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="378" y="244" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">8</text>
  <rect x="448" y="220" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="476" y="244" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- callout boxes -->
  <rect x="40" y="282" width="240" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="304" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">规则① 占位符按序吸纳</text>
  <text x="160" y="322" text-anchor="middle" font-size="10" fill="#666">args 中每个 _ 依次取 newArgs</text>
  <text x="160" y="338" text-anchor="middle" font-size="10" fill="#666">的下一个值替换</text>

  <rect x="290" y="282" width="230" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="304" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">规则② 剩余追加到尾部</text>
  <text x="405" y="322" text-anchor="middle" font-size="10" fill="#666">_ 用完后，多余的 newArgs</text>
  <text x="405" y="338" text-anchor="middle" font-size="10" fill="#666">依次拼到 combined 末尾</text>
</svg>
