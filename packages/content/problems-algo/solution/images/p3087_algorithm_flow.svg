<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：过滤 2 月 → 提取标签 → 分组计数 → 双降序 Top-3</text>

  <rect x="18" y="50" width="98" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="67" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">① FROM</text>
  <text x="67" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">Tweets 全部推文</text>
  <text x="67" y="100" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">7 行</text>

  <path d="M 116 81 L 128 81" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="50" width="98" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="179" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">② WHERE</text>
  <text x="179" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">2024-02 半开区间</text>
  <text x="179" y="100" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">7 行（恰巧都在 2 月）</text>

  <path d="M 228 81 L 240 81" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="242" y="50" width="98" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="291" y="70" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ SELECT 提取</text>
  <text x="291" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">嵌套 SUBSTRING_INDEX</text>
  <text x="291" y="100" text-anchor="middle" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">7 个标签（含重复）</text>

  <path d="M 340 81 L 352 81" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="354" y="50" width="98" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="403" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">④ GROUP BY</text>
  <text x="403" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">hashtag + COUNT(*)</text>
  <text x="403" y="100" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">7 行 → 4 组</text>

  <path d="M 452 81 L 464 81" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="466" y="50" width="96" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="514" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ ORDER BY</text>
  <text x="514" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">count↓, hashtag↓</text>
  <text x="514" y="100" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">LIMIT 3 → 3 行</text>

  <text x="290" y="134" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">▼ 数据怎么变（示例 7 行，全部落在 2024-02）▼</text>

  <rect x="22" y="148" width="128" height="128" fill="#fff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="86" y="168" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">7 条推文</text>
  <text x="52" y="186" font-size="8.5" fill="#333" filter="url(#rough2)">13 | 02-01</text>
  <text x="52" y="200" font-size="8.5" fill="#333" filter="url(#rough2)">14 | 02-03</text>
  <text x="52" y="214" font-size="8.5" fill="#333" filter="url(#rough2)">15 | 02-04</text>
  <text x="52" y="228" font-size="8.5" fill="#333" filter="url(#rough2)">16 | 02-04</text>
  <text x="52" y="242" font-size="8.5" fill="#333" filter="url(#rough2)">17 | 02-05</text>
  <text x="52" y="256" font-size="8.5" fill="#333" filter="url(#rough2)">18 | 02-07</text>
  <text x="52" y="270" font-size="8.5" fill="#333" filter="url(#rough2)">19 | 02-09</text>

  <path d="M 152 212 L 176 212" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="202" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">提取</text>

  <rect x="180" y="148" width="128" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="244" y="168" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">7 个标签（含重复）</text>
  <text x="196" y="186" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">#HappyDay</text>
  <text x="196" y="200" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">#HappyDay ←</text>
  <text x="196" y="214" font-size="8.5" fill="#333" filter="url(#rough2)">#WorkLife</text>
  <text x="196" y="228" font-size="8.5" fill="#333" filter="url(#rough2)">#TechLife</text>
  <text x="196" y="242" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">#HappyDay ←</text>
  <text x="196" y="256" font-size="8.5" fill="#333" filter="url(#rough2)">#TechLife ←</text>
  <text x="196" y="270" font-size="8.5" fill="#333" filter="url(#rough2)">#Nature</text>

  <path d="M 310 212 L 334 212" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="202" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">分组</text>

  <rect x="338" y="148" width="112" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="394" y="168" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">4 组计数</text>
  <text x="354" y="192" font-size="9" fill="#333" filter="url(#rough2)">#HappyDay</text>
  <text x="436" y="192" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="354" y="216" font-size="9" fill="#333" filter="url(#rough2)">#TechLife</text>
  <text x="436" y="216" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="354" y="240" font-size="9" fill="#333" filter="url(#rough2)">#WorkLife</text>
  <text x="436" y="240" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="354" y="264" font-size="9" fill="#333" filter="url(#rough2)">#Nature</text>
  <text x="436" y="264" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 452 212 L 470 212" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="461" y="202" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">Top-3</text>

  <rect x="474" y="148" width="88" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="518" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 Top-3</text>
  <text x="518" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">#HappyDay 3</text>
  <text x="518" y="216" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">#TechLife 2</text>
  <text x="518" y="240" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">#WorkLife 1 ★</text>
  <text x="518" y="264" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">#Nature 出局</text>

  <rect x="40" y="292" width="500" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="311" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">逻辑执行顺序：FROM → WHERE → GROUP BY → SELECT → ORDER BY → LIMIT</text>
  <text x="290" y="328" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">日期过滤先于提取——不在 2 月的推文连被切的资格都没有；</text>
  <text x="290" y="342" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">⑤ 两个关键字全降序 ⇒ (count, hashtag) 全序 ⇒ LIMIT 3 截断唯一确定</text>
</svg>
