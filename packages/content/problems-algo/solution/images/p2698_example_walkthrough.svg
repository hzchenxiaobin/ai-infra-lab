<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 10 的惩罚数 = 182</text>

  <!-- Header row -->
  <rect x="30" y="40" width="500" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="130" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i²</text>
  <text x="220" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">分割方案</text>
  <text x="360" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">判定</text>
  <text x="470" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">贡献</text>

  <!-- Row i=1 -->
  <text x="60" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="130" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="72" width="30" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="360" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1=1 ✓</text>
  <text x="470" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- Row 2~8 grayed -->
  <text x="60" y="116" text-anchor="middle" font-size="11" fill="#aaa">2~8</text>
  <text x="130" y="116" text-anchor="middle" font-size="11" fill="#aaa">4~64</text>
  <text x="220" y="116" text-anchor="middle" font-size="11" fill="#aaa">无可行分割</text>
  <text x="360" y="116" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <text x="470" y="116" text-anchor="middle" font-size="11" fill="#aaa">+0</text>

  <!-- Row i=9 -->
  <text x="60" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="130" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">81</text>
  <rect x="195" y="132" width="30" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <line x1="229" y1="135" x2="229" y2="153" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="233" y="132" width="30" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="248" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="360" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8+1=9 ✓</text>
  <text x="470" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+81</text>

  <!-- Row i=10 -->
  <text x="60" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <text x="130" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">100</text>
  <rect x="190" y="162" width="40" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <line x1="234" y1="165" x2="234" y2="183" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="238" y="162" width="30" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="253" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="360" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10+0=10 ✓</text>
  <text x="470" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+100</text>

  <!-- Separator -->
  <line x1="30" y1="196" x2="530" y2="196" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="80" y="216" width="400" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">惩罚数 = 1 + 81 + 100 = 182</text>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#888">仅 i = 1, 9, 10 满足「i² 可分割求和得 i」</text>

  <!-- note -->
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#aaa">注：i=10 时 100 = 10 + 0，"10" 取两位、"0" 取一位，连续不重叠覆盖整串</text>
</svg>
