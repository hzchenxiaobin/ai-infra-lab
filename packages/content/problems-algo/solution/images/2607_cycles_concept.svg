<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：子数组和相等 ⟹ arr[i] = arr[(i+k) mod n]</text>

  <!-- derivation box -->
  <rect x="40" y="42" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">相邻子数组和相等：sum(i) = sum(i+1)</text>
  <text x="280" y="82" text-anchor="middle" font-size="11.5" fill="#333">⟹ arr[(i+k) mod n] − arr[i] = 0 ⟹ arr[i] = arr[(i+k) mod n]</text>

  <!-- arrows cycle 1 (blue): 0→4, 4→2, 2→0  (nodes 0,4,2 form a cycle) -->
  <path d="M 268 131 L 205 239" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 217 260 L 343 260" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 355 239 L 292 131" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- arrows cycle 2 (green): 1→5, 5→3, 3→1  (nodes 1,5,3 form a cycle) -->
  <path d="M 343 160 L 217 160" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 205 181 L 268 289" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 292 289 L 355 181" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- nodes cycle 1 (blue): 0, 4, 2 -->
  <circle cx="280" cy="110" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>
  <circle cx="193" cy="260" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="193" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4</text>
  <circle cx="367" cy="260" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="367" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>

  <!-- nodes cycle 2 (green): 1, 5, 3 -->
  <circle cx="367" cy="160" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="367" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <circle cx="193" cy="160" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="193" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">5</text>
  <circle cx="280" cy="310" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>

  <!-- step label k -->
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#888">示例：n=6, k=4, 步长 +k：0→4→2→0 与 1→5→3→1 两个环</text>

  <!-- conclusion box -->
  <rect x="40" y="360" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">环内元素必须两两相等 ⟹ g = gcd(n, k) 个等价类</text>
  <text x="280" y="398" text-anchor="middle" font-size="10.5" fill="#555">每类下标 {i, i+g, i+2g, …}（同余 mod g），各类独立取中位数</text>
</svg>
