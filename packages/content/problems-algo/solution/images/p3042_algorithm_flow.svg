<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 494" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="494" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举全部 i &lt; j 的下标对，逐对三连判定</text>

  <!-- start -->
  <ellipse cx="210" cy="42" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="47" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 210 57 L 210 68" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ans = 0 -->
  <rect x="118" y="70" width="184" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="87" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans = 0（计数器）</text>
  <path d="M 210 96 L 210 106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop j -->
  <rect x="118" y="108" width="184" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="125" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">外层枚举 j = 1 … n−1（右端）</text>
  <path d="M 210 134 L 210 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop i -->
  <rect x="118" y="146" width="184" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="163" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">内层枚举 i = 0 … j−1（左端）</text>
  <path d="M 210 172 L 210 182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: k <= m -->
  <polygon points="210,184 266,210 210,236 154,210" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k ≤ m ?</text>
  <text x="210" y="223" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（p 不比 s 长）</text>
  <path d="M 210 236 L 210 246" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="220" y="245" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>

  <!-- diamond 2: prefix -->
  <polygon points="210,248 266,274 210,300 154,274" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="272" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 == p ?</text>
  <text x="210" y="287" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（s[0:k] == p）</text>
  <path d="M 210 300 L 210 310" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="220" y="309" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>

  <!-- diamond 3: suffix -->
  <polygon points="210,312 266,338 210,364 154,338" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="336" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">后缀 == p ?</text>
  <text x="210" y="351" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（s[m−k:m] == p）</text>
  <path d="M 210 364 L 210 374" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="220" y="373" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- ans += 1 -->
  <rect x="118" y="376" width="184" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="393" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans += 1（这对算数）</text>
  <path d="M 210 402 L 210 412" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- skip box -->
  <rect x="342" y="267" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="407" y="286" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">跳过这对（continue）</text>

  <!-- no arrows to skip box -->
  <path d="M 266 210 L 306 210 L 306 280 L 338 280" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">否</text>
  <path d="M 266 274 L 306 274 L 306 286 L 338 286" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">否</text>
  <path d="M 266 338 L 306 338 L 306 292 L 338 292" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">否</text>

  <!-- skip -> diamond4 -->
  <path d="M 407 297 L 407 438 L 272 438" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- diamond 4: more pairs? -->
  <polygon points="210,414 268,438 210,462 152,438" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="436" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">还有对吗 ?</text>
  <text x="210" y="451" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（i、j 未用尽）</text>

  <!-- no -> return -->
  <path d="M 152 438 L 108 438" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="132" y="430" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">否</text>
  <ellipse cx="60" cy="438" rx="44" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="443" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- yes -> loop back -->
  <path d="M 210 462 L 210 476 L 500 476 L 500 159 L 306 159" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="392" y="470" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是 · 下一对 (i, j)</text>

  <!-- bottom note -->
  <text x="260" y="490" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">n ≤ 50、L ≤ 10：至多 C(50,2) = 1225 对，每对 ≤ 2L = 20 次字符比较，总量约 2.5 万 —— 暴力即正解</text>
</svg>
