<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：定长滑窗评估健身计划</text>

  <!-- Box 1: init -->
  <rect x="110" y="44" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="13" fill="#333">① score = 0; T = Σ calories[0..k−1]</text>

  <path d="M 260 86 L 260 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: evaluate first window -->
  <rect x="110" y="104" width="300" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="13" fill="#333">② 评估首窗 T</text>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#555">T&lt;lower→score−−; T&gt;upper→score++; else 不变</text>

  <path d="M 260 154 L 260 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="166" font-size="10" fill="#888">首窗评估完</text>

  <!-- Box 3: loop start -->
  <rect x="110" y="172" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="13" fill="#333">③ 取下一窗口起点 i（从 k 开始）</text>

  <path d="M 260 214 L 260 230" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4: loop body -->
  <rect x="110" y="232" width="300" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="13" fill="#333">④ T = T − calories[i−k] + calories[i]</text>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#555">评估 T（同②）; i++</text>

  <!-- loop-back arrow from Box 4 right to Box 3 right -->
  <path d="M 410 258 L 450 258 L 450 192 L 412 192" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="456" y="220" font-size="10" fill="#b85450" font-weight="bold">i &lt; n</text>
  <text x="456" y="234" font-size="10" fill="#b85450" font-weight="bold">还有窗口</text>

  <!-- after loop arrow -->
  <path d="M 260 286 L 260 302" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="298" font-size="10" fill="#888">遍历完</text>

  <!-- Box 5: return -->
  <rect x="110" y="304" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">⑤ 返回 score</text>

  <!-- complexity note -->
  <rect x="60" y="356" width="400" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11" fill="#b85450">时间 O(n)，空间 O(1)；T 用 long long 防溢出</text>
</svg>
