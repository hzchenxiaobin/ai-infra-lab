<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="940" height="520" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">循环双端队列：环形数组 + 两端皆可插/删</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="68" text-anchor="middle" font-size="12" fill="#666">在 622 循环队列基础上，front 和 rear 都能“向前/向后”双向移动——四个操作 = 两个游标 × 两个方向</text>

  <!-- ===== 中央线性数组（带绕回箭头）cap=5，已放 3 元素 ===== -->
  <text x="430" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">环形数组（cap = 5，已放 3 个元素：a, b, c）</text>
  <text x="430" y="126" text-anchor="middle" font-size="10" fill="#888">front 指队首 a；rear 指“下一个尾部插入位”（空格）</text>

  <!-- 5 格线性数组 -->
  <g filter="url(#sk2)">
    <rect x="180" y="150" width="60" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="240" y="150" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="300" y="150" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="360" y="150" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="420" y="150" width="60" height="44" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <!-- 下标 -->
  <text x="210" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="330" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="390" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="450" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <!-- 数据：front=1(a), 2(b), 3(c); rear=4(空)；slot 0 空（旧数据虚化） -->
  <text x="210" y="180" text-anchor="middle" font-size="14" fill="#ccc">_</text>
  <text x="270" y="180" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="330" y="180" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="390" y="180" text-anchor="middle" font-size="14" fill="#333">c</text>
  <text x="450" y="180" text-anchor="middle" font-size="14" fill="#ccc">_</text>

  <!-- front 指针指向 1 -->
  <text x="270" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">front ↓</text>
  <!-- rear 指针指向 4 -->
  <text x="450" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">rear ↓</text>

  <!-- 绕回箭头：从末尾(格4右侧)绕到开头(格0左侧)，表示“环” -->
  <path d="M 480 172 Q 540 172 540 240 Q 540 270 470 270 Q 200 270 160 270 Q 130 270 130 240 Q 130 172 180 172"
        stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="540" y="262" font-size="10" fill="#446688" font-weight="bold">绕回</text>
  <text x="540" y="276" font-size="10" fill="#446688" font-weight="bold">(i±1)%cap</text>

  <!-- ===== 四向操作箭头 ===== -->
  <!-- insertFront：在 front 左侧（slot 0）插入，front 后退到 0 -->
  <path d="M 100 110 Q 140 120 180 165" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk2)"/>
  <text x="60" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">insertFront</text>
  <text x="60" y="114" font-size="9" fill="#4a7a3a">front = (front-1+cap)%cap</text>
  <text x="60" y="126" font-size="9" fill="#4a7a3a">先退一格再写入</text>

  <!-- deleteFront：front 前进 +1（向右） -->
  <path d="M 270 230 L 330 230" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arG)" filter="url(#sk2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">deleteFront</text>
  <text x="300" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a">front = (front+1)%cap</text>

  <!-- insertLast：在 rear 处（slot 4）写入，rear 前进 +1（向右，绕回 0） -->
  <path d="M 540 110 Q 500 120 460 165" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk2)"/>
  <text x="560" y="100" font-size="11" fill="#d6a040" font-weight="bold">insertLast</text>
  <text x="560" y="114" font-size="9" fill="#d6a040">data[rear]=v</text>
  <text x="560" y="126" font-size="9" fill="#d6a040">rear = (rear+1)%cap</text>

  <!-- deleteLast：rear 后退 -1（向左） -->
  <path d="M 450 230 L 390 230" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arO)" filter="url(#sk2)"/>
  <text x="420" y="250" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">deleteLast</text>
  <text x="420" y="264" text-anchor="middle" font-size="9" fill="#d6a040">rear = (rear-1+cap)%cap</text>

  <!-- ===== 右侧：622 vs 641 对照 ===== -->
  <g filter="url(#sk)">
    <rect x="690" y="100" width="230" height="180" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="805" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">622 循环队列 → 641 循环双端队列</text>
  <text x="702" y="148" font-size="11" fill="#b85450" font-weight="bold">622（单端）：</text>
  <text x="702" y="166" font-size="10" fill="#444">• rear 入队  enQueue</text>
  <text x="702" y="182" font-size="10" fill="#444">• front 出队  deQueue</text>
  <text x="702" y="198" font-size="9" fill="#888">仅 rear +1 / front +1，都向“前”走</text>
  <text x="702" y="222" font-size="11" fill="#2e6e2e" font-weight="bold">641（双端）：</text>
  <text x="702" y="240" font-size="10" fill="#444">• insertFront / insertLast</text>
  <text x="702" y="256" font-size="10" fill="#444">• deleteFront / deleteLast</text>
  <text x="702" y="272" font-size="9" fill="#888">front 与 rear 都双向移动，需 -1 取模</text>

  <!-- ===== 底部：四个操作对照表 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="880" height="200" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="60" y="326" font-size="13" font-weight="bold" fill="#2b6e9e">核心：四个操作 = 两个游标 × 两个方向（±1 取模）</text>

  <g filter="url(#sk)">
    <rect x="60" y="340" width="200" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="160" y="360" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">insertFront（队首插）</text>
  <text x="160" y="378" text-anchor="middle" font-size="10" fill="#444">front = (front-1+cap)%cap</text>
  <text x="160" y="394" text-anchor="middle" font-size="10" fill="#444">data[front] = v; count++</text>

  <g filter="url(#sk)">
    <rect x="270" y="340" width="200" height="62" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="370" y="360" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">insertLast（队尾插）</text>
  <text x="370" y="378" text-anchor="middle" font-size="10" fill="#444">data[rear] = v</text>
  <text x="370" y="394" text-anchor="middle" font-size="10" fill="#444">rear = (rear+1)%cap; count++</text>

  <g filter="url(#sk)">
    <rect x="480" y="340" width="200" height="62" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="580" y="360" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">deleteFront（队首删）</text>
  <text x="580" y="378" text-anchor="middle" font-size="10" fill="#444">front = (front+1)%cap</text>
  <text x="580" y="394" text-anchor="middle" font-size="10" fill="#444">count--</text>

  <g filter="url(#sk)">
    <rect x="690" y="340" width="200" height="62" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="790" y="360" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">deleteLast（队尾删）</text>
  <text x="790" y="378" text-anchor="middle" font-size="10" fill="#444">rear = (rear-1+cap)%cap</text>
  <text x="790" y="394" text-anchor="middle" font-size="10" fill="#444">count--</text>

  <text x="470" y="430" text-anchor="middle" font-size="11" fill="#7a5415">⚠ 所有“后退”操作统一写 (i - 1 + cap) % cap，加 cap 防 C++ 负下标 / Python 末尾回绕</text>
  <text x="470" y="450" text-anchor="middle" font-size="11" fill="#2e6e2e">对称性：insertFront ↔ deleteLast（front/rear 各 -1/+1 互为镜像）；insertLast ↔ deleteFront 同理</text>
  <text x="470" y="470" text-anchor="middle" font-size="11" fill="#444">不变量：front 始终指队首元素；rear 始终指“下一个尾部插入位”；count 独立判空/判满，与位置解耦</text>
</svg>
