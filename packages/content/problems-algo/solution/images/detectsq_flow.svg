<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">count 算法流程：枚举同列点 → O(1) 查表累加</text>

  <!-- add box -->
  <rect x="40" y="48" width="180" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">add(point)</text>
  <text x="130" y="94" text-anchor="middle" font-size="11" fill="#555">cnt[x][y] += 1   O(1)</text>

  <!-- count start -->
  <rect x="280" y="48" width="240" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count(point)  px, py</text>
  <text x="400" y="94" text-anchor="middle" font-size="11" fill="#555">若 cnt[px] 不存在 → 返回 0</text>

  <!-- arrow down -->
  <path d="M 400 116 L 400 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- iterate same column -->
  <rect x="270" y="148" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 cnt[px] 中的每个 y</text>
  <text x="400" y="192" text-anchor="middle" font-size="11" fill="#555">跳过 y == py（边长为 0）</text>

  <path d="M 400 208 L 400 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: d = |y - py| -->
  <rect x="300" y="240" width="200" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d = |y − py|</text>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#555">边长已定</text>

  <path d="M 400 294 L 400 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- two branches: left & right -->
  <rect x="80" y="326" width="220" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="190" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">朝右 x = px + d</text>
  <text x="190" y="370" text-anchor="middle" font-size="11" fill="#555">ans += cnt[px+d][py]</text>
  <text x="190" y="388" text-anchor="middle" font-size="11" fill="#555">     × cnt[px+d][y]</text>

  <rect x="340" y="326" width="220" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">朝左 x = px − d</text>
  <text x="450" y="370" text-anchor="middle" font-size="11" fill="#555">ans += cnt[px−d][py]</text>
  <text x="450" y="388" text-anchor="middle" font-size="11" fill="#555">     × cnt[px−d][y]</text>

  <!-- merge arrows -->
  <path d="M 190 404 L 190 430 L 400 430" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 404 L 450 430 L 400 430" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 400 430 L 400 452" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow to iterate -->
  <path d="M 270 176 Q 220 176 220 250 Q 220 320 300 320" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="250" font-size="10" fill="#888">下一个 y</text>

  <!-- return -->
  <rect x="320" y="458" width="160" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="480" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>
  <text x="400" y="498" text-anchor="middle" font-size="11" fill="#555">所有同列点累加完</text>
</svg>
