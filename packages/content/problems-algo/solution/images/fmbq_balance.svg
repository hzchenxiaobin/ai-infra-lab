<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,3 L8,3" fill="none" stroke="#b85450" stroke-width="1.5"/>
      <path d="M6,0 L9,3 L6,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto">
      <path d="M10,3 L2,3" fill="none" stroke="#b85450" stroke-width="1.5"/>
      <path d="M4,0 L1,3 L4,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">再平衡：两端长度失衡时，从较长一端搬一个元素到较短端</text>

  <!-- ===== Case A: front too big ===== -->
  <text x="40" y="64" font-size="12" fill="#b85450" font-weight="bold">情形 A：|front| &gt; |back|（front 过长）</text>
  <text x="40" y="80" font-size="10.5" fill="#888">如 popBack 命中 back 使 |back| 变小后</text>

  <!-- front before: a b c -->
  <text x="118" y="104" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">front</text>
  <rect x="80" y="110" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="108" y="138" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="136" y="110" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="164" y="138" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="192" y="110" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="220" y="138" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <!-- transfer arrow c -> back.front -->
  <path d="M 220 158 C 220 184, 300 184, 300 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="260" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">front.back → back.front</text>

  <!-- back before: d e -->
  <text x="328" y="104" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">back</text>
  <rect x="300" y="110" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="328" y="138" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="356" y="110" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="384" y="138" text-anchor="middle" font-size="13" fill="#333">e</text>

  <!-- result row -->
  <text x="40" y="218" font-size="10.5" fill="#888">平衡后：</text>
  <rect x="80" y="224" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="108" y="252" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="136" y="224" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="164" y="252" text-anchor="middle" font-size="13" fill="#333">b</text>
  <path d="M 250 218 L 250 268" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="300" y="224" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="328" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="356" y="224" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="384" y="252" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="412" y="224" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="252" text-anchor="middle" font-size="13" fill="#333">e</text>
  <text x="300" y="284" text-anchor="middle" font-size="10" fill="#888">|front|=2, |back|=3 → 不变式恢复</text>

  <!-- ===== Case B: back too big ===== -->
  <text x="40" y="316" font-size="12" fill="#b85450" font-weight="bold">情形 B：|back| &gt; |front|+1（back 过长）</text>
  <text x="300" y="316" font-size="10.5" fill="#888">反向：back.front → front.back</text>

  <!-- front: a -->
  <rect x="80" y="328" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="108" y="356" text-anchor="middle" font-size="13" fill="#333">a</text>
  <!-- back: b c d (b highlighted) -->
  <rect x="300" y="328" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="328" y="356" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="356" y="328" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="384" y="356" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="412" y="328" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="356" text-anchor="middle" font-size="13" fill="#333">d</text>
  <!-- transfer arrow b -> front.back (leftward) -->
  <path d="M 300 340 C 260 340, 200 340, 140 340" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrL)" filter="url(#rough2)" stroke-dasharray="5,3"/>
</svg>
