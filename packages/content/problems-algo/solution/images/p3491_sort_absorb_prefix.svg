<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：字典序排序后，前缀关系只出现在「相邻」位置</text>

  <!-- ===== 排序后的号码行 ===== -->
  <text x="42" y="66" font-size="10.5" fill="#555" filter="url(#rough2)">示例 2</text>
  <text x="42" y="80" font-size="10.5" fill="#555" filter="url(#rough2)">排序后：</text>

  <g text-anchor="middle" font-size="13" font-weight="bold">
    <rect x="108" y="50" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="139" y="70" fill="#333" filter="url(#rough2)">001</text>

    <rect x="184" y="50" width="78" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="223" y="70" fill="#b85450" filter="url(#rough2)">00153</text>

    <rect x="276" y="50" width="62" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="307" y="70" fill="#777" filter="url(#rough2)">007</text>

    <rect x="352" y="50" width="62" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="383" y="70" fill="#777" filter="url(#rough2)">15</text>
  </g>

  <text x="269" y="70" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">✗</text>
  <text x="345" y="70" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">✗</text>

  <path d="M 139 86 C 139 104, 180 104, 205 100" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">相邻对命中：001 是 00153 的前缀 → 返回 false</text>

  <!-- ===== 吸收引理：字典序轴 ===== -->
  <text x="260" y="138" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">「吸收」引理：前缀 s 吞掉字典序上紧随其后的一整段</text>

  <rect x="120" y="158" width="142" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="191" y="172" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">以 "001" 为前缀的字符串</text>
  <text x="191" y="184" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">（001 的所有「扩张」）</text>

  <line x1="55" y1="212" x2="452" y2="212" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="216" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">字典序</text>

  <circle cx="120" cy="212" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="120" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">001</text>

  <circle cx="212" cy="212" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="212" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">00153</text>

  <circle cx="262" cy="212" r="4" fill="#999" filter="url(#rough2)"/>
  <text x="262" y="232" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">002（区间外）</text>

  <circle cx="345" cy="212" r="4" fill="#999" filter="url(#rough2)"/>
  <text x="345" y="232" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">007</text>

  <circle cx="425" cy="212" r="4" fill="#999" filter="url(#rough2)"/>
  <text x="425" y="232" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">15</text>

  <path d="M 212 176 L 212 204" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="260" y="254" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">若 s 是 t 的前缀，任何字典序夹在 s ≤ u ≤ t 之间的 u 都以 s 为前缀</text>
  <text x="260" y="270" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">反证：取间隔最小的一对前缀，若不相邻，中间元素被吸收成更近的一对 → 矛盾</text>

  <!-- ===== 结论横幅 ===== -->
  <rect x="20" y="286" width="480" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">存在前缀关系 ⟺ 某个相邻对 (a[i], a[i+1]) 满足 a[i] 是 a[i+1] 的前缀</text>
  <text x="260" y="330" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">检查量从 n(n−1)/2 对坍缩为 n−1 对相邻检查</text>
</svg>
