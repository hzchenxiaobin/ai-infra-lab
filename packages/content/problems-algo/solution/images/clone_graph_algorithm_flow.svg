<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">克隆图 DFS 流程：clone(node)</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">哈希表 visited 既防环又去重；每个节点只创建一次</text>

  <!-- ===== Start ===== -->
  <rect x="170" y="58" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="83" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">入口：clone(node)</text>

  <path d="M 270 100 L 270 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond: node null? ===== -->
  <polygon points="270,122 340,156 270,190 200,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="153" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">node == null ?</text>
  <text x="270" y="168" text-anchor="middle" font-size="9" fill="#888">空图</text>

  <!-- yes branch right -->
  <path d="M 340 156 L 410 156" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="148" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <rect x="412" y="138" width="110" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="467" y="161" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">return null</text>

  <!-- no down -->
  <path d="M 270 190 L 270 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="204" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- ===== Diamond: visited.count(node)? ===== -->
  <polygon points="270,214 350,250 270,286 190,250" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">visited.count</text>
  <text x="270" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(node) ?</text>
  <text x="270" y="274" text-anchor="middle" font-size="9" fill="#888">已克隆过?</text>

  <!-- yes branch right (reuse) -->
  <path d="M 350 250 L 410 250" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="242" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="412" y="230" width="118" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="471" y="249" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return visited[node]</text>
  <text x="471" y="263" text-anchor="middle" font-size="9" fill="#888">直接复用，破环!</text>

  <!-- no down -->
  <path d="M 270 286 L 270 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="300" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- ===== Step: create clone ===== -->
  <rect x="150" y="310" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="328" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① copy = new Node(node-&gt;val)</text>
  <text x="270" y="343" text-anchor="middle" font-size="9" fill="#555">先建节点（neighbors 暂空）</text>

  <path d="M 270 352 L 270 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step: register in map ===== -->
  <rect x="150" y="372" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② visited[node] = copy</text>

  <path d="M 270 412 L 270 430" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step: recurse neighbors ===== -->
  <rect x="110" y="432" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="452" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ for nb in node-&gt;neighbors:</text>
  <text x="270" y="468" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">copy-&gt;neighbors.push_back(clone(nb))</text>

  <path d="M 270 478 L 270 498" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== End ===== -->
  <rect x="190" y="500" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="522" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return copy</text>

  <!-- footer note -->
  <text x="445" y="492" text-anchor="middle" font-size="9.5" fill="#888">② 先注册再递归：</text>
  <text x="445" y="506" text-anchor="middle" font-size="9.5" fill="#888">环上回到本节点时</text>
  <text x="445" y="520" text-anchor="middle" font-size="9.5" fill="#888">能命中 map 提前返回</text>
</svg>
