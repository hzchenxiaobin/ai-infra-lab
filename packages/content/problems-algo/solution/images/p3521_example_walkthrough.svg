<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：5 个购物篮 → 16 行对 → 8 组计数 → 3 个推荐对</text>

  <!-- 左侧：各用户购物篮 -->
  <text x="155" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">各用户购物篮 → 展开成对</text>

  <!-- u1 -->
  <rect x="40" y="54" width="34" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="57" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">u1</text>
  <rect x="82" y="54" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">101</text>
  <rect x="124" y="54" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">102</text>
  <rect x="166" y="54" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">103</text>
  <text x="252" y="75" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">→ 3 对</text>

  <!-- u2 -->
  <rect x="40" y="104" width="34" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="57" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">u2</text>
  <rect x="82" y="104" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="125" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">101</text>
  <rect x="124" y="104" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="125" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">102</text>
  <rect x="166" y="104" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="125" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">104</text>
  <text x="252" y="125" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">→ 3 对</text>

  <!-- u3 -->
  <rect x="40" y="154" width="34" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="57" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">u3</text>
  <rect x="82" y="154" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="175" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">101</text>
  <rect x="124" y="154" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="175" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">103</text>
  <rect x="166" y="154" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="175" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">105</text>
  <text x="252" y="175" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">→ 3 对</text>

  <!-- u4 -->
  <rect x="40" y="204" width="34" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="57" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">u4</text>
  <rect x="82" y="204" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="225" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">101</text>
  <rect x="124" y="204" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="225" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">102</text>
  <rect x="166" y="204" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="225" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">103</text>
  <rect x="208" y="204" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="225" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">104</text>
  <text x="252" y="225" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">→ 6 对</text>

  <!-- u5 -->
  <rect x="40" y="254" width="34" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="57" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">u5</text>
  <rect x="82" y="254" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">102</text>
  <rect x="124" y="254" width="38" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="275" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">104</text>
  <text x="252" y="275" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">→ 1 对</text>

  <!-- 右侧：计数表 -->
  <text x="403" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">GROUP BY 计数表（HAVING ≥ 3）</text>

  <rect x="298" y="56" width="210" height="25" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="306" y="73" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">(101,102)</text>
  <text x="392" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>
  <text x="412" y="73" text-anchor="start" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">u1,u2,u4 ✓</text>

  <rect x="298" y="83" width="210" height="25" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="306" y="100" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">(101,103)</text>
  <text x="392" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>
  <text x="412" y="100" text-anchor="start" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">u1,u3,u4 ✓</text>

  <text x="306" y="127" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">(101,104)</text>
  <text x="392" y="127" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="412" y="127" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">u2,u4 ✗</text>

  <text x="306" y="154" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">(101,105)</text>
  <text x="392" y="154" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="412" y="154" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">u3 ✗</text>

  <text x="306" y="181" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">(102,103)</text>
  <text x="392" y="181" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="412" y="181" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">u1,u4 ✗</text>

  <rect x="298" y="190" width="210" height="25" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="306" y="207" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">(102,104)</text>
  <text x="392" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>
  <text x="412" y="207" text-anchor="start" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">u2,u4,u5 ✓</text>

  <text x="306" y="235" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">(103,104)</text>
  <text x="392" y="235" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="412" y="235" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">u4 ✗</text>

  <text x="306" y="262" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">(103,105)</text>
  <text x="392" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="412" y="262" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">u3 ✗</text>

  <!-- 结论框 -->
  <rect x="56" y="296" width="408" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">共同购买人数 ≥ 3 的只有 (101,102)、(101,103)、(102,104)</text>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">合计 3+3+3+6+1 = 16 行对、8 个不同对，其中 3 对过阈值</text>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">再 JOIN ProductInfo 补类别 + 三键排序 → 输出与示例完全一致</text>
</svg>
