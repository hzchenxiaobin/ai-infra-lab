<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：buckets=[2,4,6]，loss=50，验证 v=3.5</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">因子 100/(100−loss) = 100/50 = 2，即每补 1 升需倒出 2 升</text>

  <!-- Table header -->
  <text x="48" y="74" font-size="10.5" fill="#666">桶</text>
  <text x="108" y="74" font-size="10.5" fill="#666">水量 x</text>
  <text x="190" y="74" font-size="10.5" fill="#666">与 v=3.5</text>
  <text x="284" y="74" font-size="10.5" fill="#666">盈余 x−v</text>
  <text x="424" y="74" font-size="10.5" fill="#666">需倒出 (v−x)·2</text>
  <path d="M 28 80 L 540 80" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: x=2, deficit -->
  <rect x="28" y="86" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="108" y="106" font-size="11" fill="#333">2</text>
  <text x="190" y="106" font-size="11" fill="#b85450">＜ 亏</text>
  <text x="284" y="106" font-size="11" fill="#888">—</text>
  <text x="424" y="106" font-size="11" fill="#b85450" font-weight="bold">1.5 × 2 = 3.0</text>

  <!-- Row 1: x=4, surplus -->
  <rect x="28" y="120" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="108" y="140" font-size="11" fill="#333">4</text>
  <text x="190" y="140" font-size="11" fill="#446688">＞ 盈</text>
  <text x="284" y="140" font-size="11" fill="#446688" font-weight="bold">0.5</text>
  <text x="424" y="140" font-size="11" fill="#888">—</text>

  <!-- Row 2: x=6, surplus -->
  <rect x="28" y="154" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="108" y="174" font-size="11" fill="#333">6</text>
  <text x="190" y="174" font-size="11" fill="#446688">＞ 盈</text>
  <text x="284" y="174" font-size="11" fill="#446688" font-weight="bold">2.5</text>
  <text x="424" y="174" font-size="11" fill="#888">—</text>

  <!-- divider -->
  <path d="M 28 192 L 540 192" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Sum row -->
  <rect x="28" y="200" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Σ</text>
  <text x="180" y="220" font-size="11" fill="#555">合计</text>
  <text x="284" y="220" font-size="11.5" fill="#446688" font-weight="bold">a = 3.0</text>
  <text x="424" y="220" font-size="11.5" fill="#b85450" font-weight="bold">b = 3.0</text>

  <!-- Result -->
  <rect x="80" y="244" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a = 3.0 ≥ b = 3.0  ✓  → v = 3.5 可行</text>

  <!-- Convergence note -->
  <rect x="60" y="296" width="440" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">为何 3.5 是最大？</text>
  <text x="280" y="334" text-anchor="middle" font-size="10.5" fill="#555">v &gt; 3.5 时盈余下降、亏缺上升且乘 2 放大 → a &lt; b 不可行</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#555">二分区间 [0, 6] 反复缩至 r−l ≤ 1e−5，收敛到 3.5</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#888">对照 loss=0：无损耗退化为平均值 (2+4+6)/3 = 4</text>

  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#aaa">每行盈余合计 a 与需倒出合计 b 比较，一趟 O(n) 完成 check</text>
</svg>
