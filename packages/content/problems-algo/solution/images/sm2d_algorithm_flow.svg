<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="560" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一次二分流程：下标映射 + 闭区间二分</text>

  <!-- Init -->
  <rect x="70" y="42" width="320" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="84" text-anchor="middle" font-size="11" fill="#555">lo = 0, hi = m·n − 1（闭区间）</text>

  <path d="M 230 96 L 230 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="230,118 350,164 230,210 110,164" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo ≤ hi ?</text>
  <text x="230" y="178" text-anchor="middle" font-size="10.5" fill="#777">区间非空？</text>

  <!-- No -> return false -->
  <path d="M 350 164 L 408 164 L 408 244" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="358" y="156" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="318" y="248" width="140" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="388" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes down -->
  <path d="M 230 210 L 230 228" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="224" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- mid compute -->
  <rect x="90" y="232" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mid = lo + (hi − lo) / 2</text>

  <path d="M 230 272 L 230 290" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- index mapping box -->
  <rect x="90" y="294" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="313" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">val = matrix[ mid / n ][ mid % n ]</text>
  <text x="230" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a">一维下标映射回二维</text>

  <path d="M 230 338 L 230 356" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <polygon points="230,360 380,420 230,480 80,420" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="416" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">比较 val 与 target</text>
  <text x="230" y="434" text-anchor="middle" font-size="10.5" fill="#777">三分支判定</text>

  <!-- == branch: center -->
  <path d="M 230 480 L 230 498" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="252" y="492" font-size="10.5" fill="#d6a040" font-weight="bold">==</text>
  <rect x="150" y="502" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="528" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">return true</text>

  <!-- < branch: left side -->
  <path d="M 80 420 L 36 420 L 36 502" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="44" y="412" font-size="10.5" fill="#446688" font-weight="bold">&lt; target</text>
  <rect x="4" y="506" width="120" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="64" y="524" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">目标在右</text>
  <text x="64" y="540" text-anchor="middle" font-size="10.5" fill="#555">lo = mid + 1</text>

  <!-- > branch: right side -->
  <path d="M 380 420 L 424 420 L 424 502" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="392" y="412" font-size="10.5" fill="#b85450" font-weight="bold">&gt; target</text>
  <rect x="336" y="506" width="120" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="396" y="524" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">目标在左</text>
  <text x="396" y="540" text-anchor="middle" font-size="10.5" fill="#555">hi = mid − 1</text>

  <!-- loop back from left/right branches to loop check -->
  <path d="M 64 506 L 64 164 L 110 164" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 396 506 L 396 164 L 350 164" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowL)" filter="url(#rough2)"/>

  <!-- footer -->
  <text x="230" y="556" text-anchor="middle" font-size="11" fill="#888">每轮 O(1)，共 O(log(m·n))，空间 O(1)</text>
</svg>
