<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：nums 有序 ⇒ 断口两侧无边 ⇒ 连通块 = 连续段</text>
  <text x="280" y="46" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">示例 2：nums = [2, 5, 6, 8]，maxDiff = 2</text>

  <!-- 断口标签 + 相邻差标注 -->
  <text x="152" y="62" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">断口</text>
  <text x="152" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">差 3 &gt; 2</text>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">差 1</text>
  <text x="408" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">差 2</text>

  <!-- 断口墙（红色虚线，贯穿格子区与段框区） -->
  <line x1="152" y1="84" x2="152" y2="224" stroke="#b85450" stroke-width="3" stroke-dasharray="7,5" filter="url(#rough2)"/>

  <!-- 四个数值格子 -->
  <rect x="44" y="88" width="88" height="62" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="88" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="88" y="140" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">#0</text>

  <rect x="172" y="88" width="88" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>
  <text x="216" y="140" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">#1</text>

  <rect x="300" y="88" width="88" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="344" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">6</text>
  <text x="344" y="140" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">#2</text>

  <rect x="428" y="88" width="88" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="472" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">8</text>
  <text x="472" y="140" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">#3</text>

  <!-- 段内无向边（弧线，不带箭头） -->
  <path d="M 216 152 C 216 170, 344 170, 344 152" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 344 152 C 344 170, 472 170, 472 152" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="344" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">相邻差 ≤ maxDiff ⇒ 有边（无向）</text>

  <!-- 两个段框 -->
  <rect x="36" y="186" width="104" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">段 A</text>
  <text x="88" y="219" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">block = 0</text>

  <rect x="164" y="186" width="360" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="344" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">段 B</text>
  <text x="344" y="219" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">block = 1（内部链式连通）</text>

  <!-- 查询卡片 -->
  <rect x="36" y="250" width="240" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">查询 [0,2]：段 A ✗ 段 B</text>
  <text x="156" y="287" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">隔墙无路 → false</text>

  <rect x="284" y="250" width="240" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">查询 [1,3]：段 B 内部</text>
  <text x="404" y="287" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">链式可达 → true</text>

  <!-- 结论框 -->
  <rect x="36" y="316" width="488" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">为什么断口是"墙"？</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">任意 j ≤ i、k ≥ i+1：nums[k] − nums[j] ≥ nums[i+1] − nums[i] &gt; maxDiff ⇒ 两两无边</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">段内相邻差全 ≤ maxDiff ⇒ 链式连通 ⇒ u、v 有路径 ⇔ block[u] == block[v]</text>
</svg>
