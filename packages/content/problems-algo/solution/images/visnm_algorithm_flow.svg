<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="640" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 扫描维护 maxR</text>

  <!-- step 1 -->
  <rect x="130" y="46" width="280" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 每个峰转区间 [x−y, x+y]</text>
  <text x="270" y="84" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">峰 (xi, yi) → 底边端点</text>

  <path d="M270,94 L270,118" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="130" y="120" width="280" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 排序：left 升序，right 降序</text>
  <text x="270" y="158" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同左端时大右端优先，便于判包含</text>

  <path d="M270,168 L270,192" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="130" y="194" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ 遍历：相邻同区间分组去重</text>
  <text x="270" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">count = 本组重复个数</text>

  <path d="M270,242 L270,266" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="270,268 410,322 270,376 130,322" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">count==1 且</text>
  <text x="270" y="332" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">right &gt; maxR ?</text>
  <text x="270" y="350" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（不被任何先前区间包含）</text>

  <!-- yes branch (left) -->
  <path d="M130,322 L60,322 L60,412" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="92" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="14" y="416" width="200" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="114" y="438" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans += 1</text>
  <text x="114" y="454" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">该山可见</text>
  <text x="114" y="470" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">右端突破历史最远</text>

  <!-- no branch (right) -->
  <path d="M410,322 L478,322 L478,412" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="446" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="400" y="416" width="126" height="62" fill="#f4f8ff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="463" y="438" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">跳过</text>
  <text x="463" y="454" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">重复或被包含</text>

  <!-- merge: update maxR -->
  <path d="M114,478 L114,516 L410,516 L410,478" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="180" y="500" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="523" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">maxR = max(maxR, right)</text>

  <!-- loop back to step 3 -->
  <path d="M270,536 L270,556 L520,556 L520,218 L410,218" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="500" y="390" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">下一组</text>

  <!-- end -->
  <path d="M270,536 L270,560" stroke="none"/>
  <rect x="170" y="566" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="594" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">遍历完 → 返回 ans</text>

  <text x="270" y="628" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">瓶颈在排序 O(n log n)；扫描 O(n)，整体线性对数</text>
</svg>
