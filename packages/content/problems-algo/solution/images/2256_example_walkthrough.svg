<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [2,5,3,9,5,3]，total = 27</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">逐下标滚动 leftSum，rightSum = 27 − leftSum，算两段均值与绝对差</text>

  <!-- ===== Table header ===== -->
  <!-- columns: i | leftSum | leftCnt | leftAvg | rightSum | rightCnt | rightAvg | diff -->
  <!-- x positions: 40, 95, 150, 205, 260, 315, 370, 425 ; col width ~55 -->
  <rect x="36" y="54" width="488" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="115" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">leftSum</text>
  <text x="170" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">leftCnt</text>
  <text x="225" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">leftAvg</text>
  <text x="280" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">rightSum</text>
  <text x="335" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">rightCnt</text>
  <text x="390" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">rightAvg</text>
  <text x="445" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">diff</text>

  <!-- column separators (vertical light lines) -->
  <line x1="88" y1="54" x2="88" y2="300" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="143" y1="54" x2="143" y2="300" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="198" y1="54" x2="198" y2="300" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="253" y1="54" x2="253" y2="300" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="308" y1="54" x2="308" y2="300" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="363" y1="54" x2="363" y2="300" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="418" y1="54" x2="418" y2="300" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row data ===== -->
  <!-- row heights: y starts 86, each 34 -->
  <!-- row 0: i=0 -->
  <rect x="36" y="82" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="60" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="115" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="170" y="104" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="225" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="280" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">25</text>
  <text x="335" y="104" text-anchor="middle" font-size="11" fill="#666">5</text>
  <text x="390" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="445" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- row 1: i=1 -->
  <rect x="36" y="116" width="488" height="34" fill="#fff" stroke="none"/>
  <text x="60" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="115" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">7</text>
  <text x="170" y="138" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="225" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">20</text>
  <text x="335" y="138" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="390" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="445" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- row 2: i=2 -->
  <rect x="36" y="150" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="60" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="115" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">10</text>
  <text x="170" y="172" text-anchor="middle" font-size="11" fill="#666">3</text>
  <text x="225" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">17</text>
  <text x="335" y="172" text-anchor="middle" font-size="11" fill="#666">3</text>
  <text x="390" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="445" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- row 3: i=3 HIGHLIGHTED (answer) -->
  <rect x="36" y="184" width="488" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="115" y="206" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">19</text>
  <text x="170" y="206" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="225" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="335" y="206" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="390" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="445" y="206" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <!-- row 4: i=4 -->
  <rect x="36" y="218" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="60" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="115" y="240" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">24</text>
  <text x="170" y="240" text-anchor="middle" font-size="11" fill="#666">5</text>
  <text x="225" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="335" y="240" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="390" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="445" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- row 5: i=5 (edge: rightCnt=0) -->
  <rect x="36" y="252" width="488" height="34" fill="#fff" stroke="none"/>
  <text x="60" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="115" y="274" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">27</text>
  <text x="170" y="274" text-anchor="middle" font-size="11" fill="#666">6</text>
  <text x="225" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="335" y="274" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="390" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0*</text>
  <text x="445" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>

  <!-- table outer border -->
  <rect x="36" y="54" width="488" height="246" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- annotation for i=3 -->
  <path d="M 470 200 Q 500 200 500 184" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#rough)" filter="url(#rough2)"/>
  <text x="500" y="180" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">最小！</text>
  <text x="500" y="166" text-anchor="middle" font-size="9.5" fill="#888">ans=3</text>

  <!-- annotation for i=5 edge -->
  <text x="478" y="288" font-size="9.5" fill="#b85450" font-weight="bold">* rightCnt=0</text>
  <text x="478" y="299" font-size="9.5" fill="#b85450" font-weight="bold">特判→0</text>

  <!-- ===== Key recurrence box ===== -->
  <rect x="40" y="312" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">递推：leftSum_i = leftSum_{i−1} + nums[i]；rightSum_i = total − leftSum_i</text>

  <!-- ===== Rolling trace of leftSum ===== -->
  <text x="40" y="368" font-size="11" fill="#444" font-weight="bold">leftSum 滚动轨迹：</text>
  <rect x="40" y="374" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="116" y="374" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="192" y="374" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="268" y="374" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="392" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">19</text>
  <rect x="344" y="374" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">24</text>
  <rect x="420" y="374" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">27</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#888">每步只加 nums[i]，O(1) 转移；19 对应 i=3，此时 rightSum=27−19=8</text>

  <!-- footer -->
  <text x="280" y="432" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">答案 = 3（diff=0 全局最小）</text>
</svg>
