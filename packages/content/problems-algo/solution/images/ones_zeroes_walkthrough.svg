<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：strs=["10","0","1"], m=1, n=1</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">dp[j][k] = 用 0 不超过 j、1 不超过 k 时的最大子集大小</text>

  <!-- 通用 2x2 表格绘制：列 j 标 0,1；行 k 标 0,1 -->
  <!-- 表格区域: 左上角 (130,80), 单元 70x46 -->

  <!-- ===== 初始 ===== -->
  <text x="80" y="86" font-size="11" fill="#666" font-weight="bold">初始</text>
  <text x="80" y="102" font-size="10" fill="#999">全 0</text>
  <!-- 表头 -->
  <rect x="130" y="80" width="70" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="97" text-anchor="middle" font-size="11" fill="#888">j=0</text>
  <rect x="200" y="80" width="70" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="97" text-anchor="middle" font-size="11" fill="#888">j=1</text>
  <!-- 行 k=0 -->
  <rect x="100" y="104" width="30" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="124" text-anchor="middle" font-size="10" fill="#888">k=0</text>
  <rect x="130" y="104" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="124" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="200" y="104" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="124" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- 行 k=1 -->
  <rect x="100" y="134" width="30" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="154" text-anchor="middle" font-size="10" fill="#888">k=1</text>
  <rect x="130" y="134" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="154" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="200" y="134" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="154" text-anchor="middle" font-size="12" fill="#333">0</text>

  <path d="M 290 124 L 320 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 处理 "10" (z=1,o=1) ===== -->
  <text x="330" y="86" font-size="11" fill="#666" font-weight="bold">处理 "10"</text>
  <text x="330" y="102" font-size="10" fill="#999">z=1, o=1</text>
  <rect x="380" y="80" width="70" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="97" text-anchor="middle" font-size="11" fill="#888">j=0</text>
  <rect x="450" y="80" width="70" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485" y="97" text-anchor="middle" font-size="11" fill="#888">j=1</text>
  <rect x="350" y="104" width="30" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="124" text-anchor="middle" font-size="10" fill="#888">k=0</text>
  <rect x="380" y="104" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="124" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="450" y="104" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485" y="124" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="350" y="134" width="30" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="154" text-anchor="middle" font-size="10" fill="#888">k=1</text>
  <rect x="380" y="134" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="154" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="450" y="134" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="485" y="154" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="528" y="154" font-size="10" fill="#888">dp[1][1]</text>
  <text x="528" y="168" font-size="9" fill="#999">=dp[0][0]+1</text>

  <path d="M 165 178 L 165 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 485 178 L 485 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 处理 "0" (z=1,o=0) ===== -->
  <text x="80" y="200" font-size="11" fill="#666" font-weight="bold">处理 "0"</text>
  <text x="80" y="216" font-size="10" fill="#999">z=1, o=0</text>
  <rect x="130" y="210" width="70" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="227" text-anchor="middle" font-size="11" fill="#888">j=0</text>
  <rect x="200" y="210" width="70" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="227" text-anchor="middle" font-size="11" fill="#888">j=1</text>
  <rect x="100" y="234" width="30" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="254" text-anchor="middle" font-size="10" fill="#888">k=0</text>
  <rect x="130" y="234" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="254" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="200" y="234" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="235" y="254" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="100" y="264" width="30" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="284" text-anchor="middle" font-size="10" fill="#888">k=1</text>
  <rect x="130" y="264" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="284" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="200" y="264" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="284" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="270" y="254" font-size="9" fill="#999">dp[1][0]=1</text>

  <!-- ===== 处理 "1" (z=0,o=1) ===== -->
  <text x="330" y="200" font-size="11" fill="#666" font-weight="bold">处理 "1"</text>
  <text x="330" y="216" font-size="10" fill="#999">z=0, o=1</text>
  <rect x="380" y="210" width="70" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="227" text-anchor="middle" font-size="11" fill="#888">j=0</text>
  <rect x="450" y="210" width="70" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485" y="227" text-anchor="middle" font-size="11" fill="#888">j=1</text>
  <rect x="350" y="234" width="30" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="254" text-anchor="middle" font-size="10" fill="#888">k=0</text>
  <rect x="380" y="234" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="254" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="450" y="234" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485" y="254" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="350" y="264" width="30" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="284" text-anchor="middle" font-size="10" fill="#888">k=1</text>
  <rect x="380" y="264" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="415" y="284" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="450" y="264" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="485" y="284" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="528" y="278" font-size="10" fill="#888">dp[1][1]</text>
  <text x="528" y="292" font-size="9" fill="#999">=dp[1][0]+1</text>

  <!-- 结论 -->
  <rect x="110" y="330" width="380" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="352" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 dp[1][1] = 2 ⭐</text>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#333">dp[1][0]=1（选 "0"）+ 放入 "1"(z=0,o=1)</text>
  <text x="300" y="390" text-anchor="middle" font-size="11" fill="#333">⇒ 子集 {"0","1"}：0 用量 1，1 用量 1，件数 2</text>

  <text x="300" y="438" text-anchor="middle" font-size="11" fill="#888">关键：处理 "1" 时 dp[1][1] 由 dp[1][0]+1 转移而来</text>
  <text x="300" y="456" text-anchor="middle" font-size="11" fill="#888">dp[1][0] 是上一轮（处理完 "0"）留下的旧值 → 体现了「两串各用一次」</text>
</svg>
