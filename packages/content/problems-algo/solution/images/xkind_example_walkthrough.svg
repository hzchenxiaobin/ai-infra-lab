<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：GCD ≥ 2 则 true，GCD = 1 则 false</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1 ✓</text>

  <!-- deck -->
  <text x="40" y="82" font-size="11" fill="#888">deck:</text>
  <rect x="90" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="107" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="126" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="143" y="84" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="162" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="179" y="84" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="198" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="84" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="234" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="84" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="270" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="287" y="84" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="306" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="323" y="84" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="342" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="359" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- freq -->
  <text x="40" y="122" font-size="11" fill="#888">频次:</text>
  <rect x="90" y="106" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="124" text-anchor="middle" font-size="12" fill="#333">1:2</text>
  <rect x="156" y="106" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="124" text-anchor="middle" font-size="12" fill="#333">2:2</text>
  <rect x="222" y="106" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="124" text-anchor="middle" font-size="12" fill="#333">3:2</text>
  <rect x="288" y="106" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="318" y="124" text-anchor="middle" font-size="12" fill="#333">4:2</text>

  <!-- gcd -->
  <text x="40" y="162" font-size="11" fill="#888">求 GCD:</text>
  <text x="120" y="162" font-size="12" fill="#333">g = gcd(2,2) = 2 → gcd(2,2) = 2 → gcd(2,2) =</text>
  <rect x="402" y="148" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="419" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- result -->
  <rect x="450" y="148" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="496" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">true ✓</text>

  <!-- divider -->
  <path d="M 40 188 L 520 188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="214" font-size="12" fill="#b85450" font-weight="bold">示例 2 ✗</text>

  <!-- deck -->
  <text x="40" y="238" font-size="11" fill="#888">deck:</text>
  <rect x="90" y="222" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="107" y="240" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="126" y="222" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="143" y="240" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="162" y="222" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="179" y="240" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="198" y="222" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="240" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="234" y="222" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="240" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="270" y="222" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="287" y="240" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="306" y="222" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="323" y="240" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="342" y="222" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="359" y="240" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- freq -->
  <text x="40" y="278" font-size="11" fill="#888">频次:</text>
  <rect x="90" y="262" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="280" text-anchor="middle" font-size="12" fill="#333">1:3</text>
  <rect x="156" y="262" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="280" text-anchor="middle" font-size="12" fill="#333">2:3</text>
  <rect x="222" y="262" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="280" text-anchor="middle" font-size="12" fill="#333">3:2</text>

  <!-- gcd -->
  <text x="40" y="318" font-size="11" fill="#888">求 GCD:</text>
  <text x="120" y="318" font-size="12" fill="#333">g = gcd(3,3) = 3 → gcd(3,2) = 1 →</text>
  <rect x="350" y="304" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="322" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- result -->
  <rect x="400" y="304" width="92" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="446" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">false ✗</text>

  <!-- insight -->
  <rect x="40" y="348" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：频次 {3,3,2} 无 ≥2 的公约数</text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#666">3 张的组与 2 张的组无法统一到同一 X，故无解</text>
</svg>
