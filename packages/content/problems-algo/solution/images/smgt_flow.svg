<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">upper_bound 流程（闭区间 [left, right]）</text>

  <!-- start -->
  <rect x="200" y="44" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333">left=0, right=n−1</text>
  <path d="M 270 78 L 270 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop cond diamond -->
  <polygon points="270,100 370,150 270,200 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left ≤ right ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="10.5" fill="#888">否则区间为空</text>

  <!-- no branch -> return letters[left%n] -->
  <path d="M 370 150 L 470 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="418" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="162" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="465" y="180" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="465" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">letters[left % n]</text>

  <!-- yes branch down -->
  <path d="M 270 200 L 270 218" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- mid compute -->
  <rect x="170" y="222" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="244" text-anchor="middle" font-size="12" fill="#333">mid = left + (right−left)/2</text>
  <path d="M 270 256 L 270 276" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <polygon points="270,280 390,330 270,380 150,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">letters[mid] vs target</text>
  <text x="270" y="342" text-anchor="middle" font-size="10.5" fill="#888">两种情况（≤ 或 &gt;）</text>

  <!-- <= -> left=mid+1 (left branch) -->
  <path d="M 150 330 L 100 330 L 100 372" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="120" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">≤ target</text>
  <rect x="30" y="376" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="394" text-anchor="middle" font-size="11.5" fill="#333">left = mid + 1</text>
  <text x="100" y="410" text-anchor="middle" font-size="10" fill="#555">等于也算「不够大」，跳过</text>

  <!-- > -> right=mid-1 (right branch) -->
  <path d="M 390 330 L 440 330 L 440 372" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="418" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&gt; target</text>
  <rect x="370" y="376" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="394" text-anchor="middle" font-size="11.5" fill="#333">right = mid − 1</text>
  <text x="445" y="410" text-anchor="middle" font-size="10" fill="#555">mid 是候选，往左找更小</text>

  <!-- loop back arrows -->
  <path d="M 100 420 L 100 452 L 270 452 L 270 150" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 445 420 L 445 452 L 270 452" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="200" y="448" text-anchor="middle" font-size="10" fill="#888">回循环</text>

  <!-- key note -->
  <rect x="180" y="436" width="180" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="451" text-anchor="middle" font-size="10" fill="#d6a040">循环结束 left = 首个 &gt; target 下标</text>
</svg>
