<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">conditions 字段：空格分隔的疾病代码</text>

  <!-- ===== Example 1: ACNE DIAB150 (match) ===== -->
  <text x="50" y="56" font-size="11" fill="#888">示例：ACNE DIAB150</text>

  <!-- Code block 1: ACNE -->
  <rect x="40" y="64" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="85" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">ACNE</text>

  <!-- Space separator -->
  <text x="145" y="88" text-anchor="middle" font-size="12" fill="#999">␣</text>

  <!-- Code block 2: DIAB150 -->
  <rect x="160" y="64" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">DIAB150</text>

  <!-- Prefix highlight -->
  <rect x="160" y="64" width="50" height="36" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4 2" rx="6" filter="url(#rough2)"/>
  <text x="185" y="58" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">DIAB1 前缀</text>

  <!-- Arrow down -->
  <path d="M 220 100 L 220 114" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="116" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 匹配</text>

  <!-- ===== Example 2: SADIAB100 (no match) ===== -->
  <text x="350" y="56" font-size="11" fill="#888">反例：SADIAB100</text>

  <rect x="330" y="64" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">SADIAB100</text>

  <!-- Show DIAB1 is NOT at code boundary -->
  <rect x="370" y="64" width="50" height="36" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="4 2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="58" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">DIAB1 在中间</text>

  <path d="M 420 100 L 420 114" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="350" y="116" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 不匹配</text>

  <!-- ===== Divider ===== -->
  <path d="M 30 158 L 530 158" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Key insight: boundary ===== -->
  <text x="280" y="182" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">关键：DIAB1 必须在「代码边界」处</text>

  <!-- Boundary: start of string -->
  <rect x="40" y="196" width="230" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">边界 ①：字符串开头</text>
  <text x="55" y="236" font-size="10" fill="#444">DIAB1 在 conditions 最前面</text>
  <text x="55" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">LIKE 'DIAB1%'</text>

  <!-- Boundary: after space -->
  <rect x="290" y="196" width="230" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">边界 ②：空格之后</text>
  <text x="305" y="236" font-size="10" fill="#444">DIAB1 前面是空格分隔符</text>
  <text x="305" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">LIKE '% DIAB1%'</text>

  <!-- ===== Wrong approach ===== -->
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">常见错误：LIKE '%DIAB1%'</text>

  <rect x="40" y="296" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="316" font-size="11" fill="#333">SADIAB100</text>
  <text x="510" y="316" text-anchor="end" font-size="10" fill="#b85450">✗ 子串匹配，误判为 I 型糖尿病</text>

  <rect x="40" y="332" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="352" font-size="11" fill="#333">XYDIAB1XYZ</text>
  <text x="510" y="352" text-anchor="end" font-size="10" fill="#b85450">✗ DIAB1 夹在中间，非代码前缀</text>
</svg>
