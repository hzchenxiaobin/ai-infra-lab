<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">隔板法：n 颗糖 + 2 块隔板 → 3 段</text>

  <!-- candy row: n = 5 -->
  <text x="32" y="82" font-size="12" fill="#888">n = 5：</text>
  <circle cx="95" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="127" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="150" y="56" width="10" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <circle cx="180" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="205" y="56" width="10" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <circle cx="235" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="267" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="111" y="116" text-anchor="middle" font-size="11" fill="#446688">x₁ = 2</text>
  <text x="180" y="116" text-anchor="middle" font-size="11" fill="#446688">x₂ = 1</text>
  <text x="251" y="116" text-anchor="middle" font-size="11" fill="#446688">x₃ = 2</text>

  <rect x="315" y="52" width="170" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="72" text-anchor="middle" font-size="11" fill="#555">对应一个分配方案</text>
  <text x="400" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(2, 1, 2)</text>

  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#999">隔板可以相邻、可以贴在两端 → 允许有人分到 0 颗</text>

  <!-- stars and bars formula -->
  <rect x="30" y="158" width="460" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">隔板法（stars and bars）</text>
  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#333">n 颗糖 + 2 块隔板共 n+2 个位置，从中选 2 个放隔板</text>
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#333">f(m) = C(m+2, 2) = (m+1)(m+2)/2（约定 m &lt; 0 时 f = 0）</text>

  <!-- exceed-limit substitution -->
  <text x="32" y="266" font-size="12" fill="#b85450" font-weight="bold">有人超限怎么办？先「预发」再替换：</text>
  <rect x="30" y="280" width="132" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="301" text-anchor="middle" font-size="12" fill="#333">x₁ ≥ L</text>
  <text x="96" y="319" text-anchor="middle" font-size="10" fill="#b85450">超过 limit 颗</text>
  <path d="M 166 306 L 188 306" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="192" y="280" width="152" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="268" y="301" text-anchor="middle" font-size="12" fill="#333">预发 L = limit+1 颗</text>
  <text x="268" y="319" text-anchor="middle" font-size="10" fill="#d6a040">x₁′ = x₁ − L ≥ 0</text>
  <path d="M 348 306 L 370 306" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="374" y="280" width="116" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="432" y="301" text-anchor="middle" font-size="12" fill="#333">剩 n−L 颗</text>
  <text x="432" y="319" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">自由分 = f(n−L)</text>

  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#888">预扣替换把「有人超限」化归为更小的无上限问题</text>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#888">—— 这是容斥原理的积木（见下一张图）</text>
</svg>
