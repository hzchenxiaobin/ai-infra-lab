<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：定位每个玩家首登行，取 device_id</text>

  <!-- Full Activity table -->
  <text x="200" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Activity（5 行）</text>
  <rect x="40" y="58" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="75" font-size="9.5" fill="#333">player_id</text>
  <text x="130" y="75" font-size="9.5" fill="#b85450" font-weight="bold">device_id</text>
  <text x="210" y="75" font-size="9.5" fill="#333">event_date</text>
  <text x="305" y="75" font-size="9.5" fill="#333">games_played</text>
  <line x1="100" y1="58" x2="100" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="58" x2="170" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="58" x2="270" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1 player 1 (first login, highlight) -->
  <rect x="40" y="84" width="320" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="62" y="99" font-size="10" fill="#333">1</text>
  <text x="130" y="99" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="210" y="99" font-size="10" fill="#b85450" font-weight="bold">2016-03-01</text>
  <text x="305" y="99" font-size="10" fill="#333">5</text>
  <line x1="100" y1="84" x2="100" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="84" x2="170" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="84" x2="270" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 2 player 1 (not first login) -->
  <rect x="40" y="106" width="320" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="121" font-size="10" fill="#333">1</text>
  <text x="130" y="121" font-size="10" fill="#999">2</text>
  <text x="210" y="121" font-size="10" fill="#999">2016-05-02</text>
  <text x="305" y="121" font-size="10" fill="#333">6</text>
  <line x1="100" y1="106" x2="100" y2="128" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="106" x2="170" y2="128" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="106" x2="270" y2="128" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 3 player 2 (first login, highlight) -->
  <rect x="40" y="128" width="320" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="62" y="143" font-size="10" fill="#333">2</text>
  <text x="130" y="143" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="210" y="143" font-size="10" fill="#4a7a3a" font-weight="bold">2017-06-25</text>
  <text x="305" y="143" font-size="10" fill="#333">1</text>
  <line x1="100" y1="128" x2="100" y2="150" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="128" x2="170" y2="150" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="128" x2="270" y2="150" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 4 player 3 (first login, highlight) -->
  <rect x="40" y="150" width="320" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="62" y="165" font-size="10" fill="#333">3</text>
  <text x="130" y="165" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="210" y="165" font-size="10" fill="#d6a040" font-weight="bold">2016-03-02</text>
  <text x="305" y="165" font-size="10" fill="#333">0</text>
  <line x1="100" y1="150" x2="100" y2="172" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="150" x2="170" y2="172" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="150" x2="270" y2="172" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 5 player 3 (not first login) -->
  <rect x="40" y="172" width="320" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="187" font-size="10" fill="#333">3</text>
  <text x="130" y="187" font-size="10" fill="#999">4</text>
  <text x="210" y="187" font-size="10" fill="#999">2018-07-03</text>
  <text x="305" y="187" font-size="10" fill="#333">5</text>
  <line x1="100" y1="172" x2="100" y2="194" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="172" x2="170" y2="194" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="172" x2="270" y2="194" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- min date labels on left -->
  <text x="32" y="100" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold">MIN</text>
  <text x="32" y="144" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold">MIN</text>
  <text x="32" y="166" text-anchor="end" font-size="9" fill="#d6a040" font-weight="bold">MIN</text>

  <!-- arrows from highlighted rows to result -->
  <path d="M360 95 L400 95 L400 238 L420 238" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M360 139 L400 139 L400 264 L420 264" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M360 161 L400 161 L400 290 L420 290" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Result table -->
  <text x="490" y="216" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">输出</text>
  <rect x="420" y="220" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="238" font-size="9.5" fill="#333">player_id</text>
  <text x="510" y="238" font-size="9.5" fill="#b85450" font-weight="bold">device_id</text>
  <line x1="485" y1="220" x2="485" y2="246" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="420" y="246" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="442" y="261" font-size="10" fill="#333">1</text>
  <text x="510" y="261" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <line x1="485" y1="246" x2="485" y2="268" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="420" y="268" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="442" y="283" font-size="10" fill="#333">2</text>
  <text x="510" y="283" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="485" y1="268" x2="485" y2="290" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="420" y="290" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="442" y="305" font-size="10" fill="#333">3</text>
  <text x="510" y="305" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <line x1="485" y1="290" x2="485" y2="312" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- legend / note -->
  <rect x="40" y="332" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="354" font-size="10.5" fill="#333">每组中加粗行 = MIN(event_date) 对应的首登行，device_id 即从该行取出</text>
  <text x="60" y="374" font-size="10.5" fill="#b85450" font-weight="bold">玩家 1 首登用 device_id=2，玩家 2 用 3，玩家 3 用 1</text>
  <text x="60" y="392" font-size="10.5" fill="#555">关键：device_id 是首登「那一行」的属性，必须定位到行，不能靠聚合直接得到</text>
</svg>
