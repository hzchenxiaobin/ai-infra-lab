<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：candies=7, n=4 → [1, 2, 3, 1]</text>

  <!-- Column headers -->
  <text x="40" y="52" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="135" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">P0</text>
  <text x="185" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">P1</text>
  <text x="235" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">P2</text>
  <text x="285" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">P3</text>
  <text x="365" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">give</text>
  <text x="445" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">剩余</text>
  <text x="510" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">操作</text>

  <!-- Separator -->
  <line x1="30" y1="58" x2="540" y2="58" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Initial ===== -->
  <text x="40" y="82" font-size="11" fill="#888" font-weight="bold">初始</text>
  <rect x="113" y="68" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="87" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="163" y="68" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="87" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="213" y="68" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="87" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="263" y="68" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="87" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="365" y="87" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="445" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <text x="510" y="87" text-anchor="middle" font-size="10" fill="#666">开始分发</text>
  <path d="M 280 98 L 280 106" stroke="#888" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Turn 0: i=0, give=1 ===== -->
  <text x="40" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">第 1 次</text>
  <rect x="113" y="114" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="133" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="163" y="114" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="133" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="213" y="114" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="133" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="263" y="114" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="133" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="365" y="133" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="445" y="133" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="510" y="133" text-anchor="middle" font-size="10" fill="#4a7a3a">7≥1，给 P0</text>
  <path d="M 280 144 L 280 152" stroke="#888" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Turn 1: i=1, give=2 ===== -->
  <text x="40" y="174" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 次</text>
  <rect x="113" y="160" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="179" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="163" y="160" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="213" y="160" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="179" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="263" y="160" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="179" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="365" y="179" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="445" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="510" y="179" text-anchor="middle" font-size="10" fill="#4a7a3a">6≥2，给 P1</text>
  <path d="M 280 190 L 280 198" stroke="#888" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Turn 2: i=2, give=3 ===== -->
  <text x="40" y="220" font-size="11" fill="#4a7a3a" font-weight="bold">第 3 次</text>
  <rect x="113" y="206" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="225" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="163" y="206" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="225" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="213" y="206" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="263" y="206" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="225" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="365" y="225" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="445" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="510" y="225" text-anchor="middle" font-size="10" fill="#4a7a3a">4≥3，给 P2</text>
  <path d="M 280 236 L 280 244" stroke="#888" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Turn 3: i=3, give=4, REMAINDER ===== -->
  <text x="40" y="266" font-size="11" fill="#b85450" font-weight="bold">第 4 次</text>
  <rect x="113" y="252" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="271" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="163" y="252" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="271" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="213" y="252" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="271" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="263" y="252" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="271" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="365" y="271" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="445" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="510" y="268" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1&lt;4</text>
  <text x="510" y="278" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">余1给P3</text>

  <!-- ===== Final result ===== -->
  <rect x="40" y="300" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="321" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结果：[1, 2, 3, 1] ✓ （7 颗糖全部分完）</text>

  <!-- ===== Formula summary ===== -->
  <rect x="40" y="346" width="480" height="80" fill="#f5f5f5" stroke="#bbb" stroke-width="0.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">验证：累计发糖 1 + 2 + 3 = 6 ≤ 7，第 4 次需 4 但仅剩 1</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#666">前 3 次完整发放 = 3×4/2 = 6，余数 = 7 − 6 = 1 → 给 P3</text>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#888">绿色 = 本步刚更新的格子；红色 = 余数不足时分配；橙色 = 当前 give 值</text>
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#888">i % n 决定分给谁：i=0→P0, i=1→P1, i=2→P2, i=3→P3</text>
</svg>
