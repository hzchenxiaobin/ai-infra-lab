<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按 endDay 排序 → 兼容前驱是一段前缀 → 二分定位</text>

  <!-- Section label -->
  <text x="40" y="58" font-size="11.5" fill="#888" filter="url(#rough2)">排序后（按 endDay 升序，示例 1）：</text>

  <!-- Day axis ticks (vertical guides) -->
  <g stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)">
    <line x1="80" y1="68" x2="80" y2="150"/>
    <line x1="160" y1="68" x2="160" y2="150"/>
    <line x1="240" y1="68" x2="240" y2="150"/>
    <line x1="320" y1="68" x2="320" y2="150"/>
    <line x1="400" y1="68" x2="400" y2="150"/>
  </g>

  <!-- Interval row 1: i=1 [1,2] v=4  (blue) -->
  <rect x="80" y="70" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=1  [1,2]  v=4</text>

  <!-- Interval row 2: i=2 [2,3] v=1 (neutral) -->
  <rect x="160" y="98" width="160" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=2  [2,3]  v=1</text>

  <!-- Interval row 3: i=3 [3,4] v=3 (orange = current) -->
  <rect x="240" y="126" width="160" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=3  [3,4]  v=3  ← 当前</text>

  <!-- Day axis -->
  <line x1="80" y1="156" x2="400" y2="156" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="170">↑day1</text>
    <text x="160" y="170">day2</text>
    <text x="240" y="170">day3</text>
    <text x="320" y="170">day4</text>
    <text x="400" y="170">↑</text>
  </g>

  <!-- Divider -->
  <path d="M 40 188 L 520 188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ends array -->
  <text x="40" y="210" font-size="11.5" fill="#888" filter="url(#rough2)">ends =</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <!-- cell 0: value 2 (blue = compatible prefix) -->
    <rect x="110" y="198" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="134" y="217" filter="url(#rough2)">2</text>
    <!-- cell 1: value 3 (red border = first >= startDay=3) -->
    <rect x="158" y="198" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="182" y="217" filter="url(#rough2)">3</text>
    <!-- cell 2: value 4 (neutral) -->
    <rect x="206" y="198" width="48" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="230" y="217" filter="url(#rough2)">4</text>
  </g>

  <!-- current startDay -->
  <text x="290" y="217" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">当前 startDay = 3</text>

  <!-- bisect_left marker arrow: points at the cell with 3 (index 1) -->
  <path d="M 182 240 L 182 230" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="254" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">bisect_left(ends, 3) = 1</text>

  <!-- p callout -->
  <rect x="110" y="266" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="285" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p = 1  →  兼容前驱 = 前 1 个（endDay &lt; 3）</text>

  <!-- DP transition box -->
  <rect x="60" y="312" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[3][j] = max(dp[2][j],  dp[1][j−1] + 3)</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不选 i=3    选 i=3（前驱取 dp[p][j−1]）</text>

  <!-- footer -->
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">排序保证「endDay &lt; startDay_i」的会议全在前缀 → 二分 O(log n)</text>
</svg>
