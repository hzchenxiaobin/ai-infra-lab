<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">救生艇算法流程（排序 + 双指针贪心）</text>

  <!-- Start -->
  <ellipse cx="270" cy="60" rx="116" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333">开始: 排序, left=0, right=n−1, boats=0</text>

  <path d="M 270 80 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: left <= right? -->
  <polygon points="270,102 372,150 270,198 168,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">left &lt;= right ?</text>
  <text x="270" y="164" text-anchor="middle" font-size="11" fill="#666">(还有人没上船)</text>

  <!-- No -> return boats -->
  <path d="M 372 150 L 446 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="488" cy="150" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="154" text-anchor="middle" font-size="12" fill="#333">返回 boats</text>

  <!-- Yes down -->
  <path d="M 270 198 L 270 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="212" font-size="11" fill="#82b366">是</text>

  <!-- Decision 2: sum <= limit? -->
  <polygon points="270,222 392,278 270,334 148,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="12" fill="#333">people[left]+people[right]</text>
  <text x="270" y="288" text-anchor="middle" font-size="12" fill="#333">&lt;= limit ?</text>

  <!-- Yes (pair) -> left box -->
  <path d="M 148 278 L 94 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="270" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="14" y="256" width="80" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="275" text-anchor="middle" font-size="10" fill="#333">两人同船</text>
  <text x="54" y="291" text-anchor="middle" font-size="10" fill="#555">left++ right−−</text>

  <!-- No (heavy alone) -> right box -->
  <path d="M 392 278 L 448 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="270" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="450" y="256" width="80" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="275" text-anchor="middle" font-size="10" fill="#333">重者独船</text>
  <text x="490" y="291" text-anchor="middle" font-size="10" fill="#555">right−−</text>

  <!-- merge arrows to boats++ node -->
  <path d="M 54 302 L 54 340 L 240 340" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 490 302 L 490 340 L 300 340" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="216" y="328" width="108" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">boats++</text>

  <!-- loop back: down, left, up to decision1 -->
  <path d="M 270 358 L 270 374 L 8 374 L 8 150 L 168 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="368" font-size="10" fill="#888">← 继续下一轮</text>

  <!-- summary -->
  <text x="270" y="418" text-anchor="middle" font-size="11" fill="#888">每轮 O(1) 决策派一船，共至多 n 轮；排序 O(n log n) 主导</text>
</svg>
