<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：逐元素流式处理</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">线段树存「值 → 以该值结尾的 LIS 长度」，遍历 nums 时在线查询/更新</text>

  <!-- loop start -->
  <rect x="200" y="62" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">for x in nums（按原顺序）</text>

  <!-- arrow down -->
  <path d="M 270 96 L 270 112" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1: query -->
  <rect x="60" y="114" width="420" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="78" y="133" font-size="11.5" fill="#4a7a3a" font-weight="bold">① 区间查询</text>
  <text x="78" y="150" font-size="10.5" fill="#4a7a3a">best = query([max(1, x−k), x−1]) —— 在线段树上取该区间内 dp 的最大值</text>

  <path d="M 270 156 L 270 172" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: compute -->
  <rect x="60" y="174" width="420" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="78" y="193" font-size="11.5" fill="#d6a040" font-weight="bold">② 接在最长前驱后</text>
  <text x="78" y="210" font-size="10.5" fill="#d6a040">cur = best + 1 —— 以 x 结尾的最长 LIS = 区间最长前驱 + 自身</text>

  <path d="M 270 216 L 270 232" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: update -->
  <rect x="60" y="234" width="420" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="78" y="253" font-size="11.5" fill="#446688" font-weight="bold">③ 单点更新</text>
  <text x="78" y="270" font-size="10.5" fill="#446688">update(x, max(dp[x], cur)) —— 同值可能多次出现，取较大者覆盖叶子并向上 push</text>

  <path d="M 270 276 L 270 292" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: ans -->
  <rect x="60" y="294" width="420" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="78" y="313" font-size="11.5" fill="#b85450" font-weight="bold">④ 更新全局答案</text>
  <text x="78" y="330" font-size="10.5" fill="#b85450">ans = max(ans, cur) —— 也可直接读线段树根节点 max(dp[1..V])</text>

  <!-- loop back arrow -->
  <path d="M 490 315 Q 530 315 530 80 Q 530 60 340 60" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="512" y="195" font-size="9.5" fill="#888" transform="rotate(90 512 195)">下一元素</text>

  <!-- note -->
  <rect x="40" y="352" width="460" height="54" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="372" font-size="10.5" fill="#555" font-weight="bold">关键不变式：</text>
  <text x="60" y="390" font-size="10" fill="#555">处理到 nums[i]=x 时，线段树中 dp[v] 已反映「nums[0..i−1] 中以 v 结尾的最长 LIS」。</text>
  <text x="60" y="402" font-size="10" fill="#555">故查询 [x−k, x−1] 即「前 i 个元素里值差 ≤ k 的最长前驱」，天然保证下标顺序。</text>
</svg>
