<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">在折弯点拼接「递增 + 递减」两段</text>

  <!-- Highlighted path: 1 -> 2 -> 3 (bends at 2) -->
  <path d="M 150 200 L 260 110 L 370 200" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- Node 2 (root / bend point) -->
  <circle cx="260" cy="90" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="95" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- Node 1 (left, = 2-1, decreasing branch) -->
  <circle cx="150" cy="200" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- Node 3 (right, = 2+1, increasing branch) -->
  <circle cx="370" cy="200" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="370" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- Bend point annotation -->
  <text x="300" y="70" font-size="11" fill="#b85450" font-weight="bold">折弯点</text>
  <path d="M 296 74 L 282 78" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Left edge label: decreasing (1 = 2 - 1) -->
  <text x="158" y="158" font-size="11" fill="#4a7a3a" font-weight="bold">递减段</text>
  <text x="158" y="172" font-size="10" fill="#4a7a3a">1 = 2−1 → dec=2</text>

  <!-- Right edge label: increasing (3 = 2 + 1) -->
  <text x="318" y="158" font-size="11" fill="#446688" font-weight="bold">递增段</text>
  <text x="318" y="172" font-size="10" fill="#446688">3 = 2+1 → inc=2</text>

  <!-- Path sequence label -->
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">序列 1 → 2 → 3（或 3 → 2 → 1），长度 3</text>

  <!-- Formula box -->
  <rect x="40" y="278" width="440" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">折弯点路径长度 = inc + dec − 1</text>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#555">本例：2 + 2 − 1 = 3 ✓（node 2 被两段各算一次，减 1）</text>
</svg>
