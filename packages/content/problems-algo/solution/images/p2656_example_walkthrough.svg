<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums=[1,2,3,4,5], k=3</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30"  y="52" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="90"  y="52" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="52" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="250" y="52" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="60"  y="73" text-anchor="middle" font-size="12" fill="#333">轮次</text>
    <text x="125" y="73" text-anchor="middle" font-size="12" fill="#333">选 m</text>
    <text x="205" y="73" text-anchor="middle" font-size="12" fill="#333">累计得分</text>
    <text x="370" y="73" text-anchor="middle" font-size="12" fill="#333">操作后 nums</text>
  </g>

  <!-- 行1 -->
  <g filter="url(#rough2)">
    <rect x="30"  y="92" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="90"  y="92" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="160" y="92" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="250" y="92" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="60"  y="115" text-anchor="middle" font-size="13" fill="#333">1</text>
    <text x="125" y="115" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
    <text x="205" y="115" text-anchor="middle" font-size="13" fill="#333">5</text>
    <text x="370" y="115" text-anchor="middle" font-size="12" fill="#333">[1,2,3,4,6]</text>
  </g>

  <!-- 行2 -->
  <g filter="url(#rough2)">
    <rect x="30"  y="132" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="90"  y="132" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="160" y="132" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="250" y="132" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="60"  y="155" text-anchor="middle" font-size="13" fill="#333">2</text>
    <text x="125" y="155" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
    <text x="205" y="155" text-anchor="middle" font-size="13" fill="#333">5+6=11</text>
    <text x="370" y="155" text-anchor="middle" font-size="12" fill="#333">[1,2,3,4,7]</text>
  </g>

  <!-- 行3 -->
  <g filter="url(#rough2)">
    <rect x="30"  y="172" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="90"  y="172" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="160" y="172" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="250" y="172" width="240" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="60"  y="195" text-anchor="middle" font-size="13" fill="#7a3030" font-weight="bold">3</text>
    <text x="125" y="195" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
    <text x="205" y="195" text-anchor="middle" font-size="13" fill="#7a3030" font-weight="bold">18</text>
    <text x="370" y="195" text-anchor="middle" font-size="12" fill="#333">[1,2,3,4,8]</text>
  </g>

  <!-- 公式验算框 -->
  <rect x="50" y="232" width="420" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="13" fill="#3a5a2a" filter="url(#rough2)">公式验算：ans = k·M + k(k−1)/2 = 3·5 + 3·2/2 = 15+3 = 18 ✓</text>

  <!-- 关键提示 -->
  <rect x="50" y="292" width="420" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">被改写的总是「当前最大」所在槽位，其余元素原封不动</text>
  <text x="260" y="333" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">所以只需 M = max(nums)，其它元素全程陪跑</text>
</svg>
