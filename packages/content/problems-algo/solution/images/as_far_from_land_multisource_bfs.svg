<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">地图分析：多源 BFS — 陆地同时向外扩散</text>
  <path d="M 250 40 Q 440 48 630 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Top: Grid with distance layers ===== -->
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#888">所有陆地(1)同时入队 → 逐层向外扩散 → 最后到达的海洋格距离最大</text>

  <!-- 5x5 grid: land at corners + center -->
  <g font-size="13">
    <g filter="url(#sk)">
      <!-- Row 0 -->
      <rect x="120" y="80" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="142" y="108" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
      <rect x="164" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688"/><text x="186" y="108" text-anchor="middle" fill="#446688">1</text>
      <rect x="208" y="80" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="230" y="108" text-anchor="middle" fill="#446688">2</text>
      <rect x="252" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688"/><text x="274" y="108" text-anchor="middle" fill="#446688">1</text>
      <rect x="296" y="80" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="318" y="108" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
      <!-- Row 1 -->
      <rect x="120" y="124" width="44" height="44" fill="#e8f0fe" stroke="#446688"/><text x="142" y="152" text-anchor="middle" fill="#446688">1</text>
      <rect x="164" y="124" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="186" y="152" text-anchor="middle" fill="#446688">2</text>
      <rect x="208" y="124" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="230" y="152" text-anchor="middle" fill="#446688">3</text>
      <rect x="252" y="124" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="274" y="152" text-anchor="middle" fill="#446688">2</text>
      <rect x="296" y="124" width="44" height="44" fill="#e8f0fe" stroke="#446688"/><text x="318" y="152" text-anchor="middle" fill="#446688">1</text>
      <!-- Row 2 -->
      <rect x="120" y="168" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="142" y="196" text-anchor="middle" fill="#446688">2</text>
      <rect x="164" y="168" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="186" y="196" text-anchor="middle" fill="#446688">3</text>
      <rect x="208" y="168" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="230" y="196" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
      <rect x="252" y="168" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="274" y="196" text-anchor="middle" fill="#446688">3</text>
      <rect x="296" y="168" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="318" y="196" text-anchor="middle" fill="#446688">2</text>
      <!-- Row 3 -->
      <rect x="120" y="212" width="44" height="44" fill="#e8f0fe" stroke="#446688"/><text x="142" y="240" text-anchor="middle" fill="#446688">1</text>
      <rect x="164" y="212" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="186" y="240" text-anchor="middle" fill="#446688">2</text>
      <rect x="208" y="212" width="44" height="44" fill="#c0d8f0" stroke="#446688"/><text x="230" y="240" text-anchor="middle" fill="#446688">3</text>
      <rect x="252" y="212" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="274" y="240" text-anchor="middle" fill="#446688">2</text>
      <rect x="296" y="212" width="44" height="44" fill="#e8f0fe" stroke="#446688"/><text x="318" y="240" text-anchor="middle" fill="#446688">1</text>
      <!-- Row 4 -->
      <rect x="120" y="256" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="142" y="284" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
      <rect x="164" y="256" width="44" height="44" fill="#e8f0fe" stroke="#446688"/><text x="186" y="284" text-anchor="middle" fill="#446688">1</text>
      <rect x="208" y="256" width="44" height="44" fill="#d4e8fa" stroke="#446688"/><text x="230" y="284" text-anchor="middle" fill="#446688">2</text>
      <rect x="252" y="256" width="44" height="44" fill="#e8f0fe" stroke="#446688"/><text x="274" y="284" text-anchor="middle" fill="#446688">1</text>
      <rect x="296" y="256" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/><text x="318" y="284" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    </g>
  </g>

  <!-- Legend -->
  <g filter="url(#sk)">
    <rect x="120" y="316" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="144" y="329" font-size="10" fill="#444">1 = 陆地(源)</text>
    <rect x="230" y="316" width="16" height="16" fill="#e8f0fe" stroke="#446688"/>
    <text x="254" y="329" font-size="10" fill="#444">d=1</text>
    <rect x="300" y="316" width="16" height="16" fill="#d4e8fa" stroke="#446688"/>
    <text x="324" y="329" font-size="10" fill="#444">d=2</text>
    <rect x="370" y="316" width="16" height="16" fill="#c0d8f0" stroke="#446688"/>
    <text x="394" y="329" font-size="10" fill="#444">d=3</text>
  </g>

  <!-- arrow -->
  <path d="M 440 170 L 510 170" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="475" y="160" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">等价于</text>

  <!-- ===== Right: Super source concept ===== -->
  <g filter="url(#sk)">
    <rect x="520" y="80" width="340" height="260" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="690" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">超级源点（Super Source）等价模型</text>

  <!-- Super source node -->
  <g filter="url(#sk)">
    <ellipse cx="690" cy="138" rx="42" ry="22" fill="#fff3cd" stroke="#d6a040" stroke-width="2"/>
    <text x="690" y="143" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">S（超级源）</text>
  </g>

  <!-- Lines to land cells -->
  <g filter="url(#sk)">
    <path d="M 660 156 L 580 200" stroke="#4a8edb" stroke-width="1.2" fill="none"/>
    <path d="M 670 160 L 640 200" stroke="#4a8edb" stroke-width="1.2" fill="none"/>
    <path d="M 710 160 L 740 200" stroke="#4a8edb" stroke-width="1.2" fill="none"/>
    <path d="M 720 156 L 800 200" stroke="#4a8edb" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Land cells -->
  <g filter="url(#sk)">
    <rect x="560" y="196" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="580" y="214" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">陆地A</text>
    <rect x="620" y="196" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="640" y="214" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">陆地B</text>
    <rect x="720" y="196" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="740" y="214" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">陆地C</text>
    <rect x="780" y="196" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="800" y="214" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">陆地D</text>
  </g>

  <!-- BFS layers -->
  <g filter="url(#sk)">
    <ellipse cx="690" cy="270" rx="130" ry="36" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
    <ellipse cx="690" cy="270" rx="85" ry="24" fill="none" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/>
    <ellipse cx="690" cy="270" rx="40" ry="14" fill="none" stroke="#4a8e4a" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <g font-size="10" fill="#444">
    <text x="830" y="248" fill="#4a8e4a" font-weight="bold">第0层</text>
    <text x="830" y="262" fill="#c98a2b" font-weight="bold">第1层</text>
    <text x="830" y="276" fill="#b85450" font-weight="bold">第2层</text>
    <text x="830" y="290" fill="#888">第N层…</text>
  </g>

  <text x="690" y="312" text-anchor="middle" font-size="10" fill="#7a5415">虚拟源 S → 连所有陆地（边权=0）<tspan x="690" dy="14">→ 单源 BFS = 多源 BFS</tspan></text>

  <!-- ===== Bottom: Key insight ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="370" width="800" height="170" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="460" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">核心洞察</text>
  <g font-size="11" fill="#444">
    <text x="84" y="422"><tspan font-weight="bold" fill="#b85450">问题本质</tspan>：求每个海洋格到最近陆地的曼哈顿距离，取最大值</text>
    <text x="84" y="444"><tspan font-weight="bold" fill="#4a8edb">多源 BFS</tspan>：所有陆地同时入队（dist=0），逐层向外扩散</text>
    <text x="84" y="466"><tspan font-weight="bold" fill="#2e6e2e">BFS 性质</tspan>：每个海洋格第一次被访问时，dist 就是到最近陆地的距离</text>
    <text x="84" y="488"><tspan font-weight="bold" fill="#d6a040">答案</tspan>：最后一个被访问的海洋格的 dist = 最大距离</text>
    <text x="84" y="516"><tspan font-weight="bold" fill="#b03a3a">对比暴力</tspan>：暴力对每个海洋格 BFS → O(n⁴)；多源 BFS 一次扫描 → O(n²)</text>
  </g>
</svg>
