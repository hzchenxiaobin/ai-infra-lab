<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：示例1（前两相等→扫描）与示例2（前两不等→diff[2] 裁决）</text>

  <!-- ===== Panel 1: example 1 ===== -->
  <text x="280" y="48" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">示例 1：words = ["adc","wzy","abc"]（走「相等」分支）</text>

  <rect x="60" y="56" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="11.5" fill="#333">diff[0] = [3,−1]（adc），diff[1] = [3,−1]（wzy）</text>

  <path d="M 280 86 L 280 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="97" font-size="10" fill="#4a7a3a" font-weight="bold">前两相等 → 多数已定</text>

  <rect x="60" y="100" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11.5" fill="#333">majority = [3,−1]；扫描 i=2：diff[2] = [1,1] ≠ majority</text>

  <path d="M 280 130 L 280 144" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="141" font-size="10" fill="#b85450" font-weight="bold">扫描命中异类</text>

  <rect x="150" y="144" width="260" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 words[2] = "abc" ✓</text>

  <!-- ===== Panel 2: example 2 ===== -->
  <text x="280" y="200" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">示例 2：words = ["aaa","bob","ccc","ddd"]（走「不等」分支）</text>

  <rect x="60" y="208" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11.5" fill="#333">diff[0] = [0,0]（aaa），diff[1] = [13,−13]（bob）</text>

  <path d="M 280 238 L 280 252" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="249" font-size="10" fill="#b85450" font-weight="bold">前两不等 → 其一为异类</text>

  <rect x="60" y="252" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11.5" fill="#333">算 diff[2] = [0,0]（ccc）；diff[0] == diff[2] → 裁决</text>

  <path d="M 280 282 L 280 296" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="293" font-size="10" fill="#4a7a3a" font-weight="bold">异类 = words[1]</text>

  <rect x="150" y="296" width="260" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 words[1] = "bob" ✓</text>

  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#888">两示例各覆盖一条分支，验证算法完整性</text>
</svg>
