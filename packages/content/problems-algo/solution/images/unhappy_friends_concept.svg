<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：配对 (x,y) 与 (u,v)，x 与 u 互相更亲近 → x 不开心</text>

  <!-- Pair (x, y) -->
  <text x="60" y="62" font-size="11" fill="#888">配对一</text>
  <ellipse cx="90" cy="78" rx="22" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="90" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">x</text>
  <line x1="112" y1="78" x2="168" y2="78" stroke="#888" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <ellipse cx="190" cy="78" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">y</text>

  <!-- Pair (u, v) -->
  <text x="330" y="62" font-size="11" fill="#888">配对二</text>
  <ellipse cx="360" cy="78" rx="22" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="360" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">u</text>
  <line x1="382" y1="78" x2="438" y2="78" stroke="#888" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <ellipse cx="460" cy="78" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">v</text>

  <!-- Mutual preference dashed arrow x <-> u -->
  <path d="M 112 70 Q 235 38 338 70" stroke="#b85450" stroke-width="2.2" fill="none"
        stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 338 90 Q 235 122 112 90" stroke="#b85450" stroke-width="2.2" fill="none"
        stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="235" y="34" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">x 与 u 互相更亲近</text>

  <!-- x's preference list -->
  <text x="28" y="160" font-size="11" fill="#666">x 的偏好</text>
  <rect x="80" y="146" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">u</text>
  <text x="124" y="166" font-size="11" fill="#888">…</text>
  <rect x="142" y="146" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="166" text-anchor="middle" font-size="12" fill="#333">y</text>
  <text x="190" y="166" font-size="11" fill="#888">…</text>
  <text x="232" y="166" font-size="10.5" fill="#4a7a3a" font-weight="bold">条件①：u 排在 y 前 → x 更喜欢 u</text>

  <!-- u's preference list -->
  <text x="28" y="212" font-size="11" fill="#666">u 的偏好</text>
  <rect x="80" y="198" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x</text>
  <text x="124" y="218" font-size="11" fill="#888">…</text>
  <rect x="142" y="198" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="218" text-anchor="middle" font-size="12" fill="#333">v</text>
  <text x="190" y="218" font-size="11" fill="#888">…</text>
  <text x="232" y="218" font-size="10.5" fill="#d6a040" font-weight="bold">条件②：x 排在 v 前 → u 更喜欢 x</text>

  <!-- Combine box -->
  <rect x="80" y="250" width="360" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">条件① ∧ 条件② 同时成立</text>
  <text x="260" y="284" text-anchor="middle" font-size="11.5" fill="#333">→ x 不开心（注意：只判定 x，u 是否开心需独立判定）</text>

  <!-- Footer note -->
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#888">预处理 rank[x][u] = u 在 x 偏好表中的位次（越小越喜欢），则「更喜欢」= rank 更小</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#aaa">match[x] = x 的配对者；对每个比 y 更靠前的 u，检查 rank[u][x] &lt; rank[u][match[u]]</text>
</svg>
