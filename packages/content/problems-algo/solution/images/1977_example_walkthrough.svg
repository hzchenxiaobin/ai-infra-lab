<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fdfcf7"/>

  <text x="330" y="32" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">示例演算：num = "327"</text>
  <path d="M 200 42 Q 330 50 460 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="330" y="58" text-anchor="middle" font-size="11" fill="#888">逐行填 dp[i][l]，s = i-l 为最后一个数起点</text>

  <!-- 字符串下标 -->
  <text x="70" y="86" font-size="11" fill="#888">下标：</text>
  <g filter="url(#sk)">
    <rect x="110" y="72" width="46" height="22" rx="3" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="133" y="88" text-anchor="middle" font-size="11" fill="#666">3</text>
  <g filter="url(#sk)">
    <rect x="158" y="72" width="46" height="22" rx="3" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="181" y="88" text-anchor="middle" font-size="11" fill="#666">2</text>
  <g filter="url(#sk)">
    <rect x="206" y="72" width="46" height="22" rx="3" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="229" y="88" text-anchor="middle" font-size="11" fill="#666">7</text>
  <text x="270" y="88" font-size="10" fill="#888">num[0]='3' num[1]='2' num[2]='7'</text>

  <!-- 表头 -->
  <text x="70" y="124" font-size="12" fill="#2b2b2b" font-weight="bold">i (前i个字符)</text>
  <text x="200" y="124" font-size="12" fill="#2b2b2b" font-weight="bold">l=1</text>
  <text x="270" y="124" font-size="12" fill="#2b2b2b" font-weight="bold">l=2</text>
  <text x="340" y="124" font-size="12" fill="#2b2b2b" font-weight="bold">l=3</text>
  <text x="430" y="124" font-size="12" fill="#2b2b2b" font-weight="bold">说明</text>
  <line x1="60" y1="130" x2="620" y2="130" stroke="#bbb" stroke-width="1" filter="url(#sk)"/>

  <!-- i=1 -->
  <text x="70" y="152" font-size="12" fill="#444">i=1 ("3")</text>
  <g filter="url(#sk)">
    <rect x="195" y="140" width="44" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="217" y="156" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">1</text>
  <text x="270" y="156" font-size="11" fill="#ccc">—</text>
  <text x="340" y="156" font-size="11" fill="#ccc">—</text>
  <text x="430" y="156" font-size="11" fill="#666">s=0,整段"3",基准=1</text>

  <!-- i=2 -->
  <text x="70" y="186" font-size="12" fill="#444">i=2 ("32")</text>
  <g filter="url(#sk)">
    <rect x="195" y="174" width="44" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="217" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)">
    <rect x="265" y="174" width="44" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="287" y="190" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">1</text>
  <text x="340" y="190" font-size="11" fill="#ccc">—</text>
  <text x="430" y="184" font-size="10" fill="#666">l=1:"3","2"→3&gt;2 ✗</text>
  <text x="430" y="198" font-size="10" fill="#666">l=2:整段"32" ✓ =1</text>

  <!-- i=3 -->
  <text x="70" y="222" font-size="12" fill="#444">i=3 ("327")</text>
  <g filter="url(#sk)">
    <rect x="195" y="210" width="44" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="217" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)">
    <rect x="265" y="210" width="44" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="287" y="226" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">1</text>
  <g filter="url(#sk)">
    <rect x="335" y="210" width="44" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="357" y="226" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">1</text>
  <text x="430" y="218" font-size="10" fill="#666">l=2:"3","27"→3≤27 ✓ =1</text>
  <text x="430" y="232" font-size="10" fill="#666">l=3:整段"327" ✓ =1</text>

  <line x1="60" y1="248" x2="620" y2="248" stroke="#bbb" stroke-width="1" filter="url(#sk)"/>

  <!-- 汇总 -->
  <g filter="url(#sk)">
    <rect x="60" y="262" width="560" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="284" font-size="12" fill="#4a8edb" font-weight="bold">前缀和汇总 ps[i][i] = Σ dp[i][l]</text>
  <text x="80" y="304" font-size="11" fill="#444">ps[1][1]=1　ps[2][2]=1　ps[3][3]=0+1+1=2</text>
  <text x="340" y="304" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = ps[n][n] = 2 ✓</text>

  <!-- 关键判定提示 -->
  <g filter="url(#sk)">
    <rect x="60" y="332" width="560" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,3"/>
  </g>
  <text x="80" y="354" font-size="12" fill="#d6a040" font-weight="bold">关键判定：等长时用 LCP 比大小</text>
  <text x="80" y="374" font-size="11" fill="#444">i=3,l=2,s=1：前一个数"3"(长1&lt;2)→自动更小，直接取 ps[1][1]=1</text>
  <text x="80" y="392" font-size="11" fill="#444">i=3,l=1,s=2：前一个数需长1,即"2"(num[1])≤"7"(num[2])→2≤7 ✓</text>
  <text x="80" y="410" font-size="11" fill="#b85450">但需 dp[2][1]=0（"3","2"已非法）→ 传染为 0，故 dp[3][1]=0</text>
</svg>
