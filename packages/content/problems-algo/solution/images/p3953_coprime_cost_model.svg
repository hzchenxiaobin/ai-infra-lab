<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">固定选中值 x：冲突者必改，代价只看 bad(x)</text>

  <!-- 路线 A -->
  <text x="60" y="54" font-size="12" fill="#b85450" filter="url(#rough2)">路线 A：x = 6 在数组中 → 保留它，其它冲突者改成 1</text>
  <g stroke-width="1.6" filter="url(#rough2)">
    <rect x="90" y="62" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="140" y="62" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="190" y="62" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="113" y="82" fill="#333">3</text>
    <text x="163" y="82" fill="#333">4</text>
    <text x="213" y="82" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <g font-size="10" text-anchor="middle" filter="url(#rough2)">
    <text x="113" y="104" fill="#b85450">改→1</text>
    <text x="163" y="104" fill="#b85450">改→1</text>
    <text x="213" y="104" fill="#4a7a3a">选中 ★</text>
  </g>
  <g filter="url(#rough2)">
    <text x="300" y="74" font-size="10.5" fill="#666">bad(6) = 3（含选中者自己）</text>
    <text x="300" y="90" font-size="12" fill="#333">cost = bad − 1 = 3 − 1 = 2</text>
    <text x="300" y="106" font-size="12" fill="#4a7a3a" font-weight="bold">score = 6 − 2 = 4</text>
  </g>

  <!-- 路线 B -->
  <text x="60" y="126" font-size="12" fill="#d6a040" filter="url(#rough2)">路线 B：x = 5 不在数组中 → 花费 1 把 6 改成 5</text>
  <g stroke-width="1.6" filter="url(#rough2)">
    <rect x="90" y="134" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="140" y="134" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="190" y="134" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="113" y="154" fill="#333">3</text>
    <text x="163" y="154" fill="#333">4</text>
    <text x="213" y="154" fill="#d6a040" font-weight="bold">6</text>
  </g>
  <g font-size="10" text-anchor="middle" filter="url(#rough2)">
    <text x="113" y="176" fill="#446688">不动</text>
    <text x="163" y="176" fill="#446688">不动</text>
    <text x="213" y="176" fill="#d6a040">改成 5</text>
  </g>
  <g filter="url(#rough2)">
    <text x="300" y="146" font-size="10.5" fill="#666">bad(5) = 0（无冲突元素）</text>
    <text x="300" y="162" font-size="12" fill="#333">cost = max(bad, 1) = 1</text>
    <text x="300" y="178" font-size="12" fill="#4a7a3a" font-weight="bold">score = 5 − 1 = 4</text>
  </g>

  <!-- 容斥维恩图 -->
  <text x="60" y="202" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">bad(x)：对 x 的素因子容斥（x = 6，nums = [3,4,6]）</text>

  <ellipse cx="180" cy="262" rx="75" ry="44" fill="#e8f0fe" fill-opacity="0.45"
           stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <ellipse cx="280" cy="262" rx="75" ry="44" fill="#e6f4ea" fill-opacity="0.45"
           stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="148" y="236" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2 的倍数</text>
  <text x="312" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 的倍数</text>

  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="270" fill="#333">4</text>
    <text x="230" y="270" fill="#b85450" font-weight="bold">6</text>
    <text x="310" y="270" fill="#333">3</text>
  </g>

  <text x="260" y="328" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">bad(6) = cnt[2] + cnt[3] − cnt[6] = 2 + 2 − 1 = 3</text>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">x ≤ 10⁵ 至多 6 个不同素因子（2·3·5·7·11·13 = 30030）→ 容斥子集 ≤ 63 个</text>
</svg>
