<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nodes = {4, 7, 0}</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">后序遍历顺序编号 ①-⑨，命中集合时早返回</text>

  <!-- ===== Tree ===== -->
  <!-- 3 = LCA -->
  <circle cx="290" cy="78" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="312" y="74" font-size="9" fill="#4a7a3a" font-weight="bold">⑨ LCA</text>

  <!-- 5 -->
  <circle cx="240" cy="128" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="262" y="124" font-size="9" fill="#888">⑤</text>
  <line x1="280" y1="90" x2="252" y2="114" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 1 -->
  <circle cx="340" cy="128" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="362" y="124" font-size="9" fill="#888">⑧</text>
  <line x1="300" y1="90" x2="328" y2="114" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 6 -->
  <circle cx="205" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="222" y="174" font-size="9" fill="#888">①</text>
  <line x1="230" y1="142" x2="212" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 2 = subset LCA -->
  <circle cx="270" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="287" y="174" font-size="9" fill="#d6a040">④ 子集LCA</text>
  <line x1="250" y1="142" x2="262" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 0 = target -->
  <circle cx="320" cy="178" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="337" y="174" font-size="9" fill="#b85450" font-weight="bold">⑥ 目标</text>
  <line x1="332" y1="142" x2="324" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 8 -->
  <circle cx="375" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="392" y="174" font-size="9" fill="#888">⑦</text>
  <line x1="350" y1="142" x2="365" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 7 = target -->
  <circle cx="245" cy="228" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="245" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="225" y="220" font-size="9" fill="#b85450" font-weight="bold">② 目标</text>
  <line x1="262" y1="190" x2="248" y2="216" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 4 = target -->
  <circle cx="295" cy="228" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="295" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="310" y="220" font-size="9" fill="#b85450" font-weight="bold">③ 目标</text>
  <line x1="278" y1="190" x2="290" y2="216" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Step table ===== -->
  <!-- header -->
  <rect x="30" y="262" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="278" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步</text>
  <text x="110" y="278" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">节点</text>
  <text x="200" y="278" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">在集合中?</text>
  <text x="295" y="278" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">left</text>
  <text x="375" y="278" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">right</text>
  <text x="465" y="278" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">返回</text>

  <!-- row 1: node 6 -->
  <rect x="30" y="286" width="520" height="20" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="300" text-anchor="middle" font-size="10" fill="#888">①</text>
  <text x="110" y="300" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="200" y="300" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="295" y="300" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="375" y="300" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="465" y="300" text-anchor="middle" font-size="10" fill="#888">null</text>

  <!-- row 2: node 7 = target -->
  <rect x="30" y="306" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="320" text-anchor="middle" font-size="10" fill="#b85450">②</text>
  <text x="110" y="320" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="200" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="295" y="320" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <text x="375" y="320" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <text x="465" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7 (早返回)</text>

  <!-- row 3: node 4 = target -->
  <rect x="30" y="326" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="340" text-anchor="middle" font-size="10" fill="#b85450">③</text>
  <text x="110" y="340" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="200" y="340" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="295" y="340" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <text x="375" y="340" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <text x="465" y="340" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4 (早返回)</text>

  <!-- row 4: node 2 = subset LCA -->
  <rect x="30" y="346" width="520" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="360" text-anchor="middle" font-size="10" fill="#d6a040">④</text>
  <text x="110" y="360" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="200" y="360" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="295" y="360" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="375" y="360" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="465" y="360" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2 (LCA)</text>

  <!-- row 5: node 5 -->
  <rect x="30" y="366" width="520" height="20" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="380" text-anchor="middle" font-size="10" fill="#888">⑤</text>
  <text x="110" y="380" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="200" y="380" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="295" y="380" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="375" y="380" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="465" y="380" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- row 6: node 0 = target -->
  <rect x="30" y="386" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="400" text-anchor="middle" font-size="10" fill="#b85450">⑥</text>
  <text x="110" y="400" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="200" y="400" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="295" y="400" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <text x="375" y="400" text-anchor="middle" font-size="10" fill="#ccc">—</text>
  <text x="465" y="400" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0 (早返回)</text>

  <!-- row 7: node 8 -->
  <rect x="30" y="406" width="520" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="420" text-anchor="middle" font-size="10" fill="#888">⑦</text>
  <text x="110" y="420" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="200" y="420" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="295" y="420" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="375" y="420" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="465" y="420" text-anchor="middle" font-size="10" fill="#888">null</text>

  <!-- row 8: node 1 -->
  <rect x="30" y="426" width="520" height="20" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="440" text-anchor="middle" font-size="10" fill="#888">⑧</text>
  <text x="110" y="440" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="200" y="440" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="295" y="440" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="375" y="440" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="465" y="440" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- row 9: node 3 = final LCA -->
  <rect x="30" y="446" width="520" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="460" text-anchor="middle" font-size="10" fill="#4a7a3a">⑨</text>
  <text x="110" y="460" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="200" y="460" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="295" y="460" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="375" y="460" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="465" y="460" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3 (LCA!)</text>

  <!-- summary -->
  <rect x="30" y="470" width="520" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="484" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 3 = LCA({4, 7, 0}) ✅（子集 LCA 在节点 2 汇聚，最终在节点 3 合并）</text>
</svg>
