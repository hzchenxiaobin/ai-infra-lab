<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：mat = [[1,0,1],[1,1,0],[1,1,0]] → 13</text>

  <!-- ===== Row 0: h = [1, 0, 1], count = 2 ===== -->
  <rect x="20" y="40" width="520" height="100" fill="#f8f8f8" stroke="#eee" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="35" y="62" text-anchor="start" font-size="12" fill="#446688" font-weight="bold">行 0</text>
  <text x="35" y="80" text-anchor="start" font-size="11" fill="#555">h = [1, 0, 1]</text>
  <text x="35" y="98" text-anchor="start" font-size="10" fill="#888">子数组 min 之和:</text>
  <text x="35" y="114" text-anchor="start" font-size="10" fill="#888">1+0+0+0+0+1 = 2</text>

  <line x1="160" y1="125" x2="370" y2="125" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="170" y="107" width="40" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="102" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="225" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <line x1="215" y1="123" x2="245" y2="123" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="280" y="107" width="40" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="102" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="190" y="140" text-anchor="middle" font-size="9" fill="#888">列0</text>
  <text x="235" y="140" text-anchor="middle" font-size="9" fill="#888">列1</text>
  <text x="300" y="140" text-anchor="middle" font-size="9" fill="#888">列2</text>

  <rect x="430" y="70" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="93" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">贡献 = 2</text>

  <!-- ===== Row 1: h = [2, 1, 0], count = 4 ===== -->
  <rect x="20" y="150" width="520" height="100" fill="#f8f8f8" stroke="#eee" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="35" y="172" text-anchor="start" font-size="12" fill="#446688" font-weight="bold">行 1</text>
  <text x="35" y="190" text-anchor="start" font-size="11" fill="#555">h = [2, 1, 0]</text>
  <text x="35" y="208" text-anchor="start" font-size="10" fill="#888">子数组 min 之和:</text>
  <text x="35" y="224" text-anchor="start" font-size="10" fill="#888">2+1+0+1+0+0 = 4</text>

  <line x1="160" y1="235" x2="370" y2="235" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="170" y="199" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="194" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="220" y="217" width="40" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="240" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="300" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <line x1="280" y1="233" x2="320" y2="233" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="190" y="250" text-anchor="middle" font-size="9" fill="#888">列0</text>
  <text x="240" y="250" text-anchor="middle" font-size="9" fill="#888">列1</text>
  <text x="300" y="250" text-anchor="middle" font-size="9" fill="#888">列2</text>

  <rect x="430" y="180" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="203" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">贡献 = 4</text>

  <!-- ===== Row 2: h = [3, 2, 0], count = 7 ===== -->
  <rect x="20" y="260" width="520" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="35" y="282" text-anchor="start" font-size="12" fill="#d6a040" font-weight="bold">行 2</text>
  <text x="35" y="300" text-anchor="start" font-size="11" fill="#555">h = [3, 2, 0]</text>
  <text x="35" y="318" text-anchor="start" font-size="10" fill="#888">子数组 min 之和:</text>
  <text x="35" y="334" text-anchor="start" font-size="10" fill="#888">3+2+0+2+0+0 = 7</text>

  <line x1="160" y1="345" x2="370" y2="345" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="170" y="291" width="40" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="190" y="286" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="220" y="309" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="240" y="304" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="300" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <line x1="280" y1="343" x2="320" y2="343" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="190" y="360" text-anchor="middle" font-size="9" fill="#888">列0</text>
  <text x="240" y="360" text-anchor="middle" font-size="9" fill="#888">列1</text>
  <text x="300" y="360" text-anchor="middle" font-size="9" fill="#888">列2</text>

  <rect x="430" y="290" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="313" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">贡献 = 7</text>

  <!-- ===== Total ===== -->
  <rect x="120" y="372" width="320" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="389" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">总计 = 2 + 4 + 7 = 13</text>
</svg>
