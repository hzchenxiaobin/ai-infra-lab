<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：排序后 [−7,−6,−2,−1,2,3,5]，target = −2</text>

  <!-- Sorted array mini display -->
  <rect x="180" y="40" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="202" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−7</text>
  <rect x="224" y="40" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="246" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−6</text>
  <rect x="268" y="40" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="312" y="40" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="334" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="356" y="40" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="400" y="40" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="422" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="444" y="40" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="466" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- Table header -->
  <rect x="50" y="76" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="94" y="76" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="113" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">left</text>
  <rect x="132" y="76" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="153" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">right</text>
  <rect x="174" y="76" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="212" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">sum</text>
  <rect x="250" y="76" width="78" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="289" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">sum&lt;target?</text>
  <rect x="328" y="76" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="408" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="488" y="76" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="514" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">count</text>

  <!-- Row 1: left=0, right=6, -7+5=-2, No, right-- -->
  <rect x="50" y="102" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="94" y="102" width="38" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="113" y="117" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="132" y="102" width="42" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="153" y="117" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="174" y="102" width="76" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="250" y="102" width="78" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="289" y="117" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="328" y="102" width="160" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="408" y="117" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">right−−</text>
  <rect x="488" y="102" width="52" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- Row 2: left=0, right=5, -7+3=-4, Yes, count+=5, left++ -->
  <rect x="50" y="124" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="94" y="124" width="38" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="113" y="139" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="132" y="124" width="42" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="153" y="139" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="174" y="124" width="76" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−4</text>
  <rect x="250" y="124" width="78" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="289" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <rect x="328" y="124" width="160" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="408" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">count += 5, left++</text>
  <rect x="488" y="124" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Row 3: left=1, right=5, -6+3=-3, Yes, count+=4, left++ -->
  <rect x="50" y="146" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="94" y="146" width="38" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="113" y="161" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="132" y="146" width="42" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="153" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="174" y="146" width="76" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="250" y="146" width="78" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="289" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <rect x="328" y="146" width="160" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="408" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">count += 4, left++</text>
  <rect x="488" y="146" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- Row 4: left=2, right=5, -2+3=1, No, right-- -->
  <rect x="50" y="168" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="94" y="168" width="38" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="113" y="183" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="132" y="168" width="42" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="153" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="174" y="168" width="76" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="168" width="78" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="289" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="328" y="168" width="160" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="408" y="183" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">right−−</text>
  <rect x="488" y="168" width="52" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>

  <!-- Row 5: left=2, right=4, -2+2=0, No, right-- -->
  <rect x="50" y="190" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="94" y="190" width="38" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="113" y="205" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="132" y="190" width="42" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="153" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="174" y="190" width="76" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="250" y="190" width="78" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="289" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="328" y="190" width="160" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="408" y="205" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">right−−</text>
  <rect x="488" y="190" width="52" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>

  <!-- Row 6: left=2, right=3, -2+(-1)=-3, Yes, count+=1, left++ -->
  <rect x="50" y="212" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="94" y="212" width="38" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="113" y="227" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="132" y="212" width="42" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="153" y="227" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="174" y="212" width="76" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="250" y="212" width="78" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="289" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <rect x="328" y="212" width="160" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="408" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">count += 1, left++</text>
  <rect x="488" y="212" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- Row 7: left=3, right=3, stop -->
  <rect x="50" y="234" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="249" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="94" y="234" width="38" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="113" y="249" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="132" y="234" width="42" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="153" y="249" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="174" y="234" width="76" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="249" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <rect x="250" y="234" width="78" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="289" y="249" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">left≥right</text>
  <rect x="328" y="234" width="160" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="408" y="249" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">停止循环</text>
  <rect x="488" y="234" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="249" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- Answer -->
  <rect x="140" y="280" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="305" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = 0 + 5 + 4 + 0 + 0 + 1 = 10</text>

  <text x="310" y="340" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3 次「是」分别贡献 5+4+1=10 对，3 次「否」仅移动 right 不计数</text>
</svg>
