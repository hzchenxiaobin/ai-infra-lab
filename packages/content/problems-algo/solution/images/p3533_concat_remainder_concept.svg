<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">拼接一个数 = 余数做一次仿射更新</text>

  <!-- 区块1：拼接演示 -->
  <rect x="42" y="40" width="112" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="98" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">当前拼接值 V = "312"</text>
  <text x="98" y="78" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">r = V mod 5 = 2</text>
  <text x="98" y="92" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">大数不必存，只留 r</text>

  <text x="166" y="74" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+</text>

  <rect x="180" y="40" width="112" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="236" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a07828" filter="url(#rough2)">拼上 x = 45</text>
  <text x="236" y="78" text-anchor="middle" font-size="10.5" fill="#a07828" filter="url(#rough2)">L = 2 位</text>
  <text x="236" y="92" text-anchor="middle" font-size="8.5" fill="#a07828" filter="url(#rough2)">系数 10^L = 100</text>

  <path d="M 296 69 L 324 69" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="40" width="148" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="404" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">V' = "31245"</text>
  <text x="404" y="78" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">r' = 0 ✓ 整除！</text>
  <text x="404" y="92" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">全程没碰 31245 这个大数</text>

  <!-- 公式条 -->
  <rect x="42" y="108" width="436" height="40" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">V' = V·10^L + x  ⇒  r' = (r·10^L + x) mod k</text>
  <text x="260" y="141" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">本例：(2·100 + 45) mod 5 = 245 mod 5 = 0，一步乘加取模</text>

  <!-- 区块2：状态定义 -->
  <text x="42" y="172" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">落到 DP 状态：只记 (已用集合 mask, 当前余数 r)</text>

  <rect x="42" y="180" width="36" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="194" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">bit5</text>
  <text x="60" y="208" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="84" y="180" width="36" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="102" y="194" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">bit4</text>
  <text x="102" y="208" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="126" y="180" width="36" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="144" y="194" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">bit3</text>
  <text x="144" y="208" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="168" y="180" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="194" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">bit2</text>
  <text x="186" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="210" y="180" width="36" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="228" y="194" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">bit1</text>
  <text x="228" y="208" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">·</text>

  <rect x="252" y="180" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="194" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">bit0</text>
  <text x="270" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <text x="300" y="196" font-size="10" fill="#666" filter="url(#rough2)">已用 {0, 2}（值 3 与 12）</text>
  <text x="300" y="212" font-size="10" fill="#666" filter="url(#rough2)">r = 73（示意），状态 = (0101, 73)</text>

  <path d="M 111 240 L 111 250" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 261 240 L 261 250" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 411 240 L 411 250" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 转移子状态 -->
  <rect x="42" y="252" width="138" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="111" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">拼上 x = 45（L=2）</text>
  <text x="111" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">nr = (73·100+45) mod k</text>

  <rect x="192" y="252" width="138" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="261" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">拼上 x = 7（L=1）</text>
  <text x="261" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">nr = (73·10+7) mod k</text>

  <rect x="342" y="252" width="138" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="411" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">已用过的元素 ✗</text>
  <text x="411" y="286" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">mask 位已置 1，不能再拼</text>

  <!-- 底部要点 -->
  <rect x="42" y="304" width="436" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a07828" filter="url(#rough2)">顺序无关性：先 3 后 12 与先 12 后 3，只要 (mask, r) 相同，后续可行性完全一致</text>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#a07828" filter="url(#rough2)">⇒ 子问题重叠：2^13 × 100 ≈ 8×10^5 个状态，状压 DP 一表收割</text>
</svg>
