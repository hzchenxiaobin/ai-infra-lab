<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：全排列枚举 + 字符串留最大</text>

  <!-- 1. 排序 -->
  <rect x="170" y="44" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">排序 arr</text>
  <text x="280" y="78" text-anchor="middle" font-size="10.5" fill="#888">sort（保证枚举覆盖全部 4!=24 种）</text>
  <path d="M 280 88 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. best = "" -->
  <rect x="170" y="112" width="220" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="137" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">best = ""</text>
  <path d="M 280 152 L 280 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 取下一排列 -->
  <rect x="140" y="176" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">取下一排列 (a, b, c, d)</text>
  <text x="280" y="210" text-anchor="middle" font-size="10.5" fill="#888">next_permutation / itertools.permutations</text>
  <path d="M 280 220 L 280 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 计算 hh, mm -->
  <rect x="140" y="242" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">hh = 10a + b,  mm = 10c + d</text>
  <path d="M 280 282 L 280 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 判定菱形 -->
  <polygon points="280,304 384,344 280,384 176,344" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">hh &lt; 24</text>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">且 mm &lt; 60 ?</text>

  <!-- 是 → 更新 best -->
  <path d="M 384 344 L 440 344" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="396" y="336" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="324" width="108" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="494" y="341" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">cur = "ab:cd"</text>
  <text x="494" y="356" text-anchor="middle" font-size="10" fill="#888">cur&gt;best 则 best=cur</text>

  <!-- 否 → 跳过 -->
  <path d="M 176 344 L 120 344" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="132" y="336" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="12" y="324" width="108" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="66" y="349" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">跳过</text>

  <!-- 循环回边：从右下绕回取排列框 -->
  <path d="M 494 364 L 494 196 L 420 196" stroke="#666" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="502" y="280" font-size="10" fill="#888" transform="rotate(-90 502 280)">还有排列则继续</text>

  <!-- 6. 返回 best -->
  <path d="M 280 384 L 280 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="416" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="435" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">排列耗尽 → 返回 best</text>
  <text x="280" y="450" text-anchor="middle" font-size="10.5" fill="#888">best 仍为 "" 表示无解</text>
</svg>
