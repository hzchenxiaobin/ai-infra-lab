<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：shrink-while-valid —— 满足就记录并收缩，不满足就扩右</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="175" y="34" width="170" height="30" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="53" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">初始化：left=0，uniq=0，cnt 空，ans=∞</text>
  </g>
  <path d="M 260 64 L 260 76" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 扩张 -->
  <g filter="url(#rough2)">
    <rect x="130" y="80" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="96" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">扩张：right++，x = nums[right]</text>
    <text x="260" y="112" text-anchor="middle" font-size="10" fill="#33506b">cnt[x]++；cnt[x]==1 ⇒ uniq += x</text>
  </g>
  <path d="M 260 120 L 260 132" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 B：right 越界？ -->
  <polygon points="260,136 315,160 260,184 205,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">right 越界？</text>
  <text x="328" y="151" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 315 160 L 351 160" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <g filter="url(#rough2)">
    <rect x="355" y="142" width="150" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="430" y="157" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">循环结束：ans==∞ ?</text>
    <text x="430" y="172" text-anchor="middle" font-size="10" fill="#2f5d24">返回 −1 : 返回 ans</text>
  </g>

  <text x="268" y="197" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 184 L 260 200" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 C：uniq ≥ k？ -->
  <polygon points="260,204 320,228 260,252 200,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">uniq ≥ k？</text>
  <text x="330" y="219" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 320 228 L 346 228" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 收缩 -->
  <g filter="url(#rough2)">
    <rect x="350" y="198" width="155" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="427" y="214" text-anchor="middle" font-size="9.5" fill="#8a3a34" font-weight="bold">ans=min(ans, right−left+1)</text>
    <text x="427" y="229" text-anchor="middle" font-size="9.5" fill="#8a3a34">y = nums[left]；cnt[y]−−</text>
    <text x="427" y="244" text-anchor="middle" font-size="9.5" fill="#8a3a34">cnt[y]==0 ⇒ uniq −= y</text>
    <text x="427" y="258" text-anchor="middle" font-size="9.5" fill="#8a3a34">left++（回到判定）</text>
  </g>
  <path d="M 427 262 L 427 288 L 260 288 L 260 256" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="283" font-size="9" fill="#8a3a34" filter="url(#rough2)">再判定</text>

  <!-- 否：回扩张 -->
  <text x="186" y="219" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 200 228 L 66 228 L 66 100 L 124 100" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="243" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">窗口不满足 → 扩右端</text>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="100" y="310" width="320" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="260" y="326" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">均摊 O(n)：left 与 right 都只前进、从不回退</text>
    <text x="260" y="342" text-anchor="middle" font-size="9.5" fill="#33506b">每个元素至多进窗一次、出窗一次</text>
  </g>
</svg>
