<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：target = "10111"</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">初始 flip=0（全灭），逐位扫描</text>

  <!-- ===== Table header ===== -->
  <g font-size="10.5" fill="#555" font-weight="bold" text-anchor="middle">
    <text x="40" y="68">i</text>
    <text x="100" y="68">target[i]</text>
    <text x="180" y="68">flip(前)</text>
    <text x="240" y="68">匹配?</text>
    <text x="330" y="68">动作</text>
    <text x="430" y="68">flip(后)</text>
    <text x="510" y="68">ans</text>
  </g>
  <path d="M 20 76 L 540 76" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 0: i=0, target=1, flip=0, mismatch, flip → flip=1, ans=1 ===== -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="40" y="100">0</text>
    <rect x="84" y="86" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="100" y="101">1</text>
    <text x="180" y="101">0</text>
    <text x="240" y="101" fill="#b85450" font-weight="bold">✗</text>
    <rect x="296" y="86" width="68" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="101" fill="#b85450" font-weight="bold">翻转</text>
    <text x="430" y="101" fill="#d6a040" font-weight="bold">1</text>
    <text x="510" y="101" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- ===== Row 1: i=1, target=0, flip=1, mismatch, flip → flip=0, ans=2 ===== -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="40" y="134">1</text>
    <rect x="84" y="120" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="100" y="135">0</text>
    <text x="180" y="135">1</text>
    <text x="240" y="135" fill="#b85450" font-weight="bold">✗</text>
    <rect x="296" y="120" width="68" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="135" fill="#b85450" font-weight="bold">翻转</text>
    <text x="430" y="135" fill="#446688" font-weight="bold">0</text>
    <text x="510" y="135" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- ===== Row 2: i=2, target=1, flip=0, mismatch, flip → flip=1, ans=3 ===== -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="40" y="168">2</text>
    <rect x="84" y="154" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="100" y="169">1</text>
    <text x="180" y="169">0</text>
    <text x="240" y="169" fill="#b85450" font-weight="bold">✗</text>
    <rect x="296" y="154" width="68" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="169" fill="#b85450" font-weight="bold">翻转</text>
    <text x="430" y="169" fill="#d6a040" font-weight="bold">1</text>
    <text x="510" y="169" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- ===== Row 3: i=3, target=1, flip=1, match, skip → flip=1, ans=3 ===== -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="40" y="202">3</text>
    <rect x="84" y="188" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="100" y="203">1</text>
    <text x="180" y="203">1</text>
    <text x="240" y="203" fill="#4a7a3a" font-weight="bold">✓</text>
    <rect x="296" y="188" width="68" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="203" fill="#4a7a3a" font-weight="bold">跳过</text>
    <text x="430" y="203" fill="#d6a040" font-weight="bold">1</text>
    <text x="510" y="203">3</text>
  </g>

  <!-- ===== Row 4: i=4, target=1, flip=1, match, skip → flip=1, ans=3 ===== -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="40" y="236">4</text>
    <rect x="84" y="222" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="100" y="237">1</text>
    <text x="180" y="237">1</text>
    <text x="240" y="237" fill="#4a7a3a" font-weight="bold">✓</text>
    <rect x="296" y="222" width="68" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="237" fill="#4a7a3a" font-weight="bold">跳过</text>
    <text x="430" y="237" fill="#d6a040" font-weight="bold">1</text>
    <text x="510" y="237">3</text>
  </g>

  <path d="M 20 252 L 540 252" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Visual bulb states ===== -->
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">灯泡有效状态变化（橙色=亮，蓝色=灭）</text>

  <!-- Step labels -->
  <text x="40" y="312" font-size="9.5" fill="#888" text-anchor="middle">初始</text>
  <text x="130" y="312" font-size="9.5" fill="#888" text-anchor="middle">翻0后</text>
  <text x="220" y="312" font-size="9.5" fill="#888" text-anchor="middle">翻1后</text>
  <text x="310" y="312" font-size="9.5" fill="#888" text-anchor="middle">翻2后</text>
  <text x="400" y="312" font-size="9.5" fill="#888" text-anchor="middle">最终</text>

  <!-- Initial: all off -->
  <g font-size="10" fill="#446688" text-anchor="middle">
    <rect x="12" y="320" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="36" y="320" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="60" y="320" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="12" y="320" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  </g>

  <!-- After flip(0): all on -->
  <g font-size="10" fill="#d6a040" text-anchor="middle">
    <rect x="108" y="320" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="132" y="320" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  </g>

  <!-- After flip(1): pos0=on, pos1-4=off -->
  <g font-size="10" text-anchor="middle">
    <rect x="196" y="320" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="220" y="320" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  </g>

  <!-- After flip(2): pos0=on, pos1=off, pos2-4=on -->
  <g font-size="10" text-anchor="middle">
    <rect x="286" y="320" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="310" y="320" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="334" y="320" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  </g>

  <!-- Final = target: 1 0 1 1 1 -->
  <g font-size="10" text-anchor="middle">
    <rect x="378" y="320" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="389" y="334" fill="#d6a040" font-weight="bold">1</text>
    <rect x="402" y="320" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="413" y="334" fill="#446688" font-weight="bold">0</text>
    <rect x="426" y="320" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="437" y="334" fill="#d6a040" font-weight="bold">1</text>
  </g>

  <!-- ===== Conclusion ===== -->
  <rect x="60" y="362" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3 次翻转后达成 target = "10111" ✓</text>
  <text x="280" y="398" text-anchor="middle" font-size="10.5" fill="#888">变化点：0→1（i=0）, 1→0（i=1）, 0→1（i=2），共 3 处</text>
</svg>
