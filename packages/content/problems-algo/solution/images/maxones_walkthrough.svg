<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="700" height="380" fill="#fdfcf7"/>

  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：排序取前 maxOnes 个类</text>
  <path d="M 170 38 Q 350 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="350" y="56" text-anchor="middle" font-size="11" fill="#888">width=3, height=3, sideLength=2 → 4 个余数类大小 [4,2,2,1]，降序后贪心选取</text>

  <!-- header row -->
  <g filter="url(#sk)"><rect x="60" y="76" width="580" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="130" y="97" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">余数类 (r,c)</text>
  <text x="270" y="97" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">类大小</text>
  <text x="420" y="97" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">maxOnes=1</text>
  <text x="570" y="97" text-anchor="middle" font-size="12" fill="#2e8b57" font-weight="bold">maxOnes=2</text>

  <!-- row 1 (0,0)=4 blue -->
  <g filter="url(#sk)"><rect x="60" y="112" width="580" height="30" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/></g>
  <text x="130" y="132" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">(0,0)</text>
  <text x="270" y="132" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="420" y="133" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">✓</text>
  <text x="570" y="133" text-anchor="middle" font-size="15" fill="#2e8b57" font-weight="bold">✓</text>

  <!-- row 2 (1,0)=2 orange -->
  <g filter="url(#sk)"><rect x="60" y="144" width="580" height="30" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1"/></g>
  <text x="130" y="164" text-anchor="middle" font-size="12" fill="#9a6a20" font-weight="bold">(1,0)</text>
  <text x="270" y="164" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="570" y="165" text-anchor="middle" font-size="15" fill="#2e8b57" font-weight="bold">✓</text>

  <!-- row 3 (0,1)=2 green -->
  <g filter="url(#sk)"><rect x="60" y="176" width="580" height="30" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/></g>
  <text x="130" y="196" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">(0,1)</text>
  <text x="270" y="196" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- row 4 (1,1)=1 pink -->
  <g filter="url(#sk)"><rect x="60" y="208" width="580" height="30" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1"/></g>
  <text x="130" y="228" text-anchor="middle" font-size="12" fill="#a8423e" font-weight="bold">(1,1)</text>
  <text x="270" y="228" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- sum row -->
  <g filter="url(#sk)"><rect x="60" y="246" width="580" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="270" y="269" text-anchor="middle" font-size="12" fill="#9a6a20" font-weight="bold">答案 =</text>
  <text x="420" y="271" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">4</text>
  <text x="570" y="271" text-anchor="middle" font-size="16" fill="#2e8b57" font-weight="bold">6</text>

  <!-- explanation boxes -->
  <g filter="url(#sk)"><rect x="60" y="300" width="280" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="200" y="322" text-anchor="middle" font-size="11" fill="#a8423e" font-weight="bold">maxOnes=1：填满最大类 (0,0)</text>
  <text x="200" y="340" text-anchor="middle" font-size="10" fill="#666">每子阵恰 1 个 1，矩阵共 4 个 1</text>
  <text x="200" y="354" text-anchor="middle" font-size="10" fill="#888">[1,0,1] / [0,0,0] / [1,0,1]</text>

  <g filter="url(#sk)"><rect x="360" y="300" width="280" height="62" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/></g>
  <text x="500" y="322" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">maxOnes=2：填满 (0,0)+(1,0)</text>
  <text x="500" y="340" text-anchor="middle" font-size="10" fill="#666">每子阵恰 2 个 1，矩阵共 6 个 1</text>
  <text x="500" y="354" text-anchor="middle" font-size="10" fill="#888">[1,0,1] / [1,0,1] / [1,0,1]</text>
</svg>
