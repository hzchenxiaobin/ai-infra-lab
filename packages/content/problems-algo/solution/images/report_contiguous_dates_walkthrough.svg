<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：UNION → ROW_NUMBER → pt → GROUP BY</text>

  <!-- Table header -->
  <text x="50" y="54" font-size="11" fill="#555" font-weight="bold">UNION ALL + WHERE 2019 + 排序后</text>

  <!-- Column headers -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="150" y="60" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="240" y="60" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="290" y="60" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <g font-size="10" fill="#333" font-weight="bold">
    <text x="95" y="76" text-anchor="middle">dt</text>
    <text x="195" y="76" text-anchor="middle">st</text>
    <text x="265" y="76" text-anchor="middle">rn</text>
    <text x="340" y="76" text-anchor="middle">pt = dt − rn</text>
  </g>

  <!-- Row 1: 01-01 succeeded rn=1 pt=12-31 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="84" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="150" y="84" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="240" y="84" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="290" y="84" width="100" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="95" y="99" text-anchor="middle">2019-01-01</text>
    <text x="195" y="99" text-anchor="middle" fill="#4a7a3a">succeeded</text>
    <text x="265" y="99" text-anchor="middle">1</text>
    <text x="340" y="99" text-anchor="middle" fill="#d6a040" font-weight="bold">2018-12-31</text>
  </g>

  <!-- Row 2: 01-02 succeeded rn=2 pt=12-31 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="106" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="150" y="106" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="240" y="106" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="290" y="106" width="100" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="95" y="121" text-anchor="middle">2019-01-02</text>
    <text x="195" y="121" text-anchor="middle" fill="#4a7a3a">succeeded</text>
    <text x="265" y="121" text-anchor="middle">2</text>
    <text x="340" y="121" text-anchor="middle" fill="#d6a040" font-weight="bold">2018-12-31</text>
  </g>

  <!-- Row 3: 01-03 succeeded rn=3 pt=12-31 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="128" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="150" y="128" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="240" y="128" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="290" y="128" width="100" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="95" y="143" text-anchor="middle">2019-01-03</text>
    <text x="195" y="143" text-anchor="middle" fill="#4a7a3a">succeeded</text>
    <text x="265" y="143" text-anchor="middle">3</text>
    <text x="340" y="143" text-anchor="middle" fill="#d6a040" font-weight="bold">2018-12-31</text>
  </g>

  <!-- Island 1 bracket -->
  <path d="M 35 84 L 28 84 L 28 150 L 35 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="20" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 20 120)">岛屿1</text>

  <!-- Row 4: 01-04 failed rn=1 pt=01-03 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="156" width="110" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2"/>
    <rect x="150" y="156" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2"/>
    <rect x="240" y="156" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="290" y="156" width="100" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="95" y="171" text-anchor="middle">2019-01-04</text>
    <text x="195" y="171" text-anchor="middle" fill="#b85450">failed</text>
    <text x="265" y="171" text-anchor="middle">1</text>
    <text x="340" y="171" text-anchor="middle" fill="#d6a040" font-weight="bold">2019-01-03</text>
  </g>

  <!-- Row 5: 01-05 failed rn=2 pt=01-03 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="178" width="110" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2"/>
    <rect x="150" y="178" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2"/>
    <rect x="240" y="178" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="290" y="178" width="100" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="95" y="193" text-anchor="middle">2019-01-05</text>
    <text x="195" y="193" text-anchor="middle" fill="#b85450">failed</text>
    <text x="265" y="193" text-anchor="middle">2</text>
    <text x="340" y="193" text-anchor="middle" fill="#d6a040" font-weight="bold">2019-01-03</text>
  </g>

  <!-- Island 2 bracket -->
  <path d="M 35 156 L 28 156 L 28 200 L 35 200" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="20" y="178" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" transform="rotate(-90 20 178)">岛屿2</text>

  <!-- Row 6: 01-06 succeeded rn=4 pt=01-02 -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="206" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <rect x="150" y="206" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <rect x="240" y="206" width="50" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="290" y="206" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <text x="95" y="221" text-anchor="middle">2019-01-06</text>
    <text x="195" y="221" text-anchor="middle" fill="#4a7a3a">succeeded</text>
    <text x="265" y="221" text-anchor="middle">4</text>
    <text x="340" y="221" text-anchor="middle" fill="#b85450" font-weight="bold">2019-01-02</text>
  </g>

  <!-- Island 3 bracket -->
  <path d="M 35 206 L 28 206 L 28 228 L 35 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="20" y="217" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 20 217)">岛屿3</text>

  <!-- Arrow to result -->
  <path d="M 340 240 L 340 255 L 340 270" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="380" y="258" font-size="10" fill="#888">GROUP BY st, pt</text>
  <text x="380" y="270" font-size="10" fill="#888">→ MIN / MAX</text>

  <!-- Result table -->
  <text x="50" y="288" font-size="11" fill="#555" font-weight="bold">最终输出（ORDER BY start_date）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="296" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="140" y="296" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="250" y="296" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
  </g>
  <g font-size="10" fill="#333" font-weight="bold">
    <text x="90" y="312" text-anchor="middle">period_state</text>
    <text x="195" y="312" text-anchor="middle">start_date</text>
    <text x="305" y="312" text-anchor="middle">end_date</text>
  </g>

  <!-- Result rows -->
  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="320" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="140" y="320" width="110" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="250" y="320" width="110" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="90" y="335" text-anchor="middle" fill="#4a7a3a">succeeded</text>
    <text x="195" y="335" text-anchor="middle">2019-01-01</text>
    <text x="305" y="335" text-anchor="middle">2019-01-03</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="342" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2"/>
    <rect x="140" y="342" width="110" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="250" y="342" width="110" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="90" y="357" text-anchor="middle" fill="#b85450">failed</text>
    <text x="195" y="357" text-anchor="middle">2019-01-04</text>
    <text x="305" y="357" text-anchor="middle">2019-01-05</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <rect x="40" y="364" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <rect x="140" y="364" width="110" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <rect x="250" y="364" width="110" height="22" fill="#fff" stroke="#bbb" stroke-width="0.5" rx="2"/>
    <text x="90" y="379" text-anchor="middle" fill="#4a7a3a">succeeded</text>
    <text x="195" y="379" text-anchor="middle">2019-01-06</text>
    <text x="305" y="379" text-anchor="middle">2019-01-06</text>
  </g>

  <!-- Key annotations -->
  <rect x="400" y="296" width="200" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="500" y="316" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键观察</text>
  <text x="410" y="334" font-size="9.5" fill="#555">• 岛屿1：rn=1,2,3</text>
  <text x="410" y="348" font-size="9.5" fill="#555">  pt 全 = 2018-12-31（连续）</text>
  <text x="410" y="362" font-size="9.5" fill="#555">• 岛屿3：rn=4</text>
  <text x="410" y="376" font-size="9.5" fill="#b85450">  pt = 01-02（断点→新岛）</text>

  <!-- Summary -->
  <rect x="40" y="402" width="560" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="420" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">rn 按 st 分区：succeeded 的 01-06 接续 rn=4（非重置为1）</text>
  <text x="310" y="436" text-anchor="middle" font-size="10.5" fill="#888">因此 pt 从 12-31 跳到 01-02，准确检测出 01-03→01-06 之间的断点</text>

  <!-- Bottom note about RANK vs ROW_NUMBER -->
  <rect x="40" y="452" width="560" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="310" y="468" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠️ PARTITION BY st 让 succeeded / failed 各自独立编号</text>
  <text x="310" y="482" text-anchor="middle" font-size="9.5" fill="#888">同一状态内连续日期 pt 不变 → 同组；跨状态 pt 无关 → 不会误合并</text>
</svg>
