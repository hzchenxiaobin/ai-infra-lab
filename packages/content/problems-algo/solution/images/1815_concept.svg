<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：余数状态机与开心条件
  </text>

  <!-- ===== Top: remainder reduction ===== -->
  <rect x="40" y="40" width="480" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    g = 10⁹ …  但 r = g mod batchSize ∈ [0, 8]
  </text>
  <text x="280" y="74" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">
    余数化：10⁹ 级人数 → [0, 8]，状态压缩的前提
  </text>

  <!-- ===== Left: Happy when rem=0 ===== -->
  <text x="150" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">rem = 0 → 开心 ✓</text>

  <!-- batch box (fresh) -->
  <rect x="80" y="116" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="132" text-anchor="middle" font-size="10" fill="#2a4a1a" filter="url(#rough2)">新批次</text>
  <text x="110" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">batchSize 个</text>

  <!-- group arrives -->
  <rect x="160" y="120" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">组 r</text>

  <!-- arrow -->
  <path d="M140,136 L156,136" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="170" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="188" text-anchor="middle" font-size="10" fill="#2a4a1a" filter="url(#rough2)">开心！rem' = B−r</text>

  <!-- ===== Right: Unhappy when rem>0 ===== -->
  <text x="410" y="106" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">rem &gt; 0 → 不开心 ✗</text>

  <!-- leftover box -->
  <rect x="340" y="116" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="132" text-anchor="middle" font-size="10" fill="#5a1a1a" filter="url(#rough2)">剩 rem</text>
  <text x="370" y="146" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">非新批次</text>

  <!-- group arrives -->
  <rect x="420" y="120" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">组 r</text>

  <!-- arrow -->
  <path d="M400,136 L416,136" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="340" y="170" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="188" text-anchor="middle" font-size="10" fill="#5a1a1a" filter="url(#rough2)">不开心 rem'=(rem−r)%B</text>

  <!-- ===== Middle: state transition formula ===== -->
  <rect x="60" y="214" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    状态转移：rem' = (rem − r) mod batchSize
  </text>

  <!-- ===== Bottom: state cycle for batchSize=4 ===== -->
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    余数状态环（batchSize = 4 示例）
  </text>

  <!-- state nodes: 0, 1, 2, 3 in a circle -->
  <!-- node 0 (green = happy zone) -->
  <ellipse cx="280" cy="300" rx="26" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#rough2)">rem=0</text>
  <text x="280" y="326" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">开心区 ✓</text>

  <!-- node 1 -->
  <ellipse cx="380" cy="300" rx="22" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="304" text-anchor="middle" font-size="11" fill="#5a1a1a" filter="url(#rough2)">rem=1</text>

  <!-- node 2 -->
  <ellipse cx="380" cy="352" rx="22" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="356" text-anchor="middle" font-size="11" fill="#5a1a1a" filter="url(#rough2)">rem=2</text>

  <!-- node 3 -->
  <ellipse cx="180" cy="352" rx="22" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="356" text-anchor="middle" font-size="11" fill="#5a1a1a" filter="url(#rough2)">rem=3</text>

  <!-- arrows between nodes -->
  <!-- 0 -> 3 (serve r=1 from rem 0: new rem = 0-1 = -1 mod 4 = 3) -->
  <path d="M256,308 Q210,330 198,344" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="210" y="318" font-size="8" fill="#d6a040" filter="url(#rough2)">r=1</text>

  <!-- 0 -> 2 (serve r=2: new rem = 0-2 = -2 mod 4 = 2) -->
  <path d="M280,316 Q330,330 360,348" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" stroke-dasharray="3 2"/>
  <text x="330" y="324" font-size="8" fill="#d6a040" filter="url(#rough2)">r=2</text>

  <!-- 3 -> 0 (serve r=3 from rem 3: 3-3=0) -->
  <path d="M202,344 Q240,328 258,312" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="238" y="340" font-size="8" fill="#4a7a3a" filter="url(#rough2)">r=3→0</text>

  <!-- 2 -> 0 (serve r=2 from rem 2: 2-2=0) -->
  <path d="M358,348 Q320,328 302,312" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="3 2"/>
  <text x="318" y="340" font-size="8" fill="#4a7a3a" filter="url(#rough2)">r=2→0</text>

  <!-- 3 -> 2 (serve r=1 from rem 3: 3-1=2) -->
  <path d="M202,356 L358,356" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3 2"/>
  <text x="270" y="370" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">r=1: 3→2</text>

  <!-- legend -->
  <rect x="40" y="378" width="200" height="16" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="50" y="390" font-size="9" fill="#4a7a3a" filter="url(#rough2)">绿=归零开心</text>
  <text x="150" y="390" font-size="9" fill="#d6a040" filter="url(#rough2)">橙=离开零</text>
  <text x="340" y="390" font-size="9" fill="#888" filter="url(#rough2)">目标：最大化经过 rem=0 的次数</text>
</svg>
