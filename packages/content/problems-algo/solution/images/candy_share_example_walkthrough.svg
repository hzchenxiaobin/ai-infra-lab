<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：candies = [1,2,2,3,4,3]，k = 3</text>
  <text x="320" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">共 6 − 3 + 1 = 4 个窗口位置（粉色=送出，蓝色=保留）</text>

  <!-- Header row -->
  <text x="30" y="72" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口</text>
  <text x="80" y="72" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">数组（粉=送出，蓝=保留）</text>
  <text x="320" y="72" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">保留频率表 cnt</text>
  <text x="530" y="72" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">|cnt|</text>
  <text x="600" y="72" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- ===== Row 0 : window [0,3) = [1,2,2], kept=[3,4,3] ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="80" width="610" height="56" fill="#ffffff" stroke="#eee" stroke-width="1"/>
    <text x="30" y="114" font-size="11" fill="#333" font-weight="bold">[0,3)</text>
    <!-- window highlight 0..2 -->
    <rect x="60" y="88" width="114" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" fill-opacity="0.35"/>
    <!-- cells 0,1,2 shared pink -->
    <rect x="64" y="92" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="81" y="113" text-anchor="middle" font-size="12" fill="#b85450">1</text>
    <rect x="100" y="92" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="117" y="113" text-anchor="middle" font-size="12" fill="#b85450">2</text>
    <rect x="136" y="92" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="153" y="113" text-anchor="middle" font-size="12" fill="#b85450">2</text>
    <!-- cells 3,4,5 kept blue -->
    <rect x="172" y="92" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="189" y="113" text-anchor="middle" font-size="12" fill="#446688">3</text>
    <rect x="208" y="92" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="225" y="113" text-anchor="middle" font-size="12" fill="#446688">4</text>
    <rect x="244" y="92" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="261" y="113" text-anchor="middle" font-size="12" fill="#446688">3</text>
    <text x="300" y="114" font-size="11" fill="#333">{3:2, 4:1}</text>
    <rect x="520" y="100" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="537" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="600" y="116" font-size="11" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- ===== Row 1 : window [1,4) = [2,2,3], kept=[1]∪[4,3] ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="136" width="610" height="56" fill="#fafafa" stroke="#eee" stroke-width="1"/>
    <text x="30" y="170" font-size="11" fill="#333" font-weight="bold">[1,4)</text>
    <rect x="96" y="144" width="114" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" fill-opacity="0.35"/>
    <!-- cell 0 kept (出窗) -->
    <rect x="64" y="148" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="81" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <!-- cells 1,2,3 shared -->
    <rect x="100" y="148" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="117" y="169" text-anchor="middle" font-size="12" fill="#b85450">2</text>
    <rect x="136" y="148" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="153" y="169" text-anchor="middle" font-size="12" fill="#b85450">2</text>
    <rect x="172" y="148" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="189" y="169" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <!-- cells 4,5 kept -->
    <rect x="208" y="148" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="225" y="169" text-anchor="middle" font-size="12" fill="#446688">4</text>
    <rect x="244" y="148" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="261" y="169" text-anchor="middle" font-size="12" fill="#446688">3</text>
    <text x="300" y="170" font-size="11" fill="#333">{1:1, 3:1, 4:1}  <tspan fill="#999" font-size="9">(+1 出窗, −3 入窗)</tspan></text>
    <rect x="520" y="156" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="537" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="600" y="172" font-size="11" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- ===== Row 2 : window [2,5) = [2,3,4], kept=[1,2]∪[3] ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="192" width="610" height="56" fill="#ffffff" stroke="#eee" stroke-width="1"/>
    <text x="30" y="226" font-size="11" fill="#333" font-weight="bold">[2,5)</text>
    <rect x="132" y="200" width="114" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" fill-opacity="0.35"/>
    <!-- cells 0,1 kept -->
    <rect x="64" y="204" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="81" y="225" text-anchor="middle" font-size="12" fill="#446688">1</text>
    <rect x="100" y="204" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="117" y="225" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <!-- cells 2,3,4 shared -->
    <rect x="136" y="204" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="153" y="225" text-anchor="middle" font-size="12" fill="#b85450">2</text>
    <rect x="172" y="204" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="189" y="225" text-anchor="middle" font-size="12" fill="#b85450">3</text>
    <rect x="208" y="204" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="225" y="225" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
    <!-- cell 5 kept -->
    <rect x="244" y="204" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="261" y="225" text-anchor="middle" font-size="12" fill="#446688">3</text>
    <text x="300" y="226" font-size="11" fill="#333">{1:1, 2:1, 3:1}  <tspan fill="#999" font-size="9">(+2 出窗, −4 入窗)</tspan></text>
    <rect x="520" y="212" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="537" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
    <text x="600" y="228" font-size="11" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- ===== Row 3 : window [3,6) = [3,4,3], kept=[1,2,2] ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="248" width="610" height="56" fill="#fafafa" stroke="#eee" stroke-width="1"/>
    <text x="30" y="282" font-size="11" fill="#333" font-weight="bold">[3,6)</text>
    <rect x="168" y="256" width="114" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" fill-opacity="0.35"/>
    <!-- cells 0,1,2 kept -->
    <rect x="64" y="260" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="81" y="281" text-anchor="middle" font-size="12" fill="#446688">1</text>
    <rect x="100" y="260" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="117" y="281" text-anchor="middle" font-size="12" fill="#446688">2</text>
    <rect x="136" y="260" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="153" y="281" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <!-- cells 3,4,5 shared -->
    <rect x="172" y="260" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="189" y="281" text-anchor="middle" font-size="12" fill="#b85450">3</text>
    <rect x="208" y="260" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="225" y="281" text-anchor="middle" font-size="12" fill="#b85450">4</text>
    <rect x="244" y="260" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="261" y="281" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <text x="300" y="282" font-size="11" fill="#333">{1:1, 2:2}  <tspan fill="#999" font-size="9">(+2 出窗, −3 入窗)</tspan></text>
    <rect x="520" y="268" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="537" y="284" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="600" y="284" font-size="11" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- ===== Result ===== -->
  <rect x="20" y="316" width="610" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="340" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">各窗口 |cnt|：</text>
  <g filter="url(#rough2)">
    <rect x="130" y="326" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="147" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
    <rect x="166" y="326" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="183" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="202" y="326" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="219" y="342" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
    <rect x="238" y="326" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="255" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  </g>
  <text x="296" y="342" font-size="10.5" fill="#888" filter="url(#rough2)">最大值 ans = 3（窗口 [1,4) 或 [2,5)）</text>

  <!-- ===== Note ===== -->
  <rect x="20" y="372" width="610" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="392" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">绿色 = 刚出窗回到自己手里的元素；橙色 = 刚入窗被送出的元素</text>
  <text x="320" y="410" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">每次滑动只换两个元素 → cnt 表 O(1) 增量维护 → 4 个窗口共 O(n)</text>
</svg>
