<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：组合爆炸坍缩成 ≤ 150 个 gcd 状态</text>

  <!-- 面板一：gcd 只降不升 -->
  <rect x="18" y="34" width="484" height="134" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 每行恰选一个数：gcd(g, v) 整除 g ⇒ 只降不升</text>

  <text x="30" y="92" font-size="11" fill="#666" filter="url(#rough2)">mat：</text>
  <rect x="76" y="72" width="34" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="114" y="72" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="131" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="76" y="104" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="93" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="114" y="104" width="34" height="28" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <text x="28" y="147" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✔ (2,3) → gcd = 1</text>
  <text x="28" y="161" font-size="10" fill="#b85450" filter="url(#rough2)">✘ (2,4) → gcd = 2</text>

  <text x="264" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">选 8</text>
  <text x="342" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">选 6</text>
  <text x="420" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">选 3</text>

  <rect x="205" y="78" width="40" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <path d="M 247 93 L 281 93" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="283" y="78" width="40" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="303" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <path d="M 325 93 L 359 93" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="361" y="78" width="40" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <path d="M 403 93 L 437 93" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="439" y="78" width="40" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="459" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1 ✓</text>

  <text x="342" y="126" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">gcd(12,8)=4 → gcd(4,6)=2 → gcd(2,3)=1</text>
  <text x="342" y="146" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">一步一格往下溜，永不回升；任意时刻 g ∈ [1,150]</text>

  <!-- 面板二：dp 状态表 -->
  <rect x="18" y="176" width="484" height="126" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② dp[g]：前 i 行 gcd 恰为 g 的方案数（答案 = dp[1]）</text>

  <text x="34" y="236" font-size="11" fill="#666" filter="url(#rough2)">dp =</text>

  <text x="94" y="210" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">g=1</text>
  <rect x="68" y="214" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="94" y="236" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>

  <text x="154" y="210" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">g=2</text>
  <rect x="128" y="214" width="52" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="214" y="210" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">g=3</text>
  <rect x="188" y="214" width="52" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="214" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="274" y="210" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">g=4</text>
  <rect x="248" y="214" width="52" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="312" y="236" font-size="12" fill="#666" filter="url(#rough2)">…</text>

  <text x="376" y="210" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">g=150</text>
  <rect x="332" y="214" width="88" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="48" y="256" width="424" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">转移：ndp[gcd(g,v)] += dp[g] × cnt[v] （mod 10⁹+7）</text>

  <text x="260" y="296" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">cnt[v]：本行值 v 的出现次数——重复值打包；dp[g]=0 或 cnt[v]=0 直接跳过</text>

  <!-- 底部总结 -->
  <rect x="18" y="312" width="484" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化：第 0 行每个 v 做 dp[v]++ → 逐行滚动转移 → 返回 dp[1]</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">边界 m = 1：单个数的 gcd 即本身，dp[1] = 行内 1 的个数，无需特判</text>
</svg>
