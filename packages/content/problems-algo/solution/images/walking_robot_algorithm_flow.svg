<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：遍历指令，转向取模 / 移动逐步探障</text>

  <!-- Start -->
  <rect x="170" y="36" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="10.5" fill="#333">初始化 x=0,y=0,d=0,ans=0；障碍入 set</text>
  <path d="M 260 68 L 260 84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="190" y="86" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="10.5" fill="#333">遍历 commands[i]</text>
  <path d="M 260 114 L 260 130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: cmd == -1? -->
  <polygon points="260,132 350,162 260,192 170,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#333">cmd == -1?</text>

  <!-- Yes: right turn -->
  <path d="M 350 162 L 410 162" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="410" y="148" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="456" y="166" text-anchor="middle" font-size="10" fill="#333">d=(d+1)%4</text>

  <!-- No: down to cmd == -2? -->
  <path d="M 260 192 L 260 208" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="204" font-size="10" fill="#888">否</text>

  <polygon points="260,210 350,240 260,270 170,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#333">cmd == -2?</text>

  <!-- Yes: left turn -->
  <path d="M 350 240 L 410 240" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="378" y="234" text-anchor="middle" font-size="10" fill="#d6a040">是</text>
  <rect x="410" y="226" width="92" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="456" y="244" text-anchor="middle" font-size="10" fill="#333">d=(d+3)%4</text>

  <!-- No: down to move -->
  <path d="M 260 270 L 260 286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="282" font-size="10" fill="#888">否（移动 k）</text>

  <!-- Move block -->
  <rect x="150" y="288" width="220" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">逐步走 k 步（step = 1…k）</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#555">nx = x + dirs[d].x</text>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#555">ny = y + dirs[d].y</text>

  <!-- inner decision: obstacle? -->
  <polygon points="260,352 330,372 260,392 190,372" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="9.5" fill="#333">(nx,ny)是障碍?</text>

  <!-- yes: break -->
  <path d="M 330 372 L 390 372" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="366" text-anchor="middle" font-size="9.5" fill="#b85450">是</text>
  <rect x="390" y="360" width="84" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="376" text-anchor="middle" font-size="10" fill="#b85450">break 停步</text>

  <!-- no: move + update ans -->
  <path d="M 260 392 L 260 408" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="278" y="404" font-size="9.5" fill="#4a7a3a">否</text>
  <rect x="196" y="410" width="128" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="426" text-anchor="middle" font-size="10" fill="#333">x,y=nx,ny；ans=max(ans,x²+y²)</text>

  <!-- loop back: from move block bottom + right turns back to loop -->
  <path d="M 370 348 L 470 348 L 470 99 L 330 99" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="224" font-size="9" fill="#888" transform="rotate(-90 478 224)">下一条指令</text>

  <!-- End -->
  <path d="M 260 446 L 260 462" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="464" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="260" y="481" text-anchor="middle" font-size="10.5" fill="#333">遍历完 → return ans</text>
</svg>
