<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="370" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：j − i 为偶数 ⇔ 同奇偶交换 → 位置分成奇偶两条轨道</text>
  <text x="310" y="44" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 s1 = "abcdba"（示例 1）为例：同轨任意两点一步直达，跨轨永不可能</text>

  <!-- even-track swap arcs: swap(0,4), j-i=4 -->
  <path d="M 110 106 Q 270 60 430 106" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 430 70 Q 270 34 110 70" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">swap(0,4)：j − i = 4 为偶数，一步直达 ✓</text>

  <!-- string cells -->
  <rect x="78" y="112" width="64" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="145" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <rect x="158" y="112" width="64" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="190" y="145" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <rect x="238" y="112" width="64" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="145" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">c</text>
  <rect x="318" y="112" width="64" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="350" y="145" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">d</text>
  <rect x="398" y="112" width="64" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="145" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <rect x="478" y="112" width="64" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="510" y="145" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>

  <!-- index labels -->
  <text x="110" y="188" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="190" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="270" y="188" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="350" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="430" y="188" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <text x="510" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <!-- odd-track swap arc: swap(1,5), j-i=4 -->
  <path d="M 190 198 Q 350 240 510 198" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="350" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">swap(1,5)：j − i = 4 为偶数 ✓</text>

  <!-- forbidden adjacent swaps: red X at every adjacent gap -->
  <path d="M 144 131 L 156 145 M 156 131 L 144 145" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 224 131 L 236 145 M 236 131 L 224 145" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 304 131 L 316 145 M 316 131 L 304 145" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 384 131 L 396 145 M 396 131 L 384 145" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 464 131 L 476 145 M 476 131 L 464 145" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="262" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 一切奇数差（含相邻位 j − i = 1）都不许换：奇偶之间有一堵墙</text>

  <!-- orbit group boxes -->
  <rect x="48" y="278" width="252" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="174" y="298" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">偶数位轨道 {0, 2, 4}：{a, c, b}</text>
  <text x="174" y="318" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">组内任意排列都可达</text>

  <rect x="320" y="278" width="252" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="446" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">奇数位轨道 {1, 3, 5}：{b, d, a}</text>
  <text x="446" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">组内任意排列都可达</text>

  <text x="310" y="356" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">对比 2839（只能 j−i=2 相邻换）：单步更自由，可达集合不变，判定看两条轨道的多重集合</text>
</svg>
