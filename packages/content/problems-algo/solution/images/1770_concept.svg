<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每步从两端取一数，状态 = (左取数 i, 右取数 j)</text>

  <!-- ===== nums array with L/R pointers ===== -->
  <text x="40" y="56" font-size="11" fill="#888">nums（两端各有一个游标）:</text>

  <rect x="120" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="166" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="212" y="66" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- L pointer -->
  <text x="142" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">↓ left</text>
  <!-- R pointer -->
  <text x="234" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ right</text>

  <!-- multipliers -->
  <text x="40" y="124" font-size="11" fill="#888">第 k 步用 multipliers[k]:</text>
  <rect x="200" y="110" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">m[k]</text>
  <path d="M 220 136 L 220 150" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Two choices ===== -->
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#666">二选一：</text>

  <!-- Take left -->
  <rect x="60" y="178" width="190" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="198" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">取左端 nums[i]</text>
  <text x="155" y="216" text-anchor="middle" font-size="11" fill="#555">分数 += m[k] × nums[i]</text>
  <text x="155" y="230" text-anchor="middle" font-size="10" fill="#888">左取数 i → i+1</text>

  <!-- Take right -->
  <rect x="310" y="178" width="190" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">取右端 nums[n−1−j]</text>
  <text x="405" y="216" text-anchor="middle" font-size="11" fill="#555">分数 += m[k] × nums[n−1−j]</text>
  <text x="405" y="230" text-anchor="middle" font-size="10" fill="#888">右取数 j → j+1</text>

  <!-- arrows from multiplier to choices -->
  <path d="M 200 150 L 155 176" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 240 150 L 405 176" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== State reduction ===== -->
  <path d="M 280 240 L 280 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="264" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">关键：第 k 步必有 i + j = k（共取 k 个数）</text>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#444">⇒ j = k − i，状态只需 (k, i) 一对，i ∈ [0, k]</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#666">不同状态数 = Σ(k+1) = O(m²)，远小于 2^m 种取法</text>

  <!-- ===== Brute force vs DP ===== -->
  <rect x="40" y="338" width="225" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">暴力：2^m 种取法</text>
  <text x="152" y="378" text-anchor="middle" font-size="11" fill="#555">每步 2 选 1，m=10³ 时</text>
  <text x="152" y="394" text-anchor="middle" font-size="11" fill="#555">≈ 10^301 种，必超时</text>
  <text x="152" y="410" text-anchor="middle" font-size="10" fill="#888">大量子问题重复！</text>

  <rect x="295" y="338" width="225" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="407" y="360" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">DP：O(m²) 个状态</text>
  <text x="407" y="378" text-anchor="middle" font-size="11" fill="#555">不同 (k, i) 组合</text>
  <text x="407" y="394" text-anchor="middle" font-size="11" fill="#555">m=10³ 时 ≈ 5×10^5</text>
  <text x="407" y="410" text-anchor="middle" font-size="10" fill="#888">记忆化 / 滚动数组</text>

  <!-- vs arrow -->
  <text x="280" y="382" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">→</text>
</svg>
