<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="396" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：n = Σ dᵢ·10ⁱ，删零 = 滤掉零系数 + 压实幂次</text>

  <!-- 面板一：按位拆开 -->
  <rect x="20" y="38" width="520" height="210" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="60" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① n = 1020030 按位拆开：零项对多项式毫无贡献</text>

  <!-- 位权标注 -->
  <text x="77" y="78" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">10<tspan dy="-3" font-size="7">6</tspan></text>
  <text x="117" y="78" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">10<tspan dy="-3" font-size="7">5</tspan></text>
  <text x="157" y="78" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">10<tspan dy="-3" font-size="7">4</tspan></text>
  <text x="197" y="78" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">10<tspan dy="-3" font-size="7">3</tspan></text>
  <text x="237" y="78" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">10<tspan dy="-3" font-size="7">2</tspan></text>
  <text x="277" y="78" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">10<tspan dy="-3" font-size="7">1</tspan></text>
  <text x="317" y="78" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">10<tspan dy="-3" font-size="7">0</tspan></text>

  <!-- 原数 digit boxes -->
  <rect x="60" y="86" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="86" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="140" y="86" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="180" y="86" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="220" y="86" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="260" y="86" width="34" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="86" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="77" y="108" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="117" y="108" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="157" y="108" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="197" y="108" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="237" y="108" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="277" y="108" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="317" y="108" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- 零位划叉 -->
  <path d="M 108 94 L 126 112 M 126 94 L 108 112" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 188 94 L 206 112 M 206 94 L 188 112" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 228 94 L 246 112 M 246 94 L 228 112" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75" filter="url(#rough2)"/>
  <path d="M 308 94 L 326 112 M 326 94 L 308 112" stroke="#b85450" stroke-width="1.1" fill="none" opacity="0.75" filter="url(#rough2)"/>

  <!-- 保留位下滑箭头 -->
  <path d="M 77 124 C 77 136, 77 140, 77 154" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 157 124 C 157 140, 117 140, 117 154" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 277 124 C 277 148, 157 142, 157 154" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 结果 boxes -->
  <rect x="60" y="158" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="100" y="158" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="140" y="158" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="77" y="180" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">1</text>
  <text x="117" y="180" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="157" y="180" text-anchor="middle" font-size="13" fill="#2d5a24" filter="url(#rough2)">3</text>

  <!-- 结果位权 -->
  <text x="77" y="212" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">10<tspan dy="-3" font-size="7">2</tspan></text>
  <text x="117" y="212" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">10<tspan dy="-3" font-size="7">1</tspan></text>
  <text x="157" y="212" text-anchor="middle" font-size="10" fill="#2d5a24" filter="url(#rough2)">10<tspan dy="-3" font-size="7">0</tspan></text>

  <!-- 右侧公式 -->
  <text x="352" y="100" font-size="10.5" fill="#33506b" filter="url(#rough2)">n = 1·10<tspan dy="-3.5" font-size="7.5">6</tspan><tspan dy="3.5"> + 2·10</tspan><tspan dy="-3.5" font-size="7.5">4</tspan><tspan dy="3.5"> + 3·10</tspan><tspan dy="-3.5" font-size="7.5">1</tspan></text>
  <text x="352" y="126" font-size="10.5" fill="#33506b" filter="url(#rough2)">删零 ⟹ 滤掉零系数项</text>
  <text x="352" y="152" font-size="10.5" fill="#33506b" filter="url(#rough2)">幂次压实为 10<tspan dy="-3.5" font-size="7.5">2</tspan><tspan dy="3.5">, 10</tspan><tspan dy="-3.5" font-size="7.5">1</tspan><tspan dy="3.5">, 10</tspan><tspan dy="-3.5" font-size="7.5">0</tspan></text>
  <text x="352" y="180" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans = 1·10<tspan dy="-3.5" font-size="7.5">2</tspan><tspan dy="3.5"> + 2·10</tspan><tspan dy="-3.5" font-size="7.5">1</tspan><tspan dy="3.5"> + 3·10</tspan><tspan dy="-3.5" font-size="7.5">0</tspan></text>
  <text x="352" y="206" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 123 ✓</text>

  <text x="36" y="236" font-size="10" fill="#33506b" filter="url(#rough2)">只删不加 ⇒ ans ≤ n ≤ 10<tspan dy="-3" font-size="7">15</tspan><tspan dy="3">，long long 稳稳放下</tspan></text>

  <!-- 面板二：免坑性质 -->
  <rect x="20" y="260" width="520" height="122" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="282" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 三个免坑性质 —— 全由 n ≥ 1 与「只删不加」白送</text>
  <text x="36" y="308" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">• 正整数 ⇒ 最高位 ∈ 1~9 必被保留 ⇒ 滤后至少一位：无空串、无前导零</text>
  <text x="36" y="334" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">• ans ≤ n ≤ 10<tspan dy="-3" font-size="7.5">15</tspan><tspan dy="3"> &lt; 2</tspan><tspan dy="-3" font-size="7.5">63</tspan><tspan dy="3"> ⇒ long long 无溢出；n 是 16 位数，int 连输入都放不下</tspan></text>
  <text x="36" y="360" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">• 逐位 n%10、n/10 一趟剥完：至多 16 轮，算术版只用 res、pw 两个变量</text>
</svg>
