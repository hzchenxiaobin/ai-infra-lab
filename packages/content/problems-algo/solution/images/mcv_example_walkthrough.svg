<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两例命中、一例无公共返回 -1</text>

  <!-- ===== Example 1: [1,2,3] vs [2,4] ===== -->
  <text x="30" y="52" font-size="11.5" fill="#888" font-weight="bold">示例 1</text>
  <!-- nums1 row -->
  <rect x="30" y="58" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="49" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="68" y="58" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="87" y="76" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="106" y="58" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="76" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="30" y="98" font-size="10.5" fill="#446688">nums1</text>
  <!-- nums2 row -->
  <rect x="30" y="104" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="49" y="122" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="68" y="104" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="87" y="122" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="30" y="144" font-size="10.5" fill="#4a7a3a">nums2</text>
  <text x="170" y="76" font-size="11.5" fill="#446688">①1&lt;2→i++</text>
  <text x="170" y="122" font-size="11.5" fill="#b85450" font-weight="bold">②2=2→返回 2</text>
  <text x="380" y="100" font-size="12.5" fill="#b85450" font-weight="bold">→ 2</text>

  <!-- ===== Example 2: [1,2,3,6] vs [2,3,4,5] ===== -->
  <text x="30" y="178" font-size="11.5" fill="#888" font-weight="bold">示例 2</text>
  <rect x="30" y="184" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="202" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <rect x="64" y="184" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="202" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>
  <rect x="98" y="184" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="202" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <rect x="132" y="184" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="149" y="202" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">6</text>
  <text x="30" y="224" font-size="10.5" fill="#446688">nums1</text>
  <rect x="30" y="230" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="47" y="248" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>
  <rect x="64" y="230" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="81" y="248" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <rect x="98" y="230" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="248" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>
  <rect x="132" y="230" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="149" y="248" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5</text>
  <text x="30" y="270" font-size="10.5" fill="#4a7a3a">nums2</text>
  <text x="180" y="202" font-size="11.5" fill="#446688">①1&lt;2→i++</text>
  <text x="180" y="248" font-size="11.5" fill="#b85450" font-weight="bold">②2=2→返回 2（3 虽公共但非最小）</text>
  <text x="460" y="226" font-size="12.5" fill="#b85450" font-weight="bold">→ 2</text>

  <!-- ===== Example 3: no common [1,2] vs [3,4] ===== -->
  <text x="30" y="302" font-size="11.5" fill="#888" font-weight="bold">无公共</text>
  <rect x="80" y="290" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="94" y="306" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="108" y="290" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="122" y="306" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="155" y="306" font-size="11" fill="#888">vs</text>
  <rect x="180" y="290" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="194" y="306" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="208" y="290" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="222" y="306" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="250" y="306" font-size="11" fill="#446688">1&lt;3, 2&lt;3 → nums1 耗尽</text>
  <text x="430" y="306" font-size="12" fill="#666" font-weight="bold">→ -1</text>

  <!-- summary -->
  <rect x="30" y="320" width="480" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="10.5" fill="#555">归并沿值非降序推进，首次相等即最小公共值；某侧耗尽即无公共 → -1</text>
</svg>
