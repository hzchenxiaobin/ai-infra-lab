<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 11 (1011)，3 次迭代</text>

  <!-- ===== Row 0: count=0, n=11=1011 ===== -->
  <rect x="34" y="60" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 0</text>
  <text x="140" y="80" font-size="12.5" fill="#446688" font-weight="bold">n = 11</text>
  <!-- bits 1011, bit0 = lowest set bit (highlight) -->
  <rect x="180" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="330" y="58" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="80" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="384" y="80" font-size="10.5" fill="#b85450" font-weight="bold">↑ 最低设置位</text>

  <!-- arrow 1 -->
  <path d="M 251 94 Q 251 104 251 112" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="106" font-size="10.5" fill="#888">n &amp;= n−1（抹掉 bit0）</text>

  <!-- ===== Row 1: count=1, n=10=1010 ===== -->
  <rect x="34" y="120" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 1</text>
  <text x="140" y="140" font-size="12.5" fill="#446688" font-weight="bold">n = 10</text>
  <rect x="180" y="118" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="140" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="118" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="140" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="118" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="140" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="330" y="118" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="140" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="384" y="140" font-size="10.5" fill="#b85450" font-weight="bold">↑ 最低设置位</text>

  <!-- arrow 2 -->
  <path d="M 301 154 Q 301 163 301 171" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="165" font-size="10.5" fill="#888">n &amp;= n−1（抹掉 bit1）</text>

  <!-- ===== Row 2: count=2, n=8=1000 ===== -->
  <rect x="34" y="180" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 2</text>
  <text x="140" y="200" font-size="12.5" fill="#446688" font-weight="bold">n = 8</text>
  <rect x="180" y="178" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="200" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="230" y="178" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="200" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="178" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="200" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="178" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="200" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="384" y="200" font-size="10.5" fill="#b85450" font-weight="bold">↑ 最低设置位</text>

  <!-- arrow 3 -->
  <path d="M 201 214 Q 201 223 201 231" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="225" font-size="10.5" fill="#888">n &amp;= n−1（抹掉 bit3）</text>

  <!-- ===== Row 3: count=3, n=0=0000 ===== -->
  <rect x="34" y="240" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="77" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 3</text>
  <text x="140" y="260" font-size="12.5" fill="#888" font-weight="bold">n = 0</text>
  <rect x="180" y="238" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="201" y="260" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <rect x="230" y="238" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="260" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <rect x="280" y="238" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="301" y="260" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <rect x="330" y="238" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="351" y="260" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <text x="384" y="260" font-size="11" fill="#888" font-weight="bold">n = 0，停止 ✓</text>

  <!-- arrow to result -->
  <path d="M 201 274 Q 201 290 201 298" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="80" y="304" width="380" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="327" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">循环 3 次 = 有 3 个 1，返回 count = 3</text>

  <!-- bottom note -->
  <rect x="60" y="356" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">每次抹掉一个最低设置位，跳过所有 0 位</text>
  <text x="270" y="392" text-anchor="middle" font-size="11" fill="#d6a040">比逐位移位固定 32 次更快：循环次数 = popcount(n)</text>
</svg>
