<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">UTF-8 校验：顺序扫描 + 状态判定流程</text>

  <!-- Start -->
  <rect x="220" y="44" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#333">i = 0</text>

  <path d="M 270 76 L 270 96" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision1: i < n? -->
  <rect x="210" y="100" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <path d="M 330 120 L 400 120" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="115" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="400" y="105" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="455" y="125" text-anchor="middle" font-size="12" fill="#333">return true</text>

  <path d="M 270 140 L 270 162" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="156" font-size="10" fill="#4a7a3a">是</text>

  <!-- Process: determine k -->
  <rect x="170" y="166" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="12" fill="#333">按首字节前导位判定字节数 k</text>
  <text x="270" y="198" text-anchor="middle" font-size="10" fill="#666">0xx→1, 110x→2, 1110→3, 11110→4</text>

  <path d="M 270 206 L 270 228" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision2: k valid? -->
  <rect x="200" y="232" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="257" text-anchor="middle" font-size="12" fill="#333">k ∈ {1,2,3,4} ?</text>

  <path d="M 340 252 L 400 252" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="247" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="400" y="237" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="455" y="257" text-anchor="middle" font-size="12" fill="#333">return false</text>

  <path d="M 270 272 L 270 294" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="288" font-size="10" fill="#4a7a3a">是</text>

  <!-- Decision3: continuation bytes -->
  <rect x="160" y="298" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#333">i+k ≤ n 且后续 k−1 字节</text>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#333">均为 10xxxxxx ?</text>

  <path d="M 380 323 L 400 323" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="400" y="308" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="455" y="328" text-anchor="middle" font-size="12" fill="#333">return false</text>

  <path d="M 270 348 L 270 370" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="364" font-size="10" fill="#4a7a3a">是</text>

  <!-- Process: i += k -->
  <rect x="220" y="374" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="394" text-anchor="middle" font-size="12" fill="#333">i += k</text>

  <!-- Loop back arrow -->
  <path d="M 270 404 L 270 425 L 80 425 L 80 120 L 210 120" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="440" font-size="10" fill="#446688">循环：处理下一字符</text>
</svg>
