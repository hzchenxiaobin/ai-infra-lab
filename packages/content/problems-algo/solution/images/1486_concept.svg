<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：元素是等差数列，滚动异或无需建数组</text>

  <!-- nums label -->
  <text x="35" y="80" font-size="11.5" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="35" y="94" font-size="10" fill="#888">= start+2i</text>

  <!-- nums cells: 0, 2, 4, 6, 8  (n=5,start=0) -->
  <rect x="70" y="58" width="78" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="109" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">0</text>
  <text x="109" y="52" text-anchor="middle" font-size="10" fill="#446688">i=0</text>

  <rect x="170" y="58" width="78" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="209" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">2</text>
  <text x="209" y="52" text-anchor="middle" font-size="10" fill="#446688">i=1</text>

  <rect x="270" y="58" width="78" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="309" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">4</text>
  <text x="309" y="52" text-anchor="middle" font-size="10" fill="#446688">i=2</text>

  <rect x="370" y="58" width="78" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="409" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">6</text>
  <text x="409" y="52" text-anchor="middle" font-size="10" fill="#446688">i=3</text>

  <rect x="470" y="58" width="78" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="509" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">8</text>
  <text x="509" y="52" text-anchor="middle" font-size="10" fill="#446688">i=4</text>

  <!-- ans label -->
  <text x="35" y="222" font-size="11.5" fill="#4a7a3a" font-weight="bold">ans</text>
  <text x="35" y="236" font-size="10" fill="#888">滚动异或</text>

  <!-- ans cells: 0, 2, 6, 0, 8 -->
  <rect x="70" y="200" width="78" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="109" y="225" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">0</text>
  <text x="109" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a">0^0</text>

  <rect x="170" y="200" width="78" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="209" y="225" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">2</text>
  <text x="209" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a">0^2</text>

  <rect x="270" y="200" width="78" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="309" y="225" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">6</text>
  <text x="309" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a">2^4</text>

  <rect x="370" y="200" width="78" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="409" y="225" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">0</text>
  <text x="409" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a">6^6</text>

  <rect x="470" y="200" width="78" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="509" y="225" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold">8</text>
  <text x="509" y="194" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0^8</text>

  <!-- vertical dashed arrows: nums[i] folds into ans -->
  <path d="M 109 98 L 109 200" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 209 98 L 209 200" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 309 98 L 309 200" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 409 98 L 409 200" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 509 98 L 509 200" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- horizontal carry arrows between ans cells -->
  <path d="M 148 240 Q 160 270 170 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 248 240 Q 260 270 270 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 348 240 Q 360 270 370 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 448 240 Q 460 270 470 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- formula note box -->
  <rect x="60" y="300" width="480" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">滚动异或（一趟遍历，O(1) 空间）</text>
  <text x="300" y="346" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">ans = 0</text>
  <text x="300" y="366" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">ans ^= start + 2*i   （i = 0..n−1）</text>
  <text x="300" y="384" text-anchor="middle" font-size="10" fill="#888">无需数组存储：元素随用随算，ans 即时折叠 → O(n) 时间 / O(1) 空间</text>
</svg>
