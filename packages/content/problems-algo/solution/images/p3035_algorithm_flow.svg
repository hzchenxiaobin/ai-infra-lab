<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 求总对数 → 造价升序贪心扣减</text>

  <rect x="110" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="69" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 统计全部字符频率 freq[26]</text>
  <path d="M 230 84 L 230 106" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="110" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="135" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 总对数 Q = Σ freq[c] / 2</text>
  <path d="M 230 150 L 230 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="176" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="201" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 词长升序排序（造价从低到高）</text>
  <path d="M 230 216 L 230 238" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="230,242 330,284 230,326 130,284" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="281" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Q ≥ ⌊L/2⌋ ？</text>
  <text x="230" y="301" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（预算够这个词的造价吗）</text>

  <path d="M 230 326 L 230 348" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="242" y="342" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="100" y="352" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="377" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Q −= ⌊L/2⌋；ans++</text>

  <path d="M 100 372 L 52 372 L 52 284 L 124 284" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="52" y="336" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">下一个词</text>

  <path d="M 330 284 L 406 284 L 406 306" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="348" y="276" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="342" y="310" width="156" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="333" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">break</text>
  <text x="420" y="351" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">后面造价只会更高</text>
  <text x="420" y="366" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">必然也不够</text>

  <path d="M 230 392 L 230 414" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="130" y="418" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="443" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">return ans</text>
</svg>
