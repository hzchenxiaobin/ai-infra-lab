<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">有序数组按 i 分裂：左减右加，绝对值可去</text>

  <!-- Array cells: [1, 4, 6, 8, 10], index 2 highlighted -->
  <!-- Left cells (blue) -->
  <rect x="80" y="80" width="60" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="112" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <text x="110" y="148" text-anchor="middle" font-size="10" fill="#888">j=0</text>

  <rect x="140" y="80" width="60" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="112" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">4</text>
  <text x="170" y="148" text-anchor="middle" font-size="10" fill="#888">j=1</text>

  <!-- Center cell (orange, highlighted) -->
  <rect x="200" y="76" width="64" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="112" text-anchor="middle" font-size="20" fill="#a87020" font-weight="bold">6</text>
  <text x="232" y="150" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">i=2</text>

  <!-- Right cells (green) -->
  <rect x="264" y="80" width="60" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="294" y="112" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">8</text>
  <text x="294" y="148" text-anchor="middle" font-size="10" fill="#888">j=3</text>

  <rect x="324" y="80" width="60" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="354" y="112" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">10</text>
  <text x="354" y="148" text-anchor="middle" font-size="10" fill="#888">j=4</text>

  <!-- Left bracket: nums[j] ≤ nums[i] -->
  <path d="M 80 165 L 80 175 L 200 175" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="194" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">左侧：nums[j] ≤ nums[i]</text>
  <text x="140" y="212" text-anchor="middle" font-size="11" fill="#446688">|nums[i]−nums[j]| = nums[i] − nums[j]</text>

  <!-- Right bracket: nums[j] ≥ nums[i] -->
  <path d="M 264 165 L 384 165 L 384 175" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="324" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">右侧：nums[j] ≥ nums[i]</text>
  <text x="324" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a">|nums[i]−nums[j]| = nums[j] − nums[i]</text>

  <!-- divider -->
  <path d="M 40 235 L 520 235" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula breakdown -->
  <rect x="50" y="250" width="460" height="115" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>

  <text x="280" y="274" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">result[i] = Σ_{j&lt;i}(nums[i]−nums[j]) + Σ_{j&gt;i}(nums[j]−nums[i])</text>

  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#446688">左 = i·nums[i] − leftSum</text>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a">右 = rightSum − (n−1−i)·nums[i]</text>

  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">result[i] = total − 2·prefix[i] + (2i − n)·nums[i]</text>
</svg>
