<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="350" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：合并 + 搬零 两阶段，各一趟扫描</text>

  <!-- ===== Row A: input ===== -->
  <text x="76" y="72" text-anchor="end" font-size="11" fill="#555" font-weight="bold">输入</text>
  <g filter="url(#rough2)">
    <rect x="153" y="50" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="203" y="50" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="253" y="50" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="303" y="50" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="353" y="50" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="403" y="50" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="175" y="74" filter="url(#rough2)">1</text>
    <text x="225" y="74" filter="url(#rough2)">2</text>
    <text x="275" y="74" filter="url(#rough2)">2</text>
    <text x="325" y="74" filter="url(#rough2)">1</text>
    <text x="375" y="74" filter="url(#rough2)">1</text>
    <text x="425" y="74" filter="url(#rough2)">0</text>
  </g>

  <!-- arrow + phase1 label -->
  <path d="M 300 92 L 300 112" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="150" y="100" width="300" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.85"/>
  <text x="300" y="116" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">阶段① 顺序合并相邻相等（i: 0 → n−2）</text>

  <!-- ===== Row B: after merge ===== -->
  <text x="76" y="158" text-anchor="end" font-size="11" fill="#555" font-weight="bold">合并后</text>
  <g filter="url(#rough2)">
    <rect x="153" y="136" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="203" y="136" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="253" y="136" width="44" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="303" y="136" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="353" y="136" width="44" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="403" y="136" width="44" height="38" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="175" y="160" filter="url(#rough2)">1</text>
    <text x="225" y="160" fill="#4a7a3a" filter="url(#rough2)">4</text>
    <text x="275" y="160" fill="#b85450" filter="url(#rough2)">0</text>
    <text x="325" y="160" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <text x="375" y="160" fill="#b85450" filter="url(#rough2)">0</text>
    <text x="425" y="160" fill="#888" filter="url(#rough2)">0</text>
  </g>

  <!-- arrow + phase2 label -->
  <path d="M 300 178 L 300 198" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="150" y="186" width="300" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.85"/>
  <text x="300" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">阶段② 读写双指针搬零（同 283 移动零）</text>

  <!-- ===== Row C: final ===== -->
  <text x="76" y="244" text-anchor="end" font-size="11" fill="#555" font-weight="bold">搬零后</text>
  <g filter="url(#rough2)">
    <rect x="153" y="222" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="203" y="222" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="253" y="222" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="303" y="222" width="44" height="38" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4"/>
    <rect x="353" y="222" width="44" height="38" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4"/>
    <rect x="403" y="222" width="44" height="38" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="175" y="246" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="225" y="246" fill="#4a7a3a" filter="url(#rough2)">4</text>
    <text x="275" y="246" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <text x="325" y="246" fill="#888" filter="url(#rough2)">0</text>
    <text x="375" y="246" fill="#888" filter="url(#rough2)">0</text>
    <text x="425" y="246" fill="#888" filter="url(#rough2)">0</text>
  </g>

  <!-- partition brackets -->
  <path d="M 153 266 L 153 272 L 297 272 L 297 266" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="225" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[0, slow) 非零 · 保序</text>
  <path d="M 303 266 L 303 272 L 447 272 L 447 266" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="375" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[slow, n) 全零</text>

  <!-- bottom note -->
  <rect x="150" y="304" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="300" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">两阶段相互独立，各 O(n)；合起来 O(n) 时间 / O(1) 空间</text>
</svg>
