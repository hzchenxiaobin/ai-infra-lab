<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单淘汰赛赛程结构（n=8）：每轮强队 vs 弱队</text>

  <!-- Round labels (left) -->
  <text x="28" y="88" font-size="11" fill="#888">决赛 R3</text>
  <text x="28" y="198" font-size="11" fill="#888">半决赛 R2</text>
  <text x="28" y="318" font-size="11" fill="#888">首轮 R1</text>

  <!-- Round 3: Final -->
  <rect x="170" y="68" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="10" fill="#333">(((1,8),(4,5)),((2,7),(3,6)))</text>

  <!-- Round 2: Semi 1 -->
  <rect x="60" y="180" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="200" text-anchor="middle" font-size="11" fill="#333">((1,8),(4,5))</text>

  <!-- Round 2: Semi 2 -->
  <rect x="370" y="180" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="200" text-anchor="middle" font-size="11" fill="#333">((2,7),(3,6))</text>

  <!-- Connecting lines: R3 -> R2 -->
  <path d="M 280 102 L 280 135 L 125 135 L 125 180" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 102 L 280 135 L 435 135 L 435 180" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Round 1: Match 1 (1,8) -->
  <rect x="25" y="300" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="320" text-anchor="middle" font-size="12" fill="#333">(1,8)</text>

  <!-- Round 1: Match 2 (4,5) -->
  <rect x="130" y="300" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="165" y="320" text-anchor="middle" font-size="12" fill="#333">(4,5)</text>

  <!-- Round 1: Match 3 (2,7) -->
  <rect x="360" y="300" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="395" y="320" text-anchor="middle" font-size="12" fill="#333">(2,7)</text>

  <!-- Round 1: Match 4 (3,6) -->
  <rect x="465" y="300" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="320" text-anchor="middle" font-size="12" fill="#333">(3,6)</text>

  <!-- Connecting lines: R2 Semi1 -> R1 -->
  <path d="M 125 210 L 125 260 L 60 260 L 60 300" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 125 210 L 125 260 L 165 260 L 165 300" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Connecting lines: R2 Semi2 -> R1 -->
  <path d="M 435 210 L 435 260 L 395 260 L 395 300" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 435 210 L 435 260 L 500 260 L 500 300" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Pairing arcs below R1: show 1↔8, 4↔5, 2↔7, 3↔6 -->
  <path d="M 60 332 Q 60 350 60 350" stroke="#b85450" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="60" y="348" text-anchor="middle" font-size="9" fill="#b85450">1↔8</text>
  <text x="165" y="348" text-anchor="middle" font-size="9" fill="#b85450">4↔5</text>
  <text x="395" y="348" text-anchor="middle" font-size="9" fill="#b85450">2↔7</text>
  <text x="500" y="348" text-anchor="middle" font-size="9" fill="#b85450">3↔6</text>

  <!-- Bottom annotation -->
  <rect x="70" y="365" width="420" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="280" y="383" text-anchor="middle" font-size="11" fill="#b85450">每轮配对：team[i] ↔ team[n−1−i]，胜者（小号）保留到 team[i]</text>
</svg>
