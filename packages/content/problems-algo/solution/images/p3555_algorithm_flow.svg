<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">单调栈预处理 + 双向懒删除堆，O(n log n)</text>

  <!-- 预处理 -->
  <rect x="120" y="34" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">单调栈预处理（一次性，O(n)）</text>
  <text x="260" y="67" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">ns[i]：右侧第一个更小；pg[j]：左侧第一个更大 → 按值分桶</text>

  <path d="M 250 74 L 148 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 74 L 372 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 正向趟 -->
  <rect x="30" y="96" width="230" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">正向趟：r = 0 → n−1，求 a[l]</text>

  <rect x="30" y="130" width="230" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="151" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ns_bucket[r] 的下标全部压入小根堆</text>

  <path d="M 145 164 L 145 174" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <polygon points="145,176 200,198 145,220 90,198" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">r ≥ k−1</text>
  <text x="145" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">（有窗口可查？）</text>

  <path d="M 145 220 L 145 230" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="158" y="229" font-size="9.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 90 198 L 14 198 L 14 147 L 26 147" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="190" font-size="9.5" fill="#888" filter="url(#rough2)">否：r 继续滑</text>

  <rect x="30" y="232" width="230" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="248" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">l = r−k+1；弹出堆顶所有 &lt; l 的下标</text>
  <text x="145" y="264" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">堆顶若非空即 a[l]</text>

  <!-- 反向趟 -->
  <rect x="290" y="96" width="230" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">反向趟：l = n−1 → 0，求 b[l]</text>

  <rect x="290" y="130" width="230" height="34" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="151" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pg_bucket[l] 的下标全部压入大根堆</text>

  <path d="M 405 164 L 405 174" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>

  <polygon points="405,176 460,198 405,220 350,198" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">l ≤ n−k</text>
  <text x="405" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">（有窗口可查？）</text>

  <path d="M 405 220 L 405 230" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="418" y="229" font-size="9.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 460 198 L 506 198 L 506 147 L 494 147" fill="none" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="190" font-size="9.5" fill="#888" filter="url(#rough2)">否：l 继续滑</text>

  <rect x="290" y="232" width="230" height="40" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="248" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">r = l+k−1；弹出堆顶所有 &gt; r 的下标</text>
  <text x="405" y="264" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">堆顶若非空即 b[l]</text>

  <!-- 汇总 -->
  <path d="M 145 272 L 145 286 L 300 286" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 405 272 L 405 286 L 300 286" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 300 286 L 300 294" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,298 360,322 300,346 240,322" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="319" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">a[l]、b[l]</text>
  <text x="300" y="332" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">都存在？</text>

  <path d="M 360 322 L 420 322" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="314" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">是</text>
  <rect x="422" y="304" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">b−a+1</text>

  <path d="M 240 322 L 180 322" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="314" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="92" y="304" width="86" height="36" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#777" filter="url(#rough2)">0</text>

  <!-- 底注 -->
  <rect x="70" y="358" width="380" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">每个下标至多入堆一次、出堆一次 ⇒ 两趟合计 O(n log n)</text>
</svg>
