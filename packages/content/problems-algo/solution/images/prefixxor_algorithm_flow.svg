<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="470" height="420" fill="#fafafa"/>

  <text x="235" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历，相邻异或还原 arr</text>

  <!-- start -->
  <ellipse cx="235" cy="52" rx="38" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="57" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 235,69 L 235,84" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arr[0] = pref[0] -->
  <rect x="140" y="86" width="190" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="235" y="110" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">arr[0] ← pref[0]   （首元素直接复制）</text>

  <path d="M 235,124 L 235,138" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = 1 -->
  <rect x="180" y="140" width="110" height="34" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="235" y="162" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">i ← 1</text>

  <path d="M 235,174 L 235,184" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond i < n ? -->
  <polygon points="235,186 312,220 235,254 158,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="225" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">i &lt; n ?</text>

  <!-- No branch: right -->
  <path d="M 312,220 L 345,220" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="350" y="202" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="396" y="225" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 arr</text>
  <path d="M 396,238 L 396,258" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="396" cy="278" rx="34" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="283" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- Yes branch: down -->
  <path d="M 235,254 L 235,268" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="266" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- arr[i] = pref[i] ^ pref[i-1] -->
  <rect x="110" y="270" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="235" y="295" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">arr[i] ← pref[i] ⊕ pref[i−1]</text>

  <path d="M 235,310 L 235,322" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = i + 1 -->
  <rect x="175" y="324" width="120" height="34" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="235" y="346" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">i ← i + 1</text>

  <!-- loop back to diamond left -->
  <path d="M 235,358 L 235,380 L 120,380 L 120,220 L 156,220" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="300" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">回判 i&lt;n</text>
</svg>
