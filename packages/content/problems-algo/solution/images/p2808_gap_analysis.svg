<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">环形数组的间隙分析：枚举目标值 x，取最大间隙的一半</text>

  <!-- position labels -->
  <text x="126" y="52" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="170" y="52" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="214" y="52" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">2</text>
  <text x="258" y="52" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">3</text>
  <text x="302" y="52" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">4</text>
  <text x="346" y="52" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">5</text>
  <text x="390" y="52" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">6</text>
  <text x="434" y="52" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">7</text>

  <!-- cells row -->
  <rect x="104" y="58" width="44" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">a</text>
  <rect x="148" y="58" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="83" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="192" y="58" width="44" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">b</text>
  <rect x="236" y="58" width="44" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">c</text>
  <rect x="280" y="58" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="83" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="324" y="58" width="44" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">d</text>
  <rect x="368" y="58" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="83" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="412" y="58" width="44" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="83" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">e</text>

  <!-- circular indicator: arrow from last to first -->
  <path d="M 456 78 L 480 78" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 104 78 L 80 78" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 80 78 C 50 78, 50 78, 50 90 C 50 102, 50 102, 80 102" stroke="none" fill="none" filter="url(#rough2)"/>
  <path d="M 480 78 C 510 78, 510 78, 510 90 C 510 102, 510 102, 480 102" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <path d="M 80 102 L 104 102" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="115" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">环形</text>

  <!-- gap 1 bracket (pos 1 -> pos 4): gap = 3, MAX -->
  <path d="M 170 108 L 170 116 L 302 116 L 302 108" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="236" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">gap₁ = 3 ★max</text>

  <!-- gap 2 bracket (pos 4 -> pos 6): gap = 2 -->
  <path d="M 302 108 L 302 148 L 390 148 L 390 108" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="346" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">gap₂ = 2</text>

  <!-- wrap gap bracket (pos 6 -> pos 1 + n): gap = 3, MAX -->
  <path d="M 390 108 L 390 180 L 170 180 L 170 108" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">wrap gap = (1 + 8) − 6 = 3 ★max</text>

  <!-- formula box -->
  <rect x="50" y="226" width="460" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="250" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">对值 x 的计算：</text>
  <text x="64" y="270" font-size="12" fill="#555" filter="url(#rough2)">① 收集 x 的所有出现位置 → [1, 4, 6]</text>
  <text x="64" y="290" font-size="12" fill="#555" filter="url(#rough2)">② 计算相邻位置间距（含首尾环绕）→ [3, 2, 3]</text>
  <text x="64" y="310" font-size="12" fill="#555" filter="url(#rough2)">③ 取最大间距 max_gap = 3，ans(x) = floor(3 / 2) = 1</text>
  <text x="64" y="330" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终答案 = min(ans(x)) 遍历所有 x</text>
</svg>
