<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "abcyy"，t = 2</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">只列出非零列；每轮 = 右移一格 + z 分裂进 a、b（其余 21 列恒 0，略）</text>

  <!-- 表头 -->
  <text x="70" y="74" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">状态</text>
  <g font-size="11" fill="#666" font-weight="bold">
    <text x="140" y="74" text-anchor="middle" filter="url(#rough2)">a</text>
    <text x="180" y="74" text-anchor="middle" filter="url(#rough2)">b</text>
    <text x="220" y="74" text-anchor="middle" filter="url(#rough2)">c</text>
    <text x="260" y="74" text-anchor="middle" filter="url(#rough2)">d</text>
    <text x="300" y="74" text-anchor="middle" filter="url(#rough2)">e</text>
    <text x="340" y="74" text-anchor="middle" filter="url(#rough2)">y</text>
    <text x="380" y="74" text-anchor="middle" filter="url(#rough2)">z</text>
  </g>
  <text x="450" y="74" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">总长</text>

  <!-- 行 1：初始 -->
  <text x="70" y="108" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="128" y="88" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="168" y="88" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="208" y="88" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="328" y="88" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="105" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="428" y="88" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="105" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 右移箭头 行1->行2 -->
  <path d="M 88 116 L 88 130" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="128" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">y→z</text>

  <!-- 行 2：t=1 -->
  <text x="70" y="146" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">t=1</text>
  <rect x="168" y="126" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="208" y="126" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="248" y="126" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="368" y="126" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="143" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="428" y="126" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="143" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- 分裂箭头 行2->行3 -->
  <path d="M 380 150 C 380 172, 150 164, 142 158" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 150 C 380 176, 190 168, 182 158" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="172" text-anchor="middle" font-size="9.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">z×2 一分为二 → a×2 + b×2</text>

  <!-- 行 3：t=2 -->
  <text x="70" y="186" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">t=2</text>
  <rect x="128" y="166" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="183" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="168" y="166" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="183" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="208" y="166" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="248" y="166" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="288" y="166" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="428" y="166" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="183" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- 对应字符串备注 -->
  <rect x="30" y="206" width="460" height="60" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">· 对照真实字符串（本题根本不用真的展开，此处仅供核对）：</text>
  <text x="44" y="246" font-size="10.5" fill="#555" filter="url(#rough2)">  "abcyy" → "bcdzz" → "cdeabab"，长度 5 → 5 → 7，与计数表逐列吻合 ✓</text>

  <!-- 增长解读 -->
  <rect x="30" y="278" width="460" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="298" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">💡 长度为什么涨：每轮增量 = 上一轮 cnt[z]</text>
  <text x="44" y="316" font-size="10.5" fill="#a07830" filter="url(#rough2)">· t=1 轮 z 有 2 个 → t=2 轮长度 5+2=7；分裂像细胞繁殖，z 数量按 fib 型滚动增长</text>
  <text x="44" y="334" font-size="10.5" fill="#a07830" filter="url(#rough2)">· t 大时长度指数爆炸 —— 这正是暴力必须淘汰、计数 DP 登场的原因（见 2.1）</text>
</svg>
