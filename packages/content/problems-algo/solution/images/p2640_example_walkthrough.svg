<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 3, 7, 5, 10]</text>

  <!-- Header row -->
  <rect x="40" y="44" width="90" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="64" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">步 i</text>

  <rect x="130" y="44" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>

  <rect x="220" y="44" width="90" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="64" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">max(0..i)</text>

  <rect x="310" y="44" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">conver[i]</text>

  <rect x="400" y="44" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="460" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans[i] = 前缀和</text>

  <!-- Row 0: i=0 -->
  <rect x="40" y="76" width="90" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="130" y="76" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="220" y="76" width="90" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="310" y="76" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2+2=4</text>
  <rect x="400" y="76" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Row 1: i=1 -->
  <rect x="40" y="110" width="90" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="110" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="220" y="110" width="90" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="310" y="110" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3+3=6</text>
  <rect x="400" y="110" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4+6=10</text>

  <!-- Row 2: i=2 -->
  <rect x="40" y="144" width="90" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="144" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="220" y="144" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="165" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7 ↑</text>
  <rect x="310" y="144" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7+7=14</text>
  <rect x="400" y="144" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10+14=24</text>

  <!-- Row 3: i=3 -->
  <rect x="40" y="178" width="90" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="199" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="130" y="178" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="199" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="220" y="178" width="90" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="199" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="310" y="178" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="199" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5+7=12</text>
  <rect x="400" y="178" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="199" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">24+12=36</text>

  <!-- Row 4: i=4 -->
  <rect x="40" y="212" width="90" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="212" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="233" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="220" y="212" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="233" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10 ↑</text>
  <rect x="310" y="212" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="233" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10+10=20</text>
  <rect x="400" y="212" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="233" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">36+20=56</text>

  <!-- Result annotation -->
  <rect x="40" y="264" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="286" font-size="12" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#b85450">结果</tspan>：ans = [4, 10, 24, 36, 56] ⭐　每步只需维护 max 和累加和，一次遍历完成</text>

  <!-- Note -->
  <rect x="40" y="304" width="480" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="50" y="323" font-size="11" fill="#888" filter="url(#rough2)">conver[i] = nums[i] + max(nums[0..i])；ans[i] = ans[i-1] + conver[i]（前缀和）</text>
</svg>
