<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    拓扑序 + 颜色计数 DP 沿边传递
  </text>

  <!-- 节点 0 (a) -->
  <circle cx="70" cy="190" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="196" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="70" y="232" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">节点 0</text>

  <!-- 节点 1 (b) -->
  <circle cx="230" cy="90" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="96" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">b</text>
  <text x="230" y="56" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">节点 1</text>

  <!-- 节点 2 (a) -->
  <circle cx="230" cy="290" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="230" y="296" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="230" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">节点 2</text>

  <!-- 节点 3 (c) -->
  <circle cx="380" cy="290" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="296" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">c</text>
  <text x="380" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">节点 3</text>

  <!-- 节点 4 (a) -->
  <circle cx="500" cy="290" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="500" y="296" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="500" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">节点 4</text>

  <!-- 边 0->1 -->
  <path d="M92,178 Q160,120 200,100" fill="none" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 边 0->2 (高亮主路径) -->
  <path d="M88,202 Q160,250 200,278" fill="none" stroke="#b85450" stroke-width="2.4"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 边 2->3 (高亮) -->
  <path d="M256,290 L354,290" fill="none" stroke="#b85450" stroke-width="2.4"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 边 3->4 (高亮) -->
  <path d="M406,290 L474,290" fill="none" stroke="#b85450" stroke-width="2.4"
        marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 计数小框：每个节点下方显示 count[a] -->
  <rect x="44" y="140" width="52" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a:1</text>

  <rect x="204" y="120" width="52" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="135" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a:1</text>

  <rect x="204" y="240" width="52" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a:2</text>

  <rect x="354" y="240" width="52" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a:2</text>

  <rect x="474" y="240" width="52" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="500" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a:3 ★</text>

  <!-- 说明框 -->
  <rect x="120" y="356" width="380" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="370" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">
    沿边传递：count[v][c] = max(count[v][c], count[u][c])
  </text>
</svg>
