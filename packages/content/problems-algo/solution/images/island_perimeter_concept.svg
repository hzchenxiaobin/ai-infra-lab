<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：每块陆地 4 条边，每对相邻共享边 −2</text>

  <!-- ① single land cell -->
  <text x="40" y="64" font-size="12" fill="#446688" font-weight="bold">① 单块陆地 = 4 条边</text>
  <rect x="70" y="78" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <line x1="70" y1="78" x2="118" y2="78" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="118" y1="78" x2="118" y2="126" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="70" y1="126" x2="118" y2="126" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="70" y1="78" x2="70" y2="126" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <text x="94" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">陆</text>
  <text x="132" y="106" font-size="11" fill="#446688">4 条边</text>

  <text x="160" y="108" font-size="18" fill="#d6a040" font-weight="bold">→</text>

  <!-- ② two adjacent cells -->
  <text x="200" y="64" font-size="12" fill="#446688" font-weight="bold">② 两块相邻 → 共享 1 边 −2</text>
  <rect x="200" y="78" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="248" y="78" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <line x1="200" y1="78" x2="296" y2="78" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="200" y1="126" x2="296" y2="126" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="200" y1="78" x2="200" y2="126" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="296" y1="78" x2="296" y2="126" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="248" y1="78" x2="248" y2="126" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="240" y1="72" x2="256" y2="132" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">陆</text>
  <text x="272" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">陆</text>
  <text x="312" y="98" font-size="11" fill="#b85450">共享边</text>
  <text x="312" y="116" font-size="11" fill="#b85450" font-weight="bold">−2</text>

  <!-- divider -->
  <path d="M 40 152 L 500 152" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ③ only check left/up -->
  <text x="40" y="178" font-size="12" fill="#446688" font-weight="bold">③ 只查左邻 / 上邻，每对相邻只扣一次</text>

  <!-- left neighbor demo -->
  <rect x="70" y="196" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="94" y="226" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">陆</text>
  <text x="94" y="188" text-anchor="middle" font-size="10" fill="#888">左邻</text>
  <rect x="118" y="196" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8" rx="2" filter="url(#rough2)"/>
  <text x="142" y="226" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">陆</text>
  <text x="142" y="188" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">当前</text>
  <line x1="166" y1="220" x2="190" y2="220" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="196" y="224" font-size="11" fill="#b85450" font-weight="bold">−2</text>

  <!-- up neighbor demo -->
  <rect x="320" y="196" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="344" y="226" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">陆</text>
  <text x="344" y="188" text-anchor="middle" font-size="10" fill="#888">上邻</text>
  <rect x="320" y="244" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8" rx="2" filter="url(#rough2)"/>
  <text x="344" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">陆</text>
  <text x="344" y="306" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">当前</text>
  <line x1="376" y1="268" x2="400" y2="268" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="406" y="272" font-size="11" fill="#b85450" font-weight="bold">−2</text>

  <!-- formula box -->
  <rect x="40" y="312" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">周长 = 4 × 陆地块数 − 2 × 相邻对数</text>
  <text x="270" y="346" text-anchor="middle" font-size="10.5" fill="#555">只查左/上邻：每对相邻统计一次，不重复</text>
</svg>
