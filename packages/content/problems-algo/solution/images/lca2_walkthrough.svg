<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：p=5, q=4（q 在 p 子树内）</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">后序遍历顺序编号 ①-⑨，count 逐步累加</text>

  <!-- ===== Tree ===== -->
  <!-- 3 -->
  <circle cx="290" cy="78" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="312" y="74" font-size="9" fill="#888">⑨</text>

  <!-- 5 = p -->
  <circle cx="240" cy="128" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="240" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="262" y="124" font-size="9" fill="#4a7a3a">⑤ p</text>
  <line x1="280" y1="90" x2="252" y2="114" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 1 -->
  <circle cx="340" cy="128" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="362" y="124" font-size="9" fill="#888">⑧</text>
  <line x1="300" y1="90" x2="328" y2="114" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 6 -->
  <circle cx="205" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="222" y="174" font-size="9" fill="#888">①</text>
  <line x1="230" y1="142" x2="212" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 2 -->
  <circle cx="270" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="287" y="174" font-size="9" fill="#888">④</text>
  <line x1="250" y1="142" x2="262" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 0 -->
  <circle cx="320" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="337" y="174" font-size="9" fill="#888">⑥</text>
  <line x1="332" y1="142" x2="324" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 8 -->
  <circle cx="375" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="392" y="174" font-size="9" fill="#888">⑦</text>
  <line x1="350" y1="142" x2="365" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 7 -->
  <circle cx="245" cy="228" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="260" y="224" font-size="9" fill="#888">②</text>
  <line x1="262" y1="190" x2="248" y2="216" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 4 = q -->
  <circle cx="295" cy="228" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="295" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="310" y="224" font-size="9" fill="#b85450">③ q</text>
  <line x1="278" y1="190" x2="290" y2="216" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Step table ===== -->
  <!-- header -->
  <rect x="30" y="268" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="284" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步</text>
  <text x="110" y="284" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">节点</text>
  <text x="180" y="284" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">left</text>
  <text x="250" y="284" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">right</text>
  <text x="330" y="284" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">命中p/q?</text>
  <text x="410" y="284" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">count</text>
  <text x="490" y="284" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">返回</text>

  <!-- rows -->
  <!-- row 1: node 6 -->
  <rect x="30" y="292" width="520" height="20" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="306" text-anchor="middle" font-size="10" fill="#888">①</text>
  <text x="110" y="306" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="180" y="306" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="250" y="306" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="330" y="306" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="306" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="490" y="306" text-anchor="middle" font-size="10" fill="#888">null</text>

  <!-- row 2: node 7 -->
  <rect x="30" y="312" width="520" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="326" text-anchor="middle" font-size="10" fill="#888">②</text>
  <text x="110" y="326" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="180" y="326" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="250" y="326" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="330" y="326" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="326" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="490" y="326" text-anchor="middle" font-size="10" fill="#888">null</text>

  <!-- row 3: node 4 = q -->
  <rect x="30" y="332" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="346" text-anchor="middle" font-size="10" fill="#b85450">③</text>
  <text x="110" y="346" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="180" y="346" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="250" y="346" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="330" y="346" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">==q</text>
  <text x="410" y="346" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="490" y="346" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- row 4: node 2 -->
  <rect x="30" y="352" width="520" height="20" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="366" text-anchor="middle" font-size="10" fill="#888">④</text>
  <text x="110" y="366" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="180" y="366" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="250" y="366" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="330" y="366" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="366" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="490" y="366" text-anchor="middle" font-size="10" fill="#333">4</text>

  <!-- row 5: node 5 = p -->
  <rect x="30" y="372" width="520" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a">⑤</text>
  <text x="110" y="386" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="180" y="386" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="250" y="386" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="330" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">==p</text>
  <text x="410" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="490" y="386" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>

  <!-- row 6: node 0 -->
  <rect x="30" y="392" width="520" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="406" text-anchor="middle" font-size="10" fill="#888">⑥</text>
  <text x="110" y="406" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="180" y="406" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="250" y="406" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="330" y="406" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="406" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="490" y="406" text-anchor="middle" font-size="10" fill="#888">null</text>

  <!-- row 7: node 8 -->
  <rect x="30" y="412" width="520" height="20" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="426" text-anchor="middle" font-size="10" fill="#888">⑦</text>
  <text x="110" y="426" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="180" y="426" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="250" y="426" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="330" y="426" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="426" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="490" y="426" text-anchor="middle" font-size="10" fill="#888">null</text>

  <!-- row 8: node 1 -->
  <rect x="30" y="432" width="520" height="20" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="55" y="446" text-anchor="middle" font-size="10" fill="#888">⑧</text>
  <text x="110" y="446" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="180" y="446" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="250" y="446" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="330" y="446" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="446" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="490" y="446" text-anchor="middle" font-size="10" fill="#888">null</text>

  <!-- row 9: node 3 -->
  <rect x="30" y="452" width="520" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="466" text-anchor="middle" font-size="10" fill="#446688">⑨</text>
  <text x="110" y="466" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="180" y="466" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="250" y="466" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="330" y="466" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="410" y="466" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="490" y="466" text-anchor="middle" font-size="10" fill="#333">5</text>

  <!-- summary -->
  <rect x="30" y="476" width="520" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="490" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count == 2 → 返回 ans = 5 ✅（5 是 5 和 4 的 LCA）</text>
</svg>
