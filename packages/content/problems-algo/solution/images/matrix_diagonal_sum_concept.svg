<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：主对角线 + 副对角线，奇数阶中心重叠</text>

  <!-- ====== Left: 3x3 odd matrix ====== -->
  <text x="120" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">奇数阶 n = 3（中心重叠）</text>

  <!-- 3x3 grid, cell size 44, start x=32, y=68 -->
  <!-- Row 0 -->
  <rect x="32" y="68" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="54" y="96" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">1</text>
  <rect x="76" y="68" width="44" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="98" y="96" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">2</text>
  <rect x="120" y="68" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="96" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">3</text>
  <!-- Row 1 -->
  <rect x="32" y="112" width="44" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="54" y="140" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">4</text>
  <rect x="76" y="112" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="140" text-anchor="middle" font-size="15" fill="#b85450" font-family="monospace" font-weight="bold">5</text>
  <rect x="120" y="112" width="44" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="142" y="140" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">6</text>
  <!-- Row 2 -->
  <rect x="32" y="156" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="54" y="184" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">7</text>
  <rect x="76" y="156" width="44" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="98" y="184" text-anchor="middle" font-size="13" fill="#aaa" font-family="monospace">8</text>
  <rect x="120" y="156" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="184" text-anchor="middle" font-size="15" fill="#333" font-family="monospace">9</text>

  <!-- Legend dots for left -->
  <text x="54" y="226" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">主对角线</text>
  <text x="98" y="226" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">重叠</text>
  <text x="142" y="226" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">副对角线</text>

  <!-- note for left -->
  <rect x="28" y="240" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="98" y="258" text-anchor="middle" font-size="10" fill="#666">中心 5 被两条对角线</text>
  <text x="98" y="272" text-anchor="middle" font-size="10" fill="#666">各算一次 → </text>
  <text x="98" y="287" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">需减去一次</text>

  <!-- ====== Right: 4x4 even matrix ====== -->
  <text x="420" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">偶数阶 n = 4（无重叠）</text>

  <!-- 4x4 grid, cell size 38, start x=336, y=68 -->
  <!-- Row 0 -->
  <rect x="336" y="68" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="355" y="93" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>
  <rect x="374" y="68" width="38" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="393" y="93" text-anchor="middle" font-size="11" fill="#aaa" font-family="monospace">1</text>
  <rect x="412" y="68" width="38" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="431" y="93" text-anchor="middle" font-size="11" fill="#aaa" font-family="monospace">1</text>
  <rect x="450" y="68" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="469" y="93" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>
  <!-- Row 1 -->
  <rect x="336" y="106" width="38" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="131" text-anchor="middle" font-size="11" fill="#aaa" font-family="monospace">1</text>
  <rect x="374" y="106" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="393" y="131" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>
  <rect x="412" y="106" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="431" y="131" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>
  <rect x="450" y="106" width="38" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="469" y="131" text-anchor="middle" font-size="11" fill="#aaa" font-family="monospace">1</text>
  <!-- Row 2 -->
  <rect x="336" y="144" width="38" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="169" text-anchor="middle" font-size="11" fill="#aaa" font-family="monospace">1</text>
  <rect x="374" y="144" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="393" y="169" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>
  <rect x="412" y="144" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="431" y="169" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>
  <rect x="450" y="144" width="38" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="469" y="169" text-anchor="middle" font-size="11" fill="#aaa" font-family="monospace">1</text>
  <!-- Row 3 -->
  <rect x="336" y="182" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="355" y="207" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>
  <rect x="374" y="182" width="38" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="393" y="207" text-anchor="middle" font-size="11" fill="#aaa" font-family="monospace">1</text>
  <rect x="412" y="182" width="38" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="431" y="207" text-anchor="middle" font-size="11" fill="#aaa" font-family="monospace">1</text>
  <rect x="450" y="182" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="469" y="207" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>

  <!-- Legend dots for right -->
  <text x="355" y="226" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">主对角线</text>
  <text x="431" y="226" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">副对角线</text>

  <!-- note for right -->
  <rect x="332" y="240" width="152" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="408" y="258" text-anchor="middle" font-size="10" fill="#666">两对角线无交点</text>
  <text x="408" y="272" text-anchor="middle" font-size="10" fill="#666">8 个角各算一次</text>
  <text x="408" y="287" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">无需减去</text>

  <!-- ===== Bottom summary ===== -->
  <rect x="80" y="312" width="400" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">公式：sum = 主对角线和 + 副对角线和 − mat[n/2][n/2]（仅 n 为奇数）</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#888">主：mat[i][i]；副：mat[i][n−1−i]；奇数时两者在中心 (n/2, n/2) 重叠</text>
</svg>
