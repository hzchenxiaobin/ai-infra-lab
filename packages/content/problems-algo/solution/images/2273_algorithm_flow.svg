<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：单次扫描，比较 σ(w) 与上一保留签名 prevSig</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">保留 words[0] 作起点；其后每个词：σ 相同则跳过，不同则入结果并更新 prevSig</text>

  <!-- 1. init -->
  <rect x="200" y="58" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="280" y="90" text-anchor="middle" font-size="10" fill="#666">res=[w0], prevSig=σ(w0)</text>

  <path d="M 280 98 L 280 116" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. loop -->
  <rect x="200" y="118" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 w ∈ words[1:]</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#666">每个词算 sig = sorted(w)</text>

  <path d="M 280 158 L 280 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. decision diamond -->
  <polygon points="280,178 360,224 280,270 200,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">sig == prevSig ?</text>
  <text x="280" y="234" text-anchor="middle" font-size="9.5" fill="#888">(与上一保留者互为异位词)</text>

  <!-- YES branch (skip) -> right -->
  <path d="M 360 224 L 430 224" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="218" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="206" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过 w</text>
  <text x="480" y="235" text-anchor="middle" font-size="9" fill="#888">prevSig 不变</text>

  <!-- NO branch (keep) -> down -->
  <path d="M 280 270 L 280 290" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="284" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="180" y="292" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">保留 w</text>
  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#666">res.append(w)；prevSig = sig</text>

  <!-- merge: both branches loop back -->
  <path d="M 480 242 Q 480 350 460 350 L 380 350" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 332 L 280 350" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow to loop box (left side up) -->
  <path d="M 180 350 L 70 350 Q 50 350 50 330 L 50 138 Q 50 118 70 118 L 198 138" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="234" font-size="10" fill="#888" font-weight="bold">取下一个 w</text>

  <!-- end: when loop done -->
  <rect x="120" y="372" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束 → 返回 res</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#666">每个 σ 连续段仅首个被保留，恰好折叠为结果</text>
  <path d="M 280 366 L 280 372" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

</svg>
