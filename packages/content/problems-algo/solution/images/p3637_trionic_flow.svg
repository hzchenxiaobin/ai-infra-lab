<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">一次遍历数符号块：块恰 3 且首末为 +</text>

  <rect x="100" y="40" width="320" height="58" rx="6" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始：phase = 0，prev = 0</text>
  <text x="260" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对每个 i = 1 … n−1：</text>
  <text x="260" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = sign(nums[i] − nums[i−1])</text>

  <path d="M260,98 L260,106" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,108 342,138 260,168 178,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s = 0 ?</text>

  <path d="M342,138 L372,138" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="130" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <rect x="374" y="120" width="116" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="136" text-anchor="middle" font-size="12" fill="#7a3a36" filter="url(#rough2)">返回 false</text>
  <text x="432" y="149" text-anchor="middle" font-size="10" fill="#7a3a36" filter="url(#rough2)">相邻相等，严格性破坏</text>

  <path d="M260,168 L260,180" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="269" y="178" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <polygon points="260,182 342,212 260,242 178,212" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="217" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s ≠ prev ?</text>

  <path d="M178,212 L152,212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="204" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <rect x="40" y="194" width="112" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">phase += 1</text>
  <text x="96" y="223" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">prev = s</text>

  <path d="M96,194 L96,110 L230,110 L230,102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="123" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">↻ 下一个 i</text>

  <path d="M260,242 L260,250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <rect x="195" y="252" width="130" height="24" rx="12" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下一个 i</text>

  <path d="M195,264 L20,264 L20,64 L97,64" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="58" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">还有剩余 i ↻</text>

  <path d="M260,276 L260,282" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="281" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i 用尽</text>

  <polygon points="260,284 352,314 260,344 168,314" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">phase == 3</text>
  <text x="260" y="324" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">且 prev == +1 ?</text>

  <path d="M168,314 L138,314" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="306" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <rect x="28" y="298" width="108" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="82" y="318" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">返回 true</text>

  <path d="M352,314 L382,314" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="306" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <rect x="384" y="296" width="118" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="312" text-anchor="middle" font-size="12" fill="#7a3a36" filter="url(#rough2)">返回 false</text>
  <text x="443" y="325" text-anchor="middle" font-size="10" fill="#7a3a36" filter="url(#rough2)">块型不符</text>
</svg>
