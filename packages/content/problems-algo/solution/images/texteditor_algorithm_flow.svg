<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：四个操作均为栈顶 push/pop，代价 O(k)</text>

  <!-- entry -->
  <rect x="240" y="40" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="60" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">TextEditor 方法调用</text>

  <!-- arrows from entry to 4 column headers -->
  <path d="M 300 70 Q 300 84 90 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 70 Q 300 84 230 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 70 Q 300 84 370 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 70 Q 300 84 510 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- column headers -->
  <rect x="30" y="92" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">addText(text)</text>

  <rect x="170" y="92" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="111" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">deleteText(k)</text>

  <rect x="310" y="92" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cursorLeft(k)</text>

  <rect x="450" y="92" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="510" y="111" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cursorRight(k)</text>

  <!-- down arrows header->RowA -->
  <path d="M 90 120 L 90 140" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 120 L 230 140" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 120 L 370 140" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 120 L 510 140" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row A: compute mv/del or main step -->
  <rect x="20" y="144" width="140" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="90" y="164" text-anchor="middle" font-size="10" fill="#666">逐字符入栈</text>
  <text x="90" y="180" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">left.push(c)</text>

  <rect x="160" y="144" width="140" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="164" text-anchor="middle" font-size="10" fill="#666">算实际删除数</text>
  <text x="230" y="180" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">del = min(k, |left|)</text>

  <rect x="300" y="144" width="140" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="370" y="164" text-anchor="middle" font-size="10" fill="#666">算搬运量(兜底越界)</text>
  <text x="370" y="180" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">mv = min(k, |left|)</text>

  <rect x="440" y="144" width="140" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="510" y="164" text-anchor="middle" font-size="10" fill="#666">算搬运量(兜底越界)</text>
  <text x="510" y="180" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">mv = min(k, |right|)</text>

  <!-- down arrows A->B -->
  <path d="M 90 188 L 90 208" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 188 L 230 208" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 188 L 370 208" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 188 L 510 208" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row B: loop action -->
  <rect x="20" y="212" width="140" height="44" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="90" y="240" text-anchor="middle" font-size="10.5" fill="#888">—（无循环动作）</text>

  <rect x="160" y="212" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">循环 del: left.pop()</text>

  <rect x="300" y="212" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="370" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">循环 mv:</text>
  <text x="370" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">right.push(left.pop())</text>

  <rect x="440" y="212" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="510" y="232" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">循环 mv:</text>
  <text x="510" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left.push(right.pop())</text>

  <!-- down arrows B->C -->
  <path d="M 90 256 L 90 276" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 256 L 230 276" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 256 L 370 276" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 256 L 510 276" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row C: return -->
  <rect x="20" y="280" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="308" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">无返回 (void)</text>

  <rect x="160" y="280" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="308" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">return del</text>

  <rect x="300" y="280" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="300" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">return</text>
  <text x="370" y="316" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">left 末尾 ≤10</text>

  <rect x="440" y="280" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="510" y="300" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">return</text>
  <text x="510" y="316" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">left 末尾 ≤10</text>

  <!-- cost annotation per column -->
  <text x="90" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(|text|)</text>
  <text x="230" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(k)</text>
  <text x="370" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(k) + O(10)</text>
  <text x="510" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(k) + O(10)</text>

  <!-- shared note -->
  <rect x="40" y="362" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="380" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">公共要点：mv = min(k, 栈大小) 保证光标不越界（端点处 mv=0 即不移动）</text>
  <text x="300" y="398" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">返回值 = left 末尾 ≤10（栈底→栈顶即阅读序，无需翻转）</text>
</svg>
