<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：圆心到矩形的最近点 = 每个坐标独立夹紧</text>

  <!-- ===== Left: geometric figure ===== -->
  <!-- circle: center C=(150,190) r=70 -->
  <circle cx="150" cy="190" r="70" fill="#e8f0fe" fill-opacity="0.6"
          stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- rectangle: x[220,340] y[130,270] -->
  <rect x="220" y="130" width="120" height="140" fill="#e6f4ea" fill-opacity="0.6"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- center C -->
  <circle cx="150" cy="190" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="132" y="184" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">C 圆心</text>

  <!-- closest point P on rectangle left edge -->
  <circle cx="220" cy="190" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="228" y="186" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">P 最近点</text>

  <!-- distance line C -> P -->
  <line x1="150" y1="190" x2="220" y2="190" stroke="#d6a040" stroke-width="2.5"
        stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="170" y="180" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d</text>

  <!-- radius indicator on circle -->
  <line x1="150" y1="190" x2="150" y2="120" stroke="#446688" stroke-width="1.5"
        stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="156" y="158" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">r</text>

  <!-- rectangle corner labels -->
  <text x="222" y="126" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(x1,y2)</text>
  <text x="318" y="284" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(x2,y1)</text>

  <text x="190" y="312" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">相切情形：d = r，刚好重叠</text>

  <!-- ===== Right: formula boxes ===== -->
  <rect x="380" y="52" width="170" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="388" y="71" font-size="11" fill="#444" filter="url(#rough2)">closestX =</text>
  <text x="388" y="88" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max(x1, min(x2, xC))</text>

  <rect x="380" y="112" width="170" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="388" y="131" font-size="11" fill="#444" filter="url(#rough2)">closestY =</text>
  <text x="388" y="148" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max(y1, min(y2, yC))</text>

  <rect x="380" y="172" width="170" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="388" y="191" font-size="11" fill="#444" filter="url(#rough2)">d² =</text>
  <text x="388" y="208" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">(xC−cX)²+(yC−cY)²</text>

  <rect x="380" y="232" width="170" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="388" y="252" font-size="11" fill="#444" filter="url(#rough2)">overlap ⟺</text>
  <text x="388" y="272" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d² ≤ r²</text>
</svg>
