<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：设置位序列不变 → 数组被永久切成段</text>

  <!-- segment labels -->
  <text x="174" y="42" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">段①：置位数 = 1（段内随便换）</text>
  <text x="364" y="42" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段②：置位数 = 4</text>

  <!-- segment outlines -->
  <rect x="80" y="46" width="188" height="102" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>
  <rect x="300" y="46" width="128" height="102" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>

  <!-- nums row -->
  <text x="44" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums =</text>
  <rect x="88" y="56" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="114" y="80" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="148" y="56" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="174" y="80" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="208" y="56" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="80" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="308" y="56" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="80" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">30</text>
  <rect x="368" y="56" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="394" y="80" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">15</text>

  <!-- binary row -->
  <text x="114" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1000</text>
  <text x="174" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">100</text>
  <text x="234" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">10</text>
  <text x="334" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">11110</text>
  <text x="394" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1111</text>

  <!-- popcount badges -->
  <text x="46" y="136" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">置位数</text>
  <circle cx="114" cy="132" r="11" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="174" cy="132" r="11" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="234" cy="132" r="11" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="234" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="334" cy="132" r="11" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="394" cy="132" r="11" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- wall between segments -->
  <path d="M 283 48 L 283 150" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="283" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✕</text>
  <text x="283" y="112" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✕</text>
  <text x="283" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">墙！置位数不同</text>
  <text x="283" y="181" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">永远换不了</text>

  <!-- sorted row -->
  <text x="60" y="212" font-size="11.5" fill="#555" filter="url(#rough2)">段内排序后（段序不变）：</text>
  <rect x="88" y="222" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="114" y="244" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="148" y="222" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="174" y="244" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="208" y="222" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="244" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="308" y="222" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="244" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">15</text>
  <rect x="368" y="222" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="394" y="244" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">30</text>
  <path d="M 283 218 L 283 260" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- answer box -->
  <rect x="60" y="274" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">边界检查：max(段①) = 8 ≤ min(段②) = 15 ✓</text>
  <text x="260" y="319" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">拼接 [2,4,8,15,30] 非降序 → 返回 true</text>

  <!-- bottom note -->
  <rect x="48" y="346" width="424" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⚠️ 分段按「原数组中的连续位置」切，不是按值聚合；</text>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">设置位数相同的两段隔着别的段，也不能合并。</text>
</svg>
