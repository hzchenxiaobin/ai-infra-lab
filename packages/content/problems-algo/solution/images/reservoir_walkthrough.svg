<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums=[1,2,3,3,3]，pick(3)（一次可能的随机结果）</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="500" height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">步骤</text>
  <text x="112" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="162" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">nums[i]</text>
  <text x="222" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">c</text>
  <text x="292" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">替换 1/c</text>
  <text x="392" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">随机判定</text>
  <text x="482" y="63" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">蓄水池</text>

  <!-- 列分隔线（轻） -->
  <line x1="86" y1="44" x2="86" y2="284" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="138" y1="44" x2="138" y2="284" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="192" y1="44" x2="192" y2="284" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="252" y1="44" x2="252" y2="284" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="338" y1="44" x2="338" y2="284" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="446" y1="44" x2="446" y2="284" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 ①  i=0, nums[i]=1, 非目标 -->
  <rect x="30" y="76" width="500" height="34" fill="#fff" stroke="none" filter="url(#rough2)"/>
  <text x="60" y="98" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">①</text>
  <text x="112" y="98" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="162" y="98" text-anchor="middle" font-size="12" fill="#446688">1</text>
  <text x="222" y="98" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="292" y="98" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="392" y="98" text-anchor="middle" font-size="11" fill="#b85450">非目标，跳过</text>
  <text x="482" y="98" text-anchor="middle" font-size="12" fill="#888">-1</text>

  <!-- 行 ②  i=1, nums[i]=2, 非目标 -->
  <rect x="30" y="114" width="500" height="34" fill="#f6f8fb" stroke="none" filter="url(#rough2)"/>
  <text x="60" y="136" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">②</text>
  <text x="112" y="136" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="162" y="136" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <text x="222" y="136" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="292" y="136" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="392" y="136" text-anchor="middle" font-size="11" fill="#b85450">非目标，跳过</text>
  <text x="482" y="136" text-anchor="middle" font-size="12" fill="#888">-1</text>

  <!-- 行 ③  i=2, nums[i]=3, c=1, 100% 选中 -->
  <rect x="30" y="152" width="500" height="34" fill="#fff" stroke="none" filter="url(#rough2)"/>
  <text x="60" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③</text>
  <text x="112" y="174" text-anchor="middle" font-size="12" fill="#555">2</text>
  <rect x="146" y="156" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="163" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="222" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="292" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1/1 = 100%</text>
  <text x="392" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a">必选 reservoir=2</text>
  <rect x="460" y="156" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="482" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- 行 ④  i=3, nums[i]=3, c=2, 1/2 替换 -->
  <rect x="30" y="190" width="500" height="34" fill="#f6f8fb" stroke="none" filter="url(#rough2)"/>
  <text x="60" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">④</text>
  <text x="112" y="212" text-anchor="middle" font-size="12" fill="#555">3</text>
  <rect x="146" y="194" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="163" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="222" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="292" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1/2 = 50%</text>
  <text x="392" y="212" text-anchor="middle" font-size="11" fill="#d6a040">%2==0 → 替换</text>
  <rect x="460" y="194" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="482" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- 行 ⑤  i=4, nums[i]=3, c=3, 1/3 不替换 -->
  <rect x="30" y="228" width="500" height="34" fill="#fff" stroke="none" filter="url(#rough2)"/>
  <text x="60" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⑤</text>
  <text x="112" y="250" text-anchor="middle" font-size="12" fill="#555">4</text>
  <rect x="146" y="232" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="163" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="222" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="292" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1/3 ≈ 33%</text>
  <text x="392" y="250" text-anchor="middle" font-size="11" fill="#888">%3==1 → 不替换</text>
  <rect x="460" y="232" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="482" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- 表底框 -->
  <rect x="30" y="44" width="500" height="240" fill="none" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <!-- 概率校验 -->
  <rect x="30" y="296" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="316" font-size="11" fill="#4a7a3a" font-weight="bold">概率校验（C=3，每个应 = 1/3）：</text>
  <text x="50" y="334" font-size="10.5" fill="#555">下标2: (1/1)·(1−1/2)·(1−1/3) = 1·1/2·2/3 = 1/3 ✅   下标3: (1/2)·(2/3) = 1/3 ✅   下标4: (1/3) = 1/3 ✅</text>
</svg>
