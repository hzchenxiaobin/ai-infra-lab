<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：cost=[4,3,2,5,6,7,2,5,5], target=9</text>

  <!-- ===== Digit-cost mapping (9 cells, 44 wide, start x=96) ===== -->
  <text x="40" y="52" font-size="10" fill="#666" font-weight="bold">数位→成本</text>

  <rect x="96" y="36" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="116" y="63" text-anchor="middle" font-size="10" fill="#888">4</text>

  <rect x="136" y="36" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="156" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="156" y="63" text-anchor="middle" font-size="10" fill="#888">3</text>

  <rect x="176" y="36" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="196" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="196" y="63" text-anchor="middle" font-size="10" fill="#888">2</text>

  <rect x="216" y="36" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="236" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="236" y="63" text-anchor="middle" font-size="10" fill="#888">5</text>

  <rect x="256" y="36" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="276" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="276" y="63" text-anchor="middle" font-size="10" fill="#888">6</text>

  <rect x="296" y="36" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="316" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
  <text x="316" y="63" text-anchor="middle" font-size="10" fill="#888">7</text>

  <rect x="336" y="36" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="356" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="356" y="63" text-anchor="middle" font-size="10" fill="#888">2</text>

  <rect x="376" y="36" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="396" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8</text>
  <text x="396" y="63" text-anchor="middle" font-size="10" fill="#888">5</text>

  <rect x="416" y="36" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="436" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9</text>
  <text x="436" y="63" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- ===== DP table (10 cells, 44 wide, start x=76) ===== -->
  <text x="40" y="98" font-size="10" fill="#666" font-weight="bold">DP 表</text>

  <!-- t values row -->
  <text x="98" y="98" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="142" y="98" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="186" y="98" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="230" y="98" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="274" y="98" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="318" y="98" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="362" y="98" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="406" y="98" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="450" y="98" text-anchor="middle" font-size="10" fill="#888">8</text>
  <text x="494" y="98" text-anchor="middle" font-size="10" fill="#888">9</text>

  <!-- dp cells -->
  <rect x="78" y="104" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>

  <rect x="122" y="104" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="121" text-anchor="middle" font-size="12" fill="#b85450">−1</text>

  <rect x="166" y="104" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="186" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="210" y="104" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="254" y="104" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="274" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="298" y="104" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="318" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="342" y="104" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="362" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="386" y="104" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="406" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="430" y="104" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="474" y="104" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="494" y="121" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>

  <!-- ===== Greedy trace table ===== -->
  <text x="40" y="158" font-size="10" fill="#666" font-weight="bold">贪心构造 (L=dp[9]=4)</text>

  <!-- Table border -->
  <rect x="40" y="164" width="480" height="120" fill="none" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <!-- Header -->
  <rect x="40" y="164" width="480" height="22" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="179" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">remain</text>
  <text x="120" y="179" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">L</text>
  <text x="240" y="179" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">尝试 9→1</text>
  <text x="390" y="179" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">选中</text>
  <text x="470" y="179" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">ans</text>

  <!-- column separators -->
  <path d="M 100 164 L 100 284" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 140 164 L 140 284" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 370 164 L 370 284" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 410 164 L 410 284" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: remain=9, L=4 -->
  <text x="70" y="201" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="120" y="201" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="148" y="201" font-size="9" fill="#b85450">9:c=5 dp[4]=2≠3 ✗</text>
  <text x="148" y="213" font-size="9" fill="#b85450">8:c=5 ✗</text>
  <text x="148" y="225" font-size="9" fill="#4a7a3a">7:c=2 dp[7]=3=3 ✓</text>
  <text x="390" y="213" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
  <text x="470" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"7"</text>

  <!-- Row 2: remain=7, L=3 -->
  <text x="70" y="245" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="120" y="245" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="148" y="245" font-size="9" fill="#b85450">9:c=5 dp[2]=1≠2 ✗</text>
  <text x="148" y="257" font-size="9" fill="#4a7a3a">7:c=2 dp[5]=2=2 ✓</text>
  <text x="390" y="251" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
  <text x="470" y="251" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"77"</text>

  <!-- Row 3: remain=5, L=2 -->
  <text x="70" y="277" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="120" y="277" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="148" y="277" font-size="9" fill="#b85450">9:c=5 dp[0]=0≠1 ✗</text>
  <text x="148" y="289" font-size="9" fill="#4a7a3a">7:c=2 dp[3]=1=1 ✓</text>
  <text x="390" y="283" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
  <text x="470" y="283" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"777"</text>

  <!-- Row 4: remain=3, L=1 -->
  <text x="70" y="309" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="309" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="148" y="309" font-size="9" fill="#b85450">7:c=2 dp[1]=−1≠0 ✗</text>
  <text x="148" y="321" font-size="9" fill="#4a7a3a">2:c=3 dp[0]=0=0 ✓</text>
  <text x="390" y="315" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="470" y="315" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"7772"</text>

  <!-- Result -->
  <rect x="140" y="340" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">结果："7772" (代价 2×3+3×1=9)</text>
</svg>
