<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">概念：数组的「覆盖区间」与「未覆盖间隙」</text>

  <!-- array indices 0-9, 10 cells -->
  <text x="30" y="76" font-size="11" fill="#999" filter="url(#rough2)">index</text>

  <!-- cell 0 uncovered -->
  <rect x="60" y="48" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="84" y="76" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <!-- cell 1 uncovered -->
  <rect x="110" y="48" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="76" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- cell 2 uncovered -->
  <rect x="160" y="48" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="76" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- cell 3 covered -->
  <rect x="210" y="48" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="76" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- cell 4 covered -->
  <rect x="260" y="48" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="76" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <!-- cell 5 covered -->
  <rect x="310" y="48" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="76" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <!-- cell 6 uncovered -->
  <rect x="360" y="48" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="384" y="76" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <!-- cell 7 covered -->
  <rect x="410" y="48" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="434" y="76" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <!-- cell 8 covered -->
  <rect x="460" y="48" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="484" y="76" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">8</text>
  <!-- cell 9 uncovered -->
  <rect x="510" y="48" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="534" y="76" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- covered range brackets -->
  <path d="M 212 104 L 212 112 L 358 112 L 358 104" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="285" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">覆盖 [3,5]</text>
  <path d="M 412 104 L 412 112 L 508 112 L 508 104" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="460" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">覆盖 [7,8]</text>

  <!-- uncovered range brackets -->
  <path d="M 62 40 L 62 32 L 208 32 L 208 40" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="135" y="24" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">未覆盖 [0,2]</text>
  <path d="M 362 40 L 362 32 L 408 32 L 408 40" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="385" y="24" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">[6,6]</text>
  <path d="M 512 40 L 512 32 L 558 32 L 558 40" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="535" y="24" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">[9,9]</text>

  <!-- legend -->
  <rect x="80" y="170" width="22" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="110" y="183" font-size="11" fill="#555" filter="url(#rough2)">被 ranges 覆盖的元素</text>
  <rect x="300" y="170" width="22" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="330" y="183" font-size="11" fill="#555" filter="url(#rough2)">未覆盖元素（间隙）</text>

  <!-- key insight box -->
  <rect x="60" y="210" width="500" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">核心观察</text>
  <text x="310" y="256" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">先排序合并覆盖区间，再扫描相邻区间之间的「间隙」</text>
  <text x="310" y="274" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">间隙起点 = 上一段覆盖终点 + 1（或 0）</text>
  <text x="310" y="292" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">间隙终点 = 下一段覆盖起点 − 1（或 n − 1）</text>

  <text x="310" y="324" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n=10，ranges=[[3,5],[7,8]] → 结果 [[0,2],[6,6],[9,9]]</text>
</svg>
