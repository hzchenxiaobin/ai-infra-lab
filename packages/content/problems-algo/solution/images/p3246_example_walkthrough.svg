<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：并列第 1 ＋ 跳号第 3，利物浦为何排在曼城前面？</text>

  <rect x="24" y="38" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="53" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">team_id</text>
  <rect x="76" y="38" width="140" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="53" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">team_name</text>
  <rect x="216" y="38" width="84" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="53" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">wins·draws</text>
  <rect x="300" y="38" width="124" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="53" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">points 计算</text>
  <rect x="424" y="38" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="53" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">position</text>

  <rect x="24" y="60" width="52" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="77" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="76" y="60" width="140" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="77" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Liverpool</text>
  <rect x="216" y="60" width="84" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="77" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6 · 2</text>
  <rect x="300" y="60" width="124" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="77" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6×3 + 2 = 20</text>
  <rect x="424" y="60" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="454" y="77" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="24" y="86" width="52" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="76" y="86" width="140" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Manchester City</text>
  <rect x="216" y="86" width="84" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6 · 2</text>
  <rect x="300" y="86" width="124" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="103" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6×3 + 2 = 20</text>
  <rect x="424" y="86" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="454" y="103" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="24" y="112" width="52" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="76" y="112" width="140" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Chelsea</text>
  <rect x="216" y="112" width="84" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5 · 3</text>
  <rect x="300" y="112" width="124" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5×3 + 3 = 18</text>
  <rect x="424" y="112" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="454" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="24" y="138" width="52" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="155" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <rect x="76" y="138" width="140" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="155" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Arsenal</text>
  <rect x="216" y="138" width="84" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="155" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4 · 4</text>
  <rect x="300" y="138" width="124" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="155" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4×3 + 4 = 16</text>
  <rect x="424" y="138" width="60" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="454" y="155" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>

  <rect x="24" y="164" width="52" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="181" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="76" y="164" width="140" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="181" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Tottenham</text>
  <rect x="216" y="164" width="84" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="181" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3 · 5</text>
  <rect x="300" y="164" width="124" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="181" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3×3 + 5 = 14</text>
  <rect x="424" y="164" width="60" height="26" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="454" y="181" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>

  <path d="M 139 202 L 110 190" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <rect x="24" y="206" width="230" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="139" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">并列第 1：同为 20 分 → position 同为 1</text>
  <text x="139" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">利物浦在前只因 L &lt; M（team_name 升序）</text>
  <text x="139" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">曼城 team_id=1 却在第 2 行</text>
  <text x="139" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">—— 展示顺序与 team_id 无关</text>

  <path d="M 383 202 L 446 140" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>
  <rect x="266" y="206" width="230" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="381" y="224" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">跳号第 3：前两名被并列占坑</text>
  <text x="381" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">切尔西 18 分 → position = 3（不是 2）</text>
  <text x="381" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">名次序列 1, 1, 3, 4, 5 留了一个洞</text>
  <text x="381" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">想要 1, 1, 2…？那是 DENSE_RANK 的活</text>

  <text x="260" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">输出顺序 = points 降序 ＋ team_name 升序，正是题面要求的排序键</text>
</svg>
