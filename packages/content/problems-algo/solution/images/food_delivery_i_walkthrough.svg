<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：6 行订单 → 2 行即时 → 33.33%</text>

  <!-- ===== Table header ===== -->
  <text x="200" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Delivery 表</text>

  <rect x="20" y="60" width="360" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="8" fill="#446688" font-weight="bold">deliv_id</text>
  <text x="105" y="76" font-size="8" fill="#446688" font-weight="bold">cust_id</text>
  <text x="175" y="76" font-size="8" fill="#446688" font-weight="bold">order_date</text>
  <text x="280" y="76" font-size="7.5" fill="#446688" font-weight="bold">pref_deliv_date</text>
  <line x1="75" y1="60" x2="75" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="135" y1="60" x2="135" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="230" y1="60" x2="230" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- ===== Right: boolean column header ===== -->
  <rect x="400" y="60" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="76" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">即时?(0/1)</text>

  <!-- row 1 -->
  <rect x="20" y="84" width="360" height="22" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="99" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="105" y="99" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="175" y="99" text-anchor="middle" font-size="8.5" fill="#888">2019-08-01</text>
  <text x="280" y="99" text-anchor="middle" font-size="8.5" fill="#888">2019-08-02</text>
  <line x1="75" y1="84" x2="75" y2="106" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="135" y1="84" x2="135" y2="106" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="84" x2="230" y2="106" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="400" y="84" width="90" height="22" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="445" y="99" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">0</text>

  <!-- row 2: IMMEDIATE -->
  <rect x="20" y="106" width="360" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="121" text-anchor="middle" font-size="8.5" fill="#333">2</text>
  <text x="105" y="121" text-anchor="middle" font-size="8.5" fill="#333">5</text>
  <text x="175" y="121" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2019-08-02</text>
  <text x="280" y="121" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2019-08-02</text>
  <line x1="75" y1="106" x2="75" y2="128" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="135" y1="106" x2="135" y2="128" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="230" y1="106" x2="230" y2="128" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="400" y="106" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="445" y="121" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1 ✓</text>

  <!-- row 3 -->
  <rect x="20" y="128" width="360" height="22" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="143" text-anchor="middle" font-size="8.5" fill="#888">3</text>
  <text x="105" y="143" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="175" y="143" text-anchor="middle" font-size="8.5" fill="#888">2019-08-11</text>
  <text x="280" y="143" text-anchor="middle" font-size="8.5" fill="#888">2019-08-12</text>
  <line x1="75" y1="128" x2="75" y2="150" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="135" y1="128" x2="135" y2="150" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="128" x2="230" y2="150" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="400" y="128" width="90" height="22" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="445" y="143" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">0</text>

  <!-- row 4: IMMEDIATE -->
  <rect x="20" y="150" width="360" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="40" y="165" text-anchor="middle" font-size="8.5" fill="#333">4</text>
  <text x="105" y="165" text-anchor="middle" font-size="8.5" fill="#333">3</text>
  <text x="175" y="165" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2019-08-24</text>
  <text x="280" y="165" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2019-08-24</text>
  <line x1="75" y1="150" x2="75" y2="172" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="135" y1="150" x2="135" y2="172" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="230" y1="150" x2="230" y2="172" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="400" y="150" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="445" y="165" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1 ✓</text>

  <!-- row 5 -->
  <rect x="20" y="172" width="360" height="22" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="187" text-anchor="middle" font-size="8.5" fill="#888">5</text>
  <text x="105" y="187" text-anchor="middle" font-size="8.5" fill="#888">4</text>
  <text x="175" y="187" text-anchor="middle" font-size="8.5" fill="#888">2019-08-21</text>
  <text x="280" y="187" text-anchor="middle" font-size="8.5" fill="#888">2019-08-22</text>
  <line x1="75" y1="172" x2="75" y2="194" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="135" y1="172" x2="135" y2="194" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="172" x2="230" y2="194" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="400" y="172" width="90" height="22" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="445" y="187" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">0</text>

  <!-- row 6 -->
  <rect x="20" y="194" width="360" height="22" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="209" text-anchor="middle" font-size="8.5" fill="#888">6</text>
  <text x="105" y="209" text-anchor="middle" font-size="8.5" fill="#888">2</text>
  <text x="175" y="209" text-anchor="middle" font-size="8.5" fill="#888">2019-08-11</text>
  <text x="280" y="209" text-anchor="middle" font-size="8.5" fill="#888">2019-08-13</text>
  <line x1="75" y1="194" x2="75" y2="216" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="135" y1="194" x2="135" y2="216" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="194" x2="230" y2="216" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="400" y="194" width="90" height="22" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="445" y="209" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">0</text>

  <!-- arrow down -->
  <path d="M445 220 L445 238" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="475" y="234" font-size="8" fill="#d6a040" font-weight="bold">AVG / SUM</text>

  <!-- ===== Computation box ===== -->
  <rect x="20" y="240" width="560" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">聚合计算</text>

  <text x="40" y="282" font-size="10" fill="#333">即时行数 = </text>
  <rect x="115" y="270" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="143" y="282" font-size="10" fill="#333"> + </text>
  <rect x="160" y="270" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="190" y="282" font-size="10" fill="#333"> = 2</text>

  <text x="40" y="310" font-size="10" fill="#333">总行数 = 6</text>

  <text x="240" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">占比 = 2 / 6 = 0.3333...</text>
  <text x="240" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">× 100 = 33.333... → ROUND(,2) = 33.33</text>

  <!-- ===== Final result ===== -->
  <rect x="140" y="352" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="376" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">输出：immediate_percentage = 33.33</text>

  <!-- ===== Bottom note ===== -->
  <rect x="20" y="404" width="560" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="424" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">绿色行</tspan>：order_date = pref_deliv_date → 即时（计 1）</text>
  <text x="40" y="440" font-size="9.5" fill="#333">• <tspan fill="#888">灰色行</tspan>：两日期不等 → 非即时（计 0）；2 个 1 / 6 行 = 33.33%</text>
</svg>
