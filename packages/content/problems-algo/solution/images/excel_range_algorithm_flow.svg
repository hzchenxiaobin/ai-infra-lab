<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：解析 → 双重循环 → 拼装收集
  </text>

  <!-- Step 1: parse -->
  <rect x="30" y="58" width="150" height="56" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">解析 s</text>
  <text x="105" y="100" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c1=s[0] r1=s[1]</text>

  <!-- Step 2: extract -->
  <rect x="200" y="58" width="150" height="56" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">抽取四个边界</text>
  <text x="275" y="100" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c2=s[3] r2=s[4]</text>

  <!-- Step 3: outer loop col -->
  <rect x="370" y="58" width="130" height="56" rx="6" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">外层：枚举列</text>
  <text x="435" y="100" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">for c in [c1..c2]</text>

  <!-- arrows row1 -->
  <path d="M 180,86 L 200,86" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 350,86 L 370,86" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 4: inner loop row -->
  <rect x="370" y="150" width="130" height="56" rx="6" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">内层：枚举行</text>
  <text x="435" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">for r in [r1..r2]</text>

  <path d="M 435,114 L 435,150" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 5: format -->
  <rect x="200" y="150" width="150" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="275" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">拼装单元格串</text>
  <text x="275" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">chr(c) + str(r)</text>

  <path d="M 370,178 L 350,178" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 6: append -->
  <rect x="30" y="150" width="150" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">加入结果 ans</text>
  <text x="105" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">ans.append(...)</text>

  <path d="M 200,178 L 180,178" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="155" y="252" width="210" height="50" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    返回 ans（天然非递减序）
  </text>

  <path d="M 105,206 L 105,232 L 200,232 L 260,252" stroke="#446688" stroke-width="1.6"
        fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- note -->
  <rect x="30" y="318" width="460" height="34" rx="6" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="340" font-size="12" fill="#333" filter="url(#rough2)">
    列在外、行在内 → 先按列排再按行排，正好满足「非递减」要求，无需再排序。
  </text>
</svg>
