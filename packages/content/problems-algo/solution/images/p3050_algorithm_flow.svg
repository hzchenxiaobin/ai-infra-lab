<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：自连接取上三角 → 成本求和 → 降序输出</text>

  <!-- step 1: source table -->
  <rect x="60" y="44" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="185" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Toppings 表（n = 4 行配料）</text>
  <text x="185" y="78" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">topping_name (主键) + cost (单价)</text>

  <path d="M 185 86 L 185 112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="103" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 自连接 ON t1.topping_name &lt; t2.topping_name</text>
  <text x="342" y="103" font-size="10" fill="#8a6d3b" filter="url(#rough2)">去重 + 排自身 + 定序，一箭三雕</text>

  <!-- step 2: upper triangle pairs -->
  <rect x="60" y="116" width="250" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="185" y="134" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">上三角两两组合：C(4,2) = 6 行</text>
  <text x="185" y="150" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">topping1 字典序在前，无重复、无自配</text>

  <path d="M 185 158 L 185 184" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="175" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 求和 ROUND(t1.cost + t2.cost, 2)</text>
  <text x="342" y="175" font-size="10" fill="#8a6d3b" filter="url(#rough2)">decimal 求和，ROUND 锁两位小数</text>

  <!-- step 3: with total_cost -->
  <rect x="60" y="188" width="250" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="185" y="206" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">附 total_cost 列的 6 行</text>
  <text x="185" y="222" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1.25 / 1.20 / 1.10 / 1.05 / 0.95 / 0.90（未排序）</text>

  <path d="M 185 230 L 185 256" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="200" y="247" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">③ ORDER BY total_cost DESC, topping1, topping2</text>
  <text x="366" y="247" font-size="10" fill="#8a6d3b" filter="url(#rough2)">降主序 + 双字典序 tiebreaker</text>

  <!-- step 4: result -->
  <rect x="60" y="260" width="250" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="185" y="280" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 6 行（topping1, topping2, total_cost）</text>
  <text x="185" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">首行 Chicken+Sausage=1.25，末行 Extra Cheese+Pepperoni=0.90</text>

  <!-- bottom note -->
  <rect x="30" y="322" width="476" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="268" y="342" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">中间行数 = 输出规模 = C(n,2)，零冗余；O(n²) 已是输出下界意义下的最优</text>
</svg>
