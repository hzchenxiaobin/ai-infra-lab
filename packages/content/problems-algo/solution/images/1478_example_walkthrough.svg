<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例 1：houses=[1,4,8,10,20], k=3
  </text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    最优划分 [1,4] | [8,10] | [20]，每段邮筒取中位数
  </text>

  <!-- ===== 分组底色 ===== -->
  <!-- 组1 [1,4] 蓝 x:60-150 -->
  <rect x="58" y="64" width="96" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <!-- 组2 [8,10] 绿 x:200-262 -->
  <rect x="198" y="64" width="68" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <!-- 组3 [20] 橙 x:436-470 -->
  <rect x="434" y="64" width="40" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>

  <!-- 房屋方块 1,4,8,10,20  x = 60 + p*20 -->
  <!-- 1 -> 80 -->
  <rect x="68" y="72" width="24" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <!-- 4 -> 140 -->
  <rect x="128" y="72" width="24" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <!-- 8 -> 220 -->
  <rect x="208" y="72" width="24" height="30" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <!-- 10 -> 260 -->
  <rect x="248" y="72" width="24" height="30" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <!-- 20 -> 460 -->
  <rect x="448" y="72" width="24" height="30" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">20</text>

  <!-- 邮筒标记（每组中位数） -->
  <text x="80" y="118" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">邮筒@1</text>
  <text x="220" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">邮筒@8</text>
  <text x="460" y="118" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">邮筒@20</text>

  <!-- 各组 cost -->
  <text x="106" y="146" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">cost[0][1]=3</text>
  <text x="232" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">cost[2][3]=2</text>
  <text x="454" y="146" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">cost[4][4]=0</text>

  <!-- 合计箭头汇总 -->
  <path d="M106,152 L106,168 L280,168" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M232,152 L232,168 L280,168" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M454,152 L454,168 L280,168" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="220" y="172" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总距离 = 5 ✓</text>

  <!-- ===== DP 填表演算 ===== -->
  <text x="40" y="222" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">DP 演算：dp[3][5] = min&#160;{ dp[2][j] + cost[j][4] }</text>

  <!-- 表头 -->
  <rect x="40" y="232" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">切分点 j</text>
  <rect x="140" y="232" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp[2][j]</text>
  <rect x="260" y="232" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cost[j][4]</text>
  <rect x="380" y="232" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="440" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">合计</text>

  <!-- 行 j=2 -->
  <text x="90" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">12</text>
  <text x="440" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">12</text>

  <!-- 行 j=3 -->
  <text x="90" y="298" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="200" y="298" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="320" y="298" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10</text>
  <text x="440" y="298" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">13</text>

  <!-- 行 j=4 最优 -->
  <rect x="40" y="306" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="322" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="200" y="322" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="320" y="322" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="440" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5 ✓</text>

  <!-- 底部说明 -->
  <rect x="40" y="340" width="480" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    j=4 时 dp[2][4]=5（前 4 房 2 邮筒），剩 [20] 单独 1 邮筒 cost=0
  </text>
</svg>
