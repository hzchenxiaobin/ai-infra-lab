<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：num = 14 的 6 步归零</text>

  <rect x="30" y="48" width="460" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">步</text>
  <text x="150" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num</text>
  <text x="230" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">奇偶</text>
  <text x="330" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">操作</text>
  <text x="440" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">结果</text>

  <rect x="30" y="80" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="98" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="150" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>
  <text x="230" y="98" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="330" y="98" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">÷2</text>
  <text x="440" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <rect x="30" y="108" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="150" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="230" y="126" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">奇</text>
  <text x="330" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="440" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <rect x="30" y="136" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="154" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="150" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="230" y="154" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="330" y="154" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">÷2</text>
  <text x="440" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <rect x="30" y="164" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="182" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="150" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="182" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">奇</text>
  <text x="330" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="440" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="30" y="192" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="210" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="150" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="210" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="330" y="210" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">÷2</text>
  <text x="440" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="30" y="220" width="460" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="238" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>
  <text x="150" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="238" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">奇</text>
  <text x="330" y="238" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="440" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>

  <text x="260" y="276" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">公式验证：popcount + bitlen − 1</text>

  <rect x="30" y="292" width="460" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num</text>
  <text x="170" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">二进制</text>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">popcount</text>
  <text x="370" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">bitlen</text>
  <text x="460" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">步数</text>

  <rect x="30" y="324" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>
  <text x="170" y="344" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1110₂</text>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="370" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="460" y="344" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>

  <rect x="30" y="356" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="170" y="376" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000₂</text>
  <text x="270" y="376" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="370" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="460" y="376" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>

  <rect x="30" y="388" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="408" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">123</text>
  <text x="170" y="408" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1111011₂</text>
  <text x="270" y="408" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">6</text>
  <text x="370" y="408" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="460" y="408" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">12</text>

  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">公式与模拟结果一致 ✓</text>
</svg>
