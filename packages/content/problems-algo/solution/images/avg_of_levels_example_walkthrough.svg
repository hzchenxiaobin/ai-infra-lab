<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[3,9,20,null,null,15,7] 逐层求均值</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">3 轮 while，每轮累加 sum / 记 count，层末 sum÷count 入结果</text>

  <!-- header row -->
  <g font-size="10" fill="#666" font-weight="bold">
    <text x="30" y="74">轮次</text>
    <text x="90" y="74">队列初始</text>
    <text x="180" y="74">size</text>
    <text x="225" y="74">出队/入队</text>
    <text x="360" y="74">sum</text>
    <text x="410" y="74">count</text>
    <text x="470" y="74">avg = sum/count</text>
  </g>
  <line x1="20" y1="80" x2="540" y2="80" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Round 1 -->
  <g font-size="10">
    <text x="30" y="104" fill="#b85450" font-weight="bold">1</text>
    <rect x="80" y="92" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="98" y="108" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="180" y="108" fill="#333">1</text>
    <text x="225" y="108" fill="#888">出 3 → 入 9, 20</text>
    <text x="360" y="108" fill="#b85450" font-weight="bold">3</text>
    <text x="410" y="108" fill="#333">1</text>
    <text x="470" y="108" fill="#b85450" font-weight="bold">3 / 1 = 3.0</text>
  </g>
  <rect x="20" y="120" width="520" height="18" fill="#fce4ec" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="9" fill="#b85450">result.append(3.0) → result = [3.0]</text>

  <!-- Round 2 -->
  <g font-size="10">
    <text x="30" y="160" fill="#446688" font-weight="bold">2</text>
    <rect x="80" y="148" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="96" y="164" text-anchor="middle" fill="#446688" font-size="9">9</text>
    <rect x="116" y="148" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="132" y="164" text-anchor="middle" fill="#4a7a3a" font-size="9">20</text>
    <text x="180" y="164" fill="#333">2</text>
    <text x="225" y="164" fill="#888">出 9(无子) → 出 20 → 入 15, 7</text>
    <text x="360" y="164" fill="#446688" font-weight="bold">29</text>
    <text x="410" y="164" fill="#333">2</text>
    <text x="470" y="164" fill="#446688" font-weight="bold">29 / 2 = 14.5</text>
  </g>
  <rect x="20" y="176" width="520" height="18" fill="#e8f0fe" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="9" fill="#446688">result.append(14.5) → result = [3.0, 14.5]</text>
  <text x="30" y="208" font-size="8" fill="#d6a040">注：for 跑 size=2 次，15/7 入队但不参与本轮 sum</text>

  <!-- Round 3 -->
  <g font-size="10">
    <text x="30" y="232" fill="#d6a040" font-weight="bold">3</text>
    <rect x="80" y="220" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="96" y="236" text-anchor="middle" fill="#d6a040" font-size="9">15</text>
    <rect x="116" y="220" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="132" y="236" text-anchor="middle" fill="#d6a040" font-size="9">7</text>
    <text x="180" y="236" fill="#333">2</text>
    <text x="225" y="236" fill="#888">出 15(无子) → 出 7(无子)</text>
    <text x="360" y="236" fill="#d6a040" font-weight="bold">22</text>
    <text x="410" y="236" fill="#333">2</text>
    <text x="470" y="236" fill="#d6a040" font-weight="bold">22 / 2 = 11.0</text>
  </g>
  <rect x="20" y="248" width="520" height="18" fill="#fff8e1" stroke="none" rx="3" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="9" fill="#d6a040">result.append(11.0) → result = [3.0, 14.5, 11.0]</text>

  <!-- Round 4: end -->
  <text x="30" y="288" font-size="10" fill="#888" font-weight="bold">4</text>
  <rect x="80" y="276" width="40" height="22" fill="#eee" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2,2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="290" text-anchor="middle" font-size="9" fill="#888">空</text>
  <text x="140" y="290" font-size="10" fill="#888">队列为空，退出 while</text>

  <!-- Final result -->
  <line x1="20" y1="312" x2="540" y2="312" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="328" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终结果：[3.00000, 14.50000, 11.00000]</text>
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#555">3 轮 = 3 层，每节点入队出队各 1 次 → O(n)</text>

  <!-- overflow reminder -->
  <rect x="30" y="396" width="500" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠️ sum 若用 int：L2 的 29 仍安全，但最坏 5000×(2³¹−1) ≈ 10¹³ 会溢出</text>
  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#555">本题示例数值小看不出来，工业级数据必须 long long / double 累加</text>
</svg>
