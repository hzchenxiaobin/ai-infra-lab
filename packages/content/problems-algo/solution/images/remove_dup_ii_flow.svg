<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：栈 + (字符, 计数)</text>

  <!-- Start -->
  <ellipse cx="280" cy="56" rx="70" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始，栈 = []</text>

  <line x1="280" y1="76" x2="280" y2="94" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <polygon points="280,96 400,140 280,184 160,140" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">还有字符 c?</text>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#666">遍历 s 中每个字符</text>

  <!-- No -> end -->
  <line x1="400" y1="140" x2="470" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="132" text-anchor="middle" font-size="10" fill="#888">否</text>
  <ellipse cx="490" cy="140" rx="48" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="138" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">拼接栈中</text>
  <text x="490" y="152" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">字符返回</text>

  <!-- Yes -> down -->
  <line x1="280" y1="184" x2="280" y2="206" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="200" text-anchor="middle" font-size="10" fill="#888">是</text>

  <!-- Decision: top same char? -->
  <polygon points="280,208 400,248 280,288 160,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">栈顶字符 == c ?</text>
  <text x="280" y="260" text-anchor="middle" font-size="10" fill="#666">且栈非空</text>

  <!-- Yes branch: increment count -->
  <line x1="160" y1="248" x2="90" y2="248" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="240" text-anchor="middle" font-size="10" fill="#888">是</text>

  <rect x="20" y="226" width="70" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="246" text-anchor="middle" font-size="11" fill="#333">栈顶 cnt</text>
  <text x="55" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">+ 1</text>

  <!-- Decision: cnt == k ? -->
  <line x1="55" y1="272" x2="55" y2="296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="55,298 135,330 55,362 0,330" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt == k ?</text>
  <text x="55" y="342" text-anchor="middle" font-size="10" fill="#666">凑满</text>

  <!-- yes: pop -->
  <line x1="135" y1="330" x2="185" y2="330" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="322" text-anchor="middle" font-size="10" fill="#888">是</text>
  <rect x="185" y="312" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="335" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">pop 栈顶</text>

  <!-- no: nothing (keep) -->
  <line x1="55" y1="362" x2="55" y2="390" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="42" y="378" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="14" y="390" width="82" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="410" text-anchor="middle" font-size="10" fill="#888">保留计数，继续</text>

  <!-- loop back from pop / keep to loop head -->
  <path d="M 225 348 Q 225 430 280 430 Q 470 430 470 140 L 400 140" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: push new (c,1) -->
  <line x1="400" y1="248" x2="470" y2="248" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="240" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="470" y="226" width="86" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="513" y="246" text-anchor="middle" font-size="11" fill="#333">push</text>
  <text x="513" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(c, 1)</text>

  <path d="M 513 272 Q 513 430 280 430" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#888">回到循环头取下一字符</text>
</svg>
