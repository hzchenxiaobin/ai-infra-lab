<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：word = "aba"，n = 3</text>

  <!-- Header row -->
  <rect x="30" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="90" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">word[i]</text>
  <rect x="150" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">元音?</text>
  <rect x="230" y="48" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(i+1) × (n−i)</text>
  <rect x="410" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">贡献</text>
  <rect x="490" y="48" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="545" y="66" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans</text>

  <!-- Row 1: i=0, 'a' vowel -->
  <rect x="30" y="78" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="60" y="99" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="90" y="78" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="150" y="78" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✓</text>
  <rect x="230" y="78" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="320" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 × 3 = 3</text>
  <rect x="410" y="78" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="450" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="490" y="78" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="545" y="99" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- Row 2: i=1, 'b' consonant -->
  <rect x="30" y="114" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="135" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="90" y="114" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="150" y="114" width="80" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="135" text-anchor="middle" font-size="12" fill="#888">✗</text>
  <rect x="230" y="114" width="180" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="135" text-anchor="middle" font-size="10" fill="#888">— (跳过)</text>
  <rect x="410" y="114" width="80" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="135" text-anchor="middle" font-size="12" fill="#888">0</text>
  <rect x="490" y="114" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="545" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- Row 3: i=2, 'a' vowel -->
  <rect x="30" y="150" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="60" y="171" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="90" y="150" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="171" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="150" y="150" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="171" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✓</text>
  <rect x="230" y="150" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="320" y="171" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 × 1 = 3</text>
  <rect x="410" y="150" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="450" y="171" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="490" y="150" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="545" y="171" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>

  <!-- Covered substrings per vowel position -->
  <rect x="30" y="200" width="570" height="156" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="40" y="222" font-size="11" fill="#666" font-weight="bold">每个元音覆盖的具体子串（验证贡献数）：</text>

  <!-- i=0 covers -->
  <text x="40" y="244" font-size="11" fill="#b85450" font-weight="bold">i=0 ('a')：覆盖 3 个子串</text>
  <rect x="50" y="250" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="266" text-anchor="middle" font-size="10" fill="#333">"a"</text>
  <text x="75" y="284" text-anchor="middle" font-size="8" fill="#888">l=0,r=0</text>
  <rect x="110" y="250" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="135" y="266" text-anchor="middle" font-size="10" fill="#333">"ab"</text>
  <text x="135" y="284" text-anchor="middle" font-size="8" fill="#888">l=0,r=1</text>
  <rect x="170" y="250" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="266" text-anchor="middle" font-size="10" fill="#333">"aba"</text>
  <text x="195" y="284" text-anchor="middle" font-size="8" fill="#888">l=0,r=2</text>

  <!-- i=2 covers -->
  <text x="300" y="244" font-size="11" fill="#b85450" font-weight="bold">i=2 ('a')：覆盖 3 个子串</text>
  <rect x="310" y="250" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="266" text-anchor="middle" font-size="10" fill="#333">"a"</text>
  <text x="335" y="284" text-anchor="middle" font-size="8" fill="#888">l=2,r=2</text>
  <rect x="370" y="250" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="266" text-anchor="middle" font-size="10" fill="#333">"ba"</text>
  <text x="395" y="284" text-anchor="middle" font-size="8" fill="#888">l=1,r=2</text>
  <rect x="430" y="250" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="266" text-anchor="middle" font-size="10" fill="#333">"aba"</text>
  <text x="455" y="284" text-anchor="middle" font-size="8" fill="#888">l=0,r=2</text>

  <!-- note about overlap -->
  <text x="40" y="312" font-size="10" fill="#4a7a3a" font-weight="bold">💡 注意 "aba" 同时含两个元音 (i=0 和 i=2)，被各计一次 → 该子串贡献 2，</text>
  <text x="40" y="326" font-size="10" fill="#4a7a3a" font-weight="bold">　 这正是「元音总数」而非「含元音子串数」的语义。</text>
  <text x="40" y="344" font-size="10" fill="#555">总元音数 = 1+1+1+1 (四个单/双元音子串各 1) + 2 ("aba") = 6 ✅</text>

  <!-- result -->
  <rect x="180" y="376" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#666">最终结果</text>
  <text x="320" y="416" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">ans = 3 + 0 + 3 = 6 ⭐</text>

  <!-- formula reminder -->
  <text x="320" y="446" text-anchor="middle" font-size="10" fill="#888">Σ (i+1)(n−i) over vowel positions = 1×3 + 3×1 = 6</text>
</svg>
