<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预处理 + 逐查询分解</text>

  <!-- ===== Precompute box ===== -->
  <rect x="40" y="48" width="520" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">预处理（一次性，O(N)）</text>
  <text x="60" y="92" font-size="11" fill="#333">① 线性筛求 SPF[1..10⁴]：每个数的最小质因子，用于 O(log k) 分解</text>
  <text x="60" y="110" font-size="11" fill="#333">② 阶乘 fact[] 与逆阶乘 invFact[]（到 10020）：O(1) 查组合数 C(n,k)</text>

  <!-- arrow down -->
  <path d="M 300 130 Q 300 142 300 154" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Query loop ===== -->
  <rect x="120" y="162" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="188" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">for each query [n, k]:</text>

  <!-- arrow down -->
  <path d="M 300 210 Q 300 222 300 234" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: k == 1? ===== -->
  <polygon points="300,240 420,280 300,320 180,280" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k == 1 ?</text>
  <text x="300" y="294" text-anchor="middle" font-size="10" fill="#888">(乘积为 1 → 全 1)</text>

  <!-- Yes branch -->
  <path d="M 180 280 Q 120 280 120 300" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="272" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="56" y="304" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="116" y="327" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 1</text>

  <!-- No branch -->
  <path d="M 420 280 Q 480 280 480 300" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="272" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Factorize box -->
  <rect x="420" y="304" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="490" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">用 SPF 分解 k</text>
  <text x="490" y="334" text-anchor="middle" font-size="10" fill="#666">k = p₁^e₁ × p₂^e₂ × ···</text>

  <!-- arrow down from factorize -->
  <path d="M 490 348 Q 490 360 490 372" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- For each prime factor -->
  <rect x="360" y="376" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="396" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">for each (pᵢ, eᵢ):</text>
  <text x="490" y="416" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans *= C(n + eᵢ − 1, eᵢ)</text>

  <!-- arrow from yes box down to merge -->
  <path d="M 116 344 Q 116 400 360 400" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- Result box -->
  <rect x="80" y="376" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="398" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">收集 ans</text>
  <text x="160" y="416" text-anchor="middle" font-size="11" fill="#666">（mod 1e9+7）</text>
</svg>
