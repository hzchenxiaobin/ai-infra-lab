<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：合并所有忙碌区间，缝隙 = 共同空闲</text>

  <text x="30" y="56" font-size="11.5" fill="#888" font-weight="bold">① 各员工忙碌区间（散落、可能交叉）</text>

  <line x1="60" y1="82" x2="520" y2="82" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="98" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="180" y="98" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="300" y="98" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="420" y="98" text-anchor="middle" font-size="9.5" fill="#888">7</text>
  <text x="500" y="98" text-anchor="middle" font-size="9.5" fill="#888">9</text>

  <text x="30" y="116" font-size="10" fill="#446688" font-weight="bold">员工0</text>
  <rect x="60" y="110" width="60" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="300" y="110" width="60" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <text x="30" y="136" font-size="10" fill="#4a7a3a" font-weight="bold">员工1</text>
  <rect x="60" y="130" width="120" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <text x="30" y="156" font-size="10" fill="#d6a040" font-weight="bold">员工2</text>
  <rect x="120" y="150" width="120" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="420" y="150" width="80" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <path d="M 280 172 L 280 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="188" font-size="10.5" fill="#666" font-weight="bold">合并（merge）</text>

  <text x="30" y="214" font-size="11.5" fill="#888" font-weight="bold">② 忙碌并集（不相交段）</text>

  <rect x="60" y="222" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="300" y="222" width="60" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="420" y="222" width="80" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="150" y="235" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[1,5)</text>
  <text x="330" y="235" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[6,7)</text>
  <text x="460" y="235" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[9,12)</text>

  <path d="M 280 250 L 280 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="266" font-size="10.5" fill="#666" font-weight="bold">挖缝隙（gaps）</text>

  <text x="30" y="294" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ 共同空闲 = 并集的缝隙</text>

  <rect x="240" y="306" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="306" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[5,6)</text>
  <text x="390" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[7,9)</text>

  <rect x="36" y="346" width="488" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="368" font-size="12" fill="#d6a040" font-weight="bold">关键洞察</text>
  <text x="56" y="386" font-size="10.5" fill="#555">• 共同空闲 ⟺ 忙碌并集的补集中的正长度缝隙</text>
  <text x="56" y="402" font-size="10.5" fill="#555">• 缝隙 = [prev_end, next.start)，条件 prev_end &lt; next.start</text>
  <text x="56" y="418" font-size="10.5" fill="#b85450" font-weight="bold">• 合并消除跨员工重叠 → 才能正确挖缝</text>
</svg>
