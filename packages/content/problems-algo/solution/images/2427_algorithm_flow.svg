<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：求 g = gcd(a,b) → 枚举 i 到 √g 成对计数约数</text>

  <!-- ① Input -->
  <rect x="195" y="42" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 输入 a, b</text>
  <line x1="270" y1="78" x2="270" y2="100" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② init -->
  <rect x="130" y="104" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② g = gcd(a, b); ans = 0; i = 1</text>
  <line x1="270" y1="142" x2="270" y2="164" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ Diamond 1: loop condition -->
  <polygon points="270,168 360,212 270,256 180,212" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i * i ≤ g ?</text>
  <text x="270" y="224" text-anchor="middle" font-size="9.5" fill="#888">（循环条件）</text>

  <!-- No branch (left) → return -->
  <line x1="180" y1="212" x2="112" y2="212" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="22" y="194" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="67" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ return</text>
  <text x="67" y="223" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans</text>

  <!-- Yes branch (down) -->
  <line x1="270" y1="256" x2="270" y2="278" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="272" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ◇ Diamond 2: divisibility -->
  <polygon points="270,282 360,322 270,362 180,322" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">g % i == 0 ?</text>
  <text x="270" y="336" text-anchor="middle" font-size="9.5" fill="#888">（i 是约数）</text>

  <!-- No branch (right) → i++ box -->
  <line x1="360" y1="322" x2="418" y2="322" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="316" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- Yes branch (down) → ans box -->
  <line x1="270" y1="362" x2="270" y2="382" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="376" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ⑤ ans update -->
  <rect x="110" y="386" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="411" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ ans += (i == g / i) ? 1 : 2</text>

  <!-- i++ box (shared) -->
  <rect x="418" y="306" width="80" height="32" fill="#f4f7fb" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="458" y="326" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">i++</text>

  <!-- ans box → i++ (up the right side) -->
  <path d="M 430 404 L 458 404 L 458 340" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ → loop back to Diamond 1 (up then left) -->
  <path d="M 458 306 L 458 212 L 364 212" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="250" text-anchor="middle" font-size="9.5" fill="#888">下一 i</text>

  <!-- footer -->
  <rect x="30" y="436" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="454" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">成对计数：i 与 g/i 一对（+2）；i == g/i（完全平方）只计 +1</text>
</svg>
