<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：哈希映射 字符→下标，O(1) 定位 + 逐字累加移动距离</text>
  <text x="290" y="48" text-anchor="middle" font-size="11.5" fill="#888">keyboard = "abcdefghijklmnopqrstuvwxyz"（每键下标 0~25，初始手指在下标 0）</text>

  <!-- ===== Keyboard row: a-m (positions 0-12) ===== -->
  <!-- a(0) highlighted -->
  <rect x="30" y="62" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <text x="50" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- b(1) highlighted -->
  <rect x="70" y="62" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="90" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <text x="90" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- c(2) highlighted -->
  <rect x="110" y="62" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="130" y="88" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
  <text x="130" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- d(3) -->
  <rect x="150" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="88" text-anchor="middle" font-size="16" fill="#333">d</text>
  <text x="170" y="116" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- e(4) -->
  <rect x="190" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="88" text-anchor="middle" font-size="16" fill="#333">e</text>
  <text x="210" y="116" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- f(5) -->
  <rect x="230" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="88" text-anchor="middle" font-size="16" fill="#333">f</text>
  <text x="250" y="116" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- g(6) -->
  <rect x="270" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="88" text-anchor="middle" font-size="16" fill="#333">g</text>
  <text x="290" y="116" text-anchor="middle" font-size="10" fill="#888">6</text>

  <!-- h(7) -->
  <rect x="310" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="88" text-anchor="middle" font-size="16" fill="#333">h</text>
  <text x="330" y="116" text-anchor="middle" font-size="10" fill="#888">7</text>

  <!-- i(8) -->
  <rect x="350" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="88" text-anchor="middle" font-size="16" fill="#333">i</text>
  <text x="370" y="116" text-anchor="middle" font-size="10" fill="#888">8</text>

  <!-- j(9) -->
  <rect x="390" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="88" text-anchor="middle" font-size="16" fill="#333">j</text>
  <text x="410" y="116" text-anchor="middle" font-size="10" fill="#888">9</text>

  <!-- k(10) -->
  <rect x="430" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="88" text-anchor="middle" font-size="16" fill="#333">k</text>
  <text x="450" y="116" text-anchor="middle" font-size="10" fill="#888">10</text>

  <!-- l(11) -->
  <rect x="470" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="88" text-anchor="middle" font-size="16" fill="#333">l</text>
  <text x="490" y="116" text-anchor="middle" font-size="10" fill="#888">11</text>

  <!-- m(12) -->
  <rect x="510" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="530" y="88" text-anchor="middle" font-size="16" fill="#333">m</text>
  <text x="530" y="116" text-anchor="middle" font-size="10" fill="#888">12</text>

  <text x="556" y="88" font-size="14" fill="#888">···</text>

  <!-- ===== Finger movement for word="cba" ===== -->
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">打字 word = "cba"：手指移动轨迹（起始 0 → 2 → 1 → 0）</text>

  <!-- finger position dots + arrows, staggered vertically -->
  <!-- start dot at pos 0 -->
  <circle cx="50" cy="158" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="50" y="154" text-anchor="middle" font-size="9" fill="#b85450">起始</text>

  <!-- arc 0->2 -->
  <path d="M 55 158 Q 90 188 125 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="90" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|0−2|=2</text>

  <!-- dot at pos 2 -->
  <circle cx="130" cy="158" r="5" fill="#b85450" filter="url(#rough2)"/>

  <!-- arc 2->1 (going left, lower) -->
  <path d="M 128 163 Q 110 193 92 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="112" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|2−1|=1</text>

  <!-- dot at pos 1 -->
  <circle cx="90" cy="170" r="5" fill="#b85450" filter="url(#rough2)"/>

  <!-- arc 1->0 (going left, lower still) -->
  <path d="M 88 175 Q 70 210 52 182" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="70" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|1−0|=1</text>

  <!-- end dot at pos 0 -->
  <circle cx="50" cy="184" r="5" fill="#b85450" filter="url(#rough2)"/>

  <!-- total -->
  <text x="200" y="172" font-size="13" fill="#b85450" font-weight="bold">合计 = 2 + 1 + 1 = 4</text>

  <!-- ===== Position map box ===== -->
  <rect x="300" y="150" width="250" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="425" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">位置映射表 pos[26]</text>
  <text x="425" y="192" text-anchor="middle" font-size="11" fill="#555">建表：for i in 0..25: pos[keyboard[i]] = i</text>
  <text x="425" y="210" text-anchor="middle" font-size="11" fill="#555">查表：pos['c'] = 2，pos['b'] = 1，pos['a'] = 0</text>
  <text x="425" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a">建表 O(26)=O(1)，每次查询 O(1)</text>

  <!-- ===== Formula box ===== -->
  <rect x="50" y="250" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = Σ |pos[prev] − pos[cur]|（prev 初始为 0）</text>
  <text x="290" y="290" text-anchor="middle" font-size="10.5" fill="#555">遍历 word 每个字符：查表 O(1) + 累加距离 O(1) → 全程 O(n)</text>

  <!-- ===== Note box ===== -->
  <rect x="50" y="312" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="334" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">关键：手指只关心「当前下标 → 目标下标」的距离</text>
  <text x="290" y="354" text-anchor="middle" font-size="11" fill="#555">布局任意 → 需哈希表把字符翻译成下标；之后纯模拟累加 |Δ|</text>
</svg>
