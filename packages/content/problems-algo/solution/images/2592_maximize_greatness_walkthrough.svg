<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums=[1,3,5,2,1,3,1] → 排序后逐 j 推进</text>

  <!-- 排序后数组 -->
  <text x="40" y="56" font-size="12" fill="#666" filter="url(#rough2)">排序后：</text>
  <g filter="url(#rough2)">
    <rect x="100" y="42" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="120" y="60" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="142" y="42" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="162" y="60" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="184" y="42" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="204" y="60" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="226" y="42" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="246" y="60" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="268" y="42" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="288" y="60" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="310" y="42" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="330" y="60" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="352" y="42" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="372" y="60" text-anchor="middle" font-size="12" fill="#333">5</text>
  </g>
  <text x="402" y="60" font-size="11" fill="#999" filter="url(#rough2)">↑ j 从 0 扫到 6</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="45" y="84" width="490" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="65" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">j</text>
    <text x="115" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">nums[j]</text>
    <text x="165" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">i</text>
    <text x="215" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">nums[i]</text>
    <text x="300" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">&gt; ?</text>
    <text x="410" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">动作</text>
    <text x="495" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">i结果</text>
  </g>

  <!-- 数据行 -->
  <!-- 跳过行 0,1,2：浅红 -->
  <g filter="url(#rough2)">
    <rect x="45" y="112" width="490" height="24" fill="#fce4ec" stroke="#e0c0c0" stroke-width="1" rx="3"/>
    <text x="65" y="128" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="115" y="128" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="165" y="128" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="215" y="128" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="300" y="128" text-anchor="middle" font-size="11" fill="#b85450">否(=)</text>
    <text x="410" y="128" text-anchor="middle" font-size="11" fill="#b85450">跳过 j++</text>
    <text x="495" y="128" text-anchor="middle" font-size="11" fill="#333">0</text>

    <rect x="45" y="136" width="490" height="24" fill="#fce4ec" stroke="#e0c0c0" stroke-width="1" rx="3"/>
    <text x="65" y="152" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="115" y="152" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="165" y="152" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="215" y="152" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="300" y="152" text-anchor="middle" font-size="11" fill="#b85450">否(=)</text>
    <text x="410" y="152" text-anchor="middle" font-size="11" fill="#b85450">跳过 j++</text>
    <text x="495" y="152" text-anchor="middle" font-size="11" fill="#333">0</text>

    <rect x="45" y="160" width="490" height="24" fill="#fce4ec" stroke="#e0c0c0" stroke-width="1" rx="3"/>
    <text x="65" y="176" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="115" y="176" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="165" y="176" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="215" y="176" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="300" y="176" text-anchor="middle" font-size="11" fill="#b85450">否(=)</text>
    <text x="410" y="176" text-anchor="middle" font-size="11" fill="#b85450">跳过 j++</text>
    <text x="495" y="176" text-anchor="middle" font-size="11" fill="#333">0</text>
  </g>

  <!-- 匹配行 3,4,5,6：浅绿 -->
  <g filter="url(#rough2)">
    <rect x="45" y="184" width="490" height="24" fill="#e6f4ea" stroke="#9ec090" stroke-width="1.5" rx="3"/>
    <text x="65" y="200" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="115" y="200" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="165" y="200" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="215" y="200" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="300" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
    <text x="410" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a">匹配 i++</text>
    <text x="495" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">1</text>

    <rect x="45" y="208" width="490" height="24" fill="#e6f4ea" stroke="#9ec090" stroke-width="1.5" rx="3"/>
    <text x="65" y="224" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text x="115" y="224" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="165" y="224" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="215" y="224" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="300" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
    <text x="410" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a">匹配 i++</text>
    <text x="495" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">2</text>

    <rect x="45" y="232" width="490" height="24" fill="#e6f4ea" stroke="#9ec090" stroke-width="1.5" rx="3"/>
    <text x="65" y="248" text-anchor="middle" font-size="11" fill="#333">5</text>
    <text x="115" y="248" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="165" y="248" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="215" y="248" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="300" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
    <text x="410" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a">匹配 i++</text>
    <text x="495" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">3</text>

    <rect x="45" y="256" width="490" height="24" fill="#e6f4ea" stroke="#9ec090" stroke-width="2" rx="3"/>
    <text x="65" y="272" text-anchor="middle" font-size="11" fill="#333">6</text>
    <text x="115" y="272" text-anchor="middle" font-size="11" fill="#333">5</text>
    <text x="165" y="272" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="215" y="272" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="300" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
    <text x="410" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a">匹配 i++</text>
    <text x="495" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">4</text>
  </g>

  <!-- 说明 -->
  <text x="60" y="304" font-size="11" fill="#666" filter="url(#rough2)">前 3 步 nums[j]==nums[i]==1 相等跳过；从 j=3 起每个 nums[j]&gt;nums[i] 连配 4 次。</text>
  <text x="60" y="320" font-size="11" fill="#666" filter="url(#rough2)">i 始终指向「下一个待满足的位置（最小阈值）」，j 扫描候选值。</text>

  <!-- 答案 -->
  <rect x="200" y="340" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">返回 i = 4</text>

  <text x="290" y="396" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">= n − max_freq = 7 − 3（值 1 出现 3 次）= 4</text>
</svg>
