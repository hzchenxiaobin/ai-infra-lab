<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐行裁剪入池 → 池排序 → 取前 k 个</text>

  <!-- Column 1: per-row loop -->
  <rect x="56" y="42" width="190" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="151" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">开始</text>

  <rect x="56" y="86" width="190" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="151" y="106" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">取下一行 i（从 0 开始）</text>

  <rect x="56" y="140" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="160" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">第 i 行降序排序</text>

  <rect x="56" y="194" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="214" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">截取前 limits[i] 个入候选池</text>

  <polygon points="151,240 215,268 151,296 87,268" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="151" y="272" text-anchor="middle" font-size="10.5" fill="#8f3a35" filter="url(#rough2)">还有下一行？</text>

  <path d="M 151 70 L 151 86" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 151 118 L 151 140" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 151 172 L 151 194" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 151 226 L 151 240" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- loop back: yes -->
  <path d="M 87 268 L 36 268 L 36 102 L 56 102" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="42" y="256" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- no: to column 2 -->
  <path d="M 215 268 L 258 268 L 258 102 L 304 102" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="236" y="256" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Column 2: final phase -->
  <rect x="304" y="86" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="399" y="106" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">候选池 pool 降序排序</text>

  <rect x="304" y="140" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="399" y="160" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">取前 k 个累加（long long）</text>

  <rect x="304" y="194" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="399" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">返回 ans</text>

  <path d="M 399 118 L 399 140" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 399 172 L 399 194" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <text x="399" y="244" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">约束保证 k ≤ Σlimits，候选池永远够取</text>

  <!-- bottom notes -->
  <g filter="url(#rough2)">
    <rect x="56" y="316" width="200" height="36" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="156" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">两步贪心 = 行内裁剪 + 跨行合并</text>
    <text x="156" y="345" text-anchor="middle" font-size="9.5" fill="#55677d">对应 2.2 节的两个证明</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="288" y="316" width="204" height="36" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="390" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">O(nm log m + S log S)</text>
    <text x="390" y="345" text-anchor="middle" font-size="9.5" fill="#55677d">S = Σlimits ≤ n·m（往往远小于）</text>
  </g>
</svg>
