<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：规范化是确定函数 —— 同组 ⟺ 规范形相同</text>

  <!-- 左侧：单封邮件的规范化流水线 -->
  <text x="160" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">逐封规范化</text>

  <rect x="36" y="50" width="248" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">a.b+c.d+e@DoMain.com</text>

  <path d="M 160 76 L 160 86" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="88" width="248" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="105" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">① 整体转小写（新增规则！）</text>

  <path d="M 160 114 L 160 124" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="126" width="248" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="143" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 以 @ 切分 local / domain</text>

  <path d="M 160 152 L 160 162" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="164" width="248" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="181" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ local 截掉首个 + 起的后缀</text>

  <path d="M 160 190 L 160 200" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="202" width="248" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="219" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">④ local 删所有点 .（域名不动）</text>

  <path d="M 160 228 L 160 238" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="66" y="240" width="188" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="258" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">规范形：ab@domain.com</text>

  <!-- 右侧：示例 2 的分组汇聚 -->
  <text x="404" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 2：4 封邮件 → 2 个组</text>

  <rect x="306" y="52" width="102" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="357" y="67" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">A@B.com</text>

  <rect x="306" y="82" width="102" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="357" y="97" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a@b.com</text>

  <rect x="306" y="130" width="102" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="357" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ab+xy@b.com</text>

  <rect x="306" y="160" width="102" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="357" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a.b@b.com</text>

  <rect x="442" y="64" width="66" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="475" y="80" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a@b.com</text>

  <rect x="442" y="142" width="66" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="475" y="158" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ab@b.com</text>

  <path d="M 408 63 L 440 72" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 93 L 440 82" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 141 L 440 150" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 171 L 440 160" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="357" y="112" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">组 ①：大小写合并</text>
  <text x="357" y="196" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">组 ②：+ 截断 &amp; 删点</text>

  <rect x="316" y="212" width="176" height="52" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="404" y="231" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">set = { a@b.com, ab@b.com }</text>
  <text x="404" y="251" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 set 大小 = 2</text>

  <!-- 底部警告 -->
  <rect x="30" y="284" width="460" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">⚠️ 与 929 的关键区别 / 保留规则</text>
  <text x="260" y="324" text-anchor="middle" font-size="10.5" fill="#a0433f" filter="url(#rough2)">区别：整地址大小写不敏感（A@B.com ≡ a@b.com，DoMain ≡ domain）</text>
  <text x="260" y="341" text-anchor="middle" font-size="10.5" fill="#a0433f" filter="url(#rough2)">保留：'.' 与 '+' 规则只作用于 local，域名原样（lee.tcode.com ≠ leetcode.com）</text>
</svg>
