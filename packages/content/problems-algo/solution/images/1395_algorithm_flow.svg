<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：枚举每个 j → 扫左右计四量 → 乘积累加</text>

  <!-- Step 1: init ans -->
  <rect x="60" y="50" width="460" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="74" font-size="12" fill="#446688" font-weight="bold">① 初始化 ans = 0</text>
  <text x="84" y="92" font-size="11" fill="#666">答案累加器，初值 0</text>
  <text x="476" y="80" font-size="10" fill="#888">O(1)</text>

  <path d="M 290 102 L 290 118" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: for each j -->
  <rect x="60" y="120" width="460" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="144" font-size="12" fill="#4a7a3a" font-weight="bold">② 遍历中位 j = 1 … n−2</text>
  <text x="84" y="162" font-size="11" fill="#666">j 不能是首尾（需左右各至少 1 个元素）</text>
  <text x="476" y="150" font-size="10" fill="#888">O(n)</text>

  <path d="M 290 172 L 290 188" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: scan left -->
  <rect x="60" y="190" width="460" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="214" font-size="12" fill="#d6a040" font-weight="bold">③ 扫左侧 [0, j) 统计</text>
  <text x="84" y="232" font-size="11" fill="#666">leftSmaller = #{ i &lt; j : rating[i] &lt; rating[j] }</text>
  <text x="84" y="246" font-size="11" fill="#666">leftLarger  = #{ i &lt; j : rating[i] &gt; rating[j] }</text>
  <text x="476" y="224" font-size="10" fill="#888">O(j)</text>

  <path d="M 290 250 L 290 266" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: scan right -->
  <rect x="60" y="268" width="460" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="292" font-size="12" fill="#d6a040" font-weight="bold">④ 扫右侧 (j, n) 统计</text>
  <text x="84" y="310" font-size="11" fill="#666">rightLarger  = #{ k &gt; j : rating[k] &gt; rating[j] }</text>
  <text x="84" y="324" font-size="11" fill="#666">rightSmaller = #{ k &gt; j : rating[k] &lt; rating[j] }</text>
  <text x="476" y="302" font-size="10" fill="#888">O(n−j)</text>

  <path d="M 290 328 L 290 344" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 5: accumulate -->
  <rect x="60" y="346" width="460" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="370" font-size="12" fill="#b85450" font-weight="bold">⑤ 累加贡献</text>
  <text x="84" y="390" font-size="11" fill="#444">ans += leftSmaller × rightLarger</text>
  <text x="84" y="404" font-size="11" fill="#444">     + leftLarger  × rightSmaller</text>
  <text x="476" y="380" font-size="10" fill="#888">O(1)</text>

  <path d="M 290 406 L 290 422" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="190" y="424" width="200" height="30" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="444" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">返回 ans</text>

  <!-- loop back arrow from step5 to step2 -->
  <path d="M 60 375 L 36 375 L 36 145 L 60 145" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="28" y="260" font-size="10" fill="#888" transform="rotate(-90 28 260)">下一个 j</text>
</svg>
