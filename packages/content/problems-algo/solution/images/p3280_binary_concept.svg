<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="27" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">三个字段各自短除：互不相干，只换进制</text>

  <!-- 输入 date -->
  <text x="176" y="63" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">date =</text>
  <rect x="185" y="44" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"2080-02-29"</text>

  <!-- 右上说明框 -->
  <rect x="355" y="40" width="150" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="57" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">格式不变 year-month-day</text>
  <text x="430" y="73" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">只是每段换成二进制</text>

  <!-- 切分箭头 -->
  <path d="M220,74 L114,93" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M260,74 L260,93" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M300,74 L406,93" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 三段字段框 -->
  <rect x="30" y="96" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">year</text>
  <text x="110" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2080</text>

  <rect x="205" y="96" width="110" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">month</text>
  <text x="260" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">02</text>

  <rect x="330" y="96" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">day</text>
  <text x="410" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">29</text>

  <!-- 短除法机器 -->
  <path d="M110,132 L110,152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M260,132 L260,152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M410,132 L410,152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="156" width="160" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">短除法</text>
  <text x="110" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">÷2 取余 · 逆序拼</text>

  <rect x="205" y="156" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">短除法</text>
  <text x="260" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">÷2 取余</text>

  <rect x="330" y="156" width="160" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">短除法</text>
  <text x="410" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">÷2 取余 · 逆序拼</text>

  <!-- 三段输出 -->
  <path d="M110,200 L110,218" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M260,200 L260,218" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M410,200 L410,218" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="220" width="160" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">100000100000</text>
  <text x="110" y="260" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(12 位，首位必为 1)</text>

  <rect x="205" y="220" width="110" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">10</text>
  <text x="260" y="260" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(2 位)</text>

  <rect x="330" y="220" width="160" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">11101</text>
  <text x="410" y="260" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(5 位)</text>

  <!-- 汇聚到 join -->
  <path d="M110,268 L110,288" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,268 L260,288" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M410,268 L410,288" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="292" width="400" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">"-" 拼接 → 100000100000-10-11101</text>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">十进制前导 0 被 int() 吸收；短除法产出的最高位恒为 1 → 天然无前导零</text>
</svg>
