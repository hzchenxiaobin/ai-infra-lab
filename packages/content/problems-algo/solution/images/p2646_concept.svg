<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心转化：旅行总价最小化 ⟹ 树上打家劫舍</text>

  <!-- Panel 1: 路径唯一 -->
  <text x="95" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 路径唯一</text>
  <circle cx="95" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="50" cy="152" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="156" text-anchor="middle" font-size="11" fill="#333">0</text>
  <circle cx="95" cy="178" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="182" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="140" cy="152" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="156" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="95" y1="108" x2="50" y2="136" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="95" y1="108" x2="140" y2="136" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="95" y1="108" x2="95" y2="162" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="216" text-anchor="middle" font-size="10" fill="#888">旅行 0→3 必经 0-1-3</text>

  <path d="M 172 130 L 198 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Panel 2: 统计频次 -->
  <text x="262" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 统计频次 freq</text>
  <rect x="208" y="74" width="108" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="222" y="96" font-size="11" fill="#333">节点 0 : freq 1</text>
  <text x="222" y="116" font-size="11" fill="#333">节点 1 : freq 3</text>
  <text x="222" y="136" font-size="11" fill="#333">节点 2 : freq 2</text>
  <text x="222" y="156" font-size="11" fill="#333">节点 3 : freq 2</text>
  <line x1="218" y1="168" x2="306" y2="168" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="262" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a">总价 = Σ price[i]·freq[i]</text>

  <path d="M 322 130 L 348 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Panel 3: 树上打家劫舍 -->
  <text x="450" y="56" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 树上打家劫舍</text>
  <rect x="358" y="74" width="184" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="368" y="94" font-size="10" fill="#333">减半节点 i 节省</text>
  <text x="368" y="110" font-size="10" fill="#333" font-weight="bold">save[i] = price[i]·freq[i] / 2</text>
  <text x="368" y="124" font-size="10" fill="#b85450">约束：相邻节点不能同减半</text>

  <rect x="358" y="142" width="184" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="368" y="162" font-size="10" fill="#333" font-weight="bold">dp[u][0]=Σ max(dp[v][0],dp[v][1])</text>
  <text x="368" y="176" font-size="9" fill="#888">u 不减半，子节点随意</text>
  <text x="368" y="196" font-size="10" fill="#333" font-weight="bold">dp[u][1]=save[u]+Σ dp[v][0]</text>
  <text x="368" y="210" font-size="9" fill="#888">u 减半，子节点必不减半</text>
  <text x="368" y="224" font-size="9" fill="#4a7a3a">选不相邻点最大化总节省</text>

  <!-- answer -->
  <rect x="110" y="258" width="340" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">答案 = 总价 − max(dp[root][0], dp[root][1])</text>
  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#446688">最大化节省 ⟺ 最小化总价</text>

  <text x="280" y="345" text-anchor="middle" font-size="10" fill="#888">price 恒为偶数 ⟹ 减半后仍为整数，全程整数运算</text>
</svg>
