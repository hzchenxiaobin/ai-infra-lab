<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：按位与 &gt; 0 ⟺ 存在某一位，所有选中数该位都是 1</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">故「最长组合」= 某位上 1 的个数的最大值</text>

  <!-- bit index header: bit5 bit4(highlight) bit3 bit2 bit1 bit0 -->
  <text x="100" y="78" text-anchor="end" font-size="10" fill="#888">数值</text>
  <text x="164" y="78" text-anchor="middle" font-size="10" fill="#888">b5</text>
  <text x="202" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">b4★</text>
  <text x="240" y="78" text-anchor="middle" font-size="10" fill="#888">b3</text>
  <text x="278" y="78" text-anchor="middle" font-size="10" fill="#888">b2</text>
  <text x="316" y="78" text-anchor="middle" font-size="10" fill="#888">b1</text>
  <text x="354" y="78" text-anchor="middle" font-size="10" fill="#888">b0</text>

  <!-- bit4 column highlight band (behind cells) -->
  <rect x="184" y="86" width="36" height="120" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>

  <!-- row: 16  = 0 1 0 0 0 0 -->
  <text x="100" y="106" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">16</text>
  <rect x="146" y="90" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="184" y="90" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="222" y="90" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="260" y="90" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="278" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="298" y="90" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="316" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="336" y="90" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="354" y="108" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- row: 17  = 0 1 0 0 0 1 -->
  <text x="100" y="134" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">17</text>
  <rect x="146" y="118" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="136" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="184" y="118" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="222" y="118" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="136" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="260" y="118" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="278" y="136" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="298" y="118" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="316" y="136" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="336" y="118" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="354" y="136" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- row: 62  = 1 1 1 1 1 0 -->
  <text x="100" y="162" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">62</text>
  <rect x="146" y="146" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="164" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="184" y="146" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="164" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="222" y="146" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="164" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="260" y="146" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="278" y="164" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="298" y="146" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="316" y="164" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="336" y="146" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="354" y="164" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- row: 24  = 0 1 1 0 0 0 -->
  <text x="100" y="190" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">24</text>
  <rect x="146" y="174" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="164" y="192" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="184" y="174" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="222" y="174" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="192" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="260" y="174" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="278" y="192" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="298" y="174" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="316" y="192" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="336" y="174" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="354" y="192" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- separator -->
  <line x1="140" y1="206" x2="376" y2="206" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- AND row -->
  <text x="100" y="226" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">AND</text>
  <rect x="146" y="210" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="228" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="184" y="210" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="222" y="210" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="228" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="260" y="210" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="228" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="298" y="210" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="228" text-anchor="middle" font-size="13" fill="#b85450">0</text>
  <rect x="336" y="210" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="228" text-anchor="middle" font-size="13" fill="#b85450">0</text>

  <!-- bracket: bit4 all 1 -->
  <path d="M186 240 L186 248 L218 248 L218 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="202" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b4 全 1 → AND=16&gt;0</text>

  <!-- arrow down to summary -->
  <path d="M270 268 L270 280" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary box -->
  <rect x="60" y="284" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b4 上 1 的个数 = 4 → 可凑出长度 4 的组合（AND &gt; 0）</text>

  <text x="270" y="338" text-anchor="middle" font-size="10.5" fill="#888">对每一位都这么数，取最大值即答案</text>
</svg>
