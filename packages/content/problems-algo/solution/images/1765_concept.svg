<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">地图中的最高点：高度 = 到最近水域的 BFS 距离</text>
  <text x="380" y="52" text-anchor="middle" font-size="11" fill="#888">所有水域同时入队（多源 BFS），逐层扩展，层数即为高度</text>

  <!-- Left grid: isWater input -->
  <text x="140" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">输入 isWater</text>
  <g font-size="14">
    <g filter="url(#rough2)">
      <rect x="80" y="90" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="100" y="115" text-anchor="middle" fill="#aaa">·</text>
      <rect x="120" y="90" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="140" y="115" text-anchor="middle" fill="#aaa">·</text>
      <rect x="160" y="90" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="180" y="115" text-anchor="middle" fill="#446688" font-weight="bold">W</text>
      <rect x="80" y="130" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="100" y="155" text-anchor="middle" fill="#446688" font-weight="bold">W</text>
      <rect x="120" y="130" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="140" y="155" text-anchor="middle" fill="#aaa">·</text>
      <rect x="160" y="130" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="180" y="155" text-anchor="middle" fill="#aaa">·</text>
      <rect x="80" y="170" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="100" y="195" text-anchor="middle" fill="#aaa">·</text>
      <rect x="120" y="170" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="140" y="195" text-anchor="middle" fill="#aaa">·</text>
      <rect x="160" y="170" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/><text x="180" y="195" text-anchor="middle" fill="#aaa">·</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 210 150 L 270 150" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="140" text-anchor="middle" font-size="10" fill="#666">多源 BFS</text>

  <!-- Right grid: height output -->
  <text x="400" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">输出 height</text>
  <g font-size="14">
    <g filter="url(#rough2)">
      <rect x="340" y="90" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="360" y="115" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="380" y="90" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="400" y="115" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="420" y="90" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="440" y="115" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
      <rect x="340" y="130" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="360" y="155" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
      <rect x="380" y="130" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="400" y="155" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="420" y="130" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="440" y="155" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="340" y="170" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="360" y="195" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="380" y="170" width="40" height="40" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="400" y="195" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
      <rect x="420" y="170" width="40" height="40" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="440" y="195" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    </g>
  </g>

  <!-- BFS layer legend -->
  <g filter="url(#rough2)">
    <rect x="520" y="88" width="200" height="134" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="620" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">BFS 层级 = 高度</text>
  <g font-size="10">
    <g filter="url(#rough2)">
      <rect x="536" y="120" width="16" height="16" fill="#e8f0fe" stroke="#446688" rx="2"/>
    </g>
    <text x="560" y="132" fill="#444">Layer 0：水域，h = 0</text>
    <g filter="url(#rough2)">
      <rect x="536" y="144" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" rx="2"/>
    </g>
    <text x="560" y="156" fill="#444">Layer 1：邻接水域，h = 1</text>
    <g filter="url(#rough2)">
      <rect x="536" y="168" width="16" height="16" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    </g>
    <text x="560" y="180" fill="#444">Layer 2：再远一层，h = 2</text>
    <g filter="url(#rough2)">
      <rect x="536" y="192" width="16" height="16" fill="#fce4ec" stroke="#b85450" rx="2"/>
    </g>
    <text x="560" y="204" fill="#444">Layer k：第 k 层，h = k</text>
  </g>

  <!-- Key insight box -->
  <g filter="url(#rough2)">
    <rect x="60" y="246" width="660" height="158" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="80" y="274" font-size="13" font-weight="bold" fill="#2e6e2e">核心洞察</text>
  <g font-size="11" fill="#444">
    <text x="80" y="298">① 约束 $|h(a) - h(b)| \le 1$ 意味着高度每步最多 +1，从水域出发 d 步内最多到达高度 d</text>
    <text x="80" y="320">② 要使最大高度最大化，每个格子应取其到最近水域的距离 d —— 这是该格高度的上界</text>
    <text x="80" y="342">③ 多源 BFS 天然计算"到最近源点的距离"：所有水域同时入队，第 k 层 = 距离 k</text>
    <text x="80" y="364">④ 设 h = BFS 层数同时满足三条约束：非负 ✓、水域为 0 ✓、相邻差 ≤ 1 ✓（层差 0 或 1）</text>
    <text x="80" y="388" fill="#b85450" font-weight="bold">结论：高度矩阵 = 多源 BFS 的距离矩阵，与 542「01 矩阵」完全同构</text>
  </g>
</svg>
