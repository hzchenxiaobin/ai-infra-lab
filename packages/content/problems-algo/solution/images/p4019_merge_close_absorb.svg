<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：稳定串末位追加——新字符只有两种命运（k = 2）</text>
    <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888">R 恒「稳定」（内部无靠近对）；追加 c 不改变旧距离 ⇒ 新靠近对必以 c 为右端</text>

    <!-- ===== Panel A: absorb ===== -->
    <text x="40" y="72" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">情形一：L − last[c] ≤ k ⇒ 丢弃（示例 3 中 R = "yb"，新来 c = y）</text>

    <text x="62" y="88" text-anchor="middle" font-size="9" fill="#a87020" font-weight="bold">last[y]=0</text>
    <text x="158" y="88" text-anchor="middle" font-size="9" fill="#7a5c1a" font-weight="bold">c 新来</text>

    <rect x="40" y="94" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="62" y="118" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">y</text>
    <rect x="88" y="94" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="110" y="118" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">b</text>
    <rect x="136" y="94" width="44" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" rx="4"/>
    <text x="158" y="118" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">y</text>

    <text x="62" y="144" text-anchor="middle" font-size="9" fill="#889">0</text>
    <text x="110" y="144" text-anchor="middle" font-size="9" fill="#889">1</text>
    <text x="158" y="144" text-anchor="middle" font-size="9" fill="#889">L=2</text>

    <path d="M 158 92 C 130 62, 90 62, 66 90" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
    <text x="112" y="58" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">并入左侧 ⇒ 删右端 = 新字符自己</text>

    <path d="M 62 150 H 158" stroke="#d6a040" stroke-width="1.6" marker-start="url(#arrO)" marker-end="url(#arrO)"/>
    <text x="110" y="168" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">L − last[y] = 2 − 0 = 2 ≤ k</text>

    <rect x="240" y="96" width="190" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="335" y="116" text-anchor="middle" font-size="10" fill="#8c3a36" font-weight="bold">靠近 ⇒ 只触发一次合并</text>
    <text x="335" y="134" text-anchor="middle" font-size="9.5" fill="#8c3a36">删的是右端新字符，R 原样弹回</text>
    <text x="335" y="152" text-anchor="middle" font-size="9.5" fill="#8c3a36" font-weight="bold">⇒ 丢弃 c：R、last 全不变</text>

    <!-- ===== Panel B: append ===== -->
    <text x="40" y="206" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold">情形二：L − last[c] &gt; k ⇒ 追加（R = "ybz"，新来 c = y）</text>

    <text x="62" y="222" text-anchor="middle" font-size="9" fill="#a87020" font-weight="bold">last[y]=0</text>
    <text x="206" y="222" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">c 新来</text>

    <rect x="40" y="228" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="62" y="252" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">y</text>
    <rect x="88" y="228" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="110" y="252" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">b</text>
    <rect x="136" y="228" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="158" y="252" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">z</text>
    <rect x="184" y="228" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" rx="4"/>
    <text x="206" y="252" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold">y</text>

    <text x="62" y="278" text-anchor="middle" font-size="9" fill="#889">0</text>
    <text x="110" y="278" text-anchor="middle" font-size="9" fill="#889">1</text>
    <text x="158" y="278" text-anchor="middle" font-size="9" fill="#889">2</text>
    <text x="206" y="278" text-anchor="middle" font-size="9" fill="#889">L=3</text>

    <path d="M 62 284 H 206" stroke="#d6a040" stroke-width="1.6" marker-start="url(#arrO)" marker-end="url(#arrO)"/>
    <text x="134" y="302" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">L − last[y] = 3 − 0 = 3 &gt; k</text>

    <rect x="240" y="230" width="190" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="335" y="250" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">最近的都不靠近</text>
    <text x="335" y="268" text-anchor="middle" font-size="9.5" fill="#2f5d24">更早的出现只会更远 ⇒ 全不靠近</text>
    <text x="335" y="286" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">⇒ 追加 c：R ← "ybzy"，last[y] ← 3</text>

    <!-- ===== takeaway ===== -->
    <rect x="40" y="330" width="560" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="320" y="350" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold">要点小结（官方 hint 1 + hint 2）</text>
    <text x="58" y="370" text-anchor="start" font-size="9" fill="#7a5c1a">① R 永远稳定：旧距离不被追加改变 ⇒ 新靠近对只能以 c 为右端（hint 1）——合并删右端 ⇒ R 弹回稳定态</text>
    <text x="58" y="388" text-anchor="start" font-size="9" fill="#7a5c1a">② 判定只看 last[c]（26 格下标表）：最近的出现不靠近 ⇒ 全都不靠近（hint 2），每字符 O(1) 定去留</text>
    <text x="58" y="406" text-anchor="start" font-size="9" fill="#7a5c1a">③ 丢弃时 R、last 一律不动；追加时才更新 last[c] —— 一趟从左到右，总复杂度 O(n)</text>
    <text x="58" y="424" text-anchor="start" font-size="9" fill="#7a5c1a">④ 等价性支点「冻结引理」见题解 2.2 观察三：吸收一旦发生，[0..j] 段永久冻结</text>
  </g>
</svg>
