<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：离线排序查询 + 最小堆「前沿」单调扩张</text>
  <path d="M 370 40 Q 440 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="90" y="60" width="320" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="250.0" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 排序查询：按 q 升序、带原下标</text>
  <path d="M 250.0 104 L 250.0 120" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="90" y="122" width="320" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="250.0" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">② 最小堆初始化：push(grid[0][0],0,0)</text>
  <text x="250.0" y="162" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">visited[0][0]=true，cnt=0</text>
  <path d="M 250.0 172 L 250.0 190" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="90" y="192" width="320" height="86" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="250.0" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">③ 对每个查询 q（升序）：</text>
  <text x="250.0" y="232" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">while 堆非空 且 堆顶.value &lt; q：</text>
  <text x="250.0" y="250" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">  弹出 (v,r,c)；cnt++</text>
  <text x="250.0" y="268" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">  未访问的 4 邻压入堆（标 visited）</text>
  <path d="M 250.0 278 L 250.0 296" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="90" y="298" width="320" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="250.0" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">④ answer[原下标] = cnt</text>
  <path d="M 250.0 338 L 250.0 356" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="90" y="358" width="320" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="250.0" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">⑤ 返回 answer</text>
  <g filter="url(#sk)"><rect x="460" y="120" width="370" height="200" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="480" y="146" font-size="13" font-weight="bold" fill="#444" filter="url(#sk)">为什么是对的？（单调 + 归纳）</text>
  <text x="480" y="170" font-size="11" fill="#444" filter="url(#sk)">• 堆按「格子值」排序，弹出格子 n 时</text>
  <text x="480" y="188" font-size="11" fill="#444" filter="url(#sk)">  其值 v &lt; q，且必由某已弹出邻居推入</text>
  <text x="480" y="206" font-size="11" fill="#444" filter="url(#sk)">  → 存在 (0,0) 到 n 全程 &lt; q 的路径 ✓</text>
  <text x="480" y="228" font-size="11" fill="#444" filter="url(#sk)">• 查询升序 → 已弹区域只增不减</text>
  <text x="480" y="246" font-size="11" fill="#444" filter="url(#sk)">  → 堆与 cnt 跨查询复用，不重置</text>
  <text x="480" y="268" font-size="11" fill="#444" filter="url(#sk)">• 每格至多入堆/出堆各一次</text>
  <text x="480" y="286" font-size="11" fill="#444" filter="url(#sk)">  → 总堆操作 O(mn)</text>
  <text x="480" y="308" font-size="10" fill="#7a5415" filter="url(#sk)">visited 在「入堆时」标记，去重复入堆</text>
  <g filter="url(#sk)"><rect x="90" y="404" width="740" height="50" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="110" y="428" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">复杂度</text>
  <text x="110" y="446" font-size="11" fill="#444" filter="url(#sk)">时间 O(mn·log mn + k·log k)；空间 O(mn)。m,n≤1000、mn≤1e5、k≤1e4，约 1e5·log 级别，轻松通过。</text>
</svg>
