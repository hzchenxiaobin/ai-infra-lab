<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">匹配演算：text = "aabaabaaf"，pattern = "aabaaf"</text>

  <text x="28" y="58" font-size="11" fill="#888">下标:</text>
  <text x="70" y="58" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="112" y="58" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="154" y="58" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="196" y="58" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="238" y="58" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="280" y="58" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">5</text>
  <text x="322" y="58" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="364" y="58" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">7</text>
  <text x="406" y="58" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">8</text>

  <rect x="50" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="92" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="134" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="176" y="64" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="218" y="64" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="238" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="260" y="64" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>
  <rect x="302" y="64" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="322" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="344" y="64" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="364" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="386" y="64" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="406" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>

  <text x="28" y="120" font-size="11" fill="#888">pattern:</text>
  <rect x="50" y="104" width="40" height="30" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="13" fill="#555">a</text>
  <rect x="92" y="104" width="40" height="30" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="124" text-anchor="middle" font-size="13" fill="#555">a</text>
  <rect x="134" y="104" width="40" height="30" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="124" text-anchor="middle" font-size="13" fill="#555">b</text>
  <rect x="176" y="104" width="40" height="30" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="124" text-anchor="middle" font-size="13" fill="#555">a</text>
  <rect x="218" y="104" width="40" height="30" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="124" text-anchor="middle" font-size="13" fill="#555">a</text>
  <rect x="260" y="104" width="40" height="30" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="13" fill="#555">f</text>
  <text x="305" y="124" font-size="10" fill="#888">(j = 0..5)</text>

  <text x="40" y="168" font-size="12" fill="#444" font-weight="bold">步</text>
  <text x="90" y="168" font-size="12" fill="#444" font-weight="bold">i</text>
  <text x="135" y="168" font-size="12" fill="#444" font-weight="bold">j</text>
  <text x="220" y="168" font-size="12" fill="#444" font-weight="bold">比较</text>
  <text x="320" y="168" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="470" y="168" font-size="12" fill="#444" font-weight="bold">结果</text>

  <line x1="30" y1="176" x2="560" y2="176" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="198" font-size="11" fill="#333">1</text>
  <text x="90" y="198" font-size="11" fill="#333">0→4</text>
  <text x="135" y="198" font-size="11" fill="#333">0→4</text>
  <text x="190" y="198" font-size="11" fill="#333">a,b,a 逐个相等</text>
  <text x="320" y="198" font-size="11" fill="#82b366">连续匹配, i,j 同步前进</text>
  <text x="480" y="198" font-size="11" fill="#333" font-weight="bold">j=5</text>

  <text x="40" y="220" font-size="11" fill="#333">2</text>
  <text x="90" y="220" font-size="11" fill="#333">5</text>
  <text x="135" y="220" font-size="11" fill="#333">5</text>
  <text x="190" y="220" font-size="11" fill="#b85450">b ≠ f</text>
  <text x="320" y="220" font-size="11" fill="#b85450">失配 → j=lps[4]=2 (i 不动) ⭐</text>
  <text x="480" y="220" font-size="11" fill="#d6a040" font-weight="bold">j=2</text>

  <text x="40" y="242" font-size="11" fill="#333">3</text>
  <text x="90" y="242" font-size="11" fill="#333">5</text>
  <text x="135" y="242" font-size="11" fill="#333">2</text>
  <text x="190" y="242" font-size="11" fill="#333">b = b</text>
  <text x="320" y="242" font-size="11" fill="#82b366">匹配, j++</text>
  <text x="480" y="242" font-size="11" fill="#333" font-weight="bold">j=3</text>

  <text x="40" y="264" font-size="11" fill="#333">4</text>
  <text x="90" y="264" font-size="11" fill="#333">6</text>
  <text x="135" y="264" font-size="11" fill="#333">3</text>
  <text x="190" y="264" font-size="11" fill="#333">a = a</text>
  <text x="320" y="264" font-size="11" fill="#82b366">匹配, j++</text>
  <text x="480" y="264" font-size="11" fill="#333" font-weight="bold">j=4</text>

  <text x="40" y="286" font-size="11" fill="#333">5</text>
  <text x="90" y="286" font-size="11" fill="#333">7</text>
  <text x="135" y="286" font-size="11" fill="#333">4</text>
  <text x="190" y="286" font-size="11" fill="#333">a = a</text>
  <text x="320" y="286" font-size="11" fill="#82b366">匹配, j++</text>
  <text x="480" y="286" font-size="11" fill="#333" font-weight="bold">j=5</text>

  <text x="40" y="308" font-size="11" fill="#333">6</text>
  <text x="90" y="308" font-size="11" fill="#333">8</text>
  <text x="135" y="308" font-size="11" fill="#333">5</text>
  <text x="190" y="308" font-size="11" fill="#333">f = f</text>
  <text x="320" y="308" font-size="11" fill="#4a7a3a">j=6=m → 命中!</text>
  <text x="480" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">返回 3</text>

  <rect x="50" y="328" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">匹配起点 = i − m + 1 = 8 − 6 + 1 = 3 → text[3..8] = "aabaaf"</text>

  <text x="290" y="382" text-anchor="middle" font-size="11" fill="#888">主串指针 i 从 0 单调递增到 8，从未回退 → 整体 O(n)</text>
</svg>
