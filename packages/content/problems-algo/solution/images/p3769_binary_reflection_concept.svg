<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">二进制反射：反转比特串，前导零自动消失</text>

  <!-- 行 1：6 = 110 → 011 → 3 -->
  <rect x="26" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="46" y="80" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <path d="M 70 75 L 90 75" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="58" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="134" y="58" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="168" y="58" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="115" y="80" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="149" y="80" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="183" y="80" text-anchor="middle" font-size="14" fill="#333">0</text>
  </g>

  <path d="M 204 70 Q 224 44 244 70" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="224" y="42" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">反转</text>

  <g filter="url(#rough2)">
    <rect x="252" y="58" width="30" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="286" y="58" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="320" y="58" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="267" y="80" text-anchor="middle" font-size="14" fill="#999999">0</text>
    <text x="301" y="80" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="335" y="80" text-anchor="middle" font-size="14" fill="#333">1</text>
  </g>
  <text x="267" y="52" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">前导零</text>

  <text x="366" y="82" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 3</text>

  <text x="100" y="116" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">最高位变 0：数值上就是前导零，自动消失</text>

  <!-- 行 2：8 = 1000 → 0001 → 1 -->
  <rect x="26" y="138" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="46" y="160" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>

  <path d="M 70 155 L 90 155" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="138" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="134" y="138" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="168" y="138" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="202" y="138" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="115" y="160" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="149" y="160" text-anchor="middle" font-size="14" fill="#333">0</text>
    <text x="183" y="160" text-anchor="middle" font-size="14" fill="#333">0</text>
    <text x="217" y="160" text-anchor="middle" font-size="14" fill="#333">0</text>
  </g>

  <path d="M 240 150 Q 260 124 280 150" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">反转</text>

  <g filter="url(#rough2)">
    <rect x="288" y="138" width="30" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="322" y="138" width="30" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="356" y="138" width="30" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="390" y="138" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="303" y="160" text-anchor="middle" font-size="14" fill="#999999">0</text>
    <text x="337" y="160" text-anchor="middle" font-size="14" fill="#999999">0</text>
    <text x="371" y="160" text-anchor="middle" font-size="14" fill="#999999">0</text>
    <text x="405" y="160" text-anchor="middle" font-size="14" fill="#333">1</text>
  </g>
  <text x="322" y="132" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">前导零</text>

  <text x="432" y="162" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 1</text>

  <text x="100" y="196" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">三个前导零全部丢弃，只剩最后的 1</text>

  <!-- 行 3：5 = 101 → 101 → 5 -->
  <rect x="26" y="218" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="46" y="240" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <path d="M 70 235 L 90 235" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="218" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="134" y="218" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="168" y="218" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="115" y="240" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="149" y="240" text-anchor="middle" font-size="14" fill="#333">0</text>
    <text x="183" y="240" text-anchor="middle" font-size="14" fill="#333">1</text>
  </g>

  <path d="M 204 230 Q 224 204 244 230" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="224" y="202" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">反转</text>

  <g filter="url(#rough2)">
    <rect x="252" y="218" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="286" y="218" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="320" y="218" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="267" y="240" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="301" y="240" text-anchor="middle" font-size="14" fill="#333">0</text>
    <text x="335" y="240" text-anchor="middle" font-size="14" fill="#333">1</text>
  </g>

  <text x="366" y="242" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 5</text>

  <text x="100" y="276" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">回文的二进制反射不变（3=11、5=101、7=111…）</text>

  <!-- 底部总结 -->
  <rect x="40" y="296" width="440" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">r = (r &lt;&lt; 1) | (x &amp; 1)；x &gt;&gt;= 1 —— 把 x 的最低位逐位搬进 r</text>
  <text x="260" y="339" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">循环条件 x &gt; 0 只扫有效位：前导零无需任何特判</text>
</svg>
