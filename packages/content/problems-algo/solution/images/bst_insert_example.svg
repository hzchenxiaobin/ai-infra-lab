<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：插入 val = 25</text>

  <!-- ===== 原始树 ===== -->
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原始 BST</text>

  <!-- 40 (path) -->
  <circle cx="150" cy="88" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">40</text>

  <!-- 40 → 20 (path) -->
  <line x1="142" y1="100" x2="113" y2="126" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 20 (path) -->
  <circle cx="106" cy="138" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="106" y="142" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">20</text>

  <!-- 40 → 60 (非路径) -->
  <line x1="158" y1="100" x2="194" y2="126" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="200" cy="138" r="13" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="142" text-anchor="middle" font-size="10" fill="#999">60</text>

  <!-- 20 → 10 (非路径) -->
  <line x1="100" y1="150" x2="82" y2="174" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="78" cy="186" r="11" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="190" text-anchor="middle" font-size="9" fill="#999">10</text>

  <!-- 20 → 30 (path) -->
  <line x1="114" y1="150" x2="126" y2="174" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 30 (path) -->
  <circle cx="132" cy="186" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="132" y="190" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">30</text>

  <!-- 60 的子节点 (淡) -->
  <line x1="194" y1="150" x2="180" y2="174" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="176" cy="186" r="10" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="176" y="189" text-anchor="middle" font-size="8" fill="#aaa">50</text>
  <line x1="206" y1="150" x2="220" y2="174" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="224" cy="186" r="10" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="224" y="189" text-anchor="middle" font-size="8" fill="#aaa">70</text>

  <!-- 空位 (虚线) -->
  <line x1="126" y1="198" x2="112" y2="222" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="108" cy="234" r="12" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="108" y="238" text-anchor="middle" font-size="10" fill="#d6a040">?</text>
  <text x="108" y="256" text-anchor="middle" font-size="9" fill="#d6a040">空位=插入点</text>

  <!-- 搜索路径标注 -->
  <text x="150" y="266" text-anchor="middle" font-size="9" fill="#446688">搜索路径：40 → 20 → 30 → 空</text>

  <!-- ===== 步骤说明框 ===== -->
  <rect x="300" y="50" width="260" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="316" y="72" font-size="12" fill="#333" font-weight="bold">执行步骤：</text>

  <text x="316" y="96" font-size="10" fill="#446688">Step 1: 25 &lt; 40 → 向左走到 20</text>
  <text x="316" y="118" font-size="10" fill="#446688">Step 2: 25 &gt; 20 → 向右走到 30</text>
  <text x="316" y="140" font-size="10" fill="#446688">Step 3: 25 &lt; 30 → 向左，左子为 null</text>
  <text x="316" y="162" font-size="10" fill="#4a7a3a">Step 4: 在 30 的左空位挂新节点 25</text>
  <text x="316" y="190" font-size="10" fill="#82b366">✓ 完成，25 成为 30 的左孩子（叶子）</text>
  <text x="316" y="212" font-size="9" fill="#888">递归：root.left=insert(null) 返回新节点</text>

  <!-- ===== 中间箭头 ===== -->
  <path d="M 150 278 L 150 308" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="298" font-size="10" fill="#888">插入后</text>

  <!-- ===== 结果树 ===== -->
  <text x="150" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">插入后 BST</text>

  <!-- 40 -->
  <circle cx="150" cy="352" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="356" text-anchor="middle" font-size="11" fill="#333">40</text>

  <!-- 40 → 20 -->
  <line x1="142" y1="364" x2="113" y2="384" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="106" cy="394" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="398" text-anchor="middle" font-size="10" fill="#333">20</text>

  <!-- 40 → 60 -->
  <line x1="158" y1="364" x2="194" y2="384" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="200" cy="394" r="13" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="398" text-anchor="middle" font-size="10" fill="#999">60</text>

  <!-- 20 → 10 -->
  <line x1="100" y1="406" x2="82" y2="428" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="78" cy="438" r="11" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="442" text-anchor="middle" font-size="9" fill="#999">10</text>

  <!-- 20 → 30 -->
  <line x1="114" y1="406" x2="126" y2="428" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="132" cy="438" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="442" text-anchor="middle" font-size="10" fill="#333">30</text>

  <!-- 60 → 50 -->
  <line x1="194" y1="406" x2="180" y2="428" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="176" cy="438" r="10" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="176" y="441" text-anchor="middle" font-size="8" fill="#aaa">50</text>
  <!-- 60 → 70 -->
  <line x1="206" y1="406" x2="220" y2="428" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="224" cy="438" r="10" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="224" y="441" text-anchor="middle" font-size="8" fill="#aaa">70</text>

  <!-- 30 → 新25 -->
  <line x1="126" y1="450" x2="114" y2="466" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="108" cy="476" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="108" y="480" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">25</text>

  <!-- 新节点标注 -->
  <path d="M 96 476 L 60 476" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="20" y="470" font-size="9" fill="#4a7a3a" font-weight="bold">新插入</text>
  <text x="24" y="482" font-size="9" fill="#4a7a3a">叶子</text>

  <!-- ===== 底部中序验证 ===== -->
  <rect x="40" y="505" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="525" font-size="11" fill="#333" font-weight="bold">中序验证（BST 性质保持）：</text>
  <text x="60" y="543" font-size="11" fill="#446688">插入前：[10,20,30,40,50,60,70]  →  插入后：[10,20,25,30,40,50,60,70]  ✓ 仍严格递增</text>
</svg>
