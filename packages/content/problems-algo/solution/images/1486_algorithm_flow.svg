<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：ans=0 → 遍历 i=0..n−1 折叠异或 → 返回 ans</text>

  <!-- Start -->
  <ellipse cx="200" cy="50" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="54" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 200 66 L 200 78" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: init -->
  <rect x="80" y="80" width="240" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="middle" font-size="11.5" fill="#333">ans = 0；i = 0</text>

  <path d="M 200 112 L 200 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="200,126 280,162 200,198 120,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="166" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- Yes branch down -->
  <path d="M 200 198 L 200 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Box: ans ^= start + 2*i -->
  <rect x="40" y="216" width="320" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="236" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">ans ^= start + 2 * i</text>

  <path d="M 200 248 L 200 260" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: i += 1 -->
  <rect x="140" y="262" width="120" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="280" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <!-- loop back -->
  <path d="M 140 276 L 44 276 L 44 162 L 118 162" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="48" y="156" font-size="10.5" fill="#4a7a3a">回到判断</text>

  <!-- No branch right -->
  <path d="M 280 162 L 322 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="156" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Box: return ans -->
  <rect x="322" y="146" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="166" text-anchor="middle" font-size="11.5" fill="#333">返回 ans</text>

  <path d="M 382 178 L 382 190" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="382" cy="208" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="212" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- footer note -->
  <rect x="56" y="340" width="448" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#555">一趟遍历 n 次，每次一次异或 → O(n) 时间 / O(1) 空间</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">元素 start+2*i 随用随算，不建数组，ans 单变量折叠</text>
</svg>
