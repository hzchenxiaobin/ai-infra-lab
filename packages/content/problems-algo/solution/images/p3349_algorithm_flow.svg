<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>
  <text x="300" y="18" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：先递推 f，再枚举 a 检查</text>

  <!-- ============ 左列：阶段① 递推 f ============ -->
  <rect x="105" y="36" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="140" y="54" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 140 62 L 140 74" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="60" y="78" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="98" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">f[0] = 1, i = 1</text>
  <path d="M 140 108 L 140 122" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="140,126 215,160 140,194 65,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="165" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="150" y="208" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 140 194 L 140 210" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="140,214 200,250 140,286 80,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="246" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">nums[i] &gt;</text>
  <text x="140" y="262" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">nums[i−1] ?</text>

  <!-- 否 → f[i]=1 -->
  <path d="M 200 250 L 211 250" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="206" y="241" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="215" y="234" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="245" y="255" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">f[i] = 1</text>

  <!-- 是 ↓ f[i]=f[i-1]+1 -->
  <text x="150" y="298" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 140 286 L 140 298" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="68" y="302" width="144" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="322" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">f[i] = f[i−1] + 1</text>

  <!-- 汇合 → i++ -->
  <path d="M 140 332 L 140 342" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 245 266 L 245 360 L 176 360" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="110" y="346" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="365" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">i++</text>

  <!-- 回环 -->
  <path d="M 110 360 C 40 360, 40 160, 62 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="46" y="266" font-size="10" fill="#666" filter="url(#rough2)">下一个 i</text>

  <!-- 阶段①→阶段② -->
  <path d="M 215 160 C 260 160, 260 93, 408 93" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="228" y="152" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="300" y="112" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">f 递推完成</text>

  <!-- ============ 右列：阶段② 枚举检查 ============ -->
  <rect x="415" y="78" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="98" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">a = 0</text>
  <path d="M 450 108 L 450 122" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="450,126 520,160 450,194 380,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="165" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">a + 2k ≤ n ?</text>

  <!-- 否 → return false -->
  <path d="M 520 160 L 524 160" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="522" y="150" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="528" y="146" width="68" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="562" y="165" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- 是 ↓ 大菱形 -->
  <text x="460" y="206" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 450 194 L 450 206" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="450,210 575,262 450,314 325,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">f[a+k−1] ≥ k</text>
  <text x="450" y="276" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">且 f[a+2k−1] ≥ k ?</text>

  <!-- 是 ↓ return true -->
  <text x="460" y="328" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 450 314 L 450 332" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="405" y="336" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="355" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- 否 ← a++ -->
  <path d="M 325 262 L 306 262" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="316" y="252" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="242" y="246" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="272" y="267" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">a++</text>

  <!-- a++ 回环到 a+2k<=n -->
  <path d="M 272 246 C 272 170, 340 160, 376 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="306" y="212" font-size="10" fill="#666" filter="url(#rough2)">下一个 a</text>

  <!-- 底部要点 -->
  <rect x="20" y="390" width="560" height="92" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="412" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">💡 两遍线性扫描：先递推 f[i]（递增 +1 / 断裂归 1），再枚举第一段起点 a，</text>
  <text x="34" y="430" font-size="10" fill="#333" filter="url(#rough2)">检查 f[a+k−1] ≥ k 且 f[a+2k−1] ≥ k（第二段起点被 b = a + k 唯一确定）。</text>
  <text x="34" y="448" font-size="10" fill="#333" filter="url(#rough2)">时间 O(n) / 空间 O(n)；接缝处无递增约束，不能简化成「长度 2k 递增段」判定。</text>
  <text x="34" y="466" font-size="10" fill="#333" filter="url(#rough2)">进阶：滚动维护 prev / cur 两个段长可压到 O(1) 空间（见题解第 5 节）。</text>
</svg>
