<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">两种连接方式的状态转移</text>

  <!-- current state box (top center) -->
  <rect x="180" y="52" width="180" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="13" fill="#5a3a10" filter="url(#rough2)">当前状态</text>
  <text x="270" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">(首 f, 尾 l, 长 cur)</text>

  <!-- word box label -->
  <rect x="400" y="52" width="120" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="76" text-anchor="middle" font-size="13" fill="#243" filter="url(#rough2)">单词 w</text>
  <text x="460" y="98" text-anchor="middle" font-size="13" fill="#243" filter="url(#rough2)">(首 wf, 尾 wl, wlen)</text>

  <!-- arrow down-left (option A) -->
  <path d="M230,120 L150,170" stroke="#446688" stroke-width="2" marker-end="url(#arrA)" filter="url(#rough2)"/>
  <!-- arrow down-right (option B) -->
  <path d="M310,120 L390,170" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Option A: right join -->
  <rect x="40" y="184" width="230" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="155" y="208" text-anchor="middle" font-size="13" fill="#224" font-weight="bold" filter="url(#rough2)">方案 A：右接 join(str, w)</text>
  <text x="155" y="230" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">比 我尾 l 与 w首 wf</text>
  <text x="155" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新长 = cur + wlen − (l==wf?1:0)</text>
  <text x="155" y="274" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">新首 = f（不变）</text>
  <text x="155" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 新态 (f, wl)</text>

  <!-- Option B: left join -->
  <rect x="290" y="184" width="230" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="405" y="208" text-anchor="middle" font-size="13" fill="#243" font-weight="bold" filter="url(#rough2)">方案 B：左接 join(w, str)</text>
  <text x="405" y="230" text-anchor="middle" font-size="12" fill="#243" filter="url(#rough2)">比 w尾 wl 与 我首 f</text>
  <text x="405" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新长 = cur + wlen − (wl==f?1:0)</text>
  <text x="405" y="274" text-anchor="middle" font-size="12" fill="#243" filter="url(#rough2)">新尾 = l（不变）</text>
  <text x="405" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 新态 (wf, l)</text>

  <!-- merge arrow down to ndp -->
  <path d="M155,310 L270,338" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrA)" filter="url(#rough2)"/>
  <path d="M405,310 L290,338" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ndp note -->
  <rect x="110" y="348" width="320" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="13" fill="#7a3a3a" filter="url(#rough2)">两方案写入新表 ndp 取最小</text>
  <text x="270" y="394" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 用新表，勿原地改（同词只用一次）</text>
</svg>
