<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：滑动窗口 ＋ 素因子计数</text>

  <ellipse cx="200" cy="44" rx="104" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="200" y="48" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始：输入 nums（n ≥ 2）</text>

  <path d="M 200 60 L 200 72" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="40" y="74" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="95" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 预分解：fac[i] = nums[i] 的素因子集合（试除到 √x）</text>

  <path d="M 200 108 L 200 120" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="40" y="120" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="141" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② right 右移：fac[right] 中每个素数 cnt[p] + 1</text>

  <path d="M 200 154 L 200 168" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <polygon points="200,170 330,198 200,226 70,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="193" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">fac[right] 中存在</text>
  <text x="200" y="208" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">cnt[p] &gt; 1 的素数？</text>

  <text x="340" y="190" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 330 198 L 360 198" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="362" y="178" width="148" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="436" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 收缩：fac[left] 计数 −1</text>
  <text x="436" y="209" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">left + 1</text>
  <path d="M 436 218 C 436 258 300 254 228 230" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="348" y="250" font-size="9" fill="#b85450" filter="url(#rough2)">重新判断</text>

  <text x="212" y="240" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 200 226 L 200 240" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="40" y="240" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="200" y="261" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ best ← max(best, right − left + 1)</text>

  <path d="M 200 274 L 200 286" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <polygon points="200,288 310,314 200,340 90,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="318" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">right 遍历完？</text>

  <text x="320" y="306" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 310 314 L 338 314" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="340" y="296" width="168" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="424" y="311" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 max(best, 2)</text>
  <text x="424" y="325" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">（k = 2 恒成立）</text>

  <text x="72" y="306" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 90 314 C 30 314 22 137 36 137" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="28" y="220" font-size="9" fill="#4a7a3a" filter="url(#rough2)">right + 1</text>
</svg>
