<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：grid = [[3,0,8,4],[2,4,5,7],[9,2,6,3],[0,3,1,0]]</text>

  <!-- Original grid label -->
  <text x="90" y="42" font-size="11" fill="#446688" font-weight="bold">原始网格</text>

  <!-- Original grid: 4x4, cell 38x26, start x=70 y=48 -->
  <!-- row 0: 3,0,8,4 -->
  <rect x="70" y="48" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="89" y="66" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="108" y="48" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="127" y="66" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="146" y="48" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="165" y="66" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="184" y="48" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="203" y="66" text-anchor="middle" font-size="11" fill="#333">4</text>
  <!-- rowMax[0] -->
  <rect x="228" y="48" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="66" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- row 1: 2,4,5,7 -->
  <rect x="70" y="76" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="89" y="94" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="108" y="76" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="127" y="94" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="146" y="76" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="165" y="94" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="184" y="76" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="203" y="94" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="228" y="76" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- row 2: 9,2,6,3 -->
  <rect x="70" y="104" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="89" y="122" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="108" y="104" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="127" y="122" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="146" y="104" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="165" y="122" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="184" y="104" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="203" y="122" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="228" y="104" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- row 3: 0,3,1,0 -->
  <rect x="70" y="132" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="89" y="150" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="108" y="132" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="127" y="150" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="146" y="132" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="165" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="184" y="132" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="203" y="150" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="228" y="132" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- colMax row -->
  <text x="42" y="170" font-size="9" fill="#446688" font-weight="bold">列max</text>
  <rect x="70" y="162" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="89" y="177" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">9</text>
  <rect x="108" y="162" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="127" y="177" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <rect x="146" y="162" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="165" y="177" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">8</text>
  <rect x="184" y="162" width="38" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="203" y="177" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">7</text>

  <!-- formula arrow -->
  <path d="M 165 190 L 165 202" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="196" font-size="10" fill="#555">每格增量 = min(行max, 列max) − 原值</text>

  <!-- Increase grid label -->
  <text x="90" y="218" font-size="11" fill="#b85450" font-weight="bold">增量网格</text>

  <!-- Increase grid: same layout, show increases -->
  <!-- row 0 increases: 5,4,0,3 -->
  <rect x="70" y="224" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="89" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <rect x="108" y="224" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="127" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="146" y="224" width="38" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="242" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="184" y="224" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="203" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="243" y="242" text-anchor="middle" font-size="10" fill="#888">=12</text>

  <!-- row 1 increases: 5,0,2,0 -->
  <rect x="70" y="252" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="89" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <rect x="108" y="252" width="38" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="270" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="146" y="252" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="165" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="184" y="252" width="38" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="203" y="270" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <text x="243" y="270" text-anchor="middle" font-size="10" fill="#888">=7</text>

  <!-- row 2 increases: 0,2,2,4 -->
  <rect x="70" y="280" width="38" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="89" y="298" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="108" y="280" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="127" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="146" y="280" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="165" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="184" y="280" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="203" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="243" y="298" text-anchor="middle" font-size="10" fill="#888">=8</text>

  <!-- row 3 increases: 3,0,2,3 -->
  <rect x="70" y="308" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="89" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="108" y="308" width="38" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="326" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="146" y="308" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="165" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="184" y="308" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="203" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="243" y="326" text-anchor="middle" font-size="10" fill="#888">=8</text>

  <!-- Total sum box -->
  <rect x="320" y="248" width="170" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="405" y="270" text-anchor="middle" font-size="11" fill="#555">总和 = 12 + 7 + 8 + 8</text>
  <text x="405" y="290" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 35</text>

  <text x="405" y="320" text-anchor="middle" font-size="9" fill="#888">红色 = 有增量，灰色 = 增量为 0</text>
</svg>
