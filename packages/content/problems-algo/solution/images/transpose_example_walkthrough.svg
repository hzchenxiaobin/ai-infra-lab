<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：3 行输入 → s[] 逐行演化 → 2 行输出</text>
  <path d="M 250 44 Q 450 52 650 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 输入行 -->
  <g filter="url(#sk)">
    <rect x="30" y="70" width="200" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="130" y="90" text-anchor="middle" font-size="12" fill="#2b6e9e">行1: name age</text>
  <g filter="url(#sk)">
    <rect x="30" y="104" width="200" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="130" y="124" text-anchor="middle" font-size="12" fill="#2b6e9e">行2: alice 21</text>
  <g filter="url(#sk)">
    <rect x="30" y="138" width="200" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="130" y="158" text-anchor="middle" font-size="12" fill="#2b6e9e">行3: ryan 30</text>
  <text x="130" y="186" text-anchor="middle" font-size="10" fill="#888">输入 file.txt</text>

  <!-- 三阶段标题 -->
  <text x="360" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">处理行 1 后 (NR==1)</text>
  <text x="600" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">处理行 2 后</text>
  <text x="820" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">处理行 3 后</text>

  <!-- 阶段1 -->
  <g filter="url(#sk)">
    <rect x="280" y="74" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="300" y="96" font-size="11" fill="#2b6e9e">s[1] = "name"</text>
  <g filter="url(#sk)">
    <rect x="280" y="114" width="160" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="300" y="136" font-size="11" fill="#2e6e2e">s[2] = "age"</text>
  <text x="360" y="164" text-anchor="middle" font-size="9" fill="#888">首行直接赋值</text>

  <!-- 箭头 1→2 -->
  <path d="M 440 131 L 518 131" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 阶段2 -->
  <g filter="url(#sk)">
    <rect x="520" y="74" width="160" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="540" y="96" font-size="11" fill="#2b6e9e">s[1] = "name alice"</text>
  <g filter="url(#sk)">
    <rect x="520" y="114" width="160" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="540" y="136" font-size="11" fill="#2e6e2e">s[2] = "age 21"</text>
  <text x="600" y="164" text-anchor="middle" font-size="9" fill="#888">空格拼接新字段</text>

  <!-- 箭头 2→3 -->
  <path d="M 680 131 L 738 131" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 阶段3 -->
  <g filter="url(#sk)">
    <rect x="740" y="74" width="150" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="755" y="96" font-size="11" font-weight="bold" fill="#2b6e9e">s[1] = "name alice ryan"</text>
  <g filter="url(#sk)">
    <rect x="740" y="114" width="150" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="755" y="136" font-size="11" font-weight="bold" fill="#2e6e2e">s[2] = "age 21 30"</text>
  <text x="815" y="164" text-anchor="middle" font-size="9" fill="#888">累加完成</text>

  <!-- END 分隔线 -->
  <path d="M 30 200 L 870 200" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="450" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">END 块：for i = 1 .. NF：print s[i]</text>

  <!-- 箭头向下到输出 -->
  <path d="M 815 150 L 815 210 L 450 210 L 450 240" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 输出框 -->
  <g filter="url(#sk)">
    <rect x="300" y="244" width="300" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="450" y="269" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">name alice ryan</text>

  <g filter="url(#sk)">
    <rect x="300" y="290" width="300" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="450" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">age 21 30</text>

  <text x="450" y="348" text-anchor="middle" font-size="10" fill="#888">✓ print s[1] 得输出第 1 行，print s[2] 得输出第 2 行</text>
</svg>
