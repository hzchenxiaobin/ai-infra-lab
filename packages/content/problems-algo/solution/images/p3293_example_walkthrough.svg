<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：四个产品逐行套公式，Home 行走 NULL → 0 通道</text>

  <rect x="20" y="48" width="56" height="30" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">product_id</text>

  <rect x="76" y="48" width="96" height="30" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">category</text>

  <rect x="172" y="48" width="48" height="30" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">price</text>

  <rect x="220" y="48" width="86" height="30" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">discount</text>

  <rect x="306" y="48" width="128" height="30" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">计算式</text>

  <rect x="434" y="48" width="66" height="30" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="467" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">final_price</text>

  <rect x="20" y="78" width="56" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="48" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="76" y="78" width="96" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="124" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Electronics</text>
  <rect x="172" y="78" width="48" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="196" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000</text>
  <rect x="220" y="78" width="86" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="263" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="306" y="78" width="128" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1000×(100−10)/100</text>
  <rect x="434" y="78" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="467" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">900</text>

  <rect x="20" y="114" width="56" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="48" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="76" y="114" width="96" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="124" y="136" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Clothing</text>
  <rect x="172" y="114" width="48" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="196" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">50</text>
  <rect x="220" y="114" width="86" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="263" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <rect x="306" y="114" width="128" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="136" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">50×(100−20)/100</text>
  <rect x="434" y="114" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="467" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">40</text>

  <rect x="20" y="150" width="56" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="48" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="76" y="150" width="96" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="124" y="172" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Electronics</text>
  <rect x="172" y="150" width="48" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="196" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1200</text>
  <rect x="220" y="150" width="86" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="263" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="306" y="150" width="128" height="36" fill="#ffffff" stroke="#7a8a9a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="370" y="172" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1200×(100−10)/100</text>
  <rect x="434" y="150" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="467" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1080</text>

  <rect x="20" y="186" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="76" y="186" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="124" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Home</text>
  <rect x="172" y="186" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="196" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">500</text>
  <rect x="220" y="186" width="86" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="263" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">NULL→0</text>
  <rect x="306" y="186" width="128" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="370" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">500×(100−0)/100</text>
  <rect x="434" y="186" width="66" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="467" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">500</text>

  <rect x="48" y="240" width="424" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">产品 4：LEFT JOIN 未命中 → discount = NULL</text>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">IFNULL 翻译成 0 → 500×(100−0)/100 = 500（原价）</text>

  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">折扣是百分数：10 表示 10%，公式乘 (100 − discount) 再除以 100</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">产品 1、3 连接 Discounts 的同一行：多对一，结果仍是 4 行不放大</text>
</svg>
