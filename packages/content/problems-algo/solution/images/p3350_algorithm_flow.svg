<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">一次遍历流程：cur 记当前段长，prev 记上一段长（O(n)/O(1)）</text>

  <!-- 开始 -->
  <rect x="185" y="40" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：cur=1, prev=0, ans=0</text>

  <path d="M 260 74 L 260 92" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="190" y="96" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">i = 1 … n−1 遍历</text>

  <path d="M 260 126 L 260 148" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,152 345,192 260,232 175,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">nums[i] &gt; nums[i−1] ?</text>
  <text x="260" y="204" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">（相等也算「否」）</text>

  <!-- 是 → 右 -->
  <path d="M 345 192 L 372 192" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="352" y="184" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="378" y="172" width="126" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="441" y="190" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">cur += 1</text>
  <text x="441" y="205" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">递增段延续</text>

  <!-- 否 → 左 -->
  <path d="M 175 192 L 148 192" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="184" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="18" y="172" width="126" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="81" y="190" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">prev = cur; cur = 1</text>
  <text x="81" y="205" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">段断裂：旧段交棒 prev</text>

  <!-- 汇合到刷新 -->
  <path d="M 441 212 C 441 236, 350 242, 268 246" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 81 212 C 81 236, 170 242, 252 246" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="252" width="220" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">ans = max(ans, cur/2, min(prev,cur))</text>
  <text x="260" y="288" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">两个贡献每步都刷新，不漏解</text>

  <!-- 循环回边 -->
  <path d="M 370 275 C 420 275, 452 160, 338 113" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="452" y="196" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i++ 继续</text>

  <!-- 结束 -->
  <path d="M 260 298 L 260 318" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="312" font-size="9.5" fill="#666" filter="url(#rough2)">i 走完</text>
  <rect x="200" y="322" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 侧注 -->
  <rect x="20" y="322" width="164" height="48" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="102" y="340" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">为什么 min(prev,cur) 不漏？</text>
  <text x="102" y="354" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">cur 长满 L₂ 前，min(prev, cur)</text>
  <text x="102" y="366" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">逐步爬到 min(L₁, L₂)</text>
</svg>
