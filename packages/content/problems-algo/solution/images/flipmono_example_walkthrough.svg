  <rect x="152" y="208" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="222" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="176" y="208" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
