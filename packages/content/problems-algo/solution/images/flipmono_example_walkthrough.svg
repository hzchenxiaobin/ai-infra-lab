  <rect x="104" y="152" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="166" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="128" y="152" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="166" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="152" y="152" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="166" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="176" y="152" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="166" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="200" y="152" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
