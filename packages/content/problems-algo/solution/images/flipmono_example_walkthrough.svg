  <rect x="200" y="208" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="222" text-anchor="middle" font-size="10" fill="#333">0</text>
  <path d="M 200 204 L 200 230" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="350" y="222" font-size="11" fill="#555">3</text>
  <text x="440" y="222" font-size="11" fill="#555">1</text>
  <text x="540" y="222" font-size="11" fill="#555">4</text>

  <!-- ===== Row p=6 : all 0s ===== -->
  <text x="36" y="250" font-size="11" fill="#555" font-weight="bold">6</text>
  <rect x="80" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="250" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="104" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="250" text-anchor="middle" font-size="10" fill="#333">1</text>
