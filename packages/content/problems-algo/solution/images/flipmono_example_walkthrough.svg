  <rect x="176" y="94" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="108" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="200" y="94" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
