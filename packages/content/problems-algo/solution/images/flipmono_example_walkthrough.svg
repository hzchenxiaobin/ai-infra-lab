  <text x="350" y="108" font-size="11" fill="#555">0</text>
  <text x="440" y="108" font-size="11" fill="#555">2</text>
  <text x="540" y="108" font-size="11" fill="#d6a040" font-weight="bold">2 ✓</text>

  <!-- ===== Row p=2 ===== -->
  <text x="36" y="136" font-size="11" fill="#555" font-weight="bold">2</text>
  <rect x="80" y="122" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="136" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="104" y="122" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="136" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="128" y="122" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
