  <text x="140" y="250" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="152" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="250" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="176" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="250" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="200" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="250" text-anchor="middle" font-size="10" fill="#333">0</text>
  <path d="M 224 232 L 224 258" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="350" y="250" font-size="11" fill="#555">3</text>
  <text x="440" y="250" font-size="11" fill="#555">0</text>
  <text x="540" y="250" font-size="11" fill="#555">3</text>

  <!-- separator -->
  <path d="M 28 272 L 580 272" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Final result ===== -->
  <text x="36" y="298" font-size="12" fill="#555" font-weight="bold">结果</text>
  <text x="80" y="298" font-size="11" fill="#555">min cost = 2，在 p=1（→ "011111"）或 p=3（→ "000111"）取得</text>

  <!-- verify p=1 -->
  <rect x="60" y="312" width="250" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="332" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">p = 1 → "011111"</text>
  <text x="185" y="348" text-anchor="middle" font-size="10" fill="#666">左侧 0 无需翻（onesLeft=0）</text>
  <text x="185" y="362" text-anchor="middle" font-size="10" fill="#666">右侧翻下标 2、5 的 0（zerosRight=2）</text>

  <!-- verify p=3 -->
  <rect x="330" y="312" width="250" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="332" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">p = 3 → "000111"</text>
  <text x="455" y="348" text-anchor="middle" font-size="10" fill="#666">左侧翻下标 1 的 1（onesLeft=1）</text>
  <text x="455" y="362" text-anchor="middle" font-size="10" fill="#666">右侧翻下标 5 的 0（zerosRight=1）</text>

  <!-- summary box -->
  <rect x="60" y="384" width="520" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="406" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：cost(p) = onesLeft + zerosRight，O(1) 算出每个 p</text>
  <text x="320" y="424" text-anchor="middle" font-size="11" fill="#666">onesLeft 随 p 递增扫描维护，zerosRight 由 totalOnes 反推</text>
  <text x="320" y="442" text-anchor="middle" font-size="11" fill="#888">枚举 n+1 个分界点取最小 → 答案 2 ✓</text>
</svg>
