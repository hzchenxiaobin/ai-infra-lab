<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "010110"，n = 6，totalOnes = 3</text>

  <!-- Column headers -->
  <text x="36" y="48" font-size="10" fill="#888" font-weight="bold">p</text>
  <text x="80" y="48" font-size="10" fill="#888" font-weight="bold">分界位置（| = 分界线）</text>
  <text x="350" y="48" font-size="10" fill="#888" font-weight="bold">onesLeft</text>
  <text x="440" y="48" font-size="10" fill="#888" font-weight="bold">zerosRight</text>
  <text x="540" y="48" font-size="10" fill="#888" font-weight="bold">cost</text>

  <!-- divider line under header -->
  <path d="M 28 56 L 580 56" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row p=0 : divider before idx0, all 1s ===== -->
  <text x="36" y="80" font-size="11" fill="#555" font-weight="bold">0</text>
  <!-- mini cells: 6 cells w=24 at x=80,104,128,152,176,200 ; all right zone(green) -->
  <rect x="80" y="66" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="80" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="104" y="66" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="80" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="128" y="66" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="152" y="66" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="80" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="176" y="66" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="80" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="200" y="66" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="80" text-anchor="middle" font-size="10" fill="#333">0</text>
