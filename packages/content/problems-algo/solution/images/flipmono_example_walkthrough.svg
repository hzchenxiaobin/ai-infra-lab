  <text x="440" y="136" font-size="11" fill="#555">2</text>
  <text x="540" y="136" font-size="11" fill="#555">3</text>

  <!-- ===== Row p=3 ===== (MIN) -->
  <rect x="24" y="150" width="560" height="26" fill="#fff8e1" opacity="0.5" filter="url(#rough2)"/>
