  <path d="M 152 148 L 152 174" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="350" y="166" font-size="11" fill="#555">1</text>
  <text x="440" y="166" font-size="11" fill="#555">1</text>
  <text x="540" y="166" font-size="11" fill="#d6a040" font-weight="bold">2 ✓</text>

  <!-- ===== Row p=4 ===== -->
  <text x="36" y="194" font-size="11" fill="#555" font-weight="bold">4</text>
  <rect x="80" y="180" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="194" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="104" y="180" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="194" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="128" y="180" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="194" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="152" y="180" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="194" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="176" y="180" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="188" y="194" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="200" y="180" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="194" text-anchor="middle" font-size="10" fill="#333">0</text>
  <path d="M 176 176 L 176 202" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="350" y="194" font-size="11" fill="#555">2</text>
  <text x="440" y="194" font-size="11" fill="#555">1</text>
  <text x="540" y="194" font-size="11" fill="#555">3</text>

  <!-- ===== Row p=5 ===== -->
  <text x="36" y="222" font-size="11" fill="#555" font-weight="bold">5</text>
  <rect x="80" y="208" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="222" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="104" y="208" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="222" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="128" y="208" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
