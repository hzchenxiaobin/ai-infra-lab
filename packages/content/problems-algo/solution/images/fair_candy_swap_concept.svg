<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：交换一颗糖 → 总和相等 → 推出差值 delta</text>

  <!-- Alice's pile -->
  <text x="92" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Alice</text>
  <g filter="url(#rough2)">
    <rect x="50" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="70" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="94" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="114" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>
  <text x="92" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sumA = 2</text>

  <!-- Bob's pile -->
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Bob</text>
  <g filter="url(#rough2)">
    <rect x="400" y="64" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="420" y="86" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="444" y="64" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="464" y="86" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>
  <text x="442" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">sumB = 4</text>

  <!-- Swap arrows -->
  <path d="M 140 72 L 392 72" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="266" y="66" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Alice 给出 x</text>

  <path d="M 392 92 L 140 92" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="266" y="104" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Bob 给出 y</text>

  <!-- arrow down to equation -->
  <path d="M 280 122 L 280 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Equation derivation box -->
  <rect x="50" y="144" width="460" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">交换后总和相等：</text>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="70" y="184">sumA − x + y  =  sumB − y + x</text>
    <text x="70" y="206">⟹  sumA − sumB  =  2(x − y)</text>
    <text x="70" y="228">⟹  x − y  =  (sumA − sumB) / 2</text>
    <text x="70" y="250" fill="#b85450" font-weight="bold">⟹  令 delta = (sumA − sumB) / 2，则 y = x − delta</text>
  </g>

  <!-- arrow down -->
  <path d="M 280 266 L 280 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Strategy box -->
  <rect x="50" y="288" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">策略：遍历 Alice 的每颗糖 x</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#666">查 y = x − delta 是否在 Bob 的哈希集合中</text>

  <!-- takeaway -->
  <rect x="50" y="356" width="460" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">O(n)：一次求和 + 一次建集合 + 一次遍历查找</text>
  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#666">把「找一对交换」化为「固定 x 查 y」，哈希集合把 O(n²) 降为 O(n)</text>
</svg>
