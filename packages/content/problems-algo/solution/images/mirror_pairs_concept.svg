<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：reverse(nums[i])==nums[j]，对每个 i 找最近的右邻 j</text>

  <!-- Array row -->
  <text x="28" y="78" font-size="12" fill="#888">nums =</text>
  <rect x="76" y="60" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">12</text>
  <text x="104" y="110" text-anchor="middle" font-size="10" fill="#888">i=0</text>

  <rect x="138" y="60" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">21</text>
  <text x="166" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=1 ✓</text>

  <rect x="200" y="60" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">45</text>
  <text x="228" y="110" text-anchor="middle" font-size="10" fill="#888">i=2</text>

  <rect x="262" y="60" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">33</text>
  <text x="290" y="110" text-anchor="middle" font-size="10" fill="#888">i=3</text>

  <rect x="324" y="60" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">54</text>
  <text x="352" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=4 ✓</text>

  <!-- reverse operation box for i=0 -->
  <rect x="430" y="56" width="160" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="74" text-anchor="middle" font-size="11" fill="#333">reverse(12) = 21</text>
  <text x="510" y="90" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">目标值 = 21</text>
  <!-- arrow from i=0 to reverse box -->
  <path d="M 132 72 Q 280 50 430 70" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mirror pair bracket (0,1) -->
  <path d="M 80 130 Q 104 144 130 130" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">距离 1 ⭐</text>

  <!-- mirror pair bracket (2,4) -->
  <path d="M 206 150 Q 290 176 354 150" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">距离 2</text>

  <!-- min -->
  <rect x="430" y="124" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="510" y="142" text-anchor="middle" font-size="11" fill="#333">所有镜像对里取最小</text>
  <text x="510" y="158" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min = 1</text>

  <!-- explanation -->
  <line x1="20" y1="200" x2="600" y2="200" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="28" y="226" font-size="12" fill="#444" font-weight="bold">关键转化：对每个 i，target = reverse(nums[i]) 是确定的，</text>
  <text x="28" y="244" font-size="12" fill="#444">只要找最近的 j &gt; i 使 nums[j] == target —— 最近者必给最小 j−i。</text>

  <!-- right-to-left scan illustration -->
  <text x="28" y="278" font-size="12" fill="#888">从右往左扫，维护 min_idx[v] = v 在右侧出现的最小下标：</text>

  <!-- scan steps -->
  <rect x="60" y="296" width="500" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="314" font-size="11" fill="#333">i=4: target=rev(54)=45, 右侧无 45; 登记 min_idx[54]=4</text>

  <rect x="60" y="328" width="500" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="346" font-size="11" fill="#333">i=3: target=rev(33)=33, 右侧无 33; 登记 min_idx[33]=3</text>

  <rect x="60" y="360" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="378" font-size="11" fill="#333">i=2: target=rev(45)=54, min_idx[54]=4 → 距离 4−2=2 ✓</text>

  <rect x="60" y="392" width="500" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="408" font-size="11" fill="#b85450">i=0: target=rev(12)=21, min_idx[21]=1 → 距离 1−0=1 ⭐ 最小</text>
</svg>
