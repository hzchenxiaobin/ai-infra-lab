<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="4.5" refY="7.5" orient="auto">
      <path d="M0,0 L4.5,7.5 L9,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrBk" markerWidth="9" markerHeight="9" refX="4.5" refY="1.5" orient="auto">
      <path d="M0,7.5 L4.5,0 L9,7.5 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：阶乘逆元预处理 + 一步闭式（分侧求和互验）</text>

  <!-- 输入 -->
  <rect x="185" y="32" width="150" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">输入 n, pos, k</text>

  <path d="M 260 64 L 260 82" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 预处理 -->
  <rect x="110" y="86" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">预处理 fact[0..n−1] 与 inv_fact[]</text>
  <text x="260" y="120" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">一次快速幂（费马小定理）+ 倒序递推，O(n)</text>

  <!-- 分叉 -->
  <path d="M 260 128 L 260 142 L 160 142 L 160 156" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 260 142 L 360 142 L 360 156" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 160 142 L 160 156" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 路线 A：闭式 -->
  <rect x="55" y="160" width="210" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">路线 A：闭式一步到位</text>
  <text x="160" y="198" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">ans = 2 · C(n−1, k)</text>
  <text x="160" y="214" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">（双射：可见集合直接指定）</text>

  <!-- 路线 B：分侧求和 -->
  <rect x="285" y="160" width="185" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="377" y="180" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">路线 B：分侧求和</text>
  <text x="377" y="198" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">a=pos, b=n−1−pos</text>
  <text x="377" y="214" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">2·Σ C(a,i)·C(b,k−i)</text>

  <!-- 范德蒙德双向箭头 -->
  <path d="M 268 184 L 283 184" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 283 200 L 268 200" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBk)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="275" y="232" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">范德蒙德</text>
  <text x="275" y="244" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">恒等 ⟺</text>

  <!-- 汇合 -->
  <path d="M 160 222 L 160 250 L 244 250" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 377 222 L 377 250 L 276 250" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 244 250 L 258 250" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 276 250 L 262 250" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 查表组合数 -->
  <rect x="105" y="258" width="310" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">C(m, r) = fact[m] · inv_fact[r] · inv_fact[m−r]</text>
  <text x="260" y="293" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">模 10⁹+7 下除法全部换成乘逆元，O(1) 查表</text>

  <path d="M 260 302 L 260 318" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="85" y="322" width="350" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#8f3a34" font-weight="bold" filter="url(#rough2)">输出：2 · C(n−1, k) mod 10⁹+7（与 pos 无关）</text>
</svg>
