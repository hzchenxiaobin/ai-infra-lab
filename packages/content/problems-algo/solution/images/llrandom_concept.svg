<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">链表随机节点：每个节点都是候选，以 1/i 概率替换蓄水池</text>

  <!-- 数据流标签 -->
  <text x="36" y="60" font-size="11" fill="#888">单链表 head（长度未知）→</text>

  <!-- 链表节点 [1] -> [2] -> [3] -> [4] -> [5] -> null -->
  <rect x="40" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="89" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <line x1="90" y1="84" x2="116" y2="84" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="116" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="89" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <line x1="166" y1="84" x2="192" y2="84" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="192" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="89" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <line x1="242" y1="84" x2="268" y2="84" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="268" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="293" y="89" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <line x1="318" y1="84" x2="344" y2="84" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="344" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="89" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <line x1="394" y1="84" x2="420" y2="84" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="420" y="68" width="40" height="32" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="440" y="89" text-anchor="middle" font-size="11" fill="#999">null</text>

  <!-- 节点计数 i 标注（1-indexed） -->
  <text x="65" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=1</text>
  <text x="141" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=2</text>
  <text x="217" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=3</text>
  <text x="293" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=4</text>
  <text x="369" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=5</text>

  <!-- 替换概率标注 -->
  <text x="65" y="134" text-anchor="middle" font-size="10" fill="#d6a040">替换 1/1</text>
  <text x="141" y="134" text-anchor="middle" font-size="10" fill="#d6a040">替换 1/2</text>
  <text x="217" y="134" text-anchor="middle" font-size="10" fill="#d6a040">替换 1/3</text>
  <text x="293" y="134" text-anchor="middle" font-size="10" fill="#d6a040">替换 1/4</text>
  <text x="369" y="134" text-anchor="middle" font-size="10" fill="#d6a040">替换 1/5</text>

  <!-- 从每个节点指向蓄水池的箭头 -->
  <path d="M 65 144 Q 120 180 175 224" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 141 144 Q 160 180 178 224" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 217 144 Q 200 180 182 224" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 293 144 Q 240 180 188 224" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 369 144 Q 280 180 195 224" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 蓄水池（水桶） -->
  <text x="60" y="232" font-size="11" fill="#888">蓄水池 reservoir</text>
  <path d="M 68 230 L 56 300 Q 56 312 70 312 L 190 312 Q 204 312 204 300 L 192 230 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- 水面波纹 -->
  <path d="M 64 248 Q 90 242 116 248 Q 142 254 168 248 Q 190 244 204 250"
        stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 66 260 Q 92 256 118 260 Q 144 264 170 260 Q 192 257 204 262"
        stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="130" y="292" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">当前候选值</text>

  <!-- 扫描指针 -->
  <text x="470" y="76" font-size="10" fill="#888">cur 指针</text>
  <path d="M 440 64 L 440 48" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 右侧：规则说明 -->
  <rect x="300" y="150" width="240" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="174" font-size="12" fill="#d6a040" font-weight="bold">替换规则（第 i 个节点）</text>
  <text x="320" y="194" font-size="11" fill="#555">遍历到第 i 个节点（i 从 1 计）：</text>
  <text x="320" y="212" font-size="11" fill="#555">  以 1/i 概率 → 替换 reservoir</text>
  <text x="320" y="230" font-size="11" fill="#555">  以 1−1/i 概率 → 保持不变</text>
  <text x="320" y="252" font-size="10.5" fill="#888">实现：if (rand() % i == 0) reservoir = cur.val;</text>

  <!-- 底部：动机 + 均匀性 -->
  <rect x="24" y="328" width="512" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">为何用蓄水池？链表长度 n 未知、不可下标访问 → 无法 rand()%n 直采</text>
  <text x="44" y="368" font-size="10.5" fill="#555">每个节点都是候选 ⇒ 分母即节点计数 i（c≡i）。第 j 个幸存概率 = (1/j)·∏(k-1)/k = 1/n，严格等概率 ✅</text>
</svg>
