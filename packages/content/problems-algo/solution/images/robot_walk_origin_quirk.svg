<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrE" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">最大陷阱：同在 (0,0)，朝向因「是否走过」而异</text>

  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="120" x2="70" y2="200"/>
    <line x1="110" y1="120" x2="110" y2="200"/>
    <line x1="150" y1="120" x2="150" y2="200"/>
    <line x1="190" y1="120" x2="190" y2="200"/>
    <line x1="70" y1="120" x2="190" y2="120"/>
    <line x1="70" y1="160" x2="190" y2="160"/>
    <line x1="70" y1="200" x2="190" y2="200"/>
  </g>
  <text x="130" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始状态</text>
  <circle cx="90" cy="180" r="7" fill="#446688" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 96 180 L 132 180" stroke="#446688" stroke-width="3" fill="none" marker-end="url(#arrE)" filter="url(#rough2)"/>
  <text x="90" y="224" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">tot = 0, moved = false</text>
  <rect x="64" y="234" width="132" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">getDir → "East"</text>

  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="350" y1="120" x2="350" y2="200"/>
    <line x1="390" y1="120" x2="390" y2="200"/>
    <line x1="430" y1="120" x2="430" y2="200"/>
    <line x1="470" y1="120" x2="470" y2="200"/>
    <line x1="350" y1="120" x2="470" y2="120"/>
    <line x1="350" y1="160" x2="470" y2="160"/>
    <line x1="350" y1="200" x2="470" y2="200"/>
  </g>
  <text x="410" y="108" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 绕完一整圈后</text>
  <circle cx="370" cy="180" r="7" fill="#b85450" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 370 186 L 370 220" stroke="#b85450" stroke-width="3" fill="none" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <text x="370" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">朝南（下一步将出界→转向东）</text>
  <text x="410" y="224" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">tot = C, moved = true</text>
  <rect x="344" y="234" width="132" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">getDir → "South"</text>

  <rect x="40" y="276" width="480" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">转向是「步内事件」：当前朝向 = 上一次实际移动方向；初始朝东是题设特例</text>
</svg>
