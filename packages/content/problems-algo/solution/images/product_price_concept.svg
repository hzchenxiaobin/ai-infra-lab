<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心思路：每个产品取「目标日 2019-08-16 当天及之前」的最新一次改价，无改价则默认 10</text>

  <!-- ===== Date axis header ===== -->
  <rect x="100" y="44" width="460" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="59" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">08-14</text>
  <text x="235" y="59" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">08-15</text>
  <text x="325" y="59" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">08-16 ★</text>
  <text x="415" y="59" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">08-17</text>
  <text x="505" y="59" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">08-18</text>

  <!-- vertical date guide lines -->
  <line x1="145" y1="66" x2="145" y2="320" stroke="#ccc" stroke-width="0.6" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <line x1="235" y1="66" x2="235" y2="320" stroke="#ccc" stroke-width="0.6" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <line x1="325" y1="66" x2="325" y2="320" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <line x1="415" y1="66" x2="415" y2="320" stroke="#ddd" stroke-width="0.6" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <line x1="505" y1="66" x2="505" y2="320" stroke="#ddd" stroke-width="0.6" stroke-dasharray="2,2" filter="url(#rough2)"/>

  <!-- target date label -->
  <text x="325" y="80" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">目标日（含当天）</text>

  <!-- ===== Product 1 lane ===== -->
  <text x="50" y="115" text-anchor="end" font-size="10" fill="#446688" font-weight="bold">Product 1</text>
  <rect x="55" y="104" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="117" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">P1</text>

  <!-- P1 changes: 08-14=20, 08-15=30, 08-16=35 -->
  <line x1="145" y1="113" x2="325" y2="113" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="145" cy="113" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="116" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">20</text>
  <circle cx="235" cy="113" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="116" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">30</text>
  <!-- selected: 08-16=35 -->
  <circle cx="325" cy="113" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="325" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">35</text>

  <path d="M325 126 L325 142" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="345" y="138" font-size="8" fill="#4a7a3a" font-weight="bold">← 当天最新 ✓</text>

  <!-- ===== Product 2 lane ===== -->
  <text x="50" y="195" text-anchor="end" font-size="10" fill="#446688" font-weight="bold">Product 2</text>
  <rect x="55" y="184" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="197" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">P2</text>

  <!-- P2 changes: 08-14=50 (selected), 08-17=65 (after target, ignored) -->
  <line x1="145" y1="193" x2="415" y2="193" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- selected: 08-14=50 -->
  <circle cx="145" cy="193" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="145" y="196" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">50</text>
  <!-- 08-17=65, greyed out -->
  <circle cx="415" cy="193" r="10" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="415" y="196" text-anchor="middle" font-size="8.5" fill="#aaa">65</text>

  <path d="M145 206 L145 222" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="218" font-size="8" fill="#4a7a3a" font-weight="bold">← 目标日前最新 ✓</text>
  <text x="420" y="210" font-size="7.5" fill="#aaa">目标日后，忽略</text>

  <!-- ===== Product 3 lane ===== -->
  <text x="50" y="275" text-anchor="end" font-size="10" fill="#446688" font-weight="bold">Product 3</text>
  <rect x="55" y="264" width="30" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="277" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">P3</text>

  <!-- P3: no changes <= 08-16, only 08-18=20 (after target) -->
  <text x="200" y="277" font-size="9" fill="#b85450" font-style="italic">目标日及之前无改价记录</text>
  <circle cx="505" cy="273" r="10" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="505" y="276" text-anchor="middle" font-size="8.5" fill="#aaa">20</text>
  <text x="510" y="290" font-size="7.5" fill="#aaa">08-18，目标日后</text>

  <!-- default 10 box -->
  <rect x="280" y="262" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="277" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">10</text>
  <path d="M305 286 L305 296" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="335" y="293" font-size="8" fill="#d6a040" font-weight="bold">← 默认初始价 ✓</text>

  <!-- ===== Bottom: result table ===== -->
  <text x="310" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果（2019-08-16 各产品价格）</text>
  <rect x="220" y="344" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="358" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">product_id</text>
  <text x="355" y="358" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">price</text>
  <line x1="310" y1="344" x2="310" y2="364" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="220" y="364" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="265" y="376" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <text x="355" y="376" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">35</text>
  <line x1="310" y1="364" x2="310" y2="380" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="220" y="380" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="265" y="392" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="355" y="392" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">50</text>
  <line x1="310" y1="380" x2="310" y2="396" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="220" y="396" width="180" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="265" y="408" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="355" y="408" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">10</text>
  <line x1="310" y1="396" x2="310" y2="412" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="310" y="428" text-anchor="middle" font-size="8" fill="#888">P3 无历史改价 → 默认 10（黄色行）</text>
</svg>
