<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">深度筛选：递归遍历 → 谓词判定 → 空容器移除</text>
  <text x="290" y="42" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例：{a:1, b:"hi", c:{d:5}}  fn = typeof x === "string"</text>

  <!-- Root node (kept) -->
  <rect x="200" y="52" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">{a:1, b:"hi", c:{d:5}}</text>
  <text x="290" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">fn="object" ✗ | 非空 → 保留 ✓</text>

  <!-- Lines from root to children -->
  <path d="M 240 86 L 95 126" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 86 L 290 126" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 340 86 L 485 126" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- a:1 (removed) -->
  <rect x="50" y="128" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">a: 1 ✗</text>
  <text x="95" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">number ≠ string</text>

  <!-- b:"hi" (kept) -->
  <rect x="245" y="128" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b: "hi" ✓</text>
  <text x="290" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">string ✓</text>

  <!-- c:{d:5} (removed) -->
  <rect x="440" y="128" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">c: {d:5} ✗</text>
  <text x="485" y="172" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">obj ✗, 筛后空→移除</text>

  <!-- Dashed line from c to d -->
  <path d="M 485 158 L 485 188" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>

  <!-- d:5 (removed) -->
  <rect x="440" y="190" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">d: 5 ✗</text>

  <!-- Arrow from tree to result -->
  <path d="M 290 220 L 290 250" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="180" y="252" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">结果：{ b: "hi" }</text>

  <!-- Legend -->
  <rect x="40" y="306" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="318" font-size="10" fill="#555" filter="url(#rough2)">保留</text>
  <rect x="110" y="306" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="318" font-size="10" fill="#555" filter="url(#rough2)">移除</text>
  <text x="180" y="318" font-size="10" fill="#999" filter="url(#rough2)">规则：fn(value)=true 或 非空容器 → 保留；否则移除</text>
</svg>
