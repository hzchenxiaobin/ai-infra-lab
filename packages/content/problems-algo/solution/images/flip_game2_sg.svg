<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Sprague-Grundy 分解：&quot;-&quot; 把串切成独立 Nim 堆</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每段连续 + 长度为 k → 一堆 Grundy 值 g(k)；XOR ≠ 0 即必胜</text>

  <!-- ===== Split example ===== -->
  <text x="30" y="78" font-size="11" fill="#446688" font-weight="bold">例：&quot;++-++&quot; 按字符 &apos;-&apos; 切分 → 两段长度 [2, 2]</text>

  <g font-size="13">
    <!-- segment 1: ++ -->
    <rect x="40" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="56" y="114" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="72" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="88" y="114" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <!-- separator - -->
    <rect x="104" y="92" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="120" y="114" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <!-- segment 2: ++ -->
    <rect x="136" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="152" y="114" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="168" y="92" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="184" y="114" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
  </g>

  <!-- scissors line -->
  <path d="M 120 128 L 120 138" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="9" fill="#b85450">切分点</text>

  <!-- two heaps -->
  <rect x="40" y="158" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="72" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">堆 k=2</text>
  <text x="72" y="190" text-anchor="middle" font-size="10" fill="#555">g(2)=1</text>

  <rect x="136" y="158" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="168" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">堆 k=2</text>
  <text x="168" y="190" text-anchor="middle" font-size="10" fill="#555">g(2)=1</text>

  <!-- XOR -->
  <path d="M 104 178 L 130 178" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="182" font-size="11" fill="#333">XOR = <tspan font-weight="bold" fill="#b85450">1 ⊕ 1 = 0</tspan></text>
  <rect x="350" y="166" width="190" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">XOR=0 → 先手必败 ✗</text>

  <!-- ===== g(k) table ===== -->
  <text x="30" y="222" font-size="11" fill="#446688" font-weight="bold">g(k) 递推表（k = 连续 + 段长度）</text>
  <text x="30" y="236" font-size="9" fill="#888">g(0)=g(1)=0；g(k)=mex{ g(i)⊕g(k−2−i) : 0≤i≤k−2 }</text>

  <g font-size="10">
    <!-- header row k -->
    <text x="58" y="258" text-anchor="middle" fill="#555" font-weight="bold">k</text>
    <text x="58" y="274" text-anchor="middle" fill="#555">0</text>
    <text x="98" y="274" text-anchor="middle" fill="#555">1</text>
    <text x="138" y="274" text-anchor="middle" fill="#555">2</text>
    <text x="178" y="274" text-anchor="middle" fill="#555">3</text>
    <text x="218" y="274" text-anchor="middle" fill="#555">4</text>
    <text x="258" y="274" text-anchor="middle" fill="#555">5</text>
    <text x="298" y="274" text-anchor="middle" fill="#555">6</text>
    <text x="338" y="274" text-anchor="middle" fill="#555">7</text>
    <!-- g row -->
    <text x="58" y="292" text-anchor="middle" fill="#446688" font-weight="bold">g(k)</text>
    <rect x="84" y="282" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="98" y="296" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="124" y="282" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="138" y="296" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="164" y="282" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="178" y="296" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="204" y="282" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="218" y="296" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="244" y="282" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="258" y="296" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="284" y="282" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="298" y="296" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="324" y="282" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="338" y="296" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="364" y="282" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="378" y="296" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <text x="404" y="296" font-size="9" fill="#888">k≥2 时 g(k)&gt;0 即可赢</text>

  <!-- ===== contrast example ===== -->
  <rect x="30" y="316" width="500" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="336" font-size="11" fill="#333">对照：&quot;+++&quot; → 单段 k=3 → g(3)=1 → XOR=1≠0 → <tspan fill="#4a7a3a" font-weight="bold">必胜 ✓</tspan></text>
  <text x="46" y="354" font-size="10" fill="#555">翻 [0,1] 留下 k=1（g=0）的段；或翻 [1,2] 留下 k=1 的段，都把 XOR 归 0 给对手</text>
</svg>
