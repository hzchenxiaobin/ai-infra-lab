<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：栈迭代逐步执行</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">root = [1,null,3,2,4,null,5,6] → 输出 [1,3,5,6,2,4]</text>

  <!-- 表头 -->
  <rect x="20" y="60" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">栈（底→顶）</text>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">出栈</text>
  <text x="350" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">逆序入栈</text>
  <text x="490" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">result</text>

  <!-- 行 1 -->
  <rect x="20" y="92" width="540" height="30" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="112" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="150" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[1]</text>
  <text x="270" y="112" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="350" y="112" text-anchor="middle" font-size="10" fill="#888">push 4,2,3</text>
  <text x="490" y="112" text-anchor="middle" font-size="11" fill="#333">[1]</text>

  <!-- 行 2 -->
  <rect x="20" y="124" width="540" height="30" fill="#fff8e1" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="144" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[4,2,3]</text>
  <text x="270" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="350" y="144" text-anchor="middle" font-size="10" fill="#888">push 6,5</text>
  <text x="490" y="144" text-anchor="middle" font-size="11" fill="#333">[1,3]</text>

  <!-- 行 3 -->
  <rect x="20" y="156" width="540" height="30" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="176" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="150" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[4,2,6,5]</text>
  <text x="270" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="350" y="176" text-anchor="middle" font-size="10" fill="#888">（叶子，无入栈）</text>
  <text x="490" y="176" text-anchor="middle" font-size="11" fill="#333">[1,3,5]</text>

  <!-- 行 4 -->
  <rect x="20" y="188" width="540" height="30" fill="#fff8e1" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="208" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="150" y="208" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[4,2,6]</text>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="350" y="208" text-anchor="middle" font-size="10" fill="#888">（叶子，无入栈）</text>
  <text x="490" y="208" text-anchor="middle" font-size="11" fill="#333">[1,3,5,6]</text>

  <!-- 行 5 -->
  <rect x="20" y="220" width="540" height="30" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="240" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="150" y="240" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[4,2]</text>
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="350" y="240" text-anchor="middle" font-size="10" fill="#888">（叶子，无入栈）</text>
  <text x="490" y="240" text-anchor="middle" font-size="11" fill="#333">[1,3,5,6,2]</text>

  <!-- 行 6 -->
  <rect x="20" y="252" width="540" height="30" fill="#fff8e1" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="272" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="150" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[4]</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="350" y="272" text-anchor="middle" font-size="10" fill="#888">（叶子，无入栈）</text>
  <text x="490" y="272" text-anchor="middle" font-size="11" fill="#333">[1,3,5,6,2,4]</text>

  <!-- 行 7 结束 -->
  <rect x="20" y="284" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="150" y="304" text-anchor="middle" font-size="11" fill="#888">[]</text>
  <text x="270" y="304" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="350" y="304" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">栈空，结束 ✓</text>
  <text x="490" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,3,5,6,2,4]</text>

  <!-- 说明框 -->
  <rect x="20" y="332" width="540" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="356" font-size="12" fill="#333" font-weight="bold">关键观察：</text>
  <text x="40" y="378" font-size="11" fill="#555">• 步骤1：出栈 1，孩子 [3,2,4] 逆序入栈 → 栈变 [4,2,3]，3 在顶</text>
  <text x="40" y="398" font-size="11" fill="#555">• 步骤2：出栈 3（1 的第1个孩子），其孩子 [5,6] 逆序入栈 → 5 在顶</text>
  <text x="40" y="418" font-size="11" fill="#555">• 步骤5：3 的子树全部访问完，才轮到 2（1 的第2个孩子）</text>
  <text x="40" y="438" font-size="11" fill="#888">→ 整棵子树访问完才会回到下一个兄弟，这正是前序「根→子树→兄弟」的语义</text>
</svg>
