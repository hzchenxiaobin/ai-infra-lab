<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 行 → 3 组 → 3 行结果</text>

  <!-- ===== Left: Input table ===== -->
  <text x="40" y="56" font-size="10" fill="#888">输入：Followers</text>
  <g filter="url(#rough2)"><rect x="30" y="62" width="210" height="148" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6"/></g>
  <text x="135" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Followers</text>
  <line x1="30" y1="86" x2="240" y2="86" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="55" y="100" font-size="10" fill="#888" font-weight="bold">user_id</text>
  <text x="175" y="100" font-size="10" fill="#888" font-weight="bold">follower_id</text>
  <line x1="140" y1="88" x2="140" y2="210" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="36" y="108" width="198" height="20" fill="#dbeafe" stroke="none" rx="2"/></g>
  <text x="60" y="122" font-size="11" fill="#4a8edb" font-weight="bold">0</text>
  <text x="180" y="122" font-size="11" fill="#4a8edb" font-weight="bold">1</text>

  <g filter="url(#rough2)"><rect x="36" y="130" width="198" height="20" fill="#e6f4ea" stroke="none" rx="2"/></g>
  <text x="60" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="180" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <g filter="url(#rough2)"><rect x="36" y="152" width="198" height="20" fill="#fce4ec" stroke="none" rx="2"/></g>
  <text x="60" y="166" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="180" y="166" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <g filter="url(#rough2)"><rect x="36" y="174" width="198" height="20" fill="#fce4ec" stroke="none" rx="2"/></g>
  <text x="60" y="188" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="180" y="188" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <text x="135" y="204" text-anchor="middle" font-size="9" fill="#999">共 4 行</text>

  <!-- Arrow: input -> grouping -->
  <path d="M 246 136 L 282 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: Grouping ===== -->
  <text x="292" y="56" font-size="10" fill="#888">GROUP BY user_id</text>

  <!-- group 0 -->
  <g filter="url(#rough2)"><rect x="288" y="72" width="180" height="42" fill="#dbeafe" stroke="#4a8edb" stroke-width="1.5" rx="6"/></g>
  <text x="300" y="90" font-size="10" fill="#4a8edb" font-weight="bold">user_id = 0</text>
  <text x="300" y="106" font-size="9" fill="#4a8edb">follower_id: {1}</text>

  <!-- group 1 -->
  <g filter="url(#rough2)"><rect x="288" y="122" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
  <text x="300" y="140" font-size="10" fill="#4a7a3a" font-weight="bold">user_id = 1</text>
  <text x="300" y="156" font-size="9" fill="#4a7a3a">follower_id: {0}</text>

  <!-- group 2 -->
  <g filter="url(#rough2)"><rect x="288" y="172" width="180" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/></g>
  <text x="300" y="190" font-size="10" fill="#b85450" font-weight="bold">user_id = 2</text>
  <text x="300" y="206" font-size="9" fill="#b85450">follower_id: {0, 1}</text>

  <!-- Arrow: grouping -> count -->
  <path d="M 474 136 L 510 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: Result ===== -->
  <text x="520" y="56" font-size="10" fill="#888">COUNT → 输出</text>
  <g filter="url(#rough2)"><rect x="514" y="62" width="180" height="148" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
  <text x="604" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果</text>
  <line x1="514" y1="86" x2="694" y2="86" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="528" y="100" font-size="10" fill="#888" font-weight="bold">user_id</text>
  <text x="618" y="100" font-size="10" fill="#888" font-weight="bold">followers_count</text>
  <line x1="594" y1="88" x2="594" y2="210" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="520" y="108" width="168" height="22" fill="#dbeafe" stroke="none" rx="2"/></g>
  <text x="532" y="124" font-size="11" fill="#4a8edb" font-weight="bold">0</text>
  <text x="632" y="124" font-size="11" fill="#4a8edb" font-weight="bold">1</text>

  <g filter="url(#rough2)"><rect x="520" y="132" width="168" height="22" fill="#e6f4ea" stroke="none" rx="2"/></g>
  <text x="532" y="148" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="632" y="148" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <g filter="url(#rough2)"><rect x="520" y="156" width="168" height="22" fill="#fce4ec" stroke="none" rx="2"/></g>
  <text x="532" y="172" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="632" y="172" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <text x="604" y="200" text-anchor="middle" font-size="9" fill="#888">ORDER BY user_id</text>

  <!-- ===== Bottom: explanation ===== -->
  <g filter="url(#rough2)"><rect x="40" y="240" width="640" height="160" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="60" y="264" font-size="12" fill="#a06a10" font-weight="bold">逐步追踪：</text>

  <text x="60" y="288" font-size="11" fill="#4a8edb">• user_id=0：1 行（follower_id=1）→ COUNT = 1 → 输出 (0, 1)</text>
  <text x="60" y="310" font-size="11" fill="#4a7a3a">• user_id=1：1 行（follower_id=0）→ COUNT = 1 → 输出 (1, 1)</text>
  <text x="60" y="332" font-size="11" fill="#b85450">• user_id=2：2 行（follower_id=0,1）→ COUNT = 2 → 输出 (2, 2)</text>

  <text x="60" y="360" font-size="11" fill="#a06a10" font-weight="bold">⭐ 关键：COUNT(follower_id) 数的是「组内行数」，即该 user 被多少人关注。</text>
  <text x="60" y="380" font-size="10" fill="#888">主键 (user_id, follower_id) 保证同一组内 follower_id 不重复 → COUNT 无需 DISTINCT。</text>
</svg>
