<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描 [left, right]，逐串判定首尾元音</text>

  <!-- Init -->
  <rect x="150" y="44" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">初始化: cnt = 0,  i = left</text>
  <text x="280" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">vowels = { a, e, i, o, u }</text>

  <!-- arrow to diamond1 -->
  <path d="M280,92 L280,106" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: i <= right ? -->
  <polygon points="280,108 376,128 280,148 184,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">i ≤ right ?</text>
  <!-- No -> left -> return cnt -->
  <path d="M184,128 L168,128" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="176" y="120" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="36" y="110" width="128" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="134" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 cnt</text>
  <!-- Yes -> down -->
  <path d="M280,148 L280,166" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="160" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Process: fetch first/last char -->
  <rect x="150" y="168" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="193" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取 c1 = words[i][0],  c2 = words[i][−1]</text>

  <!-- arrow to diamond2 -->
  <path d="M280,208 L280,226" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2: both vowels ? -->
  <polygon points="280,232 384,252 280,272 176,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">首尾皆元音 ?</text>
  <!-- Yes -> right -> cnt += 1 -->
  <path d="M384,252 L398,252" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="244" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="234" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="258" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt += 1</text>
  <!-- No -> down -->
  <path d="M280,272 L280,288" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="284" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- i += 1 -->
  <rect x="220" y="290" width="120" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">i += 1</text>
  <!-- cnt += 1 rejoin i += 1 -->
  <path d="M460,272 L460,309 L342,309" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- loop back: i += 1 -> up right margin -> diamond1 right point -->
  <path d="M280,328 L540,328 L540,128 L378,128" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="552" y="210" text-anchor="middle" font-size="11" fill="#446688" transform="rotate(90 552 210)" filter="url(#rough2)">i 自增后回循环判定</text>

  <text x="280" y="364" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">
    单串判定 O(1)（取首尾 + 两次集合查找），整体 O(n) / O(1)
  </text>
</svg>
