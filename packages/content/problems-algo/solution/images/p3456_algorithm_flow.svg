<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：双指针分组扫描</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="200" y="38" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="260" y="55" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">开始（i = 0）</text>
  </g>
  <path d="M 260 64 L 260 78" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 i < n ? -->
  <g filter="url(#rough2)">
    <path d="M 260 78 L 322 112 L 260 146 L 198 112 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="260" y="116" text-anchor="middle" font-size="11" fill="#8a6d1f">i &lt; n ?</text>
  </g>
  <path d="M 322 112 L 388 112" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="104" font-size="10" fill="#446688" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="390" y="99" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="445" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">返回 false</text>
  </g>
  <path d="M 260 146 L 260 160" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="157" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 扩展段尾 -->
  <g filter="url(#rough2)">
    <rect x="140" y="160" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">j 从 i 向右扩展</text>
    <text x="260" y="194" text-anchor="middle" font-size="9.5" fill="#55677d">直到 s[j] ≠ s[i] 或 j = n</text>
  </g>
  <path d="M 260 206 L 260 218" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 j - i == k ? -->
  <g filter="url(#rough2)">
    <path d="M 260 218 L 322 252 L 260 286 L 198 252 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="260" y="256" text-anchor="middle" font-size="11" fill="#8f3a35">j − i == k ?</text>
  </g>
  <path d="M 322 252 L 388 252" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="244" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="390" y="239" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="445" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">返回 true</text>
  </g>
  <path d="M 260 286 L 260 298" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="295" font-size="10" fill="#8a6d1f" filter="url(#rough2)">否</text>

  <!-- i = j -->
  <g filter="url(#rough2)">
    <rect x="185" y="298" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="317" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">i = j（下一段起点）</text>
  </g>

  <!-- 循环回边 -->
  <path d="M 185 313 L 86 313 L 86 112 L 198 112" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="70" y="304" font-size="10" fill="#8f3a35" filter="url(#rough2)" transform="rotate(-90 70 304)">处理下一段</text>

  <!-- 复杂度侧注 -->
  <g filter="url(#rough2)">
    <rect x="390" y="36" width="122" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="451" y="56" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f">时间 O(n)</text>
    <text x="451" y="72" text-anchor="middle" font-size="9.5" fill="#55677d">i、j 只进不退</text>
    <text x="451" y="84" text-anchor="middle" font-size="9.5" fill="#55677d">空间 O(1)</text>
  </g>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">段与段互不重叠，每个字符至多被访问两次</text>
</svg>
