<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：数组和的可达区间求交</text>

  <!-- nums1 行 -->
  <text x="36" y="76" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums1</text>
  <rect x="84" y="58" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="102" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="126" y="58" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="144" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="168" y="58" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="77" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="210" y="58" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="228" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="58" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="77" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="186" y="52" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">≥1</text>
  <text x="270" y="52" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">≥1</text>
  <text x="350" y="68" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">s₁=6, z₁=2</text>
  <rect x="330" y="76" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="95" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">min₁ = 6+2 = 8</text>

  <!-- nums2 行 -->
  <text x="36" y="132" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums2</text>
  <rect x="126" y="114" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="144" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="168" y="114" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="186" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="210" y="114" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="133" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="228" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">≥1</text>
  <text x="350" y="124" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">s₂=11, z₂=1</text>
  <rect x="330" y="132" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="151" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">min₂ = 11+1 = 12</text>

  <!-- 可达区间带 -->
  <rect x="100" y="196" width="380" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="211" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">nums1 可达和 [8, +∞)</text>
  <rect x="280" y="224" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="380" y="239" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">nums2 可达和 [12, +∞)</text>

  <!-- 数轴 -->
  <path d="M 60 285 L 490 285" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 280 L 100 290" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 190 280 L 190 290" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 280 280 L 280 290" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 370 280 L 370 290" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 460 280 L 460 290" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="306" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="190" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10</text>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="370" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">14</text>
  <text x="460" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">16</text>

  <!-- 答案标记 -->
  <path d="M 280 192 L 280 278" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="280" cy="285" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最小相等和 = max(min₁, min₂) = 12</text>

  <!-- 底部说明 -->
  <rect x="36" y="344" width="448" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">有 0 ⇒ 橡皮筋：和可在 [min, +∞) 内任意拉伸</text>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">无 0 ⇒ 定值：区间塌缩成一个点，够不到对方下界 ⇒ -1</text>
</svg>
