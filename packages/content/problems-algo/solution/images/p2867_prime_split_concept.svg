<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：质数节点是「关卡」，合法路径恰好穿过 1 个关卡</text>

  <!-- edges -->
  <path d="M 300 74 L 190 130" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 300 74 L 410 130" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 180 152 L 116 198" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 184 152 L 244 198" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- highlight valid path (1,3): 1 → 3 -->
  <path d="M 300 74 L 410 130" stroke="#b85450" stroke-width="3.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="386" y="86" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">路径 (1,3) ✓ 恰 1 个质数</text>

  <!-- nodes -->
  <circle cx="300" cy="66" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="71" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <circle cx="182" cy="140" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="182" y="145" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <circle cx="418" cy="140" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="418" y="145" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <circle cx="112" cy="212" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="217" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <circle cx="248" cy="212" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="248" y="217" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- legend -->
  <circle cx="80" cy="60" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="96" y="64" font-size="11" fill="#555" filter="url(#rough2)">质数节点（关卡）</text>
  <circle cx="80" cy="86" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="96" y="90" font-size="11" fill="#555" filter="url(#rough2)">非质数节点</text>

  <text x="440" y="212" font-size="11" fill="#999" filter="url(#rough2)">例：路径 (2,5)</text>
  <text x="440" y="228" font-size="11" fill="#999" filter="url(#rough2)">穿过 2 个质数 ✗</text>

  <!-- observation box -->
  <rect x="36" y="256" width="528" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="280" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">路径上质数个数 ≥ 2 就废掉 ⟹ 质数把树切成一个个「无质数小块」</text>
  <text x="300" y="304" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">合法路径 = 关卡两边的两段无质数路径拼接（或一段 + 关卡本身）</text>

  <!-- dp definition box -->
  <rect x="36" y="336" width="528" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="360" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">树上 DP 状态：s(u) = (s₀, s₁)</text>
  <text x="300" y="382" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">s₀ = 从 u 向下走、不含质数的路径数（含单点 u）</text>
  <text x="300" y="402" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">s₁ = 从 u 向下走、恰好含 1 个质数的路径数（含单点 u）</text>
</svg>
