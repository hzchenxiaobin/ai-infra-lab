<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：建 Trie → DFS 只走 is_end → 取最长
  </text>

  <rect x="180" y="48" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1. 建 Trie：插入所有 words</text>

  <path d="M280,84 L280,104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="108" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2. root.is_end = true（空串起点）</text>

  <path d="M280,144 L280,164" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="168" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3. DFS(root, path="")：递归遍历</text>

  <path d="M280,204 L280,224" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,228 380,268 280,308 180,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">node.is_end?</text>
  <text x="280" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">当前路径是完整单词？</text>

  <path d="M180,268 L120,268" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="260" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="50" y="250" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="272" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">断路</text>
  <text x="85" y="285" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">return</text>

  <path d="M280,308 L280,328" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="322" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="160" y="332" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="355" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4. len(path) &gt; len(ans)? → 更新 ans</text>

  <path d="M280,368 L280,388" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="392" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="415" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5. 按 a→z 遍历 children → 递归 DFS(child, path+c)</text>

  <path d="M440,410 Q500,410 500,300 Q500,188 420,188" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="495" y="300" font-size="10" fill="#888" filter="url(#rough2)">回溯</text>

  <rect x="380" y="50" width="170" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="70" font-size="10.5" fill="#333" filter="url(#rough2)">关键不变式：</text>
  <text x="395" y="86" font-size="10" fill="#555" filter="url(#rough2)">DFS 到达的每个节点</text>
  <text x="395" y="100" font-size="10" fill="#555" filter="url(#rough2)">is_end=true → 路径即合法词</text>
</svg>
