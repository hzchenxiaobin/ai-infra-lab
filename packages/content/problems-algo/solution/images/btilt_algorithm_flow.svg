<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">后序 DFS 求坡度流程</text>

  <!-- Start: dfs(node) -->
  <rect x="190" y="38" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dfs(node)</text>

  <line x1="260" y1="72" x2="260" y2="92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: node == null ? -->
  <polygon points="260,94 318,124 260,154 202,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#333">node</text>
  <text x="260" y="135" text-anchor="middle" font-size="12" fill="#333">== null?</text>

  <!-- Yes branch -> return 0 -->
  <line x1="318" y1="124" x2="362" y2="124" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="118" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="366" y="106" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="421" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return 0</text>

  <!-- No branch down -->
  <line x1="260" y1="154" x2="260" y2="174" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="166" font-size="11" fill="#b85450">否</text>

  <!-- l = dfs(left); r = dfs(right) -->
  <rect x="150" y="176" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#333">l = dfs(left);  r = dfs(right)</text>

  <line x1="260" y1="212" x2="260" y2="232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- tilt = abs(l - r); total += tilt  highlighted -->
  <rect x="120" y="234" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total += |l − r|</text>
  <text x="260" y="270" text-anchor="middle" font-size="10" fill="#b85450">← 累加当前节点坡度（每个节点都做）</text>

  <line x1="260" y1="278" x2="260" y2="298" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return val + l + r -->
  <rect x="140" y="300" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return node.val + l + r</text>

  <!-- Bottom note -->
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#888">返回子树和（向上传递）；total 即为全树坡度之和</text>
</svg>
