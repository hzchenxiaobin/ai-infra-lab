<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：枚举 x∈[2, n/2]，x 与 n−x 同为质数即配对</text>

  <!-- number grid 1..10 -->
  <text x="40" y="66" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1..n 的质性（n=10）</text>

  <g font-size="13" filter="url(#rough2)">
    <!-- composites / 1 -->
    <rect x="40" y="78" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="5"/>
    <text x="62" y="102" text-anchor="middle" fill="#999" font-weight="bold">1</text>

    <rect x="88" y="78" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="5"/>
    <text x="110" y="102" text-anchor="middle" fill="#999" font-weight="bold">4</text>

    <rect x="136" y="78" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="5"/>
    <text x="158" y="102" text-anchor="middle" fill="#999" font-weight="bold">6</text>

    <rect x="184" y="78" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="5"/>
    <text x="206" y="102" text-anchor="middle" fill="#999" font-weight="bold">8</text>

    <rect x="232" y="78" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="5"/>
    <text x="254" y="102" text-anchor="middle" fill="#999" font-weight="bold">9</text>

    <rect x="280" y="78" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="5"/>
    <text x="302" y="102" text-anchor="middle" fill="#999" font-weight="bold">10</text>

    <!-- primes highlighted -->
    <rect x="88" y="78" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <text x="110" y="102" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>

    <rect x="136" y="78" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <text x="158" y="102" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>

    <rect x="232" y="78" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <text x="254" y="102" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>

    <rect x="280" y="78" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <text x="302" y="102" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
  </g>

  <text x="350" y="100" font-size="11" fill="#888" filter="url(#rough2)">（绿=质数，灰=合数/1）</text>

  <!-- pairing rows for n=10 -->
  <text x="40" y="158" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举 x，配对 y = n − x = 10 − x</text>

  <!-- row template: x box -- y box -- verdict -->
  <g font-size="13" filter="url(#rough2)">
    <!-- x=2, y=8: ✗ -->
    <rect x="40" y="172" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="62" y="193" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="100" y="193" text-anchor="middle" fill="#999" font-size="14">+</text>
    <rect x="112" y="172" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" rx="5"/>
    <text x="134" y="193" text-anchor="middle" fill="#999" font-weight="bold">8</text>
    <text x="172" y="193" fill="#b85450" font-weight="bold" font-size="14">✗ 8 非质数</text>

    <!-- x=3, y=7: ✓ -->
    <rect x="40" y="212" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="62" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="100" y="233" text-anchor="middle" fill="#999" font-size="14">+</text>
    <rect x="112" y="212" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="134" y="233" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <text x="172" y="233" fill="#4a7a3a" font-weight="bold" font-size="14">✓ 入解 [3,7]</text>

    <!-- x=4, y=6: ✗ -->
    <rect x="40" y="252" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" rx="5"/>
    <text x="62" y="273" text-anchor="middle" fill="#999" font-weight="bold">4</text>
    <text x="100" y="273" text-anchor="middle" fill="#999" font-size="14">+</text>
    <rect x="112" y="252" width="44" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" rx="5"/>
    <text x="134" y="273" text-anchor="middle" fill="#999" font-weight="bold">6</text>
    <text x="172" y="273" fill="#b85450" font-weight="bold" font-size="14">✗ 4 非质数</text>

    <!-- x=5, y=5: ✓ -->
    <rect x="40" y="292" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="62" y="313" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="100" y="313" text-anchor="middle" fill="#999" font-size="14">+</text>
    <rect x="112" y="292" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="134" y="313" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="172" y="313" fill="#4a7a3a" font-weight="bold" font-size="14">✓ 入解 [5,5]</text>
  </g>

  <!-- why x stops at n/2 -->
  <rect x="300" y="212" width="232" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="416" y="236" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">为何 x 只到 n/2？</text>
  <text x="316" y="258" font-size="11" fill="#666" filter="url(#rough2)">由 x ≤ y 与 x+y=n 得 x ≤ n/2。</text>
  <text x="316" y="278" font-size="11" fill="#666" filter="url(#rough2)">x 超过 n/2 时 y=n−x &lt; x，</text>
  <text x="316" y="296" font-size="11" fill="#666" filter="url(#rough2)">与已枚举的 (y,x) 重复，故截断。</text>

  <!-- bottom note -->
  <rect x="40" y="338" width="480" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">埃氏筛给 [2,n] 每个数 O(1) 质性标记，配对判定只需一次查表</text>
</svg>
