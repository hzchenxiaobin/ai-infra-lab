<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：深度二染色——偶距离 ⇔ 同色</text>
  <text x="260" y="40" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">d(u,w) ≡ depth(u) + depth(w) (mod 2) ⇒ 距离为偶 ⟺ 深度同奇偶（同一色）</text>

  <!-- ===== 左：树 1 染色演示 ===== -->
  <rect x="25" y="72" width="232" height="252" fill="none" stroke="#446688" stroke-width="1.2"
        stroke-dasharray="5,4" opacity="0.55" rx="10" filter="url(#rough2)"/>
  <text x="141" y="92" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">树 1：按深度奇偶染两色</text>

  <!-- 边 -->
  <line x1="140" y1="128" x2="78" y2="198" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="140" y1="128" x2="198" y2="192" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="198" y1="192" x2="152" y2="268" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="198" y1="192" x2="240" y2="262" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- 同色路径高亮 0→2→3 -->
  <path d="M 140 128 L 198 192 L 152 268" fill="none" stroke="#446688" stroke-width="4" filter="url(#rough2)"/>

  <!-- 节点：深度偶=蓝，深度奇=橙 -->
  <circle cx="140" cy="128" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="133" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="78" cy="198" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="203" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="198" cy="192" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="197" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="152" cy="268" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="273" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="240" cy="262" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="267" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="105" y="236" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">d(0,3)=2 偶 ✓ 同色</text>
  <text x="72" y="228" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">d(0,1)=1 奇 ✗ 异色</text>

  <!-- 图例 -->
  <circle cx="72" cy="304" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="308" font-size="9" fill="#33506b" filter="url(#rough2)">深度偶</text>
  <circle cx="140" cy="304" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="308" font-size="9" fill="#a07830" filter="url(#rough2)">深度奇</text>

  <rect x="30" y="290" width="222" height="28" fill="none" stroke="none" filter="url(#rough2)"/>
  <text x="141" y="322" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">even[i] = i 的同色类大小 → 全树只有两个取值！</text>

  <!-- ===== 右：树 2 侧桥相位 ===== -->
  <rect x="272" y="72" width="225" height="252" fill="none" stroke="#4a7a3a" stroke-width="1.2"
        stroke-dasharray="5,4" opacity="0.55" rx="10" filter="url(#rough2)"/>
  <text x="384" y="92" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">树 2 侧：桥的「相位」可翻</text>

  <rect x="280" y="100" width="209" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="384" y="116" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d(i,w) = d(i,a) + 1 + d(b,w)</text>
  <text x="384" y="131" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">要偶 ⟺ d(i,a) 与 d(b,w) 奇偶互异</text>

  <rect x="280" y="148" width="209" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="384" y="165" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">相位 A：a = i（d = 0，偶）</text>
  <text x="384" y="180" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">→ 要 d(b,w) 奇 = 数 b 的异色类</text>
  <text x="384" y="195" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">→ b 放进小类，就数到了大类</text>

  <rect x="280" y="208" width="209" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="384" y="225" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">相位 B：a = i 的邻居（d = 1，奇）</text>
  <text x="384" y="240" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">→ 要 d(b,w) 偶 = 数 b 的同色类</text>
  <text x="384" y="255" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">→ b 放进大类，就直接数到大类</text>

  <rect x="280" y="268" width="209" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="384" y="285" text-anchor="middle" font-size="9.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">殊途同归：两条相位都通向</text>
  <text x="384" y="301" text-anchor="middle" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">best2 = max(两色类大小)（全局常数）</text>

  <!-- ===== 底部结论 ===== -->
  <rect x="25" y="338" width="472" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="261" y="357" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer[i] = 树 1 中 i 的同色类大小 + max(树 2 两色类大小)</text>
  <text x="261" y="375" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">= even[i] + best2 —— 与 3372 同一副骨架：逐点计数 + 全局常数</text>

  <text x="260" y="408" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">n ≥ 2 保证 i 有邻居 ⇒ 两种相位都合法；加桥后总图仍是树，树 1 内部距离不变（同 3372 观察一）</text>
  <path d="M 258 384 L 258 396" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
</svg>
