<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：删子树 = 砍边（Green Hackenbush）+ Colon 原理</text>

  <!-- Left: node deletion game -->
  <rect x="30" y="46" width="230" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="145" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">原游戏：删节点 + 其子树</text>
  <!-- mini tree -->
  <circle cx="145" cy="96" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="100" text-anchor="middle" font-size="10" fill="#333">r</text>
  <path d="M 145 108 L 110 132" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 145 108 L 180 132" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="104" cy="140" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="143" text-anchor="middle" font-size="9" fill="#333">a</text>
  <circle cx="186" cy="140" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="143" text-anchor="middle" font-size="9" fill="#333">b</text>
  <path d="M 186 150 L 186 168" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="186" cy="176" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="186" y="179" text-anchor="middle" font-size="8" fill="#333">c</text>
  <text x="145" y="184" text-anchor="middle" font-size="10.5" fill="#b85450">删 b ⟹ b、c 一起消失</text>

  <!-- arrow equivalence -->
  <path d="M 270 120 L 290 120" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">等价</text>

  <!-- Right: hackenbush edge cut -->
  <rect x="300" y="46" width="230" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="415" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Hackenbush：砍边 (父,b)</text>
  <!-- ground -->
  <path d="M 320 150 L 510 150" stroke="#555" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="510" y="146" font-size="9" fill="#888">地面=root</text>
  <!-- root node on ground -->
  <circle cx="415" cy="138" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="142" text-anchor="middle" font-size="9" fill="#333">r</text>
  <!-- left edge to a -->
  <path d="M 415 127 L 388 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <circle cx="382" cy="104" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="107" text-anchor="middle" font-size="8" fill="#333">a</text>
  <!-- right edge to b (dashed = cut) -->
  <path d="M 415 127 L 442 110" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <circle cx="448" cy="104" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="448" y="107" text-anchor="middle" font-size="8" fill="#333">b</text>
  <path d="M 448 95 L 448 82" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="448" cy="76" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="448" y="79" text-anchor="middle" font-size="7" fill="#333">c</text>
  <text x="415" y="172" text-anchor="middle" font-size="10.5" fill="#b85450">砍此边 ⟹ b、c 断开（同效果）</text>
  <text x="415" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a">只剩根时无边可砍 → 当前方负</text>

  <!-- Colon principle formula -->
  <rect x="30" y="214" width="500" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Colon 原理：g(v) = g(c₁)⊕1 ⊕ g(c₂)⊕1 ⊕ … （孩子各 +1 再异或）</text>
  <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#555">叶子 g=0；单链长 L → g=L；Alice 先手胜 ⟺ g(root) ≠ 0</text>

  <!-- mini worked example with g values -->
  <text x="280" y="296" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">小例：root 带两孩子 a(叶)、b→c(叶)</text>

  <!-- tree with g labels -->
  <circle cx="280" cy="330" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#333">r</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">g=(0⊕1)⊕(1⊕1)=1⊕0=1</text>

  <path d="M 280 316 L 232 296" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="224" cy="290" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="294" text-anchor="middle" font-size="9" fill="#333">a</text>
  <text x="200" y="280" font-size="10" fill="#4a7a3a" font-weight="bold">g=0</text>

  <path d="M 280 316 L 328 296" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="336" cy="290" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="294" text-anchor="middle" font-size="9" fill="#333">b</text>
  <text x="360" y="284" font-size="10" fill="#4a7a3a" font-weight="bold">g=1</text>
  <path d="M 336 279 L 336 262" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="336" cy="254" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="336" y="257" text-anchor="middle" font-size="8" fill="#333">c</text>
  <text x="356" y="252" font-size="9.5" fill="#888">g=0 → b=(0⊕1)=1</text>

  <!-- conclusion -->
  <rect x="30" y="372" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">关键：不必真建树，只对子树 SG 值做「+1 异或」递推</text>
  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#555">order(n) 的 SG = (order(n−2) 的 SG ⊕1) ⊕ (order(n−1) 的 SG ⊕1)</text>
</svg>
