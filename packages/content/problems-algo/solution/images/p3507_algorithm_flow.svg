<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">模拟流程：判定有序 → 找最小和对 → 合并</text>

  <!-- 开始 -->
  <rect x="185" y="40" width="150" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">开始：ops = 0</text>

  <path d="M 260 68 L 260 84" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,86 338,118 260,150 182,118" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">数组非递减？</text>

  <!-- 是 → 返回 -->
  <path d="M 338 118 L 398 118" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="366" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="402" y="102" width="106" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 ops</text>

  <!-- 否 -->
  <path d="M 260 150 L 260 170" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="165" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 找最小和对 -->
  <rect x="105" y="172" width="310" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">扫描相邻对，找和最小的一对（记左端点 i）</text>
  <text x="260" y="201" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">严格 &lt; 才更新 ⇒ 平局自动取最左</text>

  <path d="M 260 208 L 260 226" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 合并 -->
  <rect x="105" y="228" width="310" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">nums[i] += nums[i+1]，删除 i+1 位置</text>
  <text x="260" y="257" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">ops += 1，数组长度减 1</text>

  <!-- 回环 -->
  <path d="M 105 246 L 62 246 L 62 118 L 180 118" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="68" y="221" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">下一轮</text>

  <!-- 底部注释 -->
  <rect x="105" y="288" width="310" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">长度每轮减 1 ⇒ 至多 n−1 轮必然终止</text>
  <text x="260" y="323" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">n ≤ 50：O(n²) 总比较约 2.5×10³，轻松通过</text>
</svg>
