<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐行扫描，读「上」旧值、写「左」新值，单表原地滚动</text>

  <rect x="155" y="28" width="210" height="26" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="45" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">初始化 dp[0][0] = { grid[0][0] }</text>

  <path d="M 260 54 L 260 62" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="64" width="260" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">枚举格子 (i,j)：外层逐行 i，内层逐列 j</text>

  <path d="M 260 90 L 260 98" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,100 350,126 260,152 170,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">是起点</text>
  <text x="260" y="138" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">(0,0)?</text>

  <path d="M 350 126 L 398 126" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="118" font-size="9.5" fill="#555" filter="url(#rough2)">是</text>

  <rect x="402" y="112" width="104" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="130" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">跳过（已初始化）</text>

  <path d="M 454 112 L 454 77 L 396 77" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 152 L 260 162" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="161" font-size="9.5" fill="#555" filter="url(#rough2)">否</text>

  <rect x="72" y="164" width="376" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">src = (i&gt;0 ? dp[i−1][j] : ∅) ∪ (j&gt;0 ? dp[i][j−1] : ∅)</text>
  <text x="260" y="201" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">按行扫描：dp[j] 尚为上一行旧值，dp[j−1] 已覆写为本行新值</text>

  <path d="M 260 208 L 260 216" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="72" y="218" width="376" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">dp[i][j] ← { x ⊕ grid[i][j] : x ∈ src }</text>

  <path d="M 260 248 L 260 256" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,258 350,284 260,310 170,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">还有</text>
  <text x="260" y="298" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">未处理格子?</text>

  <path d="M 170 284 L 52 284 L 52 77 L 124 77" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="140" y="277" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 260 310 L 260 318" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="317" font-size="9.5" fill="#555" filter="url(#rough2)">否</text>

  <rect x="140" y="320" width="240" height="26" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 min( dp[m−1][n−1] )</text>

  <text x="260" y="357" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">每格集合 ≤ 1024 个值 ⇒ 总转移量 O(m·n·2¹⁰) ≈ 10⁶</text>
</svg>
