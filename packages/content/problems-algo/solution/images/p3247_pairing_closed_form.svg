<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">配对论证：有奇数 ⇒ 恰好一半子集（2^(n−1) 个）和为奇</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">固定一个奇数 o，以 [1,2,2]（o = 1）为例：全部 8 个子集两两配对</text>

  <!-- 配对行：左 S（不含 o），右 S∪{o} -->
  <!-- 行模板 y = 66, 106, 146, 186；左框 x=40 w=90 h=30；右框 x=250 w=120 h=30 -->
  <rect x="40" y="62" width="90" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="82" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">∅（和 0）</text>
  <path d="M 132 77 L 246 77" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <text x="189" y="69" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">∪ {o}</text>
  <rect x="250" y="62" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="82" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">{1} 和 1 奇 ✓</text>

  <rect x="40" y="102" width="90" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="122" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">{2} 和 2 偶</text>
  <path d="M 132 117 L 246 117" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <text x="189" y="109" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">∪ {o}</text>
  <rect x="250" y="102" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="122" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">{1,2} 和 3 奇 ✓</text>

  <rect x="40" y="142" width="90" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="162" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">{2′} 和 2 偶</text>
  <path d="M 132 157 L 246 157" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <text x="189" y="149" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">∪ {o}</text>
  <rect x="250" y="142" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="162" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">{1,2′} 和 3 奇 ✓</text>

  <rect x="40" y="182" width="90" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="202" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">{2,2′} 和 4 偶</text>
  <path d="M 132 197 L 246 197" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <text x="189" y="189" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">∪ {o}</text>
  <rect x="250" y="182" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="202" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">{1,2,2′} 和 5 奇 ✓</text>

  <!-- 右侧推导 -->
  <rect x="392" y="62" width="108" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="88" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">2^n 个子集</text>
  <text x="446" y="112" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">→ 2^(n−1) 对</text>
  <text x="446" y="136" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">每对恰一个奇和</text>
  <text x="446" y="160" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">（和差恰好是 o）</text>
  <text x="446" y="186" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = 2^(n−1)</text>

  <!-- 为什么每对奇偶相反 -->
  <rect x="24" y="226" width="472" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">同对的两个子集只差一个元素 o：sum(S∪{o}) − sum(S) = o 是奇数</text>
  <text x="260" y="266" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">→ 两和一奇一偶，配对两边永远奇偶相反</text>
  <text x="260" y="279" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">（这正是「选中的奇数元素个数差 1」）</text>

  <!-- 闭式代码 + 全偶特判 -->
  <rect x="24" y="298" width="472" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">一行闭式：any 奇 ⇒ pow(2, n−1, MOD)；全偶 ⇒ 0</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">全偶数组任意子集和都是偶数，答案恒 0（不能套 2^(n−1)！）</text>
</svg>
