<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 的中序遍历 = 非降序列，重复值必然相邻</text>

  <!-- 左：含重复值的 BST（示例 1） -->
  <text x="40" y="58" font-size="12" fill="#888">含重复值的 BST（root = [1,null,2,2]）：</text>

  <!-- 树枝：根1 → 右2 → 2的左2 -->
  <line x1="155" y1="100" x2="200" y2="150" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="190" y1="172" x2="150" y2="222" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 节点 1 (根) -->
  <circle cx="150" cy="86" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- 节点 2 (右子) -->
  <circle cx="205" cy="158" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="205" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- 节点 2 (2 的左子, 重复值) -->
  <circle cx="145" cy="232" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- 中序访问顺序标注 ①②③ -->
  <text x="178" y="78" font-size="10" fill="#b85450" font-weight="bold">①</text>
  <text x="172" y="226" font-size="10" fill="#b85450" font-weight="bold">②</text>
  <text x="232" y="150" font-size="10" fill="#b85450" font-weight="bold">③</text>

  <text x="40" y="272" font-size="11" fill="#888">中序：左→根→右 = 1 → 2 → 2</text>

  <!-- 右：非降序列方格 -->
  <text x="320" y="58" font-size="12" fill="#888">中序序列（非降序）：</text>

  <!-- 序列方格 1 2 2 -->
  <rect x="320" y="70" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="345" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <path d="M 372 86 L 388 86" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="392" y="70" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="417" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <path d="M 444 86 L 460 86" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="464" y="70" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="489" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- 相邻相等高亮框 -->
  <rect x="386" y="64" width="132" height="44" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="452" y="60" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">相邻相等</text>

  <!-- 频次行 -->
  <text x="320" y="128" font-size="12" fill="#888">逐值计数（滚动 streak）：</text>

  <rect x="320" y="136" width="50" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="154" text-anchor="middle" font-size="11" fill="#555">cnt=1</text>
  <path d="M 372 150 L 388 150" stroke="#888" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="392" y="136" width="50" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="417" y="154" text-anchor="middle" font-size="11" fill="#555">cnt=1</text>
  <path d="M 444 150 L 460 150" stroke="#888" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="464" y="136" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="489" y="154" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt=2</text>

  <!-- 说明框 -->
  <rect x="320" y="184" width="232" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="336" y="206" font-size="12" fill="#333" font-weight="bold">关键观察</text>
  <text x="336" y="226" font-size="11" fill="#555">中序非降 ⇒ 相同值连续成段</text>
  <text x="336" y="244" font-size="11" fill="#555">只需一个滚动 streak 计数器：</text>
  <text x="336" y="260" font-size="11" fill="#4a7a3a" font-weight="bold">同值 +1，异值重置为 1</text>

  <!-- 底部总结 -->
  <rect x="40" y="300" width="500" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="324" font-size="12" fill="#333" font-weight="bold">无需哈希表：BST 中序把「统计频率」变成「数相邻相同值的段长」</text>
  <text x="60" y="344" font-size="11" fill="#555">遍历一次即可维护 (prev, count)，对比 count 与 maxCount 动态更新众数集</text>
  <text x="60" y="362" font-size="11" fill="#b85450" font-weight="bold">额外空间 O(1)（不含递归栈），满足进阶要求</text>
</svg>
