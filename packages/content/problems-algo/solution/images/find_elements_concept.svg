<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：值即堆索引，(target+1) 的二进制编码路径</text>

  <!-- ===== Left: restored tree ===== -->
  <text x="135" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">还原后的二叉树（值 = 堆索引）</text>

  <!-- edges -->
  <line x1="135" y1="92" x2="85" y2="138" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="135" y1="92" x2="190" y2="138" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="85" y1="155" x2="55" y2="200" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="85" y1="155" x2="110" y2="200" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="190" y1="155" x2="168" y2="200" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="190" y1="155" x2="222" y2="200" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="135" cy="78" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="83" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <circle cx="85" cy="142" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="147" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <circle cx="190" cy="142" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="147" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <circle cx="55" cy="210" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="55" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>

  <circle cx="110" cy="210" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>

  <circle cx="168" cy="210" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>

  <circle cx="222" cy="210" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>

  <!-- rules box -->
  <rect x="30" y="250" width="210" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="135" y="272" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">左子 = 2 × x + 1</text>
  <text x="135" y="290" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">右子 = 2 × x + 2</text>

  <!-- arrow connecting tree to table -->
  <text x="135" y="334" text-anchor="middle" font-size="10.5" fill="#888">与数组堆完全同构</text>

  <!-- ===== Right: encoding table ===== -->
  <text x="425" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">路径编码表</text>

  <!-- header -->
  <rect x="300" y="66" width="245" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="318" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">target</text>
  <text x="365" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="415" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">binary</text>
  <text x="498" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">路径（去首位1）</text>

  <!-- row 0 -->
  <rect x="300" y="94" width="245" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="318" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="365" y="111" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="415" y="111" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <text x="498" y="111" text-anchor="middle" font-size="10.5" fill="#888">（根节点）</text>

  <!-- row 1 -->
  <rect x="300" y="122" width="245" height="26" fill="#f4f8ff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="318" y="139" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="365" y="139" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="415" y="139" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">10</text>
  <text x="498" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0 → 左</text>

  <!-- row 2 -->
  <rect x="300" y="150" width="245" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="318" y="167" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="365" y="167" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="415" y="167" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">11</text>
  <text x="498" y="167" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1 → 右</text>

  <!-- row 3 -->
  <rect x="300" y="178" width="245" height="26" fill="#f4f8ff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="318" y="195" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="365" y="195" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="415" y="195" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">100</text>
  <text x="498" y="195" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">00 → 左,左</text>

  <!-- row 5 (highlighted) -->
  <rect x="300" y="206" width="245" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="318" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="365" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="415" y="223" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" font-weight="bold">110</text>
  <text x="498" y="223" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">10 → 右,左</text>

  <!-- legend -->
  <rect x="300" y="250" width="245" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="422" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 = 走左子，1 = 走右子</text>
  <text x="422" y="290" text-anchor="middle" font-size="10.5" fill="#b85450">target+1 最高位的 1 代表根</text>

  <!-- divider -->
  <line x1="275" y1="48" x2="275" y2="320" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="80" y="340" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">污染只改值不改结构 → 无需还原，沿路径走即可</text>
</svg>
