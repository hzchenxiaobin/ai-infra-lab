<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每个元素的最大最小窗口 = 左右更小元素夹出的区间</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">arr[i] 是窗口 [left+1, right-1] 内的最小值 → 该窗口大小 w = right − left − 1</text>

  <!-- array cells -->
  <g font-size="13">
    <rect x="80" y="120" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="110" y="146" text-anchor="middle" fill="#333" filter="url(#rough2)">10</text>
    <rect x="150" y="120" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="146" text-anchor="middle" fill="#333" filter="url(#rough2)">20</text>
    <rect x="220" y="120" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="250" y="146" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">50</text>
    <rect x="290" y="120" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="320" y="146" text-anchor="middle" fill="#333" filter="url(#rough2)">15</text>
    <rect x="360" y="120" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="390" y="146" text-anchor="middle" fill="#333" filter="url(#rough2)">5</text>
    <rect x="430" y="120" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="460" y="146" text-anchor="middle" fill="#333" filter="url(#rough2)">25</text>
    <rect x="500" y="120" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="530" y="146" text-anchor="middle" fill="#333" filter="url(#rough2)">30</text>
  </g>

  <!-- index labels -->
  <g font-size="10" fill="#888">
    <text x="110" y="176" text-anchor="middle" filter="url(#rough2)">idx 0</text>
    <text x="180" y="176" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="250" y="176" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2  ← 观察 arr[2]=50</text>
    <text x="320" y="176" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="390" y="176" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="460" y="176" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="530" y="176" text-anchor="middle" filter="url(#rough2)">6</text>
  </g>

  <!-- left smaller arrow: idx1 (20) -->
  <path d="M 180 100 Q 215 86 245 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="84" font-size="11" fill="#4a7a3a" filter="url(#rough2)">左更小 = 20</text>

  <!-- right smaller arrow: idx3 (15) -->
  <path d="M 260 162 Q 285 196 315 162" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="214" font-size="11" fill="#b85450" filter="url(#rough2)">右更小 = 15</text>

  <!-- window span bracket -->
  <path d="M 150 232 L 150 224 L 350 224 L 350 232" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="250" y="248" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">窗口 [left+1 .. right-1] = [2 .. 2]，w = 3 − 1 − 1 = 1</text>

  <!-- explanation box -->
  <rect x="60" y="270" width="520" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="294" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">为什么 arr[i] 是大小为 w 的窗口的最小值？</text>
  <text x="80" y="316" font-size="12" fill="#555" filter="url(#rough2)">① left 处元素 &lt; arr[i] 且 right 处元素 &lt; arr[i]（两侧「墙」更矮）</text>
  <text x="80" y="336" font-size="12" fill="#555" filter="url(#rough2)">② [left+1, right-1] 之间没有任何元素 &lt; arr[i]（否则那个元素才是边界）</text>
  <text x="80" y="356" font-size="12" fill="#555" filter="url(#rough2)">⇒ 任何恰好覆盖 arr[i] 且不越 [left, right] 的窗口，最小值都 = arr[i]</text>
  <text x="80" y="378" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ arr[i] 能作为「某窗口最小值」的最大窗口大小 = w = right − left − 1</text>
  <text x="80" y="400" font-size="11" fill="#888" filter="url(#rough2)">对每个 i 求出 w，更新 ans[w] = max(ans[w], arr[i])；最后从右向左传播填空。</text>
</svg>
