<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：正反两次扫描 + 合并取最小差</text>

  <!-- ===== Step 1: left-to-right ===== -->
  <rect x="40" y="40" width="480" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" fill-opacity="0.4"/>
  <text x="60" y="60" font-size="12" fill="#446688" font-weight="bold">第一步：从左到右扫，算 leftMinSum[i]</text>

  <!-- step boxes -->
  <rect x="56" y="72" width="120" height="34" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="116" y="93" text-anchor="middle" font-size="10.5" fill="#333">大根堆放前 n 个</text>

  <path d="M 178 89 L 196 89" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="72" width="130" height="34" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="265" y="88" text-anchor="middle" font-size="10" fill="#333">i = n → 2n−1：</text>
  <text x="265" y="100" text-anchor="middle" font-size="10" fill="#333">push nums[i]，pop max</text>

  <path d="M 332 89 L 350 89" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="354" y="72" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="429" y="93" text-anchor="middle" font-size="10.5" fill="#4a7a3a">leftMinSum[i] = 堆内和</text>

  <!-- heap illustration -->
  <text x="60" y="126" font-size="10" fill="#888">大根堆容量 n：始终保留扫过范围内最小的 n 个，堆顶是被踢出的候选</text>
  <text x="60" y="142" font-size="10" fill="#888">i = n−1 时初始化为 nums[0..n−1]；之后每右移一格，新元素若 &lt; 堆顶则替换</text>

  <!-- arrow down -->
  <path d="M 280 164 L 280 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: right-to-left ===== -->
  <rect x="40" y="188" width="480" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" fill-opacity="0.4"/>
  <text x="60" y="208" font-size="12" fill="#4a7a3a" font-weight="bold">第二步：从右到左扫，算 rightMaxSum[i]</text>

  <rect x="56" y="220" width="120" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="116" y="241" text-anchor="middle" font-size="10.5" fill="#333">小根堆放后 n 个</text>

  <path d="M 178 237 L 196 237" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="220" width="140" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="10" fill="#333">i = 2n−2 → n−1：</text>
  <text x="270" y="248" text-anchor="middle" font-size="10" fill="#333">push nums[i+1]，pop min</text>

  <path d="M 342 237 L 360 237" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="364" y="220" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="434" y="241" text-anchor="middle" font-size="10.5" fill="#d6a040">rightMaxSum[i] = 堆内和</text>

  <text x="60" y="274" font-size="10" fill="#888">小根堆容量 n：始终保留右侧范围内最大的 n 个，堆顶是被踢出的候选</text>
  <text x="60" y="290" font-size="10" fill="#888">i = 2n−1 时初始化为 nums[2n..3n−1]；之后每左移一格，新元素若 &gt; 堆顶则替换</text>

  <!-- arrow down -->
  <path d="M 280 312 L 280 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: merge ===== -->
  <rect x="40" y="336" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)" fill-opacity="0.4"/>
  <text x="60" y="356" font-size="12" fill="#b85450" font-weight="bold">第三步：枚举分界点 i ∈ [n−1, 2n−1]，取最小差</text>

  <rect x="120" y="366" width="320" height="20" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#b85450">ans = min(leftMinSum[i] − rightMaxSum[i])</text>

  <!-- summary box -->
  <rect x="80" y="404" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">一次正向 + 一次逆向，各 O(n log n)</text>
  <text x="280" y="438" text-anchor="middle" font-size="10.5" fill="#888">总时间 O(n log n)，空间 O(n)（存两组前缀和）</text>
</svg>
