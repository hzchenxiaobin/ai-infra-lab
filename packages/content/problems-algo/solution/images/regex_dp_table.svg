<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">DP 填表演算：s = "aab", p = "c*a*b"</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#888">dp[i][j] 表示 s[0..i-1] 是否匹配 p[0..j-1]</text>

  <text x="122" y="92" text-anchor="end" font-size="11" fill="#888" font-weight="bold">p →</text>
  <text x="160" y="92" text-anchor="middle" font-size="11" fill="#888">""</text>
  <text x="220" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c</text>
  <text x="280" y="92" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">*</text>
  <text x="340" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <text x="400" y="92" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">*</text>
  <text x="460" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">b</text>

  <text x="122" y="132" text-anchor="end" font-size="11" fill="#888" font-weight="bold">""</text>
  <text x="122" y="176" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="122" y="220" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="122" y="264" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="84" y="200" font-size="11" fill="#888" font-weight="bold" transform="rotate(-90 84 200)">s ↓</text>

  <!-- Row 0 (boundary, orange): T F T F T F -->
  <rect x="130" y="106" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">T</text>
  <rect x="190" y="106" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="134" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="250" y="106" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">T</text>
  <rect x="310" y="106" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="134" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="370" y="106" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="134" text-anchor="middle" font-size="13" fill="#c98a2b" font-weight="bold">T</text>
  <rect x="430" y="106" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="134" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>

  <!-- Row 1: F F F T T F -->
  <rect x="130" y="150" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="178" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="190" y="150" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="178" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="250" y="150" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="310" y="150" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="370" y="150" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="430" y="150" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="178" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>

  <!-- Row 2: F F F F T F -->
  <rect x="130" y="194" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="222" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="190" y="194" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="222" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="250" y="194" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="310" y="194" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="222" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="370" y="194" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="430" y="194" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="222" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>

  <!-- Row 3: F F F F F T (answer highlighted) -->
  <rect x="130" y="238" width="60" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="266" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="190" y="238" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="266" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="250" y="238" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="310" y="238" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="266" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="370" y="238" width="60" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="266" text-anchor="middle" font-size="13" fill="#bbb" font-weight="bold">F</text>
  <rect x="430" y="238" width="60" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="266" text-anchor="middle" font-size="14" fill="#4a8e4a" font-weight="bold">T</text>

  <!-- Transition arrows -->
  <!-- dp[3][5] = dp[2][4] : 'b'=='b' diagonal from (400,222) to (430,238) -->
  <path d="M 410 226 Q 425 232 440 238" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="418" y="216" font-size="10" fill="#4a8e4a" font-weight="bold">b=b</text>

  <!-- dp[1][4] *=branch② from dp[0][4] (400,150) down to (400,150)->(400,150) -->
  <path d="M 400 152 L 400 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="408" y="164" font-size="10" fill="#b85450" font-weight="bold">a* 吃 a</text>

  <!-- dp[1][3] 'a'=='a' diagonal from dp[0][2] (280,150) to (310,150) -->
  <path d="M 290 150 Q 305 156 320 150" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="298" y="146" font-size="9" fill="#4a8e4a">a=a</text>

  <!-- Side explanation box -->
  <rect x="510" y="106" width="190" height="176" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="605" y="128" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">读表要点</text>
  <text x="520" y="150" font-size="11" fill="#c98a2b" font-weight="bold">边界行</text>
  <text x="520" y="166" font-size="10" fill="#555">空串 s 只能匹配</text>
  <text x="520" y="180" font-size="10" fill="#555">能消成空的模式</text>
  <text x="520" y="194" font-size="10" fill="#555">(c*→空, a*→空)</text>
  <text x="520" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">绿格 T</text>
  <text x="520" y="234" font-size="10" fill="#555">a* 的分支② 让 T</text>
  <text x="520" y="248" font-size="10" fill="#555">沿「上」方向传递</text>
  <text x="520" y="272" font-size="11" fill="#4a8e4a" font-weight="bold">答案 dp[3][5]</text>

  <!-- Bottom legend -->
  <rect x="40" y="300" width="660" height="124" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="60" y="324" font-size="12" fill="#2b2b2b" font-weight="bold">关键路径回放：</text>
  <text x="60" y="346" font-size="11" fill="#c98a2b">① c* 匹配零个 c</text>
  <text x="200" y="346" font-size="11" fill="#555">→ dp[0][2] = dp[0][0] = T（空串模式 c* 消成空）</text>
  <text x="60" y="368" font-size="11" fill="#4a7a3a">② 第一个 a 被模式 a 匹配</text>
  <text x="280" y="368" font-size="11" fill="#555">→ dp[1][3] = dp[0][2] = T</text>
  <text x="60" y="390" font-size="11" fill="#b85450">③ a* 再吃第二个 a</text>
  <text x="240" y="390" font-size="11" fill="#555">→ dp[2][4] = dp[1][4] = T（分支②，pattern 不动）</text>
  <text x="60" y="412" font-size="11" fill="#4a8e4a">④ b 匹配 b</text>
  <text x="180" y="412" font-size="11" fill="#555">→ dp[3][5] = dp[2][4] = T ✓ 整串匹配成功</text>
</svg>
