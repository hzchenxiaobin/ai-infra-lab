<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：骑士走 L 形，每相邻两步须为合法走法</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">|Δr| × |Δc| == 2　（一方向 2 格、另一方向 1 格）</text>

  <!-- 5x5 grid: cell=38, start x=165, y=56 -->
  <!-- grid lines -->
  <path d="M165 56 L355 56 M165 94 L355 94 M165 132 L355 132 M165 170 L355 170 M165 208 L355 208 M165 246 L355 246
           M165 56 L165 246 M203 56 L203 246 M241 56 L241 246 M279 56 L279 246 M317 56 L317 246 M355 56 L355 246"
        stroke="#cfd8e8" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 8 reachable cells from center (2,2) in green -->
  <rect x="203" y="56" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="279" y="56" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="165" y="94" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="317" y="94" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="165" y="170" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="317" y="170" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="203" y="208" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="279" y="208" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <!-- L-shape hint arrows from center to two example cells -->
  <path d="M260 151 L222 94" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260 151 L298 227" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- reachable cells tick marks -->
  <text x="222" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="298" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="184" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="336" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="184" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="336" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="222" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="298" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- center cell (knight) -->
  <rect x="241" y="132" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="20" fill="#d6a040" font-weight="bold">♞</text>

  <!-- center label -->
  <text x="260" y="246" text-anchor="middle" font-size="10" fill="#888">中心为当前步，绿色 8 格为下一步可达</text>

  <!-- Two validation rules -->
  <text x="28" y="282" font-size="11" fill="#666" font-weight="bold">两道校验：</text>

  <rect x="28" y="290" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="138" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 起点必须在左上角</text>
  <text x="138" y="326" text-anchor="middle" font-size="10.5" fill="#555">pos[0] == (0, 0)</text>

  <rect x="272" y="290" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="382" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 相邻步为合法 L 走法</text>
  <text x="382" y="326" text-anchor="middle" font-size="10.5" fill="#555">∀k: |Δr|×|Δc| == 2</text>
</svg>
