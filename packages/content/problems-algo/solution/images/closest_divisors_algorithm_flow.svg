<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：主流程 + 辅助函数 closest(n)</text>

  <rect x="220" y="42" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 num</text>
  <path d="M280,72 L280,90" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="92" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n₁ = num + 1</text>

  <rect x="300" y="92" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n₂ = num + 2</text>

  <path d="M190,126 L190,150" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <path d="M370,126 L370,150" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <rect x="100" y="152" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[a₁, b₁] = closest(n₁)</text>
  <text x="190" y="188" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">差距 d₁ = |a₁ − b₁|</text>

  <rect x="280" y="152" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[a₂, b₂] = closest(n₂)</text>
  <text x="370" y="188" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">差距 d₂ = |a₂ − b₂|</text>

  <path d="M190,196 L190,216 L280,216" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M370,196 L370,216 L280,216" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <polygon points="280,218 360,250 280,282 200,250" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d₁ &lt; d₂ ?</text>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">比较差距</text>

  <path d="M200,250 L130,250 L130,288" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="150" y="242" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M360,250 L430,250 L430,288" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="380" y="242" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="60" y="290" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 [a₁, b₁]</text>

  <rect x="360" y="290" width="140" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 [a₂, b₂]</text>

  <rect x="40" y="344" width="480" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">辅助函数 closest(n)：从 ⌊√n⌋ 向下找首个因子</text>

  <rect x="70" y="378" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w = ⌊√n⌋</text>
  <path d="M200,393 L220,393" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <polygon points="290,378 350,393 290,408 230,393" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="396" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n % w == 0?</text>

  <path d="M350,393 L378,393" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="362" y="386" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="380" y="378" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w −−</text>
  <path d="M420,408 L420,424 L290,424 L290,408" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <path d="M290,408 L290,428" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="424" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="190" y="430" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="451" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">返回 [w, n / w]（差距最小）</text>
</svg>
