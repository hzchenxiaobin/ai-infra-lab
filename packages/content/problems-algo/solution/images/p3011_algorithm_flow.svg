<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描，三个滚动变量</text>

  <!-- start -->
  <rect x="100" y="40" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">开始 prevMax=curMax=curBits=0</text>
  <path d="M 200 74 L 200 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- next element -->
  <rect x="125" y="96" width="150" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取下一个元素 x</text>
  <path d="M 200 128 L 200 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- popcount -->
  <rect x="115" y="152" width="170" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="172" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">b = popcount(x)</text>
  <path d="M 200 184 L 200 202" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="200,206 278,232 200,258 122,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="236" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b == curBits ?</text>

  <!-- no branch: new segment -->
  <path d="M 122 232 L 182 232" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="146" y="224" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="40" y="210" width="140" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="228" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">prevMax = curMax</text>
  <text x="110" y="246" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">curBits=b; curMax=x</text>

  <!-- yes branch: same segment -->
  <path d="M 278 232 L 312 232" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="294" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="316" y="210" width="150" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="391" y="228" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">curMax =</text>
  <text x="391" y="246" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">max(curMax, x)</text>

  <!-- merge -->
  <path d="M 110 254 L 110 282" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 391 254 L 391 282" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 110 282 L 391 282" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 200 282 L 200 292" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="200,296 272,322 200,348 128,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="326" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x &lt; prevMax ?</text>

  <!-- yes: false -->
  <path d="M 272 322 L 326 322" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="330" y="306" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- no: continue -->
  <path d="M 200 348 L 200 364" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="210" y="362" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="100" y="368" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">回到「取下一个 x」继续</text>
  <text x="200" y="404" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部扫完 → return true</text>

  <!-- loop back -->
  <path d="M 100 390 L 18 390 L 18 112 L 121 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="26" y="250" font-size="10" fill="#4a7a3a" transform="rotate(-90 26 250)" text-anchor="middle" filter="url(#rough2)">下一轮</text>
</svg>
