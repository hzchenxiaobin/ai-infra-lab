<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">状态 (i, M)：取前 X 堆（1≤X≤2M），取后 M ← max(M, X)</text>

  <!-- piles row -->
  <text x="44" y="74" font-size="12" fill="#888">piles:</text>
  <rect x="100" y="58" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="78" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="146" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="78" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="192" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="78" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="238" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="78" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="284" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="78" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- index labels -->
  <text x="123" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i</text>
  <text x="307" y="104" text-anchor="middle" font-size="10" fill="#888">n−1</text>

  <!-- bracket: take X piles (green) -->
  <path d="M 100 50 Q 100 42 108 42 L 138 42 Q 146 42 146 50" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="123" y="36" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">取 X 堆</text>

  <!-- bracket: remaining to opponent (orange) -->
  <path d="M 150 50 Q 150 42 158 42 L 326 42 Q 334 42 334 50" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="242" y="36" text-anchor="middle" font-size="11" fill="#d6a040">剩余 → 对手先手</text>

  <!-- arrows from piles down to boxes -->
  <path d="M 123 112 Q 110 122 145 130" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 285 112 Q 340 122 385 130" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- left box: take X -->
  <rect x="30" y="132" width="230" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="154" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">当前玩家取 piles[i .. i+X−1]</text>
  <text x="145" y="176" text-anchor="middle" font-size="11" fill="#444">得 sum = suffix[i] − suffix[i+X]</text>
  <text x="145" y="196" text-anchor="middle" font-size="11" fill="#444">X ∈ [1, 2M]，随后 M ← max(M, X)</text>

  <!-- right box: opponent -->
  <rect x="280" y="132" width="210" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="154" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">对手从 i+X 出发</text>
  <text x="385" y="176" text-anchor="middle" font-size="11" fill="#444">参数 M' = max(M, X)</text>
  <text x="385" y="196" text-anchor="middle" font-size="11" fill="#444">对手最优得 dp[i+X][M']</text>

  <!-- formula box -->
  <rect x="30" y="236" width="460" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#444">零和：区间总和 suffix[i] 固定 → 我得 = 总 − 对手得</text>
  <text x="260" y="282" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">dp[i][m] = max ( suffix[i] − dp[i+X][ max(m, X) ] )</text>
  <text x="260" y="300" text-anchor="middle" font-size="10" fill="#888">枚举 X = 1 .. 2m；若 2m ≥ 剩余堆数则一次取完 = suffix[i]</text>
</svg>
