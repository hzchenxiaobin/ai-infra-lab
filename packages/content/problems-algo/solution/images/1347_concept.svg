<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：t 比 s 多出的字符，每个都要换一次</text>

  <!-- 示例标注 -->
  <text x="40" y="56" font-size="12" fill="#666" font-weight="bold">示例：s = "bab"  t = "aba"  （等长 n = 3）</text>

  <!-- 左：s 的频率表 -->
  <text x="60" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">cntS</text>
  <g filter="url(#rough2)">
    <rect x="30" y="100" width="60" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="45" y="117" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">字符</text>
    <rect x="90" y="100" width="60" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="120" y="117" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">次数</text>
    <rect x="30" y="124" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="60" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="90" y="124" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="120" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="30" y="148" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="60" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <rect x="90" y="148" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="120" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- 中间：t 的频率表 -->
  <text x="280" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cntT</text>
  <g filter="url(#rough2)">
    <rect x="250" y="100" width="60" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="280" y="117" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">字符</text>
    <rect x="310" y="100" width="60" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="340" y="117" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">次数</text>
    <rect x="250" y="124" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="280" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="310" y="124" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="340" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="250" y="148" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="280" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <rect x="310" y="148" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="340" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  </g>

  <!-- 减号 -->
  <text x="210" y="148" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">−</text>

  <!-- 右：diff = cntT - cntS -->
  <text x="470" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">diff = cntT − cntS</text>
  <g filter="url(#rough2)">
    <rect x="440" y="100" width="60" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="470" y="117" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">字符</text>
    <rect x="500" y="100" width="50" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="525" y="117" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">差</text>
    <!-- a: +1 多余，红色高亮 -->
    <rect x="440" y="124" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="470" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="500" y="124" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="525" y="141" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">+1</text>
    <!-- b: -1 缺少，橙黄 -->
    <rect x="440" y="148" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="470" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
    <rect x="500" y="148" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="525" y="165" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">−1</text>
  </g>

  <!-- 等号连接 diff -->
  <text x="400" y="148" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">=</text>

  <!-- 关键说明框 -->
  <g filter="url(#rough2)">
    <rect x="40" y="196" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="280" y="218" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">等长 ⇒ 正差之和 = 负差绝对值之和</text>
    <text x="280" y="238" text-anchor="middle" font-size="12" fill="#555">一次替换同时消去「1 个多余」和「1 个缺少」</text>
  </g>

  <!-- 正差累加 → 答案 -->
  <text x="40" y="280" font-size="12" fill="#666" font-weight="bold">累加正差（t 多出来的字符）：</text>
  <g filter="url(#rough2)">
    <rect x="40" y="290" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="100" y="311" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a: +1</text>
    <text x="170" y="311" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">→</text>
    <rect x="190" y="290" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8"/>
    <text x="250" y="311" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = 1</text>
  </g>

  <!-- 替换示意 -->
  <text x="340" y="280" font-size="12" fill="#666" font-weight="bold">替换方案（不看位置）：</text>
  <g filter="url(#rough2)">
    <rect x="340" y="290" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="357" y="311" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
    <text x="382" y="311" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">→</text>
    <rect x="396" y="290" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="413" y="311" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">b</text>
    <text x="440" y="311" font-size="11" fill="#666">t: "aba"→"bba"</text>
  </g>

  <!-- 底部一句话 -->
  <path d="M100 326 L250 348" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="40" y="362" font-size="11" fill="#555" font-weight="bold">多余字符总数 = 替换下界，构造性达成 ⇒ 即最优</text>
  <text x="40" y="380" font-size="11" fill="#888">order 无关：异位词只比多重集合，挪位无意义</text>
</svg>
