<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="460" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">每排 10 个座位，3 个可选 4 连座块</text>
  <path d="M 280 42 Q 440 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="66" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">座位 1 与 10 无法进入任何 4 连块；可安排区域是座位 2–9（共 8 座，至多 2 组）</text>

  <!-- 可安排区域括号 -->
  <path d="M 122 88 L 122 80 L 532 80 L 532 88" stroke="#7a7a7a" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 10 个座位 -->
  <g filter="url(#sk)">
    <rect x="70"  y="96" width="46" height="40" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.4"/>
    <rect x="122" y="96" width="46" height="40" rx="4" fill="#f5f9fd" stroke="#446688" stroke-width="1.4"/>
    <rect x="174" y="96" width="46" height="40" rx="4" fill="#f5f9fd" stroke="#446688" stroke-width="1.4"/>
    <rect x="226" y="96" width="46" height="40" rx="4" fill="#f5f9fd" stroke="#446688" stroke-width="1.4"/>
    <rect x="278" y="96" width="46" height="40" rx="4" fill="#f5f9fd" stroke="#446688" stroke-width="1.4"/>
    <rect x="330" y="96" width="46" height="40" rx="4" fill="#f5f9fd" stroke="#446688" stroke-width="1.4"/>
    <rect x="382" y="96" width="46" height="40" rx="4" fill="#f5f9fd" stroke="#446688" stroke-width="1.4"/>
    <rect x="434" y="96" width="46" height="40" rx="4" fill="#f5f9fd" stroke="#446688" stroke-width="1.4"/>
    <rect x="486" y="96" width="46" height="40" rx="4" fill="#f5f9fd" stroke="#446688" stroke-width="1.4"/>
    <rect x="538" y="96" width="46" height="40" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="93"  y="122">1</text>
    <text x="145" y="122">2</text>
    <text x="197" y="122">3</text>
    <text x="249" y="122">4</text>
    <text x="301" y="122">5</text>
    <text x="353" y="122">6</text>
    <text x="405" y="122">7</text>
    <text x="457" y="122">8</text>
    <text x="509" y="122">9</text>
    <text x="561" y="122">10</text>
  </g>
  <text x="93"  y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">不可用</text>
  <text x="561" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">不可用</text>

  <!-- L 中块 R 三条色带 -->
  <g filter="url(#sk)">
    <rect x="122" y="172" width="202" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="223" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5588" filter="url(#sk)">左块 L：座位 2-5</text>

  <g filter="url(#sk)">
    <rect x="226" y="214" width="202" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="327" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">中块 M：座位 4-7</text>

  <g filter="url(#sk)">
    <rect x="330" y="256" width="202" height="30" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="431" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">右块 R：座位 6-9</text>

  <!-- 重叠标注：4-5 与 6-7 -->
  <path d="M 249 304 L 249 318" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <path d="M 301 304 L 301 318" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <text x="275" y="332" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">L∩M = 4,5</text>

  <path d="M 353 304 L 353 318" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <path d="M 405 304 L 405 318" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" fill="none" filter="url(#sk)"/>
  <text x="379" y="332" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">M∩R = 6,7</text>

  <!-- 5 与 6 相邻不重叠 -->
  <text x="327" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">5|6 相邻</text>

  <!-- 关键结论框 -->
  <g filter="url(#sk)">
    <rect x="600" y="172" width="256" height="180" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="728" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">关键结构</text>
  <text x="612" y="220" font-size="11" fill="#444" filter="url(#sk)">① L 与 R 不重叠（5、6 相邻）</text>
  <text x="612" y="240" font-size="11" fill="#4a7a3a" filter="url(#sk)">   → 可同排放 2 组（L + R）</text>
  <text x="612" y="264" font-size="11" fill="#444" filter="url(#sk)">② M 与 L、R 都重叠</text>
  <text x="612" y="284" font-size="11" fill="#d6a040" filter="url(#sk)">   → 选 M 则该排最多 1 组</text>
  <text x="612" y="308" font-size="11" fill="#444" filter="url(#sk)">③ 座位 2-9 共 8 座</text>
  <text x="612" y="328" font-size="11" fill="#b85450" filter="url(#sk)">   → 每排上限 = 2 组</text>
  <text x="612" y="346" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">贪心：L&amp;R 都空放 2，否则放 1</text>

  <!-- 底部一句 -->
  <g filter="url(#sk)">
    <rect x="60" y="372" width="760" height="64" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="440" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">每排贪心决策：若 L 与 R 同时空闲 → 放 2 组；否则若 L/M/R 任一空闲 → 放 1 组；否则 0 组</text>
  <text x="440" y="418" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">全空排天然 L&amp;R 空闲 → 恰好 2 组；只有出现在 reservedSeats 里的排才需逐排计算</text>
</svg>
