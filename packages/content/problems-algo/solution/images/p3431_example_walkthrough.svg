<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#888"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,1,1,3,2,2]，locked = [1,0,1,1,0,1,0]</text>

  <text x="92" y="58" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">nums:</text>
  <rect x="100" y="40" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="146" y="40" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="192" y="40" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="238" y="40" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="284" y="40" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="330" y="40" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="353" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="376" y="40" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="399" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="123" y="82" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="169" y="82" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="215" y="82" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="261" y="82" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="307" y="82" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="353" y="82" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="399" y="82" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>

  <path d="M169,104 L169,92" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="169" y="118" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">first2</text>
  <path d="M261,104 L261,92" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="261" y="118" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">last1</text>
  <path d="M307,104 L307,92" stroke="#d6a040" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="307" y="118" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">first3</text>
  <path d="M399,104 L399,92" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="399" y="118" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">last2</text>

  <text x="92" y="146" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">locked:</text>
  <rect x="100" y="130" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="146" y="130" width="46" height="24" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="169" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="192" y="130" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="238" y="130" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="284" y="130" width="46" height="24" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="307" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="330" y="130" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="353" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="376" y="130" width="46" height="24" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="399" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <path d="M215,176 L215,158" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="215" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">解锁</text>
  <path d="M353,176 L353,158" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="353" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">解锁</text>

  <rect x="146" y="204" width="92" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="228" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[first2, last1) = [1, 3)</text>
  <rect x="284" y="204" width="92" height="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="228" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">[first3, last2) = [4, 6)</text>

  <rect x="40" y="240" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">需解锁下标集合 = {1,2} ∪ {4,5}，其中 locked=1 的只有下标 2 和 5</text>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⟹ 答案 = 2</text>

  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">解锁下标 2、5 后模拟冒泡排序：</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">swap(1,2)、swap(2,3) 把两个 1 归位；swap(4,5)、swap(5,6) 把 3 归位</text>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[1,2,1,1,3,2,2] ⟶ [1,1,1,2,2,2,3] ✓ 有序</text>
</svg>
