<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按值分组 → 行列 union → 按根分组求秩 → 赋值更新</text>

  <!-- Step 1 -->
  <rect x="150" y="48" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333">① 按值升序分组：map&lt;值, 格子列表&gt;</text>

  <path d="M 280 90 L 280 108" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 2: loop header -->
  <rect x="120" y="112" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 对每个值 v 的格子组（升序）</text>

  <path d="M 280 154 L 280 172" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="140" y="176" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="201" text-anchor="middle" font-size="11.5" fill="#333">③ 重置：parent[i]=i, parent[m+j]=m+j</text>

  <path d="M 280 218 L 280 236" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="120" y="240" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="265" text-anchor="middle" font-size="11.5" fill="#333">④ 每个 (i,j) → union( 行 i, 列 m+j )</text>

  <path d="M 280 282 L 280 300" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="140" y="304" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="329" text-anchor="middle" font-size="11.5" fill="#333">⑤ 按 find(i) 根把格子归入各连通分量</text>

  <path d="M 280 346 L 280 364" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 6 -->
  <rect x="80" y="368" width="400" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑥ 每个分量：rank = 1 + max(max(rowMax[i],colMax[j]))</text>
  <text x="280" y="402" text-anchor="middle" font-size="10.5" fill="#888">赋 ans[i][j]=rank，更新 rowMax[i]=colMax[j]=rank</text>

  <!-- loop back arrow on the right -->
  <path d="M 440 132 Q 480 132 480 250 Q 480 388 440 388" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="490" y="200" font-size="10" fill="#d6a040" font-weight="bold">下一值组</text>

  <!-- final note -->
  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#4a7a3a">全部值组处理完 → 返回 ans</text>
</svg>
