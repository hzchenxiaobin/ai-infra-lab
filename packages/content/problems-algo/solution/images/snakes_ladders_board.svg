<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="780" height="470" fill="#fafafa"/>

  <!-- Title -->
  <g filter="url(#rough2)">
    <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">蛇梯棋：Boustrophedon 编号与坐标转换</text>
    <path d="M 180 36 Q 390 42 600 36" stroke="#aaa" stroke-width="1" fill="none"/>
  </g>

  <!-- ===== Board 6x6, cell 48x48, start (40, 58) ===== -->

  <!-- Row 0 (y=58): 36 35 34 33 32 31 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="40" y="58" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="64" y="88" text-anchor="middle" fill="#7a5415" font-weight="bold">36</text>
    <rect x="88" y="58" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="88" text-anchor="middle" fill="#333">35</text>
    <rect x="136" y="58" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="88" text-anchor="middle" fill="#333">34</text>
    <rect x="184" y="58" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="208" y="88" text-anchor="middle" fill="#333">33</text>
    <rect x="232" y="58" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="88" text-anchor="middle" fill="#333">32</text>
    <rect x="280" y="58" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="88" text-anchor="middle" fill="#333">31</text>
  </g>

  <!-- Row 1 (y=106): 25 26 27 28 29 30 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="40" y="106" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="136" text-anchor="middle" fill="#333">25</text>
    <rect x="88" y="106" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="136" text-anchor="middle" fill="#333">26</text>
    <rect x="136" y="106" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="136" text-anchor="middle" fill="#333">27</text>
    <rect x="184" y="106" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="208" y="136" text-anchor="middle" fill="#333">28</text>
    <rect x="232" y="106" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="136" text-anchor="middle" fill="#333">29</text>
    <rect x="280" y="106" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="136" text-anchor="middle" fill="#333">30</text>
  </g>

  <!-- Row 2 (y=154): 24 23 22 21 20 19 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="40" y="154" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="184" text-anchor="middle" fill="#333">24</text>
    <rect x="88" y="154" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="184" text-anchor="middle" fill="#333">23</text>
    <rect x="136" y="154" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="184" text-anchor="middle" fill="#333">22</text>
    <rect x="184" y="154" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="208" y="184" text-anchor="middle" fill="#333">21</text>
    <rect x="232" y="154" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="184" text-anchor="middle" fill="#333">20</text>
    <rect x="280" y="154" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="184" text-anchor="middle" fill="#333">19</text>
  </g>

  <!-- Row 3 (y=202): 13 14 15 16 17 18 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="40" y="202" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="232" text-anchor="middle" fill="#333">13</text>
    <rect x="88" y="202" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="112" y="228" text-anchor="middle" fill="#2e6e2e" font-weight="bold">14</text>
    <text x="112" y="244" text-anchor="middle" font-size="8" fill="#4a7a3a">→35</text>
    <rect x="136" y="202" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="232" text-anchor="middle" fill="#333">15</text>
    <rect x="184" y="202" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="208" y="232" text-anchor="middle" fill="#333">16</text>
    <rect x="232" y="202" width="48" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="256" y="228" text-anchor="middle" fill="#b03a3a" font-weight="bold">17</text>
    <text x="256" y="244" text-anchor="middle" font-size="8" fill="#b85450">→13</text>
    <rect x="280" y="202" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="232" text-anchor="middle" fill="#333">18</text>
  </g>

  <!-- Row 4 (y=250): 12 11 10 9 8 7 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="40" y="250" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="64" y="280" text-anchor="middle" fill="#333">12</text>
    <rect x="88" y="250" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="280" text-anchor="middle" fill="#333">11</text>
    <rect x="136" y="250" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="280" text-anchor="middle" fill="#333">10</text>
    <rect x="184" y="250" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="208" y="280" text-anchor="middle" fill="#333">9</text>
    <rect x="232" y="250" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="280" text-anchor="middle" fill="#333">8</text>
    <rect x="280" y="250" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="280" text-anchor="middle" fill="#333">7</text>
  </g>

  <!-- Row 5 (y=298): 1 2 3 4 5 6 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="40" y="298" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="64" y="328" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <rect x="88" y="298" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="112" y="324" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="112" y="340" text-anchor="middle" font-size="8" fill="#4a7a3a">→15</text>
    <rect x="136" y="298" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="328" text-anchor="middle" fill="#333">3</text>
    <rect x="184" y="298" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="208" y="328" text-anchor="middle" fill="#333">4</text>
    <rect x="232" y="298" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="328" text-anchor="middle" fill="#333">5</text>
    <rect x="280" y="298" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="328" text-anchor="middle" fill="#333">6</text>
  </g>

  <!-- Direction arrows (right of grid) -->
  <g filter="url(#rough2)" font-size="14" fill="#888">
    <text x="340" y="86" text-anchor="start">←</text>
    <text x="340" y="134" text-anchor="start">→</text>
    <text x="340" y="182" text-anchor="start">←</text>
    <text x="340" y="230" text-anchor="start">→</text>
    <text x="340" y="278" text-anchor="start">←</text>
    <text x="340" y="326" text-anchor="start">→</text>
  </g>

  <!-- Curved snake/ladder arrows -->
  <g filter="url(#rough2)" opacity="0.55">
    <!-- Ladder 2→15: from cell 2 center to cell 15 center -->
    <path d="M 136 322 C 220 300 220 250 184 226" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrG)"/>
    <!-- Ladder 14→35: from cell 14 center to cell 35 center -->
    <path d="M 136 226 C 250 226 250 82 136 82" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrG)"/>
    <!-- Snake 17→13: from cell 17 center to cell 13 center -->
    <path d="M 256 202 C 180 175 100 175 88 202" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  </g>

  <!-- Labels: start/end -->
  <g filter="url(#rough2)" font-size="9" fill="#888">
    <text x="64" y="52" text-anchor="middle">终点</text>
    <text x="64" y="362" text-anchor="middle">起点</text>
  </g>

  <!-- ===== Formula box ===== -->
  <g filter="url(#rough2)">
    <rect x="372" y="58" width="388" height="312" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="566" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">坐标转换：方格号 s → (r, c)</text>

  <g font-size="11" fill="#444" font-family="monospace" filter="url(#rough2)">
    <text x="388" y="108">给定方格编号 s（1-indexed）：</text>
    <text x="388" y="130">idx = s − 1            // 0-indexed</text>
    <text x="388" y="148">row = idx / n          // 从底往上数</text>
    <text x="388" y="166">r   = n − 1 − row      // 矩阵行号</text>
    <text x="388" y="184">c   = idx % n</text>
    <text x="388" y="202">if row % 2 == 1:</text>
    <text x="388" y="220">    c = n − 1 − c      // 奇数行反向</text>
  </g>

  <g filter="url(#rough2)">
    <text x="388" y="246" font-size="11" font-weight="bold" fill="#333">验证（n=6）：</text>
  </g>
  <g font-size="10" fill="#444" font-family="monospace" filter="url(#rough2)">
    <text x="388" y="266">s=1  → row=0, r=5, c=0  ✓ 左下角</text>
    <text x="388" y="282">s=2  → row=0, r=5, c=1  → board[5][1]=15</text>
    <text x="388" y="298">s=7  → row=1, r=4, c=5  ✓ 右端</text>
    <text x="388" y="314">s=14 → row=2, r=3, c=1  → board[3][1]=35</text>
    <text x="388" y="330">s=17 → row=2, r=3, c=4  → board[3][4]=13</text>
    <text x="388" y="346">s=36 → row=5, r=0, c=0  ✓ 右上角</text>
  </g>

  <!-- Legend -->
  <g filter="url(#rough2)" font-size="9" fill="#666">
    <rect x="40" y="380" width="14" height="14" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="60" y="391">起点/终点</text>
    <rect x="130" y="380" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2"/>
    <text x="150" y="391">梯子</text>
    <rect x="200" y="380" width="14" height="14" fill="#fce4ec" stroke="#b85450" rx="2"/>
    <text x="220" y="391">蛇</text>
    <rect x="260" y="380" width="14" height="14" fill="#e8f0fe" stroke="#446688" rx="2"/>
    <text x="280" y="391">普通方格</text>
  </g>
</svg>
