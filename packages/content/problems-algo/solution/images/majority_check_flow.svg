<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：二分定位 + 单点验证</text>

  <!-- Step 1 -->
  <rect x="60" y="50" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① lower_bound(target) → first</text>

  <path d="M 160 88 L 160 110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1 -->
  <polygon points="160,114 250,154 160,194 70,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">first == n 或</text>
  <text x="160" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[first] != target ?</text>

  <!-- yes branch -->
  <path d="M 70 154 L 40 154 L 40 250" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="46" y="148" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="20" y="252" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="65" y="272" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return false</text>

  <!-- no branch -->
  <path d="M 250 154 L 300 154 L 300 200" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="148" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- Step 2 -->
  <rect x="200" y="202" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② check = first + n / 2</text>

  <path d="M 300 240 L 300 262" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2 -->
  <polygon points="300,266 400,306 300,346 200,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">check &lt; n 且</text>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums[check]==target?</text>

  <!-- yes -->
  <path d="M 400 306 L 460 306 L 460 250" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="424" y="300" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="415" y="218" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="465" y="239" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">return true</text>

  <!-- no -->
  <path d="M 200 306 L 150 306 L 150 250" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="166" y="300" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="105" y="218" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="239" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return false</text>

  <!-- footer note -->
  <rect x="100" y="370" width="360" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">仅一次二分 + 一次下标比较，O(log n)</text>
</svg>
