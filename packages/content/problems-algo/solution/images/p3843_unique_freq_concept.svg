<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：值 → 频率 → 频率的频率，两次计数接力</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">频率唯一 ⟺ 拥有该频率的不同值恰为 1 个 ⟺ freqCount[ freq[x] ] == 1</text>

  <!-- nums row -->
  <text x="84" y="56" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">示例 1：nums = [20, 10, 30, 30]</text>

  <rect x="84" y="62" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">20</text>
  <rect x="148" y="62" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="212" y="62" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">30</text>
  <rect x="276" y="62" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="302" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">30</text>

  <text x="110" y="103" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="174" y="103" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="238" y="103" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="302" y="103" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>

  <!-- pass 1 arrow -->
  <path d="M 150 108 L 150 120" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="162" y="118" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">第一趟（扫 nums）：数出现次数 → freq</text>

  <!-- freq row: mini tables -->
  <text x="76" y="144" text-anchor="end" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">freq</text>

  <rect x="84" y="124" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <rect x="120" y="124" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="164" y="124" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="200" y="124" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="244" y="124" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">30</text>
  <rect x="280" y="124" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <text x="340" y="144" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">值 → 出现次数</text>

  <!-- pass 2 arrow -->
  <path d="M 150 158 L 150 170" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="162" y="168" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">第二趟（遍历 freq）：对「频率」再计数 → freqCount</text>

  <!-- freqCount row -->
  <text x="76" y="204" text-anchor="end" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">freqCount</text>

  <rect x="84" y="184" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="184" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="164" y="184" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="184" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="252" y="198" text-anchor="start" font-size="8.5" fill="#888" filter="url(#rough2)">频率 1 被 2 个值拥有（20、10）</text>
  <text x="252" y="212" text-anchor="start" font-size="8.5" fill="#888" filter="url(#rough2)">频率 2 仅 30 独享</text>

  <!-- pass 3: judgments -->
  <path d="M 150 218 L 150 230" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="162" y="228" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">第三趟（按 nums 原序）：查 freqCount[ freq[x] ]</text>

  <rect x="22" y="236" width="142" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">20 → ✗</text>
  <text x="93" y="266" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">freqCount[1] = 2（与 10 同频）</text>

  <path d="M 164 255 L 189 255" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="176" y="247" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">连坐</text>

  <rect x="189" y="236" width="142" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 → ✗</text>
  <text x="260" y="266" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">freqCount[1] = 2</text>

  <rect x="356" y="236" width="142" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="427" y="252" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">30 → ✓</text>
  <text x="427" y="266" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">freqCount[2] = 1，孤频自证</text>

  <!-- bottom notes -->
  <rect x="22" y="288" width="476" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">判定改述：x 的频率唯一 ⟺ 拥有 freq[x] 的不同值恰为 1 个——一次查表，无需逐对比较</text>
  <text x="260" y="326" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">同频者「连坐」：20 与 10 同查 freqCount[1] = 2，一次双双否决；30 查 freqCount[2] = 1 命中</text>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第三趟按 nums 原序扫 → 第一个 ✓ 的 30 即答案 ✓</text>
</svg>
