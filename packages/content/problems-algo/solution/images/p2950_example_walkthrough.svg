<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：word = "asdf" 的全部 10 个子串</text>
  <rect x="40" y="50" width="490" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="69" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">子串</text>
  <text x="200" y="69" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">映射值</text>
  <text x="305" y="69" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">和</text>
  <text x="395" y="69" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">长度</text>
  <text x="483" y="69" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">整除？</text>
  <rect x="40" y="78" width="490" height="28" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="97" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"a"</text>
  <text x="200" y="97" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="305" y="97" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="395" y="97" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="483" y="97" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="40" y="106" width="490" height="28" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="125" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"s"</text>
  <text x="200" y="125" text-anchor="middle" font-size="12.5" fill="#333">7</text>
  <text x="305" y="125" text-anchor="middle" font-size="12.5" fill="#333">7</text>
  <text x="395" y="125" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="483" y="125" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="40" y="134" width="490" height="28" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="153" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"d"</text>
  <text x="200" y="153" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="305" y="153" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="395" y="153" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="483" y="153" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="40" y="162" width="490" height="28" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="181" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"f"</text>
  <text x="200" y="181" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="305" y="181" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="395" y="181" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="483" y="181" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="40" y="190" width="490" height="28" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="209" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"as"</text>
  <text x="200" y="209" text-anchor="middle" font-size="12.5" fill="#333">1, 7</text>
  <text x="305" y="209" text-anchor="middle" font-size="12.5" fill="#333">8</text>
  <text x="395" y="209" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="483" y="209" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="40" y="218" width="490" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="237" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"sd"</text>
  <text x="200" y="237" text-anchor="middle" font-size="12.5" fill="#333">7, 2</text>
  <text x="305" y="237" text-anchor="middle" font-size="12.5" fill="#333">9</text>
  <text x="395" y="237" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="483" y="237" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="40" y="246" width="490" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="265" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"df"</text>
  <text x="200" y="265" text-anchor="middle" font-size="12.5" fill="#333">2, 3</text>
  <text x="305" y="265" text-anchor="middle" font-size="12.5" fill="#333">5</text>
  <text x="395" y="265" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="483" y="265" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="40" y="274" width="490" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="293" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"asd"</text>
  <text x="200" y="293" text-anchor="middle" font-size="12.5" fill="#333">1, 7, 2</text>
  <text x="305" y="293" text-anchor="middle" font-size="12.5" fill="#333">10</text>
  <text x="395" y="293" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="483" y="293" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="40" y="302" width="490" height="28" fill="#e6f4ea" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="321" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"sdf"</text>
  <text x="200" y="321" text-anchor="middle" font-size="12.5" fill="#333">7, 2, 3</text>
  <text x="305" y="321" text-anchor="middle" font-size="12.5" fill="#333">12</text>
  <text x="395" y="321" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="483" y="321" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="40" y="330" width="490" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="349" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">"asdf"</text>
  <text x="200" y="349" text-anchor="middle" font-size="12.5" fill="#333">1, 7, 2, 3</text>
  <text x="305" y="349" text-anchor="middle" font-size="12.5" fill="#333">13</text>
  <text x="395" y="349" text-anchor="middle" font-size="12.5" fill="#333">4</text>
  <text x="483" y="349" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">✗</text>
  <text x="280" y="384" text-anchor="middle" font-size="13" fill="#333">合计 <tspan fill="#4a7a3a" font-weight="bold">6</tspan> 个可整分子串：a、s、d、f、as、sdf（与官方输出一致）</text>
</svg>