<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心思路：长度不定 ⇒ 按长度 k 分层，每层定长滑窗</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">nums = [3, −2, 1, 4]，l = 2，r = 3 —— 合法长度 k 只能取 2 或 3</text>

  <!-- 原数组 -->
  <rect x="140" y="54" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="77" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="192" y="54" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="77" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">−2</text>
  <rect x="244" y="54" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="77" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="296" y="54" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="77" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="166" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="218" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="322" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>

  <!-- k = 2 层 -->
  <text x="40" y="141" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">k = 2 层（3 个窗口）</text>

  <rect x="90" y="150" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="169" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">3</text>
  <rect x="130" y="150" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="150" y="169" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">−2</text>

  <path d="M 176 164 L 204 164" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="190" y="154" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">滑一步</text>

  <rect x="210" y="150" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="230" y="169" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">−2</text>
  <rect x="250" y="150" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="270" y="169" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">1</text>

  <path d="M 296 164 L 324 164" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="310" y="154" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">滑一步</text>

  <rect x="330" y="150" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="169" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="370" y="150" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="390" y="169" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">4</text>

  <text x="130" y="200" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sum = 1 ✓</text>
  <text x="250" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">sum = −1 ✗</text>
  <text x="370" y="200" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sum = 5 ✓</text>

  <!-- k = 3 层 -->
  <text x="40" y="235" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">k = 3 层（2 个窗口）</text>

  <rect x="120" y="244" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="140" y="263" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="160" y="244" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="180" y="263" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">−2</text>
  <rect x="200" y="244" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="220" y="263" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>

  <path d="M 246 258 L 274 258" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">滑一步</text>

  <rect x="280" y="244" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="300" y="263" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">−2</text>
  <rect x="320" y="244" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="340" y="263" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="360" y="244" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="380" y="263" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">4</text>

  <text x="180" y="294" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sum = 2 ✓</text>
  <text x="340" y="294" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sum = 3 ✓</text>

  <!-- 底部结论 -->
  <rect x="20" y="312" width="480" height="80" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="333" font-size="9.5" fill="#333" font-weight="bold" filter="url(#rough2)">为什么不套 209 的不定长双指针？nums 含负数：</text>
  <text x="34" y="350" font-size="9.5" fill="#333" filter="url(#rough2)">右扩一步和可能变小、左缩一步和可能变大，窗口和没有单调性，「和 &gt; 0」无法指导指针收缩。</text>
  <text x="34" y="367" font-size="9.5" fill="#333" filter="url(#rough2)">改按 k = l…r 分层：层内窗口定长，滑一步 O(1)（进一格、出一格），负数再多也不怕。</text>
  <text x="34" y="384" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">两层全部正和取 min ⇒ ans = 1（来自窗口 [3, −2]）。</text>
</svg>
