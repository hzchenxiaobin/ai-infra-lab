<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[4, 6, 15, 35] → 全连通 → 最大分量 4</text>

  <!-- table header -->
  <rect x="24" y="46" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="49" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="74" y="46" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">数字</text>
  <rect x="134" y="46" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">质因子</text>
  <rect x="244" y="46" width="272" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">union 操作</text>

  <!-- row 1: 4 -->
  <rect x="24" y="72" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="49" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">①</text>
  <rect x="74" y="72" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="91" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="134" y="72" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="91" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <rect x="244" y="72" width="272" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="91" text-anchor="middle" font-size="11" fill="#333">union(4, 2)</text>

  <!-- row 2: 6 -->
  <rect x="24" y="100" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="49" y="119" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">②</text>
  <rect x="74" y="100" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="119" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="134" y="100" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="119" text-anchor="middle" font-size="11" fill="#333">{2, 3}</text>
  <rect x="244" y="100" width="272" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="119" text-anchor="middle" font-size="11" fill="#333">union(6, 2), union(6, 3)</text>

  <!-- row 3: 15 -->
  <rect x="24" y="128" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="49" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③</text>
  <rect x="74" y="128" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="147" text-anchor="middle" font-size="11" fill="#333">15</text>
  <rect x="134" y="128" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="147" text-anchor="middle" font-size="11" fill="#333">{3, 5}</text>
  <rect x="244" y="128" width="272" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="147" text-anchor="middle" font-size="11" fill="#333">union(15, 3), union(15, 5)</text>

  <!-- row 4: 35 -->
  <rect x="24" y="156" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="49" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④</text>
  <rect x="74" y="156" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="175" text-anchor="middle" font-size="11" fill="#333">35</text>
  <rect x="134" y="156" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="175" text-anchor="middle" font-size="11" fill="#333">{5, 7}</text>
  <rect x="244" y="156" width="272" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="175" text-anchor="middle" font-size="11" fill="#333">union(35, 5), union(35, 7)</text>

  <!-- connectivity chain -->
  <rect x="24" y="196" width="492" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="11" fill="#444">union 后：4 ~ 2 ~ 6 ~ 3 ~ 15 ~ 5 ~ 35 → 全部同根</text>

  <!-- result -->
  <rect x="24" y="240" width="492" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4 个数的 find() 均相同 → 1 个连通分量</text>
  <text x="270" y="276" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 4 ⭐</text>

  <!-- contrast note -->
  <rect x="24" y="292" width="492" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="10.5" fill="#446688">对比示例 2 [20,50,9,63]：20~50（共享 2,5）, 9~63（共享 3）→ 两个分量，答案 = 2</text>

  <!-- bottom note -->
  <rect x="60" y="336" width="420" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="353" text-anchor="middle" font-size="10.5" fill="#666">每个数与所有质因子 union，质因子充当桥节点</text>
</svg>
