<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：子串条件 → 前缀差分约束 → 双键配对计数</text>

  <rect x="38" y="48" width="234" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">条件① 平衡：v == c</text>
  <text x="155" y="94" text-anchor="middle" font-size="12" fill="#333">⟺ 2V(j)−j == 2V(i)−i</text>
  <text x="155" y="112" text-anchor="middle" font-size="12" fill="#446688">即 D(i) == D(j)，D(p) = 2V(p) − p</text>

  <rect x="288" y="48" width="234" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">条件② 整除：v² % k == 0</text>
  <text x="405" y="94" text-anchor="middle" font-size="12" fill="#333">⟺ m ∣ v ⟺ V(i) ≡ V(j) (mod m)</text>
  <text x="405" y="112" text-anchor="middle" font-size="12" fill="#446688">m = ∏ p^⌈e/2⌉（k 质因数分解）</text>

  <path d="M 155 122 L 210 148" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <path d="M 405 122 L 350 148" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="88" y="152" width="384" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">双键打包：key(p) = ( D(p), V(p) mod m )</text>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#446688">一个约束一维 —— 子串 (i, j] 美丽 ⟺ 两端同键</text>

  <path d="M 280 210 L 280 232" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <text x="70" y="258" font-size="12" fill="#555">位置：</text>
  <circle cx="130" cy="254" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="190" cy="254" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="250" cy="254" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="310" cy="254" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="370" cy="254" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="430" cy="254" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="130" y="259" text-anchor="middle" font-size="11" fill="#333">p₀</text>
  <text x="190" y="259" text-anchor="middle" font-size="11" fill="#333">p₁</text>
  <text x="250" y="259" text-anchor="middle" font-size="11" fill="#333">p₂</text>
  <text x="310" y="259" text-anchor="middle" font-size="11" fill="#333">p₃</text>
  <text x="370" y="259" text-anchor="middle" font-size="11" fill="#333">p₄</text>
  <text x="430" y="259" text-anchor="middle" font-size="11" fill="#333">p₅</text>

  <path d="M 144 262 L 296 262" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a">p₀ 与 p₄ 同键 → 配对 +1</text>

  <rect x="38" y="296" width="484" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">同键位置两两配对：ans = Σ key 内 C(cnt, 2)</text>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a">到达 p 先 ans += cnt[key] 再自增 —— 一趟扫描完成组合数求和</text>

  <text x="38" y="372" font-size="11" fill="#999">m 速查：k=1→1（平衡即美丽）｜k=2→2｜k=8=2³→4｜k=12=2²·3→6</text>
  <text x="38" y="392" font-size="11" fill="#b85450">⚠ 单键反例：只留 D 多算 "ba"（k=2, v=1）；只留 V mod m 多算 "ae"（不平衡）</text>
</svg>
