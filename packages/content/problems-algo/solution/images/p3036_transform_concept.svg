<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：相邻作差取符号，匹配问题变成经典字符串计数</text>

  <!-- nums row -->
  <text x="72" y="66" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="88" y="48" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="111" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="48" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="157" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="180" y="48" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="203" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="226" y="48" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="249" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="272" y="48" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="295" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="318" y="48" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="341" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="364" y="48" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="387" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="410" y="48" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="433" y="69" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- transform arrows between pairs -->
  <path d="M 111 88 L 111 132" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 157 88 L 157 132" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 203 88 L 203 132" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 249 88 L 249 132" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 295 88 L 295 132" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 341 88 L 341 132" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 387 88 L 387 132" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="452" y="96" width="94" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="499" y="115" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">sign(右−左)</text>

  <!-- b row -->
  <text x="72" y="164" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="88" y="148" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="111" y="169" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="134" y="148" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="157" y="169" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="180" y="148" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="203" y="169" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="226" y="148" width="46" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="249" y="169" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">+1</text>
  <rect x="272" y="148" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="295" y="169" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="318" y="148" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="341" y="169" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="364" y="148" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="387" y="169" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- highlight matched windows -->
  <rect x="85" y="145" width="144" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <rect x="269" y="145" width="144" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>

  <!-- pattern row -->
  <text x="72" y="216" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">pattern</text>
  <rect x="146" y="200" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="169" y="221" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="192" y="200" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="215" y="221" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="238" y="200" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="261" y="221" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <path d="M 310 216 L 356 216" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="430" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">在 b 中数出现次数</text>

  <!-- equivalence box -->
  <rect x="30" y="252" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">长 m+1 的 nums 子数组匹配 pattern ⇔ b 中长 m 的子串 == pattern</text>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = pattern 在 b 中的出现次数 → KMP / Z 函数，O(n + m)</text>

  <!-- note -->
  <rect x="30" y="322" width="500" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 具体数值不重要——单调性全被 sign 压缩成三符号字母表 {−1, 0, +1}；</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">绿框两个窗口分别对应 nums[0..3]=[1,4,4,1] 与 nums[4..7]=[3,5,5,3]，答案 2</text>
</svg>
