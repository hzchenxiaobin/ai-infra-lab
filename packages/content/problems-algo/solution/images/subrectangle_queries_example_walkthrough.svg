<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,8 L9,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：矩阵状态与查询结果</text>

  <!-- Matrix 1: initial -->
  <g filter="url(#rough2)">
    <rect x="220" y="50" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="260" y="50" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="300" y="50" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="220" y="74" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="260" y="74" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="300" y="74" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="220" y="98" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="260" y="98" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="300" y="98" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="220" y="122" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="260" y="122" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="300" y="122" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="240" y="67">1</text><text x="280" y="67">2</text><text x="320" y="67" fill="#b85450" font-weight="bold">1</text>
    <text x="240" y="91">4</text><text x="280" y="91">3</text><text x="320" y="91">4</text>
    <text x="240" y="115">3</text><text x="280" y="115">2</text><text x="320" y="115">1</text>
    <text x="240" y="139">1</text><text x="280" y="139" fill="#b85450" font-weight="bold">1</text><text x="320" y="139">1</text>
  </g>
  <text x="210" y="100" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 初始矩形</text>

  <!-- Arrow 1->2 -->
  <path d="M 280 152 L 280 168" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="350" y="164" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">update(0,0, 3,2, 5)</text>

  <!-- Matrix 2: all 5 -->
  <g filter="url(#rough2)">
    <rect x="220" y="170" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="260" y="170" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="300" y="170" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="220" y="194" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="260" y="194" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="300" y="194" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="220" y="218" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="260" y="218" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="300" y="218" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="220" y="242" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="260" y="242" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="300" y="242" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="240" y="187">5</text><text x="280" y="187">5</text><text x="320" y="187" fill="#b85450" font-weight="bold">5</text>
    <text x="240" y="211">5</text><text x="280" y="211">5</text><text x="320" y="211">5</text>
    <text x="240" y="235">5</text><text x="280" y="235">5</text><text x="320" y="235">5</text>
    <text x="240" y="259">5</text><text x="280" y="259" fill="#b85450" font-weight="bold">5</text><text x="320" y="259">5</text>
  </g>
  <text x="210" y="220" text-anchor="end" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 全图填 5</text>

  <!-- Arrow 2->3 -->
  <path d="M 280 272 L 280 288" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="350" y="284" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">update(3,0, 3,2, 10)</text>

  <!-- Matrix 3: row3 = 10 -->
  <g filter="url(#rough2)">
    <rect x="220" y="290" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="260" y="290" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="300" y="290" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="220" y="314" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="260" y="314" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="300" y="314" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="220" y="338" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="260" y="338" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="300" y="338" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="220" y="362" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <rect x="260" y="362" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="300" y="362" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="240" y="307">5</text><text x="280" y="307">5</text><text x="320" y="307" fill="#b85450" font-weight="bold">5</text>
    <text x="240" y="331">5</text><text x="280" y="331">5</text><text x="320" y="331">5</text>
    <text x="240" y="355">5</text><text x="280" y="355">5</text><text x="320" y="355">5</text>
    <text x="240" y="379">10</text><text x="280" y="379" fill="#b85450" font-weight="bold">10</text><text x="320" y="379">10</text>
  </g>
  <text x="210" y="340" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 第 3 行填 10</text>

  <!-- Right annotations -->
  <rect x="420" y="56" width="128" height="22" fill="#f8f8f8" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="484" y="71" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">getValue(0,2) = 1</text>

  <rect x="420" y="178" width="128" height="22" fill="#f8f8f8" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="484" y="193" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">getValue(0,2) = 5</text>
  <rect x="420" y="204" width="128" height="22" fill="#f8f8f8" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="484" y="219" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">getValue(3,1) = 5</text>

  <rect x="420" y="300" width="128" height="22" fill="#f8f8f8" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="484" y="315" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">getValue(3,1) = 10</text>
  <rect x="420" y="326" width="128" height="22" fill="#f8f8f8" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="484" y="341" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">getValue(0,2) = 5</text>
</svg>
