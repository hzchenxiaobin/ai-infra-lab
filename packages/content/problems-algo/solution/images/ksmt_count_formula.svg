<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">逐行计数：第 i 行元素为 i, 2i, 3i, …, n·i，≤ x 的个数 = min(⌊x/i⌋, n)</text>

  <text x="40" y="52" font-size="12" fill="#888">以 m=3, n=3, x=4 为例：高亮单元格 ≤ 4</text>

  <!-- ===== Row 1: i=1, elements 1,2,3 ; floor(4/1)=4, min(4,3)=3 ===== -->
  <text x="44" y="92" font-size="11" fill="#999">i=1</text>
  <rect x="70" y="74" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="116" y="74" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="162" y="74" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- formula box row1 -->
  <rect x="230" y="74" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="355" y="94" text-anchor="middle" font-size="11" fill="#333">⌊4/1⌋ = 4 → min(4, 3) = </text>
  <text x="466" y="94" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- ===== Row 2: i=2, elements 2,4,6 ; floor(4/2)=2, min(2,3)=2 ===== -->
  <text x="44" y="138" font-size="11" fill="#999">i=2</text>
  <rect x="70" y="120" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="116" y="120" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="162" y="120" width="46" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="185" y="140" text-anchor="middle" font-size="12" fill="#888">6</text>
  <rect x="230" y="120" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="355" y="140" text-anchor="middle" font-size="11" fill="#333">⌊4/2⌋ = 2 → min(2, 3) = </text>
  <text x="466" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Row 3: i=3, elements 3,6,9 ; floor(4/3)=1, min(1,3)=1 ===== -->
  <text x="44" y="184" font-size="11" fill="#999">i=3</text>
  <rect x="70" y="166" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="116" y="166" width="46" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="139" y="186" text-anchor="middle" font-size="12" fill="#888">6</text>
  <rect x="162" y="166" width="46" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="185" y="186" text-anchor="middle" font-size="12" fill="#888">9</text>
  <rect x="230" y="166" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="355" y="186" text-anchor="middle" font-size="11" fill="#333">⌊4/3⌋ = 1 → min(1, 3) = </text>
  <text x="466" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- arrow down to total -->
  <path d="M 355 214 L 355 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- total -->
  <rect x="150" y="236" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="261" text-anchor="middle" font-size="13" fill="#333">count(4) = 3 + 2 + 1 = </text>
  <text x="430" y="261" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>

  <!-- explanation: why floor(x/i) -->
  <rect x="40" y="300" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#333">第 i 行是 i 的倍数列：i, 2i, …, n·i</text>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#333">要 i·j ≤ x ⇔ j ≤ ⌊x/i⌋；但 j 至多为 n ⇒ 实际个数 = min(⌊x/i⌋, n)</text>

  <!-- complexity note -->
  <rect x="40" y="372" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#b85450">每行 O(1) 计算（整除 + min），m 行共 O(m) 验证一次 count(x)</text>
</svg>
