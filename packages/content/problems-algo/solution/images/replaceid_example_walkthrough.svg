<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐行扫描 Employees，匹配 EmployeeUNI</text>

  <!-- Header row -->
  <rect x="20" y="50" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="69" font-size="10" fill="#333" font-weight="bold">步骤</text>
  <text x="95" y="69" font-size="10" fill="#333" font-weight="bold">员工 (id, name)</text>
  <text x="250" y="69" font-size="10" fill="#333" font-weight="bold">EmployeeUNI 匹配?</text>
  <text x="430" y="69" font-size="10" fill="#333" font-weight="bold">输出行</text>
  <line x1="85" y1="50" x2="85" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="50" x2="240" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="415" y1="50" x2="415" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Step 1: Alice -->
  <rect x="20" y="80" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="40" y="98" font-size="10" fill="#333">1</text>
  <text x="95" y="98" font-size="10" fill="#333">id=1, Alice</text>
  <text x="250" y="98" font-size="10" fill="#b85450" font-weight="bold">✗ 无 id=1</text>
  <text x="430" y="98" font-size="10" fill="#b85450" font-weight="bold">(null, Alice)</text>
  <line x1="85" y1="80" x2="85" y2="108" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="80" x2="240" y2="108" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="415" y1="80" x2="415" y2="108" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Step 2: Bob -->
  <rect x="20" y="108" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="40" y="126" font-size="10" fill="#333">2</text>
  <text x="95" y="126" font-size="10" fill="#333">id=7, Bob</text>
  <text x="250" y="126" font-size="10" fill="#b85450" font-weight="bold">✗ 无 id=7</text>
  <text x="430" y="126" font-size="10" fill="#b85450" font-weight="bold">(null, Bob)</text>
  <line x1="85" y1="108" x2="85" y2="136" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="108" x2="240" y2="136" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="415" y1="108" x2="415" y2="136" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Step 3: Meir -->
  <rect x="20" y="136" width="540" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="154" font-size="10" fill="#333">3</text>
  <text x="95" y="154" font-size="10" fill="#333">id=11, Meir</text>
  <text x="250" y="154" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 命中 (11, 2)</text>
  <text x="430" y="154" font-size="10" fill="#333">(2, Meir)</text>
  <line x1="85" y1="136" x2="85" y2="164" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="136" x2="240" y2="164" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="415" y1="136" x2="415" y2="164" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Step 4: Winston -->
  <rect x="20" y="164" width="540" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="182" font-size="10" fill="#333">4</text>
  <text x="95" y="182" font-size="10" fill="#333">id=90, Winston</text>
  <text x="250" y="182" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 命中 (90, 3)</text>
  <text x="430" y="182" font-size="10" fill="#333">(3, Winston)</text>
  <line x1="85" y1="164" x2="85" y2="192" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="164" x2="240" y2="192" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="415" y1="164" x2="415" y2="192" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Step 5: Jonathan -->
  <rect x="20" y="192" width="540" height="28" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="210" font-size="10" fill="#333">5</text>
  <text x="95" y="210" font-size="10" fill="#333">id=3, Jonathan</text>
  <text x="250" y="210" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 命中 (3, 1)</text>
  <text x="430" y="210" font-size="10" fill="#333">(1, Jonathan)</text>
  <line x1="85" y1="192" x2="85" y2="220" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="192" x2="240" y2="220" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="415" y1="192" x2="415" y2="220" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Summary -->
  <rect x="20" y="220" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="239" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合计：5 行输出 = Employees 全部行数（2 行 null + 3 行命中）</text>

  <!-- Callouts -->
  <rect x="40" y="270" width="500" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="290" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键观察</text>
  <text x="290" y="308" text-anchor="middle" font-size="10" fill="#333">① 匹配是「按值」而非「按行号」——Jonathan 在 Employees 第 5 行却匹配 EmployeeUNI 第 1 行</text>
  <text x="290" y="324" text-anchor="middle" font-size="10" fill="#333">② 结果行数恒等于左表行数（一对一时），无匹配行贡献 1 行 null</text>

  <!-- Arrow from summary to callout -->
  <path d="M290 250 L290 270" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- One-to-one note -->
  <rect x="40" y="360" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">与 175 组合两个表 的区别</text>
  <text x="290" y="398" text-anchor="middle" font-size="10" fill="#333">175 是一对多（一人多地址 → 结果展开多行），1378 是一对一（一人至多一标识码）</text>
  <text x="290" y="414" text-anchor="middle" font-size="10" fill="#333">一对一时 LEFT JOIN 结果行数 = 左表行数，不会膨胀</text>
</svg>
