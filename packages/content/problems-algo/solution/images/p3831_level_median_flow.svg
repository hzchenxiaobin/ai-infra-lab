<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐层下探 level 次 → 判空 → 天然有序直接索引</text>
  <text x="260" y="35" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur/nxt 翻滚收集孩子——「先左后右」不是习惯，而是层内升序的正确性来源</text>

  <!-- Start box -->
  <rect x="168" y="44" width="224" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="10" fill="#223" font-weight="bold" filter="url(#rough2)">开始：cur = [root]（第 0 层），d = 0</text>

  <path d="M 280 74 L 280 88" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- Diamond 1: cur empty? -->
  <polygon points="228,118 280,92 332,118 280,144" fill="#fff" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cur 为空？</text>

  <!-- yes branch -> -1 -->
  <path d="M 332 118 L 396 118" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="358" y="111" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="102" width="100" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="122" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 -1</text>
  <text x="450" y="148" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（level 超过树高）</text>

  <!-- no branch -->
  <path d="M 280 144 L 280 158" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="291" y="156" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Diamond 2: d == level? -->
  <polygon points="222,192 280,163 338,192 280,221" fill="#fff" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">d == level？</text>

  <!-- yes branch -> median -->
  <path d="M 338 192 L 384 192" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="354" y="185" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="388" y="174" width="122" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="449" y="190" text-anchor="middle" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">返回 cur[k/2]-&gt;val</text>
  <text x="449" y="205" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">上中位数，免排序</text>

  <!-- no branch -->
  <path d="M 280 221 L 280 236" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="291" y="233" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Process box -->
  <rect x="168" y="238" width="224" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cur ← 收集 cur 中节点的孩子（先左后右）</text>
  <text x="280" y="273" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">d ← d + 1</text>

  <!-- loop back -->
  <path d="M 168 260 L 132 260 L 132 118 L 222 118" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="124" y="192" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">下一层</text>

  <!-- Bottom note -->
  <rect x="48" y="300" width="424" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">循环至多执行 min(level, 树高 + 1) 次：cur 变空提前判死，与 level 大小解耦</text>
  <text x="260" y="335" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">时间 O(n)（只碰前 level 层），空间 O(w)（相邻两层翻滚）</text>
  <text x="260" y="351" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">若不放心 BST 性质：收集后 sort 再取 k/2，一步退回暴力版</text>
</svg>
