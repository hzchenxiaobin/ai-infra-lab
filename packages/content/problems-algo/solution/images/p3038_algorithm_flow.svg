<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：首对定锚 → 逐对校验 → 不匹配即返回</text>

  <!-- start -->
  <rect x="222" y="40" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 70 L 260 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init box -->
  <rect x="150" y="88" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s ← nums[0] + nums[1]</text>
  <text x="260" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans ← 1，i ← 2</text>

  <path d="M 260 132 L 260 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="260,148 352,182 260,216 168,182" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i + 1 &lt; n ?</text>

  <!-- no branch to return -->
  <path d="M 352 182 L 400 182" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="374" y="174" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- yes branch down -->
  <path d="M 260 216 L 260 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="228" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- diamond 2 -->
  <polygon points="260,234 368,274 260,314 152,274" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i] + nums[i+1]</text>
  <text x="260" y="287" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">== s ?</text>

  <!-- no branch: fold right and up into return box -->
  <path d="M 368 274 L 452 274 L 452 202" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="266" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- yes branch down -->
  <path d="M 260 314 L 260 330" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="326" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- ans++ box -->
  <rect x="200" y="334" width="120" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans ← ans + 1</text>
  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i ← i + 2</text>

  <!-- loop back to diamond 1 -->
  <path d="M 200 355 L 112 355 L 112 182 L 162 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="112" y="270" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">下一对</text>

  <!-- return box -->
  <rect x="402" y="164" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="452" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- bottom note -->
  <rect x="48" y="388" width="424" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">条件 i + 1 &lt; n 一个判断拦住两种终点：恰好删完（剩 0 个）</text>
  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⇔ 奇数长度删到只剩 1 个落单元素 —— 无需对奇偶分别讨论。</text>
</svg>
