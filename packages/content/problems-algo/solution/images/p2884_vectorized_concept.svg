<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">salary 列整体 ×2：一次广播 + 整列回写</text>

  <!-- Left table: before -->
  <rect x="28" y="58" width="172" height="228" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="114" y="80" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">employees（改前）</text>

  <rect x="40" y="92" width="84" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="82" y="109" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="126" y="92" width="64" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="158" y="109" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">salary</text>

  <rect x="40" y="118" width="84" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="82" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Jack</text>
  <rect x="126" y="118" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="158" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">19666</text>

  <rect x="40" y="148" width="84" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="82" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Piper</text>
  <rect x="126" y="148" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="158" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">74754</text>

  <rect x="40" y="178" width="84" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="82" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Mia</text>
  <rect x="126" y="178" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="158" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">62509</text>

  <rect x="40" y="208" width="84" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="82" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ulysses</text>
  <rect x="126" y="208" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="158" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">54866</text>

  <text x="114" y="260" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">salary：int64 连续数据块</text>

  <!-- Middle: ×2 broadcast -->
  <path d="M 202 152 L 222 152" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="228" y="118" width="106" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="281" y="146" text-anchor="middle" font-size="18" fill="#d6a040" filter="url(#rough2)">× 2</text>
  <text x="281" y="166" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">向量化广播</text>
  <path d="M 338 152 L 358 152" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="212" y="106" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">① 取列</text>
  <text x="281" y="200" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">② 标量广播到每个元素</text>
  <text x="348" y="106" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">③ 回写</text>

  <text x="281" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">df['salary'] = 新 Series（整列替换）</text>
  <text x="281" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">底层 C 一趟算完，无 Python 循环</text>

  <!-- Right table: after -->
  <rect x="360" y="58" width="172" height="228" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="446" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">employees（改后）</text>

  <rect x="372" y="92" width="84" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="414" y="109" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="458" y="92" width="64" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="109" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">salary</text>

  <rect x="372" y="118" width="84" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="414" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Jack</text>
  <rect x="458" y="118" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="137" text-anchor="middle" font-size="11" fill="#b3801f" filter="url(#rough2)">39332</text>

  <rect x="372" y="148" width="84" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="414" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Piper</text>
  <rect x="458" y="148" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="167" text-anchor="middle" font-size="11" fill="#b3801f" filter="url(#rough2)">149508</text>

  <rect x="372" y="178" width="84" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="414" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Mia</text>
  <rect x="458" y="178" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="197" text-anchor="middle" font-size="11" fill="#b3801f" filter="url(#rough2)">125018</text>

  <rect x="372" y="208" width="84" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="414" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ulysses</text>
  <rect x="458" y="208" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="227" text-anchor="middle" font-size="11" fill="#b3801f" filter="url(#rough2)">109732</text>

  <text x="446" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">name 列与行索引原样不动</text>

  <!-- Bottom warning -->
  <rect x="48" y="306" width="464" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 最大的坑：忘了赋值</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">只写 employees['salary'] * 2 → 求出新 Series 随即丢弃</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">原表纹丝不动，必须 df['salary'] = ... 整列写回</text>
</svg>
