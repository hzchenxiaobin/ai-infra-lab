<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：水平边 = 同 y 点对，两条水平线上各取 2 点恰成一个梯形</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1：y=0 上 3 个点、y=2 上 2 个点 → C(3,2) × C(2,2) = 3 × 1 = 3 个水平梯形</text>

  <!-- ============ 左侧坐标系（示例 1） ============ -->
  <g filter="url(#rough2)">
    <!-- 坐标轴 -->
    <line x1="62" y1="258" x2="304" y2="258" stroke="#999" stroke-width="1.5" marker-end="url(#axis)"/>
    <line x1="86" y1="290" x2="86" y2="92" stroke="#999" stroke-width="1.5" marker-end="url(#axis)"/>
    <text x="300" y="274" font-size="10" fill="#777">x</text>
    <text x="76" y="100" font-size="10" fill="#777">y</text>
    <text x="74" y="262" font-size="9.5" fill="#777">0</text>
    <text x="74" y="138" font-size="9.5" fill="#777">2</text>
    <text x="132" y="274" font-size="9.5" fill="#777">1</text>
    <text x="182" y="274" font-size="9.5" fill="#777">2</text>
    <text x="232" y="274" font-size="9.5" fill="#777">3</text>

    <!-- 两条水平参考线 -->
    <line x1="98" y1="258" x2="276" y2="258" stroke="#446688" stroke-width="2"/>
    <line x1="98" y1="134" x2="276" y2="134" stroke="#4a7a3a" stroke-width="2"/>

    <!-- 选出的一个梯形（橙色阴影） -->
    <polygon points="136,258 236,258 236,134 186,134" fill="#fff8e1" fill-opacity="0.9"
             stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="186" y="244" text-anchor="middle" font-size="9" fill="#8a6d1f">底边：y=0 上取 2 点</text>
    <text x="211" y="152" text-anchor="middle" font-size="9" fill="#8a6d1f">顶边：y=2 上取 2 点</text>

    <!-- 数据点 -->
    <circle cx="136" cy="258" r="5.5" fill="#446688" stroke="#fff" stroke-width="1.2"/>
    <circle cx="186" cy="258" r="5.5" fill="#446688" stroke="#fff" stroke-width="1.2"/>
    <circle cx="236" cy="258" r="5.5" fill="#446688" stroke="#fff" stroke-width="1.2"/>
    <circle cx="186" cy="134" r="5.5" fill="#4a7a3a" stroke="#fff" stroke-width="1.2"/>
    <circle cx="236" cy="134" r="5.5" fill="#4a7a3a" stroke="#fff" stroke-width="1.2"/>
  </g>

  <!-- 分组标签（图下方） -->
  <text x="98" y="302" font-size="10" fill="#446688" filter="url(#rough2)">y = 0：3 个点 → C(3,2) = 3 条水平边</text>
  <text x="98" y="320" font-size="10" fill="#4a7a3a" filter="url(#rough2)">y = 2：2 个点 → C(2,2) = 1 条水平边</text>

  <!-- ============ 右侧计数面板 ============ -->
  <text x="418" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">计数拆解（示例 1）</text>

  <g filter="url(#rough2)">
    <rect x="336" y="78" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="358" y="90" font-size="10.5" fill="#33455e">y=0 → c=3 → t=3</text>

    <rect x="336" y="102" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="358" y="114" font-size="10.5" fill="#33455e">y=2 → c=2 → t=1</text>

    <rect x="336" y="130" width="164" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="418" y="147" text-anchor="middle" font-size="11" fill="#33455e" font-weight="bold">ans = 3 × 1 = 3 ✓</text>

    <rect x="336" y="170" width="164" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="418" y="190" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">通用公式</text>
    <text x="418" y="209" text-anchor="middle" font-size="11" fill="#2a5a2a">ans = Σ tᵢ·tⱼ （i &lt; j）</text>

    <rect x="336" y="234" width="164" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="418" y="254" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">O(n) 实现：前缀和</text>
    <text x="418" y="272" text-anchor="middle" font-size="9.5" fill="#33455e">遍历每组：ans += t × pre</text>
    <text x="418" y="288" text-anchor="middle" font-size="9.5" fill="#33455e">pre += t（省掉 O(G²) 配对）</text>
  </g>

  <!-- ============ 底部要点提示 ============ -->
  <g filter="url(#rough2)">
    <rect x="30" y="334" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="260" y="354" text-anchor="middle" font-size="9.5" fill="#8a3a36">⚠️ 构不成梯形的分布：4 点同 y（共线退化）、3+1（至多一条水平边）——只有 2+2 可以</text>
    <text x="260" y="376" text-anchor="middle" font-size="9.5" fill="#33455e">💡 2+2 必然合法：无三点共线 ⇒ 四点全是凸包顶点，两条水平段恰为一组对边；x 坐标完全不影响计数</text>
  </g>
</svg>
