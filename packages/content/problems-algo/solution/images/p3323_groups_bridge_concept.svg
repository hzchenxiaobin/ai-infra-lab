<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：先并成组，一条桥只能把「压到的连续几组」并成一组</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以示例 1 为例：区间 [1,3]、[5,6]、[8,10]，k = 3</text>

  <!-- ============ 面板 ①：排序 + 合并 ============ -->
  <text x="24" y="64" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序 + 合并：重叠（含端点相接）的并成一组 → m = 3 个互不相交、从左到右的组</text>

  <!-- 数轴 -->
  <path d="M 45 112 L 474 112" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 55 108 L 55 116 M 145 108 L 145 116 M 235 108 L 235 116 M 280 108 L 280 116 M 370 108 L 370 116 M 460 108 L 460 116" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="130" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">s₁=1</text>
  <text x="145" y="130" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">e₁=3</text>
  <text x="235" y="130" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">s₂=5</text>
  <text x="280" y="130" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">e₂=6</text>
  <text x="370" y="130" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">s₃=8</text>
  <text x="460" y="130" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">e₃=10</text>

  <!-- 三个组 -->
  <rect x="55" y="84" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="235" y="84" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="370" y="84" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="101" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">组1 [1,3]</text>
  <text x="257" y="101" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">组2</text>
  <text x="415" y="101" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">组3 [8,10]</text>

  <text x="260" y="150" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">不插桥时，连通组数 = m（本题组间空隙 2、2，互不连通）</text>

  <!-- ============ 面板 ②：插桥 ============ -->
  <text x="24" y="172" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 插一条定长桥：锚定 x = e₁ = 3 贴住组 1 右端，右端伸到 e₁ + k = 6</text>

  <!-- 数轴 -->
  <path d="M 45 248 L 474 248" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 55 244 L 55 252 M 145 244 L 145 252 M 235 244 L 235 252 M 280 244 L 280 252 M 370 244 L 370 252 M 460 244 L 460 252" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="266" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="145" y="266" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="235" y="266" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">5</text>
  <text x="280" y="266" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">6</text>
  <text x="370" y="266" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">8</text>
  <text x="460" y="266" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">10</text>

  <!-- 三个组（淡） -->
  <rect x="55" y="220" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="235" y="220" width="45" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="370" y="220" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- 桥 [3,6] -->
  <rect x="145" y="194" width="135" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">桥 [3, 6]</text>
  <circle cx="145" cy="248" r="3" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 145 187 L 145 190" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="118" y="182" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">锚点 x = e₁ = 3</text>
  <path d="M 280 252 L 280 262" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="308" y="182" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">右端 = e₁ + k = 6</text>

  <!-- 判定标注 -->
  <text x="257" y="282" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">s₂=5 ≤ 6 ✓ 压到</text>
  <text x="415" y="282" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">s₃=8 &gt; 6 ✗ 够不着</text>

  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">结果：组1 + 桥 + 组2 → 并成一组；组3 独立 ⇒ 连通组 3 → 2</text>

  <!-- ============ 底部结论框 ============ -->
  <rect x="20" y="314" width="480" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">连续性引理：桥碰到组 i 与组 j ⇒ 中间所有组都被压到（收益只作用于连续一段）</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">桥接条件：sⱼ ≤ eᵢ + k（锚定 x = eᵢ 时右端伸得最远）</text>
  <text x="260" y="370" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">ans = m − max(j(i) − i)；j(i) ≥ i 恒成立 ⇒ 「插了白插」答案也是 m</text>
</svg>
