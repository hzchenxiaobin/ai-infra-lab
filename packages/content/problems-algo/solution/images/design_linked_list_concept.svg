<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="940" height="540" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">设计链表：双向链表 + 哑哨兵</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="68" text-anchor="middle" font-size="12" fill="#666">head / tail 两个哨兵节点不存数据、永远存在 → 所有插删都是「在两个真实节点之间拼接」</text>

  <!-- ===== 结构：带哨兵的双向链表 ===== -->
  <text x="70" y="108" font-size="13" font-weight="bold" fill="#2e6e2e">结构：head ↔ ...数据节点... ↔ tail</text>

  <!-- 节点：head(dummy) - 1 - 2 - 3 - tail(dummy) -->
  <!-- 每个节点：prev小格 | val格 | next小格，宽 110 -->
  <g filter="url(#sk2)">
    <!-- head dummy -->
    <rect x="50" y="124" width="30" height="40" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="80" y="124" width="50" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="130" y="124" width="30" height="40" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <!-- node 1 -->
    <rect x="200" y="124" width="30" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="230" y="124" width="50" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="280" y="124" width="30" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <!-- node 2 -->
    <rect x="350" y="124" width="30" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="380" y="124" width="50" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="430" y="124" width="30" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <!-- node 3 -->
    <rect x="500" y="124" width="30" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="530" y="124" width="50" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="580" y="124" width="30" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <!-- tail dummy -->
    <rect x="650" y="124" width="30" height="40" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="680" y="124" width="50" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="730" y="124" width="30" height="40" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>

  <!-- 节点内文字 -->
  <text x="105" y="149" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">head</text>
  <text x="255" y="149" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="405" y="149" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="555" y="149" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="705" y="149" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">tail</text>

  <text x="65" y="149" text-anchor="middle" font-size="9" fill="#7a5415">p</text>
  <text x="145" y="149" text-anchor="middle" font-size="9" fill="#7a5415">n</text>
  <text x="215" y="149" text-anchor="middle" font-size="9" fill="#446688">p</text>
  <text x="295" y="149" text-anchor="middle" font-size="9" fill="#446688">n</text>
  <text x="365" y="149" text-anchor="middle" font-size="9" fill="#446688">p</text>
  <text x="445" y="149" text-anchor="middle" font-size="9" fill="#446688">n</text>
  <text x="515" y="149" text-anchor="middle" font-size="9" fill="#446688">p</text>
  <text x="595" y="149" text-anchor="middle" font-size="9" fill="#446688">n</text>
  <text x="665" y="149" text-anchor="middle" font-size="9" fill="#7a5415">p</text>
  <text x="745" y="149" text-anchor="middle" font-size="9" fill="#7a5415">n</text>

  <!-- 双向箭头：prev(←) 和 next(→) -->
  <g filter="url(#sk2)">
    <path d="M 160 138 L 200 138" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)"/>
    <path d="M 200 150 L 160 150" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)"/>
    <path d="M 310 138 L 350 138" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)"/>
    <path d="M 350 150 L 310 150" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)"/>
    <path d="M 460 138 L 500 138" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)"/>
    <path d="M 500 150 L 460 150" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)"/>
    <path d="M 610 138 L 650 138" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)"/>
    <path d="M 650 150 L 610 150" stroke="#446688" stroke-width="1.4" marker-end="url(#arB)"/>
  </g>
  <text x="810" y="149" font-size="11" fill="#666">p=prev  n=next</text>

  <!-- ===== 拼接操作：addAtHead(9) ===== -->
  <text x="70" y="208" font-size="13" font-weight="bold" fill="#2b6e9e">核心动作：在 head 与 1 之间拼接新节点 9（addAtHead 的本质）</text>

  <!-- 拼接前：head 和 1，中间留空给 9 -->
  <g filter="url(#sk2)">
    <rect x="50" y="230" width="30" height="40" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="80" y="230" width="50" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="130" y="230" width="30" height="40" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="320" y="230" width="30" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="350" y="230" width="50" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="400" y="230" width="30" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <!-- 新节点 9，浮在中间偏上 -->
    <rect x="215" y="270" width="30" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="245" y="270" width="50" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="295" y="270" width="30" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="105" y="255" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">head</text>
  <text x="375" y="255" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="270" y="301" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">9</text>
  <text x="270" y="326" text-anchor="middle" font-size="9" fill="#2e6e2e">新节点 node</text>

  <!-- 4 条编号指针 -->
  <g filter="url(#sk2)">
    <!-- ① 9.next = head.next(=1)  绿色：从9.next指向1 -->
    <path d="M 325 285 Q 370 250 400 248" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
    <!-- ② 9.prev = head  蓝色：从9.prev指向head -->
    <path d="M 230 285 Q 175 268 145 268" stroke="#2b6e9e" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <!-- ③ head.next.prev = 9  红色：从1.prev指向9 -->
    <path d="M 335 252 Q 300 240 300 272" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)"/>
    <!-- ④ head.next = 9  橙色：从head.next指向9 -->
    <path d="M 160 252 Q 200 240 240 272" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="380" y="232" font-size="10" fill="#4a7a3a" font-weight="bold">①node.next=cur.next</text>
  <text x="178" y="262" font-size="10" fill="#2b6e9e" font-weight="bold">②node.prev=cur</text>
  <text x="300" y="232" font-size="9" fill="#b85450" font-weight="bold">③cur.next.prev=node</text>
  <text x="150" y="288" font-size="10" fill="#7a5415" font-weight="bold">④cur.next=node</text>

  <text x="470" y="300" text-anchor="middle" font-size="10" fill="#666">cur = 哨兵 head；在 cur 之后插入 = addAtHead；在 tail.prev 之后插入 = addAtTail</text>

  <!-- ===== 底部：哨兵的价值 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="340" width="400" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="76" y="362" font-size="12" font-weight="bold" fill="#7a2828">不用哨兵：边界特例多</text>
  <text x="76" y="382" font-size="11" fill="#444">空链表插头：head 为空 → 单独处理</text>
  <text x="76" y="400" font-size="11" fill="#444">头部插/删：要改 head 指针本身</text>
  <text x="76" y="418" font-size="10" fill="#7a5415">每个写操作都要 if (head == null) 判一遍，易漏边界</text>

  <g filter="url(#sk)">
    <rect x="480" y="340" width="400" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="496" y="362" font-size="12" font-weight="bold" fill="#2e6e2e">用哨兵：代码完全统一</text>
  <text x="496" y="382" font-size="11" fill="#444">永远在 cur 与 cur.next 之间拼接 / 摘除</text>
  <text x="496" y="400" font-size="11" fill="#444">head/tail 永不空，无 null 判断</text>
  <text x="496" y="418" font-size="10" fill="#7a5415">插头=在 head 后插；插尾=在 tail.prev 后插；同一套 4 指针代码</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="60" y="452" width="820" height="64" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="470" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">插入 = 4 指针重连；删除 = 2 指针重连 + free</text>
  <text x="470" y="496" text-anchor="middle" font-size="11" fill="#444">addAtHead / addAtTail / addAtIndex 本质相同：找到 cur，在其后插入</text>
  <text x="470" y="512" text-anchor="middle" font-size="11" fill="#4a7a3a">哨兵把“头尾空”的特例全部消掉，是链表设计题的通用起手式</text>
</svg>
