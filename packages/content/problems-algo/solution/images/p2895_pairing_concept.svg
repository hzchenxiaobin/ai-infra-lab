<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：逆序配对——最早空闲的处理器接最长的任务</text>

  <!-- Tasks row, sorted descending -->
  <text x="20" y="62" font-size="11" fill="#888">任务降序排：</text>

  <rect x="100" y="46" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="152" y="46" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="204" y="46" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="256" y="46" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <rect x="330" y="46" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="382" y="46" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="434" y="46" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="486" y="46" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#446688">最长的 4 个 → 处理器①</text>
  <text x="432" y="40" text-anchor="middle" font-size="10" fill="#4a7a3a">最短的 4 个 → 处理器②</text>

  <!-- Pairing arrows -->
  <path d="M 200 86 C 180 110, 170 120, 160 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 86 C 440 110, 450 120, 460 140" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Processor 1: p = 8, gets 4 longest -->
  <rect x="100" y="144" width="260" height="70" fill="#fff" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="168" font-size="12" fill="#446688" font-weight="bold">处理器① p = 8（先空闲）</text>
  <rect x="120" y="178" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="196" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="168" y="178" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="196" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="216" y="178" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="196" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="264" y="178" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="196" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="330" y="196" font-size="11" fill="#b85450" font-weight="bold">8 + 8 = 16</text>

  <!-- Processor 2: p = 10, gets 4 shortest -->
  <rect x="100" y="232" width="260" height="70" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="256" font-size="12" fill="#4a7a3a" font-weight="bold">处理器② p = 10（后空闲）</text>
  <rect x="120" y="266" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="284" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="168" y="266" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="284" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="216" y="266" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="284" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="264" y="266" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="284" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="330" y="284" font-size="11" fill="#666">10 + 3 = 13</text>

  <!-- Answer note -->
  <rect x="390" y="160" width="170" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="184" font-size="12" fill="#333" font-weight="bold">答案 = max(16, 13)</text>
  <text x="404" y="208" font-size="16" fill="#b85450" font-weight="bold">= 16</text>
  <text x="404" y="232" font-size="10" fill="#666">同组共享 p，只有组内</text>
  <text x="404" y="248" font-size="10" fill="#666">最长任务决定完成时间</text>
  <text x="404" y="268" font-size="10" fill="#888">即 max(pᵢ + t[4i])</text>

  <!-- Exchange argument note -->
  <rect x="20" y="316" width="540" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="32" y="332" font-size="10" fill="#b85450" font-weight="bold">交换论证：若先空闲的处理器拿了短任务 x、后空闲的拿了长任务 y（x &lt; y），</text>
  <text x="32" y="346" font-size="10" fill="#b85450" font-weight="bold">交换后 p+x'、p+y' 都 ≤ 旧的 p+y → 最大值不增 → 逆序配对总不劣</text>
</svg>
