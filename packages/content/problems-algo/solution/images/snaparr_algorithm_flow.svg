<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SnapshotArray：set / snap / get 流程</text>

  <!-- set box -->
  <rect x="30" y="44" width="150" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="105" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">set(index, val)</text>
  <line x1="42" y1="74" x2="168" y2="74" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="94" text-anchor="middle" font-size="10.5" fill="#444">末条.snap == cur_snap ?</text>
  <text x="105" y="110" text-anchor="middle" font-size="10.5" fill="#444">  是 → 覆盖末条 val</text>
  <text x="105" y="126" text-anchor="middle" font-size="10.5" fill="#444">  否 → 追加 (cur_snap, val)</text>
  <text x="105" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(1) 均摊</text>

  <!-- snap box -->
  <rect x="195" y="44" width="130" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">snap()</text>
  <line x1="207" y1="74" x2="313" y2="74" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="10.5" fill="#444">不拷贝数组</text>
  <text x="260" y="112" text-anchor="middle" font-size="10.5" fill="#444">返回 cur_snap</text>
  <text x="260" y="128" text-anchor="middle" font-size="10.5" fill="#444">cur_snap += 1</text>
  <text x="260" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(1)</text>

  <!-- get box -->
  <rect x="340" y="44" width="150" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="415" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">get(index, snap_id)</text>
  <line x1="352" y1="74" x2="478" y2="74" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="415" y="94" text-anchor="middle" font-size="10.5" fill="#444">在 arr[index] 上</text>
  <text x="415" y="112" text-anchor="middle" font-size="10.5" fill="#444">二分找右界</text>
  <text x="415" y="128" text-anchor="middle" font-size="10.5" fill="#444">≤ snap_id 的最大下标</text>
  <text x="415" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">O(log m)</text>

  <!-- get flow path -->
  <path d="M 415 148 L 415 168" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- binary search box -->
  <rect x="250" y="172" width="240" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="370" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">二分 arr[index] 版本列表</text>
  <line x1="262" y1="202" x2="478" y2="202" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="370" y="222" text-anchor="middle" font-size="10.5" fill="#555">lo=0, hi=len−1, ans=0（哨兵）</text>
  <text x="370" y="240" text-anchor="middle" font-size="10.5" fill="#555">mid.snap ≤ snap_id ?  记 ans, lo=mid+1</text>
  <text x="370" y="258" text-anchor="middle" font-size="10.5" fill="#555">            否则 :  hi=mid−1</text>
  <text x="370" y="276" text-anchor="middle" font-size="9.5" fill="#888">版本列表 snap_id 严格递增</text>

  <path d="M 370 282 L 370 302" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="270" y="306" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="370" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 list[ans].val</text>
  <text x="370" y="346" text-anchor="middle" font-size="9.5" fill="#888">ans ≥ 0 恒成立（哨兵兜底）</text>

  <!-- note -->
  <rect x="30" y="306" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="140" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">关键：稀疏版本化</text>
  <text x="140" y="344" text-anchor="middle" font-size="9.5" fill="#888">只在 set 时记版本，snap 不拷贝</text>

  <text x="260" y="392" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">set O(1)   ·   snap O(1)   ·   get O(log m)</text>
</svg>
