<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5, 4, 1, 2, 2]</text>

  <!-- nums row -->
  <text x="80" y="63" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="96" y="40" width="40" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="63" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">5</text>
  <rect x="146" y="40" width="40" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="166" y="63" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">4</text>
  <rect x="196" y="40" width="40" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="216" y="63" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <rect x="246" y="40" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="266" y="63" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="296" y="40" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="63" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 216 80 L 216 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="228" y="93" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">Counter 计数</text>

  <!-- freq row -->
  <rect x="97" y="100" width="70" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="125" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">5 : 1</text>
  <rect x="182" y="100" width="70" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="217" y="125" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">4 : 1</text>
  <rect x="267" y="100" width="70" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="302" y="125" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">1 : 1</text>
  <rect x="352" y="100" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="125" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2 : 2</text>
  <text x="387" y="158" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">cnt ≥ 2，唯一能当链头的值</text>

  <path d="M 217 142 L 217 164" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- special case 1 -->
  <rect x="110" y="168" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">特判 1：c = 1（奇数）→ 候选 ans = 1</text>

  <!-- chain walk -->
  <text x="48" y="222" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">链头 x = 2（cnt = 2 ≥ 2），从 cur = 2, len = 1 开始走链</text>

  <text x="100" y="244" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cur</text>
  <text x="220" y="244" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cnt[cur] ≥ 2 ?</text>
  <text x="360" y="244" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nxt = cur² 在表里 ?</text>
  <text x="474" y="244" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">len</text>
  <path d="M 60 250 L 510 250" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="60" y="256" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="276" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="160" y="256" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2 ≥ 2 ✓</text>
  <rect x="300" y="256" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4 存在 ✓</text>
  <rect x="438" y="256" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="474" y="276" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1 → 3</text>

  <path d="M 100 288 L 100 294" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="60" y="298" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="318" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="160" y="298" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="318" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 &lt; 2 ✗ 停</text>
  <rect x="300" y="298" width="120" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="318" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <rect x="438" y="298" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="474" y="318" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">= 3 ★</text>

  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">x = 4、x = 5：cnt = 1 &lt; 2，当不了链头（单元素 [x] 已由初值 1 覆盖）</text>

  <!-- answer -->
  <path d="M 474 330 C 474 340, 300 342, 262 346" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="70" y="352" width="380" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="374" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 3：子集 {2, 2, 4} 排成 [2, 4, 2]，其中 4 = 2² ✓</text>

  <text x="260" y="402" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">若再来一个 4 和一个 16（cnt[4] = 2, cnt[16] = 1）→ [2, 4, 16, 4, 2]，答案 5</text>
</svg>
