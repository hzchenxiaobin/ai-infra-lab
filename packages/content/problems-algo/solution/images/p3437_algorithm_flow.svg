<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：带奇偶剪枝的回溯（46 题模板 + 一行剪枝）</text>

  <!-- 主干：左侧竖排流程 -->
  <g filter="url(#rough2)">
    <rect x="30" y="44" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="105" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24">开始 dfs()</text>
  </g>
  <path d="M 105 74 L 105 92" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <path d="M 105 138 L 60 116 L 105 94 L 150 116 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="105" y="112" text-anchor="middle" font-size="10" fill="#8a6d1f">len(path)</text>
    <text x="105" y="124" text-anchor="middle" font-size="10" fill="#8a6d1f">== n ?</text>
  </g>

  <!-- 是 → 收集答案 -->
  <path d="M 150 116 L 210 116" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="108" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="214" y="98" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="274" y="113" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">收集答案副本</text>
    <text x="274" y="127" text-anchor="middle" font-size="10" fill="#2f5d24">ans.append(path)</text>
  </g>

  <!-- 否 → 枚举 -->
  <path d="M 105 138 L 105 156" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="113" y="152" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="30" y="158" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="105" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">枚举 x = 1 … n</text>
  </g>
  <path d="M 105 190 L 105 208" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <path d="M 105 258 L 38 233 L 105 208 L 172 233 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="105" y="228" text-anchor="middle" font-size="9.5" fill="#8f3a35">x 未用 且（path 空 或</text>
    <text x="105" y="241" text-anchor="middle" font-size="9.5" fill="#8f3a35">x 与末元素异奇偶）?</text>
  </g>

  <!-- 否 → 跳过（右侧绕回枚举框） -->
  <path d="M 172 233 L 215 233" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="188" y="225" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="219" y="215" width="115" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="276" y="230" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">跳过 x</text>
    <text x="276" y="244" text-anchor="middle" font-size="9.5" fill="#8f3a35">（剪枝发生处）</text>
  </g>
  <path d="M 334 233 L 360 233 L 360 174 L 184 174" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="196" font-size="9" fill="#8f3a35" filter="url(#rough2)">试下一个 x</text>

  <!-- 是 → 做选择 -->
  <path d="M 105 258 L 105 276" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="113" y="272" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="30" y="278" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="105" y="298" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">选择：push(x)，used[x]=1</text>
  </g>
  <path d="M 105 310 L 105 326" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="328" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="105" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">递归 dfs()，返回后撤销</text>
  </g>

  <!-- 右侧说明框 -->
  <g filter="url(#rough2)">
    <rect x="352" y="270" width="148" height="90" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="10"/>
    <text x="426" y="291" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">为什么只看末元素？</text>
    <text x="426" y="309" text-anchor="middle" font-size="9.5" fill="#55677d">合法性只约束「相邻对」</text>
    <text x="426" y="325" text-anchor="middle" font-size="9.5" fill="#55677d">前缀合法 + 新元素异奇偶</text>
    <text x="426" y="341" text-anchor="middle" font-size="9.5" fill="#55677d">⇒ 新前缀仍合法</text>
    <text x="426" y="355" text-anchor="middle" font-size="9" fill="#8f3a35">（无后效性，Markov 性）</text>
  </g>

  <!-- 顶部右侧：剪枝强度 -->
  <g filter="url(#rough2)">
    <rect x="352" y="44" width="148" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="426" y="64" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f">n = 10 时：</text>
    <text x="426" y="82" text-anchor="middle" font-size="10" fill="#55677d">n! ≈ 363 万 → A(n) = 28800</text>
    <text x="426" y="97" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">99.2% 分支被剪掉</text>
  </g>
</svg>
