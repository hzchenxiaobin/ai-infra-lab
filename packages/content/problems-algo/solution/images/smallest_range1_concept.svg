<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：独立调整，max 下压 k，min 上抬 k</text>

  <!-- ===== Case 1: gap > 0 ===== -->
  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">情形一：max − min &gt; 2k（间距足以压缩但未消除）</text>

  <!-- Number line -->
  <line x1="60" y1="110" x2="500" y2="110" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 500 110 L 492 106 L 492 114 z" fill="#999" filter="url(#rough2)"/>

  <!-- Original range bar -->
  <text x="40" y="92" font-size="10" fill="#888">原始范围</text>
  <rect x="140" y="96" width="280" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <!-- min and max labels -->
  <line x1="140" y1="88" x2="140" y2="120" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min(A)</text>
  <line x1="420" y1="88" x2="420" y2="120" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="420" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">max(A)</text>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#b85450">spread = max − min</text>

  <!-- Adjusted range bar -->
  <text x="40" y="146" font-size="10" fill="#888">调整后</text>
  <rect x="190" y="130" width="180" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <line x1="190" y1="122" x2="190" y2="154" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="190" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">min+k</text>
  <line x1="370" y1="122" x2="370" y2="154" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="370" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">max−k</text>

  <!-- k arrows: min pushed right by k, max pushed left by k -->
  <path d="M 140 134 L 186 134" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="163" y="128" text-anchor="middle" font-size="10" fill="#446688">+k</text>
  <path d="M 420 134 L 374 134" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="397" y="128" text-anchor="middle" font-size="10" fill="#b85450">−k</text>

  <!-- gap bracket -->
  <path d="M 190 180 L 190 176 L 370 176 L 370 180" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新差值 = (max−k) − (min+k) = max−min−2k</text>

  <!-- ===== Case 2: gap <= 0 ===== -->
  <text x="40" y="220" font-size="12" fill="#888" font-weight="bold">情形二：max − min ≤ 2k（间距可完全消除 → 差值为 0）</text>

  <!-- Number line -->
  <line x1="60" y1="270" x2="500" y2="270" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 500 270 L 492 266 L 492 274 z" fill="#999" filter="url(#rough2)"/>

  <!-- Original range -->
  <text x="40" y="252" font-size="10" fill="#888">原始范围</text>
  <rect x="170" y="256" width="200" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <line x1="170" y1="248" x2="170" y2="280" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="170" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min</text>
  <line x1="370" y1="248" x2="370" y2="280" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="370" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">max</text>

  <!-- Adjusted: ranges overlap, show merged green zone -->
  <text x="40" y="306" font-size="10" fill="#888">调整后</text>
  <rect x="120" y="290" width="300" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <line x1="240" y1="282" x2="240" y2="314" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="240" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">min+k</text>
  <line x1="300" y1="282" x2="300" y2="314" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="300" y="326" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">max−k</text>

  <!-- overlap zone shaded green -->
  <rect x="240" y="290" width="60" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">重叠</text>

  <!-- k arrows -->
  <path d="M 170 294 L 236 294" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="203" y="288" text-anchor="middle" font-size="10" fill="#446688">+k</text>
  <path d="M 370 294 L 304 294" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="337" y="288" text-anchor="middle" font-size="10" fill="#b85450">−k</text>

  <!-- overlap note -->
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min+k ≥ max−k → 所有元素可调到同一点 → 差值 = 0</text>

  <!-- ===== Formula box ===== -->
  <rect x="60" y="360" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = max(0, max(A) − min(A) − 2k)</text>
</svg>
