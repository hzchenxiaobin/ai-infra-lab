<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：路径 2→4→9→11，共 3 次移动</text>

  <!-- grid 4x4, cell 80x60 -->
  <!-- columns labels -->
  <text x="115" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">col 0</text>
  <text x="195" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">col 1</text>
  <text x="275" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">col 2</text>
  <text x="355" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">col 3</text>

  <!-- row labels -->
  <text x="60" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">row 0</text>
  <text x="60" y="160" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">row 1</text>
  <text x="60" y="220" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">row 2</text>
  <text x="60" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">row 3</text>

  <!-- cells. grid = [[2,4,3,5],[5,4,9,3],[3,4,2,11],[10,9,13,15]] -->
  <!-- row 0 -->
  <rect x="80" y="75" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="105" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="160" y="75" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="105" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="240" y="75" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="105" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="320" y="75" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="105" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">5</text>

  <!-- row 1 -->
  <rect x="80" y="135" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="165" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">5</text>
  <rect x="160" y="135" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="165" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <rect x="240" y="135" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="165" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="320" y="135" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="165" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>

  <!-- row 2 -->
  <rect x="80" y="195" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="225" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="160" y="195" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="225" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">4</text>
  <rect x="240" y="195" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="225" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <rect x="320" y="195" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="225" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>

  <!-- row 3 -->
  <rect x="80" y="255" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="285" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">10</text>
  <rect x="160" y="255" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="285" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">9</text>
  <rect x="240" y="255" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="285" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">13</text>
  <rect x="320" y="255" width="70" height="50" fill="#fafafa" stroke="#aaa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="285" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">15</text>

  <!-- path arrows: (0,0)2 -> (0,1)4 -> (1,2)9 -> (2,3)11 -->
  <path d="M 150 100 L 160 100" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 100 Q 255 130 240 160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 160 Q 335 195 320 220" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step labels along path -->
  <text x="180" y="92" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">①4&gt;2</text>
  <text x="262" y="135" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">②9&gt;4</text>
  <text x="342" y="195" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">③11&gt;9</text>

  <!-- result note -->
  <rect x="420" y="195" width="130" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="485" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最大移动次数</text>
  <text x="485" y="237" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 3</text>

  <text x="485" y="270" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">起点(0,0) 红色为路径</text>
  <text x="485" y="282" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">每步值严格递增</text>
</svg>
