<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">一趟扫描：延迟两位入表，右端查表计数</text>

  <!-- 主干流程（x=160） -->
  <g filter="url(#rough2)">
    <ellipse cx="160" cy="46" rx="46" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="160" y="51" text-anchor="middle" font-size="12.5" fill="#446688">开始</text>

    <rect x="92" y="78" width="136" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="160" y="98" text-anchor="middle" font-size="11.5" fill="#446688">计算 pre[0..n]（long long）</text>

    <rect x="120" y="126" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="160" y="145" text-anchor="middle" font-size="12" fill="#446688">j ← 0</text>

    <!-- 菱形 j>=2? -->
    <polygon points="160,168 224,194 160,220 96,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="160" y="199" text-anchor="middle" font-size="12" fill="#d6a040">j ≥ 2 ?</text>

    <!-- 入表框 -->
    <rect x="70" y="242" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="160" y="257" text-anchor="middle" font-size="11" fill="#4a7a3a">++cnt[ key_l(j−2) ]</text>
    <text x="160" y="271" text-anchor="middle" font-size="10.5" fill="#4a7a3a">= ( a[j−2], pre[j−1] )</text>

    <!-- 查询框 -->
    <rect x="70" y="298" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="160" y="313" text-anchor="middle" font-size="11" fill="#b85450">ans += cnt[ key_r(j) ]</text>
    <text x="160" y="327" text-anchor="middle" font-size="10.5" fill="#b85450">= ( a[j], pre[j] − a[j] )</text>
  </g>

  <!-- 主干箭头 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 160 63 L 160 76" marker-end="url(#arr)"/>
    <path d="M 160 108 L 160 124" marker-end="url(#arr)"/>
    <path d="M 160 154 L 160 166" marker-end="url(#arr)"/>
    <path d="M 160 220 L 160 240" marker-end="url(#arrGreen)"/>
    <path d="M 160 276 L 160 296" marker-end="url(#arr)"/>
  </g>
  <text x="168" y="236" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="170" y="216" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>

  <!-- 否：绕过入表框直接到查询框 -->
  <path d="M 224 194 C 274 194, 274 315, 254 315" fill="none" stroke="#d6a040"
        stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="288" y="188" font-size="11" fill="#d6a040" filter="url(#rough2)">否（跳过入表）</text>

  <!-- 循环回边：查询框右侧上行回菱形 -->
  <path d="M 250 308 C 300 308, 306 230, 226 202" fill="none" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrRed)"/>
  <text x="308" y="262" font-size="10.5" fill="#b85450" filter="url(#rough2)">j++，j &lt; n</text>

  <!-- 返回 -->
  <path d="M 160 332 L 160 348" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="170" y="350" font-size="11.5" fill="#446688" filter="url(#rough2)">j = n → 返回 ans</text>

  <!-- 右侧警示框 -->
  <g filter="url(#rough2)">
    <rect x="330" y="70" width="172" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="416" y="92" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">⚠️ 为什么延迟两位？</text>
    <text x="416" y="112" text-anchor="middle" font-size="10.5" fill="#d6a040">入表的是 l = j−2</text>
    <text x="416" y="128" text-anchor="middle" font-size="10.5" fill="#d6a040">⟹ 表中永远只有 l ≤ r−2</text>
    <text x="416" y="144" text-anchor="middle" font-size="10.5" fill="#d6a040">⟹ 长度 ≥ 3 被结构性保证</text>
    <text x="416" y="164" text-anchor="middle" font-size="10.5" fill="#b85450">不延迟的坑：全 0 数组中</text>
    <text x="416" y="180" text-anchor="middle" font-size="10.5" fill="#b85450">[j,j]、[j,j+1] 也会撞 key，</text>
    <text x="416" y="194" text-anchor="middle" font-size="10.5" fill="#b85450">把非法短子数组数进来！</text>
  </g>

  <!-- 右侧溢出提醒框 -->
  <g filter="url(#rough2)">
    <rect x="330" y="214" width="172" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="416" y="236" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">⚠️ 溢出两连坑</text>
    <text x="416" y="256" text-anchor="middle" font-size="10.5" fill="#b85450">pre 达 ±10^14 → long long</text>
    <text x="416" y="272" text-anchor="middle" font-size="10.5" fill="#b85450">全 0 时 ans 上界</text>
    <text x="416" y="288" text-anchor="middle" font-size="10.5" fill="#b85450">(n−1)(n−2)/2 ≈ 5×10^9 超 int</text>
  </g>
</svg>
