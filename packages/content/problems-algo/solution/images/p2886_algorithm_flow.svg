<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：定列 → 转换 → 返回</text>

  <!-- Step 1 -->
  <rect x="40" y="60" width="140" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 接收 students</text>
  <text x="110" y="100" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">grade 列是 float64</text>

  <path d="M 180 87 L 218 87" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="220" y="60" width="140" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">② 锁定 grade 列</text>
  <text x="290" y="100" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">students['grade']</text>

  <path d="M 360 87 L 398 87" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="400" y="60" width="130" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="82" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">③ astype(int)</text>
  <text x="465" y="100" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">整列向量化转换</text>

  <!-- Step 4 below -->
  <path d="M 465 114 L 465 152" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="154" width="210" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">④ 赋回 / 返回 DataFrame</text>
  <text x="465" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">grade 已是 int64</text>

  <!-- Decision note -->
  <rect x="40" y="154" width="250" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="178" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 千万别写成全表 astype(int)</text>
  <text x="165" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">students.astype(int) 会试图把</text>
  <text x="165" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">name（object 字符串列）也转成 int</text>
  <text x="165" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ 直接抛 ValueError</text>

  <!-- Bottom: two equivalent writeups -->
  <rect x="40" y="272" width="235" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="296" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">写法 A：取列 → 赋回</text>
  <text x="157" y="318" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">students['grade'] =</text>
  <text x="157" y="334" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">  students['grade'].astype(int)</text>
  <text x="157" y="358" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">改的是传入对象本身</text>

  <rect x="290" y="272" width="235" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="407" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">写法 B：字典 → 返回新表</text>
  <text x="407" y="318" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">return students.astype(</text>
  <text x="407" y="334" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">  {'grade': int})</text>
  <text x="407" y="358" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">不动原表，适合链式调用</text>
</svg>
