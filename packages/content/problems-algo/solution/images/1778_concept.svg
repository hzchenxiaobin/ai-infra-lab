<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">两阶段策略：先探图，后寻路</text>

  <!-- Left Panel: Phase 1 -->
  <rect x="20" y="44" width="220" height="296" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">阶段 1：DFS 盲探</text>

  <rect x="50" y="80" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="105" text-anchor="middle" font-size="14" fill="#4a7a3a">R</text>

  <rect x="95" y="80" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="105" text-anchor="middle" font-size="14" fill="#d6a040">?</text>
  <rect x="140" y="80" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="105" text-anchor="middle" font-size="14" fill="#d6a040">?</text>
  <rect x="50" y="125" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="150" text-anchor="middle" font-size="14" fill="#d6a040">?</text>
  <rect x="95" y="125" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="150" text-anchor="middle" font-size="14" fill="#d6a040">?</text>
  <rect x="140" y="125" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="150" text-anchor="middle" font-size="14" fill="#d6a040">?</text>

  <text x="130" y="190" text-anchor="middle" font-size="10.5" fill="#555">canMove(d) → 探测邻格</text>
  <text x="130" y="206" text-anchor="middle" font-size="10.5" fill="#555">move(d) → 物理移动</text>
  <text x="130" y="222" text-anchor="middle" font-size="10.5" fill="#555">isTarget() → 判目标</text>
  <text x="130" y="250" text-anchor="middle" font-size="10.5" fill="#b85450">探索后 move(反向) 回溯</text>
  <text x="130" y="270" text-anchor="middle" font-size="10.5" fill="#b85450">→ 输出：可达格集合</text>
  <text x="130" y="288" text-anchor="middle" font-size="10.5" fill="#b85450">&#160;&#160;&#160;+ 目标坐标</text>

  <path d="M245 180 L278 180" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right Panel: Phase 2 -->
  <rect x="280" y="44" width="220" height="296" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段 2：BFS 寻路</text>

  <rect x="310" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="100" text-anchor="middle" font-size="12" fill="#446688">S</text>
  <text x="330" y="114" text-anchor="middle" font-size="9" fill="#888">0</text>

  <rect x="355" y="80" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="100" text-anchor="middle" font-size="12" fill="#d6a040">.</text>
  <text x="375" y="114" text-anchor="middle" font-size="9" fill="#888">1</text>

  <rect x="400" y="80" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="100" text-anchor="middle" font-size="12" fill="#b85450">T</text>
  <text x="420" y="114" text-anchor="middle" font-size="9" fill="#888">2</text>

  <rect x="310" y="125" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="150" text-anchor="middle" font-size="14" fill="#bbb">#</text>

  <rect x="355" y="125" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="145" text-anchor="middle" font-size="12" fill="#d6a040">.</text>
  <text x="375" y="159" text-anchor="middle" font-size="9" fill="#888">2</text>

  <rect x="400" y="125" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="145" text-anchor="middle" font-size="12" fill="#446688">.</text>
  <text x="420" y="159" text-anchor="middle" font-size="9" fill="#888">3</text>

  <text x="390" y="190" text-anchor="middle" font-size="10.5" fill="#555">已知地图上 BFS</text>
  <text x="390" y="206" text-anchor="middle" font-size="10.5" fill="#555">逐层扩展，首达即最短</text>
  <text x="390" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a">无需物理移动</text>
  <text x="390" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a">纯图上计算</text>
  <text x="390" y="285" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 2 ✓</text>
</svg>
