<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两遍扫描流程：先统计行/列 B 计数，再逐一判定</text>

  <!-- 开始 -->
  <rect x="220" y="42" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">findLonelyPixel()</text>

  <path d="M 280 72 L 280 92" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="160" y="94" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">rowCount[m]=0, colCount[n]=0, ans=0</text>

  <path d="M 280 122 L 280 142" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第一遍标签 -->
  <rect x="60" y="144" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="159" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">第一遍：计数</text>

  <!-- 第一遍循环判定 -->
  <path d="M 280 146 L 376 176 L 280 206 L 184 176 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">遍历 (i,j) ?</text>
  <text x="280" y="190" text-anchor="middle" font-size="9.5" fill="#888">未完则继续</text>

  <!-- 是分支向下 -->
  <path d="M 280 206 L 280 226" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="222" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 判定 B -->
  <path d="M 280 228 L 376 258 L 280 288 L 184 258 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">picture[i][j]</text>
  <text x="280" y="272" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">== 'B' ?</text>

  <!-- 是分支：计数++ -->
  <path d="M 184 258 L 120 258" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="142" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="36" y="244" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="263" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">rowCount[i]++</text>
  <rect x="36" y="276" width="84" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="78" y="291" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">colCount[j]++</text>
  <!-- 回到循环 -->
  <path d="M 78 298 L 78 320 L 280 320 L 280 146" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 否分支：直接回循环 -->
  <path d="M 376 258 L 440 258" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="398" y="252" font-size="10" fill="#888">否</text>
  <path d="M 440 258 L 440 320 L 280 320" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>

  <!-- 第一遍结束→第二遍 -->
  <path d="M 280 206 L 280 340" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="332" font-size="10" fill="#b85450" font-weight="bold">遍历完</text>

  <!-- 第二遍标签 -->
  <rect x="60" y="342" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="357" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">第二遍：判定</text>

  <!-- 第二遍循环判定 -->
  <path d="M 280 344 L 376 372 L 280 400 L 184 372 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遍历 (i,j) ?</text>

  <!-- 是分支向下 -->
  <path d="M 280 400 L 280 416" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="412" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 判定条件 -->
  <rect x="116" y="418" width="328" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="437" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">=='B' &amp;&amp; rowCount[i]==1 &amp;&amp; colCount[j]==1 ?  ans++ : 跳过</text>
  <!-- 回到第二遍循环 -->
  <path d="M 280 446 L 280 452 L 460 452 L 460 372 L 376 372" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 第二遍否分支：返回 -->
  <path d="M 376 372 L 470 372" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="398" y="366" font-size="10" fill="#b85450" font-weight="bold">遍历完</text>
  <rect x="470" y="358" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="510" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>
</svg>
