<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="270" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    每回合得分 = 移除后「剩余」石子之和
  </text>

  <!-- 原始石子行 [5,3,1,4,2] -->
  <g filter="url(#rough2)">
    <rect x="145" y="58" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="195" y="58" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="245" y="58" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="295" y="58" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="345" y="58" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="84" text-anchor="middle" font-size="16" fill="#333">5</text>
    <text x="220" y="84" text-anchor="middle" font-size="16" fill="#333">3</text>
    <text x="270" y="84" text-anchor="middle" font-size="16" fill="#333">1</text>
    <text x="320" y="84" text-anchor="middle" font-size="16" fill="#333">4</text>
    <text x="370" y="84" text-anchor="middle" font-size="16" fill="#333">2</text>
    <!-- 下标 -->
    <text x="170" y="112" text-anchor="middle" font-size="11" fill="#888">i</text>
    <text x="370" y="112" text-anchor="middle" font-size="11" fill="#888">j</text>
  </g>

  <!-- 两个分支箭头 -->
  <path d="M170,104 Q120,130 110,158" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M370,104 Q420,130 430,158" fill="none" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左分支：移除左端 5 -->
  <text x="110" y="152" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">移除左端 5</text>
  <g filter="url(#rough2)">
    <rect x="70" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="112" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="154" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="196" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="90" y="195" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="132" y="195" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="174" y="195" text-anchor="middle" font-size="14" fill="#333">4</text>
    <text x="216" y="195" text-anchor="middle" font-size="14" fill="#333">2</text>
  </g>
  <text x="133" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    剩余和 = 3+1+4+2 = 10
  </text>

  <!-- 右分支：移除右端 2 -->
  <text x="430" y="152" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">移除右端 2</text>
  <g filter="url(#rough2)">
    <rect x="300" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="342" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="384" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="426" y="172" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="320" y="195" text-anchor="middle" font-size="14" fill="#333">5</text>
    <text x="362" y="195" text-anchor="middle" font-size="14" fill="#333">3</text>
    <text x="404" y="195" text-anchor="middle" font-size="14" fill="#333">1</text>
    <text x="446" y="195" text-anchor="middle" font-size="14" fill="#333">4</text>
  </g>
  <text x="363" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    剩余和 = 5+3+1+4 = 13
  </text>

  <!-- 状态转移公式 -->
  <rect x="50" y="250" width="440" height="62" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="275" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    dp[i][j] = 当前玩家在 stones[i..j] 先手时的「净赚」
  </text>
  <text x="270" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    = max( sum(i+1..j) − dp[i+1][j] ,  sum(i..j−1) − dp[i][j−1] )
  </text>

  <!-- 与 877 对比 -->
  <rect x="50" y="330" width="440" height="70" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="354" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    与 877 石子游戏的唯一区别
  </text>
  <text x="270" y="378" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    877：得分 = 拿走的石子 piles[i]
  </text>
  <text x="270" y="394" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    1690：得分 = 剩余石子之和 sum(剩余)  ← 用前缀和 O(1) 算
  </text>
</svg>
