<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：heights = [[1,2,2],[3,8,2],[5,3,5]]，max−min = 7</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">二分区间 [0, 7]，每次 BFS 判定 reachable(mid)</text>

  <!-- ===== Steps table ===== -->
  <text x="40" y="70" font-size="11" fill="#446688" font-weight="bold">二分过程</text>

  <!-- header -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="78" width="55" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="67" y="94" text-anchor="middle" fill="#446688" font-weight="bold">轮次</text>
    <rect x="95" y="78" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="135" y="94" text-anchor="middle" fill="#446688" font-weight="bold">区间 [lo,hi]</text>
    <rect x="175" y="78" width="55" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="202" y="94" text-anchor="middle" fill="#446688" font-weight="bold">mid</text>
    <rect x="230" y="78" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="285" y="94" text-anchor="middle" fill="#446688" font-weight="bold">reachable(mid)?</text>
    <rect x="340" y="78" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="430" y="94" text-anchor="middle" fill="#446688" font-weight="bold">动作</text>
  </g>

  <!-- row 1: mid=3, reachable -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="102" width="55" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="67" y="119" text-anchor="middle" fill="#333">1</text>
    <rect x="95" y="102" width="80" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="135" y="119" text-anchor="middle" fill="#333">[0, 7]</text>
    <rect x="175" y="102" width="55" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="202" y="119" text-anchor="middle" fill="#333">3</text>
    <rect x="230" y="102" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="285" y="119" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓ 能到达</text>
    <rect x="340" y="102" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="430" y="119" text-anchor="middle" fill="#333">ans=3, hi=2</text>
  </g>

  <!-- row 2: mid=1, not reachable -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="128" width="55" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="67" y="145" text-anchor="middle" fill="#333">2</text>
    <rect x="95" y="128" width="80" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="135" y="145" text-anchor="middle" fill="#333">[0, 2]</text>
    <rect x="175" y="128" width="55" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="202" y="145" text-anchor="middle" fill="#333">1</text>
    <rect x="230" y="128" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="285" y="145" text-anchor="middle" fill="#b85450" font-weight="bold">✗ 到不了</text>
    <rect x="340" y="128" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3"/>
    <text x="430" y="145" text-anchor="middle" fill="#333">阈值太小, lo=2</text>
  </g>

  <!-- row 3: mid=2, reachable -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="154" width="55" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="67" y="171" text-anchor="middle" fill="#333">3</text>
    <rect x="95" y="154" width="80" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="135" y="171" text-anchor="middle" fill="#333">[2, 2]</text>
    <rect x="175" y="154" width="55" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <text x="202" y="171" text-anchor="middle" fill="#333">2</text>
    <rect x="230" y="154" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="285" y="171" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓ 能到达</text>
    <rect x="340" y="154" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="430" y="171" text-anchor="middle" fill="#333">ans=2, hi=1</text>
  </g>

  <!-- row 4: end -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="180" width="55" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="67" y="197" text-anchor="middle" fill="#d6a040" font-weight="bold">结束</text>
    <rect x="95" y="180" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="135" y="197" text-anchor="middle" fill="#d6a040">lo&gt;hi</text>
    <rect x="175" y="180" width="55" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="202" y="197" text-anchor="middle" fill="#aaa">—</text>
    <rect x="230" y="180" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="285" y="197" text-anchor="middle" fill="#aaa">—</text>
    <rect x="340" y="180" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="430" y="197" text-anchor="middle" fill="#4a7a3a" font-weight="bold">返回 ans = 2</text>
  </g>

  <!-- ===== Mini grid 1: t=1 unreachable ===== -->
  <text x="120" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">t = 1：从起点能走到的范围（到不了终点）</text>
  <g filter="url(#rough2)" font-size="11">
    <!-- row0 -->
    <rect x="60" y="250" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="80" y="274" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="100" y="250" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="120" y="274" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="140" y="250" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="160" y="274" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <!-- row1 -->
    <rect x="60" y="290" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="80" y="314" text-anchor="middle" fill="#999">3</text>
    <rect x="100" y="290" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="120" y="314" text-anchor="middle" fill="#999">8</text>
    <rect x="140" y="290" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="160" y="314" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <!-- row2 -->
    <rect x="60" y="330" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="80" y="354" text-anchor="middle" fill="#999">5</text>
    <rect x="100" y="330" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="120" y="354" text-anchor="middle" fill="#999">3</text>
    <rect x="140" y="330" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="160" y="354" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="160" y="384" text-anchor="middle" font-size="9" fill="#b85450">终点未达 ✗</text>
  </g>

  <!-- ===== Mini grid 2: t=2 reachable ===== -->
  <text x="410" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">t = 2：终点已连通（仅 8 那格孤立）</text>
  <g filter="url(#rough2)" font-size="11">
    <!-- row0 -->
    <rect x="350" y="250" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="370" y="274" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="390" y="250" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="410" y="274" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="430" y="250" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="450" y="274" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <!-- row1 -->
    <rect x="350" y="290" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="370" y="314" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="390" y="290" width="40" height="40" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="410" y="314" text-anchor="middle" fill="#999">8</text>
    <rect x="430" y="290" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="450" y="314" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <!-- row2 -->
    <rect x="350" y="330" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="370" y="354" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="390" y="330" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="410" y="354" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="430" y="330" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <text x="450" y="354" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="450" y="384" text-anchor="middle" font-size="9" fill="#4a7a3a">终点已达 ✓</text>
  </g>

  <!-- footer -->
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#888">t=1 时被 8、5 等大落差边切断；t=2 时沿 1→3→5→3→5 的“缓坡”打通到终点</text>
  <text x="280" y="444" text-anchor="middle" font-size="10" fill="#aaa">分界点 t*=2 即最小体力消耗——这正是二分答案定位的「最小可行阈值」</text>
</svg>
