<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="264" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：倒序一趟，每步先查后插</text>

  <!-- ① 初始化 -->
  <rect x="132" y="34" width="264" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="52" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">① cntOdd = cntEven = 0，i = n − 1</text>

  <path d="M 264 62 L 264 72" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ② 判奇偶菱形 -->
  <polygon points="264,76 356,110 264,144 172,110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="106" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">nums[i] 是偶数？</text>
  <text x="264" y="122" text-anchor="middle" font-size="8.8" fill="#8a6d1f" filter="url(#rough2)">（② 先查：选对面）</text>

  <!-- 偶 分支 -->
  <path d="M 172 110 L 110 110 L 110 156" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="146" y="103" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶</text>
  <rect x="44" y="160" width="132" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="178" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans[i] = cntOdd</text>

  <!-- 奇 分支 -->
  <path d="M 356 110 L 432 110 L 432 156" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="392" y="103" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">奇</text>
  <rect x="366" y="160" width="132" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="178" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans[i] = cntEven</text>

  <!-- 汇合 → ③ 后插 -->
  <path d="M 110 188 L 110 224 L 128 224" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 432 188 L 432 224 L 400 224" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="132" y="210" width="264" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="228" text-anchor="middle" font-size="10.5" fill="#2f5c24" filter="url(#rough2)">③ 后插：本方计数器 + 1</text>

  <path d="M 264 238 L 264 248" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ④ 左移 -->
  <rect x="132" y="252" width="264" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="270" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">④ i = i − 1（指针左移）</text>

  <path d="M 264 280 L 264 288" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ⑤ 终止判定菱形 -->
  <polygon points="264,292 342,322 264,352 186,322" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="326" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">i &lt; 0 ?</text>

  <!-- 是 → 返回 -->
  <path d="M 342 322 L 380 322" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="360" y="314" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="384" y="302" width="120" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="444" y="318" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>
  <text x="444" y="333" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">（n 个位置填毕）</text>

  <!-- 否 → 回到 ② -->
  <path d="M 186 322 L 20 322 L 20 95 L 210 95" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="162" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="32" y="200" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">回</text>
  <text x="32" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">到</text>
  <text x="32" y="224" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">②</text>

  <!-- 右上手记 -->
  <rect x="400" y="34" width="110" height="66" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="455" y="52" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">手记：不变式</text>
  <text x="455" y="68" text-anchor="middle" font-size="8.8" fill="#777" filter="url(#rough2)">计数器 = 下标 &gt; i</text>
  <text x="455" y="80" text-anchor="middle" font-size="8.8" fill="#777" filter="url(#rough2)">的全体（严格右侧）</text>
  <text x="455" y="94" text-anchor="middle" font-size="8.8" fill="#777" font-weight="bold" filter="url(#rough2)">⇒ 先查后插</text>
</svg>
