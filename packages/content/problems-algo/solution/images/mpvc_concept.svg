<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">一次遍历双聚合：总播放量 + 最热视频 id</text>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">遍历每个三元组 (creator, id, views)，在哈希表里同时累加 Σviews 并更新「最热视频」</text>

  <!-- input grid -->
  <text x="98" y="78" text-anchor="end" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">输入</text>
  <text x="135" y="78" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">创作者</text>
  <text x="205" y="78" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">视频 id</text>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">播放量</text>

  <!-- row 1: alice / one / 5 -->
  <rect x="105" y="86" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">alice</text>
  <rect x="175" y="86" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">one</text>
  <rect x="245" y="86" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- row 2: bob / two / 10 -->
  <rect x="105" y="110" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bob</text>
  <rect x="175" y="110" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">two</text>
  <rect x="245" y="110" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <!-- row 3: alice / three / 5 -->
  <rect x="105" y="134" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">alice</text>
  <rect x="175" y="134" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">three</text>
  <rect x="245" y="134" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- row 4: chris / four / 4 -->
  <rect x="105" y="158" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">chris</text>
  <rect x="175" y="158" width="60" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">four</text>
  <rect x="245" y="158" width="50" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- arrow down to hash -->
  <path d="M270,184 L270,198" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="194" font-size="11" fill="#666" filter="url(#rough2)">聚合（哈希表）</text>

  <!-- hash table header -->
  <text x="280" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">聚合表：creator → (Σviews , 最热 id)</text>

  <!-- alice bucket -->
  <rect x="105" y="224" width="290" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="240" font-size="12" fill="#333" filter="url(#rough2)">alice</text>
  <text x="210" y="240" font-size="12" fill="#333" filter="url(#rough2)">Σviews = 10</text>
  <text x="330" y="240" font-size="12" fill="#333" filter="url(#rough2)">最热 id = one (5)</text>

  <!-- bob bucket -->
  <rect x="105" y="252" width="290" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="268" font-size="12" fill="#333" filter="url(#rough2)">bob</text>
  <text x="210" y="268" font-size="12" fill="#333" filter="url(#rough2)">Σviews = 10</text>
  <text x="330" y="268" font-size="12" fill="#333" filter="url(#rough2)">最热 id = two (10)</text>

  <!-- chris bucket -->
  <rect x="105" y="280" width="290" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="296" font-size="12" fill="#333" filter="url(#rough2)">chris</text>
  <text x="210" y="296" font-size="12" fill="#333" filter="url(#rough2)">Σviews = 4</text>
  <text x="330" y="296" font-size="12" fill="#333" filter="url(#rough2)">最热 id = four (4)</text>

  <!-- arrow down to result -->
  <path d="M270,308 L270,322" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="318" font-size="11" fill="#666" filter="url(#rough2)">取 max(Σviews)</text>

  <!-- result box -->
  <rect x="70" y="326" width="420" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">maxPop = 10  ⟹  Σ=10 的创作者：alice、bob</text>
  <text x="280" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = [[alice, one], [bob, two]]</text>
</svg>
