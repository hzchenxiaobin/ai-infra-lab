<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：FooBar 匹配 FoBa → true</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">双指针 j 跟踪 pattern，逐字符判定：匹配 / 小写跳过 / 大写拦截</text>

  <!-- query chars row with step-by-step pointer -->
  <text x="40" y="88" font-size="11" fill="#888" filter="url(#rough2)">query:</text>
  <text x="40" y="316" font-size="11" fill="#888" filter="url(#rough2)">pattern:</text>

  <!-- pattern "FoBa" displayed at bottom, with j pointer moving -->
  <g filter="url(#rough2)" font-size="16" font-weight="bold">
    <!-- pattern chars: F o B a -->
    <rect x="120" y="324" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="140" y="350" text-anchor="middle" fill="#4a7a3a">F</text>
    <rect x="162" y="324" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="182" y="350" text-anchor="middle" fill="#4a7a3a">o</text>
    <rect x="204" y="324" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="224" y="350" text-anchor="middle" fill="#4a7a3a">B</text>
    <rect x="246" y="324" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="266" y="350" text-anchor="middle" fill="#4a7a3a">a</text>
    <!-- j index labels -->
    <text x="140" y="376" text-anchor="middle" font-size="10" fill="#888">j=0</text>
    <text x="182" y="376" text-anchor="middle" font-size="10" fill="#888">j=1</text>
    <text x="224" y="376" text-anchor="middle" font-size="10" fill="#888">j=2</text>
    <text x="266" y="376" text-anchor="middle" font-size="10" fill="#888">j=3</text>
  </g>

  <!-- query "FooBar" chars, each step shows which pattern char it matched -->
  <g filter="url(#rough2)" font-size="16" font-weight="bold">
    <!-- F → matches p[0] -->
    <rect x="120" y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="140" y="100" text-anchor="middle" fill="#4a7a3a">F</text>
    <!-- o → matches p[1] -->
    <rect x="162" y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="182" y="100" text-anchor="middle" fill="#4a7a3a">o</text>
    <!-- o → lowercase skip -->
    <rect x="204" y="74" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="224" y="100" text-anchor="middle" fill="#446688">o</text>
    <!-- B → matches p[2] -->
    <rect x="246" y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="266" y="100" text-anchor="middle" fill="#4a7a3a">B</text>
    <!-- a → matches p[3] -->
    <rect x="288" y="74" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <text x="308" y="100" text-anchor="middle" fill="#4a7a3a">a</text>
    <!-- r → lowercase skip -->
    <rect x="330" y="74" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="350" y="100" text-anchor="middle" fill="#446688">r</text>
  </g>

  <!-- step number labels under query -->
  <g filter="url(#rough2)" font-size="10" fill="#888">
    <text x="140" y="124" text-anchor="middle">①</text>
    <text x="182" y="124" text-anchor="middle">②</text>
    <text x="224" y="124" text-anchor="middle">③</text>
    <text x="266" y="124" text-anchor="middle">④</text>
    <text x="308" y="124" text-anchor="middle">⑤</text>
    <text x="350" y="124" text-anchor="middle">⑥</text>
  </g>

  <!-- connecting arrows: matched steps link query→pattern -->
  <g filter="url(#rough2)">
    <!-- step1 F: query(140,112) → pattern(140,324) -->
    <path d="M 140 128 L 140 322" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrG)"/>
    <!-- step2 o: query(182,112) → pattern(182,324) -->
    <path d="M 182 128 L 182 322" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrG)"/>
    <!-- step3 o: skip, no arrow, just a small loop-back hint -->
    <path d="M 224 128 L 224 148 L 210 148" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)"/>
    <text x="232" y="152" font-size="9" fill="#446688">跳过</text>
    <!-- step4 B: query(266,112) → pattern(224,324) -->
    <path d="M 266 128 L 266 200 L 224 200 L 224 322" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrG)"/>
    <!-- step5 a: query(308,112) → pattern(266,324) -->
    <path d="M 308 128 L 308 210 L 266 210 L 266 322" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrG)"/>
    <!-- step6 r: skip -->
    <path d="M 350 128 L 350 148 L 336 148" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)"/>
    <text x="358" y="152" font-size="9" fill="#446688">跳过</text>
  </g>

  <!-- step action boxes on the right -->
  <g filter="url(#rough2)" font-size="11">
    <!-- step table -->
    <rect x="400" y="70" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="475" y="87" text-anchor="middle" fill="#4a7a3a" font-weight="bold">① F==F → j=1</text>

    <rect x="400" y="100" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="475" y="117" text-anchor="middle" fill="#4a7a3a" font-weight="bold">② o==o → j=2</text>

    <rect x="400" y="130" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="475" y="147" text-anchor="middle" fill="#446688">③ o 小写→跳过</text>

    <rect x="400" y="160" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="475" y="177" text-anchor="middle" fill="#4a7a3a" font-weight="bold">④ B==B → j=3</text>

    <rect x="400" y="190" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="475" y="207" text-anchor="middle" fill="#4a7a3a" font-weight="bold">⑤ a==a → j=4</text>

    <rect x="400" y="220" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <text x="475" y="237" text-anchor="middle" fill="#446688">⑥ r 小写→跳过</text>
  </g>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="400" y="260" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="475" y="282" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">扫描结束</text>
    <text x="475" y="300" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">j=4==|p| → ✓ true</text>
  </g>

  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#888">绿格=pattern 匹配（j++）｜蓝格=小写跳过（j 不动）｜虚线箭头=该 query 字符匹配 pattern 哪一位</text>
</svg>
