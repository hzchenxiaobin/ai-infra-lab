<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：zigzag 方向 × 层内交替正负号</text>

  <!-- 层标签 -->
  <text x="8" y="67" font-size="9.5" fill="#888" filter="url(#rough2)">第0层</text>
  <text x="8" y="141" font-size="9.5" fill="#888" filter="url(#rough2)">第1层</text>
  <text x="8" y="215" font-size="9.5" fill="#888" filter="url(#rough2)">第2层</text>

  <!-- 树边 -->
  <path d="M 143 78 L 108 122" fill="none" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 157 78 L 198 122" fill="none" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 99 152 L 70 196" fill="none" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 188 152 L 160 196" fill="none" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 202 152 L 230 196" fill="none" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 节点 -->
  <rect x="135" y="48" width="30" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="68" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="90" y="122" width="30" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="142" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="180" y="122" width="30" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="142" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="52" y="196" width="30" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="67" y="216" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="142" y="196" width="30" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="157" y="216" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="218" y="196" width="30" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="233" y="216" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 符号徽章：访问序第奇数个为 −，第偶数个（1,3,5…）为 + -->
  <circle cx="167" cy="52" r="7.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="167" y="56" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+</text>

  <circle cx="212" cy="126" r="7.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="212" y="130" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+</text>
  <circle cx="122" cy="126" r="7.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="130" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">−</text>

  <circle cx="84" cy="200" r="7.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="84" y="204" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+</text>
  <circle cx="174" cy="200" r="7.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="174" y="204" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">−</text>
  <circle cx="250" cy="200" r="7.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="204" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+</text>

  <!-- zigzag 扫描箭头 -->
  <path d="M 115 92 L 185 92" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="106" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">L→R</text>

  <path d="M 240 166 L 60 166" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">R→L</text>

  <path d="M 42 240 L 258 240" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="254" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">L→R</text>

  <!-- 右侧算式面板 -->
  <text x="402" y="44" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">每层的 Z 字形和</text>

  <rect x="300" y="56" width="205" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="73" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">第0层(L→R)： +5 = 5</text>

  <rect x="300" y="98" width="205" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="115" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">第1层(R→L)： +8 − 2 = 6</text>

  <rect x="300" y="140" width="205" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="157" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">第2层(L→R)： +1 − 9 + 6 = −2</text>

  <rect x="300" y="184" width="205" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="402" y="206" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer = [5, 6, −2]</text>

  <rect x="300" y="232" width="205" height="102" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="252" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">对称性小观察</text>
  <text x="402" y="272" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">层宽 m 为奇数：翻转方向 ⇒ 和不变</text>
  <text x="402" y="291" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">层宽 m 为偶数：翻转方向 ⇒ 和取反</text>
  <text x="402" y="317" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">⇒ 方向只通过「下标奇偶 → 符号」起作用</text>

  <text x="260" y="350" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">示例：root = [5,2,8,1,null,9,6]，节点旁小圆 = 该节点在访问序中的符号</text>
</svg>
