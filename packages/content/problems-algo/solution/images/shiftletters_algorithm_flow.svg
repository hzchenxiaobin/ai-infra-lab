<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从右向左累加后缀和，逐位移位</text>

  <!-- Start -->
  <rect x="200" y="48" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <path d="M 270 82 L 270 98" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="170" y="100" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">初始化</text>
  <text x="270" y="133" text-anchor="middle" font-size="11" fill="#555">suffix = 0; i = n − 1</text>
  <path d="M 270 140 L 270 156" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i >= 0 ? -->
  <polygon points="270,158 360,200 270,242 180,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i ≥ 0 ?</text>
  <text x="270" y="212" text-anchor="middle" font-size="10" fill="#888">(还有位置待处理)</text>

  <!-- No branch -> end -->
  <path d="M 360 200 L 430 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="184" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="478" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 result</text>

  <!-- Yes branch -> accumulate -->
  <path d="M 270 242 L 270 258" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="254" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 1: suffix accumulate -->
  <rect x="150" y="260" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 累加并取模</text>
  <text x="270" y="293" text-anchor="middle" font-size="10" fill="#555">suffix = (suffix + shifts[i]) % 26</text>
  <path d="M 270 300 L 270 316" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: shift char -->
  <rect x="120" y="318" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 移位当前字符</text>
  <text x="270" y="351" text-anchor="middle" font-size="10" fill="#555">result[i] = (s[i] − 'a' + suffix) % 26 + 'a'</text>
  <path d="M 270 358 L 270 374" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: i-- loop back -->
  <rect x="190" y="376" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ i = i − 1</text>

  <!-- Loop back arrow: from step3 left, up to decision -->
  <path d="M 190 393 L 100 393 L 100 200 L 180 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="300" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 80 300)">回到判断</text>

  <!-- Note -->
  <text x="270" y="428" text-anchor="middle" font-size="10" fill="#888">一次遍历 O(n)，suffix 滚动累加，无需额外数组</text>
</svg>
