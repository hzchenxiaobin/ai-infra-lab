<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：补全 [min, max] 连续区间，缺口即答案</text>

  <!-- Row label -->
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#888">连续区间 [1 … 8]（已存在 = 绿，遗失 = 红）</text>

  <!-- 8 cells: existing {1,4,5,6,8} green, missing {2,3,7} red -->
  <!-- id=1 green -->
  <rect x="88" y="68" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="96" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- id=2 red -->
  <rect x="134" y="68" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="157" y="96" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2?</text>
  <!-- id=3 red -->
  <rect x="180" y="68" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="203" y="96" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">3?</text>
  <!-- id=4 green -->
  <rect x="226" y="68" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="96" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">4</text>
  <!-- id=5 green -->
  <rect x="272" y="68" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="96" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">5</text>
  <!-- id=6 green -->
  <rect x="318" y="68" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="96" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">6</text>
  <!-- id=7 red -->
  <rect x="364" y="68" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="387" y="96" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">7?</text>
  <!-- id=8 green -->
  <rect x="410" y="68" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="433" y="96" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- min bracket under id=1 -->
  <path d="M 92 116 L 92 122 L 130 122 L 130 116" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="111" y="138" text-anchor="middle" font-size="10" fill="#666">min = 1</text>

  <!-- max bracket under id=8 -->
  <path d="M 414 116 L 414 122 L 452 122 L 452 116" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="138" text-anchor="middle" font-size="10" fill="#666">max = 8</text>

  <!-- Callout -->
  <rect x="60" y="156" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遗失的 ID = [min, max] 区间内、不在 Customers 表中的整数</text>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#666">先造出完整连续序列，再做反连接 → 缺口自然浮现</text>

  <!-- Result chips -->
  <text x="180" y="244" text-anchor="end" font-size="12" fill="#555" font-weight="bold">结果 ids →</text>
  <rect x="190" y="228" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="213" y="250" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">2</text>
  <rect x="246" y="228" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="269" y="250" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">3</text>
  <rect x="302" y="228" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="325" y="250" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">7</text>

  <!-- Arrow from callout to result -->
  <path d="M 280 208 L 280 224" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
