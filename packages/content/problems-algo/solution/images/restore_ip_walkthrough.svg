<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "101023" 回溯树（5 个合法 IP）</text>

  <!-- ===== 根节点 ===== -->
  <rect x="280" y="42" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(0,0)</text>

  <!-- 根到三列的连线 -->
  <path d="M 330 72 L 330 84 L 110 84 L 110 96" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 330 84 L 330 96" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 330 84 L 550 84 L 550 96" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- ===== 列 1：seg1="1" ===== -->
  <rect x="78" y="98" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"1"✓</text>

  <path d="M 110 126 L 110 140 L 70 140 L 70 152" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 110 140 L 150 140 L 150 152" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- seg2="0" -->
  <rect x="44" y="154" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="70" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"0"✓</text>

  <!-- seg2="01" "010" ✗ -->
  <text x="150" y="160" font-size="11" fill="#b85450" font-weight="bold">"01"✗</text>
  <text x="150" y="174" font-size="9" fill="#b85450">前导零</text>
  <text x="150" y="188" font-size="11" fill="#b85450" font-weight="bold">"010"✗</text>

  <!-- seg3 under "0" -->
  <path d="M 70 180 L 70 192 L 40 192 L 40 204" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 70 192 L 100 192 L 100 204" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="40" y="214" text-anchor="middle" font-size="10" fill="#333">"1"✓</text>
  <text x="40" y="228" text-anchor="middle" font-size="9" fill="#b85450">→"023"✗</text>

  <!-- 结果1 -->
  <rect x="10" y="248" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="70" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"1.0.10.23"</text>

  <text x="100" y="214" text-anchor="middle" font-size="10" fill="#333">"10"✓</text>

  <!-- 结果2 -->
  <rect x="10" y="286" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="70" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"1.0.102.3"</text>
  <text x="100" y="230" text-anchor="middle" font-size="10" fill="#333">"102"✓</text>

  <!-- ===== 列 2：seg1="10" ===== -->
  <rect x="298" y="98" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"10"✓</text>

  <path d="M 330 126 L 330 138 L 280 138 L 280 150" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 330 138 L 330 150" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 330 138 L 380 138 L 380 150" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"1"✓</text>
  <rect x="240" y="176" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"10.1.0.23"</text>

  <text x="330" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"10"✓</text>
  <rect x="250" y="216" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"10.10.2.3"</text>

  <text x="380" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"102"✓</text>
  <text x="380" y="176" text-anchor="middle" font-size="9" fill="#b85450">remain=1</text>
  <text x="380" y="190" text-anchor="middle" font-size="9" fill="#b85450">need=2</text>
  <text x="380" y="204" text-anchor="middle" font-size="9" fill="#b85450">→剪枝</text>

  <!-- ===== 列 3：seg1="101" ===== -->
  <rect x="514" y="98" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="550" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"101"✓</text>

  <path d="M 550 126 L 550 138 L 510 138 L 510 150" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 550 138 L 590 138 L 590 150" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="510" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"0"✓</text>
  <rect x="470" y="176" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="535" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"101.0.2.3"</text>

  <text x="590" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"02"✗</text>
  <text x="590" y="176" text-anchor="middle" font-size="9" fill="#b85450">前导零</text>
  <text x="590" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"023"✗</text>

  <!-- 底部说明 -->
  <rect x="40" y="340" width="580" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="362" font-size="11" fill="#8a6a20" font-weight="bold">剪枝要点</text>
  <text x="60" y="382" font-size="10" fill="#555">✗ 前导零：len&gt;1 且首位='0'，如 "01"/"023"，最常见的坑</text>
  <text x="60" y="398" font-size="10" fill="#555">✗ 剩余字符剪枝：remain &lt; need 或 remain &gt; 3·need 时直接终止（如 seg1="10"后取"102"，剩 1 字符凑不够 2 段）</text>
  <text x="60" y="414" font-size="10" fill="#555">✓ 结果：seg==4 且 start==n，4 段恰好覆盖整串</text>
</svg>
