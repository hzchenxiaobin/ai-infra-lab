<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">值 1..30 → 质数位掩码：仅 10 个质数 ≤ 30</text>

  <!-- 10 primes header row -->
  <text x="30" y="64" font-size="11" fill="#888">质数</text>
  <g filter="url(#rough2)">
    <rect x="62" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="106" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="194" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="238" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="282" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="326" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="414" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="458" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="82" y="68">2</text>
    <text x="126" y="68">3</text>
    <text x="170" y="68">5</text>
    <text x="214" y="68">7</text>
    <text x="258" y="68">11</text>
    <text x="302" y="68">13</text>
    <text x="346" y="68">17</text>
    <text x="390" y="68">19</text>
    <text x="434" y="68">23</text>
    <text x="478" y="68">29</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="82" y="92">bit0</text>
    <text x="126" y="92">bit1</text>
    <text x="170" y="92">bit2</text>
    <text x="214" y="92">bit3</text>
    <text x="258" y="92">bit4</text>
    <text x="302" y="92">bit5</text>
    <text x="346" y="92">bit6</text>
    <text x="390" y="92">bit7</text>
    <text x="434" y="92">bit8</text>
    <text x="478" y="92">bit9</text>
  </g>

  <!-- Valid (square-free) examples -->
  <text x="30" y="124" font-size="11" fill="#4a7a3a" font-weight="bold">可用</text>
  <g filter="url(#rough2)">
    <rect x="62" y="110" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="156" y="110" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="250" y="110" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="344" y="110" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="438" y="110" width="86" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="105" y="128" font-weight="bold">2</text>
    <text x="105" y="143" font-size="10" fill="#4a7a3a">mask=0000000001</text>
    <text x="199" y="128" font-weight="bold">6 = 2·3</text>
    <text x="199" y="143" font-size="10" fill="#4a7a3a">mask=...0000011</text>
    <text x="293" y="128" font-weight="bold">10 = 2·5</text>
    <text x="293" y="143" font-size="10" fill="#4a7a3a">mask=...0000101</text>
    <text x="387" y="128" font-weight="bold">15 = 3·5</text>
    <text x="387" y="143" font-size="10" fill="#4a7a3a">mask=...0000110</text>
    <text x="481" y="128" font-weight="bold">30 = 2·3·5</text>
    <text x="481" y="143" font-size="10" fill="#4a7a3a">mask=...0000111</text>
  </g>

  <!-- Invalid (squared prime) examples -->
  <text x="30" y="184" font-size="11" fill="#b85450" font-weight="bold">禁用</text>
  <g filter="url(#rough2)">
    <rect x="62" y="170" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <rect x="156" y="170" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <rect x="250" y="170" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <rect x="344" y="170" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <rect x="438" y="170" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
  </g>
  <g font-size="12" fill="#999" text-anchor="middle">
    <text x="105" y="188" font-weight="bold">4 = 2²</text>
    <text x="105" y="203" font-size="10" fill="#b85450">含 2²，舍弃</text>
    <text x="199" y="188" font-weight="bold">8 = 2³</text>
    <text x="199" y="203" font-size="10" fill="#b85450">含 2²，舍弃</text>
    <text x="293" y="188" font-weight="bold">9 = 3²</text>
    <text x="293" y="203" font-size="10" fill="#b85450">含 3²，舍弃</text>
    <text x="387" y="188" font-weight="bold">12 = 2²·3</text>
    <text x="387" y="203" font-size="10" fill="#b85450">含 2²，舍弃</text>
    <text x="481" y="188" font-weight="bold">25 = 5²</text>
    <text x="481" y="203" font-size="10" fill="#b85450">含 5²，舍弃</text>
  </g>
  <!-- strikethrough lines for invalid -->
  <g stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M70 190 L140 190"/>
    <path d="M164 190 L234 190"/>
    <path d="M258 190 L328 190"/>
    <path d="M352 190 L422 190"/>
    <path d="M446 190 L516 190"/>
  </g>

  <!-- Disjoint combination rule -->
  <text x="30" y="244" font-size="12" fill="#555" font-weight="bold">合并规则：两值掩码按位与 = 0 才能共存</text>

  <!-- OK case -->
  <rect x="40" y="258" width="220" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 可合并</text>
  <text x="150" y="302" text-anchor="middle" font-size="12" fill="#333">6 = {2,3}   +   5 = {5}</text>
  <text x="150" y="324" text-anchor="middle" font-size="11" fill="#555">011 & 100 = 000 → 无冲突</text>
  <text x="150" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a">乘积 = 30 = 2·3·5 ✓ 好子集</text>

  <!-- conflict case -->
  <rect x="300" y="258" width="220" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 冲突</text>
  <text x="410" y="302" text-anchor="middle" font-size="12" fill="#333">6 = {2,3}   +   10 = {2,5}</text>
  <text x="410" y="324" text-anchor="middle" font-size="11" fill="#555">011 & 101 = 001 → 共享 2</text>
  <text x="410" y="344" text-anchor="middle" font-size="11" fill="#b85450">乘积含 2²，非好子集 ✗</text>

</svg>
