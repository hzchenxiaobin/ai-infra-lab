<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums1=[3,1], nums2=[2,3], nums3=[1,2]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">三值掩码 101/110/011，popcount=2 全部入选</text>

  <!-- Input arrays -->
  <text x="30" y="74" font-size="11" fill="#666" font-weight="bold">输入</text>

  <rect x="70" y="58" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="134" y="58" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="164" y="76" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="210" y="76" font-size="10.5" fill="#446688">nums1 (bit0)</text>

  <rect x="70" y="94" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="112" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="134" y="94" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="164" y="112" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="210" y="112" font-size="10.5" fill="#4a7a3a">nums2 (bit1)</text>

  <rect x="70" y="130" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="148" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="134" y="130" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="164" y="148" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="210" y="148" font-size="10.5" fill="#d6a040">nums3 (bit2)</text>

  <!-- arrow down -->
  <path d="M 280 168 L 280 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- After registration: mask table -->
  <text x="30" y="196" font-size="11" fill="#666" font-weight="bold">登记后</text>
  <text x="280" y="196" text-anchor="middle" font-size="10.5" fill="#888">mask[v] 值（二进制 b₂b₁b₀）</text>

  <!-- table header -->
  <rect x="120" y="206" width="60" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="222" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">值 v</text>

  <rect x="180" y="206" width="80" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="222" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">bit2 nums3</text>

  <rect x="260" y="206" width="80" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="222" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">bit1 nums2</text>

  <rect x="340" y="206" width="80" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380" y="222" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">bit0 nums1</text>

  <rect x="420" y="206" width="70" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="222" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">popcount</text>

  <!-- row v=1 -->
  <rect x="120" y="230" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="180" y="230" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="246" text-anchor="middle" font-size="11" fill="#333">1 ✓</text>
  <rect x="260" y="230" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="246" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="340" y="230" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380" y="246" text-anchor="middle" font-size="11" fill="#333">1 ✓</text>
  <rect x="420" y="230" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="455" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✅</text>

  <!-- row v=2 -->
  <rect x="120" y="254" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="180" y="254" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="270" text-anchor="middle" font-size="11" fill="#333">1 ✓</text>
  <rect x="260" y="254" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="270" text-anchor="middle" font-size="11" fill="#333">1 ✓</text>
  <rect x="340" y="254" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="270" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="420" y="254" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="455" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✅</text>

  <!-- row v=3 -->
  <rect x="120" y="278" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="150" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="180" y="278" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="294" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="260" y="278" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="294" text-anchor="middle" font-size="11" fill="#333">1 ✓</text>
  <rect x="340" y="278" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="380" y="294" text-anchor="middle" font-size="11" fill="#333">1 ✓</text>
  <rect x="420" y="278" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="455" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✅</text>

  <!-- arrow down -->
  <path d="M 280 312 L 280 328" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- masks as binary -->
  <text x="30" y="348" font-size="11" fill="#666" font-weight="bold">掩码</text>

  <rect x="100" y="332" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="351" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">101 = 5</text>
  <text x="140" y="374" text-anchor="middle" font-size="9.5" fill="#b85450">v=1</text>

  <rect x="220" y="332" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">110 = 6</text>
  <text x="260" y="374" text-anchor="middle" font-size="9.5" fill="#b85450">v=2</text>

  <rect x="340" y="332" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="380" y="351" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">011 = 3</text>
  <text x="380" y="374" text-anchor="middle" font-size="9.5" fill="#b85450">v=3</text>

  <!-- result box -->
  <rect x="100" y="392" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="414" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = [1, 2, 3]  ✓ 顺序任意均正确</text>
</svg>
