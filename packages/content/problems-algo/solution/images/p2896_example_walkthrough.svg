<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：差异位 = [0, 3, 5, 8]，x = 2</text>

  <!-- 字符串两行 -->
  <g filter="url(#rough2)">
    <text x="36" y="57" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">s1</text>
    <text x="36" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">s2</text>
    <rect x="64" y="40" width="34" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="104" y="40" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="144" y="40" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="184" y="40" width="34" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="224" y="40" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="264" y="40" width="34" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="304" y="40" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="344" y="40" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="384" y="40" width="34" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="424" y="40" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="81" y="58" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="121" y="58" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="161" y="58" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="201" y="58" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="241" y="58" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="281" y="58" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="321" y="58" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="361" y="58" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="401" y="58" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="441" y="58" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="64" y="68" width="34" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="104" y="68" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="144" y="68" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="184" y="68" width="34" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="224" y="68" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="264" y="68" width="34" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="304" y="68" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="344" y="68" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="384" y="68" width="34" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="424" y="68" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="81" y="86" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="121" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="161" y="86" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="201" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="241" y="86" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="281" y="86" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="321" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="361" y="86" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="401" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="441" y="86" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="81" y="108" text-anchor="middle" font-size="10" fill="#666">0</text>
    <text x="121" y="108" text-anchor="middle" font-size="10" fill="#666">1</text>
    <text x="161" y="108" text-anchor="middle" font-size="10" fill="#666">2</text>
    <text x="201" y="108" text-anchor="middle" font-size="10" fill="#666">3</text>
    <text x="241" y="108" text-anchor="middle" font-size="10" fill="#666">4</text>
    <text x="281" y="108" text-anchor="middle" font-size="10" fill="#666">5</text>
    <text x="321" y="108" text-anchor="middle" font-size="10" fill="#666">6</text>
    <text x="361" y="108" text-anchor="middle" font-size="10" fill="#666">7</text>
    <text x="401" y="108" text-anchor="middle" font-size="10" fill="#666">8</text>
    <text x="441" y="108" text-anchor="middle" font-size="10" fill="#666">9</text>
  </g>

  <!-- DP 表 -->
  <g filter="url(#rough2)">
    <rect x="42" y="128" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="86" y="128" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="178" y="128" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="64" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">i</text>
    <text x="132" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">f[i][0]</text>
    <text x="224" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">f[i][1]</text>

    <rect x="42" y="154" width="44" height="26" fill="none" stroke="#999"/>
    <rect x="86" y="154" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="178" y="154" width="92" height="26" fill="none" stroke="#999"/>
    <text x="64" y="171" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="132" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a24">0</text>
    <text x="224" y="171" text-anchor="middle" font-size="12" fill="#999">∞</text>

    <rect x="42" y="180" width="44" height="26" fill="none" stroke="#999"/>
    <rect x="86" y="180" width="92" height="26" fill="none" stroke="#999"/>
    <rect x="178" y="180" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="64" y="197" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="132" y="197" text-anchor="middle" font-size="12" fill="#999">∞</text>
    <text x="224" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a24">2</text>

    <rect x="42" y="206" width="44" height="26" fill="none" stroke="#999"/>
    <rect x="86" y="206" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="178" y="206" width="92" height="26" fill="none" stroke="#999"/>
    <text x="64" y="223" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="132" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a24">2</text>
    <text x="224" y="223" text-anchor="middle" font-size="12" fill="#999">∞</text>

    <rect x="42" y="232" width="44" height="26" fill="none" stroke="#999"/>
    <rect x="86" y="232" width="92" height="26" fill="none" stroke="#999"/>
    <rect x="178" y="232" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="64" y="249" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="132" y="249" text-anchor="middle" font-size="12" fill="#999">∞</text>
    <text x="224" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a24">4</text>

    <rect x="42" y="258" width="44" height="26" fill="none" stroke="#999"/>
    <rect x="86" y="258" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="178" y="258" width="92" height="26" fill="none" stroke="#999"/>
    <text x="64" y="275" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="132" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a24">4</text>
    <text x="224" y="275" text-anchor="middle" font-size="12" fill="#999">∞</text>

    <!-- 路径箭头 -->
    <path d="M 170 152 Q 212 140 224 176" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <path d="M 200 208 L 200 230" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <path d="M 174 248 Q 158 262 174 268" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
  </g>

  <!-- 右侧最优路径 -->
  <g filter="url(#rough2)">
    <rect x="296" y="128" width="196" height="156" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="394" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6512">最优路径</text>
    <text x="310" y="176" font-size="11.5" fill="#333">① 在 0 开启：付 x = 2</text>
    <text x="310" y="202" font-size="11.5" fill="#333">② 3、5 相邻配对：+2</text>
    <text x="310" y="228" font-size="11.5" fill="#333">③ 在 8 关闭：+0</text>
    <text x="394" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">f[4][0] = 4 ✓</text>
  </g>

  <!-- 对应实际操作 -->
  <g filter="url(#rough2)">
    <rect x="42" y="300" width="450" height="108" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="267" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a34">对应到实际操作（与官方解释一致）</text>
    <text x="66" y="350" font-size="12" fill="#333">· 远程操作翻转下标 0 和 8：代价 x = 2</text>
    <text x="66" y="374" font-size="12" fill="#333">· 相邻翻转 (3,4)、(4,5)：代价 1 + 1 = 2（即 3→5 链式传播）</text>
    <text x="267" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a34">合计 = 4</text>
  </g>
</svg>
