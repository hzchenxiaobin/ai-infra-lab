<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">闰年判定流程：三条规则的嵌套判定</text>

  <!-- ===== Start: year Y ===== -->
  <ellipse cx="180" cy="58" rx="50" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入年份 Y</text>

  <line x1="180" y1="76" x2="180" y2="92" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision 1: Y % 400 == 0 ? ===== -->
  <polygon points="180,96 280,140 180,184 80,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">Y % 400 == 0 ?</text>
  <text x="180" y="152" text-anchor="middle" font-size="9.5" fill="#888">规则三（最高优先）</text>

  <!-- Yes → 闰年 29 (right) -->
  <text x="292" y="136" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 140 Q 340 140 360 140" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="364" y="122" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="434" y="138" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">闰年 → 29 天</text>
  <text x="434" y="152" text-anchor="middle" font-size="9.5" fill="#888">如 1600, 2000</text>

  <!-- No → down -->
  <text x="190" y="198" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <line x1="180" y1="184" x2="180" y2="210" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision 2: Y % 100 == 0 ? ===== -->
  <polygon points="180,214 280,258 180,302 80,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="254" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">Y % 100 == 0 ?</text>
  <text x="180" y="270" text-anchor="middle" font-size="9.5" fill="#888">规则二（世纪年排除）</text>

  <!-- Yes → 平年 28 (right) -->
  <text x="292" y="254" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <path d="M 280 258 Q 340 258 360 258" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="364" y="240" width="140" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="434" y="256" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">平年 → 28 天</text>
  <text x="434" y="270" text-anchor="middle" font-size="9.5" fill="#888">如 1700, 1900, 2100</text>

  <!-- No → down -->
  <text x="190" y="316" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <line x1="180" y1="302" x2="180" y2="328" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision 3: Y % 4 == 0 ? ===== -->
  <polygon points="180,332 280,376 180,420 80,376" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="372" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">Y % 4 == 0 ?</text>
  <text x="180" y="388" text-anchor="middle" font-size="9.5" fill="#888">规则一（基础判定）</text>

  <!-- Yes → 闰年 29 (right) -->
  <text x="292" y="372" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 376 Q 340 376 360 376" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="364" y="358" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="434" y="374" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">闰年 → 29 天</text>
  <text x="434" y="388" text-anchor="middle" font-size="9.5" fill="#888">如 1996, 2020, 2024</text>

  <!-- No → down: 平年 28 -->
  <text x="190" y="434" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <line x1="180" y1="420" x2="180" y2="430" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="116" y="432" width="128" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="448" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">平年 → 28 天</text>

  <!-- ===== Trap warning note on left side ===== -->
  <rect x="40" y="434" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="449" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">如 2023</text>
</svg>
