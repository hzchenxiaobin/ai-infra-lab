<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历 + 先查再写</text>

  <!-- start -->
  <rect x="245" y="32" width="110" height="28" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 300 60 L 300 74" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="200" y="76" width="200" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt = {}，ans = 0</text>
  <path d="M 300 108 L 300 122" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="185" y="124" width="230" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历每个点 p = (x₁, y₁)</text>
  <path d="M 300 160 L 300 174" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- query -->
  <rect x="120" y="176" width="360" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举 x = 0 … k，配对点 = (x₁⊕x, y₁⊕(k−x))</text>
  <text x="300" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans += cnt[配对点] ← 先查</text>
  <path d="M 300 234 L 300 248" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- insert -->
  <rect x="175" y="250" width="250" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="272" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">cnt[(x₁, y₁)] += 1 ← 再写</text>
  <path d="M 300 286 L 300 300" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="300,300 390,332 300,364 210,332" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="337" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">还有点？</text>

  <!-- yes back to loop -->
  <path d="M 390 332 L 520 332 L 520 142 L 419 142" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="448" y="326" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- no to end -->
  <path d="M 300 364 L 300 382" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="312" y="380" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- end -->
  <rect x="245" y="384" width="110" height="28" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="402" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- note -->
  <rect x="60" y="426" width="480" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="448" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">先查再写：每对恰统计一次（j &lt; i）；k = 0 时不会自己配自己</text>
</svg>
