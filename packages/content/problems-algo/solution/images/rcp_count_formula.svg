<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">长度为 L 的连续段，可删个数 = max(0, L−2)</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">两端不能删（边界），中间每个都可删（红框）</text>

  <!-- Column headers -->
  <text x="70" y="78" font-size="11" fill="#888">长度 L</text>
  <text x="200" y="78" font-size="11" fill="#888">连续段（端点灰、可删红）</text>
  <text x="470" y="78" font-size="11" fill="#888">可删数</text>

  <!-- Row L=1 -->
  <text x="80" y="108" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="92" width="38" height="28" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="199" y="111" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <text x="470" y="111" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Row L=2 -->
  <text x="80" y="148" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="132" width="38" height="28" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="199" y="151" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <rect x="220" y="132" width="38" height="28" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="239" y="151" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <text x="470" y="151" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Row L=3 -->
  <text x="80" y="188" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="180" y="172" width="38" height="28" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="199" y="191" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <rect x="220" y="172" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="191" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">A</text>
  <rect x="260" y="172" width="38" height="28" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="279" y="191" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <text x="470" y="191" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- Row L=4 -->
  <text x="80" y="228" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="180" y="212" width="38" height="28" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="199" y="231" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <rect x="220" y="212" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="231" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">A</text>
  <rect x="260" y="212" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="279" y="231" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">A</text>
  <rect x="300" y="212" width="38" height="28" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="319" y="231" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <text x="470" y="231" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <!-- Row L=5 -->
  <text x="80" y="268" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="180" y="252" width="38" height="28" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="199" y="271" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <rect x="220" y="252" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="271" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">A</text>
  <rect x="260" y="252" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="279" y="271" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">A</text>
  <rect x="300" y="252" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="271" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">A</text>
  <rect x="340" y="252" width="38" height="28" fill="#e8f0fe" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="359" y="271" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">A</text>
  <text x="470" y="271" font-size="13" fill="#b85450" font-weight="bold">3</text>

  <!-- Legend -->
  <rect x="180" y="298" width="18" height="14" fill="#e8f0fe" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="206" y="309" font-size="10.5" fill="#666">端点（不可删）</text>
  <rect x="310" y="298" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="336" y="309" font-size="10.5" fill="#b85450">可删（两侧同色）</text>

  <!-- Formula box -->
  <rect x="60" y="324" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">每删 1 个：连续段 L→L−1，可删数恰好 −1</text>
  <text x="290" y="372" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇒ 总操作数 = 初始可删数（与删除顺序无关）</text>
</svg>
