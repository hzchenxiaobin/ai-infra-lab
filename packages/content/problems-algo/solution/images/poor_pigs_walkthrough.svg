<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：buckets=1000, minutesToDie=15, minutesToTest=60</text>

  <!-- ===== 推导 T 和 base ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="46" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="290" y="46" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="155" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">T = 60 / 15 = 4 轮</text>
  <text x="415" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">base = T + 1 = 5</text>

  <path d="M 290 86 L 290 96" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 表头 ===== -->
  <g filter="url(#rough2)">
    <rect x="60"  y="100" width="90"  height="30" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="150" y="100" width="150" height="30" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="300" y="100" width="150" height="30" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="450" y="100" width="90"  height="30" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="105" y="120" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">猪数 n</text>
  <text x="225" y="120" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">states = 5ⁿ</text>
  <text x="375" y="120" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">≥ 1000 ?</text>
  <text x="495" y="120" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">动作</text>

  <!-- ===== 数据行 ===== -->
  <g filter="url(#rough2)">
    <rect x="60"  y="130" width="90"  height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="150" y="130" width="150" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="300" y="130" width="150" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="450" y="130" width="90"  height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
  </g>
  <text x="105" y="148" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="225" y="148" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="375" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="495" y="148" text-anchor="middle" font-size="10" fill="#b85450">乘 5</text>

  <g filter="url(#rough2)">
    <rect x="60"  y="156" width="90"  height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="150" y="156" width="150" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="300" y="156" width="150" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="450" y="156" width="90"  height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
  </g>
  <text x="105" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="225" y="174" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="375" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="495" y="174" text-anchor="middle" font-size="10" fill="#b85450">乘 5</text>

  <g filter="url(#rough2)">
    <rect x="60"  y="182" width="90"  height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="150" y="182" width="150" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="300" y="182" width="150" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="450" y="182" width="90"  height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
  </g>
  <text x="105" y="200" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="225" y="200" text-anchor="middle" font-size="11" fill="#333">25</text>
  <text x="375" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="495" y="200" text-anchor="middle" font-size="10" fill="#b85450">乘 5</text>

  <g filter="url(#rough2)">
    <rect x="60"  y="208" width="90"  height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="150" y="208" width="150" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="300" y="208" width="150" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="450" y="208" width="90"  height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
  </g>
  <text x="105" y="226" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="225" y="226" text-anchor="middle" font-size="11" fill="#333">125</text>
  <text x="375" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="495" y="226" text-anchor="middle" font-size="10" fill="#b85450">乘 5</text>

  <g filter="url(#rough2)">
    <rect x="60"  y="234" width="90"  height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="150" y="234" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="300" y="234" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="450" y="234" width="90"  height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
  </g>
  <text x="105" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="225" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">625</text>
  <text x="375" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否（最险!）</text>
  <text x="495" y="252" text-anchor="middle" font-size="10" fill="#b85450">乘 5</text>

  <g filter="url(#rough2)">
    <rect x="60"  y="260" width="90"  height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="150" y="260" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="300" y="260" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="450" y="260" width="90"  height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <text x="105" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="225" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3125</text>
  <text x="375" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <text x="495" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">返回 5</text>

  <!-- ===== 结论 ===== -->
  <path d="M 290 296 L 290 306" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="60" y="312" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结论：5⁴=625 不足以区分 1000 桶，5⁵=3125 ≥ 1000</text>
  <text x="290" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ 最少需要 5 只猪</text>

  <text x="290" y="384" text-anchor="middle" font-size="11" fill="#888">关键拐点：n=4 时 625 与 1000 仅差 375，多一只猪即跳到 3125（5 倍余量）</text>
  <text x="290" y="402" text-anchor="middle" font-size="10" fill="#aaa">每多一只猪，可区分桶数 ×(T+1)；这是「指数级放大」的信息增益</text>
</svg>
