<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求和 → 算 delta → 建集合 → 遍历查找</text>

  <!-- Step 1: compute sums -->
  <rect x="130" y="46" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">计算 sumA, sumB</text>
  <text x="260" y="82" text-anchor="middle" font-size="10" fill="#666">accumulate 一次遍历求和</text>
  <path d="M 260 92 L 260 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute delta -->
  <rect x="130" y="114" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">delta = (sumA − sumB) / 2</text>
  <text x="260" y="150" text-anchor="middle" font-size="10" fill="#666">题目保证有解，故总和差为偶数</text>
  <path d="M 260 160 L 260 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: build set -->
  <rect x="130" y="182" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">将 bobSizes 存入哈希集合 setB</text>
  <text x="260" y="218" text-anchor="middle" font-size="10" fill="#666">unordered_set, O(1) 查找</text>
  <path d="M 260 228 L 260 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop section -->
  <rect x="50" y="250" width="420" height="150" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">遍历 aliceSizes 中每个 x：</text>

  <!-- compute y -->
  <rect x="90" y="284" width="160" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="170" y="308" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">y = x − delta</text>

  <!-- arrow to diamond -->
  <path d="M 250 302 L 300 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="360,278 420,302 360,326 300,302" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">y 在</text>
  <text x="360" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">setB?</text>

  <!-- yes label and arrow down -->
  <text x="372" y="348" font-size="10" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <path d="M 360 326 L 360 358" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no label and loop back -->
  <text x="430" y="296" font-size="10" fill="#888" font-weight="bold">否</text>
  <path d="M 420 302 C 470 302, 470 268, 260 268" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="240" y="362" width="240" height="32" fill="#446688" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="384" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">返回 [x, y]</text>

  <!-- bottom takeaway -->
  <rect x="50" y="416" width="420" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="436" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">关键：把「找一对交换」化为「固定 x 查 y」</text>
  <text x="260" y="454" text-anchor="middle" font-size="10" fill="#666">哈希集合将 O(n²) 暴力降为 O(n)</text>
</svg>
