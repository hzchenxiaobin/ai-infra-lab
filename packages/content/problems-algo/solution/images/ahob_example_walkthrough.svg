<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：buildings = [[1,4,2],[3,9,4]]</text>

  <!-- diff setup note -->
  <text x="320" y="48" text-anchor="middle" font-size="10" fill="#888">差分：cnt={1:+1,3:+1,4:−1,9:−1}，d={1:+2,3:+4,4:−2,9:−4}，事件点排序=[1,3,4,9]</text>

  <!-- Header row -->
  <rect x="30" y="60" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k</text>
  <rect x="80" y="60" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">段前 m</text>
  <rect x="140" y="60" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">段前 s</text>
  <rect x="210" y="60" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">avg=s/m</text>
  <rect x="290" y="60" width="210" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作（先输出后更新）</text>
  <rect x="500" y="60" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="530" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">段后 m</text>
  <rect x="560" y="60" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="595" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">段后 s</text>

  <!-- Row 1: k=1, skip -->
  <rect x="30" y="90" width="50" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="90" width="60" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="111" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="140" y="90" width="70" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="111" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="210" y="90" width="80" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="111" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="290" y="90" width="210" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="111" text-anchor="middle" font-size="10" fill="#888">m=0 跳过；应用 d[1]</text>
  <rect x="500" y="90" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="560" y="90" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="595" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Row 2: k=3, new segment -->
  <rect x="30" y="124" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="80" y="124" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="145" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="140" y="124" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="145" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="210" y="124" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="290" y="124" width="210" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="395" y="145" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">新增 [1,3,2] ⭐</text>
  <rect x="500" y="124" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="145" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="560" y="124" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="595" y="145" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- Row 3: k=4, new segment -->
  <rect x="30" y="158" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="80" y="158" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="179" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="140" y="158" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="179" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="210" y="158" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="179" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="290" y="158" width="210" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="395" y="179" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">avg≠上段(2) → 新增 [3,4,3]</text>
  <rect x="500" y="158" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="179" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="560" y="158" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="595" y="179" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Row 4: k=9, new segment -->
  <rect x="30" y="192" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="213" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="80" y="192" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="213" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="140" y="192" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="213" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="210" y="192" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="290" y="192" width="210" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="395" y="213" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">avg≠上段(3) → 新增 [4,9,4]</text>
  <rect x="500" y="192" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="560" y="192" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="595" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <!-- note -->
  <rect x="30" y="240" width="580" height="44" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="40" y="260" font-size="10" fill="#666" font-weight="bold">关键顺序：</text>
  <text x="120" y="260" font-size="10" fill="#555">每行先用「段前 m/s」算 avg 并输出段，再用 d[k]、cnt[k] 更新到「段后 m/s」</text>
  <text x="120" y="276" font-size="10" fill="#555">——「段后」即下一行的「段前」，状态沿事件点逐段传递</text>

  <!-- result -->
  <rect x="140" y="296" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = [[1,3,2],[3,4,3],[4,9,4]] ⭐</text>
</svg>
