<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：坐标哈希建 DSU → 一趟扫根取 top1/top2 → 分量数判定</text>

  <!-- 步骤 1 -->
  <rect x="110" y="38" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 哈希登记 + union</text>
  <text x="260" y="72" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">xrep[x] / yrep[y] 首见登记，再见即 unite(i, 首见点)</text>

  <path d="M 260 84 L 260 100" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="110" y="102" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 一趟扫根统计</text>
  <text x="260" y="136" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">find(i)==i 的根用 sz[i] 打擂台，维护 top1 ≥ top2</text>

  <path d="M 260 148 L 260 164" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,166 355,206 260,246 165,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">分量数 ≥ 2 ?</text>
  <text x="260" y="225" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">(即 top2 &gt; 0)</text>

  <!-- 分支 -->
  <path d="M 355 206 L 392 206" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="372" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="396" y="184" width="112" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="452" y="202" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="452" y="219" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">top1+top2+1</text>

  <path d="M 165 206 L 128 206" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="12" y="184" width="112" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="68" y="202" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="68" y="219" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">n + 1</text>

  <!-- 注记 -->
  <rect x="60" y="252" width="400" height="86" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">① 同 x 的点两两连通 ⇒ 坐标唯一归属分量，哈希表只须记“首见代表”</text>
  <text x="260" y="292" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">② 是 / 否两分支都是紧的上界：单分量时新点只能沿用本块旧坐标 + 全新坐标</text>
  <text x="260" y="312" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">复杂度：时间 O(n α(n))，空间 O(n)</text>
  <text x="260" y="330" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">坐标值域 ±10⁹ 用哈希表映射，无须离散化</text>
</svg>
