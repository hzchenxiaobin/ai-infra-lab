<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：光标把文本切成两段，各当一个栈，栈顶朝光标</text>

  <!-- ===== Logical text bar (context) ===== -->
  <rect x="60" y="46" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="74" y="40" font-size="10.5" fill="#888">逻辑文本</text>
  <!-- left cells leet -->
  <g filter="url(#rough2)">
    <rect x="92" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="109" y="73" text-anchor="middle" font-size="13" fill="#333">l</text>
    <rect x="126" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="143" y="73" text-anchor="middle" font-size="13" fill="#333">e</text>
    <rect x="160" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="177" y="73" text-anchor="middle" font-size="13" fill="#333">e</text>
    <rect x="194" y="52" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="211" y="73" text-anchor="middle" font-size="13" fill="#333">t</text>
  </g>
  <!-- cursor -->
  <rect x="228" y="50" width="34" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="74" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">|</text>
  <!-- right cells practice -->
  <g filter="url(#rough2)">
    <rect x="262" y="52" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="279" y="73" text-anchor="middle" font-size="13" fill="#333">p</text>
    <rect x="296" y="52" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="313" y="73" text-anchor="middle" font-size="13" fill="#333">r</text>
    <rect x="330" y="52" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="347" y="73" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="364" y="52" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="381" y="73" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="398" y="52" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="415" y="73" text-anchor="middle" font-size="13" fill="#333">t</text>
    <rect x="432" y="52" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="449" y="73" text-anchor="middle" font-size="13" fill="#333">i</text>
    <rect x="466" y="52" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="483" y="73" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="500" y="52" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="517" y="73" text-anchor="middle" font-size="13" fill="#333">e</text>
  </g>

  <!-- ===== Dual-stack view ===== -->
  <text x="300" y="118" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">双栈视图：栈顶 = 紧邻光标的字符</text>

  <!-- left stack zone -->
  <rect x="50" y="128" width="230" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="64" y="146" font-size="11" fill="#446688" font-weight="bold">left 栈（左侧·阅读序）</text>
  <g filter="url(#rough2)">
    <rect x="64" y="158" width="34" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="81" y="179" text-anchor="middle" font-size="13" fill="#333">l</text>
    <rect x="98" y="158" width="34" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="115" y="179" text-anchor="middle" font-size="13" fill="#333">e</text>
    <rect x="132" y="158" width="34" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="149" y="179" text-anchor="middle" font-size="13" fill="#333">e</text>
    <rect x="166" y="158" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="183" y="179" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">t</text>
  </g>
  <text x="230" y="178" font-size="10.5" fill="#b85450" font-weight="bold">栈顶→</text>
  <text x="64" y="212" font-size="10" fill="#888">栈顶在右端，push/pop 落在数组端 O(1)</text>

  <!-- cursor between zones -->
  <text x="300" y="178" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">|</text>
  <text x="300" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">光标</text>

  <!-- right stack zone (drawn in reading order; stored reversed) -->
  <rect x="320" y="128" width="230" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="334" y="146" font-size="11" fill="#4a7a3a" font-weight="bold">right 栈（右侧·存储逆序）</text>
  <g filter="url(#rough2)">
    <rect x="334" y="158" width="30" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="349" y="179" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">p</text>
    <rect x="364" y="158" width="30" height="32" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="379" y="179" text-anchor="middle" font-size="13" fill="#333">r</text>
    <rect x="394" y="158" width="30" height="32" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="409" y="179" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="424" y="158" width="30" height="32" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="439" y="179" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="454" y="158" width="30" height="32" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="469" y="179" text-anchor="middle" font-size="13" fill="#333">t</text>
    <rect x="484" y="158" width="30" height="32" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="499" y="179" text-anchor="middle" font-size="13" fill="#333">i</text>
    <rect x="514" y="158" width="30" height="32" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="529" y="179" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="544" y="158" width="0" height="32"/>
  </g>
  <text x="334" y="178" font-size="10.5" fill="#b85450" font-weight="bold">←栈顶</text>
  <text x="334" y="212" font-size="10" fill="#888">栈顶在左端，逆序存储让 push/pop 落在数组端</text>

  <!-- ===== Operation arrows row ===== -->
  <text x="300" y="244" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">四个操作都只碰栈顶，代价 O(k)</text>

  <rect x="40" y="254" width="125" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="102" y="271" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">addText</text>
  <text x="102" y="287" text-anchor="middle" font-size="9.5" fill="#666">逐字符 push 到 left 栈顶</text>

  <rect x="175" y="254" width="125" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="237" y="271" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">deleteText</text>
  <text x="237" y="287" text-anchor="middle" font-size="9.5" fill="#666">pop left 栈顶 k 个</text>

  <rect x="310" y="254" width="125" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="372" y="271" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cursorLeft</text>
  <text x="372" y="287" text-anchor="middle" font-size="9.5" fill="#666">left 栈顶 → right 栈顶</text>

  <rect x="445" y="254" width="125" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="507" y="271" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">cursorRight</text>
  <text x="507" y="287" text-anchor="middle" font-size="9.5" fill="#666">right 栈顶 → left 栈顶</text>

  <!-- arc arrows: left<->right over cursor -->
  <path d="M 240 254 Q 300 234 360 254" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 360 294 Q 300 314 240 294" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Note ===== -->
  <rect x="40" y="312" width="530" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">全文 = left + reverse(right)</text>
  <text x="300" y="346" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">返回串 = left 末尾 ≤10 个（已是阅读序，无需翻转）</text>

  <text x="300" y="378" text-anchor="middle" font-size="10.5" fill="#888">两侧一正一逆，让"穿过光标"成为一次 pop + push</text>
  <text x="300" y="394" text-anchor="middle" font-size="10.5" fill="#888">单次代价只由 k 决定，与文本总长 L 解耦</text>
</svg>
