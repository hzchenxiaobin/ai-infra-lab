<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟扫描 + 维护(最大时长, 对应键)</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box: 第 0 个键作为初值 -->
  <rect x="120" y="94" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="113" text-anchor="middle" font-size="12" fill="#333">ansDur = releaseTimes[0]</text>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#333">ansKey = keysPressed[0]</text>

  <path d="M 270 138 L 270 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n ? -->
  <polygon points="270,158 380,200 270,242 160,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="270" y="212" text-anchor="middle" font-size="10" fill="#888">(i 从 1 遍历到 n−1)</text>

  <!-- No branch -> return -->
  <path d="M 380 200 L 450 200 L 450 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="192" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="386" y="302" width="128" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="323" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ansKey</text>

  <!-- Yes branch -> compute d -->
  <path d="M 160 200 L 110 200 L 110 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="20" y="252" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="273" text-anchor="middle" font-size="12" fill="#333">d = releaseTimes[i] − releaseTimes[i−1]</text>

  <path d="M 110 286 L 110 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: d > ansDur OR (d == ansDur AND key > ansKey) ? -->
  <polygon points="110,306 250,350 110,394 -30,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="343" text-anchor="middle" font-size="11" fill="#333">d &gt; ansDur</text>
  <text x="110" y="358" text-anchor="middle" font-size="10" fill="#888">或 (d == ansDur 且 key &gt; ansKey) ?</text>

  <!-- Yes: update -->
  <path d="M 250 350 L 290 350 L 290 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="200" y="410" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="430" text-anchor="middle" font-size="12" fill="#333">ansDur = d</text>
  <text x="290" y="446" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ansKey = keysPressed[i]</text>

  <!-- No: skip -->
  <path d="M -30 350 L -30 432" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="-18" y="392" font-size="11" fill="#999" font-weight="bold">否</text>
  <rect x="-70" y="434" width="80" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="-30" y="453" text-anchor="middle" font-size="11" fill="#888">不更新</text>

  <!-- Loop back: from update box and no-update -> back to i<n decision -->
  <path d="M 290 454 L 290 464 L 470 464 L 470 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M -30 462 L -30 464 L 470 464" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="478" y="334" font-size="9" fill="#4a7a3a">i++, 循环</text>

  <!-- Legend -->
  <rect x="372" y="360" width="150" height="42" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="380" y="376" font-size="10" fill="#888" font-weight="bold">图例</text>
  <rect x="380" y="382" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="400" y="391" font-size="10" fill="#555">处理动作</text>
  <polygon points="460,380 480,380 470,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="486" y="391" font-size="10" fill="#555">判定</text>
</svg>
