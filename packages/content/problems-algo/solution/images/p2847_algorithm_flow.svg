<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：试除 → 捆包 → 查余料表 → 升序拼接</text>

  <!-- start -->
  <rect x="170" y="44" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 n</text>

  <path d="M 290 78 L 290 94" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: n == 1 ? -->
  <polygon points="290,96 385,124 290,152 195,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="128" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">n == 1 ?</text>

  <!-- yes branch -->
  <path d="M 385 124 L 448 124" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="452" y="108" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="517" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 "1"</text>

  <!-- no branch -->
  <path d="M 290 152 L 290 168" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="164" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- trial division -->
  <rect x="170" y="172" width="240" height="34" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">试除 2,3,5,7 → 统计 a, b, c, d</text>

  <path d="M 290 206 L 290 222" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 2: remainder > 1 ? -->
  <polygon points="290,224 385,252 290,280 195,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="256" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">残留 &gt; 1 ?</text>

  <!-- yes branch -->
  <path d="M 385 252 L 448 252" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="452" y="236" width="130" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="517" y="257" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 "-1"</text>

  <!-- no branch -->
  <path d="M 290 280 L 290 296" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="292" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- pack 8s and 9s -->
  <rect x="170" y="300" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">捆包：⌊a/3⌋ 个 8、⌊b/2⌋ 个 9</text>

  <path d="M 290 334 L 290 350" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- leftover table -->
  <rect x="170" y="354" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">查余料表：追加 2 / 3 / 4 / 6 / {2,6}</text>

  <path d="M 290 388 L 290 404" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- add 5s and 7s -->
  <rect x="170" y="408" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="430" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">加入 c 个 5、d 个 7（各自单独成位）</text>

  <path d="M 290 442 L 290 458" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sort ascending -->
  <rect x="170" y="462" width="240" height="34" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="484" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">全部数位升序拼接</text>

  <path d="M 290 496 L 290 506" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="170" y="508" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="528" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">返回最小数字（字符串）</text>
</svg>
