<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：6 行邮箱 → 逐行提取 → DISTINCT 去重 → 4 个不同域名</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同色 = 同一域名：test.edu 出现 2 次、outlook.com 出现 2 次，去重后各留一行</text>

  <rect x="30" y="56" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="76" y="56" width="154" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="53" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">id</text>
  <text x="153" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">email</text>

  <g font-size="9" fill="#333" filter="url(#rough2)">
    <rect x="30" y="78" width="46" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="53" y="93" text-anchor="middle">336</text>
    <rect x="76" y="78" width="154" height="22" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/><text x="153" y="93" text-anchor="middle">hwkiy@test.edu</text>

    <rect x="30" y="100" width="46" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="53" y="115" text-anchor="middle">489</text>
    <rect x="76" y="100" width="154" height="22" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)"/><text x="153" y="115" text-anchor="middle">adcmaf@outlook.com</text>

    <rect x="30" y="122" width="46" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="53" y="137" text-anchor="middle">449</text>
    <rect x="76" y="122" width="154" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="153" y="137" text-anchor="middle">vrzmwyum@yahoo.com</text>

    <rect x="30" y="144" width="46" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="53" y="159" text-anchor="middle">95</text>
    <rect x="76" y="144" width="154" height="22" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/><text x="153" y="159" text-anchor="middle">tof@test.edu</text>

    <rect x="30" y="166" width="46" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="53" y="181" text-anchor="middle">320</text>
    <rect x="76" y="166" width="154" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="153" y="181" text-anchor="middle">jxhbagkpm@example.org</text>

    <rect x="30" y="188" width="46" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="53" y="203" text-anchor="middle">411</text>
    <rect x="76" y="188" width="154" height="22" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)"/><text x="153" y="203" text-anchor="middle">zxcf@outlook.com</text>
  </g>

  <path d="M 234 145 L 272 145" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="132" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">SUBSTRING_INDEX</text>
  <text x="253" y="142" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">(email,'@',-1)</text>

  <rect x="278" y="56" width="118" height="22" fill="#fff8e1" stroke="#8a6d1a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="337" y="71" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">提取出的域名</text>

  <g font-size="10" filter="url(#rough2)">
    <rect x="278" y="78" width="118" height="22" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/><text x="337" y="93" text-anchor="middle" fill="#446688">test.edu</text>
    <rect x="278" y="100" width="118" height="22" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)"/><text x="337" y="115" text-anchor="middle" fill="#8a6d1a">outlook.com</text>
    <rect x="278" y="122" width="118" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="337" y="137" text-anchor="middle" fill="#333">yahoo.com</text>
    <rect x="278" y="144" width="118" height="22" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/><text x="337" y="159" text-anchor="middle" fill="#446688">test.edu</text>
    <rect x="278" y="166" width="118" height="22" fill="#fff" stroke="#999" filter="url(#rough2)"/><text x="337" y="181" text-anchor="middle" fill="#333">example.org</text>
    <rect x="278" y="188" width="118" height="22" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)"/><text x="337" y="203" text-anchor="middle" fill="#8a6d1a">outlook.com</text>
  </g>

  <path d="M 402 145 L 440 145" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="421" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">DISTINCT</text>
  <text x="421" y="139" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">去重</text>

  <rect x="446" y="56" width="108" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="71" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">email_domain</text>

  <g font-size="10" filter="url(#rough2)">
    <rect x="446" y="78" width="108" height="22" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="500" y="93" text-anchor="middle" fill="#4a7a3a">example.org</text>
    <rect x="446" y="100" width="108" height="22" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="500" y="115" text-anchor="middle" fill="#4a7a3a">outlook.com</text>
    <rect x="446" y="122" width="108" height="22" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="500" y="137" text-anchor="middle" fill="#4a7a3a">test.edu</text>
    <rect x="446" y="144" width="108" height="22" fill="#e6f4ea" stroke="#4a7a3a" filter="url(#rough2)"/><text x="500" y="159" text-anchor="middle" fill="#4a7a3a">yahoo.com</text>
  </g>

  <rect x="446" y="176" width="108" height="34" fill="#fff" stroke="#999" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="500" y="190" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">ORDER BY</text>
  <text x="500" y="203" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">字典序输出</text>

  <rect x="40" y="240" width="500" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="263" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">去重不看次数：出现 2 次的 test.edu / outlook.com 与出现 1 次的 yahoo.com 待遇相同</text>
  <text x="290" y="284" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">「不同」= 存在性判定，与出现次数无关——要数次数就得换 GROUP BY + COUNT(*)</text>

  <rect x="40" y="315" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="337" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 本题面为付费题重建：示例数据取自官方测试用例，</text>
  <text x="290" y="356" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">输出列名 email_domain 与「任意顺序返回」为同族题惯例推断，以官方判定为准</text>
</svg>
