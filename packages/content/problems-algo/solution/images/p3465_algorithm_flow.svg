<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">一条正则搞定：FROM → WHERE REGEXP_LIKE('c') → SELECT → ORDER BY</text>

  <!-- Step 1 -->
  <rect x="110" y="40" width="300" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① FROM products —— 5 行进入判定</text>
  <path d="M260,70 L260,84" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: REGEXP_LIKE filter -->
  <rect x="44" y="88" width="432" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② WHERE REGEXP_LIKE(description, 'SN[0-9]{4}-[0-9]{4}([^0-9]|$)', 'c')</text>
  <text x="260" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">逐行子串匹配（无锚点）+ 大小写敏感（'c' 压过 _ci collation 默认）</text>

  <!-- branch arrows -->
  <path d="M160,138 C 140 150, 130 155, 122 166" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="156" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <path d="M360,138 C 380 150, 390 155, 396 166" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="156" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- left: discarded rows -->
  <rect x="28" y="170" width="190" height="136" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="123" y="190" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 丢弃 · 2 行</text>
  <text x="123" y="210" text-anchor="middle" font-size="9.5" fill="#7a2f2b" filter="url(#rough2)">Widget C — SN1234-56789</text>
  <text x="123" y="224" text-anchor="middle" font-size="9.5" fill="#7a2f2b" filter="url(#rough2)">短横后第 5 位是数字 → ✗</text>
  <text x="123" y="242" text-anchor="middle" font-size="9.5" fill="#7a2f2b" filter="url(#rough2)">Widget D — 无序列号</text>
  <text x="123" y="272" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（朴素模式会把 C 误判为有效）</text>
  <text x="123" y="292" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（WHERE 逐行布尔判定）</text>

  <!-- right: kept rows -->
  <rect x="302" y="170" width="190" height="136" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 保留 · 3 行</text>
  <text x="397" y="210" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">Widget A — SN1234-5678 ✓</text>
  <text x="397" y="226" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">Widget B — SN9876-1234 ✓</text>
  <text x="397" y="242" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">Widget E — SN4321-8765 ✓</text>
  <text x="397" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（右边界 = 串尾 / 空格）</text>
  <text x="397" y="292" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（命中多处也只保留一行）</text>

  <!-- Step 3 -->
  <path d="M396,306 L396,322" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="236" y="326" width="320" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="344" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ SELECT product_id, product_name, description</text>
  <path d="M396,354 L396,366" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: output -->
  <rect x="276" y="370" width="240" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="387" text-anchor="middle" font-size="11" fill="#2d5523" filter="url(#rough2)">④ ORDER BY product_id —— 输出 3 行</text>

  <!-- bottom-left warning note -->
  <rect x="28" y="336" width="196" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="126" y="356" text-anchor="middle" font-size="10" fill="#7a4a2b" filter="url(#rough2)">⚠ 朴素模式（缺 ([^0-9]|$)）会把</text>
  <text x="126" y="372" text-anchor="middle" font-size="10" fill="#7a4a2b" filter="url(#rough2)">Widget C 误判为有效；</text>
  <text x="126" y="388" text-anchor="middle" font-size="10" fill="#7a4a2b" filter="url(#rough2)">_ci collation 下还放过小写 sn…</text>
</svg>
