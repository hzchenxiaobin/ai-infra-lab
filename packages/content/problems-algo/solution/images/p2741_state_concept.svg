<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">核心差异：526 只需 mask，2741 还要记「上一个」</text>

  <!-- ============ 左面板：526 ============ -->
  <rect x="24" y="46" width="256" height="320" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="152" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">526 优美的排列</text>
  <text x="152" y="90" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">约束：perm[i] 与位置 i 整除</text>

  <!-- perm boxes for 526: [1, 3, 2] positions -->
  <text x="40" y="120" font-size="10" fill="#888" filter="url(#rough2)">位置</text>
  <text x="92" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="152" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="212" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>

  <rect x="62" y="128" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="92" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="122" y="128" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="152" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="182" y="128" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="212" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="152" y="178" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">判整除看「值 vs 位置」</text>

  <!-- state box for 526 -->
  <rect x="44" y="196" width="216" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="152" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">位置 i = popcount(mask) + 1</text>
  <text x="152" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">位置由「已放个数」唯一确定</text>

  <rect x="44" y="248" width="216" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="152" y="272" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">状态：dp[mask]  （一维）</text>

  <text x="152" y="312" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">放了几个 → 下一位置已知</text>
  <text x="152" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">无需记住上一次放了什么</text>
  <text x="152" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 一维足够</text>

  <!-- ============ 右面板：2741 ============ -->
  <rect x="300" y="46" width="256" height="320" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="428" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2741 特别的排列</text>
  <text x="428" y="90" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">约束：相邻元素互相整除</text>

  <!-- perm boxes for 2741: [2, 6, 3] -->
  <text x="316" y="120" font-size="10" fill="#888" filter="url(#rough2)">排列</text>
  <rect x="338" y="128" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="368" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="398" y="128" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="428" y="150" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="458" y="128" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="488" y="150" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>

  <!-- arrow 2->6 (ok) and 6->? (need last) -->
  <path d="M 398 145 L 406 145" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 458 145 L 466 145" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="428" y="178" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">下一个合法？要看「上一个 = 6」</text>

  <!-- state box for 2741 -->
  <rect x="320" y="196" width="216" height="40" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="428" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">合法与否取决于末位值</text>
  <text x="428" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">位置 i 不再参与判定</text>

  <rect x="320" y="248" width="216" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="428" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">状态：dp[mask][last]  （二维）</text>

  <text x="428" y="312" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">光知道「用了哪些」不够</text>
  <text x="428" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">还得记住末位是哪个元素</text>
  <text x="428" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 一维不足，需补 last 维</text>

  <!-- divider -->
  <path d="M 290 60 L 290 350" stroke="#ddd" stroke-width="1.4" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="40" y="376" width="500" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="388" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">两题同是状压 DP 计数；差别只在「约束锚点」是位置还是末位，决定状态要不要多一维 last</text>
</svg>
