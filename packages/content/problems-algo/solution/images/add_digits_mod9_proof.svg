<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数学原理：为什么 mod 9 直达数字根</text>

  <!-- ===== Step 1: 10 ≡ 1 (mod 9) ===== -->
  <text x="40" y="54" font-size="12" fill="#446688" font-weight="bold">① 关键事实：10 ≡ 1 (mod 9)</text>

  <rect x="44" y="64" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="264" y="89" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">10 = 9 + 1  ⟹  10 mod 9 = 1</text>

  <!-- arrow down -->
  <path d="M 264 106 Q 264 112 264 118" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="116" font-size="10" fill="#888">幂次保持</text>

  <!-- ===== Step 2: 10^k ≡ 1 (mod 9) ===== -->
  <rect x="44" y="122" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="264" y="147" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">10^k mod 9 = 1^k = 1  （任意 k ≥ 0）</text>

  <!-- arrow down -->
  <path d="M 264 164 Q 264 170 264 178" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: n ≡ S(n) (mod 9) ===== -->
  <text x="40" y="186" font-size="12" fill="#4a7a3a" font-weight="bold">② 推论：数位和与原数同余 (mod 9)</text>

  <rect x="44" y="196" width="440" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>

  <text x="64" y="218" font-size="12.5" fill="#333">n = d₀ + d₁×10 + d₂×100 + … + dₖ×10^k</text>

  <text x="64" y="240" font-size="12.5" fill="#888">⟹ n mod 9 = (d₀ + d₁×1 + d₂×1 + …) mod 9</text>

  <text x="64" y="262" font-size="13" fill="#b85450" font-weight="bold">⟹ n mod 9 = S(n) mod 9   ← 数位和不改变 mod 9 余数</text>

  <!-- ===== Step 3b: invariant chain ===== -->
  <text x="40" y="296" font-size="12" fill="#b85450" font-weight="bold">③ 不变式：反复求和，余数始终不变</text>

  <!-- invariant chain: 38 ≡ 11 ≡ 2 (mod 9) -->
  <rect x="60" y="308" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="85" y="328" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">38</text>

  <text x="120" y="328" font-size="11" fill="#888">≡</text>

  <rect x="138" y="308" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="163" y="328" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">11</text>

  <text x="198" y="328" font-size="11" fill="#888">≡</text>

  <rect x="216" y="308" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="241" y="328" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="276" y="328" font-size="11" fill="#888">(mod 9)</text>

  <text x="330" y="328" font-size="10.5" fill="#4a7a3a" font-weight="bold">← 余数 2 贯穿始终</text>

  <!-- ===== Step 4: conclusion ===== -->
  <rect x="44" y="354" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="264" y="376" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">数字根 = 最终那个一位数，仍 ≡ n (mod 9)</text>
  <text x="264" y="394" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">dr(n) = n mod 9  （余 0 且 n&gt;0 时为 9）</text>
</svg>
