<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：WHERE 过滤 2020 → GROUP BY user_id → MAX(time_stamp)</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">先过滤再分组：非 2020 年的行在分组前丢弃，保证 MAX 只看 2020 年</text>

  <!-- Stage 1: Logins table (all years) -->
  <text x="40" y="72" font-size="10.5" fill="#666">Logins（全部年份）</text>
  <rect x="36" y="78" width="120" height="120" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="36" y="78" width="120" height="22" fill="#e8f0fe" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="96" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">user_id | time_stamp</text>
  <text x="96" y="114" text-anchor="middle" font-size="9.5" fill="#333">6 | 2020-06-30</text>
  <text x="96" y="128" text-anchor="middle" font-size="9.5" fill="#b85450">6 | 2021-04-21 ✗</text>
  <text x="96" y="142" text-anchor="middle" font-size="9.5" fill="#b85450">6 | 2019-03-07 ✗</text>
  <text x="96" y="156" text-anchor="middle" font-size="9.5" fill="#333">8 | 2020-02-01</text>
  <text x="96" y="170" text-anchor="middle" font-size="9.5" fill="#333">8 | 2020-12-30</text>
  <text x="96" y="184" text-anchor="middle" font-size="9.5" fill="#b85450">14 | 2019-07-14 ✗</text>

  <!-- Arrow 1: WHERE filter -->
  <path d="M 160 138 L 200 138" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="180" y="130" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">WHERE</text>
  <text x="180" y="152" text-anchor="middle" font-size="8.5" fill="#d6a040">YEAR=2020</text>

  <!-- Stage 2: Filtered (2020 only) -->
  <text x="232" y="72" font-size="10.5" fill="#666">过滤后（仅 2020）</text>
  <rect x="210" y="78" width="120" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="78" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="93" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">user_id | time_stamp</text>
  <text x="270" y="114" text-anchor="middle" font-size="9.5" fill="#333">6 | 2020-06-30</text>
  <text x="270" y="128" text-anchor="middle" font-size="9.5" fill="#333">8 | 2020-02-01</text>
  <text x="270" y="142" text-anchor="middle" font-size="9.5" fill="#333">8 | 2020-12-30</text>
  <text x="270" y="156" text-anchor="middle" font-size="9.5" fill="#333">2 | 2020-01-16</text>

  <!-- Arrow 2: GROUP BY + MAX -->
  <path d="M 334 123 L 374 123" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="354" y="115" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">GROUP BY</text>
  <text x="354" y="137" text-anchor="middle" font-size="8.5" fill="#4a7a3a">+ MAX()</text>

  <!-- Stage 3: Result -->
  <text x="422" y="72" font-size="10.5" fill="#666">结果</text>
  <rect x="384" y="78" width="110" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="384" y="78" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="439" y="93" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">user_id | last_stamp</text>
  <text x="439" y="114" text-anchor="middle" font-size="9.5" fill="#333">6 | 2020-06-30</text>
  <text x="439" y="128" text-anchor="middle" font-size="9.5" fill="#333">8 | 2020-12-30</text>
  <text x="439" y="142" text-anchor="middle" font-size="9.5" fill="#333">2 | 2020-01-16</text>

  <!-- Bottom note: execution order -->
  <rect x="40" y="200" width="440" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">SQL 子句执行顺序</text>
  <text x="260" y="240" text-anchor="middle" font-size="10.5" fill="#555">FROM → WHERE → GROUP BY → SELECT(MAX) → 输出</text>
  <text x="260" y="256" text-anchor="middle" font-size="10" fill="#888">WHERE 在 GROUP BY 之前：先把非 2020 年的行丢弃，再分组取 MAX</text>
  <text x="260" y="270" text-anchor="middle" font-size="10" fill="#b85450">⚠ 若先 GROUP BY+MAX 再过滤 → user 6 会取到 2021 年的记录（错误！）</text>

  <!-- Footer -->
  <text x="260" y="310" text-anchor="middle" font-size="10.5" fill="#888">YEAR(time_stamp) = 2020 过滤 | GROUP BY user_id 分组 | MAX(time_stamp) 取最晚</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#aaa">同 184/1831「分组求最值」母题，多了一层 WHERE 年份过滤</text>
</svg>
