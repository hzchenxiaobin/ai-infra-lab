<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [4,−2,2,−4]</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">按 |x| 排序 → [−2, 2, −4, 4]，配成 (−2,−4) 与 (2,4)</text>

  <!-- Original array -->
  <text x="30" y="66" font-size="12" fill="#888">原数组：</text>
  <rect x="100" y="54" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="73" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="148" y="54" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="73" text-anchor="middle" font-size="12" fill="#333">−2</text>
  <rect x="196" y="54" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="73" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="244" y="54" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="73" text-anchor="middle" font-size="12" fill="#333">−4</text>

  <!-- Sort arrow -->
  <text x="310" y="73" font-size="11" fill="#888">→ 按 |x| 排序</text>
  <path d="M 392 68 L 414 68" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sorted by abs -->
  <text x="30" y="108" font-size="12" fill="#d6a040" font-weight="bold">排序后：</text>
  <rect x="100" y="96" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−2</text>
  <rect x="148" y="96" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="196" y="96" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−4</text>
  <rect x="244" y="96" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <text x="122" y="138" text-anchor="middle" font-size="9" fill="#888">|2|</text>
  <text x="170" y="138" text-anchor="middle" font-size="9" fill="#888">|2|</text>
  <text x="218" y="138" text-anchor="middle" font-size="9" fill="#888">|4|</text>
  <text x="266" y="138" text-anchor="middle" font-size="9" fill="#888">|4|</text>

  <!-- Table header -->
  <rect x="30" y="150" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步</text>
  <text x="95" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">x</text>
  <text x="140" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2x</text>
  <text x="200" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">count[x]</text>
  <text x="270" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">count[2x]前</text>
  <text x="345" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">判定</text>
  <text x="440" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">count[2x]后</text>

  <!-- Row 1: x=-2 -->
  <rect x="30" y="176" width="500" height="28" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="194" text-anchor="middle" font-size="11" fill="#333">①</text>
  <text x="95" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−2</text>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−4</text>
  <text x="200" y="194" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="270" y="194" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="345" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ≥ 1 ✓</text>
  <text x="440" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>

  <!-- Row 2: x=2 -->
  <rect x="30" y="206" width="500" height="28" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="224" text-anchor="middle" font-size="11" fill="#333">②</text>
  <text x="95" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="140" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="200" y="224" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="270" y="224" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="345" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ≥ 1 ✓</text>
  <text x="440" y="224" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>

  <!-- Row 3: x=-4 (skip) -->
  <rect x="30" y="236" width="500" height="28" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="254" text-anchor="middle" font-size="11" fill="#888">③</text>
  <text x="95" y="254" text-anchor="middle" font-size="11" fill="#888">−4</text>
  <text x="140" y="254" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="200" y="254" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="270" y="254" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="345" y="254" text-anchor="middle" font-size="11" fill="#888">跳过</text>
  <text x="440" y="254" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 4: x=4 (skip) -->
  <rect x="30" y="266" width="500" height="28" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="284" text-anchor="middle" font-size="11" fill="#888">④</text>
  <text x="95" y="284" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="140" y="284" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="200" y="284" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="345" y="284" text-anchor="middle" font-size="11" fill="#888">跳过</text>
  <text x="440" y="284" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Pairing result -->
  <text x="30" y="324" font-size="12" fill="#4a7a3a" font-weight="bold">配对结果：</text>

  <rect x="120" y="312" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−2</text>
  <path d="M 168 327 L 196 327" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="320" text-anchor="middle" font-size="9" fill="#b85450">×2</text>
  <rect x="196" y="312" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−4</text>

  <rect x="290" y="312" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <path d="M 338 327 L 366 327" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="320" text-anchor="middle" font-size="9" fill="#4a7a3a">×2</text>
  <rect x="366" y="312" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- Result box -->
  <rect x="80" y="362" width="400" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">所有 x 均配对成功 → return true ✅</text>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#888">负数对中 2x 更负，按 |x| 排序后 x 先于 2x 被处理</text>
</svg>
