<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：根 = 全节点集合 − 子节点集合</text>

  <!-- Tree section -->
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#888">一棵 N 叉树（节点顺序被打乱后给出）</text>

  <!-- edges (draw before nodes so nodes cover endpoints) -->
  <path d="M 268 72 Q 220 100 200 116" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 280 78 L 280 116" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 292 72 Q 340 100 360 116" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 184 142 Q 174 170 168 186" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 196 142 Q 210 170 226 186" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- root node 1 (highlighted) -->
  <circle cx="280" cy="60" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- children 3,2,4 -->
  <circle cx="190" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="135" text-anchor="middle" font-size="12" fill="#333">3</text>

  <circle cx="280" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="135" text-anchor="middle" font-size="12" fill="#333">2</text>

  <circle cx="370" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="135" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- grandchildren 5,6 -->
  <circle cx="162" cy="200" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="162" y="205" text-anchor="middle" font-size="12" fill="#333">5</text>

  <circle cx="232" cy="200" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="232" y="205" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- annotation: root has no parent -->
  <text x="330" y="58" font-size="10.5" fill="#b85450" font-weight="bold">← 根（无父节点）</text>

  <!-- Divider -->
  <path d="M 40 240 L 520 240" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="280" y="262" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">集合视角：把"谁有父亲"一次性提取出来</text>

  <!-- All nodes set -->
  <rect x="40" y="282" width="150" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="115" y="302" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">所有节点值</text>
  <text x="115" y="324" text-anchor="middle" font-size="12.5" fill="#333">{1, 2, 3, 4, 5, 6}</text>
  <text x="115" y="340" text-anchor="middle" font-size="10" fill="#888">大小 n = 6</text>

  <!-- minus -->
  <text x="212" y="320" text-anchor="middle" font-size="22" fill="#888" font-weight="bold">−</text>

  <!-- All children set -->
  <rect x="234" y="282" width="150" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="309" y="302" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">所有子节点值</text>
  <text x="309" y="324" text-anchor="middle" font-size="12.5" fill="#333">{2, 3, 4, 5, 6}</text>
  <text x="309" y="340" text-anchor="middle" font-size="10" fill="#888">大小 n−1 = 5（边数）</text>

  <!-- equals -->
  <text x="406" y="320" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">=</text>

  <!-- Root set -->
  <rect x="428" y="282" width="92" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="474" y="302" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">根节点值</text>
  <text x="474" y="324" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">{1}</text>
  <text x="474" y="340" text-anchor="middle" font-size="10" fill="#b85450">唯一元素</text>

  <!-- notes -->
  <text x="50" y="372" font-size="11.5" fill="#555">• 树有 n 个节点、n−1 条边，每条边对应一个"父→子"，故子节点值恰有 n−1 个</text>
  <text x="50" y="392" font-size="11.5" fill="#555">• 值唯一无重复 → 差集大小恰为 <tspan fill="#b85450" font-weight="bold">n − (n−1) = 1</tspan>，即根</text>
  <text x="50" y="412" font-size="11.5" fill="#555">• 一次遍历建子节点集合 + 一次遍历查集合 → <tspan fill="#4a7a3a" font-weight="bold">O(n) 时间 / O(n) 空间</tspan></text>
</svg>
