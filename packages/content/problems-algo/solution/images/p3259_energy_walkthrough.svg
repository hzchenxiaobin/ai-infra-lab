<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：A=[4,1,1]，B=[1,1,3] —— 切换一次反而更优</text>

  <!-- 表头 -->
  <rect x="28" y="38" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="45" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="66" y="38" width="58" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">A[i]</text>
  <rect x="128" y="38" width="58" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="157" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">B[i]</text>
  <rect x="190" y="38" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="228" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">dpA[i]</text>
  <rect x="270" y="38" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="308" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">dpB[i]</text>
  <rect x="350" y="38" width="146" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="423" y="54" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- 第 0 行 -->
  <rect x="28" y="64" width="34" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="66" y="64" width="58" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="128" y="64" width="58" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="190" y="64" width="76" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="270" y="64" width="76" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="350" y="64" width="146" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="423" y="84" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">起手任选一种开喝</text>

  <!-- 第 1 行 -->
  <rect x="28" y="98" width="34" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="66" y="98" width="58" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="128" y="98" width="58" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="190" y="98" width="76" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="270" y="98" width="76" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="350" y="98" width="146" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="423" y="118" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i−2 &lt; 0，只能续杯</text>

  <!-- 第 2 行 -->
  <rect x="28" y="132" width="34" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="66" y="132" width="58" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="128" y="132" width="58" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="190" y="132" width="76" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="270" y="132" width="76" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="152" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="350" y="132" width="146" height="32" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="423" y="146" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">从 dpA[0]=4 切换而来</text>
  <text x="423" y="159" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">max(2, 4) + 3 = 7</text>

  <!-- 答案 -->
  <rect x="28" y="176" width="468" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="262" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = max(dpA[2], dpB[2]) = max(6, 7) = 7</text>

  <!-- 最优路径 -->
  <text x="60" y="232" text-anchor="start" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">最优路径（dpB[2] 的来路）：</text>

  <text x="100" y="240" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第 1 小时</text>
  <rect x="60" y="244" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">喝 A</text>
  <text x="100" y="280" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">+4</text>

  <text x="210" y="240" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第 2 小时</text>
  <rect x="170" y="244" width="80" height="44" fill="#eeeeee" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="264" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">休整</text>
  <text x="210" y="280" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">+0</text>

  <text x="320" y="240" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第 3 小时</text>
  <rect x="280" y="244" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">喝 B</text>
  <text x="320" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+3</text>

  <path d="M 142 266 L 166 266" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 252 266 L 276 266" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="398" y="272" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 7</text>

  <text x="60" y="316" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">dpB[2] = dpA[0] + 0 + B[2] = 4 + 0 + 3 = 7（切换分支胜出）</text>

  <!-- 对照示例 1 -->
  <rect x="28" y="330" width="468" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="262" y="347" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">对照示例 1 [1,3,1]/[3,1,1]：两边都平淡，最优是全程不切换——dpA 一路续杯得 5</text>
</svg>
