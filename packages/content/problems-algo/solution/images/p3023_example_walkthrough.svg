<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：stream = [1,0,1,1,0,1]，pattern = [1,1,0,1] → 输出 2</text>

  <!-- stream strip -->
  <text x="48" y="60" font-size="11.5" fill="#888" filter="url(#rough2)">stream =</text>
  <rect x="198" y="32" width="188" height="46" fill="none" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="110" y="36" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="59" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="156" y="36" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="59" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="202" y="36" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="59" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="248" y="36" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="59" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="294" y="36" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="59" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="340" y="36" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="59" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="388" y="60" font-size="16" fill="#555" filter="url(#rough2)">…</text>
  <text x="130" y="86" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="176" y="86" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="222" y="86" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=2</text>
  <text x="268" y="86" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=3</text>
  <text x="314" y="86" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=4</text>
  <text x="360" y="86" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=5</text>
  <text x="292" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中区间 [2..5] == pattern ✓</text>

  <!-- check marks -->
  <text x="222" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="268" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="314" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="360" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- pattern row -->
  <text x="48" y="132" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pattern =</text>
  <rect x="202" y="108" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="131" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="248" y="108" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="131" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="294" y="108" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="131" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="340" y="108" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="131" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="416" y="128" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">起点 = 5−4+1 = 2 ✓</text>

  <!-- fail row -->
  <text x="48" y="172" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">fail =</text>
  <rect x="202" y="154" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="222" y="171" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="248" y="154" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="268" y="171" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="294" y="154" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="171" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="340" y="154" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="171" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="416" y="162" font-size="9.5" fill="#888" filter="url(#rough2)">pattern[0..i] 的</text>
  <text x="416" y="176" font-size="9.5" fill="#888" filter="url(#rough2)">最长相等真前后缀</text>

  <!-- walkthrough table -->
  <rect x="44" y="190" width="432" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="112" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="216" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">失配回退动作</text>
  <text x="326" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j（本轮末）</text>
  <text x="360" y="206" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">说明</text>

  <rect x="44" y="214" width="432" height="150" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="45" y="239" width="430" height="25" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="45" y="339" width="430" height="25" fill="#e6f4ea" filter="url(#rough2)"/>

  <path d="M 44 239 L 476 239 M 44 264 L 476 264 M 44 289 L 476 289 M 44 314 L 476 314 M 44 339 L 476 339" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <path d="M 92 190 L 92 364 M 132 190 L 132 364 M 300 190 L 300 364 M 352 190 L 352 364" stroke="#ccc" stroke-width="0.8" fill="none" filter="url(#rough2)"/>

  <text x="68" y="231" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="112" y="231" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="216" y="231" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="326" y="231" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="360" y="231" font-size="10" fill="#555" filter="url(#rough2)">1 == pattern[0]，接上</text>

  <text x="68" y="256" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="112" y="256" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="216" y="256" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">j: 1→0（fail[0]=0）</text>
  <text x="326" y="256" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="360" y="256" font-size="10" fill="#555" filter="url(#rough2)">回退后仍失配，停在 0</text>

  <text x="68" y="281" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="112" y="281" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="216" y="281" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="326" y="281" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="360" y="281" font-size="10" fill="#555" filter="url(#rough2)">重新接上 pattern[0]</text>

  <text x="68" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="112" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="216" y="306" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="326" y="306" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="360" y="306" font-size="10" fill="#555" filter="url(#rough2)">续接 pattern[1]</text>

  <text x="68" y="331" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="112" y="331" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="216" y="331" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="326" y="331" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="360" y="331" font-size="10" fill="#555" filter="url(#rough2)">续接 pattern[2]</text>

  <text x="68" y="356" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="112" y="356" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="216" y="356" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="326" y="356" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">4 = m</text>
  <text x="360" y="356" font-size="10" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">命中！返回 5−4+1=2 ✓</text>

  <!-- bottom note -->
  <rect x="44" y="374" width="432" height="52" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="394" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i=1 失配：j 从 1 回退到 0，但已读比特一次都不用重读</text>
  <text x="260" y="414" text-anchor="middle" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">i=5 命中：j = 4 = m → 起点下标 = 5 − 4 + 1 = 2 ✓</text>
</svg>
