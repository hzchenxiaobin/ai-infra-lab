<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 550" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="550" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">顺次数 —— 枚举算法流程</text>

  <!-- 1. 开始 -->
  <ellipse cx="170" cy="50" rx="38" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="55" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">开始</text>
  <path d="M 170 65 L 170 76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. L ← 2 -->
  <rect x="90" y="78" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="97" text-anchor="middle" font-size="12" fill="#333">L ← 2  （外层：位数 2 → 9）</text>
  <path d="M 170 106 L 170 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. d ← 1 -->
  <rect x="90" y="120" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="139" text-anchor="middle" font-size="12" fill="#333">d ← 1  （首位，d ≤ 10 − L）</text>
  <path d="M 170 148 L 170 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 构造 num -->
  <rect x="70" y="162" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="184" text-anchor="middle" font-size="12" fill="#333">num ← 顺序拼接 d, d+1, …, d+L−1</text>
  <path d="M 170 196 L 170 206" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. diamond: num > high? -->
  <polygon points="170,210 244,236 170,262 96,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="240" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">num &gt; high?</text>
  <!-- yes -> 返回 res (终止) -->
  <path d="M 244 236 L 326 236" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <ellipse cx="392" cy="236" rx="52" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="241" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 res（终止）</text>
  <!-- no -> down -->
  <path d="M 170 262 L 170 272" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="270" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 6. diamond: num ≥ low? -->
  <polygon points="170,276 240,302 170,328 100,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="306" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">num ≥ low?</text>
  <!-- yes -> res.append (dashed) -->
  <path d="M 240 302 L 318 302" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="320" y="286" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="390" y="306" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">res.append(num)</text>
  <!-- down -->
  <path d="M 170 328 L 170 340" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 7. d ← d + 1 -->
  <rect x="90" y="342" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="361" text-anchor="middle" font-size="12" fill="#333">d ← d + 1</text>
  <path d="M 170 370 L 170 380" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 8. diamond: d ≤ 10−L? -->
  <polygon points="170,384 246,410 170,436 94,410" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="414" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">d ≤ 10 − L ?</text>
  <!-- yes -> loop back to 构造 num -->
  <path d="M 94 410 L 46 410 L 46 179 L 66 179" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="54" y="300" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- no -> down -->
  <path d="M 170 436 L 170 446" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="444" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- 9. L ← L + 1 -->
  <rect x="90" y="448" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="467" text-anchor="middle" font-size="12" fill="#333">L ← L + 1</text>
  <path d="M 170 476 L 170 486" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 10. diamond: L ≤ 9? -->
  <polygon points="170,490 240,516 170,542 100,516" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="520" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">L ≤ 9 ?</text>
  <!-- yes -> loop back to d ← 1 -->
  <path d="M 100 516 L 28 516 L 28 134 L 86 134" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="330" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
</svg>
