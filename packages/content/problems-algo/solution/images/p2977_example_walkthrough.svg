<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：dp[i] = 前 i 个字符的最小转换成本</text>

  <rect x="150" y="42" width="112" height="76" rx="8" fill="#e6f4ea" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="38" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">区间 [1,3]</text>
  <rect x="294" y="42" width="112" height="76" rx="8" fill="#fff8e1" fill-opacity="0.6" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="38" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">区间 [5,7]</text>

  <text x="108" y="67" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">source</text>
  <g font-size="12" fill="#333">
    <rect x="116" y="48" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="134" y="66" text-anchor="middle" filter="url(#rough2)">a</text>
    <rect x="152" y="48" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="170" y="66" text-anchor="middle" filter="url(#rough2)">b</text>
    <rect x="188" y="48" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="206" y="66" text-anchor="middle" filter="url(#rough2)">c</text>
    <rect x="224" y="48" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="242" y="66" text-anchor="middle" filter="url(#rough2)">d</text>
    <rect x="260" y="48" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="278" y="66" text-anchor="middle" filter="url(#rough2)">e</text>
    <rect x="296" y="48" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="314" y="66" text-anchor="middle" filter="url(#rough2)">f</text>
    <rect x="332" y="48" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="350" y="66" text-anchor="middle" filter="url(#rough2)">g</text>
    <rect x="368" y="48" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="386" y="66" text-anchor="middle" filter="url(#rough2)">h</text>
  </g>

  <text x="108" y="107" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">target</text>
  <g font-size="12" fill="#333">
    <rect x="116" y="90" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="134" y="108" text-anchor="middle" filter="url(#rough2)">a</text>
    <rect x="152" y="90" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="170" y="108" text-anchor="middle" filter="url(#rough2)">c</text>
    <rect x="188" y="90" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="206" y="108" text-anchor="middle" filter="url(#rough2)">d</text>
    <rect x="224" y="90" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="242" y="108" text-anchor="middle" filter="url(#rough2)">e</text>
    <rect x="260" y="90" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="278" y="108" text-anchor="middle" filter="url(#rough2)">e</text>
    <rect x="296" y="90" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="314" y="108" text-anchor="middle" filter="url(#rough2)">g</text>
    <rect x="332" y="90" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="350" y="108" text-anchor="middle" filter="url(#rough2)">h</text>
    <rect x="368" y="90" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/><text x="386" y="108" text-anchor="middle" filter="url(#rough2)">h</text>
  </g>

  <path d="M 129 148 C 150 124, 246 124, 265 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="198" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">区间 [1,3)：bcd→cde，dist = 1</text>
  <path d="M 83 152 L 123 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="103" y="145" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">a==a</text>
  <path d="M 269 152 L 309 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="289" y="145" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">e==e</text>
  <path d="M 315 148 C 336 122, 428 122, 447 146" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="382" y="126" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">区间 [5,8)：fgh⇝ghh，dist = 3+5 = 8</text>

  <g font-size="10" fill="#666">
    <text x="83" y="168" text-anchor="middle" filter="url(#rough2)">dp[0]</text>
    <text x="129" y="168" text-anchor="middle" filter="url(#rough2)">dp[1]</text>
    <text x="175" y="168" text-anchor="middle" filter="url(#rough2)">dp[2]</text>
    <text x="221" y="168" text-anchor="middle" filter="url(#rough2)">dp[3]</text>
    <text x="267" y="168" text-anchor="middle" filter="url(#rough2)">dp[4]</text>
    <text x="313" y="168" text-anchor="middle" filter="url(#rough2)">dp[5]</text>
    <text x="359" y="168" text-anchor="middle" filter="url(#rough2)">dp[6]</text>
    <text x="405" y="168" text-anchor="middle" filter="url(#rough2)">dp[7]</text>
    <text x="451" y="168" text-anchor="middle" filter="url(#rough2)">dp[8]</text>
  </g>
  <g font-size="14">
    <rect x="60" y="172" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="83" y="194" text-anchor="middle" fill="#334" font-weight="bold" filter="url(#rough2)">0</text>
    <rect x="106" y="172" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="129" y="194" text-anchor="middle" fill="#334" font-weight="bold" filter="url(#rough2)">0</text>
    <rect x="152" y="172" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/><text x="175" y="194" text-anchor="middle" fill="#b85450" filter="url(#rough2)">∞</text>
    <rect x="198" y="172" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/><text x="221" y="194" text-anchor="middle" fill="#b85450" filter="url(#rough2)">∞</text>
    <rect x="244" y="172" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/><text x="267" y="194" text-anchor="middle" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="290" y="172" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/><text x="313" y="194" text-anchor="middle" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="336" y="172" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/><text x="359" y="194" text-anchor="middle" fill="#b85450" filter="url(#rough2)">∞</text>
    <rect x="382" y="172" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/><text x="405" y="194" text-anchor="middle" fill="#b85450" filter="url(#rough2)">∞</text>
    <rect x="428" y="172" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/><text x="451" y="194" text-anchor="middle" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  </g>

  <rect x="40" y="238" width="440" height="112" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">dp[2] = dp[3] = ∞：位置 1 的 b→c 没有长度 ≤ 2 的词可套，</text>
  <text x="260" y="278" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">但 dp[1] 用区间 [1,3) 一步跨到 dp[4]，不必逐位硬啃。</text>
  <text x="260" y="296" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">dp[5]→dp[8]：fgh→thh(3)→ghh(5)，同一区间链式两步，dist = 8。</text>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">答案 dp[8] = 0 + 1 + 0 + 8 = 9 ✓</text>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">示例 3：dp[3] = ∞ 卡死 [3,8) 路线，重叠区间不许绕道 ⇒ 返回 −1</text>
</svg>
