<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两个示例的贪心扫描过程</text>

  <text x="44" y="68" font-size="12" fill="#888" font-weight="bold">示例 1</text>
  <text x="100" y="68" font-size="11" fill="#888">bits = [1, 0, 0]，n = 3</text>

  <text x="44" y="100" font-size="10" fill="#888">下标</text>
  <rect x="90" y="84" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="103" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="156" y="84" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="103" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="222" y="84" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="252" y="103" text-anchor="middle" font-size="11" fill="#999">2</text>

  <text x="44" y="132" font-size="10" fill="#888">位值</text>
  <rect x="90" y="116" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="116" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="222" y="116" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="137" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="290" y="135" font-size="10" fill="#4a7a3a">末位</text>

  <text x="44" y="166" font-size="10" fill="#888">动作</text>
  <rect x="90" y="158" width="126" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="153" y="172" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=0: bits[0]=1 → i+=2</text>
  <rect x="222" y="158" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="252" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=2: 0</text>
  <text x="290" y="172" font-size="10" fill="#4a7a3a">→ i+=1</text>

  <rect x="90" y="186" width="372" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="276" y="200" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i 终止于 2 == n-1  →  return true</text>

  <line x1="40" y1="226" x2="520" y2="226" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="44" y="252" font-size="12" fill="#888" font-weight="bold">示例 2</text>
  <text x="100" y="252" font-size="11" fill="#888">bits = [1, 1, 1, 0]，n = 4</text>

  <text x="44" y="284" font-size="10" fill="#888">下标</text>
  <rect x="90" y="268" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="287" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="156" y="268" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="287" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="222" y="268" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="252" y="287" text-anchor="middle" font-size="11" fill="#999">2</text>
  <rect x="288" y="268" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="318" y="287" text-anchor="middle" font-size="11" fill="#999">3</text>

  <text x="44" y="316" font-size="10" fill="#888">位值</text>
  <rect x="90" y="300" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="321" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="300" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="321" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="222" y="300" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="321" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="288" y="300" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="321" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="356" y="319" font-size="10" fill="#4a7a3a">末位</text>

  <text x="44" y="350" font-size="10" fill="#888">动作</text>
  <rect x="90" y="342" width="126" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="153" y="356" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=0: bits[0]=1 → i+=2</text>
  <rect x="222" y="342" width="126" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="285" y="356" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=2: bits[2]=1 → i+=2</text>
  <text x="356" y="356" font-size="10" fill="#b85450" font-weight="bold">越过末位</text>

  <rect x="90" y="370" width="372" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="276" y="384" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i 终止于 4 == n  →  return false</text>

  <rect x="40" y="398" width="480" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#666">对比：示例 1 末位 0 被孤立 → true；示例 2 末位 0 被前 1 拼成 10 → false</text>
</svg>
