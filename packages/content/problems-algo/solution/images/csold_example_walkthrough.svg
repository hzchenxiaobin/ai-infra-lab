<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：连续段 → 三角形数 → 求和</text>

  <!-- table header -->
  <rect x="20" y="42" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="61" font-size="10.5" fill="#444" font-weight="bold">s</text>
  <text x="160" y="61" font-size="10.5" fill="#444" font-weight="bold">连续段 (c:L)</text>
  <text x="300" y="61" font-size="10.5" fill="#444" font-weight="bold">各段贡献</text>
  <text x="475" y="61" font-size="10.5" fill="#444" font-weight="bold">ans</text>

  <!-- Row 1: aaaba -->
  <rect x="20" y="70" width="520" height="56" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="92" font-size="11" fill="#333" font-weight="bold">"aaaba"</text>
  <text x="50" y="110" font-size="9.5" fill="#888">三段：3,1,1</text>
  <text x="160" y="92" font-size="10.5" fill="#444">a:3  b:1  a:1</text>
  <text x="160" y="110" font-size="9.5" fill="#888">跨段不计入</text>
  <text x="300" y="92" font-size="10.5" fill="#555">6 + 1 + 1</text>
  <text x="300" y="110" font-size="9.5" fill="#888">3·4/2 + 1·2/2 + 1·2/2</text>
  <text x="475" y="103" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- Row 2: aaaaaaaaaa -->
  <rect x="20" y="126" width="520" height="56" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="148" font-size="11" fill="#333" font-weight="bold">"aaaa…aaa"</text>
  <text x="50" y="166" font-size="9.5" fill="#888">10 个 a，一段</text>
  <text x="160" y="148" font-size="10.5" fill="#444">a:10</text>
  <text x="160" y="166" font-size="9.5" fill="#888">单一连续段</text>
  <text x="300" y="148" font-size="10.5" fill="#555">55</text>
  <text x="300" y="166" font-size="9.5" fill="#888">10·11/2</text>
  <text x="475" y="159" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">55</text>

  <!-- 逐位累加视角 -->
  <text x="280" y="208" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">逐位累加视角（以 "aaaba" 为例）</text>

  <!-- position cells: i=0..4 -->
  <!-- i=0: a, cnt=1, +1 -->
  <rect x="100" y="222" width="64" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="132" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <line x1="108" y1="250" x2="156" y2="250" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="132" y="266" text-anchor="middle" font-size="10" fill="#555">cnt=1</text>
  <line x1="108" y1="274" x2="156" y2="274" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="132" y="282" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">+1</text>
  <text x="132" y="300" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <!-- i=1: a, cnt=2, +2 -->
  <rect x="174" y="222" width="64" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="206" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <line x1="182" y1="250" x2="230" y2="250" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="206" y="266" text-anchor="middle" font-size="10" fill="#555">cnt=2</text>
  <line x1="182" y1="274" x2="230" y2="274" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="206" y="282" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">+2</text>
  <text x="206" y="300" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <!-- i=2: a, cnt=3, +3 -->
  <rect x="248" y="222" width="64" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <line x1="256" y1="250" x2="304" y2="250" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#555">cnt=3</text>
  <line x1="256" y1="274" x2="304" y2="274" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">+3</text>
  <text x="280" y="300" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <!-- i=3: b, cnt=1, +1 -->
  <rect x="322" y="222" width="64" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="354" y="242" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>
  <line x1="330" y1="250" x2="378" y2="250" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="354" y="266" text-anchor="middle" font-size="10" fill="#555">cnt=1</text>
  <line x1="330" y1="274" x2="378" y2="274" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="354" y="282" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">+1</text>
  <text x="354" y="300" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <!-- i=4: a, cnt=1, +1 -->
  <rect x="396" y="222" width="64" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="428" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <line x1="404" y1="250" x2="452" y2="250" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="266" text-anchor="middle" font-size="10" fill="#555">cnt=1</text>
  <line x1="404" y1="274" x2="452" y2="274" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="282" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">+1</text>
  <text x="428" y="300" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <!-- sum -->
  <text x="280" y="328" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">ans = 1 + 2 + 3 + 1 + 1 = 8</text>

  <!-- footer -->
  <rect x="30" y="346" width="500" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="9.5" fill="#888">逐位视角：以 i 为右端点的合法子串恰有 cnt 个 → 累加即得段内 1+2+…+L</text>
</svg>
