<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：二分阈值 x ——「只保留 cost ≥ x 的边」再跑最短路</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">阈值越高可用边越少 ⇒ 0→n−1 最小总成本单调不减 ⇒ check(x) 单调，可二分</text>

  <path d="M 60 108 L 452 108" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="112" font-size="10.5" fill="#446688" filter="url(#rough2)">边成本</text>

  <path d="M 265 76 L 265 136" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="265" y="68" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">阈值 x</text>

  <rect x="127" y="99" width="26" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="112" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="192" y="99" width="26" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="112" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="302" y="99" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <rect x="362" y="99" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <text x="155" y="134" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">cost &lt; x ⇒ 滤掉 ✗</text>
  <text x="380" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cost ≥ x ⇒ 保留 ✓</text>

  <rect x="18" y="158" width="234" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="178" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 6：check ✓</text>

  <circle cx="58" cy="252" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="135" cy="252" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="212" cy="252" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 71 252 L 118 252" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="95" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <path d="M 148 252 L 195 252" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="172" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">6</text>

  <circle cx="95" cy="207" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="211" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 67 241 L 84 218" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="63" y="226" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">7</text>
  <path d="M 106 215 L 197 246" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="152" y="222" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">5 &lt; 6 被滤 ✗</text>

  <text x="135" y="282" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（节点 3 离线，2→3、3→4 一开始就剔除）</text>
  <text x="135" y="298" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">最短路 0→2→4 = 12 ≤ k ✓</text>

  <rect x="268" y="158" width="234" height="148" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="178" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">x = 7：check ✗</text>

  <circle cx="308" cy="252" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="308" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="385" cy="252" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="462" cy="252" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="462" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 321 252 L 368 252" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="345" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <path d="M 398 252 L 445 252" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="422" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">5 &lt; 7 被滤 ✗</text>

  <text x="385" y="282" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（0→2(6)、2→4(6) 同样被滤掉）</text>
  <text x="385" y="298" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">仅剩 0→1，终点不可达 ✗</text>

  <text x="262" y="316" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = 最后一个 true 的 x</text>

  <rect x="40" y="322" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="339" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">check(x) = true</text>
  <rect x="280" y="322" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="339" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">check(x) = false</text>
  <path d="M 280 314 L 280 356" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <rect x="70" y="362" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="378" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2 ✓</text>
  <rect x="126" y="362" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="378" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">5 ✓</text>
  <rect x="182" y="362" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="378" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6 ✓</text>
  <rect x="238" y="362" width="48" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="378" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">7 ✗</text>

  <text x="396" y="370" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">在去重边权集合 vals 上二分</text>
  <text x="396" y="385" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">O(log m) 次 check</text>

  <text x="260" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">答案必等于某条边的 cost ⇒ 候选值天然离散，值域 10⁹ 也只需二分 log m 层</text>
</svg>
