<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">写入过程：非零搬到 slow，零跳过</text>

  <!-- ========= Frame A: fast hits nonzero ========= -->
  <text x="20" y="56" font-size="12.5" fill="#4a7a3a" font-weight="bold">情形 A：nums[fast] ≠ 0（搬运）</text>

  <!-- before -->
  <text x="20" y="84" font-size="10.5" fill="#888">搬运前：</text>
  <rect x="80" y="70" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="88" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="128" y="70" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="176" y="70" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="224" y="70" width="44" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="246" y="88" text-anchor="middle" font-size="11" fill="#aaa">?</text>

  <text x="150" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">slow</text>
  <path d="M 150 116 L 150 100" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="198" y="112" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">fast</text>
  <path d="M 198 116 L 198 100" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- arrow down -->
  <path d="M 280 96 L 280 128" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="296" y="118" font-size="10.5" fill="#d6a040" font-weight="bold">nums[slow]=nums[fast]</text>

  <!-- after -->
  <text x="20" y="156" font-size="10.5" fill="#888">搬运后：</text>
  <rect x="80" y="142" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="160" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="128" y="142" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="176" y="142" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="198" y="160" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <rect x="224" y="142" width="44" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="246" y="160" text-anchor="middle" font-size="11" fill="#aaa">?</text>

  <text x="176" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">slow+1</text>
  <path d="M 176 190 L 176 172" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="246" y="186" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">fast+1</text>
  <path d="M 246 190 L 246 172" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="320" y="158" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ 非零已就位，slow 前进</text>

  <!-- divider -->
  <line x1="20" y1="208" x2="540" y2="208" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ========= Frame B: fast hits zero ========= -->
  <text x="20" y="236" font-size="12.5" fill="#b85450" font-weight="bold">情形 B：nums[fast] == 0（跳过）</text>

  <!-- before -->
  <text x="20" y="264" font-size="10.5" fill="#888">跳过前：</text>
  <rect x="80" y="250" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="268" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="128" y="250" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="176" y="250" width="44" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="198" y="268" text-anchor="middle" font-size="11" fill="#aaa">?</text>
  <rect x="224" y="250" width="44" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="246" y="268" text-anchor="middle" font-size="11" fill="#aaa">?</text>

  <text x="150" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">slow</text>
  <path d="M 150 296 L 150 280" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">fast（指向0）</text>
  <path d="M 150 316 L 150 300" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="320" y="268" font-size="10.5" fill="#b85450" font-weight="bold">→ 什么都不做</text>

  <!-- after: only fast moves -->
  <text x="20" y="336" font-size="10.5" fill="#888">跳过后：</text>
  <rect x="80" y="322" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="340" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="128" y="322" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="176" y="322" width="44" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="198" y="340" text-anchor="middle" font-size="11" fill="#aaa">?</text>
  <rect x="224" y="322" width="44" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="246" y="340" text-anchor="middle" font-size="11" fill="#aaa">?</text>

  <text x="150" y="366" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">slow 不动</text>
  <text x="198" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">fast+1</text>
  <path d="M 198 362 L 198 352" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="320" y="340" font-size="10.5" fill="#b85450" font-weight="bold">slow 留在原地，等下一个非零</text>
</svg>
