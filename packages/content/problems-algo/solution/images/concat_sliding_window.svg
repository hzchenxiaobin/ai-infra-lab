<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：单词等长 → 按 w 切成"单词块"，窗口恰好覆盖 m 个块</text>

  <!-- note -->
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">s = "barfoothefoobarman"，words = ["foo","bar"]，w = 3，m = 2</text>

  <!-- index labels -->
  <text x="80" y="68" font-size="10" fill="#888">下标:</text>
  <text x="115" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="185" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="255" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="325" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">9</text>
  <text x="395" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">12</text>
  <text x="465" y="68" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">15</text>

  <!-- chunk cells -->
  <rect x="80" y="74" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">bar</text>
  <rect x="150" y="74" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">foo</text>
  <rect x="220" y="74" width="70" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="95" text-anchor="middle" font-size="13" fill="#999">the</text>
  <rect x="290" y="74" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">foo</text>
  <rect x="360" y="74" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">bar</text>
  <rect x="430" y="74" width="70" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="95" text-anchor="middle" font-size="13" fill="#999">man</text>

  <!-- bracket 1: cells 0,1 green match -->
  <path d="M 80 118 Q 80 126 86 126 L 214 126 Q 220 126 220 118" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="150" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口=[bar,foo] 匹配目标 {foo:1,bar:1} ✓ → 记录 0</text>

  <!-- bracket 2: cells 1,2 red reset -->
  <path d="M 150 160 Q 150 168 156 168 L 284 168 Q 290 168 290 160" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="220" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">窗口=[foo,the] → "the" 不在目标 → 清空，left 跳过 the</text>

  <!-- bracket 3: cells 3,4 green match -->
  <path d="M 290 202 Q 290 210 296 210 L 424 210 Q 430 210 430 202" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="360" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口=[foo,bar] 匹配 ✓ → 记录 9</text>

  <!-- offset class box -->
  <rect x="40" y="250" width="500" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">起点偏移 offset ∈ [0, w)</text>
  <text x="290" y="291" text-anchor="middle" font-size="11" fill="#666">w=3 → 3 种切分方式：offset=0 在 0,3,6,9…；offset=1 在 1,4,7,10…；offset=2 在 2,5,8,11…</text>
  <text x="290" y="309" text-anchor="middle" font-size="11" fill="#888">每种 offset 独立跑一次滑窗，合起来覆盖所有可能的合法起点</text>

  <!-- core idea box -->
  <rect x="40" y="338" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">把"字符级滑窗"升级为"单词级滑窗"</text>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#666">用哈希计数维护窗口内单词频率，超量时从左收缩；窗口凑满 m 个单词即命中</text>
  <text x="290" y="393" text-anchor="middle" font-size="11" fill="#888">复杂度从暴力 O(n·m·w) 降到 O(n·w)</text>
</svg>
