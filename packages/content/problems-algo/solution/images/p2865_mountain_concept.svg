<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">山脉状塔：固定峰值 i，塔高 = min 向两侧传播</text>

  <!-- maxHeights 数组 -->
  <text x="42" y="64" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">maxHeights</text>
  <rect x="130" y="46" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="190" y="46" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="250" y="46" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="310" y="46" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="65" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="370" y="46" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="430" y="46" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- 峰值标注 -->
  <path d="M 338 78 L 338 108" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="338" y="124" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">选峰值 i=3</text>

  <!-- 柱状图：基线 y=330，1 单位 = 9px -->
  <!-- 上限柱（虚线描边） -->
  <rect x="82" y="276" width="46" height="54" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" rx="3" filter="url(#rough2)"/>
  <rect x="152" y="285" width="46" height="45" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" rx="3" filter="url(#rough2)"/>
  <rect x="222" y="303" width="46" height="27" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" rx="3" filter="url(#rough2)"/>
  <rect x="292" y="249" width="46" height="81" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,4" rx="3" filter="url(#rough2)"/>
  <rect x="362" y="312" width="46" height="18" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" rx="3" filter="url(#rough2)"/>
  <rect x="432" y="267" width="46" height="63" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" rx="3" filter="url(#rough2)"/>

  <!-- 实际塔高柱（实心） -->
  <rect x="82" y="303" width="46" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="152" y="303" width="46" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="222" y="303" width="46" height="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="292" y="249" width="46" height="81" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <rect x="362" y="312" width="46" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="432" y="312" width="46" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>

  <!-- 塔高数值 -->
  <text x="105" y="297" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="175" y="297" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="245" y="297" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="315" y="243" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="385" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="455" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 上限数值（虚线柱顶） -->
  <text x="66" y="272" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="146" y="281" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="216" y="299" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="286" y="245" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">9</text>
  <text x="356" y="308" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="426" y="263" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">7</text>

  <!-- 基线 -->
  <path d="M 70 331 L 490 331" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 下标 -->
  <text x="105" y="348" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="175" y="348" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="245" y="348" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="315" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="385" y="348" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="455" y="348" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>

  <!-- min 传播箭头 -->
  <path d="M 286 172 L 116 172" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="164" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">向左传播 min：越不过 9，也越不过沿途上限</text>
  <path d="M 344 172 L 454 172" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">向右传播 min</text>

  <!-- 结论框 -->
  <rect x="70" y="362" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="381" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">左半塔高 t[k] = min(maxHeights[k..i])，右半对称 → 和 = 22</text>

  <!-- 图例 -->
  <text x="510" y="290" font-size="10" fill="#999" filter="url(#rough2)">虚线 = 上限</text>
  <text x="510" y="306" font-size="10" fill="#446688" filter="url(#rough2)">实心 = 实际塔高</text>
</svg>
