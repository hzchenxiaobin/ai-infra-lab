<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心概念：从 (0,0) 到 (m-1,n-1) 只向右/下走，路径括号串需合法</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">合法 = 全程 balance ≥ 0 且终点 balance = 0；路径长 m+n−1 必须为偶数</text>

  <!-- ===== Grid 4x3 (example 1) ===== -->
  <text x="135" y="80" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">grid 4×3（示例 1）</text>
  <g font-size="17" font-weight="bold">
    <!-- Row 0 : ( ( ( -->
    <rect x="60" y="92" width="50" height="50" fill="#e8f0fe" stroke="#b85450" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
    <text x="85" y="125" text-anchor="middle" fill="#333">(</text>
    <rect x="110" y="92" width="50" height="50" fill="#e8f0fe" stroke="#b85450" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
    <text x="135" y="125" text-anchor="middle" fill="#333">(</text>
    <rect x="160" y="92" width="50" height="50" fill="#e8f0fe" stroke="#b85450" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
    <text x="185" y="125" text-anchor="middle" fill="#333">(</text>
    <!-- Row 1 : ) ( ) -->
    <rect x="60" y="142" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="85" y="175" text-anchor="middle" fill="#333">)</text>
    <rect x="110" y="142" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="135" y="175" text-anchor="middle" fill="#333">(</text>
    <rect x="160" y="142" width="50" height="50" fill="#e6f4ea" stroke="#b85450" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
    <text x="185" y="175" text-anchor="middle" fill="#333">)</text>
    <!-- Row 2 : ( ( ) -->
    <rect x="60" y="192" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="85" y="225" text-anchor="middle" fill="#333">(</text>
    <rect x="110" y="192" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="135" y="225" text-anchor="middle" fill="#333">(</text>
    <rect x="160" y="192" width="50" height="50" fill="#e6f4ea" stroke="#b85450" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
    <text x="185" y="225" text-anchor="middle" fill="#333">)</text>
    <!-- Row 3 : ( ( ) -->
    <rect x="60" y="242" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="85" y="275" text-anchor="middle" fill="#333">(</text>
    <rect x="110" y="242" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="135" y="275" text-anchor="middle" fill="#333">(</text>
    <rect x="160" y="242" width="50" height="50" fill="#e6f4ea" stroke="#b85450" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
    <text x="185" y="275" text-anchor="middle" fill="#333">)</text>
  </g>

  <!-- start / end markers -->
  <text x="85" y="88" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">起</text>
  <text x="185" y="310" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">终</text>

  <!-- path step badges 1..6 on path cells -->
  <g font-size="9.5" font-weight="bold">
    <circle cx="70" cy="102" r="9" fill="#b85450" filter="url(#rough2)"/>
    <text x="70" y="106" text-anchor="middle" fill="#fff">1</text>
    <circle cx="120" cy="102" r="9" fill="#b85450" filter="url(#rough2)"/>
    <text x="120" y="106" text-anchor="middle" fill="#fff">2</text>
    <circle cx="170" cy="102" r="9" fill="#b85450" filter="url(#rough2)"/>
    <text x="170" y="106" text-anchor="middle" fill="#fff">3</text>
    <circle cx="170" cy="152" r="9" fill="#b85450" filter="url(#rough2)"/>
    <text x="170" y="156" text-anchor="middle" fill="#fff">4</text>
    <circle cx="170" cy="202" r="9" fill="#b85450" filter="url(#rough2)"/>
    <text x="170" y="206" text-anchor="middle" fill="#fff">5</text>
    <circle cx="170" cy="252" r="9" fill="#b85450" filter="url(#rough2)"/>
    <text x="170" y="256" text-anchor="middle" fill="#fff">6</text>
  </g>

  <!-- path connecting polyline (right,right,down,down,down) -->
  <path d="M 85 117 H 185 V 267" fill="none" stroke="#b85450" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Right: path string + balance ===== -->
  <text x="400" y="80" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">沿路径读取 → 字符 + balance</text>

  <g font-size="16" font-weight="bold">
    <!-- 6 boxes: ( ( ( ) ) ) -->
    <rect x="255" y="100" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="276" y="128" text-anchor="middle" fill="#333">(</text>
    <rect x="303" y="100" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="324" y="128" text-anchor="middle" fill="#333">(</text>
    <rect x="351" y="100" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="372" y="128" text-anchor="middle" fill="#333">(</text>
    <rect x="399" y="100" width="42" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="420" y="128" text-anchor="middle" fill="#333">)</text>
    <rect x="447" y="100" width="42" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="468" y="128" text-anchor="middle" fill="#333">)</text>
    <rect x="495" y="100" width="42" height="40" fill="#e6f4ea" stroke="#b85450" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
    <text x="516" y="128" text-anchor="middle" fill="#333">)</text>
  </g>

  <!-- balance pills below each box -->
  <g font-size="11" font-weight="bold">
    <rect x="261" y="150" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
    <text x="276" y="164" text-anchor="middle" fill="#333">1</text>
    <rect x="309" y="150" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
    <text x="324" y="164" text-anchor="middle" fill="#333">2</text>
    <rect x="357" y="150" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
    <text x="372" y="164" text-anchor="middle" fill="#333">3</text>
    <rect x="405" y="150" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
    <text x="420" y="164" text-anchor="middle" fill="#333">2</text>
    <rect x="453" y="150" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
    <text x="468" y="164" text-anchor="middle" fill="#333">1</text>
    <rect x="501" y="150" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="516" y="164" text-anchor="middle" fill="#b85450">0</text>
  </g>
  <text x="276" y="186" text-anchor="middle" font-size="8.5" fill="#888">bal</text>

  <!-- right-side notes -->
  <rect x="255" y="206" width="282" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="266" y="226" font-size="10.5" fill="#333" font-weight="bold">串 = “((()))”</text>
  <text x="266" y="244" font-size="10" fill="#444">• 全程 balance ∈ {1,2,3,2,1,0} ≥ 0 ✓</text>
  <text x="266" y="260" font-size="10" fill="#444">• 终点 balance = 0 ✓ → 合法 → 返回 true</text>
  <text x="266" y="278" font-size="9.5" fill="#888">（另有路径 “()(())” 亦合法，只要存在一条即可）</text>

  <!-- legend -->
  <rect x="40" y="330" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="62" y="341" font-size="9.5" fill="#666">'('</text>
  <rect x="100" y="330" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="122" y="341" font-size="9.5" fill="#666">')'</text>
  <rect x="160" y="330" width="16" height="12" fill="none" stroke="#b85450" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="182" y="341" font-size="9.5" fill="#666">路径格</text>
  <circle cx="240" cy="336" r="7" fill="#b85450" filter="url(#rough2)"/>
  <text x="256" y="341" font-size="9.5" fill="#666">步序</text>

  <rect x="40" y="362" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="383" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">路径长度 = (m−1)+(n−1)+1 = m+n−1；合法括号串长度必为偶 → m+n 必须为奇</text>
</svg>
