<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计算到达分钟 → 排序 → 逐分钟贪心</text>

  <!-- Step 1: input -->
  <rect x="150" y="46" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入 dist[], speed[]（n ≤ 10⁵）</text>

  <path d="M 260 90 L 260 110" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: compute arrival -->
  <rect x="110" y="116" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算到达分钟</text>
  <text x="260" y="156" text-anchor="middle" font-size="11.5" fill="#d6a040">arrival[i] = (dist[i] + speed[i] − 1) / speed[i]</text>

  <path d="M 260 170 L 260 190" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: sort -->
  <rect x="150" y="196" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">sort(arrival) 升序 O(n log n)</text>

  <path d="M 260 240 L 260 260" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: loop with decision -->
  <!-- loop header -->
  <rect x="120" y="266" width="280" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="12" fill="#333">遍历 k = 0, 1, 2, …, n−1</text>

  <path d="M 260 306 L 260 322" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,326 340,356 260,386 180,356" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">arrival[k]</text>
  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">&gt; k ?</text>

  <!-- Yes branch: left -->
  <path d="M 180 356 L 80 356" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="100" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="372" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="390" text-anchor="middle" font-size="11" fill="#333">ans += 1</text>
  <text x="80" y="406" text-anchor="middle" font-size="10.5" fill="#888">继续 k+1</text>
  <!-- loop back arrow -->
  <path d="M 80 372 L 80 284 L 120 284" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="3,2"/>

  <!-- No branch: right -->
  <path d="M 340 356 L 440 356" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="350" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="380" y="372" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="390" text-anchor="middle" font-size="11" fill="#333">break</text>
  <text x="440" y="406" text-anchor="middle" font-size="10.5" fill="#888">游戏结束</text>

  <!-- return -->
  <path d="M 440 416 L 440 424 L 260 424" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="180" y="416" width="160" height="0" fill="none"/>
  <text x="260" y="430" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans（= k 或 n）</text>
</svg>
