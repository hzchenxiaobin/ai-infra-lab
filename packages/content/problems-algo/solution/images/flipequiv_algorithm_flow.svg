<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">flipEquiv(a, b) 递归判定流程</text>

  <!-- Entry -->
  <rect x="190" y="50" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="72" text-anchor="middle" font-size="12" fill="#333">flipEquiv(root1, root2)</text>

  <path d="M 290 84 L 290 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: both null? -->
  <polygon points="290,102 400,138 290,174 180,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="12" fill="#333">a 和 b 都空？</text>
  <text x="290" y="152" text-anchor="middle" font-size="10" fill="#888">两棵空树等价</text>

  <path d="M 180 138 L 130 138 L 130 190" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="130" font-size="10" fill="#82b366">是</text>
  <rect x="90" y="194" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="214" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">true</text>

  <!-- Diamond 2: one null or val differ? -->
  <path d="M 290 174 L 290 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="190" font-size="10" fill="#b85450">否</text>

  <polygon points="290,198 400,232 290,266 180,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="228" text-anchor="middle" font-size="11" fill="#333">一空 或 值不等？</text>
  <text x="290" y="246" text-anchor="middle" font-size="10" fill="#888">结构/值不同</text>

  <path d="M 400 232 L 450 232 L 450 194" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="224" font-size="10" fill="#b85450">是</text>
  <rect x="410" y="180" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">false</text>

  <!-- Proceed to strategies -->
  <path d="M 290 266 L 290 284" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="280" font-size="10" fill="#82b366">否</text>

  <rect x="150" y="288" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="11" fill="#333">a.val == b.val ✓  尝试两种策略取 OR</text>

  <path d="M 290 322 L 290 340" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- OR symbol -->
  <text x="290" y="358" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">∨</text>

  <!-- Two branches -->
  <rect x="20" y="372" width="260" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① 不翻转（直连）</text>
  <text x="150" y="408" text-anchor="middle" font-size="9" fill="#333">flipEquiv(a.L, b.L)</text>
  <text x="150" y="422" text-anchor="middle" font-size="9" fill="#333">&amp;&amp; flipEquiv(a.R, b.R)</text>

  <rect x="300" y="372" width="260" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="392" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 翻转（交叉）</text>
  <text x="430" y="408" text-anchor="middle" font-size="9" fill="#333">flipEquiv(a.L, b.R)</text>
  <text x="430" y="422" text-anchor="middle" font-size="9" fill="#333">&amp;&amp; flipEquiv(a.R, b.L)</text>

  <!-- Summary -->
  <text x="290" y="456" text-anchor="middle" font-size="11" fill="#888">任一策略为 true → true；两者皆 false → false</text>
  <text x="290" y="472" text-anchor="middle" font-size="10" fill="#888">值唯一保证两种策略至多一种匹配，递归不分支</text>
</svg>
