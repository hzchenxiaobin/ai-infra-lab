<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心观察：最小间距必在相邻质数之间取得</text>

  <!-- Number line -->
  <path d="M 70 200 L 500 200" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 70 194 L 70 206" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 500 194 L 500 206" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="220" text-anchor="middle" font-size="10" fill="#aaa">11</text>
  <text x="500" y="220" text-anchor="middle" font-size="10" fill="#aaa">19</text>

  <!-- Prime nodes: 11,13,17,19 at proportional x -->
  <circle cx="150" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">11</text>

  <circle cx="200" cy="200" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="200" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">13</text>

  <circle cx="320" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">17</text>

  <circle cx="370" cy="200" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="370" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">19</text>

  <!-- Adjacent gap arcs (above) -->
  <path d="M 163 188 Q 175 172 187 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="175" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <path d="M 213 188 Q 260 160 307 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <path d="M 333 188 Q 345 172 357 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="345" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Non-adjacent gap 11->17 bracket (below) -->
  <path d="M 150 214 L 150 244" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 320 214 L 320 244" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 150 244 L 320 244" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">非相邻 17−11 = 6 = 2 + 4</text>

  <!-- Min pair highlight box -->
  <rect x="165" y="300" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="320" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最小相邻间距 = 2 → 答案 [11,13]</text>

  <!-- Formula box -->
  <rect x="40" y="344" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">p_j − p_i = Σ(相邻差) ≥ 每段相邻差 ⇒ 全局最小必在相邻取得</text>
</svg>
