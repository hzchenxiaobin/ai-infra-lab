<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：matrix → dp 表逐行填入，最后一行取 min 即答案</text>

  <!-- left: matrix -->
  <text x="92" y="62" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">matrix（输入）</text>
  <!-- row 0: 2, 1(path), 3 -->
  <rect x="40" y="74" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="103" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="92" y="74" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="103" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <rect x="144" y="74" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="103" text-anchor="middle" font-size="15" fill="#333">3</text>

  <!-- row 1: 6, 5(path), 4 -->
  <rect x="40" y="118" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="147" text-anchor="middle" font-size="15" fill="#333">6</text>
  <rect x="92" y="118" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="147" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">5</text>
  <rect x="144" y="118" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="147" text-anchor="middle" font-size="15" fill="#333">4</text>

  <!-- row 2: 7(path), 8, 9 -->
  <rect x="40" y="162" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="191" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">7</text>
  <rect x="92" y="162" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="191" text-anchor="middle" font-size="15" fill="#333">8</text>
  <rect x="144" y="162" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="191" text-anchor="middle" font-size="15" fill="#333">9</text>

  <!-- optimal path arrows: 1->5->7 -->
  <path d="M 118 108 L 118 134" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 110 152 L 76 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="66" y="222" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">路径：1→5→7</text>

  <!-- arrow between two grids -->
  <path d="M 210 142 L 250 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="134" text-anchor="middle" font-size="10.5" fill="#888">填表</text>

  <!-- right: dp table -->
  <text x="366" y="62" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">dp（最小下降路径和）</text>
  <!-- row 0: 2, 1, 3 -->
  <rect x="290" y="74" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="103" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="342" y="74" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="103" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="394" y="74" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="103" text-anchor="middle" font-size="15" fill="#333">3</text>

  <!-- row 1: 7, 6, 5 -->
  <rect x="290" y="118" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="147" text-anchor="middle" font-size="15" fill="#333">7</text>
  <rect x="342" y="118" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="147" text-anchor="middle" font-size="15" fill="#333">6</text>
  <rect x="394" y="118" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="147" text-anchor="middle" font-size="15" fill="#333">5</text>

  <!-- row 2: 13, 13(answer), 14 -->
  <rect x="290" y="162" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="191" text-anchor="middle" font-size="14" fill="#333">13</text>
  <rect x="342" y="162" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="191" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">13</text>
  <rect x="394" y="162" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="191" text-anchor="middle" font-size="14" fill="#333">14</text>

  <!-- dp arrows showing dependency: row1 <- row0 -->
  <path d="M 316 108 L 316 134" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 368 96 L 330 140" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 108 L 384 134" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note boxes -->
  <rect x="40" y="240" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="262" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第一行：直接初始化</text>
  <text x="160" y="280" text-anchor="middle" font-size="11" fill="#555">dp[0][j] = matrix[0][j]</text>
  <text x="160" y="294" text-anchor="middle" font-size="10.5" fill="#888">路径起点，无需转移</text>

  <rect x="290" y="240" width="240" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">后续行：三父取 min</text>
  <text x="410" y="280" text-anchor="middle" font-size="11" fill="#555">dp[1][1]=min(2,1,3)+5 = 6</text>
  <text x="410" y="294" text-anchor="middle" font-size="11" fill="#555">dp[2][0]=min(7,6)+7 = 13 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="318" width="490" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="338" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">答案 = min(13, 13, 14) = 13，最优路径：1 → 5 → 7</text>
  <text x="285" y="355" text-anchor="middle" font-size="10.5" fill="#888">矩阵含负数时转移不变（方向只向下，无环，无后效性保持）</text>
</svg>
