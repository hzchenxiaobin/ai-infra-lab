<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双指针沿 "abc" 周期推进</text>

  <!-- init box -->
  <rect x="220" y="44" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="69" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">初始化 i=0, j=0, ans=0</text>
  <path d="M 310 84 L 310 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop condition diamond -->
  <polygon points="310,108 400,148 310,188 220,148" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="144" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="310" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（n = len(word)）</text>

  <!-- No branch -> tail -->
  <path d="M 400 148 L 470 148 L 470 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="140" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Yes branch down -->
  <path d="M 310 188 L 310 210" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="204" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- inner decision diamond -->
  <polygon points="310,214 420,254 310,294 200,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="250" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">word[i] ==</text>
  <text x="310" y="266" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">"abc"[j%3] ?</text>

  <!-- Yes match: left -->
  <path d="M 200 254 L 110 254 L 110 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="246" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="44" y="302" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">匹配，吃掉该字符</text>
  <text x="110" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i++; j++（ans 不变）</text>

  <!-- No mismatch: right -->
  <path d="M 420 254 L 510 254 L 510 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="246" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="444" y="302" width="132" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="510" y="321" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">不等，插入期望字符</text>
  <text x="510" y="338" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">ans++; 只 j++</text>

  <!-- loop back arrows to top diamond -->
  <path d="M 110 346 L 110 370 L 310 370 L 310 148" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 346 L 510 370 L 310 370" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- tail box: complete last group -->
  <rect x="372" y="242" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="432" y="260" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">补全末组</text>
  <text x="432" y="275" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">ans += (3-j%3)%3</text>

  <!-- return -->
  <path d="M 470 282 L 470 330 L 310 330" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="344" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="368" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <text x="310" y="394" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j 始终在 0/1/2 间循环；i 只在匹配时前进；末尾把最后一组 abc 补满</text>
</svg>
