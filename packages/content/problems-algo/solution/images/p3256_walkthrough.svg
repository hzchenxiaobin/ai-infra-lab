<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：每行 top-3 → 27 种搭配扫描</text>

  <!-- 棋盘列标 -->
  <text x="63" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">c0</text>
  <text x="105" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">c1</text>
  <text x="147" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">c2</text>
  <text x="189" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">c3</text>

  <!-- 行标 -->
  <text x="34" y="73" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">行0</text>
  <text x="34" y="103" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">行1</text>
  <text x="34" y="133" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">行2</text>

  <!-- row0：top-3 = c1,c2,c3 -->
  <rect x="42" y="54" width="42" height="30" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="73" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">−3</text>
  <rect x="84" y="54" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="73" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="126" y="54" width="42" height="30" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="147" y="73" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="168" y="54" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="189" y="73" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- row1：top-3 = (1,c1),(1,c3),(−3,c0) -->
  <rect x="42" y="84" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="63" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−3</text>
  <rect x="84" y="84" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="126" y="84" width="42" height="30" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="147" y="103" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">−3</text>
  <rect x="168" y="84" width="42" height="30" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="103" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row2：top-3 = (2,c1),(1,c2),(1,c3) -->
  <rect x="42" y="114" width="42" height="30" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="63" y="133" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">−3</text>
  <rect x="84" y="114" width="42" height="30" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="133" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="126" y="114" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="147" y="133" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="168" y="114" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="189" y="133" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 图例 -->
  <rect x="42" y="152" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="60" y="161" font-size="10" fill="#4a7a3a" filter="url(#rough2)">top-3 候选</text>
  <rect x="120" y="152" width="14" height="10" fill="#efefef" stroke="#999" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="138" y="161" font-size="10" fill="#888" filter="url(#rough2)">淘汰</text>
  <rect x="172" y="152" width="14" height="10" fill="#e6f4ea" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="190" y="161" font-size="10" fill="#b85450" filter="url(#rough2)">最优三车</text>

  <!-- 右侧枚举表 -->
  <rect x="240" y="42" width="266" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="58" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行 0 取</text>
  <text x="345" y="58" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行 1 取</text>
  <text x="413" y="58" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行 2 取</text>
  <text x="477" y="58" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">检查</text>

  <line x1="240" y1="66" x2="506" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <rect x="240" y="68" width="266" height="22" fill="#ffffff" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="277" y="83" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,c1)</text>
  <text x="345" y="83" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,c1)</text>
  <text x="413" y="83" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(2,c2)</text>
  <text x="477" y="83" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 撞c1</text>

  <rect x="240" y="90" width="266" height="22" fill="#ffffff" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="277" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,c1)</text>
  <text x="345" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,c3)</text>
  <text x="413" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(2,c1)</text>
  <text x="477" y="105" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 撞c1</text>

  <rect x="240" y="112" width="266" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="277" y="127" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(1,c2)</text>
  <text x="345" y="127" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(1,c3)</text>
  <text x="413" y="127" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(2,c1)</text>
  <text x="477" y="127" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">✓ = 4 ★</text>

  <rect x="240" y="134" width="266" height="22" fill="#ffffff" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="277" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,c2)</text>
  <text x="345" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,c1)</text>
  <text x="413" y="149" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(2,c3)</text>
  <text x="477" y="149" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ = 3</text>

  <rect x="240" y="156" width="266" height="22" fill="#ffffff" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="277" y="171" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,c3)</text>
  <text x="345" y="171" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,c3)</text>
  <text x="413" y="171" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="477" y="171" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 撞c3</text>

  <rect x="240" y="178" width="266" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="373" y="193" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">…… 其余搭配同理，27 种全部扫完 → 最大 4</text>

  <!-- 答案条 -->
  <rect x="42" y="216" width="464" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="274" y="238" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 1 + 1 + 2 = 4，车位于 (0,c2)、(1,c3)、(2,c1)</text>

  <!-- 注意事项 -->
  <rect x="42" y="262" width="464" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="274" y="281" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">⚠️ 行 1 的 top-3 里含 −3：引理要「最大的 3 个」，不是「正的 3 个」</text>
  <text x="274" y="299" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">ans 初值取 −∞：值可全负，但三个车必须放满</text>

  <text x="274" y="334" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">本例 m=3：行组合 C(3,3)=1 组 × 27 搭配 = 27 次检查；m=100 时 C(100,3)×27 ≈ 4.4×10⁶</text>

  <path d="M 234 100 L 214 100" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="356" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（枚举表左连棋盘：候选全部来自各行 top-3）</text>
</svg>
