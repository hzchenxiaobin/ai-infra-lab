<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">达到下界的构造：偶数下标给去路，奇数下标给回路（交错）</text>
  <text x="270" y="40" text-anchor="middle" font-size="11" fill="#888">例：stones = [0,2,5,6,7]，x 轴按真实位置比例摆放</text>

  <!-- ====== River line ====== -->
  <path d="M 40 200 L 500 200" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- stone positions: pos 0,2,5,6,7 -> x = 60 + pos*60 -->
  <!-- index 0 pos 0 -> x 60  (green / forward) -->
  <ellipse cx="60" cy="200" rx="18" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="60" y="232" text-anchor="middle" font-size="10" fill="#888">idx0 / pos0</text>

  <!-- index 1 pos 2 -> x 180 (orange / return) -->
  <ellipse cx="180" cy="200" rx="18" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="180" y="232" text-anchor="middle" font-size="10" fill="#888">idx1 / pos2</text>

  <!-- index 2 pos 5 -> x 360 (green / forward) -->
  <ellipse cx="360" cy="200" rx="18" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="360" y="232" text-anchor="middle" font-size="10" fill="#888">idx2 / pos5</text>

  <!-- index 3 pos 6 -> x 420 (orange / return) -->
  <ellipse cx="420" cy="200" rx="18" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="420" y="232" text-anchor="middle" font-size="10" fill="#888">idx3 / pos6</text>

  <!-- index 4 pos 7 -> x 480 (green / forward, endpoint shared) -->
  <ellipse cx="480" cy="200" rx="18" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="480" y="232" text-anchor="middle" font-size="10" fill="#888">idx4 / pos7</text>

  <!-- ====== Forward path P1 (green, above): 0 -> 2 -> 4 ====== -->
  <path d="M 60 184 Q 210 110 360 184" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="210" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">跳 = 5−0 = 5</text>

  <path d="M 360 184 Q 420 150 480 184" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="420" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a">跳 = 2</text>

  <text x="40" y="130" font-size="11.5" fill="#4a7a3a" font-weight="bold">去路 P1：0→2→4</text>
  <text x="40" y="146" font-size="10" fill="#4a7a3a">max 跳 = 5</text>

  <!-- ====== Return path P2 (orange, below): 4 -> 3 -> 1 -> 0 ====== -->
  <path d="M 480 216 Q 450 250 420 216" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="450" y="262" text-anchor="middle" font-size="10" fill="#d6a040">跳 = 1</text>

  <path d="M 420 216 Q 300 300 180 216" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="300" y="308" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">跳 = 6−2 = 4</text>

  <path d="M 180 216 Q 120 250 60 216" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="120" y="262" text-anchor="middle" font-size="10" fill="#d6a040">跳 = 2</text>

  <text x="40" y="288" font-size="11.5" fill="#d6a040" font-weight="bold">回路 P2：4→3→1→0</text>
  <text x="40" y="304" font-size="10" fill="#d6a040">max 跳 = 4</text>

  <!-- ====== Bottom conclusion ====== -->
  <rect x="30" y="322" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">每跳至多跨过一块石头 ⇒ 跳长 ≤ stones[i+2]−stones[i] ⇒ 总代价 = 5 = 下界</text>
</svg>
