<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：二分 value，靠每行有序统计 ≤mid 的个数</text>

  <!-- ===== 左：矩阵 ===== -->
  <text x="83" y="58" text-anchor="middle" font-size="11" fill="#888">3×3 行有序矩阵</text>

  <!-- 列0 高亮（不保证列有序） -->
  <rect x="40" y="72" width="42" height="132" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>

  <!-- 9 个格子 -->
  <rect x="40" y="72" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="82" y="72" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="72" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="116" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="82" y="116" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="116" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="160" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="82" y="160" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="124" y="160" width="42" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="61" y="99" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="103" y="99" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="145" y="99" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="61" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="103" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="145" y="143" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="61" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="103" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="145" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <!-- 行有序箭头 -->
  <path d="M 172 94 L 196 94" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 172 138 L 196 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 172 182 L 196 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="207" y="96" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行</text>
  <text x="207" y="108" font-size="10" fill="#4a7a3a" filter="url(#rough2)">有序</text>

  <text x="83" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">列不必有序：红框列 = 1,2,1</text>

  <!-- ===== 右：二分 value 数轴 ===== -->
  <rect x="240" y="56" width="320" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="78" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">二分答案 value ∈ [min, max]</text>
  <text x="400" y="96" text-anchor="middle" font-size="10.5" fill="#555">中位数 = 最小的 value，使 cnt(≤value) &gt; N/2</text>
  <text x="400" y="110" text-anchor="middle" font-size="10.5" fill="#555">N = m·n（奇数），中位排在第 N/2+1 小</text>

  <!-- 数轴 -->
  <text x="415" y="140" text-anchor="middle" font-size="11" fill="#888">value 数轴</text>
  <line x1="260" y1="166" x2="560" y2="166" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- 4 个刻度 1..4 -->
  <line x1="260" y1="160" x2="260" y2="172" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="360" y1="160" x2="360" y2="172" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="460" y1="160" x2="460" y2="172" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="560" y1="160" x2="560" y2="172" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="360" y="186" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2</text>
  <text x="460" y="186" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="560" y="186" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">4</text>

  <!-- lo / hi / mid 标记 -->
  <path d="M 260 158 L 256 150 L 264 150 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lo=min</text>
  <path d="M 560 158 L 556 150 L 564 150 Z" fill="#b85450" filter="url(#rough2)"/>
  <text x="560" y="144" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">hi=max</text>
  <path d="M 360 174 L 356 182 L 364 182 Z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="360" y="200" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold" filter="url(#rough2)">mid</text>

  <!-- 计数说明 -->
  <rect x="250" y="214" width="300" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="234" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">cnt = Σ 每行 bisect_right(row, mid)</text>
  <text x="400" y="250" text-anchor="middle" font-size="10.5" fill="#555">每行有序 → O(log n) 数出 ≤mid 的个数</text>
  <text x="400" y="264" text-anchor="middle" font-size="10.5" fill="#555">无需关心列是否有序</text>

  <!-- 判定 -->
  <polygon points="400,284 470,312 400,340 330,312" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt &gt; N/2 ?</text>
  <text x="400" y="324" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">(N/2 即 N//2)</text>

  <path d="M 330 312 L 286 312" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="308" y="305" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="278" y="324" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">lo=mid+1</text>

  <path d="M 470 312 L 514 312" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="492" y="305" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="522" y="324" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">hi=mid</text>
</svg>
