<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历累加正差分</text>

  <rect x="40" y="50" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="75" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="68" y="79" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="71" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="100" y="89" font-size="11" fill="#555">ans = 0, prev = 0（虚拟的 target[-1] = 0）</text>

  <path d="M 280 100 L 280 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="120" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="145" r="16" fill="#d6a040" filter="url(#rough2)"/>
  <text x="68" y="149" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="100" y="141" font-size="12" fill="#333" font-weight="bold">遍历每个位置 i = 0 … n-1</text>
  <text x="100" y="159" font-size="11" fill="#555">比较 target[i] 与 prev（即 target[i-1]，i=0 时 prev=0）</text>

  <path d="M 280 170 L 280 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="190" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="218" r="16" fill="#b85450" filter="url(#rough2)"/>
  <text x="68" y="222" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="100" y="214" font-size="12" fill="#333" font-weight="bold">若 target[i] &gt; prev（上台阶）</text>
  <text x="100" y="232" font-size="11" fill="#555">ans += target[i] - prev；否则什么都不做（条带从左延续）</text>

  <path d="M 280 246 L 280 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="266" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="288" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="68" y="292" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4</text>
  <text x="100" y="284" font-size="12" fill="#333" font-weight="bold">prev = target[i]</text>
  <text x="100" y="302" font-size="11" fill="#555">更新 prev，为下一轮比较做准备</text>

  <path d="M 520 288 L 540 288 L 540 145 L 520 145" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="544" y="217" font-size="9" fill="#888" writing-mode="tb">回到步骤 2</text>

  <path d="M 280 310 L 280 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="330" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="352" r="16" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="68" y="356" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">5</text>
  <text x="100" y="348" font-size="12" fill="#333" font-weight="bold">返回 ans</text>
  <text x="100" y="366" font-size="11" fill="#555">所有正差分之和 = 最少操作次数</text>

  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#888">O(n) 时间 / O(1) 空间，一次遍历搞定</text>
</svg>
