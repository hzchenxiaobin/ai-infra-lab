<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：四角定界 → 二分 v → 逐 x 三分支计数 → 比较 k 收敛</text>

  <!-- Step 1: 定界 -->
  <rect x="150" y="46" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 四角定界</text>
  <text x="280" y="80" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">lo=min(首首,首尾,尾首,尾尾)  hi=max(...)</text>
  <path d="M 280 88 L 280 104" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: while -->
  <rect x="120" y="108" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="127" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② while lo &lt; hi</text>
  <text x="280" y="143" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">mid = (lo + hi) // 2    （Python floor，负数安全）</text>
  <path d="M 280 154 L 280 170" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: count init -->
  <rect x="150" y="174" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ count = 0；遍历 x ∈ nums1</text>
  <path d="M 280 212 L 280 228" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: x sign -->
  <polygon points="280,232 360,276 280,320 200,276" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">x 的符号？</text>
  <text x="280" y="288" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">三分支</text>

  <!-- three branch arrows + labels -->
  <path d="M 200 276 L 70 318" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="290" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x&gt;0</text>
  <path d="M 280 320 L 280 344" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="336" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x&lt;0</text>
  <path d="M 360 276 L 490 318" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="290" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">x=0</text>

  <!-- branch boxes -->
  <rect x="20" y="322" width="110" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="75" y="342" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">t = ⌊v/x⌋</text>
  <text x="75" y="358" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">count +=</text>
  <text x="75" y="372" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">bisect_right</text>
  <text x="75" y="384" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">(nums2, t)</text>

  <rect x="220" y="346" width="120" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">t = ⌈v/x⌉</text>
  <text x="280" y="382" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">count += n −</text>
  <text x="280" y="396" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">bisect_left</text>
  <text x="280" y="408" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">(nums2, t)</text>

  <rect x="430" y="322" width="110" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="485" y="342" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">v ≥ 0 ?</text>
  <text x="485" y="358" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是 → count += n</text>
  <text x="485" y="374" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">否 → +0</text>
  <text x="485" y="388" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(O(1) 判定)</text>

  <!-- converge to loop-back -->
  <path d="M 75 392 L 75 430 L 280 430" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 414 L 280 430" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 485 392 L 485 430 L 280 430" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="160" y="424" font-size="9" fill="#888" filter="url(#rough2)">累加后继续下一个 x</text>
  <!-- loop back arrow to step 3 -->
  <path d="M 280 430 L 410 430 L 410 192 L 412 192" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="312" font-size="9" fill="#888" filter="url(#rough2)">遍历完</text>
  <text x="416" y="324" font-size="9" fill="#888" filter="url(#rough2)">所有 x</text>

  <!-- Step 4: compare with k -->
  <path d="M 280 430 L 280 452" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,456 370,492 280,528 190,492" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="488" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">count ≥ k ?</text>
  <text x="280" y="504" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">判定收敛方向</text>

  <!-- yes / no branches -->
  <path d="M 190 492 L 120 492 L 120 540" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="486" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 370 492 L 440 492 L 440 540" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="486" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="60" y="544" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="562" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">hi = mid</text>
  <text x="120" y="577" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">答案 ≤ mid</text>
  <rect x="380" y="544" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="562" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">lo = mid + 1</text>
  <text x="440" y="577" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">答案 &gt; mid</text>

  <!-- loop back to while -->
  <path d="M 120 544 L 120 130 L 118 130" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 544 L 440 130 L 442 130" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <text x="280" y="588" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">lo == hi 时返回 lo</text>
</svg>
