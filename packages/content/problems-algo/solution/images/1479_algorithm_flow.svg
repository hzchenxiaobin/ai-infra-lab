<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">算法流程：JOIN → WEEKDAY() → 条件聚合 → 分组排序</text>

  <!-- Step 1: FROM Items -->
  <rect x="40" y="40" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="60" font-size="11" fill="#333" font-weight="bold">① FROM Items a</text>
  <text x="200" y="60" font-size="10" fill="#888">主表：全品类</text>

  <!-- arrow -->
  <path d="M 160 74 L 160 86" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: LEFT JOIN Orders -->
  <rect x="40" y="88" width="240" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="108" font-size="11" fill="#333" font-weight="bold">② LEFT JOIN Orders b</text>
  <text x="250" y="108" font-size="10" fill="#4a7a3a" text-anchor="end">ON a.item_id=b.item_id</text>

  <!-- arrow -->
  <path d="M 160 122 L 160 134" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: WEEKDAY -->
  <rect x="40" y="136" width="240" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="156" font-size="11" fill="#333" font-weight="bold">③ WEEKDAY(order_date)</text>
  <text x="250" y="156" font-size="10" fill="#d6a040" text-anchor="end">0=Mon … 6=Sun</text>

  <!-- arrow -->
  <path d="M 160 170 L 160 182" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: SUM(CASE WHEN) × 7 -->
  <rect x="40" y="184" width="240" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="204" font-size="11" fill="#333" font-weight="bold">④ SUM(CASE WHEN…) × 7</text>
  <text x="250" y="204" font-size="10" fill="#b85450" text-anchor="end">行转列透视</text>

  <!-- arrow -->
  <path d="M 160 218 L 160 230" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: GROUP BY -->
  <rect x="40" y="232" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="252" font-size="11" fill="#333" font-weight="bold">⑤ GROUP BY item_category</text>
  <text x="250" y="252" font-size="10" fill="#888" text-anchor="end">按品类聚合</text>

  <!-- arrow -->
  <path d="M 160 266 L 160 278" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: ORDER BY -->
  <rect x="40" y="280" width="240" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="11" fill="#333" font-weight="bold">⑥ ORDER BY item_category</text>
  <text x="250" y="300" font-size="10" fill="#888" text-anchor="end">品类字典序</text>

  <!-- arrow -->
  <path d="M 160 314 L 160 326" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="40" y="328" width="240" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="348" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">输出 8 列</text>
  <text x="160" y="362" text-anchor="middle" font-size="9.5" fill="#888">CATEGORY + MON…SUN</text>

  <!-- ===== Right side: WEEKDAY mapping table ===== -->
  <rect x="340" y="40" width="220" height="190" rx="8" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="60" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">WEEKDAY() 映射表</text>
  <rect x="360" y="68" width="180" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="400" y="82" text-anchor="middle" font-size="9.5" fill="#333">返回值</text>
  <text x="490" y="82" text-anchor="middle" font-size="9.5" fill="#333">星期</text>

  <rect x="360" y="88" width="180" height="18" rx="3" fill="#fff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="400" y="100" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">0</text>
  <text x="490" y="100" text-anchor="middle" font-size="9.5" fill="#333">Monday</text>
  <rect x="360" y="106" width="180" height="18" rx="3" fill="#fff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="400" y="118" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="490" y="118" text-anchor="middle" font-size="9.5" fill="#333">Tuesday</text>
  <rect x="360" y="124" width="180" height="18" rx="3" fill="#fff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="400" y="136" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="490" y="136" text-anchor="middle" font-size="9.5" fill="#333">Wednesday</text>
  <rect x="360" y="142" width="180" height="18" rx="3" fill="#fff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="400" y="154" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="490" y="154" text-anchor="middle" font-size="9.5" fill="#333">Thursday</text>
  <rect x="360" y="160" width="180" height="18" rx="3" fill="#fff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="400" y="172" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">4</text>
  <text x="490" y="172" text-anchor="middle" font-size="9.5" fill="#333">Friday</text>
  <rect x="360" y="178" width="180" height="18" rx="3" fill="#fff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="400" y="190" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="490" y="190" text-anchor="middle" font-size="9.5" fill="#333">Saturday</text>
  <rect x="360" y="196" width="180" height="18" rx="3" fill="#fff" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="400" y="208" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">6</text>
  <text x="490" y="208" text-anchor="middle" font-size="9.5" fill="#333">Sunday</text>
  <text x="450" y="224" text-anchor="middle" font-size="9" fill="#888">注意：0=周一（非周日）</text>

  <!-- ===== Right side: CASE WHEN template ===== -->
  <rect x="340" y="250" width="220" height="118" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="270" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">CASE WHEN 模板（×7）</text>
  <text x="352" y="288" font-size="9" fill="#555" font-family="monospace">SUM(CASE</text>
  <text x="352" y="302" font-size="9" fill="#555" font-family="monospace">  WHEN WEEKDAY(d)=0</text>
  <text x="352" y="316" font-size="9" fill="#555" font-family="monospace">  THEN qty ELSE 0</text>
  <text x="352" y="330" font-size="9" fill="#555" font-family="monospace">END) AS MONDAY</text>
  <text x="450" y="352" text-anchor="middle" font-size="9" fill="#888">非匹配行贡献 0 → 空白天为 0</text>
</svg>
