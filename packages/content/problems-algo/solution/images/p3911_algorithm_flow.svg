<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：偶数前缀计数 O(n) + 每查询值域二分 O(log V · log n)</text>

  <!-- 预处理 -->
  <g filter="url(#rough2)">
    <rect x="150" y="36" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="60" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">预处理：pre[i] ← 前 i 个元素中偶数个数（一次 O(n)）</text>
    <path d="M280,74 V94" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="190" y="96" width="180" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="117" text-anchor="middle" font-size="10.5" fill="#33506b">对每个查询 [l, r, k]：</text>
    <path d="M280,128 V148" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="140" y="150" width="280" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="168" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">lo ← 0，hi ← k + (r − l + 1)</text>
    <text x="280" y="184" text-anchor="middle" font-size="9.5" fill="#5a7495">（二分 t = x/2，答案 x = 2t；上界：至多移除 r−l+1 个偶数）</text>
    <path d="M280,192 V216" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 菱形1 -->
  <g filter="url(#rough2)">
    <polygon points="280,216 352,244 280,272 208,244" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="249" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">lo &lt; hi ?</text>

    <text x="362" y="238" font-size="10" fill="#2f5d24" font-weight="bold">否</text>
    <path d="M352,244 H489 V172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <rect x="430" y="134" width="118" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="489" y="157" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">ans ← 2 × lo</text>

    <text x="290" y="290" font-size="10" fill="#2f5d24" font-weight="bold">是</text>
    <path d="M280,272 V296" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- 计数判定 -->
  <g filter="url(#rough2)">
    <rect x="128" y="298" width="304" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="317" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">mid ← (lo+hi)/2，x ← 2·mid</text>
    <text x="280" y="335" text-anchor="middle" font-size="10" fill="#8a6d1a">j ← 子数组中 ≤ x 的右边界（bisect）；cnt ← pre[j] − pre[l]</text>
    <path d="M280,346 V368" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <polygon points="280,368 368,398 280,428 192,398" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="395" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">mid − cnt ≥ k ?</text>
    <text x="280" y="410" text-anchor="middle" font-size="9" fill="#8a3030">（即 kept(x) ≥ k）</text>

    <text x="176" y="390" font-size="10" fill="#2f5d24" font-weight="bold">是</text>
    <path d="M192,398 H164" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="52" y="381" width="110" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="107" y="403" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">hi ← mid</text>

    <text x="384" y="390" font-size="10" fill="#8a6d1a" font-weight="bold">否</text>
    <path d="M368,398 H396" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="400" y="381" width="120" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="460" y="403" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">lo ← mid + 1</text>
  </g>

  <!-- 回环箭头 -->
  <g filter="url(#rough2)">
    <path d="M107,381 V244 H202" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arr)"/>
    <text x="80" y="310" font-size="9" fill="#5a7495">回到判定</text>

    <path d="M460,381 V208 H292" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arr)"/>
    <text x="478" y="300" font-size="9" fill="#8a6d1a">回到判定</text>
  </g>

  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每查询 O(log V) 轮 × 每轮一次 bisect O(log n)；V = 2(k + r−l+1) ≤ 2.1×10⁹，全程 64 位稳妥</text>
</svg>
