<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">相似 RGB 颜色：每个通道独立取最近的 17 的倍数（重复数字）</text>

  <!-- 输入行 -->
  <text x="44" y="72" font-size="12" fill="#888">输入</text>
  <text x="44" y="86" font-size="11" fill="#aaa">#09f166</text>
  <rect x="140" y="56" width="84" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">09</text>
  <rect x="248" y="56" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f1</text>
  <rect x="356" y="56" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">66</text>

  <!-- arrows input -> mid -->
  <path d="M 182 92 L 182 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 290 92 L 290 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 398 92 L 398 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="196" y="108" font-size="10" fill="#888">round</text>
  <text x="304" y="108" font-size="10" fill="#888">round</text>
  <text x="412" y="108" font-size="10" fill="#888">round</text>

  <!-- 中间计算行 -->
  <rect x="130" y="118" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="182" y="136" text-anchor="middle" font-size="11" fill="#333">v = 9</text>
  <text x="182" y="154" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 17×1 = 17</text>

  <rect x="238" y="118" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="11" fill="#333">v = 241</text>
  <text x="290" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 17×14 = 238</text>

  <rect x="346" y="118" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="398" y="136" text-anchor="middle" font-size="11" fill="#333">v = 102</text>
  <text x="398" y="154" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">→ 17×6 = 102</text>

  <!-- arrows mid -> output -->
  <path d="M 182 166 L 182 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 290 166 L 290 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 398 166 L 398 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 输出行 -->
  <text x="44" y="212" font-size="12" fill="#888">输出</text>
  <text x="44" y="226" font-size="11" fill="#aaa">#11ee66</text>
  <rect x="140" y="192" width="84" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">11</text>
  <rect x="248" y="192" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">ee</text>
  <rect x="356" y="192" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="214" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">66</text>

  <!-- note -->
  <rect x="40" y="252" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：dd = 17×d（d ∈ 0..15），三通道相互独立</text>
  <text x="280" y="295" text-anchor="middle" font-size="11" fill="#555">⇒ 各自取离 v 最近的 17 的倍数，即 d = round(v / 17)</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#888">R: 9→17 · G: 241→238 · B: 102→102，拼接得 #11ee66</text>
</svg>
