<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1,1,0,1,1,1] → 返回 3</text>

  <!-- table frame -->
  <rect x="30" y="50" width="500" height="332" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- column x boundaries: 步骤 30-110, i 110-165, nums[i] 165-240, count 240-315, maxCount 315-400, 说明 400-530 -->
  <!-- header row -->
  <rect x="30" y="50" width="500" height="30" fill="#e8f0fe" filter="url(#rough2)"/>
  <line x1="110" y1="50" x2="110" y2="382" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="165" y1="50" x2="165" y2="382" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="50" x2="240" y2="382" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="315" y1="50" x2="315" y2="382" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="50" x2="400" y2="382" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="70" y="70" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">步骤</text>
  <text x="137" y="70" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">i</text>
  <text x="202" y="70" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">nums[i]</text>
  <text x="277" y="70" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">count</text>
  <text x="357" y="70" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">maxCount</text>
  <text x="465" y="70" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">说明</text>

  <!-- header bottom line -->
  <line x1="30" y1="80" x2="530" y2="80" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row height 38, start y=80 -->
  <!-- row 0: 初始 -->
  <text x="70" y="104" text-anchor="middle" font-size="11" fill="#888">初始</text>
  <text x="137" y="104" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="202" y="104" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="277" y="104" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">0</text>
  <text x="357" y="104" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">0</text>
  <text x="465" y="104" text-anchor="middle" font-size="10" fill="#888">两变量归零</text>
  <line x1="30" y1="118" x2="530" y2="118" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: i=0, nums[0]=1 -->
  <text x="70" y="142" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="137" y="142" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="202" y="142" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="277" y="142" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">1</text>
  <rect x="318" y="128" width="78" height="22" rx="4" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="357" y="142" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">1</text>
  <text x="465" y="142" text-anchor="middle" font-size="10" fill="#555">遇 1，count++</text>
  <line x1="30" y1="156" x2="530" y2="156" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 2: i=1, nums[1]=1 -->
  <text x="70" y="180" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="137" y="180" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="202" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="277" y="180" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">2</text>
  <rect x="318" y="166" width="78" height="22" rx="4" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="357" y="180" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="465" y="180" text-anchor="middle" font-size="10" fill="#555">再累加，更新最大</text>
  <line x1="30" y1="194" x2="530" y2="194" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 3: i=2, nums[2]=0 -->
  <rect x="31" y="195" width="498" height="36" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="70" y="218" text-anchor="middle" font-size="11" fill="#a67830" font-weight="bold">3</text>
  <text x="137" y="218" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="202" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="277" y="218" text-anchor="middle" font-size="12" fill="#a67830" font-weight="bold">0</text>
  <text x="357" y="218" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="465" y="218" text-anchor="middle" font-size="10" fill="#a67830">遇 0，count 清零</text>
  <line x1="30" y1="232" x2="530" y2="232" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 4: i=3, nums[3]=1 -->
  <text x="70" y="256" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="137" y="256" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="202" y="256" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="277" y="256" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">1</text>
  <text x="357" y="256" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="465" y="256" text-anchor="middle" font-size="10" fill="#555">重新累加</text>
  <line x1="30" y1="270" x2="530" y2="270" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 5: i=4, nums[4]=1 -->
  <text x="70" y="294" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="137" y="294" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="202" y="294" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="277" y="294" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">2</text>
  <text x="357" y="294" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="465" y="294" text-anchor="middle" font-size="10" fill="#555">继续累加</text>
  <line x1="30" y1="308" x2="530" y2="308" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 6: i=5, nums[5]=1 -->
  <text x="70" y="332" text-anchor="middle" font-size="11" fill="#555">6</text>
  <text x="137" y="332" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="202" y="332" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="277" y="332" text-anchor="middle" font-size="12" fill="#2a4a66" font-weight="bold">3</text>
  <rect x="318" y="318" width="78" height="22" rx="4" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="357" y="332" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">3</text>
  <text x="465" y="332" text-anchor="middle" font-size="10" fill="#555">累加，更新最大</text>
  <line x1="30" y1="346" x2="530" y2="346" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 7: 结束 -->
  <text x="70" y="370" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结束</text>
  <text x="137" y="370" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="202" y="370" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="277" y="370" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="357" y="370" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="465" y="370" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">返回 maxCount = 3</text>

  <!-- legend -->
  <rect x="120" y="394" width="14" height="14" rx="3" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="142" y="405" font-size="10" fill="#555">maxCount 更新</text>
  <rect x="260" y="394" width="14" height="14" rx="3" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="282" y="405" font-size="10" fill="#555">count 清零</text>
  <text x="380" y="405" font-size="10" fill="#888">绿色高亮 = 刷新最大值的关键步</text>
</svg>
