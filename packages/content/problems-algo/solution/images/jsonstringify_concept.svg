<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">核心直觉：沿 JSON 文法递归——每个类型一个分支，自底向上拼字符串</text>

  <!-- 顶部输入 -->
  <rect x="240" y="44" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">object (JSON 值)</text>

  <!-- 四条分派线 -->
  <path d="M 280 78 L 110 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 78 L 270 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 78 L 390 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 78 L 520 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分支1: string -->
  <rect x="40" y="112" width="140" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">typeof === "string"</text>
  <rect x="44" y="156" width="132" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">'"' + value + '"'</text>

  <!-- 分支2: null/bool/number -->
  <rect x="200" y="112" width="140" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">null / 布尔 / 数字</text>
  <rect x="204" y="156" width="132" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270" y="175" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">String(value)</text>

  <!-- 分支3: array -->
  <rect x="360" y="112" width="120" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Array.isArray</text>
  <rect x="364" y="156" width="112" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="175" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">map → join → []</text>

  <!-- 分支4: object -->
  <rect x="500" y="112" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">普通对象</text>
  <rect x="504" y="156" width="92" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="550" y="175" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">"k":v → join → {}</text>

  <!-- 递归回环箭头：array 和 object 分支递归调用自身 -->
  <path d="M 420 186 C 420 230, 310 240, 310 44" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="250" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">递归</text>
  <path d="M 550 186 C 550 230, 340 248, 330 44" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="560" y="250" font-size="10" fill="#446688" filter="url(#rough2)" font-weight="bold">递归</text>

  <!-- 示例拼装区 -->
  <text x="310" y="270" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)" font-weight="bold">自底向上拼装（以 [1, "Hi"] 为例）</text>

  <!-- 叶子层 -->
  <rect x="60" y="284" width="60" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="304" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="90" y="328" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">String(1)="1"</text>

  <rect x="170" y="284" width="90" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215" y="304" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"Hi"</text>
  <text x="215" y="328" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">'"Hi"'</text>

  <!-- 拼接箭头 -->
  <path d="M 120 299 L 170 299" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="293" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">join ","</text>

  <!-- 数组层 -->
  <rect x="100" y="348" width="200" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">["1", '"Hi"']  →  [1,"Hi"]</text>

  <!-- 结论框 -->
  <rect x="30" y="400" width="560" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="421" font-size="12" fill="#333" filter="url(#rough2)" font-weight="bold">关键：递归基 = string（加引号）+ 原始类型（String()）；</text>
  <text x="46" y="438" font-size="11" fill="#555" filter="url(#rough2)">递归步 = array / object，把子结果 join 后套上 [] / {}。整棵树自底向上拼成一行字符串。</text>
</svg>
