<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：第 k 大 = 升序第 size−k+1 小，值域 BIT 一查即得</text>

  <!-- multiset note -->
  <text x="260" y="52" text-anchor="middle" font-size="11.5" fill="#666">插入 7 之后的多重集 {4, 5, 7, 7}，size = 4，问 k = 2</text>

  <!-- descending row -->
  <rect x="132" y="64" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="89" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="198" y="64" width="58" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="264" y="64" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="293" y="89" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="330" y="64" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="89" text-anchor="middle" font-size="14" fill="#333">4</text>

  <text x="161" y="120" text-anchor="middle" font-size="10.5" fill="#666">第1大</text>
  <text x="227" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">第2大</text>
  <text x="293" y="120" text-anchor="middle" font-size="10.5" fill="#666">第3大</text>
  <text x="359" y="120" text-anchor="middle" font-size="10.5" fill="#666">第4大</text>

  <text x="90" y="89" text-anchor="middle" font-size="11" fill="#446688">降序</text>

  <!-- arrow into conversion box -->
  <path d="M 260 128 L 260 142" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- conversion box -->
  <rect x="105" y="148" width="310" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">升序排名 r = size − k + 1 = 4 − 2 + 1 = 3</text>

  <!-- arrow out -->
  <path d="M 260 188 L 260 202" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ascending row -->
  <rect x="132" y="208" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="233" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="198" y="208" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="233" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="264" y="208" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="293" y="233" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="330" y="208" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="233" text-anchor="middle" font-size="14" fill="#333">7</text>

  <text x="161" y="264" text-anchor="middle" font-size="10.5" fill="#666">第1小</text>
  <text x="227" y="264" text-anchor="middle" font-size="10.5" fill="#666">第2小</text>
  <text x="293" y="264" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">第3小</text>
  <text x="359" y="264" text-anchor="middle" font-size="10.5" fill="#666">第4小</text>

  <text x="90" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a">升序</text>

  <!-- BIT buckets -->
  <text x="260" y="292" text-anchor="middle" font-size="11.5" fill="#666">值域 BIT：离散化后每个值一个桶，桶内存出现次数</text>

  <rect x="134" y="302" width="76" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="320" text-anchor="middle" font-size="11" fill="#666">值 4</text>
  <text x="172" y="336" text-anchor="middle" font-size="12" fill="#333">× 1</text>
  <rect x="222" y="302" width="76" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#666">值 5</text>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#333">× 1</text>
  <rect x="310" y="302" width="76" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="320" text-anchor="middle" font-size="11" fill="#666">值 7</text>
  <text x="348" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">× 2</text>

  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#b85450">查第 3 小：值 4、5 两桶前缀只装 2 个 ⇒ 落在值 7 ✓</text>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#b85450">单次查排名 O(log m)，与 k 一次跳多远无关 —— 这正是 II 版的命门</text>
</svg>
