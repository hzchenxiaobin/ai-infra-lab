<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 312"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="312" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">游程 DP：局部等式成立则 +1，断点重置为 2（示例 [1,1,1,1,2,3,5,1]）</text>

  <!-- 行标签 -->
  <text x="58" y="66" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">数组 a</text>
  <text x="58" y="114" text-anchor="end" font-size="11" fill="#a87b20" filter="url(#rough2)">两项和</text>
  <text x="58" y="140" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">判定</text>
  <text x="58" y="170" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">cur</text>

  <!-- 数组格子 -->
  <rect x="68"  y="46" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="46" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="46" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="212" y="46" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="46" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="308" y="46" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="356" y="46" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="404" y="46" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="91"  y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="139" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="187" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="235" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="283" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="331" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="379" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="427" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 下标 -->
  <text x="91"  y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="139" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="187" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="235" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="283" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="331" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="379" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="427" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>

  <!-- 两项和：a[i-2]+a[i-1]，仅 i>=2 有 -->
  <text x="187" y="114" text-anchor="middle" font-size="11" fill="#a87b20" filter="url(#rough2)">2</text>
  <text x="235" y="114" text-anchor="middle" font-size="11" fill="#a87b20" filter="url(#rough2)">2</text>
  <text x="283" y="114" text-anchor="middle" font-size="11" fill="#a87b20" filter="url(#rough2)">2</text>
  <text x="331" y="114" text-anchor="middle" font-size="11" fill="#a87b20" filter="url(#rough2)">3</text>
  <text x="379" y="114" text-anchor="middle" font-size="11" fill="#a87b20" filter="url(#rough2)">5</text>
  <text x="427" y="114" text-anchor="middle" font-size="11" fill="#a87b20" filter="url(#rough2)">8</text>

  <!-- 判定行 -->
  <text x="91"  y="140" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="139" y="140" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="187" y="140" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="235" y="140" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="283" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="331" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="379" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="427" y="140" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- cur 行 -->
  <text x="91"  y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="139" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="187" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="235" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="283" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="331" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="379" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="427" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- 括住答案窗口 i=2..6 -->
  <path d="M 164 182 L 164 190 L 402 190 L 402 182" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="283" y="210" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">最长斐波那契子数组 a[2..6] = [1,1,2,3,5]，长度 5</text>

  <!-- 注意事项 1 -->
  <rect x="40" y="232" width="215" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="147" y="252" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">⚠ 断点重置为 2，不是 1</text>
  <text x="147" y="270" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">断点后新游程从 {a[i-1], a[i]} 两项起算</text>
  <text x="147" y="285" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">（长度 ≤ 2 的子数组恒合法）</text>

  <!-- 注意事项 2 -->
  <rect x="265" y="232" width="215" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="372" y="252" text-anchor="middle" font-size="12" fill="#a87b20" filter="url(#rough2)">⚠ 两项和 2×10⁹ 贴 int32 上限</text>
  <text x="372" y="270" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1e9 + 1e9 = 2×10⁹ &lt; 2147483647 恰不溢出</text>
  <text x="372" y="285" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">但仅剩 ~7% 余量，C++ 建议 64 位求和</text>
</svg>
