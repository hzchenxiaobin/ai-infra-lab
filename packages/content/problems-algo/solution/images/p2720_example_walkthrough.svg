<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="500" height="380" fill="#fafafa"/>

  <text x="250" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：9 关系 → 18 边 → 9 用户的好友数与百分比</text>
  <text x="250" y="42" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">用户总数 total = 9，分母 denom = total − 1 = 8</text>

  <!-- table outline -->
  <rect x="28" y="58" width="444" height="276" fill="none" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <!-- header row background -->
  <rect x="28" y="58" width="444" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">user1</text>
  <text x="154" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">好友集合</text>
  <text x="256" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cnt</text>
  <text x="333" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cnt×100/8</text>
  <text x="429" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">percentage</text>

  <!-- column dividers -->
  <line x1="76" y1="58" x2="76" y2="334" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="234" y1="58" x2="234" y2="334" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="278" y1="58" x2="278" y2="334" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="388" y1="58" x2="388" y2="334" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: user 1 highlighted -->
  <rect x="29" y="84" width="442" height="26" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="52" y="102" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">1</text>
  <text x="154" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2,3,4,5,6}</text>
  <text x="256" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="333" y="102" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">500/8</text>
  <text x="429" y="102" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">62.50</text>

  <!-- Row 2: user 2 -->
  <text x="52" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="154" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,6,7}</text>
  <text x="256" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="333" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">300/8</text>
  <text x="429" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">37.50</text>

  <!-- Row 3: user 3 (tie with 2) -->
  <rect x="29" y="136" width="442" height="26" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="52" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="154" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,8,9}</text>
  <text x="256" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="333" y="154" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">300/8</text>
  <text x="429" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">37.50</text>

  <!-- Row 4: user 6 -->
  <text x="52" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">6</text>
  <text x="154" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,2}</text>
  <text x="256" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="333" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">200/8</text>
  <text x="429" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">25.00</text>

  <!-- Row 5: user 4 -->
  <rect x="29" y="188" width="442" height="26" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="52" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
  <text x="154" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1}</text>
  <text x="256" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="333" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">100/8</text>
  <text x="429" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12.50</text>

  <!-- Row 6: user 5 -->
  <text x="52" y="232" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <text x="154" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1}</text>
  <text x="256" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="333" y="232" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">100/8</text>
  <text x="429" y="232" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12.50</text>

  <!-- Row 7: user 7 -->
  <rect x="29" y="240" width="442" height="26" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="52" y="258" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">7</text>
  <text x="154" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2}</text>
  <text x="256" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="333" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">100/8</text>
  <text x="429" y="258" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12.50</text>

  <!-- Row 8: user 8 -->
  <text x="52" y="284" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">8</text>
  <text x="154" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3}</text>
  <text x="256" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="333" y="284" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">100/8</text>
  <text x="429" y="284" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12.50</text>

  <!-- Row 9: user 9 -->
  <rect x="29" y="292" width="442" height="26" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="52" y="310" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">9</text>
  <text x="154" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3}</text>
  <text x="256" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="333" y="310" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">100/8</text>
  <text x="429" y="310" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12.50</text>

  <!-- row dividers -->
  <line x1="28" y1="110" x2="472" y2="110" stroke="#c0c8d0" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="28" y1="162" x2="472" y2="162" stroke="#c0c8d0" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="28" y1="188" x2="472" y2="188" stroke="#c0c8d0" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="28" y1="214" x2="472" y2="214" stroke="#c0c8d0" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="28" y1="240" x2="472" y2="240" stroke="#c0c8d0" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="28" y1="266" x2="472" y2="266" stroke="#c0c8d0" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="28" y1="292" x2="472" y2="292" stroke="#c0c8d0" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- annotations -->
  <text x="250" y="352" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">💡 user 1 居首（cnt=5）；user 2、3 并列 37.50 → 按 user1 升序，2 排 3 前</text>
  <text x="250" y="368" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序：percentage DESC，并列时 user1 ASC</text>
</svg>
