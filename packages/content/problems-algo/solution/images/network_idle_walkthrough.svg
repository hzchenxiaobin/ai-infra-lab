<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：edges=[[0,1],[1,2]], patience=[0,2,1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">d[1]=1, d[2]=2；每个箭头 = 一条信息的完整往返</text>

  <!-- ===== Timeline axis ===== -->
  <!-- tick positions: t=0..8, x = 70 + t*55 -->
  <text x="50" y="78" font-size="10" fill="#888" font-weight="bold">秒</text>
  <path d="M 70 74 L 520 74" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ticks 0..8 -->
  <g font-size="10" fill="#888">
    <path d="M 70 70 L 70 78" stroke="#888" stroke-width="1"/><text x="70" y="64" text-anchor="middle">0</text>
    <path d="M 125 70 L 125 78" stroke="#888" stroke-width="1"/><text x="125" y="64" text-anchor="middle">1</text>
    <path d="M 180 70 L 180 78" stroke="#888" stroke-width="1"/><text x="180" y="64" text-anchor="middle">2</text>
    <path d="M 235 70 L 235 78" stroke="#888" stroke-width="1"/><text x="235" y="64" text-anchor="middle">3</text>
    <path d="M 290 70 L 290 78" stroke="#888" stroke-width="1"/><text x="290" y="64" text-anchor="middle">4</text>
    <path d="M 345 70 L 345 78" stroke="#888" stroke-width="1"/><text x="345" y="64" text-anchor="middle">5</text>
    <path d="M 400 70 L 400 78" stroke="#888" stroke-width="1"/><text x="400" y="64" text-anchor="middle">6</text>
    <path d="M 455 70 L 455 78" stroke="#888" stroke-width="1"/><text x="455" y="64" text-anchor="middle">7</text>
    <path d="M 510 70 L 510 78" stroke="#888" stroke-width="1"/><text x="510" y="64" text-anchor="middle">8</text>
  </g>

  <!-- ===== Server 1 row ===== -->
  <text x="40" y="118" font-size="10" fill="#446688" font-weight="bold">服1</text>
  <text x="40" y="130" font-size="8" fill="#888">d=1</text>
  <text x="40" y="142" font-size="8" fill="#888">p=2</text>

  <!-- server 1: send at 0, reply arrives at 2 -->
  <rect x="60" y="106" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <!-- message path: 0 -> master(1) -> reply(2) -->
  <path d="M 70 124 Q 125 108 180 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="125" y="104" text-anchor="middle" font-size="8" fill="#446688">1A: 发→主(1s)→回(2s)</text>
  <!-- no resend marker -->
  <text x="235" y="124" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 第2秒收到回复，不重发</text>

  <!-- ===== Server 2 row ===== -->
  <text x="40" y="188" font-size="10" fill="#d6a040" font-weight="bold">服2</text>
  <text x="40" y="200" font-size="8" fill="#888">d=2</text>
  <text x="40" y="212" font-size="8" fill="#888">p=1</text>

  <rect x="60" y="166" width="400" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.3"/>

  <!-- 2A: sent 0, master 2, reply 4 -->
  <path d="M 70 184 Q 180 170 290 184" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="168" text-anchor="middle" font-size="8" fill="#d6a040">2A: 0→主(2)→回(4)</text>

  <!-- 2B: sent 1, master 3, reply 5 -->
  <path d="M 125 202 Q 235 188 345 202" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="235" y="190" text-anchor="middle" font-size="8" fill="#d6a040">2B: 1→主(3)→回(5)</text>

  <!-- 2C: sent 2, master 4, reply 6 -->
  <path d="M 180 220 Q 290 206 400 220" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="208" text-anchor="middle" font-size="8" fill="#d6a040">2C: 2→主(4)→回(6)</text>

  <!-- 2D: sent 3, master 5, reply 7 (LAST) -->
  <path d="M 235 238 Q 345 224 455 238" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="226" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2D: 3→主(5)→回(7) ← 最后</text>

  <!-- resend markers on server 2 row -->
  <g font-size="8" fill="#d6a040">
    <circle cx="125" cy="252" r="3" fill="#d6a040" filter="url(#rough2)"/><text x="125" y="266" text-anchor="middle">重发</text>
    <circle cx="180" cy="252" r="3" fill="#d6a040" filter="url(#rough2)"/><text x="180" y="266" text-anchor="middle">重发</text>
    <circle cx="235" cy="252" r="3" fill="#d6a040" filter="url(#rough2)"/><text x="235" y="266" text-anchor="middle">重发</text>
  </g>
  <!-- no resend at t=4 (reply arrived) -->
  <text x="290" y="266" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">第4秒收到回复</text>
  <text x="290" y="278" text-anchor="middle" font-size="8" fill="#b85450">停止重发</text>

  <!-- ===== Conclusion ===== -->
  <path d="M 280 290 L 280 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="314" width="440" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最后回复归位时刻：</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#444">服1: lastResend=0, lastReply=0+2=2</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">服2: lastResend=3, lastReply=3+4=7  →  max=7</text>

  <!-- answer -->
  <rect x="160" y="400" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = max(2, 7) + 1 = 8</text>
  <text x="280" y="436" text-anchor="middle" font-size="9" fill="#888">第7秒最后信息到达 → 第8秒起无信息在途</text>

  <!-- footer -->
  <text x="40" y="458" font-size="10" fill="#888">每条弧线 = 一条信息从发出到回复归位的完整往返</text>
</svg>
