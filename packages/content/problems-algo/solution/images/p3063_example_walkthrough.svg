<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 406" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="406" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：[1,1,2,1,2,3] 逐格计数，再把频率串成新链表</text>

  <!-- table header -->
  <rect x="48" y="40" width="448" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="58" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="122" y="58" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cur.val</text>
  <text x="241" y="58" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">freq 状态</text>
  <text x="413" y="58" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- table body -->
  <rect x="48" y="66" width="448" height="192" fill="#ffffff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 92 40 L 92 258 M 152 40 L 152 258 M 330 40 L 330 258" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 48 98 L 496 98 M 48 130 L 496 130 M 48 162 L 496 162 M 48 194 L 496 194 M 48 226 L 496 226" stroke="#e5e5e5" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 1 -->
  <text x="70" y="86" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="122" y="86" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="162" y="86" font-size="11.5" fill="#555" filter="url(#rough2)">{1:<tspan fill="#b85450" font-weight="bold">1</tspan>}</text>
  <text x="338" y="86" font-size="10.5" fill="#888" filter="url(#rough2)">值 1 首次出现，入表</text>

  <!-- row 2 -->
  <text x="70" y="118" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="122" y="118" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="162" y="118" font-size="11.5" fill="#555" filter="url(#rough2)">{1:<tspan fill="#b85450" font-weight="bold">2</tspan>}</text>
  <text x="338" y="118" font-size="10.5" fill="#888" filter="url(#rough2)">计数 +1</text>

  <!-- row 3 -->
  <text x="70" y="150" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="122" y="150" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="162" y="150" font-size="11.5" fill="#555" filter="url(#rough2)">{1:2, 2:<tspan fill="#b85450" font-weight="bold">1</tspan>}</text>
  <text x="338" y="150" font-size="10.5" fill="#888" filter="url(#rough2)">值 2 首次出现，入表</text>

  <!-- row 4 -->
  <text x="70" y="182" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="122" y="182" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="162" y="182" font-size="11.5" fill="#555" filter="url(#rough2)">{1:<tspan fill="#b85450" font-weight="bold">3</tspan>, 2:1}</text>
  <text x="338" y="182" font-size="10.5" fill="#888" filter="url(#rough2)">计数 +1（隔着 2 也记得）</text>

  <!-- row 5 -->
  <text x="70" y="214" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="122" y="214" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="162" y="214" font-size="11.5" fill="#555" filter="url(#rough2)">{1:3, 2:<tspan fill="#b85450" font-weight="bold">2</tspan>}</text>
  <text x="338" y="214" font-size="10.5" fill="#888" filter="url(#rough2)">计数 +1</text>

  <!-- row 6 -->
  <text x="70" y="246" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="122" y="246" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="162" y="246" font-size="11.5" fill="#555" filter="url(#rough2)">{1:3, 2:2, 3:<tspan fill="#b85450" font-weight="bold">1</tspan>}</text>
  <text x="338" y="246" font-size="10.5" fill="#888" filter="url(#rough2)">值 3 首次出现，入表</text>

  <!-- phase 2 -->
  <text x="48" y="288" font-size="11.5" fill="#555" filter="url(#rough2)">第二遍：遍历 freq = {1:3, 2:2, 3:1}，频率依次尾插成新链表</text>

  <text x="162" y="321" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">返回 →</text>
  <rect x="170" y="298" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="193" y="321" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 218 316 L 228 316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="230" y="298" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="253" y="321" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 278 316 L 288 316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="290" y="298" width="46" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="313" y="321" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="346" y="321" font-size="12" fill="#999" filter="url(#rough2)">→ ∅</text>

  <!-- bottom note -->
  <rect x="40" y="350" width="440" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⚠️ 重复值散布全表：第 2、4 步又遇到 1，哈希表记得历史计数</text>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">无序 ⇒ 不能只比相邻节点，必须全局计数（对照 82 题的数段法）</text>
</svg>
