<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：arr = [2,1,3,5,4,6,7], k = 2</text>

  <!-- ===== 表头 ===== -->
  <rect x="40" y="42" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤 i</text>
  <rect x="124" y="42" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">挑战者 arr[i]</text>
  <rect x="208" y="42" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">比较</text>
  <rect x="332" y="42" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="382" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">冠军 champion</text>
  <rect x="436" y="42" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="476" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">连胜 streak</text>

  <!-- ===== 初始行 ===== -->
  <rect x="40" y="74" width="80" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="92" text-anchor="middle" font-size="11" fill="#555">初始</text>
  <rect x="124" y="74" width="80" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="208" y="74" width="120" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="92" text-anchor="middle" font-size="11" fill="#888">champion = arr[0]</text>
  <rect x="332" y="74" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="382" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="436" y="74" width="80" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="92" text-anchor="middle" font-size="11" fill="#555">0</text>

  <!-- ===== i=1: arr[1]=1, 2>1 胜 ===== -->
  <rect x="40" y="106" width="80" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="124" text-anchor="middle" font-size="11" fill="#333">i = 1</text>
  <rect x="124" y="106" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="208" y="106" width="120" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a">2 &gt; 1 → 守擂</text>
  <rect x="332" y="106" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="382" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="436" y="106" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="476" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- ===== i=2: arr[2]=3, 2<3 换冠 ===== -->
  <rect x="40" y="138" width="80" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="156" text-anchor="middle" font-size="11" fill="#333">i = 2</text>
  <rect x="124" y="138" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="208" y="138" width="120" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="156" text-anchor="middle" font-size="11" fill="#d6a040">2 &lt; 3 → 易主</text>
  <rect x="332" y="138" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="436" y="138" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="476" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- ===== i=3: arr[3]=5, 3<5 换冠 ===== -->
  <rect x="40" y="170" width="80" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="188" text-anchor="middle" font-size="11" fill="#333">i = 3</text>
  <rect x="124" y="170" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="208" y="170" width="120" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="188" text-anchor="middle" font-size="11" fill="#d6a040">3 &lt; 5 → 易主</text>
  <rect x="332" y="170" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="436" y="170" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="476" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- ===== i=4: arr[4]=4, 5>4 胜, streak=2==k ===== -->
  <rect x="40" y="202" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i = 4</text>
  <rect x="124" y="202" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="208" y="202" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a">5 &gt; 4 → 守擂</text>
  <rect x="332" y="202" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="382" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="436" y="202" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 = k ✓</text>

  <!-- result arrow -->
  <path d="M 476 234 L 476 256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="120" y="256" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">streak == k → 返回 champion = 5 ✓</text>

  <!-- ===== 冠军单调递增示意 ===== -->
  <text x="40" y="312" font-size="10.5" fill="#666" font-weight="bold">冠军变化轨迹（单调递增）：</text>

  <rect x="80" y="320" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <path d="M 122 334 L 142 334" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="146" y="320" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <path d="M 188 334 L 208 334" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="320" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <path d="M 254 334 L 274 334" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="338" font-size="10.5" fill="#888">（后续 6, 7 会依次易主，但 5 已先达 k=2）</text>

  <!-- footer note -->
  <rect x="60" y="362" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#333">仅需遍历到 i = 4 即返回，未遍历完整个数组</text>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#555">若 k &gt; 6（n−1），则遍历完后冠军 = 7 = max(arr)，走兜底返回</text>
</svg>
