<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：单元格值 = 行增量 + 列增量，奇偶由行列各自决定</text>

  <!-- ===== Left: matrix decomposition ===== -->
  <text x="140" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">行列贡献可加</text>

  <!-- Column increment labels (top) -->
  <text x="84" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">colInc</text>
  <rect x="100" y="72" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="89" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="142" y="72" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="89" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <rect x="184" y="72" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="89" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0</text>

  <!-- Row increment labels (left) -->
  <text x="60" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">rowInc</text>
  <rect x="40" y="116" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="40" y="148" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="167" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>

  <!-- Matrix cells: [1,3,1] / [1,3,1] -->
  <rect x="100" y="116" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="142" y="116" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" font-family="monospace">3</text>
  <rect x="184" y="116" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="135" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>

  <rect x="100" y="148" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="167" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="142" y="148" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" font-family="monospace">3</text>
  <rect x="184" y="148" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="167" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>

  <!-- Highlight cell (0,1) = 3 -->
  <text x="162" y="108" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1+2=3</text>

  <!-- Arrows: row + col compose cell -->
  <path d="M 60 112 Q 80 100 100 124" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 162 100 L 162 112" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="28" y="192" width="218" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="137" y="213" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">val(i,j) = rowInc[i] + colInc[j]</text>

  <!-- ===== Right: parity truth table ===== -->
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">奇偶真值表</text>

  <!-- Table header -->
  <rect x="330" y="72" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="90" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">行</text>
  <rect x="388" y="72" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="90" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">列</text>
  <rect x="446" y="72" width="58" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="90" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">和</text>

  <!-- Row: odd + odd = even -->
  <rect x="330" y="100" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="117" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">奇</text>
  <rect x="388" y="100" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="117" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">奇</text>
  <rect x="446" y="100" width="58" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="117" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">偶</text>

  <!-- Row: odd + even = odd  (highlighted) -->
  <rect x="330" y="126" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="143" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">奇</text>
  <rect x="388" y="126" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="143" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">偶</text>
  <rect x="446" y="126" width="58" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="143" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" font-family="monospace">奇✓</text>

  <!-- Row: even + odd = odd  (highlighted) -->
  <rect x="330" y="152" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="169" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">偶</text>
  <rect x="388" y="152" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="169" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">奇</text>
  <rect x="446" y="152" width="58" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="169" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" font-family="monospace">奇✓</text>

  <!-- Row: even + even = even -->
  <rect x="330" y="178" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="195" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">偶</text>
  <rect x="388" y="178" width="58" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="195" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">偶</text>
  <rect x="446" y="178" width="58" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="195" text-anchor="middle" font-size="10" fill="#999" font-family="monospace">偶</text>

  <!-- Insight -->
  <rect x="318" y="210" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="418" y="231" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">一奇一偶 → 和为奇</text>

  <!-- ===== Bottom: formula ===== -->
  <rect x="28" y="248" width="484" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="265" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">只统计 oddR（奇数行数）、oddC（奇数列数）：</text>
  <text x="270" y="282" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" font-family="monospace">ans = oddR × (n − oddC) + (m − oddR) × oddC</text>

  <!-- Explanation -->
  <rect x="28" y="300" width="484" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="10.5" fill="#444">奇行×偶列：oddR 行各配 (n−oddC) 个偶列 → 奇+偶=奇</text>
  <text x="270" y="338" text-anchor="middle" font-size="10.5" fill="#444">偶行×奇列：(m−oddR) 行各配 oddC 个奇列 → 偶+奇=奇</text>
  <text x="270" y="356" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">无需建矩阵，O(m+n) 空间即可算出答案</text>
</svg>
