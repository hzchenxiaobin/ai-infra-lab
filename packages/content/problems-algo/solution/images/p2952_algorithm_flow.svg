<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 单趟扫描——能吸收则吸收，缺口就补 x</text>

  <!-- start -->
  <rect x="140" y="36" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">排序 coins；x = 1，i = 0，ans = 0</text>

  <path d="M 260 70 L 260 90" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="175,124 260,94 345,124 260,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">x ≤ target ?</text>

  <text x="360" y="116" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 345 124 L 384 124" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="386" y="108" width="97" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="434" y="128" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">返回 ans</text>

  <text x="270" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 154 L 260 184" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="165,224 260,188 355,224 260,260" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i &lt; n 且</text>
  <text x="260" y="230" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">coins[i] ≤ x ?</text>

  <text x="362" y="216" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 355 224 L 374 224" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="376" y="206" width="126" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="439" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">吸收（c ≤ x）</text>
  <text x="439" y="236" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">x += coins[i]；i++</text>

  <text x="270" y="280" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 260 260 L 260 284" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="180" y="288" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="9" fill="#8a6420" filter="url(#rough2)">真缺口：补面值 x</text>
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#8a6420" font-weight="bold" filter="url(#rough2)">ans++；x *= 2</text>

  <!-- loop back rail -->
  <path d="M 439 242 L 439 350 L 100 350 L 100 124 L 171 124" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 180 308 L 100 308" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="110" y="340" text-anchor="start" font-size="9" fill="#4a7a3a" filter="url(#rough2)">回判 x ≤ target</text>

  <!-- bottom note -->
  <rect x="48" y="366" width="424" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="10" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每枚硬币吸收一次；每次补币 x 翻倍 ⇒ 至多补 ⌈log₂ target⌉ + 1 枚</text>
</svg>
