<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：一次传球连接两次 Teams，产出（球队, 半场, ±1）</text>

  <rect x="26" y="48" width="204" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="128" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Passes（一条传球）</text>
  <text x="128" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pass_from = 3</text>
  <text x="128" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">time_stamp = 46:15, pass_to = 4</text>

  <rect x="322" y="42" width="212" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Teams t1（发起方副本）</text>
  <text x="428" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">player_id = 3 → Arsenal</text>

  <rect x="322" y="118" width="212" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Teams t2（接收方副本）</text>
  <text x="428" y="158" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">player_id = 4 → Chelsea</text>

  <path d="M 232 72 Q 284 66 314 64" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="52" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">JOIN ON pass_from</text>

  <path d="M 232 100 Q 284 118 314 140" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="122" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">JOIN ON pass_to</text>

  <rect x="26" y="150" width="204" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="128" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">Arsenal ≠ Chelsea</text>
  <text x="128" y="190" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">dominance = −1（被截获）</text>

  <path d="M 330 172 Q 300 172 236 176" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="26" y="224" width="204" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="128" y="247" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">→ (Arsenal, 2, −1)</text>

  <path d="M 128 208 L 128 218" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−1 记在发起方（自己被截自己扣分）</text>

  <rect x="26" y="286" width="508" height="92" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">时间轴：定长 'HH:MM' 字符串比较即时间比较</text>

  <rect x="56" y="320" width="216" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="337" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">上半场 half = 1（≤ 45:00）</text>

  <rect x="276" y="320" width="216" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="337" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">下半场 half = 2（&gt; 45:00）</text>

  <text x="56" y="360" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">00:00</text>
  <text x="272" y="360" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">45:00</text>
  <text x="492" y="360" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">90:00</text>

  <circle cx="300" cy="332" r="5" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 300 326 Q 306 310 318 304" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="326" y="300" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">46:15 落在下半场</text>
</svg>
