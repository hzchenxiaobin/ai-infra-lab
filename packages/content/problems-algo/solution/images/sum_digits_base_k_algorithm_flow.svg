<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：除 K 取余累加</text>

  <!-- Start node -->
  <ellipse cx="260" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 读入 n, k ;  sum = 0</text>

  <path d="M 260 82 L 260 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n > 0 ? -->
  <polygon points="260,104 380,146 260,188 140,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#333">n &gt; 0 ?</text>
  <text x="260" y="158" text-anchor="middle" font-size="10.5" fill="#666">(还有 base-k 位未抠)</text>

  <!-- No branch -> return sum -->
  <path d="M 380 146 L 440 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="138" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="424" y="166" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="467" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return sum</text>
  <path d="M 467 146 L 467 166" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Yes branch down -->
  <path d="M 260 188 L 260 206" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="202" font-size="11" fill="#82b366">是</text>

  <!-- sum += n % k -->
  <rect x="120" y="210" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">sum += n % k   （取最低 base-k 位累加）</text>

  <path d="M 260 244 L 260 260" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- n /= k -->
  <rect x="170" y="264" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">n /= k  （舍掉最低位）</text>

  <!-- loop back arrow to decision -->
  <path d="M 170 279 L 70 279 L 70 146 L 140 146" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="212" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 58 212)">回到循环判断</text>

  <!-- note -->
  <rect x="40" y="316" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="10.5" fill="#888">n ≥ 1 保证至少进循环一次；无需像 504 那样特判零或处理负号</text>
</svg>
