<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐行扫描 Person，匹配 Address</text>

  <!-- Step 1: Person row 1 -->
  <rect x="30" y="46" width="200" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="62" font-size="10" fill="#888" font-weight="bold">步骤 1：扫描 Person personId=1</text>
  <text x="40" y="80" font-size="10" fill="#333">Allen / Wang</text>
  <text x="40" y="96" font-size="10" fill="#4a7a3a">→ 在 Address 中找到 2 条匹配</text>

  <!-- Arrow to result rows -->
  <path d="M230 76 L290 76" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Result rows for step 1 -->
  <rect x="300" y="50" width="230" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="310" y="65" font-size="9.5" fill="#333">Allen | Wang | AllenTown | New York</text>
  <rect x="300" y="72" width="230" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="310" y="87" font-size="9.5" fill="#333">Allen | Wang | Petaluma | California</text>

  <!-- Step 2: Person row 2 -->
  <rect x="30" y="126" width="200" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="142" font-size="10" fill="#888" font-weight="bold">步骤 2：扫描 Person personId=2</text>
  <text x="40" y="160" font-size="10" fill="#333">Bob / Alice</text>
  <text x="40" y="176" font-size="10" fill="#4a7a3a">→ 在 Address 中找到 1 条匹配</text>

  <path d="M230 156 L290 156" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="300" y="146" width="230" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="310" y="161" font-size="9.5" fill="#333">Bob | Alice | Columbus | Georgia</text>

  <!-- Step 3: Person row 3 (no match) -->
  <rect x="30" y="206" width="200" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="222" font-size="10" fill="#888" font-weight="bold">步骤 3：扫描 Person personId=3</text>
  <text x="40" y="240" font-size="10" fill="#333">David / Chen</text>
  <text x="40" y="256" font-size="10" fill="#b85450">→ Address 中无匹配！</text>

  <path d="M230 236 L290 236" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="300" y="226" width="230" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="310" y="241" font-size="9.5" fill="#b85450" font-weight="bold">David | Chen | NULL | NULL</text>

  <!-- Key insight box -->
  <rect x="30" y="290" width="500" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键观察：LEFT JOIN = 逐行扫描左表 + 尝试匹配右表</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#666">• 一对多：Person 1 有 2 个地址 → 产出 2 行</text>
  <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#666">• 一对零：Person 3 无地址 → 仍产出 1 行，右表列填 NULL</text>

  <!-- Row count summary -->
  <rect x="30" y="380" width="500" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#333">结果行数 = 左表行数经「右表匹配数」膨胀后的总和</text>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 = 2（Allen×2 地址）+ 1（Bob×1 地址）+ 1（David×0 地址）</text>
  <text x="280" y="434" text-anchor="middle" font-size="9.5" fill="#888">David 行虽无匹配，仍占 1 行（这是 LEFT JOIN 与 INNER JOIN 的本质区别）</text>
</svg>
