<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分查找 nx(k) 与 nx(k+1)，差值即为答案</text>

  <!-- Start -->
  <rect x="200" y="44" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333">输入 k</text>
  <path d="M 270 72 L 270 90" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- zeta helper (from 172) -->
  <rect x="90" y="92" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">zeta(x) = v₅(x!) = ⌊x/5⌋ + ⌊x/25⌋ + ⌊x/125⌋ + …</text>
  <text x="270" y="128" text-anchor="middle" font-size="10" fill="#888">同 172 题：while x &gt; 0: x //= 5; res += x</text>
  <path d="M 270 136 L 270 156" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- nx(target) definition -->
  <rect x="60" y="158" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nx(target) = 最小 x 使 zeta(x) ≥ target</text>
  <text x="270" y="194" text-anchor="middle" font-size="10" fill="#888">搜索范围 [0, 5·(target+1)]，zeta 单调 → 可二分</text>
  <path d="M 270 202 L 270 222" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Binary search box -->
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#888" font-style="italic">二分查找 nx(target)</text>
  <rect x="50" y="248" width="440" height="116" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>

  <rect x="90" y="256" width="360" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="10.5" fill="#333">lo, hi = 0, 5*(target+1)</text>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" fill="#333">while lo &lt; hi:</text>
  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#333">  mid = (lo + hi) // 2</text>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#333">  if zeta(mid) ≥ target: hi = mid</text>
  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#333">  else: lo = mid + 1</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">return lo</text>

  <!-- arrow down -->
  <path d="M 270 364 L 270 384" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="100" y="386" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="408" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">answer = nx(k+1) − nx(k)</text>
  <path d="M 270 420 L 270 438" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="170" y="440" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="456" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return answer</text>
</svg>
