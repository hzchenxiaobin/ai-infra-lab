<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">图像平滑器：每格取「自身 + 8 邻居」的平均值（向下取整）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">3×3 滤波窗口，越界的格子不参与计算 → 分母随位置变化</text>

  <!-- ===== LEFT: interior cell, 9 valid ===== -->
  <text x="60" y="78" font-size="12" fill="#446688" font-weight="bold">内部格 (i,j)：9 格全有效</text>

  <!-- 8 neighbors (blue) -->
  <rect x="60"  y="90"  width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82"  y="118" text-anchor="middle" font-size="11" fill="#446688">·</text>
  <rect x="104" y="90"  width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="118" text-anchor="middle" font-size="11" fill="#446688">·</text>
  <rect x="148" y="90"  width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="118" text-anchor="middle" font-size="11" fill="#446688">·</text>

  <rect x="60"  y="134" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82"  y="162" text-anchor="middle" font-size="11" fill="#446688">·</text>
  <rect x="148" y="134" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="162" text-anchor="middle" font-size="11" fill="#446688">·</text>

  <rect x="60"  y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82"  y="206" text-anchor="middle" font-size="11" fill="#446688">·</text>
  <rect x="104" y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="206" text-anchor="middle" font-size="11" fill="#446688">·</text>
  <rect x="148" y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="206" text-anchor="middle" font-size="11" fill="#446688">·</text>

  <!-- center cell (orange) -->
  <rect x="104" y="134" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="126" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(i,j)</text>

  <!-- formula box -->
  <rect x="48" y="240" width="168" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="132" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">sum ÷ 9 → ans[i][j]</text>

  <!-- ===== RIGHT: corner cell, 4 valid ===== -->
  <text x="320" y="78" font-size="12" fill="#b85450" font-weight="bold">角落格 (0,0)：仅 4 格有效</text>

  <!-- top row: all out of bounds (dashed gray) -->
  <rect x="320" y="90"  width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="118" text-anchor="middle" font-size="12" fill="#bbb">×</text>
  <rect x="364" y="90"  width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="386" y="118" text-anchor="middle" font-size="12" fill="#bbb">×</text>
  <rect x="408" y="90"  width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="118" text-anchor="middle" font-size="12" fill="#bbb">×</text>

  <!-- middle row: left OOB, center orange, right valid -->
  <rect x="320" y="134" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="162" text-anchor="middle" font-size="12" fill="#bbb">×</text>
  <rect x="364" y="134" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="386" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(0,0)</text>
  <rect x="408" y="134" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="162" text-anchor="middle" font-size="11" fill="#446688">·</text>

  <!-- bottom row: left OOB, middle valid, right valid -->
  <rect x="320" y="178" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="206" text-anchor="middle" font-size="12" fill="#bbb">×</text>
  <rect x="364" y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="206" text-anchor="middle" font-size="11" fill="#446688">·</text>
  <rect x="408" y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="206" text-anchor="middle" font-size="11" fill="#446688">·</text>

  <!-- OOB label -->
  <text x="342" y="234" text-anchor="middle" font-size="9" fill="#aaa">越界</text>

  <!-- formula box -->
  <rect x="308" y="240" width="168" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="392" y="263" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">sum ÷ 4 → ans[0][0]</text>

  <!-- bottom note -->
  <rect x="40" y="298" width="480" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：分母 = 有效格数（1~9），不是固定 9</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#888">值均非负 → 整数除法 sum / count 自动向下取整，无需额外 floor</text>
</svg>
