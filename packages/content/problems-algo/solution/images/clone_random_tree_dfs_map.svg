<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="540" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">DFS + 哈希映射：遍历建节点，回溯设指针</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：原树 ===== -->
  <text x="40" y="74" font-size="13" font-weight="bold" fill="#2b6e9e">原树（DFS 遍历）</text>
  <!-- 节点 1 -->
  <g filter="url(#sk)">
    <rect x="80" y="86" width="46" height="34" rx="5" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="103" y="108" text-anchor="middle" font-size="12" fill="#234">1</text>
  <!-- 节点 4 -->
  <g filter="url(#sk)">
    <rect x="150" y="140" width="46" height="34" rx="5" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="173" y="162" text-anchor="middle" font-size="12" fill="#234">4</text>
  <!-- 节点 7 -->
  <g filter="url(#sk)">
    <rect x="110" y="200" width="46" height="34" rx="5" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="133" y="222" text-anchor="middle" font-size="12" fill="#234">7</text>
  <!-- 节点 5 -->
  <g filter="url(#sk)">
    <rect x="200" y="200" width="46" height="34" rx="5" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="223" y="222" text-anchor="middle" font-size="12" fill="#234">5</text>
  <!-- 树边 -->
  <path d="M 126 112 L 150 140" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 165 174 L 137 200" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 182 174 L 210 200" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- DFS 顺序编号 -->
  <text x="56" y="100" font-size="10" fill="#b85450" font-weight="bold">①</text>
  <text x="128" y="154" font-size="10" fill="#b85450" font-weight="bold">②</text>
  <text x="86" y="214" font-size="10" fill="#b85450" font-weight="bold">③</text>
  <text x="178" y="214" font-size="10" fill="#b85450" font-weight="bold">④</text>

  <!-- ===== 中：哈希映射表 ===== -->
  <text x="360" y="74" font-size="13" font-weight="bold" fill="#7a5415">哈希表 map（旧 → 新）</text>
  <g filter="url(#sk)">
    <rect x="350" y="84" width="170" height="160" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="392" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">old</text>
  <text x="478" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">new</text>
  <line x1="435" y1="90" x2="435" y2="240" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 2" filter="url(#sk)"/>
  <!-- 表行 -->
  <text x="392" y="126" text-anchor="middle" font-size="11" fill="#234">1</text>
  <text x="478" y="126" text-anchor="middle" font-size="11" fill="#2e6e2e">1'</text>
  <text x="392" y="150" text-anchor="middle" font-size="11" fill="#234">4</text>
  <text x="478" y="150" text-anchor="middle" font-size="11" fill="#2e6e2e">4'</text>
  <text x="392" y="174" text-anchor="middle" font-size="11" fill="#234">7</text>
  <text x="478" y="174" text-anchor="middle" font-size="11" fill="#2e6e2e">7'</text>
  <text x="392" y="198" text-anchor="middle" font-size="11" fill="#234">5</text>
  <text x="478" y="198" text-anchor="middle" font-size="11" fill="#2e6e2e">5'</text>
  <text x="392" y="224" text-anchor="middle" font-size="10" fill="#888">null</text>
  <text x="478" y="224" text-anchor="middle" font-size="10" fill="#888">null</text>
  <!-- 查询箭头 -->
  <text x="360" y="262" font-size="10" fill="#666">设指针时：map[old.random] → 新 random</text>

  <!-- ===== 右：新树 ===== -->
  <text x="690" y="74" font-size="13" font-weight="bold" fill="#2e6e2e">新树（深拷贝结果）</text>
  <!-- 节点 1' -->
  <g filter="url(#sk)">
    <rect x="730" y="86" width="46" height="34" rx="5" fill="#bfe0bf" stroke="#4a8e4a"/>
  </g>
  <text x="753" y="108" text-anchor="middle" font-size="12" fill="#2e6e2e">1'</text>
  <!-- 节点 4' -->
  <g filter="url(#sk)">
    <rect x="800" y="140" width="46" height="34" rx="5" fill="#bfe0bf" stroke="#4a8e4a"/>
  </g>
  <text x="823" y="162" text-anchor="middle" font-size="12" fill="#2e6e2e">4'</text>
  <!-- 节点 7' -->
  <g filter="url(#sk)">
    <rect x="760" y="200" width="46" height="34" rx="5" fill="#bfe0bf" stroke="#4a8e4a"/>
  </g>
  <text x="783" y="222" text-anchor="middle" font-size="12" fill="#2e6e2e">7'</text>
  <!-- 节点 5' -->
  <g filter="url(#sk)">
    <rect x="850" y="200" width="46" height="34" rx="5" fill="#bfe0bf" stroke="#4a8e4a"/>
  </g>
  <text x="873" y="222" text-anchor="middle" font-size="12" fill="#2e6e2e">5'</text>
  <!-- 树边 -->
  <path d="M 776 112 L 800 140" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 815 174 L 787 200" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 832 174 L 860 200" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <!-- random 边（绿虚线，指向新节点）-->
  <path d="M 800 150 Q 700 180 770 212" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 800 208 Q 900 150 778 116" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="876" y="156" font-size="9" fill="#b85450">4'.rnd→7'</text>
  <text x="690" y="130" font-size="9" fill="#b85450">7'.rnd→1'</text>

  <!-- ===== 底部：DFS 递归框架 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="860" height="110" rx="8" fill="#e8f0fa" stroke="#4a8edb"/>
  </g>
  <text x="60" y="324" font-size="12" font-weight="bold" fill="#2b6e9e">dfs(old) → new：一次递归同时完成「建节点 + 设指针」</text>
  <text x="60" y="346" font-size="11" fill="#444">1. 若 old 在 map 中已存在 → 直接返回 map[old]（避免重复创建 / 处理环）</text>
  <text x="60" y="366" font-size="11" fill="#444">2. 否则：new = new Node(old.val)；map[old] = new  ← 先登记再递归（防 random 自指死循环）</text>
  <text x="60" y="386" font-size="11" fill="#444">3. new.left = dfs(old.left)；new.right = dfs(old.right)  ← 递归拷贝子树</text>
  <text x="60" y="406" font-size="11" fill="#444">4. new.random = old.random ? map[old.random] : null  ← 查映射修正 random</text>

  <!-- ===== 为什么树不能用 138 的 O(1) 拼接法 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="426" width="860" height="98" rx="8" fill="#fce4ec" stroke="#b85450" stroke-dasharray="4 3"/>
  </g>
  <text x="60" y="450" font-size="12" font-weight="bold" fill="#7a2828">为什么不能照搬 138 的 O(1) 空间拼接法？</text>
  <text x="60" y="470" font-size="11" fill="#444">138 借用链表的 next 指针充当「旧→新」映射（A→A'→B→B'…），但二叉树没有线性 next——</text>
  <text x="60" y="488" font-size="11" fill="#444">left 和 right 都是 DFS 导航必需的指针，借走任一个都会破坏遍历本身（无法继续走子树）。</text>
  <text x="60" y="508" font-size="11" fill="#b03a3a" font-weight="bold">→ 树的深拷贝天然需要 O(n) 哈希表；这正是 138（链表）与 1485（树）的本质区别。</text>
</svg>
