<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">有效括号字符串：贪心区间算法流程</text>

  <!-- 起点 -->
  <rect x="210" y="48" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">lo = 0, hi = 0</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="160" y="104" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="129" text-anchor="middle" font-size="12" fill="#333">逐字符 c 扫描 s（未完则继续）</text>

  <path d="M 270 144 L 270 160" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形：字符类型 -->
  <polygon points="270,164 360,210 270,256 180,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="207" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">字符 c ?</text>

  <!-- 左分支: ( -->
  <path d="M 180 210 L 90 210 L 90 250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(</text>
  <rect x="30" y="254" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="274" text-anchor="middle" font-size="11" fill="#333">balance 必 +1</text>
  <text x="90" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">lo++, hi++</text>

  <!-- 中分支: ) -->
  <path d="M 270 256 L 270 280" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="272" font-size="11" fill="#b85450" font-weight="bold">)</text>
  <rect x="200" y="284" width="140" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="11" fill="#333">balance 必 −1</text>
  <text x="270" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">hi−−</text>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lo = max(lo−1, 0)</text>

  <!-- 右分支: * -->
  <path d="M 360 210 L 450 210 L 450 250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">*</text>
  <rect x="390" y="254" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="274" text-anchor="middle" font-size="11" fill="#333">三义各可能</text>
  <text x="450" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">hi++, lo=max(lo−1,0)</text>

  <!-- ) 分支的 hi<0 判断 -->
  <path d="M 270 348 L 270 368" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="270,372 330,392 270,412 210,392" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">hi &lt; 0 ?</text>
  <text x="345" y="396" font-size="10" fill="#b85450">是 → return false</text>

  <!-- 回到循环：三条分支汇合 -->
  <path d="M 90 304 Q 90 360 160 360 Q 200 360 200 124" fill="none" stroke="#666" stroke-width="1.3"
        stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 304 Q 450 360 380 360 Q 340 360 340 124" fill="none" stroke="#666" stroke-width="1.3"
        stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 终点（循环结束后） -->
  <rect x="170" y="372" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="394" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return lo==0</text>
</svg>
