<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐轮推演</text>

  <!-- ===== Table 1: n=5, k=2 ===== -->
  <text x="40" y="46" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：n=5, k=2</text>

  <!-- header -->
  <rect x="40" y="52" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">轮次 i</text>
  <rect x="104" y="52" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">持球者</text>
  <rect x="184" y="52" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="229" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">步数 i·k</text>
  <rect x="274" y="52" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="334" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">下一接收者</text>
  <rect x="394" y="52" width="146" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="467" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">状态 vis</text>

  <!-- row 1 -->
  <rect x="40" y="80" width="64" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="72" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="80" width="80" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="144" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="80" width="90" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="229" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="274" y="80" width="120" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="334" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="394" y="80" width="146" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="467" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">接球 {1,3}</text>

  <!-- row 2 -->
  <rect x="40" y="106" width="64" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="72" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="104" y="106" width="80" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="144" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="184" y="106" width="90" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="229" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="274" y="106" width="120" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="334" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="394" y="106" width="146" height="26" fill="#fafafa" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="467" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">接球 {1,2,3}</text>

  <!-- row 3 (terminating, red) -->
  <rect x="40" y="132" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="104" y="132" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="184" y="132" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="229" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="274" y="132" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="334" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="394" y="132" width="146" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="467" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 已接→结束</text>

  <!-- result 1 -->
  <text x="40" y="180" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→ 输家 = 未接球者 = [4, 5]</text>

  <!-- ===== Table 2: n=4, k=4 ===== -->
  <text x="40" y="206" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：n=4, k=4</text>

  <!-- header -->
  <rect x="40" y="212" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="228" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">轮次 i</text>
  <rect x="104" y="212" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="228" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">持球者</text>
  <rect x="184" y="212" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="229" y="228" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">步数 i·k</text>
  <rect x="274" y="212" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="334" y="228" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">下一接收者</text>
  <rect x="394" y="212" width="146" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="467" y="228" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">状态 vis</text>

  <!-- row 1 (terminating) -->
  <rect x="40" y="236" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="104" y="236" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="184" y="236" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="229" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="274" y="236" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="334" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="394" y="236" width="146" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="467" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 已接→结束</text>

  <!-- result 2 -->
  <text x="40" y="284" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→ 输家 = [2, 3, 4]</text>
</svg>
