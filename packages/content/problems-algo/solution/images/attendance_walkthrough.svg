<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算 n = 2：6 个状态计数逐层推进</text>

  <!-- column headers -->
  <text x="60" y="76" font-size="11" fill="#888">长度</text>
  <text x="130" y="76" font-size="11" fill="#888" text-anchor="middle">S0(0,0)</text>
  <text x="200" y="76" font-size="11" fill="#888" text-anchor="middle">S1(0,1)</text>
  <text x="270" y="76" font-size="11" fill="#888" text-anchor="middle">S2(0,2)</text>
  <text x="340" y="76" font-size="11" fill="#888" text-anchor="middle">S3(1,0)</text>
  <text x="410" y="76" font-size="11" fill="#888" text-anchor="middle">S4(1,1)</text>
  <text x="480" y="76" font-size="11" fill="#888" text-anchor="middle">S5(1,2)</text>
  <text x="555" y="76" font-size="11" fill="#888" text-anchor="middle">合计</text>

  <!-- length = 1 row -->
  <rect x="40" y="92" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="105" y="92" width="55" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="132" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="170" y="92" width="55" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="197" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="235" y="92" width="55" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="262" y="120" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="300" y="92" width="55" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="327" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="365" y="92" width="55" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="392" y="120" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="430" y="92" width="55" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="457" y="120" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="500" y="92" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="535" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3 ✓</text>

  <!-- init annotation -->
  <text x="300" y="156" text-anchor="middle" font-size="10" fill="#888">初始：放 P→S0, 放 L→S1, 放 A→S3 各 1 种</text>

  <!-- arrow down -->
  <path d="M 300 168 L 300 184" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- length = 2 row -->
  <rect x="40" y="190" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="105" y="190" width="55" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="132" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="170" y="190" width="55" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="197" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="235" y="190" width="55" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="262" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="300" y="190" width="55" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="327" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="365" y="190" width="55" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="392" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="430" y="190" width="55" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="457" y="218" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="500" y="190" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="535" y="218" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8 ✓</text>

  <!-- derivation breakdown -->
  <rect x="40" y="252" width="530" height="170" fill="#fafafa" stroke="#888" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="55" y="272" font-size="11" fill="#555" font-weight="bold">长度 2 各状态的来源（从长度 1 推过来）：</text>

  <text x="55" y="292" font-size="11" fill="#446688">S0 = 2：S0放P + S1放P = 1+1        → "PP", "LP"</text>
  <text x="55" y="312" font-size="11" fill="#4a7a3a">S1 = 1：S0放L = 1                  → "PL"</text>
  <text x="55" y="332" font-size="11" fill="#4a7a3a">S2 = 1：S1放L = 1                  → "LL"</text>
  <text x="55" y="352" font-size="11" fill="#d6a040">S3 = 3：S0放A + S1放A + S3放P = 3  → "PA", "LA", "AP"</text>
  <text x="55" y="372" font-size="11" fill="#666">S4 = 1：S3放L = 1                  → "AL"</text>
  <text x="55" y="392" font-size="11" fill="#999">S5 = 0：需 S4放L，但 S4=0          → 无</text>

  <!-- footnote -->
  <rect x="40" y="430" width="530" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="446" text-anchor="middle" font-size="11" fill="#555">合计 2+1+1+3+1+0 = 8，与示例一致（仅 "AA" 因第 2 个 A 被剪掉）</text>
</svg>
