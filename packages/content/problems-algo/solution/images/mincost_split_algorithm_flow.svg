<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：固定右端 i，左端 j 向左扩展，O(1) 增量维护 trimmed</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">窗口 [j..i-1] 每加入一个 nums[j]，按"加入前该值出现次数 c"分三支更新 trimmed</text>

  <!-- outer loop box -->
  <rect x="40" y="64" width="540" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="84" font-size="12" fill="#444" font-weight="bold">① 外层：for i = 1..n（计算 dp[i]，即前 i 个元素的最小代价）</text>
  <text x="60" y="100" font-size="10" fill="#555">每轮重置 freq[v]=0、trimmed=0，左端 j 从 i−1 向 0 扫</text>

  <!-- inner loop start -->
  <rect x="40" y="120" width="240" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="140" font-size="12" fill="#444" font-weight="bold">② 内层：for j = i−1 ↓ 0</text>
  <text x="60" y="156" font-size="10" fill="#555">v = nums[j]，读加入前频次 c = freq[v]</text>

  <path d="M 160 164 L 160 188" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond: c ? -->
  <polygon points="160,190 250,232 160,274 70,232" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="228" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">加入前频次 c</text>
  <text x="160" y="244" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">= ?</text>

  <!-- three branches -->
  <!-- c == 0 -->
  <path d="M 70 232 L 30 232 L 30 300" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="34" y="226" font-size="9" fill="#888">c=0</text>
  <rect x="10" y="300" width="120" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v 从无到有</text>
  <text x="70" y="340" text-anchor="middle" font-size="11" fill="#333">trimmed += 0</text>
  <text x="70" y="354" text-anchor="middle" font-size="9" fill="#888">（仅 1 次，不计数）</text>

  <!-- c == 1 -->
  <path d="M 160 274 L 160 300" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="168" y="294" font-size="9" fill="#888">c=1</text>
  <rect x="140" y="300" width="120" height="60" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v 从 1 到 2 次</text>
  <text x="200" y="340" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">trimmed += 2</text>
  <text x="200" y="354" text-anchor="middle" font-size="9" fill="#888">（两份都补回）</text>

  <!-- c >= 2 -->
  <path d="M 250 232 L 290 232 L 290 300" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="266" y="226" font-size="9" fill="#888">c≥2</text>
  <rect x="270" y="300" width="120" height="60" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">v 已 ≥2 次</text>
  <text x="330" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a">trimmed += 1</text>
  <text x="330" y="354" text-anchor="middle" font-size="9" fill="#888">（多 1 份计数）</text>

  <!-- merge to freq update -->
  <path d="M 70 360 L 70 380 L 200 380 L 200 366" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 330 360 L 330 380 L 200 380" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="140" y="362" width="120" height="22" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="378" text-anchor="middle" font-size="10" fill="#444">freq[v] = c + 1</text>

  <!-- dp update box on the right -->
  <rect x="430" y="120" width="150" height="200" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ 更新 dp[i]</text>
  <text x="505" y="168" text-anchor="middle" font-size="10" fill="#555">每次扩展 j 后：</text>
  <text x="448" y="190" font-size="10" fill="#333">dp[i] = min(</text>
  <text x="448" y="206" font-size="10" fill="#333">  dp[i],</text>
  <text x="448" y="222" font-size="10" fill="#333">  dp[j] + k</text>
  <text x="448" y="238" font-size="10" fill="#333">       + trimmed</text>
  <text x="448" y="254" font-size="10" fill="#333">)</text>
  <text x="448" y="278" font-size="9" fill="#888">dp[j]：前 j 个已切好</text>
  <text x="448" y="292" font-size="9" fill="#888">k+trimmed：子数组[j..i−1]</text>
  <text x="448" y="306" font-size="9" fill="#888">的重要性</text>

  <!-- arrow from merge to dp update -->
  <path d="M 260 374 L 430 220" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="350" y="300" font-size="9" fill="#b85450">算候选</text>

  <!-- loop back arrow: j decreases -->
  <path d="M 100 374 Q 40 374 40 142 L 40 142" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="20" y="300" font-size="9" fill="#888" transform="rotate(-90 20 300)">j−−，继续向左</text>

  <!-- bottom complexity -->
  <rect x="40" y="416" width="540" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="438" font-size="12" fill="#444" font-weight="bold">复杂度：时间 O(n²)（n=1000 → 10⁶），空间 O(n)</text>
  <text x="60" y="452" font-size="10" fill="#555">每个 i 内层 j 扫一遍，trimmed 摊还 O(1)；freq 用数组（nums[i] &lt; n 可作下标）省哈希开销</text>
</svg>
