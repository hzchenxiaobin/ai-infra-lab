<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两组输入的逐位替换过程</text>

  <!-- ===== Example 1 ===== -->
  <text x="60" y="56" font-size="12" fill="#446688" font-weight="bold">示例 1：s = "a1c1e1"</text>

  <!-- Header row -->
  <rect x="70" y="64" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="162" y1="64" x2="162" y2="90" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="254" y1="64" x2="254" y2="90" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="346" y1="64" x2="346" y2="90" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="64" x2="438" y2="90" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">奇数下标 i</text>
  <text x="208" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i-1]（字母）</text>
  <text x="300" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i]（数字）</text>
  <text x="392" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">偏移 x</text>
  <text x="484" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">新字符</text>

  <!-- Row 1: i=1, a, 1, 1, b -->
  <rect x="70" y="92" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="162" y1="92" x2="162" y2="118" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="254" y1="92" x2="254" y2="118" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="346" y1="92" x2="346" y2="118" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="92" x2="438" y2="118" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="110" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="208" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="300" y="110" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="392" y="110" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="484" y="110" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">b</text>

  <!-- Row 2: i=3, c, 1, 1, d -->
  <rect x="70" y="120" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="162" y1="120" x2="162" y2="146" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="254" y1="120" x2="254" y2="146" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="346" y1="120" x2="346" y2="146" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="120" x2="438" y2="146" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="138" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="208" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="300" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="392" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="484" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">d</text>

  <!-- Row 3: i=5, e, 1, 1, f -->
  <rect x="70" y="148" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="162" y1="148" x2="162" y2="174" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="254" y1="148" x2="254" y2="174" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="346" y1="148" x2="346" y2="174" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="148" x2="438" y2="174" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="166" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="208" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">e</text>
  <text x="300" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="392" y="166" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="484" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">f</text>

  <!-- Result 1 -->
  <rect x="150" y="184" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="204" font-size="11" fill="#555">结果：</text>
  <text x="215" y="205" font-size="13" fill="#4a7a3a" font-weight="bold">"abcdef"</text>

  <!-- ===== Example 2 ===== -->
  <text x="60" y="240" font-size="12" fill="#446688" font-weight="bold">示例 2：s = "a1b2c3d4e"</text>

  <!-- Header row -->
  <rect x="70" y="248" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="162" y1="248" x2="162" y2="274" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="254" y1="248" x2="254" y2="274" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="346" y1="248" x2="346" y2="274" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="248" x2="438" y2="274" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">奇数下标 i</text>
  <text x="208" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i-1]（字母）</text>
  <text x="300" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i]（数字）</text>
  <text x="392" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">偏移 x</text>
  <text x="484" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">新字符</text>

  <!-- Row 1: i=1, a, 1, 1, b -->
  <rect x="70" y="276" width="460" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="162" y1="276" x2="162" y2="300" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="254" y1="276" x2="254" y2="300" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="346" y1="276" x2="346" y2="300" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="276" x2="438" y2="300" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="292" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="208" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="300" y="292" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="392" y="292" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="484" y="292" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">b</text>

  <!-- Row 2: i=3, b, 2, 2, d -->
  <rect x="70" y="302" width="460" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="162" y1="302" x2="162" y2="326" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="254" y1="302" x2="254" y2="326" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="346" y1="302" x2="346" y2="326" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="302" x2="438" y2="326" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="318" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="208" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="300" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="392" y="318" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="484" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">d</text>

  <!-- Row 3: i=5, c, 3, 3, f -->
  <rect x="70" y="328" width="460" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="162" y1="328" x2="162" y2="352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="254" y1="328" x2="254" y2="352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="346" y1="328" x2="346" y2="352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="328" x2="438" y2="352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="344" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="208" y="344" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="300" y="344" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="392" y="344" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="484" y="344" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">f</text>

  <!-- Row 4: i=7, d, 4, 4, h -->
  <rect x="70" y="354" width="460" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="162" y1="354" x2="162" y2="378" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="254" y1="354" x2="254" y2="378" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="346" y1="354" x2="346" y2="378" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="354" x2="438" y2="378" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="116" y="370" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="208" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">d</text>
  <text x="300" y="370" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <text x="392" y="370" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="484" y="370" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">h</text>

  <!-- Result 2 -->
  <rect x="130" y="390" width="340" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="410" font-size="11" fill="#555">结果：</text>
  <text x="195" y="411" font-size="13" fill="#4a7a3a" font-weight="bold">"abbdcfdhe"</text>

  <!-- Note -->
  <rect x="70" y="432" width="460" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="454" text-anchor="middle" font-size="11" fill="#666">观察：偏移量 x = s[i] - '0'（数字字符转数值）</text>
  <text x="300" y="472" text-anchor="middle" font-size="11" fill="#666">新字符 = s[i-1] + x，偶数位字母（a/c/e...）原样保留</text>
</svg>
