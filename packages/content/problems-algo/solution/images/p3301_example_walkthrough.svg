<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：双天花板逐位压制</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 1：输入 [2,3,4,3] → 降序 [4,3,3,2]</text>

  <!-- 上表：表头 y 48~74 -->
  <rect x="96" y="48" width="328" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="65" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="160" y="65" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">a[i]</text>
  <text x="221" y="65" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">prev−1</text>
  <text x="302" y="65" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">h = min(a[i], prev−1)</text>
  <text x="387" y="65" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">累积 ans</text>

  <!-- 上表数据 4 行：74~178 -->
  <rect x="96" y="74" width="328" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="91" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="160" y="91" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="221" y="91" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">+∞</text>
  <text x="302" y="91" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="387" y="91" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="96" y="100" width="328" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="117" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="160" y="117" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="221" y="117" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="302" y="117" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="387" y="117" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="96" y="126" width="328" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="114" y="143" text-anchor="middle" font-size="10.5" fill="#7a5a20" filter="url(#rough2)">2</text>
  <text x="160" y="143" text-anchor="middle" font-size="10.5" fill="#7a5a20" filter="url(#rough2)">3</text>
  <text x="221" y="143" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="302" y="143" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">2 ← cap 明明是 3</text>
  <text x="387" y="143" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="96" y="152" width="328" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="169" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="160" y="169" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="221" y="169" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="302" y="169" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="387" y="169" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10</text>

  <rect x="150" y="184" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="199" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">高度 [4,3,2,1]，总高 = 10 ✓</text>

  <!-- 下表：无解例 -->
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">示例 3：输入 [2,2,1] → 降序 [2,2,1]</text>

  <rect x="96" y="236" width="328" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="252" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="160" y="252" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">a[i]</text>
  <text x="221" y="252" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">prev−1</text>
  <text x="302" y="252" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">h = min(a[i], prev−1)</text>
  <text x="387" y="252" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">累积 ans</text>

  <rect x="96" y="260" width="328" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="276" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="160" y="276" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="221" y="276" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">+∞</text>
  <text x="302" y="276" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="387" y="276" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="96" y="284" width="328" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="300" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="160" y="300" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="221" y="300" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="302" y="300" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="387" y="300" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="96" y="308" width="328" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" rx="3" filter="url(#rough2)"/>
  <text x="114" y="324" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">2</text>
  <text x="160" y="324" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">1</text>
  <text x="221" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="302" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 ✗ 不是正整数</text>
  <text x="387" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">—</text>

  <rect x="96" y="338" width="328" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">连「逐位最大」都凑不出正整数 ⇒ return −1</text>
</svg>
