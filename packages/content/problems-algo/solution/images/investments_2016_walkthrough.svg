<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：两个白名单各自产出 → AND 取交集 → SUM</text>

  <!-- Panel 1: Condition ① -->
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">条件① GROUP BY tiv_2015 HAVING COUNT(*) &gt; 1</text>

  <rect x="120" y="56" width="380" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="72" font-size="9.5" fill="#333">tiv_2015</text>
  <text x="250" y="72" font-size="9.5" fill="#333">COUNT(*)</text>
  <text x="340" y="72" font-size="9.5" fill="#333">pid 列表</text>
  <text x="450" y="72" font-size="9.5" fill="#333">&gt; 1? 入选?</text>

  <rect x="120" y="80" width="380" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="95" font-size="9.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="250" y="95" font-size="9.5" fill="#333" font-weight="bold">3</text>
  <text x="340" y="95" font-size="9.5" fill="#666">1, 3, 4</text>
  <text x="450" y="95" font-size="9.5" fill="#b85450" font-weight="bold">✓ ✓</text>

  <rect x="120" y="102" width="380" height="22" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="117" font-size="9.5" fill="#888">20</text>
  <text x="250" y="117" font-size="9.5" fill="#888">1</text>
  <text x="340" y="117" font-size="9.5" fill="#888">2</text>
  <text x="450" y="117" font-size="9.5" fill="#888">✗ ✗</text>

  <rect x="220" y="130" width="180" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="145" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">白名单 A = {10}</text>

  <!-- arrow down -->
  <path d="M310 154 L310 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Panel 2: Condition ② -->
  <text x="310" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">条件② GROUP BY lat, lon HAVING COUNT(*) = 1</text>

  <rect x="120" y="192" width="380" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="208" font-size="9.5" fill="#333">(lat, lon)</text>
  <text x="250" y="208" font-size="9.5" fill="#333">COUNT(*)</text>
  <text x="340" y="208" font-size="9.5" fill="#333">pid 列表</text>
  <text x="450" y="208" font-size="9.5" fill="#333">= 1? 入选?</text>

  <rect x="120" y="216" width="380" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="231" font-size="9.5" fill="#4a7a3a" font-weight="bold">(10, 10)</text>
  <text x="250" y="231" font-size="9.5" fill="#333" font-weight="bold">1</text>
  <text x="340" y="231" font-size="9.5" fill="#666">1</text>
  <text x="450" y="231" font-size="9.5" fill="#b85450" font-weight="bold">✓ ✓</text>

  <rect x="120" y="238" width="380" height="22" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="253" font-size="9.5" fill="#888">(20, 20)</text>
  <text x="250" y="253" font-size="9.5" fill="#888">2</text>
  <text x="340" y="253" font-size="9.5" fill="#888">2, 3</text>
  <text x="450" y="253" font-size="9.5" fill="#888">✗ ✗</text>

  <rect x="120" y="260" width="380" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="275" font-size="9.5" fill="#4a7a3a" font-weight="bold">(40, 40)</text>
  <text x="250" y="275" font-size="9.5" fill="#333" font-weight="bold">1</text>
  <text x="340" y="275" font-size="9.5" fill="#666">4</text>
  <text x="450" y="275" font-size="9.5" fill="#b85450" font-weight="bold">✓ ✓</text>

  <rect x="190" y="288" width="240" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="303" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">白名单 B = {(10,10), (40,40)}</text>

  <!-- arrow down -->
  <path d="M310 312 L310 326" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Panel 3: AND filter -->
  <text x="310" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">外层 WHERE：tiv_2015 ∈ A AND (lat,lon) ∈ B</text>

  <rect x="60" y="350" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="366" font-size="9.5" fill="#333">pid</text>
  <text x="130" y="366" font-size="9.5" fill="#333">tiv_2015</text>
  <text x="200" y="366" font-size="9.5" fill="#333">(lat,lon)</text>
  <text x="290" y="366" font-size="9.5" fill="#d6a040">∈ A?</text>
  <text x="350" y="366" font-size="9.5" fill="#4a7a3a">∈ B?</text>
  <text x="410" y="366" font-size="9.5" fill="#b85450">AND?</text>
  <text x="470" y="366" font-size="9.5" fill="#333">tiv_2016</text>

  <!-- pid 1: hit -->
  <rect x="60" y="374" width="500" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="389" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="130" y="389" font-size="9.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="200" y="389" font-size="9.5" fill="#4a7a3a" font-weight="bold">(10,10)</text>
  <text x="290" y="389" font-size="9.5" fill="#b85450" font-weight="bold">✓</text>
  <text x="350" y="389" font-size="9.5" fill="#b85450" font-weight="bold">✓</text>
  <text x="410" y="389" font-size="9.5" fill="#b85450" font-weight="bold">✓</text>
  <text x="470" y="389" font-size="9.5" fill="#b85450" font-weight="bold">5</text>

  <!-- pid 2: miss both -->
  <rect x="60" y="396" width="500" height="22" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="411" font-size="9.5" fill="#888">2</text>
  <text x="130" y="411" font-size="9.5" fill="#888">20</text>
  <text x="200" y="411" font-size="9.5" fill="#888">(20,20)</text>
  <text x="290" y="411" font-size="9.5" fill="#888">✗</text>
  <text x="350" y="411" font-size="9.5" fill="#888">✗</text>
  <text x="410" y="411" font-size="9.5" fill="#888">✗</text>
  <text x="470" y="411" font-size="9.5" fill="#888">—</text>

  <!-- pid 3: hit A, miss B (key trap) -->
  <rect x="60" y="418" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="433" font-size="9.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="130" y="433" font-size="9.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="200" y="433" font-size="9.5" fill="#888">(20,20)</text>
  <text x="290" y="433" font-size="9.5" fill="#b85450" font-weight="bold">✓</text>
  <text x="350" y="433" font-size="9.5" fill="#888">✗</text>
  <text x="410" y="433" font-size="9.5" fill="#888">✗</text>
  <text x="470" y="433" font-size="9.5" fill="#888">—</text>

  <!-- pid 4: hit -->
  <rect x="60" y="440" width="500" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="455" font-size="9.5" fill="#b85450" font-weight="bold">4</text>
  <text x="130" y="455" font-size="9.5" fill="#d6a040" font-weight="bold">10</text>
  <text x="200" y="455" font-size="9.5" fill="#4a7a3a" font-weight="bold">(40,40)</text>
  <text x="290" y="455" font-size="9.5" fill="#b85450" font-weight="bold">✓</text>
  <text x="350" y="455" font-size="9.5" fill="#b85450" font-weight="bold">✓</text>
  <text x="410" y="455" font-size="9.5" fill="#b85450" font-weight="bold">✓</text>
  <text x="470" y="455" font-size="9.5" fill="#b85450" font-weight="bold">40</text>

  <!-- Sum result -->
  <path d="M310 464 L310 478" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="180" y="482" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="500" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ROUND(SUM(5, 40), 2)</text>
  <text x="310" y="518" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">= 45.00</text>

  <!-- trap note -->
  <text x="565" y="432" font-size="8.5" fill="#d6a040" font-weight="bold">← 陷阱</text>
  <text x="565" y="445" font-size="8" fill="#888">pid 3 满足①</text>
  <text x="565" y="456" font-size="8" fill="#888">但位置重复</text>
</svg>
