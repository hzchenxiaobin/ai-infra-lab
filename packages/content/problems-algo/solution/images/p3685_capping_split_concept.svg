<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">核心观察：降序排序后，封顶 x = 前 t 个变 x ＋ 后缀原样</text>

  <!-- 排序后数组 -->
  <text x="96" y="89" text-anchor="end" font-size="13" fill="#888" filter="url(#rough2)">降序 nums =</text>
  <rect x="104" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="64" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="64" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="64" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="184" y="89" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="240" y="89" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="296" y="89" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 括号标注 -->
  <path d="M 104 112 L 104 122 L 208 122 L 208 112" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="140" text-anchor="middle" font-size="12" fill="#b3541e" filter="url(#rough2)">前 t = 2 个 &gt; x，被封顶</text>
  <path d="M 216 112 L 216 122 L 320 122 L 320 112" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">≤ x，原样保留</text>

  <path d="M 212 150 L 212 164" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="162" font-size="11" fill="#888" filter="url(#rough2)">min(v, x)</text>

  <!-- 封顶后数组 -->
  <text x="96" y="195" text-anchor="end" font-size="13" fill="#888" filter="url(#rough2)">x = 3 封顶后 =</text>
  <rect x="104" y="170" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="170" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="170" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="170" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="195" text-anchor="middle" font-size="14" fill="#b3541e" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="184" y="195" text-anchor="middle" font-size="14" fill="#b3541e" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="240" y="195" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="296" y="195" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="212" y="232" text-anchor="middle" font-size="12" fill="#b3541e"
        filter="url(#rough2)">前 t 个全变成同一个值 x —— 任取 m 个（0 ≤ m ≤ t）</text>

  <!-- 公式框 -->
  <rect x="52" y="246" width="416" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold"
        filter="url(#rough2)">子序列总和 = m·x ＋ s，其中 s ∈ dp[t]（后缀的子序列和集合）</text>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">dp[t] 只依赖切分点 t、与 x 无关 —— 全部 x 共享同一张表！</text>

  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">answer[x−1] = true ⟺ ∃ m ∈ [0, t] 使 dp[t][k − m·x] = true</text>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">示例：nums = [4,3,2,4]，x = 3 ⇒ t = 2，封顶后为 [3, 3, 3, 2]</text>
</svg>
