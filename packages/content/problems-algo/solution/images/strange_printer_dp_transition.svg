<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">区间 DP 转移：dp[i][j] = 打印 s[i..j] 的最少轮数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">两种情况：默认单独涂 s[j] / 找同字符 s[k]==s[j] 合并</text>

  <!-- ===== case A: default ===== -->
  <rect x="30" y="60" width="500" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="45" y="82" font-size="12" fill="#3a4a66" font-weight="bold">情况 A（默认）：s[j] 单独开一轮</text>

  <!-- row of cells: i ... j-1  j -->
  <rect x="60" y="96" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="116" text-anchor="middle" font-size="11" fill="#6a4a10">i</text>
  <rect x="160" y="96" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="116" text-anchor="middle" font-size="11" fill="#6a4a10">j-1</text>
  <rect x="260" y="96" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="116" text-anchor="middle" font-size="11" fill="#7a3a3a">j</text>

  <!-- brace under [i..j-1] -->
  <path d="M 78 128 L 78 134 L 178 134 L 178 128" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="128" y="148" text-anchor="middle" font-size="10.5" fill="#3a4a66">dp[i][j-1]</text>

  <text x="310" y="116" font-size="14" fill="#b85450" font-weight="bold">+1</text>
  <text x="335" y="116" font-size="10.5" fill="#7a3a3a">（s[j] 新开一轮）</text>

  <text x="45" y="166" font-size="11" fill="#3a4a66">dp[i][j] = dp[i][j-1] + 1</text>

  <!-- ===== case B: merge ===== -->
  <rect x="30" y="196" width="500" height="178" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="45" y="218" font-size="12" fill="#3a5a2a" font-weight="bold">情况 B（合并）：存在 k 使 s[k] == s[j]，j 复用涂 s[k] 的那轮</text>

  <!-- row of cells: i ... k  | k+1 ... j-1 |  j(free) -->
  <rect x="45" y="234" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="254" text-anchor="middle" font-size="10" fill="#6a4a10">i</text>

  <rect x="120" y="234" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="254" text-anchor="middle" font-size="10" fill="#7a3a3a">k</text>

  <rect x="210" y="234" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="254" text-anchor="middle" font-size="9.5" fill="#3a4a66">k+1</text>
  <rect x="290" y="234" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="254" text-anchor="middle" font-size="9.5" fill="#3a4a66">j-1</text>

  <rect x="370" y="234" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="254" text-anchor="middle" font-size="10" fill="#7a3a3a">j</text>
  <text x="385" y="278" text-anchor="middle" font-size="9" fill="#4a7a3a">免费</text>

  <!-- brace A: [i..k] -->
  <path d="M 60 266 L 60 282 L 135 282 L 135 266" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="97" y="296" text-anchor="middle" font-size="10.5" fill="#6a4a10">dp[i][k]</text>
  <text x="97" y="310" text-anchor="middle" font-size="9" fill="#6a4a10">(k 那轮顺带涂 j)</text>

  <!-- brace B: [k+1..j-1] -->
  <path d="M 225 266 L 225 282 L 305 282 L 305 266" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="265" y="296" text-anchor="middle" font-size="10.5" fill="#3a4a66">dp[k+1][j-1]</text>
  <text x="265" y="310" text-anchor="middle" font-size="9" fill="#3a4a66">(内部各自涂)</text>

  <!-- merge arrow linking k and j -->
  <path d="M 150 248 Q 260 232 370 248" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="9.5" fill="#b85450">s[k]==s[j] 同轮</text>

  <text x="45" y="338" font-size="11" fill="#3a5a2a">dp[i][j] = min(dp[i][j], dp[i][k] + dp[k+1][j-1])，对每个满足 s[k]==s[j] 的 k 取最小</text>
  <text x="45" y="356" font-size="10.5" fill="#3a5a2a">边界：dp[i][i] = 1；i &gt; j 时 dp[i][j] = 0（空段，内部为空）</text>

  <!-- footer -->
  <rect x="30" y="386" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="8" filter="url(#rough2)"/>
  <text x="45" y="403" font-size="10.5" fill="#6a4a10" font-weight="bold">填表顺序：i 从 n−1 到 0（倒序），j 从 i+1 到 n−1（正序），保证更短子区间已算好。</text>
</svg>
