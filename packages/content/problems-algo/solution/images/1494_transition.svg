<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">状态转移流程：子集枚举 DP</text>

  <rect x="150" y="44" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举每个 mask（已完成课程集）</text>
  <path d="M260,78 L260,92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="130" y="94" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">计算可选集 can</text>
  <text x="260" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">先修全部 ∈ mask 且课程本身 ∉ mask</text>
  <path d="M260,134 L260,148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <path d="M200,170 L260,148 L320,170 L260,192 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">popcount(can)</text>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">≤ k ?</text>

  <path d="M200,170 L120,170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M320,170 L400,170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="155" y="162" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="355" y="162" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="40" y="184" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">全选 sub = can</text>
  <text x="120" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">可选课程不超过 k 个</text>
  <text x="120" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">→ 全部上完最优</text>

  <rect x="320" y="184" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">枚举大小 = k 的子集</text>
  <text x="400" y="220" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">sub = (sub-1) &amp; can</text>
  <text x="400" y="232" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">恰好选 k 门最优</text>

  <path d="M120,240 L120,270 L240,270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M400,240 L400,270 L280,270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="160" y="256" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[mask | sub] = min(..., dp[mask]+1)</text>
  <path d="M260,290 L260,306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="130" y="308" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">重复直到 mask = (1&lt;&lt;n)-1</text>
  <path d="M260,342 L260,356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="160" y="358" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 dp[(1&lt;&lt;n)-1]</text>

  <rect x="30" y="404" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="422" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">关键优化：|can|≤k 全选，|can|&gt;k 只枚举大小恰为 k 的子集（少选浪费名额）</text>
</svg>
