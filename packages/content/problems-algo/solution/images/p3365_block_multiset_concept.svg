<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：块等长 ⟹ 切口固定 ⟹ 只比块多重集</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">同一对 s = "aabbcc"、t = "bbaacc"：k = 3 拼得出，k = 2 拼不出</text>

  <!-- 左面板：k=3 成立 -->
  <rect x="18" y="58" width="234" height="262" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="135" y="80" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">k = 3（块长 m = 2）✓</text>

  <text x="30" y="104" font-size="10" fill="#666" filter="url(#rough2)">s 切块</text>
  <rect x="28" y="108" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="127" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">aa</text>
  <rect x="93" y="108" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="127" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">bb</text>
  <rect x="158" y="108" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="127" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cc</text>

  <path d="M 57 140 C 57 160, 122 168, 122 184" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 122 140 C 122 160, 57 168, 57 184" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 187 140 L 187 184" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="28" y="188" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="207" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">bb</text>
  <rect x="93" y="188" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="207" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">aa</text>
  <rect x="158" y="188" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="207" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cc</text>
  <text x="224" y="206" font-size="10" fill="#666" filter="url(#rough2)">← t 切块</text>

  <text x="135" y="244" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">多重集 {aa:1, bb:1, cc:1} 两边相同</text>
  <text x="135" y="272" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">顺序乱没关系 → true</text>
  <text x="135" y="296" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（每块都能找到配对）</text>

  <!-- 右面板：k=2 不成立 -->
  <rect x="268" y="58" width="234" height="262" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="385" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">k = 2（块长 m = 3）✗</text>

  <text x="280" y="104" font-size="10" fill="#666" filter="url(#rough2)">s 切块</text>
  <rect x="278" y="108" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="127" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">aab</text>
  <rect x="392" y="108" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="127" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">bcc</text>

  <path d="M 330 184 L 330 142" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="344" y="168" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <path d="M 444 184 L 444 142" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="458" y="168" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="278" y="188" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="207" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">bba</text>
  <rect x="392" y="188" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="207" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">acc</text>
  <text x="478" y="206" font-size="10" fill="#666" filter="url(#rough2)">← t</text>

  <text x="385" y="244" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">bba、acc 都不在 {aab:1, bcc:1} 里</text>
  <text x="385" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">块对不上 → false</text>
  <text x="385" y="296" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（字符频率明明全相同！）</text>

  <!-- 底部要点 -->
  <rect x="18" y="334" width="484" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">切口由 k 唯一决定：块边界只能落在 m, 2m, 3m, … 处</text>
  <text x="260" y="376" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">判定单位要从「字符」升级为「块」——比较两边块的多重集即可</text>
</svg>
