<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：固定 4 轮，从个位到千位逐位取 min</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="58" rx="88" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 num1, num2, num3</text>

  <path d="M260,78 L260,96" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="180" y="100" width="160" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">key = 0，权重 p = 1</text>

  <path d="M260,136 L260,154" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 菱形：i < 4 ? -->
  <polygon points="260,158 350,192 260,226 170,192" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">还剩数位？</text>
  <text x="260" y="212" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">（固定问 4 次）</text>

  <!-- 是：向下 -->
  <path d="M260,226 L260,244" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="270" y="240" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 取个位 min -->
  <rect x="95" y="248" width="330" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">key += min(num1%10, num2%10, num3%10) × p</text>

  <path d="M260,286 L260,304" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 剥离个位 -->
  <rect x="95" y="308" width="330" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">三个数都 ÷= 10（剥掉个位），p ×= 10</text>

  <!-- 回边 -->
  <path d="M95,327 L58,327 L58,192 L168,192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)" stroke-dasharray="7 5"/>

  <!-- 否：向右返回 -->
  <path d="M350,192 L398,192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="358" y="184" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="402" y="168" width="105" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="454" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 key</text>
  <text x="454" y="206" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">整型，无前导 0</text>

  <!-- 侧注 -->
  <rect x="402" y="240" width="105" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="261" text-anchor="middle" font-size="10" font-weight="bold" fill="#a06a10" filter="url(#rough2)">数被除尽后</text>
  <text x="454" y="277" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">个位恒为 0</text>
  <text x="454" y="293" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">= 自动补的</text>
  <text x="454" y="309" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">前导 0 ✓</text>
</svg>
