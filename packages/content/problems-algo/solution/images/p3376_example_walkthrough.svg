<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 435"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="435" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：strength = [2,5,4]，k = 2 的 8 个状态</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">同一层（已开把数相同）共享同一个 x —— 层号就是 popcount</text>

  <!-- 层分隔虚线与层标题 -->
  <line x1="145" y1="58" x2="145" y2="345" stroke="#999" stroke-width="1" stroke-dasharray="4,5" opacity="0.35" filter="url(#rough2)"/>
  <line x1="280" y1="58" x2="280" y2="345" stroke="#999" stroke-width="1" stroke-dasharray="4,5" opacity="0.35" filter="url(#rough2)"/>
  <line x1="403" y1="58" x2="403" y2="345" stroke="#999" stroke-width="1" stroke-dasharray="4,5" opacity="0.35" filter="url(#rough2)"/>
  <text x="80" y="76" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">已开 0 把 · x=1</text>
  <text x="210" y="76" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">已开 1 把 · x=3</text>
  <text x="345" y="76" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">已开 2 把 · x=5</text>
  <text x="462" y="76" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">全开 · x=7</text>

  <!-- ===== 普通边（颜色=这步开的锁） ===== -->
  <line x1="114" y1="210" x2="176" y2="210" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="145" y="201" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">+5</text>

  <line x1="107" y1="231" x2="183" y2="289" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="140" y="272" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">+4</text>

  <line x1="237" y1="190" x2="318" y2="130" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="148" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">+1</text>

  <line x1="237" y1="230" x2="318" y2="290" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="275" y="268" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">+2</text>

  <line x1="237" y1="290" x2="318" y2="230" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="248" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">+1</text>

  <line x1="244" y1="310" x2="311" y2="310" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="277" y="301" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">+2</text>

  <line x1="371" y1="288" x2="436" y2="232" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="396" y="256" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">+1</text>

  <!-- ===== 最优路径边（加粗） ===== -->
  <line x1="107" y1="189" x2="183" y2="131" stroke="#446688" stroke-width="3.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="140" y="153" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">+2</text>

  <line x1="244" y1="110" x2="311" y2="110" stroke="#4a7a3a" stroke-width="3.5" stroke-dasharray="7,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="277" y="101" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+2</text>

  <line x1="237" y1="130" x2="318" y2="190" stroke="#d6a040" stroke-width="3.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="272" y="170" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">+2</text>

  <line x1="371" y1="132" x2="436" y2="188" stroke="#d6a040" stroke-width="3.5" stroke-dasharray="7,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="396" y="168" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">+1</text>

  <line x1="372" y1="210" x2="435" y2="210" stroke="#4a7a3a" stroke-width="3.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="403" y="201" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>

  <!-- ===== 节点 ===== -->
  <rect x="53" y="192" width="54" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="207" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">000</text>
  <text x="80" y="221" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">dp=0</text>

  <rect x="183" y="92" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="107" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">001</text>
  <text x="210" y="121" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">dp=2</text>

  <rect x="183" y="192" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="207" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">010</text>
  <text x="210" y="221" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">dp=5</text>

  <rect x="183" y="292" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="307" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="210" y="321" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">dp=4</text>

  <rect x="318" y="92" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="345" y="107" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">011</text>
  <text x="345" y="121" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">dp=4</text>

  <rect x="318" y="192" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="345" y="207" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">101</text>
  <text x="345" y="221" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">dp=4</text>

  <rect x="318" y="292" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="345" y="307" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">110</text>
  <text x="345" y="321" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">dp=6</text>

  <rect x="435" y="192" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="462" y="207" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">111</text>
  <text x="462" y="221" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">dp=5</text>

  <!-- ===== 图例 ===== -->
  <text x="25" y="388" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">边色＝这步开的锁：</text>
  <rect x="140" y="379" width="11" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="388" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">锁0（需 2）</text>
  <rect x="225" y="379" width="11" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="388" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">锁1（需 5）</text>
  <rect x="310" y="379" width="11" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="388" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">锁2（需 4）</text>

  <text x="260" y="412" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">粗实线 / 粗虚线＝两条最优路径：000→001→101→111 与 000→001→011→111，各花 2+2+1 = 5 分钟</text>
</svg>
