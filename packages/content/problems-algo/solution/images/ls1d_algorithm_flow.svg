<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    滑动窗口算法流程
  </text>

  <!-- 开始 -->
  <rect x="210" y="48" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M260,78 L260,96" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="150" y="100" width="220" height="44" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    left = 0, zeros = 0, best = 0
  </text>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    遍历 right ∈ [0, n−1]
  </text>

  <path d="M260,144 L260,162" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 nums[right]==0 -->
  <polygon points="260,166 360,210 260,254 160,210" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[right]</text>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">== 0 ?</text>

  <!-- 是 -->
  <text x="148" y="214" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M160,210 L120,210 L120,236" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="68" y="240" width="104" height="28" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">zeros++</text>

  <path d="M120,268 L120,284 L258,284" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否，汇合到 while -->
  <text x="372" y="214" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M360,210 L402,210 L402,284 L262,284" stroke="#446688"
        stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while zeros > 1 收缩 -->
  <polygon points="260,266 380,300 260,334 140,300" fill="#e8f0fe" stroke="#446688"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">zeros &gt; 1 ?</text>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">收缩 left</text>

  <!-- 是：收缩 -->
  <text x="128" y="300" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M140,300 L96,300" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="286" width="76" height="60" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="58" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">若 nums</text>
  <text x="58" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[left]==0</text>
  <text x="58" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">zeros−−</text>
  <text x="58" y="346" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">left++</text>

  <path d="M58,346 L58,360 L260,360 L260,338" stroke="#446688"
        stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否：更新 best -->
  <text x="392" y="300" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M380,300 L420,300" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="422" y="286" width="86" height="28" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="465" y="305" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best 更新</text>

  <path d="M465,314 L465,360 L262,360" stroke="#446688"
        stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- best 更新框 -->
  <rect x="180" y="344" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    best = max(best, right−left+1)
  </text>

  <path d="M260,372 L260,392" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="150" y="396" width="220" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="416" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    遍历结束，返回 best − 1
  </text>
  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    （必须删掉一个元素）
  </text>
</svg>
