<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：n=4, delay=1, forget=3</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888">绿=被求和的窗口 ｜ 橙=当日新算出的 dp[i] ｜ 灰=已遗忘/未生成</text>

  <!-- column headers -->
  <text x="64" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">天 i</text>
  <text x="130" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">窗口 [lo..hi]</text>
  <text x="286" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">dp 序列（绿=被求和）</text>
  <text x="440" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">dp[i]</text>
  <text x="500" y="78" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">prefix[i]</text>

  <!-- dp[1..4] mini headers above strip -->
  <text x="205" y="78" text-anchor="middle" font-size="9.5" fill="#888">j=1</text>
  <text x="259" y="78" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="313" y="78" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="367" y="78" text-anchor="middle" font-size="9.5" fill="#888">4</text>

  <!-- ============ row i=1 (seed) center y=100 ============ -->
  <text x="64" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="130" y="104" text-anchor="middle" font-size="11" fill="#888">— (种子)</text>
  <!-- dp[1] orange target = 1 -->
  <rect x="180" y="88" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="104" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <!-- dp[2..4] empty dashed -->
  <rect x="234" y="88" width="50" height="24" fill="#f4f4f4" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="288" y="88" width="50" height="24" fill="#f4f4f4" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="88" width="50" height="24" fill="#f4f4f4" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="104" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="500" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- ============ row i=2 center y=130 ============ -->
  <text x="64" y="134" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="130" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1..1</text>
  <!-- dp[1] green (summed) -->
  <rect x="180" y="118" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- dp[2] orange target = 1 -->
  <rect x="234" y="118" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="288" y="118" width="50" height="24" fill="#f4f4f4" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="118" width="50" height="24" fill="#f4f4f4" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="500" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- ============ row i=3 center y=160 ============ -->
  <text x="64" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="130" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1..2</text>
  <!-- dp[1],dp[2] green -->
  <rect x="180" y="148" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="234" y="148" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- dp[3] target = 2 -->
  <rect x="288" y="148" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="313" y="164" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="342" y="148" width="50" height="24" fill="#f4f4f4" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="164" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="500" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- ============ row i=4 center y=190 ============ -->
  <text x="64" y="194" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="130" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2..3</text>
  <!-- dp[1] blue (exists, NOT in window) -->
  <rect x="180" y="174" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="205" y="194" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- dp[2],dp[3] green -->
  <rect x="234" y="174" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="288" y="174" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="313" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- dp[4] target = 3 -->
  <rect x="342" y="174" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="194" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="440" y="194" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="500" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <!-- separator -->
  <line x1="40" y1="212" x2="560" y2="212" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ answer row: still-remember = [2..4] center y=238 ============ -->
  <text x="64" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案</text>
  <text x="130" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[2..4] 还记得</text>
  <!-- dp[1] grey/red (forgot) -->
  <rect x="180" y="224" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="205" y="242" text-anchor="middle" font-size="12" fill="#b85450">1</text>
  <!-- dp[2..4] green (summed into answer) -->
  <rect x="234" y="224" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="288" y="224" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="313" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="342" y="224" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <!-- answer value -->
  <text x="440" y="242" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <text x="500" y="242" text-anchor="middle" font-size="11" fill="#888">7−1</text>

  <!-- formula box -->
  <rect x="40" y="276" width="520" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = 还记得的人 = Σ dp[j], j ∈ [n−forget+1 .. n]</text>
  <text x="300" y="318" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= prefix[n] − prefix[n−forget] = 7 − 1 = 6  ✓</text>

  <!-- footnote -->
  <text x="300" y="356" text-anchor="middle" font-size="10.5" fill="#888">第 1 天的人在第 4 天恰好遗忘（forget=3：记得第 1、2、3 天），故 dp[1] 不计入答案</text>
  <text x="300" y="374" text-anchor="middle" font-size="10.5" fill="#4a7a3a">窗口从 [1..1]→[1..2]→[2..3] 逐天右滑，长度恒为 forget−delay = 2</text>
</svg>
