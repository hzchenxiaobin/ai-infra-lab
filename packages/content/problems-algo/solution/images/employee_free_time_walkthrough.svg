<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 2 演算：五段忙碌 → 合并为三段 → 挖两个缝隙</text>

  <text x="30" y="52" font-size="11" fill="#888" font-weight="bold">原始（摊平 + 排序后）</text>
  <rect x="30" y="58" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="65" y="71" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">[1,3]</text>
  <rect x="106" y="58" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="141" y="71" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">[2,4]</text>
  <rect x="182" y="58" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="217" y="71" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">[2,5]</text>
  <rect x="258" y="58" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="293" y="71" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">[6,7]</text>
  <rect x="334" y="58" width="80" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="374" y="71" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">[9,12]</text>

  <text x="30" y="96" font-size="11" fill="#888" font-weight="bold">逐步合并 + 挖缝</text>

  <rect x="20" y="104" width="540" height="282" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>

  <text x="30" y="122" font-size="9.5" fill="#888" font-weight="bold">步</text>
  <text x="80" y="122" font-size="9.5" fill="#888" font-weight="bold">cur</text>
  <text x="180" y="122" font-size="9.5" fill="#888" font-weight="bold">判定</text>
  <text x="320" y="122" font-size="9.5" fill="#888" font-weight="bold">操作</text>
  <text x="440" y="122" font-size="9.5" fill="#888" font-weight="bold">prev_end</text>
  <text x="520" y="122" font-size="9.5" fill="#888" font-weight="bold">结果</text>

  <line x1="20" y1="128" x2="560" y2="128" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="144" font-size="9" fill="#555">初始</text>
  <text x="80" y="144" font-size="9" fill="#446688" font-weight="bold">[1,3]</text>
  <text x="180" y="144" font-size="9" fill="#888">—</text>
  <text x="320" y="144" font-size="9" fill="#555">prev_end = 3</text>
  <text x="450" y="144" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="520" y="144" font-size="9" fill="#888">[]</text>

  <line x1="20" y1="152" x2="560" y2="152" stroke="#eee" stroke-width="1"/>

  <text x="40" y="168" font-size="9" fill="#555">①</text>
  <text x="80" y="168" font-size="9" fill="#4a7a3a" font-weight="bold">[2,4]</text>
  <text x="180" y="168" font-size="9" fill="#b85450">2 ≤ 3 重叠</text>
  <text x="320" y="168" font-size="9" fill="#555">合并, pe=max(3,4)</text>
  <text x="450" y="168" font-size="9" fill="#b85450" font-weight="bold">4</text>
  <text x="520" y="168" font-size="9" fill="#888">[]</text>

  <line x1="20" y1="176" x2="560" y2="176" stroke="#eee" stroke-width="1"/>

  <text x="40" y="192" font-size="9" fill="#555">②</text>
  <text x="80" y="192" font-size="9" fill="#4a7a3a" font-weight="bold">[2,5]</text>
  <text x="180" y="192" font-size="9" fill="#b85450">2 ≤ 4 重叠</text>
  <text x="320" y="192" font-size="9" fill="#555">合并, pe=max(4,5)</text>
  <text x="450" y="192" font-size="9" fill="#b85450" font-weight="bold">5</text>
  <text x="520" y="192" font-size="9" fill="#888">[]</text>

  <line x1="20" y1="200" x2="560" y2="200" stroke="#eee" stroke-width="1"/>

  <text x="40" y="216" font-size="9" fill="#555">③</text>
  <text x="80" y="216" font-size="9" fill="#446688" font-weight="bold">[6,7]</text>
  <text x="180" y="216" font-size="9" fill="#4a7a3a" font-weight="bold">6 &gt; 5 缝隙!</text>
  <text x="320" y="216" font-size="9" fill="#4a7a3a">加[5,6), pe=7</text>
  <text x="450" y="216" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="520" y="216" font-size="9" fill="#4a7a3a" font-weight="bold">[[5,6]]</text>

  <line x1="20" y1="224" x2="560" y2="224" stroke="#eee" stroke-width="1"/>

  <text x="40" y="240" font-size="9" fill="#555">④</text>
  <text x="80" y="240" font-size="9" fill="#d6a040" font-weight="bold">[9,12]</text>
  <text x="180" y="240" font-size="9" fill="#4a7a3a" font-weight="bold">9 &gt; 7 缝隙!</text>
  <text x="320" y="240" font-size="9" fill="#4a7a3a">加[7,9), pe=12</text>
  <text x="450" y="240" font-size="9" fill="#d6a040" font-weight="bold">12</text>
  <text x="520" y="240" font-size="9" fill="#4a7a3a" font-weight="bold">[[5,6],[7,9]]</text>

  <rect x="30" y="262" width="520" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果</text>
  <text x="50" y="300" font-size="10.5" fill="#555">合并后忙碌段：[1,5), [6,7), [9,12)（三段不相交）</text>
  <text x="50" y="316" font-size="10.5" fill="#4a7a3a" font-weight="bold">共同空闲：[[5,6], [7,9]] — 两段正长度缝隙</text>

  <text x="30" y="350" font-size="10" fill="#888">时间轴：</text>
  <line x1="100" y1="358" x2="540" y2="358" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="352" width="80" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <rect x="200" y="352" width="30" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="240" y="352" width="30" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <rect x="280" y="352" width="50" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="340" y="352" width="80" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="100" y="380" font-size="8" fill="#888">1</text>
  <text x="180" y="380" font-size="8" fill="#888">5</text>
  <text x="240" y="380" font-size="8" fill="#888">7</text>
  <text x="340" y="380" font-size="8" fill="#888">9</text>
  <text x="420" y="380" font-size="8" fill="#888">12</text>
  <text x="215" y="380" font-size="8" fill="#4a7a3a" font-weight="bold">空闲</text>
  <text x="295" y="380" font-size="8" fill="#4a7a3a" font-weight="bold">空闲</text>
</svg>
