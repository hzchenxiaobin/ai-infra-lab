<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 690"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="690" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：隐式图 BFS（取出时判定目标）</text>

  <!-- 开始 -->
  <rect x="115" y="44" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="180" y="62" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M180,70 L180,90" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="100" y="94" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">queue ← [(nums, 0)]</text>
  <text x="180" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">visited ← {nums}</text>
  <path d="M180,134 L180,154" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: 队列为空? -->
  <polygon points="180,158 266,194 180,230 94,194" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">队列为空？</text>
  <path d="M266,194 L328,194" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="294" y="186" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="333" y="180" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="199" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>
  <path d="M180,230 L180,252" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="246" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 取出队首 -->
  <rect x="100" y="256" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取出队首 (s, d)</text>
  <path d="M180,286 L180,308" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: s 是有序排列? -->
  <polygon points="180,312 276,348 180,384 84,348" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="345" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s 是有序排列？</text>
  <text x="180" y="362" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">[0,1,…,n−1] ？</text>
  <path d="M276,348 L328,348" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="298" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="333" y="334" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="353" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">返回 d</text>
  <text x="388" y="376" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">最少操作数（初始即有序 → 0）</text>
  <path d="M180,384 L180,406" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="400" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- for k -->
  <rect x="100" y="410" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="431" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for k ∈ pre（k ≥ 2）</text>
  <path d="M180,442 L180,462" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 生成 t -->
  <rect x="100" y="466" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="486" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t ← 反转 s 的前 k 位</text>
  <path d="M180,496 L180,518" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3: t 未访问? -->
  <polygon points="180,522 272,558 180,594 88,558" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="563" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t ∉ visited？</text>
  <path d="M272,558 L352,558 L352,427 L266,427" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="358" y="502" font-size="9.5" fill="#b85450" filter="url(#rough2)">否：跳过，</text>
  <text x="358" y="514" font-size="9.5" fill="#b85450" filter="url(#rough2)">取下一个 k</text>
  <path d="M180,594 L180,616" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="610" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 入队 -->
  <rect x="100" y="620" width="160" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="638" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">visited ← t</text>
  <text x="180" y="654" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">queue ← (t, d+1)</text>

  <!-- 入队 -> 回 for k -->
  <path d="M100,643 L48,643 L48,437 L96,437" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text transform="rotate(-90 40 540)" x="40" y="540" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">取下一个 k</text>

  <!-- for k 用完 -> 回 D1 -->
  <path d="M100,422 L24,422 L24,194 L90,194" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text transform="rotate(-90 16 310)" x="16" y="310" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">k 用完</text>

  <!-- 侧注 -->
  <text x="464" y="458" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n ≤ 8</text>
  <text x="464" y="473" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">状态 ≤ 8!</text>
  <text x="464" y="488" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">= 40320</text>
</svg>
