<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两趟染色 BFS + 一个全局常数</text>

  <!-- ① 建邻接表 -->
  <rect x="95" y="48" width="330" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">① 建邻接表：edges1 → g1，edges2 → g2（无向，双向加边）</text>
  <line x1="260" y1="82" x2="260" y2="100" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 树 1 染色 -->
  <rect x="95" y="102" width="330" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 树 1：从节点 0 出发 BFS，按深度奇偶染色 col1[i]</text>
  <text x="260" y="137" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">→ 数出 c₀（0 色节点数），1 色类大小即 n − c₀</text>
  <line x1="260" y1="148" x2="260" y2="166" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ 树 2 染色 -->
  <rect x="95" y="168" width="330" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③ 树 2：同样 BFS 染色，数出 d₀</text>
  <text x="260" y="203" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">→ best2 = max(d₀, m − d₀)，n 个查询共享的全局常数</text>
  <line x1="260" y1="214" x2="260" y2="232" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,234 352,270 260,306 168,270" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">col1[i] = 0 ?</text>
  <text x="150" y="260" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="372" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 否分支 -->
  <line x1="168" y1="270" x2="140" y2="270" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="15" y="250" width="122" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="76" y="268" text-anchor="middle" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">even[i] = n − c₀</text>
  <text x="76" y="284" text-anchor="middle" font-size="8.5" fill="#8a3833" filter="url(#rough2)">i 在 1 色类里</text>

  <!-- 是分支 -->
  <line x1="352" y1="270" x2="380" y2="270" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="383" y="250" width="122" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="444" y="268" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">even[i] = c₀</text>
  <text x="444" y="284" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">i 在 0 色类里</text>

  <!-- 汇合箭头 -->
  <path d="M 76 294 L 76 350 L 93 350" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 444 294 L 444 350 L 427 350" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ④ 结果 -->
  <rect x="95" y="330" width="330" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ answer[i] = even[i] + best2</text>
  <text x="260" y="363" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">树 1 内部距离连边后不变 ⇒ even[i] 与桥无关</text>

  <text x="260" y="388" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">用 BFS 不用递归 DFS：n, m ≤ 10⁵，Python 递归会爆栈；根任选——换根只会让两色类互换，大小不变</text>
</svg>
