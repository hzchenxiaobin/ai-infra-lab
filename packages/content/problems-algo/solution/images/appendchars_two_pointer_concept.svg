<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 374" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="374" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针贪心：在 s 中尽量匹配 t 的前缀，未匹配尾部即需追加</text>

  <!-- group labels -->
  <text x="176" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">已匹配 (j=2)</text>
  <text x="314" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">需追加 (|t|−j=4)</text>

  <!-- bracket bars above t cells -->
  <path d="M 132 88 L 132 96 L 220 96 L 220 88" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 224 88 L 224 96 L 404 96 L 404 88" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- t row label -->
  <text x="20" y="136" font-size="12" fill="#888">t:</text>

  <!-- t cells: c,o matched green; d,i,n,g unmatched red -->
  <rect x="130" y="116" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="153" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="176" y="116" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
  <rect x="222" y="116" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="268" y="116" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="291" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i</text>
  <rect x="314" y="116" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n</text>
  <rect x="360" y="116" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g</text>

  <!-- t index labels -->
  <text x="153" y="162" text-anchor="middle" font-size="9" fill="#aaa">j=0</text>
  <text x="199" y="162" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="245" y="162" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="291" y="162" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="337" y="162" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="383" y="162" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- dashed arrows from matched t down to matched s -->
  <path d="M 153 148 L 153 204" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 199 148 L 199 204" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- s row label -->
  <text x="20" y="226" font-size="12" fill="#888">s:</text>

  <!-- s cells: c,o matched green; a,c,h,i,n,g skipped gray -->
  <rect x="130" y="206" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="153" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="176" y="206" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
  <rect x="222" y="206" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="245" y="226" text-anchor="middle" font-size="13" fill="#999">a</text>
  <rect x="268" y="206" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="291" y="226" text-anchor="middle" font-size="13" fill="#999">c</text>
  <rect x="314" y="206" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="337" y="226" text-anchor="middle" font-size="13" fill="#999">h</text>
  <rect x="360" y="206" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="383" y="226" text-anchor="middle" font-size="13" fill="#999">i</text>
  <rect x="406" y="206" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="429" y="226" text-anchor="middle" font-size="13" fill="#999">n</text>
  <rect x="452" y="206" width="46" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="475" y="226" text-anchor="middle" font-size="13" fill="#999">g</text>

  <!-- s index labels -->
  <text x="153" y="252" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="199" y="252" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="245" y="252" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="291" y="252" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="337" y="252" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="383" y="252" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="429" y="252" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="475" y="252" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <!-- legend -->
  <rect x="40" y="270" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="283" font-size="11" fill="#555">s 中匹配 t</text>
  <rect x="160" y="270" width="16" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="182" y="283" font-size="11" fill="#555">跳过</text>
  <rect x="230" y="270" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="252" y="283" font-size="11" fill="#555">需追加到 s 尾部</text>

  <!-- key idea box -->
  <rect x="40" y="302" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = |t| − j（j 为 t 中已匹配到的前缀长度）</text>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#555">s 中匹配越多越靠前 → 剩余 s 越长 → 贪心不劣于任何选法</text>
</svg>
