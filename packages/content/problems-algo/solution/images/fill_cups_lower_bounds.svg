<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两个下界：每秒≤2杯  与  每秒每类≤1杯</text>

  <!-- baseline -->
  <path d="M 60 190 L 480 190" stroke="#ccc" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Cold stack: 5 cups (max -> red) -->
  <g filter="url(#rough2)">
    <rect x="98" y="166" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="98" y="140" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="98" y="114" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="98" y="88"  width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="98" y="62"  width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
  </g>
  <text x="110" y="208" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">冷水 5 (max)</text>

  <!-- Warm stack: 4 cups -->
  <g filter="url(#rough2)">
    <rect x="258" y="166" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="258" y="140" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="258" y="114" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="258" y="88"  width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="270" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">温水 4</text>

  <!-- Hot stack: 4 cups -->
  <g filter="url(#rough2)">
    <rect x="418" y="166" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="418" y="140" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="418" y="114" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="418" y="88"  width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="430" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">热水 4</text>

  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#888">总量 s = 5 + 4 + 4 = 13</text>

  <!-- Lower bound 1 -->
  <rect x="40" y="248" width="230" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="272" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">下界① ⌈s/2⌉ = ⌈13/2⌉ = 7</text>
  <text x="155" y="292" text-anchor="middle" font-size="11" fill="#446688">每秒至多装 2 杯</text>
  <text x="155" y="310" text-anchor="middle" font-size="10.5" fill="#888">13 杯 ÷ 2 上取整</text>

  <!-- Lower bound 2 -->
  <rect x="290" y="248" width="230" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="272" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">下界② max = 5</text>
  <text x="405" y="292" text-anchor="middle" font-size="11" fill="#d6a040">每秒每类至多 1 杯</text>
  <text x="405" y="310" text-anchor="middle" font-size="10.5" fill="#888">冷水 5 杯至少 5 秒</text>

  <!-- arrows down to answer -->
  <path d="M 155 326 L 220 356" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 405 326 L 340 356" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#888">取 max</text>

  <!-- Answer box -->
  <rect x="150" y="356" width="260" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = max(7, 5) = 7</text>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#4a7a3a">情形 B：2·max = 10 &lt; 13 = s → 下界①主导</text>

  <text x="40" y="430" font-size="10.5" fill="#888">两类下界合流取 max：情形 A 时下界②主导，情形 B 时下界①主导，无需分支。</text>
</svg>
