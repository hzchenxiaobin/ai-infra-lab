<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2753a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">概念：无 openDoor()，借用现存开门 P 做标记</text>

  <!-- API constraint pill -->
  <rect x="120" y="40" width="320" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="11" fill="#d6a040">Street 仅 closeDoor / isDoorOpen / moveRight（无 openDoor）</text>

  <!-- 5 houses on a circle, doors=[1,0,1,1,0] -->
  <!-- house0 top: 开 = 起点 P（橙色，不关） -->
  <rect x="257" y="86" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">开</text>
  <text x="280" y="80" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">P·不关</text>

  <!-- house1 right: 闭 -->
  <rect x="371" y="169" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="394" y="195" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">闭</text>
  <text x="430" y="164" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">1</text>

  <!-- house2 bottom-right: 开（沿途关） -->
  <rect x="327" y="303" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="350" y="329" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">开</text>
  <text x="372" y="354" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2·关</text>

  <!-- house3 bottom-left: 开（沿途关） -->
  <rect x="187" y="303" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="210" y="329" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">开</text>
  <text x="188" y="354" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3·关</text>

  <!-- house4 left: 闭 -->
  <rect x="143" y="169" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="166" y="195" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">闭</text>
  <text x="130" y="164" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">4</text>

  <!-- center label -->
  <ellipse cx="280" cy="218" rx="58" ry="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">借 P 做标记</text>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a">走一圈回 P</text>

  <!-- clockwise moveRight arrow (outer arc) -->
  <path d="M 300,60 A 240,240 0 0 1 470,158" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2753a)" filter="url(#rough2)"/>
  <text x="438" y="84" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">moveRight →</text>

  <!-- bottom note -->
  <rect x="36" y="352" width="488" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11" fill="#4a7a3a">无法主动开门 ⇒ 借现存开门 P 作起点；走 k 步沿途关掉其它开门，最后一个碰到的 = P（走满 n 步）⇒ ans = n</text>
</svg>
