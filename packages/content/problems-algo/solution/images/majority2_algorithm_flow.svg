<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,1 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">多数元素 II 算法流程</text>

  <!-- Phase 1 label -->
  <rect x="160" y="40" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">第一遍：投票选出候选</text>

  <!-- Init -->
  <rect x="100" y="72" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化</text>
  <text x="260" y="108" text-anchor="middle" font-size="10.5" fill="#555">cand1=None, cnt1=0  cand2=None, cnt2=0</text>

  <path d="M 260 116 L 260 132" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop diamond -->
  <polygon points="260,136 370,174 260,212 150,174" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">还有元素 x ?</text>
  <text x="260" y="186" text-anchor="middle" font-size="10" fill="#777">遍历未结束？</text>

  <!-- No → go to phase 2 (right) -->
  <path d="M 370 174 L 440 174 L 440 400" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="388" y="166" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Yes → down -->
  <path d="M 260 212 L 260 228" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="278" y="224" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Diamond: x == cand1? -->
  <polygon points="260,232 350,266 260,300 170,266" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x == cand1 ?</text>

  <!-- Yes → cnt1++ (right) -->
  <path d="M 350 266 L 400 266" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="375" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="404" y="250" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cnt1 += 1</text>

  <!-- No → down to next diamond -->
  <path d="M 260 300 L 260 316" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="278" y="312" font-size="10" fill="#b85450" font-weight="bold">No</text>

  <!-- Diamond: x == cand2? -->
  <polygon points="260,320 350,354 260,388 170,354" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x == cand2 ?</text>

  <!-- Yes → cnt2++ (right) -->
  <path d="M 350 354 L 400 354" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="375" y="346" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Yes</text>
  <rect x="404" y="338" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="358" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">cnt2 += 1</text>

  <!-- No → down -->
  <path d="M 260 388 L 260 402" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Compact: remaining 3 cases in one box -->
  <rect x="80" y="406" width="360" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="10.5" fill="#888">x 不匹配任一候选</text>
  <rect x="96" y="432" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="146" y="448" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">cnt1==0?</text>
  <text x="146" y="462" text-anchor="middle" font-size="9" fill="#555">→cand1=x,cnt1=1</text>
  <rect x="210" y="432" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="448" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">cnt2==0?</text>
  <text x="260" y="462" text-anchor="middle" font-size="9" fill="#555">→cand2=x,cnt2=1</text>
  <rect x="324" y="432" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="374" y="448" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">都不空</text>
  <text x="374" y="462" text-anchor="middle" font-size="9" fill="#555">→cnt1−−,cnt2−−</text>

  <!-- Loop back arrow -->
  <path d="M 442 282 L 442 138 L 370 174" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <path d="M 442 370 L 442 138 L 370 174" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <path d="M 260 484 L 260 496 L 486 496 L 486 138 L 370 174" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="380" y="490" font-size="9.5" fill="#888" font-style="italic">所有分支回到循环</text>

  <!-- Phase 2 -->
  <rect x="340" y="400" width="160" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="416" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第二遍：验证计数</text>

  <!-- Verify box -->
  <rect x="330" y="430" width="180" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="420" y="448" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">统计 cand1、cand2</text>
  <text x="420" y="464" text-anchor="middle" font-size="10.5" fill="#333">真实出现次数</text>
  <text x="420" y="480" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">保留 &gt; ⌊n/3⌋ 者</text>

  <path d="M 420 486 L 420 508" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="340" y="512" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="420" y="535" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return result</text>

  <!-- connecting arrow from loop No to phase 2 -->
  <path d="M 440 400 L 420 430" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
</svg>
