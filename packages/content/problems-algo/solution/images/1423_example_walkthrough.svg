<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：cardPoints = [1,2,3,4,5,6,1], k = 3</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">n=7, windowSize = n−k = 4, total = 22；窗口右移求最小和</text>

  <!-- ===== Window 1: [1,2,3,4] = 10 ===== -->
  <text x="40" y="78" font-size="11" fill="#446688" font-weight="bold">窗口① (i=4 进入循环前初值):</text>
  <g font-size="12">
    <rect x="40" y="86" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="64" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="92" y="86" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="116" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="144" y="86" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="168" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="196" y="86" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="220" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="248" y="86" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="272" y="106" text-anchor="middle" fill="#999">5</text>
    <rect x="300" y="86" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="324" y="106" text-anchor="middle" fill="#999">6</text>
    <rect x="352" y="86" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="376" y="106" text-anchor="middle" fill="#999">1</text>
  </g>
  <text x="470" y="106" font-size="12" fill="#4a7a3a" font-weight="bold">sum = 10 → minSum = 10</text>

  <!-- arrow down -->
  <path d="M 116 120 L 116 132" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="130" font-size="10" fill="#888">i=4: +card[4]=5, −card[0]=1</text>

  <!-- ===== Window 2: [2,3,4,5] = 14 ===== -->
  <text x="40" y="148" font-size="11" fill="#446688" font-weight="bold">窗口② (i=4):</text>
  <g font-size="12">
    <rect x="40" y="156" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="64" y="176" text-anchor="middle" fill="#999">1</text>
    <rect x="92" y="156" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="116" y="176" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="144" y="156" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="168" y="176" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="196" y="156" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="220" y="176" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="248" y="156" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="272" y="176" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="300" y="156" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="324" y="176" text-anchor="middle" fill="#999">6</text>
    <rect x="352" y="156" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="376" y="176" text-anchor="middle" fill="#999">1</text>
  </g>
  <text x="470" y="176" font-size="12" fill="#555">sum = 10+5−1 = 14；minSum 仍 10</text>

  <path d="M 116 190 L 116 202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="200" font-size="10" fill="#888">i=5: +card[5]=6, −card[1]=2</text>

  <!-- ===== Window 3: [3,4,5,6] = 18 ===== -->
  <text x="40" y="218" font-size="11" fill="#446688" font-weight="bold">窗口③ (i=5):</text>
  <g font-size="12">
    <rect x="40" y="226" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="64" y="246" text-anchor="middle" fill="#999">1</text>
    <rect x="92" y="226" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="116" y="246" text-anchor="middle" fill="#999">2</text>
    <rect x="144" y="226" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="168" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="196" y="226" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="220" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="248" y="226" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="272" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="300" y="226" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="324" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="352" y="226" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="376" y="246" text-anchor="middle" fill="#999">1</text>
  </g>
  <text x="470" y="246" font-size="12" fill="#555">sum = 14+6−2 = 18；minSum 仍 10</text>

  <path d="M 116 260 L 116 272" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="270" font-size="10" fill="#888">i=6: +card[6]=1, −card[2]=3</text>

  <!-- ===== Window 4: [4,5,6,1] = 16 ===== -->
  <text x="40" y="288" font-size="11" fill="#446688" font-weight="bold">窗口④ (i=6):</text>
  <g font-size="12">
    <rect x="40" y="296" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="64" y="316" text-anchor="middle" fill="#999">1</text>
    <rect x="92" y="296" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="116" y="316" text-anchor="middle" fill="#999">2</text>
    <rect x="144" y="296" width="48" height="30" rx="4" fill="#eee" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="168" y="316" text-anchor="middle" fill="#999">3</text>
    <rect x="196" y="296" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="220" y="316" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="248" y="296" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="272" y="316" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="300" y="296" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="324" y="316" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <rect x="352" y="296" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="376" y="316" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <text x="470" y="316" font-size="12" fill="#555">sum = 18+1−3 = 16；minSum 仍 10</text>

  <path d="M 116 330 L 116 344" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="342" font-size="10" fill="#b85450" font-weight="bold">i=7 ≥ n=7，循环结束</text>

  <!-- ===== Summary table ===== -->
  <text x="40" y="370" font-size="11" fill="#446688" font-weight="bold">各窗口和汇总:</text>
  <g font-size="11" filter="url(#rough2)">
    <!-- header -->
    <rect x="40" y="378" width="120" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="100" y="394" text-anchor="middle" fill="#333" font-weight="bold">窗口</text>
    <rect x="160" y="378" width="100" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="210" y="394" text-anchor="middle" fill="#333" font-weight="bold">元素</text>
    <rect x="260" y="378" width="80" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="300" y="394" text-anchor="middle" fill="#333" font-weight="bold">和</text>
    <rect x="340" y="378" width="90" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="385" y="394" text-anchor="middle" fill="#333" font-weight="bold">是否最小</text>

    <!-- row 1 -->
    <rect x="40" y="404" width="120" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="100" y="419" text-anchor="middle" fill="#4a7a3a" font-weight="bold">①</text>
    <rect x="160" y="404" width="100" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="210" y="419" text-anchor="middle" fill="#4a7a3a">[1,2,3,4]</text>
    <rect x="260" y="404" width="80" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="300" y="419" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="340" y="404" width="90" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="385" y="419" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓ min</text>
    <!-- row 2 -->
    <rect x="40" y="428" width="120" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="100" y="443" text-anchor="middle" fill="#333">②</text>
    <rect x="160" y="428" width="100" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="210" y="443" text-anchor="middle" fill="#333">[2,3,4,5]</text>
    <rect x="260" y="428" width="80" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="300" y="443" text-anchor="middle" fill="#333">14</text>
    <rect x="340" y="428" width="90" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="385" y="443" text-anchor="middle" fill="#999">—</text>
    <!-- row 3 -->
    <rect x="40" y="452" width="120" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="100" y="467" text-anchor="middle" fill="#333">③</text>
    <rect x="160" y="452" width="100" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="210" y="467" text-anchor="middle" fill="#333">[3,4,5,6]</text>
    <rect x="260" y="452" width="80" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="300" y="467" text-anchor="middle" fill="#333">18</text>
    <rect x="340" y="452" width="90" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="385" y="467" text-anchor="middle" fill="#999">—</text>
    <!-- row 4 -->
    <rect x="40" y="476" width="120" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="100" y="491" text-anchor="middle" fill="#333">④</text>
    <rect x="160" y="476" width="100" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="210" y="491" text-anchor="middle" fill="#333">[4,5,6,1]</text>
    <rect x="260" y="476" width="80" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="300" y="491" text-anchor="middle" fill="#333">16</text>
    <rect x="340" y="476" width="90" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="385" y="491" text-anchor="middle" fill="#999">—</text>
  </g>

  <!-- final answer -->
  <rect x="450" y="378" width="170" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="535" y="402" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最终结果</text>
  <text x="535" y="426" text-anchor="middle" font-size="12" fill="#555">total = 22</text>
  <text x="535" y="448" text-anchor="middle" font-size="12" fill="#555">minSum = 10</text>
  <text x="535" y="476" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">答案 = 22 − 10 = 12</text>
  <text x="535" y="492" text-anchor="middle" font-size="10" fill="#888">取 {1,6,5}：1+6+5=12 ✓</text>

  <text x="320" y="524" text-anchor="middle" font-size="10" fill="#888">留下窗口① [1,2,3,4]（和最小 10），两端共取走 {5,6,1}，和 = 22−10 = 12</text>
</svg>
