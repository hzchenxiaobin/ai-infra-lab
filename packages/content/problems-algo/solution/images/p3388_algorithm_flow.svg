<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="20" y="26" font-size="13" fill="#333" filter="url(#rough2)">建表 O(n²) + 双重枚举 O(n²)</text>

  <!-- start -->
  <rect x="205" y="18" width="110" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="38" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">开始</text>
  <path d="M260,48 L260,62" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- build lcp table -->
  <rect x="150" y="66" width="220" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">倒序填 lcp 后缀表 O(n²)</text>
  <path d="M260,100 L260,116" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- enumerate split points -->
  <rect x="120" y="120" width="280" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举分割点 i = 1…n−2，j = i+1…n−1</text>
  <path d="M260,154 L260,170" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- condition diamond -->
  <polygon points="260,176 398,222 260,268 122,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A：lcp[0][i] ≥ i 且 j ≥ 2i</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">或 B：lcp[i][j] ≥ j−i ？</text>

  <!-- yes: ans+1 -->
  <text x="404" y="212" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M398,222 L426,222" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="428" y="205" width="80" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="468" y="227" text-anchor="middle" font-size="13" fill="#8c3a34" filter="url(#rough2)">ans + 1</text>
  <path d="M468,239 L468,286 L260,286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: next pair -->
  <text x="270" y="284" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M260,268 L260,290" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="195" y="294" width="130" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">下一组 (i, j)</text>
  <path d="M260,326 L260,342" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="260,346 322,378 260,410 198,378" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="383" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举完毕？</text>

  <!-- yes: return -->
  <text x="330" y="370" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M322,378 L352,378" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="354" y="361" width="120" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="383" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">返回 ans</text>

  <!-- no: loop back -->
  <text x="146" y="370" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M198,378 L64,378 L64,137 L116,137" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
