<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：单调栈 + 双护栏（长度 / 字母配额）</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">在 402「移掉 K 位数字」基础上，为 letter 配额加两道闸门</text>

  <!-- Left: the comparison scene -->
  <text x="28" y="74" font-size="11" fill="#666" font-weight="bold">栈顶 vs 当前 c</text>

  <!-- stack column -->
  <rect x="70" y="86" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="92" y="106" text-anchor="middle" font-size="12" fill="#333">…</text>
  <rect x="70" y="120" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="140" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">top</text>
  <text x="92" y="164" text-anchor="middle" font-size="9.5" fill="#aaa">栈</text>

  <!-- comparison symbol -->
  <text x="138" y="138" text-anchor="middle" font-size="15" fill="#666" font-weight="bold">&gt;</text>
  <text x="138" y="154" text-anchor="middle" font-size="9" fill="#a87020">(才考虑弹)</text>

  <!-- current char c -->
  <rect x="158" y="120" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">c</text>
  <text x="180" y="164" text-anchor="middle" font-size="9.5" fill="#aaa">当前字符</text>

  <!-- arrow to guards -->
  <path d="M 210 135 L 240 135" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="128" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">想弹</text>

  <!-- Right: two guards stacked -->
  <text x="372" y="74" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">两道护栏（都满足才能弹）</text>

  <!-- guard 1: length -->
  <rect x="250" y="86" width="244" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="372" y="104" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">① 长度护栏</text>
  <text x="372" y="121" text-anchor="middle" font-size="10.5" fill="#333">len−1 + (n−i) ≥ k</text>

  <!-- guard 2: letter quota -->
  <rect x="250" y="138" width="244" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="372" y="156" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">② 字母护栏（仅 top==letter）</text>
  <text x="372" y="173" text-anchor="middle" font-size="10.5" fill="#333">cnt−1 + suf[i] ≥ repetition</text>
  <text x="372" y="187" text-anchor="middle" font-size="9" fill="#888">栈内 letter + 后缀 letter 仍够配额</text>

  <!-- divider -->
  <line x1="40" y1="212" x2="500" y2="212" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- Bottom: push-slot reservation -->
  <text x="28" y="236" font-size="11" fill="#666" font-weight="bold">压栈也要让位</text>

  <rect x="60" y="248" width="200" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">压入非 letter 时</text>
  <text x="160" y="285" text-anchor="middle" font-size="10.5" fill="#555">若 len + (rep−cnt) ≥ k</text>
  <text x="160" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ 跳过，给 letter 留位</text>

  <text x="282" y="278" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">否则</text>
  <path d="M 308 278 L 332 278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="338" y="248" width="170" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="423" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">压入 c</text>
  <text x="423" y="285" text-anchor="middle" font-size="10" fill="#555">letter 则 cnt+1</text>
  <text x="423" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a">栈保持字典序尽量小</text>

  <!-- footer -->
  <rect x="60" y="326" width="448" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="284" y="347" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最终栈恰为 k 个字符，且 letter 出现 ≥ repetition 次</text>
</svg>
