<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：s=0，marked=[2,3]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">n=4, edges=[[0,1,1],[1,2,3],[2,3,2],[0,3,4]]（无向）</text>

  <!-- table header -->
  <g font-size="11">
    <rect x="40" y="60" width="110" height="26" fill="#f0eee6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="95" y="78" text-anchor="middle" fill="#444" font-weight="bold">弹出 (d,u)</text>

    <rect x="150" y="60" width="150" height="26" fill="#f0eee6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="78" text-anchor="middle" fill="#444" font-weight="bold">松弛出边</text>

    <rect x="300" y="60" width="170" height="26" fill="#f0eee6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="78" text-anchor="middle" fill="#444" font-weight="bold">dist[0,1,2,3]</text>

    <rect x="470" y="60" width="70" height="26" fill="#f0eee6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="505" y="78" text-anchor="middle" fill="#444" font-weight="bold">堆</text>
  </g>

  <!-- row 0: initial -->
  <g font-size="10">
    <rect x="40" y="88" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="95" y="105" text-anchor="middle" fill="#d6a040" font-weight="bold">初始</text>
    <text x="95" y="118" text-anchor="middle" fill="#888" font-size="8">dist[0]=0</text>

    <rect x="150" y="88" width="150" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="109" text-anchor="middle" fill="#666">—</text>

    <rect x="300" y="88" width="170" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="109" text-anchor="middle" fill="#446688" font-weight="bold">[0, ∞, ∞, ∞]</text>

    <rect x="470" y="88" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="505" y="109" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[(0,0)]</text>
  </g>

  <!-- row 1: pop (0,0) -->
  <g font-size="10">
    <rect x="40" y="124" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="95" y="149" text-anchor="middle" fill="#d6a040" font-weight="bold">(0, 0)</text>

    <rect x="150" y="124" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="140" text-anchor="middle" fill="#446688">0→1: 0+1=1&lt;∞</text>
    <text x="225" y="156" text-anchor="middle" fill="#446688">0→3: 0+4=4&lt;∞</text>

    <rect x="300" y="124" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="149" text-anchor="middle" fill="#446688" font-weight="bold">[0, 1, ∞, 4]</text>

    <rect x="470" y="124" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="505" y="145" text-anchor="middle" fill="#4a7a3a">(1,1)</text>
    <text x="505" y="159" text-anchor="middle" fill="#4a7a3a">(4,3)</text>
  </g>

  <!-- row 2: pop (1,1) -->
  <g font-size="10">
    <rect x="40" y="166" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="95" y="191" text-anchor="middle" fill="#d6a040" font-weight="bold">(1, 1)</text>

    <rect x="150" y="166" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="182" text-anchor="middle" fill="#446688">1→0: 1+1=2&gt;0 跳</text>
    <text x="225" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">1→2: 1+3=4&lt;∞ ✓</text>

    <rect x="300" y="166" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="385" y="191" text-anchor="middle" fill="#b85450" font-weight="bold">[0, 1, 4, 4]</text>

    <rect x="470" y="166" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="505" y="187" text-anchor="middle" fill="#4a7a3a">(4,3)</text>
    <text x="505" y="201" text-anchor="middle" fill="#4a7a3a">(4,2)</text>
  </g>

  <!-- row 3: pop (4,3) -->
  <g font-size="10">
    <rect x="40" y="208" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="95" y="233" text-anchor="middle" fill="#d6a040" font-weight="bold">(4, 3)</text>

    <rect x="150" y="208" width="150" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="224" text-anchor="middle" fill="#888">3→0: 8&gt;0 跳</text>
    <text x="225" y="240" text-anchor="middle" fill="#888">3→2: 6&gt;4 跳</text>

    <rect x="300" y="208" width="170" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="233" text-anchor="middle" fill="#446688" font-weight="bold">[0, 1, 4, 4]</text>

    <rect x="470" y="208" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="505" y="233" text-anchor="middle" fill="#4a7a3a">(4,2)</text>
  </g>

  <!-- row 4: pop (4,2) -->
  <g font-size="10">
    <rect x="40" y="250" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="95" y="275" text-anchor="middle" fill="#d6a040" font-weight="bold">(4, 2)</text>

    <rect x="150" y="250" width="150" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="225" y="266" text-anchor="middle" fill="#888">2→1: 7&gt;1 跳</text>
    <text x="225" y="282" text-anchor="middle" fill="#888">2→3: 6&gt;4 跳</text>

    <rect x="300" y="250" width="170" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="275" text-anchor="middle" fill="#446688" font-weight="bold">[0, 1, 4, 4]</text>

    <rect x="470" y="250" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="505" y="275" text-anchor="middle" fill="#888">空</text>
  </g>

  <!-- separator -->
  <path d="M 40 300 L 540 300" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- marked min -->
  <text x="40" y="326" font-size="12" fill="#b85450" font-weight="bold">取 marked = [2, 3] 中的最小 dist：</text>

  <g font-size="11">
    <rect x="60" y="338" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="110" y="358" text-anchor="middle" fill="#b85450" font-weight="bold">dist[2] = 4</text>

    <rect x="180" y="338" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="230" y="358" text-anchor="middle" fill="#b85450" font-weight="bold">dist[3] = 4</text>

    <text x="294" y="358" font-size="16" fill="#444" font-weight="bold">→</text>
  </g>

  <rect x="320" y="338" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="364" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = min(4, 4) = 4</text>

  <!-- footer -->
  <text x="40" y="404" font-size="10" fill="#888">标记节点 2 经 0→1→2 距离 4；标记节点 3 经 0→3 直达距离 4；两者并列取最小。</text>
  <text x="40" y="420" font-size="10" fill="#888">注：图中 0→3 与 3→0 同权，0→1 与 1→0 同权，体现无向边两端各加一条。</text>
  <text x="40" y="436" font-size="10" fill="#888">懒删除：弹出 (d,u) 若 d&gt;dist[u] 即过期，直接跳过——本题后两步均因此松弛失败。</text>
</svg>
