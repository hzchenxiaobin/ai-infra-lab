<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">奇偶跳：奇数跳取最小 ≥，偶数跳取最大 ≤</text>

  <!-- Array [10, 13, 12, 14, 15] -->
  <text x="50" y="190" font-size="12" fill="#888">arr:</text>
  <rect x="100" y="170" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="156" y="170" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">13</text>
  <rect x="212" y="170" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12</text>
  <rect x="268" y="170" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">14</text>
  <rect x="324" y="170" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>

  <!-- Index labels -->
  <text x="128" y="218" text-anchor="middle" font-size="10" fill="#aaa">i=0</text>
  <text x="184" y="218" text-anchor="middle" font-size="10" fill="#aaa">i=1</text>
  <text x="240" y="218" text-anchor="middle" font-size="10" fill="#aaa">i=2</text>
  <text x="296" y="218" text-anchor="middle" font-size="10" fill="#aaa">i=3</text>
  <text x="352" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i=4 ← 终点</text>

  <!-- Odd jump 0→2 (blue, above) -->
  <path d="M 128 170 Q 184 100 240 170" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="184" y="90" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">奇跳: min ≥ 10 = 12</text>

  <!-- Odd jump 3→4 (green, above) -->
  <path d="M 296 170 Q 324 115 352 170" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="324" y="105" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ 终点 ✓</text>

  <!-- Even jump from 2 → fail (red, below) -->
  <path d="M 240 202 L 240 222 L 352 222" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="296" y="236" text-anchor="middle" font-size="9.5" fill="#b85450">14 &gt; 12 ✗</text>
  <text x="352" y="236" text-anchor="middle" font-size="9.5" fill="#b85450">15 &gt; 12 ✗</text>
  <text x="296" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">偶跳: max ≤ 12 → 无目标 ✗</text>

  <!-- Chain summary -->
  <text x="60" y="286" font-size="10.5" fill="#888">i=0: 10 →(奇) 12 →(偶) 无 → ✗ 不是好起点</text>
  <text x="60" y="304" font-size="10.5" fill="#4a7a3a">i=3: 14 →(奇) 15 → 终点 ✓ 好起点</text>
  <text x="60" y="322" font-size="10.5" fill="#4a7a3a">i=4: 已在终点 ✓ 好起点</text>
  <text x="300" y="304" font-size="11" fill="#d6a040" font-weight="bold">好起点 = {3, 4}</text>
  <text x="300" y="322" font-size="11" fill="#d6a040" font-weight="bold">答案 = 2</text>

  <!-- Rule boxes -->
  <rect x="30" y="338" width="235" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="358" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">奇数跳（第 1, 3, 5… 次）</text>
  <text x="147" y="375" text-anchor="middle" font-size="10" fill="#555">跳到最小 arr[j] ≥ arr[i] 的 j</text>
  <text x="147" y="386" text-anchor="middle" font-size="9.5" fill="#888">ceiling，同值取最小下标</text>

  <rect x="275" y="338" width="235" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="392" y="358" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">偶数跳（第 2, 4, 6… 次）</text>
  <text x="392" y="375" text-anchor="middle" font-size="10" fill="#555">跳到最大 arr[j] ≤ arr[i] 的 j</text>
  <text x="392" y="386" text-anchor="middle" font-size="9.5" fill="#888">floor，同值取最小下标</text>
</svg>
