<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [−4, −1, 0, 3, 10]</text>

  <!-- Table outer border -->
  <rect x="24" y="50" width="512" height="208" fill="none" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Column headers -->
  <rect x="24" y="50" width="512" height="32" fill="#e8f0fe" stroke="none" rx="6" filter="url(#rough2)"/>
  <rect x="24" y="74" width="512" height="8" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="46" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="86" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left</text>
  <text x="122" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">right</text>
  <text x="205" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">|左| vs |右|</text>
  <text x="297" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">填入</text>
  <text x="429" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果数组</text>

  <!-- Column dividers -->
  <line x1="68" y1="50" x2="68" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="104" y1="50" x2="104" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="140" y1="50" x2="140" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="50" x2="270" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="324" y1="50" x2="324" y2="258" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row dividers -->
  <line x1="24" y1="82" x2="536" y2="82" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="118" x2="536" y2="118" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="154" x2="536" y2="154" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="190" x2="536" y2="190" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="224" x2="536" y2="224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: step 1, left=0, right=4, 4<10, fill 100 -->
  <text x="46" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="86" y="104" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="122" y="104" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="205" y="104" text-anchor="middle" font-size="11" fill="#333">4 &lt; 10 → 右</text>
  <text x="297" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">100</text>
  <!-- result cells: [_, _, _, _, 100] -->
  <rect x="338" y="92" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="356" y="107" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="376" y="92" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="394" y="107" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="414" y="92" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="432" y="107" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="452" y="92" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="107" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="490" y="92" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="508" y="107" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">100</text>

  <!-- Row 2: step 2, left=0, right=3, 4>=3, fill 16 -->
  <text x="46" y="140" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="86" y="140" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="122" y="140" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="205" y="140" text-anchor="middle" font-size="11" fill="#333">4 ≥ 3 → 左</text>
  <text x="297" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16</text>
  <rect x="338" y="128" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="356" y="143" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="376" y="128" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="394" y="143" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="414" y="128" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="432" y="143" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="452" y="128" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="470" y="143" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">16</text>
  <rect x="490" y="128" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="508" y="143" text-anchor="middle" font-size="10" fill="#333">100</text>

  <!-- Row 3: step 3, left=1, right=3, 1<3, fill 9 -->
  <text x="46" y="176" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="86" y="176" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="122" y="176" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="205" y="176" text-anchor="middle" font-size="11" fill="#333">1 &lt; 3 → 右</text>
  <text x="297" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9</text>
  <rect x="338" y="164" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="356" y="179" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="376" y="164" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="394" y="179" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="414" y="164" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="432" y="179" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>
  <rect x="452" y="164" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="179" text-anchor="middle" font-size="10" fill="#333">16</text>
  <rect x="490" y="164" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="508" y="179" text-anchor="middle" font-size="10" fill="#333">100</text>

  <!-- Row 4: step 4, left=1, right=2, 1>=0, fill 1 -->
  <text x="46" y="212" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="86" y="212" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="122" y="212" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="205" y="212" text-anchor="middle" font-size="11" fill="#333">1 ≥ 0 → 左</text>
  <text x="297" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="338" y="200" width="36" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="356" y="215" text-anchor="middle" font-size="10" fill="#ccc">_</text>
  <rect x="376" y="200" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="394" y="215" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="414" y="200" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="432" y="215" text-anchor="middle" font-size="10" fill="#333">9</text>
  <rect x="452" y="200" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="215" text-anchor="middle" font-size="10" fill="#333">16</text>
  <rect x="490" y="200" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="508" y="215" text-anchor="middle" font-size="10" fill="#333">100</text>

  <!-- Row 5: step 5, left=2, right=2, 0>=0, fill 0 -->
  <text x="46" y="248" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="86" y="248" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="122" y="248" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="205" y="248" text-anchor="middle" font-size="11" fill="#333">0 ≥ 0 → 左</text>
  <text x="297" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="338" y="236" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="356" y="251" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="376" y="236" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="394" y="251" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="414" y="236" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="432" y="251" text-anchor="middle" font-size="10" fill="#333">9</text>
  <rect x="452" y="236" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="251" text-anchor="middle" font-size="10" fill="#333">16</text>
  <rect x="490" y="236" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="508" y="251" text-anchor="middle" font-size="10" fill="#333">100</text>

  <!-- Bottom note -->
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#888">每轮比较两端绝对值，较大者的平方填入结果末尾，指针内移</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果 = [0, 1, 9, 16, 100] ✓</text>
</svg>
