<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">对称性检查：三条短路条件（顺序不可换）</text>

  <!-- ============ Left panel: words = ["abcd","bnrt","crm","dt"] (unequal rows) ============ -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">words = ["abcd","bnrt","crm","dt"]</text>

  <!-- column header -->
  <text x="118" y="78" text-anchor="middle" font-size="9" fill="#aaa">j=</text>
  <text x="146" y="78" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="184" y="78" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="222" y="78" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="260" y="78" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- row labels i= -->
  <text x="118" y="100" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="118" y="130" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="118" y="160" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="118" y="190" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- Row 0: a b c d (4 cells) -->
  <rect x="128" y="88" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="166" y="88" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="204" y="88" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="242" y="88" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>

  <!-- Row 1: b n r t -->
  <rect x="128" y="118" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="166" y="118" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n</text>
  <rect x="204" y="118" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <rect x="242" y="118" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t</text>

  <!-- Row 2: c r m (3 cells) -->
  <rect x="128" y="148" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="166" y="148" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <rect x="204" y="148" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">m</text>

  <!-- Row 3: d t (2 cells) -->
  <rect x="128" y="178" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="166" y="178" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t</text>

  <!-- Mirror pair highlight: (2,2) and (2,2) diagonal; pick (0,3)&(3,0) to show boundary -->
  <!-- highlight (0,3) d and (3,0) d -->
  <rect x="242" y="88" width="36" height="26" fill="none" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="178" width="36" height="26" fill="none" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <!-- mirror arrow -->
  <path d="M 260 88 Q 320 130 320 178 Q 320 210 200 200" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="148" font-size="10" fill="#b85450" font-weight="bold">镜像对</text>
  <text x="330" y="162" font-size="10" fill="#b85450">(0,3) ↔ (3,0)</text>
  <text x="330" y="176" font-size="10" fill="#b85450">d == d ✓</text>

  <!-- check (3,1): words[3][1]='t', mirror (1,3): words[1][3]='t' -->
  <rect x="166" y="178" width="36" height="26" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="118" width="36" height="26" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>

  <!-- ============ Right panel: three checks ============ -->
  <rect x="360" y="60" width="180" height="220" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="450" y="84" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">三条短路条件</text>
  <text x="450" y="100" text-anchor="middle" font-size="10" fill="#888">（按顺序求值，前假则后不查）</text>

  <text x="372" y="124" font-size="11" fill="#2b6e9e" font-weight="bold">① j &lt; len(words)</text>
  <text x="372" y="138" font-size="10" fill="#555">  行 j 必须存在</text>
  <text x="372" y="150" font-size="10" fill="#888">  否则列 j 无字符可取</text>

  <text x="372" y="174" font-size="11" fill="#2e6e2e" font-weight="bold">② i &lt; len(words[j])</text>
  <text x="372" y="188" font-size="10" fill="#555">  行 j 足够长</text>
  <text x="372" y="200" font-size="10" fill="#888">  否则 words[j][i] 越界</text>

  <text x="372" y="224" font-size="11" fill="#a33a36" font-weight="bold">③ words[i][j]==words[j][i]</text>
  <text x="372" y="238" font-size="10" fill="#555">  字符相等</text>
  <text x="372" y="250" font-size="10" fill="#888">  前两条通过才可比字符</text>

  <text x="372" y="272" font-size="10" fill="#b85450" font-weight="bold">任一不满足 → return false</text>

  <!-- ============ Bottom: why one-side scan suffices ============ -->
  <rect x="40" y="300" width="480" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">为什么只遍历 j &lt; len(words[i]) 这一侧就够？</text>
  <text x="56" y="348" font-size="11" fill="#555">正向不对称：words[i][j] 存在、words[j][i] 不存在 → 当前 (i,j) 命中 ①或② → false</text>
  <text x="56" y="370" font-size="11" fill="#555">反向不对称：words[j][i] 存在、words[i][j] 不存在 → (i,j) 不被遍历，但镜像 (j,i) 会被遍历</text>
  <text x="240" y="388" text-anchor="middle" font-size="10" fill="#888">遍历 words[j][i] 时，镜像 words[i][j] 越界 → 命中 ② → false</text>
  <text x="56" y="412" font-size="11" fill="#b85450" font-weight="bold">→ 任意不对称对至少有一侧被遍历，一遍扫描全覆盖</text>
</svg>
