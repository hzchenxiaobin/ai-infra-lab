<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：prices = ["0.700","2.800","4.900"], target = 8</text>

  <!-- ===== Step 1: Parse ===== -->
  <rect x="40" y="40" width="480" height="100" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="58" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">① 解析价格 → (整数部 a, 小数部 f 千分位)</text>

  <!-- Parse table -->
  <rect x="70" y="68" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0.700</text>
  <text x="185" y="83" font-size="11" fill="#888" filter="url(#rough2)">→</text>
  <rect x="210" y="68" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="83" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a=0</text>
  <rect x="280" y="68" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="83" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f=700</text>

  <rect x="70" y="94" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="109" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2.800</text>
  <text x="185" y="109" font-size="11" fill="#888" filter="url(#rough2)">→</text>
  <rect x="210" y="94" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a=2</text>
  <rect x="280" y="94" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f=800</text>

  <rect x="70" y="120" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4.900</text>
  <text x="185" y="135" font-size="11" fill="#888" filter="url(#rough2)">→</text>
  <rect x="210" y="120" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a=4</text>
  <rect x="280" y="120" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f=900</text>

  <text x="380" y="96" font-size="10" fill="#666" filter="url(#rough2)">乘以 1000</text>
  <text x="380" y="110" font-size="10" fill="#666" filter="url(#rough2)">转为整数</text>
  <text x="380" y="124" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">避免浮点误差</text>

  <path d="M 280 144 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Compute k ===== -->
  <rect x="100" y="162" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="180" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 计算 baseSum 与 k</text>
  <text x="120" y="196" font-size="11" fill="#333" filter="url(#rough2)">baseSum = 0+2+4 = 6</text>
  <text x="120" y="210" font-size="11" fill="#333" filter="url(#rough2)">k = 8−6 = 2,  m = 3</text>
  <text x="320" y="196" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 ≤ 2 ≤ 3 ✓</text>
  <text x="320" y="210" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">可行！</text>

  <path d="M 280 220 L 280 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Sort and select ===== -->
  <rect x="40" y="238" width="480" height="110" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="256" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 小数部降序排列，升级前 k=2 个</text>

  <!-- k=2 bracket -->
  <path d="M 96 280 L 96 272 L 336 272 L 336 280" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="216" y="268" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k = 2 升级</text>

  <!-- Sorted boxes -->
  <rect x="80" y="282" width="120" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4.900</text>
  <text x="140" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">f=900</text>
  <text x="140" y="332" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↑ 升级</text>

  <rect x="216" y="282" width="120" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="276" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2.800</text>
  <text x="276" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">f=800</text>
  <text x="276" y="332" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↑ 升级</text>

  <rect x="352" y="282" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="412" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0.700</text>
  <text x="412" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">f=700</text>
  <text x="412" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↓ 保持</text>

  <path d="M 280 350 L 280 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Compute error ===== -->
  <rect x="40" y="368" width="480" height="104" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="386" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 计算误差（千分位整数）</text>

  <text x="70" y="406" font-size="11" fill="#333" filter="url(#rough2)">4.900 → ceil=5</text>
  <text x="220" y="406" font-size="11" fill="#888" filter="url(#rough2)">err = 1000 − 900 =</text>
  <rect x="380" y="394" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">100</text>

  <text x="70" y="430" font-size="11" fill="#333" filter="url(#rough2)">2.800 → ceil=3</text>
  <text x="220" y="430" font-size="11" fill="#888" filter="url(#rough2)">err = 1000 − 800 =</text>
  <rect x="380" y="418" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="432" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">200</text>

  <text x="70" y="454" font-size="11" fill="#333" filter="url(#rough2)">0.700 → floor=0</text>
  <text x="220" y="454" font-size="11" fill="#888" filter="url(#rough2)">err =</text>
  <rect x="270" y="442" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="456" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">700</text>

  <text x="70" y="468" font-size="10" fill="#888" filter="url(#rough2)">和 = 5+3+0 = 8 = target ✓</text>
  <text x="280" y="468" font-size="10" fill="#888" filter="url(#rough2)">Σ = 100+200+700 = 1000</text>

  <path d="M 280 474 L 280 488" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: Result ===== -->
  <rect x="140" y="492" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="510" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">⑤ 格式化：1000 / 1000 =</text>
  <text x="280" y="532" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"1.000"</text>
</svg>
