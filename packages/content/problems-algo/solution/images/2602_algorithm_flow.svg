<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 前缀和 + 二分，每次查询 O(log n)</text>

  <!-- Step 1: sort -->
  <rect x="60" y="50" width="420" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="72" font-size="12" fill="#446688" font-weight="bold">① 排序 nums</text>
  <text x="270" y="82" text-anchor="middle" font-size="12.5" fill="#333">升序排序，O(n log n)</text>

  <path d="M 270 100 L 270 120" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: prefix sum -->
  <rect x="60" y="124" width="420" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="146" font-size="12" fill="#4a7a3a" font-weight="bold">② 预处理前缀和</text>
  <text x="270" y="166" text-anchor="middle" font-size="12.5" fill="#333">prefix[i] = nums[0]+…+nums[i−1]，prefix[0]=0</text>

  <path d="M 270 180 L 270 200" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: loop over queries -->
  <rect x="60" y="204" width="420" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="226" font-size="12" fill="#a87020" font-weight="bold">③ 遍历每个 query q</text>
  <text x="270" y="236" text-anchor="middle" font-size="12.5" fill="#333">对每个查询独立处理，互不影响</text>

  <path d="M 270 254 L 270 274" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: binary search -->
  <rect x="60" y="278" width="420" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="300" font-size="12" fill="#a87020" font-weight="bold">④ 二分找切点</text>
  <text x="270" y="320" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">pos = lower_bound(q)：首个 nums[i] ≥ q</text>

  <path d="M 270 334 L 270 354" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: compute answer -->
  <rect x="60" y="358" width="420" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="380" font-size="12" fill="#b85450" font-weight="bold">⑤ 套公式求 answer</text>
  <text x="270" y="400" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">answer = q·pos − prefix[pos] + (total − prefix[pos]) − q·(n−pos)</text>

  <path d="M 270 414 L 270 434" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 6: collect -->
  <rect x="60" y="438" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="460" font-size="12" fill="#446688" font-weight="bold">⑥ 收集 answer[i]</text>
  <text x="270" y="466" text-anchor="middle" font-size="12.5" fill="#333">写入 answer 数组，返回</text>

  <!-- divider -->
  <path d="M 40 490 L 500 490" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
</svg>
