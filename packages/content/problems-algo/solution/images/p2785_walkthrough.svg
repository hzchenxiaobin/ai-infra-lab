<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "lEetcOde" → "lEOtcede"</text>

  <!-- table header -->
  <rect x="30" y="50" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="70" y="50" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="98" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">s[i]</text>
  <rect x="126" y="50" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="176" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">类型</text>
  <rect x="226" y="50" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="301" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="376" y="50" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">t[i]</text>
  <rect x="424" y="50" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="484" y="68" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">已取 vowels[k]</text>

  <!-- row 0: l consonant -->
  <rect x="30" y="82" width="40" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="70" y="82" width="56" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l</text>
  <rect x="126" y="82" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="176" y="100" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">辅音</text>
  <rect x="226" y="82" width="150" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">照抄</text>
  <rect x="376" y="82" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l</text>
  <rect x="424" y="82" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=0</text>

  <!-- row 1: E vowel -->
  <rect x="30" y="110" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="110" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="128" text-anchor="middle" font-size="11" fill="#b8741a" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="126" y="110" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="176" y="128" text-anchor="middle" font-size="10" fill="#b8741a" filter="url(#rough2)">元音</text>
  <rect x="226" y="110" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="128" text-anchor="middle" font-size="10" fill="#b8741a" filter="url(#rough2)">取 vowels[0]=E</text>
  <rect x="376" y="110" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="128" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="424" y="110" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="128" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">k=1</text>

  <!-- row 2: e vowel -->
  <rect x="30" y="138" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="70" y="138" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="156" text-anchor="middle" font-size="11" fill="#b8741a" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="126" y="138" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="176" y="156" text-anchor="middle" font-size="10" fill="#b8741a" filter="url(#rough2)">元音</text>
  <rect x="226" y="138" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="156" text-anchor="middle" font-size="10" fill="#b8741a" filter="url(#rough2)">取 vowels[1]=O</text>
  <rect x="376" y="138" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="156" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="424" y="138" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="156" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">k=2</text>

  <!-- row 3: t consonant -->
  <rect x="30" y="166" width="40" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="70" y="166" width="56" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t</text>
  <rect x="126" y="166" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="176" y="184" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">辅音</text>
  <rect x="226" y="166" width="150" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="184" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">照抄</text>
  <rect x="376" y="166" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t</text>
  <rect x="424" y="166" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="184" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=2</text>

  <!-- row 4: c consonant -->
  <rect x="30" y="194" width="40" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="70" y="194" width="56" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="126" y="194" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="176" y="212" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">辅音</text>
  <rect x="226" y="194" width="150" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="212" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">照抄</text>
  <rect x="376" y="194" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="424" y="194" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=2</text>

  <!-- row 5: O vowel -->
  <rect x="30" y="222" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="70" y="222" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="240" text-anchor="middle" font-size="11" fill="#b8741a" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="126" y="222" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="176" y="240" text-anchor="middle" font-size="10" fill="#b8741a" filter="url(#rough2)">元音</text>
  <rect x="226" y="222" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="240" text-anchor="middle" font-size="10" fill="#b8741a" filter="url(#rough2)">取 vowels[2]=e</text>
  <rect x="376" y="222" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="240" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="424" y="222" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="240" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">k=3</text>

  <!-- row 6: d consonant -->
  <rect x="30" y="250" width="40" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="70" y="250" width="56" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d</text>
  <rect x="126" y="250" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="176" y="268" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">辅音</text>
  <rect x="226" y="250" width="150" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="268" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">照抄</text>
  <rect x="376" y="250" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d</text>
  <rect x="424" y="250" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="268" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=3</text>

  <!-- row 7: e vowel -->
  <rect x="30" y="278" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="70" y="278" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="98" y="296" text-anchor="middle" font-size="11" fill="#b8741a" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="126" y="278" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="176" y="296" text-anchor="middle" font-size="10" fill="#b8741a" filter="url(#rough2)">元音</text>
  <rect x="226" y="278" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="296" text-anchor="middle" font-size="10" fill="#b8741a" filter="url(#rough2)">取 vowels[3]=e</text>
  <rect x="376" y="278" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="400" y="296" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="424" y="278" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="484" y="296" text-anchor="middle" font-size="10" fill="#3a5a2a" filter="url(#rough2)">k=4 ✓</text>

  <!-- summary -->
  <text x="30" y="332" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">vowels 排序后 = [E, O, e, e]（按 ASCII: 69 &lt; 79 &lt; 101 = 101）</text>
  <text x="30" y="356" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果 t = "lEOtcede" ✓</text>

  <text x="30" y="386" font-size="11" fill="#888" filter="url(#rough2)">示例 2 "lYmpH" 无元音（Y 是辅音），k 始终为 0，直接照抄返回 "lYmpH"</text>
  <text x="30" y="406" font-size="10" fill="#888" filter="url(#rough2)">注意：元音位取的是排序后序列的下一个，与 s[i] 原值无关；辅音位只照抄 s[i]</text>
</svg>
