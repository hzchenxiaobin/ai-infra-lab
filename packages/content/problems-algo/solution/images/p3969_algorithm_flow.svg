<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="14" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">算法流程：外层定 l、内层滑 r 增量求和，末位与首位两级检查</text>

  <!-- 开始 -->
  <rect x="195" y="22" width="120" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="39" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 0</text>
  <path d="M 255 48 L 255 62" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 外层循环 -->
  <rect x="170" y="62" width="170" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="81" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">外层循环 l：s = 0</text>
  <path d="M 255 92 L 255 106" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层循环 -->
  <rect x="170" y="106" width="170" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">内层循环 r：s += nums[r]</text>
  <path d="M 255 136 L 255 150" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1：末位 -->
  <polygon points="255,150 343,180 255,210 167,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="255" y="178" font-size="12" fill="#333">s % 10 == x ?</text>
    <text x="255" y="192" font-size="9.5" fill="#a08030">末位检查</text>
  </g>
  <text x="263" y="222" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 255 210 L 255 226" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取首位 -->
  <rect x="170" y="226" width="170" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="245" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">t = s，反复 ÷10 取首位</text>
  <text x="392" y="245" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">至多 13 次除法</text>
  <path d="M 255 256 L 255 270" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 2：首位 -->
  <polygon points="255,270 343,298 255,326 167,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="255" y="296" font-size="12" fill="#333">首位 t == x ?</text>
    <text x="255" y="310" font-size="9.5" fill="#a08030">首位检查</text>
  </g>
  <text x="263" y="331" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 255 326 L 255 332" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <rect x="195" y="332" width="120" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">ans += 1</text>

  <!-- 右侧旁路：取下一个 r -->
  <path d="M 315 344 L 452 344 L 452 121 L 340 121" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 343 180 L 452 180" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="174" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 343 298 L 452 298" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="292" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <circle cx="452" cy="180" r="2.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="452" cy="298" r="2.5" fill="#446688" filter="url(#rough2)"/>
  <text x="468" y="230" font-size="10" fill="#666" text-anchor="middle" transform="rotate(90 468 230)" filter="url(#rough2)">取下一个 r</text>

  <!-- 左侧回边：r 越界取下一个 l -->
  <path d="M 170 121 L 52 121 L 52 77 L 170 77" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="114" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">r 越界，取下一个 l</text>

  <!-- 左侧出口：l 越界返回 -->
  <path d="M 170 68 L 24 68 L 24 344 L 40 344" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="95" y="62" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">l 越界</text>
  <rect x="40" y="332" width="110" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return ans</text>
</svg>
