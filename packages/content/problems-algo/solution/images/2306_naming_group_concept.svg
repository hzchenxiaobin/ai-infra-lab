<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">按首字母分组：交换后缀的合法性</text>

  <!-- ideas row -->
  <text x="30" y="62" font-size="12" fill="#888">ideas</text>
  <rect x="90" y="46" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="65" text-anchor="middle" font-size="11" fill="#333">coffee</text>
  <rect x="178" y="46" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="65" text-anchor="middle" font-size="11" fill="#333">donuts</text>
  <rect x="266" y="46" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="65" text-anchor="middle" font-size="11" fill="#333">time</text>
  <rect x="354" y="46" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="65" text-anchor="middle" font-size="11" fill="#333">toffee</text>

  <!-- arrows down to groups -->
  <path d="M130 80 L130 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>
  <path d="M218 80 L218 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>
  <path d="M306 80 L306 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>
  <path d="M394 80 L394 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>

  <!-- group c -->
  <rect x="50" y="122" width="130" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">首字母 c</text>
  <rect x="68" y="152" width="94" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="115" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">offee</text>
  <text x="115" y="202" text-anchor="middle" font-size="10" fill="#888">A = {offee}</text>

  <!-- group d -->
  <rect x="200" y="122" width="130" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="265" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">首字母 d</text>
  <rect x="218" y="152" width="94" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="265" y="170" text-anchor="middle" font-size="12" fill="#333">onuts</text>
  <text x="265" y="202" text-anchor="middle" font-size="10" fill="#888">B = {onuts}</text>

  <!-- group t -->
  <rect x="350" y="122" width="150" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">首字母 t</text>
  <rect x="362" y="152" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="392" y="170" text-anchor="middle" font-size="12" fill="#333">ime</text>
  <rect x="428" y="152" width="62" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="459" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">offee</text>
  <text x="425" y="202" text-anchor="middle" font-size="10" fill="#888">C = {ime, offee}</text>

  <!-- shared-suffix note -->
  <text x="285" y="236" text-anchor="middle" font-size="11" fill="#b85450">⚠ 后缀 "offee" 同时在 c 组与 t 组 → 交换后仍是已有名字</text>

  <!-- rule box -->
  <rect x="30" y="252" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="275" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">配对合法 ⟺ suffixA ∉ groupB 且 suffixB ∉ groupA</text>
  <text x="270" y="295" text-anchor="middle" font-size="11" fill="#888">即 A 中不在交集中的后缀数 × B 中不在交集中的后缀数</text>

  <!-- formula -->
  <rect x="30" y="320" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#333">有效对数(a,b) = (|A|−|A∩B|) × (|B|−|A∩B|)，(A,B) 与 (B,A) 算两个公司名 → ×2</text>
</svg>
