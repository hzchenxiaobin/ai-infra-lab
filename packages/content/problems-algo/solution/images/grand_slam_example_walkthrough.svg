<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 年 × 4 冠军列 → 12 行长表 → 分组计数</text>

  <!-- ===== Wide table input ===== -->
  <text x="30" y="52" font-size="10" fill="#888">Championships 宽表（3 行）</text>
  <rect x="24" y="58" width="240" height="86" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="24" y="58" width="240" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="72" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">year</text>
  <text x="92" y="72" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">Wim</text>
  <text x="132" y="72" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">Fr</text>
  <text x="172" y="72" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">US</text>
  <text x="218" y="72" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">Au</text>
  <line x1="24" y1="78" x2="264" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="94" text-anchor="middle" font-size="9" fill="#446688">2018</text>
  <text x="92" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="132" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="172" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="218" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <line x1="24" y1="100" x2="264" y2="100" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="116" text-anchor="middle" font-size="9" fill="#446688">2019</text>
  <text x="92" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="132" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="172" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="218" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="24" y1="122" x2="264" y2="122" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="138" text-anchor="middle" font-size="9" fill="#446688">2020</text>
  <text x="92" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="132" y="138" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="172" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="218" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- arrow to long table -->
  <path d="M 266 100 L 300 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="283" y="94" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">UNION</text>
  <text x="283" y="106" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">ALL</text>

  <!-- ===== Long table (12 rows) ===== -->
  <text x="310" y="52" font-size="10" fill="#888">长表 T（12 行，按年展开）</text>
  <rect x="304" y="58" width="120" height="206" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="304" y="58" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="328" y="72" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">year</text>
  <text x="384" y="72" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">player_id</text>
  <line x1="304" y1="78" x2="424" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- 2018: 1,1,1,1 -->
  <text x="328" y="92" text-anchor="middle" font-size="8" fill="#888">2018</text>
  <text x="384" y="92" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="104" text-anchor="middle" font-size="8" fill="#888">2018</text>
  <text x="384" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="116" text-anchor="middle" font-size="8" fill="#888">2018</text>
  <text x="384" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="128" text-anchor="middle" font-size="8" fill="#888">2018</text>
  <text x="384" y="128" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <line x1="310" y1="134" x2="418" y2="134" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <!-- 2019: 1,1,2,2 -->
  <text x="328" y="148" text-anchor="middle" font-size="8" fill="#888">2019</text>
  <text x="384" y="148" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="160" text-anchor="middle" font-size="8" fill="#888">2019</text>
  <text x="384" y="160" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="172" text-anchor="middle" font-size="8" fill="#888">2019</text>
  <text x="384" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="328" y="184" text-anchor="middle" font-size="8" fill="#888">2019</text>
  <text x="384" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="310" y1="190" x2="418" y2="190" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <!-- 2020: 2,1,2,2 -->
  <text x="328" y="204" text-anchor="middle" font-size="8" fill="#888">2020</text>
  <text x="384" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="328" y="216" text-anchor="middle" font-size="8" fill="#888">2020</text>
  <text x="384" y="216" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="228" text-anchor="middle" font-size="8" fill="#888">2020</text>
  <text x="384" y="228" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="328" y="240" text-anchor="middle" font-size="8" fill="#888">2020</text>
  <text x="384" y="240" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="364" y="258" text-anchor="middle" font-size="8" fill="#888">12 行（含重复 ID）</text>

  <!-- ===== Grouping brackets ===== -->
  <!-- Nadal bracket (rows with player_id=1) -->
  <path d="M 432 88 L 446 88 L 446 220 L 432 220" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="470" y="120" font-size="9" fill="#b85450" font-weight="bold">Nadal(1)</text>
  <text x="470" y="134" font-size="9" fill="#b85450">7 行</text>
  <text x="470" y="148" font-size="8" fill="#b85450">→ count=7</text>

  <!-- Federer bracket (rows with player_id=2) -->
  <path d="M 432 168 L 442 168 L 442 176" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)" opacity="0.4"/>
  <path d="M 432 172 L 446 172 L 446 244 L 432 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="470" y="200" font-size="9" fill="#4a7a3a" font-weight="bold">Federer(2)</text>
  <text x="470" y="214" font-size="9" fill="#4a7a3a">5 行</text>
  <text x="470" y="228" font-size="8" fill="#4a7a3a">→ count=5</text>

  <!-- ===== Bottom: final result ===== -->
  <text x="30" y="300" font-size="10" fill="#888">JOIN Players + GROUP BY + COUNT(*) 后最终输出：</text>

  <rect x="60" y="310" width="320" height="80" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="60" y="310" width="320" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="100" y="325" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">player_id</text>
  <text x="180" y="325" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">player_name</text>
  <text x="300" y="325" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">grand_slams_count</text>
  <line x1="60" y1="332" x2="380" y2="332" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="350" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="180" y="350" text-anchor="middle" font-size="10" fill="#b85450">Nadal</text>
  <text x="300" y="350" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7</text>
  <line x1="70" y1="358" x2="370" y2="358" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="180" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a">Federer</text>
  <text x="300" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- ===== Explanation breakdown ===== -->
  <rect x="30" y="410" width="560" height="138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="432" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Nadal(1) 的 7 次明细</text>
  <text x="50" y="452" font-size="9" fill="#555">• 2018：温网 + 法网 + 美网 + 澳网 = 4 次（全年包揽）</text>
  <text x="50" y="470" font-size="9" fill="#555">• 2019：温网 + 法网 = 2 次</text>
  <text x="50" y="488" font-size="9" fill="#555">• 2020：法网 = 1 次</text>
  <text x="50" y="506" font-size="9" fill="#b85450" font-weight="bold">合计 = 4 + 2 + 1 = 7 ✓</text>
  <text x="330" y="432" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Federer(2) 的 5 次明细</text>
  <text x="340" y="452" font-size="9" fill="#555">• 2018：无冠（长表无该 ID 行）</text>
  <text x="340" y="470" font-size="9" fill="#555">• 2019：美网 + 澳网 = 2 次</text>
  <text x="340" y="488" font-size="9" fill="#555">• 2020：温网 + 美网 + 澳网 = 3 次</text>
  <text x="340" y="506" font-size="9" fill="#4a7a3a" font-weight="bold">合计 = 0 + 2 + 3 = 5 ✓</text>
  <text x="310" y="538" text-anchor="middle" font-size="8" fill="#888">Novak(3) 在长表中无任何行 → INNER JOIN 后自动排除，无需 HAVING 过滤</text>
</svg>
