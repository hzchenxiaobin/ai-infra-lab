<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐会话判定区间内是否有同客户广告</text>

  <!-- ===== Table header ===== -->
  <rect x="20" y="44" width="600" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="55" y="60">session</text>
    <text x="125" y="60">customer</text>
    <text x="210" y="60">区间 [s,e]</text>
    <text x="355" y="60">同客户广告 @ 时间</text>
    <text x="485" y="60">区间内有广告？</text>
    <text x="575" y="60">输出</text>
  </g>
  <!-- column separators -->
  <g stroke="#446688" stroke-width="0.6" filter="url(#rough2)">
    <line x1="90" y1="44" x2="90" y2="68"/>
    <line x1="160" y1="44" x2="160" y2="68"/>
    <line x1="260" y1="44" x2="260" y2="68"/>
    <line x1="450" y1="44" x2="450" y2="68"/>
    <line x1="520" y1="44" x2="520" y2="68"/>
  </g>

  <!-- ===== Row 1: S1 c1 [1,5] -> has ad (red) ===== -->
  <rect x="20" y="68" width="600" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="55" y="86" fill="#b85450" font-weight="bold">1</text>
    <text x="125" y="86" fill="#333">1</text>
    <text x="210" y="86" fill="#333">[1, 5]</text>
    <text x="355" y="86" fill="#b85450">广告 1 @ 5</text>
    <text x="485" y="86" fill="#b85450" font-weight="bold">✓ 是</text>
    <text x="575" y="86" fill="#b85450">排除</text>
  </g>

  <!-- ===== Row 2: S2 c1 [15,23] -> no ad (green) ===== -->
  <rect x="20" y="96" width="600" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="55" y="114" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="125" y="114" fill="#333">1</text>
    <text x="210" y="114" fill="#333">[15, 23]</text>
    <text x="355" y="114" fill="#888">广告 1 @ 5</text>
    <text x="485" y="114" fill="#4a7a3a" font-weight="bold">✗ 否</text>
    <text x="575" y="114" fill="#4a7a3a" font-weight="bold">→ 2</text>
  </g>

  <!-- ===== Row 3: S3 c2 [10,12] -> no ad (green) ===== -->
  <rect x="20" y="124" width="600" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="55" y="142" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="125" y="142" fill="#333">2</text>
    <text x="210" y="142" fill="#333">[10, 12]</text>
    <text x="355" y="142" fill="#888">广告2 @17、广告3 @20</text>
    <text x="485" y="142" fill="#4a7a3a" font-weight="bold">✗ 否</text>
    <text x="575" y="142" fill="#4a7a3a" font-weight="bold">→ 3</text>
  </g>

  <!-- ===== Row 4: S4 c2 [17,28] -> has ad (red) ===== -->
  <rect x="20" y="152" width="600" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="55" y="170" fill="#b85450" font-weight="bold">4</text>
    <text x="125" y="170" fill="#333">2</text>
    <text x="210" y="170" fill="#333">[17, 28]</text>
    <text x="355" y="170" fill="#b85450">广告2 @17、广告3 @20</text>
    <text x="485" y="170" fill="#b85450" font-weight="bold">✓ 是</text>
    <text x="575" y="170" fill="#b85450">排除</text>
  </g>

  <!-- ===== Row 5: S5 c2 [2,8] -> no ad (green) ===== -->
  <rect x="20" y="180" width="600" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="55" y="198" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="125" y="198" fill="#333">2</text>
    <text x="210" y="198" fill="#333">[2, 8]</text>
    <text x="355" y="198" fill="#888">广告2 @17、广告3 @20</text>
    <text x="485" y="198" fill="#4a7a3a" font-weight="bold">✗ 否</text>
    <text x="575" y="198" fill="#4a7a3a" font-weight="bold">→ 5</text>
  </g>

  <!-- column separators through rows -->
  <g stroke="#bbb" stroke-width="0.5" filter="url(#rough2)">
    <line x1="90" y1="68" x2="90" y2="208"/>
    <line x1="160" y1="68" x2="160" y2="208"/>
    <line x1="260" y1="68" x2="260" y2="208"/>
    <line x1="450" y1="68" x2="450" y2="208"/>
    <line x1="520" y1="68" x2="520" y2="208"/>
  </g>

  <!-- arrow to final result -->
  <path d="M320 212 L320 236" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Final output ===== -->
  <rect x="180" y="240" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最终输出 session_id</text>
  <text x="320" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">{ 2, 3, 5 }</text>

  <!-- ===== Footnote ===== -->
  <text x="320" y="300" text-anchor="middle" font-size="8.5" fill="#888">判定式：∃广告 a，a.customer_id = p.customer_id ∧ a.timestamp ∈ [p.start_time, p.end_time]  →  有广告；否则无广告</text>
</svg>
