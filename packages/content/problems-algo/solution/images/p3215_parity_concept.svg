<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：popcount 的奇偶性在 XOR 下可加</text>
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">蓝 = 1 的个数是偶数（E 桶）　　红 = 1 的个数是奇数（O 桶）</text>

  <!-- 左侧例 1：奇 ⊕ 奇 = 偶 -->
  <rect x="44" y="70" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="92" y="88" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">⊕</text>
  <rect x="104" y="70" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="122" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="152" y="88" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">=</text>
  <rect x="164" y="70" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="62" y="106" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">111₂ · 3 个 1</text>
  <text x="122" y="106" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">010₂ · 1 个 1</text>
  <text x="182" y="106" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">101₂ · 2 个 1</text>
  <text x="222" y="88" text-anchor="start" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">奇⊕奇 = 偶 ✓</text>

  <!-- 左侧例 2：奇 ⊕ 偶 = 奇 -->
  <rect x="44" y="126" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="92" y="144" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">⊕</text>
  <rect x="104" y="126" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="122" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="152" y="144" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">=</text>
  <rect x="164" y="126" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="62" y="162" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">111₂ · 3 个 1</text>
  <text x="122" y="162" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">101₂ · 2 个 1</text>
  <text x="182" y="162" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">010₂ · 1 个 1</text>
  <text x="222" y="144" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">奇⊕偶 = 奇</text>

  <!-- 右上：恒等式框 -->
  <rect x="268" y="60" width="232" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">par(x⊕y) ≡ par(x) + par(y) (mod 2)</text>
  <text x="384" y="100" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">popcount(x⊕y) = popcount(x) + popcount(y)</text>
  <text x="384" y="115" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">− 2·popcount(x∧y)　← 模 2 后消失</text>

  <!-- 右下：三元素推论框 -->
  <rect x="268" y="136" width="232" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">par(a⊕b⊕c) ≡ par(a)+par(b)+par(c)</text>
  <text x="384" y="177" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">XOR 的 1 为偶 ⟺「奇」元素恰 0 或 2 个</text>

  <!-- 合法组合 -->
  <text x="60" y="224" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">合法组合（三者奇偶之和 ≡ 0）：</text>

  <rect x="50" y="234" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <rect x="76" y="234" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <rect x="102" y="234" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <text x="132" y="250" text-anchor="start" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="168" y="234" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <rect x="194" y="234" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="206" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <rect x="220" y="234" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="232" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <text x="250" y="250" text-anchor="start" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="286" y="234" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="298" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <rect x="312" y="234" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="324" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <rect x="338" y="234" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <text x="368" y="250" text-anchor="start" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="404" y="234" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <rect x="430" y="234" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="442" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <rect x="456" y="234" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="468" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <text x="486" y="250" text-anchor="start" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 非法组合 -->
  <text x="60" y="282" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">非法组合（「奇」元素恰 1 个或 3 个）：</text>

  <rect x="50" y="292" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <rect x="76" y="292" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <rect x="102" y="292" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <text x="132" y="308" text-anchor="start" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="168" y="292" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <rect x="194" y="292" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="206" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <rect x="220" y="292" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="232" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <text x="250" y="308" text-anchor="start" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="286" y="292" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="298" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <rect x="312" y="292" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="324" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <rect x="338" y="292" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <text x="368" y="308" text-anchor="start" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="404" y="292" width="24" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">奇</text>
  <rect x="430" y="292" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="442" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <rect x="456" y="292" width="24" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="468" y="307" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶</text>
  <text x="486" y="308" text-anchor="start" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 底部公式框 -->
  <rect x="40" y="330" width="440" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = Ea·Eb·Ec + Oa·Ob·Ec + Oa·Eb·Oc + Ea·Ob·Oc</text>
  <text x="260" y="368" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">（E = 偶桶元素个数，O = 奇桶元素个数；下标 a / b / c 对应三个数组）</text>
</svg>
