<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：limit x 越大 → 所需操作数 ops(x) 越小（单调递减）</text>

  <!-- ===== Splitting illustration ===== -->
  <text x="40" y="52" font-size="12" fill="#888">分拆示例：袋子 9 球, 限制 x = 3</text>

  <!-- Big bag with 9 -->
  <rect x="60" y="68" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="95" y="100" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">9</text>

  <!-- Arrow -->
  <path d="M 140 93 L 200 93" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="86" text-anchor="middle" font-size="10" fill="#888">x = 3</text>

  <!-- 3 small bags of 3 -->
  <rect x="210" y="68" width="48" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="234" y="100" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="264" y="68" width="48" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="288" y="100" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="318" y="68" width="48" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="342" y="100" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>

  <!-- Operation count annotation -->
  <text x="200" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⌈9/3⌉ − 1 = 2 次操作</text>

  <!-- General formula box -->
  <rect x="372" y="62" width="172" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="458" y="84" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">通用公式</text>
  <text x="458" y="104" text-anchor="middle" font-size="11" fill="#666">袋子 n 球, 限制 x:</text>
  <text x="458" y="120" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">ops = ⌈n/x⌉ − 1 = ⌊(n−1)/x⌋</text>

  <!-- arrow down -->
  <path d="M 280 152 L 280 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="166" font-size="11" fill="#888">x ↑ ⇒ ops ↓</text>

  <!-- ===== Monotonic curve ===== -->
  <!-- axes -->
  <line x1="90" y1="190" x2="90" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="370" x2="400" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="196" text-anchor="end" font-size="10" fill="#888">ops</text>
  <text x="404" y="374" font-size="10" fill="#888">x →</text>
  <text x="84" y="374" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- decreasing curve -->
  <path d="M 90 235 C 160 250 230 320 400 355" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="224" font-size="11" fill="#446688" font-weight="bold">x ↑ ⇒ ops(x) ↓</text>

  <!-- maxOperations threshold line -->
  <line x1="90" y1="285" x2="400" y2="285" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="404" y="289" font-size="11" fill="#b85450" font-weight="bold">maxOps</text>

  <!-- answer point: minimum x where ops(x) <= maxOps -->
  <circle cx="140" cy="285" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="140" y1="285" x2="140" y2="370" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="140" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = x*</text>

  <!-- feasible / infeasible labels -->
  <text x="98" y="278" font-size="10" fill="#b85450">ops 太多 ✗</text>
  <text x="320" y="278" font-size="10" fill="#4a7a3a">可行 ✓</text>

  <!-- right summary note -->
  <rect x="416" y="210" width="130" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="481" y="232" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="481" y="252" text-anchor="middle" font-size="11" fill="#666">x ∈ [1, max(nums)]</text>
  <text x="481" y="272" text-anchor="middle" font-size="11" fill="#666">求最小的 x</text>
  <text x="481" y="290" text-anchor="middle" font-size="11" fill="#666">使 Σ⌊(n−1)/x⌋</text>
  <text x="481" y="306" text-anchor="middle" font-size="11" fill="#666">≤ maxOperations</text>
  <text x="481" y="328" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
</svg>
