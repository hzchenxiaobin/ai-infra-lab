<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n=6, edges=[[1,2],[1,3],[3,2],[4,1],[5,2],[3,6]]</text>

  <!-- ===== Left: Graph with degree labels ===== -->
  <!-- Internal edges -->
  <line x1="100" y1="95" x2="40" y2="195" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="100" y1="95" x2="160" y2="195" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="40" y1="195" x2="160" y2="195" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- External edges -->
  <line x1="100" y1="95" x2="100" y2="48" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <line x1="40" y1="195" x2="18" y2="280" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <line x1="160" y1="195" x2="185" y2="280" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- Trio nodes -->
  <circle cx="100" cy="95" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="100" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="128" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">deg=3</text>

  <circle cx="40" cy="195" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="40" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="40" y="228" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">deg=3</text>

  <circle cx="160" cy="195" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="228" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">deg=3</text>

  <!-- External nodes -->
  <circle cx="100" cy="48" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="130" y="52" font-size="9" fill="#d6a040" filter="url(#rough2)">deg=1</text>

  <circle cx="18" cy="280" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="18" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="48" y="284" font-size="9" fill="#d6a040" filter="url(#rough2)">deg=1</text>

  <circle cx="185" cy="280" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="215" y="284" font-size="9" fill="#d6a040" filter="url(#rough2)">deg=1</text>

  <!-- Trio label -->
  <rect x="55" y="145" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="159" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">三元组 {1,2,3}</text>

  <!-- ===== Right: Degree table + calculation ===== -->
  <text x="360" y="55" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">步骤 1：计算各点度数</text>

  <!-- Degree table -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- Header -->
    <rect x="340" y="65" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="360" y="81" font-weight="bold" fill="#555" filter="url(#rough2)">节点</text>
    <rect x="380" y="65" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="398" y="81" font-weight="bold" fill="#555" filter="url(#rough2)">1</text>
    <rect x="416" y="65" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="434" y="81" font-weight="bold" fill="#555" filter="url(#rough2)">2</text>
    <rect x="452" y="65" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="470" y="81" font-weight="bold" fill="#555" filter="url(#rough2)">3</text>
    <rect x="488" y="65" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="518" y="81" font-weight="bold" fill="#555" filter="url(#rough2)">4,5,6</text>

    <!-- Degree row -->
    <rect x="340" y="89" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="360" y="105" font-weight="bold" fill="#555" filter="url(#rough2)">deg</text>
    <rect x="380" y="89" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="398" y="105" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="416" y="89" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="434" y="105" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="452" y="89" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="470" y="105" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="488" y="89" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="518" y="105" fill="#d6a040" filter="url(#rough2)">1,1,1</text>
  </g>

  <!-- Step 2: Find trio -->
  <text x="360" y="138" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">步骤 2：枚举三元组</text>
  <rect x="340" y="148" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=1, j=2, k=3 → 三条边都在 ✓</text>

  <!-- Step 3: Compute degree -->
  <text x="360" y="202" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">步骤 3：套用度数公式</text>
  <rect x="340" y="212" width="220" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = deg[1]+deg[2]+deg[3] − 6</text>
  <text x="450" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">= 3 + 3 + 3 − 6</text>
  <text x="450" y="268" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 3</text>

  <!-- Step 4: Result -->
  <text x="360" y="298" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">步骤 4：取最小值</text>
  <rect x="340" y="308" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="330" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = min(+∞, 3) = 3</text>

  <!-- Bottom note -->
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">外部边 (1,4), (2,5), (3,6) 共 3 条 → 与公式结果一致</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">验证：度和 9 = 2×3(内部) + 1×3(外部) → 度数 = 3 ✓</text>
</svg>
