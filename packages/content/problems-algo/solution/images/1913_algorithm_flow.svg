<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序法 vs 单趟线性法</text>

  <!-- Step 1: input -->
  <rect x="160" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入数组 nums（n ≥ 4，全正）</text>

  <path d="M 260 90 L 260 110" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Branch: two approaches -->
  <!-- Left: sort approach -->
  <rect x="40" y="116" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">方法A：排序 O(n log n)</text>

  <!-- Right: linear approach -->
  <rect x="300" y="116" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">方法B：单趟线性 O(n)</text>

  <path d="M 200 116 L 160 116" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 320 116 L 360 116" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Left branch steps -->
  <rect x="40" y="168" width="180" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="184" text-anchor="middle" font-size="11" fill="#333">sort(nums)</text>
  <text x="130" y="200" text-anchor="middle" font-size="10.5" fill="#888">排序后取两端</text>

  <!-- Right branch steps -->
  <rect x="300" y="168" width="180" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="184" text-anchor="middle" font-size="11" fill="#333">一趟扫描维护</text>
  <text x="390" y="200" text-anchor="middle" font-size="10.5" fill="#888">max1/max2/min1/min2</text>

  <path d="M 130 210 L 130 230" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 390 210 L 390 230" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Left: extract -->
  <rect x="40" y="236" width="180" height="44" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="254" text-anchor="middle" font-size="11" fill="#333">max1=nums[n-1], max2=nums[n-2]</text>
  <text x="130" y="270" text-anchor="middle" font-size="11" fill="#333">min1=nums[0], min2=nums[1]</text>

  <!-- Right: extract -->
  <rect x="300" y="236" width="180" height="44" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="254" text-anchor="middle" font-size="11" fill="#333">四个极值已就位</text>
  <text x="390" y="270" text-anchor="middle" font-size="10.5" fill="#888">（初值 ±∞，逐元素更新）</text>

  <path d="M 130 282 L 130 302" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 390 282 L 390 302" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Merge: compute answer -->
  <path d="M 130 302 L 200 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 390 302 L 320 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="140" y="326" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 max1×max2 − min1×min2</text>

  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#555">两种方法结果一致，方法B 空间更优</text>
</svg>
