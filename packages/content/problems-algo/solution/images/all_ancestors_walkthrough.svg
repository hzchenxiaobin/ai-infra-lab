<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：按拓扑序 0→1→2→3→4→5→7→6 传播祖先集合</text>

  <!-- Table header -->
  <rect x="20" y="40" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步 u</text>

  <rect x="80" y="40" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ancestors[u]</text>

  <rect x="230" y="40" width="370" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">传播给后继 v: ancestors[v] 更新</text>

  <!-- Row 1: u=0 -->
  <rect x="20" y="68" width="60" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="90" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="80" y="68" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="90" text-anchor="middle" font-size="12" fill="#888">∅</text>
  <rect x="230" y="68" width="370" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="415" y="90" text-anchor="middle" font-size="11" fill="#444">v=3: {0} ; v=4: {0}</text>

  <!-- Row 2: u=1 -->
  <rect x="20" y="102" width="60" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="102" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="124" text-anchor="middle" font-size="12" fill="#888">∅</text>
  <rect x="230" y="102" width="370" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="415" y="124" text-anchor="middle" font-size="11" fill="#444">v=3: {0,1}</text>

  <!-- Row 3: u=2 -->
  <rect x="20" y="136" width="60" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="80" y="136" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="158" text-anchor="middle" font-size="12" fill="#888">∅</text>
  <rect x="230" y="136" width="370" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="415" y="158" text-anchor="middle" font-size="11" fill="#444">v=4: {0,2} ; v=7: {2}</text>

  <!-- Row 4: u=3 (key) -->
  <rect x="20" y="170" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="80" y="170" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{0,1}</text>
  <rect x="230" y="170" width="370" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="415" y="192" text-anchor="middle" font-size="11" fill="#444">v=5: {0,1,3} ; v=6: {0,1,3} ; v=7: {0,1,2,3}</text>

  <!-- Row 5: u=4 (key) -->
  <rect x="20" y="204" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="80" y="204" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{0,2}</text>
  <rect x="230" y="204" width="370" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="415" y="226" text-anchor="middle" font-size="11" fill="#444">v=6: {0,1,2,3,4} ← 并入 {0,2}∪{4}</text>

  <!-- Row 6: u=5 -->
  <rect x="20" y="238" width="60" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="80" y="238" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="260" text-anchor="middle" font-size="12" fill="#333">{0,1,3}</text>
  <rect x="230" y="238" width="370" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="415" y="260" text-anchor="middle" font-size="11" fill="#888">无后继</text>

  <!-- Row 7: u=7 -->
  <rect x="20" y="272" width="60" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="80" y="272" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="294" text-anchor="middle" font-size="12" fill="#333">{0,1,2,3}</text>
  <rect x="230" y="272" width="370" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="415" y="294" text-anchor="middle" font-size="11" fill="#888">无后继</text>

  <!-- Row 8: u=6 (target) -->
  <rect x="20" y="306" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="80" y="306" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{0,1,2,3,4}</text>
  <rect x="230" y="306" width="370" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="415" y="328" text-anchor="middle" font-size="11" fill="#888">无后继</text>

  <!-- Bottom note -->
  <rect x="20" y="360" width="580" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="380" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">最终答案（升序）：answer[6] = [0,1,2,3,4]</text>
  <text x="310" y="398" text-anchor="middle" font-size="11" fill="#666">关键：拓扑序保证处理 u 时其祖先集合已完整 → 一次传播即可</text>
  <text x="310" y="414" text-anchor="middle" font-size="10" fill="#888">v=6 的祖先 = 直接前驱{3,4} ∪ ancestors[3]∪ancestors[4] = {0,1}∪{0,2}∪{3,4}</text>
</svg>
