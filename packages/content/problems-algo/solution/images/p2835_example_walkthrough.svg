<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,32,1,2]，target = 12 = 1100₂</text>

  <!-- initial buckets -->
  <text x="110" y="52" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">初始桶：</text>

  <rect x="160" y="38" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="52" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2⁰</text>
  <text x="186" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="220" y="38" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="52" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2¹</text>
  <text x="246" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="280" y="38" width="52" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="306" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2²</text>
  <text x="306" y="65" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <rect x="340" y="38" width="52" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="366" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2³</text>
  <text x="366" y="65" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <rect x="400" y="38" width="52" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="426" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2⁴</text>
  <text x="426" y="65" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <rect x="460" y="38" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="486" y="52" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">2⁵</text>
  <text x="486" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="486" y="86" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">32 在这里</text>

  <!-- table -->
  <!-- header -->
  <rect x="30" y="104" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="62" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">位 i</text>
  <rect x="94" y="104" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">target 位</text>
  <rect x="170" y="104" width="212" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="276" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="382" y="104" width="172" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="468" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">关键变化</text>
  <rect x="554" y="104" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="576" y="124" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ops</text>

  <!-- row 1 -->
  <rect x="30" y="136" width="64" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="94" y="136" width="76" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="132" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="170" y="136" width="212" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="276" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">进位：两个 1 凑成 2</text>
  <rect x="382" y="136" width="172" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="468" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[1]: 1 → 2</text>
  <rect x="554" y="136" width="44" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="576" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 2 -->
  <rect x="30" y="168" width="64" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="94" y="168" width="76" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="132" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="170" y="168" width="212" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="276" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">进位：两个 2 凑成 4</text>
  <rect x="382" y="168" width="172" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="468" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[2]: 0 → 1</text>
  <rect x="554" y="168" width="44" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="576" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 3 (green highlight) -->
  <rect x="30" y="200" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="94" y="200" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="132" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="200" width="212" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="276" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">白嫖：cnt[2] = 1 直接用</text>
  <rect x="382" y="200" width="172" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="468" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">这个「4」= 1+1+2</text>
  <rect x="554" y="200" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="576" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 4 (red highlight) -->
  <rect x="30" y="232" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="94" y="232" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="132" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="232" width="212" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="276" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt[3] = 0 → 拆 j = 5（32）</text>
  <rect x="382" y="232" width="172" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="468" y="252" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">ans += 5−3 = 2；得 16,8,8</text>
  <rect x="554" y="232" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="576" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row 5 -->
  <rect x="30" y="264" width="64" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4+</text>
  <rect x="94" y="264" width="76" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="132" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="170" y="264" width="212" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="276" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">无需求，桶进位后归零</text>
  <rect x="382" y="264" width="172" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="468" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <rect x="554" y="264" width="44" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="576" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- reality check box -->
  <rect x="60" y="312" width="500" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="334" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">现实对照：ans = 2</text>
  <text x="310" y="354" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">操作①：32 → 16, 16；操作②：一个 16 → 8, 8</text>
  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">数组变为 [1, 1, 2, 16, 8, 8]</text>
  <text x="310" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">子序列 [1, 1, 2, 8]：1 + 1 + 2 + 8 = 12 ✓（位 2 白嫖 + 位 3 拆出的 8）</text>
</svg>
