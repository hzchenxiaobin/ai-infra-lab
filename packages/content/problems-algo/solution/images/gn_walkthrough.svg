<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 10, pick = 6</text>

  <!-- ===== Part A: 值域与 pick ===== -->
  <text x="280" y="54" text-anchor="middle" font-size="11.5" fill="#888">① 值域 [1, 10]，pick = 6（待猜数）</text>

  <!-- 10 number cells, width 40, gap 6, start x=80, centers 100..514 -->
  <!-- cells 1-5 green, cell 6 highlight, cells 7-10 pink -->
  <rect x="80" y="68" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="100" y="93" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="126" y="68" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="146" y="93" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="172" y="68" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="93" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="218" y="68" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="238" y="93" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="264" y="68" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="284" y="93" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="310" y="66" width="40" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="5" filter="url(#rough2)"/>
  <text x="330" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="356" y="68" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="376" y="93" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="402" y="68" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="422" y="93" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="448" y="68" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="468" y="93" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="494" y="68" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="514" y="93" text-anchor="middle" font-size="11" fill="#333">10</text>

  <!-- arrow to pick -->
  <path d="M 330 118 L 330 126" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Part B: 二分过程表格 ===== -->
  <text x="280" y="150" text-anchor="middle" font-size="11.5" fill="#888">② 二分查找过程（3 轮即命中，仅 3 次 guess 调用）</text>

  <!-- table header: 轮次 | left | right | mid | guess(mid) | 动作 -->
  <rect x="30" y="164" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="164" x2="90" y2="192" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="164" x2="150" y2="192" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="210" y1="164" x2="210" y2="192" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="270" y1="164" x2="270" y2="192" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="380" y1="164" x2="380" y2="192" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="120" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left</text>
  <text x="180" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right</text>
  <text x="240" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid</text>
  <text x="325" y="183" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">guess(mid)</text>
  <text x="450" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- round 1: left=1, right=10, mid=5, guess=+1 (lower), left=mid+1=6 -->
  <rect x="30" y="192" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="192" x2="90" y2="220" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="192" x2="150" y2="220" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="192" x2="210" y2="220" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="192" x2="270" y2="220" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="192" x2="380" y2="220" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="211" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="211" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="180" y="211" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="240" y="211" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="325" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1（猜小了）</text>
  <text x="450" y="211" text-anchor="middle" font-size="10.5" fill="#4a7a3a">left = mid+1 = 6</text>

  <!-- round 2: left=6, right=10, mid=8, guess=-1 (higher), right=mid-1=7 -->
  <rect x="30" y="220" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="220" x2="90" y2="248" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="220" x2="150" y2="248" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="220" x2="210" y2="248" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="220" x2="270" y2="248" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="220" x2="380" y2="248" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="239" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="239" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="180" y="239" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="240" y="239" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="325" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1（猜大了）</text>
  <text x="450" y="239" text-anchor="middle" font-size="10.5" fill="#b85450">right = mid−1 = 7</text>

  <!-- round 3: left=6, right=7, mid=6, guess=0, return 6 -->
  <rect x="30" y="248" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="90" y1="248" x2="90" y2="276" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="248" x2="150" y2="276" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="248" x2="210" y2="276" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="248" x2="270" y2="276" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="248" x2="380" y2="276" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="267" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="267" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="180" y="267" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="240" y="267" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="325" y="267" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0（命中！）</text>
  <text x="450" y="267" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">return 6 ✓</text>

  <!-- ===== Part C: 区间收缩可视化 ===== -->
  <text x="280" y="304" text-anchor="middle" font-size="11.5" fill="#888">③ 区间收缩可视化（[1,10] → [6,10] → [6,7] → 命中 6）</text>

  <!-- round 1: [1, 10] -> mid=5, +1 -> [6, 10] -->
  <text x="50" y="330" font-size="10.5" fill="#888">轮1:</text>
  <rect x="90" y="318" width="398" height="22" fill="none" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="289" y="333" text-anchor="middle" font-size="10" fill="#446688">[1, 10]  mid=5 → guess=+1 → left=6</text>

  <path d="M 289 344 L 289 354" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- round 2: [6, 10] -> mid=8, -1 -> [6, 7] -->
  <text x="50" y="372" font-size="10.5" fill="#888">轮2:</text>
  <rect x="270" y="360" width="218" height="22" fill="none" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="379" y="375" text-anchor="middle" font-size="10" fill="#b85450">[6, 10]  mid=8 → guess=−1 → right=7</text>

  <path d="M 379 386 L 379 396" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- round 3: [6, 7] -> mid=6, 0 -> return 6 -->
  <text x="50" y="418" font-size="10.5" fill="#888">轮3:</text>
  <rect x="270" y="406" width="80" height="22" fill="none" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="421" text-anchor="middle" font-size="10" fill="#d6a040">[6, 7]  mid=6 → 0</text>

  <path d="M 310 432 L 310 442" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="288" y="442" width="40" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="345" y="453" font-size="10" fill="#d6a040" font-weight="bold">返回 6 ✓</text>
</svg>
