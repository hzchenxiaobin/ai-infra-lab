<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：p = 1 / 2 / 3</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">代入 ans = (2^p−1) · (2^p−2)^(2^(p−1)−1)</text>

  <!-- table header -->
  <g font-size="12">
    <rect x="40" y="66" width="540" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="80" y="86" text-anchor="middle" fill="#446688" font-weight="bold">p</text>
    <text x="180" y="86" text-anchor="middle" fill="#446688" font-weight="bold">nums</text>
    <text x="330" y="86" text-anchor="middle" fill="#446688" font-weight="bold">代入公式</text>
    <text x="510" y="86" text-anchor="middle" fill="#446688" font-weight="bold">结果</text>
  </g>

  <!-- row p=1 -->
  <g font-size="11">
    <rect x="40" y="100" width="540" height="44" rx="4" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="126" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="180" y="120" text-anchor="middle" fill="#333">[1]</text>
    <text x="180" y="134" text-anchor="middle" font-size="9" fill="#888">2^1−1=1 个</text>
    <text x="330" y="126" text-anchor="middle" fill="#333">1 · 0^0 = 1</text>
    <text x="510" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">1 ✓</text>
  </g>

  <!-- row p=2 -->
  <g font-size="11">
    <rect x="40" y="146" width="540" height="44" rx="4" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="80" y="172" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <text x="180" y="166" text-anchor="middle" fill="#333">[1, 2, 3]</text>
    <text x="180" y="180" text-anchor="middle" font-size="9" fill="#888">3·1·2</text>
    <text x="330" y="172" text-anchor="middle" fill="#333">3 · 2^1 = 6</text>
    <text x="510" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">6 ✓</text>
  </g>

  <!-- row p=3 -->
  <g font-size="11">
    <rect x="40" y="192" width="540" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="80" y="218" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <text x="180" y="212" text-anchor="middle" fill="#333">[1..7]</text>
    <text x="180" y="226" text-anchor="middle" font-size="9" fill="#888">7·6·1·6·1·6·1</text>
    <text x="330" y="218" text-anchor="middle" fill="#333">7 · 6^3 = 1512</text>
    <text x="510" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">1512 ✓</text>
  </g>

  <!-- p=3 detail -->
  <rect x="40" y="248" width="540" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="270" font-size="11" fill="#444" font-weight="bold">p=3 展开：</text>
  <text x="56" y="288" font-size="11" fill="#444">2^p−1=7，2^p−2=6，对数 2^(p−1)−1=3 → 7×6×6×6×1×1×1 = 1512</text>
  <text x="56" y="302" font-size="10" fill="#888">原始乘积 1×2×3×4×5×6×7 = 5040，位交换后降到 1512（约 1/3.3）</text>

  <!-- bottom note -->
  <rect x="40" y="316" width="540" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="338" font-size="11" fill="#444" font-weight="bold">快速幂要点：</text>
  <text x="56" y="356" font-size="11" fill="#444">p≤60 → 指数 2^(p−1)−1 高达 2^59；用 O(log exp) 快速幂，每步乘后立即 mod</text>
</svg>
