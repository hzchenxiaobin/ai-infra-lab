<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 逻辑流程：GROUP BY + HAVING 双边界过滤</text>

  <!-- Step 1: FROM + JOIN -->
  <text x="30" y="54" font-size="11.5" fill="#888">① FROM Sales s JOIN Product p ON product_id — 关联销售与产品名</text>
  <rect x="40" y="62" width="520" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">FROM Sales s JOIN Product p ON s.product_id = p.product_id</text>
  <text x="300" y="100" text-anchor="middle" font-size="10.5" fill="#555">拼接后的宽行：product_id, product_name, sale_date, ...</text>

  <path d="M 300 114 L 300 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY -->
  <text x="30" y="148" font-size="11.5" fill="#888">② GROUP BY product_id — 按产品分组，每产品一组</text>
  <rect x="40" y="156" width="520" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">GROUP BY p.product_id, p.product_name</text>
  <text x="300" y="194" text-anchor="middle" font-size="10.5" fill="#555">每组 = 一个产品的全部销售记录，可计算 MIN / MAX(sale_date)</text>

  <path d="M 300 208 L 300 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: HAVING -->
  <text x="30" y="242" font-size="11.5" fill="#888">③ HAVING — 双边界过滤：MIN ≥ 起点 AND MAX ≤ 终点</text>
  <rect x="40" y="250" width="520" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="272" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">HAVING MIN(s.sale_date) >= '2019-01-01'</text>
  <text x="300" y="290" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">   AND MAX(s.sale_date) <= '2019-03-31'</text>
  <text x="300" y="306" text-anchor="middle" font-size="10.5" fill="#555">MIN ≥ 起点排除「春季前有销售」；MAX ≤ 终点排除「春季后有销售」</text>

  <path d="M 300 316 L 300 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="331" font-size="10" fill="#888">输出</text>

  <!-- Result -->
  <rect x="40" y="340" width="520" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="362" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">SELECT product_id, product_name</text>
  <text x="300" y="380" text-anchor="middle" font-size="10.5" fill="#555">结果 = 所有销售日期都落在春季窗口内的产品</text>

  <!-- Comparison box -->
  <rect x="30" y="402" width="540" height="46" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="422" font-size="11" fill="#555" font-weight="bold">💡 WHERE vs HAVING</text>
  <text x="50" y="438" font-size="10.5" fill="#888">WHERE 过滤行（逐条记录）；HAVING 过滤组（聚合后整组判定）。本题需对「整组」判定，故用 HAVING。</text>
</svg>
