<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2799a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arr2799b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：凑齐 k 种元素 → 右端往后全是完全子数组</text>

  <!-- ===== top: definition ===== -->
  <rect x="60" y="44" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">完全子数组 = 子数组不同元素数 = 全数组不同元素数 k</text>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#d6a040">nums=[1,3,1,2,2]，全数组 k=3（元素 1、3、2）</text>

  <!-- ===== middle: array with threshold ===== -->
  <text x="60" y="120" font-size="12" fill="#888" font-weight="bold">left=0：向右扩展直到首次凑齐 3 种</text>

  <!-- index labels -->
  <text x="125" y="140" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="175" y="140" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="225" y="140" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="275" y="140" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="325" y="140" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- array cells -->
  <g font-size="18" font-weight="bold">
    <rect x="100" y="148" width="50" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="125" y="179" text-anchor="middle" fill="#333">1</text>

    <rect x="150" y="148" width="50" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="175" y="179" text-anchor="middle" fill="#333">3</text>

    <rect x="200" y="148" width="50" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="225" y="179" text-anchor="middle" fill="#333">1</text>

    <rect x="250" y="148" width="50" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
    <text x="275" y="179" text-anchor="middle" fill="#4a7a3a">2</text>

    <rect x="300" y="148" width="50" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3,3" rx="5" filter="url(#rough2)"/>
    <text x="325" y="179" text-anchor="middle" fill="#999">2</text>
  </g>

  <!-- threshold marker on index 3 -->
  <text x="275" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">凑齐!</text>
  <path d="M250,206 L300,206" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2799b)" filter="url(#rough2)"/>
  <text x="275" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a">right=4（不含）</text>

  <!-- window bracket [0..3] -->
  <path d="M98,210 Q98,218 106,218 L274,218 Q282,218 282,210" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="234" text-anchor="middle" font-size="10" fill="#446688">最短完全子数组 [1,3,1,2]</text>

  <!-- ===== bottom: all extensions are complete ===== -->
  <text x="60" y="262" font-size="12" fill="#888" font-weight="bold">凑齐后再往右扩展，不同元素数只增不减 → 全是完全子数组</text>

  <!-- show 2 complete subarrays -->
  <g font-size="13" font-weight="bold">
    <!-- [1,3,1,2] -->
    <rect x="100" y="278" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="125" y="301" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="150" y="278" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="175" y="301" text-anchor="middle" fill="#4a7a3a">3</text>
    <rect x="200" y="278" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="225" y="301" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="250" y="278" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="275" y="301" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="200" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a">[1,3,1,2] ✓</text>

    <!-- [1,3,1,2,2] -->
    <rect x="100" y="340" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="125" y="363" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="150" y="340" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="175" y="363" text-anchor="middle" fill="#4a7a3a">3</text>
    <rect x="200" y="340" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="225" y="363" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="250" y="340" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="275" y="363" text-anchor="middle" fill="#4a7a3a">2</text>
    <rect x="300" y="340" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="325" y="363" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="225" y="390" text-anchor="middle" font-size="10" fill="#4a7a3a">[1,3,1,2,2] ✓</text>
  </g>

  <!-- summary box -->
  <rect x="370" y="270" width="160" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">计数公式</text>
  <text x="450" y="312" text-anchor="middle" font-size="11" fill="#446688">ans += n − right + 1</text>
  <text x="450" y="332" text-anchor="middle" font-size="10" fill="#446688">= 5 − 4 + 1 = 2</text>
  <text x="450" y="352" text-anchor="middle" font-size="10" fill="#446688">右端 ∈ [right−1, n−1]</text>
  <text x="450" y="370" text-anchor="middle" font-size="9" fill="#d6a040">即 [3, 4] 共 2 个</text>
</svg>
