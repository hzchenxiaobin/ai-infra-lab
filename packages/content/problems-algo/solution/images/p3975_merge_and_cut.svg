<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">核心观察：先极大合并（重叠 / 相接），再用空闲区间切一刀</text>

  <!-- 排序前的原始区间（两行表现重叠） -->
  <text x="48" y="56" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">排序前</text>
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="60" y="44" width="130" height="17" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="268" y="44" width="26" height="17" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="372" y="44" width="78" height="17" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="112" y="64" width="130" height="17" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="268" y="64" width="78" height="17" rx="4" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <g font-size="9.5" text-anchor="middle" filter="url(#rough2)">
    <text x="125" y="57" fill="#446688">[2,6]</text>
    <text x="281" y="57" fill="#446688">[10,10]</text>
    <text x="411" y="57" fill="#446688">[14,16]</text>
    <text x="177" y="77" fill="#d6a040">[4,8]</text>
    <text x="307" y="77" fill="#d6a040">[10,12]</text>
  </g>

  <!-- 合并箭头 -->
  <path d="M 200 90 L 200 106" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="103" font-size="11" fill="#666" filter="url(#rough2)">sort + 合并：s ≤ 尾端 + 1 就并（相接也算！）</text>

  <!-- 合并后 -->
  <g stroke-width="1.8" filter="url(#rough2)">
    <rect x="60" y="112" width="182" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="268" y="112" width="78" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="372" y="112" width="78" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">
    <text x="151" y="127">[2,8]</text>
    <text x="307" y="127">[10,12]</text>
    <text x="411" y="127">[14,16]</text>
  </g>

  <!-- 空闲区间红罩 -->
  <rect x="190" y="138" width="130" height="15" rx="4" fill="#fce4ec" fill-opacity="0.8"
        stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="330" y="150" font-size="11" fill="#b85450" filter="url(#rough2)">空闲 [7,11]</text>

  <!-- 切割箭头 -->
  <path d="M 200 160 L 200 176" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="173" font-size="11" fill="#666" filter="url(#rough2)">切割：删去 [f, g] 内所有整数点</text>

  <!-- 结果行 -->
  <g stroke-width="1.8" filter="url(#rough2)">
    <rect x="60" y="182" width="130" height="22" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="320" y="182" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="372" y="182" width="78" height="22" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#446688" filter="url(#rough2)">
    <text x="125" y="197">[2,6]</text>
    <text x="333" y="197">[12,12]</text>
    <text x="411" y="197">[14,16]</text>
  </g>

  <!-- 数轴 -->
  <line x1="60" y1="216" x2="450" y2="216" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="9" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <line x1="60" y1="212" x2="60" y2="220" stroke="#999" stroke-width="1.2"/>
    <line x1="164" y1="212" x2="164" y2="220" stroke="#999" stroke-width="1.2"/>
    <line x1="216" y1="212" x2="216" y2="220" stroke="#999" stroke-width="1.2"/>
    <line x1="268" y1="212" x2="268" y2="220" stroke="#999" stroke-width="1.2"/>
    <line x1="320" y1="212" x2="320" y2="220" stroke="#999" stroke-width="1.2"/>
    <line x1="372" y1="212" x2="372" y2="220" stroke="#999" stroke-width="1.2"/>
    <line x1="424" y1="212" x2="424" y2="220" stroke="#999" stroke-width="1.2"/>
    <text x="60" y="231">2</text>
    <text x="164" y="231">6</text>
    <text x="216" y="231">8</text>
    <text x="268" y="231">10</text>
    <text x="320" y="231">12</text>
    <text x="372" y="231">14</text>
    <text x="424" y="231">16</text>
  </g>

  <!-- 底部：统一切割公式面板 -->
  <rect x="36" y="244" width="448" height="100" rx="8" fill="#e8f0fe" fill-opacity="0.5"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">统一切割：一个 if 一段，五种相对位置全覆盖</text>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="52" y="290">l &lt; f  →  追加 [l, min(r, f−1)]   （左段；不相交时 min = r，整段保留）</text>
    <text x="52" y="312">r &gt; g  →  追加 [max(l, g+1), r]   （右段；不相交时 max = l，整段保留）</text>
  </g>
  <text x="52" y="334" font-size="10.5" fill="#666" filter="url(#rough2)">原样保留 / 削左 / 削右 / 分裂成两段 / 整段消失 —— 全都无需特判</text>
</svg>
