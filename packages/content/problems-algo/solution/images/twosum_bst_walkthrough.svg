<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [5,3,6,2,4,null,7], k = 9</text>

  <!-- BST 静态 -->
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">BST</text>
  <circle cx="150" cy="84" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="89" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>

  <circle cx="105" cy="140" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="145" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <line x1="139" y1="97" x2="115" y2="127" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="200" cy="140" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="145" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <line x1="164" y1="97" x2="190" y2="127" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="75" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="201" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <line x1="98" y1="153" x2="83" y2="183" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="135" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="201" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <line x1="113" y1="153" x2="128" y2="183" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="230" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="201" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>
  <line x1="212" y1="153" x2="225" y2="183" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 步骤表格 -->
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">逐步演算（前序遍历顺序）</text>

  <!-- 表头 -->
  <rect x="310" y="70" width="280" height="26" fill="#e8f0ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">步</text>
  <text x="380" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">v</text>
  <text x="445" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">查 9−v</text>
  <text x="535" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">动作</text>

  <!-- 步骤 1: 5 -->
  <rect x="310" y="98" width="280" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="330" y="114" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="380" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <text x="445" y="114" text-anchor="middle" font-size="11" fill="#333">4 ∈ ∅?</text>
  <text x="535" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a">存 5</text>

  <!-- 步骤 2: 3 -->
  <rect x="310" y="122" width="280" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="330" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="380" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="445" y="138" text-anchor="middle" font-size="11" fill="#333">6 ∈ {5}?</text>
  <text x="535" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a">存 3</text>

  <!-- 步骤 3: 2 -->
  <rect x="310" y="146" width="280" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="330" y="162" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="380" y="162" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="445" y="162" text-anchor="middle" font-size="11" fill="#333">7 ∈ {5,3}?</text>
  <text x="535" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a">存 2</text>

  <!-- 步骤 4: 4 -->
  <rect x="310" y="170" width="280" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="330" y="186" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="380" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <text x="445" y="186" text-anchor="middle" font-size="11" fill="#333">5 ∈ {5,3,2}?</text>
  <text x="535" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">命中→true</text>

  <!-- 步骤 5: 7 (命中后即返回，此处补充) -->
  <rect x="310" y="194" width="280" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5*</text>
  <text x="380" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>
  <text x="445" y="210" text-anchor="middle" font-size="11" fill="#b85450">2 ∈ {5,3,2,4}?</text>
  <text x="535" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">命中→true</text>

  <!-- 高亮路径 -->
  <circle cx="135" cy="196" r="17" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="75" cy="196" r="17" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 说明 -->
  <rect x="40" y="250" width="540" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="12" fill="#555" font-weight="bold">两种命中方式都正确：</text>
  <text x="60" y="294" font-size="11" fill="#555">• 步骤 4（先到 4）：查补数 5 ∈ {5,3,2} ✓ —— 4 + 5 = 9，5 是之前访问的根。</text>
  <text x="60" y="312" font-size="11" fill="#555">• 步骤 5*（先到 7）：查补数 2 ∈ {5,3,2,4} ✓ —— 7 + 2 = 9，2 是之前访问的左子叶。</text>
  <text x="60" y="332" font-size="11" fill="#555">无论遍历顺序如何（前序/中序/层序），先访问的那个先入表，后访问的必能查到。</text>

  <!-- 复杂度 -->
  <rect x="40" y="370" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="310" y="392" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">时间 O(n)｜空间 O(n)｜遍历顺序无关（DFS 递归栈 O(h)，BFS 队列 O(w)）</text>
</svg>
