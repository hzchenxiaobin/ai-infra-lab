<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：模拟 + 哈希判重 + 周期取模</text>

  <rect x="180" y="46" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">seen = {}，states = []，state = cells</text>

  <line x1="280" y1="80" x2="280" y2="96" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="100" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">for day in 0..n</text>

  <line x1="280" y1="134" x2="280" y2="150" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,152 380,188 280,224 180,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">state 在</text>
  <text x="280" y="198" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">seen 中？</text>

  <line x1="380" y1="188" x2="430" y2="188" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="180" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">是</text>

  <rect x="430" y="158" width="116" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="488" y="178" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">start = seen[state]</text>
  <text x="488" y="192" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">cycle = day − start</text>
  <text x="488" y="208" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">return 取模结果</text>

  <line x1="280" y1="224" x2="280" y2="238" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="234" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="170" y="242" width="220" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">seen[state] = day，states.append(state)</text>

  <line x1="280" y1="276" x2="280" y2="290" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,292 370,324 280,356 190,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">day == n？</text>

  <line x1="370" y1="324" x2="430" y2="324" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="400" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="430" y="308" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="329" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return state</text>

  <line x1="280" y1="356" x2="280" y2="370" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="366" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="160" y="374" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">计算 next：next[i] = (cell[i−1]==cell[i+1])</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">首尾恒 0，state = next</text>

  <path d="M 160 394 L 110 394 L 110 117 L 200 117" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="256" font-size="9" fill="#888" filter="url(#rough2)">回到循环</text>

  <rect x="40" y="420" width="500" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="441" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">关键：最多模拟 64 步必遇循环 → 用 (n−start)%cycle 跳过亿级天数</text>
</svg>
