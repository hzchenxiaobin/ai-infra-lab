<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：维护 max1 / max2 两个阈值，一遍滚动更新</text>

  <!-- Two threshold slots -->
  <text x="56" y="78" font-size="12" fill="#888" filter="url(#rough2)">两个阈值：</text>

  <rect x="120" y="60" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="180" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">max1（最大）</text>
  <text x="180" y="96" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">初值 = −1</text>

  <rect x="300" y="60" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">max2（次大）</text>
  <text x="360" y="96" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">初值 = −1</text>

  <!-- incoming digit d -->
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">遍历到数字 d（0–9）</text>
  <rect x="248" y="140" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d</text>

  <path d="M 280 176 L 280 196" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: d > max1 ? -->
  <polygon points="280,200 380,240 280,280 180,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d &gt; max1 ?</text>
  <text x="280" y="252" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">是否刷新最大</text>

  <!-- Yes branch (left): demote max1 to max2, then max1 = d -->
  <path d="M 180 240 L 96 240" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="234" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="16" y="220" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="56" y="238" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">max2 ← max1</text>
  <text x="56" y="254" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">max1 ← d</text>

  <!-- No branch (right): down to next decision -->
  <path d="M 380 240 L 460 240" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Second decision: d < max1 and d > max2 ? -->
  <polygon points="460,220 540,240 460,260 440,240" fill="none" stroke="none" filter="url(#rough2)"/>

  <rect x="416" y="222" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="481" y="240" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d &lt; max1</text>
  <text x="481" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">且 d &gt; max2 ?</text>

  <!-- Yes (down): max2 = d -->
  <path d="M 460 262 L 380 282" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="278" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- No (skip) -->
  <path d="M 481 262 L 481 282" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="278" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="296" y="284" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="338" y="306" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">max2 ← d</text>

  <rect x="436" y="284" width="100" height="34" fill="none" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="486" y="306" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">跳过（重复/更小）</text>

  <!-- key insight -->
  <path d="M 40 332 L 520 332" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="11" fill="#555" filter="url(#rough2)">• 初值取 −1（哨兵）：数字恒 ≥ 0，故 −1 即"未填充"，遍历结束 <tspan fill="#b85450" font-weight="bold">max2 == −1</tspan> 即无次大</text>
</svg>
