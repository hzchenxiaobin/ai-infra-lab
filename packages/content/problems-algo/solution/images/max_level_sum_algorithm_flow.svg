<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 逐层 → 累加 sum → 严格 &gt; 更新最大</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">时间 O(n)，每个节点入队出队各 1 次</text>

  <g font-size="10" fill="#333">
    <!-- Step 1 -->
    <rect x="40" y="64" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 初始化</text>
    <text x="140" y="84" font-family="monospace" font-size="10" fill="#555">queue.push(root);  maxSum = INT_MIN;  ans = 0;</text>
    <text x="140" y="100" font-size="9" fill="#888">maxSum 必须是负无穷：节点值可能为负，初值 0 会误判</text>

    <path d="M 260 116 L 260 130" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: while -->
    <rect x="40" y="134" width="440" height="142" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="154" font-size="12" fill="#4a7a3a" font-weight="bold">② while 队列非空（每轮 = 一层）</text>
    <text x="54" y="172" font-family="monospace" font-size="10" fill="#555">level++;  size = queue.size();  sum = 0;</text>
    <text x="54" y="188" font-family="monospace" font-size="10" fill="#446688">for (int i = 0; i &lt; size; ++i) {</text>
    <text x="70" y="204" font-family="monospace" font-size="10" fill="#b85450">node = queue.front(); queue.pop();</text>
    <text x="70" y="220" font-family="monospace" font-size="10" fill="#b85450">sum += node-&gt;val;          // 只累加，不收集列表</text>
    <text x="70" y="236" font-family="monospace" font-size="10" fill="#4a7a3a">if (node-&gt;left)  queue.push(node-&gt;left);</text>
    <text x="70" y="252" font-family="monospace" font-size="10" fill="#4a7a3a">if (node-&gt;right) queue.push(node-&gt;right);</text>
    <text x="54" y="270" font-family="monospace" font-size="10" fill="#555">}  // end for：本层全部出队，sum 累加完毕</text>

    <path d="M 260 278 L 260 292" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: compare -->
    <rect x="40" y="296" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="316" font-size="12" fill="#d6a040" font-weight="bold">③ 滚动比较（严格 &gt;）</text>
    <text x="190" y="316" font-family="monospace" font-size="10" fill="#555">if (sum &gt; maxSum) { maxSum = sum; ans = level; }</text>
    <text x="54" y="334" font-size="9" fill="#888">用 &gt; 而非 &gt;=：平局不更新 → 天然保留更小层号</text>
    <text x="54" y="348" font-size="9" fill="#888">level 从 1 递增，相等时 ans 停留在更早（更小）的层</text>

    <path d="M 260 356 L 260 370" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4 -->
    <rect x="40" y="374" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="394" font-size="12" fill="#b85450" font-weight="bold">④ 返回</text>
    <text x="110" y="394" font-family="monospace" font-size="10" fill="#555">return ans;   // 和最大的最小层号</text>
  </g>
</svg>
