<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">合并规则：A op B → (r, cost)</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888">cost = 将结果 r 翻转所需的最少操作数</text>

  <!-- ===== AND section ===== -->
  <rect x="30" y="60" width="540" height="220" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.45"/>
  <text x="60" y="84" font-size="14" fill="#446688" font-weight="bold">op = '&amp;'（与）</text>
  <text x="200" y="84" font-size="10.5" fill="#666">吸收值 = 0（有 0 则 0）</text>

  <!-- case 1: both 1, result 1 -->
  <rect x="48" y="98" width="160" height="76" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="128" y="116" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">av=1, bv=1 → r=1</text>
  <text x="128" y="134" text-anchor="middle" font-size="10" fill="#666">翻转目标：1 → 0</text>
  <text x="128" y="152" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">cost = min(ac, bc)</text>
  <text x="128" y="168" text-anchor="middle" font-size="9.5" fill="#888">改任一 1 为 0 即可</text>

  <!-- case 2: one 0 one 1, result 0 -->
  <rect x="220" y="98" width="160" height="76" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">一 0 一 1 → r=0</text>
  <text x="300" y="134" text-anchor="middle" font-size="10" fill="#666">翻转目标：0 → 1</text>
  <text x="300" y="152" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">cost = 1</text>
  <text x="300" y="168" text-anchor="middle" font-size="9.5" fill="#888">改 &amp;→| 即得 0|1=1</text>

  <!-- case 3: both 0, result 0 -->
  <rect x="392" y="98" width="160" height="76" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="472" y="116" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">av=0, bv=0 → r=0</text>
  <text x="472" y="134" text-anchor="middle" font-size="10" fill="#666">翻转目标：0 → 1</text>
  <text x="472" y="152" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">min(ac+bc, ac+1, bc+1)</text>
  <text x="472" y="168" text-anchor="middle" font-size="9.5" fill="#888">两 0 都改 / 改一 0+改&amp;</text>

  <!-- AND summary -->
  <rect x="48" y="186" width="504" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="208" text-anchor="middle" font-size="11" fill="#a87020">r=1（两 1）→ min(ac,bc) ；r=0 且仅一 0 → 1 ；r=0 且两 0 → min(ac+bc, ac+1, bc+1)</text>

  <text x="48" y="244" font-size="9.5" fill="#aaa">直觉：&amp; 欲得 1 须两 1，改一个 1→0 翻为 0 很便宜；改两个 0→1 翻为 1 很贵</text>

  <!-- ===== OR section ===== -->
  <rect x="30" y="260" width="540" height="220" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.4"/>
  <text x="60" y="284" font-size="14" fill="#b85450" font-weight="bold">op = '|'（或）</text>
  <text x="180" y="284" font-size="10.5" fill="#666">吸收值 = 1（有 1 则 1）</text>

  <!-- case 1: both 0, result 0 -->
  <rect x="48" y="298" width="160" height="76" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="128" y="316" text-anchor="middle" font-size="11" fill="#854" font-weight="bold">av=0, bv=0 → r=0</text>
  <text x="128" y="334" text-anchor="middle" font-size="10" fill="#666">翻转目标：0 → 1</text>
  <text x="128" y="352" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">cost = min(ac, bc)</text>
  <text x="128" y="368" text-anchor="middle" font-size="9.5" fill="#888">改任一 0 为 1 即可</text>

  <!-- case 2: one 1 one 0, result 1 -->
  <rect x="220" y="298" width="160" height="76" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="11" fill="#854" font-weight="bold">一 1 一 0 → r=1</text>
  <text x="300" y="334" text-anchor="middle" font-size="10" fill="#666">翻转目标：1 → 0</text>
  <text x="300" y="352" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">cost = 1</text>
  <text x="300" y="368" text-anchor="middle" font-size="9.5" fill="#888">改 |→&amp; 即得 1&amp;0=0</text>

  <!-- case 3: both 1, result 1 -->
  <rect x="392" y="298" width="160" height="76" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="472" y="316" text-anchor="middle" font-size="11" fill="#854" font-weight="bold">av=1, bv=1 → r=1</text>
  <text x="472" y="334" text-anchor="middle" font-size="10" fill="#666">翻转目标：1 → 0</text>
  <text x="472" y="352" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">min(ac+bc, ac+1, bc+1)</text>
  <text x="472" y="368" text-anchor="middle" font-size="9.5" fill="#888">两 1 都改 / 改一 1+改|</text>

  <!-- OR summary -->
  <rect x="48" y="386" width="504" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="408" text-anchor="middle" font-size="11" fill="#a87020">r=0（两 0）→ min(ac,bc) ；r=1 且仅一 1 → 1 ；r=1 且两 1 → min(ac+bc, ac+1, bc+1)</text>

  <text x="48" y="444" font-size="9.5" fill="#aaa">对称性：| 与 &amp; 互换 0/1 即得相同结构——吸收值翻为非吸收需「全改」，非吸收翻为吸收只需「改一个」</text>

  <!-- bottom symmetry note -->
  <rect x="100" y="460" width="400" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="482" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold">对称记忆法</text>
  <text x="300" y="500" text-anchor="middle" font-size="10.5" fill="#555">&amp; 的「两 1」等价于 | 的「两 0」→ min(ac, bc)</text>
  <text x="300" y="514" text-anchor="middle" font-size="10.5" fill="#555">&amp; 的「两 0」等价于 | 的「两 1」→ min(ac+bc, ac+1, bc+1)</text>
</svg>
