<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟遍历 + 双状态变量 + 早停</text>

  <!-- Start -->
  <rect x="180" y="44" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="18" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 absent=0, late=0</text>

  <!-- arrow down -->
  <path d="M 270 84 L 270 108" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <polygon points="270,112 380,162 270,212 160,162" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">还有字符 c ?</text>
  <text x="270" y="176" text-anchor="middle" font-size="10" fill="#888">遍历 s</text>

  <!-- No branch (right) -> final check -->
  <path d="M 380 162 L 470 162 L 470 250" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="408" y="154" font-size="12" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Yes branch (down) -->
  <path d="M 270 212 L 270 240" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="230" font-size="12" fill="#555" font-weight="bold">是</text>

  <!-- Three-way dispatch box -->
  <rect x="120" y="244" width="300" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">按字符 c 分派</text>
  <text x="148" y="284" font-size="10" fill="#b85450" font-weight="bold">c=='A': absent++; late=0</text>
  <text x="300" y="284" font-size="10" fill="#d6a040" font-weight="bold">c=='L': late++</text>
  <text x="148" y="296" font-size="10" fill="#4a7a3a" font-weight="bold">c=='P': late=0</text>

  <!-- arrow down to early-stop checks -->
  <path d="M 270 300 L 270 324" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Early stop diamond -->
  <polygon points="270,328 390,378 270,428 150,378" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">absent≥2 或 late≥3 ?</text>
  <text x="270" y="390" text-anchor="middle" font-size="10" fill="#888">任一触发即早停</text>

  <!-- Yes (left) -> return false -->
  <path d="M 150 378 L 70 378" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="100" y="370" font-size="12" fill="#b85450" font-weight="bold">是</text>
  <rect x="20" y="386" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="70" y="409" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>

  <!-- No (right) -> loop back -->
  <path d="M 390 378 L 460 378 L 460 162 L 380 162" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="412" y="370" font-size="12" fill="#555" font-weight="bold">否</text>
  <text x="468" y="276" font-size="10" fill="#888">回循环</text>

  <!-- Final check (right side, from loop No branch) -->
  <rect x="395" y="254" width="150" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="470" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">遍历结束</text>
  <text x="470" y="292" text-anchor="middle" font-size="10" fill="#666">返回 absent &lt; 2</text>
  <text x="470" y="306" text-anchor="middle" font-size="10" fill="#888">（late&lt;3 已在循环内保证）</text>
</svg>
