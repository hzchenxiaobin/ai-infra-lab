<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">LCP 矩阵 = 任意两后缀的最长公共前缀长度</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">lcp[i][j] = 后缀 word[i..] 与 word[j..] 的公共前缀长度</text>

  <!-- Word row: a b a b, indices 0..3 -->
  <text x="40" y="80" font-size="11" fill="#666">word</text>
  <rect x="170" y="58" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="206" y="58" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="242" y="58" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="278" y="58" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <!-- indices -->
  <text x="187" y="106" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="223" y="106" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="259" y="106" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="295" y="106" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- Suffix @0 = abab -->
  <text x="36" y="148" font-size="11" fill="#666">后缀 @0 =</text>
  <rect x="150" y="132" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="151" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="184" y="132" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="151" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="218" y="132" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="151" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="252" y="132" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="151" text-anchor="middle" font-size="13" fill="#333">b</text>

  <!-- Suffix @2 = ab -->
  <text x="36" y="192" font-size="11" fill="#666">后缀 @2 =</text>
  <rect x="150" y="176" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="184" y="176" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <!-- Brace + label for common prefix -->
  <path d="M150 168 L150 162 Q150 158 165 158 L199 158 Q214 158 214 162 L214 168" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M199 162 L240 162" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="166" font-size="11" fill="#d6a040" font-weight="bold">公共前缀 "ab" = 长度 2</text>
  <text x="300" y="180" font-size="11" fill="#555">→ lcp[0][2] = 2</text>

  <!-- Note box 1: equality -->
  <rect x="40" y="226" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">首字符相同 ⟺ 公共前缀 ≥ 1</text>
  <text x="260" y="260" text-anchor="middle" font-size="10.5" fill="#555">lcp[i][j] ≥ 1 ⟺ word[i] = word[j] ； lcp[i][j] = 0 ⟺ word[i] ≠ word[j]</text>

  <!-- Note box 2: diagonal -->
  <rect x="40" y="276" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">对角线 = 整后缀与自身</text>
  <text x="260" y="310" text-anchor="middle" font-size="10.5" fill="#555">lcp[i][i] = n − i ；示例 3 中 lcp[3][3]=3 ≠ 1 即在此处穿帮</text>

  <!-- Footer -->
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#aaa">LCP 还满足递推 f[i][j] = (word[i]==word[j]) ? f[i+1][j+1]+1 : 0</text>
</svg>
