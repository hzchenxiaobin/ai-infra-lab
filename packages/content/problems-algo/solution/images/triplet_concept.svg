<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：维护 first 与 second 两个阈值</text>

  <!-- Section 1: two variables -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">① 两个变量记录「最小的递增对」</text>

  <!-- first box -->
  <rect x="60" y="78" width="90" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="98" text-anchor="middle" font-size="10" fill="#888">first</text>
  <text x="105" y="116" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">最小值</text>

  <!-- arrow -->
  <text x="165" y="105" font-size="11" fill="#888">&lt;</text>

  <!-- second box -->
  <rect x="180" y="78" width="90" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="225" y="98" text-anchor="middle" font-size="10" fill="#888">second</text>
  <text x="225" y="116" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">次小值</text>

  <text x="285" y="100" font-size="10.5" fill="#555">first &lt; second</text>
  <text x="285" y="116" font-size="10.5" fill="#555">且 first 在 second 之前出现</text>

  <!-- divider -->
  <path d="M 40 140 L 500 140" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 2: three branches -->
  <text x="40" y="168" font-size="12" fill="#446688" font-weight="bold">② 遍历每个 x，分三种情况</text>

  <!-- Case 1: x <= first -->
  <rect x="40" y="184" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x ≤ first</text>
  <text x="110" y="224" text-anchor="middle" font-size="10.5" fill="#446688">first = x</text>
  <text x="110" y="236" text-anchor="middle" font-size="9.5" fill="#888">更新最小值</text>

  <!-- Case 2: first < x <= second -->
  <rect x="200" y="184" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">first &lt; x ≤ second</text>
  <text x="270" y="224" text-anchor="middle" font-size="10.5" fill="#d6a040">second = x</text>
  <text x="270" y="236" text-anchor="middle" font-size="9.5" fill="#888">更新次小值</text>

  <!-- Case 3: x > second -->
  <rect x="360" y="184" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x &gt; second</text>
  <text x="430" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true ✓</text>
  <text x="430" y="236" text-anchor="middle" font-size="9.5" fill="#888">找到三元组！</text>

  <!-- divider -->
  <path d="M 40 254 L 500 254" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 3: key insight -->
  <text x="40" y="282" font-size="12" fill="#b85450" font-weight="bold">③ 关键：更新 first 不影响 second 的合法性</text>

  <!-- timeline -->
  <text x="40" y="308" font-size="10.5" fill="#888">数组：</text>

  <!-- old first -->
  <rect x="90" y="296" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="317" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <text x="112" y="342" text-anchor="middle" font-size="9" fill="#446688">旧 first</text>

  <!-- second -->
  <rect x="170" y="296" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="317" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">b</text>
  <text x="192" y="342" text-anchor="middle" font-size="9" fill="#d6a040">second</text>

  <!-- new first (after second) -->
  <rect x="250" y="296" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="317" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c</text>
  <text x="272" y="342" text-anchor="middle" font-size="9" fill="#b85450">新 first</text>

  <!-- x found -->
  <rect x="360" y="296" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="317" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">d</text>
  <text x="382" y="342" text-anchor="middle" font-size="9" fill="#4a7a3a">x &gt; second</text>

  <!-- arrow from old first to second -->
  <path d="M 134 312 L 170 312" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- insight box -->
  <rect x="40" y="362" width="460" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c 更小 → first 更新为 c，但 second 仍指向 b</text>
  <text x="270" y="400" text-anchor="middle" font-size="10.5" fill="#555">找到 d &gt; second(b) 时，三元组 (a, b, d) 仍合法：a 在 b 前，b 在 d 前</text>
</svg>
