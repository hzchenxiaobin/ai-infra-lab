<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 540"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="470" height="540" fill="#fafafa"/>

  <text x="235" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：遍历 + 谓词判定 + 收集</text>

  <!-- 开始 -->
  <ellipse cx="200" cy="58" rx="36" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <!-- res = [] -->
  <rect x="150" y="92" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res = []</text>

  <!-- i = 0 -->
  <rect x="160" y="142" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0</text>

  <!-- diamond1: i < arr.length? -->
  <polygon points="200,190 252,222 200,254 148,222" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; arr.length?</text>

  <!-- val = fn(arr[i], i) -->
  <rect x="120" y="282" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="303" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">val = fn(arr[i], i)</text>

  <!-- diamond2: val 真值? -->
  <polygon points="200,338 255,370 200,402 145,370" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">val 真值?</text>

  <!-- res.push(arr[i]) -->
  <rect x="46" y="430" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="111" y="451" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res.push(arr[i])</text>

  <!-- 跳过 -->
  <rect x="290" y="430" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="451" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">跳过</text>

  <!-- i++ -->
  <rect x="160" y="492" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="512" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++</text>

  <!-- return res -->
  <rect x="356" y="206" width="104" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return res</text>

  <!-- arrows -->
  <path d="M200,75 L200,92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M200,122 L200,142" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M200,172 L200,190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond1 Yes down -->
  <path d="M200,254 L200,282" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="272" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond1 No right to return res -->
  <path d="M252,222 L356,222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="216" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- val -> diamond2 -->
  <path d="M200,314 L200,338" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond2 Yes -> push -->
  <path d="M145,370 L111,430" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="392" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond2 No -> skip -->
  <path d="M255,370 L335,430" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="392" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- push -> i++ -->
  <path d="M111,462 L165,492" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- skip -> i++ -->
  <path d="M335,462 L235,492" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back: i++ -> diamond1 left -->
  <path d="M160,507 L30,507 L30,222 L148,222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="370" font-size="11" fill="#446688" filter="url(#rough2)">循环</text>
</svg>
