<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：仅 {0,1,2} 完全</text>

  <!-- ===== LEFT: graph ===== -->
  <!-- triangle 0-1-2 (green = complete) -->
  <line x1="100" y1="92" x2="66" y2="150" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="70" y1="156" x2="130" y2="156" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="134" y1="150" x2="100" y2="92" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 3-4, 3-5 solid red; 4-5 missing (gray dashed) -->
  <line x1="100" y1="240" x2="66" y2="298" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="100" y1="240" x2="134" y2="298" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 70 304 L 130 304" stroke="#ccc" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="100" y="328" text-anchor="middle" font-size="9.5" fill="#b85450">缺 4−5</text>

  <!-- triangle nodes -->
  <circle cx="100" cy="86" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">0</text>
  <circle cx="62" cy="160" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <circle cx="138" cy="160" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2</text>

  <!-- square nodes -->
  <circle cx="100" cy="234" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">3</text>
  <circle cx="62" cy="308" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
  <circle cx="138" cy="308" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">5</text>

  <text x="100" y="358" text-anchor="middle" font-size="10.5" fill="#888">分量 {0,1,2} ✓ · 分量 {3,4,5} ✗</text>

  <!-- divider -->
  <line x1="220" y1="60" x2="220" y2="380" stroke="#ddd" stroke-width="1.4" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== RIGHT: stats table ===== -->
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">按根分组统计</text>

  <!-- header -->
  <rect x="245" y="74" width="310" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">分量</text>
  <text x="365" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">m (节点)</text>
  <text x="445" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e (边)</text>
  <text x="515" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判定</text>

  <!-- row 1: {0,1,2} -->
  <rect x="245" y="108" width="310" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="127" text-anchor="middle" font-size="11" fill="#2e6e2e">{0,1,2}</text>
  <text x="365" y="127" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="445" y="127" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="515" y="127" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">✓ 3=3·2/2</text>

  <!-- row 2: {3,4,5} -->
  <rect x="245" y="142" width="310" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="161" text-anchor="middle" font-size="11" fill="#b85450">{3,4,5}</text>
  <text x="365" y="161" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="445" y="161" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="515" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 2≠3</text>

  <!-- result -->
  <rect x="245" y="190" width="310" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="208" text-anchor="middle" font-size="11" fill="#444">完全连通分量数</text>
  <text x="400" y="226" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = 1</text>

  <!-- explanation -->
  <rect x="245" y="250" width="310" height="100" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="258" y="270" font-size="10.5" fill="#555" font-weight="bold">关键：</text>
  <text x="258" y="286" font-size="10" fill="#666">• {0,1,2} 三条边齐全 → 完全</text>
  <text x="258" y="302" font-size="10" fill="#666">• {3,4,5} 仅 3−4、3−5 两条边</text>
  <text x="258" y="318" font-size="10" fill="#666">　4 与 5 之间无边 → 不完全</text>
  <text x="258" y="338" font-size="10" fill="#4a7a3a">e=2 &lt; C(3,2)=3 → 不计入 ans</text>

  <text x="280" y="428" text-anchor="middle" font-size="9.5" fill="#aaa">n=6 · edges=[[0,1],[0,2],[1,2],[3,4],[3,5]]</text>
</svg>
