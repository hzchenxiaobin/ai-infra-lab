<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">余数互补配对：(t_i + t_j) % 60 == 0  ⇔  r_j == (60 − r_i) % 60</text>

  <!-- time row -->
  <text x="40" y="70" font-size="12" fill="#888">time:</text>
  <rect x="100" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="75" text-anchor="middle" font-size="12" fill="#333">30</text>
  <rect x="160" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="75" text-anchor="middle" font-size="12" fill="#333">20</text>
  <rect x="220" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="75" text-anchor="middle" font-size="12" fill="#333">150</text>
  <rect x="280" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="75" text-anchor="middle" font-size="12" fill="#333">100</text>
  <rect x="340" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="75" text-anchor="middle" font-size="12" fill="#333">40</text>

  <text x="128" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="188" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="248" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="308" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="368" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>

  <!-- r = t % 60 row -->
  <text x="40" y="146" font-size="12" fill="#888">r=t%60:</text>
  <rect x="100" y="130" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="151" text-anchor="middle" font-size="12" fill="#333">30</text>
  <rect x="160" y="130" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="151" text-anchor="middle" font-size="12" fill="#333">20</text>
  <rect x="220" y="130" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="151" text-anchor="middle" font-size="12" fill="#333">30</text>
  <rect x="280" y="130" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="151" text-anchor="middle" font-size="12" fill="#333">40</text>
  <rect x="340" y="130" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="151" text-anchor="middle" font-size="12" fill="#333">40</text>

  <!-- arrows from time to r -->
  <path d="M128 88 L128 128" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M188 88 L188 128" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M248 88 L248 128" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M308 88 L308 128" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M368 88 L368 128" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- complement row -->
  <text x="34" y="220" font-size="12" fill="#888">(60−r)%60:</text>
  <rect x="100" y="204" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="225" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">30</text>
  <rect x="160" y="204" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="225" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">40</text>
  <rect x="220" y="204" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="225" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">30</text>
  <rect x="280" y="204" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="225" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">20</text>
  <rect x="340" y="204" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="225" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">20</text>

  <!-- arrows r -> comp -->
  <path d="M128 164 L128 202" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M188 164 L188 202" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M248 164 L248 202" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M308 164 L308 202" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M368 164 L368 202" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pairing arcs: r=30 pairs with another r=30 (i0 & i2) -->
  <path d="M128 240 Q 188 268 248 240" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="188" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">30 + 30 = 60 ✓ (自配对)</text>

  <!-- r=20 pairs with r=40 (i1 & i3, i1 & i4) -->
  <path d="M188 240 Q 248 290 308 240" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="248" y="284" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20 + 40 = 60 ✓</text>
  <path d="M188 240 Q 278 312 368 240" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="278" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20 + 40 = 60 ✓</text>

  <!-- equation box -->
  <rect x="40" y="332" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#333">(t_i + t_j) % 60 == 0  ⇔  (r_i + r_j) % 60 == 0</text>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⇔  r_j == (60 − r_i) % 60   （r=0 与 r=30 自配对）</text>
</svg>
