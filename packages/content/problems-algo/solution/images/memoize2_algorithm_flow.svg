<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)" font-weight="bold">memoized(...args) 调用流程</text>

  <!-- 入口 -->
  <rect x="190" y="46" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">接收 ...args，node = root</text>

  <path d="M 270 80 L 270 94" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 下钻循环 -->
  <rect x="120" y="98" width="300" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for arg of args：逐层下钻 Map</text>

  <path d="M 270 138 L 270 152" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体两步 -->
  <rect x="80" y="156" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 无 arg 键 → set(arg, new Map)</text>

  <rect x="280" y="156" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② node = node.get(arg)</text>

  <path d="M 170 190 C 170 210, 270 210, 270 218" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 190 C 370 210, 270 210, 270 218" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定：叶子是否有哨兵 -->
  <polygon points="270,222 360,258 270,294 180,258" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">叶子 has(RESULT)?</text>

  <!-- 命中分支（左） -->
  <path d="M 180 258 C 150 258, 120 258, 110 270" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">是</text>
  <rect x="40" y="274" width="130" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return node.get(RESULT)</text>
  <text x="105" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 命中，不调用 fn</text>

  <!-- 未命中分支（右） -->
  <path d="M 360 258 C 390 258, 420 258, 430 270" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="250" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">否</text>
  <rect x="370" y="274" width="130" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="435" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">value = fn(...args)</text>
  <text x="435" y="305" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">node.set(RESULT, value)</text>

  <path d="M 435 310 L 435 326" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="370" y="330" width="130" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="435" y="352" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return value</text>

  <!-- 不变式说明 -->
  <rect x="40" y="346" width="220" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough)"/>
  <text x="56" y="366" font-size="11" fill="#333" filter="url(#rough)">💡 不变式：能下钻到同一叶子</text>
  <text x="56" y="380" font-size="11" fill="#333" filter="url(#rough)">　 ⟺ 参数序列逐位 ===（Map 键保证）</text>
</svg>
