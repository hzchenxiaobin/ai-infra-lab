<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：枚举部分数 b，命中即切分</text>

  <!-- 1. init -->
  <g filter="url(#rough2)">
    <rect x="170" y="46" width="180" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="70" text-anchor="middle" font-size="13" fill="#3a5a2a">b = 1,  Lb = 1,  digitSum = 0</text>
  </g>
  <path d="M260,84 L260,102" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>

  <!-- 2. advance b & digits -->
  <g filter="url(#rough2)">
    <rect x="120" y="102" width="280" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="126" text-anchor="middle" font-size="12" fill="#334455">b += 1；若 b ≥ 10^Lb 则 Lb += 1</text>
  </g>
  <path d="M260,140 L260,158" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>

  <!-- 3. feasibility diamond -->
  <g filter="url(#rough2)">
    <path d="M260,158 L356,184 L260,210 L164,184 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
    <text x="260" y="189" text-anchor="middle" font-size="12" fill="#b85450">limit − 3 − 2·Lb ≥ 1 ?</text>
  </g>
  <!-- No: left to return [] -->
  <path d="M164,184 L142,184" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>
  <text x="154" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="20" y="166" width="122" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="81" y="189" text-anchor="middle" font-size="12" fill="#b85450">返回 []</text>
  </g>
  <!-- Yes: down -->
  <path d="M260,210 L260,228" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>
  <text x="272" y="224" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 4. formula -->
  <g filter="url(#rough2)">
    <rect x="36" y="228" width="448" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="257" text-anchor="middle" font-size="12" fill="#7a4a10">digitSum += Lb；totalCap = b·(limit − 3 − Lb) − digitSum</text>
  </g>
  <path d="M260,276 L260,294" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>

  <!-- 5. totalCap diamond -->
  <g filter="url(#rough2)">
    <path d="M260,294 L352,320 L260,346 L168,320 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
    <text x="260" y="325" text-anchor="middle" font-size="12" fill="#b85450">totalCap ≥ n ?</text>
  </g>
  <!-- No: right to b+=1, loop back up to step 2 right edge (400,121) -->
  <path d="M352,320 L384,320" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>
  <text x="362" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="384" y="304" width="84" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="426" y="325" text-anchor="middle" font-size="13" fill="#3a5a2a">回步 2</text>
  </g>
  <path d="M468,320 L492,320 L492,121 L402,121" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>
  <!-- Yes: down -->
  <path d="M260,346 L260,364" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr_grey)" filter="url(#rough2)"/>
  <text x="272" y="360" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 6. split & return -->
  <g filter="url(#rough2)">
    <rect x="80" y="364" width="360" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <text x="260" y="392" text-anchor="middle" font-size="13" fill="#3a5a2a">按 cap_i 取内容 + 拼 &quot;&lt;i/b&gt;&quot;，返回</text>
  </g>
</svg>
