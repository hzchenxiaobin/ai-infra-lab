<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">博弈型区间 DP：先手净赚 = 当前取值 − 对手在剩余区间的净赚</text>

  <!-- nums row [1,5,2] -->
  <text x="40" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="170" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="78" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="220" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="78" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="270" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="78" text-anchor="middle" font-size="13" fill="#333">2</text>

  <!-- index labels -->
  <text x="195" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i</text>
  <text x="295" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j</text>

  <!-- bracket over whole interval -->
  <path d="M 170 50 Q 170 42 178 42 L 312 42 Q 320 42 320 50" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="245" y="36" text-anchor="middle" font-size="11" fill="#446688">区间 [i, j]</text>

  <!-- two branch arrows -->
  <path d="M 195 110 Q 130 130 110 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 295 110 Q 250 130 230 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- left branch box: 拿左 -->
  <rect x="30" y="150" width="180" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">拿左端 nums[i]</text>
  <text x="120" y="194" text-anchor="middle" font-size="11" fill="#444">剩 [i+1, j] 轮到对手先手</text>
  <text x="120" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">净赚 = nums[i] − dp[i+1][j]</text>

  <!-- right branch box: 拿右 -->
  <rect x="230" y="150" width="180" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">拿右端 nums[j]</text>
  <text x="320" y="194" text-anchor="middle" font-size="11" fill="#444">剩 [i, j−1] 轮到对手先手</text>
  <text x="320" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">净赚 = nums[j] − dp[i][j−1]</text>

  <!-- merge arrows down to equation -->
  <path d="M 120 236 Q 120 252 175 260" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 320 236 Q 320 252 265 260" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="220" y="256" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">先手取较大</text>

  <!-- equation box -->
  <rect x="30" y="270" width="290" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="175" y="290" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[i][j] = max( nums[i] − dp[i+1][j] ,</text>
  <text x="200" y="308" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">nums[j] − dp[i][j−1] )</text>

  <!-- answer condition callout (right side) -->
  <rect x="340" y="270" width="160" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="420" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案：dp[0][n−1] ≥ 0</text>
  <text x="420" y="308" text-anchor="middle" font-size="10" fill="#888">平局也算玩家1赢</text>

  <!-- bottom note: difference from 877 -->
  <rect x="30" y="330" width="470" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="265" y="345" text-anchor="middle" font-size="10.5" fill="#444">与 877 不同：本题允许奇数长度、允许平局，故 877 的「先手必胜」数学结论失效，必须老老实实写区间 DP</text>
</svg>
