<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 主油箱 -->
  <rect x="60" y="90" width="140" height="170" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <rect x="60" y="150" width="140" height="110" fill="#cfe0fb"
        stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="80" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">主油箱 mainTank</text>
  <text x="130" y="210" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">main</text>

  <!-- 副油箱 -->
  <rect x="320" y="120" width="120" height="140" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <rect x="320" y="170" width="120" height="90" fill="#ffe9a8"
        stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="110" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">副油箱 additionalTank</text>
  <text x="380" y="225" text-anchor="middle" font-size="20" fill="#d6a040" filter="url(#rough2)">add</text>

  <!-- 用 5 升 触发标记 -->
  <rect x="100" y="285" width="110" height="40" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="309" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">每用掉 5 升</text>

  <!-- 转移箭头：副 → 主 -->
  <path d="M315,165 C250,120 210,120 205,150"
        fill="none" stroke="#4a7a3a" stroke-width="2.5"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="265" y="115" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">转移 1 升 (若 add≥1)</text>

  <!-- 行驶标识 -->
  <text x="155" y="345" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每升行驶 10 km</text>
</svg>
