<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：6 条提交 → 2 个计数</text>

  <!-- 6 date cards -->
  <rect x="40" y="40" width="70" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">06-13</text>
  <text x="75" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">周一</text>
  <text x="75" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">工作日</text>

  <rect x="118" y="40" width="70" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">06-14</text>
  <text x="153" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">周二</text>
  <text x="153" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">工作日</text>

  <rect x="196" y="40" width="70" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="231" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">06-15</text>
  <text x="231" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">周三</text>
  <text x="231" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">工作日</text>

  <rect x="274" y="40" width="70" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="309" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">06-18</text>
  <text x="309" y="76" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">周六</text>
  <text x="309" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">周末</text>

  <rect x="352" y="40" width="70" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">06-19</text>
  <text x="387" y="76" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">周日</text>
  <text x="387" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">周末</text>

  <rect x="430" y="40" width="70" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">06-19</text>
  <text x="465" y="76" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">周日</text>
  <text x="465" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">周末</text>

  <!-- brackets -->
  <path d="M 40 116 L 40 124 L 266 124 L 266 116" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 274 116 L 274 124 L 500 124 L 500 116" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- arrows down -->
  <path d="M 153 124 L 153 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 387 124 L 387 150" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- working count box -->
  <rect x="43" y="152" width="220" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="153" y="174" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">working_days_tasks</text>
  <text x="153" y="200" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- weekend count box -->
  <rect x="277" y="152" width="220" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="387" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">weekend_tasks</text>
  <text x="387" y="200" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- output row -->
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">输出（单行两列）</text>
  <rect x="120" y="250" width="300" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="268" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">weekend_tasks</text>
  <text x="195" y="288" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="345" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">working_days_tasks</text>
  <text x="345" y="288" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- notes -->
  <text x="270" y="324" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">周末 3 条（06-18、06-19×2）+ 工作日 3 条（06-13 / 06-14 / 06-15）</text>
  <text x="270" y="340" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">SUM(布尔)：真记 1、假记 0，求和恰好数出命中条数</text>
</svg>
