<svg xmlns="http://www.w3.org/0/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：n=3, sums=[−3,−2,−1,0,0,1,2,3]</text>
  <text x="300" y="36" text-anchor="middle" font-size="10.5" fill="#888">绿格 = 保留进入下一层；灰格 = 被配对消去；弧 = (s, s+d) 配对</text>

  <!-- ===== Level 1 ===== -->
  <text x="20" y="58" font-size="11" fill="#446688" font-weight="bold">第1层 n=3</text>
  <text x="20" y="74" font-size="10.5" fill="#888">d=1, 取 x=+1, 保留小</text>
  <!-- 8 cells centers 55,115,175,235,295,355,415,475 ; y=58 top, h=40 -->
  <!-- kept (green): 55,175,295,415 -> -3,-1,0,2 ; discarded (grey): 115,235,355,475 -> -2,0,1,3 -->
  <rect x="33" y="58" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="55" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−3</text>
  <rect x="93" y="58" width="44" height="40" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="115" y="84" text-anchor="middle" font-size="13" fill="#888">−2</text>
  <rect x="153" y="58" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="175" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <rect x="213" y="58" width="44" height="40" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="235" y="84" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="273" y="58" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="295" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="333" y="58" width="44" height="40" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="355" y="84" text-anchor="middle" font-size="13" fill="#888">1</text>
  <rect x="393" y="58" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="415" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="453" y="58" width="44" height="40" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="475" y="84" text-anchor="middle" font-size="13" fill="#888">3</text>

  <!-- pairing arcs below cells (y=98 -> peak ~120) -->
  <path d="M 55 98 Q 85 122 115 98" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 175 98 Q 205 122 235 98" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 295 98 Q 325 122 355 98" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 415 98 Q 445 122 475 98" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="84" font-size="11" fill="#4a7a3a" font-weight="bold">L=[−3,−1,0,2]</text>

  <path d="M 300 130 L 300 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level 2 ===== -->
  <text x="20" y="170" font-size="11" fill="#446688" font-weight="bold">第2层 n=2</text>
  <text x="20" y="186" font-size="10.5" fill="#888">d=2, 取 x=+2, 保留小</text>
  <!-- 4 cells centers 55,175,295,415 -> -3,-1,0,2 ; kept: 55(-3),295(0) -->
  <rect x="33" y="170" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="55" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−3</text>
  <rect x="153" y="170" width="44" height="40" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="175" y="196" text-anchor="middle" font-size="13" fill="#888">−1</text>
  <rect x="273" y="170" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="295" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="393" y="170" width="44" height="40" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="415" y="196" text-anchor="middle" font-size="13" fill="#888">2</text>
  <!-- arcs: (55,175) and (295,415) -->
  <path d="M 55 210 Q 115 236 175 210" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+2</text>
  <path d="M 295 210 Q 355 236 415 210" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+2</text>
  <text x="540" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">L=[−3,0]</text>

  <path d="M 300 244 L 300 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level 3 (base) ===== -->
  <text x="20" y="284" font-size="11" fill="#446688" font-weight="bold">第3层 n=1</text>
  <text x="20" y="300" font-size="10.5" fill="#888">基准：含 0 → 取另一值</text>
  <rect x="253" y="278" width="44" height="40" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="275" y="304" text-anchor="middle" font-size="13" fill="#888">−3</text>
  <rect x="303" y="278" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="325" y="304" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="365" y="304" font-size="11" fill="#b85450" font-weight="bold">→ 元素 = −3</text>

  <path d="M 300 326 L 300 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="160" y="350" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="378" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = [ 1, 2, −3 ] ⭐</text>

  <!-- verify note -->
  <rect x="40" y="408" width="520" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="300" y="428" text-anchor="middle" font-size="11" fill="#555">验证：[1,2,−3] 的 8 个子集和 = {0,1,2,3,−3,−2,−1,0} = 输入 ✓</text>
  <text x="300" y="446" text-anchor="middle" font-size="11" fill="#555">每层 d = sums[1]−sums[0] 恰为最小 |元素|；保留集总含 0，故无需回溯即得解</text>
</svg>
