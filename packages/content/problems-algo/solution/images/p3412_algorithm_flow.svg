<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="436" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">一次遍历：查镜像栈 → 弹出计分 / 压入等待</text>

  <!-- Step 1 -->
  <rect x="70" y="40" width="380" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① st[0..25] 全部清空，ans = 0，i = 0</text>
  <path d="M260,72 L260,86" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="100" y="90" width="320" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② c = s[i] − 'a'，m = 25 − c（镜像下标）</text>
  <path d="M260,122 L260,138" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: decision diamond -->
  <polygon points="260,142 366,188 260,234 154,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">st[m] 非空？</text>

  <!-- no branch: push -->
  <text x="168" y="178" font-size="12" fill="#a06a20" filter="url(#rough2)">否</text>
  <path d="M154,188 L136,188" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="166" width="112" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="186" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">i 压入 st[c]</text>
  <text x="84" y="203" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">等未来的镜像</text>
  <text x="84" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">当前无镜像可配</text>
  <path d="M84,214 L84,250" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- yes branch: pop and score -->
  <text x="356" y="178" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M366,188 L384,188" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="386" y="166" width="106" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="186" text-anchor="middle" font-size="11" fill="#2d5523" filter="url(#rough2)">j = st[m] 弹出顶</text>
  <text x="439" y="203" text-anchor="middle" font-size="11" fill="#2d5523" filter="url(#rough2)">ans += i − j</text>
  <text x="439" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">栈顶 = 最近的未标记</text>
  <path d="M439,214 L439,250" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: advance -->
  <rect x="60" y="253" width="400" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ i++；i &lt; n 则回到 ②</text>
  <path d="M460,268 L496,268 L496,106 L426,106" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="494" y="260" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">i &lt; n</text>
  <path d="M260,283 L260,299" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="185" y="303" width="150" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">返回 ans</text>

  <!-- bottom notes -->
  <rect x="60" y="351" width="400" height="30" rx="8" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#7a4a2b" filter="url(#rough2)">每个下标恰好一次 push 或一次 pop：时间 O(n)，空间 O(n)</text>

  <rect x="60" y="390" width="400" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="409" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">⚠ 答案上界 ≈ n²/4 = 2.5×10⁹（n=10⁵），C++ 需 long long</text>
</svg>
