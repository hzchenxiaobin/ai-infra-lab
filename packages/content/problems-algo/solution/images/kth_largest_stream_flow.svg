<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数据流第 K 大：小根堆算法流程</text>

  <!-- ===== Init flow ===== -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">① 初始化 KthLargest(k, nums)</text>

  <rect x="150" y="68" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="88" text-anchor="middle" font-size="12" fill="#333">将 nums 全部 push 进小根堆</text>

  <path d="M 270 100 L 270 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,122 380,162 270,202 160,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="12" fill="#333">堆大小</text>
  <text x="270" y="172" text-anchor="middle" font-size="12" fill="#333">&gt; K ?</text>
  <text x="270" y="188" text-anchor="middle" font-size="10" fill="#888">(元素太多)</text>

  <!-- Yes: pop until size k -->
  <path d="M 380 162 L 430 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="154" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="412" y="146" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="462" y="168" text-anchor="middle" font-size="11" fill="#333">pop 堆顶</text>

  <!-- Loop back -->
  <path d="M 462 146 L 462 110 L 270 110 L 270 118" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="104" text-anchor="middle" font-size="10" fill="#888">循环弹至 size=K</text>

  <!-- No: init done -->
  <path d="M 270 202 L 270 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="216" font-size="11" fill="#b85450">否</text>
  <ellipse cx="270" cy="234" rx="70" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="11" fill="#333">初始化完成</text>

  <!-- Divider -->
  <path d="M 60 264 L 480 264" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Add flow ===== -->
  <text x="40" y="284" font-size="12" fill="#888" font-weight="bold">② add(val)</text>

  <ellipse cx="270" cy="304" rx="60" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#333">收到新元素 val</text>

  <path d="M 270 322 L 270 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: size < k? -->
  <polygon points="270,344 370,384 270,424 170,384" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="12" fill="#333">size &lt; K ?</text>
  <text x="270" y="394" text-anchor="middle" font-size="10" fill="#888">(还没满)</text>

  <!-- Yes: push val -->
  <path d="M 170 384 L 110 384" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="376" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="30" y="368" width="78" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="69" y="389" text-anchor="middle" font-size="11" fill="#333">push(val)</text>

  <!-- No: val > top? -->
  <path d="M 270 424 L 270 442" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="438" font-size="11" fill="#b85450">否</text>

  <polygon points="270,446 360,476 270,492 180,476" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="472" text-anchor="middle" font-size="11" fill="#333">val &gt; 堆顶?</text>
  <text x="270" y="486" text-anchor="middle" font-size="9" fill="#888">(比最小的大)</text>

  <!-- Yes: pop + push -->
  <path d="M 360 476 L 410 476" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="468" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="408" y="460" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="463" y="481" text-anchor="middle" font-size="11" fill="#333">pop + push(val)</text>

  <!-- No: ignore -->
  <path d="M 180 476 L 150 476" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="468" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="50" y="460" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="481" text-anchor="middle" font-size="11" fill="#333">直接丢弃 val</text>

  <!-- Return heap top (shared) -->
  <text x="270" y="498" text-anchor="middle" font-size="10" fill="#888">→ 三条路径都返回堆顶（第 K 大）</text>
</svg>
