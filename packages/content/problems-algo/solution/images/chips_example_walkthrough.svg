<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：奇偶计数 → 取较小者</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="50" font-size="11" fill="#446688" font-weight="bold">示例 1：position = [1, 2, 3]</text>

  <!-- chips row -->
  <text x="30" y="78" font-size="10" fill="#888">位置</text>
  <rect x="70" y="64" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="81" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="120" y="64" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="81" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="170" y="64" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="81" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- parity tags -->
  <text x="90" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">奇</text>
  <text x="140" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">偶</text>
  <text x="190" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">奇</text>

  <!-- counting result for example 1 -->
  <rect x="260" y="64" width="250" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" font-size="11" fill="#444">偶数位 even = 1</text>
  <text x="280" y="102" font-size="11" fill="#444">奇数位 odd = 2</text>
  <rect x="420" y="76" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="95" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min=1</text>

  <!-- reasoning for example 1 -->
  <rect x="40" y="118" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="11" fill="#444">偶数位仅 1 个 → 把它移到奇数位（代价 1），奇数位 2 个免费聚拢 → 总代价 1</text>

  <!-- separator -->
  <line x1="40" y1="166" x2="500" y2="166" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="190" font-size="11" fill="#b85450" font-weight="bold">示例 2：position = [2, 2, 2, 3, 3]</text>

  <!-- chips row -->
  <text x="30" y="218" font-size="10" fill="#888">位置</text>
  <rect x="60" y="204" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="221" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="98" y="204" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="221" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="136" y="204" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="221" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="174" y="204" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="221" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <rect x="212" y="204" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="221" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>

  <!-- parity tags -->
  <text x="77" y="244" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">偶</text>
  <text x="115" y="244" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">偶</text>
  <text x="153" y="244" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">偶</text>
  <text x="191" y="244" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">奇</text>
  <text x="229" y="244" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">奇</text>

  <!-- counting result for example 2 -->
  <rect x="290" y="204" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="224" font-size="11" fill="#444">偶数位 even = 3</text>
  <text x="310" y="242" font-size="11" fill="#444">奇数位 odd = 2</text>
  <rect x="440" y="216" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="235" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min=2</text>

  <!-- reasoning for example 2 -->
  <rect x="40" y="258" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="11" fill="#444">奇数位仅 2 个 → 把它们移到偶数位（代价 2×1=2），偶数位 3 个免费聚拢 → 总代价 2</text>

  <!-- arrow down to summary -->
  <path d="M 270 296 L 270 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Generalization note ===== -->
  <rect x="40" y="316" width="470" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="338" font-size="11" fill="#d6a040" font-weight="bold">为什么"聚拢"一定是免费的？</text>
  <text x="60" y="356" font-size="10" fill="#444">偶数 ↔ 偶数：差为偶数 = 若干次 ±2，每次代价 0 → 全程免费</text>
  <text x="60" y="372" font-size="10" fill="#444">奇数 ↔ 奇数：差为偶数 = 若干次 ±2，每次代价 0 → 全程免费</text>
  <text x="60" y="388" font-size="10" fill="#444">奇偶互换：差为奇数 = 一次 ±1（代价 1）+ 若干次 ±2（免费）→ 每个筹码恰好花 1</text>

  <!-- ===== Bottom summary table ===== -->
  <text x="40" y="416" font-size="11" fill="#555" font-weight="bold">两个示例对比：</text>

  <text x="80" y="438" text-anchor="middle" font-size="10" fill="#888">示例</text>
  <text x="200" y="438" text-anchor="middle" font-size="10" fill="#888">even</text>
  <text x="300" y="438" text-anchor="middle" font-size="10" fill="#888">odd</text>
  <text x="420" y="438" text-anchor="middle" font-size="10" fill="#888">min(even,odd)</text>
  <line x1="40" y1="444" x2="500" y2="444" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="80" y="462" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[1,2,3]</text>
  <text x="200" y="462" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="300" y="462" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="380" y="448" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="463" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="80" y="486" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[2,2,2,3,3]</text>
  <text x="200" y="486" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="300" y="486" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="380" y="472" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="487" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="270" y="512" text-anchor="middle" font-size="10" fill="#888">少数派跨奇偶，每个花 1 → 总代价 = min(even, odd)</text>
</svg>
