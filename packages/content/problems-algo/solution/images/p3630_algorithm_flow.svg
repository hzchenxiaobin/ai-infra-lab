<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举 B → 算 s → 掩码建线性基 → 贪心取 x → 打擂台</text>

  <rect x="28" y="46" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 预处理 andV / xorV</text>
  <text x="130" y="79" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">andV[m] = andV[m&amp;(m−1)] &amp; nums[lowbit]（xor 同理）</text>

  <rect x="28" y="108" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 枚举 B ⊆ {0..n−1}</text>
  <text x="130" y="141" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">共 2ⁿ = 524288 个子集（n ≤ 19，含空集）</text>

  <rect x="28" y="170" width="204" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="187" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ AND(B)、R、s = XOR(R)</text>
  <text x="130" y="203" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">B = ∅ 时 AND 记 0（andV[0] 是 −1，别直接用）</text>

  <rect x="28" y="232" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="249" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ vⱼ = nums[j] &amp; ~s（j ∈ R）</text>
  <text x="130" y="265" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">只保留 s 为 0 的位——能抢的分数都在这</text>

  <rect x="28" y="294" width="204" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="311" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 逐个插入线性基</text>
  <text x="130" y="327" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">高位被占就异或消位，消到 0 说明冗余</text>

  <rect x="288" y="294" width="204" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="311" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑥ 贪心取最大 x</text>
  <text x="390" y="327" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">从高位到低位，x ⊕ basis[b] &gt; x 就异或</text>

  <rect x="288" y="232" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="249" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑦ total = AND(B) + s + 2x</text>
  <text x="390" y="265" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">用 ans 打擂台</text>

  <rect x="288" y="170" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="187" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑧ B 轮询完 2ⁿ 个？</text>
  <text x="390" y="203" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">没完 → 回 ② 继续下一个子集</text>

  <rect x="288" y="108" width="204" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="125" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑨ 输出 ans</text>
  <text x="390" y="141" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">例 3：B = {2,3} → 2 + 1 + 2×6 = 15</text>

  <rect x="288" y="44" width="204" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="390" y="61" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 别被 andV[0] = −1 坑了</text>
  <text x="390" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">它是 &amp; 的幺元；题目规定空 AND = 0</text>

  <path d="M 130 88 L 130 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 150 L 130 166" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 212 L 130 228" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 274 L 130 290" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 236 315 L 284 315" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <path d="M 390 292 L 390 278" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 230 L 390 216" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 168 L 390 154" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个 B：O(n·30) 建基 + O(30) 贪心 → 总复杂度 O(2ⁿ · n · log V)</text>
</svg>
