<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">编码方案：桶号写成 (T+1) 进制，每位决定一只猪在第几轮喝</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">例：T=2 → base=3，2 只猪（A=高位, B=低位），可编码 3²=9 个桶</text>

  <!-- ===== 表头 ===== -->
  <g filter="url(#rough2)">
    <rect x="40"  y="62" width="60"  height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="100" y="62" width="110" height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="210" y="62" width="120" height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="330" y="62" width="120" height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="70"  y="81" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">桶号</text>
  <text x="155" y="81" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">三进制 (A,B)</text>
  <text x="270" y="81" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">A 喂养轮次</text>
  <text x="390" y="81" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">B 喂养轮次</text>

  <!-- ===== 数据行 ===== -->
  <!-- 行: 桶号 | (A,B) | A喂 | B喂 -->
  <!-- 0 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="92" width="60"  height="24" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="100" y="92" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="92" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="330" y="92" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <text x="70"  y="108" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="155" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(0,0)</text>
  <text x="270" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">不喂</text>
  <text x="390" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">不喂</text>

  <!-- 1 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="118" width="60"  height="24" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="100" y="118" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="118" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="330" y="118" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>
  <text x="70"  y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="155" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(0,1)</text>
  <text x="270" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a">不喂</text>
  <text x="390" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第1轮</text>

  <!-- 2 (highlight - poison example) -->
  <g filter="url(#rough2)">
    <rect x="40"  y="144" width="60"  height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="100" y="144" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="210" y="144" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="330" y="144" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
  </g>
  <text x="70"  y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="155" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(0,2)</text>
  <text x="270" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a">不喂</text>
  <text x="390" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第2轮</text>

  <!-- 3 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="170" width="60"  height="24" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="100" y="170" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="170" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="330" y="170" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <text x="70"  y="186" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="155" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(1,0)</text>
  <text x="270" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第1轮</text>
  <text x="390" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a">不喂</text>

  <!-- 4 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="196" width="60"  height="24" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="100" y="196" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="196" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="330" y="196" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>
  <text x="70"  y="212" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="155" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(1,1)</text>
  <text x="270" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第1轮</text>
  <text x="390" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第1轮</text>

  <!-- 5 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="222" width="60"  height="24" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="100" y="222" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="222" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="330" y="222" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>
  <text x="70"  y="238" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="155" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(1,2)</text>
  <text x="270" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第1轮</text>
  <text x="390" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第2轮</text>

  <!-- 6 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="248" width="60"  height="24" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="100" y="248" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="248" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="330" y="248" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <text x="70"  y="264" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="155" y="264" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(2,0)</text>
  <text x="270" y="264" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第2轮</text>
  <text x="390" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a">不喂</text>

  <!-- 7 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="274" width="60"  height="24" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="100" y="274" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="274" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="330" y="274" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>
  <text x="70"  y="290" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="155" y="290" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(2,1)</text>
  <text x="270" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第2轮</text>
  <text x="390" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第1轮</text>

  <!-- 8 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="300" width="60"  height="24" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="100" y="300" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="300" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="330" y="300" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>
  <text x="70"  y="316" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="155" y="316" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(2,2)</text>
  <text x="270" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第2轮</text>
  <text x="390" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第2轮</text>

  <!-- ===== 规则说明 ===== -->
  <rect x="40" y="338" width="520" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">规则：第 d 位 = k（k&gt;0）→ 该猪第 k 轮喝此桶；d = 0 → 该猪不喝此桶</text>

  <!-- ===== 解码示例：2 号桶有毒 ===== -->
  <text x="40" y="396" font-size="12" fill="#b85450" font-weight="bold">解码示例</text>
  <text x="100" y="396" font-size="11" fill="#666">假设 2 号桶有毒，看两只猪的结局如何锁定它</text>

  <!-- 箭头从 2 号行指向解码区 -->
  <path d="M 270 312 Q 280 340 280 372 L 280 408" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 解码三步 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="414" width="170" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <rect x="215" y="414" width="170" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="390" y="414" width="170" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <text x="125" y="436" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B 第2轮喝 → 死</text>
  <text x="125" y="454" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">A 不喝 → 活</text>
  <text x="300" y="436" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结局 = (A活, B第2轮死)</text>
  <text x="300" y="454" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">→ 编码 (0, 2)</text>
  <text x="475" y="436" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">三进制 02 = 2</text>
  <text x="475" y="454" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">→ 锁定 2 号桶 ✓</text>

  <!-- 步骤间箭头 -->
  <path d="M 210 442 L 215 442" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 385 442 L 390 442" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="300" y="500" text-anchor="middle" font-size="11" fill="#888">每只猪的结局拼成 (T+1) 进制数，即为有毒桶号——编码与解码天然互逆</text>
  <text x="300" y="518" text-anchor="middle" font-size="10" fill="#aaa">（实际只须把 buckets 个桶编号填入 (T+1)ⁿ 个编码中，多余编码闲置即可）</text>
</svg>
