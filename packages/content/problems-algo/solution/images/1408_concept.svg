<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按长度排序 → 短串只在更长的串中查找</text>

  <!-- 原数组 -->
  <text x="40" y="56" font-size="12" fill="#666" font-weight="bold">原数组</text>
  <g filter="url(#rough2)">
    <rect x="100" y="64" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="128" y="84" text-anchor="middle" font-size="12" fill="#333">mass</text>
    <rect x="156" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="176" y="84" text-anchor="middle" font-size="12" fill="#333">as</text>
    <rect x="196" y="64" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="224" y="84" text-anchor="middle" font-size="12" fill="#333">hero</text>
    <rect x="252" y="64" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="300" y="84" text-anchor="middle" font-size="12" fill="#333">superhero</text>
  </g>

  <!-- 排序箭头 -->
  <path d="M 226 98 L 226 118" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="112" font-size="11" fill="#446688" font-weight="bold">按长度升序排序</text>

  <!-- 排序后数组 -->
  <text x="40" y="136" font-size="12" fill="#666" font-weight="bold">排序后</text>
  <g filter="url(#rough2)">
    <rect x="100" y="144" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="120" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">as</text>
    <rect x="140" y="144" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="168" y="164" text-anchor="middle" font-size="12" fill="#333">mass</text>
    <rect x="196" y="144" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="224" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">hero</text>
    <rect x="252" y="144" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="300" y="164" text-anchor="middle" font-size="12" fill="#333">superhero</text>
  </g>
  <text x="370" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">绿色 = 待检查的短串</text>

  <!-- 关键洞察 -->
  <rect x="100" y="186" width="360" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="205" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键洞察：短串只需在更长的串中查找（等长不可能互含）</text>

  <!-- 检查 as → mass -->
  <g filter="url(#rough2)">
    <rect x="100" y="228" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="120" y="247" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">as</text>
  </g>
  <text x="150" y="247" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="168" y="247" font-size="13" fill="#333" filter="url(#rough2)">m<tspan fill="#4a7a3a" font-weight="bold">as</tspan>s</text>
  <text x="220" y="247" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 子串匹配</text>

  <!-- 检查 hero → superhero -->
  <g filter="url(#rough2)">
    <rect x="100" y="266" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="128" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">hero</text>
  </g>
  <text x="166" y="285" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="184" y="285" font-size="13" fill="#333" filter="url(#rough2)">super<tspan fill="#4a7a3a" font-weight="bold">hero</tspan></text>
  <text x="270" y="285" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 子串匹配</text>

  <!-- mass 未命中 -->
  <text x="100" y="318" font-size="11" fill="#999" filter="url(#rough2)">"mass" → 检查 hero, superhero → 未命中 ✗</text>

  <!-- 答案框 -->
  <rect x="100" y="336" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="359" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 ["as", "hero"]</text>

  <!-- 策略说明 -->
  <text x="330" y="346" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">策略</text>
  <text x="330" y="362" font-size="11" fill="#555" filter="url(#rough2)">短串 → 只查更长的串</text>
  <text x="330" y="378" font-size="11" fill="#555" filter="url(#rough2)">命中即记录，跳过该串</text>
</svg>
