<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：定位 p → 左建频次表 → 右扫查表累加</text>

  <rect x="160" y="38" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">① 定位 k 的下标 p</text>
  <text x="270" y="78" text-anchor="middle" font-size="10" fill="#888">（k 必须出现在子数组中）</text>

  <path d="M270 82 L270 98" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="100" width="400" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">② 左半：l 从 p 向左扫到 0</text>
  <text x="270" y="140" text-anchor="middle" font-size="12" fill="#333">run += val(nums[l])；leftCount[run]++</text>
  <text x="270" y="154" text-anchor="middle" font-size="10" fill="#888">（l = p 时空左段，run = 0 也计入）</text>

  <path d="M270 158 L270 174" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="176" width="400" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">③ 右半：r 从 p 向右扫到 n−1</text>
  <text x="270" y="216" text-anchor="middle" font-size="12" fill="#333">r &gt; p 时 run += val(nums[r])</text>
  <text x="270" y="230" text-anchor="middle" font-size="10" fill="#888">（r = p 时空右段，run = 0）</text>

  <path d="M270 234 L270 250" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="252" width="400" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="11.5" fill="#888">对每个右段和 run，查左表配对：</text>
  <text x="270" y="294" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">ans += leftCount[−run] + leftCount[1 − run]</text>

  <path d="M270 306 L270 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="324" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="349" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">④ 返回 ans</text>
</svg>
