<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF26c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrF26g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrF26r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">Calculator 方法执行流程（以变更方法为例）</text>

  <!-- left mini-flow: getResult -->
  <ellipse cx="92" cy="68" rx="68" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="73" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">getResult()</text>
  <path d="M92,88 L92,150" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrF26c)" filter="url(#rough2)"/>
  <rect x="26" y="150" width="132" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="92" y="170" text-anchor="middle" font-size="11.5" fill="#8a5a20" font-weight="bold">return result</text>
  <text x="92" y="186" text-anchor="middle" font-size="10" fill="#888">（终点方法，不返回 this）</text>

  <!-- center: start oval -->
  <ellipse cx="300" cy="68" rx="96" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="73" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">调用 变更方法(value)</text>
  <path d="M300,88 L300,112" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF26c)" filter="url(#rough2)"/>

  <!-- diamond: divide && value===0? -->
  <polygon points="300,114 384,156 300,198 216,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="152" text-anchor="middle" font-size="11" fill="#8a5a20" font-weight="bold">是 divide</text>
  <text x="300" y="168" text-anchor="middle" font-size="11" fill="#8a5a20" font-weight="bold">且 value===0 ?</text>

  <!-- Yes branch (right) -->
  <path d="M384,156 L412,156" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrF26r)" filter="url(#rough2)"/>
  <text x="398" y="149" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="412" y="134" width="138" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="481" y="154" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">throw</text>
  <text x="481" y="170" text-anchor="middle" font-size="9.5" fill="#b85450">"Division by zero..."</text>

  <!-- No branch (down) -->
  <path d="M300,198 L300,222" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF26c)" filter="url(#rough2)"/>
  <text x="312" y="215" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- update result box -->
  <rect x="200" y="224" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="300" y="246" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">result = result ⊕ value</text>
  <text x="300" y="263" text-anchor="middle" font-size="10.5" fill="#888">⊕ ∈ { + , − , × , ÷ , ^ }</text>

  <path d="M300,272 L300,296" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF26c)" filter="url(#rough2)"/>

  <!-- return this box -->
  <rect x="200" y="298" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="300" y="323" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return this</text>

  <!-- loop back dashed arrow (back to start) -->
  <path d="M200,318 L170,318 L170,68 L204,68" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrF26g)" fill="none" filter="url(#rough2)"/>
  <text x="176" y="190" font-size="10.5" fill="#4a7a3a" font-weight="bold">下一次</text>
  <text x="176" y="204" font-size="10.5" fill="#4a7a3a" font-weight="bold">.方法 链</text>

  <!-- bottom note -->
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#888">divide 需先查零；其余方法直接更新 result 并 return this 供链式调用</text>
</svg>
