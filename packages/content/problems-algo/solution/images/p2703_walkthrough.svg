<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：argumentsLength({}, null, "3") → 3</text>

  <!-- ===== Example 1: single arg ===== -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：argumentsLength(5) → 1</text>

  <!-- call box -->
  <rect x="40" y="76" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">argumentsLength( 5 )</text>

  <!-- args array with one element -->
  <path d="M 160 112 L 160 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="148" width="200" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="170" font-size="11" fill="#888" filter="url(#rough2)">args =</text>
  <rect x="130" y="154" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- result -->
  <path d="M 160 186 L 160 214" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="80" y="220" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">args.length = 1 ✓</text>

  <!-- ===== Example 2: three args ===== -->
  <text x="360" y="62" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：argumentsLength({}, null, "3") → 3</text>

  <!-- call box -->
  <rect x="360" y="76" width="250" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">argumentsLength( {}, null, "3" )</text>

  <path d="M 485 112 L 485 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- args array with three elements -->
  <rect x="370" y="148" width="230" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="384" y="170" font-size="11" fill="#888" filter="url(#rough2)">args =</text>

  <rect x="424" y="154" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="449" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{}</text>
  <text x="426" y="166" font-size="7" fill="#888" filter="url(#rough2)">0</text>

  <rect x="478" y="154" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="503" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">null</text>
  <text x="480" y="166" font-size="7" fill="#888" filter="url(#rough2)">1</text>

  <rect x="532" y="154" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="557" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">"3"</text>
  <text x="534" y="166" font-size="7" fill="#888" filter="url(#rough2)">2</text>

  <!-- result -->
  <path d="M 485 186 L 485 214" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="395" y="220" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="485" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">args.length = 3 ✓</text>

  <!-- ===== Step explanation table ===== -->
  <text x="40" y="280" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">逐步拆解（示例 2）：</text>

  <rect x="40" y="294" width="560" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="311" font-size="10" fill="#333" filter="url(#rough2)">① 调用 argumentsLength({}, null, "3")，三个实参</text>

  <rect x="40" y="324" width="560" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="341" font-size="10" fill="#333" filter="url(#rough2)">② 剩余参数 ...args 收拢 → args = [{}, null, "3"]（真数组）</text>

  <rect x="40" y="354" width="560" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="371" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 读取 args.length（数组自带属性，O(1)）→ 返回 3</text>
</svg>
