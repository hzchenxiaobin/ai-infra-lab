<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">
    示例演算
  </text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="58" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：nums = [0,1,0,0,1]</text>

  <!-- 1s positions -->
  <text x="30" y="82" font-size="11" fill="#555" filter="url(#rough2)">1 的下标：p₁=1, p₂=4</text>

  <!-- gap products -->
  <text x="30" y="108" font-size="11" fill="#333" filter="url(#rough2)">ans = ∏ (p_{i+1} − p_i) = (4 − 1) = 3</text>

  <!-- The three splits -->
  <rect x="30" y="120" width="600" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="40" y="136" font-size="11" fill="#333" filter="url(#rough2)">[0,1] [0,0,1]</text>
  <rect x="30" y="146" width="600" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="40" y="162" font-size="11" fill="#333" filter="url(#rough2)">[0,1,0] [0,1]</text>
  <rect x="30" y="172" width="600" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="40" y="188" font-size="11" fill="#333" filter="url(#rough2)">[0,1,0,0] [1]</text>

  <!-- result 1 -->
  <rect x="500" y="108" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="550" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">输出 = 3 ✓</text>

  <!-- ===== Example 2 ===== -->
  <text x="30" y="226" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例 2：nums = [0,1,0]</text>
  <text x="30" y="250" font-size="11" fill="#555" filter="url(#rough2)">1 的下标：p₁=1（仅一个 1）</text>
  <text x="30" y="276" font-size="11" fill="#333" filter="url(#rough2)">ans = 空乘积 = 1（无需切分，整段即为一个好子数组）</text>
  <rect x="30" y="288" width="600" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="40" y="304" font-size="11" fill="#333" filter="url(#rough2)">[0,1,0]</text>
  <rect x="500" y="276" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="550" y="291" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">输出 = 1 ✓</text>

  <!-- ===== Edge: all zeros ===== -->
  <text x="30" y="346" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">边界：nums = [0,0,0]</text>
  <text x="30" y="370" font-size="11" fill="#333" filter="url(#rough2)">无 1 → 无法构成任何好子数组 → ans = 0</text>
  <rect x="500" y="358" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="550" y="373" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">输出 = 0 ✓</text>
</svg>
