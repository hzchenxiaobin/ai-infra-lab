<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s1="aa", s2="az", evil="ab" → 答案 25</text>

  <!-- evil info -->
  <rect x="40" y="38" width="540" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="58" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">evil="ab", m=2, π=[0,0] | nxt[0]['a']=1, nxt[1]['a']=1, nxt[1]['b']=2(✗), 其余→0</text>

  <!-- ====== countLE("az") tree ====== -->
  <text x="120" y="92" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">countLE("az")：dfs(0, j=0, tight=1)</text>

  <!-- Level 0 -->
  <rect x="80" y="100" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="121" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">i=0, j=0</text>
  <text x="120" y="146" text-anchor="middle" font-size="9.5" fill="#888">tight, limit='a'</text>

  <!-- arrow -->
  <path d="M 120 138 L 120 156" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="140" y="152" font-size="9.5" fill="#4a7a3a">c='a'</text>
  <text x="140" y="164" font-size="9.5" fill="#4a7a3a">nj=1</text>

  <!-- Level 1 -->
  <rect x="80" y="172" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="193" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">i=1, j=1</text>
  <text x="120" y="218" text-anchor="middle" font-size="9.5" fill="#888">tight, limit='z'</text>

  <!-- Three branches from level 1 -->
  <!-- Branch A: c='a' -->
  <path d="M 100 212 Q 70 236 50 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="60" y="240" font-size="9.5" fill="#3a5a2a">c='a'</text>
  <text x="60" y="252" font-size="9" fill="#3a5a2a">nj=1</text>
  <rect x="20" y="262" width="70" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="280" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">i=2, j=1</text>
  <text x="55" y="294" text-anchor="middle" font-size="9" fill="#666">填完→</text>
  <text x="55" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- Branch B: c='b' (BAD) -->
  <path d="M 120 212 L 120 256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="138" y="234" font-size="9.5" fill="#b85450" font-weight="bold">c='b'</text>
  <text x="138" y="246" font-size="9" fill="#b85450">nj=2=m</text>
  <rect x="85" y="262" width="70" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j=m=2</text>
  <text x="120" y="294" text-anchor="middle" font-size="9" fill="#b85450">含 "ab"</text>
  <text x="120" y="310" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">+0</text>

  <!-- Branch C: c='c'..'z' -->
  <path d="M 140 212 Q 180 236 210 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="185" y="240" font-size="9.5" fill="#3a5a2a">c∈c..z</text>
  <text x="185" y="252" font-size="9" fill="#3a5a3a">nj=0</text>
  <rect x="180" y="262" width="90" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="225" y="280" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">i=2, j=0</text>
  <text x="225" y="294" text-anchor="middle" font-size="9" fill="#666">24 个→</text>
  <text x="225" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+24</text>

  <!-- sum for countLE(az) -->
  <rect x="40" y="334" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="354" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">countLE("az") = 1 + 0 + 24 = 25</text>

  <!-- divider -->
  <path d="M 310 100 L 310 360" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Right side: countLE("aa") and good(s1) ====== -->
  <text x="460" y="92" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">countLE("aa")：dfs(0, j=0, tight=1)</text>

  <!-- Level 0 -->
  <rect x="420" y="100" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="121" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">i=0, j=0</text>
  <text x="460" y="146" text-anchor="middle" font-size="9.5" fill="#888">tight, limit='a'</text>

  <path d="M 460 138 L 460 156" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="480" y="152" font-size="9.5" fill="#4a7a3a">c='a'</text>
  <text x="480" y="164" font-size="9.5" fill="#4a7a3a">nj=1</text>

  <!-- Level 1 -->
  <rect x="420" y="172" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="193" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">i=1, j=1</text>
  <text x="460" y="218" text-anchor="middle" font-size="9.5" fill="#888">tight, limit='a'</text>

  <!-- only c='a' -->
  <path d="M 460 212 L 460 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="478" y="234" font-size="9.5" fill="#3a5a2a">c='a'</text>
  <text x="478" y="246" font-size="9" fill="#3a5a2a">nj=1</text>

  <rect x="425" y="262" width="70" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="280" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">i=2, j=1</text>
  <text x="460" y="294" text-anchor="middle" font-size="9" fill="#666">填完→</text>
  <text x="460" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>

  <rect x="380" y="334" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="354" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">countLE("aa") = 1</text>

  <!-- good(s1) check -->
  <rect x="360" y="378" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="392" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">good(s1="aa")：不含 "ab"</text>
  <text x="480" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= 1</text>

  <!-- Final answer -->
  <rect x="60" y="424" width="500" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="448" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">答案 = 25 − 1 + 1 = 25（"aa".."az" 共 26 串，仅 "ab" 含 evil）</text>
</svg>
