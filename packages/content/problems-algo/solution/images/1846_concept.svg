<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后从 1 开始，每个元素封顶 prev+1</text>

  <!-- Original array label -->
  <text x="50" y="68" font-size="12" fill="#888">原数组 arr = [100, 1, 1000]</text>

  <!-- Original row: three cells -->
  <rect x="80" y="82" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">100</text>

  <rect x="170" y="82" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <rect x="260" y="82" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1000</text>

  <!-- Arrow down: sort -->
  <path d="M 205 136 L 205 160" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="156" font-size="11" fill="#d6a040" font-weight="bold">排序</text>

  <!-- Sorted row -->
  <text x="50" y="182" font-size="12" fill="#888">升序后：</text>

  <rect x="80" y="196" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="224" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="115" y="252" text-anchor="middle" font-size="10" fill="#446688">i=0</text>

  <rect x="170" y="196" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="224" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">100</text>
  <text x="205" y="252" text-anchor="middle" font-size="10" fill="#446688">i=1</text>

  <rect x="260" y="196" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="224" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1000</text>
  <text x="295" y="252" text-anchor="middle" font-size="10" fill="#446688">i=2</text>

  <!-- Arrow down: cap -->
  <path d="M 205 260 L 205 284" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="280" font-size="10" fill="#b85450" font-weight="bold">封顶</text>

  <!-- Final row: capped values -->
  <text x="50" y="306" font-size="12" fill="#888">封顶后：</text>

  <rect x="80" y="320" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="115" y="348" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="115" y="376" text-anchor="middle" font-size="9" fill="#4a7a3a">= min(1,1)</text>

  <rect x="170" y="320" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="205" y="348" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="205" y="376" text-anchor="middle" font-size="9" fill="#4a7a3a">= min(100,1+1)</text>

  <rect x="260" y="320" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="295" y="348" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="295" y="376" text-anchor="middle" font-size="9" fill="#4a7a3a">= min(1000,2+1)</text>

  <!-- Core idea box -->
  <rect x="370" y="82" width="210" height="240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="475" y="108" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">贪心封顶策略</text>
  <text x="475" y="134" text-anchor="middle" font-size="11" fill="#666">第一步：升序排序</text>
  <text x="475" y="152" text-anchor="middle" font-size="11" fill="#666">消除「大跳小」的损耗</text>
  <text x="475" y="178" text-anchor="middle" font-size="11" fill="#666">第二步：arr[0] = 1</text>
  <text x="475" y="196" text-anchor="middle" font-size="11" fill="#666">（首元素必须为 1）</text>
  <text x="475" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">arr[i] = min(arr[i],</text>
  <text x="475" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">         arr[i-1]+1)</text>
  <text x="475" y="264" text-anchor="middle" font-size="11" fill="#666">每个元素尽量取大</text>
  <text x="475" y="282" text-anchor="middle" font-size="11" fill="#666">但不超过前驱+1</text>
  <text x="475" y="308" text-anchor="middle" font-size="10" fill="#888">答案 = arr[n-1]</text>

  <!-- Result box -->
  <rect x="370" y="338" width="210" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="363" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最大值 = 3</text>

  <!-- Bottom note -->
  <text x="300" y="408" text-anchor="middle" font-size="10" fill="#888">绿 = 封顶后的最终值；每个值恰取「原值」与「前驱+1」的较小者</text>
</svg>
