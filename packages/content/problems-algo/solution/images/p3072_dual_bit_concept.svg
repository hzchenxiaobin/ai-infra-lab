<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：动态数组的「严格大于」= 总数 − 值域前缀和</text>

  <!-- row 1: discretization -->
  <rect x="56" y="40" width="158" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="60" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">值域 1 ≤ nums[i] ≤ 10⁹</text>
  <text x="135" y="78" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">值域计数桶开不下</text>

  <path d="M 214 64 L 248 64" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="254" y="40" width="210" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="359" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">离散化：排序去重</text>
  <text x="359" y="78" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">值 → 名次 rank ∈ [1, m]，m ≤ n</text>

  <!-- lane 1: arr1 / tree1 -->
  <rect x="36" y="112" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="126" y="134" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">arr1（动态追加）</text>

  <path d="M 126 146 L 126 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="140" y="166" font-size="9.5" fill="#777" filter="url(#rough2)">插入 / 查询</text>

  <rect x="36" y="180" width="180" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="126" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">tree1：名次频次树</text>
  <text x="126" y="219" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">插入 x：update(rank(x)) 单点 +1</text>
  <text x="126" y="237" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">查询：query(rank(x)) 前缀和</text>
  <text x="126" y="255" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">= arr1 中「≤ x」的个数</text>

  <!-- lane 2: arr2 / tree2 -->
  <rect x="304" y="112" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="394" y="134" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">arr2（动态追加）</text>

  <path d="M 394 146 L 394 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="408" y="166" font-size="9.5" fill="#777" filter="url(#rough2)">插入 / 查询</text>

  <rect x="304" y="180" width="180" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="394" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">tree2：名次频次树</text>
  <text x="394" y="219" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">插入 x：update(rank(x)) 单点 +1</text>
  <text x="394" y="237" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">查询：query(rank(x)) 前缀和</text>
  <text x="394" y="255" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">= arr2 中「≤ x」的个数</text>

  <!-- connector between lanes -->
  <path d="M 220 226 L 300 226" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">两树独立、同步演进</text>

  <!-- formula -->
  <rect x="60" y="292" width="400" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">greaterCount(arr, x) = |arr| − query(rank(x))</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">严格大于 x 的个数 = 总数 −「≤ x」的个数，|arr| 用长度 O(1) 维护</text>

  <text x="260" y="378" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">离散化是保序映射，不改变任何「大于 / 小于 / 等于」关系</text>
</svg>
