<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：子串判定法</text>

  <!-- start -->
  <rect x="210" y="44" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 s, goal</text>
  <path d="M 280 76 L 280 90" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: len equal? -->
  <polygon points="280,92 392,140 280,188 168,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">len(s)==len(goal)</text>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">?</text>

  <!-- no -> false -->
  <path d="M 168 140 L 90 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="130" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="124" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="55" y="145" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- yes -> down -->
  <path d="M 280 188 L 280 204" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="298" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- t = s + s -->
  <rect x="180" y="206" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">t = s + s</text>
  <path d="M 280 240 L 280 254" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: goal in t? -->
  <polygon points="280,256 408,312 280,368 152,312" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">goal 是 t 的子串 ?</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#888">find / KMP / contains</text>

  <!-- yes -> true -->
  <path d="M 280 368 L 280 388" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="298" y="382" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="220" y="390" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- no -> false (right) -->
  <path d="M 408 312 L 470 312" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="438" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="472" y="296" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="507" y="317" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- side note -->
  <rect x="20" y="380" width="180" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="34" y="402" font-size="10.5" fill="#d6a040" font-weight="bold">子串搜索可选实现：</text>
  <text x="34" y="418" font-size="10" fill="#888">• C++: t.find(goal) != npos</text>
  <text x="34" y="432" font-size="10" fill="#888">• Python: goal in (s+s)</text>
  <text x="34" y="446" font-size="10" fill="#888">• KMP: O(n) 严格线性</text>
</svg>
