<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">H 指数排序解法：流程图</text>

  <!-- start -->
  <rect x="220" y="48" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- sort -->
  <rect x="170" y="98" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333">将 citations 按降序排序</text>

  <!-- init -->
  <rect x="210" y="150" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="12" fill="#333">i = 0</text>

  <!-- diamond -->
  <polygon points="280,200 410,250 280,300 150,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11.5" fill="#444">i &lt; n 且</text>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#444">citations[i] ≥ i+1 ?</text>

  <!-- yes branch: right -->
  <rect x="430" y="234" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="485" y="256" text-anchor="middle" font-size="11.5" fill="#4a7a3a">i++ （满足）</text>

  <!-- yes label -->
  <text x="424" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- no branch: down -->
  <text x="296" y="318" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- return h -->
  <rect x="190" y="332" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 h = i</text>

  <!-- arrows -->
  <path d="M 280 78 L 280 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 132 L 280 148" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 180 L 280 198" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond yes -> i++ -->
  <path d="M 410 250 L 428 250" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- i++ loop back up to diamond top -->
  <path d="M 485 234 L 485 188 L 280 188 L 280 198" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="182" text-anchor="middle" font-size="9.5" fill="#4a7a3a">继续比较下一篇</text>

  <!-- diamond no -> return -->
  <path d="M 280 300 L 280 330" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- side note -->
  <rect x="30" y="232" width="112" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="86" y="252" text-anchor="middle" font-size="10" fill="#444">前 i 篇都满足</text>
  <text x="86" y="268" text-anchor="middle" font-size="10" fill="#444">被引 ≥ i+1</text>
  <text x="86" y="282" text-anchor="middle" font-size="10" fill="#d6a040">h 至少为 i</text>
</svg>
