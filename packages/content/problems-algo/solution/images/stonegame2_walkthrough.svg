<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：piles = [2,7,9,4,4]，Alice 最优得 10</text>

  <!-- piles row, color-coded by player -->
  <text x="40" y="56" font-size="11" fill="#888">piles:</text>
  <rect x="88" y="40" width="58" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="61" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="146" y="40" width="58" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="61" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="204" y="40" width="58" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="61" text-anchor="middle" font-size="14" fill="#333">9</text>
  <rect x="262" y="40" width="58" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="291" y="61" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="320" y="40" width="58" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="349" y="61" text-anchor="middle" font-size="14" fill="#333">4</text>

  <!-- player labels -->
  <text x="117" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Alice</text>
  <text x="204" y="90" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Bob</text>
  <text x="291" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Alice</text>

  <!-- suffix row -->
  <text x="40" y="112" font-size="10" fill="#888">suffix:</text>
  <text x="117" y="112" text-anchor="middle" font-size="10" fill="#888">26</text>
  <text x="175" y="112" text-anchor="middle" font-size="10" fill="#888">24</text>
  <text x="233" y="112" text-anchor="middle" font-size="10" fill="#888">17</text>
  <text x="291" y="112" text-anchor="middle" font-size="10" fill="#888">8</text>
  <text x="349" y="112" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- dp(0,1) computation box -->
  <rect x="30" y="124" width="460" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dp(0, 1)：枚举 X = 1, 2</text>
  <text x="260" y="164" text-anchor="middle" font-size="11" fill="#444">X=1：gain = 26 − dp(1, 1) = 26 − 16 = 10  ✓</text>
  <text x="260" y="182" text-anchor="middle" font-size="11" fill="#444">X=2：gain = 26 − dp(2, 2) = 26 − 17 = 9</text>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">max(10, 9) = 10  →  Alice 取 X=1</text>

  <!-- dp(1,1) sub-computation -->
  <rect x="30" y="220" width="225" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="142" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dp(1, 1) = 16：Bob 的最优</text>
  <text x="142" y="258" text-anchor="middle" font-size="10" fill="#444">X=2：24 − dp(3, 2) = 24 − 8 = 16 ✓</text>
  <text x="142" y="276" text-anchor="middle" font-size="10" fill="#444">Bob 取 [7,9]，M ← max(1,2)=2</text>
  <text x="142" y="290" text-anchor="middle" font-size="9" fill="#888">dp(3,2)=8（2M=4≥2 取完）</text>

  <!-- dp(2,2) sub-computation -->
  <rect x="265" y="220" width="225" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="377" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp(2, 2) = 17</text>
  <text x="377" y="258" text-anchor="middle" font-size="10" fill="#444">2M = 4 ≥ 3（剩余堆数）</text>
  <text x="377" y="276" text-anchor="middle" font-size="10" fill="#444">一次取完 = suffix[2]</text>
  <text x="377" y="290" text-anchor="middle" font-size="9" fill="#888">= 9 + 4 + 4 = 17</text>

  <!-- final result -->
  <rect x="30" y="304" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#333">Alice 取 [2] 得 2 → Bob 取 [7,9] 得 16 → Alice 取 [4,4] 得 8</text>
  <text x="260" y="340" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Alice 总计 = 2 + 8 = 10</text>
</svg>
