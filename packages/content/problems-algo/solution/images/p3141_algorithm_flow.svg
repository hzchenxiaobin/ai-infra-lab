<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：不显式建图 —— 多源 BFS 扫满 2^m 个状态，再统一查询</text>

  <!-- ① 初始化 -->
  <rect x="170" y="44" width="180" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① dist[0..2^m−1] 置 −1</text>
  <text x="260" y="82" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">距离数组兼作 visited 标记</text>

  <path d="M 260 92 L 260 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 多源入队 -->
  <rect x="170" y="106" width="180" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② nums 全体元素入队</text>
  <text x="260" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">dist[x] = 0（多源起点）</text>
  <text x="260" y="157" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">重复值再次入队前天然跳过</text>

  <path d="M 260 160 L 260 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ 队列空？ -->
  <polygon points="260,176 334,206 260,236 186,206" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">队列空？</text>

  <text x="344" y="197" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 334 206 L 352 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="272" y="248" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 236 L 260 246" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ④ 出队扩展 -->
  <rect x="170" y="250" width="180" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 出队 x，枚举 i = 0..m−1</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">y = x ⊕ (1 &lt;&lt; i)</text>
  <text x="260" y="306" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">dist[y] = −1 ⇒ dist[y] = dist[x]+1 并入队</text>

  <!-- 回环 -->
  <path d="M 170 285 L 60 285 L 60 206 L 182 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="115" y="300" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">x 的 m 个邻居处理完</text>

  <!-- ⑤ 查询 -->
  <rect x="356" y="172" width="152" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="432" y="192" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⑤ 统一查询</text>
  <text x="432" y="210" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">answer[i] = m − dist[x ⊕ mask]</text>
  <text x="432" y="226" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">mask = 2^m − 1（m 位全 1）</text>

  <path d="M 432 236 L 432 246" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ⑥ 返回 -->
  <rect x="356" y="250" width="152" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="432" y="270" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⑥ 返回 answer</text>
  <text x="432" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个元素一次 O(1) 查表</text>

  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">超立方体连通：BFS 结束时 2^m 个状态全部有距离，无 −1 残留</text>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">FIFO 队列保证按层扩散；总代价 O(2^m · m)，与 n 无关（n ≤ 2^m）</text>
</svg>
