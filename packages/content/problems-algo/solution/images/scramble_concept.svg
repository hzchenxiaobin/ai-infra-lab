<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fdfcf7"/>

  <text x="310" y="32" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">扰乱字符串：递归分割 + 可选交换</text>
  <path d="M 210 42 Q 310 50 410 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="310" y="58" text-anchor="middle" font-size="11" fill="#888">长度&gt;1 时切两段，可交换可不变，再对每段递归</text>

  <!-- Layer 0: original string great -->
  <text x="40" y="108" font-size="12" fill="#888" font-weight="bold">原串 s1</text>
  <g filter="url(#sk)"><rect x="90" y="86" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="112" y="108" text-anchor="middle" font-size="14" fill="#2b4a6a" font-weight="bold">g</text>
  <g filter="url(#sk)"><rect x="138" y="86" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="160" y="108" text-anchor="middle" font-size="14" fill="#2b4a6a" font-weight="bold">r</text>
  <g filter="url(#sk)"><rect x="186" y="86" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="208" y="108" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">e</text>
  <g filter="url(#sk)"><rect x="234" y="86" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="256" y="108" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="282" y="86" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="304" y="108" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">t</text>
  <text x="336" y="106" font-size="11" fill="#888">= "great"</text>

  <!-- split point marker -->
  <path d="M 182 78 L 182 128" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#sk)"/>
  <text x="182" y="72" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">切 i=2</text>

  <!-- arrows down to two children -->
  <path d="M 160 124 Q 130 150 130 172" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 260 124 Q 290 150 290 172" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>

  <!-- Layer 1 left child: gr -->
  <text x="40" y="198" font-size="11" fill="#446688" font-weight="bold">左段</text>
  <g filter="url(#sk)"><rect x="90" y="176" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="112" y="198" text-anchor="middle" font-size="13" fill="#2b4a6a" font-weight="bold">g</text>
  <g filter="url(#sk)"><rect x="138" y="176" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="160" y="198" text-anchor="middle" font-size="13" fill="#2b4a6a" font-weight="bold">r</text>

  <!-- Layer 1 right child: eat -->
  <text x="220" y="198" font-size="11" fill="#d6a040" font-weight="bold">右段</text>
  <g filter="url(#sk)"><rect x="270" y="176" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="292" y="198" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">e</text>
  <g filter="url(#sk)"><rect x="318" y="176" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="340" y="198" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="366" y="176" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="388" y="198" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">t</text>

  <!-- left child: split + SWAP -->
  <path d="M 160 212 Q 120 238 120 262" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 120 262 Q 120 238 160 212" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)" opacity="0.6"/>
  <text x="80" y="248" font-size="10" fill="#b85450" font-weight="bold">交换!</text>

  <!-- right child: split + no swap -->
  <path d="M 340 212 Q 340 238 340 262" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="390" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">不交换</text>

  <!-- Layer 2: swapped left = rg, kept right = eat -->
  <text x="40" y="292" font-size="11" fill="#b85450" font-weight="bold">交换后</text>
  <g filter="url(#sk)"><rect x="90" y="270" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="112" y="290" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">r</text>
  <g filter="url(#sk)"><rect x="138" y="270" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="160" y="290" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">g</text>

  <text x="220" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">保持</text>
  <g filter="url(#sk)"><rect x="270" y="270" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="292" y="290" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">e</text>
  <g filter="url(#sk)"><rect x="318" y="270" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="340" y="290" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="366" y="270" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="388" y="290" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">t</text>

  <!-- merge arrow -->
  <path d="M 160 306 Q 250 330 250 346" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 340 306 Q 250 330 250 346" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="250" y="326" text-anchor="middle" font-size="10" fill="#888">拼接</text>

  <!-- Layer 3: result rgeat -->
  <text x="40" y="380" font-size="12" fill="#888" font-weight="bold">结果 s2</text>
  <g filter="url(#sk)"><rect x="90" y="356" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="112" y="378" text-anchor="middle" font-size="14" fill="#8a3030" font-weight="bold">r</text>
  <g filter="url(#sk)"><rect x="138" y="356" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="160" y="378" text-anchor="middle" font-size="14" fill="#8a3030" font-weight="bold">g</text>
  <g filter="url(#sk)"><rect x="186" y="356" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="208" y="378" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">e</text>
  <g filter="url(#sk)"><rect x="234" y="356" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="256" y="378" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="282" y="356" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="304" y="378" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">t</text>
  <text x="336" y="378" font-size="11" fill="#888">= "rgeat" ✓</text>

  <!-- legend -->
  <g filter="url(#sk)"><rect x="440" y="86" width="160" height="108" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="520" y="108" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">扰乱操作</text>
  <text x="452" y="128" font-size="11" fill="#444">1. 长度=1 → 停止</text>
  <text x="452" y="146" font-size="11" fill="#444">2. 长度&gt;1:</text>
  <text x="464" y="162" font-size="10" fill="#444">① 切两段(非空)</text>
  <text x="464" y="176" font-size="10" fill="#444">② 可交换/不交换</text>
  <text x="464" y="190" font-size="10" fill="#444">③ 递归处理两段</text>

  <g filter="url(#sk)"><rect x="440" y="210" width="160" height="78" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5,3"/></g>
  <text x="520" y="232" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">图例</text>
  <g filter="url(#sk)"><rect x="452" y="244" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/></g>
  <text x="478" y="255" font-size="10" fill="#444">gr 段(蓝)</text>
  <g filter="url(#sk)"><rect x="452" y="262" width="18" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/></g>
  <text x="478" y="273" font-size="10" fill="#444">eat 段(橙)</text>
  <g filter="url(#sk)"><rect x="452" y="280" width="18" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/></g>
  <text x="478" y="291" font-size="10" fill="#444">交换后(红)</text>
</svg>
