<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心区间：把 balance 从「一个数」放宽为「一段区间」</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888">[lo, hi] = 扫描完当前前缀后，未匹配左括号数量 balance 的可能取值范围</text>

  <!-- ===== 左侧：单值 balance（20 题，无 *） ===== -->
  <text x="130" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">20 题：balance 是一个确定值</text>
  <rect x="60" y="92" width="140" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="113" text-anchor="middle" font-size="11" fill="#333">( → balance+1</text>
  <text x="130" y="130" text-anchor="middle" font-size="11" fill="#333">) → balance−1</text>

  <rect x="95" y="156" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">balance = 2</text>

  <!-- ===== 右侧：区间 balance（678 题，含 *） ===== -->
  <text x="430" y="82" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">678 题：balance 是一段区间</text>
  <rect x="350" y="92" width="160" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="112" text-anchor="middle" font-size="11" fill="#333">( → [lo+1, hi+1]</text>
  <text x="430" y="130" text-anchor="middle" font-size="11" fill="#333">) → [max(lo−1,0), hi−1]</text>

  <!-- 星号三义分支 -->
  <text x="430" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">* 三义：上界 +1 / 下界 −1 / 不变</text>

  <!-- 区间条 -->
  <rect x="350" y="170" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="370" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="430" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a">… 可能值 …</text>
  <text x="490" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="430" y="186" text-anchor="middle" font-size="10" fill="#888">[lo, hi]</text>

  <!-- 三个分支小标 -->
  <text x="360" y="226" font-size="10" fill="#b85450">当 ')'：lo−1（截到 0）</text>
  <text x="360" y="240" font-size="10" fill="#446688">当 '('：hi+1</text>
  <text x="360" y="254" font-size="10" fill="#888">当空：不变</text>

  <!-- 中间箭头连接 -->
  <path d="M 200 176 Q 270 176 340 184" fill="none" stroke="#666" stroke-width="1.5"
        stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="170" text-anchor="middle" font-size="10" fill="#666" font-style="italic">引入 *</text>

  <!-- ===== 下方：判定规则 ===== -->
  <rect x="40" y="288" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="310" font-size="12" fill="#d6a040" font-weight="bold">💡 判定规则</text>
  <text x="60" y="328" font-size="11" fill="#555">① 扫描中 hi &lt; 0 → 即使 '*' 全当 '(' 也补不上 → 非法</text>
  <text x="60" y="344" font-size="11" fill="#555">② 扫描结束 lo == 0 → 存在使 balance 归零的 '*' 赋值方案 → 合法</text>
  <text x="60" y="360" font-size="11" fill="#555">lo 始终下截到 0：balance 不可为负，前方 '*' 可兜底当 '('</text>
</svg>
