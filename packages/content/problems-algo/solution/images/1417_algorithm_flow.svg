<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="500" height="480" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：拆分 → 计数 → 判可行性 → 交错合并</text>

  <!-- 开始 -->
  <rect x="200" y="40" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="250" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- 拆分 -->
  <path d="M 250 70 L 250 82" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="100" y="86" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="106" text-anchor="middle" font-size="12" fill="#333">遍历 s，按 isalpha/isdigit 拆入两表</text>

  <!-- 计数 -->
  <path d="M 250 118 L 250 130" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="150" y="134" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="152" text-anchor="middle" font-size="12" fill="#333">cL = letters, cD = digits</text>

  <!-- 判定菱形 -->
  <path d="M 250 162 L 250 178" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <polygon points="250,182 380,222 250,262 120,222" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">|cL − cD|</text>
  <text x="250" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&gt; 1 ?</text>

  <!-- 是 → 返回空 -->
  <path d="M 380 222 L 430 222 L 430 270" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="386" y="216" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="366" y="274" width="128" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ""</text>

  <!-- 否 → 选开头 -->
  <path d="M 250 262 L 250 278" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="266" y="274" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="90" y="282" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="300" text-anchor="middle" font-size="12" fill="#333">a = 较多的一类, b = 较少的一类</text>
  <text x="250" y="316" text-anchor="middle" font-size="11" fill="#888">相等时 a = letters（任选）</text>

  <!-- 交错合并 -->
  <path d="M 250 322 L 250 338" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="342" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="360" text-anchor="middle" font-size="12" fill="#333">对 i in [0, len(a)):</text>
  <text x="250" y="376" text-anchor="middle" font-size="12" fill="#333">append a[i]; 若 i &lt; len(b) 则 append b[i]</text>

  <!-- 返回 -->
  <path d="M 250 382 L 250 398" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="150" y="402" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="422" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回拼接结果</text>

  <!-- 结束 -->
  <path d="M 250 434 L 250 446" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="200" y="450" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="250" y="464" text-anchor="middle" font-size="11" fill="#333">结束</text>
</svg>
