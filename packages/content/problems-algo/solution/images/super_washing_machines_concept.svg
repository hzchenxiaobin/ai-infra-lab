<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">超级洗衣机：两类下界决定答案</text>
  <path d="M 290 42 Q 430 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="60" text-anchor="middle" font-size="11" fill="#888">machines = [1, 0, 5]，total = 6，n = 3，target = 2</text>

  <!-- ===== 机器行 ===== -->
  <text x="120" y="118" text-anchor="end" font-size="12" fill="#555">机器</text>
  <g filter="url(#sk)">
    <rect x="200" y="92" width="90" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="400" y="92" width="90" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="600" y="92" width="90" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="22" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="245" y="134">1</text>
    <text x="445" y="134">0</text>
    <text x="645" y="134">5</text>
  </g>
  <!-- target 虚线 -->
  <line x1="190" y1="170" x2="700" y2="170" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="710" y="174" font-size="11" fill="#b85450">target=2</text>

  <!-- ===== flow 行：每台盈亏 ===== -->
  <text x="120" y="206" text-anchor="end" font-size="12" fill="#555">盈亏 flow</text>
  <g filter="url(#sk)">
    <rect x="200" y="188" width="90" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="400" y="188" width="90" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="600" y="188" width="90" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="245" y="214" fill="#b03a3a">−1</text>
    <text x="445" y="214" fill="#b03a3a">−2</text>
    <text x="645" y="214" fill="#2e6e2e">+3</text>
  </g>
  <text x="710" y="214" font-size="10" fill="#2e6e2e">→ 需输出 3</text>

  <!-- ===== balance 行：前缀和（穿过边的净流量） ===== -->
  <text x="120" y="280" text-anchor="end" font-size="12" fill="#555">前缀 balance</text>
  <g filter="url(#sk)">
    <rect x="200" y="262" width="90" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="400" y="262" width="90" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="600" y="262" width="90" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#7a5415">
    <text x="245" y="288">−1</text>
    <text x="445" y="288">−3</text>
    <text x="645" y="288">0</text>
  </g>

  <!-- ===== 边的切割线 + 流量标注 ===== -->
  <line x1="345" y1="86" x2="345" y2="312" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <line x1="545" y1="86" x2="545" y2="312" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="318" y="316" width="54" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="518" y="316" width="54" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#2b6e9e">
    <text x="345" y="334">|1|</text>
    <text x="545" y="334">|3|</text>
  </g>
  <text x="430" y="354" text-anchor="middle" font-size="10" fill="#2b6e9e">每条「切口」每回合只能净流 1 件 → 下界 = |balance|</text>

  <!-- ===== 两个下界说明框 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="376" width="380" height="108" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="230" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">下界①：边切口流量</text>
  <text x="56" y="424" font-size="11.5" fill="#344">i 与 i+1 之间的切口必须净流</text>
  <text x="56" y="442" font-size="11.5" fill="#344">|balanceᵢ| 件；每回合该切口</text>
  <text x="56" y="460" font-size="11.5" fill="#344">最多净过 1 件 → 回合数 ≥ |balanceᵢ|</text>
  <text x="56" y="478" font-size="11" fill="#6a96c0">本题：max|balance| = 3</text>

  <g filter="url(#sk)">
    <rect x="440" y="376" width="380" height="108" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="630" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">下界②：盈余机的输出</text>
  <text x="456" y="424" font-size="11.5" fill="#344">盈余机（flow&gt;0）每回合最多</text>
  <text x="456" y="442" font-size="11.5" fill="#344">吐出 1 件（只能给一个邻居）</text>
  <text x="456" y="460" font-size="11.5" fill="#344">→ 回合数 ≥ flowᵢ（只对正值）</text>
  <text x="456" y="478" font-size="11" fill="#5a8a5a">本题：max flow = 3（亏缺机不算）</text>

  <!-- ===== 公式带 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="500" width="740" height="30" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="520" text-anchor="middle" font-size="13" fill="#444">
    <tspan font-weight="bold" fill="#b03a3a">ans = max</tspan>
    <tspan> over i of  max(|balanceᵢ|, flowᵢ)   ← 两类下界取最大，且可同时取等</tspan>
  </text>
</svg>
