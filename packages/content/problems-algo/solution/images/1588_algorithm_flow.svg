<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历，O(n) 累加贡献</text>

  <!-- Start -->
  <rect x="230" y="44" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="290" y="65" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">开始：ans = 0</text>

  <path d="M 290 76 L 290 90" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop -->
  <polygon points="290,94 380,124 290,154 200,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="121" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">i &lt; n ?</text>
  <text x="290" y="136" text-anchor="middle" font-size="10" fill="#888">遍历每个下标</text>

  <!-- Yes branch -->
  <path d="M 200 124 L 90 124 L 90 160" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="140" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 1: left / right -->
  <rect x="30" y="164" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="182" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold">left = i</text>
  <text x="90" y="198" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold">right = n−1−i</text>

  <path d="M 90 208 L 90 224" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: parity counts -->
  <rect x="20" y="228" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="246" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">LE = left/2 + 1</text>
  <text x="90" y="260" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">LO = (left+1)/2</text>
  <text x="90" y="274" text-anchor="middle" font-size="10" fill="#555">RE, RO 同理</text>

  <path d="M 90 284 L 90 300" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: count -->
  <rect x="20" y="304" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="322" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">count =</text>
  <text x="90" y="336" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">LE·RE + LO·RO</text>

  <path d="M 90 344 L 90 360" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: accumulate -->
  <rect x="20" y="364" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="382" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">ans +=</text>
  <text x="90" y="396" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">arr[i] × count</text>

  <!-- loop back to diamond -->
  <path d="M 90 384 L 20 384 L 20 124 L 200 124" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="38" y="250" text-anchor="middle" font-size="9.5" fill="#888" transform="rotate(-90 38 250)">回到判断 i++</text>

  <!-- No branch -->
  <path d="M 380 124 L 500 124 L 500 160" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="445" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Return -->
  <rect x="430" y="164" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="500" y="182" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">返回 ans</text>
  <text x="500" y="196" text-anchor="middle" font-size="10" fill="#555">O(n) / O(1)</text>

  <!-- formula reminder box -->
  <rect x="350" y="230" width="220" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="250" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">公式备忘</text>
  <text x="365" y="270" font-size="10" fill="#555">• left = i （左侧元素数）</text>
  <text x="365" y="286" font-size="10" fill="#555">• right = n−1−i （右侧）</text>
  <text x="365" y="302" font-size="10" fill="#555">• [0,k] 偶数个数 = k/2+1</text>
  <text x="365" y="318" font-size="10" fill="#555">• [0,k] 奇数个数 = (k+1)/2</text>
  <text x="365" y="336" font-size="10" fill="#555">• 奇数长度 ⟺ a,b 同奇偶</text>
</svg>
