<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="580" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    算法流程：双指针（j 只前进不后退）
  </text>

  <!-- Start -->
  <rect x="220" y="50" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M280,86 L280,100" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="200" y="104" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j = 0, ans = 0</text>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0 → n−1 循环</text>
  <path d="M280,148 L280,162" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: i < n ? -->
  <polygon points="280,166 360,200 280,234 200,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <!-- No -> end -->
  <path d="M360,200 L420,200 L420,540 L340,540" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)" fill="none"/>
  <text x="385" y="194" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <!-- Yes -> down -->
  <path d="M280,234 L280,248" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="246" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Step: j = max(j, i) -->
  <rect x="195" y="252" width="170" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">若 j &lt; i，则 j = i</text>
  <path d="M280,290 L280,304" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: j < m 且 nums2[j] >= nums1[i] ? -->
  <polygon points="280,308 430,348 280,388 130,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j &lt; m 且</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">nums2[j] ≥ nums1[i] ?</text>
  <!-- Yes -> j++ (loop back) -->
  <path d="M430,348 L470,348 L470,308 L430,308" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)" fill="none"/>
  <text x="445" y="324" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="445" y="270" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j++</text>
  <path d="M475,304 L475,308" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- No -> down -->
  <path d="M280,388 L280,402" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="400" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Decision: j-1 >= i ? -->
  <polygon points="280,406 370,440 280,474 190,440" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="445" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j−1 ≥ i ?</text>
  <!-- Yes -> update ans -->
  <path d="M370,440 L420,440" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="380,432" font-size="11" fill="#4a7a3a" filter="url(#rough2)"></text>
  <text x="378" y="434" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="425" y="423" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="445" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = max(ans,</text>
  <text x="480" y="458" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j−1−i)</text>
  <!-- No / merge -> i++ -->
  <path d="M280,474 L280,488" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="486" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M480,457 L480,488 L300,488" stroke="#446688" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)" fill="none"/>

  <!-- i++ -->
  <rect x="225" y="492" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="514" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++</text>
  <!-- loop back to i < n check -->
  <path d="M225,509 L120,509 L120,200 L200,200" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)" fill="none"/>

  <!-- End -->
  <rect x="220" y="524" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="280" y="547" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
