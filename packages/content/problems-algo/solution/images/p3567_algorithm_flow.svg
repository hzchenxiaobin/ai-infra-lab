<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 486"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="486" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：枚举窗口 → 排序 → 相邻扫描</text>

  <!-- A: 枚举窗口 -->
  <rect x="150" y="28" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举窗口左上角 (i, j)</text>
  <path d="M260,58 L260,72" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B: 收集 -->
  <rect x="150" y="74" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收集窗口内 k² 个值 vals</text>
  <path d="M260,104 L260,118" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- C: 排序 -->
  <rect x="150" y="120" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sort(vals)；best ← 0</text>
  <path d="M260,150 L260,164" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D: p 循环条件 -->
  <polygon points="260,168 352,202 260,236 168,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">p ≤ k²−1 ?</text>

  <!-- D 否 → 写入 ans -->
  <path d="M352,202 L384,202" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="388" y="182" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">ans[i][j] ← best</text>
  <text x="448" y="213" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（全同值时 = 0）</text>

  <path d="M448,222 L448,238" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- I: 还有窗口？ -->
  <polygon points="448,240 500,278 448,316 396,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="282" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">还有窗口 ?</text>

  <!-- I 是 → 下一窗口（回到 A） -->
  <text x="492" y="266" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M500,278 L514,278 L514,43 L373,43" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="444" y="37" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">是：下一窗口</text>

  <!-- I 否 → 返回 -->
  <path d="M448,316 L448,334" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="456" y="330" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="388" y="336" width="120" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- D 是 → 取相邻对 -->
  <path d="M260,236 L260,280" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="252" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- E2: 同值判断 -->
  <polygon points="260,284 352,312 260,340 168,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">vals[p] = vals[p−1] ?</text>

  <!-- E2 是 → 跳过 -->
  <path d="M168,312 L134,312" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="304" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="26" y="294" width="104" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">同值对，跳过</text>
  <text x="78" y="323" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">d = 0 无效</text>

  <!-- E2 否 → 更新 -->
  <path d="M260,340 L260,366" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="268" y="356" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="170" y="370" width="180" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="387" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">best = min(best, d)</text>
  <text x="260" y="403" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">d = vals[p] − vals[p−1] ≥ 1</text>

  <!-- 回边：下一 p -->
  <path d="M78,330 L78,452" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M260,410 L260,452" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M16,452 L260,452" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M16,452 L16,202 L164,202" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="58" y="196" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下一 p</text>

  <!-- 底部注记 -->
  <rect x="300" y="436" width="200" height="34" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="400" y="450" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每窗口 O(k² log k)</text>
  <text x="400" y="464" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">共 (m−k+1)(n−k+1) 个窗口</text>
</svg>
