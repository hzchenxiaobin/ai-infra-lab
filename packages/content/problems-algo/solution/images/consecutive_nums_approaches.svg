<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两种解法对比：自连接 JOIN vs 窗口函数 LAG</text>

  <!-- Left: Self JOIN approach -->
  <rect x="30" y="44" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">解法 A：自连接 JOIN</text>
  <text x="150" y="80" text-anchor="middle" font-size="9" fill="#666">三表副本按 id 错位对齐</text>

  <rect x="30" y="96" width="240" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="110" font-size="9" fill="#333">FROM Logs l1</text>
  <rect x="30" y="118" width="240" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="132" font-size="9" fill="#333">JOIN l2 ON l2.id=l1.id+1</text>
  <rect x="30" y="140" width="240" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="154" font-size="9" fill="#333">JOIN l3 ON l3.id=l1.id+2</text>
  <rect x="30" y="162" width="240" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="40" y="176" font-size="9" fill="#333">WHERE l1.num=l2.num=l3.num</text>
  <rect x="30" y="184" width="240" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="198" font-size="9" fill="#333">SELECT DISTINCT l1.num</text>

  <rect x="30" y="216" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="150" y="234" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">时间 O(n²) ~ O(n)</text>
  <text x="150" y="250" text-anchor="middle" font-size="9" fill="#888">取决于 id 是否连续+有无索引</text>

  <!-- Right: Window function approach -->
  <rect x="290" y="44" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">解法 B：窗口函数 LAG</text>
  <text x="410" y="80" text-anchor="middle" font-size="9" fill="#666">单趟扫描 + 前两行回看</text>

  <rect x="290" y="96" width="240" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="110" font-size="9" fill="#333">SELECT num,</text>
  <rect x="290" y="118" width="240" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="132" font-size="9" fill="#333">LAG(num,1) OVER(ORDER BY id)</text>
  <rect x="290" y="140" width="240" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="154" font-size="9" fill="#333">LAG(num,2) OVER(ORDER BY id)</text>
  <rect x="290" y="162" width="240" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="176" font-size="9" fill="#333">FROM Logs</text>
  <rect x="290" y="184" width="240" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="198" font-size="9" fill="#333">外层 WHERE num=prev1=prev2</text>

  <rect x="290" y="216" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="410" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">时间 O(n log n)</text>
  <text x="410" y="250" text-anchor="middle" font-size="9" fill="#888">一次排序 + 单趟扫描，推荐</text>

  <!-- VS divider -->
  <line x1="280" y1="50" x2="280" y2="270" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="280" cy="100" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">VS</text>

  <!-- Bottom comparison -->
  <rect x="30" y="276" width="500" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">两种解法本质相同：都是把"前后行"拉到"同一行"做比较</text>
  <text x="48" y="316" font-size="10" fill="#333">A 自连接：用 JOIN 把相邻三行物理并排 → WHERE 比三列</text>
  <text x="48" y="334" font-size="10" fill="#333">B LAG：用窗口函数把前两行 num 复制到当前行 → WHERE 比三列</text>
  <text x="48" y="354" font-size="10" fill="#b85450" font-weight="bold">选型：B 更现代高效（一次排序）；A 更经典直观（面试常考）</text>
</svg>
