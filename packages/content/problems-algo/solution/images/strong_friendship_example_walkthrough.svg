<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三对好友逐一判定共同好友数</text>

  <!-- Table header -->
  <g font-size="11" fill="#555" font-weight="bold" text-anchor="middle">
    <rect x="16" y="46" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="40" y="63">好友对</text>
    <rect x="66" y="46" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="126" y="63">friends(x)</text>
    <rect x="188" y="46" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="63">friends(y)</text>
    <rect x="310" y="46" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="365" y="63">共同好友</text>
    <rect x="422" y="46" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="441" y="63">数量</text>
    <rect x="462" y="46" width="96" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="510" y="63">判定</text>
  </g>

  <!-- Row 1: (1,2) strong -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <rect x="16" y="74" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="40" y="102" font-weight="bold">(1, 2)</text>
    <rect x="66" y="74" width="120" height="48" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="126" y="102">{2,3,4,5,6,7}</text>
    <rect x="188" y="74" width="120" height="48" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="102">{1,3,4,5,6}</text>
    <rect x="310" y="74" width="110" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="365" y="102" fill="#b85450" font-weight="bold">{3,4,5,6}</text>
    <rect x="422" y="74" width="38" height="48" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="441" y="102" font-weight="bold">4</text>
    <rect x="462" y="74" width="96" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="510" y="96" fill="#4a7a3a" font-weight="bold">≥ 3</text>
    <text x="510" y="112" fill="#4a7a3a" font-weight="bold">坚定 ✓</text>
  </g>

  <!-- Row 2: (1,3) strong -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <rect x="16" y="124" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="40" y="152" font-weight="bold">(1, 3)</text>
    <rect x="66" y="124" width="120" height="48" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="126" y="152">{2,3,4,5,6,7}</text>
    <rect x="188" y="124" width="120" height="48" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="152">{1,2,6,7}</text>
    <rect x="310" y="124" width="110" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="365" y="152" fill="#b85450" font-weight="bold">{2,6,7}</text>
    <rect x="422" y="124" width="38" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="441" y="152" font-weight="bold" fill="#d6a040">3</text>
    <rect x="462" y="124" width="96" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="510" y="146" fill="#4a7a3a" font-weight="bold">≥ 3</text>
    <text x="510" y="162" fill="#4a7a3a" font-weight="bold">坚定 ✓</text>
  </g>

  <!-- Row 3: (2,3) not strong -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <rect x="16" y="174" width="48" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="40" y="202" font-weight="bold">(2, 3)</text>
    <rect x="66" y="174" width="120" height="48" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="126" y="202">{1,3,4,5,6}</text>
    <rect x="188" y="174" width="120" height="48" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="202">{1,2,6,7}</text>
    <rect x="310" y="174" width="110" height="48" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="365" y="202">{1,6}</text>
    <rect x="422" y="174" width="38" height="48" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="441" y="202" font-weight="bold">2</text>
    <rect x="462" y="174" width="96" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="510" y="196" fill="#b85450" font-weight="bold">&lt; 3</text>
    <text x="510" y="212" fill="#b85450" font-weight="bold">非坚定 ✗</text>
  </g>

  <!-- Divider -->
  <path d="M 16 236 L 548 236" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Analysis notes -->
  <text x="20" y="258" font-size="12" fill="#555" font-weight="bold">关键分析：</text>

  <rect x="20" y="268" width="528" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="30" y="288" font-size="11" fill="#333">✓ (1,2)：交集 {3,4,5,6} = 4 ≥ 3 → 坚定。注意 1∈friends(2)、2∈friends(1) 但都不在交集</text>

  <rect x="20" y="310" width="528" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="30" y="330" font-size="11" fill="#333">✓ (1,3)：交集 {2,6,7} = 3 ≥ 3 → 坚定（恰好踩阈值，&gt;= 含等号）</text>

  <rect x="20" y="352" width="528" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="30" y="372" font-size="11" fill="#333">✗ (2,3)：交集 {1,6} = 2 &lt; 3 → 非坚定（用户 1 是 2 与 3 的共同好友，但只凑出 2 个）</text>

  <!-- Final result -->
  <rect x="100" y="396" width="360" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="415" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">最终输出：(1, 2, 4) 与 (1, 3, 3)</text>
</svg>
