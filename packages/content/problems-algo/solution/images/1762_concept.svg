<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：从右向左维护「右侧最大高度」，h[i] &gt; maxRight 即可看海</text>

  <!-- Ocean on the right -->
  <rect x="350" y="120" width="190" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <!-- waves -->
  <path d="M 358 200 q 12 -10 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 358 230 q 12 -10 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 358 260 q 12 -10 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="445" y="150" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">🌊 海洋</text>

  <!-- Ground line -->
  <path d="M 50 300 L 540 300" stroke="#888" stroke-width="2" filter="url(#rough2)"/>

  <!-- Buildings: heights = [4,2,3,1], ground y=300, unit=35, bar width=55, x=70/140/210/280 -->
  <!-- index 0: h=4, sees ocean -> green, top y=160 -->
  <rect x="70" y="160" width="55" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="97" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">h=4</text>
  <text x="97" y="318" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>

  <!-- index 1: h=2, blocked -> red, top y=230 -->
  <rect x="140" y="230" width="55" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="167" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">h=2</text>
  <text x="167" y="318" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>

  <!-- index 2: h=3, sees ocean -> green, top y=195 -->
  <rect x="210" y="195" width="55" height="105" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="237" y="187" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">h=3</text>
  <text x="237" y="318" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>

  <!-- index 3: h=1, sees ocean -> green, top y=265 -->
  <rect x="280" y="265" width="55" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="257" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">h=1</text>
  <text x="307" y="318" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- Line of sight arrows from building tops to ocean -->
  <!-- i=0 sees ocean: arrow from top of bar 0 (97,160) over the bars to ocean -->
  <path d="M 125 168 L 348 175" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- i=1 blocked: arrow from top of bar 1 (167,230) hits bar 2 -->
  <path d="M 195 232 L 210 215" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="250" font-size="11" fill="#b85450" filter="url(#rough2)">被挡</text>
  <!-- i=2 sees ocean -->
  <path d="M 265 200 L 348 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- i=3 sees ocean (rightmost) -->
  <path d="M 335 272 L 348 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- scan direction arrow (right to left) above buildings -->
  <path d="M 320 100 L 80 100" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="92" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">从右向左扫描，维护 maxRight</text>

  <!-- verdict markers -->
  <text x="97" y="345" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="167" y="345" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="237" y="345" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="307" y="345" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- divider -->
  <path d="M 40 362 L 530 362" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- comparison table: i / h[i] / maxRight / verdict -->
  <text x="40" y="384" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">逐位置判定：</text>

  <g font-size="11.5" fill="#333" text-anchor="middle">
    <!-- header -->
    <text x="110" y="384" fill="#888" filter="url(#rough2)">i</text>
    <text x="170" y="384" fill="#888" filter="url(#rough2)">h[i]</text>
    <text x="240" y="384" fill="#888" filter="url(#rough2)">右侧最大 maxRight</text>
    <text x="350" y="384" fill="#888" filter="url(#rough2)">比较</text>
    <text x="430" y="384" fill="#888" filter="url(#rough2)">能否看海</text>

    <!-- row 0 -->
    <text x="110" y="404" filter="url(#rough2)">0</text>
    <text x="170" y="404" filter="url(#rough2)">4</text>
    <text x="240" y="404" filter="url(#rough2)">3</text>
    <text x="350" y="404" filter="url(#rough2)">4 &gt; 3</text>
    <text x="430" y="404" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 入选</text>

    <!-- row 1 -->
    <text x="110" y="422" filter="url(#rough2)">1</text>
    <text x="170" y="422" filter="url(#rough2)">2</text>
    <text x="240" y="422" filter="url(#rough2)">3</text>
    <text x="350" y="422" fill="#b85450" filter="url(#rough2)">2 ≯ 3</text>
    <text x="430" y="422" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 被挡</text>
  </g>
</svg>
