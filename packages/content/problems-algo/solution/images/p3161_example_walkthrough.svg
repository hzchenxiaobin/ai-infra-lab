<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：两次插入各只动一段区间</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#888">queries = [[1,7],[2,7,6],[1,2],[2,7,5],[2,7,6]] → results = [true, true, false]</text>

  <!-- header -->
  <text x="68" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">操作</text>
  <text x="268" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">d[1..7]</text>
  <text x="462" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">判定</text>

  <!-- row 0: [1,7] -->
  <rect x="16" y="80" width="104" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[1,7] 放障碍</text>
  <g font-size="11">
    <rect x="128" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="148" y="105" text-anchor="middle" fill="#555">1</text>
    <rect x="168" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="188" y="105" text-anchor="middle" fill="#555">2</text>
    <rect x="208" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="228" y="105" text-anchor="middle" fill="#555">3</text>
    <rect x="248" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="268" y="105" text-anchor="middle" fill="#555">4</text>
    <rect x="288" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="308" y="105" text-anchor="middle" fill="#555">5</text>
    <rect x="328" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="348" y="105" text-anchor="middle" fill="#555">6</text>
    <rect x="368" y="80" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="388" y="105" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
  </g>
  <text x="462" y="98" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">区间 [8,n]</text>
  <text x="462" y="112" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">整体 −7</text>

  <!-- row 1: [2,7,6] -->
  <rect x="16" y="122" width="104" height="40" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="146" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">[2,7,6] 查询</text>
  <g font-size="11">
    <rect x="128" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="148" y="147" text-anchor="middle" fill="#555">1</text>
    <rect x="168" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="188" y="147" text-anchor="middle" fill="#555">2</text>
    <rect x="208" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="228" y="147" text-anchor="middle" fill="#555">3</text>
    <rect x="248" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="268" y="147" text-anchor="middle" fill="#555">4</text>
    <rect x="288" y="122" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="308" y="147" text-anchor="middle" fill="#555">5</text>
    <rect x="328" y="122" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="348" y="147" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="368" y="122" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="388" y="147" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
  </g>
  <text x="462" y="138" text-anchor="middle" font-size="9" fill="#555">max d[6..7]=7</text>
  <text x="462" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7 ≥ 6 → true</text>

  <!-- row 2: [1,2] -->
  <rect x="16" y="164" width="104" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="188" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[1,2] 放障碍</text>
  <g font-size="11">
    <rect x="128" y="164" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="148" y="189" text-anchor="middle" fill="#555">1</text>
    <rect x="168" y="164" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="188" y="189" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="208" y="164" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="228" y="189" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="248" y="164" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="268" y="189" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="288" y="164" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="308" y="189" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="328" y="164" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="348" y="189" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="368" y="164" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="388" y="189" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>
  <text x="462" y="182" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">区间 [3,7]</text>
  <text x="462" y="196" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">整体 −2</text>

  <!-- row 3: [2,7,5] -->
  <rect x="16" y="206" width="104" height="40" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="230" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">[2,7,5] 查询</text>
  <g font-size="11">
    <rect x="128" y="206" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="148" y="231" text-anchor="middle" fill="#555">1</text>
    <rect x="168" y="206" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="188" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="208" y="206" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="228" y="231" text-anchor="middle" fill="#555">1</text>
    <rect x="248" y="206" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="268" y="231" text-anchor="middle" fill="#555">2</text>
    <rect x="288" y="206" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="308" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="328" y="206" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="348" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="368" y="206" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="388" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>
  <text x="462" y="222" text-anchor="middle" font-size="9" fill="#555">max d[5..7]=5</text>
  <text x="462" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5 ≥ 5 → true</text>

  <!-- row 4: [2,7,6] -->
  <rect x="16" y="248" width="104" height="40" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="272" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">[2,7,6] 查询</text>
  <g font-size="11">
    <rect x="128" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="148" y="273" text-anchor="middle" fill="#555">1</text>
    <rect x="168" y="248" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="188" y="273" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="208" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="228" y="273" text-anchor="middle" fill="#555">1</text>
    <rect x="248" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="268" y="273" text-anchor="middle" fill="#555">2</text>
    <rect x="288" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="308" y="273" text-anchor="middle" fill="#555">3</text>
    <rect x="328" y="248" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="348" y="273" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="368" y="248" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/><text x="388" y="273" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>
  <text x="462" y="264" text-anchor="middle" font-size="9" fill="#555">max d[6..7]=5</text>
  <text x="462" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5 &lt; 6 → false</text>

  <!-- bottom note -->
  <rect x="40" y="306" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">物块视角：插入 2 之前最长可用段是 [0,7]，长 6 的物块放 [1,7]（右端贴障碍 7）没问题；</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#446688">插入 2 之后右段只剩 [2,7] 长 5、左段 [0,2] 长 2 —— 长 6 的物块再也放不下 → false</text>
</svg>
