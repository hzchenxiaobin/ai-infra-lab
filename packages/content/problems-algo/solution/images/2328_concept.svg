<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="118" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#333" filter="url(#rough2)">网格 → 有向无环图 (DAG)</text>

  <!-- 左侧：2x2 网格 -->
  <!-- (0,0)=1 -->
  <rect x="70" y="100" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="95" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#446688" filter="url(#rough2)">1</text>
  <text x="95" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(0,0)</text>

  <!-- (0,1)=1 -->
  <rect x="134" y="100" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="159" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#446688" filter="url(#rough2)">1</text>
  <text x="159" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(0,1)</text>

  <!-- (1,0)=3 -->
  <rect x="70" y="164" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="95" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="95" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(1,0)</text>

  <!-- (1,1)=4 -->
  <rect x="134" y="164" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="159" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="159" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(1,1)</text>

  <!-- 有向边：小 → 大 -->
  <path d="M95,150 L95,164" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="161" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">1→3</text>

  <path d="M120,189 L134,189" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="127" y="181" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3→4</text>

  <path d="M159,150 L159,164" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="161" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">1→4</text>

  <!-- 相等无边 -->
  <path d="M120,125 L134,125" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="127" y="118" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">值相等 ✗</text>

  <!-- 右侧：公式说明框 -->
  <rect x="248" y="92" width="248" height="178" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="372" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#4a7a3a" filter="url(#rough2)">递增路径计数 = DAG 路径计数</text>

  <text x="262" y="148" font-size="12" fill="#333" filter="url(#rough2)">• 每个格子 = 一个节点</text>
  <text x="262" y="170" font-size="12" fill="#333" filter="url(#rough2)">• 相邻且值小→大 = 一条有向边</text>
  <text x="262" y="192" font-size="12" fill="#333" filter="url(#rough2)">• 严格递增 ⇒ 不可能成环</text>
  <text x="262" y="210" font-size="11" fill="#888" filter="url(#rough2)">&#160;&#160;（含相等值也不构成边）</text>

  <text x="262" y="236" font-size="12" fill="#333" filter="url(#rough2)">dp[i][j]：以 (i,j) 为起点</text>
  <text x="270" y="252" font-size="11" fill="#446688" filter="url(#rough2)">= 1 + Σ dp(nb), grid[nb]&gt;grid[i][j]</text>
  <text x="262" y="266" font-size="11" fill="#888" filter="url(#rough2)">&#160;&#160;（1 = 只含自身的长度1路径）</text>

  <text x="372" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#b85450" filter="url(#rough2)">答案 = Σ dp[i][j]  (mod 10⁹+7)</text>

  <!-- 连接箭头：网格 → 公式框 -->
  <path d="M196,170 L246,150" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
