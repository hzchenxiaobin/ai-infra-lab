<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">轮胎耗时指数增长 → 超过阈值时换胎更划算</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">示例轮胎 f=2, r=3 ；changeTime=5, min_fi=2 ⇒ 阈值=7</text>

  <!-- ===== Lap boxes row ===== -->
  <!-- Lap 1 -->
  <rect x="44" y="74" width="74" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="81" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 1 圈</text>
  <text x="81" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2s</text>
  <text x="81" y="64" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 继续用</text>

  <!-- arrow ×3 -->
  <path d="M 120 97 L 150 97" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="90" text-anchor="middle" font-size="10" fill="#888">×3</text>

  <!-- Lap 2 -->
  <rect x="154" y="74" width="74" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="191" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 圈</text>
  <text x="191" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6s</text>
  <text x="191" y="64" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 仍划算</text>

  <!-- arrow ×3 -->
  <path d="M 230 97 L 260 97" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="245" y="90" text-anchor="middle" font-size="10" fill="#b85450">×3</text>

  <!-- Lap 3 -->
  <rect x="264" y="74" width="74" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="301" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 3 圈</text>
  <text x="301" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">18s</text>
  <text x="301" y="64" text-anchor="middle" font-size="9" fill="#b85450">✗ 太贵！</text>

  <!-- arrow ×3 -->
  <path d="M 340 97 L 370 97" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="355" y="90" text-anchor="middle" font-size="10" fill="#b85450">×3</text>

  <!-- Lap 4 -->
  <rect x="374" y="74" width="74" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="411" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 4 圈</text>
  <text x="411" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">54s</text>

  <!-- ===== Threshold annotation ===== -->
  <rect x="460" y="74" width="86" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="503" y="90" text-anchor="middle" font-size="10" fill="#666">阈值</text>
  <text x="503" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">= 5 + 2</text>
  <text x="503" y="120" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">= 7</text>

  <!-- threshold dashed line between lap2 and lap3 -->
  <line x1="252" y1="66" x2="252" y2="128" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="252" y="138" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">阈值线</text>

  <!-- ===== Comparison: continue vs change ===== -->
  <text x="40" y="170" font-size="12" fill="#555" font-weight="bold">第 3 圈两种选择：</text>

  <!-- continue with same tire -->
  <rect x="44" y="184" width="200" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="144" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">继续用旧胎</text>
  <text x="144" y="224" text-anchor="middle" font-size="12" fill="#444">第3圈耗时 = 18s</text>
  <text x="144" y="240" text-anchor="middle" font-size="11" fill="#b85450">↑ 超过阈值 7</text>

  <!-- vs -->
  <text x="262" y="220" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">vs</text>

  <!-- change tire -->
  <rect x="284" y="184" width="232" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">换新胎再跑 1 圈</text>
  <text x="400" y="224" text-anchor="middle" font-size="12" fill="#444">换胎 5s + 新胎第1圈 2s = 7s</text>
  <text x="400" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a">✓ 7 &lt; 18，换更划算</text>

  <!-- arrow from "continue" down to "change" showing preference -->
  <path d="M 244 216 L 282 216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom insight ===== -->
  <rect x="44" y="276" width="472" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">关键推论</text>
  <text x="60" y="322" font-size="11" fill="#444">• 第 x 圈耗时 = fi · ri^(x−1)，因 ri ≥ 2，每圈至少翻倍 → 指数增长</text>
  <text x="60" y="342" font-size="11" fill="#444">• 当某圈耗时 ≥ changeTime + min_fi 时，换胎 + 跑一圈新胎更便宜，该圈必不保留</text>
  <text x="60" y="362" font-size="11" fill="#444">• 2^17 = 131072 &lt; 2×10⁵ ≤ changeTime+min_fi，故单段连续圈数至多约 18 圈</text>
  <text x="60" y="380" font-size="11" fill="#b85450" font-weight="bold">⇒ 预计算短段最优 minLap[x]，再 DP 组段即可！</text>
</svg>
