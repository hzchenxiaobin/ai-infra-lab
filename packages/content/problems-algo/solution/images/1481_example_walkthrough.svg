<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：arr = [4,3,1,1,3,3,2]，k = 3</text>

  <!-- intro line -->
  <text x="40" y="50" font-size="11" fill="#555">频次升序：整数 4(1) → 2(1) → 1(2) → 3(3)，逐桶尝试删除</text>

  <!-- Table header row -->
  <rect x="40" y="62" width="540" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <text x="130" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">当前桶</text>
  <text x="200" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">频次</text>
  <text x="278" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k 变化</text>
  <text x="372" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <text x="500" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">剩余种类</text>

  <!-- vertical separators -->
  <path d="M 100 62 L 100 232 M 160 62 L 160 232 M 240 62 L 240 232 M 332 62 L 332 232 M 440 62 L 440 232" stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 0: init -->
  <rect x="40" y="90" width="540" height="34" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="112" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="130" y="112" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="200" y="112" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="278" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="372" y="112" text-anchor="middle" font-size="11" fill="#555">初始</text>
  <text x="500" y="112" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">4</text>

  <!-- row 1: integer 4, freq 1, removed -->
  <rect x="40" y="124" width="540" height="34" rx="3" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="146" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="130" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">整数 4</text>
  <text x="200" y="146" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="278" y="146" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">3 → 2</text>
  <text x="372" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 整桶删</text>
  <text x="500" y="146" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>

  <!-- row 2: integer 2, freq 1, removed -->
  <rect x="40" y="158" width="540" height="34" rx="3" fill="#fce4ec" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="180" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="130" y="180" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">整数 2</text>
  <text x="200" y="180" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="278" y="180" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2 → 1</text>
  <text x="372" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 整桶删</text>
  <text x="500" y="180" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>

  <!-- row 3: integer 1, freq 2, cannot -->
  <rect x="40" y="192" width="540" height="34" rx="3" fill="#fff8e1" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="214" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="130" y="214" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">整数 1</text>
  <text x="200" y="214" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="278" y="214" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1 &lt; 2</text>
  <text x="372" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">✗ 停</text>
  <text x="500" y="214" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>

  <!-- Result -->
  <text x="310" y="252" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">结果：剩余 {1, 3} 两种 → 答案 = 2</text>

  <!-- color legend -->
  <rect x="120" y="266" width="18" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146" y="278" font-size="10.5" fill="#555">已整桶删除（种类 −1）</text>
  <rect x="330" y="266" width="18" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="356" y="278" font-size="10.5" fill="#555">预算不足，停止</text>

  <!-- footer note -->
  <rect x="60" y="294" width="500" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="314" text-anchor="middle" font-size="11" fill="#555">每删一个频次最小的桶，耗频次个名额、减少 1 种整数</text>
  <text x="310" y="332" text-anchor="middle" font-size="11" fill="#555">k 不够删下一桶时立即停止——部分删不减少种类数</text>
</svg>
