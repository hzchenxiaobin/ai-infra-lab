<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">状态机 DP：五状态滚动递推</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">每个元音一个状态，按后继规则反向累加</text>

  <!-- ===== Left: four steps ===== -->
  <g font-size="10" fill="#333">
    <!-- ① 状态定义 -->
    <rect x="36" y="66" width="236" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 状态定义</text>
    <text x="154" y="104" text-anchor="middle" font-size="10" fill="#555">dp[v] = 长度 k、末位为 v 的串数</text>

    <path d="M 154 120 L 154 134" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- ② 转移方程（反向：谁贡献给我） -->
    <rect x="36" y="136" width="236" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 转移方程（反向累加）</text>
    <text x="52" y="176" font-family="monospace" font-size="11" fill="#333">a ← e + i + u</text>
    <text x="52" y="192" font-family="monospace" font-size="11" fill="#333">e ← a + i</text>
    <text x="52" y="208" font-family="monospace" font-size="11" fill="#333">i ← e + o</text>
    <text x="52" y="224" font-family="monospace" font-size="11" fill="#333">o ← i</text>
    <text x="52" y="240" font-family="monospace" font-size="11" fill="#333">u ← i + o</text>

    <path d="M 154 256 L 154 270" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- ③ 初始条件 -->
    <rect x="36" y="272" width="236" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="292" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 初始条件</text>
    <text x="154" y="310" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">dp[a]=dp[e]=dp[i]=dp[o]=dp[u]=1</text>

    <path d="M 154 326 L 154 340" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- ④ 计算顺序 -->
    <rect x="36" y="342" width="236" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 计算顺序</text>
    <text x="154" y="380" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">k = 2 → 3 → ... → n</text>
    <text x="154" y="394" text-anchor="middle" font-size="9" fill="#888">5 变量滚动，自底向上</text>
  </g>

  <!-- ===== Right: answer & rolling ===== -->
  <rect x="296" y="136" width="196" height="120" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="394" y="158" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">答案汇总</text>
  <text x="394" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">ans = (a+e+i+o+u)</text>
  <text x="394" y="196" text-anchor="middle" font-family="monospace" font-size="11" fill="#b85450" font-weight="bold">% (10⁹+7)</text>
  <text x="394" y="218" text-anchor="middle" font-size="9" fill="#888">每步取模防溢出</text>
  <text x="394" y="234" text-anchor="middle" font-size="9" fill="#888">long long 安全存中间值</text>

  <rect x="296" y="272" width="196" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="394" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">滚动数组 O(1) 空间</text>
  <text x="308" y="312" font-family="monospace" font-size="10" fill="#333">na = (e+i+u) % MOD;</text>
  <text x="308" y="328" font-family="monospace" font-size="10" fill="#333">ne = (a+i) % MOD;</text>
  <text x="308" y="344" font-family="monospace" font-size="10" fill="#333">ni = (e+o) % MOD;</text>
  <text x="308" y="360" font-family="monospace" font-size="10" fill="#333">no = i % MOD;</text>
  <text x="308" y="376" font-family="monospace" font-size="10" fill="#333">nu = (i+o) % MOD;</text>
  <text x="308" y="392" font-family="monospace" font-size="10" fill="#b85450">a,e,i,o,u = na,ne,ni,no,nu;</text>
</svg>
