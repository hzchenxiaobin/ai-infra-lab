<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一遍线性扫描维护最小完成时刻</text>

  <!-- 开始 -->
  <rect x="210" y="36" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="265" y="56" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M 265 64 L 265 80" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="185" y="84" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="265" y="105" text-anchor="middle" font-size="12.5" fill="#b3541e" filter="url(#rough2)">ans ← +∞，i ← 0</text>

  <path d="M 265 116 L 265 132" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：i < n ? -->
  <polygon points="265,136 340,170 265,204 190,170" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="176" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是 → 循环体 -->
  <text x="347" y="162" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 340 170 L 367 170" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="371" y="142" width="140" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="441" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f = s[i] + t[i]</text>
  <text x="441" y="183" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = min(ans, f)</text>
  <text x="441" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i ← i + 1</text>

  <!-- 回环：循环体 → 菱形左侧 -->
  <path d="M 441 206 L 441 228 L 66 228 L 66 170" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 66 170 L 183 170" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 否 → 返回 -->
  <text x="273" y="226" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 265 204 L 265 248" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="195" y="252" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="274" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 265 286 L 265 304" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="210" y="308" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="265" y="328" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">结束</text>

  <!-- 左下旁注：复杂度 -->
  <rect x="28" y="252" width="140" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="98" y="272" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">时间 O(n)</text>
  <text x="98" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">空间 O(1)</text>
</svg>
