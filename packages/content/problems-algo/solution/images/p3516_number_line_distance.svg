<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">同速竞速：谁离 z 更近，谁先到</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1：x = 2，y = 7，z = 4</text>

  <!-- 移动箭头 -->
  <path d="M 328 108 L 236 108" fill="none" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="282" y="97" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">走 3 步</text>
  <path d="M 152 130 L 204 130" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="178" y="120" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">走 2 步</text>

  <!-- 三个人 -->
  <text x="140" y="158" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第1人</text>
  <circle cx="140" cy="180" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <text x="220" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第3人 · 不动</text>
  <circle cx="220" cy="180" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="220" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>

  <text x="340" y="158" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">第2人</text>
  <circle cx="340" cy="180" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2</text>

  <!-- 数轴 -->
  <path d="M 56 214 L 444 214" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arrn)" filter="url(#rough2)"/>
  <line x1="60" y1="207" x2="60" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="100" y1="207" x2="100" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="140" y1="207" x2="140" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="180" y1="207" x2="180" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="220" y1="207" x2="220" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="260" y1="207" x2="260" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="300" y1="207" x2="300" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="340" y1="207" x2="340" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="380" y1="207" x2="380" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="420" y1="207" x2="420" y2="221" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="238" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="100" y="238" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="140" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="180" y="238" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="220" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
  <text x="300" y="238" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">6</text>
  <text x="340" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">7</text>
  <text x="380" y="238" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">8</text>
  <text x="420" y="238" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">9</text>

  <!-- 距离测量 -->
  <line x1="140" y1="246" x2="140" y2="262" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="220" y1="246" x2="220" y2="262" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="340" y1="246" x2="340" y2="262" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 144 254 L 216 254" fill="none" stroke="#446688" stroke-width="1.8" marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="180" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">d1 = |x−z| = 2</text>
  <path d="M 224 254 L 336 254" fill="none" stroke="#d6a040" stroke-width="1.8" marker-start="url(#arro)" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">d2 = |y−z| = 3</text>

  <!-- 结论 -->
  <rect x="100" y="290" width="320" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">d1 &lt; d2 ⇒ 返回 1：第 1 个人先到</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">绝对值是关键：x、y 可在 z 的任意一侧，路程 = 两点间距</text>
</svg>
