<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：k=1 ⇒ 松弛 2 轮（src=0, dst=3）</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">flights=[[0,1,100],[1,2,100],[2,0,100],[1,3,600],[2,3,200]]</text>

  <!-- index labels -->
  <text x="150" y="58" text-anchor="middle" font-size="9.5" fill="#888">[0]</text>
  <text x="234" y="58" text-anchor="middle" font-size="9.5" fill="#888">[1]</text>
  <text x="318" y="58" text-anchor="middle" font-size="9.5" fill="#888">[2]</text>
  <text x="402" y="58" text-anchor="middle" font-size="9.5" fill="#888">[3]</text>

  <!-- ===== Row 1: initial ===== -->
  <text x="40" y="84" font-size="12" fill="#555" font-weight="bold">初始</text>
  <rect x="110" y="66" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="150" y="116" text-anchor="middle" font-size="9" fill="#d6a040">源点</text>

  <rect x="194" y="66" width="80" height="38" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="234" y="91" text-anchor="middle" font-size="13" fill="#aaa">∞</text>
  <rect x="278" y="66" width="80" height="38" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="318" y="91" text-anchor="middle" font-size="13" fill="#aaa">∞</text>
  <rect x="362" y="66" width="80" height="38" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="402" y="91" text-anchor="middle" font-size="13" fill="#aaa">∞</text>

  <!-- arrow row1[0] -> row2[1] -->
  <path d="M 158 106 Q 196 122 226 142" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="128" font-size="10" fill="#d6a040" font-weight="bold">0→1</text>
  <text x="180" y="140" font-size="9" fill="#d6a040">+100</text>

  <!-- ===== Row 2: round 1 ===== -->
  <text x="40" y="164" font-size="12" fill="#555" font-weight="bold">第 1 轮</text>
  <text x="40" y="178" font-size="9" fill="#888">prev=初始</text>
  <rect x="110" y="146" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="171" text-anchor="middle" font-size="14" fill="#333">0</text>

  <rect x="194" y="146" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="171" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">100</text>
  <text x="234" y="196" text-anchor="middle" font-size="9" fill="#d6a040">新写入</text>

  <rect x="278" y="146" width="80" height="38" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="318" y="171" text-anchor="middle" font-size="13" fill="#aaa">∞</text>
  <rect x="362" y="146" width="80" height="38" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="402" y="171" text-anchor="middle" font-size="13" fill="#aaa">∞</text>

  <!-- arrow row2[1] -> row3[2] -->
  <path d="M 242 186 Q 280 202 310 222" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="262" y="208" font-size="10" fill="#d6a040" font-weight="bold">1→2</text>
  <text x="262" y="220" font-size="9" fill="#d6a040">+100</text>

  <!-- arrow row2[1] -> row3[3] -->
  <path d="M 242 186 Q 322 202 394 222" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="208" font-size="10" fill="#d6a040" font-weight="bold">1→3</text>
  <text x="330" y="220" font-size="9" fill="#d6a040">+600</text>

  <!-- ===== Row 3: round 2 ===== -->
  <text x="40" y="244" font-size="12" fill="#555" font-weight="bold">第 2 轮</text>
  <text x="40" y="258" font-size="9" fill="#888">prev=第1轮</text>
  <rect x="110" y="226" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="251" text-anchor="middle" font-size="14" fill="#333">0</text>

  <rect x="194" y="226" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="234" y="251" text-anchor="middle" font-size="14" fill="#333">100</text>

  <rect x="278" y="226" width="80" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="251" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">200</text>
  <text x="318" y="276" text-anchor="middle" font-size="9" fill="#d6a040">新写入</text>

  <rect x="362" y="226" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="251" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">700</text>
  <text x="402" y="276" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">= 答案</text>

  <!-- Result box -->
  <rect x="110" y="296" width="332" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="276" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dist[dst] = dist[3] = 700 ⇒ 返回 700</text>

  <!-- Forbidden note -->
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 0→1→2→3 = 400（3 条边 &gt; k+1=2，越限）</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#888">第 2 轮中 2→3 读 prev[2]=∞（而非新 dist[2]=200）⇒ 该路径被正确排除</text>
</svg>
