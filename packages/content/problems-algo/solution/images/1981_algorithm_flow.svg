<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">DP 流程：逐行更新可达和集合</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">cap = target + 70，超出 cap 的和即时丢弃</text>

  <!-- Step 1: Init -->
  <rect x="200" y="64" width="200" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp = {0}   （初始可达和）</text>

  <!-- Arrow -->
  <path d="M 300 102 L 300 116" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="312" y="113" font-size="10" fill="#888">处理 row[0]</text>

  <!-- Step 2: transition rule -->
  <rect x="120" y="122" width="360" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="142" text-anchor="middle" font-size="11" fill="#555">对每个 s ∈ dp，每个 v ∈ row[i]（去重排序）:</text>
  <text x="300" y="160" text-anchor="middle" font-size="11" fill="#555">若 s + v ≤ cap → 加入新 dp；否则 break（v 有序，后续更大）</text>

  <!-- Arrow -->
  <path d="M 300 176 L 300 190" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="312" y="187" font-size="10" fill="#888">处理 row[1]</text>

  <!-- Step 3: after row 1 -->
  <rect x="160" y="196" width="280" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp = {5, 6, 7, 8, 9}</text>

  <!-- Arrow -->
  <path d="M 300 234 L 300 248" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="312" y="245" font-size="10" fill="#888">…处理剩余行…</text>

  <!-- Step 4: after row 2 -->
  <rect x="140" y="254" width="320" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="276" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp = {12, 13, 14, 15, 16, 17, 18}</text>

  <!-- Arrow -->
  <path d="M 300 292 L 300 306" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="170" y="312" width="260" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="335" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">answer = min |s − target|</text>

  <!-- Cap note -->
  <rect x="40" y="362" width="520" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="382" font-size="11" fill="#b85450" font-weight="bold">⚠️ 封顶关键：部分和一旦 &gt; cap，后续只增不减（元素全正），最终和必 &gt; cap → 非最优</text>
  <text x="60" y="399" font-size="10" fill="#888">每行去重减少内层循环；行内排序后 s+v &gt; cap 可 break，进一步剪枝</text>
</svg>
