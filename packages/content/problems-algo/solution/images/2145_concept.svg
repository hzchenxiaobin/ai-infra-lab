<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：hidden = x + pref[i]，约束化为 x 的区间求交</text>

  <!-- ===== Row 1: hidden sequence parameterized by x ===== -->
  <text x="34" y="56" font-size="11.5" fill="#555" font-weight="bold">隐藏数组（由首项 x 参数化，示例 differences=[1,-3,4]）：</text>

  <!-- hidden[0] -->
  <rect x="50" y="68" width="100" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="86" text-anchor="middle" font-size="10.5" fill="#888">hidden[0]</text>
  <text x="100" y="104" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">x</text>

  <!-- diff arrow +1 -->
  <path d="M 152 91 L 196 91" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="174" y="84" text-anchor="middle" font-size="9.5" fill="#888">+1</text>

  <!-- hidden[1] -->
  <rect x="200" y="68" width="100" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="250" y="86" text-anchor="middle" font-size="10.5" fill="#888">hidden[1]</text>
  <text x="250" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x + 1</text>

  <!-- diff arrow -3 -->
  <path d="M 302 91 L 346 91" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="324" y="84" text-anchor="middle" font-size="9.5" fill="#888">-3</text>

  <!-- hidden[2] -->
  <rect x="350" y="68" width="100" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="86" text-anchor="middle" font-size="10.5" fill="#888">hidden[2]</text>
  <text x="400" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x - 2</text>

  <!-- diff arrow +4 -->
  <path d="M 452 91 L 496 91" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="474" y="84" text-anchor="middle" font-size="9.5" fill="#888">+4</text>

  <!-- hidden[3] -->
  <rect x="500" y="68" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="530" y="86" text-anchor="middle" font-size="10" fill="#888">hidden[3]</text>
  <text x="530" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x + 2</text>

  <!-- pref row label -->
  <text x="34" y="132" font-size="10.5" fill="#888" font-family="'Comic Sans MS', monospace">pref[i]：      0       1      -2       2</text>

  <!-- Divider -->
  <path d="M 34 144 L 546 144" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Row 2: each constraint -> an interval for x ===== -->
  <text x="290" y="164" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">把「hidden[i] ∈ [1, 6]」改写成「x 的允许区间」</text>

  <!-- constraint rows -->
  <rect x="40" y="176" width="500" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="191" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">i</text>
  <text x="170" y="191" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">约束 hidden[i] ∈ [1,6]</text>
  <text x="330" y="191" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">等价于 x 的区间</text>
  <text x="470" y="191" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">区间</text>

  <!-- i=0 -->
  <rect x="40" y="200" width="500" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="215" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <text x="170" y="215" text-anchor="middle" font-size="10.5" fill="#333">x ∈ [1, 6]</text>
  <text x="330" y="215" text-anchor="middle" font-size="10.5" fill="#888">[1-0, 6-0]</text>
  <text x="470" y="215" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[1, 6]</text>

  <!-- i=1 -->
  <rect x="40" y="224" width="500" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="239" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="170" y="239" text-anchor="middle" font-size="10.5" fill="#333">x+1 ∈ [1, 6]</text>
  <text x="330" y="239" text-anchor="middle" font-size="10.5" fill="#888">[1-1, 6-1]</text>
  <text x="470" y="239" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[0, 5]</text>

  <!-- i=2 -->
  <rect x="40" y="248" width="500" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="263" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="170" y="263" text-anchor="middle" font-size="10.5" fill="#333">x-2 ∈ [1, 6]</text>
  <text x="330" y="263" text-anchor="middle" font-size="10.5" fill="#888">[1-(-2), 6-(-2)]</text>
  <text x="470" y="263" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[3, 8]</text>

  <!-- i=3 -->
  <rect x="40" y="272" width="500" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="287" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <text x="170" y="287" text-anchor="middle" font-size="10.5" fill="#333">x+2 ∈ [1, 6]</text>
  <text x="330" y="287" text-anchor="middle" font-size="10.5" fill="#888">[1-2, 6-2]</text>
  <text x="470" y="287" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[-1, 4]</text>

  <!-- Divider -->
  <path d="M 34 300 L 546 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Row 3: number line with overlapping intervals ===== -->
  <text x="290" y="320" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">数轴上求所有区间的交集</text>

  <!-- number line -->
  <path d="M 60 360 L 520 360" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- ticks -1..8 -->
  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <path d="M 90 356 L 90 364" stroke="#888" stroke-width="1.2"/><text x="90" y="378">-1</text>
    <path d="M 140 356 L 140 364" stroke="#888" stroke-width="1.2"/><text x="140" y="378">0</text>
    <path d="M 190 356 L 190 364" stroke="#888" stroke-width="1.2"/><text x="190" y="378">1</text>
    <path d="M 240 356 L 240 364" stroke="#888" stroke-width="1.2"/><text x="240" y="378">2</text>
    <path d="M 290 356 L 290 364" stroke="#888" stroke-width="1.2"/><text x="290" y="378">3</text>
    <path d="M 340 356 L 340 364" stroke="#888" stroke-width="1.2"/><text x="340" y="378">4</text>
    <path d="M 390 356 L 390 364" stroke="#888" stroke-width="1.2"/><text x="390" y="378">5</text>
    <path d="M 440 356 L 440 364" stroke="#888" stroke-width="1.2"/><text x="440" y="378">6</text>
    <path d="M 490 356 L 490 364" stroke="#888" stroke-width="1.2"/><text x="490" y="378">7</text>
    <path d="M 515 356 L 515 364" stroke="#888" stroke-width="1.2"/><text x="515" y="378">8</text>
  </g>

  <!-- interval bars (each 5 units wide = 250px, since 1 unit = 50px, tick 1 at x=190 means -1 at 140... wait recompute) -->
  <!-- mapping: value v -> x = 140 + v*50. So [-1,4] -> [90, 340]; [0,5]->[140,390]; [1,6]->[190,440]; [3,8]->[290,515] -->

  <!-- i=0: [1,6] -->
  <rect x="190" y="332" width="250" height="10" fill="#446688" opacity="0.25" rx="2" filter="url(#rough2)"/>
  <text x="64" y="340" font-size="9" fill="#446688">i=0</text>
  <!-- i=1: [0,5] -->
  <rect x="140" y="344" width="250" height="10" fill="#4a7a3a" opacity="0.25" rx="2" filter="url(#rough2)"/>
  <text x="64" y="352" font-size="9" fill="#4a7a3a">i=1</text>
  <!-- i=2: [3,8] -->
  <rect x="290" y="356" width="225" height="10" fill="#d6a040" opacity="0.3" rx="2" filter="url(#rough2)"/>
  <text x="64" y="364" font-size="9" fill="#d6a040">i=2</text>
  <!-- i=3: [-1,4] -->
  <rect x="90" y="368" width="250" height="10" fill="#888" opacity="0.25" rx="2" filter="url(#rough2)"/>
  <text x="64" y="376" font-size="9" fill="#888">i=3</text>

  <!-- intersection highlight [3,4] -> [290, 340] -->
  <rect x="290" y="392" width="50" height="14" fill="#b85450" opacity="0.85" rx="3" filter="url(#rough2)"/>
  <path d="M 290 388 L 290 392 M 340 388 L 340 392" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">交集 x ∈ [3, 4]</text>

  <!-- formula box -->
  <rect x="380" y="392" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="409" text-anchor="middle" font-size="10" fill="#555">lo = lower - minPref = 3</text>
  <text x="460" y="424" text-anchor="middle" font-size="10" fill="#555">hi = upper - maxPref = 4</text>

  <!-- bottom hint -->
  <text x="290" y="432" text-anchor="middle" font-size="10" fill="#888">所有区间等宽 → 交集 = [lower-minPref, upper-maxPref]，ans = hi-lo+1 = 2</text>
</svg>
