<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：stones = [3,5,1,2,6], K = 3</text>

  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前缀和 prefix = [0, 3, 8, 9, 11, 17]，K−1 = 2</text>

  <text x="40" y="76" font-size="11" fill="#888" filter="url(#rough2)">下标 →</text>
  <text x="92" y="76" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="142" y="76" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="192" y="76" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="242" y="76" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="292" y="76" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="40" y="104" font-size="11" fill="#888" filter="url(#rough2)">stones</text>
  <rect x="72" y="86" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="122" y="86" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="172" y="86" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="222" y="86" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="272" y="86" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="300" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp 表（上三角，按长度 len 递增填充）</text>

  <text x="40" y="166" font-size="10" fill="#888" filter="url(#rough2)">j→</text>
  <text x="44" y="184" font-size="10" fill="#888" filter="url(#rough2)">i↓</text>
  <text x="92" y="166" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="142" y="166" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="192" y="166" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="242" y="166" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="292" y="166" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <text x="60" y="186" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="72" y="172" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="191" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="122" y="172" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="172" y="172" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="191" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="222" y="172" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="272" y="172" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="292" y="191" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">25</text>

  <text x="60" y="216" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <rect x="122" y="202" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="142" y="221" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="172" y="202" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="221" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="222" y="202" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>

  <text x="60" y="246" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <rect x="172" y="232" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="192" y="251" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="222" y="232" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="242" y="251" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="60" y="276" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <rect x="222" y="262" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="281" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <text x="60" y="306" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <rect x="272" y="292" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="292" y="311" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <rect x="360" y="172" width="220" height="180" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="470" y="192" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">图例</text>

  <rect x="376" y="204" width="22" height="18" rx="3" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="408" y="218" font-size="10" fill="#555" filter="url(#rough2)">len=1，dp[i][i]=0</text>

  <rect x="376" y="232" width="22" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="246" font-size="10" fill="#555" filter="url(#rough2)">纯拼接，不加 sum</text>

  <rect x="376" y="260" width="22" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="274" font-size="10" fill="#555" filter="url(#rough2)">触发合并 +sum(i..j)</text>

  <rect x="376" y="288" width="22" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="408" y="302" font-size="10" fill="#555" filter="url(#rough2)">答案 dp[0][4]=25</text>

  <rect x="40" y="368" width="540" height="142" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="390" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键计算（K−1=2，步长 2）：</text>

  <text x="60" y="410" font-size="11" fill="#333" filter="url(#rough2)">len=3, [0,2]：k=0 → dp[0][0]+dp[1][2]=0+0=0，+sum=9 → dp=9 ✓</text>
  <text x="60" y="428" font-size="11" fill="#333" filter="url(#rough2)">len=4, [0,3]：k=0→dp[0][0]+dp[1][3]=8；k=2→dp[0][2]+dp[3][3]=9 → min=8</text>
  <text x="60" y="446" font-size="11" fill="#333" filter="url(#rough2)">len=4, [1,4]：k=1→dp[1][1]+dp[2][4]=9；k=3→dp[1][3]+dp[4][4]=8 → min=8</text>
  <text x="60" y="464" font-size="11" fill="#333" filter="url(#rough2)">len=5, [0,4]：k=0→dp[0][0]+dp[1][4]=8；k=2→dp[0][2]+dp[3][4]=9 → min=8</text>
  <text x="60" y="486" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">(5−1)%2==0 → +sum(0..4)=17 → dp[0][4] = 8+17 = 25 ✓</text>
</svg>
