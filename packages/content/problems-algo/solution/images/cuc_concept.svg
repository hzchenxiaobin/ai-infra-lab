<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：字符 c 在 s[i] 的贡献 = 它在其中"唯一出现"的子串数</text>

  <!-- string cells: A B C A D E A, positions 0..6 -->
  <!-- pos 0: A (prev) -->
  <rect x="85" y="70" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">A</text>
  <text x="110" y="128" text-anchor="middle" font-size="10" fill="#b85450">prev=0</text>

  <!-- pos 1: B -->
  <rect x="135" y="70" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="96" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">B</text>

  <!-- pos 2: C -->
  <rect x="185" y="70" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="96" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">C</text>

  <!-- pos 3: A (current i) -->
  <rect x="235" y="70" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">A</text>
  <text x="260" y="128" text-anchor="middle" font-size="10" fill="#d6a040">i=3</text>

  <!-- pos 4: D -->
  <rect x="285" y="70" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="96" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">D</text>

  <!-- pos 5: E -->
  <rect x="335" y="70" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="96" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">E</text>

  <!-- pos 6: A (next) -->
  <rect x="385" y="70" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="96" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">A</text>
  <text x="410" y="128" text-anchor="middle" font-size="10" fill="#b85450">next=6</text>

  <!-- left range bracket: (prev, i] = positions 1,2,3 -->
  <path d="M 137 150 L 137 160 L 285 160 L 285 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="211" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左界取值 (prev, i] → i−prev = 3 种</text>

  <!-- right range bracket: [i, next) = positions 3,4,5 -->
  <path d="M 237 196 L 237 206 L 383 206 L 383 196" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="310" y="222" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">右界取值 [i, next) → next−i = 3 种</text>

  <!-- formula box -->
  <rect x="50" y="244" width="420" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">s[i] 的贡献 = (i − prev) × (next − i)</text>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a">此例： (3 − 0) × (6 − 3) = 9 个子串中 A 唯一</text>

  <!-- why note -->
  <rect x="50" y="312" width="420" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#444">左界取在 (prev, i] 内 → 子串不含左边的 A</text>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#444">右界取在 [i, next) 内 → 子串不含右边的 A，故 s[i] 唯一</text>
</svg>
