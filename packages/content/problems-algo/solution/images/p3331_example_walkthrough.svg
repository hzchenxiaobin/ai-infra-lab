<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：parent ＝ [−1,0,4,0,1]，s ＝ "abbba"</text>

  <!-- ===== 事件表 ===== -->
  <!-- 表头 -->
  <rect x="50" y="40" width="125" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="175" y="40" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="265" y="40" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="355" y="40" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="57" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">事件</text>
  <text x="220" y="57" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">last['a']</text>
  <text x="310" y="57" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">last['b']</text>
  <text x="415" y="57" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">np 判定</text>

  <!-- 行 1：进入 0 -->
  <rect x="50" y="66" width="125" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="66" width="90" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="265" y="66" width="90" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="66" width="120" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="82" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">进入 0（'a'）</text>
  <text x="220" y="82" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">− → 0</text>
  <text x="310" y="82" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">−</text>
  <text x="415" y="82" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">根，不改挂</text>

  <!-- 行 2：进入 1 -->
  <rect x="50" y="91" width="125" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="91" width="90" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="265" y="91" width="90" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="91" width="120" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="107" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">进入 1（'b'）</text>
  <text x="220" y="107" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="310" y="107" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">− → 1</text>
  <text x="415" y="107" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">无 'b' 祖先，不改</text>

  <!-- 行 3：进入 4（高亮） -->
  <rect x="50" y="116" width="125" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="116" width="90" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="265" y="116" width="90" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="116" width="120" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="112" y="132" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">进入 4（'a'）</text>
  <text x="220" y="132" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">0 → 4</text>
  <text x="310" y="132" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="415" y="132" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">np[4] ＝ 0 ✓</text>

  <!-- 行 4：进入 2（高亮） -->
  <rect x="50" y="141" width="125" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="141" width="90" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="265" y="141" width="90" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="141" width="120" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="112" y="157" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">进入 2（'b'）</text>
  <text x="220" y="157" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="310" y="157" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">1 → 2</text>
  <text x="415" y="157" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">np[2] ＝ 1 ✓</text>

  <!-- 行 5：退出还原 -->
  <rect x="50" y="166" width="125" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="166" width="90" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="265" y="166" width="90" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="166" width="120" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="182" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">退出 2 / 4 / 1</text>
  <text x="220" y="182" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">4 → 0</text>
  <text x="310" y="182" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">2 → 1 → −</text>
  <text x="415" y="182" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">还原现场</text>

  <!-- 行 6：进入 3 -->
  <rect x="50" y="191" width="125" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="191" width="90" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="265" y="191" width="90" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="191" width="120" height="25" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="207" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">进入 3（'b'）</text>
  <text x="220" y="207" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="310" y="207" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">− → 3</text>
  <text x="415" y="207" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">无 'b' 祖先，不改</text>

  <!-- 行 7：退出收尾 -->
  <rect x="50" y="216" width="125" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="216" width="90" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="265" y="216" width="90" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="216" width="120" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="112" y="232" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">退出 3 / 0</text>
  <text x="220" y="232" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">0 → −</text>
  <text x="310" y="232" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">3 → −</text>
  <text x="415" y="232" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">还原现场</text>

  <text x="260" y="258" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">橙色列＝发生改挂的事件；「−」表示空（无该字符节点在路径上）</text>

  <!-- ===== preorder 框 ===== -->
  <rect x="50" y="272" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="291" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">preorder ＝ [0, 1, 4, 2, 3]</text>

  <!-- ===== 逆序累加框 ===== -->
  <rect x="50" y="312" width="425" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="262" y="330" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">逆序累加（初值全 1）：3 → sz[0]＋1 ＝ 2；2 → sz[1]＋1 ＝ 2；</text>
  <text x="262" y="346" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">4 → sz[0]＋1 ＝ 3；1 → sz[0]＋2 ＝ 5</text>

  <!-- ===== 答案框 ===== -->
  <rect x="50" y="366" width="425" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="262" y="384" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">answer ＝ [5, 2, 1, 1, 1] ✓</text>
</svg>
