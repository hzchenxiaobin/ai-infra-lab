<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：删除 key = 3</text>

  <!-- ===== 原始树 ===== -->
  <text x="150" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原始 BST</text>

  <!-- 节点 5 (root) -->
  <circle cx="150" cy="90" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="94" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- 节点 3 (待删) -->
  <line x1="140" y1="103" x2="115" y2="125" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="110" cy="135" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="139" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- 节点 6 -->
  <line x1="160" y1="103" x2="185" y2="125" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="190" cy="135" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="139" text-anchor="middle" font-size="10" fill="#333">6</text>

  <!-- 节点 2 -->
  <line x1="102" y1="148" x2="88" y2="170" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="85" cy="180" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="184" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 节点 4 (后继) -->
  <line x1="118" y1="148" x2="132" y2="170" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="135" cy="180" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="184" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <!-- 节点 7 -->
  <line x1="198" y1="148" x2="208" y2="170" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="212" cy="180" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="212" y="184" text-anchor="middle" font-size="10" fill="#333">7</text>

  <!-- 标注：待删节点 -->
  <path d="M 90 135 L 50 135" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="30" y="128" font-size="9" fill="#b85450" font-weight="bold">待删</text>
  <text x="30" y="140" font-size="9" fill="#b85450">key=3</text>

  <!-- 标注：后继 -->
  <path d="M 150 180 Q 180 165 175 150" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="180" y="155" font-size="9" fill="#d6a040">右子树最左</text>
  <text x="180" y="167" font-size="9" fill="#d6a040">= 后继 S</text>

  <!-- ===== 步骤说明 ===== -->
  <rect x="280" y="50" width="280" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="296" y="72" font-size="12" fill="#333" font-weight="bold">执行步骤：</text>

  <text x="296" y="94" font-size="10" fill="#446688">Step 1: 3 &lt; root(5)，向左走找到节点 3</text>
  <text x="296" y="114" font-size="10" fill="#b85450">Step 2: 节点 3 有两个孩子（2、4）→ 情况③</text>
  <text x="296" y="134" font-size="10" fill="#d6a040">Step 3: 找后继——右子树(4)的最左节点 = 4</text>
  <text x="296" y="154" font-size="10" fill="#d6a040">Step 4: root.val = succ.val ⇒ 3 变成 4</text>
  <text x="296" y="174" font-size="10" fill="#4a7a3a">Step 5: 在右子树递归删除 4（叶子→返回 null）</text>
  <text x="296" y="196" font-size="10" fill="#82b366">✓ 完成，返回修改后的 root</text>

  <!-- ===== 中间箭头 ===== -->
  <path d="M 150 210 L 150 240" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="230" font-size="10" fill="#888">删除后</text>

  <!-- ===== 结果树 ===== -->
  <text x="150" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">删除后 BST</text>

  <!-- 节点 5 (root) -->
  <circle cx="150" cy="290" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="294" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- 节点 4 (原3的位置，值已被替换) -->
  <line x1="140" y1="303" x2="115" y2="325" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="110" cy="335" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="339" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- 节点 6 -->
  <line x1="160" y1="303" x2="185" y2="325" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="190" cy="335" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="339" text-anchor="middle" font-size="10" fill="#333">6</text>

  <!-- 节点 2 (保留) -->
  <line x1="102" y1="348" x2="88" y2="370" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="85" cy="380" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="384" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 原节点4位置已删(虚线) -->
  <circle cx="135" cy="380" r="11" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="135" y="384" text-anchor="middle" font-size="9" fill="#bbb">✗</text>

  <!-- 节点 7 -->
  <line x1="198" y1="348" x2="208" y2="370" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="212" cy="380" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="212" y="384" text-anchor="middle" font-size="10" fill="#333">7</text>

  <!-- 标注：值被替换 -->
  <path d="M 90 335 L 50 335" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="328" font-size="9" fill="#4a7a3a" font-weight="bold">值已替换</text>
  <text x="30" y="340" font-size="9" fill="#4a7a3a">3 → 4</text>

  <!-- ===== 底部中序验证 ===== -->
  <rect x="40" y="415" width="500" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="438" font-size="11" fill="#333" font-weight="bold">中序验证（BST 性质保持）：</text>
  <text x="60" y="458" font-size="11" fill="#446688">删除前中序：[2, 3, 4, 5, 6, 7]  →  删除后中序：[2, 4, 5, 6, 7]</text>
  <text x="60" y="476" font-size="11" fill="#82b366">✓ 仍然严格递增，BST 性质未被破坏</text>
</svg>
