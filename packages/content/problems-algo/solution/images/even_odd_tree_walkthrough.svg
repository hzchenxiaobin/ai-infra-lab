<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [1,10,4,3,null,7,9,12,8,6,null,null,2] → true</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">BFS 逐层校验奇偶性 + 单调性，4 层全部通过</text>

  <!-- 表头 -->
  <g font-size="11" font-weight="bold">
    <rect x="20" y="58" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="40" y="74" text-anchor="middle" fill="#446688">层</text>
    <rect x="60" y="58" width="64" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="92" y="74" text-anchor="middle" fill="#446688">层号奇偶</text>
    <rect x="124" y="58" width="150" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="199" y="74" text-anchor="middle" fill="#446688">节点值（左→右）</text>
    <rect x="274" y="58" width="110" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="329" y="74" text-anchor="middle" fill="#446688">奇偶校验</text>
    <rect x="384" y="58" width="130" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="449" y="74" text-anchor="middle" fill="#446688">单调校验</text>
    <rect x="514" y="58" width="86" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="557" y="74" text-anchor="middle" fill="#446688">结果</text>
  </g>

  <!-- 行 L0 -->
  <g font-size="11">
    <text x="40" y="102" text-anchor="middle" fill="#555" font-weight="bold">L0</text>
    <text x="92" y="102" text-anchor="middle" fill="#4a7a3a">偶</text>
    <rect x="186" y="90" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="199" y="104" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="329" y="102" text-anchor="middle" fill="#4a7a3a">奇数 ✓</text>
    <text x="449" y="102" text-anchor="middle" fill="#4a7a3a">单点 ✓</text>
    <text x="557" y="102" text-anchor="middle" fill="#4a7a3a" font-weight="bold">pass</text>
  </g>

  <!-- 行 L1 -->
  <g font-size="11">
    <text x="40" y="130" text-anchor="middle" fill="#555" font-weight="bold">L1</text>
    <text x="92" y="130" text-anchor="middle" fill="#446688">奇</text>
    <rect x="166" y="118" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="179" y="132" text-anchor="middle" fill="#446688">10</text>
    <rect x="196" y="118" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="209" y="132" text-anchor="middle" fill="#446688">4</text>
    <text x="329" y="130" text-anchor="middle" fill="#446688">全偶 ✓</text>
    <text x="449" y="130" text-anchor="middle" fill="#446688">10 &gt; 4 递减 ✓</text>
    <text x="557" y="130" text-anchor="middle" fill="#446688" font-weight="bold">pass</text>
  </g>

  <!-- 行 L2 -->
  <g font-size="11">
    <text x="40" y="158" text-anchor="middle" fill="#555" font-weight="bold">L2</text>
    <text x="92" y="158" text-anchor="middle" fill="#4a7a3a">偶</text>
    <rect x="160" y="146" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="173" y="160" text-anchor="middle" fill="#4a7a3a">3</text>
    <rect x="190" y="146" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="203" y="160" text-anchor="middle" fill="#4a7a3a">7</text>
    <rect x="220" y="146" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="233" y="160" text-anchor="middle" fill="#4a7a3a">9</text>
    <text x="329" y="158" text-anchor="middle" fill="#4a7a3a">全奇 ✓</text>
    <text x="449" y="158" text-anchor="middle" fill="#4a7a3a">3&lt;7&lt;9 递增 ✓</text>
    <text x="557" y="158" text-anchor="middle" fill="#4a7a3a" font-weight="bold">pass</text>
  </g>

  <!-- 行 L3 -->
  <rect x="18" y="172" width="584" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)" opacity="0.5"/>
  <g font-size="11">
    <text x="40" y="190" text-anchor="middle" fill="#555" font-weight="bold">L3</text>
    <text x="92" y="190" text-anchor="middle" fill="#446688">奇</text>
    <rect x="148" y="178" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="161" y="192" text-anchor="middle" fill="#446688">12</text>
    <rect x="178" y="178" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="191" y="192" text-anchor="middle" fill="#446688">8</text>
    <rect x="208" y="178" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="221" y="192" text-anchor="middle" fill="#446688">6</text>
    <rect x="238" y="178" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="251" y="192" text-anchor="middle" fill="#446688">2</text>
    <text x="329" y="190" text-anchor="middle" fill="#446688">全偶 ✓</text>
    <text x="449" y="190" text-anchor="middle" fill="#446688">12&gt;8&gt;6&gt;2 递减 ✓</text>
    <text x="557" y="190" text-anchor="middle" fill="#446688" font-weight="bold">pass</text>
  </g>

  <!-- 最终结果 -->
  <rect x="160" y="212" width="300" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="233" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">4 层全部通过 → return true ✓</text>

  <!-- ===== 分隔线 ===== -->
  <line x1="40" y1="262" x2="580" y2="262" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="310" y="284" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">反例：root = [5,4,2,3,3,7] → false</text>
  <text x="310" y="302" text-anchor="middle" font-size="11" fill="#888">L2 出现 3 == 3，不满足「严格递增」</text>

  <!-- 反例表头 -->
  <g font-size="11" font-weight="bold">
    <rect x="20" y="316" width="40" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="40" y="332" text-anchor="middle" fill="#b85450">层</text>
    <rect x="60" y="316" width="64" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="92" y="332" text-anchor="middle" fill="#b85450">层号奇偶</text>
    <rect x="124" y="316" width="150" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="199" y="332" text-anchor="middle" fill="#b85450">节点值（左→右）</text>
    <rect x="274" y="316" width="110" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="329" y="332" text-anchor="middle" fill="#b85450">奇偶校验</text>
    <rect x="384" y="316" width="130" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="449" y="332" text-anchor="middle" fill="#b85450">单调校验</text>
    <rect x="514" y="316" width="86" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="557" y="332" text-anchor="middle" fill="#b85450">结果</text>
  </g>

  <!-- 反例 L0 -->
  <g font-size="11">
    <text x="40" y="360" text-anchor="middle" fill="#555" font-weight="bold">L0</text>
    <text x="92" y="360" text-anchor="middle" fill="#4a7a3a">偶</text>
    <rect x="186" y="348" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="199" y="362" text-anchor="middle" fill="#4a7a3a">5</text>
    <text x="329" y="360" text-anchor="middle" fill="#4a7a3a">奇数 ✓</text>
    <text x="449" y="360" text-anchor="middle" fill="#4a7a3a">单点 ✓</text>
    <text x="557" y="360" text-anchor="middle" fill="#4a7a3a" font-weight="bold">pass</text>
  </g>

  <!-- 反例 L1 -->
  <g font-size="11">
    <text x="40" y="388" text-anchor="middle" fill="#555" font-weight="bold">L1</text>
    <text x="92" y="388" text-anchor="middle" fill="#446688">奇</text>
    <rect x="176" y="376" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="189" y="390" text-anchor="middle" fill="#446688">4</text>
    <rect x="206" y="376" width="26" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="219" y="390" text-anchor="middle" fill="#446688">2</text>
    <text x="329" y="388" text-anchor="middle" fill="#446688">全偶 ✓</text>
    <text x="449" y="388" text-anchor="middle" fill="#446688">4&gt;2 递减 ✓</text>
    <text x="557" y="388" text-anchor="middle" fill="#446688" font-weight="bold">pass</text>
  </g>

  <!-- 反例 L2: 失败行 -->
  <rect x="18" y="400" width="584" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)" opacity="0.55"/>
  <g font-size="11">
    <text x="40" y="418" text-anchor="middle" fill="#b85450" font-weight="bold">L2</text>
    <text x="92" y="418" text-anchor="middle" fill="#4a7a3a">偶</text>
    <rect x="160" y="406" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="173" y="420" text-anchor="middle" fill="#4a7a3a">3</text>
    <rect x="190" y="406" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="203" y="420" text-anchor="middle" fill="#4a7a3a">3</text>
    <rect x="220" y="406" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="233" y="420" text-anchor="middle" fill="#4a7a3a">7</text>
    <text x="329" y="418" text-anchor="middle" fill="#4a7a3a">全奇 ✓</text>
    <text x="449" y="418" text-anchor="middle" fill="#b85450" font-weight="bold">3 == 3 ✗</text>
    <text x="557" y="418" text-anchor="middle" fill="#b85450" font-weight="bold">fail ✗</text>
  </g>

  <!-- 反例最终结果 -->
  <rect x="160" y="438" width="300" height="20" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="453" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L2 不满足严格递增 → return false ✗</text>
</svg>
