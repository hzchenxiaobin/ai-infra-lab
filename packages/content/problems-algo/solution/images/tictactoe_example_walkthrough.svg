<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#aaa" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：moves = [[0,0],[2,0],[1,1],[2,1],[2,2]]</text>

  <!-- 5 mini boards, each 78x78, cells 26x26, spacing 22 -->
  <!-- Board k origin: x = 40 + k*100, y = 50 -->

  <!-- ===== Board 0: step 0 (A) at (0,0) ===== -->
  <text x="79" y="44" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">步0 · A</text>
  <!-- grid -->
  <rect x="40" y="50" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="92" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="40" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="92" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="40" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="92" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- X at (0,0) -->
  <path d="M 46 56 L 60 70 M 60 56 L 46 70" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <text x="79" y="146" text-anchor="middle" font-size="9" fill="#888">(0,0)=X</text>

  <!-- ===== Board 1: step 1 (B) at (2,0) ===== -->
  <text x="179" y="44" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步1 · B</text>
  <rect x="140" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="166" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="192" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="140" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="166" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="192" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="140" y="102" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="166" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="192" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- X at (0,0) -->
  <path d="M 146 56 L 160 70 M 160 56 L 146 70" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <!-- O at (2,0) -->
  <ellipse cx="153" cy="115" rx="9" ry="9" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="179" y="146" text-anchor="middle" font-size="9" fill="#888">(2,0)=O</text>

  <!-- ===== Board 2: step 2 (A) at (1,1) ===== -->
  <text x="279" y="44" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">步2 · A</text>
  <rect x="240" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="292" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="76" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="292" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="266" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="292" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- X at (0,0), (1,1) -->
  <path d="M 246 56 L 260 70 M 260 56 L 246 70" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 272 82 L 286 96 M 286 82 L 272 96" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <!-- O at (2,0) -->
  <ellipse cx="253" cy="115" rx="9" ry="9" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="279" y="146" text-anchor="middle" font-size="9" fill="#888">(1,1)=X</text>

  <!-- ===== Board 3: step 3 (B) at (2,1) ===== -->
  <text x="379" y="44" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步3 · B</text>
  <rect x="340" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="366" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="392" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="340" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="366" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="392" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="340" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="366" y="102" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="392" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- X at (0,0), (1,1) -->
  <path d="M 346 56 L 360 70 M 360 56 L 346 70" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 372 82 L 386 96 M 386 82 L 372 96" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <!-- O at (2,0), (2,1) -->
  <ellipse cx="353" cy="115" rx="9" ry="9" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <ellipse cx="379" cy="115" rx="9" ry="9" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="379" y="146" text-anchor="middle" font-size="9" fill="#888">(2,1)=O</text>

  <!-- ===== Board 4: step 4 (A) at (2,2) — WIN ===== -->
  <text x="479" y="44" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">步4 · A ✓</text>
  <rect x="440" y="50" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="466" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="492" y="50" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="440" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="466" y="76" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="492" y="76" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="440" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="466" y="102" width="26" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="492" y="102" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <!-- X at (0,0), (1,1), (2,2) -->
  <path d="M 446 56 L 460 70 M 460 56 L 446 70" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 472 82 L 486 96 M 486 82 L 472 96" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 498 108 L 512 122 M 512 108 L 498 122" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <!-- O at (2,0), (2,1) -->
  <ellipse cx="453" cy="115" rx="9" ry="9" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <ellipse cx="479" cy="115" rx="9" ry="9" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- Winning diagonal line -->
  <path d="M 453 63 L 505 115" stroke="#d6a040" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.65" filter="url(#rough2)"/>
  <text x="479" y="146" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">(2,2)=X 三连!</text>

  <!-- Arrows between boards -->
  <path d="M 122 88 L 136 88" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <path d="M 222 88 L 236 88" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <path d="M 322 88 L 336 88" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <path d="M 422 88 L 436 88" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Bottom conclusion -->
  <rect x="60" y="170" width="420" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="11" fill="#444">last = 4（偶数）→ 最后落子者 = A → 检查 X 是否三连</text>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#444">主对角线 (0,0)-(1,1)-(2,2) 全为 X ✓</text>
  <text x="270" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 返回 "A"</text>

  <!-- Legend -->
  <text x="270" y="252" text-anchor="middle" font-size="10" fill="#999">橙底 = 本步新落子 / 获胜线格子　红线 = 获胜对角线</text>
  <text x="270" y="272" text-anchor="middle" font-size="10" fill="#999">✕ = A(X)　○ = B(O)</text>
</svg>
