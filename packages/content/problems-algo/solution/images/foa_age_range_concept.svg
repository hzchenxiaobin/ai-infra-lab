<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">条件化简：三条规则 → 一条年龄区间</text>

  <!-- Three original conditions -->
  <text x="30" y="54" font-size="12" fill="#888">原始规则（x 不给 y 发请求，若满足任一）：</text>

  <rect x="30" y="62" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="84" text-anchor="middle" font-size="11" fill="#333">① age[y] ≤ 0.5·age[x]+7</text>

  <rect x="190" y="62" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="265" y="84" text-anchor="middle" font-size="11" fill="#333">② age[y] &gt; age[x]</text>

  <rect x="350" y="62" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="425" y="79" text-anchor="middle" font-size="11" fill="#333">③ age[y]&gt;100 且</text>
  <text x="425" y="93" text-anchor="middle" font-size="11" fill="#333">age[x]&lt;100</text>

  <!-- arrow down to redundancy note -->
  <path d="M 425 98 L 425 116" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="352" y="118" width="146" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="425" y="134" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">② ⇒ ③ 恒不成立</text>
  <text x="425" y="147" text-anchor="middle" font-size="9" fill="#888">（age[y]≤age[x] 时不可能）</text>

  <!-- Simplified rule -->
  <path d="M 265 98 L 265 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="118" width="310" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="185" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">化简后：x 给 y 发请求 ⇔</text>
  <text x="185" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0.5·age[x]+7 &lt; age[y] ≤ age[x]</text>

  <!-- Number line example for x=30 -->
  <text x="30" y="192" font-size="12" fill="#888">例：age[x] = 30，合法 y 落在开闭区间 (22, 30]：</text>

  <!-- number line from age 14 to 35 -->
  <line x1="70" y1="230" x2="470" y2="230" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- shaded valid region (22,30]: x positions -->
  <rect x="212" y="222" width="138" height="16" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <!-- ticks and labels -->
  <line x1="70" y1="226" x2="70" y2="234" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="250" text-anchor="middle" font-size="10" fill="#888">14</text>
  <line x1="212" y1="226" x2="212" y2="234" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="212" y="250" text-anchor="middle" font-size="10" fill="#b85450">22</text>
  <text x="212" y="214" text-anchor="middle" font-size="9" fill="#b85450">0.5·x+7</text>
  <line x1="350" y1="226" x2="350" y2="234" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">30</text>
  <text x="350" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">age[x]</text>
  <line x1="450" y1="226" x2="450" y2="234" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="250" text-anchor="middle" font-size="10" fill="#888">35</text>

  <!-- open circle at 22 (exclusive) -->
  <circle cx="212" cy="230" r="5" fill="#fafafa" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- closed circle at 30 (inclusive) -->
  <circle cx="350" cy="230" r="5" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- bottom insight: x > 14 -->
  <rect x="40" y="270" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键推论：区间非空 ⟺ 0.5·age[x]+7 &lt; age[x] ⟺ age[x] &gt; 14</text>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#555">因此 age[x] ≤ 14 的人一个请求都不会发（含自己在内无人合法）</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#888">整型下界 lower = ⌊age[x]/2⌋ + 8，合法 y ∈ [lower, age[x]]</text>
</svg>
