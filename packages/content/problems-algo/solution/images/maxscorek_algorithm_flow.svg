<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建大顶堆 → 循环 k 次「pop + 累加 + push ⌈v/3⌉」</text>

  <!-- start -->
  <ellipse cx="270" cy="52" rx="56" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <path d="M 270 70 L 270 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- build heap -->
  <rect x="170" y="88" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="106" text-anchor="middle" font-size="11.5" fill="#333">建大顶堆：把 nums 全部入堆</text>
  <text x="270" y="122" text-anchor="middle" font-size="10" fill="#888">C++ priority_queue&lt;int&gt; / Python 取负 heapq</text>
  <path d="M 270 128 L 270 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="190" y="146" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="166" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">score = 0；执行 cnt = 0</text>
  <path d="M 270 178 L 270 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: cnt < k ? -->
  <polygon points="270,198 360,238 270,278 180,238" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">cnt &lt; k ?</text>
  <text x="270" y="250" text-anchor="middle" font-size="10" fill="#b85450">已执行次数 &lt; k</text>

  <!-- yes branch (left): loop body -->
  <path d="M 180 238 L 70 238 L 70 270" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="22" y="272" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="291" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v = 堆顶 pop</text>
  <path d="M 70 302 L 70 316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="318" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="337" text-anchor="middle" font-size="11" fill="#b85450">score += v</text>
  <path d="M 70 348 L 70 362" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="364" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="380" text-anchor="middle" font-size="10.5" fill="#4a7a3a">push ⌈v/3⌉</text>
  <text x="70" y="393" text-anchor="middle" font-size="9" fill="#4a7a3a">(v=1 时 push 1)</text>
  <path d="M 70 398 L 70 412 L 270 412 L 270 278" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="160" y="406" text-anchor="middle" font-size="9.5" fill="#888">cnt++ 后回判定</text>

  <!-- no branch (right): return -->
  <path d="M 360 238 L 470 238 L 470 270" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否（cnt=k）</text>

  <rect x="402" y="272" width="136" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="287" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">return score</text>
  <text x="470" y="300" text-anchor="middle" font-size="9.5" fill="#888">用 long long / Python int</text>

  <!-- note box -->
  <rect x="402" y="320" width="136" height="86" fill="none" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="410" y="338" font-size="10" fill="#888" font-weight="bold">复杂度</text>
  <text x="410" y="354" font-size="9.5" fill="#888">建堆 O(n)</text>
  <text x="410" y="368" font-size="9.5" fill="#888">k 轮各 O(log n)</text>
  <text x="410" y="382" font-size="9.5" fill="#888">总计 O(n + k log n)</text>
  <text x="410" y="396" font-size="9.5" fill="#888">空间 O(n)</text>

  <rect x="20" y="424" width="500" height="12" fill="none" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" stroke-dasharray="3,2"/>
</svg>
