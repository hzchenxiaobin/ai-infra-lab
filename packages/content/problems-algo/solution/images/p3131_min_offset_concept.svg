<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：整体平移不改配对 —— min 对 min，差值即 x</text>

  <!-- original nums1 -->
  <text x="48" y="72" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1</text>
  <rect x="100" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="146" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="192" y="50" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="74" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- original nums2 -->
  <text x="336" y="72" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">nums2</text>
  <rect x="372" y="50" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="392" y="74" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="418" y="50" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="438" y="74" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="464" y="50" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="484" y="74" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- sort arrows -->
  <path d="M 195 90 L 200 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="152" y="120" font-size="11" fill="#446688" filter="url(#rough2)">排序</text>
  <path d="M 440 90 L 308 222" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="398" y="158" font-size="11" fill="#d6a040" filter="url(#rough2)">排序</text>

  <text x="126" y="172" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序后</text>

  <!-- sorted nums1 row -->
  <rect x="180" y="150" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="226" y="150" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="246" y="174" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="272" y="150" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="292" y="174" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- pairing arrows -->
  <path d="M 200 188 L 200 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="208" y="210" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+3</text>
  <path d="M 246 188 L 246 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="254" y="210" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+3</text>
  <path d="M 292 188 L 292 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="210" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+3</text>

  <!-- sorted nums2 row -->
  <rect x="180" y="228" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="252" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="226" y="228" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="246" y="252" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="272" y="228" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="292" y="252" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- min pair highlight -->
  <rect x="172" y="142" width="56" height="122" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="164" y="207" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">min ↔ min</text>

  <!-- result -->
  <rect x="70" y="286" width="380" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = min(nums2) − min(nums1) = 5 − 2 = 3</text>

  <!-- notes -->
  <rect x="70" y="328" width="380" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">multiset 相等 ⇔ 排序后逐位相等；整体 +x 不改顺序 → 每对差都是 x</text>

  <rect x="70" y="364" width="380" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">min、max、求和÷n —— 任挑一个统计量都能求出同一个 x</text>
</svg>
