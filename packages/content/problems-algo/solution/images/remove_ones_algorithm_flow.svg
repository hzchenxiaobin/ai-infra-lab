<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：逐行比对基准 pattern</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">只需存 row0 一行做基准，逐行判定「相同 / 相反」，O(m·n) 时间 O(n) 空间</text>

  <!-- Start -->
  <rect x="215" y="62" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <line x1="280" y1="96" x2="280" y2="118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step1: store row0 -->
  <rect x="170" y="120" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="12" fill="#333">基准 base = grid[0]；i = 1</text>
  <line x1="280" y1="160" x2="280" y2="182" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <polygon points="280,184 380,220 280,256 180,220" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="11.5" fill="#333">i &lt; m ?</text>
  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#888">(还有行未判定)</text>

  <!-- No -> return true -->
  <line x1="380" y1="220" x2="448" y2="220" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="213" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="448" y="200" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="498" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- Yes -> down to row check -->
  <line x1="280" y1="256" x2="280" y2="278" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="270" font-size="10.5" fill="#666" font-weight="bold">是</text>

  <!-- Decision: row == base ? -->
  <polygon points="280,280 390,316 280,352 170,316" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="11.5" fill="#333">grid[i] == base</text>
  <text x="280" y="328" text-anchor="middle" font-size="11.5" fill="#333">或 == ~base ?</text>

  <!-- Yes -> i++ loop back -->
  <line x1="390" y1="316" x2="460" y2="316" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="402" y="309" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="460" y="298" width="86" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="503" y="320" text-anchor="middle" font-size="11.5" fill="#333">i++，回循环</text>
  <path d="M 503 298 L 503 220 L 380 220" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <!-- No -> return false -->
  <line x1="280" y1="352" x2="280" y2="380" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="372" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="200" y="382" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- Note box -->
  <rect x="30" y="430" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="48" y="450" font-size="10.5" fill="#555">💡 「~base」即逐位取反：把 0/1 互换。判定可直接用「grid[i] 与 base 逐位异或后，结果全 0 或全 1」。</text>
</svg>
