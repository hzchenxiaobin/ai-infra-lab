<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="820" height="500" fill="#fdfcf7"/>
  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums=[1,2,3], target=4</text>
  <path d="M 250 40 Q 410 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== DP table ===== -->
  <!-- header row -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="60" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="100" y="58" width="120" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="220" y="58" width="90" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="310" y="58" width="90" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="400" y="58" width="90" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="490" y="58" width="110" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="600" y="58" width="180" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#2b6e9e" font-weight="bold" text-anchor="middle">
    <text x="70" y="80">i</text>
    <text x="160" y="80">dp[i-1]</text>
    <text x="265" y="80">dp[i-2]</text>
    <text x="355" y="80">dp[i-3]</text>
    <text x="445" y="80">dp[i]</text>
    <text x="545" y="80" fill="#2e6e2e">累加</text>
    <text x="690" y="80" fill="#7a5415">对应排列</text>
  </g>

  <!-- row i=0 -->
  <g filter="url(#sk)">
    <rect x="40" y="92" width="60" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="100" y="92" width="120" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="92" width="90" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
    <rect x="310" y="92" width="90" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
    <rect x="400" y="92" width="90" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="490" y="92" width="110" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="600" y="92" width="180" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="116">0</text>
    <text x="160" y="116" fill="#aaa">—</text>
    <text x="265" y="116" fill="#aaa">—</text>
    <text x="355" y="116" fill="#aaa">—</text>
    <text x="445" y="116" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="545" y="116" fill="#888">基准</text>
    <text x="690" y="116" font-size="10.5">()</text>
  </g>

  <!-- row i=1 -->
  <g filter="url(#sk)">
    <rect x="40" y="130" width="60" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="100" y="130" width="120" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="130" width="90" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
    <rect x="310" y="130" width="90" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
    <rect x="400" y="130" width="90" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="490" y="130" width="110" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="600" y="130" width="180" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="70" y="154">1</text>
    <text x="160" y="154">dp[0]=1</text>
    <text x="265" y="154" fill="#aaa">—</text>
    <text x="355" y="154" fill="#aaa">—</text>
    <text x="445" y="154" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="545" y="154">0+1</text>
    <text x="690" y="154" font-size="10.5">(1)</text>
  </g>

  <!-- row i=2 -->
  <g filter="url(#sk)">
    <rect x="40" y="168" width="60" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="100" y="168" width="120" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="168" width="90" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="310" y="168" width="90" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
    <rect x="400" y="168" width="90" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="490" y="168" width="110" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="600" y="168" width="180" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="70" y="192">2</text>
    <text x="160" y="192">dp[1]=1</text>
    <text x="265" y="192">dp[0]=1</text>
    <text x="355" y="192" fill="#aaa">—</text>
    <text x="445" y="192" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="545" y="192">1+1</text>
    <text x="690" y="192" font-size="10.5">(1,1),(2)</text>
  </g>

  <!-- row i=3 -->
  <g filter="url(#sk)">
    <rect x="40" y="206" width="60" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="100" y="206" width="120" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="220" y="206" width="90" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="310" y="206" width="90" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="400" y="206" width="90" height="38" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="490" y="206" width="110" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="600" y="206" width="180" height="38" fill="#fff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="70" y="230">3</text>
    <text x="160" y="230">dp[2]=2</text>
    <text x="265" y="230">dp[1]=1</text>
    <text x="355" y="230">dp[0]=1</text>
    <text x="445" y="230" fill="#2e6e2e" font-weight="bold">4</text>
    <text x="545" y="230">2+1+1</text>
    <text x="690" y="230" font-size="9.5">(1,1,1),(1,2),(2,1),(3)</text>
  </g>

  <!-- row i=4 (highlighted) -->
  <g filter="url(#sk)">
    <rect x="40" y="244" width="60" height="42" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="100" y="244" width="120" height="42" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="220" y="244" width="90" height="42" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="310" y="244" width="90" height="42" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="400" y="244" width="90" height="42" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="490" y="244" width="110" height="42" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="600" y="244" width="180" height="42" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="270" font-weight="bold">4</text>
    <text x="160" y="270">dp[3]=4</text>
    <text x="265" y="270">dp[2]=2</text>
    <text x="355" y="270">dp[1]=1</text>
    <text x="445" y="270" fill="#b8741a" font-weight="bold" font-size="15">7 ⭐</text>
    <text x="545" y="270" fill="#7a5415" font-weight="bold">4+2+1</text>
    <text x="690" y="266" font-size="9">7 种排列（见下）</text>
  </g>

  <!-- ===== 7 permutations list ===== -->
  <text x="410" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">dp[4] = 7 对应的 7 种排列</text>

  <g font-size="11.5" fill="#542">
    <g filter="url(#sk)"><rect x="60" y="326" width="130" height="26" rx="5" fill="#fff" stroke="#d8b06a" stroke-width="1"/></g>
    <text x="125" y="344" text-anchor="middle">末位 1：(1,1,1,1)</text>

    <g filter="url(#sk)"><rect x="200" y="326" width="130" height="26" rx="5" fill="#fff" stroke="#d8b06a" stroke-width="1"/></g>
    <text x="265" y="344" text-anchor="middle">末位 1：(1,2,1)</text>

    <g filter="url(#sk)"><rect x="340" y="326" width="130" height="26" rx="5" fill="#fff" stroke="#d8b06a" stroke-width="1"/></g>
    <text x="405" y="344" text-anchor="middle">末位 1：(2,1,1)</text>

    <g filter="url(#sk)"><rect x="480" y="326" width="130" height="26" rx="5" fill="#fff" stroke="#d8b06a" stroke-width="1"/></g>
    <text x="545" y="344" text-anchor="middle">末位 1：(3,1)</text>

    <g filter="url(#sk)"><rect x="620" y="326" width="130" height="26" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="685" y="344" text-anchor="middle">末位 2：(1,1,2)</text>
  </g>
  <g font-size="11.5" fill="#542">
    <g filter="url(#sk)"><rect x="130" y="360" width="130" height="26" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="195" y="378" text-anchor="middle">末位 2：(2,2)</text>

    <g filter="url(#sk)"><rect x="340" y="360" width="130" height="26" rx="5" fill="#fff" stroke="#e0a8a4" stroke-width="1"/></g>
    <text x="405" y="378" text-anchor="middle">末位 3：(1,3)</text>
  </g>

  <!-- color legend -->
  <g font-size="10" fill="#666">
    <rect x="490" y="366" width="12" height="12" fill="#fff" stroke="#d8b06a" stroke-width="1" filter="url(#sk)"/>
    <text x="508" y="376">末位=1（4种）</text>
    <rect x="590" y="366" width="12" height="12" fill="#fff" stroke="#9ec9a0" stroke-width="1" filter="url(#sk)"/>
    <text x="608" y="376">末位=2（2种）</text>
    <rect x="680" y="366" width="12" height="12" fill="#fff" stroke="#e0a8a4" stroke-width="1" filter="url(#sk)"/>
    <text x="698" y="376">末位=3（1种）</text>
  </g>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="404" width="720" height="80" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="410" y="426" text-anchor="middle" font-size="11.5" fill="#444">
    每行 <tspan font-weight="bold" fill="#2e6e2e">dp[i]</tspan> = 左侧三列之和：枚举「末位是 1 / 2 / 3」三种情况
  </text>
  <text x="410" y="446" text-anchor="middle" font-size="11" fill="#666">
    注意 (1,2,1) 与 (2,1,1) 末位都是 1，但前缀 (1,2) ≠ (2,1) → 来自 dp[3] 中不同的排列 → 分别计数
  </text>
  <text x="410" y="466" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">
    外层金额 + 内层硬币 = 枚举末位 = 排列数（顺序有关）
  </text>
  <text x="410" y="482" text-anchor="middle" font-size="10" fill="#888">
    对比 518：外层硬币 + 内层金额 = 逐个纳入 = 组合数（顺序无关），同输入得 4 而非 7
  </text>
</svg>
