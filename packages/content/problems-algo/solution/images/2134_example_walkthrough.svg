<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [0,1,0,1,1,0,0]，total = 3</text>

  <!-- Original array -->
  <text x="40" y="54" font-size="11.5" fill="#555" font-weight="bold">原数组（环形）：</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="60" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="78" y="81">0</text>
    <rect x="98" y="62" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="116" y="81" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="136" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="154" y="81">0</text>
    <rect x="174" y="62" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="192" y="81" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="212" y="62" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="230" y="81" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="250" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="268" y="81">0</text>
    <rect x="288" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="306" y="81">0</text>
  </g>
  <text x="340" y="81" font-size="11" fill="#4a7a3a" font-weight="bold">total = 3 → 窗口大小 = 3</text>

  <!-- Divider -->
  <path d="M 40 104 L 520 104" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Table header -->
  <text x="40" y="124" font-size="11.5" fill="#555" font-weight="bold">枚举 7 个窗口位置（起点 0~6），统计窗口内 0 的个数：</text>

  <!-- Table: header row -->
  <rect x="40" y="134" width="80" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="152" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">起点</text>
  <rect x="122" y="134" width="220" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="152" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">窗口内容（环形）</text>
  <rect x="344" y="134" width="70" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="379" y="152" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">0 的个数</text>
  <rect x="416" y="134" width="80" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="456" y="152" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">交换次数</text>

  <!-- Row 0: start=0, [0,1,0], 0s=2, swaps=2 -->
  <rect x="40" y="162" width="80" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="178" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="122" y="162" width="220" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="232" y="178" text-anchor="middle" font-size="10.5" fill="#333">[0, 1, 0]</text>
  <rect x="344" y="162" width="70" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="379" y="178" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="416" y="162" width="80" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="456" y="178" text-anchor="middle" font-size="10.5" fill="#333">2</text>

  <!-- Row 1: start=1, [1,0,1], 0s=1, swaps=1 (MIN) -->
  <rect x="40" y="188" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="122" y="188" width="220" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="232" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[1, 0, 1]</text>
  <rect x="344" y="188" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="379" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="416" y="188" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="456" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 ✓</text>

  <!-- Row 2: start=2, [0,1,1], 0s=1, swaps=1 (MIN) -->
  <rect x="40" y="214" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2</text>
  <rect x="122" y="214" width="220" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="232" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[0, 1, 1]</text>
  <rect x="344" y="214" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="379" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="416" y="214" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="456" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 ✓</text>

  <!-- Row 3: start=3, [1,1,0], 0s=1, swaps=1 (MIN) -->
  <rect x="40" y="240" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3</text>
  <rect x="122" y="240" width="220" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="232" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[1, 1, 0]</text>
  <rect x="344" y="240" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="379" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <rect x="416" y="240" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="456" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 ✓</text>

  <!-- Row 4: start=4, [1,0,0], 0s=2, swaps=2 -->
  <rect x="40" y="266" width="80" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="122" y="266" width="220" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="232" y="282" text-anchor="middle" font-size="10.5" fill="#333">[1, 0, 0]</text>
  <rect x="344" y="266" width="70" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="379" y="282" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="416" y="266" width="80" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="456" y="282" text-anchor="middle" font-size="10.5" fill="#333">2</text>

  <!-- Row 5: start=5, [0,0,0], 0s=3, swaps=3 -->
  <rect x="40" y="292" width="80" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="308" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="122" y="292" width="220" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="232" y="308" text-anchor="middle" font-size="10.5" fill="#333">[0, 0, 0]</text>
  <rect x="344" y="292" width="70" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="379" y="308" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="416" y="292" width="80" height="24" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="456" y="308" text-anchor="middle" font-size="10.5" fill="#333">3</text>

  <!-- Row 6: start=6, [0,0,1](wrap), 0s=2, swaps=2 -->
  <rect x="40" y="318" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="334" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">6</text>
  <rect x="122" y="318" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="232" y="334" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">[0, 0, 1]（跨边界）</text>
  <rect x="344" y="318" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="379" y="334" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="416" y="318" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="456" y="334" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>

  <!-- Divider -->
  <path d="M 40 356 L 520 356" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Sliding window note -->
  <text x="40" y="376" font-size="11" fill="#555">滑动窗口增量维护：窗口右移时，左边出一个元素、右边进一个元素，O(1) 更新 0 的计数</text>

  <!-- Answer box -->
  <rect x="60" y="394" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = min(2, 1, 1, 1, 2, 3, 2) = 1</text>
  <text x="280" y="434" text-anchor="middle" font-size="11" fill="#888">起点 1/2/3 的窗口均只需交换 1 次（把窗口内唯一的 0 换成外面的 1）</text>
</svg>
