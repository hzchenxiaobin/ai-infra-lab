<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">算法流程：逐通道取最近 17 的倍数并拼接</text>

  <!-- 1 Start -->
  <rect x="150" y="40" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 color = #RRGGBB</text>

  <path d="M 260 74 L 260 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 2 切分 -->
  <rect x="150" y="94" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333">切分为 3 个通道：RR / GG / BB</text>

  <path d="M 260 128 L 260 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 3 逐通道 -->
  <rect x="150" y="148" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#333">逐通道：v = 16·a + b</text>

  <path d="M 260 182 L 260 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 4 round -->
  <rect x="150" y="202" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d = round(v / 17)  ←→ (v+8)/17</text>

  <path d="M 260 236 L 260 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 5 拼接 -->
  <rect x="150" y="256" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#333">out += hex(d) 重复 2 次</text>

  <!-- loop back arrow: from right of box5 up to right of box3 -->
  <path d="M 370 273 L 408 273 L 408 165 L 370 165" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="414" y="222" font-size="10" fill="#4a7a3a">下一通道</text>

  <path d="M 260 290 L 260 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 6 End -->
  <rect x="150" y="314" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 '#' + R + G + B</text>

  <!-- note -->
  <rect x="40" y="362" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="11" fill="#555">三通道独立 ⇒ 无需排序 / DP，每通道 O(1)</text>
</svg>
