<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L10,0 L5,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrRight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <marker id="arrLeft" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- ===== I transition (top half) ===== -->
  <text x="260" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s[i-1] = 'I'：新数更大 → 取前缀和（从左到右）</text>

  <!-- dp[i-1] label -->
  <text x="40" y="65" font-size="12" fill="#555" filter="url(#rough2)">dp[i-1]:</text>

  <!-- dp[i-1] boxes: [a] [b] [c] -->
  <!-- Highlight a and b (contribute to ndp[2]) -->
  <rect x="135" y="46" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="210" y="46" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="285" y="46" width="55" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>

  <!-- j indices for dp[i-1] -->
  <text x="162" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=0</text>
  <text x="237" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=1</text>
  <text x="312" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=2</text>

  <!-- Connecting arrows from a,b to ndp[2] -->
  <path d="M 162 88 Q 200 115 237 125" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <path d="M 237 88 Q 237 105 237 125" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- dp[i] label -->
  <text x="40" y="150" font-size="12" fill="#555" filter="url(#rough2)">dp[i]:</text>

  <!-- dp[i] boxes: [0] [a] [a+b] [a+b+c] -->
  <!-- Highlight ndp[2]=a+b in orange -->
  <rect x="98" y="130" width="55" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="173" y="130" width="55" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="248" y="130" width="55" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">a+b</text>
  <rect x="323" y="130" width="55" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a+b+c</text>

  <!-- j indices for dp[i] -->
  <text x="125" y="184" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="200" y="184" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="275" y="184" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">j=2</text>
  <text x="350" y="184" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=3</text>

  <!-- Formula note -->
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">ndp[j] = Σ dp[k], k = 0..j-1（前缀和）</text>

  <!-- Scanning direction arrow -->
  <path d="M 130 200 L 375 200" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrRight)" filter="url(#rough2)"/>

  <!-- ===== Separator ===== -->
  <line x1="40" y1="220" x2="480" y2="220" stroke="#ddd" stroke-width="1" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- ===== D transition (bottom half) ===== -->
  <text x="260" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">s[i-1] = 'D'：新数更小 → 取后缀和（从右到左）</text>

  <!-- dp[i-1] label -->
  <text x="40" y="285" font-size="12" fill="#555" filter="url(#rough2)">dp[i-1]:</text>

  <!-- dp[i-1] boxes: [a] [b] [c] -->
  <!-- Highlight b and c (contribute to ndp[1]) -->
  <rect x="135" y="266" width="55" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="210" y="266" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="285" y="266" width="55" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>

  <!-- j indices for dp[i-1] -->
  <text x="162" y="320" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=0</text>
  <text x="237" y="320" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=1</text>
  <text x="312" y="320" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=2</text>

  <!-- Connecting arrows from b,c to ndp[1] -->
  <path d="M 237 308 Q 225 330 210 345" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <path d="M 312 308 Q 260 330 215 345" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,2" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- dp[i] label -->
  <text x="40" y="370" font-size="12" fill="#555" filter="url(#rough2)">dp[i]:</text>

  <!-- dp[i] boxes: [a+b+c] [b+c] [c] [0] -->
  <!-- Highlight ndp[1]=b+c in orange -->
  <rect x="98" y="350" width="55" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="374" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a+b+c</text>
  <rect x="173" y="350" width="55" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b+c</text>
  <rect x="248" y="350" width="55" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="374" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="323" y="350" width="55" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="374" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <!-- j indices for dp[i] -->
  <text x="125" y="404" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="200" y="404" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">j=1</text>
  <text x="275" y="404" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="350" y="404" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=3</text>

  <!-- Scanning direction arrow (right to left) -->
  <path d="M 375 404 L 130 404" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrLeft)" filter="url(#rough2)"/>

  <!-- Formula note -->
  <text x="260" y="418" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">ndp[j] = Σ dp[k], k = j..i-1（后缀和）</text>
</svg>
