<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 515"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="515" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：第一趟打桩 + 第二趟拉线</text>

  <!-- start -->
  <rect x="245" y="30" width="70" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <line x1="280" y1="60" x2="280" y2="72" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pass 1 -->
  <rect x="148" y="76" width="264" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第一趟（打桩）：遍历每辆车 [s, e]</text>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">diff[s]++ ；diff[e+1]−−</text>
  <text x="452" y="107" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">O(n)</text>
  <line x1="280" y1="134" x2="280" y2="148" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="175" y="152" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cover = 0，ans = 0</text>
  <line x1="280" y1="186" x2="280" y2="202" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop condition diamond -->
  <polygon points="280,206 378,256 280,306 182,256" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">p ≤ 100 ?</text>
  <line x1="280" y1="306" x2="280" y2="322" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="319" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <line x1="182" y1="256" x2="128" y2="256" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="247" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- end -->
  <rect x="32" y="239" width="92" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>

  <!-- accumulate -->
  <rect x="175" y="326" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cover += diff[p]</text>
  <line x1="280" y1="360" x2="280" y2="376" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check diamond -->
  <polygon points="280,380 378,430 280,480 182,430" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="435" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">cover &gt; 0 ?</text>
  <line x1="182" y1="430" x2="130" y2="430" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="421" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ans++ -->
  <rect x="36" y="412" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="81" y="435" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans++</text>

  <!-- loop back -->
  <path d="M 280,480 L 280,498" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 81,448 L 81,498 L 490,498 L 490,256 L 384,256" fill="none" stroke="#888"
        stroke-width="1.5" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="498" y="385" font-size="11" fill="#888" filter="url(#rough2)">p++</text>
  <text x="448" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第二趟·拉线</text>
  <text x="448" y="347" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">O(C)</text>
</svg>
