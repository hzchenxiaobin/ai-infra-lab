<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：9 个节点，6 个好节点</text>

  <!-- 表头 -->
  <rect x="40" y="44" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="75" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">节点</text>
  <text x="147" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">孩子</text>
  <text x="235" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">孩子 size</text>
  <text x="322" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">size[u]</text>
  <text x="420" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">好节点？</text>

  <!-- 行底色 -->
  <rect x="40" y="74" width="440" height="27" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="40" y="101" width="440" height="27" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="40" y="128" width="440" height="27" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="40" y="155" width="440" height="27" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="40" y="182" width="440" height="27" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="40" y="209" width="440" height="27" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="40" y="236" width="440" height="27" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="40" y="263" width="440" height="27" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="40" y="290" width="440" height="27" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- 行内容 -->
  <text x="75" y="93" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="147" y="93" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1, 5</text>
  <text x="235" y="93" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">7 ≠ 1</text>
  <text x="322" y="93" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">9</text>
  <text x="420" y="93" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="75" y="120" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="147" y="120" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2, 6</text>
  <text x="235" y="120" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 ≠ 1</text>
  <text x="322" y="120" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="420" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="75" y="147" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="147" y="147" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3, 7</text>
  <text x="235" y="147" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ≠ 1</text>
  <text x="322" y="147" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="420" y="147" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="75" y="174" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="147" y="174" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4, 8</text>
  <text x="235" y="174" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 = 1</text>
  <text x="322" y="174" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="420" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="75" y="201" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="147" y="201" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="235" y="201" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="322" y="201" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="420" y="201" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 叶子</text>

  <text x="75" y="228" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="147" y="228" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="235" y="228" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="322" y="228" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="420" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 叶子</text>

  <text x="75" y="255" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="147" y="255" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="235" y="255" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="322" y="255" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="420" y="255" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 叶子</text>

  <text x="75" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="147" y="282" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="235" y="282" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="322" y="282" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="420" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 叶子</text>

  <text x="75" y="309" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="147" y="309" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="235" y="309" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="322" y="309" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="420" y="309" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 叶子</text>

  <!-- 网格线 -->
  <line x1="110" y1="44" x2="110" y2="317" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="185" y1="44" x2="185" y2="317" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="285" y1="44" x2="285" y2="317" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="44" x2="360" y2="317" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="74" x2="480" y2="74" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="40" y1="101" x2="480" y2="101" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="128" x2="480" y2="128" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="155" x2="480" y2="155" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="182" x2="480" y2="182" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="209" x2="480" y2="209" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="236" x2="480" y2="236" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="263" x2="480" y2="263" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="290" x2="480" y2="290" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="44" width="440" height="273" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="260" y="342" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">链上 0→1→2 层层不等；「二叉」的节点 3 与全部叶子合计 6 个 ✓</text>
</svg>
