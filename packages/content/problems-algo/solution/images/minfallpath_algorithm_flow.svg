<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：初始化第一行 → 逐行填表 → 返回最后一行最小值</text>

  <!-- Start -->
  <rect x="170" y="44" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">dp[0][j] = matrix[0][j]</text>
  <path d="M 280 80 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header i -->
  <rect x="170" y="104" width="220" height="30" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#333">for i = 1 .. n−1</text>
  <path d="M 280 136 L 280 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header j -->
  <rect x="170" y="160" width="220" height="30" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11.5" fill="#333">for j = 0 .. n−1</text>
  <path d="M 280 192 L 280 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- best = above -->
  <rect x="140" y="216" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#333">best = dp[i−1][j]</text>
  <path d="M 280 248 L 280 266" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: j > 0 ? -->
  <path d="M 280 270 L 380 300 L 280 330 L 180 300 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="11" fill="#333">j &gt; 0 ?</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888">best = min(best, 左上)</text>
  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#888">j &lt; n−1 ? → 右上</text>

  <!-- transition -->
  <rect x="120" y="344" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i][j] = best + matrix[i][j]</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">三父取 min 后累加本格值</text>

  <!-- loop back to j -->
  <path d="M 120 366 L 84 366 L 84 175 L 166 175" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="56" y="276" font-size="10" fill="#4a7a3a">下一 j</text>

  <!-- loop back to i (right side) -->
  <path d="M 440 366 L 476 366 L 476 119 L 394 119" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="486" y="246" font-size="10" fill="#4a7a3a">下一 i</text>

  <!-- after loop -->
  <path d="M 280 390 L 280 408" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="170" y="412" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return min(dp[n−1])</text>
</svg>
