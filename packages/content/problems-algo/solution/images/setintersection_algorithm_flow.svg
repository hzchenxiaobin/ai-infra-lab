<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">三分支判定：维护 last1 &lt; last2（最近放入的两个点）</text>

  <!-- Start box -->
  <rect x="170" y="44" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">处理区间 [s, e]（已排序）</text>

  <!-- arrow down to decision 1 -->
  <line x1="260" y1="74" x2="260" y2="88" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: last2 < s? -->
  <polygon points="260,90 380,126 260,162 140,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">last2 &lt; s?</text>
  <text x="260" y="138" text-anchor="middle" font-size="10" fill="#888">两点都不在 [s,e]</text>

  <!-- Yes arrow to Case 1 -->
  <line x1="140" y1="126" x2="80" y2="126" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Case 1 box -->
  <rect x="20" y="150" width="120" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">情况①</text>
  <text x="80" y="187" text-anchor="middle" font-size="10.5" fill="#333">放入 e−1 和 e</text>
  <text x="80" y="202" text-anchor="middle" font-size="10" fill="#888">count += 2</text>
  <text x="80" y="216" text-anchor="middle" font-size="10" fill="#888">last1=e−1, last2=e</text>

  <!-- No arrow down to decision 2 -->
  <line x1="260" y1="162" x2="260" y2="176" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="172" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Decision 2: last1 < s? -->
  <polygon points="260,178 380,214 260,250 140,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">last1 &lt; s?</text>
  <text x="260" y="226" text-anchor="middle" font-size="10" fill="#888">仅 last2 在 [s,e]</text>

  <!-- Yes arrow to Case 2 -->
  <line x1="140" y1="214" x2="80" y2="214" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Case 2 box -->
  <rect x="20" y="238" width="120" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="258" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">情况②</text>
  <text x="80" y="275" text-anchor="middle" font-size="10.5" fill="#333">放入 e</text>
  <text x="80" y="290" text-anchor="middle" font-size="10" fill="#888">count += 1</text>
  <text x="80" y="304" text-anchor="middle" font-size="10" fill="#888">last1=last2, last2=e</text>

  <!-- No arrow to Case 3 -->
  <line x1="380" y1="214" x2="440" y2="214" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Case 3 box -->
  <rect x="380" y="190" width="120" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">情况③</text>
  <text x="440" y="227" text-anchor="middle" font-size="10.5" fill="#333">无需放入</text>
  <text x="440" y="242" text-anchor="middle" font-size="10" fill="#888">count += 0</text>
  <text x="440" y="256" text-anchor="middle" font-size="10" fill="#888">last1,last2 不变</text>

  <!-- visual for each case: mini number lines -->
  <!-- Case 1 visual: [s......e], no dots -->
  <rect x="160" y="338" width="340" height="48" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="176" y="356" font-size="10.5" fill="#555" font-weight="bold">图示：</text>
  <!-- case 1: empty interval, add e-1,e -->
  <line x1="200" y1="368" x2="260" y2="368" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="230" y="362" text-anchor="middle" font-size="9" fill="#b85450">[s,e]</text>
  <circle cx="248" cy="368" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="256" cy="368" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="382" text-anchor="middle" font-size="9" fill="#b85450">①补两点</text>

  <!-- case 2: one dot already in -->
  <line x1="290" y1="368" x2="350" y2="368" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="362" text-anchor="middle" font-size="9" fill="#446688">[s,e]</text>
  <circle cx="330" cy="368" r="4" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="346" cy="368" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="382" text-anchor="middle" font-size="9" fill="#446688">②已1补1</text>

  <!-- case 3: two dots already in -->
  <line x1="380" y1="368" x2="440" y2="368" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="410" y="362" text-anchor="middle" font-size="9" fill="#4a7a3a">[s,e]</text>
  <circle cx="398" cy="368" r="4" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="422" cy="368" r="4" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="382" text-anchor="middle" font-size="9" fill="#4a7a3a">③已有2点</text>
</svg>
