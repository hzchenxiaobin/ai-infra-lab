<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：aLice → Alice，bOB → Bob</text>

  <!-- ===== Left: Users table (before) ===== -->
  <text x="110" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Users 表（修复前）</text>

  <rect x="50" y="64" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="80" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">user_id</text>
  <rect x="120" y="64" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="80" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">name</text>

  <rect x="50" y="88" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="106" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="120" y="88" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">aLice</text>

  <rect x="50" y="116" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="120" y="116" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">bOB</text>

  <!-- ===== Middle: big arrow with label ===== -->
  <path d="M210 102 L320 102" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="225" y="84" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="265" y="100" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">CONCAT(</text>
  <text x="265" y="112" text-anchor="middle" font-size="8.5" fill="#333">UPPER+LOWER</text>
  <text x="265" y="76" text-anchor="middle" font-size="8.5" fill="#888">字符串函数</text>

  <path d="M380 102 L490 102" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="435" y="96" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ORDER BY user_id</text>

  <!-- ===== Right: result table (after) ===== -->
  <text x="545" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果（修复后）</text>

  <rect x="490" y="64" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="517" y="80" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">user_id</text>
  <rect x="545" y="64" width="65" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="577" y="80" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">name</text>

  <rect x="490" y="88" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="517" y="106" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="545" y="88" width="65" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="577" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Alice</text>

  <rect x="490" y="116" width="55" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="517" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="545" y="116" width="65" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="577" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Bob</text>

  <!-- ===== Bottom: detail breakdown ===== -->
  <rect x="30" y="160" width="600" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">逐行变换详解</text>

  <!-- Row 1 detail -->
  <text x="50" y="210" font-size="10.5" fill="#b85450" font-weight="bold">user_id = 1, name = "aLice"</text>

  <rect x="50" y="218" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="236" font-size="9.5" fill="#4a7a3a">SUBSTRING("aLice", 1, 1)</text>
  <text x="220" y="236" font-size="9.5" fill="#333">= "a"</text>

  <rect x="310" y="218" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="236" font-size="9.5" fill="#446688">UPPER("a")</text>
  <text x="420" y="236" font-size="9.5" fill="#333">= "A"</text>

  <path d="M260 232 L308 232" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="50" y="252" width="250" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="270" font-size="9.5" fill="#d6a040">SUBSTRING("aLice", 2)</text>
  <text x="210" y="270" font-size="9.5" fill="#333">= "Lice"</text>

  <rect x="310" y="252" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="270" font-size="9.5" fill="#446688">LOWER("Lice")</text>
  <text x="415" y="270" font-size="9.5" fill="#333">= "lice"</text>

  <path d="M260 266 L308 266" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="480" y="235" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="253" font-size="9.5" fill="#b85450" font-weight="bold">CONCAT("A","lice")</text>
  <text x="575" y="253" font-size="9.5" fill="#4a7a3a" font-weight="bold">= "Alice"</text>

  <path d="M472 249 L478 249" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Separator -->
  <line x1="50" y1="292" x2="610" y2="292" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 2 detail -->
  <text x="50" y="312" font-size="10.5" fill="#b85450" font-weight="bold">user_id = 2, name = "bOB"</text>

  <rect x="50" y="320" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="338" font-size="9.5" fill="#4a7a3a">SUBSTRING("bOB", 1, 1)</text>
  <text x="220" y="338" font-size="9.5" fill="#333">= "b"</text>

  <rect x="310" y="320" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="338" font-size="9.5" fill="#446688">UPPER("b")</text>
  <text x="420" y="338" font-size="9.5" fill="#333">= "B"</text>

  <path d="M260 334 L308 334" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="480" y="320" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="338" font-size="9.5" fill="#b85450" font-weight="bold">CONCAT("B","ob")</text>
  <text x="575" y="338" font-size="9.5" fill="#4a7a3a" font-weight="bold">= "Bob"</text>

  <path d="M472 334 L478 334" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="50" y="354" width="250" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="372" font-size="9.5" fill="#d6a040">SUBSTRING("bOB", 2)</text>
  <text x="210" y="372" font-size="9.5" fill="#333">= "OB"  →  LOWER("OB") = "ob"</text>
</svg>
