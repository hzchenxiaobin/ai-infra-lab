<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：有序集合管断点，两棵 BIT 管段长</text>

  <!-- 初始化 -->
  <rect x="110" y="34" width="300" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始化：扫一遍 colors，把「相邻同色」的边号放入 brk</text>
  <text x="260" y="68" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">相邻断点之间的弧 = 极大段 → 长度装入两棵 BIT</text>

  <path d="M 260 76 L 260 90" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取下一条查询 -->
  <rect x="190" y="92" width="140" height="24" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">取下一条查询</text>

  <path d="M 260 116 L 260 128" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 类型菱形 -->
  <polygon points="260,130 320,158 260,186 200,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#8a6a10" filter="url(#rough2)">类型？</text>

  <path d="M 200 158 L 130 158 L 130 176" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="150" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[1, k]</text>
  <path d="M 320 158 L 390 158 L 390 176" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="150" font-size="10" fill="#446688" filter="url(#rough2)">[2, idx, c]</text>

  <!-- 左分支：类型 1 -->
  <polygon points="130,178 192,205 130,232 68,205" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="209" text-anchor="middle" font-size="10.5" fill="#2f5426" filter="url(#rough2)">brk 空？</text>
  <path d="M 130 232 L 130 244" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="242" font-size="9.5" fill="#555" filter="url(#rough2)">否</text>
  <path d="M 68 205 L 44 205 L 44 254" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="198" font-size="9.5" fill="#555" filter="url(#rough2)">是</text>

  <rect x="14" y="256" width="92" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="272" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">answer = n</text>

  <rect x="60" y="288" width="232" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="306" text-anchor="middle" font-size="10" fill="#2f5426" filter="url(#rough2)">C = cnt 区间和 [k, n]（段数）</text>
  <text x="176" y="322" text-anchor="middle" font-size="10" fill="#2f5426" filter="url(#rough2)">S = tot 区间和 [k, n]（总长）</text>
  <text x="176" y="338" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5426" filter="url(#rough2)">answer = S − (k−1)·C</text>

  <!-- 右分支：类型 2 -->
  <polygon points="390,178 452,205 390,232 328,205" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="202" text-anchor="middle" font-size="10" fill="#2c4460" filter="url(#rough2)">colors[idx]</text>
  <text x="390" y="215" text-anchor="middle" font-size="10" fill="#2c4460" filter="url(#rough2)">== c ？</text>
  <path d="M 452 205 L 462 205 L 462 246" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="198" font-size="9.5" fill="#555" filter="url(#rough2)">是</text>
  <rect x="432" y="248" width="78" height="22" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="471" y="263" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">跳过</text>

  <path d="M 390 232 L 390 240" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="240" font-size="9.5" fill="#555" filter="url(#rough2)">否</text>
  <rect x="292" y="242" width="128" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="257" text-anchor="middle" font-size="9.5" fill="#8a6a10" filter="url(#rough2)">① 摘旧段：BIT −</text>
  <path d="M 356 264 L 356 272" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="292" y="274" width="128" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="289" text-anchor="middle" font-size="9.5" fill="#8a6a10" filter="url(#rough2)">② 改色；brk 增删两边</text>
  <path d="M 356 296 L 356 304" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="292" y="306" width="128" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="321" text-anchor="middle" font-size="9.5" fill="#8a6a10" filter="url(#rough2)">③ 装新段：BIT +</text>
  <text x="356" y="344" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">①③ 各至多 3 段（先摘后装）</text>

  <!-- 回路箭头 -->
  <path d="M 60 280 L 60 342 L 24 342" fill="none" stroke="#aaa" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 510 270 L 510 104 L 334 104" fill="none" stroke="#aaa" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="92" font-size="9" fill="#999" filter="url(#rough2)">回到下一查询</text>
</svg>
