<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 双指针扫描 → 计数</text>

  <!-- Step 1 -->
  <rect x="60" y="44" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="69" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序：sort(nums)</text>
  <text x="360" y="69" font-size="11" fill="#999" filter="url(#rough2)">O(n log n)</text>

  <path d="M 280 84 L 280 102" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="106" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="131" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 初始化：left = 0, right = n−1, count = 0</text>

  <path d="M 280 146 L 280 164" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: while diamond -->
  <polygon points="280,168 400,210 280,252 160,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">while left &lt; right?</text>
  <text x="280" y="223" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">left ≥ right → 跳出循环</text>

  <!-- No branch: to step 4 -->
  <path d="M 400 210 L 470 210 L 470 320" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="410" y="204" font-size="10" fill="#999" filter="url(#rough2)">否</text>

  <!-- Yes branch: down -->
  <path d="M 280 252 L 280 270" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="265" font-size="10" fill="#999" filter="url(#rough2)">是</text>

  <!-- Step 3a: sum check -->
  <rect x="60" y="274" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="291" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">sum = nums[left]+nums[right]</text>
  <text x="160" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">sum &lt; target ?</text>

  <!-- Yes: count += right-left, left++ -->
  <path d="M 60 294 L 30 294 L 30 340 L 90 340" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="40" y="288" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="90" y="328" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="347" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count+=r−l, left++</text>

  <!-- No: right-- -->
  <path d="M 260 294 L 320 294 L 320 340 L 270 340" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="282" y="288" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="270" y="328" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="347" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">right−−</text>

  <!-- Loop back arrow -->
  <path d="M 155 328 L 155 310 L 30 310 L 30 190 L 160 210" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <text x="14" y="250" font-size="10" fill="#999" filter="url(#rough2)">回循环</text>

  <!-- Step 4 -->
  <rect x="380" y="320" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="343" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">④ return count</text>
</svg>
