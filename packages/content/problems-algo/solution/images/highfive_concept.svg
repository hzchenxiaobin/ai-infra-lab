<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心思路：按 student_id 分组 → 排序取 Top5 → 求均分
  </text>

  <!-- Step 1: Input items -->
  <text x="20" y="56" font-size="12" fill="#666" filter="url(#rough2)">① 输入 items</text>
  <g filter="url(#rough2)">
    <rect x="20" y="62" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="46" y="79" text-anchor="middle" font-size="11" fill="#333">1,91</text>
    <rect x="76" y="62" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="102" y="79" text-anchor="middle" font-size="11" fill="#333">1,92</text>
    <rect x="132" y="62" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="158" y="79" text-anchor="middle" font-size="11" fill="#333">2,93</text>
    <rect x="188" y="62" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="214" y="79" text-anchor="middle" font-size="11" fill="#333">2,97</text>
    <rect x="244" y="62" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="270" y="79" text-anchor="middle" font-size="11" fill="#333">1,60</text>
    <rect x="300" y="62" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="326" y="79" text-anchor="middle" font-size="11" fill="#333">2,77</text>
    <rect x="356" y="62" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="382" y="79" text-anchor="middle" font-size="11" fill="#333">1,65</text>
    <rect x="412" y="62" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="438" y="79" text-anchor="middle" font-size="11" fill="#333">1,87</text>
    <rect x="468" y="62" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="494" y="79" text-anchor="middle" font-size="11" fill="#333">1,100</text>
  </g>
  <text x="20" y="106" font-size="10" fill="#888" filter="url(#rough2)">蓝色 = 学生1，绿色 = 学生2</text>

  <!-- Arrow down -->
  <path d="M280,114 L280,138" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="130" font-size="11" fill="#666" filter="url(#rough2)">哈希表分组</text>

  <!-- Step 2: Hash map grouping -->
  <text x="20" y="156" font-size="12" fill="#666" filter="url(#rough2)">② 哈希表：student_id → 成绩列表</text>

  <!-- Student 1 bucket -->
  <g filter="url(#rough2)">
    <rect x="40" y="164" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="80" y="182" text-anchor="middle" font-size="12" fill="#333">id = 1</text>
    <rect x="130" y="164" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="153" y="182" text-anchor="middle" font-size="11" fill="#333">91</text>
    <rect x="180" y="164" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="203" y="182" text-anchor="middle" font-size="11" fill="#333">92</text>
    <rect x="230" y="164" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="253" y="182" text-anchor="middle" font-size="11" fill="#333">60</text>
    <rect x="280" y="164" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="303" y="182" text-anchor="middle" font-size="11" fill="#333">65</text>
    <rect x="330" y="164" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="353" y="182" text-anchor="middle" font-size="11" fill="#333">87</text>
    <rect x="380" y="164" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="406" y="182" text-anchor="middle" font-size="11" fill="#333">100</text>
  </g>

  <!-- Student 2 bucket -->
  <g filter="url(#rough2)">
    <rect x="40" y="200" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="80" y="218" text-anchor="middle" font-size="12" fill="#333">id = 2</text>
    <rect x="130" y="200" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="153" y="218" text-anchor="middle" font-size="11" fill="#333">93</text>
    <rect x="180" y="200" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="203" y="218" text-anchor="middle" font-size="11" fill="#333">97</text>
    <rect x="230" y="200" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="253" y="218" text-anchor="middle" font-size="11" fill="#333">77</text>
    <rect x="280" y="200" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="303" y="218" text-anchor="middle" font-size="11" fill="#333">100</text>
    <rect x="330" y="200" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="353" y="218" text-anchor="middle" font-size="11" fill="#333">76</text>
  </g>

  <!-- Arrow down -->
  <path d="M280,236 L280,260" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="252" font-size="11" fill="#666" filter="url(#rough2)">降序排序取前5</text>

  <!-- Step 3: Top 5 + average -->
  <text x="20" y="278" font-size="12" fill="#666" filter="url(#rough2)">③ 每个学生取 Top5 → 求均分（整数除法）</text>

  <!-- Student 1 top 5 -->
  <g filter="url(#rough2)">
    <rect x="40" y="286" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="70" y="303" text-anchor="middle" font-size="11" fill="#333">id=1</text>
    <rect x="110" y="286" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="131" y="303" text-anchor="middle" font-size="11" fill="#333">100</text>
    <rect x="156" y="286" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="177" y="303" text-anchor="middle" font-size="11" fill="#333">92</text>
    <rect x="202" y="286" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="223" y="303" text-anchor="middle" font-size="11" fill="#333">91</text>
    <rect x="248" y="286" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="269" y="303" text-anchor="middle" font-size="11" fill="#333">87</text>
    <rect x="294" y="286" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="315" y="303" text-anchor="middle" font-size="11" fill="#333">65</text>
    <text x="350" y="303" font-size="11" fill="#666">→ (100+92+91+87+65)/5</text>
    <rect x="430" y="286" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="460" y="303" text-anchor="middle" font-size="12" fill="#b85450">= 87</text>
  </g>

  <!-- Student 2 top 5 -->
  <g filter="url(#rough2)">
    <rect x="40" y="320" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="70" y="337" text-anchor="middle" font-size="11" fill="#333">id=2</text>
    <rect x="110" y="320" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="131" y="337" text-anchor="middle" font-size="11" fill="#333">100</text>
    <rect x="156" y="320" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="177" y="337" text-anchor="middle" font-size="11" fill="#333">97</text>
    <rect x="202" y="320" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="223" y="337" text-anchor="middle" font-size="11" fill="#333">93</text>
    <rect x="248" y="320" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="269" y="337" text-anchor="middle" font-size="11" fill="#333">77</text>
    <rect x="294" y="320" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="315" y="337" text-anchor="middle" font-size="11" fill="#333">76</text>
    <text x="350" y="337" font-size="11" fill="#666">→ (100+97+93+77+76)/5</text>
    <rect x="430" y="320" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="460" y="337" text-anchor="middle" font-size="12" fill="#b85450">= 88</text>
  </g>

  <!-- Output -->
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    输出（按 id 升序）：[[1, 87], [2, 88]]
  </text>
</svg>
