<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程</text>

  <rect x="170" y="44" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = n ‖ (2n) ‖ (3n)</text>

  <path d="M260,86 L260,112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,116 380,156 260,196 140,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len(s) == 9 ?</text>
  <text x="260" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">三位×三段恰好 9 位</text>

  <path d="M380,156 L420,156 L420,180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="150" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="384" y="180" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="432" y="203" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return false</text>

  <path d="M260,196 L260,222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="214" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <polygon points="260,226 380,266 260,306 140,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">含 0 或 有重复 ?</text>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">位掩码逐位扫描</text>

  <path d="M380,266 L420,266 L420,290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="260" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="384" y="290" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="432" y="313" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return false</text>

  <path d="M260,306 L260,332" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="324" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="170" y="336" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true （迷人）</text>

  <text x="260" y="398" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">三关全过 ⟺ s 是 1~9 的一个全排列</text>
</svg>
