<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Dijkstra 流程：堆优化 + 两种松弛</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">节点 = 起点/终点/道路端点；边 = 步行 + 特殊道路</text>

  <!-- Init box -->
  <rect x="130" y="58" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化</text>
  <text x="260" y="96" text-anchor="middle" font-size="10" fill="#555">dist[start]=0, 其余=∞, heap=[(0, start)]</text>

  <!-- arrow down -->
  <path d="M 260 110 L 260 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pop box -->
  <rect x="130" y="134" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">弹出 (d, u) = heap.pop()</text>

  <!-- arrow down -->
  <path d="M 260 172 L 260 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: d > dist[u]? -->
  <path d="M 260 192 L 340 220 L 260 248 L 180 220 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">d &gt; dist[u]?</text>
  <text x="260" y="232" text-anchor="middle" font-size="9" fill="#999">(过期记录)</text>

  <!-- YES → skip, loop back to Pop -->
  <path d="M 340 220 L 400 220" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="212" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">YES</text>
  <text x="410" y="224" font-size="9" fill="#b85450">跳过</text>
  <!-- loop back arrow: from (400,220) up to pop box right side (390,151) -->
  <path d="M 400 220 Q 440 220 440 185 L 440 151 L 392 151" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- NO → down -->
  <path d="M 260 250 L 260 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="264" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold">NO</text>

  <!-- Decision 2: u == target? -->
  <path d="M 260 270 L 340 298 L 260 326 L 180 298 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">u == target?</text>
  <text x="260" y="310" text-anchor="middle" font-size="9" fill="#999">(终点已确定)</text>

  <!-- YES → return -->
  <path d="M 340 298 L 410 298" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="290" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">YES</text>
  <rect x="412" y="284" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="457" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return d ✓</text>

  <!-- NO → down -->
  <path d="M 260 328 L 260 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="342" text-anchor="end" font-size="9" fill="#888" font-weight="bold">NO</text>

  <!-- Relax box -->
  <rect x="70" y="350" width="380" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">松弛两种边</text>
  <text x="80" y="388" font-size="10" fill="#4a7a3a" font-weight="bold">① 步行到终点</text>
  <text x="200" y="388" font-size="9" fill="#555">d + |Δx|+|Δy| → dist[target]</text>
  <text x="80" y="406" font-size="10" fill="#d6a040" font-weight="bold">② 取道路 i</text>
  <text x="200" y="406" font-size="9" fill="#555">d + walk(到道路起点) + costᵢ → dist[road_end_i]</text>

  <!-- arrow down -->
  <path d="M 260 418 L 260 430" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Push + loop back -->
  <rect x="150" y="432" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="448" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">push 更新项 → 回到弹出</text>

  <!-- loop back arrow from push to pop (left side) -->
  <path d="M 150 444 Q 50 444 50 400 L 50 151 L 128 151" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
