<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">陷阱：平均费率 ≠ 逐笔费率的平均（车 1001）</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">四笔交易 → 两种平均口径分叉</text>

  <!-- 左侧：逐笔明细表 -->
  <rect x="25" y="56" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">时长</text>
  <rect x="95" y="56" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="130" y="72" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">费用</text>
  <rect x="165" y="56" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="72" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">逐笔费率</text>

  <rect x="25" y="84" width="70" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="101" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2.50h</text>
  <rect x="95" y="84" width="70" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="101" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">¥5.00</text>
  <rect x="165" y="84" width="70" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="101" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2.00</text>

  <rect x="25" y="112" width="70" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="129" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1.75h</text>
  <rect x="95" y="112" width="70" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="129" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">¥3.00</text>
  <rect x="165" y="112" width="70" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="129" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1.71</text>

  <rect x="25" y="140" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="157" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1.25h</text>
  <rect x="95" y="140" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="130" y="157" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">¥6.00</text>
  <rect x="165" y="140" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="157" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4.80</text>

  <rect x="25" y="168" width="70" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="185" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2.00h</text>
  <rect x="95" y="168" width="70" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="185" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">¥4.00</text>
  <rect x="165" y="168" width="70" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="185" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2.00</text>

  <rect x="25" y="202" width="210" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="221" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">Σ：7.50h · ¥18.00</text>

  <text x="130" y="252" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（红行：短时长 · 高费率）</text>

  <!-- 箭头：费率列 → 红框 -->
  <path d="M 238 122 Q 262 122 274 112" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" opacity="0.8" filter="url(#rough2)"/>
  <!-- 箭头：Σ行 → 绿框 -->
  <path d="M 238 216 Q 260 216 274 224" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 右上：错误口径 -->
  <rect x="278" y="66" width="220" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="388" y="88" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">逐笔费率再平均 ✗</text>
  <text x="388" y="110" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">(2.00 + 1.71 + 4.80 + 2.00) ÷ 4</text>
  <text x="388" y="132" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 2.63</text>
  <text x="388" y="147" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">每笔同权 → 高费率被放大</text>

  <!-- 右下：正确口径 -->
  <rect x="278" y="182" width="220" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="388" y="204" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总量相除 ✓（按时长加权）</text>
  <text x="388" y="226" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">18.00 ÷ 7.50</text>
  <text x="388" y="248" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 2.40</text>
  <text x="388" y="263" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">4.80 只占 1.25/7.5 的权重 → 被稀释</text>

  <!-- 底部注解 -->
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">车 1002 同样分叉：简单平均 1.30 vs 加权 1.33，方向还相反</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">只有各笔时长（权重）相同，两条路线才必然重合</text>
  <text x="260" y="348" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">记口径：速率 / 单价 / 费率类平均，一律「先加总、再相除」</text>
</svg>
