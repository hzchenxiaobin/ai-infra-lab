  <text x="640" y="114" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">3 种方案（选 2 个 b）</text>
  <text x="640" y="130" text-anchor="middle" font-size="10" fill="#888">s = r a b₂ b₃ b₄ i t</text>

  <text x="536" y="158" font-size="11" fill="#4a8e4a" font-weight="bold">① 用 b₂ + b₃</text>
  <text x="536" y="174" font-family="monospace" font-size="10" fill="#666">  r a b b _ i t</text>
  <text x="536" y="188" font-size="9" fill="#888">  跳过 b₄</text>

  <text x="536" y="214" font-size="11" fill="#4a8e4a" font-weight="bold">② 用 b₂ + b₄</text>
  <text x="536" y="230" font-family="monospace" font-size="10" fill="#666">  r a b _ b i t</text>
  <text x="536" y="244" font-size="9" fill="#888">  跳过 b₃</text>

  <text x="536" y="270" font-size="11" fill="#4a8e4a" font-weight="bold">③ 用 b₃ + b₄</text>
  <text x="536" y="286" font-family="monospace" font-size="10" fill="#666">  r a _ b b i t</text>
  <text x="536" y="300" font-size="9" fill="#888">  跳过 b₂</text>

  <text x="536" y="322" font-size="11" fill="#b03a3a" font-weight="bold">C(3,2) = 3 ✓</text>

  <!-- 底部图例 -->
  <text x="150" y="356" font-size="10" fill="#c98a2b">■ 橙 = 边界</text>
  <text x="270" y="356" font-size="10" fill="#4a8edb">■ 蓝 = 计算</text>
  <text x="390" y="356" font-size="10" fill="#4a8e4a">■ 绿 = 字符匹配</text>
  <text x="520" y="356" font-size="10" fill="#b03a3a">■ 红 = 答案 dp[m][n]</text>

  <text x="390" y="384" text-anchor="middle" font-size="11" fill="#888">关键：3 个连续 b 每多一个，dp[·][b列] 累加前一行同列值</text>
  <text x="390" y="402" text-anchor="middle" font-size="11" fill="#888">dp[5][3] = dp[4][2] + dp[4][3] = 1 + 2 = 3（"用 b₄" + "跳过 b₄"）</text>
</svg>
