<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">叶值最小代价生成树：枚举切分点 k（区间 DP）</text>
  <path d="M 180 36 Q 340 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Formula box -->
  <g filter="url(#sk)"><rect x="40" y="52" width="600" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="340" y="80" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">dp[i][j] = min&#123; dp[i][k] + dp[k+1][j] + maxLeaf[i][k] × maxLeaf[k+1][j] &#125;</text>

  <!-- Section label -->
  <text x="340" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">arr 序列 → 枚举根的切分点 k，左子树 [i..k]，右子树 [k+1..j]</text>

  <!-- Tree visualization area -->
  <!-- Root node -->
  <g filter="url(#sk2)"><ellipse cx="340" cy="155" rx="55" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="340" y="160" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">根节点</text>
  <text x="340" y="142" text-anchor="middle" font-size="9" fill="#888">= maxL × maxR</text>

  <!-- Left subtree box -->
  <g filter="url(#sk)"><rect x="100" y="195" width="200" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="200" y="215" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">左子树 [i..k]</text>
  <text x="200" y="232" text-anchor="middle" font-size="10" fill="#446688">叶子 = arr[i..k]</text>
  <text x="200" y="250" text-anchor="middle" font-size="10" fill="#446688">代价 = dp[i][k]</text>
  <text x="200" y="263" text-anchor="middle" font-size="9" fill="#888">最大叶 = maxLeaf[i][k]</text>

  <!-- Right subtree box -->
  <g filter="url(#sk)"><rect x="380" y="195" width="200" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="480" y="215" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">右子树 [k+1..j]</text>
  <text x="480" y="232" text-anchor="middle" font-size="10" fill="#d6a040">叶子 = arr[k+1..j]</text>
  <text x="480" y="250" text-anchor="middle" font-size="10" fill="#d6a040">代价 = dp[k+1][j]</text>
  <text x="480" y="263" text-anchor="middle" font-size="9" fill="#888">最大叶 = maxLeaf[k+1][j]</text>

  <!-- Connecting lines from root to subtrees -->
  <path d="M 300 168 Q 250 180 200 195" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 380 168 Q 430 180 480 195" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- arr sequence at bottom -->
  <text x="60" y="300" font-size="12" font-weight="bold" fill="#5a3a7a">arr 序列：</text>

  <!-- arr cells -->
  <g filter="url(#sk2)"><rect x="130" y="285" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="155" y="307" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">6</text>
  <text x="155" y="332" text-anchor="middle" font-size="9" fill="#888">arr[i]</text>

  <g filter="url(#sk2)"><rect x="310" y="285" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="335" y="307" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">k</text>
  <text x="335" y="332" text-anchor="middle" font-size="9" fill="#b03a3a">切分点</text>

  <g filter="url(#sk2)"><rect x="490" y="285" width="50" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="515" y="307" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold">4</text>
  <text x="515" y="332" text-anchor="middle" font-size="9" fill="#888">arr[j]</text>

  <!-- Left bracket under arr -->
  <path d="M 130 330 L 130 338 L 360 338 L 360 330" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="245" y="354" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">左子树叶子 arr[i..k]</text>

  <!-- Right bracket under arr -->
  <path d="M 360 330 L 360 338 L 540 338 L 540 330" stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="450" y="354" text-anchor="middle" font-size="10" fill="#8a6a1a" font-weight="bold">右子树叶子 arr[k+1..j]</text>

  <!-- Bottom formula breakdown -->
  <g filter="url(#sk)"><rect x="80" y="372" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="145" y="394" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">dp[i][k]</text>

  <text x="232" y="396" text-anchor="middle" font-size="18" fill="#5a5a5a" font-weight="bold">+</text>

  <g filter="url(#sk)"><rect x="250" y="372" width="130" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="315" y="394" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">dp[k+1][j]</text>

  <text x="402" y="396" text-anchor="middle" font-size="18" fill="#5a5a5a" font-weight="bold">+</text>

  <g filter="url(#sk)"><rect x="420" y="372" width="160" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="500" y="394" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">maxL × maxR（根的值）</text>
</svg>
