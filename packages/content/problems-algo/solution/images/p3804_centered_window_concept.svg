<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：左端点 i 固定、j 只右扩 —— 窗口纯增量（以 i = 0 为例）</text>

  <!-- 数组行 nums = [-1, 1, 0] -->
  <g filter="url(#rough2)">
    <rect x="206" y="40" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="264" y="40" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="322" y="40" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="233" y="61" text-anchor="middle" font-size="12" fill="#333">−1</text>
    <text x="291" y="61" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="349" y="61" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="233" y="88" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="291" y="88" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="349" y="88" text-anchor="middle" font-size="10" fill="#999">2</text>

    <path d="M 233 104 L 233 92" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="233" y="120" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">i 固定</text>

    <path d="M 296 100 L 342 100" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
    <text x="335" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j 只向右 →</text>
  </g>

  <!-- 右侧注记 -->
  <g filter="url(#rough2)">
    <text x="462" y="52" text-anchor="middle" font-size="10.5" fill="#666">每扩一格只做两件事</text>
    <text x="462" y="70" text-anchor="middle" font-size="10.5" fill="#8a6d1a">sum += nums[j]</text>
    <text x="462" y="86" text-anchor="middle" font-size="10.5" fill="#8a6d1a">seen ∪= { nums[j] }</text>
  </g>

  <!-- 列头 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#888">
    <text x="128" y="138" text-anchor="middle">窗口 [i..j]</text>
    <text x="232" y="138" text-anchor="middle">sum</text>
    <text x="346" y="138" text-anchor="middle">seen 集合</text>
    <text x="478" y="138" text-anchor="middle">判定 sum ∈ seen ?</text>
  </g>

  <!-- 行 1：j = 0 -->
  <g filter="url(#rough2)">
    <text x="32" y="163" font-size="11" fill="#33506b" font-weight="bold">j=0</text>
    <rect x="64"  y="144" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="102" y="144" width="36" height="28" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="140" y="144" width="36" height="28" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <text x="82"  y="162" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
    <text x="120" y="162" text-anchor="middle" font-size="10.5" fill="#999">1</text>
    <text x="158" y="162" text-anchor="middle" font-size="10.5" fill="#999">0</text>
    <rect x="210" y="144" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="232" y="162" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">−1</text>
    <rect x="278" y="144" width="136" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="346" y="162" text-anchor="middle" font-size="10.5" fill="#33506b">{ −1 }</text>
    <rect x="430" y="144" width="96" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="478" y="162" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">✓ 计入</text>
  </g>
  <path d="M 52 176 L 52 192" fill="none" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 2：j = 1 -->
  <g filter="url(#rough2)">
    <text x="32" y="215" font-size="11" fill="#33506b" font-weight="bold">j=1</text>
    <rect x="64"  y="196" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="102" y="196" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="140" y="196" width="36" height="28" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <text x="82"  y="214" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
    <text x="120" y="214" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <text x="158" y="214" text-anchor="middle" font-size="10.5" fill="#999">0</text>
    <rect x="210" y="196" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="232" y="214" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">0</text>
    <rect x="278" y="196" width="136" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="346" y="214" text-anchor="middle" font-size="10.5" fill="#33506b">{ −1, 1 }</text>
    <rect x="430" y="196" width="96" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="478" y="214" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">✗ 跳过</text>
  </g>
  <path d="M 52 228 L 52 244" fill="none" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 3：j = 2 -->
  <g filter="url(#rough2)">
    <text x="32" y="267" font-size="11" fill="#33506b" font-weight="bold">j=2</text>
    <rect x="64"  y="248" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="102" y="248" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="140" y="248" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="82"  y="266" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
    <text x="120" y="266" text-anchor="middle" font-size="10.5" fill="#333">1</text>
    <text x="158" y="266" text-anchor="middle" font-size="10.5" fill="#333">0</text>
    <rect x="210" y="248" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="232" y="266" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">0</text>
    <rect x="278" y="248" width="136" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="346" y="266" text-anchor="middle" font-size="10.5" fill="#33506b">{ −1, 1, 0 }</text>
    <rect x="430" y="248" width="96" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="478" y="266" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">✓ 计入</text>
  </g>

  <!-- 底部三条观察 -->
  <g filter="url(#rough2)">
    <rect x="30" y="290" width="500" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="310" text-anchor="middle" font-size="10.8" fill="#8a6d1a">① 判定只问 sum 在不在窗口 —— 与出现次数无关，哈希集合就够</text>
    <text x="280" y="327" text-anchor="middle" font-size="10.8" fill="#8a6d1a">② j 只右扩：窗口只增不删，seen 纯增量维护、无需撤销</text>
    <text x="280" y="344" text-anchor="middle" font-size="10.8" fill="#8a6d1a">③ n = 500：n(n+1)/2 ≈ 1.25×10⁵ 个子数组，每个 O(1) 判定</text>
  </g>
</svg>
