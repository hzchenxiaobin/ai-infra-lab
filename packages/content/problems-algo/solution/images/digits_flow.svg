<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="420" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：统计 → 两轮推导 → 升序拼接</text>

  <!-- Step 1: count frequency -->
  <rect x="120" y="42" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 统计字符频率 count[26]</text>

  <!-- arrow down -->
  <path d="M 240 76 L 240 92" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 1 header -->
  <text x="240" y="106" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第一轮：唯一字母直接识别</text>

  <!-- Phase 1 box -->
  <rect x="80" y="114" width="320" height="104" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="100" y="134" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">zero</text>
  <text x="150" y="134" font-size="11.5" fill="#555" filter="url(#rough2)">= count['z']</text>
  <text x="100" y="152" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">two</text>
  <text x="150" y="152" font-size="11.5" fill="#555" filter="url(#rough2)">= count['w']</text>
  <text x="100" y="170" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">four</text>
  <text x="150" y="170" font-size="11.5" fill="#555" filter="url(#rough2)">= count['u']</text>
  <text x="100" y="188" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">six</text>
  <text x="150" y="188" font-size="11.5" fill="#555" filter="url(#rough2)">= count['x']</text>
  <text x="100" y="206" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">eight</text>
  <text x="150" y="206" font-size="11.5" fill="#555" filter="url(#rough2)">= count['g']</text>

  <!-- arrow down -->
  <path d="M 240 220 L 240 236" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2 header -->
  <text x="240" y="250" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二轮：扣除已知推导剩余</text>

  <!-- Phase 2 box -->
  <rect x="80" y="258" width="320" height="104" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="100" y="278" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">three</text>
  <text x="150" y="278" font-size="11.5" fill="#555" filter="url(#rough2)">= count['h'] − eight</text>
  <text x="100" y="296" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">five</text>
  <text x="150" y="296" font-size="11.5" fill="#555" filter="url(#rough2)">= count['f'] − four</text>
  <text x="100" y="314" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">seven</text>
  <text x="150" y="314" font-size="11.5" fill="#555" filter="url(#rough2)">= count['s'] − six</text>
  <text x="100" y="332" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">nine</text>
  <text x="150" y="332" font-size="11.5" fill="#555" filter="url(#rough2)">= count['i'] − five − six − eight</text>
  <text x="100" y="350" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">one</text>
  <text x="150" y="350" font-size="11.5" fill="#555" filter="url(#rough2)">= count['o'] − zero − two − four</text>

  <!-- arrow down -->
  <path d="M 240 364 L 240 380" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: build result -->
  <rect x="100" y="384" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="405" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 按升序拼接数字 → 返回结果</text>
</svg>
