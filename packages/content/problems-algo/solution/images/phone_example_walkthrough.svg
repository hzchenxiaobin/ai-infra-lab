<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="780" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">六条示例行的匹配演算：锚定 + 转义 + 空格三道关</text>
  <path d="M 180 44 Q 390 52 600 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Header row ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="64" width="720" height="34" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="44" y="86" font-size="12" font-weight="bold" fill="#555">输入行</text>
  <text x="360" y="86" font-size="12" font-weight="bold" fill="#555">匹配</text>
  <text x="450" y="86" font-size="12" font-weight="bold" fill="#555">原因</text>
  <!-- column dividers -->
  <path d="M 340 64 L 340 98" stroke="#cccccc" stroke-width="1" filter="url(#sk)"/>
  <path d="M 430 64 L 430 98" stroke="#cccccc" stroke-width="1" filter="url(#sk)"/>

  <!-- ============ Row 1: 987-123-4567 ✓ ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="98" width="720" height="44" rx="4" fill="#eaf6ee" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="44" y="126" font-size="13" fill="#2e6e2e" font-family="'Courier New',monospace">987-123-4567</text>
  <text x="376" y="126" font-size="16" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="450" y="126" font-size="11" fill="#2e6e2e">前缀 A「987-」+ 后缀「123-4567」，整行严格匹配</text>

  <!-- ============ Row 2: (123) 456-7890 ✓ ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="142" width="720" height="44" rx="4" fill="#eaf6ee" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="44" y="170" font-size="13" fill="#2e6e2e" font-family="'Courier New',monospace">(123) 456-7890</text>
  <text x="376" y="170" font-size="16" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="450" y="170" font-size="11" fill="#2e6e2e">前缀 B「(123) 」（含空格）+ 后缀，整行匹配</text>

  <!-- ============ Row 3: 123 456 7890 ✗ ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="186" width="720" height="44" rx="4" fill="#fce4ec" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="44" y="214" font-size="13" fill="#b85450" font-family="'Courier New',monospace">123 456 7890</text>
  <text x="376" y="214" font-size="16" font-weight="bold" fill="#b85450">✗</text>
  <text x="450" y="214" font-size="11" fill="#b85450">无 - 也无 ()，两个前缀都不匹配</text>

  <!-- ============ Row 4: (123)456-7890 ✗ ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="230" width="720" height="44" rx="4" fill="#fce4ec" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="44" y="258" font-size="13" fill="#b85450" font-family="'Courier New',monospace">(123)456-7890</text>
  <text x="376" y="258" font-size="16" font-weight="bold" fill="#b85450">✗</text>
  <text x="450" y="258" font-size="11" fill="#b85450">) 后缺空格，前缀 B 的「\) 空格」未满足</text>

  <!-- ============ Row 5: 987-123-456 ✗ ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="274" width="720" height="44" rx="4" fill="#fce4ec" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="44" y="302" font-size="13" fill="#b85450" font-family="'Courier New',monospace">987-123-456</text>
  <text x="376" y="302" font-size="16" font-weight="bold" fill="#b85450">✗</text>
  <text x="450" y="302" font-size="11" fill="#b85450">后缀缺一位数字，[0-9]{4} 需 4 位此处仅 3 位</text>

  <!-- ============ Row 6: x987-123-4567y ✗ ============ -->
  <g filter="url(#sk)">
    <rect x="30" y="318" width="720" height="44" rx="4" fill="#fce4ec" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="44" y="346" font-size="13" fill="#b85450" font-family="'Courier New',monospace">x987-123-4567y</text>
  <text x="376" y="346" font-size="16" font-weight="bold" fill="#b85450">✗</text>
  <text x="450" y="346" font-size="11" fill="#b85450">行首 x / 行尾 y 破坏 ^$ 锚（无锚则子串命中误判 ✓）</text>

  <!-- column dividers full height -->
  <path d="M 340 98 L 340 362" stroke="#dddddd" stroke-width="1" filter="url(#sk)"/>
  <path d="M 430 98 L 430 362" stroke="#dddddd" stroke-width="1" filter="url(#sk)"/>

  <!-- Footer note -->
  <text x="390" y="388" text-anchor="middle" font-size="11" fill="#888">三道关：① 括号 \(\) 转义　② B 格式 ) 后空格　③ ^$ 锁整行</text>
</svg>
