<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：位计数 → 高位到低位贪心聚集 → 求平方和</text>

  <!-- 步骤1 -->
  <rect x="130" y="40" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 统计位库存</text>
  <text x="280" y="73" text-anchor="middle" font-size="11" fill="#555">cnt[b] = nums 中二进制第 b 位为 1 的元素个数（b = 0..29）</text>

  <path d="M 280 80 L 280 96" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="130" y="98" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② vals = [0, 0, …, 0]（k 个数，保持降序）</text>

  <path d="M 280 134 L 280 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <!-- 步骤3 循环 -->
  <rect x="80" y="152" width="400" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ for b = 29 ↓ 0（从高位到低位）</text>
  <rect x="100" y="180" width="360" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#333">c = min(cnt[b], k)　← 这一位最多发 c 份</text>
  <rect x="100" y="216" width="360" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#333">vals[0..c−1] += 2^b　← 只加前缀，数组仍降序</text>
  <text x="280" y="247" text-anchor="middle" font-size="10" fill="#b85450">「劫富」：把位发给当前最大的 c 个数，无需重新排序</text>

  <path d="M 280 262 L 280 278" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <!-- 步骤4 -->
  <rect x="130" y="280" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 累加平方和</text>
  <text x="280" y="313" text-anchor="middle" font-size="11" fill="#555">ans = (Σ vals[i]²) mod (10⁹ + 7)</text>

  <path d="M 280 320 L 280 336" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <!-- 步骤5 -->
  <rect x="130" y="338" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 返回 ans</text>

  <!-- 侧注 -->
  <rect x="40" y="390" width="480" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">为什么从高位到低位？</text>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#555">高位权重 2^b 最大，先发给最大的数才能形成「一超多强」的集中形态；</text>
  <text x="280" y="442" text-anchor="middle" font-size="11" fill="#555">前缀加同一个 2^b 后降序不破坏（vals[c−1] + 2^b ≥ vals[c]），全程免排序</text>
</svg>
