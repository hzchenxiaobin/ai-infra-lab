<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- title -->
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例：n = 50 = 110010₂（低 6 位，bit5→bit0）</text>

  <!-- column header: index numbers above cells (5..0) -->
  <text x="116" y="60" text-anchor="end" font-size="10" fill="#aaa" filter="url(#rough2)">下标</text>
  <text x="142" y="60" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">5</text>
  <text x="178" y="60" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="214" y="60" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="250" y="60" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="286" y="60" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="322" y="60" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">0</text>

  <!-- ===== Row n ===== bit5..bit0 = 1,1,0,0,1,0 -->
  <text x="116" y="84" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">n</text>
  <rect x="124" y="66" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="66" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="66" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="66" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="66" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="304" y="66" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="142" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="178" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="214" y="86" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">0</text>
  <text x="250" y="86" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">0</text>
  <text x="286" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="322" y="86" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">0</text>

  <!-- ===== Even mask row 0101.. (bit5..bit0 = 0,1,0,1,0,1) -->
  <text x="116" y="122" text-anchor="end" font-size="12" fill="#2a3a55" filter="url(#rough2)">&amp; 偶位掩码</text>
  <rect x="124" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="304" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="142" y="124" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="178" y="124" text-anchor="middle" font-size="14" fill="#2a3a55" filter="url(#rough2)">1</text>
  <text x="214" y="124" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="250" y="124" text-anchor="middle" font-size="14" fill="#2a3a55" filter="url(#rough2)">1</text>
  <text x="286" y="124" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="322" y="124" text-anchor="middle" font-size="14" fill="#2a3a55" filter="url(#rough2)">1</text>

  <!-- ===== Even AND result row = 0,1,0,0,0,0  (highlight bit4 = 1) -->
  <text x="116" y="160" text-anchor="end" font-size="12" fill="#2a3a55" filter="url(#rough2)">= n &amp; 掩码</text>
  <rect x="124" y="142" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="142" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="142" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="142" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="142" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="304" y="142" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="162" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="178" y="162" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="214" y="162" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="250" y="162" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="286" y="162" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="322" y="162" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>

  <!-- even pill -->
  <rect x="120" y="180" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="230" y="199" text-anchor="middle" font-size="13" fill="#2a3a55" filter="url(#rough2)">even = popcount(010000) = 1</text>

  <!-- ===== Odd mask row 1010.. (bit5..bit0 = 1,0,1,0,1,0) -->
  <text x="116" y="236" text-anchor="end" font-size="12" fill="#2f5a26" filter="url(#rough2)">&amp; 奇位掩码</text>
  <rect x="124" y="218" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="218" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="218" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="218" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="218" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="304" y="218" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="142" y="238" text-anchor="middle" font-size="14" fill="#2f5a26" filter="url(#rough2)">1</text>
  <text x="178" y="238" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="214" y="238" text-anchor="middle" font-size="14" fill="#2f5a26" filter="url(#rough2)">1</text>
  <text x="250" y="238" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="286" y="238" text-anchor="middle" font-size="14" fill="#2f5a26" filter="url(#rough2)">1</text>
  <text x="322" y="238" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>

  <!-- ===== Odd AND result row = 1,0,0,0,1,0  (highlight bit5, bit1) -->
  <text x="116" y="274" text-anchor="end" font-size="12" fill="#2f5a26" filter="url(#rough2)">= n &amp; 掩码</text>
  <rect x="124" y="256" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="256" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="256" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="232" y="256" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="256" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="304" y="256" width="36" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="276" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="178" y="276" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="214" y="276" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="250" y="276" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="286" y="276" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="322" y="276" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>

  <!-- odd pill -->
  <rect x="120" y="294" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="230" y="313" text-anchor="middle" font-size="13" fill="#2f5a26" filter="url(#rough2)">odd = popcount(100010) = 2</text>

  <!-- return box -->
  <rect x="160" y="330" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">return [1, 2]</text>
</svg>
