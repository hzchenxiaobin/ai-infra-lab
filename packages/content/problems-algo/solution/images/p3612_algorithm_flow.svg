<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：单趟扫描，四类字符各归其位</text>

  <!-- 开始 -->
  <rect x="170" y="34" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化：D = ∅，rev = false</text>
  <path d="M 260 58 L 260 66" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 读字符 -->
  <rect x="175" y="70" width="170" height="22" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取 s 的下一个字符 c</text>
  <path d="M 260 92 L 260 100" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判字符类型 -->
  <polygon points="260,108 330,134 260,160 190,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c 是？</text>

  <!-- 分支箭头 -->
  <path d="M 195 140 C 120 150, 75 160, 67 176" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <path d="M 215 155 C 200 168, 195 170, 191 176" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <path d="M 305 155 C 320 168, 315 170, 315 176" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <path d="M 325 140 C 400 150, 435 160, 439 176" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrY)" filter="url(#rough2)"/>

  <!-- 分支框 1：字母 -->
  <rect x="10" y="182" width="114" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="67" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">小写字母 c</text>
  <text x="67" y="219" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">rev ? push_front(c)</text>
  <text x="67" y="237" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否则 push_back(c)</text>

  <!-- 分支框 2：* -->
  <rect x="134" y="182" width="114" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="191" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'*' 删逻辑尾</text>
  <text x="191" y="214" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">rev ? pop_front()</text>
  <text x="191" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否则 pop_back()</text>
  <text x="191" y="246" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（空则跳过）</text>

  <!-- 分支框 3：# -->
  <rect x="258" y="182" width="114" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'#' 翻倍</text>
  <text x="315" y="219" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">D := D + D</text>
  <text x="315" y="237" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">与 rev 无关</text>

  <!-- 分支框 4：% -->
  <rect x="382" y="182" width="114" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="439" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'%' 反转</text>
  <text x="439" y="219" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">rev = !rev</text>
  <text x="439" y="237" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">O(1)！不动 D</text>

  <!-- 汇流 -->
  <path d="M 67 252 L 67 262" fill="none" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 191 252 L 191 262" fill="none" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 315 252 L 315 262" fill="none" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 439 252 L 439 262" fill="none" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 67 262 L 439 262" fill="none" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 260 262 L 260 270" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判是否扫完 -->
  <polygon points="260,274 318,293 260,312 202,293" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s 扫完？</text>

  <!-- 是 → 输出 -->
  <path d="M 260 312 L 260 322" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="322" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="95" y="326" width="330" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rev ? 逆序读 D : 正序读 D → 输出 result</text>

  <!-- 否 → 回环 -->
  <path d="M 318 293 C 400 296, 506 280, 506 200 L 506 85 L 354 85" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="398" y="285" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
</svg>
