<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：分组 → 频率统计 → Top2 配对 → 求最小操作数</text>

  <!-- Step 1: Split -->
  <rect x="180" y="44" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① 按下标奇偶分成两组</text>

  <path d="M 280 82 L 280 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Count frequencies - two boxes -->
  <rect x="80" y="100" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 偶数位频率统计</text>

  <rect x="320" y="100" width="160" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="123" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 奇数位频率统计</text>

  <path d="M 160 138 L 160 152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 138 L 400 152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Top 2 -->
  <rect x="80" y="156" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 取 Top 2：(a₁,c₁)(a₂,c₂)</text>

  <rect x="320" y="156" width="160" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="179" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 取 Top 2：(b₁,d₁)(b₂,d₂)</text>

  <!-- converge -->
  <path d="M 160 194 L 160 206 L 280 206 L 280 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 194 L 400 206 L 280 206" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: Decision diamond -->
  <polygon points="280,222 380,262 280,302 180,262" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a₁ == b₁ ?</text>
  <text x="280" y="272" text-anchor="middle" font-size="9.5" fill="#888">最高频值是否相同</text>

  <!-- No branch (left) -->
  <path d="M 180 262 L 100 262 L 100 286" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="120" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="30" y="290" width="140" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">直接配对</text>
  <text x="100" y="326" text-anchor="middle" font-size="10" fill="#555">max_sum = c₁ + d₁</text>

  <!-- Yes branch (right) -->
  <path d="M 380 262 L 460 262 L 460 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="420" y="256" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <rect x="380" y="290" width="160" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">退而求其次</text>
  <text x="460" y="326" text-anchor="middle" font-size="10" fill="#555">候选1: c₁ + d₂</text>
  <text x="460" y="340" text-anchor="middle" font-size="10" fill="#555">候选2: c₂ + d₁</text>
  <text x="460" y="354" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">max_sum = max(候选1, 候选2)</text>

  <!-- converge to answer -->
  <path d="M 100 342 L 100 376 L 280 376 L 280 390" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 356 L 460 376 L 280 376" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- Final answer -->
  <rect x="160" y="394" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">答案 = n − max_sum</text>
  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#888">max_sum = 保留的元素数（不需改变的）</text>

  <!-- Notes at bottom -->
  <text x="280" y="454" text-anchor="middle" font-size="9.5" fill="#aaa" font-style="italic">注：Top 2 足矣——若 top1 冲突，只需 top2 作为备选；第三高频不可能更优</text>
</svg>
