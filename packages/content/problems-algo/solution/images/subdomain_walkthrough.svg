<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：4 条记录逐条累加哈希表</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">关注 com、mail.com 被多条记录累加的过程</text>

  <!-- column headers -->
  <text x="40" y="72" font-size="10" fill="#888" font-weight="bold">记录</text>
  <text x="200" y="72" font-size="10" fill="#888" font-weight="bold">拆出的后缀（各 += count）</text>
  <text x="470" y="72" font-size="10" fill="#888" font-weight="bold">关键累计</text>

  <!-- ===== Record 1 ===== -->
  <rect x="20" y="82" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="105" y="104" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">900 google.mail.com</text>
  <g font-size="10">
    <rect x="200" y="84" width="120" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="260" y="94" text-anchor="middle" fill="#333">google.mail.com +900</text>
    <rect x="325" y="84" width="80" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="365" y="94" text-anchor="middle" fill="#333">mail.com +900</text>
    <rect x="410" y="84" width="55" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="437" y="94" text-anchor="middle" fill="#333">com +900</text>
  </g>
  <text x="470" y="100" font-size="10" fill="#555">com=900</text>
  <text x="470" y="114" font-size="10" fill="#555">mail.com=900</text>

  <!-- ===== Record 2 ===== -->
  <rect x="20" y="128" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">50 yahoo.com</text>
  <g font-size="10">
    <rect x="200" y="130" width="90" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="245" y="140" text-anchor="middle" fill="#333">yahoo.com +50</text>
    <rect x="295" y="130" width="55" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="322" y="140" text-anchor="middle" fill="#b85450" font-weight="bold">com +50</text>
  </g>
  <text x="470" y="146" font-size="10" fill="#b85450" font-weight="bold">com=950</text>
  <text x="470" y="160" font-size="10" fill="#888">（900+50）</text>

  <!-- ===== Record 3 ===== -->
  <rect x="20" y="174" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="105" y="196" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1 intel.mail.com</text>
  <g font-size="10">
    <rect x="200" y="176" width="115" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="257" y="186" text-anchor="middle" fill="#333">intel.mail.com +1</text>
    <rect x="320" y="176" width="80" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="360" y="186" text-anchor="middle" fill="#b85450" font-weight="bold">mail.com +1</text>
    <rect x="405" y="176" width="55" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="432" y="186" text-anchor="middle" fill="#b85450" font-weight="bold">com +1</text>
  </g>
  <text x="470" y="186" font-size="10" fill="#b85450" font-weight="bold">mail.com=901</text>
  <text x="470" y="200" font-size="10" fill="#b85450" font-weight="bold">com=951</text>

  <!-- ===== Record 4 ===== -->
  <rect x="20" y="220" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="105" y="242" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5 wiki.org</text>
  <g font-size="10">
    <rect x="200" y="222" width="75" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="237" y="232" text-anchor="middle" fill="#333">wiki.org +5</text>
    <rect x="280" y="222" width="55" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="307" y="232" text-anchor="middle" fill="#333">org +5</text>
  </g>
  <text x="470" y="238" font-size="10" fill="#555">org=5</text>
  <text x="470" y="252" font-size="10" fill="#888">（com 不受影响）</text>

  <!-- separator -->
  <line x1="20" y1="276" x2="580" y2="276" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- final hashmap -->
  <text x="40" y="300" font-size="11" fill="#444" font-weight="bold">最终哈希表 cnt（7 项）：</text>

  <g font-size="10">
    <rect x="40" y="310" width="250" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="55" y="325" fill="#333">google.mail.com</text>
    <text x="270" y="325" text-anchor="end" fill="#333" font-weight="bold">900</text>
    <rect x="40" y="334" width="250" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="55" y="349" fill="#b85450" font-weight="bold">mail.com  ← 被 2 条累加</text>
    <text x="270" y="349" text-anchor="end" fill="#b85450" font-weight="bold">901</text>
    <rect x="40" y="358" width="250" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="55" y="373" fill="#b85450" font-weight="bold">com  ← 被 3 条累加</text>
    <text x="270" y="373" text-anchor="end" fill="#b85450" font-weight="bold">951</text>
  </g>

  <g font-size="10">
    <rect x="310" y="310" width="250" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="325" y="325" fill="#333">yahoo.com</text>
    <text x="540" y="325" text-anchor="end" fill="#333" font-weight="bold">50</text>
    <rect x="310" y="334" width="250" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="325" y="349" fill="#333">intel.mail.com</text>
    <text x="540" y="349" text-anchor="end" fill="#333" font-weight="bold">1</text>
    <rect x="310" y="358" width="250" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="325" y="373" fill="#333">wiki.org</text>
    <text x="540" y="373" text-anchor="end" fill="#333" font-weight="bold">5</text>
    <rect x="310" y="382" width="250" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="325" y="397" fill="#333">org</text>
    <text x="540" y="397" text-anchor="end" fill="#333" font-weight="bold">5</text>
  </g>

  <!-- result -->
  <rect x="40" y="418" width="520" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="438" font-size="11" fill="#4a7a3a" font-weight="bold">格式化输出（顺序任意）：</text>
  <text x="60" y="456" font-size="10" fill="#333">["901 mail.com","50 yahoo.com","900 google.mail.com","5 wiki.org","5 org","1 intel.mail.com","951 com"] ✓</text>
</svg>
