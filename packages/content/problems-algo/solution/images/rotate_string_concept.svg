<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：s+s 包含 s 的所有旋转</text>

  <!-- s = abcde -->
  <text x="40" y="74" font-size="12" fill="#446688" font-weight="bold">s =</text>
  <rect x="180" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="200" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="220" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="240" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="260" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
  <rect x="300" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">d</text>
  <rect x="340" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="360" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>

  <!-- doubling arrow -->
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#888">拼接自身 →</text>
  <path d="M 280 116 L 280 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- s+s = abcdeabcde -->
  <text x="40" y="156" font-size="12" fill="#446688" font-weight="bold">s+s =</text>
  <!-- chars: a b c d e a b c d e  (indices 0..9) -->
  <rect x="80" y="132" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="100" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="120" y="132" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="140" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="160" y="132" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="180" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
  <rect x="200" y="132" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="220" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">d</text>
  <rect x="240" y="132" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>
  <rect x="280" y="132" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="300" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <rect x="320" y="132" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="340" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">b</text>
  <rect x="360" y="132" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="380" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">c</text>
  <rect x="400" y="132" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="420" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">d</text>
  <rect x="440" y="132" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="460" y="156" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">e</text>

  <!-- index labels -->
  <text x="100" y="184" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="140" y="184" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="180" y="184" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="220" y="184" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="260" y="184" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="300" y="184" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="340" y="184" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="380" y="184" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="420" y="184" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="460" y="184" text-anchor="middle" font-size="9" fill="#888">9</text>

  <!-- separator note -->
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#888">长度为 n=5 的滑动窗口 = 所有旋转：</text>

  <!-- 5 rotation rows -->
  <!-- k=0: abcde window[0..4] -->
  <text x="40" y="238" font-size="11" fill="#446688" font-weight="bold">k=0</text>
  <rect x="80" y="220" width="200" height="28" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
  <text x="300" y="238" font-size="12" fill="#888">abcde</text>

  <!-- k=1: bcdea window[1..5] -->
  <text x="40" y="268" font-size="11" fill="#446688" font-weight="bold">k=1</text>
  <rect x="120" y="250" width="200" height="28" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
  <text x="340" y="268" font-size="12" fill="#888">bcdea</text>

  <!-- k=2: cdeab window[2..6] -> MATCH goal -->
  <text x="40" y="298" font-size="11" fill="#4a7a3a" font-weight="bold">k=2</text>
  <rect x="160" y="280" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="380" y="298" font-size="12" fill="#4a7a3a" font-weight="bold">cdeab ✓ = goal</text>

  <!-- k=3: deabc window[3..7] -->
  <text x="40" y="328" font-size="11" fill="#446688" font-weight="bold">k=3</text>
  <rect x="200" y="310" width="200" height="28" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
  <text x="420" y="328" font-size="12" fill="#888">deabc</text>

  <!-- k=4: eabcd window[4..8] -->
  <text x="40" y="358" font-size="11" fill="#446688" font-weight="bold">k=4</text>
  <rect x="240" y="340" width="200" height="28" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
  <text x="460" y="358" font-size="12" fill="#888">eabcd</text>

  <!-- conclusion box -->
  <rect x="40" y="390" width="480" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="412" font-size="12" fill="#4a7a3a" font-weight="bold">判定：goal 是 s 的旋转 ⟺ len 相同 且 goal 是 s+s 的子串</text>
  <text x="56" y="430" font-size="11" fill="#4a7a3a">goal="cdeab" → 命中 k=2 → true</text>
  <text x="56" y="448" font-size="11" fill="#b85450">goal="abced" → 无窗口匹配 → false</text>
</svg>
