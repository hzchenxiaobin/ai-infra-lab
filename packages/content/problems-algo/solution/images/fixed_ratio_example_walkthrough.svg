  <rect x="216" y="124" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="140" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="272" y="124" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="294" y="140" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="316" y="124" width="210" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="421" y="140" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- row i=3 -->
  <rect x="36" y="148" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="164" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="72" y="148" width="44" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="94" y="164" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="116" y="148" width="56" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>
  <rect x="172" y="148" width="44" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="194" y="164" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <rect x="216" y="148" width="56" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="164" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="272" y="148" width="44" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="294" y="164" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="316" y="148" width="210" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="421" y="164" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- row i=4  HIT -->
  <rect x="36" y="172" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="54" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="72" y="172" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="94" y="188" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="116" y="172" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="144" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+3</text>
  <rect x="172" y="172" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="194" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="216" y="172" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="244" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="272" y="172" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="294" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="316" y="172" width="210" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="421" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s[0..4]="01110" ✓</text>

  <!-- row i=5 -->
  <rect x="36" y="196" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="212" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="72" y="196" width="44" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="94" y="212" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="116" y="196" width="56" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>
  <rect x="172" y="196" width="44" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="194" y="212" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <rect x="216" y="196" width="56" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="212" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="272" y="196" width="44" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="294" y="212" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="316" y="196" width="210" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="421" y="212" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- row i=6  HIT -->
  <rect x="36" y="220" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="54" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <rect x="72" y="220" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="94" y="236" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="116" y="220" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="144" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+3</text>
  <rect x="172" y="220" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="194" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="216" y="220" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="244" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="272" y="220" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="294" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="316" y="220" width="210" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="421" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s[2..6]="11010" ✓</text>

  <!-- summary -->
  <rect x="36" y="260" width="490" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="281" y="282" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">ans = 2</text>
  <text x="281" y="302" text-anchor="middle" font-size="11.5" fill="#333">i=4：cur 回到 0，与空前缀 F(0)=0 配对 → "01110"</text>
  <text x="281" y="320" text-anchor="middle" font-size="11.5" fill="#333">i=6：cur 回到 1，与 i=2 的 F=1 配对 → "11010"</text>
</svg>
