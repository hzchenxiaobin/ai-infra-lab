<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s="0111010"，num1=2，num2=3</text>
  <text x="36" y="42" font-size="11" fill="#888">初值：cur=0，cnt={0:1}，ans=0（空前缀 F(0)=0 已入表）</text>

  <!-- header -->
  <rect x="36" y="52" width="36" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="54" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <rect x="72" y="52" width="44" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="94" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s[i]</text>
  <rect x="116" y="52" width="56" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="144" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Δcur</text>
  <rect x="172" y="52" width="44" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="194" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cur</text>
  <rect x="216" y="52" width="56" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="244" y="69" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">贡献cnt</text>
  <rect x="272" y="52" width="44" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="294" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>
  <rect x="316" y="52" width="210" height="24" fill="#446688" filter="url(#rough2)"/>
  <text x="421" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">命中子串</text>

  <!-- row i=0 -->
  <rect x="36" y="76" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="92" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="72" y="76" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="94" y="92" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="116" y="76" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+3</text>
  <rect x="172" y="76" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="194" y="92" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="216" y="76" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="92" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="272" y="76" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="294" y="92" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="316" y="76" width="210" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="421" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- row i=1 -->
  <rect x="36" y="100" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="72" y="100" width="44" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="94" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="116" y="100" width="56" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>
  <rect x="172" y="100" width="44" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="194" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="216" y="100" width="56" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="244" y="116" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="272" y="100" width="44" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="294" y="116" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="316" y="100" width="210" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="421" y="116" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- row i=2 -->
  <rect x="36" y="124" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="54" y="140" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="72" y="124" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
