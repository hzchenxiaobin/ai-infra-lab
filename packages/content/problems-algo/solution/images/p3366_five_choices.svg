<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：每个元素是一件「分组背包」物品 —— 5 种支付方式</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以 x = 19、k = 3 为例；操作① = ÷2 向上取整，操作② = −k（门槛 x ≥ k）</text>

  <!-- 根节点：当前元素 -->
  <rect x="36" y="96" width="118" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="122" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">x = 19</text>
  <text x="95" y="140" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">k = 3</text>
  <text x="95" y="154" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">h = ⌈x/2⌉ = 10</text>

  <!-- 五种决策 -->
  <rect x="250" y="66" width="244" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="262" y="87" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">不操作 → 19</text>
  <text x="262" y="106" font-size="9.5" fill="#777" filter="url(#rough2)">花费 (0, 0)</text>

  <rect x="250" y="126" width="244" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="262" y="147" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">仅操作① → ⌈x/2⌉ = 10</text>
  <text x="262" y="166" font-size="9.5" fill="#777" filter="url(#rough2)">花费 (1, 0)</text>

  <rect x="250" y="186" width="244" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="262" y="207" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">仅操作② → x − k = 16</text>
  <text x="262" y="226" font-size="9.5" fill="#777" filter="url(#rough2)">花费 (0, 1)，门槛 x ≥ k ✓</text>

  <rect x="250" y="246" width="244" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="262" y="267" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">先①后② → 10 − 3 = 7 ← 最小！</text>
  <text x="262" y="286" font-size="9.5" fill="#777" filter="url(#rough2)">花费 (1, 1)，门槛 ⌈x/2⌉ = 10 ≥ k ✓</text>

  <rect x="250" y="306" width="244" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="262" y="327" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">先②后① → ⌈16/2⌉ = 8</text>
  <text x="262" y="346" font-size="9.5" fill="#777" filter="url(#rough2)">同样花费 (1, 1)，门槛 x ≥ k —— 顺序不同，结果不同！</text>

  <!-- 根到五种决策的箭头 -->
  <path d="M 154 112 C 200 100 220 92 246 92" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 154 120 C 200 118 220 126 246 140" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 154 132 C 200 140 220 168 246 198" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 154 144 C 200 160 220 216 246 254" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 148 158 C 190 190 210 262 246 316" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="20" y="372" width="480" height="56" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="393" font-size="10" fill="#333" filter="url(#rough2)">预算 (a, b) 全局共享：dp[a][b] = 处理完当前前缀、剩 a 次①和 b 次② 时的最小和；</text>
  <text x="34" y="411" font-size="10" fill="#333" filter="url(#rough2)">每件「物品」从 5 种方式中挑一种（同一下标每招至多一次）→ 二维费用分组背包，逐元素滚动。</text>
</svg>
