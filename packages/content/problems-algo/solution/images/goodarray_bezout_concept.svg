<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">裴蜀定理：gcd(a,b)=1 ⟺ ∃ 整数 x,y 使 ax+by=1</text>

  <!-- Left side: gcd = 1 case -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">gcd = 1 → 可以凑出 1</text>

  <rect x="60" y="72" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="85" y="93" text-anchor="middle" font-size="14" fill="#333">5</text>

  <rect x="130" y="72" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="93" text-anchor="middle" font-size="14" fill="#333">7</text>

  <text x="200" y="93" font-size="11" fill="#888">gcd(5,7)=1</text>

  <!-- Equation -->
  <rect x="50" y="120" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="148" text-anchor="middle" font-size="13" fill="#333">5×3 + 7×(−2) = 15 − 14 = 1 ✓</text>

  <!-- Visual: number line hops -->
  <text x="40" y="192" font-size="10" fill="#888">数轴上：5的倍数与7的倍数必然相交</text>
  <path d="M 50 210 L 290 210" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="50" cy="210" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="50" y="226" text-anchor="middle" font-size="9" fill="#888">0</text>
  <circle cx="85" cy="210" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="85" y="226" text-anchor="middle" font-size="9" fill="#446688">5</text>
  <circle cx="120" cy="210" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="120" y="226" text-anchor="middle" font-size="9" fill="#446688">10</text>
  <circle cx="155" cy="210" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="155" y="226" text-anchor="middle" font-size="9" fill="#d6a040">7</text>
  <circle cx="190" cy="210" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="190" y="226" text-anchor="middle" font-size="9" fill="#446688">15</text>
  <circle cx="225" cy="210" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="225" y="226" text-anchor="middle" font-size="9" fill="#d6a040">14</text>
  <circle cx="260" cy="210" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="9" fill="#d6a040">21</text>
  <text x="190" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">15 − 14 = 1 → 差为1!</text>

  <!-- Divider -->
  <path d="M 310 50 L 310 260" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Right side: gcd > 1 case -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">gcd &gt; 1 → 无法凑出 1</text>

  <rect x="350" y="72" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="375" y="93" text-anchor="middle" font-size="14" fill="#333">3</text>

  <rect x="420" y="72" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="445" y="93" text-anchor="middle" font-size="14" fill="#333">6</text>

  <text x="490" y="93" font-size="11" fill="#888">gcd(3,6)=3</text>

  <!-- Equation -->
  <rect x="340" y="120" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="142" text-anchor="middle" font-size="12" fill="#b85450">3x + 6y = 3(x+2y)</text>
  <text x="450" y="158" text-anchor="middle" font-size="12" fill="#b85450">→ 结果恒为 3 的倍数 ✗</text>

  <!-- Visual: all multiples of 3 -->
  <text x="330" y="192" font-size="10" fill="#888">所有线性组合都是 3 的倍数：</text>
  <path d="M 330 210 L 540 210" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="330" cy="210" r="3" fill="#888" filter="url(#rough2)"/>
  <text x="330" y="226" text-anchor="middle" font-size="9" fill="#888">0</text>
  <circle cx="360" cy="210" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="360" y="226" text-anchor="middle" font-size="9" fill="#b85450">3</text>
  <circle cx="390" cy="210" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="390" y="226" text-anchor="middle" font-size="9" fill="#b85450">6</text>
  <circle cx="420" cy="210" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="420" y="226" text-anchor="middle" font-size="9" fill="#b85450">9</text>
  <circle cx="450" cy="210" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="450" y="226" text-anchor="middle" font-size="9" fill="#b85450">12</text>
  <text x="430" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">永远跳不到 1 ✗</text>

  <!-- Bottom: key takeaway -->
  <rect x="60" y="278" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">推广到 n 个数：gcd(a₁,a₂,...,aₙ) = 1</text>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">⟺ ∃ 整数 x₁,...,xₙ 使 a₁x₁ + ... + aₙxₙ = 1</text>

  <rect x="80" y="338" width="400" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">💡 只需对整个数组求一遍 GCD，等于 1 即「好数组」</text>
</svg>
