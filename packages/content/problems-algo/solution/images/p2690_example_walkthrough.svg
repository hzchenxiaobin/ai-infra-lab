<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两个测试用例，prop 原样返回</text>

  <!-- Table outline -->
  <rect x="30" y="48" width="540" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <line x1="166" y1="48" x2="166" y2="104" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="338" y1="48" x2="338" y2="104" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="466" y1="48" x2="466" y2="104" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="98" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">方法名 prop</text>
  <text x="252" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">调用 obj.&lt;prop&gt;()</text>
  <text x="402" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">get 返回</text>
  <text x="498" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最终结果</text>

  <!-- Row 1: abc123 -->
  <rect x="30" y="108" width="540" height="62" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <line x1="166" y1="108" x2="166" y2="170" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="338" y1="108" x2="338" y2="170" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="466" y1="108" x2="466" y2="170" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="98" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">abc123</text>
  <text x="252" y="144" text-anchor="middle" font-size="11" fill="#446688">obj.abc123()</text>
  <text x="402" y="144" text-anchor="middle" font-size="11" fill="#b85450">() =&gt; "abc123"</text>
  <text x="498" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"abc123"</text>

  <!-- Row 2: special chars -->
  <rect x="30" y="176" width="540" height="74" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <line x1="166" y1="176" x2="166" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="338" y1="176" x2="338" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="466" y1="176" x2="466" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="98" y="218" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">.-qw73n|^2It</text>
  <text x="252" y="218" text-anchor="middle" font-size="9.5" fill="#446688">obj[".-qw73n|^2It"]()</text>
  <text x="402" y="218" text-anchor="middle" font-size="9" fill="#b85450">() =&gt; ".-qw73n|^2It"</text>
  <text x="498" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">".-qw73n|^2It"</text>

  <!-- Bottom note -->
  <rect x="60" y="266" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="286" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：prop 可以是任意合法字符串（含 . - ^ | 等特殊字符）</text>
  <text x="300" y="304" text-anchor="middle" font-size="10.5" fill="#888">用方括号语法 obj["..."] 可访问任意属性名，get 一律拦截</text>
</svg>
