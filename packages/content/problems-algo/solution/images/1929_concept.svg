<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：ans = nums 串联 nums → 统一为 ans[j] = nums[j % n]</text>

  <!-- nums row -->
  <text x="80" y="74" font-size="11.5" fill="#888">nums (n=3)</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="210" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="232" y="79">1</text>
    <rect x="258" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="280" y="79">2</text>
    <rect x="306" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="328" y="79">1</text>
  </g>

  <!-- big down arrow with label -->
  <path d="M 280 96 L 280 128" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="298" y="116" font-size="11" fill="#b85450" font-weight="bold">串联自身</text>

  <!-- ans row -->
  <text x="60" y="154" font-size="11.5" fill="#888">ans (2n=6)</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <!-- first copy blue -->
    <rect x="138" y="136" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="159">1</text>
    <rect x="186" y="136" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="208" y="159">2</text>
    <rect x="234" y="136" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="256" y="159">1</text>
    <!-- second copy green -->
    <rect x="282" y="136" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="304" y="159">1</text>
    <rect x="330" y="136" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="352" y="159">2</text>
    <rect x="378" y="136" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="400" y="159">1</text>
  </g>

  <!-- ans index labels -->
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="160" y="184">j=0</text>
    <text x="208" y="184">1</text>
    <text x="256" y="184">2</text>
    <text x="304" y="184">3</text>
    <text x="352" y="184">4</text>
    <text x="400" y="184">5</text>
  </g>

  <!-- bracket labels -->
  <text x="208" y="202" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ans[0..n-1] = nums</text>
  <text x="352" y="202" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ans[n..2n-1] = nums</text>

  <!-- Divider -->
  <path d="M 40 218 L 520 218" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula section -->
  <text x="280" y="240" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">两条规则统一为一条公式</text>

  <rect x="60" y="254" width="200" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="274" text-anchor="middle" font-size="11" fill="#333">规则①：ans[i] = nums[i]</text>
  <text x="160" y="292" text-anchor="middle" font-size="10.5" fill="#888">（0 ≤ i &lt; n）</text>

  <rect x="300" y="254" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="274" text-anchor="middle" font-size="11" fill="#333">规则②：ans[i+n] = nums[i]</text>
  <text x="400" y="292" text-anchor="middle" font-size="10.5" fill="#888">（0 ≤ i &lt; n）</text>

  <!-- merge arrows -->
  <path d="M 160 306 L 240 330" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 400 306 L 320 330" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- unified formula -->
  <rect x="130" y="336" width="300" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans[j] = nums[j % n]，0 ≤ j &lt; 2n</text>

  <!-- notes -->
  <text x="60" y="398" font-size="11" fill="#555">• j % n 把 0..2n-1 映射回 0..n-1，两段天然重复</text>
  <text x="60" y="412" font-size="11" fill="#555">• 模 n 视角连接「环形数组」，见第 5 节扩展</text>
</svg>
