<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：平衡 ⟺ len = maxFreq × distinct</text>

  <!-- 左面板：平衡 -->
  <rect x="18" y="40" width="232" height="236" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="62" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">"abba"：平衡 ✓</text>

  <rect x="57" y="74" width="34" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="97" y="74" width="34" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="137" y="74" width="34" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="177" y="74" width="34" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>

  <text x="134" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a 出现 2 次，b 出现 2 次</text>

  <path d="M 34 140 L 234 140" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="134" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len（子串长度）= 4</text>
  <text x="134" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">distinct（不同字符数）= 2</text>
  <text x="134" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">maxFreq（最高次数）= 2</text>

  <rect x="58" y="212" width="152" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="232" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2 × 2 = 4 = len ✓</text>

  <text x="134" y="262" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a、b 次数相同 → 平衡</text>

  <!-- 右面板：不平衡 -->
  <rect x="270" y="40" width="232" height="236" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="62" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">"aab"：不平衡 ✗</text>

  <rect x="329" y="74" width="34" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="369" y="74" width="34" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="409" y="74" width="34" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <text x="386" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a 出现 2 次，b 出现 1 次</text>

  <path d="M 286 140 L 486 140" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="386" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len = 3</text>
  <text x="386" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">distinct = 2</text>
  <text x="386" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">maxFreq = 2</text>

  <rect x="310" y="212" width="152" height="30" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="232" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2 × 2 = 4 ≠ 3 ✗</text>

  <text x="386" y="262" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">b 落后 1 次 → 不平衡</text>

  <!-- 底部结论 -->
  <rect x="18" y="290" width="484" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每个出现过的字符次数 ≤ maxFreq ⇒ len ≤ maxFreq × distinct（恒成立）</text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">等号成立 ⟺ 每个字符都恰好出现 maxFreq 次 —— 一次乘法，O(1) 判定！</text>
</svg>
