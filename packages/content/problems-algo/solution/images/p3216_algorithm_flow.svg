<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：单趟扫描，首个命中即换即停</text>

  <!-- 开始 -->
  <rect x="185" y="38" width="150" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始：i = 0</text>

  <path d="M260,68 L260,90" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：还有相邻对？ -->
  <polygon points="162,132 260,92 358,132 260,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">还有相邻对？</text>
  <text x="260" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(i + 1 &lt; n ?)</text>

  <text x="368" y="124" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M358,132 L388,132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="114" width="118" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="136" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">原样返回 s</text>

  <text x="268" y="190" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M260,172 L260,198" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：命中判定 -->
  <polygon points="148,252 260,204 372,252 260,300" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s[i] 与 s[i+1] 同奇偶</text>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">且 s[i] &gt; s[i+1] ?</text>

  <text x="130" y="244" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M148,252 L118,252" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="26" y="235" width="92" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = i + 1</text>
  <path d="M72,235 L72,132 L160,132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="268" y="312" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M260,300 L260,316" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 交换 -->
  <rect x="168" y="318" width="184" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">swap(s[i], s[i+1])</text>

  <path d="M352,334 L382,334" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="384" y="316" width="120" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回新 s ✓</text>

  <!-- 右侧注解 -->
  <rect x="398" y="176" width="106" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="451" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">一次判定两问</text>
  <text x="451" y="214" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">① 同奇偶？</text>
  <text x="451" y="230" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">② 前 &gt; 后？</text>
  <text x="451" y="248" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">都满足才换，</text>
  <text x="451" y="264" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">换完即 break</text>
</svg>
