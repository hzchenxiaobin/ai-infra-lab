<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums1=[1,2,3,2,4], nums2=[2,3,1,2,3]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">5 点 (x,y,idx)：(1,2,0) (2,3,1) (3,1,2) (2,2,3) (4,3,4)　按 x 排序后 m=2, xm=3</text>

  <!-- Table header -->
  <text x="40" y="74" font-size="10.5" fill="#666">阶段</text>
  <text x="120" y="74" font-size="10.5" fill="#666">处理范围</text>
  <text x="250" y="74" font-size="10.5" fill="#666">关键候选 (dist)</text>
  <text x="400" y="74" font-size="10.5" fill="#666">当前最优 (d, lo, hi)</text>
  <path d="M 28 82 L 540 82" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: 递归左半 -->
  <rect x="28" y="88" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="68" y="108" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">递归左半</text>
  <text x="120" y="108" font-size="10.5" fill="#333">[0,2]：点 0,1,3</text>
  <text x="250" y="108" font-size="10.5" fill="#555">(0,3)=1, (1,3)=1</text>
  <rect x="380" y="92" width="156" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="458" y="108" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(1, 0, 3)</text>
  <text x="546" y="108" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row 2: 递归右半 -->
  <rect x="28" y="124" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="68" y="144" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">递归右半</text>
  <text x="120" y="144" font-size="10.5" fill="#333">[3,4]：点 2,4</text>
  <text x="250" y="144" font-size="10.5" fill="#555">(2,4)=4</text>
  <rect x="380" y="128" width="156" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="458" y="144" text-anchor="middle" font-size="10.5" fill="#333">(4, 2, 4)</text>
  <text x="546" y="144" font-size="11" fill="#888">—</text>

  <!-- Row 3: 取小 -->
  <rect x="28" y="160" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="68" y="180" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">取较小者</text>
  <text x="120" y="180" font-size="10.5" fill="#888">—</text>
  <text x="250" y="180" font-size="10.5" fill="#555">min(左1, 右4)</text>
  <rect x="380" y="164" width="156" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="458" y="180" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(1, 0, 3)</text>
  <text x="546" y="180" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row 4: 合并窄带 -->
  <rect x="28" y="196" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="68" y="216" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">合并窄带</text>
  <text x="120" y="216" font-size="10.5" fill="#333">|x−3|≤1：点 1,3,2</text>
  <text x="250" y="216" font-size="10.5" fill="#555">(1,2)=3, (3,2)=2</text>
  <text x="380" y="216" font-size="10.5" fill="#888">均 ≥ 1，保持不变</text>
  <text x="546" y="216" font-size="11" fill="#888">—</text>

  <!-- divider -->
  <path d="M 28 238 L 540 238" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="80" y="252" width="400" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最终最优：(1, 0, 3) → 输出 [0, 3] ⭐</text>

  <!-- Closest pair visualized on mini-plane -->
  <text x="36" y="316" font-size="10.5" fill="#666">最近对示意：</text>

  <!-- mini axes -->
  <path d="M 70 400 L 250 400" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 70 400 L 70 300" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="252" y="404" font-size="9" fill="#aaa">x</text>
  <text x="64" y="298" font-size="9" fill="#aaa">y</text>

  <!-- mini point coords: x*36+90, 400-y*28 -->
  <!-- (1,2,0)->(126,344) (2,3,1)->(162,316) (3,1,2)->(198,372) (2,2,3)->(162,344) (4,3,4)->(234,316) -->
  <!-- closest pair line -->
  <path d="M 126 344 L 162 344" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="144" y="338" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>

  <circle cx="126" cy="344" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="126" y="334" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0</text>
  <circle cx="162" cy="344" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="162" y="334" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <circle cx="162" cy="316" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="314" font-size="8.5" fill="#446688" font-weight="bold">1</text>
  <circle cx="198" cy="372" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="198" y="388" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">2</text>
  <circle cx="234" cy="316" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="234" y="308" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Right side: key insight note -->
  <rect x="290" y="300" width="248" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="414" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">字典序关键点</text>
  <text x="302" y="338" font-size="10" fill="#555">左半内部 (0,3) 与 (1,3) 距离同为 1</text>
  <text x="302" y="354" font-size="10" fill="#555">→ 比下标 lo：0 &lt; 1 → 取 (0,3)</text>
  <text x="302" y="370" font-size="10" fill="#555">合并跨侧 (1,2)=3、(3,2)=2 均 ≥ 1</text>
  <text x="302" y="384" font-size="10" fill="#a87020">→ 不改进，全局最优 (1, 0, 3)</text>
</svg>
