<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：每字母可支撑气球数 = ⌊text 数量 ÷ 单个需求⌋，取最小值</text>

  <!-- ===== Section A: "balloon" letters ===== -->
  <text x="40" y="48" font-size="11" fill="#446688" font-weight="bold">单词 "balloon" 的字母构成：</text>

  <g filter="url(#rough2)">
    <rect x="168" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="184" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
    <rect x="200" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="216" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
    <rect x="232" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="248" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
    <rect x="264" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
    <rect x="296" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="312" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
    <rect x="328" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="344" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
    <rect x="360" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="376" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n</text>
  </g>

  <!-- arrow down -->
  <path d="M 280 86 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="96" font-size="10" fill="#888">去重</text>

  <!-- requirement cells -->
  <text x="40" y="112" font-size="11" fill="#446688" font-weight="bold">每个 balloon 需要的各字母量：</text>

  <g filter="url(#rough2)">
    <rect x="140" y="120" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="176" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b: 1</text>
    <rect x="216" y="120" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="252" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 1</text>
    <rect x="292" y="120" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="328" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l: 2</text>
    <rect x="368" y="120" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="404" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">o: 2</text>
    <rect x="444" y="120" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="480" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n: 1</text>
  </g>

  <!-- ===== Section B: table for example 2 ===== -->
  <text x="40" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">以 text = "loonbalxballpoon" 为例：</text>

  <!-- Table: 6 columns. Label col x=40 w=150, 5 letter cols x=190,250,310,370,430 w=60 -->
  <g filter="url(#rough2)">
    <!-- Header row: 字母 | b | a | l | o | n -->
    <rect x="40" y="184" width="150" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="115" y="200" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">字母</text>
    <rect x="190" y="184" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="220" y="200" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">b</text>
    <rect x="250" y="184" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="280" y="200" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">a</text>
    <rect x="310" y="184" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="340" y="200" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">l</text>
    <rect x="370" y="184" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="400" y="200" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">o</text>
    <rect x="430" y="184" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="460" y="200" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">n</text>

    <!-- Row 1: 每个气球需求 -->
    <rect x="40" y="208" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
    <text x="115" y="224" text-anchor="middle" font-size="11" fill="#333">每个气球需求</text>
    <rect x="190" y="208" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
    <text x="220" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="250" y="208" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
    <text x="280" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="310" y="208" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
    <text x="340" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="370" y="208" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
    <text x="400" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="430" y="208" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2"/>
    <text x="460" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

    <!-- Row 2: text 中数量 -->
    <rect x="40" y="232" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="115" y="248" text-anchor="middle" font-size="11" fill="#333">text 中数量</text>
    <rect x="190" y="232" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="220" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="250" y="232" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="280" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="310" y="232" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="340" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <rect x="370" y="232" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="400" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <rect x="430" y="232" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="460" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

    <!-- Row 3: ⌊数量 ÷ 需求⌋ -->
    <rect x="40" y="256" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="115" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⌊数量 ÷ 需求⌋</text>
    <rect x="190" y="256" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="220" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="250" y="256" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="280" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="310" y="256" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="340" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="370" y="256" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="400" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="430" y="256" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="460" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- ===== Section C: bottleneck ===== -->
  <path d="M 280 284 L 280 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="302" width="360" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="280" y="322" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">瓶颈 = min(2, 2, 2, 2, 2) = 2</text>
  </g>

  <path d="M 280 334 L 280 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="140" y="352" width="280" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="280" y="371" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最多拼出 2 个 "balloon"</text>
  </g>
</svg>
