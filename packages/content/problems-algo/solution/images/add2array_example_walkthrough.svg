<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：num = [2, 1, 5], k = 806 → 结果 [1, 0, 2, 1]</text>

  <text x="40" y="58" font-size="10" fill="#888">步骤</text>
  <text x="190" y="58" text-anchor="middle" font-size="10" fill="#888">num 演变</text>
  <text x="316" y="58" font-size="10" fill="#888">运算</text>
  <text x="430" y="58" text-anchor="middle" font-size="10" fill="#888">k</text>

  <line x1="24" y1="64" x2="516" y2="64" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="40" y="80" font-size="11" fill="#333">初始</text>
  <rect x="140" y="68" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="190" y="68" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="68" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="316" y="88" font-size="10" fill="#888">—</text>
  <rect x="395" y="68" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">806</text>

  <text x="40" y="128" font-size="11" fill="#333">i=2</text>
  <rect x="140" y="116" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="190" y="116" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="116" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="316" y="136" font-size="10" fill="#666">806+5=811</text>
  <rect x="395" y="116" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">81</text>

  <text x="40" y="176" font-size="11" fill="#333">i=1</text>
  <rect x="140" y="164" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="190" y="164" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="240" y="164" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="316" y="184" font-size="10" fill="#666">81+1=82</text>
  <rect x="395" y="164" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>

  <text x="40" y="224" font-size="11" fill="#333">i=0</text>
  <rect x="140" y="212" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="232" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="190" y="212" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="232" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="240" y="212" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="232" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="316" y="232" font-size="10" fill="#666">8+2=10</text>
  <rect x="395" y="212" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <text x="40" y="272" font-size="11" fill="#d6a040" font-weight="bold">补位</text>
  <rect x="88" y="260" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="280" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="140" y="260" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="280" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="190" y="260" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="280" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="240" y="260" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="280" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="316" y="280" font-size="10" fill="#d6a040" font-weight="bold">k=1&gt;0，首位补 1</text>
  <rect x="395" y="260" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <line x1="24" y1="302" x2="516" y2="302" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">215 + 806 = 1021 ✓　绿色=本步改动的位，橙色=末尾补出的最高位</text>
</svg>
