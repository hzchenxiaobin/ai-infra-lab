<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">段间任意保序穿插：多重集排列 × 段内序</text>

  <!-- chain A -->
  <text x="26" y="74" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">段A（首·边界）L=2</text>
  <rect x="170" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a1</text>
  <rect x="206" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a2</text>

  <!-- chain B -->
  <text x="26" y="118" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">段B（内部）L=3</text>
  <rect x="170" y="100" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="119" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b1</text>
  <rect x="206" y="100" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="119" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b2</text>
  <rect x="242" y="100" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="119" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b3</text>

  <!-- chain C -->
  <text x="26" y="162" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">段C（末·边界）L=1</text>
  <rect x="170" y="144" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c1</text>

  <text x="360" y="122" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">S = 2+3+1 = 6</text>
  <text x="360" y="140" font-size="10.5" fill="#888" filter="url(#rough2)">（健康孩子总数）</text>

  <!-- interleave arrow -->
  <path d="M 260 182 L 260 200" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="292" y="196" font-size="10.5" fill="#d6a040" filter="url(#rough2)">保序穿插</text>

  <!-- timeline -->
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">一种合法交错（同色同段，段内相对顺序不变）</text>
  <rect x="138" y="226" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="154" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a1</text>
  <rect x="178" y="226" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b1</text>
  <rect x="218" y="226" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="234" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a2</text>
  <rect x="258" y="226" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="274" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c1</text>
  <rect x="298" y="226" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="314" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b2</text>
  <rect x="338" y="226" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="354" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b3</text>

  <text x="260" y="274" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">交错数 = 6! / (2!·3!·1!) = 60 种</text>

  <!-- formula box -->
  <rect x="26" y="290" width="468" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="42" y="312" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">最终答案（mod 10^9 + 7）</text>
  <text x="42" y="334" font-size="12" fill="#333" filter="url(#rough2)">ans = S! / (L1!·L2!·…·Lt!)  ×  2^k</text>
  <text x="42" y="354" font-size="11" fill="#333" filter="url(#rough2)">k = Σ (Li − 1)，仅对内部段求和</text>
  <text x="42" y="378" font-size="11" fill="#2f5d24" filter="url(#rough2)">本图：6!/(2!·3!·1!) × 2^(3−1) = 60 × 4 = 240</text>
</svg>
