<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历求 T 与 max(val)</text>

  <!-- 起点 -->
  <rect x="200" y="50" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T = 0,  maxVal = 0</text>

  <line x1="280" y1="84" x2="280" y2="108" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历 -->
  <rect x="170" y="108" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">遍历每笔交易 (cost, cashback)</text>

  <line x1="280" y1="142" x2="280" y2="166" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,166 360,210 280,254 200,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cashback</text>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">&lt; cost ?</text>

  <!-- 是分支 -->
  <line x1="200" y1="210" x2="100" y2="210" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="202" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是（亏）</text>
  <rect x="20" y="188" width="76" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="58" y="206" text-anchor="middle" font-size="9.5" fill="#b85450">T +=</text>
  <text x="58" y="220" text-anchor="middle" font-size="9.5" fill="#b85450">cost−cashback</text>
  <text x="58" y="234" text-anchor="middle" font-size="9.5" fill="#b85450">maxVal↑cb</text>

  <!-- 否分支 -->
  <line x1="360" y1="210" x2="460" y2="210" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否（赚）</text>
  <rect x="464" y="194" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="502" y="206" text-anchor="middle" font-size="9.5" fill="#4a7a3a">maxVal</text>
  <text x="502" y="220" text-anchor="middle" font-size="9.5" fill="#4a7a3a">↑ cost</text>

  <!-- 回到遍历 -->
  <path d="M 58,232 Q 58,300 170,300 Q 230,300 230,142" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="292" font-size="9.5" fill="#888">下一笔</text>
  <path d="M 502,226 Q 502,300 390,300 Q 330,300 330,142" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="292" font-size="9.5" fill="#888">下一笔</text>

  <line x1="280" y1="254" x2="280" y2="312" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="288" font-size="9.5" fill="#888">遍历结束</text>

  <!-- 返回 -->
  <rect x="170" y="312" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 T + maxVal</text>

  <!-- 提示框 -->
  <rect x="36" y="360" width="488" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#446688">💡 无需排序、无需分类存储：单趟扫描 O(n) 时间、O(1) 空间</text>
</svg>
