<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流水线：四段 CTE 串成「前缀 MAX → 岛标记 → 累加成组 → 聚合」</text>

  <!-- Stage boxes: arranged in 2 rows of 2 + final -->
  <!-- Stage 1: HallEvents -->
  <rect x="30" y="52" width="150" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① HallEvents</text>
  <text x="105" y="92" text-anchor="middle" font-size="10" fill="#333">hall_id, start_day, end_day</text>
  <text x="105" y="105" text-anchor="middle" font-size="9" fill="#888">原始活动表</text>

  <!-- arrow 1 -> 2 -->
  <path d="M 180 82 L 218 82" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 2: labeled -->
  <rect x="220" y="52" width="160" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② labeled：前缀 MAX</text>
  <text x="300" y="92" text-anchor="middle" font-size="9" fill="#333">prev_max_end = MAX(end_day)</text>
  <text x="300" y="104" text-anchor="middle" font-size="9" fill="#333">OVER(… 1 PRECEDING)</text>

  <!-- arrow 2 -> 3 (wrap down) -->
  <path d="M 300 112 L 300 138 L 338 138 L 338 156" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 3: flagged -->
  <rect x="220" y="158" width="160" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ flagged：岛边界</text>
  <text x="300" y="198" text-anchor="middle" font-size="9" fill="#333">is_new = 1 iff</text>
  <text x="300" y="210" text-anchor="middle" font-size="9" fill="#333">start &gt; prev_max_end</text>

  <!-- arrow 3 -> 4 -->
  <path d="M 220 188 L 182 188" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 4: grouped -->
  <rect x="30" y="158" width="150" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ grouped：累加成组</text>
  <text x="105" y="198" text-anchor="middle" font-size="9" fill="#333">grp = SUM(is_new)</text>
  <text x="105" y="210" text-anchor="middle" font-size="9" fill="#333">OVER(… UNBOUNDED)</text>

  <!-- arrow 4 -> result -->
  <path d="M 105 218 L 105 244 L 290 244" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 5: result -->
  <rect x="160" y="250" width="260" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">⑤ 结果：GROUP BY hall_id, grp</text>
  <text x="290" y="290" text-anchor="middle" font-size="10" fill="#333">MIN(start_day), MAX(end_day)</text>
  <text x="290" y="304" text-anchor="middle" font-size="9" fill="#888">每岛取最小起点 + 最大终点</text>

  <!-- note boxes -->
  <rect x="30" y="330" width="250" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="155" y="348" text-anchor="middle" font-size="9" fill="#555">窗口顺序 = ORDER BY start_day, end_day</text>
  <text x="155" y="362" text-anchor="middle" font-size="9" fill="#555">PARTITION BY hall_id 保证大厅独立</text>

  <rect x="300" y="330" width="250" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="425" y="348" text-anchor="middle" font-size="9" fill="#555">ROWS … 1 PRECEDING 取严格前缀</text>
  <text x="425" y="362" text-anchor="middle" font-size="9" fill="#555">不含当前行，避免「自比」恒真</text>
</svg>
