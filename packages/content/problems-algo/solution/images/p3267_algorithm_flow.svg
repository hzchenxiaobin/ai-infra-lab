<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：双层枚举两步闭包 + 先查后插</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">橙色 = 最容易写错的两处；L = 全局最大位数（≤ 7）</text>

  <!-- 左列 -->
  <rect x="36" y="48" width="232" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="152" y="71" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 遍历取下一个 x</text>

  <rect x="36" y="98" width="232" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="121" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">② 补前导 0 到 L 位；S = {x}</text>

  <rect x="36" y="148" width="232" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="171" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">③ 外层选位置对 (i,j)：swap 后记一步变体</text>

  <rect x="36" y="198" width="232" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="221" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">④ 内层选位置对 (k,l)：中间串上再 swap，记两步变体</text>

  <rect x="36" y="248" width="232" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="152" y="265" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">⑤ swap 回 (k,l)！穷尽所有 (k,l)</text>
  <text x="152" y="279" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">不换回 → 交换叠加 → 闭包越界</text>

  <rect x="36" y="298" width="232" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="152" y="315" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">⑥ swap 回 (i,j)！穷尽所有 (i,j)</text>
  <text x="152" y="329" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">回到中间串原貌，才能进下一个外层</text>

  <!-- 左列箭头 -->
  <path d="M 152 84 L 152 94" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 134 L 152 144" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 184 L 152 194" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 234 L 152 244" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 284 L 152 294" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 内层回环：⑤ → ④ -->
  <path d="M 60 248 C 44 248, 44 216, 56 216" fill="none" stroke="#a07830" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="38" y="234" font-size="8.5" fill="#a07830" filter="url(#rough2)">内层循环</text>

  <!-- 右列 -->
  <rect x="300" y="48" width="186" height="36" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="393" y="71" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⑨ 数组遍历完？→ 返回 ans</text>

  <rect x="300" y="98" width="186" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="393" y="115" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑦ 先查：ans += Σ seen[v]，v ∈ S</text>
  <text x="393" y="129" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">（此时表里只有之前的原值）</text>

  <rect x="300" y="148" width="186" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="393" y="165" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑧ 后插：seen[x] += 1</text>
  <text x="393" y="179" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">（顺序反了 → (x,x) 自配对）</text>

  <!-- ⑥ → ⑦ 的跨列箭头 -->
  <path d="M 268 316 C 288 316, 288 120, 296 118" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="292" y="232" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">闭包完成</text>

  <!-- ⑧ → ⑨ -->
  <path d="M 393 184 L 393 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <!-- ⑨ → ① 回环 -->
  <path d="M 296 66 C 278 66, 278 66, 272 66" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="56" font-size="8.5" fill="#888" filter="url(#rough2)">下一个 x</text>

  <!-- 右下警示框 -->
  <rect x="300" y="200" width="186" height="134" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="393" y="222" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">为什么必须「两次恢复」？</text>
  <text x="393" y="242" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">内层若不换回，下一个 (k,l) 作用在</text>
  <text x="393" y="256" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">上次交换的产物上 → 串对应 3+ 次交换</text>
  <text x="393" y="274" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">闭包越界 → 1023 和 2130（需 3 次）</text>
  <text x="393" y="288" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">被错误纳入 → 示例 1 从 4 变 5</text>
  <text x="393" y="310" text-anchor="middle" font-size="9.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">替代写法：每层 list(w) 复制新串，</text>
  <text x="393" y="324" text-anchor="middle" font-size="9.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">稍慢但不易错</text>
</svg>
