<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SPF 筛 → 质因子分解 → union → 统计最大分量</text>

  <!-- Step 1: SPF sieve -->
  <rect x="170" y="48" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 构建 SPF 筛表</text>
  <text x="270" y="83" text-anchor="middle" font-size="10.5" fill="#666">spf[x] = x 的最小质因子, O(M log log M)</text>
  <line x1="270" y1="92" x2="270" y2="110" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Init UF -->
  <rect x="170" y="110" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 初始化并查集 parent[0..M]</text>
  <line x1="270" y1="144" x2="270" y2="162" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Factorize + union -->
  <rect x="150" y="162" width="240" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="183" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 对每个 num 分解质因子</text>
  <text x="270" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">union(num, p)</text>
  <!-- loop back arrow -->
  <path d="M 390 189 Q 440 189 440 127 Q 440 127 370 127" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="162" font-size="10" fill="#888">下一个</text>

  <line x1="270" y1="216" x2="270" y2="236" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Count -->
  <rect x="140" y="236" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 统计 find(num) 按根计数</text>
  <text x="270" y="272" text-anchor="middle" font-size="10.5" fill="#666">→ 各连通分量大小</text>
  <line x1="270" y1="284" x2="270" y2="302" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Return -->
  <rect x="190" y="302" width="160" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="321" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⑤ 返回最大计数</text>
  <text x="270" y="337" text-anchor="middle" font-size="10.5" fill="#888">最大分量大小</text>

  <!-- Side note: SPF decomposition -->
  <rect x="20" y="162" width="120" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="182" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">SPF 分解</text>
  <text x="80" y="200" text-anchor="middle" font-size="10" fill="#666">x /= spf[x]</text>
  <text x="80" y="216" text-anchor="middle" font-size="10" fill="#666">直到 x = 1</text>
  <text x="80" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(log x) / 数</text>

  <!-- Side note: virtual bridge -->
  <rect x="400" y="236" width="120" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="460" y="256" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">虚拟桥节点</text>
  <text x="460" y="274" text-anchor="middle" font-size="10" fill="#666">质因子 p</text>
  <text x="460" y="290" text-anchor="middle" font-size="10" fill="#666">连接所有</text>
  <text x="460" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">含 p 的数</text>

  <!-- bottom note -->
  <rect x="60" y="356" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="10.5" fill="#666">数与质因子共用编号 0..M，无需额外映射</text>
</svg>
