<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=2, goal=3, k=0</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">dp[i][j] = 长度 i、恰好用 j 首歌的播放列表数</text>

  <!-- ===== DP Table ===== -->
  <!-- Header row: j values -->
  <text x="80" y="72" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">i \ j</text>
  <rect x="110" y="58" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="77" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="185" y="58" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="77" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="58" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="77" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Row i=0 -->
  <rect x="40" y="92" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="110" y="92" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="185" y="92" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="111" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="260" y="92" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="295" y="111" text-anchor="middle" font-size="11" fill="#ccc">0</text>

  <!-- Row i=1 -->
  <rect x="40" y="126" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="145" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="126" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="145" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="185" y="126" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="126" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="295" y="145" text-anchor="middle" font-size="11" fill="#ccc">0</text>

  <!-- Row i=2 -->
  <rect x="40" y="160" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="179" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="110" y="160" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="179" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="185" y="160" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="160" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- Row i=3 -->
  <rect x="40" y="194" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="110" y="194" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="213" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <rect x="185" y="194" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="213" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="194" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="213" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>

  <!-- Arrow to answer -->
  <path d="M 335 208 L 380 208" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="206" font-size="11" fill="#b85450" font-weight="bold">答案</text>
  <text x="395" y="220" font-size="10" fill="#888">dp[3][2]=6</text>

  <!-- ===== Annotations ===== -->
  <text x="350" y="100" font-size="10" fill="#4a7a3a">↑ 基准 dp[0][0]=1</text>

  <text x="350" y="140" font-size="10" fill="#4a7a3a">dp[1][1] = 1×(2−0) = 2</text>
  <text x="350" y="152" font-size="9" fill="#888">放新歌，2 首可选</text>

  <text x="350" y="172" font-size="10" fill="#d6a040">dp[2][1] = 2×max(1,0) = 2</text>
  <text x="350" y="184" font-size="9" fill="#888">重放，k=0 故 1 首可重放</text>

  <text x="350" y="206" font-size="10" fill="#4a7a3a">dp[2][2] = 2×(2−1) = 2</text>
  <text x="350" y="218" font-size="9" fill="#888">放第二首新歌</text>

  <!-- Bottom calculation for answer cell -->
  <rect x="40" y="244" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[3][2] = dp[2][1]×(n−j+1) + dp[2][2]×max(j−k,0)</text>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#333">= 2×(2−2+1) + 2×max(2−0, 0)</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 2×1 + 2×2 = 6 ✓</text>

  <!-- Legend -->
  <rect x="40" y="316" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="328" font-size="10" fill="#555">放新歌贡献</text>
  <rect x="170" y="316" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="190" y="328" font-size="10" fill="#555">重放旧歌贡献</text>
  <rect x="300" y="316" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="320" y="328" font-size="10" fill="#555">最终答案</text>
  <rect x="420" y="316" width="14" height="14" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="440" y="328" font-size="10" fill="#555">不可能的状态</text>

  <!-- Note -->
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888">j&gt;i 不可能（i 个位置最多放 i 首不同的歌）；j=0 且 i&gt;0 也不可能</text>
</svg>
