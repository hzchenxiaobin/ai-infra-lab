<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：连接 → 逐行打分 → 分组求和 → 排序</text>

  <rect x="90" y="38" width="380" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① FROM Passes —— 每行 = 一次传球（from, time, to）</text>

  <path d="M 280 74 L 280 88" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="92" width="380" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② JOIN Teams t1 ON pass_from = player_id —— 补「发起方球队」</text>

  <path d="M 280 128 L 280 142" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="146" width="380" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ JOIN Teams t2 ON pass_to = player_id —— 补「接收方球队」</text>

  <path d="M 280 182 L 280 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="200" width="380" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 逐行打分：half = IF(time &lt;= '45:00', 1, 2)</text>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dominance = IF(t1 队 = t2 队, 1, −1)</text>

  <path d="M 280 252 L 280 266" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="270" width="380" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ GROUP BY (team_name, half_number) + SUM(dominance)</text>

  <path d="M 280 306 L 280 320" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="324" width="380" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑥ ORDER BY team_name, half_number —— 升序输出</text>

  <text x="486" y="222" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">45:00 含在</text>
  <text x="486" y="236" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">上半场！</text>
</svg>
