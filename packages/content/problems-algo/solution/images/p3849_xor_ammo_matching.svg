<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="310" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="22" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：两类「弹药」对位供给（示例 2：s=0110，t=1110）</text>

  <!-- 下标 i -->
  <text x="122" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="176" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="230" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="284" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- 第一行：s 固定 -->
  <text x="92" y="71" text-anchor="end" font-size="11" fill="#2a4a68" filter="url(#rough2)">s（固定）</text>
  <rect x="100" y="48" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">0</text>
  <rect x="154" y="48" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">1</text>
  <rect x="208" y="48" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">1</text>
  <rect x="262" y="48" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">0</text>

  <!-- 需求标签 -->
  <text x="122" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">需 '1'</text>
  <text x="176" y="100" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">需 '0'</text>
  <text x="230" y="100" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">需 '0'</text>
  <text x="284" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">需 '1'</text>

  <!-- 第二行：t' 重排后（按弹药来源着色） -->
  <text x="92" y="139" text-anchor="end" font-size="11" fill="#2a5a20" filter="url(#rough2)">t′（重排）</text>
  <rect x="100" y="116" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="122" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">1</text>
  <rect x="154" y="116" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="208" y="116" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="230" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">1</text>
  <rect x="262" y="116" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="284" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">1</text>
  <text x="321" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">垫位</text>

  <!-- 判定标签 -->
  <text x="122" y="168" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 异或 1</text>
  <text x="176" y="168" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 异或 1</text>
  <text x="230" y="168" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 异或 0</text>
  <text x="284" y="168" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 异或 1</text>

  <!-- 第三行：ans -->
  <text x="92" y="209" text-anchor="end" font-size="11" font-weight="bold" fill="#a03028" filter="url(#rough2)">ans</text>
  <rect x="100" y="186" width="44" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="122" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03028" filter="url(#rough2)">1</text>
  <rect x="154" y="186" width="44" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="176" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03028" filter="url(#rough2)">1</text>
  <rect x="208" y="186" width="44" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">0</text>
  <rect x="262" y="186" width="44" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="284" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03028" filter="url(#rough2)">1</text>

  <!-- 右侧弹药库面板 -->
  <rect x="336" y="44" width="212" height="212" rx="10" fill="#ffffff" stroke="#888" stroke-width="1.2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="442" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">t 的弹药库（只剩计数）</text>

  <rect x="350" y="76" width="184" height="66" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="442" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">'1' 弹药 × 3 发</text>
  <text x="442" y="110" text-anchor="middle" font-size="10.5" fill="#2a5a20" filter="url(#rough2)">2 发打中 s 的 0 位 ⇒ 异或 1</text>
  <text x="442" y="126" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1 发垫给 s 的 1 位 ⇒ 异或 0</text>

  <rect x="350" y="152" width="184" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="442" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">'0' 弹药 × 1 发</text>
  <text x="442" y="188" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">1 发打中 s 的 1 位 ⇒ 异或 1</text>

  <text x="442" y="218" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两类弹药互不通用</text>
  <text x="442" y="236" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对位才有产出</text>

  <!-- 底部要点 -->
  <rect x="60" y="250" width="460" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="267" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">高位独裁：位置 i 打出 1 的收益 2^(n−1−i) 大于其后所有位之和</text>
  <text x="290" y="285" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">⇒ 从左到右扫描，对位弹药有余就打（能 1 则 1）</text>
</svg>
