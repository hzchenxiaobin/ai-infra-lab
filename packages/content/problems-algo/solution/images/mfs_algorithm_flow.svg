<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：哈希表维护窗口计数 + 快速幂增量更新</text>

  <!-- 步骤 1：预处理 -->
  <rect x="40" y="48" width="640" height="56" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">① 预处理初始窗口 nums[0..k-1]</text>
  <text x="60" y="90" font-size="11.5" fill="#333" filter="url(#rough2)">cnt 统计各值频次；cur = Σ qpow(v, cnt[v]) (mod p)；ans = cur</text>

  <!-- 箭头 -->
  <path d="M 360 108 L 360 120" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：滑窗主循环 -->
  <rect x="40" y="124" width="640" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="146" font-size="12" fill="#3a4e7a" font-weight="bold" filter="url(#rough2)">② 滑窗主循环：i 从 k 到 n−1</text>
  <text x="60" y="166" font-size="11.5" fill="#333" filter="url(#rough2)">a = nums[i−k]（离窗元素），b = nums[i]（入窗元素）</text>

  <path d="M 360 184 L 360 196" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="360,200 470,240 360,280 250,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="236" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold" filter="url(#rough2)">a == b ?</text>
  <text x="360" y="252" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">（同一值，频次不变）</text>

  <!-- 是：跳过 -->
  <text x="232" y="244" text-anchor="end" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 250 240 L 150 240" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="222" width="110" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="245" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">跳过本步</text>

  <!-- 否：增量更新 -->
  <text x="478" y="244" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 470 240 L 560 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 增量更新四格表 -->
  <rect x="40" y="296" width="640" height="116" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="316" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 增量更新（用快速幂算 v^c，每步 O(log k)）</text>

  <!-- 表头 -->
  <g font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="336">事件</text>
    <text x="320" y="336">条件</text>
    <text x="500" y="336">cur 变化（mod p）</text>
  </g>

  <!-- b 入窗 -->
  <text x="150" y="358" text-anchor="middle" font-size="11" fill="#3a4e7a" font-weight="bold" filter="url(#rough2)">b 入窗</text>
  <text x="320" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[b] > 0</text>
  <text x="500" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+ (b−1) · qpow(b, cnt[b])</text>
  <text x="320" y="376" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[b] == 0</text>
  <text x="500" y="376" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+ b</text>

  <!-- a 离窗 -->
  <text x="150" y="398" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold" filter="url(#rough2)">a 离窗</text>
  <text x="320" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[a] > 1</text>
  <text x="500" y="398" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">− (a−1) · qpow(a, cnt[a]−1)</text>

  <path d="M 360 416 L 360 428" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4：收尾 -->
  <rect x="40" y="432" width="640" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="456" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">④ cur = (cur + Δ_b − Δ_a + p) % p；cnt[b]++；cnt[a]−−；ans = max(ans, cur)</text>
</svg>
