<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：n = 15, t = 3</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">从 x = 15 开始逐个试：15 不行，16 第二轮命中</text>

  <!-- 第一行：x=15 -->
  <rect x="52" y="62" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="86" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">15</text>

  <path d="M 112 81 L 138 81" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="142" y="62" width="158" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="221" y="86" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">数位积：1 × 5 = 5</text>

  <path d="M 304 81 L 330 81" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="334" y="62" width="150" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="409" y="86" text-anchor="middle" font-size="12.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">5 % 3 = 2 ≠ 0 ✗</text>

  <!-- 第二行：x=16 -->
  <rect x="52" y="122" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="146" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">16</text>

  <path d="M 112 141 L 138 141" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="142" y="122" width="158" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="221" y="146" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">数位积：1 × 6 = 6</text>

  <path d="M 304 141 L 330 141" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="334" y="122" width="150" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="409" y="146" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6 % 3 = 0 ✓</text>

  <rect x="130" y="174" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 返回 16（与示例 2 一致）✓</text>

  <!-- 示例 2 -->
  <text x="260" y="232" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">换一个含 0 数位的：n = 10, t = 2</text>

  <rect x="52" y="246" width="56" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="270" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10</text>

  <path d="M 112 265 L 138 265" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="142" y="246" width="158" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="221" y="270" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">数位积：1 × 0 = 0</text>

  <path d="M 304 265 L 330 265" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="334" y="246" width="150" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="409" y="270" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0 % 2 = 0 ✓</text>

  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">含 0 数位 → 乘积直接归零 → 天然整除，n 本身一轮命中</text>

  <!-- 陷阱提示 -->
  <rect x="20" y="322" width="480" height="64" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="342" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 答案要求「大于等于 n」：</text>
  <text x="34" y="358" font-size="10" fill="#333" filter="url(#rough2)">枚举从 x = n 起步而不是 n + 1 —— n = 10, t = 2 时答案就是 10 本身；</text>
  <text x="34" y="374" font-size="10" fill="#333" filter="url(#rough2)">同理乘积初值 p = 1（不是 0），保证 1~9 的个位数也能正确算出自身。</text>
</svg>
