<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 行 → 3 个首登 → 3 次次日判定 → 1/3 = 0.33</text>

  <!-- Player 1 panel -->
  <text x="110" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">玩家 1</text>
  <rect x="40" y="62" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="77" font-size="9" fill="#333">event_date</text>
  <text x="155" y="77" font-size="9" fill="#333">games</text>
  <line x1="125" y1="62" x2="125" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="84" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="80" y="99" font-size="9.5" fill="#b85450" font-weight="bold">2016-03-01</text>
  <text x="155" y="99" font-size="9" fill="#333">5</text>
  <text x="200" y="99" font-size="8.5" fill="#b85450" font-weight="bold">←首登</text>
  <line x1="125" y1="84" x2="125" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="106" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="121" font-size="9.5" fill="#4a7a3a" font-weight="bold">2016-03-02</text>
  <text x="155" y="121" font-size="9" fill="#333">6</text>
  <text x="200" y="121" font-size="8.5" fill="#4a7a3a" font-weight="bold">←次日!</text>
  <line x1="125" y1="106" x2="125" y2="128" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- +1 day arrow -->
  <path d="M90 108 L90 124" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="35" y="120" font-size="8.5" fill="#b85450" font-weight="bold">+1天</text>

  <!-- verdict player 1 -->
  <rect x="40" y="138" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 留存（1）</text>

  <!-- Player 2 panel -->
  <text x="330" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">玩家 2</text>
  <rect x="260" y="62" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="280" y="77" font-size="9" fill="#333">event_date</text>
  <text x="375" y="77" font-size="9" fill="#333">games</text>
  <line x1="345" y1="62" x2="345" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="260" y="84" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="300" y="99" font-size="9.5" fill="#4a7a3a" font-weight="bold">2017-06-25</text>
  <text x="375" y="99" font-size="9" fill="#333">1</text>
  <text x="420" y="99" font-size="8.5" fill="#4a7a3a" font-weight="bold">←首登</text>
  <line x1="345" y1="84" x2="345" y2="106" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- +1 day target (not found) -->
  <rect x="260" y="106" width="180" height="22" fill="#fcfcf6" stroke="#888" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="121" font-size="9.5" fill="#888">2017-06-26</text>
  <text x="375" y="121" font-size="9" fill="#888">—</text>
  <text x="420" y="121" font-size="8.5" fill="#888" font-weight="bold">←无</text>
  <line x1="345" y1="106" x2="345" y2="128" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>

  <path d="M310 108 L310 124" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="255" y="120" font-size="8.5" fill="#888" font-weight="bold">+1天</text>

  <rect x="260" y="138" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="350" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 未留存（0）</text>

  <!-- Player 3 panel -->
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">玩家 3</text>
  <rect x="480" y="62" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="500" y="77" font-size="9" fill="#333">event_date</text>
  <text x="585" y="77" font-size="9" fill="#333">games</text>
  <line x1="560" y1="62" x2="560" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="480" y="84" width="160" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="515" y="99" font-size="9.5" fill="#d6a040" font-weight="bold">2016-03-02</text>
  <text x="585" y="99" font-size="9" fill="#333">0</text>
  <text x="625" y="99" font-size="8.5" fill="#d6a040" font-weight="bold">←首登</text>
  <line x1="560" y1="84" x2="560" y2="106" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="480" y="106" width="160" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="515" y="121" font-size="9.5" fill="#333">2018-07-03</text>
  <text x="585" y="121" font-size="9" fill="#333">5</text>
  <text x="625" y="121" font-size="8.5" fill="#888">≠次日</text>
  <line x1="560" y1="106" x2="560" y2="128" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- +1 day target (not found) -->
  <path d="M525 108 L525 124" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="470" y="120" font-size="8.5" fill="#888" font-weight="bold">+1天</text>

  <rect x="480" y="138" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="560" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 未留存（0）</text>

  <!-- note for player 3 -->
  <text x="550" y="180" text-anchor="middle" font-size="9" fill="#d6a040">2018-07-03 与首登差 2 年，</text>
  <text x="550" y="192" text-anchor="middle" font-size="9" fill="#d6a040">DATE_ADD 只匹配精确 +1 天</text>

  <!-- Final ratio computation -->
  <rect x="60" y="210" width="540" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 ③ ④ 步：比率统计 + 四舍五入</text>

  <!-- equation row -->
  <rect x="100" y="250" width="460" height="36" fill="#fcfcf6" stroke="#888" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="150" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">COUNT(b)=1</text>
  <text x="225" y="273" text-anchor="middle" font-size="13" fill="#888">÷</text>
  <text x="300" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">COUNT(a)=3</text>
  <text x="370" y="273" text-anchor="middle" font-size="13" fill="#888">=</text>
  <text x="430" y="273" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0.333...</text>
  <text x="510" y="273" text-anchor="middle" font-size="11" fill="#888">→</text>
  <text x="545" y="273" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ROUND(,2)</text>

  <text x="330" y="306" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">fraction = 0.33</text>

  <!-- breakdown -->
  <text x="90" y="328" font-size="10" fill="#555">• COUNT(b.player_id) 数非 NULL：仅玩家 1 的 b 行非空 → 1</text>
  <text x="90" y="346" font-size="10" fill="#555">• COUNT(a.player_id) 数左表全集：LEFT JOIN 保留 3 个玩家 → 3</text>
  <text x="90" y="364" font-size="10" fill="#555">• 1 ÷ 3 = 0.333…，ROUND(..., 2) 四舍五入到两位 → 0.33</text>
  <text x="90" y="386" font-size="10" fill="#b85450" font-weight="bold">⚠️ LEFT JOIN 保留玩家 2/3 的 NULL 行，分母才 = 3 而非 1</text>
</svg>
