<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定除数 u，按 ⌊v/u⌋ = k 分桶</text>
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以 u = 2、值域 1..9 为例：v 落在 [k·u, (k+1)·u−1] ⇒ 商 = k</text>

  <!-- ===== value axis cells v=1..9, cnt row ===== -->
  <text x="70" y="86" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt[v]</text>
  <g filter="url(#rough2)">
    <!-- v=1 cnt=0 -->
    <rect x="84" y="74" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="108" y="94" text-anchor="middle" font-size="11" fill="#aaa">0</text>
    <!-- v=2 cnt=1 (u itself) -->
    <rect x="132" y="74" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <text x="156" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>
    <!-- v=3 cnt=0 -->
    <rect x="180" y="74" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="204" y="94" text-anchor="middle" font-size="11" fill="#aaa">0</text>
    <!-- v=4 -->
    <rect x="228" y="74" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="252" y="94" text-anchor="middle" font-size="11" fill="#aaa">0</text>
    <!-- v=5 cnt=1 -->
    <rect x="276" y="74" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <text x="300" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>
    <!-- v=6 -->
    <rect x="324" y="74" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="348" y="94" text-anchor="middle" font-size="11" fill="#aaa">0</text>
    <!-- v=7 -->
    <rect x="372" y="74" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="396" y="94" text-anchor="middle" font-size="11" fill="#aaa">0</text>
    <!-- v=8 -->
    <rect x="420" y="74" width="48" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="444" y="94" text-anchor="middle" font-size="11" fill="#aaa">0</text>
    <!-- v=9 cnt=1 -->
    <rect x="468" y="74" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <text x="492" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>
  </g>
  <!-- v labels -->
  <g filter="url(#rough2)" font-size="9" fill="#888">
    <text x="108" y="120" text-anchor="middle">v=1</text>
    <text x="156" y="120" text-anchor="middle">2</text>
    <text x="204" y="120" text-anchor="middle">3</text>
    <text x="252" y="120" text-anchor="middle">4</text>
    <text x="300" y="120" text-anchor="middle">5</text>
    <text x="348" y="120" text-anchor="middle">6</text>
    <text x="396" y="120" text-anchor="middle">7</text>
    <text x="444" y="120" text-anchor="middle">8</text>
    <text x="492" y="120" text-anchor="middle">9</text>
  </g>

  <!-- ===== bucket brackets ===== -->
  <!-- k=0 bucket [1,1] greyed (商0 跳过) -->
  <rect x="84" y="132" width="48" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="149" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">k=0 跳过</text>

  <!-- k=1 bucket [2,3] -->
  <rect x="132" y="132" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="149" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">k=1：[2, 3]</text>

  <!-- k=2 bucket [4,5] -->
  <rect x="228" y="132" width="96" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="276" y="149" text-anchor="middle" font-size="10" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">k=2：[4, 5]</text>

  <!-- k=3 bucket [6,7] -->
  <rect x="324" y="132" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="372" y="149" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">k=3：[6, 7]</text>

  <!-- k=4 bucket [8,9] -->
  <rect x="420" y="132" width="96" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="468" y="149" text-anchor="middle" font-size="10" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">k=4：[8, 9]</text>

  <!-- ===== per-bucket: count via prefix sum + contribution ===== -->
  <text x="300" y="182" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">每个桶：个数 = pre[hi] − pre[lo−1]，贡献 = cnt[u] × k × 个数</text>

  <g filter="url(#rough2)">
    <!-- k=1: count=1, contrib=1 -->
    <rect x="132" y="192" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="180" y="212" text-anchor="middle" font-size="9.5" fill="#2a4a1a">个数1 · 1×1=1</text>
    <!-- k=2: count=1, contrib=2 -->
    <rect x="228" y="192" width="96" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="276" y="212" text-anchor="middle" font-size="9.5" fill="#7a5a20">个数1 · 2×1=2</text>
    <!-- k=3: count=0 -->
    <rect x="324" y="192" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="372" y="212" text-anchor="middle" font-size="9.5" fill="#2a4a1a">个数0 · 0</text>
    <!-- k=4: count=1, contrib=4 -->
    <rect x="420" y="192" width="96" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="468" y="212" text-anchor="middle" font-size="9.5" fill="#7a5a20">个数1 · 4×1=4</text>
  </g>

  <text x="300" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">u=2 小计 = 1+2+0+4 = 7</text>

  <!-- ===== formula box ===== -->
  <rect x="50" y="262" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="283" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = Σ_u cnt[u] · Σ_{k≥1} k · ( pre[min((k+1)u−1, M)] − pre[ku−1] )</text>
  <text x="300" y="302" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">外层枚举除数 u，内层按倍数 k 扫桶；pre 为 cnt 的前缀和</text>
  <text x="300" y="315" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">i=j（v=u）落在 k=1 桶，商 1 自动计入，无需特判</text>

  <!-- ===== harmonic note ===== -->
  <rect x="50" y="332" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="353" text-anchor="middle" font-size="10.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">为何不超时？调和级数</text>
  <text x="300" y="371" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">每个 u 内层扫 ⌊M/u⌋ 个桶，总工作量 = Σ_{u=1}^{M} ⌊M/u⌋ ≈ M·ln M</text>
  <text x="300" y="386" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">M = 10⁵ 时约 1.2×10⁶ 次，远低于 n² = 10¹⁰</text>
</svg>
