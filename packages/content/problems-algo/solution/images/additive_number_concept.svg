<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：前两个数一旦确定，整条累加序列就被唯一锁定</text>

  <!-- input string -->
  <text x="40" y="62" font-size="11" fill="#888">输入串：</text>
  <text x="100" y="62" font-size="13" fill="#333" font-weight="bold">"112358"</text>

  <!-- number boxes row: 1, 1, 2, 3, 5, 8 -->
  <!-- first two: freely chosen (blue) -->
  <rect x="80" y="80" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="106" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="136" y="80" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="162" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <!-- determined numbers (green) -->
  <rect x="192" y="80" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="218" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="80" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="274" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="304" y="80" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  <rect x="360" y="80" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="386" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">8</text>

  <!-- bracket: freely chosen -->
  <path d="M 80 130 L 80 138 L 188 138 L 188 130" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="134" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">自由选择（枚举长度 i, j）</text>

  <!-- bracket: determined -->
  <path d="M 192 130 L 192 138 L 412 138 L 412 130" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="302" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">被唯一确定（逐项验证即可）</text>

  <!-- addition arrows: 1+1=2 -->
  <path d="M 106 124 L 106 176" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 162 124 L 162 176" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="134" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 + 1 = 2</text>
  <path d="M 134 200 L 218 200 L 218 78" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- addition: 1+2=3 -->
  <text x="252" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 + 2 = 3</text>
  <path d="M 252 200 L 274 200 L 274 78" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- addition: 2+3=5 -->
  <text x="308" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2 + 3 = 5</text>
  <path d="M 308 200 L 330 200 L 330 78" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- addition: 3+5=8 -->
  <text x="364" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3 + 5 = 8</text>
  <path d="M 364 200 L 386 200 L 386 78" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- right note box: enumeration -->
  <rect x="430" y="80" width="120" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="490" y="104" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">枚举维度</text>
  <text x="490" y="126" text-anchor="middle" font-size="11" fill="#666">i = 第一个数长度</text>
  <text x="490" y="146" text-anchor="middle" font-size="11" fill="#666">j = 第二个数长度</text>
  <text x="490" y="168" text-anchor="middle" font-size="10" fill="#b85450">i + j &lt; n（至少 3 个数）</text>

  <!-- bottom note -->
  <rect x="40" y="224" width="510" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="295" y="248" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">搜索空间从「无限」坍缩为 O(n²) 对 (i, j)，每组验证 O(n)</text>
  <text x="295" y="270" text-anchor="middle" font-size="11" fill="#666">前两个数自由 → 后续全被加法链锁定 → 只需贪心匹配，无需回溯</text>
  <text x="295" y="288" text-anchor="middle" font-size="10" fill="#888">大数加法：n ≤ 35 位可能溢出 64 位整数，用字符串加法或 Python 原生大整数</text>

  <!-- second example teaser -->
  <rect x="40" y="312" width="510" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="295" y="336" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">另一例："199100199" → i=1, j=2：1, 99, 100, 199</text>
  <text x="295" y="354" text-anchor="middle" font-size="11" fill="#666">1 + 99 = 100，99 + 100 = 199，恰好耗尽整个串</text>
</svg>
