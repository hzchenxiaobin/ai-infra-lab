<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">三表分工：价格表 + 可借集合 + 已借集合</text>

  <!-- ===== Left: price map ===== -->
  <rect x="20" y="56" width="180" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="110" y="76" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">price 表</text>
  <text x="110" y="90" text-anchor="middle" font-size="10" fill="#888">(shop, movie) → price</text>

  <rect x="34" y="100" width="68" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="116" text-anchor="middle" font-size="10" fill="#333">(0,1)</text>
  <rect x="108" y="100" width="68" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="116" text-anchor="middle" font-size="10" fill="#333">5</text>

  <rect x="34" y="126" width="68" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="142" text-anchor="middle" font-size="10" fill="#333">(1,1)</text>
  <rect x="108" y="126" width="68" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="142" text-anchor="middle" font-size="10" fill="#333">4</text>

  <rect x="34" y="152" width="68" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="168" text-anchor="middle" font-size="10" fill="#333">(2,1)</text>
  <rect x="108" y="152" width="68" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="142" y="168" text-anchor="middle" font-size="10" fill="#333">5</text>

  <text x="110" y="196" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic">O(1) 查价格</text>

  <!-- ===== Center: available[movie] ===== -->
  <rect x="220" y="56" width="180" height="230" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="76" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">available[movie]</text>
  <text x="310" y="90" text-anchor="middle" font-size="10" fill="#888">有序集合 (price, shop)</text>

  <text x="235" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">movie=1:</text>
  <rect x="240" y="118" width="140" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="134" text-anchor="middle" font-size="10" fill="#333">(4,1) (5,0) (5,2)</text>

  <text x="235" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">movie=2:</text>
  <rect x="240" y="164" width="140" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="180" text-anchor="middle" font-size="10" fill="#333">(6,0) (7,1)</text>

  <text x="235" y="204" font-size="10" fill="#4a7a3a" font-weight="bold">movie=3:</text>
  <rect x="240" y="210" width="140" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="226" text-anchor="middle" font-size="10" fill="#333">(7,0)</text>

  <text x="310" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" font-style="italic">search → 取前 5 个</text>
  <text x="310" y="276" text-anchor="middle" font-size="9.5" fill="#888">按 price↑, shop↑ 排序</text>

  <!-- ===== Right: rented ===== -->
  <rect x="420" y="56" width="140" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="490" y="76" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">rented</text>
  <text x="490" y="90" text-anchor="middle" font-size="10" fill="#888">有序集合</text>
  <text x="490" y="104" text-anchor="middle" font-size="10" fill="#888">(price, shop, movie)</text>

  <rect x="434" y="116" width="112" height="22" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="132" text-anchor="middle" font-size="9.5" fill="#333">(5,0,1)</text>

  <rect x="434" y="144" width="112" height="22" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="160" text-anchor="middle" font-size="9.5" fill="#333">(7,1,2)</text>

  <text x="490" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">report → 取前 5 个</text>
  <text x="490" y="202" text-anchor="middle" font-size="9.5" fill="#888">price↑, shop↑, movie↑</text>
  <text x="490" y="218" text-anchor="middle" font-size="9.5" fill="#888">全库共享排序</text>

  <!-- ===== Arrows: rent (available → rented) ===== -->
  <path d="M400 170 Q 420 160 430 150" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="418" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">rent</text>
  <text x="418" y="138" text-anchor="middle" font-size="8.5" fill="#b85450">erase + insert</text>

  <!-- ===== Arrows: drop (rented → available) ===== -->
  <path d="M434 200 Q 414 210 402 200" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="418" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">drop</text>
  <text x="418" y="228" text-anchor="middle" font-size="8.5" fill="#4a7a3a">insert + erase</text>

  <!-- ===== Bottom: price lookup arrows ===== -->
  <path d="M110 210 Q 160 250 230 250" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="160" y="244" font-size="9.5" fill="#446688">rent/drop 时查价格</text>

  <path d="M200 190 Q 300 240 420 190" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="300" y="248" text-anchor="middle" font-size="9.5" fill="#446688">rent/drop 时查价格</text>

  <!-- ===== Summary footer ===== -->
  <rect x="20" y="300" width="540" height="120" fill="#f6f8fa" stroke="#bbb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290" y="324" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">设计要点</text>
  <text x="40" y="348" font-size="11" fill="#555">① price 表：O(1) 查任意 (shop, movie) 的价格，rent/drop 时用</text>
  <text x="40" y="368" font-size="11" fill="#555">② available[movie]：每部电影一张有序表，search 只需取前 5 → O(5)</text>
  <text x="40" y="388" font-size="11" fill="#555">③ rented：全局一张有序表，report 只需取前 5 → O(5)</text>
  <text x="40" y="408" font-size="11" fill="#555">④ rent/drop = 在 available 和 rented 之间搬运，各 O(log n)</text>
</svg>
