<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：searchWord = "mouse"</text>

  <!-- Header row: sorted products reference -->
  <text x="20" y="58" font-size="11" fill="#888">产品表:</text>
  <text x="108" y="54" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="184" y="54" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="260" y="54" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="336" y="54" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="412" y="54" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <rect x="70" y="40" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="108" y="56" text-anchor="middle" font-size="10" fill="#333">mobile</text>
  <rect x="146" y="40" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="184" y="56" text-anchor="middle" font-size="10" fill="#333">moneypot</text>
  <rect x="222" y="40" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="10" fill="#333">monitor</text>
  <rect x="298" y="40" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="336" y="56" text-anchor="middle" font-size="10" fill="#333">mouse</text>
  <rect x="374" y="40" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="412" y="56" text-anchor="middle" font-size="10" fill="#333">mousepad</text>

  <text x="470" y="56" font-size="11" fill="#888">→ 推荐</text>

  <!-- Divider -->
  <path d="M 20 78 L 560 78" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Column labels -->
  <text x="40" y="98" font-size="10.5" fill="#888" font-weight="bold">前缀</text>
  <text x="240" y="98" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">窗口 [left, right] (高亮匹配段)</text>
  <text x="490" y="98" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">取前 3</text>

  <!-- helper: each row y starts at 110, step 56 -->

  <!-- Row 0: prefix "m" -->
  <rect x="30" y="108" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="54" y="128" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">"m"</text>
  <!-- window full [0,4] -->
  <rect x="70" y="108" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="128" text-anchor="middle" font-size="10" fill="#333">mobile</text>
  <rect x="146" y="108" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="128" text-anchor="middle" font-size="10" fill="#333">moneypot</text>
  <rect x="222" y="108" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="10" fill="#333">monitor</text>
  <rect x="298" y="108" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="128" text-anchor="middle" font-size="10" fill="#333">mouse</text>
  <rect x="374" y="108" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="128" text-anchor="middle" font-size="10" fill="#333">mousepad</text>
  <text x="108" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a">↑left</text>
  <text x="412" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a">right↑</text>
  <rect x="460" y="108" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="535" y="128" text-anchor="middle" font-size="9.5" fill="#b85450">mobile, moneypot, monitor</text>

  <!-- Row 1: prefix "mo" -->
  <rect x="30" y="164" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="54" y="184" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">"mo"</text>
  <rect x="70" y="164" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="184" text-anchor="middle" font-size="10" fill="#333">mobile</text>
  <rect x="146" y="164" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="184" text-anchor="middle" font-size="10" fill="#333">moneypot</text>
  <rect x="222" y="164" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="10" fill="#333">monitor</text>
  <rect x="298" y="164" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="184" text-anchor="middle" font-size="10" fill="#333">mouse</text>
  <rect x="374" y="164" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="184" text-anchor="middle" font-size="10" fill="#333">mousepad</text>
  <text x="108" y="208" text-anchor="middle" font-size="9.5" fill="#4a7a3a">↑left</text>
  <text x="412" y="208" text-anchor="middle" font-size="9.5" fill="#4a7a3a">right↑</text>
  <rect x="460" y="164" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="535" y="184" text-anchor="middle" font-size="9.5" fill="#b85450">mobile, moneypot, monitor</text>

  <!-- Row 2: prefix "mou" - KEY STEP -->
  <rect x="30" y="220" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="54" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">"mou"</text>
  <!-- eliminated cells (greyed) -->
  <rect x="70" y="220" width="76" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="240" text-anchor="middle" font-size="10" fill="#bbb">mobile</text>
  <rect x="146" y="220" width="76" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="240" text-anchor="middle" font-size="10" fill="#bbb">moneypot</text>
  <rect x="222" y="220" width="76" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="10" fill="#bbb">monitor</text>
  <!-- matched block -->
  <rect x="298" y="220" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="336" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">mouse</text>
  <rect x="374" y="220" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="412" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">mousepad</text>
  <text x="336" y="264" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">↑left</text>
  <text x="412" y="264" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">right↑</text>
  <rect x="460" y="220" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="535" y="240" text-anchor="middle" font-size="9.5" fill="#b85450">mouse, mousepad</text>

  <!-- shrink annotation between row1 and row2 -->
  <text x="240" y="212" text-anchor="middle" font-size="9.5" fill="#b85450">↓ left 跳过第2位 ≠u 的产品</text>

  <!-- Row 3: prefix "mous" -->
  <rect x="30" y="276" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="54" y="296" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">"mous"</text>
  <rect x="298" y="276" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="296" text-anchor="middle" font-size="10" fill="#333">mouse</text>
  <rect x="374" y="276" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="296" text-anchor="middle" font-size="10" fill="#333">mousepad</text>
  <text x="336" y="320" text-anchor="middle" font-size="9.5" fill="#4a7a3a">↑left</text>
  <text x="412" y="320" text-anchor="middle" font-size="9.5" fill="#4a7a3a">right↑</text>
  <rect x="460" y="276" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="535" y="296" text-anchor="middle" font-size="9.5" fill="#b85450">mouse, mousepad</text>

  <!-- Row 4: prefix "mouse" -->
  <rect x="30" y="332" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="54" y="352" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">"mouse"</text>
  <rect x="298" y="332" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="352" text-anchor="middle" font-size="10" fill="#333">mouse</text>
  <rect x="374" y="332" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="352" text-anchor="middle" font-size="10" fill="#333">mousepad</text>
  <text x="336" y="376" text-anchor="middle" font-size="9.5" fill="#4a7a3a">↑left</text>
  <text x="412" y="376" text-anchor="middle" font-size="9.5" fill="#4a7a3a">right↑</text>
  <rect x="460" y="332" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="535" y="352" text-anchor="middle" font-size="9.5" fill="#b85450">mouse, mousepad</text>

  <!-- Legend -->
  <rect x="20" y="402" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="40" y="413" font-size="10" fill="#555">匹配窗口</text>
  <rect x="120" y="402" width="14" height="14" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="413" font-size="10" fill="#555">被淘汰</text>
  <rect x="210" y="402" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="230" y="413" font-size="10" fill="#555">推荐输出 / 关键步骤</text>
  <text x="380" y="413" font-size="10" fill="#888">指针全程只朝内移，总移动 O(n)</text>
</svg>
