  <rect x="30" y="346" width="480" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结论：4 的幂 = 2 的幂 + 唯一 1 落在偶数位</text>
  <text x="270" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a">n 是 4 的幂  ⇔  n &gt; 0 且 (n &amp; (n−1)) == 0 且 (n &amp; 0x55555555) != 0</text>
  <text x="270" y="402" text-anchor="middle" font-size="10.5" fill="#888">0x55555555 = 0101...0101，偶数位全 1，一次按位与即可筛出</text>
