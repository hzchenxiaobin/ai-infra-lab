<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：container = [abcdefgh, poiuygh, ghghgh]</text>

  <text x="56" y="50" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 反转插入：hgfedcba / hgyuiop / hghghg →</text>

  <!-- trie edges -->
  <path d="M 80 110 L 106 110" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 140 110 L 167 110" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 197 103 C 215 88 228 78 238 72" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 199 110 L 234 110" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 197 117 C 215 132 228 142 238 148" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 264 65 L 278 65" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 264 110 L 278 110" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 264 155 L 278 155" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- trie nodes -->
  <circle cx="64" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="64" y="113" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">root</text>
  <circle cx="124" cy="110" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="115" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">h</text>
  <circle cx="184" cy="110" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="184" y="115" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">g</text>
  <circle cx="250" cy="65" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">f</text>
  <circle cx="250" cy="110" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="115" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">y</text>
  <circle cx="250" cy="155" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="160" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">h</text>

  <!-- chain boxes -->
  <rect x="280" y="54" width="104" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="332" y="69" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">e→d→c→b→a</text>
  <rect x="280" y="99" width="104" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="332" y="114" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">u→i→o→p</text>
  <rect x="280" y="144" width="104" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="332" y="159" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">g→h→g</text>

  <!-- best labels -->
  <rect x="36" y="132" width="52" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="62" y="145" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">best=2</text>
  <rect x="98" y="132" width="52" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="124" y="145" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">best=2</text>
  <rect x="158" y="132" width="52" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="184" y="145" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">best=2</text>

  <text x="250" y="92" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">best=0</text>
  <text x="250" y="186" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">best=2</text>

  <!-- best evolution annotation -->
  <rect x="396" y="60" width="112" height="60" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="452" y="78" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">h、hg 的 best：</text>
  <text x="452" y="94" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">0 → 1 → 2</text>
  <text x="452" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（一次比一次短）</text>

  <text x="240" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">y 支路 best=1；根 best=2（全局最短 "ghghgh"，长度 6）</text>

  <!-- part 2: queries -->
  <text x="56" y="228" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 查询下行（能走就走，走不动为止）：</text>

  <!-- row 1 -->
  <rect x="48" y="244" width="92" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="94" y="261" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">"gh"</text>
  <path d="M 142 257 L 158 257" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="162" y="244" width="68" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="261" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">"hg"</text>
  <path d="M 232 257 L 248 257" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="252" y="244" width="152" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="328" y="261" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">根→h→g，走完 ✓</text>
  <path d="M 406 257 L 422 257" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="426" y="244" width="66" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="459" y="261" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans=2</text>

  <!-- row 2 -->
  <rect x="48" y="288" width="92" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="94" y="305" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"acbfgh"</text>
  <path d="M 142 301 L 158 301" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="162" y="288" width="68" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="305" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">"hgfbca"</text>
  <path d="M 232 301 L 248 301" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="252" y="288" width="152" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="328" y="305" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">根→h→g→f，b 无路 ✓</text>
  <path d="M 406 301 L 422 301" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="426" y="288" width="66" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="459" y="305" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans=0</text>

  <!-- row 3 -->
  <rect x="48" y="332" width="92" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="94" y="349" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">"acbfegh"</text>
  <path d="M 142 345 L 158 345" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="162" y="332" width="68" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="349" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">"hgefbca"</text>
  <path d="M 232 345 L 248 345" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="252" y="332" width="152" height="26" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="328" y="349" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">根→h→g，e 无路 ✓</text>
  <path d="M 406 345 L 422 345" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="426" y="332" width="66" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="459" y="349" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans=2</text>

  <!-- bottom note -->
  <rect x="44" y="374" width="432" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="396" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">三条查询都停在自己能走到的最深处，读该节点的 best 即为答案。</text>
</svg>
