<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：S = "heeellooo"，RLE: (h,1)(e,3)(l,2)(o,3)</text>

  <!-- ===== Row 1: "hello" — stretchy ===== -->
  <rect x="10" y="34" width="500" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="25" y="72" font-size="12" fill="#4a7a3a" font-weight="bold">hello</text>

  <!-- word RLE: (h,1)(e,1)(l,2)(o,1) -->
  <rect x="90" y="48" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="116" y="64" text-anchor="middle" font-size="10.5" fill="#333">(h,1)</text>
  <rect x="147" y="48" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="64" text-anchor="middle" font-size="10.5" fill="#333">(e,1)</text>
  <rect x="204" y="48" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="10.5" fill="#333">(l,2)</text>
  <rect x="261" y="48" width="52" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="287" y="64" text-anchor="middle" font-size="10.5" fill="#333">(o,1)</text>

  <!-- check marks -->
  <text x="116" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="173" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="195" y="84" font-size="8.5" fill="#888">3≥3</text>
  <text x="230" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="287" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="309" y="84" font-size="8.5" fill="#888">3≥3</text>

  <!-- S RLE: (h,1)(e,3)(l,2)(o,3) -->
  <rect x="90" y="90" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="116" y="106" text-anchor="middle" font-size="10.5" fill="#333">(h,1)</text>
  <rect x="147" y="90" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="106" text-anchor="middle" font-size="10.5" fill="#333">(e,3)</text>
  <rect x="204" y="90" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="106" text-anchor="middle" font-size="10.5" fill="#333">(l,2)</text>
  <rect x="261" y="90" width="52" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="287" y="106" text-anchor="middle" font-size="10.5" fill="#333">(o,3)</text>

  <text x="400" y="82" font-size="12" fill="#4a7a3a" font-weight="bold">可扩张 ✓</text>

  <!-- ===== Row 2: "hi" — not stretchy ===== -->
  <rect x="10" y="132" width="500" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="25" y="166" font-size="12" fill="#b85450" font-weight="bold">hi</text>

  <!-- word RLE: (h,1)(i,1) — 2 groups -->
  <rect x="90" y="148" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="116" y="164" text-anchor="middle" font-size="10.5" fill="#333">(h,1)</text>
  <rect x="147" y="148" width="52" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="164" text-anchor="middle" font-size="10.5" fill="#333">(i,1)</text>
  <text x="210" y="164" font-size="10" fill="#888">— 2 组</text>

  <!-- S RLE: (h,1)(e,3)(l,2)(o,3) — 4 groups -->
  <rect x="90" y="176" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="116" y="192" text-anchor="middle" font-size="10.5" fill="#333">(h,1)</text>
  <rect x="147" y="176" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="192" text-anchor="middle" font-size="10.5" fill="#333">(e,3)</text>
  <rect x="204" y="176" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="192" text-anchor="middle" font-size="10.5" fill="#333">(l,2)</text>
  <rect x="261" y="176" width="52" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="287" y="192" text-anchor="middle" font-size="10.5" fill="#333">(o,3)</text>

  <text x="340" y="166" font-size="10.5" fill="#b85450">组数不同 (2 ≠ 4)</text>
  <text x="400" y="166" font-size="12" fill="#b85450" font-weight="bold">不可扩张 ✗</text>

  <!-- ===== Row 3: "helo" — not stretchy ===== -->
  <rect x="10" y="202" width="500" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="25" y="240" font-size="12" fill="#b85450" font-weight="bold">helo</text>

  <!-- word RLE: (h,1)(e,1)(l,1)(o,1) -->
  <rect x="90" y="216" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="116" y="232" text-anchor="middle" font-size="10.5" fill="#333">(h,1)</text>
  <rect x="147" y="216" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="232" text-anchor="middle" font-size="10.5" fill="#333">(e,1)</text>
  <rect x="204" y="216" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="232" text-anchor="middle" font-size="10.5" fill="#333">(l,1)</text>
  <rect x="261" y="216" width="52" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="287" y="232" text-anchor="middle" font-size="10.5" fill="#333">(o,1)</text>

  <!-- check marks -->
  <text x="116" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="173" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="195" y="252" font-size="8.5" fill="#888">3≥3</text>
  <text x="230" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="242" y="252" font-size="8.5" fill="#b85450">2&lt;3</text>
  <text x="287" y="252" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- S RLE -->
  <rect x="90" y="258" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="116" y="274" text-anchor="middle" font-size="10.5" fill="#333">(h,1)</text>
  <rect x="147" y="258" width="52" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="274" text-anchor="middle" font-size="10.5" fill="#333">(e,3)</text>
  <rect x="204" y="258" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="274" text-anchor="middle" font-size="10.5" fill="#333">(l,2)</text>
  <rect x="261" y="258" width="52" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="287" y="274" text-anchor="middle" font-size="10.5" fill="#333">(o,3)</text>

  <text x="400" y="250" font-size="12" fill="#b85450" font-weight="bold">不可扩张 ✗</text>

  <!-- ===== Answer ===== -->
  <rect x="120" y="304" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">输出：1（仅 "hello" 可扩张）</text>
</svg>
