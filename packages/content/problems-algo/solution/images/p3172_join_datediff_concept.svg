<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGrn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：email_id 连双表，「日历差 1 天 + Verified」双谓词</text>

  <!-- emails table -->
  <text x="95" y="40" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">emails（注册表）</text>
  <rect x="16" y="46" width="64" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="60" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">email_id</text>
  <rect x="80" y="46" width="94" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="60" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">signup_date</text>

  <rect x="16" y="66" width="64" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">125</text>
  <rect x="80" y="66" width="94" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="82" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">06-14 09:30</text>

  <rect x="16" y="90" width="64" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="106" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">433</text>
  <rect x="80" y="90" width="94" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="106" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">07-09 08:15</text>

  <rect x="16" y="114" width="64" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="130" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">234</text>
  <rect x="80" y="114" width="94" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="130" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">08-20 10:00</text>

  <!-- join lines -->
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">JOIN ON email_id</text>
  <path d="M 174 78 C 220 64, 300 64, 344 76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 174 102 C 230 97, 290 97, 344 101" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 174 126 C 220 140, 300 140, 344 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- texts table -->
  <text x="425" y="40" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">texts（短信表）</text>
  <rect x="346" y="46" width="46" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">email_id</text>
  <rect x="392" y="46" width="56" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="60" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">signup_action</text>
  <rect x="448" y="46" width="56" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="60" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold" filter="url(#rough2)">action_date</text>

  <rect x="346" y="66" width="46" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">125</text>
  <rect x="392" y="66" width="56" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="82" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Verified</text>
  <rect x="448" y="66" width="56" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="82" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">06-15 08:30</text>

  <rect x="346" y="90" width="46" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="106" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">433</text>
  <rect x="392" y="90" width="56" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="106" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Not Verified</text>
  <rect x="448" y="90" width="56" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="106" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">07-10 10:45</text>

  <rect x="346" y="114" width="46" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="130" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">234</text>
  <rect x="392" y="114" width="56" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Verified</text>
  <rect x="448" y="114" width="56" height="24" fill="#ffffff" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="130" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">08-21 09:30</text>

  <!-- left note -->
  <rect x="16" y="148" width="158" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="95" y="166" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">signup_date 就是起点</text>
  <text x="95" y="181" text-anchor="middle" font-size="9" fill="#557799" filter="url(#rough2)">无需 MIN 求首日</text>
  <text x="95" y="195" text-anchor="middle" font-size="8.5" fill="#557799" filter="url(#rough2)">（对照 550：先求首登日）</text>

  <!-- middle condition box -->
  <rect x="190" y="148" width="140" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">① DATEDIFF = 1</text>
  <text x="260" y="182" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">② signup_action = 'Verified'</text>
  <text x="260" y="196" text-anchor="middle" font-size="9" fill="#a08430" filter="url(#rough2)">（AND：缺一不可）</text>

  <!-- right note -->
  <rect x="346" y="148" width="158" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="164" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 一对多会放大 JOIN</text>
  <text x="425" y="178" text-anchor="middle" font-size="9" fill="#a04a46" filter="url(#rough2)">一邮箱多条短信</text>
  <text x="425" y="191" text-anchor="middle" font-size="9" fill="#a04a46" filter="url(#rough2)">一用户多个邮箱</text>
  <text x="425" y="202" text-anchor="middle" font-size="9" fill="#a04a46" font-weight="bold" filter="url(#rough2)">→ SELECT DISTINCT</text>

  <path d="M 260 202 L 260 226" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- timeline section -->
  <text x="260" y="242" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">「第二天」= 日历天：DATEDIFF 只看日期部分</text>

  <path d="M 70 292 L 450 292" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 130 285 L 130 299" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 270 285 L 270 299" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 410 285 L 410 299" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="130" cy="292" r="5" fill="#446688" stroke="#446688" filter="url(#rough2)"/>
  <circle cx="270" cy="292" r="5" fill="#4a7a3a" stroke="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="410" cy="292" r="5" fill="#b85450" stroke="#b85450" filter="url(#rough2)"/>

  <text x="130" y="316" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">06-14 注册日</text>
  <text x="270" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">06-15 第二天 ✓</text>
  <text x="410" y="316" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">06-16 第三天 ✗</text>

  <path d="M 136 278 C 172 258, 228 258, 264 277" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGrn)" filter="url(#rough2)"/>
  <text x="200" y="254" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">仅 23 h，跨过一个零点 → 算第二天</text>

  <path d="M 276 278 C 312 260, 368 260, 404 277" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="340" y="254" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">再跨一天 → 日历差 = 2 ✗</text>

  <text x="260" y="344" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">满不满 24 小时无关：跨过一个零点日期差就 +1（按「满 24 h」口径会漏掉 23 h 的样本）</text>
</svg>
