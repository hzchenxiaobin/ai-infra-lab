<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,2,1,1,1,2,2]</text>

  <!-- column headers -->
  <text x="24" y="62" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="62" y="62" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">x</text>
  <text x="160" y="62" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">判断</text>
  <text x="300" y="62" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">candidate</text>
  <text x="420" y="62" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">count</text>

  <line x1="14" y1="70" x2="546" y2="70" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: init -->
  <text x="24" y="92" font-size="11" fill="#aaa">初始</text>
  <text x="62" y="92" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="160" y="92" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="300" y="92" text-anchor="middle" font-size="11" fill="#aaa">∅</text>
  <text x="420" y="92" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">0</text>

  <!-- Row 1: x=2, count==0 -> pick -->
  <text x="24" y="118" font-size="11" fill="#333">1</text>
  <rect x="50" y="106" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="62" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="160" y="118" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">count==0 → 选候选</text>
  <rect x="284" y="106" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="300" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="420" y="118" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 2: x=2, ==candidate -->
  <text x="24" y="144" font-size="11" fill="#333">2</text>
  <rect x="50" y="132" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="62" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="160" y="144" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">==candidate → +1</text>
  <rect x="284" y="132" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="420" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row 3: x=1, !=candidate -->
  <text x="24" y="170" font-size="11" fill="#333">3</text>
  <rect x="50" y="158" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="62" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="160" y="170" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">!=candidate → −1</text>
  <rect x="284" y="158" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="420" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- Row 4: x=1, !=candidate -> count 0 -->
  <text x="24" y="196" font-size="11" fill="#333">4</text>
  <rect x="50" y="184" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="62" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="160" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">!=candidate → −1</text>
  <rect x="284" y="184" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="300" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="420" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="480" y="196" font-size="10" fill="#b85450" font-weight="bold">★ 归零</text>

  <!-- Row 5: x=1, count==0 -> pick 1 -->
  <text x="24" y="222" font-size="11" fill="#333">5</text>
  <rect x="50" y="210" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="62" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="160" y="222" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">count==0 → 选候选</text>
  <rect x="284" y="210" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="420" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="480" y="222" font-size="10" fill="#d6a040" font-weight="bold">换帅</text>

  <!-- Row 6: x=2, !=candidate -->
  <text x="24" y="248" font-size="11" fill="#333">6</text>
  <rect x="50" y="236" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="62" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="160" y="248" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">!=candidate → −1</text>
  <rect x="284" y="236" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="420" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="480" y="248" font-size="10" fill="#b85450" font-weight="bold">★ 归零</text>

  <!-- Row 7: x=2, count==0 -> pick 2 -->
  <text x="24" y="274" font-size="11" fill="#333">7</text>
  <rect x="50" y="262" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="62" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="160" y="274" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">count==0 → 选候选</text>
  <rect x="284" y="262" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="300" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="420" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <line x1="14" y1="288" x2="546" y2="288" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="60" y="306" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">扫描结束 → candidate = 2  即多数元素 ✓</text>
</svg>
