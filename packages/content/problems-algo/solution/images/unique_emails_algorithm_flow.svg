<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历 → 规范化 → 去重计数</text>

  <!-- Step 1 -->
  <rect x="170" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">遍历每个 email</text>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#666">for s in emails</text>
  <path d="M 270 88 L 270 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: split -->
  <rect x="150" y="112" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">找到 @ ，切分 local / domain</text>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#666">at = s.find('@')</text>
  <path d="M 270 156 L 270 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: find + -->
  <rect x="150" y="180" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">local 中找首个 +，截断前面</text>
  <text x="270" y="214" text-anchor="middle" font-size="11" fill="#666">plus = local.find('+')</text>
  <path d="M 270 224 L 270 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: remove dots -->
  <rect x="150" y="248" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">去掉 local 中所有 .</text>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#666">erase / replace 全删</text>
  <path d="M 270 292 L 270 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: merge + insert -->
  <rect x="120" y="316" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">拼接 local + @ + domain</text>
  <text x="270" y="350" text-anchor="middle" font-size="11" fill="#666">set.insert(规范化串)</text>
  <path d="M 270 360 L 270 380" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 6: loop back arrow (right side) -->
  <path d="M 420 134 Q 470 134 470 64 Q 470 48 370 48" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="100" font-size="11" fill="#888">下一个</text>

  <!-- Final -->
  <rect x="150" y="384" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="404" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 set 大小</text>
  <text x="270" y="418" text-anchor="middle" font-size="11" fill="#666">return set.size()</text>

  <!-- Insight -->
  <rect x="40" y="432" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="270" y="448" text-anchor="middle" font-size="12" fill="#666">关键：规范化后相同串 → 哈希自动去重，只需数集合元素数</text>
</svg>
