<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">最短的桥：DFS 定位 + 多源 BFS 扩展</text>
  <path d="M 290 40 Q 440 46 590 40" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- ===== Grid 1: Original ===== -->
  <text x="116" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#888" filter="url(#sk)">① 原始网格（恰好两个岛）</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="50" y="80" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="72" y="108" text-anchor="middle" fill="#aaa">0</text>
    <rect x="94" y="80" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2"/><text x="116" y="108" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <rect x="138" y="80" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="160" y="108" text-anchor="middle" fill="#aaa">0</text>
    <rect x="50" y="124" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="72" y="152" text-anchor="middle" fill="#aaa">0</text>
    <rect x="94" y="124" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="116" y="152" text-anchor="middle" fill="#aaa">0</text>
    <rect x="138" y="124" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="160" y="152" text-anchor="middle" fill="#aaa">0</text>
    <rect x="50" y="168" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="72" y="196" text-anchor="middle" fill="#aaa">0</text>
    <rect x="94" y="168" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="116" y="196" text-anchor="middle" fill="#aaa">0</text>
    <rect x="138" y="168" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2"/><text x="160" y="196" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <text x="116" y="78" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">岛 A</text>
  <text x="178" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#sk)">岛 B</text>
  <text x="116" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">遍历找首个 1 即岛 A 起点</text>

  <!-- Arrow 1 -->
  <path d="M 190 151 L 248 151" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="219" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">DFS</text>
  <text x="219" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">标记连通块</text>

  <!-- ===== Grid 2: After DFS ===== -->
  <text x="346" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">② DFS 标记岛 A → 2，全部入队</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="280" y="80" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="302" y="108" text-anchor="middle" fill="#aaa">0</text>
    <rect x="324" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="2"/><text x="346" y="108" text-anchor="middle" fill="#335577" font-weight="bold">2</text>
    <rect x="368" y="80" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="390" y="108" text-anchor="middle" fill="#aaa">0</text>
    <rect x="280" y="124" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="302" y="152" text-anchor="middle" fill="#aaa">0</text>
    <rect x="324" y="124" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="346" y="152" text-anchor="middle" fill="#aaa">0</text>
    <rect x="368" y="124" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="390" y="152" text-anchor="middle" fill="#aaa">0</text>
    <rect x="280" y="168" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="302" y="196" text-anchor="middle" fill="#aaa">0</text>
    <rect x="324" y="168" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="346" y="196" text-anchor="middle" fill="#aaa">0</text>
    <rect x="368" y="168" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2"/><text x="390" y="196" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <!-- Queue box below grid 2 -->
  <g filter="url(#sk)">
    <rect x="284" y="226" width="124" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="346" y="244" text-anchor="middle" font-size="10" fill="#335577" filter="url(#sk)">queue = [(0,1)]</text>

  <!-- Arrow 2 -->
  <path d="M 420 151 L 478 151" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="449" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">BFS</text>
  <text x="449" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">逐层扩展</text>

  <!-- ===== Grid 3: BFS expansion ===== -->
  <text x="576" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">③ 多源 BFS 扩展到岛 B</text>
  <g filter="url(#sk)" font-size="14">
    <!-- Row 0: L1  A   L1 -->
    <rect x="510" y="80" width="44" height="44" fill="#fff3e0" stroke="#d6a040" rx="2"/><text x="532" y="108" text-anchor="middle" fill="#8a6d3b" font-size="11">L1</text>
    <rect x="554" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="2"/><text x="576" y="108" text-anchor="middle" fill="#335577" font-weight="bold">2</text>
    <rect x="598" y="80" width="44" height="44" fill="#fff3e0" stroke="#d6a040" rx="2"/><text x="620" y="108" text-anchor="middle" fill="#8a6d3b" font-size="11">L1</text>
    <!-- Row 1: L2  L1  L2 -->
    <rect x="510" y="124" width="44" height="44" fill="#ffe0b2" stroke="#d6a040" rx="2"/><text x="532" y="152" text-anchor="middle" fill="#8a6d3b" font-size="11">L2</text>
    <rect x="554" y="124" width="44" height="44" fill="#fff3e0" stroke="#d6a040" rx="2"/><text x="576" y="152" text-anchor="middle" fill="#8a6d3b" font-size="11">L1</text>
    <rect x="598" y="124" width="44" height="44" fill="#ffe0b2" stroke="#d6a040" rx="2"/><text x="620" y="152" text-anchor="middle" fill="#8a6d3b" font-size="11">L2</text>
    <!-- Row 2: .   L2   B★ -->
    <rect x="510" y="168" width="44" height="44" fill="#fff" stroke="#bbb" rx="2"/><text x="532" y="196" text-anchor="middle" fill="#aaa">0</text>
    <rect x="554" y="168" width="44" height="44" fill="#ffe0b2" stroke="#d6a040" rx="2"/><text x="576" y="196" text-anchor="middle" fill="#8a6d3b" font-size="11">L2</text>
    <rect x="598" y="168" width="44" height="44" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="2"/><text x="620" y="196" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <!-- Arrow from L2 (1,2) to island B (2,2) -->
  <path d="M 620 168 L 620 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="640" y="154" text-anchor="start" font-size="9" fill="#b85450" font-weight="bold" filter="url(#sk)">★ 发现岛 B!</text>
  <text x="576" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">桥 = 2 层 0（step=2 时命中）</text>

  <!-- ===== Legend ===== -->
  <g filter="url(#sk)">
    <rect x="680" y="82" width="180" height="170" rx="8" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="770" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">图例</text>
  <g font-size="10" fill="#444">
    <rect x="694" y="114" width="20" height="14" fill="#e8f0fe" stroke="#446688" rx="2" filter="url(#sk)"/><text x="722" y="125" filter="url(#sk)">岛 A（标记 2）</text>
    <rect x="694" y="136" width="20" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#sk)"/><text x="722" y="147" filter="url(#sk)">岛 B（仍为 1）</text>
    <rect x="694" y="158" width="20" height="14" fill="#fff3e0" stroke="#d6a040" rx="2" filter="url(#sk)"/><text x="722" y="169" filter="url(#sk)">L1 = 第 1 层水</text>
    <rect x="694" y="180" width="20" height="14" fill="#ffe0b2" stroke="#d6a040" rx="2" filter="url(#sk)"/><text x="722" y="191" filter="url(#sk)">L2 = 第 2 层水</text>
    <rect x="694" y="202" width="20" height="14" fill="#fff" stroke="#bbb" rx="2" filter="url(#sk)"/><text x="722" y="213" filter="url(#sk)">未访问水（0）</text>
    <text x="694" y="236" font-size="9" fill="#888" filter="url(#sk)">step = 已扩展水层数</text>
  </g>

  <!-- ===== Bottom: Key insights ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="280" width="780" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="440" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">两阶段核心思想</text>
  <g font-size="11" fill="#444">
    <text x="70" y="332" filter="url(#sk)"><tspan font-weight="bold" fill="#446688">阶段 1 · DFS 定位</tspan>：遍历网格找到第一个 1，DFS/BFS 标记整个岛 A 为 2</text>
    <text x="70" y="350" filter="url(#sk)">  → 同时把岛 A 所有格子加入 BFS 队列（多源），省去单独建源点集合</text>
    <text x="70" y="376" filter="url(#sk)"><tspan font-weight="bold" fill="#b85450">阶段 2 · 多源 BFS 扩展</tspan>：从岛 A 全部格子同时向水域逐层扩展</text>
    <text x="70" y="394" filter="url(#sk)">  → 首次遇到值为 1 的格子即岛 B，当前 step = 最短桥（需翻转的 0 数）</text>
  </g>
</svg>
