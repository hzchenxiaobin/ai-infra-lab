<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：单段代价 = 失配数 − 互配对数</text>

  <!-- s 行 -->
  <text x="30" y="62" font-size="10.5" fill="#555" filter="url(#rough2)">s（word1 段）</text>
  <rect x="110" y="44" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <rect x="154" y="44" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <rect x="198" y="44" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <rect x="242" y="44" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">e</text>
  <rect x="286" y="44" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="303" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <rect x="330" y="44" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="347" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">e</text>
  <rect x="374" y="44" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="391" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>

  <!-- 列对应虚线 -->
  <path d="M127,72 L127,86 M171,72 L171,86 M215,72 L215,86 M259,72 L259,86 M303,72 L303,86 M347,72 L347,86 M391,72 L391,86" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2 3" filter="url(#rough2)"/>

  <!-- t 行 -->
  <text x="30" y="104" font-size="10.5" fill="#555" filter="url(#rough2)">t（word2 段）</text>
  <rect x="110" y="86" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <rect x="154" y="86" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <rect x="198" y="86" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">e</text>
  <rect x="242" y="86" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <rect x="286" y="86" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="303" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">f</text>
  <rect x="330" y="86" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="347" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">e</text>
  <rect x="374" y="86" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="391" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">f</text>

  <!-- 型标注 -->
  <text x="127" y="132" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">(a,b)</text>
  <text x="171" y="132" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">(b,a)</text>
  <text x="215" y="132" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">(c,e)</text>
  <text x="259" y="132" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">(e,c)</text>
  <text x="303" y="132" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">(d,f)</text>
  <text x="347" y="132" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(e,e)</text>
  <text x="391" y="132" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">(d,f)</text>

  <!-- 互配交换弧线 -->
  <path d="M127,140 Q149,164 171,140" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="149" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">互配交换 1op</text>
  <path d="M215,140 Q237,164 259,140" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="237" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">互配交换 1op</text>

  <!-- 替换标记 -->
  <rect x="280" y="144" width="46" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="303" y="158" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">替换 1op</text>
  <text x="347" y="158" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">已匹配</text>
  <rect x="368" y="144" width="46" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="391" y="158" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">替换 1op</text>

  <!-- 左面板：分型计数 -->
  <rect x="26" y="184" width="246" height="100" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="149" y="204" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">按字符对分型计数（仅失配位）</text>
  <text x="40" y="226" font-size="10.5" fill="#333" filter="url(#rough2)">cnt(a,b)=1 ↔ cnt(b,a)=1 → 互配 1</text>
  <text x="40" y="246" font-size="10.5" fill="#333" filter="url(#rough2)">cnt(c,e)=1 ↔ cnt(e,c)=1 → 互配 1</text>
  <text x="40" y="266" font-size="10.5" fill="#333" filter="url(#rough2)">cnt(d,f)=2 ↔ cnt(f,d)=0 → 互配 0</text>
  <text x="40" y="282" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">构造：swap(0,1)、swap(2,3)、改两处 = 4 步 ✓</text>

  <!-- 右面板：公式 -->
  <rect x="290" y="184" width="206" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="393" y="204" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">纯交换 + 替换的代价 f</text>
  <text x="393" y="228" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">f = m − Σ min(cnt(a,b), cnt(b,a))</text>
  <text x="393" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">= 6 − (1+1+0) = 4</text>
  <text x="393" y="272" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">剩余失配 6 − 2·2 = 2 个，各替换一次</text>

  <!-- 反转分支提示 -->
  <rect x="26" y="298" width="470" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="261" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">别忘了反转分支：cost(i,j) = min( f(s,t), 1 + f(rev(s),t) )</text>
  <text x="261" y="338" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">反转后失配与互配结构都会变，正序、倒序都要算再取小</text>
  <text x="261" y="354" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">例：「abcdef」→「fedabc」正序 f = 5，倒序 1 + f = 2，反转更优</text>

  <!-- 结论条 -->
  <rect x="26" y="376" width="470" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="399" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">划分交给前缀 DP：dp[j] = min dp[i] + cost(i,j)；段内 = 可选反转 + 互配交换 + 剩余替换</text>
</svg>
