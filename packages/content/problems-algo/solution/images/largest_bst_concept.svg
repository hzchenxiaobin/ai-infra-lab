<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：后序传递 (min, max, size) 三元组</text>

  <!-- ============ Left: the tree ============ -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">① 示例树：高亮最大 BST 子树</text>

  <!-- highlight box around subtree 5 (nodes 5,1,8) -->
  <rect x="48" y="92" width="140" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>

  <!-- edges -->
  <path d="M 180 104 L 120 158" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 180 104 L 260 158" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 120 168 L 80 222" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 120 168 L 160 222" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 260 168 L 300 222" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- node 10 (not BST, red ring) -->
  <circle cx="180" cy="96" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">10</text>

  <!-- node 5 (BST root, green ring) -->
  <circle cx="120" cy="162" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="120" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- node 15 (not BST, red ring) -->
  <circle cx="260" cy="162" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">15</text>

  <!-- node 1 (leaf BST) -->
  <circle cx="80" cy="228" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- node 8 (leaf BST) -->
  <circle cx="160" cy="228" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- node 7 (leaf BST) -->
  <circle cx="300" cy="228" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>

  <!-- return tuples below each node -->
  <text x="80"  y="262" text-anchor="middle" font-size="9.5" fill="#4a7a3a">(1,1,1)</text>
  <text x="160" y="262" text-anchor="middle" font-size="9.5" fill="#4a7a3a">(8,8,1)</text>
  <text x="300" y="262" text-anchor="middle" font-size="9.5" fill="#446688">(7,7,1)</text>
  <text x="120" y="200" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">(1,8,3) ✓</text>
  <text x="260" y="200" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">(0,0,-1)</text>
  <text x="180" y="134" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">(0,0,-1)</text>

  <!-- up arrows from children to parents (showing transfer) -->
  <path d="M 80 244 L 100 188" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 160 244 L 140 188" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 300 244 L 278 188" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="48" y="312" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="68" y="324" font-size="10" fill="#555">BST 子树</text>
  <rect x="148" y="312" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="168" y="324" font-size="10" fill="#555">非 BST（size=-1）</text>
  <text x="48" y="344" font-size="9.5" fill="#888">箭头表示三元组 (min,max,size) 向父节点传递</text>

  <!-- divider -->
  <path d="M 380 56 L 380 360" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ============ Right: synthesis rule ============ -->
  <text x="400" y="58" font-size="12" fill="#446688" font-weight="bold">② 合成规则</text>

  <!-- rule box -->
  <rect x="396" y="72" width="150" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="471" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">若两子是 BST</text>
  <text x="471" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">且 lmax &lt; val &lt; rmin</text>
  <text x="471" y="130" text-anchor="middle" font-size="10.5" fill="#555">→ size = lsize+rsize+1</text>
  <text x="471" y="146" text-anchor="middle" font-size="10.5" fill="#555">→ min/max 扩展值域</text>

  <!-- else box -->
  <rect x="396" y="168" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="471" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否则返回 (0,0,-1)</text>
  <text x="471" y="204" text-anchor="middle" font-size="9.5" fill="#888">哨兵向上传播失败</text>

  <!-- empty subtree convention -->
  <rect x="396" y="226" width="150" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="471" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">空子树约定</text>
  <text x="471" y="264" text-anchor="middle" font-size="10.5" fill="#555">返回 (+∞, -∞, 0)</text>
  <text x="471" y="282" text-anchor="middle" font-size="9.5" fill="#888">使 lmax&lt;val&lt;rmin 自动成立</text>
  <text x="471" y="294" text-anchor="middle" font-size="9.5" fill="#888">叶子节点无需特判</text>

  <!-- key insight -->
  <rect x="396" y="312" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="471" y="332" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">BST 合法性是跨层约束</text>
  <text x="471" y="348" text-anchor="middle" font-size="9.5" fill="#555">需携带值域边界</text>
  <text x="471" y="360" text-anchor="middle" font-size="9.5" fill="#555">非单一布尔（对照 250）</text>
</svg>
