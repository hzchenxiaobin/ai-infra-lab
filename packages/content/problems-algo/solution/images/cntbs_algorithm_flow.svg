<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀异或 + 哈希计数（边走边查）</text>

  <!-- Step 1: init -->
  <rect x="120" y="50" width="320" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="12.5" fill="#224466" font-weight="bold" font-family="monospace">① 初始化 pref=0, count={0:1}, ans=0</text>

  <line x1="280" y1="96" x2="280" y2="118" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: iterate prefix xor -->
  <rect x="80" y="120" width="400" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">② 遍历每个 x ∈ nums</text>
  <text x="280" y="166" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold" font-family="monospace">pref ^= x          # 即 prefix[r+1]</text>

  <line x1="280" y1="178" x2="280" y2="200" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: count -->
  <rect x="60" y="202" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12.5" fill="#7a5a20" font-weight="bold">③ 查表 + 更新（同值前缀数 = 可作左端点 l 的数目）</text>
  <text x="280" y="250" text-anchor="middle" font-size="13" fill="#7a5a20" font-weight="bold" font-family="monospace">ans += count[pref];  count[pref] += 1</text>
  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#9a7a30">先查后写：count[pref] 正是 l&lt;r+1 的等值前缀个数</text>

  <line x1="280" y1="278" x2="280" y2="300" stroke="#666" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="100" y="302" width="360" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold" font-family="monospace">④ return ans</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#b03a3a">每对 prefix[l]==prefix[r+1] 对应一个美丽子数组</text>
</svg>
