<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- title -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">同余分组 → 层×余数 网格：行优先扫描第一个空洞即 MEX</text>

  <!-- count row label -->
  <text x="100" y="68" font-size="12" fill="#4a7a3a" filter="url(#rough2)">计数 cnt[r]=</text>
  <text x="196" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="256" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="316" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="376" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="436" y="68" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- residue header -->
  <text x="100" y="98" font-size="12" fill="#446688" filter="url(#rough2)">余数 r =</text>
  <text x="196" y="98" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <text x="256" y="98" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="316" y="98" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <text x="376" y="98" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <text x="436" y="98" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4</text>

  <!-- row labels -->
  <text x="160" y="137" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">层0 (值 0–4)</text>
  <text x="160" y="189" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">层1 (值 5–9)</text>
  <text x="160" y="241" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">层2 (值 10–14)</text>

  <!-- ===== Level 0 cells ===== -->
  <rect x="168" y="110" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <rect x="228" y="110" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="288" y="110" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="348" y="110" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- MEX cell (0,4) -->
  <rect x="408" y="110" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="138" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4 ✗</text>

  <!-- ===== Level 1 cells ===== -->
  <rect x="168" y="162" width="56" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="190" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5 ✗</text>

  <rect x="228" y="162" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <rect x="288" y="162" width="56" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="190" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7 ✗</text>

  <rect x="348" y="162" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <rect x="408" y="162" width="56" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="436" y="190" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">9 ✗</text>

  <!-- ===== Level 2 cells ===== -->
  <rect x="168" y="214" width="56" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="242" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">10 ✗</text>

  <rect x="228" y="214" width="56" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="242" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">11 ✗</text>

  <rect x="288" y="214" width="56" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="242" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">12 ✗</text>

  <rect x="348" y="214" width="56" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="242" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">13 ✗</text>

  <rect x="408" y="214" width="56" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="436" y="242" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">14 ✗</text>

  <!-- scan arrow across level 0, stopping at MEX cell -->
  <path d="M150,133 L196,133 M196,133 L256,133 L316,133 L376,133 L436,133"
        fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="120" font-size="11" fill="#d6a040" filter="url(#rough2)">行优先</text>
  <text x="120" y="133" font-size="11" fill="#d6a040" filter="url(#rough2)">扫描 →</text>

  <!-- MEX callout -->
  <path d="M468,133 L478,133" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="129" font-size="12" fill="#b85450" filter="url(#rough2)">第一个</text>
  <text x="482" y="143" font-size="12" fill="#b85450" filter="url(#rough2)">空洞</text>

  <!-- formula box -->
  <rect x="120" y="286" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">MEX = min(cnt) × value + min{r : cnt[r] = min}</text>
  <text x="280" y="328" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">= 0 × 5 + 4 = 4</text>

  <!-- legend -->
  <rect x="150" y="356" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="170" y="367" font-size="11" fill="#333" filter="url(#rough2)">可填（该元素能变到此值）</text>
  <rect x="340" y="356" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="360" y="367" font-size="11" fill="#333" filter="url(#rough2)">空洞（无元素可变到此值）</text>
</svg>
