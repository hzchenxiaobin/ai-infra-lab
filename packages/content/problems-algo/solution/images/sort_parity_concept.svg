<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">左右双指针：原地按奇偶分区（类快排 partition）</text>

  <!-- ===== Goal ===== -->
  <text x="40" y="52" font-size="12" fill="#888">目标：偶数在前，奇数在后（组内顺序不限）</text>
  <rect x="76" y="58" width="144" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="77" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">偶数区</text>
  <rect x="220" y="58" width="144" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="77" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">奇数区</text>

  <!-- ===== Invariant ===== -->
  <text x="40" y="108" font-size="12" fill="#888">循环不变式：left 左侧全偶，right 右侧全奇，中间待处理</text>
  <!-- pointer labels -->
  <text x="124" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left →</text>
  <text x="316" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">← right</text>
  <!-- zones -->
  <rect x="76" y="130" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">已确认偶</text>
  <rect x="172" y="130" width="96" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="146" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">待处理</text>
  <rect x="268" y="130" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">已确认奇</text>

  <!-- ===== Swap scenario ===== -->
  <text x="40" y="178" font-size="12" fill="#888">交换场景：左指到奇数 × 右指到偶数 → 两者都错位，交换</text>

  <!-- Before swap -->
  <text x="40" y="200" font-size="11" fill="#888">交换前：</text>
  <!-- pointer labels -->
  <text x="196" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">left↓</text>
  <text x="340" y="200" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">right↓</text>

  <!-- cells: [2, 4, 3, 1, 5, 6] -->
  <rect x="76" y="206" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="226" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="124" y="206" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="226" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="172" y="206" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="226" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="220" y="206" width="48" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="226" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="268" y="206" width="48" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="226" text-anchor="middle" font-size="14" fill="#999">5</text>
  <rect x="316" y="206" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="226" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- swap arrows between cells 3 and 6 -->
  <path d="M 196 240 Q 268 258 340 240" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 240 Q 268 258 196 240" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="256" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">swap</text>

  <!-- After swap -->
  <text x="40" y="278" font-size="11" fill="#888">交换后：</text>
  <!-- cells: [2, 4, 6, 1, 5, 3] -->
  <rect x="76" y="282" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="302" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="124" y="282" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="302" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="172" y="282" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="302" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="220" y="282" width="48" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="302" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="268" y="282" width="48" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="302" text-anchor="middle" font-size="14" fill="#999">5</text>
  <rect x="316" y="282" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="302" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- Core idea box -->
  <rect x="40" y="326" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">本质 = 快排 partition：判据从"与 pivot 比大小"→"判奇偶"</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#666">left 找错位奇数，right 找错位偶数，交换后各归其位</text>
</svg>
