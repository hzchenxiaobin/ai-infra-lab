<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟循环，两个赋值</text>

  <!-- start -->
  <rect x="195" y="44" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">输入 nums（长度 n）</text>

  <path d="M 280 78 L 280 96" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="155" y="100" width="250" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 新建 ans，长度 2n</text>

  <path d="M 280 138 L 280 156" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="200" y="160" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② i = 0</text>

  <path d="M 280 194 L 280 212" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="280,216 368,252 280,288 192,252" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="257" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i &lt; n ?</text>

  <!-- yes branch -->
  <path d="M 280 288 L 280 306" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="293" y="303" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- step 3 (core) -->
  <rect x="170" y="310" width="220" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">③ ans[i] = nums[i]</text>
  <text x="280" y="353" text-anchor="middle" font-size="11.5" fill="#a87020">ans[i+n] = nums[n−1−i]</text>

  <path d="M 280 368 L 280 386" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="215" y="390" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ i = i + 1</text>

  <!-- loop back -->
  <path d="M 215 406 L 110 406 L 110 252 L 186 252" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="152" y="398" text-anchor="middle" font-size="10.5" fill="#4a7a3a">回到判断</text>

  <!-- no branch -->
  <path d="M 368 252 L 408 252" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="385" y="244" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">否</text>

  <!-- return -->
  <rect x="412" y="232" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="482" y="257" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">⑤ 返回 ans</text>

  <text x="280" y="448" text-anchor="middle" font-size="11" fill="#999">一趟循环 O(n)：每个 i 同时填好左半一格与右半镜像一格</text>
</svg>
