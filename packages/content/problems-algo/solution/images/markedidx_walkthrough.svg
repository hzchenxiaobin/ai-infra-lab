<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：双指针在小值池/大值池上推进</text>

  <!-- ============ Example 2 : nums=[9,2,5,4] -> sorted [2,4,5,9] ============ -->
  <text x="40" y="58" font-size="12.5" fill="#446688" font-weight="bold">示例 2　[9,2,5,4] → 排序 [2,4,5,9]，n/2 = 2</text>

  <!-- helper: draw a row of cells starting at sx, values given, with i/j pointer labels -->
  <!-- Step1: i=0(2) j=2(5): 2*2=4<=5 yes -->
  <text x="40" y="92" font-size="11" fill="#888">① i=0, j=2</text>
  <!-- cells 2 4 5 9 ; indices 0 1 2 3 -->
  <g filter="url(#rough2)">
    <rect x="90" y="96" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="112" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
    <rect x="136" y="96" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" opacity="0.55"/>
    <text x="158" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#999">4</text>
    <rect x="182" y="96" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="204" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">5</text>
    <rect x="228" y="96" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" opacity="0.55"/>
    <text x="250" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#999">9</text>
  </g>
  <text x="112" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="204" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">j</text>
  <path d="M 134 116 L 180 116" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="120" font-size="11" fill="#333" font-weight="bold">2·2=4 ≤ 5 ✓　标记 → ans=2, i→1, j→3</text>

  <!-- Step2: i=1(4) j=3(9): 2*4=8<=9 yes -->
  <text x="40" y="160" font-size="11" fill="#888">② i=1, j=3</text>
  <g filter="url(#rough2)">
    <rect x="90" y="164" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" opacity="0.55"/>
    <text x="112" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#999">2</text>
    <rect x="136" y="164" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="158" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4</text>
    <rect x="182" y="164" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" opacity="0.55"/>
    <text x="204" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#999">5</text>
    <rect x="228" y="164" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="250" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">9</text>
  </g>
  <text x="158" y="156" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="250" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">j</text>
  <path d="M 180 184 L 226 184" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="188" font-size="11" fill="#333" font-weight="bold">2·4=8 ≤ 9 ✓　标记 → ans=4, i→2 = n/2 停</text>

  <rect x="40" y="216" width="520" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="234" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">结果 = 4（全部标记）</text>

  <!-- divider -->
  <path d="M 40 260 L 560 260" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ============ Example 1 : nums=[3,5,2,4] -> sorted [2,3,4,5] ============ -->
  <text x="40" y="288" font-size="12.5" fill="#446688" font-weight="bold">示例 1　[3,5,2,4] → 排序 [2,3,4,5]，n/2 = 2</text>

  <!-- Step1: i=0(2) j=2(4): 2*2=4<=4 yes -->
  <text x="40" y="322" font-size="11" fill="#888">① i=0, j=2</text>
  <g filter="url(#rough2)">
    <rect x="90" y="326" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="112" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
    <rect x="136" y="326" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" opacity="0.55"/>
    <text x="158" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#999">3</text>
    <rect x="182" y="326" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="204" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4</text>
    <rect x="228" y="326" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" opacity="0.55"/>
    <text x="250" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#999">5</text>
  </g>
  <text x="112" y="318" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="204" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">j</text>
  <path d="M 134 346 L 180 346" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="350" font-size="11" fill="#333" font-weight="bold">2·2=4 ≤ 4 ✓　标记 → ans=2, i→1, j→3</text>

  <!-- Step2: i=1(3) j=3(5): 2*3=6<=5 NO -->
  <text x="40" y="390" font-size="11" fill="#888">② i=1, j=3</text>
  <g filter="url(#rough2)">
    <rect x="90" y="394" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" opacity="0.55"/>
    <text x="112" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#999">2</text>
    <rect x="136" y="394" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="158" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
    <rect x="182" y="394" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" opacity="0.55"/>
    <text x="204" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#999">4</text>
    <rect x="228" y="394" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="250" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">5</text>
  </g>
  <text x="158" y="386" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="250" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">j</text>
  <path d="M 180 414 L 226 414" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="418" font-size="11" fill="#333" font-weight="bold">2·3=6 ≤ 5 ✗　j 太小 → j++ = 4 = n，停止</text>

  <rect x="40" y="446" width="520" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="460" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">结果 = 2（j 扫到尽头仍无更大值，3 落选）</text>
</svg>
