<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三组输入的判定过程</text>

  <!-- Legend -->
  <text x="270" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">红=负数  绿=正数  黄=零</text>

  <!-- ===== Example 1: [-1,-2,-3,-4,3,2,1], 7 cells width 46 height 36 y=70 ===== -->
  <text x="30" y="93" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1</text>
  <rect x="110" y="70" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="70" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="202" y="70" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="248" y="70" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="294" y="70" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="70" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="386" y="70" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="179" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="225" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="271" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">−4</text>
  <text x="317" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="363" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="409" y="93" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="110" y="128" font-size="11" fill="#555" filter="url(#rough2)">负数 4 个（偶）· 无 0   →   (−1)⁴ = +1</text>
  <rect x="440" y="76" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 1</text>

  <!-- divider -->
  <path d="M 40 148 L 500 148" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2: [1,5,0,2,-3], 5 cells width 50 height 36 y=160 ===== -->
  <text x="30" y="183" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2</text>
  <rect x="110" y="160" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="160" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="160" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="160" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="160" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="185" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="235" y="183" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="285" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="335" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="110" y="218" font-size="11" fill="#555" filter="url(#rough2)">遇 0 → 立即返回（提前终止，不计负数）</text>
  <rect x="440" y="166" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="188" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→ 0</text>

  <!-- divider -->
  <path d="M 40 238 L 500 238" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 3: [-1,1,-1,1,-1], 5 cells width 50 height 36 y=250 ===== -->
  <text x="30" y="273" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3</text>
  <rect x="110" y="250" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="160" y="250" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="250" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="250" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="250" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="185" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="235" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="285" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="335" y="273" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="110" y="308" font-size="11" fill="#555" filter="url(#rough2)">负数 3 个（奇）· 无 0   →   (−1)³ = −1</text>
  <rect x="440" y="256" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="278" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ −1</text>
</svg>
