<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：定位 1 与 n 的位置，相邻交换代价 = 距离</text>

  <!-- ===== Case A: x < y ===== -->
  <rect x="20" y="40" width="480" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="62" font-size="12" fill="#4a7a3a" font-weight="bold">情况 A：x &lt; y（1 在 n 左侧，不交叉）</text>

  <!-- array [2,1,4,3] -->
  <text x="40" y="96" font-size="12" fill="#888">nums =</text>
  <rect x="110" y="82" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="102" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="150" y="82" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="82" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="102" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="230" y="82" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="102" text-anchor="middle" font-size="14" fill="#333">3</text>

  <!-- index labels -->
  <text x="130" y="126" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="170" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">x=1</text>
  <text x="210" y="126" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">y=2</text>
  <text x="250" y="126" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- arrows: 1 left, n right -->
  <path d="M 168 138 L 132 138" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 向左 x=1 步</text>
  <path d="M 212 138 L 248 138" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">n 向右 n-1-y=1 步</text>

  <!-- result A -->
  <rect x="110" y="160" width="340" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#333">互不干扰 → ans = x + (n-1-y) = 1 + 1 = <tspan fill="#4a7a3a" font-weight="bold">2</tspan></text>

  <!-- ===== Case B: x > y ===== -->
  <rect x="20" y="224" width="480" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="246" font-size="12" fill="#d6a040" font-weight="bold">情况 B：x &gt; y（1 在 n 右侧，交叉一次）</text>

  <!-- array [2,4,1,3] -->
  <text x="40" y="280" font-size="12" fill="#888">nums =</text>
  <rect x="110" y="266" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="286" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="150" y="266" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="286" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="190" y="266" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="286" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="266" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="286" text-anchor="middle" font-size="14" fill="#333">3</text>

  <!-- index labels -->
  <text x="130" y="310" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="170" y="310" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">y=1</text>
  <text x="210" y="310" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">x=2</text>
  <text x="250" y="310" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- arrows: 1 left (crosses n), n right -->
  <path d="M 208 322 L 130 322" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="170" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 向左 x=2 步（途中与 4 交叉 1 次）</text>
  <path d="M 172 342 L 250 342" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">n 向右 n-1-y=2 步</text>

  <!-- result B -->
  <rect x="110" y="350" width="340" height="34" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#333">交叉处 1 次交换同时推动两者 → 减 1 → ans = 2+2-1 = <tspan fill="#d6a040" font-weight="bold">3</tspan></text>

  <!-- ===== formula box ===== -->
  <rect x="20" y="406" width="480" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="432" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = x + (n-1-y)，若 x &gt; y 再 −1</text>
</svg>
