<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：建表 → 逐个探测 → 取最大</text>

  <!-- phase 1: build table -->
  <rect x="60" y="32" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="53" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段一 建表：arr1 每个数反复 ÷10，前缀入表</text>

  <path d="M 200 66 L 200 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box A -->
  <rect x="110" y="84" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">取 arr2 中下一个 y</text>
  <text x="200" y="116" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">（取完 → 返回 ans）</text>

  <path d="M 200 124 L 200 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box B -->
  <rect x="130" y="142" width="140" height="26" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="159" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">p ← y（最长前缀）</text>

  <path d="M 200 168 L 200 180" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <path d="M 200 184 L 290 222 L 200 260 L 110 222 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="227" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">p 在表中？</text>

  <!-- yes branch -->
  <path d="M 290 222 L 316 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="303" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="320" y="204" width="132" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="386" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = max(ans, 位数 p)</text>

  <!-- attach to return bus -->
  <path d="M 452 222 L 466 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return bus -->
  <path d="M 470 393 L 470 74 L 270 74 L 270 82" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="380" y="68" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">换下一个 y</text>

  <!-- no branch -->
  <path d="M 200 260 L 200 276" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="212" y="272" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- decision 2 -->
  <path d="M 200 280 L 290 318 L 200 356 L 110 318 Z" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="314" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">p &gt; 0？</text>
  <text x="200" y="332" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（还有更短前缀）</text>

  <!-- yes: shorten prefix -->
  <path d="M 110 318 L 92 318" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="101" y="310" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="6" y="300" width="82" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="47" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">p ← ⌊p/10⌋</text>

  <!-- loop back to decision 1 -->
  <path d="M 47 300 L 47 222 L 102 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="56" y="264" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">再查</text>

  <!-- no: contribute 0 -->
  <path d="M 200 356 L 200 374" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="212" y="370" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="132" y="378" width="136" height="30" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="397" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">该 y 贡献 0</text>

  <!-- attach zero box to return bus -->
  <path d="M 268 393 L 466 393" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="20" y="412" width="480" height="24" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="428" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ans 初值 0 全程取 max；表里只放 arr1 的前缀、只拿 arr2 的前缀来查，两侧不能混表！</text>
</svg>
