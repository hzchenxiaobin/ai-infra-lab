<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：nums = [1,3,5,2,4,8,2,2] → 1</text>

  <!-- legend -->
  <rect x="380" y="38" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="398" y="50" font-size="9.5" fill="#666">min 产生</text>
  <rect x="450" y="38" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="468" y="50" font-size="9.5" fill="#666">max 产生</text>

  <!-- ===== Row 0: input n=8 ===== -->
  <text x="92" y="92" text-anchor="end" font-size="11" fill="#666" font-weight="bold">输入</text>
  <text x="92" y="106" text-anchor="end" font-size="10" fill="#888">n=8</text>

  <!-- pair brackets + op labels above row0 -->
  <path d="M 122 60 Q 160 52 198 60" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="160" y="50" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">min</text>
  <path d="M 202 60 Q 240 52 278 60" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="240" y="50" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">max</text>
  <path d="M 282 60 Q 320 52 358 60" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="50" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">min</text>
  <path d="M 362 60 Q 400 52 438 60" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="400" y="50" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">max</text>

  <!-- 8 cells width 36 gap 4 start 122 y=68 -->
  <rect x="122" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="162" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="202" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="242" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="282" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="322" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="362" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="402" y="68" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- arrow row0 -> row1 -->
  <path d="M 280 112 L 280 138" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 1: n=4  values 1,5,4,2 ===== -->
  <text x="92" y="172" text-anchor="end" font-size="11" fill="#666" font-weight="bold">第1轮</text>
  <text x="92" y="186" text-anchor="end" font-size="10" fill="#888">n=4</text>

  <path d="M 202 142 Q 240 134 278 142" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="240" y="132" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">min</text>
  <path d="M 282 142 Q 320 134 358 142" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="132" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">max</text>

  <rect x="202" y="150" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="174" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="242" y="150" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <rect x="282" y="150" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="174" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="322" y="150" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="174" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <path d="M 280 194 L 280 220" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: n=2 values 1,4 ===== -->
  <text x="92" y="252" text-anchor="end" font-size="11" fill="#666" font-weight="bold">第2轮</text>
  <text x="92" y="266" text-anchor="end" font-size="10" fill="#888">n=2</text>

  <path d="M 242 224 Q 280 216 318 224" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">min</text>

  <rect x="242" y="232" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="282" y="232" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="256" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>

  <path d="M 280 276 L 280 302" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: n=1 result ===== -->
  <text x="92" y="332" text-anchor="end" font-size="11" fill="#666" font-weight="bold">第3轮</text>
  <text x="92" y="346" text-anchor="end" font-size="10" fill="#888">n=1</text>

  <rect x="262" y="314" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <path d="M 312 332 L 360 332" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="410" y="336" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">结果 = 1 ✓</text>

  <!-- bottom note -->
  <rect x="30" y="376" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#555">每轮对半配对，min/max 交替由当前下标 i 的奇偶决定；⌈log₂n⌉ = 3 轮收敛到单值</text>
  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#555">（i 偶 → min；i 奇 → max）</text>
</svg>
