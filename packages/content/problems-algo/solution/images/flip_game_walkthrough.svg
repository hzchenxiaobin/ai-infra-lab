<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：currentState = &quot;++++&quot;</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">i 从 0 扫到 2，三个位置都命中「++」，依次翻一次入结果</text>

  <!-- column headers -->
  <text x="50" y="78" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="150" y="78" font-size="11" fill="#446688" font-weight="bold">查看 s[i], s[i+1]</text>
  <text x="300" y="78" font-size="11" fill="#446688" font-weight="bold">命中？</text>
  <text x="400" y="78" font-size="11" fill="#446688" font-weight="bold">翻转后入结果</text>

  <!-- ===== i = 0 ===== -->
  <rect x="30" y="86" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="112" font-size="13" fill="#333" font-weight="bold">0</text>

  <g font-size="13">
    <rect x="120" y="96" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="133" y="115" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="146" y="96" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="159" y="115" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="172" y="96" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
    <text x="185" y="115" text-anchor="middle" fill="#bbb">+</text>
    <rect x="198" y="96" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
    <text x="211" y="115" text-anchor="middle" fill="#bbb">+</text>
    <!-- highlight pair -->
    <rect x="118" y="92" width="56" height="36" fill="none" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  </g>

  <text x="300" y="114" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 是</text>

  <g font-size="13">
    <rect x="380" y="96" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="393" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="406" y="96" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="419" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="432" y="96" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="445" y="115" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="458" y="96" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="471" y="115" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
  </g>

  <!-- ===== i = 1 ===== -->
  <rect x="30" y="138" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="164" font-size="13" fill="#333" font-weight="bold">1</text>

  <g font-size="13">
    <rect x="120" y="148" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
    <text x="133" y="167" text-anchor="middle" fill="#bbb">+</text>
    <rect x="146" y="148" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="159" y="167" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="172" y="148" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="185" y="167" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="198" y="148" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
    <text x="211" y="167" text-anchor="middle" fill="#bbb">+</text>
    <rect x="144" y="144" width="56" height="36" fill="none" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  </g>

  <text x="300" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 是</text>

  <g font-size="13">
    <rect x="380" y="148" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="393" y="167" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="406" y="148" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="419" y="167" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="432" y="148" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="445" y="167" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="458" y="148" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="471" y="167" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
  </g>

  <!-- ===== i = 2 ===== -->
  <rect x="30" y="190" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="216" font-size="13" fill="#333" font-weight="bold">2</text>

  <g font-size="13">
    <rect x="120" y="200" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
    <text x="133" y="219" text-anchor="middle" fill="#bbb">+</text>
    <rect x="146" y="200" width="26" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
    <text x="159" y="219" text-anchor="middle" fill="#bbb">+</text>
    <rect x="172" y="200" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="185" y="219" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="198" y="200" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="211" y="219" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="170" y="196" width="56" height="36" fill="none" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  </g>

  <text x="300" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 是</text>

  <g font-size="13">
    <rect x="380" y="200" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="393" y="219" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="406" y="200" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="419" y="219" text-anchor="middle" fill="#446688" font-weight="bold">+</text>
    <rect x="432" y="200" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="445" y="219" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
    <rect x="458" y="200" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="471" y="219" text-anchor="middle" fill="#b85450" font-weight="bold">−</text>
  </g>

  <!-- ===== i = 3 : out of range ===== -->
  <rect x="30" y="242" width="500" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)" opacity="0.7"/>
  <text x="50" y="265" font-size="13" fill="#888" font-weight="bold">3</text>
  <text x="120" y="265" font-size="11" fill="#888">i = n−1 = 3，没有 s[i+1]，循环结束（i &lt; n−1 判定为否）</text>

  <!-- ===== Result box ===== -->
  <rect x="30" y="296" width="500" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终输出 res</text>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#333">[ &quot;--++&quot;, &quot;+--+&quot;, &quot;++--&quot; ]</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#555">3 次命中 = 3 个结果；每个 i 独立翻转，互不干扰</text>
</svg>
