<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两个间隙决定答案</text>

  <!-- ===== 顶部：通用数轴 + 间隙定义 ===== -->
  <text x="40" y="56" font-size="11.5" fill="#446688" font-weight="bold">排序后 x &lt; y &lt; z，定义两个间隙</text>

  <!-- 数轴主线 -->
  <path d="M 70 92 L 470 92" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 三枚石子 -->
  <circle cx="100" cy="92" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="250" cy="92" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="440" cy="92" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">x</text>
  <text x="250" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">y</text>
  <text x="440" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">z</text>

  <!-- gap1 花括号（用 path 近似） -->
  <path d="M 100 108 Q 100 118 175 118 Q 250 118 250 108" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="175" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">gap₁ = y − x</text>

  <!-- gap2 花括号 -->
  <path d="M 250 108 Q 250 118 345 118 Q 440 118 440 108" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="345" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">gap₂ = z − y</text>

  <!-- ===== 中部：min 三种情况 ===== -->
  <text x="40" y="166" font-size="11.5" fill="#446688" font-weight="bold">最小次数 min：看间隙能否一步凑连续</text>

  <!-- 情况 A：已连续 -->
  <rect x="36" y="178" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="111" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">A：z − x = 2</text>
  <text x="111" y="212" text-anchor="middle" font-size="10" fill="#333">gap₁=gap₂=1 已连续</text>
  <text x="111" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min = 0</text>

  <!-- 情况 B：某间隙 ≤ 2 -->
  <rect x="195" y="178" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="275" y="196" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">B：gap₁≤2 或 gap₂≤2</text>
  <text x="275" y="212" text-anchor="middle" font-size="10" fill="#333">远端一步填补/桥接</text>
  <text x="275" y="228" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">min = 1</text>

  <!-- 情况 C：两间隙均 ≥ 3 -->
  <rect x="364" y="178" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="439" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">C：两间隙均 ≥ 3</text>
  <text x="439" y="212" text-anchor="middle" font-size="10" fill="#333">一步必剩跨度≥3 对</text>
  <text x="439" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min = 2</text>

  <!-- 三情况间箭头：递进 -->
  <path d="M 186 206 L 195 206" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 206 L 364 206" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B 的补充说明：为何 ≤2 一步可解 -->
  <rect x="36" y="244" width="478" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="48" y="266" font-size="10.5" fill="#333">gap=1：远端→y±1 凑相邻；gap=2：远端→y∓1 填中间空缺。两间隙均≥3 时移动任一端后剩一对跨度≥3，三点不可能连续。</text>

  <!-- ===== 底部：max ===== -->
  <text x="40" y="304" font-size="11.5" fill="#446688" font-weight="bold">最大次数 max：每次跨度恰减 1</text>

  <!-- 跨度递减示意 -->
  <rect x="36" y="316" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="66" y="336" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">z−x</text>

  <path d="M 96 331 L 132 331" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="114" y="324" text-anchor="middle" font-size="9.5" fill="#4a7a3a">−1</text>

  <rect x="132" y="316" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="336" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−1</text>

  <path d="M 188 331 L 224 331" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="206" y="324" text-anchor="middle" font-size="9.5" fill="#4a7a3a">−1</text>

  <text x="246" y="336" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">···</text>

  <path d="M 266 331 L 302 331" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="324" text-anchor="middle" font-size="9.5" fill="#4a7a3a">−1</text>

  <rect x="302" y="316" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- 公式结论 -->
  <rect x="372" y="312" width="142" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="443" y="330" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">max = (z−x) − 2</text>
  <text x="443" y="345" text-anchor="middle" font-size="9.5" fill="#888">= (gap₁−1)+(gap₂−1)</text>

  <!-- 底部注脚 -->
  <text x="48" y="372" font-size="10.5" fill="#333">未结束时至少一个间隙 ≥ 2，总有「端点内移一格」的合法操作，故每步跨度恰减 1 可达。</text>
  <text x="48" y="388" font-size="10.5" fill="#b85450" font-weight="bold">⇒ answer = [min, z − x − 2]</text>
</svg>
