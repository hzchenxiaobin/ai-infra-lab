<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">check(d)：固定 x = mn + d，给 y 挤出一个区间</text>

  <!-- Step 1 -->
  <rect x="40" y="48" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 预检：known_adj ≤ d ？ 且 mn = 与 -1 相邻已知值的最小值</text>

  <path d="M 260 82 L 260 102" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="120" y="104" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">② 令 x = mn + d（低值帮手），x 够得着 ≤ mn+2d 的数</text>

  <path d="M 260 138 L 260 158" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: diamond -->
  <polygon points="260,160 360,192 260,224 160,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">对每个间隙 (a,b)：</text>
  <text x="260" y="204" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">hi ≤ mn+2d ？</text>

  <text x="150" y="188" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 160 192 L 92 192" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="176" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="196" text-anchor="middle" font-size="12" fill="#2d5523" filter="url(#rough2)">x 单独搞定</text>

  <text x="372" y="188" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 360 192 L 420 192" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right branch box -->
  <rect x="424" y="150" width="88" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="168" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">y 必须落入：</text>
  <text x="468" y="184" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">单段/lo 也高：</text>
  <text x="468" y="198" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">[hi−d, lo+d]</text>
  <text x="468" y="214" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">双段且 lo 较低：</text>
  <text x="468" y="228" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">[hi−d, max(lo+d, mn+2d)]</text>

  <path d="M 468 236 L 468 262 L 300 262" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 52 208 L 52 262 L 218 262" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: intersect -->
  <rect x="120" y="246" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 所有机会区间取交：L = max(hi−d)，R = min(U)</text>

  <path d="M 300 263 L 330 263" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" opacity="0"/>

  <path d="M 210 280 L 210 300" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: final diamond -->
  <polygon points="210,302 288,330 210,358 132,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="326" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">max(L,1) ≤ R ？</text>
  <text x="210" y="342" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">（y 取得到正整数）</text>

  <text x="300" y="326" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是 → 可行</text>
  <text x="300" y="344" font-size="12" fill="#b85450" filter="url(#rough2)">否 → d 太小</text>

  <!-- bottom note -->
  <rect x="60" y="374" width="400" height="34" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="395" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">外层二分 d ∈ [0, 2×10⁹]，首个可行的 d 即答案</text>
</svg>
