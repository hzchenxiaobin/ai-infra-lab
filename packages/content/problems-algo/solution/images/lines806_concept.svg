<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">写字铺行：每行最多 100 单位，放不下就换行</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">示例 2：S = "bbbcccdddaaa"，a 占 4，其余占 10</text>

  <!-- ===== 第 1 行 ===== -->
  <text x="30" y="80" font-size="11" fill="#446688" font-weight="bold">第 1 行</text>
  <rect x="40" y="86" width="500" height="34" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="86" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="108" text-anchor="middle" font-size="11" fill="#333">bbb · 30</text>
  <rect x="190" y="86" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="108" text-anchor="middle" font-size="11" fill="#333">ccc · 30</text>
  <rect x="340" y="86" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="108" text-anchor="middle" font-size="11" fill="#333">ddd · 30</text>
  <rect x="490" y="86" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="108" text-anchor="middle" font-size="11" fill="#333">aa · 8</text>
  <text x="556" y="108" font-size="9" fill="#b85450">余2</text>

  <line x1="540" y1="78" x2="540" y2="128" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="540" y="74" text-anchor="middle" font-size="9" fill="#888">100</text>
  <text x="290" y="136" text-anchor="middle" font-size="10" fill="#888">已用 30+30+30+8 = 98，剩余 2 单位</text>

  <!-- ===== 关键判定 ===== -->
  <rect x="40" y="152" width="500" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="172" font-size="11" fill="#b85450" font-weight="bold">关键判定：cur + w &gt; 100 ?</text>
  <text x="52" y="188" font-size="10" fill="#555">下一个字母 'a' 需 4 → 98 + 4 = 102 &gt; 100 → 放不下，换行，cur 重置为 w = 4</text>

  <!-- 换行箭头 -->
  <path d="M 540 128 Q 540 142 290 142 Q 60 142 60 230" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="#b85450">放不下 → 换行</text>

  <!-- ===== 第 2 行 ===== -->
  <text x="30" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 行</text>
  <rect x="40" y="254" width="500" height="34" fill="none" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="254" width="20" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a</text>
  <text x="84" y="276" font-size="10" fill="#888">4 单位（cur = w）</text>
  <line x1="540" y1="246" x2="540" y2="296" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== 结果 ===== -->
  <rect x="40" y="312" width="500" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="334" font-size="11" fill="#4a7a3a" font-weight="bold">返回 [lines, cur] = [2, 4]</text>
  <text x="52" y="352" font-size="10" fill="#555">共 2 行，最后一行用了 4 单位 ✓</text>
  <text x="52" y="370" font-size="10" fill="#888">逐字符扫描，维护「行数」与「当前行宽度」两个量即可，O(n) / O(1)</text>
</svg>
