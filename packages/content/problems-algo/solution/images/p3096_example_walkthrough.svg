<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三个官方用例走一遍</text>

  <!-- left panel: example 2 -->
  <rect x="20" y="40" width="250" height="330" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="145" y="64" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：[1,1,1,1,1]</text>
  <text x="145" y="84" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a = [+1,+1,+1,+1,+1]，T = +5</text>

  <!-- table header -->
  <rect x="32" y="92" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="110" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="60" y="92" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="86" y="110" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">P(i)</text>
  <rect x="112" y="92" width="62" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="143" y="110" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Bob</text>
  <rect x="174" y="92" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="219" y="110" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2·P &gt; T ?</text>

  <!-- row 1 -->
  <rect x="32" y="118" width="28" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="139" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="60" y="118" width="52" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="86" y="139" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+1</text>
  <rect x="112" y="118" width="62" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="143" y="139" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+4</text>
  <rect x="174" y="118" width="90" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="219" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2 &gt; 5 ✗</text>

  <!-- row 2 -->
  <rect x="32" y="150" width="28" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="171" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <rect x="60" y="150" width="52" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="86" y="171" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+2</text>
  <rect x="112" y="150" width="62" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="143" y="171" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+3</text>
  <rect x="174" y="150" width="90" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="219" y="171" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">4 &gt; 5 ✗</text>

  <!-- row 3 (answer) -->
  <rect x="32" y="182" width="28" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="203" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="60" y="182" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="86" y="203" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+3</text>
  <rect x="112" y="182" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="143" y="203" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="174" y="182" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="219" y="203" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6 &gt; 5 ✓</text>

  <!-- row 4 -->
  <rect x="32" y="214" width="28" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="235" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <rect x="60" y="214" width="52" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="86" y="235" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+4</text>
  <rect x="112" y="214" width="62" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="143" y="235" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">+1</text>
  <rect x="174" y="214" width="90" height="32" fill="#ffffff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="219" y="235" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">8 &gt; 5 ✓</text>

  <text x="145" y="272" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">首个 ✓ 在 i = 3；i = 4 也满足但非最早</text>
  <text x="145" y="298" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 答案 = 3</text>
  <text x="145" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">按 i 从小到大扫描，</text>
  <text x="145" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首次命中即最小值，可立即返回</text>

  <!-- right panel -->
  <rect x="288" y="40" width="212" height="330" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- example 1 -->
  <rect x="300" y="56" width="188" height="132" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="394" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：[1,0,1,0]</text>
  <text x="394" y="97" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a = [+1,−1,+1,−1]，T = 0</text>
  <text x="394" y="119" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i=1：P=+1，Bob=−1</text>
  <text x="394" y="139" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2·(+1) = 2 &gt; 0 ✓</text>
  <text x="394" y="166" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = 1</text>

  <!-- example 3 -->
  <rect x="300" y="204" width="188" height="152" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="394" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：[0,0]</text>
  <text x="394" y="245" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a = [−1,−1]，T = −2</text>
  <text x="394" y="267" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i=1：P=−1，Bob=−1</text>
  <text x="394" y="287" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2 &gt; −2 不成立 ✗（平局）</text>
  <text x="394" y="307" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">且 Bob 必须剩 1 关，无别的切点</text>
  <text x="394" y="338" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = −1</text>
</svg>
