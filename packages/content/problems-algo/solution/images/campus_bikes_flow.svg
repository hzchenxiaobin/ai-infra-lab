<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 贪心分配</text>

  <!-- Step 1: Compute distances -->
  <text x="40" y="56" font-size="11.5" fill="#888">① 计算所有 n×m 个对的曼哈顿距离</text>
  <rect x="50" y="64" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">for i in 0..n-1, j in 0..m-1:</text>
  <text x="270" y="100" text-anchor="middle" font-size="11" fill="#555">d = |Wi.x - Bj.x| + |Wi.y - Bj.y| → 存入三元组 (d, i, j)</text>

  <path d="M 270 110 L 270 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Sort -->
  <text x="40" y="146" font-size="11.5" fill="#888">② 按 (距离, 工人编号, 自行车编号) 字典序排序</text>
  <rect x="50" y="154" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">sort(pairs)  // tuple 字典序 = 题目 tie-break 规则</text>
  <text x="270" y="190" text-anchor="middle" font-size="10.5" fill="#555">距离小 → 工人编号小 → 自行车编号小，三层优先</text>

  <path d="M 270 200 L 270 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Greedy assign -->
  <text x="40" y="236" font-size="11.5" fill="#888">③ 顺序遍历，贪心分配可用对</text>
  <rect x="50" y="244" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">for (d, wi, bi) in pairs:</text>
  <text x="270" y="280" text-anchor="middle" font-size="10.5" fill="#555">if ans[wi] == -1 且 bikeUsed[bi] == false:</text>
  <text x="270" y="294" text-anchor="middle" font-size="10.5" fill="#555">  ans[wi] = bi; bikeUsed[bi] = true; assigned++</text>

  <path d="M 270 302 L 270 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="318" font-size="10" fill="#888">assigned == n 时提前终止</text>

  <!-- Step 4: Output -->
  <rect x="50" y="326" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return ans</text>
  <text x="270" y="362" text-anchor="middle" font-size="10.5" fill="#555">ans[i] = 工人 i 分配到的自行车编号</text>

  <!-- Key insight -->
  <rect x="40" y="386" width="460" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="403" text-anchor="middle" font-size="10.5" fill="#888">💡 排序后顺序遍历 + 跳过已占用 = 每轮在剩余中选最优，与题目规则等价</text>
</svg>
