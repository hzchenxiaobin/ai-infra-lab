<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建邻接表 → 逐节点贪心选色</text>

  <!-- ===== Step 1: Build adjacency list ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="50" width="190" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="135" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 建邻接表 adj</text>
    <text x="135" y="90" text-anchor="middle" font-size="10" fill="#666">paths → 无向边加两次</text>
    <text x="135" y="105" text-anchor="middle" font-size="10" fill="#666">adj[x].push(y), adj[y].push(x)</text>
  </g>

  <line x1="230" y1="82" x2="270" y2="82" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Init answer -->
  <g filter="url(#rough2)">
    <rect x="275" y="50" width="190" height="64" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="8"/>
    <text x="370" y="72" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">② 初始化 ans = [0]</text>
    <text x="370" y="90" text-anchor="middle" font-size="10" fill="#666">0 表示未着色</text>
    <text x="370" y="105" text-anchor="middle" font-size="10" fill="#666">下标 1..n 对应花园编号</text>
  </g>

  <line x1="370" y1="114" x2="370" y2="150" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Loop over nodes ===== -->
  <g filter="url(#rough2)">
    <rect x="150" y="155" width="260" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="280" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">③ for u = 1 to n：处理花园 u</text>
    <text x="280" y="195" text-anchor="middle" font-size="10" fill="#888">按编号顺序逐个着色</text>
  </g>

  <line x1="280" y1="203" x2="280" y2="235" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3a: mark used ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="240" width="220" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="150" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3a. 标记邻居已用色</text>
    <text x="150" y="280" text-anchor="middle" font-size="10" fill="#666">used[5] = false</text>
    <text x="150" y="295" text-anchor="middle" font-size="10" fill="#666">遍历 adj[u]，对已着色 v：</text>
    <text x="150" y="310" text-anchor="middle" font-size="10" fill="#666">used[ans[v]] = true</text>
  </g>

  <line x1="260" y1="278" x2="300" y2="278" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3b: pick color ===== -->
  <g filter="url(#rough2)">
    <rect x="305" y="240" width="220" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="415" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3b. 选第一个可用色</text>
    <text x="415" y="280" text-anchor="middle" font-size="10" fill="#666">for c = 1 to 4：</text>
    <text x="415" y="295" text-anchor="middle" font-size="10" fill="#666">  if !used[c]:</text>
    <text x="415" y="310" text-anchor="middle" font-size="10" fill="#666">    ans[u] = c; break</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 415 318 Q 415 345 280 345 Q 150 345 150 318" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">处理完所有节点后退出循环</text>

  <!-- ===== Step 4: return ===== -->
  <line x1="280" y1="370" x2="280" y2="385" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="150" y="388" width="260" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="406" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">④ 返回 ans[1:]（去掉下标 0）</text>
  </g>

  <text x="280" y="425" text-anchor="middle" font-size="0" fill="#999"/>
</svg>
