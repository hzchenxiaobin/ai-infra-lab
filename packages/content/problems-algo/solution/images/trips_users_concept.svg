<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双 JOIN：Trips 分别按 client_id / driver_id 关联 Users 两份副本</text>

  <!-- Trips table (left) -->
  <text x="125" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Trips</text>
  <rect x="30" y="58" width="190" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="73" font-size="9" fill="#333">id</text>
  <text x="86" y="73" font-size="9" fill="#333">client</text>
  <text x="130" y="73" font-size="9" fill="#333">driver</text>
  <text x="175" y="73" font-size="9" fill="#333">status</text>
  <line x1="65" y1="58" x2="65" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="58" x2="110" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="58" x2="155" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Trip 1: id=1, cli=1, drv=10, completed -->
  <rect x="30" y="82" width="190" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="97" font-size="9" fill="#333">1</text>
  <text x="86" y="97" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="130" y="97" font-size="9" fill="#446688" font-weight="bold">10</text>
  <text x="175" y="97" font-size="8" fill="#333">completed</text>
  <line x1="65" y1="82" x2="65" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="82" x2="110" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="82" x2="155" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Trip 2: id=2, cli=2, drv=11, cancelled (client banned!) -->
  <rect x="30" y="104" width="190" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="119" font-size="9" fill="#333">2</text>
  <text x="86" y="119" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="130" y="119" font-size="9" fill="#446688" font-weight="bold">11</text>
  <text x="175" y="119" font-size="7" fill="#b85450">cancelled</text>
  <line x1="65" y1="104" x2="65" y2="126" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="104" x2="110" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="104" x2="155" y2="126" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Trip 4: id=4, cli=4, drv=13, cancelled -->
  <rect x="30" y="126" width="190" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="141" font-size="9" fill="#333">4</text>
  <text x="86" y="141" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="130" y="141" font-size="9" fill="#446688" font-weight="bold">13</text>
  <text x="175" y="141" font-size="7" fill="#d6a040">cancelled</text>
  <line x1="65" y1="126" x2="65" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="126" x2="110" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="126" x2="155" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Users (uc) - client copy -->
  <text x="370" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Users AS uc（客户端）</text>
  <rect x="310" y="58" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="73" font-size="9" fill="#333">users_id</text>
  <text x="390" y="73" font-size="9" fill="#333">banned</text>
  <line x1="365" y1="58" x2="365" y2="82" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="82" width="110" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="96" font-size="9" fill="#333">1</text>
  <text x="390" y="96" font-size="9" fill="#4a7a3a">No</text>
  <line x1="365" y1="82" x2="365" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="102" width="110" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="116" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="390" y="116" font-size="9" fill="#b85450" font-weight="bold">Yes!</text>
  <line x1="365" y1="102" x2="365" y2="122" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="122" width="110" height="20" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="335" y="136" font-size="9" fill="#333">4</text>
  <text x="390" y="136" font-size="9" fill="#4a7a3a">No</text>
  <line x1="365" y1="122" x2="365" y2="142" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- JOIN arrow: client_id → uc.users_id -->
  <path d="M95 93 C200 70, 260 70, 310 90" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="64" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">client_id = uc.users_id</text>

  <!-- JOIN arrow: driver_id → ud.users_id (curving down) -->
  <path d="M140 115 C220 170, 280 195, 310 195" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="225" y="185" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">driver_id = ud.users_id</text>

  <!-- Users (ud) - driver copy -->
  <text x="490" y="160" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Users AS ud（司机端）</text>
  <rect x="440" y="166" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="181" font-size="9" fill="#333">users_id</text>
  <text x="520" y="181" font-size="9" fill="#333">banned</text>
  <line x1="495" y1="166" x2="495" y2="190" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="440" y="190" width="110" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="204" font-size="9" fill="#333">10</text>
  <text x="520" y="204" font-size="9" fill="#446688">No</text>
  <line x1="495" y1="190" x2="495" y2="210" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="440" y="210" width="110" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="224" font-size="9" fill="#333">11</text>
  <text x="520" y="224" font-size="9" fill="#446688">No</text>
  <line x1="495" y1="210" x2="495" y2="230" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="440" y="230" width="110" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="244" font-size="9" fill="#333">13</text>
  <text x="520" y="244" font-size="9" fill="#446688">No</text>
  <line x1="495" y1="230" x2="495" y2="250" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Filter result -->
  <text x="125" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">trip 2: client=2 → uc.banned=Yes</text>
  <path d="M125 182 L125 205" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="45" y="210" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="228" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">WHERE 过滤：排除该行程</text>

  <!-- Bottom insight box -->
  <rect x="30" y="265" width="520" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="288" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">核心观察：Users 要 JOIN 两次——一次查 client，一次查 driver</text>

  <text x="50" y="310" font-size="10" fill="#333">① Trips JOIN Users AS uc ON client_id = uc.users_id  ← 查客户端是否被封</text>
  <text x="50" y="328" font-size="10" fill="#333">② Trips JOIN Users AS ud ON driver_id = ud.users_id  ← 查司机端是否被封</text>
  <text x="50" y="346" font-size="10" fill="#b85450" font-weight="bold">③ WHERE uc.banned = 'No' AND ud.banned = 'No'  ← 两端都未封才保留</text>
  <text x="50" y="368" font-size="10" fill="#d6a040">⚠ 同一张 Users 表 JOIN 两次需起不同别名（uc / ud），否则列名歧义</text>
  <text x="50" y="386" font-size="10" fill="#4a7a3a">💡 若只查 client 未封会漏判 driver 被封的行程——两端都要检查</text>
</svg>
