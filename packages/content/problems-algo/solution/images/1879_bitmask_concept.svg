<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态编码：固定 nums1，用 mask 标记 nums2 已分配的元素</text>

  <!-- nums1 row (positions) -->
  <text x="36" y="74" font-size="12" fill="#888">位置 i:</text>
  <text x="56" y="98" font-size="11" fill="#888">nums1:</text>
  <rect x="100" y="60" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="130" y="52" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <rect x="180" y="60" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="82" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="210" y="52" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <rect x="260" y="60" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="290" y="52" text-anchor="middle" font-size="10" fill="#888">i=2</text>

  <text x="345" y="82" font-size="11" fill="#888">（固定不动）</text>

  <!-- nums2 row (elements to assign) -->
  <text x="56" y="148" font-size="11" fill="#888">nums2:</text>
  <rect x="100" y="120" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="142" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="130" y="166" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <rect x="180" y="120" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="142" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="210" y="166" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <rect x="260" y="120" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="142" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="290" y="166" text-anchor="middle" font-size="10" fill="#888">j=2</text>

  <text x="345" y="142" font-size="11" fill="#888">（待分配到各位置）</text>

  <!-- mask encoding -->
  <text x="56" y="208" font-size="12" fill="#888">mask:</text>
  <text x="100" y="208" font-size="11" fill="#888">bit j = 1 表示 nums2[j] 已被分配</text>

  <!-- example mask = 101 (nums2[0] and nums2[2] used) -->
  <text x="56" y="240" font-size="11" fill="#888">示例:</text>
  <rect x="100" y="224" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="224" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="246" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="260" y="224" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- legend -->
  <rect x="380" y="224" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a">= 已用</text>
  <rect x="450" y="224" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="246" text-anchor="middle" font-size="11" fill="#b85450">= 未用</text>

  <!-- reading -->
  <rect x="40" y="275" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="12" fill="#444">mask = 101₂ = 5 → nums2[0]、nums2[2] 已分配，下一个待填位置 i = 2</text>

  <!-- popcount -> position -->
  <rect x="40" y="325" width="230" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">已分配个数 = popcount(mask)</text>
  <text x="155" y="362" text-anchor="middle" font-size="11" fill="#555">例：101 有 2 个 1</text>

  <path d="M 272 347 L 290 347" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="292" y="325" width="228" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="406" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">下一位置 i = popcount(mask)</text>
  <text x="406" y="362" text-anchor="middle" font-size="11" fill="#b85450">将某未用 nums2[j] 配到 nums1[i]</text>
</svg>
