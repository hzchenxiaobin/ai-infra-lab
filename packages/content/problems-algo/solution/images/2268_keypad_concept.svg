  <text x="415" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9 + 9 + 8 = 26 字母 ✓</text>

  <rect x="300" y="286" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="311" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">贪心：高频字母塞进档 1</text>

