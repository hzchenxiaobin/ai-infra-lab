  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：9 键键盘，每键最多 3 字母 → 三档成本 1 / 2 / 3</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">槽位 9 + 9 + 8 = 26，恰好容下全部 26 个字母</text>

  <!-- ===== Left: 3x3 keypad ===== -->
  <text x="135" y="72" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">3×3 键盘（每键含 3 个字母位）</text>

