  <text x="415" y="72" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">三档槽位清单（共 26 个）</text>

  <rect x="300" y="86" width="230" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="112" text-anchor="middle" font-size="11.5" fill="#2f5a22" font-weight="bold">档 1：按 1 次 → 9 个槽位</text>

  <rect x="300" y="136" width="230" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="162" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">档 2：按 2 次 → 9 个槽位</text>

  <rect x="300" y="186" width="230" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="212" text-anchor="middle" font-size="11.5" fill="#7a2e2a" font-weight="bold">档 3：按 3 次 → 8 个槽位</text>

