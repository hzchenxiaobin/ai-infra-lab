<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">累计薪水：SUM OVER (PARTITION BY id ORDER BY month) + 剔除最大月份</text>

  <!-- Employee source table (left) -->
  <text x="95" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Employee（源表）</text>
  <rect x="20" y="64" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="83" font-size="9.5" fill="#333">id</text>
  <text x="92" y="83" font-size="9.5" fill="#333">month</text>
  <text x="150" y="83" font-size="9.5" fill="#333">salary</text>
  <line x1="68" y1="64" x2="68" y2="94" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="64" x2="120" y2="94" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- id=1 rows (red/pink) -->
  <rect x="20" y="94" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="109" font-size="10" fill="#333">1</text>
  <text x="94" y="109" font-size="10" fill="#333">1</text>
  <text x="152" y="109" font-size="10" fill="#b85450" font-weight="bold">20</text>
  <line x1="68" y1="94" x2="68" y2="116" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="94" x2="120" y2="116" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="116" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="131" font-size="10" fill="#333">1</text>
  <text x="94" y="131" font-size="10" fill="#333">2</text>
  <text x="152" y="131" font-size="10" fill="#b85450" font-weight="bold">30</text>
  <line x1="68" y1="116" x2="68" y2="138" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="116" x2="120" y2="138" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="138" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="153" font-size="10" fill="#333">1</text>
  <text x="94" y="153" font-size="10" fill="#333">3</text>
  <text x="152" y="153" font-size="10" fill="#b85450" font-weight="bold">40</text>
  <line x1="68" y1="138" x2="68" y2="160" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="138" x2="120" y2="160" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="160" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="175" font-size="10" fill="#333">1</text>
  <text x="94" y="175" font-size="10" fill="#333">4</text>
  <text x="152" y="175" font-size="10" fill="#b85450" font-weight="bold">60</text>
  <line x1="68" y1="160" x2="68" y2="182" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="160" x2="120" y2="182" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- max month row - to be excluded (strikethrough) -->
  <rect x="20" y="182" width="160" height="22" fill="#eeeeee" stroke="#888" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="44" y="197" font-size="10" fill="#888">1</text>
  <text x="94" y="197" font-size="10" fill="#888">5</text>
  <text x="152" y="197" font-size="10" fill="#888" font-weight="bold">50</text>
  <line x1="68" y1="182" x2="68" y2="204" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="182" x2="120" y2="204" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="24" y1="193" x2="176" y2="193" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="197" font-size="9" fill="#b85450" font-weight="bold">MAX(month)</text>
  <text x="200" y="209" font-size="9" fill="#b85450" font-weight="bold">→ 剔除</text>

  <!-- id=3 rows (orange) -->
  <rect x="20" y="214" width="160" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="229" font-size="10" fill="#333">3</text>
  <text x="94" y="229" font-size="10" fill="#333">2</text>
  <text x="152" y="229" font-size="10" fill="#d6a040" font-weight="bold">40</text>
  <line x1="68" y1="214" x2="68" y2="236" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="214" x2="120" y2="236" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="236" width="160" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="251" font-size="10" fill="#333">3</text>
  <text x="94" y="251" font-size="10" fill="#333">3</text>
  <text x="152" y="251" font-size="10" fill="#d6a040" font-weight="bold">60</text>
  <line x1="68" y1="236" x2="68" y2="258" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="236" x2="120" y2="258" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- max month row for id=3 - excluded -->
  <rect x="20" y="258" width="160" height="22" fill="#eeeeee" stroke="#888" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="44" y="273" font-size="10" fill="#888">3</text>
  <text x="94" y="273" font-size="10" fill="#888">4</text>
  <text x="152" y="273" font-size="10" fill="#888" font-weight="bold">70</text>
  <line x1="68" y1="258" x2="68" y2="280" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="258" x2="120" y2="280" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="24" y1="269" x2="176" y2="269" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="273" font-size="9" fill="#b85450" font-weight="bold">MAX(month)</text>
  <text x="200" y="285" font-size="9" fill="#b85450" font-weight="bold">→ 剔除</text>

  <!-- partition brackets -->
  <path d="M185 105 L198 105 L198 193 L185 193" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="210" y="140" font-size="9.5" fill="#b85450" font-weight="bold">PARTITION</text>
  <text x="210" y="153" font-size="9.5" fill="#b85450" font-weight="bold">BY id=1</text>

  <path d="M185 225 L198 225 L198 269 L185 269" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="210" y="240" font-size="9.5" fill="#d6a040" font-weight="bold">PARTITION</text>
  <text x="210" y="253" font-size="9.5" fill="#d6a040" font-weight="bold">BY id=3</text>

  <!-- ORDER BY arrow -->
  <path d="M265 105 L265 193" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="278" y="130" font-size="9" fill="#446688">ORDER BY</text>
  <text x="278" y="143" font-size="9" fill="#446688">month ASC</text>
  <text x="278" y="156" font-size="9" fill="#446688">↑升序</text>

  <!-- frame indicator -->
  <rect x="240" y="94" width="80" height="120" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="9" fill="#b85450">帧：</text>
  <text x="280" y="244" text-anchor="middle" font-size="9" fill="#b85450">首行→当前</text>

  <!-- arrows to result -->
  <path d="M325 149 L455 149" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M325 247 L455 247" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="390" y="143" text-anchor="middle" font-size="9" fill="#4a7a3a">SUM 累加</text>

  <!-- Result table (right) -->
  <text x="545" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">结果（剔除最大月份后）</text>
  <rect x="455" y="64" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="83" font-size="9" fill="#333">Id</text>
  <text x="525" y="83" font-size="9" fill="#333">Month</text>
  <text x="592" y="83" font-size="9" fill="#333">Salary</text>
  <line x1="495" y1="64" x2="495" y2="94" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="570" y1="64" x2="570" y2="94" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="455" y="94" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="109" font-size="10" fill="#333">1</text>
  <text x="527" y="109" font-size="10" fill="#333">4</text>
  <text x="600" y="109" font-size="10" fill="#b85450" font-weight="bold">150</text>
  <line x1="495" y1="94" x2="495" y2="116" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="570" y1="94" x2="570" y2="116" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="455" y="116" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="131" font-size="10" fill="#333">1</text>
  <text x="527" y="131" font-size="10" fill="#333">3</text>
  <text x="600" y="131" font-size="10" fill="#b85450" font-weight="bold">90</text>
  <line x1="495" y1="116" x2="495" y2="138" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="570" y1="116" x2="570" y2="138" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="455" y="138" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="153" font-size="10" fill="#333">1</text>
  <text x="527" y="153" font-size="10" fill="#333">2</text>
  <text x="600" y="153" font-size="10" fill="#b85450" font-weight="bold">50</text>
  <line x1="495" y1="138" x2="495" y2="160" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="570" y1="138" x2="570" y2="160" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="455" y="160" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="175" font-size="10" fill="#333">1</text>
  <text x="527" y="175" font-size="10" fill="#333">1</text>
  <text x="600" y="175" font-size="10" fill="#b85450" font-weight="bold">20</text>
  <line x1="495" y1="160" x2="495" y2="182" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="570" y1="160" x2="570" y2="182" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="455" y="214" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="229" font-size="10" fill="#333">3</text>
  <text x="527" y="229" font-size="10" fill="#333">3</text>
  <text x="600" y="229" font-size="10" fill="#d6a040" font-weight="bold">100</text>
  <line x1="495" y1="214" x2="495" y2="236" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="570" y1="214" x2="570" y2="236" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="455" y="236" width="170" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="251" font-size="10" fill="#333">3</text>
  <text x="527" y="251" font-size="10" fill="#333">2</text>
  <text x="600" y="251" font-size="10" fill="#d6a040" font-weight="bold">40</text>
  <line x1="495" y1="236" x2="495" y2="258" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="570" y1="236" x2="570" y2="258" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- cumsum annotation -->
  <text x="540" y="285" text-anchor="middle" font-size="9.5" fill="#b85450">20→50→90→150</text>
  <text x="540" y="298" text-anchor="middle" font-size="9" fill="#888">(剔除 month=5)</text>

  <!-- key takeaway box -->
  <rect x="30" y="320" width="580" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="344" font-size="11.5" fill="#333" font-weight="bold">核心：窗口累计 + 剔除每组最大月份</text>
  <text x="50" y="364" font-size="10.5" fill="#555">• SUM(salary) OVER (PARTITION BY id ORDER BY month) → 每员工从首月累加到当前月</text>
  <text x="50" y="382" font-size="10.5" fill="#555">• WHERE (id, month) NOT IN (SELECT id, MAX(month) ...) → 剔除每人最新月（尚未结算）</text>
  <text x="50" y="400" font-size="10.5" fill="#555">• ORDER BY id ASC, month DESC → 结果按 id 升序、月份降序输出</text>
</svg>
