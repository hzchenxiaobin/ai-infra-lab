<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- ===== Example 1 ===== -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">示例 1：nums = [2,2,3,1,1,0], k = 3 → true ✓</text>

  <!-- table border -->
  <rect x="50" y="42" width="460" height="172" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="50" y="42" width="460" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="100" y1="42" x2="100" y2="214" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="42" x2="170" y2="214" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="42" x2="240" y2="214" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="310" y1="42" x2="310" y2="214" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="75" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="135" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="205" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">curr</text>
  <text x="275" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">need</text>
  <text x="410" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">动作</text>

  <!-- row 0 -->
  <text x="75" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="135" y="82" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="205" y="82" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="275" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="410" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a">启动 2 个, diff[3] −= 2</text>

  <!-- row 1 -->
  <text x="75" y="106" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="135" y="106" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="205" y="106" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="275" y="106" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="410" y="106" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- row 2 -->
  <text x="75" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="135" y="130" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="205" y="130" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="275" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="410" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a">启动 1 个, diff[5] −= 1</text>

  <!-- row 3 -->
  <text x="75" y="154" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="135" y="154" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="205" y="154" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="275" y="154" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="410" y="154" text-anchor="middle" font-size="10" fill="#888">— (diff[3] 生效, curr 2→1)</text>

  <!-- row 4 -->
  <text x="75" y="178" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="135" y="178" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="205" y="178" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="275" y="178" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="410" y="178" text-anchor="middle" font-size="10" fill="#888">—</text>

  <!-- row 5 -->
  <text x="75" y="202" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="135" y="202" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="205" y="202" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="275" y="202" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="410" y="202" text-anchor="middle" font-size="10" fill="#888">— (diff[5] 生效, curr 1→0)</text>

  <!-- result 1 -->
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全部 need ≥ 0, curr 最终归 0 → return true ✓</text>

  <!-- ===== Example 2 ===== -->
  <text x="280" y="256" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">示例 2：nums = [1,3,1,1], k = 2 → false ✗</text>

  <!-- table border -->
  <rect x="50" y="270" width="460" height="100" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="50" y="270" width="460" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="100" y1="270" x2="100" y2="370" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="270" x2="170" y2="370" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="270" x2="240" y2="370" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="310" y1="270" x2="310" y2="370" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="75" y="286" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="135" y="286" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="205" y="286" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">curr</text>
  <text x="275" y="286" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">need</text>
  <text x="410" y="286" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">动作</text>

  <!-- row 0 -->
  <text x="75" y="310" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="135" y="310" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="205" y="310" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="275" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <text x="410" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a">启动 1 个, diff[2] −= 1</text>

  <!-- row 1 -->
  <text x="75" y="334" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="135" y="334" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="205" y="334" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="275" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <text x="410" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a">启动 2 个, diff[3] −= 2</text>

  <!-- row 2: failure! -->
  <rect x="50" y="346" width="460" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="135" y="362" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="205" y="362" text-anchor="middle" font-size="11" fill="#b85450">2</text>
  <text x="275" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="410" y="362" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">❌ need &lt; 0, return false</text>

  <!-- result 2 -->
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=2: need = nums[2] − curr = 1 − 2 = −1 &lt; 0 → return false ✗</text>
</svg>
