<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：最大堆模拟</text>

  <!-- Step 1: 建堆 -->
  <rect x="60" y="44" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="64" font-size="11" fill="#446688" font-weight="bold">①</text>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333">建最大堆：所有石头入堆</text>
  <text x="290" y="80" text-anchor="middle" font-size="10.5" fill="#888">C++ priority_queue（默认最大堆）/ Python heapq 取负</text>

  <path d="M 290 90 L 290 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 循环判断 -->
  <rect x="60" y="110" width="460" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="130" font-size="11" fill="#4a7a3a" font-weight="bold">②</text>
  <text x="290" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">while 堆大小 ≥ 2：</text>

  <path d="M 290 152 L 290 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: 取两块 -->
  <rect x="40" y="172" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="192" font-size="11" fill="#d6a040" font-weight="bold">③</text>
  <text x="290" y="192" text-anchor="middle" font-size="12" fill="#333">y = pop()（最重），x = pop()（次重）</text>
  <text x="290" y="208" text-anchor="middle" font-size="10.5" fill="#888">两次弹堆顶，保证 y ≥ x</text>

  <path d="M 290 218 L 290 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 判断相撞 -->
  <rect x="40" y="238" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="258" font-size="11" fill="#d6a040" font-weight="bold">④</text>
  <text x="290" y="258" text-anchor="middle" font-size="12" fill="#333">if y &gt; x：</text>
  <text x="290" y="276" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">push(y − x)  ← 差值重新入堆</text>
  <text x="290" y="292" text-anchor="middle" font-size="10.5" fill="#888">y == x → 两块都消失，什么都不 push</text>

  <!-- 回到循环的箭头 -->
  <path d="M 540 270 Q 570 270 570 150 Q 570 130 520 130" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="560" y="200" font-size="9.5" fill="#888" text-anchor="middle">回 ②</text>

  <path d="M 290 304 L 290 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="316" font-size="9.5" fill="#888">堆 &lt; 2</text>

  <!-- Step 5: 返回 -->
  <rect x="60" y="324" width="460" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="80" y="344" font-size="11" fill="#b85450" font-weight="bold">⑤</text>
  <text x="290" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回堆顶（若堆空则返回 0）</text>
  <text x="290" y="362" text-anchor="middle" font-size="10.5" fill="#888">堆空 ⇔ 所有石头两两同归于尽</text>

  <!-- 复杂度备注 -->
  <rect x="60" y="384" width="460" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="404" text-anchor="middle" font-size="11" fill="#555">每轮：2 次 pop + 至多 1 次 push = O(log n)</text>
  <text x="290" y="420" text-anchor="middle" font-size="10.5" fill="#888">共 n−1 轮 → 总时间 O(n log n)</text>
</svg>
