<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    装饰器模式：PeekingIterator 包裹底层迭代器，多缓存一个元素实现 peek
  </text>

  <!-- ===== 底层迭代器 ===== -->
  <text x="44" y="74" font-size="12" fill="#446688" filter="url(#rough2)">底层迭代器</text>
  <rect x="120" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="78" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">1</text>
  <rect x="166" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="212" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="120" y="50" font-size="10" fill="#888" filter="url(#rough2)">↑ 已被预读（构造时 next() 取走 1）</text>

  <!-- 构造时预读箭头：底层 iter -> buffer -->
  <path d="M142,92 L142,120" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="110" font-size="10" fill="#d6a040" filter="url(#rough2)">构造时预读</text>

  <!-- ===== 缓存 buffer ===== -->
  <rect x="100" y="124" width="84" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="142" y="142" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">缓存 cache</text>
  <text x="142" y="158" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- ===== PeekingIterator 外壳（装饰器） ===== -->
  <rect x="80" y="44" width="200" height="132" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" rx="12" filter="url(#rough2)"/>
  <text x="180" y="38" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">PeekingIterator（装饰器外壳）</text>

  <!-- ===== 三个操作说明（右侧） ===== -->
  <!-- peek() -->
  <rect x="310" y="58" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="79" font-size="11" fill="#333" filter="url(#rough2)">peek() → 返回 cache，不推进</text>
  <path d="M184,144 L260,144 L260,75 L310,75" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="266" y="112" font-size="10" fill="#4a7a3a" filter="url(#rough2)">读</text>

  <!-- next() -->
  <rect x="310" y="108" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="129" font-size="11" fill="#333" filter="url(#rough2)">next() → 返回 cache，再从底层补一个</text>
  <path d="M184,150 L250,150 L250,125 L310,125" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="256" y="148" font-size="10" fill="#446688" filter="url(#rough2)">读+补</text>

  <!-- hasNext() -->
  <rect x="310" y="158" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="179" font-size="11" fill="#333" filter="url(#rough2)">hasNext() → cache 是否有值</text>
  <path d="M184,156 L240,156 L240,175 L310,175" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 补充箭头：next() 时底层 iter -> buffer（回填） -->
  <path d="M234,92 Q300,108 300,144 L226,144" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="300" y="100" font-size="10" fill="#d6a040" filter="url(#rough2)">next 时回填</text>

  <!-- ===== 解释框 ===== -->
  <rect x="40" y="210" width="480" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">核心洞察：预读一个，解耦「读取」与「消费」</text>
  <text x="60" y="258" font-size="11" fill="#555" filter="url(#rough2)">• 底层迭代器的 next() 既返回值又推进指针 → 无法「看了不取」</text>
  <text x="60" y="280" font-size="11" fill="#555" filter="url(#rough2)">• 解法：构造时立即 next() 取一个存入 cache（eager 预读）</text>
  <text x="60" y="302" font-size="11" fill="#555" filter="url(#rough2)">• peek() 只读 cache → 不动底层指针；next() 读 cache 后再补一个</text>
  <text x="60" y="324" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">• 本质是「提前消费 + 延迟交付」：把推进做在前面，把返回拖到后面</text>
  <text x="60" y="346" font-size="10" fill="#888" filter="url(#rough2)">这是装饰器模式：在不修改原迭代器的前提下，用一层包裹增加 peek 能力</text>
</svg>
