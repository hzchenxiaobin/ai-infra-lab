<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：无限数组的子数组 = 环上一段 + k 份整抄</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 nums = [1,1,1,2,3]，target = 20 为例：S = 8，k = 2，r = 4</text>

  <!-- bracket over the k full copies -->
  <path d="M 214 138 L 214 124 L 554 124 L 554 138" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="114" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k = 2 份完整拷贝（和 = k×S = 16）</text>

  <!-- tail / head labels -->
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">尾段（和=3）</text>
  <path d="M 150 112 L 188 148" stroke="#d6a040" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <text x="577" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">头段（和=1）</text>
  <path d="M 577 112 L 577 148" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- copy 1: tail cell highlighted -->
  <rect x="40" y="150" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="74" y="150" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="89" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="108" y="150" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="123" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="142" y="150" width="30" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="157" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="176" y="150" width="30" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="191" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- copy 2 -->
  <rect x="214" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="248" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="263" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="282" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="297" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="316" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="331" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="350" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- copy 3 -->
  <rect x="388" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="403" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="422" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="437" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="456" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="471" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="490" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="505" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="524" y="150" width="30" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="539" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- head cell of copy 4 -->
  <rect x="562" y="150" width="30" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="577" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- copy labels -->
  <text x="123" y="210" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 1 份</text>
  <text x="297" y="210" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 2 份</text>
  <text x="471" y="210" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 3 份</text>
  <text x="577" y="210" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 4 份 …</text>

  <!-- bracket over the chosen subarray -->
  <path d="M 176 224 L 176 238 L 592 238 L 592 224" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="260" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">被选中的子数组：长度 = 1 + 5 + 5 + 1 = 12 = k×n + 2</text>

  <!-- formula box -->
  <rect x="70" y="272" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="294" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">总和 = 3 + 16 + 1 = 20 = k×S + r = 2×8 + 4</text>
  <text x="310" y="316" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">尾段 + 头段 环上首尾相接、和恰为 r → 答案 = k×n + 环上和为 r 的最短段</text>

  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">「环上一段」= 翻倍数组 nums+nums 中的普通窗口 → 滑动窗口 O(n) 求解</text>
</svg>
