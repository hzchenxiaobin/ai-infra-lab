<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两个判定问题定乾坤（全偶？min 是奇数？）</text>

  <!-- 开始 -->
  <rect x="190" y="32" width="140" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">一趟扫描 nums1</text>
  <text x="340" y="49" font-size="9.5" fill="#999" filter="url(#rough2)">同时求 mn = min 与 allEven</text>

  <path d="M 260 58 L 260 72" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="260,76 350,114 260,152 170,114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">全是偶数？</text>

  <path d="M 350 114 L 392 114" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="106" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="394" y="96" width="114" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="451" y="110" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return true</text>
  <text x="451" y="125" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">照抄即全偶</text>

  <path d="M 260 152 L 260 182" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="172" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 菱形 2 -->
  <polygon points="260,186 356,222 260,258 164,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">mn 是奇数？</text>

  <path d="M 356 222 L 392 222" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="214" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="394" y="198" width="114" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="451" y="212" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return true</text>
  <text x="451" y="226" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">奇位照抄</text>
  <text x="451" y="239" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">偶位减 mn（最小奇）</text>

  <path d="M 260 258 L 260 284" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="276" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="196" y="286" width="128" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- 底部注释 -->
  <text x="260" y="336" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">O(n) 时间 / O(1) 空间——mn 与 allEven 一趟扫描同时维护</text>
  <text x="260" y="351" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">快速核对：[1,4,7]→true · [2,3]→false · [4,6]→true</text>
</svg>
