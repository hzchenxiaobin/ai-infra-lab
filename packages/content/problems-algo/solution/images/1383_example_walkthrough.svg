<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：k=2, speed=[2,10,3,1,5,8], eff=[5,4,3,9,7,2]</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">降序排列：(9,1)(7,5)(5,2)(4,10)(3,3)(2,8) · 红色 = 本步踢出 · 橙色 = 最优步</text>

  <!-- Header row -->
  <rect x="20" y="54" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="45" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步</text>
  <text x="115" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">工程师(e,s)</text>
  <text x="235" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">堆内容</text>
  <text x="340" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">sum</text>
  <text x="410" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">perf=sum×e</text>
  <text x="490" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ans</text>

  <!-- Step 1 -->
  <rect x="20" y="82" width="500" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="115" y="104" text-anchor="middle" font-size="11" fill="#333">(9, 1)</text>
  <rect x="200" y="86" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="216" y="102" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="340" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="410" y="104" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="490" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>

  <!-- Step 2 -->
  <rect x="20" y="118" width="500" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="115" y="140" text-anchor="middle" font-size="11" fill="#333">(7, 5)</text>
  <rect x="200" y="122" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="216" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="236" y="122" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="252" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="340" y="140" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="410" y="140" text-anchor="middle" font-size="11" fill="#333">42</text>
  <text x="490" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">42</text>

  <!-- Step 3 -->
  <rect x="20" y="154" width="500" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="115" y="176" text-anchor="middle" font-size="11" fill="#333">(5, 2)</text>
  <rect x="186" y="158" width="32" height="22" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="174" text-anchor="middle" font-size="10" fill="#999" text-decoration="line-through">1</text>
  <text x="226" y="172" font-size="10" fill="#b85450">踢</text>
  <rect x="252" y="158" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="268" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="288" y="158" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="304" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="340" y="176" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="410" y="176" text-anchor="middle" font-size="11" fill="#999">35</text>
  <text x="490" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">42</text>

  <!-- Step 4 - HIGHLIGHTED -->
  <rect x="20" y="190" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="115" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(4, 10)</text>
  <rect x="238" y="194" width="32" height="22" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="254" y="210" text-anchor="middle" font-size="10" fill="#999" text-decoration="line-through">2</text>
  <text x="278" y="208" font-size="10" fill="#b85450">踢</text>
  <rect x="304" y="194" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="340" y="194" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="356" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="395" y="212" text-anchor="middle" font-size="11" fill="#333">15</text>
  <text x="460" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">60 ←</text>
  <text x="495" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">60</text>

  <!-- Step 5 -->
  <rect x="20" y="226" width="500" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="115" y="248" text-anchor="middle" font-size="11" fill="#333">(3, 3)</text>
  <rect x="238" y="230" width="32" height="22" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="254" y="246" text-anchor="middle" font-size="10" fill="#999" text-decoration="line-through">3</text>
  <text x="278" y="244" font-size="10" fill="#b85450">踢</text>
  <rect x="304" y="230" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="320" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="340" y="230" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="356" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="395" y="248" text-anchor="middle" font-size="11" fill="#333">15</text>
  <text x="460" y="248" text-anchor="middle" font-size="11" fill="#999">45</text>
  <text x="495" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">60</text>

  <!-- Step 6 -->
  <rect x="20" y="262" width="500" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="115" y="284" text-anchor="middle" font-size="11" fill="#333">(2, 8)</text>
  <rect x="238" y="266" width="32" height="22" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="254" y="282" text-anchor="middle" font-size="10" fill="#999" text-decoration="line-through">5</text>
  <text x="278" y="280" font-size="10" fill="#b85450">踢</text>
  <rect x="304" y="266" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="320" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="340" y="266" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="356" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="395" y="284" text-anchor="middle" font-size="11" fill="#333">18</text>
  <text x="460" y="284" text-anchor="middle" font-size="11" fill="#999">36</text>
  <text x="495" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">60</text>

  <!-- Result box -->
  <rect x="32" y="310" width="476" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="332" font-size="13" fill="#4a7a3a" font-weight="bold">最终结果：60（第 4 步取得最大值）</text>
  <text x="48" y="350" font-size="11" fill="#4a7a3a">效率 e=4 的甜区 + 堆中累积高速度 {5,10}，sum×e = 15×4 = 60 达到峰值</text>

  <!-- Insight box -->
  <rect x="32" y="372" width="476" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="394" font-size="11.5" fill="#b85450" font-weight="bold">💡 关键观察</text>
  <text x="48" y="412" font-size="11" fill="#b85450">后续 sum 虽更大（步6=18），但效率下界 e=2 太低，18×2=36 &lt; 60</text>
  <text x="48" y="426" font-size="11" fill="#b85450">「固定效率下界，最大化速度和」→ 在效率与速度和之间找到最佳平衡点</text>
</svg>
