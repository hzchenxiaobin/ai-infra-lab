<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：manager_id 是「父指针」——整张表就是一棵以 CEO 为根的树</text>

  <text x="52" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">level 0</text>
  <text x="52" y="84" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">根 · CEO</text>

  <text x="52" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">level 1</text>
  <text x="52" y="162" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">直接下属</text>

  <text x="52" y="226" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">level 2</text>

  <text x="52" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">level 3</text>

  <path d="M 100 104 L 470 104" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>
  <path d="M 100 182 L 470 182" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>
  <path d="M 100 260 L 470 260" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>

  <path d="M 285 92 L 192 134" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 285 92 L 378 134" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <path d="M 185 170 L 128 222" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 185 170 L 240 222" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 365 170 L 308 222" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 365 170 L 423 222" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <path d="M 240 250 L 240 296" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="252" y="56" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="285" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Alice</text>
  <text x="285" y="84" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">id 1 · 150k</text>

  <text x="352" y="58" text-anchor="start" font-size="9" fill="#b85450" filter="url(#rough2)">manager_id = NULL → 根</text>

  <rect x="152" y="134" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
