  <rect x="207" y="222" width="66" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Eve</text>
  <text x="240" y="250" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">id 5 · 100k</text>

  <rect x="275" y="222" width="66" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="308" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Frank</text>
  <text x="308" y="250" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">id 6 · 95k</text>

  <rect x="390" y="222" width="66" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="423" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Grace</text>
  <text x="423" y="250" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">id 7 · 98k</text>

  <rect x="207" y="300" width="66" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Helen</text>
  <text x="240" y="328" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">id 8 · 90k</text>

  <rect x="28" y="352" width="464" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">下属 = 除根外的全部节点 · hierarchy_level = 到根的边数 · salary_difference = salary − 150000</text>
  <text x="260" y="382" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">深度事先未知 → 用递归 CTE 从根逐层向下展开（SQL 版 BFS）</text>
</svg>
