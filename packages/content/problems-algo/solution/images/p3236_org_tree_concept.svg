  <text x="365" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Charlie</text>
  <text x="365" y="162" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">id 3 · 110k</text>

  <rect x="95" y="222" width="66" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="128" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">David</text>
