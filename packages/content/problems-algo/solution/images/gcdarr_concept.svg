<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">找出数组的最大公约数：辗转相除法核心</text>

  <!-- Panel A: a = q*b + r -->
  <rect x="24" y="44" width="512" height="156" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">观察①：a = q·b + r，公约数集合不变</text>

  <!-- bar 'a' split into b+b+r, using a=8, b=3 -->
  <text x="56" y="108" font-size="11" fill="#888">a = 8</text>
  <rect x="120" y="92" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b=3</text>
  <rect x="182" y="92" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b=3</text>
  <rect x="244" y="92" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r=2</text>
  <line x1="120" y1="124" x2="284" y2="124" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a">8 = 2 × 3 + 2</text>

  <!-- equivalence -->
  <text x="320" y="100" font-size="11" fill="#555">d | a 且 d | b</text>
  <text x="320" y="118" font-size="11" fill="#555">⟺ d | b 且 d | (a−q·b)</text>
  <text x="320" y="136" font-size="11" fill="#b85450" font-weight="bold">⟺ d | b 且 d | r</text>
  <text x="320" y="156" font-size="12" fill="#4a7a3a" font-weight="bold">∴ gcd(a, b) = gcd(b, r)</text>

  <!-- arrow from r block down to gcd -->
  <path d="M 264 124 q 30 14 56 14" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Panel B: reduction chain -->
  <rect x="24" y="212" width="512" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">观察②：余数严格递减，归约到 gcd(g, 0) = g</text>

  <!-- chain boxes -->
  <rect x="40" y="252" width="92" height="30" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="272" text-anchor="middle" font-size="11" fill="#333">gcd(8, 3)</text>
  <line x1="132" y1="267" x2="150" y2="267" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="252" width="92" height="30" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="272" text-anchor="middle" font-size="11" fill="#333">gcd(3, 2)</text>
  <line x1="244" y1="267" x2="262" y2="267" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="264" y="252" width="92" height="30" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="272" text-anchor="middle" font-size="11" fill="#333">gcd(2, 1)</text>
  <line x1="356" y1="267" x2="374" y2="267" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="376" y="252" width="92" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="422" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">gcd(1, 0)=1</text>

  <!-- remainder sequence note -->
  <text x="48" y="306" font-size="11" fill="#888">余数序列：</text>
  <text x="120" y="306" font-size="11" fill="#b85450" font-weight="bold">3 &gt; 2 &gt; 1 &gt; 0</text>
  <text x="232" y="306" font-size="11" fill="#555">严格递减，必在有限步终止</text>
  <text x="376" y="306" font-size="11" fill="#4a7a3a" font-weight="bold">最后一个非零余数即答案</text>

  <!-- Insight box -->
  <rect x="24" y="340" width="512" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="360" font-size="11" fill="#555">两步：</text>
  <text x="78" y="360" font-size="11" fill="#b85450" font-weight="bold">① 一次遍历求 min / max</text>
  <text x="252" y="360" font-size="11" fill="#555">（O(n)）</text>
  <text x="300" y="360" font-size="11" fill="#4a7a3a" font-weight="bold">② 辗转相除求 gcd</text>
  <text x="418" y="360" font-size="11" fill="#555">（O(log min)）</text>
</svg>
