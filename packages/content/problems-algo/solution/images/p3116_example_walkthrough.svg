<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：coins = [5,2]，k = 7 → 12</text>

  <!-- formula -->
  <rect x="90" y="36" width="380" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold" filter="url(#rough2)">count(x) = ⌊x/2⌋ + ⌊x/5⌋ − ⌊x/10⌋，其中 lcm(2,5) = 10</text>

  <!-- left table: count jump -->
  <text x="130" y="88" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">count 只在倍数处跳变</text>
  <g filter="url(#rough2)">
    <rect x="25" y="96" width="210" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="25" y="120" width="210" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <rect x="25" y="144" width="210" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <rect x="25" y="168" width="210" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="25" y="192" width="210" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <line x1="95" y1="96" x2="95" y2="216" stroke="#bbb" stroke-width="1"/>
    <line x1="165" y1="96" x2="165" y2="216" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="112" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold">x</text>
    <text x="130" y="112" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold">count(x)</text>
    <text x="200" y="112" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold">≥ 7 ?</text>
    <text x="60" y="136" text-anchor="middle" font-size="10.5" fill="#555">10</text>
    <text x="130" y="136" text-anchor="middle" font-size="10.5" fill="#555">6</text>
    <text x="200" y="136" text-anchor="middle" font-size="10.5" fill="#b85450">否</text>
    <text x="60" y="160" text-anchor="middle" font-size="10.5" fill="#555">11</text>
    <text x="130" y="160" text-anchor="middle" font-size="10.5" fill="#555">6</text>
    <text x="200" y="160" text-anchor="middle" font-size="10.5" fill="#b85450">否</text>
    <text x="60" y="184" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">12</text>
    <text x="130" y="184" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">7</text>
    <text x="200" y="184" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是 ✓</text>
    <text x="60" y="208" text-anchor="middle" font-size="10.5" fill="#555">13</text>
    <text x="130" y="208" text-anchor="middle" font-size="10.5" fill="#555">7</text>
    <text x="200" y="208" text-anchor="middle" font-size="10.5" fill="#888">是(非最小)</text>
  </g>

  <!-- right table: binary search trace -->
  <text x="400" y="88" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">二分轨迹（lo = 1，hi = 25k = 175）</text>
  <g filter="url(#rough2)" font-size="10">
    <rect x="252" y="96" width="292" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="278" y="111" text-anchor="middle" fill="#335" font-weight="bold">lo</text>
    <text x="322" y="111" text-anchor="middle" fill="#335" font-weight="bold">hi</text>
    <text x="366" y="111" text-anchor="middle" fill="#335" font-weight="bold">mid</text>
    <text x="410" y="111" text-anchor="middle" fill="#335" font-weight="bold">count</text>
    <text x="484" y="111" text-anchor="middle" fill="#335" font-weight="bold">动作</text>

    <rect x="252" y="118" width="292" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <text x="278" y="133" text-anchor="middle" fill="#555">1</text><text x="322" y="133" text-anchor="middle" fill="#555">175</text><text x="366" y="133" text-anchor="middle" fill="#555">88</text><text x="410" y="133" text-anchor="middle" fill="#555">53</text><text x="484" y="133" text-anchor="middle" fill="#4a7a3a">是→ans=88, hi=87</text>

    <rect x="252" y="140" width="292" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <text x="278" y="155" text-anchor="middle" fill="#555">1</text><text x="322" y="155" text-anchor="middle" fill="#555">87</text><text x="366" y="155" text-anchor="middle" fill="#555">44</text><text x="410" y="155" text-anchor="middle" fill="#555">26</text><text x="484" y="155" text-anchor="middle" fill="#4a7a3a">是→ans=44, hi=43</text>

    <rect x="252" y="162" width="292" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <text x="278" y="177" text-anchor="middle" fill="#555">1</text><text x="322" y="177" text-anchor="middle" fill="#555">43</text><text x="366" y="177" text-anchor="middle" fill="#555">22</text><text x="410" y="177" text-anchor="middle" fill="#555">13</text><text x="484" y="177" text-anchor="middle" fill="#4a7a3a">是→ans=22, hi=21</text>

    <rect x="252" y="184" width="292" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <text x="278" y="199" text-anchor="middle" fill="#555">1</text><text x="322" y="199" text-anchor="middle" fill="#555">21</text><text x="366" y="199" text-anchor="middle" fill="#b85450" font-weight="bold">11</text><text x="410" y="199" text-anchor="middle" fill="#b85450" font-weight="bold">6</text><text x="484" y="199" text-anchor="middle" fill="#b85450">否→lo=12</text>

    <rect x="252" y="206" width="292" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <text x="278" y="221" text-anchor="middle" fill="#555">12</text><text x="322" y="221" text-anchor="middle" fill="#555">21</text><text x="366" y="221" text-anchor="middle" fill="#555">16</text><text x="410" y="221" text-anchor="middle" fill="#555">10</text><text x="484" y="221" text-anchor="middle" fill="#4a7a3a">是→ans=16, hi=15</text>

    <rect x="252" y="228" width="292" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <text x="278" y="243" text-anchor="middle" fill="#555">12</text><text x="322" y="243" text-anchor="middle" fill="#555">15</text><text x="366" y="243" text-anchor="middle" fill="#555">13</text><text x="410" y="243" text-anchor="middle" fill="#555">7</text><text x="484" y="243" text-anchor="middle" fill="#4a7a3a">是→ans=13, hi=12</text>

    <rect x="252" y="250" width="292" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="278" y="265" text-anchor="middle" fill="#3a5a2a" font-weight="bold">12</text><text x="322" y="265" text-anchor="middle" fill="#3a5a2a" font-weight="bold">12</text><text x="366" y="265" text-anchor="middle" fill="#3a5a2a" font-weight="bold">12</text><text x="410" y="265" text-anchor="middle" fill="#3a5a2a" font-weight="bold">7</text><text x="484" y="265" text-anchor="middle" fill="#4a7a3a" font-weight="bold">是→ans=12, hi=11</text>
  </g>

  <!-- amount sequence strip -->
  <text x="280" y="302" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">金额序列（去重后）：12 恰好排在第 7 位</text>
  <g filter="url(#rough2)" font-size="11.5">
    <rect x="55"  y="312" width="48" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/><text x="79"  y="331" text-anchor="middle" fill="#555">2</text>
    <rect x="105" y="312" width="48" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/><text x="129" y="331" text-anchor="middle" fill="#555">4</text>
    <rect x="155" y="312" width="48" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/><text x="179" y="331" text-anchor="middle" fill="#555">5</text>
    <rect x="205" y="312" width="48" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/><text x="229" y="331" text-anchor="middle" fill="#555">6</text>
    <rect x="255" y="312" width="48" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/><text x="279" y="331" text-anchor="middle" fill="#555">8</text>
    <rect x="305" y="312" width="48" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/><text x="329" y="331" text-anchor="middle" fill="#555">10</text>
    <rect x="355" y="312" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/><text x="379" y="331" text-anchor="middle" fill="#b85450" font-weight="bold">12</text>
    <rect x="405" y="312" width="48" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/><text x="429" y="331" text-anchor="middle" fill="#555">14</text>
    <rect x="455" y="312" width="48" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/><text x="479" y="331" text-anchor="middle" fill="#555">15</text>
    <text x="379" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">第 7 小 ✓</text>
  </g>

  <!-- bottom note -->
  <rect x="50" y="372" width="460" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">7 轮二分后 lo &gt; hi，ans 收敛到 12；11→12 之间 count 从 6 跳到 7，</text>
  <text x="280" y="407" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">「最小可行 x」自然停在跳变点（12 = 6×2，某个硬币的倍数）上</text>
</svg>
