<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：固定组1的和 s₁，看它落在数轴哪段</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">S = sum₁ + sum₂ ；好分区 ⟺ k ≤ s₁ ≤ S−k</text>

  <!-- Number line axis -->
  <line x1="60" y1="150" x2="510" y2="150" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- Three regions on the line -->
  <!-- bad left: [0, k) -->
  <rect x="70" y="120" width="100" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <!-- good middle: [k, S-k] -->
  <rect x="170" y="120" width="230" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <!-- bad right: (S-k, S] -->
  <rect x="400" y="120" width="100" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <!-- Region labels -->
  <text x="120" y="148" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">坏</text>
  <text x="120" y="166" text-anchor="middle" font-size="10" fill="#b85450">sum₁ &lt; k</text>

  <text x="285" y="146" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">好分区</text>
  <text x="285" y="166" text-anchor="middle" font-size="10.5" fill="#3a5a2a">k ≤ s₁ ≤ S−k</text>

  <text x="450" y="148" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">坏</text>
  <text x="450" y="166" text-anchor="middle" font-size="10" fill="#b85450">sum₂ &lt; k</text>

  <!-- Tick marks and labels under line -->
  <line x1="70" y1="178" x2="70" y2="188" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="204" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">0</text>
  <text x="70" y="218" text-anchor="middle" font-size="9" fill="#999">组1空</text>

  <line x1="170" y1="178" x2="170" y2="188" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="204" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">k</text>

  <line x1="400" y1="178" x2="400" y2="188" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="204" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">S−k</text>

  <line x1="500" y1="178" x2="500" y2="188" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="204" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">S</text>
  <text x="500" y="218" text-anchor="middle" font-size="9" fill="#999">组1满</text>

  <!-- Symmetry arrow: swap group1 / group2 connects the two bad regions -->
  <path d="M 120 232 Q 285 262 450 232" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 244 Q 285 274 120 244" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">交换组1↔组2：两侧坏分区个数相等 = bad</text>

  <!-- prerequisite -->
  <rect x="120" y="284" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="220" y="302" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">前提：S ≥ 2k ⟹ 中段非空（不相交）</text>

  <!-- formula box -->
  <rect x="340" y="284" width="190" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="302" text-anchor="middle" font-size="11.5" fill="#224466" font-weight="bold">答案 = 2ⁿ − 2·bad</text>

  <!-- bottom insight -->
  <rect x="30" y="324" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="346" font-size="11.5" fill="#444">① 总数 = 2ⁿ（每个元素独立选组，组有序）。</text>
  <text x="48" y="362" font-size="11.5" fill="#444">② S≥2k 时两侧坏区不相交且对称 ⟹ 坏分区 = 2·bad，bad = 和&lt;k 的子集个数。</text>
</svg>
