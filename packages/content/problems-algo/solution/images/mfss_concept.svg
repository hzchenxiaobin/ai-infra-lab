<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">出现次数最多的子树元素和：后序求和，子树和 = val + 左和 + 右和</text>

  <!-- 树结构 root = [5,2,-5] -->
  <line x1="268" y1="86" x2="192" y2="128" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="292" y1="86" x2="368" y2="128" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 根 5 (sum=2，与左叶相同→高频) -->
  <circle cx="280" cy="72" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="300" y="62" font-size="10" fill="#4a7a3a" font-weight="bold">sum=2</text>

  <!-- 左叶 2 (sum=2) -->
  <circle cx="180" cy="142" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="146" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="200" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">sum=2</text>

  <!-- 右叶 -5 (sum=-5) -->
  <circle cx="380" cy="142" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="146" text-anchor="middle" font-size="11" fill="#333">−5</text>
  <text x="400" y="134" font-size="10" fill="#d6a040" font-weight="bold">sum=−5</text>

  <!-- 同子树和虚线圈：两处 sum=2 -->
  <ellipse cx="230" cy="110" rx="92" ry="58" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="230" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a">两处子树和 = 2 → 频次 2</text>

  <!-- 公式框 -->
  <rect x="50" y="206" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">递推式（后序传递）</text>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#555">subtreeSum(node) = node.val + subtreeSum(left) + subtreeSum(right)</text>

  <!-- 频次表 -->
  <rect x="50" y="262" width="220" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">频次表 freq</text>
  <text x="70" y="306" font-size="11" fill="#555">子树和 2 → 频次 </text>
  <text x="240" y="306" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="70" y="326" font-size="11" fill="#555">子树和 −5 → 频次 </text>
  <text x="248" y="326" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="70" y="346" font-size="11" fill="#555">maxFreq = </text>
  <text x="150" y="346" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- 答案框 -->
  <rect x="290" y="262" width="220" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="400" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案</text>
  <text x="400" y="312" text-anchor="middle" font-size="11" fill="#555">收集 freq == maxFreq 的 sum</text>
  <text x="400" y="338" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">[ 2 ]</text>
</svg>
