<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：每个字符的「势力区间」[ first, last ]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 s = "abacd" 为例，绿框就是答案子串</text>

  <!-- green dashed answer box around cells 0..3 -->
  <rect x="134" y="50" width="196" height="64" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="7 5" rx="8" filter="url(#rough2)"/>

  <!-- string cells -->
  <rect x="140" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="162" y="80" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="188" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="80" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="236" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="80" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="284" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="306" y="80" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="332" y="58" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="354" y="80" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">d</text>

  <!-- indices -->
  <text x="162" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="210" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="258" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="306" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="354" y="106" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>

  <!-- interval bars header -->
  <text x="260" y="134" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">每个字符的全部出现连成一条势力区间：</text>

  <!-- bar a: cells 0..2 -->
  <text x="128" y="153" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="140" y="142" width="140" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="288" y="153" font-size="10" fill="#667788" filter="url(#rough2)">first=0, last=2</text>

  <!-- bar b: cell 1 -->
  <text x="128" y="179" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="188" y="168" width="44" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="179" font-size="10" fill="#667788" filter="url(#rough2)">first=1, last=1</text>

  <!-- bar c: cell 3 -->
  <text x="128" y="205" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="284" y="194" width="44" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="336" y="205" font-size="10" fill="#667788" filter="url(#rough2)">first=3, last=3</text>

  <!-- bar d: cell 4 -->
  <text x="128" y="231" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="332" y="220" width="44" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="384" y="231" font-size="10" fill="#8a6d3b" filter="url(#rough2)">first=4, last=4</text>

  <!-- answer bracket under bars -->
  <rect x="134" y="246" width="198" height="12" fill="none" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <path d="M 233 258 L 233 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 [0,3]="abac"：a、b、c 的势力区间全被包住，d 全在门外 ✓</text>

  <!-- bottom note -->
  <rect x="48" y="292" width="424" height="96" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">判定：[i, j] 自包含 ⟺ 所含每个字符 c 都有 first[c] ≥ i 且 last[c] ≤ j</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">（c 的所有出现都落在子串内，内外字符集不相交，且 t ≠ s）</text>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">推论：合法子串的左端点 i 必是 s[i] 的首次出现位置</text>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">→ 候选起点至多 26 个，每个起点向右一次线性扫描即可</text>
</svg>
