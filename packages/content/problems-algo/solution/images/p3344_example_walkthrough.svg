<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = 10，逐个 n 核对公式</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">S(n) = n(n−1)/2 × T(n)；表中 n 按顺序列出便于核对（实际二分只探测 ~10 个 n）</text>

  <!-- 表头 -->
  <rect x="40" y="56" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="76" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">n</text>
  <rect x="100" y="56" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="76" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">n(n−1)/2</text>
  <rect x="200" y="56" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240" y="76" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">T(n)</text>
  <rect x="280" y="56" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">S(n)</text>
  <rect x="360" y="56" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="76" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">S(n) ≤ 10 ?</text>

  <!-- 行 n=1 -->
  <rect x="40" y="86" width="60" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="86" width="100" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="86" width="80" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="280" y="86" width="80" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="360" y="86" width="120" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 可行</text>

  <!-- 行 n=2（答案行，绿色高亮） -->
  <rect x="40" y="118" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="139" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="100" y="118" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="139" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="200" y="118" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="139" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="280" y="118" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="139" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="360" y="118" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="139" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 可行 ← 答案</text>

  <!-- 行 n=3（超标，红色） -->
  <rect x="40" y="150" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="171" text-anchor="middle" font-size="12" fill="#8a3833" filter="url(#rough2)">3</text>
  <rect x="100" y="150" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="171" text-anchor="middle" font-size="12" fill="#8a3833" filter="url(#rough2)">3</text>
  <rect x="200" y="150" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="171" text-anchor="middle" font-size="12" fill="#8a3833" filter="url(#rough2)">15</text>
  <rect x="280" y="150" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="171" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">45</text>
  <rect x="360" y="150" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="171" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">✗ 超了</text>

  <!-- T(n) 分解说明 -->
  <rect x="20" y="196" width="480" height="58" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="216" font-size="10" fill="#333" filter="url(#rough2)">T(3) 的按位分解：c₀ = 1（只有 1 是奇数）→ 对数 3² − (3−1)² = 5，贡献 1×5 = 5；</text>
  <text x="34" y="232" font-size="10" fill="#333" filter="url(#rough2)">c₁ = 1（只有 2 含 bit1）→ 对数 5，贡献 2×5 = 10；</text>
  <text x="34" y="248" font-size="10" fill="#333" filter="url(#rough2)">T(3) = 5 + 10 = 15，S(3) = 3 × 15 = 45 &gt; 10 → 不可行</text>

  <!-- 结果框 -->
  <rect x="20" y="262" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最大可行 n = 2 → 返回 2 ✓（示例 1）</text>

  <!-- 示例 2 -->
  <rect x="20" y="302" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">示例 2（s = 0）：S(1) = 0 ≤ 0 ✓，S(2) = 3 &gt; 0 ✗ → 返回 1 ✓</text>

  <!-- 底注 -->
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">实际二分从大往小收敛（666→333→167→84→42→21→11→6→3→2），10 轮出结果，每轮只做 ~11 次位运算</text>
</svg>
