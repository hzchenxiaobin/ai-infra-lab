<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：计数表 + 基准校验</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="56" font-size="12" fill="#555" font-weight="bold">示例 1：s = "abacbc"</text>

  <text x="40" y="80" font-size="11" fill="#888">cnt[26]（仅展示非零与边界）：</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="40" y="88" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="62" y="100">a</text>
    <text x="62" y="113" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="92" y="88" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="114" y="100">b</text>
    <text x="114" y="113" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="144" y="88" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="166" y="100">c</text>
    <text x="166" y="113" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="196" y="88" width="44" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="218" y="100" fill="#aaa">d</text>
    <text x="218" y="113" font-size="11" fill="#aaa">0</text>
    <text x="252" y="106" font-size="11" fill="#aaa">… 其余均为 0</text>
  </g>

  <text x="40" y="140" font-size="11" fill="#555">target = cnt['a'] = <tspan font-weight="bold" fill="#b85450">2</tspan>（首个非零）</text>

  <text x="40" y="162" font-size="11" fill="#888">校验（跳过 0，比较 == target）：</text>
  <g font-size="11" fill="#333">
    <rect x="40" y="170" width="120" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="100" y="187" text-anchor="middle">a: 2 == 2 ✓</text>
    <rect x="170" y="170" width="120" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="230" y="187" text-anchor="middle">b: 2 == 2 ✓</text>
    <rect x="300" y="170" width="120" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="360" y="187" text-anchor="middle">c: 2 == 2 ✓</text>
  </g>
  <rect x="430" y="170" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="187" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ true</text>

  <!-- Divider -->
  <path d="M 30 214 L 530 214" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="240" font-size="12" fill="#555" font-weight="bold">示例 2：s = "aaabb"</text>

  <text x="40" y="264" font-size="11" fill="#888">cnt[26]（仅展示非零与边界）：</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="40" y="272" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="62" y="284">a</text>
    <text x="62" y="297" font-size="12" fill="#b85450" font-weight="bold">3</text>
    <rect x="92" y="272" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="114" y="284">b</text>
    <text x="114" y="297" font-size="12" fill="#d6a040" font-weight="bold">2</text>
    <rect x="144" y="272" width="44" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="166" y="284" fill="#aaa">c</text>
    <text x="166" y="297" font-size="11" fill="#aaa">0</text>
    <text x="200" y="290" font-size="11" fill="#aaa">… 其余均为 0</text>
  </g>

  <text x="40" y="324" font-size="11" fill="#555">target = cnt['a'] = <tspan font-weight="bold" fill="#b85450">3</tspan>（首个非零）</text>

  <text x="40" y="346" font-size="11" fill="#888">校验（跳过 0，比较 == target）：</text>
  <g font-size="11" fill="#333">
    <rect x="40" y="354" width="120" height="26" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="100" y="371" text-anchor="middle">a: 3 == 3 ✓</text>
    <rect x="170" y="354" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="230" y="371" text-anchor="middle" fill="#b85450" font-weight="bold">b: 2 ≠ 3 ✗</text>
  </g>
  <rect x="300" y="354" width="140" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="371" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 提前返回 false</text>

  <!-- note -->
  <text x="40" y="394" font-size="10.5" fill="#888">观察：命中不等即提前 return，无需校验后续槽位；target 总能取到（s 非空 ⇒ 至少一个非零）。</text>
</svg>
