<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">等长两半比较和：大数使所在半和更大，相等则在中点</text>

  <!-- array cells: [7,7,7,7,10,7,7,7,7], 9 cells width 46 start x=73 -->
  <g filter="url(#rough2)">
    <rect x="73" y="56" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="119" y="56" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="165" y="56" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="211" y="56" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="257" y="56" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="303" y="56" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="349" y="56" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="395" y="56" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="441" y="56" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <text x="96" y="85" text-anchor="middle" font-size="13" fill="#446688">7</text>
  <text x="142" y="85" text-anchor="middle" font-size="13" fill="#446688">7</text>
  <text x="188" y="85" text-anchor="middle" font-size="13" fill="#446688">7</text>
  <text x="234" y="85" text-anchor="middle" font-size="13" fill="#446688">7</text>
  <text x="280" y="85" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">10</text>
  <text x="326" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a">7</text>
  <text x="372" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a">7</text>
  <text x="418" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a">7</text>
  <text x="464" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a">7</text>

  <!-- index labels -->
  <text x="96" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="142" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="188" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="234" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="280" y="118" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">4</text>
  <text x="326" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>
  <text x="372" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">6</text>
  <text x="418" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">7</text>
  <text x="464" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">8</text>

  <!-- brackets -->
  <path d="M73 134 L73 130 L257 130 L257 134" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="165" y="148" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">左半 [0..3] · 4 个</text>

  <path d="M257 134 L257 130 L303 130 L303 134" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">中点</text>

  <path d="M303 134 L303 130 L487 130 L487 134" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="395" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">右半 [5..8] · 4 个</text>

  <!-- sum comparison -->
  <text x="165" y="176" text-anchor="middle" font-size="11.5" fill="#446688">Σ左 = 4×7 = 28</text>
  <text x="280" y="176" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">值 = 10</text>
  <text x="395" y="176" text-anchor="middle" font-size="11.5" fill="#4a7a3a">Σ右 = 4×7 = 28</text>

  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Σ左 == Σ右  ⇒  大数即中点 [4] = 10</text>

  <!-- three outcome panels -->
  <rect x="30" y="218" width="160" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="110" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cmp == 1</text>
  <text x="110" y="258" text-anchor="middle" font-size="10.5" fill="#446688">Σ左 &gt; Σ右</text>
  <text x="110" y="276" text-anchor="middle" font-size="10.5" fill="#446688">大数在左半</text>
  <text x="110" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">right = left+half−1</text>

  <rect x="200" y="218" width="160" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cmp == 0</text>
  <text x="280" y="258" text-anchor="middle" font-size="10.5" fill="#d6a040">Σ左 == Σ右</text>
  <text x="280" y="276" text-anchor="middle" font-size="10.5" fill="#d6a040">大数即中点</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">return left+half</text>

  <rect x="370" y="218" width="160" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cmp == −1</text>
  <text x="450" y="258" text-anchor="middle" font-size="10.5" fill="#4a7a3a">Σ左 &lt; Σ右</text>
  <text x="450" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a">大数在右半</text>
  <text x="450" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left = right−half+1</text>

  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#888">每轮取左右各 half = ⌊len/2⌋ 个比较；偶数长度无中点，cmp 不会为 0</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#aaa">compareSub(l,r,x,y) 返回 1 / 0 / −1 表示 sum(arr[l..r]) ≷ sum(arr[x..y])</text>
</svg>
