<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：makes vs coding</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">words = [practice, makes, perfect, coding, makes]</text>

  <!-- table header -->
  <rect x="40" y="58" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>
  <text x="180" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">words[i]</text>
  <text x="300" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">p1 (makes)</text>
  <text x="400" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">p2 (coding)</text>
  <text x="490" y="77" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans</text>

  <!-- column dividers -->
  <line x1="120" y1="58" x2="120" y2="248" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="58" x2="240" y2="248" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="58" x2="360" y2="248" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="58" x2="440" y2="248" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0: practice -->
  <rect x="40" y="88" width="480" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="11.5" fill="#aaa">0</text>
  <text x="180" y="108" text-anchor="middle" font-size="11.5" fill="#aaa">practice</text>
  <text x="300" y="108" text-anchor="middle" font-size="11.5" fill="#aaa">−1</text>
  <text x="400" y="108" text-anchor="middle" font-size="11.5" fill="#aaa">−1</text>
  <text x="490" y="108" text-anchor="middle" font-size="11.5" fill="#aaa">∞</text>

  <!-- row 1: makes -> p1=1 -->
  <rect x="40" y="120" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="140" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="180" y="140" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">makes</text>
  <text x="300" y="140" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <text x="400" y="140" text-anchor="middle" font-size="11.5" fill="#aaa">−1</text>
  <text x="490" y="140" text-anchor="middle" font-size="11.5" fill="#aaa">∞</text>
  <text x="535" y="140" text-anchor="middle" font-size="9" fill="#888">p2未现</text>

  <!-- row 2: perfect -->
  <rect x="40" y="152" width="480" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="172" text-anchor="middle" font-size="11.5" fill="#aaa">2</text>
  <text x="180" y="172" text-anchor="middle" font-size="11.5" fill="#aaa">perfect</text>
  <text x="300" y="172" text-anchor="middle" font-size="11.5" fill="#aaa">1</text>
  <text x="400" y="172" text-anchor="middle" font-size="11.5" fill="#aaa">−1</text>
  <text x="490" y="172" text-anchor="middle" font-size="11.5" fill="#aaa">∞</text>

  <!-- row 3: coding -> p2=3, ans=2 -->
  <rect x="40" y="184" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="180" y="204" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">coding</text>
  <text x="300" y="204" text-anchor="middle" font-size="11.5" fill="#aaa">1</text>
  <text x="400" y="204" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="490" y="204" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2</text>
  <text x="535" y="204" text-anchor="middle" font-size="9" fill="#888">|1−3|</text>

  <!-- row 4: makes -> p1=4, ans=min(2,1)=1 -->
  <rect x="40" y="216" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="236" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="180" y="236" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">makes</text>
  <text x="300" y="236" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">4</text>
  <text x="400" y="236" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="490" y="236" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">1 ✓</text>
  <text x="535" y="236" text-anchor="middle" font-size="9" fill="#b85450">|4−3|</text>

  <!-- result box -->
  <rect x="40" y="264" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i=4 见 makes → 用最近 p2=3 更新 → ans = min(2, |4−3|) = 1</text>

  <!-- note -->
  <rect x="40" y="300" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#555">每遇 word1/word2 即与对方最近位置比距，无需回头扫描</text>
</svg>
