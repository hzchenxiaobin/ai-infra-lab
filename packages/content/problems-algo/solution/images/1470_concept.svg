<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：两半 [X | Y] 按下标交错 → res[2i]=nums[i]，res[2i+1]=nums[n+i]</text>

  <!-- X half label -->
  <text x="60" y="80" font-size="11.5" fill="#446688" font-weight="bold">X = nums[0..n−1]</text>
  <text x="60" y="94" font-size="10" fill="#888">前半段（x_i）</text>

  <!-- X cells: 2,5,1 -->
  <rect x="190" y="58" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">2</text>
  <text x="220" y="52" text-anchor="middle" font-size="10" fill="#446688">x₀</text>

  <rect x="270" y="58" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">5</text>
  <text x="300" y="52" text-anchor="middle" font-size="10" fill="#446688">x₁</text>

  <rect x="350" y="58" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">1</text>
  <text x="380" y="52" text-anchor="middle" font-size="10" fill="#446688">x₂</text>

  <!-- Y half label -->
  <text x="60" y="158" font-size="11.5" fill="#4a7a3a" font-weight="bold">Y = nums[n..2n−1]</text>
  <text x="60" y="172" font-size="10" fill="#888">后半段（y_i）</text>

  <!-- Y cells: 3,4,7 -->
  <rect x="190" y="136" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="161" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">3</text>
  <text x="220" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a">y₀</text>

  <rect x="270" y="136" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="161" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">4</text>
  <text x="300" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a">y₁</text>

  <rect x="350" y="136" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="161" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">7</text>
  <text x="380" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a">y₂</text>

  <!-- arrows X -> even result positions -->
  <path d="M 220 98 Q 170 190 130 276" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 300 98 Q 285 190 270 276" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 380 98 Q 395 190 410 276" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- arrows Y -> odd result positions -->
  <path d="M 220 176 Q 210 225 200 276" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 300 176 Q 320 225 340 276" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 380 176 Q 430 225 480 276" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result label -->
  <text x="60" y="298" font-size="11.5" fill="#555" font-weight="bold">res（交错）</text>

  <!-- result cells: 2,3,5,4,1,7 -->
  <rect x="100" y="276" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="301" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">2</text>

  <rect x="170" y="276" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="301" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">3</text>

  <rect x="240" y="276" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="301" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">5</text>

  <rect x="310" y="276" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="301" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">4</text>

  <rect x="380" y="276" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="301" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">1</text>

  <rect x="450" y="276" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="301" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">7</text>

  <!-- result index labels -->
  <text x="130" y="332" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="200" y="332" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="270" y="332" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="340" y="332" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="410" y="332" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="480" y="332" text-anchor="middle" font-size="9.5" fill="#888">5</text>

  <!-- formula note box -->
  <rect x="70" y="350" width="480" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">下标映射公式（一趟遍历 i = 0..n−1）</text>
  <text x="310" y="392" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">res[2i]   = nums[i]</text>
  <text x="310" y="410" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">res[2i+1] = nums[n + i]</text>
  <text x="310" y="425" text-anchor="middle" font-size="10" fill="#888">偶位放 x，奇位放 y → 无需显式拆分两半</text>
</svg>
