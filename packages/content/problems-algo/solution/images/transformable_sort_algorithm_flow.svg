<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：记录位置 + 逐字符检查阻挡</text>

  <!-- Step 1: Record positions -->
  <rect x="40" y="50" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="78" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="68" y="82" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="74" font-size="12" fill="#333" font-weight="bold">记录位置</text>
  <text x="100" y="92" font-size="11" fill="#555">为 s 中每个数字 0–9 维护一个位置队列 pos[d]，按出现顺序存下标</text>

  <path d="M 280 106 L 280 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop header -->
  <rect x="40" y="128" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="156" r="16" fill="#d6a040" filter="url(#rough2)"/>
  <text x="68" y="160" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="100" y="152" font-size="12" fill="#333" font-weight="bold">遍历 t 的每个字符 c（从左到右）</text>
  <text x="100" y="170" font-size="11" fill="#555">d = c 对应的数字；取出 d 的位置队列队首 p = pos[d][idx[d]]</text>

  <path d="M 280 184 L 280 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Check queue empty -->
  <rect x="40" y="206" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="234" r="16" fill="#b85450" filter="url(#rough2)"/>
  <text x="68" y="238" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="100" y="230" font-size="12" fill="#333" font-weight="bold">队列耗尽？</text>
  <text x="100" y="248" font-size="11" fill="#555">若 idx[d] ≥ pos[d].size() → d 不够用，返回 false</text>

  <path d="M 280 262 L 280 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Check blockers -->
  <rect x="40" y="284" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="312" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="68" y="316" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4</text>
  <text x="100" y="308" font-size="12" fill="#333" font-weight="bold">检查更小数字是否阻挡</text>
  <text x="100" y="326" font-size="11" fill="#555">对所有 smaller ∈ [0, d−1]：若 pos[smaller] 队首 &lt; p → 被挡，返回 false</text>

  <path d="M 280 340 L 280 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Mark used & loop back -->
  <rect x="40" y="362" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="386" r="16" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="68" y="390" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">5</text>
  <text x="100" y="382" font-size="12" fill="#333" font-weight="bold">标记已用，继续</text>
  <text x="100" y="400" font-size="11" fill="#555">idx[d]++（弹出队首），回到步骤 2 处理下一个字符</text>

  <!-- loop back arrow -->
  <path d="M 520 386 L 540 386 L 540 156 L 520 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="548" y="272" font-size="10" fill="#888" writing-mode="tb">回到步骤 2</text>

  <!-- Step 6: Return true -->
  <path d="M 280 410 L 280 426" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="428" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="451" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">全部匹配 → 返回 true</text>
</svg>
