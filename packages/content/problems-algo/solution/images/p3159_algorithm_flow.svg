<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：先建表，再查表</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">预处理 O(n) 只做一次；每个查询 O(1)，互不干扰</text>

  <!-- ===== Phase 1: build pos ===== -->
  <rect x="22" y="58" width="228" height="292" fill="#fffdf5" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="136" y="80" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">阶段① 预处理：建 pos 表</text>

  <rect x="52" y="92" width="168" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="136" y="111" text-anchor="middle" font-size="11" fill="#446688">开始：pos = []，i = 0</text>
  <path d="M 136 120 L 136 138" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="136,140 204,168 136,196 68,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="172" text-anchor="middle" font-size="11" fill="#d6a040">i &lt; n ?</text>
  <path d="M 204 168 L 236 168" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="172" font-size="10" fill="#b85450">否 → 表建好了</text>

  <path d="M 136 196 L 136 214" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="212" font-size="10" fill="#4a7a3a">是</text>
  <polygon points="136,216 200,242 136,268 72,242" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="246" text-anchor="middle" font-size="11" fill="#b85450">nums[i] == x ?</text>

  <path d="M 72 242 L 46 242 L 46 290" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="258" font-size="10" fill="#4a7a3a">否</text>
  <rect x="30" y="292" width="106" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="83" y="311" text-anchor="middle" font-size="10" fill="#4a7a3a">跳过，i++</text>

  <path d="M 200 242 L 228 242 L 228 292" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="236" font-size="10" fill="#b85450">是</text>
  <rect x="178" y="292" width="98" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="311" text-anchor="middle" font-size="10" fill="#b85450">pos ← i，i++</text>

  <path d="M 83 320 L 83 336 L 136 336 L 136 340" stroke="#666" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 227 320 L 227 336 L 136 336" stroke="#666" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- ===== Phase 2: answer queries ===== -->
  <rect x="270" y="58" width="228" height="292" fill="#f5fbf6" stroke="#4a7a3a" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="384" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段② 逐个回答查询</text>

  <rect x="300" y="92" width="168" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="384" y="111" text-anchor="middle" font-size="11" fill="#446688">取下一个查询 q</text>
  <path d="M 384 120 L 384 138" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="384,140 452,168 384,196 316,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="172" text-anchor="middle" font-size="11" fill="#d6a040">q ≤ pos.size() ?</text>

  <path d="M 316 168 L 296 168 L 296 216 L 306 224" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="200" font-size="10" fill="#4a7a3a">是</text>
  <rect x="288" y="226" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans ← pos[q-1]</text>

  <path d="M 452 168 L 472 168 L 472 216 L 462 224" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="200" font-size="10" fill="#b85450">否</text>
  <rect x="416" y="226" width="74" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="453" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans ← -1</text>

  <path d="M 384 196 L 384 224" stroke="#666" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <path d="M 348 256 L 348 276 L 384 276 L 384 282" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 453 256 L 453 276 L 384 276" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <polygon points="384,284 446,310 384,336 322,310" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="314" text-anchor="middle" font-size="11" fill="#446688">还有查询?</text>
  <path d="M 446 310 L 468 310 L 468 60 L 384 60 L 384 88" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="290" font-size="10" fill="#446688">是</text>
  <path d="M 384 336 L 384 344" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="348" font-size="10" fill="#4a7a3a">否 → 返回 ans</text>
</svg>
