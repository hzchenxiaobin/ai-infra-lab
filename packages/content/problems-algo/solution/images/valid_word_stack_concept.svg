<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">检查替换后的词是否有效：栈匹配 "abc"</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">把 "abc" 视作一个括号组 → 最后插入的最先消除 → LIFO → 栈</text>

  <!-- ===== Left: 插入过程（构造方向） ===== -->
  <text x="120" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">构造方向：逐次插入 "abc"</text>

  <!-- Step 1: empty -->
  <text x="40" y="108" font-size="10" fill="#888">① "" → 插入 abc</text>
  <rect x="40" y="114" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="131" text-anchor="middle" font-size="11" fill="#555">"" → "abc"</text>

  <!-- Step 2: insert into middle -->
  <text x="40" y="156" font-size="10" fill="#888">② 在 a 与 bc 间再插 abc</text>
  <rect x="40" y="162" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="179" text-anchor="middle" font-size="11" fill="#555">"a<tspan fill="#b85450" font-weight="bold">abc</tspan>bc"</text>

  <!-- Step 3: nested -->
  <text x="40" y="204" font-size="10" fill="#888">③ 继续嵌套插入</text>
  <rect x="40" y="210" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="227" text-anchor="middle" font-size="11" fill="#555">层层嵌套的 abc</text>

  <!-- arrow down -->
  <path d="M 120 246 L 120 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="274" width="168" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="294" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">💡 关键观察</text>
  <text x="120" y="310" text-anchor="middle" font-size="10" fill="#555">最内层（最后插入）的 abc</text>
  <text x="120" y="324" text-anchor="middle" font-size="10" fill="#555">必然连续出现，最先被消除</text>

  <!-- ===== Right: 消除方向（栈） ===== -->
  <text x="400" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">判定方向：栈即时消除</text>

  <!-- Stack illustration -->
  <text x="400" y="108" text-anchor="middle" font-size="10" fill="#888">扫描字符 → 入栈 → 栈顶三字为 abc 则弹出</text>

  <!-- stack frame -->
  <rect x="330" y="118" width="140" height="172" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="400" y="134" text-anchor="middle" font-size="9" fill="#aaa">栈（底→顶）</text>

  <!-- stack cells: a, b, c (top 3 = abc) -->
  <rect x="350" y="248" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>

  <rect x="350" y="220" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>

  <rect x="350" y="192" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>

  <!-- highlight top 3 -->
  <rect x="346" y="188" width="108" height="88" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="466" y="232" font-size="10" fill="#b85450" font-weight="bold">栈顶</text>
  <text x="466" y="246" font-size="10" fill="#b85450" font-weight="bold">= abc</text>

  <!-- pop arrow -->
  <path d="M 460 264 L 500 264 L 500 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="290" font-size="10" fill="#b85450" font-weight="bold">弹出</text>
  <text x="504" y="304" font-size="10" fill="#b85450" font-weight="bold">3 个</text>

  <!-- remaining a exposed -->
  <rect x="350" y="164" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="466" y="178" font-size="9" fill="#4a7a3a">暴露</text>

  <!-- result box -->
  <rect x="316" y="304" width="168" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">扫描结束栈空 → 有效 ✓</text>
  <text x="400" y="340" text-anchor="middle" font-size="10" fill="#555">LIFO = 最后插入的最先消</text>

  <!-- ===== Center bridge ===== -->
  <path d="M 210 180 Q 270 180 326 180" stroke="#888" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="174" text-anchor="middle" font-size="9" fill="#888">逆过程</text>
</svg>
