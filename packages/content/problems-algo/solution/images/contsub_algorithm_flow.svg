<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="500" height="620" fill="#fafafa"/>

  <text x="250" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">连续的子数组和：算法流程</text>

  <!-- Init -->
  <rect x="110" y="40" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="250" y="82" text-anchor="middle" font-size="11" fill="#555">first = {0 : −1}, prefix = 0</text>

  <path d="M 250 96 L 250 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="110" y="118" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="138" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i, x in nums</text>
  <text x="250" y="154" text-anchor="middle" font-size="10.5" fill="#555">遍历每个元素</text>

  <path d="M 250 162 L 250 180" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- prefix += x -->
  <rect x="140" y="184" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="250" y="209" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">prefix += x</text>

  <path d="M 250 224 L 250 242" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute remainder -->
  <rect x="130" y="246" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="250" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r = prefix % k</text>
  <text x="250" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a">nums[i] ≥ 0 → 余数非负，无需修正</text>

  <path d="M 250 290 L 250 308" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: r in first? -->
  <polygon points="250,308 370,352 250,396 130,352" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">r 在 first 中 ?</text>
  <text x="250" y="366" text-anchor="middle" font-size="10.5" fill="#777">之前见过同余？</text>

  <!-- D1 No branch (right) -> record -->
  <path d="M 370 352 L 430 352 L 430 402" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="345" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="370" y="404" width="120" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="424" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">first[r] = i</text>
  <text x="430" y="440" text-anchor="middle" font-size="9.5" fill="#555">首次出现才记录</text>

  <!-- D1 Yes branch (down) -->
  <path d="M 250 396 L 250 414" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="408" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Diamond 2: i - first[r] >= 2 ? -->
  <polygon points="250,414 370,458 250,502 130,458" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="454" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i − first[r] ≥ 2 ?</text>
  <text x="250" y="472" text-anchor="middle" font-size="10.5" fill="#777">跨度够长？</text>

  <!-- D2 Yes branch (down) -> return true -->
  <path d="M 250 502 L 250 520" stroke="#82b366" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="514" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="180" y="524" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="250" y="550" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- D2 No branch (left) -> keep earliest -->
  <path d="M 130 458 L 70 458 L 70 402" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="451" font-size="11" fill="#d6a040" font-weight="bold">No</text>
  <rect x="10" y="404" width="120" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="70" y="424" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">保留最早</text>
  <text x="70" y="440" text-anchor="middle" font-size="9.5" fill="#555">不更新 first</text>

  <!-- Loop back: right (from record box) -->
  <path d="M 490 428 L 490 140 L 392 140" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="290" font-size="9.5" fill="#aaa" transform="rotate(-90 498 290)">循环</text>

  <!-- Loop back: left (from keep-earliest box) -->
  <path d="M 10 428 L 10 140 L 108 140" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="2" y="290" font-size="9.5" fill="#aaa" transform="rotate(-90 2 290)">循环</text>

  <!-- final -->
  <text x="250" y="598" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">遍历结束未命中 → return false  （O(n), O(min(n,k))）</text>
</svg>
