<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <pattern id="wallHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#5a5a5a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3a3a3a" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="245" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">从 BFS 到 Dijkstra：边权 = 滚动步数</text>
  <text x="245" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不同方向滚动距离不同 → 加权图 → Dijkstra 求最短路</text>

  <!-- 5x5 grid, cell=48, origin (140,72) -->
  <g filter="url(#rough2)" font-size="13">
    <!-- Row 0 -->
    <rect x="140" y="72" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="188" y="72" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="236" y="72" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="284" y="72" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="308" y="100" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="11">停</text>
    <rect x="332" y="72" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- Row 1 -->
    <rect x="140" y="120" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="188" y="120" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="236" y="120" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="284" y="120" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="332" y="120" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- Row 2 -->
    <rect x="140" y="168" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="188" y="168" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="236" y="168" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="284" y="168" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="332" y="168" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="356" y="196" text-anchor="middle" fill="#4a7a3a" font-weight="bold" font-size="11">停</text>
    <!-- Row 3 -->
    <rect x="140" y="216" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="188" y="216" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="236" y="216" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="284" y="216" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="332" y="216" width="48" height="48" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <!-- Row 4 -->
    <rect x="140" y="264" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="188" y="264" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="236" y="264" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="284" y="264" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="332" y="264" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="356" y="292" text-anchor="middle" fill="#d6a040" font-weight="bold" font-size="11">终</text>
  </g>

  <!-- Ball at (0,4) center (356, 96) -->
  <g filter="url(#rough2)">
    <circle cx="356" cy="96" r="11" fill="#446688" stroke="#224466" stroke-width="1.5"/>
    <text x="356" y="100" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">S</text>
  </g>

  <!-- Arrow down: (0,4) -> (2,4), distance 2 -->
  <g filter="url(#rough2)">
    <path d="M 356 108 L 356 180" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
    <text x="370" y="146" font-size="12" fill="#b85450" font-weight="bold">↓ 2 格</text>
  </g>

  <!-- Arrow left: (0,4) -> (0,3), distance 1 -->
  <g filter="url(#rough2)">
    <path d="M 344 96 L 320 96" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
    <text x="310" y="84" font-size="12" fill="#b85450" font-weight="bold">← 1 格</text>
  </g>

  <!-- Column labels -->
  <g filter="url(#rough2)" font-size="9" fill="#666">
    <text x="164" y="66" text-anchor="middle">0</text>
    <text x="212" y="66" text-anchor="middle">1</text>
    <text x="260" y="66" text-anchor="middle">2</text>
    <text x="308" y="66" text-anchor="middle">3</text>
    <text x="356" y="66" text-anchor="middle">4</text>
  </g>
  <!-- Row labels -->
  <g filter="url(#rough2)" font-size="9" fill="#666">
    <text x="128" y="100" text-anchor="middle">0</text>
    <text x="128" y="148" text-anchor="middle">1</text>
    <text x="128" y="196" text-anchor="middle">2</text>
    <text x="128" y="244" text-anchor="middle">3</text>
    <text x="128" y="292" text-anchor="middle">4</text>
  </g>

  <!-- Annotation boxes on right -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="408" y="88" width="120" height="62" fill="#f0f0f0" stroke="#777" stroke-width="1.4" rx="8"/>
    <text x="468" y="108" text-anchor="middle" fill="#555" font-weight="bold">490 题 BFS</text>
    <text x="468" y="124" text-anchor="middle" fill="#777" font-size="10">边权 = 1</text>
    <text x="468" y="138" text-anchor="middle" fill="#777" font-size="10">（滚一次 = 一步）</text>

    <rect x="408" y="166" width="120" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="468" y="186" text-anchor="middle" fill="#4a7a3a" font-weight="bold">505 题 Dijkstra</text>
    <text x="468" y="202" text-anchor="middle" fill="#555" font-size="10">边权 = 滚动步数</text>
    <text x="468" y="216" text-anchor="middle" fill="#555" font-size="10">（不同方向不等权）</text>

    <rect x="408" y="244" width="120" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="468" y="264" text-anchor="middle" fill="#d6a040" font-weight="bold">距离不等权</text>
    <text x="468" y="280" text-anchor="middle" fill="#555" font-size="10">→ 不能用 BFS 层数</text>
    <text x="468" y="294" text-anchor="middle" fill="#555" font-size="10">→ 堆优化 Dijkstra</text>
  </g>

  <!-- Legend -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="150" y="332" width="16" height="14" fill="url(#wallHatch)" stroke="#3a3a3a" stroke-width="1.2" rx="2"/>
    <text x="172" y="343" fill="#555">墙</text>
    <circle cx="220" cy="339" r="6" fill="#446688" stroke="#224466" stroke-width="1.2"/>
    <text x="232" y="343" fill="#555">起点</text>
    <rect x="272" y="333" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="292" y="343" fill="#555">停止位</text>
    <rect x="336" y="333" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <text x="356" y="343" fill="#555">终点</text>
  </g>
</svg>
