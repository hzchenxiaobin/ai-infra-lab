<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三对用户的共同关注者计数与排名</text>

  <!-- Followers per user (top section) -->
  <text x="40" y="54" font-size="11" fill="#446688" font-weight="bold">各用户的关注者集合（由 Relations 表读出）</text>
  <rect x="30" y="62" width="560" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="50" y="80" font-size="11" fill="#888">user 1:</text><text x="110" y="80" font-size="12" fill="#333">{3, 4, 5}</text>
  <text x="220" y="80" font-size="11" fill="#888">user 2:</text><text x="280" y="80" font-size="12" fill="#333">{3, 4, 6}</text>
  <text x="400" y="80" font-size="11" fill="#888">user 7:</text><text x="460" y="80" font-size="12" fill="#333">{3, 4, 5}</text>
  <text x="50" y="96" font-size="9.5" fill="#888">注：用户 3、4、5、6 只作为 follower_id 出现，无关注者信息 → 不参与配对</text>

  <!-- Arrow down -->
  <path d="M 310 108 L 310 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Header row for result table -->
  <rect x="30" y="132" width="560" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="151" font-size="11" fill="#4a7a3a" font-weight="bold">user1_id</text>
  <text x="145" y="151" font-size="11" fill="#4a7a3a" font-weight="bold">user2_id</text>
  <text x="235" y="151" font-size="11" fill="#4a7a3a" font-weight="bold">交集 = 共同关注者</text>
  <text x="430" y="151" font-size="11" fill="#4a7a3a" font-weight="bold">COUNT</text>
  <text x="525" y="151" font-size="11" fill="#4a7a3a" font-weight="bold">RANK</text>

  <!-- Pair (1, 2) -->
  <rect x="30" y="164" width="560" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="190" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="155" y="190" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="245" y="190" font-size="11" fill="#555">{3,4,5} ∩ {3,4,6} = </text>
  <text x="390" y="190" font-size="11.5" fill="#d6a040" font-weight="bold">{3, 4}</text>
  <text x="440" y="190" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <text x="535" y="190" font-size="13" fill="#888">2</text>

  <!-- Pair (1, 7) - HIGHLIGHTED -->
  <rect x="30" y="210" width="560" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="236" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="155" y="236" font-size="13" fill="#b85450" font-weight="bold">7</text>
  <text x="245" y="236" font-size="11" fill="#555">{3,4,5} ∩ {3,4,5} = </text>
  <text x="380" y="236" font-size="11.5" fill="#b85450" font-weight="bold">{3, 4, 5}</text>
  <text x="440" y="236" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="530" y="236" font-size="13" fill="#b85450" font-weight="bold">1 ←</text>

  <!-- Pair (2, 7) -->
  <rect x="30" y="256" width="560" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="65" y="282" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="155" y="282" font-size="13" fill="#333" font-weight="bold">7</text>
  <text x="245" y="282" font-size="11" fill="#555">{3,4,6} ∩ {3,4,5} = </text>
  <text x="390" y="282" font-size="11.5" fill="#d6a040" font-weight="bold">{3, 4}</text>
  <text x="440" y="282" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <text x="535" y="282" font-size="13" fill="#888">2</text>

  <!-- Arrow down -->
  <path d="M 310 302 L 310 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output box -->
  <rect x="140" y="324" width="340" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">WHERE rk = 1 → 共同关注者最多的对</text>
  <text x="200" y="364" font-size="13" fill="#888">user1_id</text>
  <text x="330" y="364" font-size="13" fill="#888">user2_id</text>
  <text x="210" y="366" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="340" y="366" font-size="13" fill="#b85450" font-weight="bold">7</text>

  <!-- Notes -->
  <rect x="30" y="386" width="560" height="44" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="406" font-size="10.5" fill="#555" font-weight="bold">推演要点</text>
  <text x="50" y="422" font-size="10" fill="#555">• 自连接按 follower_id 配对后，COUNT 天然等于交集大小，无需逐对求集合交</text>
</svg>
