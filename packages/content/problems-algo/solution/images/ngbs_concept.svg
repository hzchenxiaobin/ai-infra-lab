<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心：按块拼接——每次追加恰好 oneGroup 个 1 / zeroGroup 个 0</text>
  <text x="290" y="52" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">整块追加永远合法：并入尾段(+oneGroup 仍倍数) 或 开新段(恰好 oneGroup)</text>

  <!-- Scenario 1: ends in 0 -->
  <text x="40" y="100" font-size="13" fill="#4a7a3a" filter="url(#rough2)">末位=0</text>
  <rect x="100" y="74" width="36" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="118" y="100" text-anchor="middle" font-size="18" fill="#2c4a22" filter="url(#rough2)">0</text>
  <text x="168" y="100" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">+</text>
  <rect x="184" y="74" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="202" y="100" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <rect x="222" y="74" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="240" y="100" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <path d="M 184 68 L 184 60 L 258 60 L 258 68" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="221" y="54" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">oneGroup 个 1</text>
  <path d="M 272 94 L 302 94" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="322" y="74" width="36" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="100" text-anchor="middle" font-size="18" fill="#2c4a22" filter="url(#rough2)">0</text>
  <rect x="362" y="74" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="100" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <rect x="400" y="74" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="418" y="100" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <path d="M 362 68 L 362 60 L 436 60 L 436 68" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="399" y="54" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">开新 1 段 = oneGroup ✓</text>

  <!-- Scenario 2: ends in 1 -->
  <text x="40" y="174" font-size="13" fill="#446688" filter="url(#rough2)">末位=1</text>
  <rect x="100" y="148" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="118" y="174" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <rect x="138" y="148" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="174" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <path d="M 100 142 L 100 134 L 174 134 L 174 142" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="137" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">尾 1 段已是倍数</text>
  <text x="198" y="174" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">+</text>
  <rect x="216" y="148" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="234" y="174" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <rect x="254" y="148" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="272" y="174" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <path d="M 216 142 L 216 134 L 290 134 L 290 142" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="253" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">oneGroup 个 1</text>
  <path d="M 304 168 L 334 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="354" y="148" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="372" y="174" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <rect x="392" y="148" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="174" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <rect x="430" y="148" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="174" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <rect x="468" y="148" width="36" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="486" y="174" text-anchor="middle" font-size="18" fill="#223" filter="url(#rough2)">1</text>
  <path d="M 354 142 L 354 132 L 504 132 L 504 142" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="429" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">并入尾段 2→4，仍 = 2×oneGroup ✓</text>

  <!-- recurrence box -->
  <rect x="40" y="232" width="500" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="260" text-anchor="middle" font-size="15" fill="#223" filter="url(#rough2)">无需记录末位： f[i] = f[i-oneGroup] + f[i-zeroGroup]，f[0]=1</text>

  <!-- note box -->
  <rect x="40" y="290" width="500" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">0 视为所有数的倍数 → 空串 f[0]=1；纯 1 / 纯 0 串天然合法</text>

  <!-- legend -->
  <rect x="40" y="350" width="22" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="361" font-size="11" fill="#555" filter="url(#rough2)">绿=0 段</text>
  <rect x="150" y="350" width="22" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180" y="361" font-size="11" fill="#555" filter="url(#rough2)">蓝=1 段</text>
  <rect x="260" y="350" width="22" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="290" y="361" font-size="11" fill="#555" filter="url(#rough2)">虚框=本次追加的块</text>
</svg>
