<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐格扫描，原地 DP + 累加</text>

  <!-- Start: ans=0 -->
  <rect x="200" y="44" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">ans = 0</text>
  <path d="M 280 78 L 280 92" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop: for i, for j -->
  <rect x="180" y="92" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">遍历每个格子 (i, j)</text>
  <path d="M 280 126 L 280 140" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: matrix[i][j]==0? -->
  <polygon points="280,140 380,180 280,220 180,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11.5" fill="#444">matrix[i][j]</text>
  <text x="280" y="192" text-anchor="middle" font-size="11.5" fill="#444">== 0 ?</text>

  <!-- Yes branch: left -->
  <text x="172" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 180 180 L 110 180" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="40" y="164" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="184" text-anchor="middle" font-size="11" fill="#b85450">dp=0, 跳过</text>
  <!-- loop back from skip -->
  <path d="M 75 196 L 75 250 L 178 250" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- No branch: down -->
  <text x="290" y="232" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 220 L 280 234" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: i>0 && j>0? -->
  <polygon points="280,234 380,272 280,310 180,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11.5" fill="#444">i &gt; 0 且</text>
  <text x="280" y="284" text-anchor="middle" font-size="11.5" fill="#444">j &gt; 0 ?</text>

  <!-- Yes branch: right -> dp = min(neighbors)+1 -->
  <text x="390" y="268" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 380 272 L 470 272" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="430" y="256" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="270" text-anchor="middle" font-size="10.5" fill="#335">dp = min(上,左,</text>
  <text x="490" y="284" text-anchor="middle" font-size="10.5" fill="#335">左上) + 1</text>

  <!-- No branch: left -> dp = 1 -->
  <text x="172" y="268" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 272 L 110 272" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="40" y="256" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="276" text-anchor="middle" font-size="11" fill="#3a5a2a">dp = 1</text>
  <text x="75" y="288" text-anchor="middle" font-size="9" fill="#888">首行/首列</text>

  <!-- both branches merge to ans += dp -->
  <path d="M 490 290 L 490 320 L 280 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 75 288 L 75 320 L 280 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ans += dp -->
  <rect x="190" y="324" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">ans += dp[i][j]</text>

  <!-- loop back to traverse next cell -->
  <path d="M 280 358 L 280 378" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="374" font-size="10" fill="#888">下一格</text>
  <path d="M 280 378 Q 280 398 280 110" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Return ans -->
  <rect x="190" y="400" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="17" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">返回 ans</text>
  <path d="M 280 378 L 280 392 L 280 400" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="350" y="392" font-size="10" fill="#888">遍历结束</text>
</svg>
