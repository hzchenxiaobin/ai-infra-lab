<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：按值分组 + 二分答案，check(t)=Σ freq[r]·⌊√(t/r)⌋</text>

  <!-- Step 1: group -->
  <rect x="170" y="44" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按值统计 freq[r]，求 r_min</text>
  <path d="M 280 80 L 280 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="120" y="104" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo=1, hi=r_min·cars², ans=0</text>
  <path d="M 280 140 L 280 162" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: loop condition -->
  <polygon points="280,164 390,212 280,260 170,212" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo ≤ hi ?</text>
  <text x="280" y="224" text-anchor="middle" font-size="10" fill="#888">循环</text>

  <!-- No branch -> return -->
  <path d="M 390 212 L 470 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="206" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="196" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="510" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes branch: mid -->
  <path d="M 280 260 L 280 282" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="276" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="195" y="286" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mid = (lo + hi) / 2</text>
  <path d="M 280 320 L 280 342" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: check(mid) -->
  <polygon points="280,344 425,392 280,440 135,392" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt = Σ freq[r]·⌊√(mid/r)⌋</text>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt ≥ cars ?</text>

  <!-- Yes: feasible -> left -->
  <path d="M 135 392 L 55 392 L 55 322" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">可行</text>
  <rect x="15" y="296" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="55" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans=mid</text>
  <text x="55" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">hi=mid-1</text>
  <path d="M 55 296 L 55 212 L 170 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="256" font-size="10" fill="#4a7a3a">向左找更短</text>

  <!-- No: infeasible -> right -->
  <path d="M 425 392 L 505 392 L 505 322" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="384" font-size="11" fill="#b85450" font-weight="bold">不够</text>
  <rect x="465" y="296" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="505" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lo=mid+1</text>
  <path d="M 505 296 L 505 212 L 390 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="512" y="256" font-size="10" fill="#b85450">加大时间</text>
</svg>
