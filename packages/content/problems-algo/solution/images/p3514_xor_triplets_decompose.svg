<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">三元组拆解：重复下标塌缩成单值，三个不同 = 对异或 ⊕ 单值</text>

  <!-- nums 数组 -->
  <text x="38" y="74" text-anchor="end" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">nums</text>

  <rect x="48" y="50" width="44" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="64" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">#0</text>
  <text x="70" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>

  <rect x="98" y="50" width="44" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="64" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">#1</text>
  <text x="120" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>

  <rect x="148" y="50" width="44" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="64" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">#2</text>
  <text x="170" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">8</text>

  <rect x="198" y="50" width="44" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="64" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">#3</text>
  <text x="220" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">9</text>

  <!-- 值域封顶 -->
  <rect x="268" y="50" width="234" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">nums[i] ≤ 1500 &lt; 2¹¹ = 2048</text>
  <text x="385" y="86" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">所有 XOR 结果 ∈ [0, 2048) ⇒ 答案 ≤ 2048</text>

  <!-- 三种下标模式 -->
  <rect x="26" y="108" width="272" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="131" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">i = j = k：x⊕x⊕x = x → 单值</text>

  <rect x="26" y="152" width="272" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="175" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">i = j &lt; k：x⊕x⊕y = y → 单值（成对抵消）</text>

  <rect x="26" y="196" width="272" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="40" y="219" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">i &lt; j &lt; k：x⊕y⊕z = (x⊕y)⊕z → 对⊕单</text>

  <text x="162" y="252" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i ≤ j ≤ k 不构成额外约束：三个不同位置排个序即可</text>

  <!-- P 集合 -->
  <rect x="316" y="108" width="186" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="127" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">P：所有数对的异或</text>
  <text x="409" y="145" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">nums[a]⊕nums[b]（a &lt; b），O(n²) 标记</text>

  <text x="409" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">×（笛卡尔积）</text>

  <!-- V 集合 -->
  <rect x="316" y="182" width="186" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">V：set(nums)</text>
  <text x="409" y="216" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">最多 1500 个不同值</text>

  <path d="M 409 228 L 409 240" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 组合 -->
  <rect x="316" y="244" width="186" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="409" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">ans[p ⊕ v] ← true</text>

  <!-- 结论 -->
  <rect x="44" y="288" width="432" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">answer = | V ∪ { p⊕v : p ∈ P, v ∈ V } |</text>
  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">值域只有 2048 ⇒ bool 数组当集合；下标撞车的 p⊕v 恰好塌缩回 V，不多算</text>
</svg>
