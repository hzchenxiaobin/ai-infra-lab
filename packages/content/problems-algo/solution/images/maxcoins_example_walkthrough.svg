<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：piles = [2,4,1,2,7,8]</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">排序后 = [1,2,2,4,7,8]，n = 2，共 2 轮</text>

  <!-- ===== Table header ===== -->
  <rect x="20" y="52" width="520" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">轮次</text>
  <text x="150" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">选出 3 堆</text>
  <text x="270" y="70" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Bob(最小)</text>
  <text x="360" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">你(第二大)</text>
  <text x="470" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Alice(最大)</text>

  <!-- Row 1 -->
  <rect x="20" y="80" width="520" height="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="150" y="100" text-anchor="middle" font-size="11" fill="#333">{1, 7, 8}</text>
  <text x="270" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="360" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="470" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8</text>

  <!-- Row 2 -->
  <rect x="20" y="112" width="520" height="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="132" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="132" text-anchor="middle" font-size="11" fill="#333">{2, 2, 4}</text>
  <text x="270" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="360" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="470" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>

  <!-- Row 3: result -->
  <rect x="20" y="144" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="164" text-anchor="middle" font-size="11" fill="#888">合计</text>
  <text x="150" y="164" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="270" y="164" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="360" y="164" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">7 + 2 = 9</text>
  <text x="470" y="164" text-anchor="middle" font-size="11" fill="#888">12</text>

  <!-- ===== Visual: sorted array with pick annotations ===== -->
  <text x="40" y="204" font-size="12" fill="#888">排序后取数轨迹（绿=你，蓝=Alice，红=Bob）：</text>

  <!-- 6 boxes -->
  <rect x="80" y="220" width="60" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="246" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="110" y="274" text-anchor="middle" font-size="10" fill="#b85450">Bob·R1</text>

  <rect x="146" y="220" width="60" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="246" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="176" y="274" text-anchor="middle" font-size="10" fill="#b85450">Bob·R2</text>

  <rect x="212" y="220" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="246" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="242" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">你·R2</text>

  <rect x="278" y="220" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="246" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>
  <text x="308" y="274" text-anchor="middle" font-size="10" fill="#446688">Alice·R2</text>

  <rect x="344" y="220" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="246" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="374" y="274" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">你·R1</text>

  <rect x="410" y="220" width="60" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="246" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">8</text>
  <text x="440" y="274" text-anchor="middle" font-size="10" fill="#446688">Alice·R1</text>

  <!-- index labels -->
  <text x="110" y="296" text-anchor="middle" font-size="9" fill="#999">i=0</text>
  <text x="176" y="296" text-anchor="middle" font-size="9" fill="#999">i=1</text>
  <text x="242" y="296" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">i=2 ✓</text>
  <text x="308" y="296" text-anchor="middle" font-size="9" fill="#999">i=3</text>
  <text x="374" y="296" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">i=4 ✓</text>
  <text x="440" y="296" text-anchor="middle" font-size="9" fill="#999">i=5</text>

  <!-- arrow: step +2 -->
  <path d="M 242 304 L 374 318" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a">i += 2</text>

  <!-- Result box -->
  <rect x="120" y="332" width="320" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">答案 = piles[2] + piles[4] = 2 + 7 = 9</text>
</svg>
