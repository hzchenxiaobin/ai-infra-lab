<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#333" filter="url(#rough2)">记忆化 DFS 流程</text>

  <!-- 起点 -->
  <rect x="150" y="50" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">对每个格子 (i,j) 调用 dfs(i,j)</text>

  <path d="M260,92 L260,112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <!-- dfs 入口 -->
  <rect x="150" y="112" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">res = 1  （自身这一格）</text>

  <path d="M260,154 L260,170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <!-- 遍历邻居 -->
  <rect x="140" y="170" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">遍历 4 邻居 (ni,nj)</text>

  <path d="M260,212 L260,228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <!-- 决策菱形 -->
  <polygon points="260,228 372,272 260,316 148,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">grid[ni][nj]</text>
  <text x="260" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">&gt; grid[i][j] ?</text>

  <!-- 是 分支（左） -->
  <path d="M148,272 L96,272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="122" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="18" y="252" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="58" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">res +=</text>
  <text x="58" y="288" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dfs(ni,nj)</text>
  <!-- 回到遍历 -->
  <path d="M58,252 L58,190 L140,190" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 否 分支（右） -->
  <path d="M372,272 L424,272" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="398" y="264" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="424" y="252" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="464" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">跳过</text>
  <path d="M504,272 L504,190 L380,190" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 记忆化 -->
  <path d="M260,316 L260,336" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="130" y="336" width="260" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">memo[i][j] = res % MOD，返回</text>

  <!-- 答案 -->
  <path d="M260,378 L260,394" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="120" y="394" width="280" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="#b85450" filter="url(#rough2)">答案 = Σ dfs(i,j) % MOD</text>
</svg>
