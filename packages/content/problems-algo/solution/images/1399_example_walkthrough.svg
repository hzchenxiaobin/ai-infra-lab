<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 13</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">上：数字 → 数位和；下：cnt 数组柱状图 → 找最大 → 数并列最多</text>

  <!-- number -> digit sum boxes -->
  <text x="32" y="68" font-size="10" fill="#666" font-weight="bold">数字</text>
  <text x="32" y="88" font-size="10" fill="#666" font-weight="bold">数位和</text>
  <g>
    <!-- 1 -> 1 (orange) -->
    <rect x="60" y="54" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="78" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">1</text>
    <rect x="60" y="74" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="78" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <!-- 2 -> 2 -->
    <rect x="100" y="54" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="118" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">2</text>
    <rect x="100" y="74" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="118" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
    <!-- 3 -> 3 -->
    <rect x="140" y="54" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="158" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">3</text>
    <rect x="140" y="74" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="158" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <!-- 4 -> 4 -->
    <rect x="180" y="54" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="198" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">4</text>
    <rect x="180" y="74" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="198" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
    <!-- 5 -> 5 (blue) -->
    <rect x="220" y="54" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="238" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">5</text>
    <rect x="220" y="74" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="238" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
    <!-- 6 -> 6 -->
    <rect x="260" y="54" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="278" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">6</text>
    <rect x="260" y="74" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="278" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
    <!-- 7 -> 7 -->
    <rect x="300" y="54" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="318" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">7</text>
    <rect x="300" y="74" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="318" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">7</text>
    <!-- 8 -> 8 -->
    <rect x="340" y="54" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="358" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">8</text>
    <rect x="340" y="74" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="358" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8</text>
    <!-- 9 -> 9 -->
    <rect x="380" y="54" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="398" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">9</text>
    <rect x="380" y="74" width="36" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="398" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9</text>
    <!-- 10 -> 1 (orange) -->
    <rect x="420" y="54" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="438" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">10</text>
    <rect x="420" y="74" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="438" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <!-- 11 -> 2 -->
    <rect x="460" y="54" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="478" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">11</text>
    <rect x="460" y="74" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="478" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
    <!-- 12 -> 3 -->
    <rect x="500" y="54" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="518" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">12</text>
    <rect x="500" y="74" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="518" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
    <!-- 13 -> 4 -->
    <rect x="540" y="54" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="558" y="68" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">13</text>
    <rect x="540" y="74" width="36" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="558" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  </g>

  <path d="M 310 100 L 310 116" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="322" y="112" font-size="10" fill="#666">cnt[s]++</text>

  <!-- bar chart: cnt[1..9] -->
  <text x="32" y="146" font-size="11" fill="#666" font-weight="bold">cnt[s]</text>
  <!-- baseline -->
  <line x1="50" y1="280" x2="590" y2="280" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- cnt[1]=2 (orange, max) -->
  <rect x="62" y="224" width="44" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="84" y="216" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="84" y="298" text-anchor="middle" font-size="10" fill="#888">s=1</text>
  <!-- cnt[2]=2 -->
  <rect x="120" y="224" width="44" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="216" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="142" y="298" text-anchor="middle" font-size="10" fill="#888">s=2</text>
  <!-- cnt[3]=2 -->
  <rect x="178" y="224" width="44" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="216" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="200" y="298" text-anchor="middle" font-size="10" fill="#888">s=3</text>
  <!-- cnt[4]=2 -->
  <rect x="236" y="224" width="44" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="258" y="216" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="258" y="298" text-anchor="middle" font-size="10" fill="#888">s=4</text>
  <!-- cnt[5]=1 (blue) -->
  <rect x="294" y="252" width="44" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="244" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="316" y="298" text-anchor="middle" font-size="10" fill="#888">s=5</text>
  <!-- cnt[6]=1 -->
  <rect x="352" y="252" width="44" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="374" y="244" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="374" y="298" text-anchor="middle" font-size="10" fill="#888">s=6</text>
  <!-- cnt[7]=1 -->
  <rect x="410" y="252" width="44" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="244" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="432" y="298" text-anchor="middle" font-size="10" fill="#888">s=7</text>
  <!-- cnt[8]=1 -->
  <rect x="468" y="252" width="44" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="244" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="490" y="298" text-anchor="middle" font-size="10" fill="#888">s=8</text>
  <!-- cnt[9]=1 -->
  <rect x="526" y="252" width="44" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="244" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="548" y="298" text-anchor="middle" font-size="10" fill="#888">s=9</text>

  <!-- max line -->
  <line x1="50" y1="224" x2="590" y2="224" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="590" y="220" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">maxSize = 2</text>

  <!-- result -->
  <rect x="40" y="318" width="540" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="340" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">cnt[s] == 2 的组：s = 1, 2, 3, 4 → 共 4 个</text>
  <text x="310" y="358" text-anchor="middle" font-size="11" fill="#888">返回 ans = 4 ✓</text>

  <!-- note -->
  <rect x="40" y="380" width="540" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="402" font-size="11" fill="#4a7a3a" font-weight="bold">观察：n = 13 时数位和仅取 1..9</text>
  <text x="60" y="420" font-size="11" fill="#666">• 1..9 各自数位和 = 自身，组大小初始 1</text>
  <text x="60" y="436" font-size="11" fill="#666">• 10..13 的数位和回到 1..4，使 s=1,2,3,4 的组大小涨到 2 → 并列最大</text>
</svg>
