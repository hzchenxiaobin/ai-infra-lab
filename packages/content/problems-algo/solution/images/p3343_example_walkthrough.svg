<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：num = "112"（n = 3，偶位 m = 2，奇位 1 个）</text>

  <!-- 信息条 -->
  <rect x="25" y="42" width="118" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="84" y="60" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">c₁ = 2，c₂ = 1</text>
  <rect x="155" y="42" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="225" y="60" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">S = 4 → target = 2</text>
  <rect x="307" y="42" width="188" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="401" y="60" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">要求：j = 2 且 s = 2 才能收账</text>

  <!-- 枚举表 -->
  <g filter="url(#rough2)">
    <rect x="25" y="86" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="115" y="86" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="165" y="86" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="215" y="86" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="70" y="103" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">(k₁, k₂)</text>
    <text x="140" y="103" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">j=Σk</text>
    <text x="190" y="103" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">s</text>
    <text x="270" y="103" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">判定</text>

    <rect x="25" y="112" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="115" y="112" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="165" y="112" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="215" y="112" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="70" y="131" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">(2, 0)</text>
    <text x="140" y="131" text-anchor="middle" font-size="11" fill="#2f5d24">2</text>
    <text x="190" y="131" text-anchor="middle" font-size="11" fill="#2f5d24">2</text>
    <text x="270" y="131" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">✓ 权重 1/2</text>

    <rect x="25" y="142" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="115" y="142" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="165" y="142" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="215" y="142" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="70" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(1, 1)</text>
    <text x="140" y="161" text-anchor="middle" font-size="11" fill="#b85450">2</text>
    <text x="190" y="161" text-anchor="middle" font-size="11" fill="#b85450">3</text>
    <text x="270" y="161" text-anchor="middle" font-size="10" fill="#b85450">✗ s 超过 2</text>

    <rect x="25" y="172" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="115" y="172" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="165" y="172" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="215" y="172" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="70" y="191" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">(0, 1)</text>
    <text x="140" y="191" text-anchor="middle" font-size="11" fill="#b85450">1</text>
    <text x="190" y="191" text-anchor="middle" font-size="11" fill="#b85450">2</text>
    <text x="270" y="191" text-anchor="middle" font-size="10" fill="#b85450">✗ 偶位没装满</text>
  </g>
  <text x="170" y="222" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">其余组合 (0,0)、(1,0)、(2,1) 同理不可行</text>
  <text x="170" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">✗ 的分支在 DP 转移处直接被剪掉</text>

  <!-- 结果框 -->
  <rect x="340" y="86" width="155" height="152" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="417" y="108" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">唯一可行分组</text>
  <text x="417" y="128" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">偶位组 {1, 1}</text>
  <text x="417" y="145" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">奇位组 {2}</text>
  <text x="417" y="167" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">权重 = 1/(2!·0!)·1/(0!·1!) = 1/2</text>
  <text x="417" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 1/2 × 2! × 1! = 1</text>
  <text x="417" y="212" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">唯一平衡排列："121"</text>
  <text x="417" y="228" text-anchor="middle" font-size="9" fill="#7a9a6a" filter="url(#rough2)">（两个 1 占下标 0、2）</text>

  <!-- 回验框 -->
  <rect x="25" y="252" width="470" height="78" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">回验 "123"：c₁=c₂=c₃=1，S=6，target=3；唯一可行 (k₁,k₂,k₃)=(1,1,0)，权重 1</text>
  <text x="260" y="292" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 1 × 2! × 1! = 2 ✓ —— 正是 "132" 和 "231"</text>
  <text x="260" y="313" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">极端回验 "9"×80：S=720，唯一分组 k₉=40（权重 1/(40!·40!)），答案 = 1</text>
  <text x="260" y="328" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">S 为奇数（如 "12345"，S=15）在入口直接返回 0，DP 都不用跑</text>
</svg>
