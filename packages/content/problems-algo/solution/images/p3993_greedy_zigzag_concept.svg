<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：谷只降 1、峰升满 m —— 「先升」模式恒优</text>

  <!-- 左上：模式 B 先升（最优） -->
  <g filter="url(#rough2)">
    <rect x="16" y="36" width="270" height="196" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="151" y="56" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">模式 B：先升（峰在奇数位）✔ 恒优</text>

    <!-- 折线 3 → 8 → 7 → 12 -->
    <path d="M 62 192 L 122 150" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)"/>
    <path d="M 122 150 L 182 160" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrRed)"/>
    <path d="M 182 160 L 242 118" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)"/>

    <!-- 数据点：峰=绿，谷=白 -->
    <circle cx="62" cy="192" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="62" y="212" text-anchor="middle" font-size="11" fill="#333">3=s</text>
    <circle cx="122" cy="150" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="122" y="138" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">峰₁=8</text>
    <circle cx="182" cy="160" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="182" y="178" text-anchor="middle" font-size="11" fill="#333">7</text>
    <circle cx="242" cy="118" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="242" y="106" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">峰₂=12</text>

    <!-- 涨跌标注 -->
    <text x="85" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">+m=+5</text>
    <text x="148" y="148" font-size="10" fill="#b85450" font-weight="bold">−1</text>
    <text x="205" y="128" font-size="10" fill="#4a7a3a" font-weight="bold">+m=+5</text>

    <text x="28" y="224" font-size="9.5" fill="#33506b">峰₁ = s+m；峰₂ = 峰₁−1+m = 12（每两步净涨 m−1=4）</text>
  </g>

  <!-- 右上：模式 A 先降 -->
  <g filter="url(#rough2)">
    <rect x="302" y="36" width="242" height="196" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="423" y="56" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">模式 A：先降（峰在偶数位）</text>

    <!-- 折线 3 → 2 → 7 → 6 -->
    <path d="M 344 186 L 404 194" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrRed)"/>
    <path d="M 404 194 L 464 152" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGreen)"/>
    <path d="M 464 152 L 524 160" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrRed)"/>

    <circle cx="344" cy="186" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="344" y="174" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">峰₀=3</text>
    <circle cx="404" cy="194" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="404" y="212" text-anchor="middle" font-size="11" fill="#333">2</text>
    <circle cx="464" cy="152" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="464" y="140" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">峰₁=7</text>
    <circle cx="524" cy="160" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="524" y="178" text-anchor="middle" font-size="11" fill="#333">6</text>

    <text x="366" y="196" font-size="10" fill="#b85450" font-weight="bold">−1</text>
    <text x="426" y="164" font-size="10" fill="#4a7a3a" font-weight="bold">+m=+5</text>
    <text x="486" y="152" font-size="10" fill="#b85450" font-weight="bold">−1</text>

    <text x="314" y="224" font-size="9.5" fill="#2f5d24">首峰就是 s=3，最大仅 7；末位还是谷，白降一次</text>
  </g>

  <!-- 左下：公式推导 -->
  <g filter="url(#rough2)">
    <rect x="16" y="244" width="336" height="144" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="184" y="264" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">两种模式比大小（n ≥ 2）</text>
    <text x="28" y="284" font-size="9.5" fill="#8a6d1a">模式 B：峰数 ⌊n/2⌋ ⇒ max_B = s + 1 + ⌊n/2⌋·(m−1)</text>
    <text x="28" y="302" font-size="9.5" fill="#8a6d1a">模式 A：峰数 ⌈n/2⌉ ⇒ max_A = s + (⌈n/2⌉−1)·(m−1)</text>
    <text x="28" y="322" font-size="9.5" fill="#8a6d1a">作差：n 偶 ⇒ B−A = m；n 奇 ⇒ B−A = 1</text>
    <text x="28" y="338" font-size="9.5" fill="#8a6d1a">　　⇒ 模式 B 恒优，只需一个公式</text>
    <text x="28" y="358" font-size="9.5" fill="#8a6d1a">n = 1：单元素即交替，特判 ans = s</text>
    <text x="28" y="380" font-size="10.5" fill="#d6a040" font-weight="bold">ans = s + 1 + ⌊n/2⌋·(m−1)</text>
  </g>

  <!-- 右下：常见翻车点 -->
  <g filter="url(#rough2)">
    <rect x="368" y="244" width="176" height="144" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="456" y="264" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">常见翻车点</text>
    <text x="380" y="284" font-size="9.5" fill="#8a3030">① 忘特判 n=1：</text>
    <text x="380" y="300" font-size="9.5" fill="#8a3030">　 公式会多算一次上升得 s+1</text>
    <text x="380" y="318" font-size="9.5" fill="#8a3030">② C++ 溢出：⌊n/2⌋·(m−1) 约 5×10¹³</text>
    <text x="380" y="336" font-size="9.5" fill="#8a3030">　 int 相乘先转型 long long</text>
    <text x="380" y="354" font-size="9.5" fill="#8a3030">③ 想逐位模拟构造：n ≤ 10⁹ 必超时</text>
    <text x="380" y="372" font-size="9.5" fill="#8a3030">④ 以为有混合模式：首步方向一定，</text>
    <text x="380" y="386" font-size="9.5" fill="#8a3030">　 峰谷奇偶被钉死，只有 2 种</text>
  </g>
</svg>
