<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：收集座位 → 奇偶检查 → 逐组乘缝隙</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">O(n) 时间 · O(n) 空间（可优化至 O(1)）</text>

  <!-- ===== Step 1: Scan ===== -->
  <rect x="160" y="58" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 扫描 corridor，收集 seats[]</text>
  <line x1="270" y1="96" x2="270" y2="112" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Decision diamond ===== -->
  <polygon points="270,116 380,164 270,212 160,164" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② m == 0</text>
  <text x="270" y="174" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">或 m 为奇数？</text>

  <!-- Yes branch (right) -->
  <line x1="380" y1="164" x2="430" y2="164" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="432" y="148" width="90" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="477" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return 0</text>

  <!-- No branch (down) -->
  <line x1="270" y1="212" x2="270" y2="228" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- ===== Step 3: Init ans ===== -->
  <rect x="170" y="230" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ ans = 1</text>
  <line x1="270" y1="264" x2="270" y2="280" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Loop ===== -->
  <rect x="120" y="282" width="300" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ for k in range(2, m, 2):</text>
  <text x="270" y="324" text-anchor="middle" font-size="11.5" fill="#4a7a3a">    ans = ans × (seats[k] − seats[k−1]) % MOD</text>
  <line x1="270" y1="340" x2="270" y2="356" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: Return ===== -->
  <rect x="160" y="358" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ return ans</text>

  <!-- ===== Side notes ===== -->
  <rect x="30" y="100" width="120" height="58" fill="#f6f6f6" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="118" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">seats[]</text>
  <text x="90" y="134" text-anchor="middle" font-size="9.5" fill="#888">所有 'S' 的下标</text>
  <text x="90" y="148" text-anchor="middle" font-size="9.5" fill="#888">m = len(seats)</text>

  <rect x="30" y="282" width="78" height="58" fill="#f6f6f6" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="69" y="300" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">缝隙数</text>
  <text x="69" y="316" text-anchor="middle" font-size="9.5" fill="#888">seats[k] −</text>
  <text x="69" y="330" text-anchor="middle" font-size="9.5" fill="#888">seats[k−1]</text>

  <!-- ===== Bottom insight ===== -->
  <rect x="30" y="416" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="438" text-anchor="middle" font-size="11" fill="#333">💡 空积 = 1：当 m = 2 时循环不执行，ans 保持 1（只有 1 组，无需额外屏风）</text>
</svg>
