<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：power = [3,1,4]，递推 f[mask]（mask=已击败集合）</text>
  <text x="270" y="40" text-anchor="middle" font-size="10.5" fill="#888">f[mask] = min(f[mask^(1&lt;&lt;i)] + ⌈power[i] / popcount(mask)⌉)，f[0]=0</text>

  <!-- Optimal path chain -->
  <text x="30" y="74" font-size="11" fill="#4a7a3a" font-weight="bold">最优路径：</text>
  <!-- node 000 -->
  <rect x="80" y="58" width="66" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="113" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">000</text>
  <text x="113" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f=0</text>
  <!-- edge -->
  <path d="M 146 77 L 168 77" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="157" y="70" text-anchor="middle" font-size="9" fill="#4a7a3a">怪2@g1</text>
  <!-- node 010 -->
  <rect x="170" y="58" width="66" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="203" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">010</text>
  <text x="203" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f=1</text>
  <!-- edge -->
  <path d="M 236 77 L 258 77" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="247" y="70" text-anchor="middle" font-size="9" fill="#4a7a3a">怪3@g2</text>
  <!-- node 110 -->
  <rect x="260" y="58" width="66" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="293" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">110</text>
  <text x="293" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f=3</text>
  <!-- edge -->
  <path d="M 326 77 L 348 77" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="337" y="70" text-anchor="middle" font-size="9" fill="#4a7a3a">怪1@g3</text>
  <!-- node 111 -->
  <rect x="350" y="58" width="66" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="383" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">111</text>
  <text x="383" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f=4</text>
  <text x="440" y="74" font-size="11" fill="#4a7a3a" font-weight="bold">= 1+2+1</text>
  <text x="440" y="89" font-size="11" fill="#4a7a3a" font-weight="bold">总 4 天</text>

  <path d="M 270 104 L 270 120" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="116" font-size="10.5" fill="#888">逐层递推所有状态（绿=最优路径，灰=其余转移）</text>

  <!-- DP table -->
  <!-- header -->
  <rect x="36" y="124" width="468" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">mask</text>
  <text x="138" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">已击败</text>
  <text x="206" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">gain</text>
  <text x="292" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">末位怪物(转移源)</text>
  <text x="386" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cost</text>
  <text x="462" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f[mask]</text>
  <!-- dividers -->
  <path d="M 108 124 L 108 302" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 170 124 L 170 302" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 246 124 L 246 302" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 340 124 L 340 302" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 430 124 L 430 302" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Row 000 -->
  <rect x="36" y="150" width="468" height="19" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="163" text-anchor="middle" font-size="11" fill="#888">000</text>
  <text x="138" y="163" text-anchor="middle" font-size="11" fill="#888">∅</text>
  <text x="206" y="163" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="292" y="163" text-anchor="middle" font-size="11" fill="#888">初始</text>
  <text x="386" y="163" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="462" y="163" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>

  <!-- Row 001 -->
  <rect x="36" y="169" width="468" height="19" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="182" text-anchor="middle" font-size="11" fill="#333">001</text>
  <text x="138" y="182" text-anchor="middle" font-size="11" fill="#333">{怪1}</text>
  <text x="206" y="182" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="292" y="182" text-anchor="middle" font-size="11" fill="#333">怪1(3) ← 000</text>
  <text x="386" y="182" text-anchor="middle" font-size="11" fill="#333">⌈3/1⌉=3</text>
  <text x="462" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row 010 (optimal) -->
  <rect x="36" y="188" width="468" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">010</text>
  <text x="138" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{怪2}</text>
  <text x="206" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="292" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">怪2(1) ← 000</text>
  <text x="386" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⌈1/1⌉=1</text>
  <text x="462" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 100 -->
  <rect x="36" y="207" width="468" height="19" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="220" text-anchor="middle" font-size="11" fill="#333">100</text>
  <text x="138" y="220" text-anchor="middle" font-size="11" fill="#333">{怪3}</text>
  <text x="206" y="220" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="292" y="220" text-anchor="middle" font-size="11" fill="#333">怪3(4) ← 000</text>
  <text x="386" y="220" text-anchor="middle" font-size="11" fill="#333">⌈4/1⌉=4</text>
  <text x="462" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Row 011 -->
  <rect x="36" y="226" width="468" height="19" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="239" text-anchor="middle" font-size="11" fill="#333">011</text>
  <text x="138" y="239" text-anchor="middle" font-size="11" fill="#333">{怪1,怪2}</text>
  <text x="206" y="239" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="292" y="239" text-anchor="middle" font-size="11" fill="#333">怪1(3) ← 010</text>
  <text x="386" y="239" text-anchor="middle" font-size="11" fill="#333">⌈3/2⌉=2</text>
  <text x="462" y="239" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row 101 -->
  <rect x="36" y="245" width="468" height="19" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="258" text-anchor="middle" font-size="11" fill="#333">101</text>
  <text x="138" y="258" text-anchor="middle" font-size="11" fill="#333">{怪1,怪3}</text>
  <text x="206" y="258" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="292" y="258" text-anchor="middle" font-size="11" fill="#333">怪3(4) ← 001</text>
  <text x="386" y="258" text-anchor="middle" font-size="11" fill="#333">⌈4/2⌉=2</text>
  <text x="462" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Row 110 (optimal) -->
  <rect x="36" y="264" width="468" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">110</text>
  <text x="138" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{怪2,怪3}</text>
  <text x="206" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="292" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">怪3(4) ← 010</text>
  <text x="386" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⌈4/2⌉=2</text>
  <text x="462" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Row 111 (optimal) -->
  <rect x="36" y="283" width="468" height="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">111</text>
  <text x="138" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全部</text>
  <text x="206" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="292" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">怪1(3) ← 110</text>
  <text x="386" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⌈3/3⌉=1</text>
  <text x="462" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Result -->
  <path d="M 270 310 L 270 326" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="150" y="330" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">answer = f[111] = 4 ✓</text>

  <text x="36" y="390" font-size="10.5" fill="#888">• 顺序 [怪2, 怪3, 怪1]：1+2+1=4 最优；若先打怪3(power4)则 ⌈4/1⌉=4 浪费，贪心排序无效</text>
</svg>
