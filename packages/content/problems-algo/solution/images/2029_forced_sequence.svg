<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">开局后主战线被「锁死」成 1,2,1,2,…</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">Alice 开余1 → Bob 只能余1 → Alice 只能余2 → … 强制交替</text>

  <!-- opening move -->
  <rect x="40" y="64" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Alice 开局</text>
  <text x="90" y="110" text-anchor="middle" font-size="10" fill="#b85450">出 余1，mod→1</text>

  <path d="M 140 81 L 168 81" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- forced sequence boxes, alternating Bob/Alice, types 1,2,1,2 -->
  <!-- move 1: Bob, type 1 -->
  <rect x="170" y="64" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="198" y="80" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Bob</text>
  <text x="198" y="93" text-anchor="middle" font-size="10" fill="#446688">余1</text>

  <path d="M 226 81 L 254 81" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- move 2: Alice, type 2 -->
  <rect x="256" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="284" y="80" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Alice</text>
  <text x="284" y="93" text-anchor="middle" font-size="10" fill="#a87020">余2</text>

  <path d="M 312 81 L 340 81" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- move 3: Bob, type 1 -->
  <rect x="342" y="64" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="370" y="80" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Bob</text>
  <text x="370" y="93" text-anchor="middle" font-size="10" fill="#446688">余1</text>

  <path d="M 398 81 L 426 81" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- move 4: Alice, type 2 -->
  <rect x="428" y="64" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="456" y="80" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Alice</text>
  <text x="456" y="93" text-anchor="middle" font-size="10" fill="#a87020">余2</text>

  <text x="510" y="86" font-size="13" fill="#888">…</text>

  <!-- explanation of why forced -->
  <rect x="40" y="118" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="138" font-size="10.5" fill="#4a7a3a" font-weight="bold">为何强制？</text>
  <text x="60" y="154" font-size="10" fill="#555">mod=1 时，唯一安全的非零余数是 1（出 2 会变 0 输）；出 0 是跳板不改 mod。</text>
  <text x="60" y="168" font-size="10" fill="#555">→ 主战线上每个状态只有「一种安全非零牌」可选，序列 1,2,1,2,… 被锁死。</text>

  <!-- two end scenarios -->
  <text x="40" y="206" font-size="11" fill="#666" font-weight="bold">谁先断粮谁就是「受害者」</text>

  <!-- scenario A: 1's run out (c1' < c2') -->
  <rect x="40" y="218" width="235" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="157" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">情形 A：余1 先耗尽</text>
  <text x="157" y="254" text-anchor="middle" font-size="10" fill="#555">c₁ − 1 &lt; c₂</text>
  <text x="55" y="274" font-size="10" fill="#555">主战线走到 Bob 该出余1</text>
  <text x="55" y="288" font-size="10" fill="#555">但 c₁ 已空 → Bob 受害</text>
  <text x="55" y="306" font-size="10" fill="#b85450" font-weight="bold">→ 受害者初始 = Bob</text>
  <text x="55" y="322" font-size="9.5" fill="#888">跳板 c₀ 翻转受害者归属</text>

  <!-- scenario B: 2's run out (c1' > c2') -->
  <rect x="285" y="218" width="235" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="402" y="238" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">情形 B：余2 先耗尽</text>
  <text x="402" y="254" text-anchor="middle" font-size="10" fill="#555">c₁ − 1 &gt; c₂</text>
  <text x="300" y="274" font-size="10" fill="#555">主战线走到 Alice 该出余2</text>
  <text x="300" y="288" font-size="10" fill="#555">但 c₂ 已空 → Alice 受害</text>
  <text x="300" y="306" font-size="10" fill="#b85450" font-weight="bold">→ 受害者初始 = Alice</text>
  <text x="300" y="322" font-size="9.5" fill="#888">跳板 c₀ 翻转受害者归属</text>

  <!-- scenario C: equal -->
  <rect x="120" y="352" width="320" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">情形 C：c₁ − 1 = c₂（同时耗尽）</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#555">主战线走完只剩跳板，最后一枚必是余0</text>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ 和 mod 3 ≠ 0 且无石子 → Bob 胜</text>

  <!-- footer -->
  <text x="280" y="430" text-anchor="middle" font-size="10" fill="#aaa">受害者 = 输家；跳板个数 c₀ 的奇偶决定最终谁是受害者</text>
</svg>
