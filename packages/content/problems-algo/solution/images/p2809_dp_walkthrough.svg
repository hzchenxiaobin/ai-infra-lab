<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：nums1=[1,2,3] nums2=[1,2,3] x=4</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">排序后 (b,val) = (1,1),(2,2),(3,3)；s1=6, s2=6</text>

  <!-- dp table: rows = i (0..3), cols j (0..3) -->
  <!-- header row -->
  <g font-size="11" fill="#444">
    <rect x="80" y="56" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="74" text-anchor="middle" font-weight="bold">i\j</text>
    <rect x="140" y="56" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="74" text-anchor="middle" font-weight="bold">0</text>
    <rect x="220" y="56" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="260" y="74" text-anchor="middle" font-weight="bold">1</text>
    <rect x="300" y="56" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="74" text-anchor="middle" font-weight="bold">2</text>
    <rect x="380" y="56" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="420" y="74" text-anchor="middle" font-weight="bold">3</text>
  </g>

  <!-- row i=0 (initial) -->
  <g font-size="12" fill="#333">
    <rect x="80" y="86" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="104" text-anchor="middle" font-weight="bold">0</text>
    <rect x="140" y="86" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="104" text-anchor="middle">0</text>
    <rect x="220" y="86" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="260" y="104" text-anchor="middle" fill="#aaa">—</text>
    <rect x="300" y="86" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="340" y="104" text-anchor="middle" fill="#aaa">—</text>
    <rect x="380" y="86" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="420" y="104" text-anchor="middle" fill="#aaa">—</text>
  </g>

  <!-- row i=1: (1,1) -->
  <g font-size="12" fill="#333">
    <rect x="80" y="116" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="134" text-anchor="middle" font-weight="bold">1 (1,1)</text>
    <rect x="140" y="116" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="134" text-anchor="middle">0</text>
    <rect x="220" y="116" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="260" y="134" text-anchor="middle" font-weight="bold">2</text>
    <rect x="300" y="116" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="340" y="134" text-anchor="middle" fill="#aaa">—</text>
    <rect x="380" y="116" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="420" y="134" text-anchor="middle" fill="#aaa">—</text>
  </g>

  <!-- row i=2: (2,2) -->
  <g font-size="12" fill="#333">
    <rect x="80" y="146" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="164" text-anchor="middle" font-weight="bold">2 (2,2)</text>
    <rect x="140" y="146" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="164" text-anchor="middle">0</text>
    <rect x="220" y="146" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="260" y="164" text-anchor="middle" font-weight="bold">4</text>
    <rect x="300" y="146" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="340" y="164" text-anchor="middle" font-weight="bold">8</text>
    <rect x="380" y="146" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="420" y="164" text-anchor="middle" fill="#aaa">—</text>
  </g>

  <!-- row i=3: (3,3) -->
  <g font-size="12" fill="#333">
    <rect x="80" y="176" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="194" text-anchor="middle" font-weight="bold">3 (3,3)</text>
    <rect x="140" y="176" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="180" y="194" text-anchor="middle">0</text>
    <rect x="220" y="176" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="260" y="194" text-anchor="middle" font-weight="bold">6</text>
    <rect x="300" y="176" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="340" y="194" text-anchor="middle" font-weight="bold">13</text>
    <rect x="380" y="176" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
    <text x="420" y="194" text-anchor="middle" font-weight="bold">20</text>
  </g>

  <!-- transition example note -->
  <rect x="60" y="226" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="246" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">转移示例：dp[3][2] = max(dp[2][2]=8, dp[2][1]+nums1+nums2·2 = 4+3+6=13) = 13</text>
  <text x="290" y="266" text-anchor="middle" font-size="10" fill="#666">「不清零第3个」继承 dp[2][2]｜「清零第3个作为第2次操作」加 nums1[3]+nums2[3]·2</text>

  <!-- answer scanning -->
  <rect x="60" y="296" width="460" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">扫描最小 t：sum = s1 + s2·t − dp[3][t] ≤ x ?</text>
  <g font-size="11" fill="#444">
    <text x="80" y="340">t=0: 6+0−0 = 6</text>
    <text x="230" y="340">≤4? ✗</text>
    <text x="80" y="358">t=1: 6+6−6 = 6</text>
    <text x="230" y="358">≤4? ✗</text>
    <text x="80" y="376">t=2: 6+12−13 = 5</text>
    <text x="230" y="376">≤4? ✗</text>
    <text x="330" y="340" fill="#b85450" font-weight="bold">t=3: 6+18−20 = 4</text>
    <text x="480" y="340" fill="#4a7a3a" font-weight="bold">≤4? ✓</text>
  </g>
  <text x="290" y="396" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = 3</text>
</svg>
