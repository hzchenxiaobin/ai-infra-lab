<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：dist=[1,3,2], hour=2.7</text>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">验证不同时速 v 下的总时间 T(v) = ⌈1/v⌉ + ⌈3/v⌉ + 2/v</text>

  <!-- Table header -->
  <rect x="20" y="54" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="70" y="72">v</text>
    <text x="160" y="72">⌈1/v⌉</text>
    <text x="250" y="72">⌈3/v⌉</text>
    <text x="340" y="72">2/v</text>
    <text x="430" y="72">T(v)</text>
    <text x="520" y="72">≤ 2.7?</text>
  </g>

  <!-- Row v=1 -->
  <rect x="20" y="86" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="70" y="104" fill="#555" font-weight="bold">1</text>
    <text x="160" y="104" fill="#555">1</text>
    <text x="250" y="104" fill="#555">3</text>
    <text x="340" y="104" fill="#555">2.00</text>
    <text x="430" y="104" fill="#b85450" font-weight="bold">6.00</text>
    <text x="520" y="104" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Row v=2 -->
  <rect x="20" y="116" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="70" y="134" fill="#555" font-weight="bold">2</text>
    <text x="160" y="134" fill="#555">1</text>
    <text x="250" y="134" fill="#555">2</text>
    <text x="340" y="134" fill="#555">1.00</text>
    <text x="430" y="134" fill="#b85450" font-weight="bold">4.00</text>
    <text x="520" y="134" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Row v=3 (answer, highlighted) -->
  <rect x="20" y="146" width="560" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="70" y="164" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="160" y="164" fill="#555">1</text>
    <text x="250" y="164" fill="#555">1</text>
    <text x="340" y="164" fill="#555">0.67</text>
    <text x="430" y="164" fill="#4a7a3a" font-weight="bold">2.67</text>
    <text x="520" y="164" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- arrow down -->
  <path d="M 300 174 L 300 192" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Summary result box -->
  <rect x="140" y="196" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 3（最小可行时速）</text>

  <!-- Binary search note box -->
  <rect x="40" y="248" width="520" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="270" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">二分搜索过程</text>
  <text x="60" y="290" font-size="10" fill="#666" filter="url(#rough2)">• 搜索区间 [1, 10⁷]，每次取 mid 验证 T(mid) ≤ hour</text>
  <text x="60" y="306" font-size="10" fill="#666" filter="url(#rough2)">• T(v) 单调递减：v 太小 → T &gt; hour（太慢）→ lo = mid+1</text>
  <text x="60" y="322" font-size="10" fill="#666" filter="url(#rough2)">•                 v 足够大 → T ≤ hour（可行）→ ans=mid, hi=mid−1</text>
  <text x="60" y="338" font-size="10" fill="#666" filter="url(#rough2)">• 示例 3：hour=1.9 ≤ n−1=2 → 直接返回 −1（无限速也来不及）</text>
  <text x="60" y="356" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">• 约 log₂(10⁷) ≈ 24 次迭代收敛到 v* = 3</text>
</svg>
