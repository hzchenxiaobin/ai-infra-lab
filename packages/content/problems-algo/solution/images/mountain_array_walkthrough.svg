<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：单次扫描走完上山 + 下山</text>

  <!-- ===== Valid example: [0, 3, 2, 1] ===== -->
  <rect x="30" y="38" width="500" height="190" fill="#f6fbf6" stroke="#4a7a3a" stroke-width="1" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="280" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓ arr = [0, 3, 2, 1]，n = 4</text>

  <!-- Step 1: Climb phase -->
  <text x="48" y="80" font-size="11" fill="#446688" font-weight="bold">① 上山：</text>
  <text x="110" y="80" font-size="11" fill="#555">arr[0]=0 &lt; arr[1]=3 → i=1；arr[1]=3 &gt; arr[2]=2 → 停止</text>

  <!-- cells with i pointer at peak -->
  <text x="190" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i=1 (山顶)</text>
  <rect x="164" y="106" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="128" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">3</text>
  <rect x="220" y="106" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="128" text-anchor="middle" font-size="15" fill="#333">0</text>
  <rect x="276" y="106" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="128" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="332" y="106" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="128" text-anchor="middle" font-size="15" fill="#333">1</text>

  <!-- climb arrow -->
  <path d="M 180 146 L 200 146" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Boundary check -->
  <text x="48" y="164" font-size="11" fill="#555" font-weight="bold">② 边界检查：</text>
  <text x="140" y="164" font-size="11" fill="#555">i=1 &gt; 0 且 i=1 &lt; n−1=3 ✓ 山顶不在首尾</text>

  <!-- Step 3: Descend phase -->
  <text x="48" y="186" font-size="11" fill="#4a7a3a" font-weight="bold">③ 下山：</text>
  <text x="110" y="186" font-size="11" fill="#555">3 &gt; 2 → i=2；2 &gt; 1 → i=3；i+1=4=n → 走完全程</text>

  <!-- descend arrows below cells -->
  <path d="M 302 146 L 358 146" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="140" y="200" width="280" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i = 3 = n−1 → return true ✓</text>

  <!-- Separator -->
  <line x1="40" y1="244" x2="520" y2="244" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Invalid example: [3, 5, 5] ===== -->
  <rect x="30" y="252" width="500" height="200" fill="#fdf6f6" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="280" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗ arr = [3, 5, 5]，n = 3</text>

  <!-- Step 1: Climb phase -->
  <text x="48" y="294" font-size="11" fill="#446688" font-weight="bold">① 上山：</text>
  <text x="110" y="294" font-size="11" fill="#555">arr[0]=3 &lt; arr[1]=5 → i=1；arr[1]=5 = arr[2]=5 → 不严格 → 停止</text>

  <!-- cells with i pointer -->
  <text x="274" y="314" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i=1 (山顶)</text>
  <rect x="194" y="320" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="342" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="250" y="320" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="342" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">5</text>
  <rect x="306" y="320" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="342" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>

  <!-- equal marker between 5 and 5 -->
  <text x="304" y="362" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5 = 5 ✗</text>

  <!-- Step 2: Boundary check -->
  <text x="48" y="378" font-size="11" fill="#555" font-weight="bold">② 边界检查：</text>
  <text x="140" y="378" font-size="11" fill="#555">i=1 &gt; 0 且 i=1 &lt; n−1=2 ✓ 山顶不在首尾（通过）</text>

  <!-- Step 3: Descend phase fails -->
  <text x="48" y="400" font-size="11" fill="#4a7a3a" font-weight="bold">③ 下山：</text>
  <text x="110" y="400" font-size="11" fill="#555">arr[1]=5 &gt; arr[2]=5? 否（相等）→ 停止，i 卡在 1</text>

  <!-- blocked arrow -->
  <path d="M 276 360 L 310 360" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="293" y="372" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- Result -->
  <rect x="120" y="420" width="320" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i = 1 ≠ n−1 = 2 → return false ✗</text>
</svg>
