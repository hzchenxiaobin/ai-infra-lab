<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描 s，逐档扣减 k</text>

  <!-- 开始 -->
  <ellipse cx="200" cy="50" rx="72" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="55" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始：idx = 0</text>
  <path d="M 200 69 L 200 83" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取字符 -->
  <rect x="125" y="85" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一字符 c</text>
  <path d="M 200 113 L 200 122" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1：空格？ -->
  <polygon points="200,125 275,155 200,185 125,155" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="159" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">c 是空格？</text>

  <path d="M 123 155 L 114 155" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="149" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="30" y="141" width="82" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="71" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt = 1</text>

  <path d="M 277 155 L 338 155" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="149" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="340" y="141" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="396" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt = idx + 1</text>

  <!-- 汇合进入判定2 -->
  <path d="M 71 169 L 71 193 L 196 193" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 396 169 L 396 193 L 204 193" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 200 193 L 200 199" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定2：命中？ -->
  <polygon points="200,200 250,225 200,250 150,225" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="229" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">k &lt; cnt？</text>

  <path d="M 252 225 L 288 225" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="218" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="290" y="210" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="229" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 c ✓（档内全同）</text>

  <path d="M 200 250 L 200 270" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="263" font-size="9" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 扣减推进 -->
  <rect x="100" y="272" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="286" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">k −= cnt；更新 idx</text>
  <text x="200" y="303" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">空格 ⇒ idx←0；字母 ⇒ idx+=1</text>

  <!-- 回环 -->
  <path d="M 100 291 L 14 291 L 14 100 L 121 100" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="8" y="195" font-size="10" fill="#666" filter="url(#rough2)" transform="rotate(-90 8 195)">取下一字符</text>

  <!-- 说明框 -->
  <rect x="310" y="262" width="190" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="322" y="282" font-size="10.5" fill="#333" filter="url(#rough2)">• k 合法 ⇒ 必在循环内命中</text>
  <text x="322" y="299" font-size="10.5" fill="#333" filter="url(#rough2)">• 时间 O(n) / 空间 O(1)</text>
  <text x="322" y="316" font-size="10.5" fill="#333" filter="url(#rough2)">• n = |s|，全程不构造 t</text>

  <text x="16" y="350" font-size="10" fill="#999" filter="url(#rough2)">⚠️ k 用 64 位：|t| 可达 L(L+1)/2（L = 10^5 时 ≈ 5×10^9），32 位 int 放不下</text>
</svg>
