<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="880" height="700" fill="#fafafa"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：DFS 带剪枝</text>
  <path d="M 300 46 Q 440 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 阶段一 -->
  <g filter="url(#sk)">
    <rect x="300" y="62" width="280" height="38" rx="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="440" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">阶段一：扫描 s → 算 l_rem, r_rem</text>
  <path d="M 440 102 L 440 122" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 阶段二入口 -->
  <g filter="url(#sk)">
    <rect x="280" y="126" width="320" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="440" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">阶段二：dfs(i, l_cnt, r_cnt, l_rem, r_rem, path)</text>
  <path d="M 440 166 L 440 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 终止判定 -->
  <g filter="url(#sk)">
    <path d="M 440 190 L 580 236 L 440 282 L 300 236 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="440" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">i == len(s) ？</text>
  <text x="440" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a">（遍历完所有字符）</text>

  <!-- 是 -> 收集结果 -->
  <path d="M 580 236 L 660 236" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="620" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="664" y="218" width="180" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="754" y="235" text-anchor="middle" font-size="12" fill="#4a7a3a">l_rem==0 &amp;&amp; r_rem==0 ?</text>
  <text x="754" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a">→ res.add(path)</text>

  <!-- 否 -> 向下 -->
  <path d="M 440 282 L 440 308" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="452" y="298" font-size="12" font-weight="bold" fill="#333">否</text>

  <!-- 剪枝① -->
  <g filter="url(#sk)">
    <path d="M 440 312 L 600 358 L 440 404 L 280 358 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="440" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">剪枝①</text>
  <text x="440" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">len(s)-i &lt; l_rem+r_rem ?</text>
  <text x="440" y="384" text-anchor="middle" font-size="10" fill="#b85450">剩余字符不足以凑够删除数</text>

  <!-- 是 -> return -->
  <path d="M 280 358 L 200 358" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="240" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="60" y="340" width="136" height="36" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="128" y="363" text-anchor="middle" font-size="12" fill="#b85450">return（剪枝）</text>

  <!-- 否 -> 向下 -->
  <path d="M 440 404 L 440 430" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="452" y="420" font-size="12" font-weight="bold" fill="#333">否</text>

  <!-- 按字符类型分支 -->
  <g filter="url(#sk)">
    <path d="M 440 434 L 580 480 L 440 526 L 300 480 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="440" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">s[i] 的类型？</text>
  <text x="440" y="492" text-anchor="middle" font-size="11" fill="#7a5415">（字符分类处理）</text>

  <!-- 左分支：c == '(' -->
  <path d="M 300 480 L 180 480" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="240" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">(</text>

  <g filter="url(#sk)">
    <rect x="40" y="500" width="140" height="30" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="110" y="520" text-anchor="middle" font-size="11" fill="#333">保留：path+='('</text>
  <text x="110" y="534" text-anchor="middle" font-size="10" fill="#666">l_cnt+1</text>

  <g filter="url(#sk)">
    <rect x="40" y="540" width="140" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="110" y="560" text-anchor="middle" font-size="11" fill="#b85450">删除（l_rem&gt;0 时）</text>
  <text x="110" y="574" text-anchor="middle" font-size="10" fill="#b85450">l_rem-1</text>

  <!-- 中分支：c == ')' -->
  <path d="M 440 526 L 440 546" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="452" y="540" font-size="11" font-weight="bold" fill="#7a5415">)</text>

  <g filter="url(#sk)">
    <rect x="370" y="552" width="140" height="30" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="440" y="572" text-anchor="middle" font-size="11" fill="#333">保留（剪枝②）</text>
  <text x="440" y="586" text-anchor="middle" font-size="10" fill="#666">l_cnt&gt;r_cnt 时, r_cnt+1</text>

  <g filter="url(#sk)">
    <rect x="370" y="592" width="140" height="30" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="440" y="612" text-anchor="middle" font-size="11" fill="#b85450">删除（r_rem&gt;0 时）</text>
  <text x="440" y="626" text-anchor="middle" font-size="10" fill="#b85450">r_rem-1</text>

  <!-- 右分支：字母 -->
  <path d="M 580 480 L 700 480" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="640" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">字母</text>

  <g filter="url(#sk)">
    <rect x="700" y="540" width="140" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="770" y="560" text-anchor="middle" font-size="11" fill="#4a7a3a">直接保留</text>
  <text x="770" y="574" text-anchor="middle" font-size="10" fill="#4a7a3a">path+=c</text>

  <!-- 递归回环箭头 -->
  <path d="M 110 570 L 110 650 L 440 650" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" stroke-dasharray="5 4" filter="url(#sk)"/>
  <path d="M 440 622 L 440 650" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 770 570 L 770 650 L 440 650" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="440" y="668" text-anchor="middle" font-size="11" fill="#4a7a3a">三个分支都递归到 dfs(i+1, ...)</text>

  <text x="440" y="690" text-anchor="middle" font-size="12" fill="#888">两道"门"：① 剩余不足直接 return；② 保留 ) 时要求 l_cnt &gt; r_cnt。</text>
</svg>
