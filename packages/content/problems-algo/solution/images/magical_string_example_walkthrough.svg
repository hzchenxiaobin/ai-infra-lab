<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 6 → 生成 "122112"，返回 ones = 3</text>

  <!-- table header -->
  <rect x="10" y="44" width="580" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="40"  y="62" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">步骤</text>
  <text x="90"  y="62" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">head</text>
  <text x="140" y="62" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">cnt</text>
  <text x="207" y="62" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">val</text>
  <text x="270" y="62" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">写入</text>
  <text x="395" y="62" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">写入后 s</text>
  <text x="515" y="62" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ones</text>
  <text x="560" y="62" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">tail</text>

  <!-- column separators -->
  <path d="M 70 44 L 70 72 M 110 44 L 110 72 M 170 44 L 170 72 M 244 44 L 244 72 M 546 44 L 546 72 M 534 44 L 534 72" stroke="#ccc" stroke-width="1" fill="none"/>

  <!-- Row 0: init -->
  <rect x="10" y="74" width="580" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40"  y="94" text-anchor="middle" font-size="10.5" fill="#888">初始</text>
  <text x="90"  y="94" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="140" y="94" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="207" y="94" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="270" y="94" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="395" y="94" text-anchor="middle" font-size="11" fill="#555">[1, 2, 2]</text>
  <text x="515" y="94" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="560" y="94" text-anchor="middle" font-size="11" fill="#555">3</text>

  <!-- Row 1: group 3 -->
  <rect x="10" y="108" width="580" height="32" fill="#fffceb" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40"  y="128" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">① 第3组</text>
  <text x="90"  y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="140" y="128" text-anchor="middle" font-size="10" fill="#555">s[2]=2</text>
  <text x="207" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3−2=1</text>
  <text x="270" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 1</text>
  <text x="395" y="128" text-anchor="middle" font-size="11" fill="#555">[1, 2, 2, <tspan fill="#d6a040" font-weight="bold">1, 1</tspan>]</text>
  <text x="515" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="560" y="128" text-anchor="middle" font-size="11" fill="#555">5</text>

  <!-- Row 2: group 4 -->
  <rect x="10" y="142" width="580" height="32" fill="#e8f0fe" stroke="#ddd" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
  <text x="40"  y="162" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">② 第4组</text>
  <text x="90"  y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="140" y="162" text-anchor="middle" font-size="10" fill="#555">s[3]=1</text>
  <text x="207" y="162" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3−1=2</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="395" y="162" text-anchor="middle" font-size="11" fill="#555">[1, 2, 2, 1, 1, <tspan fill="#446688" font-weight="bold">2</tspan>]</text>
  <text x="515" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="560" y="162" text-anchor="middle" font-size="11" fill="#555">6</text>

  <!-- Row 3: stop -->
  <rect x="10" y="176" width="580" height="32" fill="#fce4ec" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40"  y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">停止</text>
  <text x="90"  y="196" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="140" y="196" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="207" y="196" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="270" y="196" text-anchor="middle" font-size="9.5" fill="#b85450">tail=6</text>
  <text x="395" y="196" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">tail ≥ n → 终止</text>
  <text x="515" y="196" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="560" y="196" text-anchor="middle" font-size="10.5" fill="#888">—</text>

  <!-- Row 4: return -->
  <rect x="10" y="210" width="580" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40"  y="230" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="90"  y="230" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="140" y="230" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="207" y="230" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="270" y="230" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="395" y="230" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">前 6 位 "122112"</text>
  <text x="515" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="560" y="230" text-anchor="middle" font-size="10.5" fill="#888">—</text>

  <!-- footer notes -->
  <rect x="10" y="256" width="580" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="24" y="276" font-size="11" fill="#d6a040" font-weight="bold">★ 自指直观体现：</text>
  <text x="24" y="292" font-size="10.5" fill="#555">• 步骤①读 s[2]=2 写出两个 '1'；步骤②读 s[3]=1 写出一个 '2'。读出的计数 2, 1 正是 S 自第 2 位起的片段</text>
  <text x="24" y="306" font-size="10.5" fill="#555">• 组值交替：第3组 val=1（翻第2组的 2），第4组 val=2（翻第3组的 1）</text>

  <!-- result -->
  <rect x="10" y="324" width="580" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="345" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"122112" 中 '1' 出现在第 1、4、5 位 → 共 3 个 ✓</text>
</svg>
