<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：峰值互不相邻，代价彼此独立 —— 环上独立集选取</text>

  <!-- circular array: 6 nodes around center (140,150), r=86 -->
  <text x="140" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">环形数组 nums（n = 6）</text>
  <g filter="url(#rough2)">
    <!-- cycle edges -->
    <path d="M 140 64 L 140 78" stroke="#446688" stroke-width="1.3" marker-end="url(#arrB)" opacity="0.6"/>
    <path d="M 214.5 108 L 205 118" stroke="#446688" stroke-width="1.3" marker-end="url(#arrB)" opacity="0.6"/>
    <path d="M 214.5 193 L 205 183" stroke="#446688" stroke-width="1.3" marker-end="url(#arrB)" opacity="0.6"/>
    <path d="M 140 237 L 140 223" stroke="#446688" stroke-width="1.3" marker-end="url(#arrB)" opacity="0.6"/>
    <path d="M 65.5 193 L 75 183" stroke="#446688" stroke-width="1.3" marker-end="url(#arrB)" opacity="0.6"/>
    <path d="M 65.5 108 L 75 118" stroke="#446688" stroke-width="1.3" marker-end="url(#arrB)" opacity="0.6"/>
    <!-- nodes: value / index label -->
    <circle cx="140" cy="56" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="140" y="52" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">2</text>
    <text x="140" y="64" text-anchor="middle" font-size="7.5" fill="#8a3030">idx0</text>
    <circle cx="214" cy="103" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="214" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <text x="214" y="111" text-anchor="middle" font-size="7.5" fill="#666">idx1</text>
    <circle cx="214" cy="198" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="214" y="194" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold">2</text>
    <text x="214" y="206" text-anchor="middle" font-size="7.5" fill="#2a5a1e">idx2 峰✓</text>
    <circle cx="140" cy="245" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="140" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <text x="140" y="253" text-anchor="middle" font-size="7.5" fill="#666">idx3</text>
    <circle cx="66" cy="198" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="66" y="194" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold">3</text>
    <text x="66" y="206" text-anchor="middle" font-size="7.5" fill="#2a5a1e">idx4 峰✓</text>
    <circle cx="66" cy="103" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="66" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <text x="66" y="111" text-anchor="middle" font-size="7.5" fill="#666">idx5</text>
  </g>
  <text x="140" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">峰值集合 =</text>
  <text x="140" y="163" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">环上独立集</text>

  <!-- adjacent contradiction note -->
  <rect x="30" y="278" width="222" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141" y="296" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold" filter="url(#rough2)">① 相邻不能同为峰</text>
  <text x="141" y="311" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">i 峰 ⟹ nums[i] &gt; nums[i+1]</text>
  <text x="141" y="325" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">i+1 峰 ⟹ nums[i+1] &gt; nums[i] —— 矛盾！</text>

  <!-- independent set cap note -->
  <rect x="268" y="278" width="222" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="296" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">② 峰值个数 ≤ ⌊n/2⌋</text>
  <text x="379" y="311" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">环上独立集至多隔一个选一个</text>
  <text x="379" y="325" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">k &gt; ⌊n/2⌋ ⟹ 直接返回 −1</text>

  <!-- cost formula box -->
  <rect x="30" y="345" width="222" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141" y="363" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 代价独立可预算</text>
  <text x="141" y="380" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">cost(i) = max(0, max(左邻,右邻)+1−nums[i])</text>
  <text x="141" y="395" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">邻居永不被抬高（峰的邻居必非峰）</text>
  <text x="141" y="409" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">例：idx5 邻 3 与 2，自身 2 ⟹ 抬到 4，花 2</text>

  <!-- reduction box -->
  <rect x="268" y="345" width="222" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="363" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">④ 问题等价转化</text>
  <text x="379" y="380" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">环上选恰好 k 个互不相邻下标</text>
  <text x="379" y="395" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">最小化 Σ cost(i)</text>
  <text x="379" y="409" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">环 ⟹ 按「下标 0 是否为峰」拆两条链</text>

  <!-- arrow from circle area to boxes -->
  <path d="M 260 140 L 300 140" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)" opacity="0.7"/>

  <!-- right side: chain split mini-diagram -->
  <text x="388" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">拆环为链：看下标 0</text>
  <g filter="url(#rough2)">
    <!-- case A: 0 not peak -->
    <rect x="292" y="66" width="192" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="388" y="82" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">情况 A：0 不是峰</text>
    <rect x="304" y="90" width="26" height="20" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="317" y="104" text-anchor="middle" font-size="8.5" fill="#999">✕0</text>
    <rect x="334" y="90" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="347" y="104" text-anchor="middle" font-size="8.5" fill="#2a5a1e">1</text>
    <rect x="364" y="90" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="377" y="104" text-anchor="middle" font-size="8.5" fill="#2a5a1e">…</text>
    <rect x="394" y="90" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="407" y="104" text-anchor="middle" font-size="8.5" fill="#2a5a1e">n−1</text>
    <text x="448" y="104" text-anchor="middle" font-size="8" fill="#555">链</text>
    <text x="388" y="120" text-anchor="middle" font-size="8.5" fill="#555">链 1..n−1 恰选 k 个</text>
    <!-- case B: 0 is peak -->
    <rect x="292" y="136" width="192" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="388" y="152" text-anchor="middle" font-size="9.5" fill="#8a3030" font-weight="bold">情况 B：0 是峰（先付 cost[0]）</text>
    <rect x="304" y="160" width="26" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="317" y="174" text-anchor="middle" font-size="8.5" fill="#8a3030" font-weight="bold">0✓</text>
    <rect x="334" y="160" width="26" height="20" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="347" y="174" text-anchor="middle" font-size="8.5" fill="#999">✕1</text>
    <rect x="364" y="160" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="377" y="174" text-anchor="middle" font-size="8.5" fill="#2a5a1e">2</text>
    <rect x="394" y="160" width="26" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="407" y="174" text-anchor="middle" font-size="8.5" fill="#2a5a1e">n−2</text>
    <rect x="424" y="160" width="26" height="20" rx="3" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="437" y="174" text-anchor="middle" font-size="8.5" fill="#999">✕n−1</text>
    <text x="388" y="190" text-anchor="middle" font-size="8.5" fill="#555">链 2..n−2 恰选 k−1 个</text>
  </g>
  <text x="388" y="212" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">0 与 n−1 环上相邻 ⟹ 不能同时为峰，两情况覆盖一切</text>

  <!-- right side: dp transition -->
  <rect x="292" y="222" width="192" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="388" y="239" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">链上 DP（选/不选）</text>
  <text x="388" y="255" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">dp[i][j] = min(dp[i−1][j],</text>
  <text x="388" y="264" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">              dp[i−2][j−1] + cost(i))</text>
</svg>
