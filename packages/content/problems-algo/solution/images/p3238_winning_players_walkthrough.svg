<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐条计数 → 逐玩家判定（示例 1），附示例 2/3</text>

  <!-- 左：pick 记录 -->
  <rect x="20" y="44" width="145" height="178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="92" y="64" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">pick 记录（示例 1）</text>

  <rect x="32" y="74" width="120" height="18" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="87" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0, 0]  玩家0 ← 色0</text>

  <rect x="32" y="96" width="120" height="18" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="109" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1, 0]  玩家1 ← 色0</text>

  <rect x="32" y="118" width="120" height="18" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="131" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1, 0]  玩家1 ← 色0</text>

  <rect x="32" y="140" width="120" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="92" y="153" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2, 1]  玩家2 ← 色1</text>

  <rect x="32" y="162" width="120" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="92" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2, 1]  玩家2 ← 色1</text>

  <rect x="32" y="184" width="120" height="18" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="197" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2, 0]  玩家2 ← 色0</text>

  <path d="M 167 130 L 183 130" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="175" y="122" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">计数</text>

  <!-- 右：计数与判定 -->
  <rect x="190" y="44" width="310" height="178" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="345" y="64" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">计数表与判定（绿 = 胜，红 = 败）</text>

  <rect x="202" y="74" width="286" height="20" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="232" y="88" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">玩家</text>
  <text x="289" y="88" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">色 0</text>
  <text x="344" y="88" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">色 1</text>
  <text x="399" y="88" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行 max</text>
  <text x="457" y="88" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <rect x="202" y="94" width="286" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="232" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="289" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="344" y="110" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="399" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="457" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">胜 ✓</text>

  <rect x="202" y="118" width="286" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="232" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="289" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="344" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="399" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="457" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">胜 ✓</text>

  <rect x="202" y="142" width="286" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="232" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="289" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="344" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="399" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="457" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">败 ✗</text>

  <rect x="202" y="166" width="286" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="232" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="289" y="182" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="344" y="182" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <text x="399" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="457" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">败 ✗</text>

  <text x="345" y="210" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">玩家 2 总球数 3 &gt; 2 却败：单色最大仅 2（严格大于不成立）</text>

  <!-- 示例 2 -->
  <rect x="20" y="238" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例 2：玩家 1 四色各 1 个球，单色 max = 1，门槛 &gt; 1 不成立 → 0 个胜利玩家</text>

  <!-- 示例 3 -->
  <rect x="20" y="284" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">示例 3：玩家 2 独揽 3 个色 4 球，3 &gt; 2 达标 → 仅玩家 2 胜利 → 1</text>

  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">一句话：先按（玩家, 颜色）分组计数，再拿单色计数与玩家编号比大小</text>
</svg>
