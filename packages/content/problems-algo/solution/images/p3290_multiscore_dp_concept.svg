<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按下标顺序匹配 = 天然的 4 阶段决策</text>

  <!-- a 数组 -->
  <text x="100" y="61" text-anchor="end" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">a =</text>
  <rect x="112" y="42" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="61" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="168" y="42" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="191" y="61" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="224" y="42" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="247" y="61" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="280" y="42" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="303" y="61" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 左侧注记：无后效性 -->
  <rect x="18" y="96" width="92" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="64" y="112" text-anchor="middle" font-size="9" fill="#3a5f30" filter="url(#rough2)">前面具体选了</text>
  <text x="64" y="125" text-anchor="middle" font-size="9" fill="#3a5f30" filter="url(#rough2)">哪些不重要，</text>
  <text x="64" y="138" text-anchor="middle" font-size="9" fill="#3a5f30" filter="url(#rough2)">后续只依赖</text>
  <text x="64" y="151" text-anchor="middle" font-size="9" fill="#3a5f30" filter="url(#rough2)">「最后一个下标」</text>

  <!-- 右侧注记：阶段化 -->
  <rect x="368" y="86" width="136" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="436" y="102" text-anchor="middle" font-size="9.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">下标严格递增：</text>
  <text x="436" y="116" text-anchor="middle" font-size="9" fill="#2c4a66" filter="url(#rough2)">先配 a[0]，再在</text>
  <text x="436" y="129" text-anchor="middle" font-size="9" fill="#2c4a66" filter="url(#rough2)">更右边配 a[1]……</text>
  <text x="436" y="142" text-anchor="middle" font-size="9" fill="#2c4a66" filter="url(#rough2)">4 个阶段逐个决策</text>

  <!-- 匹配连线 -->
  <path d="M 135 74 C 120 140, 112 190, 110 240" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 191 74 C 178 140, 168 190, 162 240" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 247 74 C 236 140, 226 190, 214 240" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 303 74 C 322 150, 350 190, 370 240" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="130" y="160" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3×2</text>
  <text x="208" y="108" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2×(−6)</text>
  <text x="242" y="202" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5×4</text>
  <text x="338" y="118" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">6×2</text>

  <!-- b 数组 -->
  <text x="76" y="265" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">b =</text>
  <rect x="88" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="265" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="140" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162" y="265" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">−6</text>
  <rect x="192" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="265" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="244" y="244" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="265" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">−5</text>
  <rect x="296" y="244" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="265" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">−3</text>
  <rect x="348" y="244" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="265" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="400" y="244" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="265" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">−7</text>

  <text x="110" y="288" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="162" y="288" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="214" y="288" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="266" y="288" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="318" y="288" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="370" y="288" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="422" y="288" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">6</text>

  <!-- 得分公式 -->
  <rect x="70" y="296" width="380" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">得分 = 3×2 + 2×(−6) + 5×4 + 6×2 = 26</text>

  <!-- dp 定义 -->
  <rect x="32" y="328" width="456" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#3a5f30" filter="url(#rough2)">dp[k]：a[0..k] 已按下标递增配好时的最大得分 ← dp[k−1] + a[k]·x</text>
</svg>
