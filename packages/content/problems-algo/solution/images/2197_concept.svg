<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e6e2e"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#fdfcf7"/>

  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：栈 + 贪心左合并——新元素逐层吞噬非互质栈顶</text>
  <path d="M 220 42 Q 460 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1: x=2 到达，检查 GCD ===== -->
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 新元素 x=2 到达，检查 GCD(栈顶 6, x)</text>

  <g filter="url(#sk)"><rect x="60" y="92" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="88" y="116" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">12</text>
  <g filter="url(#sk)"><rect x="130" y="92" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="158" y="116" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">7</text>
  <g filter="url(#sk)"><rect x="200" y="92" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="228" y="116" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">6</text>
  <text x="88" y="148" text-anchor="middle" font-size="10" fill="#888">底</text>
  <text x="228" y="148" text-anchor="middle" font-size="10" fill="#888">栈顶</text>

  <g filter="url(#sk)"><rect x="310" y="92" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="338" y="116" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="338" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">x=2</text>

  <path d="M 310 112 L 262 112" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="420" y="92" width="220" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="530" y="112" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">GCD(6, 2) = 2 &gt; 1</text>
  <text x="530" y="126" text-anchor="middle" font-size="10" fill="#2e6e2e">非互质 → 需要合并</text>

  <!-- ===== Step 2: 弹出 6，x=LCM(6,2)=6 ===== -->
  <text x="40" y="178" font-size="13" font-weight="bold" fill="#b85450">② 弹出栈顶 6，x = LCM(6, 2) = 6，继续检查新栈顶 7（级联）</text>

  <g filter="url(#sk)"><rect x="60" y="192" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="88" y="216" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">12</text>
  <g filter="url(#sk)"><rect x="130" y="192" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="158" y="216" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">7</text>

  <g filter="url(#sk)"><rect x="200" y="192" width="56" height="40" rx="4" fill="#eee" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/></g>
  <text x="228" y="216" text-anchor="middle" font-size="14" fill="#aaa">6</text>
  <text x="228" y="248" text-anchor="middle" font-size="10" fill="#b85450">已弹出</text>

  <g filter="url(#sk)"><rect x="310" y="192" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="338" y="216" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <text x="338" y="248" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">x=LCM=6</text>

  <path d="M 310 212 L 192 212" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="420" y="192" width="220" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="530" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">GCD(7, 6) = 1</text>
  <text x="530" y="226" text-anchor="middle" font-size="10" fill="#b85450">互质 → 停止级联</text>

  <!-- ===== Step 3: 压入 x=6 ===== -->
  <text x="40" y="278" font-size="13" font-weight="bold" fill="#2e6e2e">③ 遇到互质边界 → 停止，压入 x=6，栈 = [12, 7, 6]</text>

  <g filter="url(#sk)"><rect x="60" y="292" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="88" y="316" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">12</text>
  <g filter="url(#sk)"><rect x="130" y="292" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="158" y="316" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">7</text>
  <g filter="url(#sk)"><rect x="200" y="292" width="56" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="228" y="316" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">6</text>
  <text x="228" y="348" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">压入</text>

  <!-- ===== Key Insight Box ===== -->
  <g filter="url(#sk)"><rect x="40" y="370" width="840" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="460" y="394" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">为什么贪心左合并是正确的？</text>

  <text x="60" y="420" font-size="12" fill="#444">• LCM(a, b) 的质因子集 = prime(a) ∪ prime(b) ——合并后的 LCM 包含两数的全部质因子</text>
  <text x="60" y="442" font-size="12" fill="#444">• 推论：若 c 与 a 或 b 非互质，则 c 与 LCM(a, b) 也非互质 ——合并只增不减非互质机会</text>
  <text x="60" y="464" font-size="12" fill="#444">• 因此：尽早合并不会丢失未来合并机会（反而可能创造更多） → 替换顺序不影响最终结果</text>
  <text x="60" y="486" font-size="12" fill="#444">• 栈的 while 循环正是利用这一点：新元素 x 贪心吞噬所有非互质栈顶，直到遇到互质边界</text>

  <text x="60" y="512" font-size="11" fill="#888" font-style="italic">每个最终元素 = 原数组一个极大连续段的 LCM，段间以「互质边界」分隔</text>
</svg>
