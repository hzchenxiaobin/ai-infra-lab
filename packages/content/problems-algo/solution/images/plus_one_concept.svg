<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：末尾连续 9 全变 0，首个非 9 位 +1，进位为 0 即停</text>

  <!-- Original row label -->
  <text x="112" y="76" font-size="12" fill="#888">原数组</text>

  <!-- Original digits [1, 2, 9, 9] -->
  <rect x="180" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="232" y="56" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="284" y="56" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="306" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="336" y="56" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="358" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>

  <!-- +1 annotation at last digit -->
  <text x="358" y="44" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <path d="M 358 46 L 358 52" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- carry arrows going leftward with annotations -->
  <text x="358" y="108" text-anchor="middle" font-size="10" fill="#b85450">9+1=10</text>
  <text x="358" y="120" text-anchor="middle" font-size="10" fill="#b85450">写 0，进位 1</text>
  <path d="M 330 110 Q 320 124 308 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="306" y="108" text-anchor="middle" font-size="10" fill="#b85450">9+1=10</text>
  <path d="M 278 110 Q 268 124 256 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="254" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2+1=3</text>
  <text x="254" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">进位 0，停止</text>
  <path d="M 254 124 L 254 128" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result row label -->
  <text x="112" y="172" font-size="12" fill="#888">结果</text>

  <!-- Result digits [1, 3, 0, 0] -->
  <rect x="180" y="152" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="174" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="232" y="152" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="174" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="284" y="152" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="174" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="336" y="152" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="174" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <text x="306" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a">绿色 = 发生变化的位</text>

  <!-- all-9 special case box -->
  <rect x="60" y="220" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">特例：全部为 9（如 [9, 9, 9]）</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#666">每位都进位 → 循环结束 carry 仍为 1 → 首位补 1 → [1, 0, 0, 0]</text>

  <!-- early stop box -->
  <rect x="60" y="290" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">进位变 0 即提前停止，无需扫描更高位</text>

  <!-- insight box -->
  <rect x="60" y="336" width="440" height="20" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#888">本质：+1 只影响末尾一段连续的 9，等价于把这段 9 置 0、前一位 +1</text>
</svg>
