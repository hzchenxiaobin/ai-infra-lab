<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="352" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">强数组 = 二进制置位集合，连乘 = 指数连加</text>

  <!-- 13 的二进制拆分 -->
  <text x="24" y="70" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">13 =</text>
  <rect x="64" y="48" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="79" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="98" y="48" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="48" width="30" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="69" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="166" y="48" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="79" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">2³</text>
  <text x="113" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">2²</text>
  <text x="147" y="94" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">2¹</text>
  <text x="181" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">2⁰</text>

  <path d="M 206 64 L 228 64" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="234" y="48" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="278" y="48" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="322" y="48" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="298" y="42" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">强数组（升序）</text>
  <text x="298" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">置位 {0, 2, 3}</text>

  <text x="380" y="58" font-size="10.5" fill="#b85450" filter="url(#rough2)">同幂两次可合并进位</text>
  <text x="380" y="76" font-size="10.5" fill="#b85450" filter="url(#rough2)">⇒ 最短 ⇒ 每幂至多一次</text>
  <text x="380" y="94" font-size="10.5" fill="#b85450" filter="url(#rough2)">⇒ 强数组 = 二进制置位</text>

  <!-- big_nums 条带 -->
  <text x="26" y="120" font-size="12" fill="#555" filter="url(#rough2)">big_nums ＝ 1..8 的强数组依次连接（0 下标，格下小字＝指数 e）</text>

  <text x="44" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="80" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="116" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="152" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="188" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="224" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="260" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="296" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="332" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">8</text>
  <text x="368" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">9</text>
  <text x="404" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">10</text>
  <text x="440" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">11</text>
  <text x="476" y="136" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">12</text>

  <rect x="26" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="62" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="98" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="170" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="206" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="242" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="278" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="314" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="350" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="386" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="422" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="458" y="140" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>

  <text x="44" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="80" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="116" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="152" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="188" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="224" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="260" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="296" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="332" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="368" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="404" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="440" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="476" y="182" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>

  <!-- 源数字分组括号 -->
  <path d="M 28 190 L 60 190" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="44" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <path d="M 64 190 L 96 190" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <path d="M 100 190 L 172 190" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="136" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <path d="M 172 190 L 204 190" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="188" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <path d="M 208 190 L 280 190" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="244" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <path d="M 280 190 L 352 190" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <path d="M 352 190 L 460 190" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <path d="M 460 190 L 492 190" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="476" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">8</text>

  <!-- 查询高亮 -->
  <rect x="95" y="134" width="150" height="42" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">查询 [2, 5]：元素 [1,2,4,1] → E = 0+1+2+0 = 3 → 乘积 = 2³ = 8</text>

  <rect x="25" y="242" width="470" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">big_nums 的元素全是 2 的幂 ⇒ 区间乘积 = 2^(区间指数和 E)</text>
  <text x="260" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">乘法坍缩成加法：E = S(to+1) − S(from)，前缀差分</text>
  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">answer = 2^E mod m（快速幂）</text>
  <text x="260" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">10¹⁵ 级的隐式数组 → O(log n) 可计算的统计量</text>
</svg>
