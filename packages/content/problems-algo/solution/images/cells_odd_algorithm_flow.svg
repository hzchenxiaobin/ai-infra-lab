<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：翻转标志 → 统计奇偶 → 组合公式</text>

  <!-- Step 1: Init -->
  <rect x="160" y="44" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 初始化</text>
  <text x="270" y="77" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">rowOdd[m]=false, colOdd[n]=false</text>
  <path d="M 270 86 L 270 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: Loop diamond -->
  <polygon points="270,104 380,140 270,176 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 遍历 indices</text>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#666">还有 [ri,ci]?</text>
  <text x="270" y="164" text-anchor="middle" font-size="10" fill="#666">是 ↓ / 否 →</text>

  <!-- Loop body (left) -->
  <path d="M 160 140 L 90 140" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" transform="rotate(180,125,140)"/>
  <text x="120" y="132" text-anchor="middle" font-size="9" fill="#d6a040">是</text>

  <rect x="30" y="120" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="138" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">翻转奇偶标志</text>
  <text x="120" y="154" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">rowOdd[ri] = !rowOdd[ri]</text>
  <text x="120" y="166" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">colOdd[ci] = !colOdd[ci]</text>

  <!-- Loop back arrow -->
  <path d="M 120 120 Q 120 100 200 100 Q 270 100 270 104" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- No branch (down) -->
  <text x="290" y="186" text-anchor="middle" font-size="9" fill="#d6a040">否</text>
  <path d="M 270 176 L 270 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: Count -->
  <rect x="150" y="200" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 统计奇数行/列数</text>
  <text x="270" y="234" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">oddR = Σ rowOdd,  oddC = Σ colOdd</text>
  <path d="M 270 246 L 270 260" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: Formula -->
  <rect x="90" y="264" width="360" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 套组合公式</text>
  <text x="270" y="304" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" font-family="monospace">ans = oddR×(n−oddC) + (m−oddR)×oddC</text>
  <path d="M 270 318 L 270 332" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: Return -->
  <rect x="190" y="336" width="160" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="18" filter="url(#rough2)"/>
  <text x="270" y="359" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 返回 ans</text>

  <!-- Complexity note -->
  <rect x="28" y="380" width="484" height="14" fill="none" stroke="none"/>
  <text x="270" y="392" text-anchor="middle" font-size="10" fill="#888">时间 O(k+m+n) · 空间 O(m+n) · k = indices.length</text>
</svg>
