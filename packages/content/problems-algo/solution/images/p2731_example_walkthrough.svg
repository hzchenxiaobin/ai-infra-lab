<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：nums=[−2,0,2], s="RLL", d=3</text>

  <!-- Step 1: compute positions -->
  <text x="30" y="52" font-size="12" fill="#446688" font-weight="bold">Step 1  计算终点（忽略碰撞）</text>

  <rect x="30" y="60" width="460" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="80" font-size="11" fill="#444">i=0:  −2 + 3 = 1      (R →)</text>
  <text x="44" y="96" font-size="11" fill="#444">i=1:   0 − 3 = −3     (L ←)</text>
  <text x="44" y="112" font-size="11" fill="#444">i=2:   2 − 3 = −1     (L ←)</text>
  <text x="300" y="96" font-size="11" fill="#446688" font-weight="bold">pos = [1, −3, −1]</text>

  <path d="M 260 120 L 260 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <text x="30" y="156" font-size="12" fill="#d6a040" font-weight="bold">Step 2  排序</text>
  <rect x="30" y="164" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="187" font-size="11" fill="#444">sort →  pos = [−3, −1, 1]</text>

  <!-- number line with sorted positions -->
  <line x1="120" y1="186" x2="460" y2="186" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="180" cy="186" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="190" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">0</text>
  <circle cx="300" cy="186" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">1</text>
  <circle cx="420" cy="186" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="190" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">2</text>
  <text x="180" y="178" text-anchor="middle" font-size="8" fill="#888">−3</text>
  <text x="300" y="178" text-anchor="middle" font-size="8" fill="#888">−1</text>
  <text x="420" y="178" text-anchor="middle" font-size="8" fill="#888">1</text>

  <path d="M 260 202 L 260 220" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: prefix sum table -->
  <text x="30" y="238" font-size="12" fill="#4a7a3a" font-weight="bold">Step 3  前缀和：ans = Σ ( i·pos[i] − prefix )</text>

  <!-- table header -->
  <rect x="30" y="248" width="460" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="263" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i</text>
  <text x="130" y="263" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">pos[i]</text>
  <text x="210" y="263" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i·pos[i]</text>
  <text x="300" y="263" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">prefix(前缀和)</text>
  <text x="410" y="263" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">增量 = i·p−pref</text>

  <!-- row 0 -->
  <rect x="30" y="272" width="460" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="288" text-anchor="middle" font-size="10" fill="#444">0</text>
  <text x="130" y="288" text-anchor="middle" font-size="10" fill="#444">−3</text>
  <text x="210" y="288" text-anchor="middle" font-size="10" fill="#444">0</text>
  <text x="300" y="288" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="410" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- row 1 -->
  <rect x="30" y="298" width="460" height="24" fill="#fffde7" stroke="#bbb" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="314" text-anchor="middle" font-size="10" fill="#444">1</text>
  <text x="130" y="314" text-anchor="middle" font-size="10" fill="#444">−1</text>
  <text x="210" y="314" text-anchor="middle" font-size="10" fill="#444">−1</text>
  <text x="300" y="314" text-anchor="middle" font-size="10" fill="#444">−3</text>
  <text x="410" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">+2</text>

  <!-- row 2 -->
  <rect x="30" y="324" width="460" height="24" fill="#fffde7" stroke="#bbb" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="340" text-anchor="middle" font-size="10" fill="#444">2</text>
  <text x="130" y="340" text-anchor="middle" font-size="10" fill="#444">1</text>
  <text x="210" y="340" text-anchor="middle" font-size="10" fill="#444">2</text>
  <text x="300" y="340" text-anchor="middle" font-size="10" fill="#444">−4</text>
  <text x="410" y="340" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">+6</text>

  <!-- result -->
  <rect x="120" y="360" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 0 + 2 + 6 = 8 ✓</text>
</svg>
