<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：[7,52,2,4] → 596</text>

  <!-- table outline -->
  <g filter="url(#rough2)">
    <rect x="40" y="55" width="450" height="180" fill="none" stroke="#446688" stroke-width="1.5" rx="4"/>
    <!-- column dividers -->
    <line x1="105" y1="55" x2="105" y2="235" stroke="#446688" stroke-width="1"/>
    <line x1="195" y1="55" x2="195" y2="235" stroke="#446688" stroke-width="1"/>
    <line x1="325" y1="55" x2="325" y2="235" stroke="#446688" stroke-width="1"/>
    <line x1="410" y1="55" x2="410" y2="235" stroke="#446688" stroke-width="1"/>
    <!-- row dividers -->
    <line x1="40" y1="95" x2="490" y2="95" stroke="#446688" stroke-width="1"/>
    <line x1="40" y1="140" x2="490" y2="140" stroke="#446688" stroke-width="1"/>
    <line x1="40" y1="188" x2="490" y2="188" stroke="#446688" stroke-width="1"/>
  </g>

  <!-- header fill -->
  <rect x="40" y="55" width="450" height="40" fill="#e8f0fe" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)" text-anchor="middle">
    <text x="72" y="80">步骤</text>
    <text x="150" y="80">配对 (a,b)</text>
    <text x="260" y="80">拼接 a·10^d(b)+b</text>
    <text x="367" y="80">删后 nums</text>
    <text x="450" y="80">串联值</text>
  </g>

  <!-- row: 初始 -->
  <g font-size="12" fill="#333" filter="url(#rough2)" text-anchor="middle">
    <text x="72" y="121">初始</text>
    <text x="150" y="121">—</text>
    <text x="260" y="121">—</text>
    <text x="367" y="121">[7,52,2,4]</text>
    <text x="450" y="121" fill="#b85450">0</text>
  </g>

  <!-- row: ① -->
  <g font-size="12" fill="#333" filter="url(#rough2)" text-anchor="middle">
    <text x="72" y="166">①</text>
    <text x="150" y="166">(7, 4)</text>
    <text x="260" y="166">7×10+4 = 74</text>
    <text x="367" y="166">[52, 2]</text>
    <text x="450" y="166" fill="#b85450">74</text>
  </g>

  <!-- row: ② -->
  <g font-size="12" fill="#333" filter="url(#rough2)" text-anchor="middle">
    <text x="72" y="214">②</text>
    <text x="150" y="214">(52, 2)</text>
    <text x="260" y="214">52×10+2 = 522</text>
    <text x="367" y="214">∅</text>
    <text x="450" y="214" fill="#b85450">596</text>
  </g>

  <!-- note: example 2 odd case -->
  <rect x="40" y="260" width="450" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="282" font-size="12" fill="#333" filter="url(#rough2)">奇数长度命中 i==j 分支：</text>
  <text x="55" y="300" font-size="12" fill="#333" filter="url(#rough2)">[5,14,13,8,12] → ①5|12=512 → ②14|8=148 → ③仅剩 13 → 673</text>
  <text x="55" y="318" font-size="11" fill="#888" filter="url(#rough2)">第③步 i=j，单元素直接累加，不套拼接公式。</text>
</svg>
