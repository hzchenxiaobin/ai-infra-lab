<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 行交易 → 派生月 → 分 3 组 → 条件聚合得 3 行结果</text>

  <!-- ===== Step ①: original + month ===== -->
  <text x="160" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 派生 month 列后</text>
  <rect x="50" y="58" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="73" font-size="7.5" fill="#446688" font-weight="bold">country</text>
  <text x="120" y="73" font-size="7.5" fill="#446688" font-weight="bold">state</text>
  <text x="168" y="73" font-size="7.5" fill="#446688" font-weight="bold">amount</text>
  <text x="225" y="73" font-size="7.5" fill="#d6a040" font-weight="bold">month</text>
  <line x1="100" y1="58" x2="100" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="145" y1="58" x2="145" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="195" y1="58" x2="195" y2="80" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="50" y="80" width="220" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="92" text-anchor="middle" font-size="8" fill="#333">US</text>
  <text x="120" y="92" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">approved</text>
  <text x="168" y="92" text-anchor="middle" font-size="8" fill="#333">1000</text>
  <text x="225" y="92" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2018-12</text>

  <rect x="50" y="96" width="220" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="108" text-anchor="middle" font-size="8" fill="#333">US</text>
  <text x="120" y="108" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">declined</text>
  <text x="168" y="108" text-anchor="middle" font-size="8" fill="#333">2000</text>
  <text x="225" y="108" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2018-12</text>

  <rect x="50" y="112" width="220" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="8" fill="#333">US</text>
  <text x="120" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">approved</text>
  <text x="168" y="124" text-anchor="middle" font-size="8" fill="#333">2000</text>
  <text x="225" y="124" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2019-01</text>

  <rect x="50" y="128" width="220" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="140" text-anchor="middle" font-size="8" fill="#333">DE</text>
  <text x="120" y="140" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">approved</text>
  <text x="168" y="140" text-anchor="middle" font-size="8" fill="#333">2000</text>
  <text x="225" y="140" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2019-01</text>

  <!-- arrow down -->
  <path d="M160 150 L160 175" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="185" y="168" font-size="8" fill="#d6a040" font-weight="bold">② GROUP BY</text>

  <!-- ===== Step ②: groups ===== -->
  <text x="160" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 按 (month, country) 分成 3 组</text>

  <!-- group A -->
  <rect x="40" y="200" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="58" y="216" font-size="9" fill="#4a7a3a" font-weight="bold">组A: 2018-12 / US</text>
  <text x="58" y="232" font-size="8" fill="#333">• approved 1000</text>
  <text x="58" y="246" font-size="8" fill="#333">• declined 2000</text>

  <!-- group B -->
  <rect x="200" y="200" width="200" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="216" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">组B: 2019-01 / US</text>
  <text x="300" y="234" text-anchor="middle" font-size="8" fill="#333">• approved 2000</text>
  <text x="300" y="248" text-anchor="middle" font-size="7.5" fill="#888">(仅 1 行)</text>

  <!-- group C -->
  <rect x="370" y="200" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="216" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">组C: 2019-01 / DE</text>
  <text x="480" y="234" text-anchor="middle" font-size="8" fill="#333">• approved 2000</text>
  <text x="480" y="248" text-anchor="middle" font-size="7.5" fill="#888">(仅 1 行)</text>

  <!-- arrow down -->
  <path d="M320 262 L320 287" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="345" y="280" font-size="8" fill="#d6a040" font-weight="bold">③ 条件聚合</text>

  <!-- ===== Step ③: aggregation per group ===== -->
  <text x="320" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 每组算 4 个指标</text>

  <!-- group A result -->
  <rect x="40" y="312" width="240" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="58" y="330" font-size="9" fill="#4a7a3a" font-weight="bold">组A: 2018-12 / US</text>
  <text x="58" y="348" font-size="8.5" fill="#446688">COUNT(*) = <tspan font-weight="bold">2</tspan> 笔</text>
  <text x="58" y="362" font-size="8.5" fill="#446688">SUM(amount) = <tspan font-weight="bold">3000</tspan></text>
  <text x="58" y="378" font-size="8.5" fill="#4a7a3a">SUM(IF(app,1,0)) = <tspan font-weight="bold">1</tspan></text>
  <text x="58" y="392" font-size="8.5" fill="#4a7a3a">SUM(IF(app,amt,0)) = <tspan font-weight="bold">1000</tspan></text>

  <!-- group B result -->
  <rect x="290" y="312" width="140" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="360" y="330" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">组B: 2019-01/US</text>
  <text x="360" y="348" text-anchor="middle" font-size="8.5" fill="#446688">COUNT = <tspan font-weight="bold">1</tspan></text>
  <text x="360" y="362" text-anchor="middle" font-size="8.5" fill="#446688">SUM(amt) = <tspan font-weight="bold">2000</tspan></text>
  <text x="360" y="378" text-anchor="middle" font-size="8.5" fill="#4a7a3a">app_cnt = <tspan font-weight="bold">1</tspan></text>
  <text x="360" y="392" text-anchor="middle" font-size="8.5" fill="#4a7a3a">app_amt = <tspan font-weight="bold">2000</tspan></text>

  <!-- group C result -->
  <rect x="440" y="312" width="150" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="515" y="330" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">组C: 2019-01/DE</text>
  <text x="515" y="348" text-anchor="middle" font-size="8.5" fill="#446688">COUNT = <tspan font-weight="bold">1</tspan></text>
  <text x="515" y="362" text-anchor="middle" font-size="8.5" fill="#446688">SUM(amt) = <tspan font-weight="bold">2000</tspan></text>
  <text x="515" y="378" text-anchor="middle" font-size="8.5" fill="#4a7a3a">app_cnt = <tspan font-weight="bold">1</tspan></text>
  <text x="515" y="392" text-anchor="middle" font-size="8.5" fill="#4a7a3a">app_amt = <tspan font-weight="bold">2000</tspan></text>

  <!-- arrow down -->
  <path d="M320 408 L320 428" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Step ④: final output ===== -->
  <text x="320" y="446" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ 最终输出（3 行）</text>
  <rect x="60" y="452" width="520" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="467" font-size="7.5" fill="#446688" font-weight="bold">month</text>
  <text x="155" y="467" font-size="7.5" fill="#446688" font-weight="bold">country</text>
  <text x="215" y="467" font-size="7.5" fill="#446688" font-weight="bold">trans_cnt</text>
  <text x="280" y="467" font-size="7.5" fill="#446688" font-weight="bold">appr_cnt</text>
  <text x="355" y="467" font-size="7.5" fill="#446688" font-weight="bold">trans_amt</text>
  <text x="475" y="467" font-size="7.5" fill="#446688" font-weight="bold">appr_amt</text>

  <rect x="60" y="474" width="520" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="95" y="487" text-anchor="middle" font-size="8" fill="#333">2018-12</text>
  <text x="155" y="487" text-anchor="middle" font-size="8" fill="#333">US</text>
  <text x="215" y="487" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">2</text>
  <text x="280" y="487" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="355" y="487" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">3000</text>
  <text x="475" y="487" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1000</text>

  <rect x="60" y="492" width="520" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="95" y="505" text-anchor="middle" font-size="8" fill="#333">2019-01</text>
  <text x="155" y="505" text-anchor="middle" font-size="8" fill="#333">US</text>
  <text x="215" y="505" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">1</text>
  <text x="280" y="505" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="355" y="505" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">2000</text>
  <text x="475" y="505" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2000</text>

  <rect x="60" y="510" width="520" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="95" y="523" text-anchor="middle" font-size="8" fill="#333">2019-01</text>
  <text x="155" y="523" text-anchor="middle" font-size="8" fill="#333">DE</text>
  <text x="215" y="523" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">1</text>
  <text x="280" y="523" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="355" y="523" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">2000</text>
  <text x="475" y="523" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2000</text>
</svg>
