<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1,15,7,9,2,5,10], k = 3</text>

  <!-- ===== 表头 ===== -->
  <rect x="30" y="44" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="66" y="44" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">末段(最优)</text>
  <rect x="176" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max</text>
  <rect x="226" y="44" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="63" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">计算 dp[i−len]+max×len</text>
  <rect x="376" y="44" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="411" y="63" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[i]</text>
  <rect x="446" y="44" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="501" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">说明</text>

  <!-- ===== Row i=0 ===== -->
  <rect x="30" y="74" width="36" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="90" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <rect x="66" y="74" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="90" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="176" y="74" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="201" y="90" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="226" y="74" width="150" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="90" text-anchor="middle" font-size="10.5" fill="#888">（base）</text>
  <rect x="376" y="74" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="411" y="90" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="446" y="74" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="501" y="90" text-anchor="middle" font-size="10" fill="#888">空前缀</text>

  <!-- ===== Row i=1 ===== -->
  <rect x="30" y="100" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="116" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <rect x="66" y="100" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="116" text-anchor="middle" font-size="10.5" fill="#333">[1]</text>
  <rect x="176" y="100" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="201" y="116" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="226" y="100" width="150" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="116" text-anchor="middle" font-size="10.5" fill="#333">0 + 1×1</text>
  <rect x="376" y="100" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="411" y="116" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="446" y="100" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="501" y="116" text-anchor="middle" font-size="10" fill="#888">整段为一段</text>

  <!-- ===== Row i=2 ===== -->
  <rect x="30" y="126" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="142" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="66" y="126" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="142" text-anchor="middle" font-size="10.5" fill="#333">[1,15]</text>
  <rect x="176" y="126" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="201" y="142" text-anchor="middle" font-size="10.5" fill="#333">15</text>
  <rect x="226" y="126" width="150" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="142" text-anchor="middle" font-size="10.5" fill="#333">0 + 15×2</text>
  <rect x="376" y="126" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="411" y="142" text-anchor="middle" font-size="10.5" fill="#333">30</text>
  <rect x="446" y="126" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="501" y="142" text-anchor="middle" font-size="10" fill="#888">合并优于单取</text>

  <!-- ===== Row i=3 ===== -->
  <rect x="30" y="152" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="168" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <rect x="66" y="152" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="168" text-anchor="middle" font-size="10.5" fill="#333">[1,15,7]</text>
  <rect x="176" y="152" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="201" y="168" text-anchor="middle" font-size="10.5" fill="#333">15</text>
  <rect x="226" y="152" width="150" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="168" text-anchor="middle" font-size="10.5" fill="#333">0 + 15×3</text>
  <rect x="376" y="152" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="411" y="168" text-anchor="middle" font-size="10.5" fill="#333">45</text>
  <rect x="446" y="152" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="501" y="168" text-anchor="middle" font-size="10" fill="#888">k=3 全合并</text>

  <!-- ===== Row i=4 ===== -->
  <rect x="30" y="178" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <rect x="66" y="178" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="194" text-anchor="middle" font-size="10.5" fill="#333">[9]</text>
  <rect x="176" y="178" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="201" y="194" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="226" y="178" width="150" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="194" text-anchor="middle" font-size="10.5" fill="#333">45 + 9×1</text>
  <rect x="376" y="178" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="411" y="194" text-anchor="middle" font-size="10.5" fill="#333">54</text>
  <rect x="446" y="178" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="501" y="194" text-anchor="middle" font-size="10" fill="#888">9 单独最优</text>

  <!-- ===== Row i=5 ===== -->
  <rect x="30" y="204" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="220" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">5</text>
  <rect x="66" y="204" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="220" text-anchor="middle" font-size="10.5" fill="#333">[9,2]</text>
  <rect x="176" y="204" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="201" y="220" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="226" y="204" width="150" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="220" text-anchor="middle" font-size="10.5" fill="#333">45 + 9×2</text>
  <rect x="376" y="204" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="411" y="220" text-anchor="middle" font-size="10.5" fill="#333">63</text>
  <rect x="446" y="204" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="501" y="220" text-anchor="middle" font-size="10" fill="#888">9 拉升 2</text>

  <!-- ===== Row i=6 ===== -->
  <rect x="30" y="230" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="246" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">6</text>
  <rect x="66" y="230" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="246" text-anchor="middle" font-size="10.5" fill="#333">[9,2,5]</text>
  <rect x="176" y="230" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="201" y="246" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="226" y="230" width="150" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="246" text-anchor="middle" font-size="10.5" fill="#333">45 + 9×3</text>
  <rect x="376" y="230" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="411" y="246" text-anchor="middle" font-size="10.5" fill="#333">72</text>
  <rect x="446" y="230" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="501" y="246" text-anchor="middle" font-size="10" fill="#888">9 拉升 2,5</text>

  <!-- ===== Row i=7 (KEY) ===== -->
  <rect x="30" y="256" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="48" y="272" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">7</text>
  <rect x="66" y="256" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="121" y="272" text-anchor="middle" font-size="10.5" fill="#333">[2,5,10]</text>
  <rect x="176" y="256" width="50" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="201" y="272" text-anchor="middle" font-size="10.5" fill="#333">10</text>
  <rect x="226" y="256" width="150" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="272" text-anchor="middle" font-size="10.5" fill="#333">54 + 10×3</text>
  <rect x="376" y="256" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="411" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">84 ⭐</text>
  <rect x="446" y="256" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="501" y="272" text-anchor="middle" font-size="10" fill="#888">末段接 dp[4]</text>

  <!-- ===== 结论 ===== -->
  <rect x="60" y="290" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="313" text-anchor="middle" font-size="12" fill="#333">dp[7] = 84：分隔 [1,15,7] | [9] | [2,5,10]</text>

  <rect x="60" y="332" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="357" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">变换 → [15,15,15,9,10,10,10] = 84</text>

  <!-- 示例2验证 -->
  <rect x="60" y="380" width="460" height="52" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="398" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">示例 2：arr = [1,4,1,5,7,3,6,1,9,9,3], k = 4</text>
  <text x="290" y="414" text-anchor="middle" font-size="10.5" fill="#888">末段 [9,3]：9×2 + dp[9] = 18 + 65 = 83</text>
  <text x="290" y="428" text-anchor="middle" font-size="10.5" fill="#888">答案 = 83</text>
</svg>
