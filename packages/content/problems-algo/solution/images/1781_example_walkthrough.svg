<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "aabcb"，枚举所有子串的 beauty（★ 表示 beauty&gt;0）</text>

  <!-- Header row -->
  <g font-size="12" fill="#555" font-weight="bold" text-anchor="middle">
    <rect x="44" y="56" width="56" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="72" y="74" filter="url(#rough2)">l ╲ r</text>
    <rect x="104" y="56" width="64" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="136" y="74" filter="url(#rough2)">0</text>
    <rect x="170" y="56" width="64" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="202" y="74" filter="url(#rough2)">1</text>
    <rect x="236" y="56" width="64" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="268" y="74" filter="url(#rough2)">2</text>
    <rect x="302" y="56" width="64" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="334" y="74" filter="url(#rough2)">3</text>
    <rect x="368" y="56" width="64" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="400" y="74" filter="url(#rough2)">4</text>
    <rect x="438" y="56" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="488" y="74" filter="url(#rough2)">ans 累计</text>
  </g>

  <!-- Row l=0 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="44" y="86" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="72" y="108" font-weight="bold" filter="url(#rough2)">0</text>
    <!-- r=0 "a" 0 -->
    <rect x="104" y="86" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="136" y="102" filter="url(#rough2)">a</text>
    <text x="136" y="116" fill="#888" filter="url(#rough2)">0</text>
    <!-- r=1 "aa" 0 -->
    <rect x="170" y="86" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="202" y="102" filter="url(#rough2)">aa</text>
    <text x="202" y="116" fill="#888" filter="url(#rough2)">0</text>
    <!-- r=2 "aab" 1 ★ -->
    <rect x="236" y="86" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="268" y="102" filter="url(#rough2)">aab</text>
    <text x="268" y="116" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ★</text>
    <!-- r=3 "aabc" 1 ★ -->
    <rect x="302" y="86" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="334" y="102" filter="url(#rough2)">aabc</text>
    <text x="334" y="116" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ★</text>
    <!-- r=4 "aabcb" 1 ★ -->
    <rect x="368" y="86" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="400" y="102" filter="url(#rough2)">aabcb</text>
    <text x="400" y="116" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ★</text>
    <!-- partial -->
    <rect x="438" y="86" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="488" y="108" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  </g>

  <!-- Row l=1 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="44" y="122" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="72" y="144" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="104" y="122" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="136" y="144" fill="#ccc" filter="url(#rough2)">—</text>
    <!-- r=1 "a" 0 -->
    <rect x="170" y="122" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="202" y="138" filter="url(#rough2)">a</text>
    <text x="202" y="152" fill="#888" filter="url(#rough2)">0</text>
    <!-- r=2 "ab" 0 -->
    <rect x="236" y="122" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="268" y="138" filter="url(#rough2)">ab</text>
    <text x="268" y="152" fill="#888" filter="url(#rough2)">0</text>
    <!-- r=3 "abc" 0 -->
    <rect x="302" y="122" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="334" y="138" filter="url(#rough2)">abc</text>
    <text x="334" y="152" fill="#888" filter="url(#rough2)">0</text>
    <!-- r=4 "abcb" 1 ★ -->
    <rect x="368" y="122" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="400" y="138" filter="url(#rough2)">abcb</text>
    <text x="400" y="152" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ★</text>
    <!-- partial -->
    <rect x="438" y="122" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="488" y="144" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  </g>

  <!-- Row l=2 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="44" y="158" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="72" y="180" font-weight="bold" filter="url(#rough2)">2</text>
    <rect x="104" y="158" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="136" y="180" fill="#ccc" filter="url(#rough2)">—</text>
    <rect x="170" y="158" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="202" y="180" fill="#ccc" filter="url(#rough2)">—</text>
    <!-- r=2 "b" 0 -->
    <rect x="236" y="158" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="268" y="174" filter="url(#rough2)">b</text>
    <text x="268" y="188" fill="#888" filter="url(#rough2)">0</text>
    <!-- r=3 "bc" 0 -->
    <rect x="302" y="158" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="334" y="174" filter="url(#rough2)">bc</text>
    <text x="334" y="188" fill="#888" filter="url(#rough2)">0</text>
    <!-- r=4 "bcb" 1 ★ -->
    <rect x="368" y="158" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="400" y="174" filter="url(#rough2)">bcb</text>
    <text x="400" y="188" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ★</text>
    <!-- partial -->
    <rect x="438" y="158" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="488" y="180" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  </g>

  <!-- Row l=3 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="44" y="194" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="72" y="216" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="104" y="194" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="136" y="216" fill="#ccc" filter="url(#rough2)">—</text>
    <rect x="170" y="194" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="202" y="216" fill="#ccc" filter="url(#rough2)">—</text>
    <rect x="236" y="194" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="268" y="216" fill="#ccc" filter="url(#rough2)">—</text>
    <!-- r=3 "c" 0 -->
    <rect x="302" y="194" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="334" y="210" filter="url(#rough2)">c</text>
    <text x="334" y="224" fill="#888" filter="url(#rough2)">0</text>
    <!-- r=4 "cb" 0 -->
    <rect x="368" y="194" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="400" y="210" filter="url(#rough2)">cb</text>
    <text x="400" y="224" fill="#888" filter="url(#rough2)">0</text>
    <!-- partial -->
    <rect x="438" y="194" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="488" y="216" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  </g>

  <!-- Row l=4 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="44" y="230" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="72" y="252" font-weight="bold" filter="url(#rough2)">4</text>
    <rect x="104" y="230" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="136" y="252" fill="#ccc" filter="url(#rough2)">—</text>
    <rect x="170" y="230" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="202" y="252" fill="#ccc" filter="url(#rough2)">—</text>
    <rect x="236" y="230" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="268" y="252" fill="#ccc" filter="url(#rough2)">—</text>
    <rect x="302" y="230" width="64" height="34" fill="#eee" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="334" y="252" fill="#ccc" filter="url(#rough2)">—</text>
    <!-- r=4 "b" 0 -->
    <rect x="368" y="230" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="400" y="246" filter="url(#rough2)">b</text>
    <text x="400" y="260" fill="#888" filter="url(#rough2)">0</text>
    <!-- partial -->
    <rect x="438" y="230" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="488" y="252" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  </g>

  <!-- divider -->
  <path d="M 44 276 L 538 276" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- beauty>0 substring list -->
  <text x="44" y="298" font-size="12" fill="#888" filter="url(#rough2)">beauty&gt;0 的子串（共 5 个，每个 beauty=1）：</text>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="60" y="308" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="88" y="325" filter="url(#rough2)">aab</text>
    <rect x="124" y="308" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="156" y="325" filter="url(#rough2)">aabc</text>
    <rect x="196" y="308" width="72" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="232" y="325" filter="url(#rough2)">aabcb</text>
    <rect x="276" y="308" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="308" y="325" filter="url(#rough2)">abcb</text>
    <rect x="348" y="308" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="376" y="325" filter="url(#rough2)">bcb</text>
  </g>

  <!-- final answer -->
  <rect x="400" y="304" width="138" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="469" y="326" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 5 ✓</text>

  <!-- notes -->
  <text x="44" y="360" font-size="11.5" fill="#555" filter="url(#rough2)">• 每行对应固定左端点 l，r 从 l 向右扩展，cnt 增量更新</text>
  <text x="44" y="378" font-size="11.5" fill="#555" filter="url(#rough2)">• 单字符 / 全同字符子串：max=min → beauty=0（如 "a"、"aa"）</text>
  <text x="44" y="396" font-size="11.5" fill="#555" filter="url(#rough2)">• ★ 格即子串出现 ≥2 种字母且频次不均：beauty = max − min &gt; 0</text>
  <text x="44" y="414" font-size="11.5" fill="#555" filter="url(#rough2)">• 5 个 ★ 各贡献 1，合计 <tspan fill="#b85450" font-weight="bold">5</tspan>，与示例 1 一致</text>
</svg>
