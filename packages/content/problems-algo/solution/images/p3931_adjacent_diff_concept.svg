<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：n−1 个相邻对独立合取——一处违规，整体 false</text>

  <!-- 面板一：132 → true -->
  <g filter="url(#rough2)">
    <rect x="20" y="38" width="250" height="170" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="145" y="58" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">s = "132" → true</text>

    <rect x="48" y="70" width="42" height="36" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="69" y="93" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="124" y="70" width="42" height="36" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="145" y="93" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="200" y="70" width="42" height="36" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="221" y="93" text-anchor="middle" font-size="14" fill="#333">2</text>

    <path d="M92,88 L120,88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M168,88 L196,88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <text x="107" y="128" text-anchor="middle" font-size="10.5" fill="#2f5d24">|1−3|=2 ✓</text>
    <text x="183" y="128" text-anchor="middle" font-size="10.5" fill="#2f5d24">|3−2|=1 ✓</text>
    <text x="145" y="150" text-anchor="middle" font-size="9.5" fill="#4a6b5a">两个差都 ≤ 2（=2 也算「至多」）</text>
    <text x="145" y="184" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">→ true</text>
  </g>

  <!-- 面板二：129 → false -->
  <g filter="url(#rough2)">
    <rect x="290" y="38" width="250" height="170" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="415" y="58" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">s = "129" → false</text>

    <rect x="318" y="70" width="42" height="36" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.5"/>
    <text x="339" y="93" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="394" y="70" width="42" height="36" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.5"/>
    <text x="415" y="93" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="470" y="70" width="42" height="36" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.5"/>
    <text x="491" y="93" text-anchor="middle" font-size="14" fill="#333">9</text>

    <path d="M362,88 L390,88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M438,88 L466,88" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrRed)"/>

    <text x="377" y="128" text-anchor="middle" font-size="10.5" fill="#2f5d24">|1−2|=1 ✓</text>
    <text x="453" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|2−9|=7 ✗</text>
    <text x="415" y="150" text-anchor="middle" font-size="9.5" fill="#8a3030">差 7 &gt; 2，一票否决</text>
    <text x="415" y="184" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">→ false</text>
  </g>

  <!-- 判定规则 -->
  <g filter="url(#rough2)">
    <rect x="20" y="222" width="520" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="244" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">判定规则：answer = ⋀ |s[i+1] − s[i]| ≤ 2（i = 0..n−2，共 n−1 对，彼此独立）</text>
    <text x="280" y="262" text-anchor="middle" font-size="10" fill="#33506b">AND 白送两条性质：一处违规 ⇒ 立即 false（短路提前终止）；判定顺序任意（合取可交换）</text>
    <text x="280" y="278" text-anchor="middle" font-size="10" fill="#33506b">字符差即数值差：'9' − '2' = 7（'0'–'9' 编码连续），char 相减一步到位，免 int() 物化</text>
  </g>

  <!-- 误区警示 -->
  <g filter="url(#rough2)">
    <rect x="20" y="296" width="520" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">⚠️ 审题双坑：①「相邻对」≠「任意对」——s = "135" 相邻差 2、2 全达标 → true</text>
    <text x="280" y="337" text-anchor="middle" font-size="10" fill="#8a6d1a">但任意对 |1−5| = 4 &gt; 2：误按 C(n,2) 任意对判，会把合法串误杀成 false</text>
    <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">②「至多 2」含等号：|d| = 2 恰好合法——示例 1 的 |1−3| = 2 正是踩线过关</text>
    <text x="280" y="377" text-anchor="middle" font-size="10" fill="#8a6d1a">n−1 对覆盖全部字符（首尾各属一对）⇒ 漏读即可能漏判，Ω(n) 单趟已最优</text>
  </g>
</svg>
