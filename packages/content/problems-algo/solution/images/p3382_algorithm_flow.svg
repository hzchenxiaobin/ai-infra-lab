<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：逐列扫描 + 线段树区间 max</text>

  <!-- start -->
  <ellipse cx="260" cy="62" rx="44" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">开始</text>
  <line x1="260" y1="79" x2="260" y2="96" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- group -->
  <rect x="120" y="98" width="280" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11.5" fill="#233a55" filter="url(#rough2)">按 x 分组，每列的 y 排序</text>
  <text x="260" y="130" text-anchor="middle" font-size="10.5" fill="#557" filter="url(#rough2)">（列内相邻对才是候选右边界）</text>
  <line x1="260" y1="138" x2="260" y2="155" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- discretize + segtree -->
  <rect x="100" y="157" width="320" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="173" text-anchor="middle" font-size="11.5" fill="#233a55" filter="url(#rough2)">y 离散化，建线段树（区间 max，初值 −1）</text>
  <text x="260" y="189" text-anchor="middle" font-size="10.5" fill="#557" filter="url(#rough2)">last[y] = 纵坐标 y 最近出现的列</text>
  <line x1="260" y1="197" x2="260" y2="214" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="130" y="216" width="260" height="32" rx="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11.5" fill="#6b5410" filter="url(#rough2)">从左到右取一列 x</text>
  <line x1="260" y1="248" x2="260" y2="265" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- query pairs -->
  <rect x="88" y="267" width="344" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11.5" fill="#233a55" filter="url(#rough2)">对列内每个相邻对 (y₁,y₂)：</text>
  <text x="260" y="301" text-anchor="middle" font-size="11.5" fill="#233a55" filter="url(#rough2)">x₀ ← 查询 last 在 [y₁,y₂] 上的 max</text>
  <line x1="260" y1="311" x2="260" y2="328" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check diamond -->
  <polygon points="260,330 400,368 260,406 120,368" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#7a3030" filter="url(#rough2)">列 x₀ 的 [y₁,y₂] 内</text>
  <text x="260" y="376" text-anchor="middle" font-size="11" fill="#7a3030" filter="url(#rough2)">恰有相邻的 y₁、y₂？</text>

  <!-- yes branch -->
  <line x1="400" y1="368" x2="440" y2="368" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="360" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="404" y="414" width="106" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="457" y="432" text-anchor="middle" font-size="10" fill="#2a4a1e" filter="url(#rough2)">ans ← max(ans,</text>
  <text x="457" y="446" text-anchor="middle" font-size="10" fill="#2a4a1e" filter="url(#rough2)">(x−x₀)(y₂−y₁))</text>
  <path d="M440,368 L457,368 L457,410" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <line x1="260" y1="406" x2="260" y2="423" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="272" y="418" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- insert column -->
  <rect x="120" y="425" width="246" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="243" y="446" text-anchor="middle" font-size="11.5" fill="#233a55" filter="url(#rough2)">把列 x 的每个 y 更新 last[y]=x</text>
  <line x1="457" y1="460" x2="457" y2="478" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M457,478 L243,478 L243,480" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow -->
  <path d="M120,442 L52,442 L52,232 L126,232" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="345" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)" transform="rotate(-90 48 345)">下一列</text>

  <!-- return -->
  <path d="M243,480 L260,480" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="330" cy="480" rx="66" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="485" text-anchor="middle" font-size="11.5" fill="#2a4a1e" filter="url(#rough2)">返回 ans（或 −1）</text>
</svg>
