<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：负二进制加法的进位可正可负</text>

  <!-- ===== Section 1: base 2 vs base -2 comparison ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">进位规则对比</text>

  <!-- base 2 box -->
  <rect x="40" y="64" width="230" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="155" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">base 2（普通二进制）</text>
  <text x="155" y="108" text-anchor="middle" font-size="11" fill="#555">s = 2·carry + bit</text>
  <text x="155" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">carry = s &gt;&gt; 1  （≥ 0）</text>
  <text x="155" y="148" text-anchor="middle" font-size="10" fill="#888">进位非负，单向向左传播</text>

  <!-- base -2 box -->
  <rect x="290" y="64" width="230" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="86" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">base −2（负二进制）</text>
  <text x="405" y="108" text-anchor="middle" font-size="11" fill="#555">s = (−2)·carry + bit</text>
  <text x="405" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">carry = −(s &gt;&gt; 1)  （可负！）</text>
  <text x="405" y="148" text-anchor="middle" font-size="10" fill="#888">进位可能为 −1，符号反转</text>

  <!-- ===== Section 2: full sum table ===== -->
  <text x="40" y="186" font-size="12" fill="#446688" font-weight="bold">base −2 逐位求和全景表（sum = a[i] + b[j] + carry）</text>

  <!-- table header -->
  <rect x="40" y="196" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sum</text>

  <rect x="110" y="196" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">bit = s&amp;1</text>

  <rect x="190" y="196" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">carry = −(s&gt;&gt;1)</text>

  <rect x="300" y="196" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">验证：(−2)·carry + bit</text>

  <!-- row: sum=-1 -->
  <rect x="40" y="224" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="241" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="110" y="224" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="241" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="190" y="224" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="300" y="224" width="220" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="241" text-anchor="middle" font-size="10" fill="#888">(−2)(1) + 1 = −1 ✓</text>

  <!-- row: sum=0 -->
  <rect x="40" y="250" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="267" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="110" y="250" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="267" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="190" y="250" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="267" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="300" y="250" width="220" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="267" text-anchor="middle" font-size="10" fill="#888">(−2)(0) + 0 = 0 ✓</text>

  <!-- row: sum=1 -->
  <rect x="40" y="276" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="293" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="110" y="276" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="293" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="190" y="276" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="245" y="293" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="300" y="276" width="220" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="293" text-anchor="middle" font-size="10" fill="#888">(−2)(0) + 1 = 1 ✓</text>

  <!-- row: sum=2 -->
  <rect x="40" y="302" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="319" text-anchor="middle" font-size="11" fill="#555">2</text>
  <rect x="110" y="302" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="319" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="190" y="302" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="319" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="300" y="302" width="220" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="319" text-anchor="middle" font-size="10" fill="#888">(−2)(−1) + 0 = 2 ✓</text>

  <!-- row: sum=3 -->
  <rect x="40" y="328" width="70" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="345" text-anchor="middle" font-size="11" fill="#555">3</text>
  <rect x="110" y="328" width="80" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="345" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="190" y="328" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="345" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="300" y="328" width="220" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="410" y="345" text-anchor="middle" font-size="10" fill="#888">(−2)(−1) + 1 = 3 ✓</text>

  <!-- ===== bottom insight boxes ===== -->
  <rect x="40" y="368" width="230" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="155" y="390" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">bit = sum &amp; 1</text>
  <text x="155" y="408" text-anchor="middle" font-size="10.5" fill="#555">二补码下对负数仍正确</text>
  <text x="155" y="424" text-anchor="middle" font-size="10.5" fill="#555">−1 &amp; 1 = 1（全 1 的最低位）</text>
  <text x="155" y="438" text-anchor="middle" font-size="10.5" fill="#555">无需 if 修正，公式统一</text>

  <rect x="290" y="368" width="230" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">carry = −(sum &gt;&gt; 1)</text>
  <text x="405" y="408" text-anchor="middle" font-size="10.5" fill="#555">算术右移对负数向下取整</text>
  <text x="405" y="424" text-anchor="middle" font-size="10.5" fill="#555">−(−1&gt;&gt;1) = −(−1) = +1</text>
  <text x="405" y="438" text-anchor="middle" font-size="10.5" fill="#555">carry ∈ {−1, 0, +1}，有界</text>
</svg>
