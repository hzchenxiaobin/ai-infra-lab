<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a7a"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 首个命中即返回</text>

  <!-- Step 1: sort -->
  <rect x="120" y="40" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">排序 dictionary（长度降序，同长字典序升序）</text>
  <path d="M 270 76 L 270 92" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: take next word -->
  <rect x="150" y="94" width="240" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="11.5" fill="#333">取下一个 word（已按长度降序排列）</text>
  <path d="M 270 126 L 270 138" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: is subsequence? -->
  <polygon points="270,140 400,184 270,228 140,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">word 是 s 的</text>
  <text x="270" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">子序列？（双指针）</text>
  <text x="392" y="178" text-anchor="end" font-size="10.5" fill="#82b366" font-weight="bold">是</text>
  <text x="148" y="178" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- Yes branch (right): return word -->
  <rect x="412" y="156" width="116" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 word</text>
  <text x="470" y="194" text-anchor="middle" font-size="9.5" fill="#4a7a3a">首个命中即最优</text>
  <text x="470" y="206" text-anchor="middle" font-size="9.5" fill="#4a7a3a">（最长 + 字典序最小）</text>
  <path d="M 400 184 L 411 184" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch (left): next word? -->
  <path d="M 140 184 L 90 184 L 90 240" stroke="#7a7a7a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 90 240 L 90 252" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: has next word? -->
  <polygon points="90,254 210,296 90,338 0,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">还有下一个</text>
  <text x="90" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">word ？</text>
  <text x="200" y="288" text-anchor="end" font-size="10.5" fill="#82b366" font-weight="bold">是</text>
  <text x="98" y="326" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- loop back to "take next word" -->
  <path d="M 210 296 L 525 296 L 525 110 L 391 110" stroke="#82b366" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="520" y="206" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-style="italic">继续判定</text>
  <text x="520" y="220" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-style="italic">下一个 word</text>

  <!-- No: return empty -->
  <path d="M 90 338 L 90 358" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="360" width="140" height="34" rx="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="382" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">全部未通过 → 返回 ""</text>

  <!-- note bottom right -->
  <rect x="180" y="360" width="340" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="350" y="380" text-anchor="middle" font-size="10.5" fill="#444">排序键 (长度↓, 字典序↑) 使 tie-break 自动完成</text>
  <text x="350" y="398" text-anchor="middle" font-size="10.5" fill="#4a7a3a">首个命中 = 最长且字典序最小，可提前返回</text>
</svg>
