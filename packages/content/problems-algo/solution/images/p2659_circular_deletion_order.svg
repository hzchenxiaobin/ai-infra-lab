<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：环形数组 + 按值升序删除</text>

  <!-- Left: circular array nums = [3,4,-1] -->
  <text x="170" y="56" text-anchor="middle" font-size="11" fill="#888">nums = [3, 4, -1] 看作环形</text>

  <!-- dashed circle -->
  <circle cx="170" cy="215" r="88" fill="none" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- clockwise rotation arc (top -> right) -->
  <path d="M 188 132 A 88 88 0 0 1 256 236" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="176" font-size="10" fill="#888">↻ 旋转</text>

  <!-- head pointer -->
  <line x1="170" y1="78" x2="170" y2="116" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="170" y="70" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">head 队首</text>

  <!-- node 0: value 3 (top) -->
  <circle cx="170" cy="130" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="170" y="166" text-anchor="middle" font-size="9" fill="#888">pos 0</text>

  <!-- node 1: value 4 (bottom right) -->
  <circle cx="246" cy="258" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="246" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="270" y="284" font-size="9" fill="#888">pos 1</text>

  <!-- node 2: value -1 (bottom left, min) -->
  <circle cx="94" cy="258" r="23" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="94" y="264" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">-1</text>
  <text x="70" y="284" text-anchor="end" font-size="9" fill="#b85450">pos 2 最小</text>

  <!-- Right: deletion order -->
  <text x="430" y="56" text-anchor="middle" font-size="11" fill="#888">删除顺序（按值升序）</text>

  <rect x="330" y="70" width="200" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-1（最小）</text>
  <text x="430" y="104" text-anchor="middle" font-size="9" fill="#888">原位置 pos 2</text>

  <line x1="430" y1="114" x2="430" y2="132" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="330" y="136" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3（次小）</text>
  <text x="430" y="170" text-anchor="middle" font-size="9" fill="#888">原位置 pos 0</text>

  <line x1="430" y1="180" x2="430" y2="198" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="330" y="202" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4（最大）</text>
  <text x="430" y="236" text-anchor="middle" font-size="9" fill="#888">原位置 pos 1</text>

  <!-- Two operations note -->
  <rect x="330" y="258" width="200" height="42" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="276" text-anchor="middle" font-size="10" fill="#555">操作①：队首=最小 → 删除</text>
  <text x="430" y="292" text-anchor="middle" font-size="10" fill="#555">操作②：否则 → 队首移到队尾</text>

  <!-- Bottom: formula -->
  <rect x="30" y="320" width="500" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">总操作数 = n（删除 n 次） + Σ 旋转次数</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#555">每次旋转 = 跳过 head 到目标之间的「存活元素」个数</text>
  <text x="280" y="378" text-anchor="middle" font-size="9" fill="#888">树状数组维护存活集合，区间计数 O(log n)</text>
</svg>
