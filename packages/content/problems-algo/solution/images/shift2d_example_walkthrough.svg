<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：grid=[[1,2,3],[4,5,6],[7,8,9]], k=1
  </text>

  <!-- Step label -->
  <text x="60" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">原始网格</text>

  <!-- Original grid -->
  <rect x="20" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="72" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="80" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="20" y="106" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="106" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="106" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="80" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="120" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="20" y="140" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="140" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="140" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="80" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="120" y="162" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- Arrow to flatten -->
  <path d="M 145 123 L 185 123" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="115" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">展开</text>

  <!-- 1D array (original) -->
  <text x="330" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">一维数组 + 下标</text>
  <rect x="190" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="292" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="428" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="462" y="72" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="241" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="275" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="309" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="343" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="377" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="411" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="445" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="479" y="94" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <!-- indices -->
  <text x="207" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="241" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="275" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="309" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="343" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="377" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="411" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>
  <text x="445" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>
  <text x="479" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8</text>

  <!-- Arrow rotate -->
  <path d="M 330 132 L 330 158" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="375" y="148" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">右旋 k=1</text>

  <!-- 1D array (rotated) -->
  <text x="330" y="168" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">迁移后一维数组</text>
  <rect x="190" y="178" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="178" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="178" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="292" y="178" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="178" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="178" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="178" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="428" y="178" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="462" y="178" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="241" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="275" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="309" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="343" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="377" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="411" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="445" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="479" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>

  <!-- Arrow reshape -->
  <path d="M 190 195 L 145 195" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">折回</text>

  <!-- Result grid -->
  <text x="60" y="218" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">迁移后网格</text>
  <rect x="20" y="228" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="228" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="228" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="250" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="80" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="20" y="262" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="262" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="262" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="80" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="120" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="20" y="296" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="296" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="296" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="318" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="80" y="318" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="120" y="318" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <!-- Mapping table -->
  <rect x="20" y="348" width="520" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    映射验证：新位置(0,0)→newIdx=0→oldIdx=(0−1+9)%9=8→grid[2][2]=9 ✓
  </text>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    新位置(0,1)→newIdx=1→oldIdx=(1−1+9)%9=0→grid[0][0]=1 ✓  ···  k=9 时回到原位
  </text>
</svg>
