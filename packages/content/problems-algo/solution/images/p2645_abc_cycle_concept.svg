<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrUp" markerWidth="9" markerHeight="9" refX="4.5" refY="1" orient="auto">
      <path d="M 4.5 0 L 9 9 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">贪心匹配：word 每个字符对齐到 "abc" 周期的最早合法位置</text>

  <!-- repeating cycle strip: 9 cells a b c a b c a b c -->
  <text x="40" y="92" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">目标串</text>

  <!-- cell 0 a (original) -->
  <rect x="130" y="68" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="97" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <!-- cell 1 b (inserted) -->
  <rect x="180" y="68" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="97" text-anchor="middle" font-size="17" fill="#d6a040" filter="url(#rough2)">b</text>
  <!-- cell 2 c (inserted) -->
  <rect x="230" y="68" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="97" text-anchor="middle" font-size="17" fill="#d6a040" filter="url(#rough2)">c</text>
  <!-- cell 3 a (original) -->
  <rect x="280" y="68" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="97" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <!-- cell 4 b (inserted) -->
  <rect x="330" y="68" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="97" text-anchor="middle" font-size="17" fill="#d6a040" filter="url(#rough2)">b</text>
  <!-- cell 5 c (inserted) -->
  <rect x="380" y="68" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="97" text-anchor="middle" font-size="17" fill="#d6a040" filter="url(#rough2)">c</text>
  <!-- cell 6 a (original) -->
  <rect x="430" y="68" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="454" y="97" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <!-- cell 7 b (inserted) -->
  <rect x="480" y="68" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="504" y="97" text-anchor="middle" font-size="17" fill="#d6a040" filter="url(#rough2)">b</text>
  <!-- cell 8 c (inserted) -->
  <rect x="530" y="68" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="554" y="97" text-anchor="middle" font-size="17" fill="#d6a040" filter="url(#rough2)">c</text>

  <!-- group brackets -->
  <path d="M 132 120 L 132 128 L 276 128 L 276 120" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="204" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 组 abc</text>
  <path d="M 282 120 L 282 128 L 426 128 L 426 120" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="354" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 2 组 abc</text>
  <path d="M 432 120 L 432 128 L 576 128 L 576 120" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="504" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 3 组 abc</text>

  <!-- arrows from word up to matching cells -->
  <path d="M 154 200 L 154 116" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 304 200 L 304 116" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 454 200 L 454 116" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- word row -->
  <text x="40" y="222" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">word</text>
  <rect x="134" y="200" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="223" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="284" y="200" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="304" y="223" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="434" y="200" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="454" y="223" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- legend -->
  <rect x="130" y="258" width="22" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="160" y="271" font-size="11" fill="#555" filter="url(#rough2)">原始字符（来自 word）</text>
  <rect x="310" y="258" width="22" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="340" y="271" font-size="11" fill="#555" filter="url(#rough2)">需插入的字符</text>

  <text x="310" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">word="aaa" → 目标 "abcabcabc"，插入 6 个字符</text>
  <text x="310" y="322" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个 word 字符贪心对齐到周期中最早的同类位置，组数最少 ⇒ 插入数最少</text>
</svg>
