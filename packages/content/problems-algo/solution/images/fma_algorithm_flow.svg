<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">山脉数组中查找目标值：算法流程</text>

  <!-- ===== Phase 1: Find peak ===== -->
  <rect x="20" y="44" width="520" height="124" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="36" y="62" font-size="11" fill="#d6a040" font-weight="bold">第一步：斜率二分找峰顶</text>

  <!-- start node -->
  <ellipse cx="280" cy="82" rx="100" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="12" fill="#333">lo=0, hi=n−1</text>

  <path d="M 280 100 L 280 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision lo < hi -->
  <polygon points="280,120 380,160 280,200 180,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#333">lo &lt; hi ?</text>

  <!-- no -> peak found -->
  <path d="M 380 160 L 430 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="154" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <ellipse cx="470" cy="160" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="164" text-anchor="middle" font-size="11" fill="#333">peak=lo</text>

  <!-- yes -> compare slope -->
  <path d="M 280 200 L 280 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="212" font-size="10" fill="#82b366">是</text>

  <polygon points="280,220 400,252 280,284 160,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#333">get(mid) &lt; get(mid+1) ?</text>

  <!-- ascending -->
  <path d="M 400 252 L 440 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="246" text-anchor="middle" font-size="9" fill="#82b366">是↑</text>
  <rect x="442" y="238" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="482" y="258" text-anchor="middle" font-size="10" fill="#333">lo=mid+1</text>

  <!-- descending -->
  <path d="M 160 252 L 120 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="246" text-anchor="middle" font-size="9" fill="#b85450">否↓</text>
  <rect x="38" y="238" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="258" text-anchor="middle" font-size="10" fill="#333">hi=mid</text>

  <!-- loop back arrows -->
  <path d="M 482 238 L 482 160 L 380 160" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 78 238 L 78 160 L 180 160" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2: Ascending binary search ===== -->
  <rect x="20" y="184" width="520" height="140" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="36" y="202" font-size="11" fill="#446688" font-weight="bold">第二步：升序段 [0, peak] 二分查找 target</text>

  <ellipse cx="280" cy="222" rx="110" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#333">lo=0, hi=peak</text>

  <path d="M 280 240 L 280 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision lo <= hi -->
  <polygon points="280,260 370,292 280,324 190,292" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="10" fill="#333">lo &le; hi ?</text>

  <!-- no -> phase 3 -->
  <path d="M 370 292 L 430 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="286" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="432" y="278" width="108" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="486" y="298" text-anchor="middle" font-size="10" fill="#b85450">进入第三步</text>

  <!-- yes -> compare val -->
  <path d="M 280 324 L 280 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="336" font-size="10" fill="#82b366">是</text>

  <polygon points="280,344 410,376 280,408 150,376" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#333">val=get(mid)</text>
  <text x="280" y="390" text-anchor="middle" font-size="9" fill="#666">== / &lt; / &gt; target ?</text>

  <!-- == target -> return -->
  <path d="M 280 408 L 280 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="420" font-size="9" fill="#4a7a3a">==</text>
  <ellipse cx="280" cy="438" rx="56" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="442" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 mid ✓</text>

  <!-- < target -> lo=mid+1, > target -> hi=mid-1 -->
  <path d="M 410 376 L 440 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="370" text-anchor="middle" font-size="9" fill="#82b366">&lt;t</text>
  <rect x="442" y="362" width="86" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="381" text-anchor="middle" font-size="10" fill="#333">lo=mid+1</text>

  <path d="M 150 376 L 120 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="370" text-anchor="middle" font-size="9" fill="#b85450">&gt;t</text>
  <rect x="36" y="362" width="86" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="79" y="381" text-anchor="middle" font-size="10" fill="#333">hi=mid−1</text>

  <!-- loop back -->
  <path d="M 485 362 L 485 292 L 370 292" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 79 362 L 79 292 L 190 292" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 3: Descending binary search ===== -->
  <rect x="20" y="324" width="520" height="140" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="36" y="342" font-size="11" fill="#b85450" font-weight="bold">第三步：降序段 [peak+1, n−1] 二分查找（方向翻转!）</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="478" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="500" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第三步结构同第二步，唯一区别：</text>
  <text x="280" y="516" text-anchor="middle" font-size="11" fill="#b85450">val &gt; target → lo=mid+1（右找更小值）  val &lt; target → hi=mid−1（左找更大值）</text>
</svg>
