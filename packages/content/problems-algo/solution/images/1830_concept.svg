<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：操作 = 求上一个排列，答案 = 字典序排名（0 下标）</text>

  <!-- ===== Left: The 4-step operation ===== -->
  <rect x="20" y="48" width="250" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">题目操作（4 步）</text>
  <text x="35" y="90" font-size="11" fill="#444">1. 找最大 i：s[i] &lt; s[i−1]</text>
  <text x="35" y="110" font-size="11" fill="#444">2. 找最大 j：s[j] &lt; s[i−1]（j≥i）</text>
  <text x="35" y="130" font-size="11" fill="#444">3. 交换 s[i−1] 与 s[j]</text>
  <text x="35" y="150" font-size="11" fill="#444">4. 反转 s[i..] 后缀</text>
  <rect x="35" y="164" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="183" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= 标准求「上一个排列」算法</text>
  <text x="145" y="204" text-anchor="middle" font-size="10" fill="#888">每次操作让 s 变为字典序更小的排列</text>

  <!-- ===== Right: Permutation chain for "cba" ===== -->
  <rect x="300" y="48" width="320" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">排列链：cba → abc（5 步）</text>

  <!-- chain nodes -->
  <rect x="310" y="82" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cba</text>
  <text x="335" y="120" text-anchor="middle" font-size="9" fill="#888">起点(排名5)</text>

  <rect x="370" y="82" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="100" text-anchor="middle" font-size="12" fill="#555">cab</text>

  <rect x="430" y="82" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="100" text-anchor="middle" font-size="12" fill="#555">bca</text>

  <rect x="490" y="82" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="100" text-anchor="middle" font-size="12" fill="#555">bac</text>

  <rect x="550" y="82" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="575" y="100" text-anchor="middle" font-size="12" fill="#555">acb</text>

  <!-- arrows between -->
  <path d="M 362 95 L 368 95" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 422 95 L 428 95" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 482 95 L 488 95" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 542 95 L 548 95" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final node abc -->
  <rect x="550" y="120" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="575" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">abc</text>
  <text x="575" y="158" text-anchor="middle" font-size="9" fill="#888">终点(排名0)</text>
  <path d="M 575 148 L 575 118" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- all 6 permutations listed -->
  <text x="460" y="178" text-anchor="middle" font-size="10" fill="#666">全部排列（升序）：abc, acb, bac, bca, cab, cba</text>
  <text x="460" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cba 前面有 5 个 → 答案 = 5</text>

  <!-- ===== Bottom: Key formula box ===== -->
  <rect x="20" y="240" width="600" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="266" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">转化：操作次数 = s 的字典序排名（0 下标）</text>
  <text x="320" y="290" text-anchor="middle" font-size="12" fill="#555">答案 = 字典序严格小于 s 的「不同排列」个数</text>
  <text x="320" y="310" text-anchor="middle" font-size="11" fill="#888">逐位固定前缀，枚举更小字符，用多项式系数计数剩余排列</text>

  <!-- ===== Bottom: Multinomial formula ===== -->
  <rect x="20" y="335" width="600" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="360" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">多位项式系数（含重复元素的排列数）</text>
  <text x="320" y="385" text-anchor="middle" font-size="14" fill="#444">M = rem! / ∏ cnt[ch]!</text>
  <text x="320" y="408" text-anchor="middle" font-size="12" fill="#555">放字符 c 在位置 i：M_c = M × cnt[c] / rem</text>
  <text x="320" y="424" text-anchor="middle" font-size="10" fill="#888">除法用乘法逆元，O(26n) 逐位累加即得答案</text>
</svg>
