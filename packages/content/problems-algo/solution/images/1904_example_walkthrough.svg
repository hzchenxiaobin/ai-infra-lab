<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    三个官方示例演算
  </text>

  <rect x="40" y="50" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80"  y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">示例</text>
  <text x="180" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">start→finish (分钟)</text>
  <text x="330" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">跨午夜?</text>
  <text x="430" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[ceil, floor]</text>
  <text x="520" y="70" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">答案</text>

  <rect x="40" y="80" width="520" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80"  y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12:01→12:44 (721→764)</text>
  <text x="330" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否</text>
  <text x="430" y="104" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">[735, 750]</text>
  <text x="520" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="40" y="116" width="520" height="36" fill="#f7f7f7" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80"  y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20:00→06:00 (1200→360)</text>
  <text x="330" y="140" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是 → 360+1440=1800</text>
  <text x="430" y="140" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">[1200, 1800]</text>
  <text x="520" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">40</text>

  <rect x="40" y="152" width="520" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80"  y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="180" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">00:00→23:59 (0→1439)</text>
  <text x="330" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否</text>
  <text x="430" y="176" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">[0, 1425]</text>
  <text x="520" y="176" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">95</text>

  <rect x="40" y="212" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">
    示例 1：735=12:15（向上取整），750=12:30（向下取整）
  </text>
  <text x="300" y="248" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    (750−735)/15 = 1，仅 12:15↔12:30 这一段完整覆盖
  </text>

  <rect x="40" y="270" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="290" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">
    示例 2：finish &lt; start ⇒ 加 1440 翻到次日
  </text>
  <text x="300" y="306" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">
    (1800−1200)/15 = 40，通宵共 40 个对局
  </text>

  <rect x="40" y="324" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="343" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">
    通用结论：(floor − ceil) / 15，为负则取 0
  </text>
</svg>
