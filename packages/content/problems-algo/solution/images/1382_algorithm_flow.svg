<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两阶段流程：中序展开 + 取中点重建</text>

  <!-- 阶段一标题 -->
  <rect x="40" y="50" width="250" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="165" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段一 · 中序展开 inorder(node)</text>

  <!-- 阶段二标题 -->
  <rect x="330" y="50" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段二 · 取中点重建 build(L, R)</text>

  <!-- 阶段一流程 -->
  <path d="M 165 78 L 165 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="165,100 255,140 165,180 75,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="136" text-anchor="middle" font-size="11" fill="#333">node == null ?</text>
  <text x="165" y="154" text-anchor="middle" font-size="10" fill="#888">空节点</text>

  <path d="M 255 140 L 290 140 L 290 110" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="132" font-size="9" fill="#b85450">是</text>
  <rect x="250" y="94" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="112" text-anchor="middle" font-size="11" fill="#888">return</text>

  <path d="M 165 180 L 165 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="194" font-size="9" fill="#82b366">否</text>

  <rect x="60" y="202" width="210" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="165" y="221" text-anchor="middle" font-size="11" fill="#333">inorder(node.left)</text>

  <path d="M 165 230 L 165 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="252" width="210" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="165" y="271" text-anchor="middle" font-size="11" fill="#333">nums.push_back(node.val)</text>

  <path d="M 165 280 L 165 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="302" width="210" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="165" y="321" text-anchor="middle" font-size="11" fill="#333">inorder(node.right)</text>

  <!-- 阶段一产出 -->
  <path d="M 165 330 L 165 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="352" width="190" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="372" text-anchor="middle" font-size="11" fill="#333">产出 nums（升序）</text>

  <!-- 阶段二流程 -->
  <path d="M 455 78 L 455 96" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="455,100 545,140 455,180 365,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="136" text-anchor="middle" font-size="11" fill="#333">L &gt; R ?</text>
  <text x="455" y="154" text-anchor="middle" font-size="10" fill="#888">区间为空</text>

  <path d="M 545 140 L 580 140 L 580 110" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="558" y="132" font-size="9" fill="#b85450">是</text>
  <rect x="540" y="94" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="580" y="112" text-anchor="middle" font-size="11" fill="#888">return null</text>

  <path d="M 455 180 L 455 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="194" font-size="9" fill="#82b366">否</text>

  <rect x="340" y="202" width="230" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="455" y="221" text-anchor="middle" font-size="11" fill="#333">mid = L + (R-L)/2; root = new(nums[mid])</text>

  <path d="M 455 230 L 455 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="252" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="455" y="271" text-anchor="middle" font-size="11" fill="#333">root.left = build(L, mid-1)</text>

  <path d="M 455 280 L 455 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="302" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="455" y="321" text-anchor="middle" font-size="11" fill="#333">root.right = build(mid+1, R)</text>

  <path d="M 455 330 L 455 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="352" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="372" text-anchor="middle" font-size="11" fill="#333">return root（平衡 BST）</text>

  <!-- 中间连接箭头：阶段一产出 → 阶段二输入 -->
  <path d="M 260 368 L 340 200" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="284" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">nums 喂入</text>

  <!-- 底部说明 -->
  <text x="310" y="418" text-anchor="middle" font-size="11" fill="#888">阶段一 O(n) 收集升序数组 · 阶段二 O(n) 取中点重建 — 总 O(n) 时间、O(n) 空间</text>
  <text x="310" y="438" text-anchor="middle" font-size="11" fill="#888">阶段二 build 与 108 题「有序数组转 BST」代码逐字相同</text>
</svg>
