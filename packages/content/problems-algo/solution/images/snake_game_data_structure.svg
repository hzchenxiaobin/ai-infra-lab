<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">双端队列 + 哈希集合 协同</text>
  <path d="M 280 46 Q 430 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: grid with snake ===== -->
  <text x="180" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">height=2, width=3 网格</text>
  <!-- grid cells: 3 cols x 2 rows, cell=64, origin (60,100) -->
  <!-- row labels -->
  <text x="48" y="146" text-anchor="end" font-size="11" fill="#888">row 0</text>
  <text x="48" y="210" text-anchor="end" font-size="11" fill="#888">row 1</text>
  <!-- col labels -->
  <text x="92"  y="96" text-anchor="middle" font-size="11" fill="#888">col0</text>
  <text x="156" y="96" text-anchor="middle" font-size="11" fill="#888">col1</text>
  <text x="220" y="96" text-anchor="middle" font-size="11" fill="#888">col2</text>

  <!-- row 0 -->
  <g filter="url(#sk)"><rect x="60" y="108" width="64" height="64" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="92" y="146" text-anchor="middle" font-size="13" fill="#bbb">(0,0)</text>
  <!-- head (0,1) -->
  <g filter="url(#sk)"><rect x="124" y="108" width="64" height="64" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="156" y="140" text-anchor="middle" font-size="18" fill="#b03a3a" font-weight="bold">●</text>
  <text x="156" y="158" text-anchor="middle" font-size="10.5" fill="#b03a3a">头 (0,1)</text>
  <!-- body (0,2) -->
  <g filter="url(#sk)"><rect x="188" y="108" width="64" height="64" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="220" y="140" text-anchor="middle" font-size="18" fill="#3a6e2e">○</text>
  <text x="220" y="158" text-anchor="middle" font-size="10.5" fill="#3a6e2e">身 (0,2)</text>

  <!-- row 1 -->
  <g filter="url(#sk)"><rect x="60" y="172" width="64" height="64" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="92" y="210" text-anchor="middle" font-size="13" fill="#bbb">(1,0)</text>
  <g filter="url(#sk)"><rect x="124" y="172" width="64" height="64" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="156" y="210" text-anchor="middle" font-size="13" fill="#bbb">(1,1)</text>
  <!-- tail (1,2) -->
  <g filter="url(#sk)"><rect x="188" y="172" width="64" height="64" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 3"/></g>
  <text x="220" y="204" text-anchor="middle" font-size="18" fill="#3a6e2e">○</text>
  <text x="220" y="222" text-anchor="middle" font-size="10.5" fill="#3a6e2e">尾 (1,2)</text>

  <!-- score badge -->
  <g filter="url(#sk)"><rect x="60" y="252" width="192" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="156" y="274" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">score=2  foodIdx=2  蛇长=3</text>

  <!-- encoding formula -->
  <g filter="url(#sk)"><rect x="60" y="300" width="192" height="62" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="156" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">坐标编码</text>
  <text x="156" y="342" text-anchor="middle" font-size="11.5" fill="#555">pos = row × width + col</text>
  <text x="156" y="356" text-anchor="middle" font-size="10" fill="#888">(0,1)→1  (0,2)→2  (1,2)→5</text>

  <!-- ===== Right: deque ===== -->
  <g filter="url(#sk)"><rect x="320" y="108" width="500" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="570" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">deque q  （队首=蛇头 → 队尾=蛇尾）</text>
  <!-- deque cells: head=1, body=2, tail=5 -->
  <g font-size="14" fill="#333">
    <g filter="url(#sk)"><rect x="392" y="150" width="80" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="432" y="180" text-anchor="middle" font-weight="bold" fill="#b03a3a">1</text>
    <text x="432" y="146" text-anchor="middle" font-size="10" fill="#b03a3a">头</text>
    <g filter="url(#sk)"><rect x="476" y="150" width="80" height="46" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="516" y="180" text-anchor="middle" fill="#3a6e2e">2</text>
    <g filter="url(#sk)"><rect x="560" y="150" width="80" height="46" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3"/></g>
    <text x="600" y="180" text-anchor="middle" fill="#3a6e2e">5</text>
    <text x="600" y="146" text-anchor="middle" font-size="10" fill="#3a6e2e">尾</text>
  </g>
  <!-- operations -->
  <text x="660" y="166" font-size="11" fill="#888">push_front(头)</text>
  <text x="660" y="184" font-size="11" fill="#888">pop_back(尾)</text>
  <!-- arrows -->
  <path d="M 372 173 L 388 173" stroke="#b03a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 644 173 L 624 173" stroke="#3a6e2e" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)" transform="rotate(180 634 173)"/>

  <!-- ===== Right: hash set ===== -->
  <g filter="url(#sk)"><rect x="320" y="244" width="500" height="118" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="570" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">unordered_set vis  （O(1) 判碰撞）</text>
  <g font-size="13" fill="#555">
    <g filter="url(#sk)"><rect x="392" y="288" width="80" height="40" rx="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
    <text x="432" y="314" text-anchor="middle" font-weight="bold" fill="#b03a3a">1</text>
    <g filter="url(#sk)"><rect x="484" y="288" width="80" height="40" rx="20" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="524" y="314" text-anchor="middle" fill="#3a6e2e">2</text>
    <g filter="url(#sk)"><rect x="576" y="288" width="80" height="40" rx="20" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3"/></g>
    <text x="616" y="314" text-anchor="middle" fill="#3a6e2e">5</text>
  </g>
  <text x="680" y="306" font-size="11" fill="#888">insert(头)</text>
  <text x="680" y="324" font-size="11" fill="#888">erase(尾)</text>
  <text x="680" y="342" font-size="11" fill="#888">count(新头)?</text>

  <!-- sync arrows between deque and set -->
  <path d="M 432 198 Q 432 220 432 286" stroke="#5a5a5a" stroke-width="1.3" fill="none" stroke-dasharray="3 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 600 198 Q 600 220 600 286" stroke="#5a5a5a" stroke-width="1.3" fill="none" stroke-dasharray="3 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="244" font-size="9.5" fill="#888">同步增</text>
  <text x="560" y="244" font-size="9.5" fill="#888">同步删</text>

  <!-- ===== Bottom: invariant ===== -->
  <g filter="url(#sk)"><rect x="60" y="388" width="760" height="76" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="440" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">不变式：队列与集合存同一份蛇身，任何增删必须同步</text>
  <text x="440" y="436" text-anchor="middle" font-size="11.5" fill="#555">吃食物：push_front + insert（不弹尾 → 蛇变长）</text>
  <text x="440" y="454" text-anchor="middle" font-size="11.5" fill="#555">无食物：pop_back + erase，再 push_front + insert（头进尾退 → 蛇长不变）</text>

  <text x="430" y="500" text-anchor="middle" font-size="10.5" fill="#888">队列管「顺序」（谁先弹尾），集合管「占用」（能否进入）——与 146 LRU 缓存的「哈希+双向链表同步」同理</text>
</svg>
