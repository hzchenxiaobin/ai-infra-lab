<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：自连接找合法三元组 → UNION 收集 id → 输出完整行</text>

  <!-- Step 1: Stadium table + find triples -->
  <text x="90" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Step 1：三表自连接找合法三元组</text>

  <rect x="30" y="58" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="72" font-size="9" fill="#333">id</text>
  <text x="76" y="72" font-size="9" fill="#333">visit_date</text>
  <text x="126" y="72" font-size="9" fill="#333">people</text>
  <line x1="60" y1="58" x2="60" y2="78" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="108" y1="58" x2="108" y2="78" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="78" width="120" height="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="90" font-size="9" fill="#999">1</text><text x="76" y="90" font-size="8" fill="#999">01-01</text><text x="126" y="90" font-size="9" fill="#999">10</text>

  <rect x="30" y="94" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="106" font-size="9" fill="#333">2</text><text x="76" y="106" font-size="8" fill="#333">01-02</text><text x="126" y="106" font-size="9" fill="#333">109</text>

  <rect x="30" y="110" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="122" font-size="9" fill="#333">3</text><text x="76" y="122" font-size="8" fill="#333">01-03</text><text x="126" y="122" font-size="9" fill="#333">150</text>

  <rect x="30" y="126" width="120" height="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="138" font-size="9" fill="#999">4</text><text x="76" y="138" font-size="8" fill="#999">01-04</text><text x="126" y="138" font-size="9" fill="#999">99</text>

  <rect x="30" y="142" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="154" font-size="9" fill="#333">5</text><text x="76" y="154" font-size="8" fill="#333">01-05</text><text x="126" y="154" font-size="9" fill="#333">145</text>

  <rect x="30" y="158" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="170" font-size="9" fill="#333">6</text><text x="76" y="170" font-size="8" fill="#333">01-06</text><text x="126" y="170" font-size="9" fill="#333">1455</text>

  <rect x="30" y="174" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="186" font-size="9" fill="#333">7</text><text x="76" y="186" font-size="8" fill="#333">01-07</text><text x="126" y="186" font-size="9" fill="#333">199</text>

  <rect x="30" y="190" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="46" y="202" font-size="9" fill="#333">8</text><text x="76" y="202" font-size="8" fill="#333">01-08</text><text x="126" y="202" font-size="9" fill="#333">188</text>

  <!-- triple brackets -->
  <path d="M24 142 Q18 142 18 158 Q18 174 24 174" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="14" y="162" font-size="8" fill="#b85450" font-weight="bold">三元组</text>
  <text x="14" y="172" font-size="8" fill="#b85450">5-6-7</text>

  <path d="M24 158 Q18 158 18 182 Q18 206 24 206" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="156" y="186" font-size="8" fill="#b85450" font-weight="bold">三元组</text>
  <text x="156" y="196" font-size="8" fill="#b85450">6-7-8</text>

  <!-- Triple results boxes -->
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Step 2：每个三元组贡献 3 个 id</text>

  <rect x="190" y="100" width="160" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">三元组 5-6-7</text>
  <text x="270" y="136" text-anchor="middle" font-size="9" fill="#333">UNION SELECT s1.id → 5</text>
  <text x="270" y="150" text-anchor="middle" font-size="9" fill="#333">UNION SELECT s2.id → 6</text>
  <text x="270" y="164" text-anchor="middle" font-size="9" fill="#333">UNION SELECT s3.id → 7</text>

  <rect x="190" y="196" width="160" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">三元组 6-7-8</text>
  <text x="270" y="232" text-anchor="middle" font-size="9" fill="#333">UNION SELECT s1.id → 6</text>
  <text x="270" y="246" text-anchor="middle" font-size="9" fill="#333">UNION SELECT s2.id → 7</text>
  <text x="270" y="260" text-anchor="middle" font-size="9" fill="#333">UNION SELECT s3.id → 8</text>

  <!-- arrows from table to triple boxes -->
  <path d="M152 158 L186 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M152 182 L186 236" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: UNION result -->
  <text x="470" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Step 3：UNION 去重得 id 集</text>

  <rect x="400" y="100" width="140" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">UNION 去重后</text>
  <text x="470" y="140" text-anchor="middle" font-size="9" fill="#333">{5, 6, 7}  ∪</text>
  <text x="470" y="158" text-anchor="middle" font-size="9" fill="#333">{6, 7, 8}  =</text>
  <text x="470" y="180" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">{5,6,7,8}</text>

  <path d="M352 140 L396 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M352 236 L396 180" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: JOIN back + output -->
  <text x="470" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Step 4：JOIN 回原表输出</text>

  <rect x="395" y="236" width="150" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="250" font-size="9" fill="#333">id</text>
  <text x="443" y="250" font-size="9" fill="#333">visit_date</text>
  <text x="498" y="250" font-size="9" fill="#333">people</text>
  <line x1="425" y1="236" x2="425" y2="256" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="236" x2="475" y2="256" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="395" y="256" width="150" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="413" y="268" font-size="9" fill="#333">5</text><text x="443" y="268" font-size="8" fill="#333">2017-01-05</text><text x="498" y="268" font-size="9" fill="#333">145</text>

  <rect x="395" y="272" width="150" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="413" y="284" font-size="9" fill="#333">6</text><text x="443" y="284" font-size="8" fill="#333">2017-01-06</text><text x="498" y="284" font-size="9" fill="#333">1455</text>

  <rect x="395" y="288" width="150" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="413" y="300" font-size="9" fill="#333">7</text><text x="443" y="300" font-size="8" fill="#333">2017-01-07</text><text x="498" y="300" font-size="9" fill="#333">199</text>

  <rect x="395" y="304" width="150" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="413" y="316" font-size="9" fill="#333">8</text><text x="443" y="316" font-size="8" fill="#333">2017-01-08</text><text x="498" y="316" font-size="9" fill="#333">188</text>

  <path d="M470 200 L470 232" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Bottom insight box -->
  <rect x="30" y="340" width="540" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="362" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">关键：4 连段 = 2 个三元组 → UNION 自然去重 → 4 行全输出</text>
  <text x="48" y="384" font-size="10" fill="#333">① 三元组(5,6,7)：5/6/7 均作为 s1/s2/s3 被收集一次</text>
  <text x="48" y="402" font-size="10" fill="#333">② 三元组(6,7,8)：6/7/8 均被收集一次，6/7 与上段重复 → UNION 去重</text>
  <text x="48" y="420" font-size="10" fill="#b85450">⚠️ 若用 UNION ALL 不去重，6/7 会出现两次 → 必须用 UNION（或加 DISTINCT）</text>
  <text x="48" y="436" font-size="10" fill="#333">③ 最终 id 集 {5,6,7,8} JOIN 回 Stadium 取完整行，ORDER BY visit_date</text>
</svg>
