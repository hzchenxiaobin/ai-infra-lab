<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1784b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，检测是否存在 "01" 子串</text>

  <!-- Step 1: start -->
  <rect x="220" y="52" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输入 s（s[0]='1'）</text>

  <!-- arrow down -->
  <path d="M 280 90 L 280 116" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr1784b)" filter="url(#rough2)"/>

  <!-- Step 2: scan loop -->
  <rect x="180" y="116" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历相邻字符对 (s[i], s[i+1])</text>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i = 0 … n−2</text>

  <!-- arrow down to diamond -->
  <path d="M 280 162 L 280 188" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr1784b)" filter="url(#rough2)"/>

  <!-- Decision diamond: is s[i]=='0' and s[i+1]=='1'? -->
  <path d="M 280 188 L 360 224 L 280 260 L 200 224 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s[i]=='0'</text>
  <text x="280" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">且 s[i+1]=='1'?</text>

  <!-- Yes branch: left to false -->
  <path d="M 200 224 L 96 224" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr1784b)" filter="url(#rough2)"/>
  <text x="148" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是（命中 "01"）</text>

  <rect x="40" y="206" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="68" y="229" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- No branch: right, loop back or finish -->
  <path d="M 360 224 L 448 224" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr1784b)" filter="url(#rough2)"/>
  <text x="404" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- loop back arrow from "否" up to scan box -->
  <path d="M 476 224 Q 500 224 500 160 L 500 139 Q 500 116 476 116 L 380 116" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr1784b)" filter="url(#rough2)"/>
  <text x="510" y="170" font-size="10.5" fill="#888" filter="url(#rough2)">继续</text>
  <text x="510" y="184" font-size="10.5" fill="#888" filter="url(#rough2)">下一对</text>

  <!-- finish: scan ends with no "01" -->
  <path d="M 280 260 L 280 286" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr1784b)" filter="url(#rough2)"/>
  <text x="300" y="278" font-size="10.5" fill="#888" filter="url(#rough2)">遍历完未命中</text>

  <rect x="220" y="286" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- shortcut note -->
  <path d="M 40 332 L 520 332" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">等价一行：<tspan font-family="monospace" fill="#446688" font-weight="bold">return "01" not in s</tspan>（语言内置子串查找）</text>
</svg>
