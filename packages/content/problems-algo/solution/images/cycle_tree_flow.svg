<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="470" height="470" fill="#fdfcf7"/>

  <text x="235" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：较大者上爬求 LCA</text>
  <path d="M 130 38 Q 235 46 340 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start oval -->
  <g filter="url(#sk)">
    <ellipse cx="235" cy="78" rx="98" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="235" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">t ← 1（新边先记 1）</text>

  <!-- arrow start -> diamond1 -->
  <line x1="235" y1="100" x2="235" y2="120" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond1: a == b ? -->
  <g filter="url(#sk)">
    <polygon points="235,124 305,164 235,204 165,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="235" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">a == b ?</text>

  <!-- yes branch (right) -> return t -->
  <line x1="305" y1="164" x2="338" y2="164" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="312" y="156" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="338" y="142" width="118" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="397" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">answer = t</text>
  <text x="397" y="176" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">LCA 已到</text>

  <!-- no branch (down) -> diamond2 -->
  <line x1="235" y1="204" x2="235" y2="230" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="244" y="222" font-size="11" font-weight="bold" fill="#5a5a5a" filter="url(#sk)">否</text>

  <!-- diamond2: a > b ? -->
  <g filter="url(#sk)">
    <polygon points="235,234 312,278 235,322 158,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="235" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2a26" filter="url(#sk)">a &gt; b ?</text>

  <!-- yes (a>b) -> left box a<<=1 -->
  <line x1="158" y1="278" x2="150" y2="278" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="92" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">是(a 深)</text>
  <g filter="url(#sk)">
    <rect x="38" y="258" width="112" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="94" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">a ← a &gt;&gt; 1</text>

  <!-- no (a<b) -> right box b<<=1 -->
  <line x1="312" y1="278" x2="320" y2="278" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="378" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">否(b 深)</text>
  <g filter="url(#sk)">
    <rect x="320" y="258" width="112" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="376" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">b ← b &gt;&gt; 1</text>

  <!-- merge arrows down to t += 1 -->
  <path d="M 94 298 L 94 340 L 180 340" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 376 298 L 376 340 L 290 340" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- merge box: t += 1 -->
  <g filter="url(#sk)">
    <rect x="180" y="318" width="110" height="44" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="235" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">t ← t + 1</text>

  <!-- loop back to diamond1 (left side) -->
  <path d="M 235 362 L 235 386 L 26 386 L 26 164 L 165 164" stroke="#4a8e4a" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="34" y="282" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">回到</text>
  <text x="34" y="298" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">判定</text>

  <!-- bottom note -->
  <text x="235" y="416" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">每步把较大者沿父指针（val &gt;&gt; 1）上爬一层</text>
  <text x="235" y="436" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">爬到 a == b 即 LCA；累计步数 + 1（新边）= 环长</text>
</svg>
