<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：matrix → dp 表 → 逐格累加</text>

  <!-- ===== matrix grid (3x4), cell 48x36, origin x=80 y=48 ===== -->
  <text x="40" y="68" font-size="12" fill="#888">matrix:</text>

  <!-- row 0: 0,1,1,1 -->
  <rect x="80" y="52" width="48" height="36" fill="#eee" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="75" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="130" y="52" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="75" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>
  <rect x="180" y="52" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="75" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>
  <rect x="230" y="52" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="75" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>

  <!-- row 1: 1,1,1,1 -->
  <rect x="80" y="90" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="113" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>
  <rect x="130" y="90" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="113" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>
  <rect x="180" y="90" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="113" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>
  <rect x="230" y="90" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="113" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>

  <!-- row 2: 0,1,1,1 -->
  <rect x="80" y="128" width="48" height="36" fill="#eee" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="151" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="130" y="128" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="151" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>
  <rect x="180" y="128" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="151" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>
  <rect x="230" y="128" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="151" text-anchor="middle" font-size="13" fill="#335" font-weight="bold">1</text>

  <!-- arrows down from matrix to dp -->
  <path d="M 154 164 L 154 178" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 204 164 L 204 178" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 254 164 L 254 178" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== dp grid ===== -->
  <text x="40" y="200" font-size="12" fill="#888">dp:</text>

  <!-- row 0: 0,1,1,1 -->
  <rect x="80" y="184" width="48" height="36" fill="#eee" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="207" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="130" y="184" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="207" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="180" y="184" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="207" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="230" y="184" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="207" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <!-- row sum -->
  <text x="296" y="207" font-size="12" fill="#888">行和 = 3</text>

  <!-- row 1: 1,1,2,2 -->
  <rect x="80" y="222" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="104" y="245" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="130" y="222" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="245" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="180" y="222" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="245" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">2</text>
  <rect x="230" y="222" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="245" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">2</text>
  <text x="296" y="245" font-size="12" fill="#888">行和 = 6</text>

  <!-- row 2: 0,1,2,3 (3 highlighted red) -->
  <rect x="80" y="260" width="48" height="36" fill="#eee" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="283" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="130" y="260" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="283" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="180" y="260" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="283" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">2</text>
  <rect x="230" y="260" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="283" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="296" y="283" font-size="12" fill="#888">行和 = 6</text>

  <!-- annotation for the 3 -->
  <path d="M 300 278 Q 340 270 372 262" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="372" y="246" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="457" y="263" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">min(2,2,2)+1 = 3</text>
  <text x="457" y="278" text-anchor="middle" font-size="10" fill="#888">即唯一的 3×3 方块</text>

  <!-- total -->
  <rect x="120" y="320" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">答案 = 3 + 6 + 6 = 15 ✓</text>

  <!-- legend -->
  <rect x="370" y="370" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="390" y="382" font-size="10" fill="#888">边长1</text>
  <rect x="425" y="370" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="445" y="382" font-size="10" fill="#888">边长2</text>
  <rect x="478" y="370" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="498" y="382" font-size="10" fill="#888">边长3</text>
</svg>
