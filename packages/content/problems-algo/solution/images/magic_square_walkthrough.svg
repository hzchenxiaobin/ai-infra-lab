<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid 4×5，最大幻方 k = 3（位于 (r=1, c=1)）</text>

  <!-- col index header -->
  <text x="92" y="60" text-anchor="middle" font-size="10" fill="#888">c=0</text>
  <text x="136" y="60" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="180" y="60" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="224" y="60" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="268" y="60" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- row index labels -->
  <text x="58" y="98" text-anchor="end" font-size="10" fill="#888">r=0</text>
  <text x="58" y="142" text-anchor="end" font-size="10" fill="#888">1</text>
  <text x="58" y="186" text-anchor="end" font-size="10" fill="#888">2</text>
  <text x="58" y="230" text-anchor="end" font-size="10" fill="#888">3</text>

  <!-- ===== Grid cells (4x5) ===== -->
  <!-- row0: 7 1 4 5 6 (non-magic, gray) -->
  <rect x="70" y="74" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="92" y="102" text-anchor="middle" font-size="15" fill="#999">7</text>
  <rect x="114" y="74" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="136" y="102" text-anchor="middle" font-size="15" fill="#999">1</text>
  <rect x="158" y="74" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="102" text-anchor="middle" font-size="15" fill="#999">4</text>
  <rect x="202" y="74" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="224" y="102" text-anchor="middle" font-size="15" fill="#999">5</text>
  <rect x="246" y="74" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="102" text-anchor="middle" font-size="15" fill="#999">6</text>

  <!-- row1: 2 | 5 1 6 | 4  (cols1-3 magic) -->
  <rect x="70" y="118" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="92" y="146" text-anchor="middle" font-size="15" fill="#999">2</text>
  <rect x="114" y="118" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="136" y="146" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  <rect x="158" y="118" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="146" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="202" y="118" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="224" y="146" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">6</text>
  <rect x="246" y="118" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="146" text-anchor="middle" font-size="15" fill="#999">4</text>

  <!-- row2: 1 | 5 4 3 | 2 -->
  <rect x="70" y="162" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="92" y="190" text-anchor="middle" font-size="15" fill="#999">1</text>
  <rect x="114" y="162" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="136" y="190" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  <rect x="158" y="162" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="190" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <rect x="202" y="162" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="224" y="190" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="246" y="162" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="190" text-anchor="middle" font-size="15" fill="#999">2</text>

  <!-- row3: 1 | 2 7 3 | 4 -->
  <rect x="70" y="206" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="92" y="234" text-anchor="middle" font-size="15" fill="#999">1</text>
  <rect x="114" y="206" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="136" y="234" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="158" y="206" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="234" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">7</text>
  <rect x="202" y="206" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="224" y="234" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="246" y="206" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="268" y="234" text-anchor="middle" font-size="15" fill="#999">4</text>

  <!-- Diagonal lines over the 3x3 -->
  <line x1="124" y1="128" x2="236" y2="240" stroke="#b85450" stroke-width="2.5" opacity="0.5" filter="url(#rough2)"/>
  <line x1="236" y1="128" x2="124" y2="240" stroke="#d6a040" stroke-width="2.5" opacity="0.55" filter="url(#rough2)"/>

  <!-- ===== Row sums (right of magic rows) ===== -->
  <text x="300" y="120" font-size="10" fill="#888">行和</text>
  <path d="M 296 140 L 322 140" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="326" y="128" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="358" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5+1+6=12</text>

  <path d="M 296 184 L 322 184" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="326" y="172" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="358" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5+4+3=12</text>

  <path d="M 296 228 L 322 228" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="326" y="216" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="358" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2+7+3=12</text>

  <!-- ===== Col sums (below magic cols) ===== -->
  <path d="M 136 252 L 136 276" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="104" y="280" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="136" y="295" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5+5+2=12</text>

  <path d="M 180 252 L 180 276" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="148" y="280" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="295" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1+4+7=12</text>

  <path d="M 224 252 L 224 276" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="192" y="280" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="224" y="295" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6+3+3=12</text>

  <!-- ===== Diagonal sums (right-bottom) ===== -->
  <rect x="410" y="120" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="138" font-size="11" fill="#b85450" font-weight="bold">主对角线 (↘)</text>
  <text x="420" y="154" font-size="11" fill="#444">5 + 4 + 3 = 12 ✓</text>

  <rect x="410" y="170" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="188" font-size="11" fill="#d6a040" font-weight="bold">副对角线 (↙)</text>
  <text x="420" y="204" font-size="11" fill="#444">6 + 4 + 2 = 12 ✓</text>

  <!-- ===== Conclusion ===== -->
  <line x1="30" y1="320" x2="550" y2="320" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <rect x="40" y="336" width="500" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="360" font-size="12" fill="#4a7a3a" font-weight="bold">判定流程（k = 3, 左上角 (1,1)）：</text>
  <text x="60" y="382" font-size="11" fill="#444">1. S = rowPrefix[1][4] − rowPrefix[1][1] = 14 − 2 = 12</text>
  <text x="60" y="402" font-size="11" fill="#444">2. 检查 3 行：每行段和均为 12 ✓</text>
  <text x="60" y="422" font-size="11" fill="#444">3. 检查 3 列：每列段和均为 12 ✓</text>
  <text x="60" y="442" font-size="11" fill="#444">4. 主/副对角线和均为 12 ✓ → 命中，return 3</text>
</svg>
