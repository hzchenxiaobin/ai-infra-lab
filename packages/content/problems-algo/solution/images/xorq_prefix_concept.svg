<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">异或前缀和：a ^ a = 0 → 区间异或 = 两前缀异或</text>

  <!-- arr row -->
  <text x="40" y="74" font-size="12" fill="#888">arr:</text>
  <rect x="95" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="145" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="195" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="245" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">8</text>

  <text x="120" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="170" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>

  <!-- prefix row -->
  <text x="36" y="146" font-size="12" fill="#888">prefix:</text>
  <rect x="45" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="150" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="95" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="145" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="195" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="245" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#333">14</text>

  <text x="70" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[0]</text>
  <text x="120" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[1]</text>
  <text x="170" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[2]</text>
  <text x="220" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[3]</text>
  <text x="270" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[4]</text>

  <!-- query [0,3] highlight: p[4] ^ p[0] -->
  <rect x="45" y="186" width="50" height="22" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="245" y="186" width="50" height="22" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <path d="M 70 210 Q 70 222 80 222 L 260 222 Q 270 222 270 210" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="170" y="238" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">query[0,3] = p[4] ^ p[0] = 14 ^ 0 = 14 ✓</text>

  <!-- cancellation explanation -->
  <rect x="40" y="252" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">消去原理：arr[0..L−1] 在 p[R+1] 和 p[L] 中各出现一次</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#555">同值异或两次 = 0（a ^ a = 0），只剩 arr[L..R]</text>
  <text x="260" y="304" text-anchor="middle" font-size="10" fill="#888">1^3^4^8  ^  1^3  =  (1^1)^(3^3)^4^8 = 0^0^4^8 = 14</text>

  <!-- property box -->
  <rect x="40" y="322" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#333">XOR(L, R) = prefix[R+1] ^ prefix[L]</text>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a ^ a = 0  |  a ^ 0 = a  |  自逆运算（无需像求和那样做减法）</text>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#888">前缀异或 = 求和前缀的「异或版」，减法换成异或即可</text>
</svg>
