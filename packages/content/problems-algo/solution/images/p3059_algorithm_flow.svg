<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐行提取 → DISTINCT 去重 → 排序，一条 SQL 单趟完成</text>

  <rect x="25" y="52" width="120" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① FROM</text>
  <text x="85" y="92" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">读取 Emails 全部 n 行</text>

  <path d="M 145 83 L 168 83" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="172" y="52" width="130" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="237" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② SELECT</text>
  <text x="237" y="92" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">SUBSTRING_INDEX</text>
  <text x="237" y="104" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">(email, '@', -1) 逐行提取</text>

  <path d="M 302 83 L 325 83" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="329" y="52" width="110" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="74" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ DISTINCT</text>
  <text x="384" y="92" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">按域名去重</text>
  <text x="384" y="104" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">n 行 → d 行</text>

  <path d="M 439 83 L 462 83" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="466" y="52" width="92" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="512" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ ORDER BY</text>
  <text x="512" y="92" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">email_domain</text>
  <text x="512" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">字典序输出</text>

  <text x="290" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">▼ 数据怎么变（以示例 6 行为例）▼</text>

  <rect x="30" y="155" width="150" height="120" fill="#fff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="175" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">输入：6 行 email</text>
  <text x="105" y="193" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">hwkiy@test.edu</text>
  <text x="105" y="207" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">adcmaf@outlook.com</text>
  <text x="105" y="221" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">vrzmwyum@yahoo.com</text>
  <text x="105" y="235" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">tof@test.edu</text>
  <text x="105" y="249" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">jxhbagkpm@example.org</text>
  <text x="105" y="263" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">zxcf@outlook.com</text>

  <path d="M 185 215 L 215 215" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="205" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">提取</text>

  <rect x="220" y="155" width="130" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="285" y="175" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">6 个域名（含重复）</text>
  <text x="285" y="193" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">test.edu</text>
  <text x="285" y="207" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">outlook.com</text>
  <text x="285" y="221" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">yahoo.com</text>
  <text x="285" y="235" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">test.edu ←</text>
  <text x="285" y="249" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">example.org</text>
  <text x="285" y="263" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">outlook.com ←</text>

  <path d="M 355 215 L 385 215" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="205" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">去重</text>

  <rect x="390" y="155" width="165" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="472" y="175" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出：4 个不同域名</text>
  <text x="472" y="193" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">example.org</text>
  <text x="472" y="207" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">outlook.com</text>
  <text x="472" y="221" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">test.edu</text>
  <text x="472" y="235" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">yahoo.com</text>
  <text x="472" y="258" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">6 − 2 = 4：重复域名各留一行</text>

  <rect x="40" y="295" width="500" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="315" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">DISTINCT 的求值时机：逻辑执行顺序 FROM → WHERE → SELECT（含 DISTINCT）→ ORDER BY，</text>
  <text x="290" y="333" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">投影之后按整行去重——去重的正是「提取后的域名列」，无需子查询</text>
</svg>
