<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">克制三角环：F 克 E、E 克 W、W 克 F</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每回合双方同时出招，克制方得 1 分，同招互不得分（石头剪刀布换皮）</text>

  <!-- F 火龙 -->
  <circle cx="145" cy="125" r="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="145" y="122" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">F</text>
  <text x="145" y="140" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">火龙</text>

  <!-- W 水蛇 -->
  <circle cx="75" cy="245" r="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="75" y="242" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">W</text>
  <text x="75" y="260" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">水蛇</text>

  <!-- E 地精 -->
  <circle cx="215" cy="245" r="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="215" y="242" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="215" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">地精</text>

  <!-- F 克 E -->
  <path d="M 168 148 C 195 165, 200 195, 196 218" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="232" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">火龙喷地精</text>
  <text x="232" y="186" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">F 方 +1 分</text>

  <!-- E 克 W -->
  <path d="M 181 245 C 165 258, 125 258, 109 245" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="145" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">地精砸水蛇，E 方 +1 分</text>

  <!-- W 克 F -->
  <path d="M 93 220 C 105 195, 110 175, 122 154" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="42" y="172" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">水蛇浇火龙</text>
  <text x="42" y="186" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">W 方 +1 分</text>

  <!-- 右侧 δ 矩阵 -->
  <text x="396" y="72" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">δ(b, a)：Bob−Alice 分差增量</text>

  <rect x="290" y="80" width="56" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="318" y="96" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">Bob\Alice</text>
  <rect x="346" y="80" width="49" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370.5" y="96" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">F</text>
  <rect x="395" y="80" width="49" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="419.5" y="96" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">W</text>
  <rect x="444" y="80" width="49" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="468.5" y="96" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">E</text>

  <rect x="290" y="104" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="123" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Bob F</text>
  <rect x="346" y="104" width="49" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370.5" y="123" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="395" y="104" width="49" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419.5" y="123" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="444" y="104" width="49" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468.5" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>

  <rect x="290" y="134" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="153" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Bob W</text>
  <rect x="346" y="134" width="49" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370.5" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="395" y="134" width="49" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="419.5" y="153" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="444" y="134" width="49" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468.5" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <rect x="290" y="164" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="183" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Bob E</text>
  <rect x="346" y="164" width="49" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370.5" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="395" y="164" width="49" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419.5" y="183" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="444" y="164" width="49" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="468.5" y="183" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <text x="396" y="216" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">行 = Bob 出招 b，列 = Alice 出招 a</text>
  <text x="396" y="232" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">+1：b 克 a；−1：a 克 b；0：同招</text>

  <!-- 底部要点 -->
  <rect x="15" y="300" width="490" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">每回合 δ ∈ {−1, 0, +1} → n 回合后分差（Bob−Alice）∈ [−n, n]，仅 2n+1 个取值</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">胜负只看分差符号 → 状态里存一个分差就够，无需分别记双方得分</text>
</svg>
