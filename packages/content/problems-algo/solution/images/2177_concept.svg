<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：三个连续整数围绕中位数对称，和 = 3 × 中位数</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">设三个连续整数为 (x−1, x, x+1)，首尾相消，和 = 3x</text>

  <!-- ===== Left: three consecutive integers around x ===== -->
  <text x="40" y="76" font-size="11.5" fill="#446688" font-weight="bold">① 三个连续整数</text>

  <rect x="40" y="86" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="111" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">x−1</text>
  <rect x="112" y="86" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="144" y="111" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">x</text>
  <rect x="184" y="86" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="216" y="111" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">x+1</text>

  <text x="144" y="146" text-anchor="middle" font-size="11" fill="#888">中位数 x 居中，两侧 ±1 对称</text>

  <!-- arrow down to sum -->
  <path d="M 144 156 L 144 178" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="172" font-size="10" fill="#666" font-weight="bold">求和</text>

  <!-- ===== Sum derivation ===== -->
  <text x="40" y="196" font-size="11.5" fill="#d6a040" font-weight="bold">② 首尾相消：−1 与 +1 抵消</text>

  <rect x="40" y="206" width="208" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="144" y="233" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">(x−1) + x + (x+1) = 3x</text>

  <!-- arrow down to condition -->
  <path d="M 144 254 L 144 276" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Condition box ===== -->
  <rect x="40" y="282" width="208" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="144" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">num 能被 3 整除</text>
  <text x="144" y="322" text-anchor="middle" font-size="11" fill="#555">⟺ num = 3x</text>
  <text x="144" y="340" text-anchor="middle" font-size="11" fill="#555">⟺ x = num / 3</text>

  <!-- vertical divider -->
  <line x1="288" y1="60" x2="288" y2="360" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: example num = 33 ===== -->
  <text x="430" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">示例：num = 33</text>

  <rect x="330" y="86" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="430" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">33 ÷ 3 = 11 （整除）</text>

  <!-- arrow down -->
  <path d="M 430 130 L 430 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="446" y="146" font-size="10" fill="#4a7a3a" font-weight="bold">中位数</text>

  <!-- three numbers: 10, 11, 12 -->
  <rect x="330" y="158" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="358" y="183" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">10</text>
  <rect x="392" y="158" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="183" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">11</text>
  <rect x="454" y="158" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="482" y="183" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">12</text>

  <text x="430" y="216" text-anchor="middle" font-size="11" fill="#555">10 + 11 + 12 = 33 ✓</text>

  <!-- ===== Counter example num = 4 ===== -->
  <text x="430" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">反例：num = 4</text>

  <rect x="330" y="254" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="430" y="279" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4 ÷ 3 = 1 余 1 （不整除）</text>

  <!-- arrow down -->
  <path d="M 430 298 L 430 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="330" y="324" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="349" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回空数组 [ ]</text>
</svg>
