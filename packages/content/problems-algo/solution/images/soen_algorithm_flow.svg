<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预计算偶数和 + 逐查询 O(1) 增量更新</text>

  <!-- Start node -->
  <ellipse cx="270" cy="52" rx="132" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="12" fill="#333">开始: S = Σ(A[i] 为偶数), ans = []</text>

  <!-- arrow down -->
  <path d="M 270 72 L 270 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: queries left? -->
  <polygon points="270,92 370,132 270,172 170,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#333">还有查询?</text>
  <text x="270" y="144" text-anchor="middle" font-size="11" fill="#666">(i &lt; queries.length)</text>

  <!-- No branch -> end -->
  <path d="M 370 132 L 440 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="124" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="478" cy="132" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="136" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 172 L 270 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="186" font-size="11" fill="#82b366">是</text>

  <!-- Rect1: old = A[idx] -->
  <rect x="150" y="194" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="12" fill="#333">取 [val, idx]；old = A[idx]</text>

  <path d="M 270 228 L 270 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: old even? -->
  <polygon points="270,248 348,282 270,316 192,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="286" text-anchor="middle" font-size="12" fill="#333">old 为偶?</text>

  <!-- Yes -> left: S -= old -->
  <path d="M 192 282 L 142 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="274" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="28" y="264" width="112" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="84" y="287" text-anchor="middle" font-size="12" fill="#333">S -= old</text>
  <!-- rejoin -->
  <path d="M 84 300 L 84 322 L 268 322" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- No -> down -->
  <path d="M 270 316 L 270 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="328" font-size="10" fill="#b85450">否</text>

  <!-- Rect2: A[idx] += val; now = A[idx] -->
  <rect x="150" y="336" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="12" fill="#333">A[idx] += val；now = A[idx]</text>

  <path d="M 270 370 L 270 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: now even? -->
  <polygon points="270,390 348,424 270,458 192,424" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="428" text-anchor="middle" font-size="12" fill="#333">now 为偶?</text>

  <!-- Yes -> right: S += now -->
  <path d="M 348 424 L 398 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="416" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="400" y="406" width="112" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="456" y="429" text-anchor="middle" font-size="12" fill="#333">S += now</text>
  <!-- rejoin -->
  <path d="M 456 442 L 456 466 L 272 466" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- No -> down -->
  <path d="M 270 458 L 270 466" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="456" font-size="10" fill="#b85450">否</text>

  <!-- loop back -->
  <path d="M 270 466 L 60 466 L 60 132 L 168 132" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="300" text-anchor="middle" font-size="11" fill="#888">ans[i] = S</text>
  <text x="96" y="316" text-anchor="middle" font-size="11" fill="#888">继续下一查询</text>

  <!-- summary note -->
  <text x="270" y="490" text-anchor="middle" font-size="11" fill="#888">预计算 O(n) + 每查询 O(1)，共 O(n + q) 时间 O(1) 额外空间</text>
</svg>
