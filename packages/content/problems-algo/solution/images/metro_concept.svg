<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：双哈希表分离「在途」与「累计」</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888">checkIns 临时记录进站信息，travelTimes 永久累计各站对时长与次数</text>

  <!-- Left: checkIns map -->
  <rect x="40" y="64" width="270" height="156" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">checkIns: id → (站, 进站时间)</text>
  <line x1="56" y1="96" x2="294" y2="96" stroke="#446688" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <rect x="56" y="106" width="238" height="30" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="126" font-size="12" fill="#446688" font-weight="bold">45</text>
  <text x="96" y="126" font-size="11" fill="#666">→ (Leyton, 3)</text>

  <rect x="56" y="142" width="238" height="30" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="162" font-size="12" fill="#446688" font-weight="bold">32</text>
  <text x="96" y="162" font-size="11" fill="#666">→ (Paradise, 8)</text>

  <rect x="56" y="178" width="238" height="30" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="198" font-size="12" fill="#446688" font-weight="bold">27</text>
  <text x="96" y="198" font-size="11" fill="#666">→ (Leyton, 10)</text>

  <!-- Right: travelTimes map -->
  <rect x="350" y="64" width="270" height="156" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="485" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">travelTimes: (起, 终) → (总时, 次数)</text>
  <line x1="366" y1="96" x2="604" y2="96" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <rect x="366" y="106" width="238" height="30" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="378" y="126" font-size="10" fill="#666">(Leyton, Waterloo)</text>
  <text x="510" y="126" font-size="11" fill="#4a7a3a" font-weight="bold">→ (22, 2)</text>

  <rect x="366" y="142" width="238" height="30" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="378" y="162" font-size="10" fill="#666">(Paradise, Cambridge)</text>
  <text x="510" y="162" font-size="11" fill="#4a7a3a" font-weight="bold">→ (14, 1)</text>

  <rect x="366" y="178" width="238" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="485" y="198" text-anchor="middle" font-size="10" fill="#999">更多站对…</text>

  <!-- checkIn box -->
  <rect x="50" y="300" width="150" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">checkIn(id, 站, t)</text>
  <text x="125" y="336" text-anchor="middle" font-size="10" fill="#888">写入 checkIns[id]</text>

  <!-- arrow checkIn -> checkIns -->
  <path d="M 125 300 L 125 224" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="134" y="266" font-size="10" fill="#446688" font-weight="bold">写入</text>

  <!-- checkOut box (center) -->
  <rect x="230" y="280" width="210" height="106" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="335" y="302" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">checkOut(id, 站, t)</text>
  <text x="244" y="322" font-size="10" fill="#666">① 查 checkIns[id] = (起, tIn)</text>
  <text x="244" y="338" font-size="10" fill="#666">② 时差 = t − tIn</text>
  <text x="244" y="354" font-size="10" fill="#666">③ travelTimes[(起,站)] += (时差, 1)</text>
  <text x="244" y="370" font-size="10" fill="#666">④ 删除 checkIns[id]</text>

  <!-- arrow checkOut -> checkIns (read + delete) -->
  <path d="M 270 280 L 200 224" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="206" y="256" font-size="10" fill="#d6a040" font-weight="bold">查+删</text>

  <!-- arrow checkOut -> travelTimes (write) -->
  <path d="M 400 280 L 470 224" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="416" y="256" font-size="10" fill="#d6a040" font-weight="bold">累加</text>

  <!-- getAverageTime box -->
  <rect x="460" y="300" width="170" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">getAverageTime(起, 终)</text>
  <text x="545" y="336" text-anchor="middle" font-size="10" fill="#888">返回 total / count</text>

  <!-- arrow getAverageTime -> travelTimes -->
  <path d="M 545 300 L 545 224" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="554" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">读</text>

  <!-- bottom summary -->
  <rect x="80" y="400" width="500" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="420" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">三操作均为 O(1)：进站写左表，出站查左写右，查均走右表</text>
</svg>
