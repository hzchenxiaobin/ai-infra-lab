<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：收集 → DFS 全排列匹配 → 剪枝回溯</text>

  <!-- step 1 -->
  <rect x="165" y="40" width="230" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 收集：zeros ← 所有 grid=0 的格子</text>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">extras ← 格子 c 重复 grid[c]−1 份</text>
  <path d="M280,90 L280,104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="165" y="106" width="230" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② dfs(zi, cost)：给第 zi 个空格挑来源</text>
  <path d="M280,142 L280,156" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- prune diamond -->
  <polygon points="280,158 370,198 280,238 190,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">cost ≥ best？</text>
  <path d="M370,198 L408,198" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="194" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="416" y="212" font-size="11" fill="#b85450" filter="url(#rough2)">剪枝返回</text>
  <path d="M280,238 L280,254" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="251" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- done diamond -->
  <polygon points="280,258 370,298 280,338 190,298" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="12" fill="#2e4d24" filter="url(#rough2)">zi == b？</text>
  <path d="M370,298 L396,298" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="294" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="404" y="278" width="128" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="468" y="295" text-anchor="middle" font-size="12" fill="#2e4d24" filter="url(#rough2)">best = cost</text>
  <text x="468" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（更新最优）</text>
  <path d="M280,338 L280,354" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="351" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- step 3 -->
  <rect x="140" y="356" width="280" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 枚举未使用的 extra k</text>
  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = |Δr| + |Δc|，标记 used[k]</text>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">递归 dfs(zi+1, cost + d)</text>
  <path d="M280,420 L280,434" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- backtrack -->
  <rect x="140" y="436" width="280" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="459" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">回溯：used[k] = false，换下一个 k</text>
  <path d="M140,454 L112,454 L112,388 L134,388" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M280,472 L280,484" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="165" y="486" width="230" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="511" text-anchor="middle" font-size="13" fill="#8c3a35" font-weight="bold" filter="url(#rough2)">返回 best（全 1 网格 = 0）</text>
</svg>
