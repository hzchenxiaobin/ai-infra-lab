<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：散射累加 + argmax</text>

  <g filter="url(#rough2)">
    <!-- A : init -->
    <rect x="130" y="40" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="280" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 score[0..n−1] = 0（用 long long）</text>
    <text x="280" y="70" text-anchor="middle" font-size="10" fill="#888">ans = 0，作为 argmax 候选</text>

    <!-- arrow A -> B -->
    <line x1="280" y1="76" x2="280" y2="92" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- B : loop header -->
    <rect x="150" y="94" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="280" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 i = 0 … n−1</text>

    <!-- arrow B -> C -->
    <line x1="280" y1="124" x2="280" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- C : loop body -->
    <rect x="100" y="142" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="280" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">score[edges[i]] += i</text>
    <text x="280" y="176" text-anchor="middle" font-size="10" fill="#7a5a20">源 i 把自己的编号投进“目标桶” edges[i]</text>

    <!-- loop-back arrow: from C right edge -> up -> into B right edge -->
    <path d="M 460 164 L 492 164 L 492 109 L 412 109" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="500" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i++</text>
    <text x="500" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a">继续</text>

    <!-- exit arrow: C -> E (loop done) -->
    <line x1="280" y1="186" x2="280" y2="206" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="300" y="200" font-size="10" fill="#888">i=n 退出</text>

    <!-- E : argmax -->
    <rect x="70" y="208" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="280" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">argmax：ans=0；仅当 score[i] &gt; score[ans] 才更新 ans</text>
    <text x="280" y="242" text-anchor="middle" font-size="10" fill="#6688aa">“严格大于” ⇒ 并列时保留下标更小者</text>

    <!-- arrow E -> F -->
    <line x1="280" y1="252" x2="280" y2="270" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- F : return -->
    <rect x="210" y="272" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16"/>
    <text x="280" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

    <!-- overflow note -->
    <rect x="60" y="318" width="440" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" rx="8"/>
    <text x="280" y="337" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ score 用 long long：最坏和 ≈ n²/2 ≈ 5×10⁹，超出 int 上限</text>
  </g>
</svg>
