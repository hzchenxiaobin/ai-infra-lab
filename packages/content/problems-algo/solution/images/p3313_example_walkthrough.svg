<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：edges = [[0,1],[0,2],[2,3],[2,4]]</text>
  <text x="260" y="37" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n = 5，官方输出 [3,3,1,1,1]</text>

  <!-- ===== 树结构 ===== -->
  <line x1="70" y1="105" x2="150" y2="105" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="105" x2="230" y2="105" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="230" y1="105" x2="305" y2="62" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="230" y1="105" x2="305" y2="148" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 直径路径 3-2-0-1 高亮 -->
  <line x1="70" y1="105" x2="150" y2="105" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="150" y1="105" x2="230" y2="105" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="230" y1="105" x2="305" y2="62" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>

  <!-- 普通节点 0、2、4 -->
  <circle cx="150" cy="105" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="110" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="230" cy="105" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="110" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="305" cy="148" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="305" y="153" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- b = 1（橙色） -->
  <circle cx="70" cy="105" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="70" y="110" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="70" y="80" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">b = 1</text>

  <!-- a = 3（红色） -->
  <circle cx="305" cy="62" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="305" y="67" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="330" y="56" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">a = 3</text>

  <text x="260" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">直径 (a, b) = (3, 1)，长度 3（路径 3-2-0-1，绿色加粗）</text>

  <!-- ===== 演算表格 ===== -->
  <!-- 表头 -->
  <text x="138" y="213" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">节点 i</text>
  <g filter="url(#rough2)">
    <rect x="150" y="196" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="206" y="196" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="262" y="196" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="318" y="196" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="374" y="196" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <text x="178" y="213" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="234" y="213" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="290" y="213" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="346" y="213" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="402" y="213" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- dist1 行 -->
  <text x="138" y="243" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">dist1（BFS 0）</text>
  <g filter="url(#rough2)">
    <rect x="150" y="226" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="206" y="226" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="262" y="226" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="318" y="226" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="374" y="226" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
  </g>
  <text x="178" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="234" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="290" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="346" y="243" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="402" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="448" y="243" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最远 → a=3</text>

  <!-- dist2 行 -->
  <text x="138" y="273" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">dist2（BFS a=3）</text>
  <g filter="url(#rough2)">
    <rect x="150" y="256" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="206" y="256" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="262" y="256" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="318" y="256" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="374" y="256" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
  </g>
  <text x="178" y="273" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="234" y="273" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="290" y="273" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="346" y="273" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="402" y="273" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="448" y="273" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">最远 → b=1</text>

  <!-- dist3 行 -->
  <text x="138" y="303" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">dist3（BFS b=1）</text>
  <g filter="url(#rough2)">
    <rect x="150" y="286" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="206" y="286" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="262" y="286" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="318" y="286" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="374" y="286" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
  </g>
  <text x="178" y="303" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="234" y="303" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="303" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="346" y="303" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="402" y="303" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- 更远端行 -->
  <text x="138" y="333" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">更远端</text>
  <g filter="url(#rough2)">
    <rect x="150" y="316" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="206" y="316" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="262" y="316" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="318" y="316" width="56" height="26" fill="#ffffff" stroke="#99a" stroke-width="1" rx="4"/>
    <rect x="374" y="316" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <text x="178" y="333" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="234" y="333" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="290" y="333" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="346" y="333" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="402" y="333" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="448" y="333" font-size="9" fill="#a07830" filter="url(#rough2)">并列任取</text>

  <!-- 答案行 -->
  <text x="138" y="363" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">答案 ans[i]</text>
  <g filter="url(#rough2)">
    <rect x="150" y="346" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="206" y="346" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="262" y="346" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="318" y="346" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="374" y="346" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="178" y="363" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="234" y="363" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="290" y="363" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="346" y="363" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="402" y="363" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="402" y="381" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">i=4：3 = 3 并列，任取 b ✓</text>

  <!-- 底部结论 -->
  <rect x="26" y="392" width="468" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="409" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 [3,3,1,1,1] ✓ 与官方输出一致</text>
  <text x="260" y="425" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">节点 4 到 1、到 3 等距（都是最远点），任取其一皆合法——题目允许任选</text>
</svg>
