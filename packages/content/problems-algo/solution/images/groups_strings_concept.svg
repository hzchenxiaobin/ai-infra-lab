<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：字符串 → 26 位掩码，三种关联 = 位翻转</text>

  <!-- words -> masks -->
  <text x="20" y="58" font-size="11.5" fill="#888">字符串 → 掩码（低 5 位示意）：</text>

  <rect x="30" y="68" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="84" text-anchor="middle" font-size="11.5" fill="#333">"a"</text>
  <text x="86" y="84" font-size="11" fill="#888">→</text>
  <g font-size="11" fill="#333">
    <rect x="104" y="70" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="114" y="83" text-anchor="middle">1</text>
    <rect x="124" y="70" width="20" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="134" y="83" text-anchor="middle" fill="#aaa">0</text>
    <rect x="144" y="70" width="20" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="154" y="83" text-anchor="middle" fill="#aaa">0</text>
    <rect x="164" y="70" width="20" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="174" y="83" text-anchor="middle" fill="#aaa">0</text>
    <rect x="184" y="70" width="20" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="194" y="83" text-anchor="middle" fill="#aaa">0</text>
    <text x="214" y="84" font-size="10" fill="#888">... = 1</text>
  </g>

  <rect x="30" y="96" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="112" text-anchor="middle" font-size="11.5" fill="#333">"ab"</text>
  <text x="86" y="112" font-size="11" fill="#888">→</text>
  <g font-size="11" fill="#333">
    <rect x="104" y="98" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="114" y="111" text-anchor="middle">1</text>
    <rect x="124" y="98" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="134" y="111" text-anchor="middle">1</text>
    <rect x="144" y="98" width="20" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="154" y="111" text-anchor="middle" fill="#aaa">0</text>
    <rect x="164" y="98" width="20" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="174" y="111" text-anchor="middle" fill="#aaa">0</text>
    <rect x="184" y="98" width="20" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="194" y="111" text-anchor="middle" fill="#aaa">0</text>
    <text x="214" y="112" font-size="10" fill="#888">... = 3</text>
  </g>

  <rect x="30" y="124" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="140" text-anchor="middle" font-size="11.5" fill="#333">"cde"</text>
  <text x="86" y="140" font-size="11" fill="#888">→</text>
  <g font-size="11" fill="#333">
    <rect x="104" y="126" width="20" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="114" y="139" text-anchor="middle" fill="#aaa">0</text>
    <rect x="124" y="126" width="20" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="134" y="139" text-anchor="middle" fill="#aaa">0</text>
    <rect x="144" y="126" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="154" y="139" text-anchor="middle">1</text>
    <rect x="164" y="126" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="174" y="139" text-anchor="middle">1</text>
    <rect x="184" y="126" width="20" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="194" y="139" text-anchor="middle">1</text>
    <text x="214" y="140" font-size="10" fill="#888">... = 28</text>
  </g>
  <text x="280" y="139" font-size="10" fill="#888">位 c = 字母 ('a'=bit0)</text>

  <!-- three operations -->
  <text x="20" y="172" font-size="12" fill="#555" font-weight="bold">三种关联操作 = 位翻转：</text>

  <!-- add -->
  <rect x="30" y="184" width="150" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">添加 add</text>
  <text x="105" y="222" text-anchor="middle" font-size="11" fill="#446688">m → m | (1&lt;&lt;c)</text>
  <text x="105" y="236" text-anchor="middle" font-size="10.5" fill="#555">[0]→[1]，popcount +1</text>

  <!-- remove -->
  <rect x="195" y="184" width="150" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">删去 remove</text>
  <text x="270" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a">m → m ^ (1&lt;&lt;c)</text>
  <text x="270" y="236" text-anchor="middle" font-size="10.5" fill="#555">[1]→[0]，popcount −1</text>

  <!-- replace -->
  <rect x="360" y="184" width="170" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">替换 replace</text>
  <text x="445" y="222" text-anchor="middle" font-size="10.5" fill="#d6a040">m ^ (1&lt;&lt;c1) ^ (1&lt;&lt;c2)</text>
  <text x="445" y="236" text-anchor="middle" font-size="10.5" fill="#555">[1]→[0] 且 [0]→[1]，不变</text>

  <!-- merge note -->
  <rect x="30" y="254" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#333">添加 + 删去 合并：枚举 26 位 b，统一算 m' = m ⊕ (1&lt;&lt;b)</text>

  <!-- neighbor count -->
  <rect x="30" y="304" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="326" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">每掩码邻居数</text>
  <text x="150" y="344" text-anchor="middle" font-size="11" fill="#555">添加/删去：26</text>
  <text x="150" y="356" text-anchor="middle" font-size="11" fill="#555">替换：≤169（或虚点 ≤26）</text>

  <rect x="290" y="304" width="240" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="326" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">总连边（n=2×10⁴）</text>
  <text x="410" y="344" text-anchor="middle" font-size="11" fill="#555">暴力两两：~2×10⁸ ❌</text>
  <text x="410" y="356" text-anchor="middle" font-size="11" fill="#555">枚举邻居：~10⁶ ✅</text>
</svg>
