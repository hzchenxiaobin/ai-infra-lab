<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：回文逐层「剥皮」——每剥掉一对首尾字符，贡献长度 2</text>
  <text x="260" y="32" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">示例 4 · A = "abc"（取自 s）+ B = "ba"（取自 t）→ W = "abcba"</text>

  <!-- pair arcs above W -->
  <path d="M 160 62 Q 240 26 320 62" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="118" y="42" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[0]=t[4]</text>
  <path d="M 200 62 Q 240 38 280 62" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrO)" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="336" y="56" text-anchor="start" font-size="8.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">s[1]=t[3]</text>

  <!-- W strip -->
  <text x="112" y="94" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">W :</text>
  <g filter="url(#rough2)">
    <rect x="140" y="68" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="180" y="68" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="220" y="68" width="40" height="38" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.6" rx="4"/>
    <rect x="260" y="68" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="300" y="68" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="160" y="93" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">a</text>
    <text x="200" y="93" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">b</text>
    <text x="240" y="93" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold">c</text>
    <text x="280" y="93" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">b</text>
    <text x="320" y="93" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">a</text>
  </g>
  <text x="200" y="124" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">A ⊆ s（前 3 格）</text>
  <text x="300" y="124" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">B ⊆ t（后 2 格）</text>

  <text x="260" y="148" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">剥完两对外层配对只剩核 "c"——它是 s 中以 2 为起点的回文，长度由 p[2] 兜底</text>

  <!-- three cases -->
  <g filter="url(#rough2)">
    <rect x="12" y="162" width="158" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="91" y="180" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">① B 为空（停在当前层）</text>
    <text x="91" y="196" text-anchor="middle" font-size="8.5" fill="#33506b">核 = s 中以 i 为起点的</text>
    <text x="91" y="210" text-anchor="middle" font-size="8.5" fill="#33506b">最长回文 → best = p[i]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="181" y="162" width="158" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="260" y="180" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">② A 为空（停在当前层）</text>
    <text x="260" y="196" text-anchor="middle" font-size="8.5" fill="#2f5d24">核 = t 中以 j 为终点的</text>
    <text x="260" y="210" text-anchor="middle" font-size="8.5" fill="#2f5d24">最长回文 → best = q[j]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="350" y="162" width="158" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="429" y="180" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">③ s[i] = t[j]（再剥一层）</text>
    <text x="429" y="196" text-anchor="middle" font-size="8.5" fill="#8a6d1f">首 s[i]、尾 t[j] 是一对</text>
    <text x="429" y="210" text-anchor="middle" font-size="8.5" fill="#8a6d1f">→ best = 2 + dp[i+1][j−1]</text>
  </g>

  <!-- recurrence box -->
  <g filter="url(#rough2)">
    <rect x="60" y="230" width="400" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="247" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">dp[i][j] = max( p[i] , q[j] , s[i]=t[j] 时 2 + dp[i+1][j−1] )</text>
    <text x="260" y="263" text-anchor="middle" font-size="9" fill="#33506b">ans = 所有 dp[i][j] 的最大值（三个分支各自对应合法构造，取 max 不重不漏）</text>
  </g>

  <text x="260" y="290" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">转移只依赖 (i+1, j−1) ⇒ i 倒序、j 正序填表，一行滚动即可，dp 空间 O(n)</text>
  <text x="260" y="306" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">预处理：p、q 用 O(n²) 回文区间表求「每个起点 / 每个终点的最长回文」</text>
</svg>
