<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="540" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">TimeMap：set / get 流程</text>

  <!-- set box -->
  <rect x="30" y="40" width="180" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="120" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">set(key, val, ts)</text>
  <line x1="42" y1="70" x2="198" y2="70" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="90" text-anchor="middle" font-size="11" fill="#444">map[key].append</text>
  <text x="120" y="108" text-anchor="middle" font-size="11" fill="#444">( (ts, val) )</text>
  <text x="120" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(1) 均摊追加</text>

  <!-- get box -->
  <rect x="250" y="40" width="180" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">get(key, ts)</text>
  <line x1="262" y1="70" x2="418" y2="70" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="340" y="90" text-anchor="middle" font-size="11" fill="#444">二分查「≤ ts 的最大版本」</text>
  <text x="340" y="108" text-anchor="middle" font-size="11" fill="#444">命中则返回 value</text>
  <text x="340" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">O(log m)</text>

  <!-- get flow path -->
  <path d="M 340 142 L 340 162" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond: key in map? -->
  <polygon points="340,166 430,206 340,246 250,206" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">key 存在 ?</text>
  <text x="340" y="220" text-anchor="middle" font-size="10" fill="#777">map 中有该键？</text>

  <!-- No branch -->
  <path d="M 250 206 L 190 206 L 190 268" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="200" y="198" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="120" y="272" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="190" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ""</text>
  <text x="190" y="306" text-anchor="middle" font-size="9.5" fill="#888">无任何历史版本</text>

  <!-- Yes branch -->
  <path d="M 430 206 L 430 268" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="436" y="200" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- binary search box -->
  <rect x="300" y="272" width="260" height="0" fill="none"/>
  <rect x="270" y="272" width="320" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">二分有序列表</text>
  <text x="430" y="314" text-anchor="middle" font-size="10.5" fill="#555">lo=0, hi=len−1, ans=−1</text>
  <text x="430" y="332" text-anchor="middle" font-size="10.5" fill="#555">mid.ts ≤ ts ? 记 ans, lo=mid+1</text>
  <text x="430" y="350" text-anchor="middle" font-size="10.5" fill="#555">          : hi=mid−1</text>

  <!-- fix the yes arrow target to binary search box (re-anchor visually) -->
  <path d="M 430 268 L 430 272" stroke="#888" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <path d="M 430 364 L 430 384" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond: ans >= 0 ? -->
  <polygon points="340,388 430,424 340,460 250,424" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="420" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans ≥ 0 ?</text>
  <text x="340" y="436" text-anchor="middle" font-size="10" fill="#777">找到 ≤ ts 的版本？</text>

  <!-- No -->
  <path d="M 250 424 L 200 424 L 200 472" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="206" y="418" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="140" y="476" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="501" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ""</text>

  <!-- Yes -->
  <path d="M 430 424 L 430 472" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="436" y="418" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="370" y="476" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="440" y="494" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 list[ans].val</text>
  <text x="440" y="508" text-anchor="middle" font-size="9.5" fill="#888">最大合法版本值</text>

  <text x="230" y="530" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">set 始终 O(1)   ·   get 始终 O(log m)</text>
</svg>
