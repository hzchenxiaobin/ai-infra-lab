<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：1:2 配对规则与三种缺口</text>

  <!-- ===== 顶部：普通匹配 1:1 ===== -->
  <rect x="30" y="44" width="230" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="64" font-size="11" fill="#446688" font-weight="bold">普通括号匹配（1:1）</text>
  <!-- ( -->
  <rect x="56" y="74" width="34" height="34" fill="#fff" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="73" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">(</text>
  <!-- ) -->
  <rect x="104" y="74" width="34" height="34" fill="#fff" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="121" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">)</text>
  <!-- pair arrow -->
  <path d="M 90 91 L 104 91" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="86" font-size="11" fill="#4a7a3a" font-weight="bold">"()" ✓</text>
  <text x="150" y="104" font-size="10" fill="#888">一个 ( 配一个 )</text>

  <!-- ===== 顶部右：本题 1:2 ===== -->
  <rect x="300" y="44" width="230" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="318" y="64" font-size="11" fill="#d6a040" font-weight="bold">本题：1:2 配对</text>
  <!-- ( -->
  <rect x="326" y="74" width="34" height="34" fill="#fff" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">(</text>
  <!-- )) -->
  <rect x="374" y="74" width="34" height="34" fill="#fff" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="391" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">)</text>
  <rect x="410" y="74" width="34" height="34" fill="#fff" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">)</text>
  <!-- pair bracket -->
  <path d="M 360 116 L 360 110 L 444 110 L 444 116" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="104" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">连续两个 )</text>
  <text x="466" y="86" font-size="11" fill="#b85450" font-weight="bold">"())" ✓</text>
  <text x="466" y="104" font-size="10" fill="#b85450" font-weight="bold">"()" ✗</text>

  <!-- Divider -->
  <line x1="30" y1="146" x2="530" y2="146" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">遇到 ')' 时的三种缺口与补法</text>

  <!-- ===== 缺口 1: )) 无 ( → 补 ( ===== -->
  <rect x="30" y="182" width="160" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">① )) 但无 ( 可配</text>
  <rect x="52" y="210" width="28" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="66" y="228" text-anchor="middle" font-size="12" fill="#333">)</text>
  <rect x="82" y="210" width="28" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="96" y="228" text-anchor="middle" font-size="12" fill="#333">)</text>
  <text x="118" y="226" font-size="10" fill="#888">left=0</text>
  <rect x="44" y="246" width="132" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="259" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">补 1 个 ( → ans+1</text>

  <!-- ===== 缺口 2: 单个 ) 且有 ( → 补 ) ===== -->
  <rect x="200" y="182" width="160" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="214" y="200" font-size="10" fill="#d6a040" font-weight="bold">② 单个 ) 且有 (</text>
  <rect x="222" y="210" width="28" height="26" fill="#fff" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="236" y="228" text-anchor="middle" font-size="12" fill="#333">(</text>
  <rect x="252" y="210" width="28" height="26" fill="#fff" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="228" text-anchor="middle" font-size="12" fill="#333">)</text>
  <text x="288" y="222" font-size="10" fill="#888">缺一个 )</text>
  <text x="288" y="234" font-size="10" fill="#888">凑成 ))</text>
  <rect x="214" y="246" width="132" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="259" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">补 1 个 ) → ans+1</text>

  <!-- ===== 缺口 3: 单个 ) 无 ( → 补 ( 和 ) ===== -->
  <rect x="370" y="182" width="160" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="200" font-size="10" fill="#b85450" font-weight="bold">③ 单个 ) 且无 (</text>
  <rect x="402" y="210" width="28" height="26" fill="#fff" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="416" y="228" text-anchor="middle" font-size="12" fill="#333">)</text>
  <text x="438" y="222" font-size="10" fill="#888">既缺 (</text>
  <text x="438" y="234" font-size="10" fill="#888">又缺一个 )</text>
  <rect x="384" y="246" width="132" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="259" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">补 ( 和 ) → ans+2</text>

  <!-- ===== 底部总结 ===== -->
  <rect x="30" y="292" width="500" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="314" font-size="12" fill="#444" font-weight="bold">贪心口诀：成对看 )，缺啥补啥，末尾补尾</text>
  <text x="50" y="338" font-size="11" fill="#666">• 遇到 )) ：有 ( 则配掉，无 ( 则补 (（+1）</text>
  <text x="50" y="358" font-size="11" fill="#666">• 遇到单个 )：有 ( 则补 )（+1），无 ( 则补 ( 和 )（+2）</text>
  <text x="50" y="378" font-size="11" fill="#b85450" font-weight="bold">• 扫描结束：剩余每个 ( 再补两个 )（ans += left × 2）</text>
</svg>
