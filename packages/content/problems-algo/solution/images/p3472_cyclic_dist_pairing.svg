<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：循环距离 dist + 配对代价独立可加</text>

  <!-- ===== left: cyclic alphabet ring ===== -->
  <circle cx="140" cy="182" r="92" fill="none" stroke="#9db4c9" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="162" y="95.7" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">b</text>
  <text x="182.8" y="103.5" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">c</text>
  <text x="215.7" y="132.7" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">e</text>
  <text x="226" y="152.4" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">f</text>
  <text x="231.3" y="173.9" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">g</text>
  <text x="231.3" y="196.1" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">h</text>
  <text x="226" y="217.6" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">i</text>
  <text x="215.7" y="237.3" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">j</text>
  <text x="201" y="253.9" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">k</text>
  <text x="182.8" y="266.5" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">l</text>
  <text x="162" y="274.3" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">m</text>
  <text x="140" y="277" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">n</text>
  <text x="118" y="274.3" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">o</text>
  <text x="97.2" y="266.5" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">p</text>
  <text x="79" y="253.9" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">q</text>
  <text x="64.3" y="237.3" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">r</text>
  <text x="54" y="217.6" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">s</text>
  <text x="48.7" y="196.1" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">t</text>
  <text x="48.7" y="173.9" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">u</text>
  <text x="54" y="152.4" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">v</text>
  <text x="64.3" y="132.7" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">w</text>
  <text x="79" y="106.5" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">x</text>
  <text x="97.2" y="103.5" text-anchor="middle" font-size="9.5" fill="#556" filter="url(#rough2)">y</text>

  <text x="140" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="118" y="96.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">z</text>
  <text x="201" y="117.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">d</text>

  <text x="140" y="178" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">循环字母表</text>
  <text x="140" y="194" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（z 的下一个是 a）</text>

  <!-- red seam arc: z -> a (cost 1, crossing the seam) -->
  <path d="M 117 87 Q 127 62 139 86" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="98" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">dist(a,z) = 1</text>
  <text x="98" y="66" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">跨接缝反而最近！</text>

  <!-- green arc: a -> d (cost 3, along the ring) -->
  <path d="M 142 82 A 104 104 0 0 1 208 104" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">dist(a,d) = 3</text>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="28" y="296" width="226" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="141" y="314" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f">dist(x,y) = min(|x−y|, 26−|x−y|)</text>
    <text x="141" y="331" text-anchor="middle" font-size="9" fill="#55677d">把 x、y 改成同一字母的最少步数</text>
  </g>

  <!-- ===== right: pairing costs add up ===== -->
  <text x="385" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#444" filter="url(#rough2)">配对代价独立可加 —— 示例 2</text>
  <text x="385" y="63" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">s = a a a z z z，k = 4</text>

  <rect x="285" y="72" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <rect x="321" y="72" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="337" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <rect x="357" y="72" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="373" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <rect x="393" y="72" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="409" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">z</text>
  <rect x="429" y="72" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="445" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">z</text>
  <rect x="465" y="72" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="481" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">z</text>

  <!-- nested pairing arcs -->
  <path d="M 373 106 Q 391 128 409 106" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 337 106 Q 391 152 445 106" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 301 106 Q 391 176 481 106" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="391" y="160" text-anchor="middle" font-size="9.5" fill="#55677d" filter="url(#rough2)">三对各花 dist = 1</text>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="272" y="176" width="226" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="385" y="194" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">总花费 1+1+1 = 3 ≤ k = 4</text>
    <text x="385" y="210" text-anchor="middle" font-size="9.5" fill="#2f5d24">各对改成同字母（如 z a a a a z）</text>
    <text x="385" y="227" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">⇒ 最长回文子序列长度 = 6</text>
  </g>

  <!-- note box -->
  <g filter="url(#rough2)">
    <rect x="272" y="248" width="226" height="94" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="385" y="266" text-anchor="middle" font-size="9" font-weight="bold" fill="#33506b">回文 = 不相交位置对 + 至多 1 个中心</text>
    <text x="385" y="282" text-anchor="middle" font-size="9" fill="#55677d">每对只改自己那两个位置</text>
    <text x="385" y="298" text-anchor="middle" font-size="9" fill="#55677d">⇒ 代价可加：总花费 = Σ dist</text>
    <text x="385" y="318" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8f3a35">⇒ 剩余预算 c 写进 DP 状态</text>
  </g>
</svg>
