<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">SQL 逻辑执行流程：两标量子查询 → 笛卡尔积合成一行 → CASE WHEN 选胜方</text>

  <!-- step circles -->
  <circle cx="34" cy="92" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <circle cx="34" cy="178" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <circle cx="34" cy="260" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <circle cx="34" cy="338" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Step 1: two subqueries -->
  <rect x="70" y="64" width="230" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="185" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">子查询 n1（纽约优秀生数）</text>
  <text x="185" y="98" text-anchor="middle" font-size="9" fill="#333">SELECT COUNT(*) AS cnt</text>
  <text x="185" y="110" text-anchor="middle" font-size="9" fill="#333">FROM NewYork WHERE score &gt;= 90</text>

  <rect x="330" y="64" width="230" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">子查询 n2（加州优秀生数）</text>
  <text x="445" y="98" text-anchor="middle" font-size="9" fill="#333">SELECT COUNT(*) AS cnt</text>
  <text x="445" y="110" text-anchor="middle" font-size="9" fill="#333">FROM California WHERE score &gt;= 90</text>

  <!-- arrows down to merge -->
  <line x1="185" y1="120" x2="292" y2="156" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <line x1="445" y1="120" x2="332" y2="156" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Step 2: cross join one row -->
  <rect x="190" y="152" width="250" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="315" y="170" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">FROM n1, n2  （1 行 × 1 行 → 1 行）</text>
  <text x="315" y="186" text-anchor="middle" font-size="9" fill="#555">合成单行：n1.cnt | n2.cnt</text>
  <text x="315" y="196" text-anchor="middle" font-size="8.5" fill="#999">两子查询各返回单行单列 → 逗号连接即笛卡尔积</text>

  <!-- arrow down -->
  <line x1="315" y1="200" x2="315" y2="230" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: CASE WHEN -->
  <rect x="120" y="232" width="390" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="315" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">SELECT CASE</text>
  <text x="315" y="264" text-anchor="middle" font-size="9" fill="#333">WHEN n1.cnt &gt; n2.cnt THEN 'New York University'</text>
  <text x="315" y="276" text-anchor="middle" font-size="9" fill="#333">WHEN n1.cnt &lt; n2.cnt THEN 'California University'</text>
  <text x="315" y="288" text-anchor="middle" font-size="9" fill="#333">ELSE 'No Winner' END AS winner</text>

  <!-- arrow down -->
  <line x1="315" y1="294" x2="315" y2="320" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: output -->
  <rect x="220" y="322" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="315" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出 winner（单行单列）</text>

  <!-- side annotation -->
  <text x="575" y="96" font-size="9" fill="#999">各表 COUNT + WHERE</text>
  <text x="575" y="178" font-size="9" fill="#999">单行笛卡尔积</text>
  <text x="575" y="264" font-size="9" fill="#999">三分支判定</text>
  <text x="575" y="342" font-size="9" fill="#999">投影输出</text>
</svg>
