<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三角形不等式：任意两边之和 &gt; 第三边 才能闭合</text>

  <!-- Left panel: cannot form triangle (13, 15, 30) -->
  <text x="135" y="52" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">不能构成三角形</text>

  <!-- base z=30 -->
  <path d="M 45 235 L 235 235" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="140" y="255" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">z = 30</text>

  <!-- left side x=13 -->
  <path d="M 45 235 L 135 158" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="72" y="200" font-size="12" fill="#d6a040" font-weight="bold">x=13</text>

  <!-- right side y=15 -->
  <path d="M 235 235 L 178 170" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="200" y="205" font-size="12" fill="#446688" font-weight="bold">y=15</text>

  <!-- gap dashed between (135,158) and (178,170) -->
  <path d="M 135 158 L 178 170" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="156" y="152" text-anchor="middle" font-size="10" fill="#b85450">合不上</text>

  <!-- red X -->
  <text x="135" y="288" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗ 13+15 = 28 &lt; 30</text>

  <!-- Right panel: can form triangle (10, 20, 15) -->
  <text x="380" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">能构成三角形</text>

  <!-- triangle vertices A=(310,235) B=(460,235) C=(375,128) -->
  <path d="M 310 235 L 460 235 L 375 128 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- side labels -->
  <text x="385" y="253" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="328" y="185" font-size="12" fill="#d6a040" font-weight="bold">20</text>
  <text x="435" y="185" font-size="12" fill="#446688" font-weight="bold">15</text>

  <!-- green check -->
  <text x="380" y="288" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 10+15 = 25 &gt; 20</text>

  <!-- divider -->
  <path d="M 260 60 L 260 300" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- bottom summary boxes -->
  <rect x="40" y="312" width="220" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="336" text-anchor="middle" font-size="11" fill="#444">最小两边和 &lt; 最大边 → 无法闭合</text>

  <rect x="270" y="312" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="336" text-anchor="middle" font-size="11" fill="#444">最小两边和 &gt; 最大边 → 三边闭合</text>
</svg>
