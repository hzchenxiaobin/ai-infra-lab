<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：数余数 → 试两种开局 → OR 汇总</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">Alice 任选一种开局能赢即赢；check(ca,cb) 描述「开余 a」的结局</text>

  <!-- 1. count -->
  <rect x="170" y="58" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 统计 c₀, c₁, c₂</text>
  <text x="280" y="91" text-anchor="middle" font-size="10" fill="#555">c[r] += 1, r = stones[i] % 3</text>

  <path d="M 280 98 L 280 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. decision: try open 1 -->
  <polygon points="280,116 410,158 280,200 150,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#333">开余1 可行？</text>
  <text x="280" y="168" text-anchor="middle" font-size="10" fill="#888">check(c₁, c₂)</text>
  <text x="280" y="182" text-anchor="middle" font-size="9.5" fill="#888">c₁ == 0 即不可行</text>

  <!-- yes -> evaluate branch -->
  <path d="M 150 158 L 80 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="115" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">可行</text>

  <!-- no -> try open 2 -->
  <path d="M 410 158 L 480 158" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="150" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">不可行</text>

  <!-- left: open-1 sub-decision (3 cases) -->
  <rect x="20" y="210" width="150" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="95" y="230" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">开余1 的三情形</text>
  <text x="30" y="252" font-size="9.5" fill="#555">c₁ ≤ c₂：</text>
  <text x="135" y="252" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">c₀ 偶则赢</text>
  <text x="30" y="276" font-size="9.5" fill="#555">c₁ = c₂+1：</text>
  <text x="135" y="276" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold">必输</text>
  <text x="30" y="300" font-size="9.5" fill="#555">c₁ ≥ c₂+2：</text>
  <text x="135" y="300" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">c₀ 奇则赢</text>
  <line x1="30" y1="312" x2="160" y2="312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="330" text-anchor="middle" font-size="9.5" fill="#888">受害 = Bob → c₀ 偶赢</text>
  <text x="95" y="346" text-anchor="middle" font-size="9.5" fill="#888">受害 = Alice → c₀ 奇赢</text>
  <text x="95" y="366" text-anchor="middle" font-size="9.5" fill="#888">同时耗尽 → 输</text>
  <text x="95" y="396" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">→ r1 ∈ {T, F}</text>

  <!-- right: open-2 sub-decision -->
  <rect x="390" y="210" width="150" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="465" y="230" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">开余2 的三情形</text>
  <text x="400" y="252" font-size="9.5" fill="#555">c₂ ≤ c₁：</text>
  <text x="530" y="252" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">c₀ 偶则赢</text>
  <text x="400" y="276" font-size="9.5" fill="#555">c₂ = c₁+1：</text>
  <text x="530" y="276" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold">必输</text>
  <text x="400" y="300" font-size="9.5" fill="#555">c₂ ≥ c₁+2：</text>
  <text x="530" y="300" text-anchor="end" font-size="9.5" fill="#4a7a3a" font-weight="bold">c₀ 奇则赢</text>
  <line x1="400" y1="312" x2="530" y2="312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="465" y="330" text-anchor="middle" font-size="9.5" fill="#888">对称：c₁ ↔ c₂</text>
  <text x="465" y="346" text-anchor="middle" font-size="9.5" fill="#888">开余2 = 开余1 的镜像</text>
  <text x="465" y="396" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">→ r2 ∈ {T, F}</text>

  <!-- merge to OR -->
  <path d="M 95 410 L 95 432 L 270 432" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 465 410 L 465 432 L 290 432" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 280 432 L 280 432" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="424" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return r1 or r2</text>
</svg>
