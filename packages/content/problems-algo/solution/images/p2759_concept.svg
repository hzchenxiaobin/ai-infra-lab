<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    JSON 递归下降解析器：按首字符分发
  </text>

  <!-- Input string box -->
  <rect x="40" y="50" width="200" height="36" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    输入 JSON 字符串 str
  </text>

  <!-- Arrow down -->
  <path d="M140,90 L140,112" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Dispatch node -->
  <polygon points="140,116 220,152 140,188 60,152" fill="#fff8e1"
           stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    看首字符
  </text>
  <text x="140" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">
    skipSpaces → peek
  </text>

  <!-- 6 branches -->
  <!-- { -->
  <rect x="10" y="210" width="68" height="30" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{  →  parseObject</text>

  <!-- [ -->
  <rect x="92" y="210" width="68" height="30" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[  →  parseArray</text>

  <!-- " -->
  <rect x="174" y="210" width="68" height="30" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"  →  parseString</text>

  <!-- digit/- -->
  <rect x="256" y="210" width="78" height="30" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="229" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">数字/- → parseNum</text>

  <!-- t/f -->
  <rect x="348" y="210" width="68" height="30" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="229" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t/f → parseBool</text>

  <!-- n -->
  <rect x="430" y="210" width="68" height="30" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464" y="229" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n  →  parseNull</text>

  <!-- Arrows from diamond to branches -->
  <path d="M80,178 Q44,194 44,208" stroke="#446688" stroke-width="1"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M105,180 Q120,190 120,208" stroke="#446688" stroke-width="1"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M140,186 L200,208" stroke="#446688" stroke-width="1"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M170,180 Q285,190 290,208" stroke="#446688" stroke-width="1"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M195,178 Q380,190 375,208" stroke="#446688" stroke-width="1"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M210,175 Q460,190 460,208" stroke="#446688" stroke-width="1"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Recursion highlight: Object & Array contain more values -->
  <rect x="10" y="258" width="160" height="50" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="277" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    ⚠ 递归！
  </text>
  <text x="90" y="293" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    Object / Array 内部
  </text>
  <text x="90" y="305" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    回到 parseValue()
  </text>

  <!-- Curly bracket recursion arrow -->
  <path d="M44,242 L44,258" stroke="#b85450" stroke-width="1.5"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M126,242 L90,258" stroke="#b85450" stroke-width="1.5"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Terminal types note -->
  <rect x="180" y="258" width="310" height="50" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    终结符：String / Number / Bool / Null
  </text>
  <text x="335" y="293" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">
    解析后直接返回，不再递归
  </text>
  <text x="335" y="305" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">
    转义字符 / 小数 / 指数需特殊处理
  </text>

  <!-- Recursion loop arrow back to dispatch -->
  <path d="M30,290 Q5,200 60,155" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="5,3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="8" y="230" font-size="9" fill="#b85450" filter="url(#rough2)">
    递归
  </text>
  <text x="8" y="242" font-size="9" fill="#b85450" filter="url(#rough2)">
    回调
  </text>

  <!-- Output box -->
  <rect x="200" y="340" width="160" height="36" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    返回解析后的值
  </text>
  <path d="M90,312 Q200,330 220,340" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M335,310 L310,340" stroke="#446688" stroke-width="1.5"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Cursor concept note -->
  <rect x="390" y="340" width="160" height="40" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="470" y="357" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">
    全局游标 pos
  </text>
  <text x="470" y="371" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">
    各 parse 函数共享推进
  </text>
</svg>
