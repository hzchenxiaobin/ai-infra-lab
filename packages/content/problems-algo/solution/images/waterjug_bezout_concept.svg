<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：水量变化 = x、y 的线性组合 → Bézout 恒等式</text>

  <!-- ===== 左：两个壶 ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">两壶容量 x、y，水源无限</text>

  <!-- Jug x -->
  <path d="M 70 96 L 70 184 L 124 184 L 124 96" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <line x1="66" y1="96" x2="128" y2="96" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="72" y="140" width="50" height="42" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="97" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">壶 x</text>
  <text x="97" y="200" text-anchor="middle" font-size="10" fill="#888">容量 x</text>

  <!-- Jug y -->
  <path d="M 158 96 L 158 204 L 222 204 L 222 96" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <line x1="154" y1="96" x2="226" y2="96" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="160" y="150" width="60" height="52" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="190" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">壶 y</text>
  <text x="190" y="220" text-anchor="middle" font-size="10" fill="#888">容量 y</text>

  <!-- 无限水源 -->
  <rect x="50" y="234" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="252" text-anchor="middle" font-size="11" fill="#d6a040">无限水源 + 可随时倒掉</text>

  <!-- ===== 右：六种操作 ===== -->
  <text x="280" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">六种操作对「总水量」的改变</text>

  <!-- 表头 -->
  <rect x="280" y="68" width="260" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="85" font-size="11" fill="#4a7a3a" font-weight="bold">操作</text>
  <text x="470" y="85" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">总水量变化</text>

  <!-- 行 -->
  <rect x="280" y="94" width="260" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="109" font-size="10.5" fill="#333">装满壶 x</text>
  <text x="470" y="109" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">+ x</text>

  <rect x="280" y="118" width="260" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="133" font-size="10.5" fill="#333">装满壶 y</text>
  <text x="470" y="133" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">+ y</text>

  <rect x="280" y="142" width="260" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="157" font-size="10.5" fill="#333">倒空壶 x</text>
  <text x="470" y="157" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">− x</text>

  <rect x="280" y="166" width="260" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="181" font-size="10.5" fill="#333">倒空壶 y</text>
  <text x="470" y="181" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">− y</text>

  <rect x="280" y="190" width="260" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="205" font-size="10.5" fill="#333">x → y 倒水</text>
  <text x="470" y="205" text-anchor="end" font-size="11" fill="#888" font-weight="bold">0</text>

  <rect x="280" y="214" width="260" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="229" font-size="10.5" fill="#333">y → x 倒水</text>
  <text x="470" y="229" text-anchor="end" font-size="11" fill="#888" font-weight="bold">0</text>

  <!-- 小结 -->
  <rect x="280" y="242" width="260" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="257" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">每次变化 ∈ {±x, ±y, 0}</text>

  <!-- divider -->
  <line x1="40" y1="278" x2="520" y2="278" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Bézout 恒等式 ===== -->
  <text x="40" y="302" font-size="12" fill="#4a7a3a" font-weight="bold">由操作复合：总水量 = a·x + b·y（a, b ∈ Z）</text>

  <rect x="40" y="316" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">Bézout 恒等式：{a·x + b·y} = {k · gcd(x, y)}</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#446688">所有能凑出的总水量，恰是 gcd(x, y) 的全体倍数</text>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#888">（容量上界：两壶最多同时装满，故 0 ≤ 总水量 ≤ x + y）</text>

  <!-- ===== 结论 ===== -->
  <rect x="40" y="394" width="480" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">结论：能量出 target ⇔</text>
  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">target ≤ x + y  且  target % gcd(x, y) == 0</text>
</svg>
