<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：双指针 + 相遇判定</text>

  <!-- 1. Init -->
  <rect x="150" y="44" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="11.5" fill="#333">① i=0, j=n−1, a=capA, b=capB, refills=0</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. While loop -->
  <rect x="150" y="100" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333">② while i &lt; j</text>

  <path d="M 270 138 L 270 154" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. Alice branch -->
  <rect x="20" y="154" width="240" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Alice 浇 plants[i]</text>
  <text x="140" y="194" text-anchor="middle" font-size="10.5" fill="#333">if a&lt;plants[i]: a=capA, refills++</text>
  <text x="140" y="210" text-anchor="middle" font-size="10.5" fill="#333">a −= plants[i];  i++</text>

  <!-- 4. Bob branch -->
  <rect x="280" y="154" width="240" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Bob 浇 plants[j]</text>
  <text x="400" y="194" text-anchor="middle" font-size="10.5" fill="#333">if b&lt;plants[j]: b=capB, refills++</text>
  <text x="400" y="210" text-anchor="middle" font-size="10.5" fill="#333">b −= plants[j];  j−−</text>

  <!-- loop back arrow -->
  <path d="M 140 222 L 140 248 L 480 248 L 480 119 L 390 119" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 400 222 L 400 248" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="300" y="242" font-size="10" fill="#888" font-weight="bold">下一轮 i,j</text>

  <!-- exit from while -->
  <path d="M 270 138 L 270 154" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 5. Meeting decision -->
  <path d="M 270 248 L 270 266" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="262" font-size="10" fill="#888">循环结束</text>

  <polygon points="270,266 380,308 270,350 160,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="11" fill="#333">i == j ?</text>
  <text x="270" y="320" text-anchor="middle" font-size="9.5" fill="#888">(n 为奇数?)</text>

  <!-- Yes → meeting logic -->
  <path d="M 160 308 L 80 308 L 80 360" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="300" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- No → return -->
  <path d="M 380 308 L 460 308 L 460 400 L 380 400" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="398" y="300" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- meeting box -->
  <rect x="10" y="360" width="200" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">中间株：比水量</text>
  <text x="110" y="400" text-anchor="middle" font-size="10" fill="#4a7a3a">a ≥ b → Alice 浇</text>
  <text x="110" y="416" text-anchor="middle" font-size="10" fill="#d6a040">a &lt; b → Bob 浇</text>
  <text x="110" y="432" text-anchor="middle" font-size="9.5" fill="#888">(不够则灌满再浇)</text>

  <!-- meeting → return -->
  <path d="M 110 442 L 110 410 L 270 410" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Return box -->
  <rect x="220" y="386" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="408" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return refills</text>
</svg>
