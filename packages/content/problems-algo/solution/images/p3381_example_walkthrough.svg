<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [−5, 1, 2, −3, 4]，k = 2</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">蓝行 = 余 0 通道查询，绿行 = 余 1 通道查询；best[r] 先查后更</text>

  <!-- 表头 -->
  <rect x="25" y="52" width="470" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="43" y="69" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="105" y="69" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">cur = P[i+1]</text>
  <text x="160" y="69" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="225" y="69" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">best[r] 查前</text>
  <text x="320" y="69" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">cur − best[r]</text>
  <text x="400" y="69" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">ans</text>
  <text x="466" y="69" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">best[r] 更后</text>

  <!-- 列分隔虚线 -->
  <path d="M 62 80 L 62 238 M 148 80 L 148 238 M 172 80 L 172 238 M 278 80 L 278 238 M 362 80 L 362 238 M 438 80 L 438 238"
        fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="2 3" filter="url(#rough2)"/>

  <!-- 行 1：i=0，绿（余 1） -->
  <rect x="25" y="80" width="470" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="43" y="99" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">0</text>
  <text x="105" y="99" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">−5</text>
  <text x="160" y="99" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="225" y="99" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">+∞</text>
  <text x="320" y="99" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">—（通道空）</text>
  <text x="400" y="99" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">−∞</text>
  <text x="466" y="99" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">−5</text>

  <!-- 行 2：i=1，蓝（余 0） -->
  <rect x="25" y="112" width="470" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="43" y="131" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="105" y="131" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">−4</text>
  <text x="160" y="131" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="225" y="131" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="320" y="131" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">−4</text>
  <text x="400" y="131" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">−4</text>
  <text x="466" y="131" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">−4</text>

  <!-- 行 3：i=2，绿（余 1） -->
  <rect x="25" y="144" width="470" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="43" y="163" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="105" y="163" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">−2</text>
  <text x="160" y="163" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="225" y="163" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">−5</text>
  <text x="320" y="163" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="400" y="163" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="466" y="163" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">−5</text>

  <!-- 行 4：i=3，蓝（余 0） -->
  <rect x="25" y="176" width="470" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="43" y="195" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="105" y="195" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">−5</text>
  <text x="160" y="195" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="225" y="195" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">−4</text>
  <text x="320" y="195" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">−1</text>
  <text x="400" y="195" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="466" y="195" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">−5</text>

  <!-- 行 5：i=4，绿（余 1），高亮 -->
  <rect x="25" y="208" width="470" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="43" y="227" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="105" y="227" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="160" y="227" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="225" y="227" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">−5</text>
  <text x="320" y="227" text-anchor="middle" font-size="10" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">4 ★</text>
  <text x="400" y="227" text-anchor="middle" font-size="10" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="466" y="227" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">−5</text>

  <!-- 结论框 -->
  <rect x="25" y="250" width="470" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">ans = P[5] − P[1] = −1 − (−5) = 4</text>
  <text x="260" y="282" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">对应子数组 nums[1..4] = [1, 2, −3, 4]，长度 4 被 2 整除 ✓</text>

  <!-- 细节框 -->
  <rect x="25" y="298" width="470" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="38" y="315" font-size="9.5" fill="#333" filter="url(#rough2)">细节：best[1] 自 i = 0 后冻结在 −5（通道 1 的历史最低买点），i = 2 与 i = 4 都在「蹭」它；</text>
  <text x="38" y="332" font-size="9.5" fill="#333" filter="url(#rough2)">best[0] 被 P[4] = −5 刷新，但后面再无余 0 的下标，这次刷新没能兑现。</text>
</svg>
