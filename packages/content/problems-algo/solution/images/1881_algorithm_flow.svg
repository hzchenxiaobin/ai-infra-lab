<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：判符号 → 扫描找插入点 → 插入返回</text>

  <!-- Start -->
  <ellipse cx="290" cy="54" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 290 72 L 290 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: n[0] == '-' ? -->
  <polygon points="290,96 430,140 290,184 150,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">n[0] == '-' ?</text>
  <text x="290" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">是否为负数</text>

  <!-- 是 branch (negative) to the left -->
  <path d="M 150 140 L 110 140 L 110 188" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="130" y="132" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 否 branch (positive) to the right -->
  <path d="M 430 140 L 470 140 L 470 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="450" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Negative branch box -->
  <rect x="40" y="192" width="210" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="214" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">负数分支</text>
  <text x="145" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i = 1  （跳过负号）</text>
  <text x="145" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">while n[i] ≤ x :</text>
  <text x="145" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">    i ++</text>
  <text x="145" y="282" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">停在首个 &gt; x 处</text>

  <!-- Positive branch box -->
  <rect x="330" y="192" width="210" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="214" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">正数分支</text>
  <text x="435" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i = 0</text>
  <text x="435" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">while n[i] ≥ x :</text>
  <text x="435" y="268" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">    i ++</text>
  <text x="435" y="282" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">停在首个 &lt; x 处</text>

  <!-- both branches converge down to insert box -->
  <path d="M 145 284 L 145 326 L 290 326" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 435 284 L 435 326 L 290 326" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Insert box -->
  <rect x="130" y="330" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="353" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">在位置 i 处插入字符 x</text>
  <text x="290" y="370" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">若 i == m（未停在增益点）即追加到末尾</text>

  <path d="M 290 380 L 290 404" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="290" cy="428" rx="92" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="433" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回插入后的 n</text>

  <!-- side note: comparison direction reversed -->
  <rect x="40" y="330" width="84" height="50" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="82" y="350" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">跳过条件与</text>
  <text x="82" y="362" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">目标关系相反</text>
  <text x="82" y="374" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">易写反!</text>
</svg>
