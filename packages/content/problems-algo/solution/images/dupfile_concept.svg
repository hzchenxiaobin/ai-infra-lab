<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：以文件内容为哈希键，同内容的路径归为一组</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">解析 file(content) → 提取 content 与 dir/filename → 按 content 分组 → 过滤 size≥2</text>

  <!-- Input string -->
  <rect x="60" y="58" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"root/a 1.txt(abcd) 2.txt(efgh)"</text>

  <!-- Arrow 1 -->
  <path d="M 280 94 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="106" font-size="10" fill="#888">按空格切分</text>

  <!-- dir box + file entries -->
  <rect x="60" y="116" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="138" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">dir = "root/a"</text>

  <rect x="200" y="116" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="138" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1.txt(abcd)   2.txt(efgh)</text>

  <!-- Arrow 2 -->
  <path d="M 280 152 L 280 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="164" font-size="10" fill="#888">提取括号内 content</text>

  <!-- extracted pairs -->
  <rect x="60" y="174" width="440" height="50" fill="#f6f6f6" stroke="#ccc" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="194" font-size="11" fill="#446688" font-family="monospace">content="abcd"</text>
  <text x="210" y="194" font-size="11" fill="#888">→</text>
  <text x="230" y="194" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">path = dir + "/" + "1.txt"</text>
  <text x="80" y="214" font-size="11" fill="#446688" font-family="monospace">content="efgh"</text>
  <text x="210" y="214" font-size="11" fill="#888">→</text>
  <text x="230" y="214" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">path = dir + "/" + "2.txt"</text>

  <!-- Arrow 3 -->
  <path d="M 280 226 L 280 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="238" font-size="10" fill="#888">存入哈希表 content→[paths]</text>

  <!-- Hash map table -->
  <rect x="60" y="248" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="267" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">content（键）</text>
  <rect x="184" y="248" width="316" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="267" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">路径列表（值）</text>

  <rect x="60" y="278" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="298" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" font-family="monospace">abcd</text>
  <rect x="184" y="278" width="316" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="298" font-size="10" fill="#444" font-family="monospace">root/a/1.txt, root/c/3.txt</text>

  <rect x="60" y="310" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="330" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" font-family="monospace">efgh</text>
  <rect x="184" y="310" width="316" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="330" font-size="10" fill="#444" font-family="monospace">root/a/2.txt, root/c/d/4.txt, root/4.txt</text>

  <!-- Arrow 4 -->
  <path d="M 280 342 L 280 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="354" font-size="10" fill="#888">过滤 size ≥ 2</text>

  <!-- Output -->
  <rect x="40" y="364" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" font-family="monospace">[[root/a/1.txt, root/c/3.txt], [root/a/2.txt, root/c/d/4.txt, root/4.txt]]</text>

  <!-- footer note -->
  <rect x="60" y="406" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#444">一次遍历即可完成分组：O(N)，N 为输入总长度</text>
</svg>
