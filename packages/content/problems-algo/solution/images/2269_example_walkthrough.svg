<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：逐窗口取整数 + 判整除，维护计数 ans</text>

  <!-- ===== Example 1: num=240, k=2 ===== -->
  <text x="40" y="50" font-size="12" fill="#446688" font-weight="bold">示例 1：num = 240，k = 2（窗口 i=0..1）</text>

  <!-- Table header -->
  <rect x="60" y="58" width="380" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="160" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">子串</text>
  <text x="240" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">val</text>
  <text x="335" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">240 % val</text>
  <text x="415" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <!-- column separators -->
  <line x1="120" y1="58" x2="120" y2="158" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="58" x2="200" y2="158" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="58" x2="280" y2="158" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="58" x2="390" y2="158" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0 HIGHLIGHT -->
  <rect x="60" y="84" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="160" y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"24"</text>
  <text x="240" y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">24</text>
  <text x="335" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="415" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- i=1 HIGHLIGHT -->
  <rect x="60" y="110" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="127" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="160" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"40"</text>
  <text x="240" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">40</text>
  <text x="335" y="127" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="415" y="127" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- table outer border -->
  <rect x="60" y="58" width="380" height="78" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result ex1 -->
  <rect x="460" y="92" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案</text>
  <text x="505" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2 ✓</text>

  <!-- ===== Example 2: num=430043, k=2 ===== -->
  <text x="40" y="170" font-size="12" fill="#b85450" font-weight="bold">示例 2：num = 430043，k = 2（窗口 i=0..4，含 0 与前缀 0 陷阱）</text>

  <!-- Table header -->
  <rect x="60" y="178" width="380" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="196" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">子串</text>
  <text x="240" y="196" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">val</text>
  <text x="335" y="196" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">判定</text>
  <text x="415" y="196" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <line x1="120" y1="178" x2="120" y2="326" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="178" x2="200" y2="326" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="178" x2="280" y2="326" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="178" x2="390" y2="326" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0 HIGHLIGHT -->
  <rect x="60" y="204" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="160" y="221" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"43"</text>
  <text x="240" y="221" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">43</text>
  <text x="335" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="415" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- i=1 -->
  <rect x="60" y="230" width="380" height="26" fill="#f4f7fb" stroke="none"/>
  <text x="90" y="247" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="160" y="247" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"30"</text>
  <text x="240" y="247" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">30</text>
  <text x="335" y="247" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">余23 ✗</text>
  <text x="415" y="247" text-anchor="middle" font-size="11" fill="#888">1</text>

  <!-- i=2 HIGHLIGHT (00 -> val=0 trap) -->
  <rect x="60" y="256" width="380" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="273" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="160" y="273" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"00"</text>
  <text x="240" y="273" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="335" y="273" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">val=0 ✗</text>
  <text x="415" y="273" text-anchor="middle" font-size="11" fill="#888">1</text>

  <!-- i=3 -->
  <rect x="60" y="282" width="380" height="26" fill="#f4f7fb" stroke="none"/>
  <text x="90" y="299" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="160" y="299" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"04"</text>
  <text x="240" y="299" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="335" y="299" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">余3 ✗</text>
  <text x="415" y="299" text-anchor="middle" font-size="11" fill="#888">1</text>

  <!-- i=4 HIGHLIGHT -->
  <rect x="60" y="308" width="380" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="160" y="320" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"43"</text>
  <text x="240" y="320" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">43</text>
  <text x="335" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="415" y="320" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- table outer border ex2 -->
  <rect x="60" y="178" width="380" height="148" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result ex2 -->
  <rect x="460" y="256" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案</text>
  <text x="505" y="286" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2 ✓</text>

  <!-- footer warning -->
  <rect x="40" y="346" width="480" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⚠ 两个易错点</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#333">① "00"→val=0：0 不整除任何数，须先判 val≠0 再取模，避免除零异常</text>
  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#333">② "04"→val=4：前缀 0 合法，按 int("04")=4 原样转整数参与判定，不剥前导零</text>

  <!-- footer note -->
  <rect x="40" y="418" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="435" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">每窗 O(k) 转整数已足够（n,k≤10）；大规模可用滚动值 O(1) 取整</text>
  <text x="280" y="449" text-anchor="middle" font-size="10" fill="#888">val = (val % 10^(k−1)) × 10 + 新位数字，详见第 5 节</text>
</svg>
