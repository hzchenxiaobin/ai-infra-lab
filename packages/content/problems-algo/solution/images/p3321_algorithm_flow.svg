<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 505"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="505" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：每个下标两次更新，每次更新立即 balance</text>

  <!-- 初始化 -->
  <rect x="170" y="32" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">初始化 freq / L / R / sumL = 0</text>
  <path d="M 260 62 L 260 78" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环容器 -->
  <rect x="50" y="80" width="420" height="356" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>
  <text x="75" y="102" text-anchor="start" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">for i = 0 … n−1</text>

  <!-- 入窗 -->
  <rect x="100" y="112" width="320" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">nums[i] 入窗</text>
  <text x="260" y="149" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">摘旧牌 (f, v)，freq[v]++</text>
  <text x="260" y="164" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">新牌 (f+1, v) 一律先进 R → balance()</text>
  <path d="M 260 170 L 260 186" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <polygon points="260,188 338,212 260,236 182,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">i ≥ k ?</text>
  <path d="M 260 236 L 260 252" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="271" y="249" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 338 212 L 440 212 L 440 320 L 268 320" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="382" y="206" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否（跳过出窗）</text>

  <!-- 出窗 -->
  <rect x="100" y="254" width="320" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">nums[i−k] 出窗</text>
  <text x="260" y="291" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">摘旧牌 (f, v)，freq[v]−−</text>
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">归零则条目消失，否则 (f−1, v) 进 R → balance()</text>
  <path d="M 260 312 L 260 328" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2 -->
  <polygon points="260,330 338,354 260,378 182,354" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">i ≥ k−1 ?</text>
  <path d="M 260 378 L 260 394" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="271" y="391" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 338 354 L 448 354" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="348" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否（窗口未形成）</text>

  <!-- 记录答案 -->
  <rect x="150" y="394" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="415" text-anchor="middle" font-size="11" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">answer[i−k+1] = sumL</text>

  <!-- 循环回边 -->
  <path d="M 370 411 L 448 411" fill="none" stroke="#a07830" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 448 411 L 448 96 L 342 96" fill="none" stroke="#a07830" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text transform="rotate(90 462 250)" x="462" y="250" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">i++ 下一轮</text>

  <!-- 底部注释 -->
  <rect x="30" y="448" width="460" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="466" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">balance() 三板斧：① 超编降级 ② 缺编晋级 ③ 错位互换</text>
  <text x="260" y="482" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">每次更新后立即调用（恢复 min(L) &gt; max(R)，摘牌定位的前提）；均摊 O(1) 次搬运/步 → 总 O(n log n)</text>
</svg>
