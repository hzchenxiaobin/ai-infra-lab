<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,7,3,6,5,6]，total = 28</text>

  <!-- header: total -->
  <text x="40" y="52" font-size="12" fill="#888">数组总和 total = 1+7+3+6+5+6 = 28；判定式 2 × leftSum + nums[i] == 28</text>

  <!-- column headers -->
  <text x="60" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">轮次</text>
  <text x="170" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">数组 (高亮 i)</text>
  <text x="300" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">leftSum</text>
  <text x="390" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2×L+n[i]</text>
  <text x="500" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">结果</text>

  <!-- separator -->
  <path d="M 30 92 L 560 92" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1: i=0 ===== -->
  <text x="60" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=0</text>
  <!-- cells: idx0 highlighted, rest normal -->
  <rect x="120" y="104" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="104" width="34" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="173" y="124" text-anchor="middle" font-size="13" fill="#bbb">7</text>
  <rect x="192" y="104" width="34" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="209" y="124" text-anchor="middle" font-size="13" fill="#bbb">3</text>
  <rect x="228" y="104" width="34" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="124" text-anchor="middle" font-size="13" fill="#bbb">6</text>
  <text x="300" y="124" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="390" y="124" text-anchor="middle" font-size="12" fill="#333">2×0+1 = 1</text>
  <text x="500" y="124" text-anchor="middle" font-size="12" fill="#888">≠28，累加→1</text>

  <!-- ===== Row 2: i=1 ===== -->
  <text x="60" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=1</text>
  <rect x="120" y="144" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="164" text-anchor="middle" font-size="13" fill="#999">1</text>
  <rect x="156" y="144" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="164" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="192" y="144" width="34" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="209" y="164" text-anchor="middle" font-size="13" fill="#bbb">3</text>
  <rect x="228" y="144" width="34" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="164" text-anchor="middle" font-size="13" fill="#bbb">6</text>
  <text x="300" y="164" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="390" y="164" text-anchor="middle" font-size="12" fill="#333">2×1+7 = 9</text>
  <text x="500" y="164" text-anchor="middle" font-size="12" fill="#888">≠28，累加→8</text>

  <!-- ===== Row 3: i=2 ===== -->
  <text x="60" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=2</text>
  <rect x="120" y="184" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="204" text-anchor="middle" font-size="13" fill="#999">1</text>
  <rect x="156" y="184" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="204" text-anchor="middle" font-size="13" fill="#999">7</text>
  <rect x="192" y="184" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="228" y="184" width="34" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="204" text-anchor="middle" font-size="13" fill="#bbb">6</text>
  <text x="300" y="204" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="390" y="204" text-anchor="middle" font-size="12" fill="#333">2×8+3 = 19</text>
  <text x="500" y="204" text-anchor="middle" font-size="12" fill="#888">≠28，累加→11</text>

  <!-- ===== Row 4: i=3 (hit) ===== -->
  <text x="60" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i=3</text>
  <rect x="120" y="224" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="244" text-anchor="middle" font-size="13" fill="#999">1</text>
  <rect x="156" y="224" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="244" text-anchor="middle" font-size="13" fill="#999">7</text>
  <rect x="192" y="224" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="244" text-anchor="middle" font-size="13" fill="#999">3</text>
  <rect x="228" y="224" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="244" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="300" y="244" text-anchor="middle" font-size="12" fill="#333">11</text>
  <text x="390" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2×11+6 = 28</text>
  <text x="500" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">==28 ✓ 返回 3</text>

  <!-- highlight band for the hit row -->
  <rect x="30" y="216" width="530" height="40" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="30" y="288" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="310" font-size="11" fill="#444" font-weight="bold">读图：</text>
  <rect x="96" y="300" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="124" y="312" font-size="11" fill="#666">已计入 leftSum 的左侧元素</text>
  <rect x="300" y="300" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="328" y="312" font-size="11" fill="#666">当前判定下标 i (nums[i] 不计入任一侧)</text>
  <text x="48" y="332" font-size="11" fill="#666">每轮先用当前 leftSum 判等，未命中再把 nums[i] 累加进 leftSum，继续向右</text>

  <!-- footer -->
  <text x="290" y="380" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终答案：3</text>
  <text x="290" y="400" text-anchor="middle" font-size="10" fill="#888">leftSum 随 i 单调右移，每轮 O(1) 判等 + 累加，总复杂度 O(n)</text>
</svg>
