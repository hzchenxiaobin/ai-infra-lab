<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">流程：分解 k → 预处理 delta → 记忆化 DFS(idx, x, y, z)</text>

  <g filter="url(#rough2)">
    <rect x="205" y="38" width="150" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="57" text-anchor="middle" font-size="12" fill="#33506b">分解 k → (a, b, c)</text>
    <path d="M 280 66 L 280 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <polygon points="280,84 336,112 280,140 224,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="117" text-anchor="middle" font-size="11.5" fill="#8a6d1a">余数 = 1 ？</text>
    <path d="M 336 112 L 420 112" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="372" y="104" text-anchor="middle" font-size="11" fill="#b85450">否</text>
    <rect x="424" y="98" width="104" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="476" y="117" text-anchor="middle" font-size="12" fill="#8a3030">return 0</text>

    <path d="M 280 140 L 280 156" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="292" y="153" font-size="11" fill="#4a7a3a">是</text>
    <rect x="195" y="158" width="170" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="177" text-anchor="middle" font-size="12" fill="#33506b">预处理每个 nums[i] 的 delta</text>
    <path d="M 280 186 L 280 202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <rect x="185" y="204" width="190" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="224" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">DFS(idx, x, y, z)，先查 memo</text>

    <polygon points="280,244 338,272 280,300 222,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="277" text-anchor="middle" font-size="11.5" fill="#8a6d1a">idx = n ？</text>
    <path d="M 338 272 L 396 272" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="360" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
    <rect x="400" y="256" width="138" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="469" y="270" text-anchor="middle" font-size="10.5" fill="#2f5d24">(x,y,z) = (a,b,c) ？</text>
    <text x="469" y="284" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">是 → 1，否 → 0</text>

    <path d="M 280 300 L 280 318" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="292" y="314" font-size="11" fill="#b85450">否</text>
    <rect x="30" y="322" width="158" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="109" y="340" text-anchor="middle" font-size="10.5" fill="#2f5d24">dfs(idx+1, x+dx, y+dy, z+dz)</text>
    <rect x="200" y="322" width="158" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="279" y="340" text-anchor="middle" font-size="10.5" fill="#8a6d1a">dfs(idx+1, x−dx, y−dy, z−dz)</text>
    <rect x="370" y="322" width="158" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="449" y="340" text-anchor="middle" font-size="10.5" fill="#33506b">dfs(idx+1, x, y, z)</text>

    <path d="M 109 322 C 109 300, 60 280, 80 236 C 92 208, 130 219, 183 219"
          stroke="#666" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)"/>
    <text x="58" y="196" font-size="10.5" fill="#666">三个分支都递归回 DFS</text>

    <text x="476" y="46" text-anchor="middle" font-size="11" fill="#666">状态上界：</text>
    <text x="476" y="62" text-anchor="middle" font-size="11" fill="#666">(n+1)(4n+1)(2n+1)²</text>
    <text x="476" y="78" text-anchor="middle" font-size="11" fill="#666">n=19 时 ≈ 2.3×10⁶</text>
  </g>
</svg>
