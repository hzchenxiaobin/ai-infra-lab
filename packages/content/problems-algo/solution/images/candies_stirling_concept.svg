<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：第 n 颗糖果的两条去向</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">糖果两两不同、手袋全同、每袋至少一颗 ⇔ 第二类 Stirling 数 S(n,k)</text>

  <!-- 顶部：第 n 颗糖果 -->
  <ellipse cx="280" cy="82" rx="26" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">糖果 n</text>

  <!-- 两条分支箭头 -->
  <path d="M 260 98 Q 180 130 130 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 300 98 Q 380 130 430 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左分支：加入已有手袋 -->
  <rect x="40" y="168" width="180" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">① 加入已有手袋</text>
  <text x="130" y="214" text-anchor="middle" font-size="11" fill="#333">前 n−1 颗已分成 k 袋</text>
  <text x="130" y="232" text-anchor="middle" font-size="11" fill="#333">糖果 n 放进其中任意一袋</text>
  <text x="130" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">共 k 种选择</text>
  <text x="130" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k × S(n−1, k)</text>

  <!-- 小示意：3 个已有袋，箭头指向其中一个 -->
  <rect x="56" y="300" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="88" y="300" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="300" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="69" y="314" text-anchor="middle" font-size="9" fill="#333">袋1</text>
  <text x="101" y="314" text-anchor="middle" font-size="9" fill="#333">袋2</text>
  <text x="133" y="314" text-anchor="middle" font-size="9" fill="#333">袋k</text>
  <path d="M 101 300 Q 101 292 101 286" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="160" y="312" font-size="10" fill="#b85450">↑任选其一</text>

  <!-- 右分支：独占新手袋 -->
  <rect x="340" y="168" width="180" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="192" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">② 独占一个新手袋</text>
  <text x="430" y="214" text-anchor="middle" font-size="11" fill="#333">前 n−1 颗只分成 k−1 袋</text>
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#333">糖果 n 单独成第 k 袋</text>
  <text x="430" y="256" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">手袋全同，无顺序之分</text>
  <text x="430" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">S(n−1, k−1)</text>

  <!-- 小示意：k-1 个袋 + 1 个新袋 -->
  <rect x="352" y="300" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="384" y="300" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="430" y="300" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="314" text-anchor="middle" font-size="9" fill="#333">袋1</text>
  <text x="397" y="314" text-anchor="middle" font-size="9" fill="#333">袋2</text>
  <text x="445" y="314" text-anchor="middle" font-size="9" fill="#b85450">新</text>

  <!-- 底部合并公式 -->
  <path d="M 130 324 Q 280 348 430 324" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <rect x="110" y="350" width="340" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">S(n, k) = k · S(n−1, k) + S(n−1, k−1)</text>
</svg>
