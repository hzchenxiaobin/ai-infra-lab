<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：n=2, meetings=[[0,10],[1,5],[2,7],[3,4]]</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">按 start 排序后逐个分配 · 蓝色=空闲堆·橙色=占用堆·绿框=本轮选中房间</text>

  <!-- Step 1: [0,10] -->
  <text x="40" y="72" font-size="12" fill="#446688" font-weight="bold">会议 [0,10]</text>
  <text x="40" y="90" font-size="10.5" fill="#666">释放 end≤0：无</text>
  <text x="150" y="90" font-size="10.5" fill="#4a7a3a" font-weight="bold">idle 非空 → 取房间 0</text>
  <rect x="40" y="98" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">idle: {1}</text>
  <rect x="160" y="98" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="116" text-anchor="middle" font-size="11.5" fill="#333">used: {(10,0)}</text>
  <text x="360" y="116" font-size="11.5" fill="#b85450" font-weight="bold">cnt = [1, 0]</text>

  <path d="M 280 130 L 280 150" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Step 2: [1,5] -->
  <text x="40" y="170" font-size="12" fill="#446688" font-weight="bold">会议 [1,5]</text>
  <text x="40" y="188" font-size="10.5" fill="#666">释放 end≤1：无（10&gt;1）</text>
  <text x="200" y="188" font-size="10.5" fill="#4a7a3a" font-weight="bold">idle 非空 → 取房间 1</text>
  <rect x="40" y="196" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="214" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">idle: {}</text>
  <rect x="160" y="196" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="214" text-anchor="middle" font-size="11.5" fill="#333">used: {(5,1),(10,0)}</text>
  <text x="360" y="214" font-size="11.5" fill="#b85450" font-weight="bold">cnt = [1, 1]</text>

  <path d="M 280 228 L 280 248" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Step 3: [2,7] -->
  <text x="40" y="268" font-size="12" fill="#446688" font-weight="bold">会议 [2,7]</text>
  <text x="40" y="286" font-size="10.5" fill="#666">释放 end≤2：无</text>
  <text x="150" y="286" font-size="10.5" fill="#b85450" font-weight="bold">idle 空 → 顺延到最早结束 (5,1)</text>
  <text x="40" y="300" font-size="10.5" fill="#b85450">新区间 [5, 5+(7−2)) = [5,10)，房间 1</text>
  <rect x="40" y="306" width="100" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="324" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">idle: {}</text>
  <rect x="160" y="306" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="11.5" fill="#333">used: {(10,0),(10,1)}</text>
  <text x="380" y="324" font-size="11.5" fill="#b85450" font-weight="bold">cnt = [1, 2]</text>

  <path d="M 280 338 L 280 358" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Step 4: [3,4] -->
  <text x="40" y="378" font-size="12" fill="#446688" font-weight="bold">会议 [3,4]</text>
  <text x="40" y="396" font-size="10.5" fill="#666">释放 end≤3：无</text>
  <text x="150" y="396" font-size="10.5" fill="#b85450" font-weight="bold">idle 空 → 顺延到最早结束 (10,0)</text>
  <text x="40" y="410" font-size="10.5" fill="#b85450">两房间同时结束 10，取编号小者 0；新区间 [10,11)</text>
  <rect x="40" y="416" width="100" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="434" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">idle: {}</text>
  <rect x="160" y="416" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="434" text-anchor="middle" font-size="11.5" fill="#333">used: {(10,1),(11,0)}</text>
  <text x="380" y="434" font-size="11.5" fill="#b85450" font-weight="bold">cnt = [2, 2]</text>

  <!-- Result box -->
  <path d="M 280 448 L 280 470" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <rect x="60" y="474" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="76" y="496" font-size="13" fill="#4a7a3a" font-weight="bold">最终结果：cnt = [2, 2]，最大均为 2</text>
  <text x="76" y="514" font-size="11" fill="#4a7a3a">并列时返回编号最小 → 房间 0 ✓</text>
</svg>
