<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">完全二叉树节点个数：递归流程</text>

  <!-- 入口 -->
  <rect x="200" y="48" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="12" fill="#333">countNodes(root)</text>

  <path d="M 290 82 L 290 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="290,100 410,142 290,184 170,142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#333">root == null ?</text>
  <text x="290" y="158" text-anchor="middle" font-size="11" fill="#888">空树</text>

  <path d="M 410 142 L 470 142 L 470 88" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="134" font-size="10" fill="#b85450">是</text>
  <rect x="410" y="72" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="470" y="93" text-anchor="middle" font-size="12" fill="#888">返回 0</text>

  <path d="M 290 184 L 290 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="200" font-size="10" fill="#82b366">否</text>

  <!-- 计算左右深度 -->
  <rect x="150" y="208" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lh = 沿 left 走到底的层数</text>
  <text x="290" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">rh = 沿 right 走到底的层数</text>

  <path d="M 290 248 L 290 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判等 -->
  <polygon points="290,268 410,310 290,352 170,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="12" fill="#333">lh == rh ?</text>
  <text x="290" y="326" text-anchor="middle" font-size="11" fill="#888">完美子树</text>

  <!-- 是 → 直接返回 -->
  <path d="M 410 310 L 470 310 L 470 372" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="302" font-size="10" fill="#82b366">是</text>
  <rect x="398" y="372" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="473" y="388" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 2^lh − 1</text>

  <!-- 否 → 递归 -->
  <path d="M 170 310 L 100 310 L 100 372" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="302" font-size="10" fill="#b85450">否</text>
  <rect x="28" y="372" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="148" y="388" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 1 + count(left) + count(right)</text>

  <text x="290" y="394" text-anchor="middle" font-size="11" fill="#888">每层只递归一棵子树 → 深度 O(log n)；每次求深度 O(log n) → 总 O(log² n)</text>
</svg>
