<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 250" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="705" height="250" fill="#fafafa"/>

  <text x="352" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 逐步剥叶（金币在 3、4、7）</text>

  <!-- arrows between stages at y=112 -->
  <line x1="162" y1="112" x2="191" y2="112" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="337" y1="112" x2="366" y2="112" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="512" y1="112" x2="541" y2="112" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ Stage 1: original (CX=90) ============ -->
  <!-- edges -->
  <line x1="90" y1="55" x2="55" y2="95" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="55" x2="125" y2="95" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="55" y1="95" x2="32" y2="132" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="55" y1="95" x2="78" y2="132" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="125" y1="95" x2="125" y2="132" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="125" y1="132" x2="102" y2="168" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="125" y1="132" x2="148" y2="168" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="90" cy="55" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="59" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <circle cx="55" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="99" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="125" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="99" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <!-- coin 3 -->
  <circle cx="32" cy="132" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="32" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="32" y="120" text-anchor="middle" font-size="11" fill="#d6a040">★</text>
  <!-- coin 4 -->
  <circle cx="78" cy="132" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="78" y="120" text-anchor="middle" font-size="11" fill="#d6a040">★</text>
  <circle cx="125" cy="132" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <!-- coinless leaf 6 (dashed grey) -->
  <circle cx="102" cy="168" r="13" fill="#eee" stroke="#aaa" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="102" y="172" text-anchor="middle" font-size="10" fill="#999">6</text>
  <text x="124" y="166" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <!-- coin 7 -->
  <circle cx="148" cy="168" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="172" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="148" y="156" text-anchor="middle" font-size="11" fill="#d6a040">★</text>

  <text x="90" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">原始树</text>
  <text x="90" y="226" text-anchor="middle" font-size="10" fill="#888">无币叶 6 待删</text>

  <!-- ============ Stage 2: deleted coinless leaf 6 (CX=265) ============ -->
  <line x1="265" y1="55" x2="230" y2="95" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="265" y1="55" x2="300" y2="95" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="230" y1="95" x2="207" y2="132" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="230" y1="95" x2="253" y2="132" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="300" y1="95" x2="300" y2="132" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="300" y1="132" x2="323" y2="168" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="265" cy="55" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="59" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <circle cx="230" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="99" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="300" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="99" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <circle cx="207" cy="132" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="207" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="207" y="120" text-anchor="middle" font-size="11" fill="#d6a040">★</text>
  <circle cx="253" cy="132" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="253" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="253" y="120" text-anchor="middle" font-size="11" fill="#d6a040">★</text>
  <circle cx="300" cy="132" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <circle cx="323" cy="168" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="323" y="172" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="323" y="156" text-anchor="middle" font-size="11" fill="#d6a040">★</text>
  <!-- faint deleted 6 -->
  <text x="277" y="172" text-anchor="middle" font-size="12" fill="#ccc">✗6</text>

  <text x="265" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">删无币叶 6</text>
  <text x="265" y="226" text-anchor="middle" font-size="10" fill="#888">叶 3、4、7 全带币</text>

  <!-- ============ Stage 3: deleted layer 1 (3,4,7) (CX=440) ============ -->
  <line x1="440" y1="55" x2="405" y2="95" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="440" y1="55" x2="475" y2="95" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="475" y1="95" x2="475" y2="132" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="440" cy="55" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="59" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <circle cx="405" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="99" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="475" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="99" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <circle cx="475" cy="132" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="136" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <!-- faint deleted 3,4,7 -->
  <text x="382" y="136" text-anchor="middle" font-size="11" fill="#ccc">✗3</text>
  <text x="428" y="136" text-anchor="middle" font-size="11" fill="#ccc">✗4</text>
  <text x="498" y="172" text-anchor="middle" font-size="11" fill="#ccc">✗7</text>
  <!-- mark 1,5 as next-delete -->
  <text x="388" y="88" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="498" y="124" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <text x="440" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">删第 1 层 (3,4,7)</text>
  <text x="440" y="226" text-anchor="middle" font-size="10" fill="#888">新叶 1、5 待删</text>

  <!-- ============ Stage 4: deleted layer 2 (1,5) -> core 0-2 (CX=615) ============ -->
  <line x1="615" y1="55" x2="650" y2="95" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="632" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">×2</text>

  <circle cx="615" cy="55" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="615" y="59" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <circle cx="650" cy="95" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="650" y="99" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <!-- faint deleted 1,5 -->
  <text x="580" y="99" text-anchor="middle" font-size="11" fill="#ccc">✗1</text>
  <text x="650" y="136" text-anchor="middle" font-size="11" fill="#ccc">✗5</text>

  <text x="615" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">删第 2 层 (1,5)</text>
  <text x="615" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">剩 1 边 → 答案 2</text>
</svg>
