<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：grid = [[1,1,1],[1,0,1],[0,0,1]]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888">match[j] 按女孩索引记录配对的男孩；每轮 vis 重置</text>

  <!-- ===== step table header ===== -->
  <g font-size="10" fill="#888">
    <text x="50" y="72">步骤</text>
    <text x="110" y="72">当前男孩</text>
    <text x="200" y="72">vis（本轮访问女孩）</text>
    <text x="330" y="72">match 演变</text>
    <text x="480" y="72">结果</text>
  </g>

  <!-- ===== step rows ===== -->
  <g font-size="11" fill="#333">
    <!-- step 1 -->
    <rect x="36" y="80" width="500" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="50" y="100">①</text>
    <text x="110" y="100" font-weight="bold">B0</text>
    <text x="200" y="100" fill="#888">{ } → {G0}</text>
    <text x="330" y="100">[-1,-1,-1] → <tspan fill="#4a7a3a" font-weight="bold">[0,-1,-1]</tspan></text>
    <text x="480" y="100" fill="#4a7a3a" font-weight="bold">ans=1</text>

    <!-- step 2 -->
    <rect x="36" y="114" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="50" y="134">②</text>
    <text x="110" y="134" font-weight="bold">B1</text>
    <text x="200" y="134" fill="#888">{ } → {G0,G1}</text>
    <text x="330" y="134">[0,-1,-1] → <tspan fill="#4a7a3a" font-weight="bold">[1,0,-1]</tspan></text>
    <text x="480" y="134" fill="#4a7a3a" font-weight="bold">ans=2</text>

    <!-- step 3 -->
    <rect x="36" y="148" width="500" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="50" y="168">③</text>
    <text x="110" y="168" font-weight="bold">B2</text>
    <text x="200" y="168" fill="#888">{ } → {G2}</text>
    <text x="330" y="168">[1,0,-1] → <tspan fill="#4a7a3a" font-weight="bold">[1,0,2]</tspan></text>
    <text x="480" y="168" fill="#4a7a3a" font-weight="bold">ans=3</text>
  </g>

  <!-- ===== step 2 augmenting path detail ===== -->
  <rect x="36" y="196" width="500" height="226" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="286" y="216" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">步骤 ② 关键：增广路径 B1 → G0 → B0 → G1</text>
  <text x="286" y="232" text-anchor="middle" font-size="10" fill="#666">G0 已配对 B0，递归 find(0)：B0 转而邀请未配对的 G1，腾出 G0 给 B1</text>

  <!-- path nodes row -->
  <g font-size="11" fill="#333">
    <!-- B1 (current unmatched boy) -->
    <rect x="60" y="252" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
    <text x="85" y="272" text-anchor="middle" font-weight="bold">B1</text>

    <!-- candidate edge to G0 -->
    <path d="M 110 267 L 165 267" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
    <text x="137" y="260" text-anchor="middle" font-size="8" fill="#b85450">候选</text>

    <!-- G0 (matched to B0) -->
    <rect x="167" y="252" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="192" y="272" text-anchor="middle" font-weight="bold">G0</text>

    <!-- matched edge to B0 (green solid, will be flipped) -->
    <path d="M 217 267 L 272 267" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
    <text x="244" y="260" text-anchor="middle" font-size="8" fill="#4a7a3a">旧匹配</text>

    <!-- B0 (matched boy, to be relocated) -->
    <rect x="274" y="252" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="299" y="272" text-anchor="middle" font-weight="bold">B0</text>

    <!-- candidate edge to G1 -->
    <path d="M 324 267 L 379 267" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
    <text x="351" y="260" text-anchor="middle" font-size="8" fill="#b85450">候选</text>

    <!-- G1 (unmatched) -->
    <rect x="381" y="252" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
    <text x="406" y="272" text-anchor="middle" font-weight="bold">G1</text>
    <text x="406" y="296" text-anchor="middle" font-size="8" fill="#4a7a3a">未配对</text>
  </g>

  <!-- flip arrow -->
  <text x="455" y="266" font-size="9" fill="#d6a040" font-weight="bold">翻转匹配</text>
  <text x="455" y="280" font-size="9" fill="#d6a040" font-weight="bold">↑</text>

  <!-- after flip -->
  <text x="60" y="320" font-size="11" fill="#444" font-weight="bold">翻转后：</text>
  <g font-size="10" fill="#333">
    <rect x="60" y="330" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="85" y="347" text-anchor="middle" font-weight="bold">B1</text>
    <path d="M 110 343 L 165 343" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
    <rect x="167" y="330" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="192" y="347" text-anchor="middle" font-weight="bold">G0</text>
    <text x="192" y="370" text-anchor="middle" font-size="8" fill="#4a7a3a">新匹配 B1</text>

    <rect x="274" y="330" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="299" y="347" text-anchor="middle" font-weight="bold">B0</text>
    <path d="M 324 343 L 379 343" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
    <rect x="381" y="330" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="406" y="347" text-anchor="middle" font-weight="bold">G1</text>
    <text x="406" y="370" text-anchor="middle" font-size="8" fill="#4a7a3a">新匹配 B0</text>
  </g>

  <!-- result -->
  <text x="60" y="404" font-size="11" fill="#4a7a3a" font-weight="bold">最终 match=[1,0,2] → 3 对配对，ans=3 ✓</text>
</svg>
