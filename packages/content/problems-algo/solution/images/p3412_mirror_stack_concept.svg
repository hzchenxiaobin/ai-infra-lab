<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="445" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">字母表对折找镜像，每个字母一个栈</text>

  <!-- Region 1: mirror mapping -->
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 镜像 = 把字母表对折</text>

  <path d="M 120,58 Q 260,10 404,58" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 168,58 Q 260,22 356,58" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 216,58 Q 260,34 308,58" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="104" y="62" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="152" y="62" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="200" y="62" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="260" y="82" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">···</text>
  <rect x="292" y="62" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x</text>
  <rect x="340" y="62" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y</text>
  <rect x="388" y="62" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">z</text>

  <text x="260" y="112" text-anchor="middle" font-size="11.5" fill="#7a4a2b" filter="url(#rough2)">mirror(c) = 'a' + 'z' − c，例如 mirror('y') = 'b'</text>

  <path d="M 60,124 L 460,124" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- Region 2: example pairing -->
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② s = "aczzx"：z 配最近的 a，x 配最近的 c</text>

  <rect x="90" y="160" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="116" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="152" y="160" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="178" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="214" y="160" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">z</text>
  <rect x="276" y="160" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">z</text>
  <rect x="338" y="160" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="364" y="184" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">x</text>

  <text x="116" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="178" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="240" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="302" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="364" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <path d="M 116,200 Q 178,244 240,200" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="178" y="236" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">+2</text>
  <path d="M 178,200 Q 271,290 364,200" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="271" y="262" text-anchor="middle" font-size="11" fill="#a06a20" filter="url(#rough2)">+3</text>

  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">配对成功的下标立即"标记"（红框），不再参与后续匹配；下标 3 的 z 查 st[a] 已空，只能等待</text>

  <path d="M 60,302 L 460,302" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- Region 3: stack model -->
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">③ 栈模型：弹出 = 标记，栈顶 = 最近的未标记</text>

  <rect x="80" y="344" width="60" height="70" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="86" y="386" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="402" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="86" y="362" width="48" height="22" rx="3" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="110" y="352" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">st[a]</text>
  <path d="M 110,360 L 110,342" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="432" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i=2 的 z 弹出顶上的 0</text>

  <rect x="155" y="344" width="60" height="70" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="161" y="386" width="48" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="185" y="402" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="161" y="362" width="48" height="22" rx="3" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="185" y="352" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">st[c]</text>

  <rect x="240" y="342" width="252" height="96" rx="8" fill="#f5f0e6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="254" cy="362" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="264" y="366" font-size="11" fill="#333" filter="url(#rough2)">遇到 s[i]：先查 st[mirror(s[i])]</text>
  <circle cx="254" cy="390" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="264" y="394" font-size="11" fill="#2d5523" filter="url(#rough2)">非空 → 弹出栈顶 j，ans += i − j</text>
  <circle cx="254" cy="418" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="264" y="422" font-size="11" fill="#7a4a2b" filter="url(#rough2)">空 → i 压入 st[s[i]]，等未来的镜像</text>
</svg>
