<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 名员工 → 分组 → 编号 → 输出 4 行</text>

  <!-- ===== Phase 1: GROUP BY salary ===== -->
  <text x="30" y="52" font-size="11" fill="#446688" font-weight="bold">① GROUP BY salary + COUNT</text>

  <rect x="20" y="58" width="620" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="110" y="75">salary</text>
    <text x="280" y="75">员工列表</text>
    <text x="460" y="75">COUNT(1)</text>
    <text x="580" y="75">≥ 2 ?</text>
  </g>

  <rect x="20" y="84" width="620" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="110" y="101" fill="#4a7a3a" font-weight="bold">3000</text>
    <text x="280" y="101" fill="#333">Meir(2), Michael(3)</text>
    <text x="460" y="101" fill="#333">2</text>
    <text x="580" y="101" fill="#4a7a3a" font-weight="bold">✓ 入选</text>
  </g>

  <rect x="20" y="110" width="620" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="110" y="127" fill="#b85450" font-weight="bold">6100</text>
    <text x="280" y="127" fill="#333">Juan(8)</text>
    <text x="460" y="127" fill="#333">1</text>
    <text x="580" y="127" fill="#b85450" font-weight="bold">✗ 淘汰</text>
  </g>

  <rect x="20" y="136" width="620" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="110" y="153" fill="#4a7a3a" font-weight="bold">7400</text>
    <text x="280" y="153" fill="#333">Addilyn(7), Kannon(9)</text>
    <text x="460" y="153" fill="#333">2</text>
    <text x="580" y="153" fill="#4a7a3a" font-weight="bold">✓ 入选</text>
  </g>

  <path d="M330 166 L330 184" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Phase 2: ROW_NUMBER ===== -->
  <text x="30" y="200" font-size="11" fill="#d6a040" font-weight="bold">② ROW_NUMBER() OVER (ORDER BY salary) — 仅对入选工资排名</text>

  <rect x="20" y="208" width="620" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#d6a040" font-weight="bold" text-anchor="middle">
    <text x="160" y="225">salary（升序）</text>
    <text x="380" y="225">ROW_NUMBER</text>
    <text x="540" y="225">team_id</text>
  </g>

  <rect x="20" y="234" width="620" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="160" y="250" fill="#333">3000（第 1 低）</text>
    <text x="380" y="250" fill="#d6a040" font-weight="bold">1</text>
    <text x="540" y="250" fill="#d6a040" font-weight="bold">1</text>
  </g>

  <rect x="20" y="258" width="620" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="160" y="274" fill="#333">7400（第 2 低）</text>
    <text x="380" y="274" fill="#d6a040" font-weight="bold">2</text>
    <text x="540" y="274" fill="#d6a040" font-weight="bold">2</text>
  </g>

  <text x="330" y="296" text-anchor="middle" font-size="8.5" fill="#b85450">⚠ 6100 不在 S 中，排名跳过 → 7400 直接得 team_id=2（而非 3）</text>

  <path d="M330 304 L330 322" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Phase 3: JOIN + output ===== -->
  <text x="30" y="338" font-size="11" fill="#4a7a3a" font-weight="bold">③ JOIN Employees ON salary → ORDER BY team_id, employee_id</text>

  <rect x="20" y="346" width="620" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="70" y="363">employee_id</text>
    <text x="190" y="363">name</text>
    <text x="310" y="363">salary</text>
    <text x="430" y="363">team_id</text>
    <text x="560" y="363">JOIN 匹配?</text>
  </g>

  <rect x="20" y="372" width="620" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="70" y="388" fill="#333">2</text>
    <text x="190" y="388" fill="#333">Meir</text>
    <text x="310" y="388" fill="#4a7a3a" font-weight="bold">3000</text>
    <text x="430" y="388" fill="#d6a040" font-weight="bold">1</text>
    <text x="560" y="388" fill="#4a7a3a">✓</text>
  </g>

  <rect x="20" y="396" width="620" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="70" y="412" fill="#333">3</text>
    <text x="190" y="412" fill="#333">Michael</text>
    <text x="310" y="412" fill="#4a7a3a" font-weight="bold">3000</text>
    <text x="430" y="412" fill="#d6a040" font-weight="bold">1</text>
    <text x="560" y="412" fill="#4a7a3a">✓</text>
  </g>

  <rect x="20" y="420" width="620" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <g font-size="9.5" text-anchor="middle">
    <text x="70" y="436" fill="#b85450">8</text>
    <text x="190" y="436" fill="#b85450">Juan</text>
    <text x="310" y="436" fill="#b85450">6100</text>
    <text x="430" y="436" fill="#888">—</text>
    <text x="560" y="436" fill="#b85450" font-weight="bold">✗ 不匹配</text>
  </g>

  <!-- column separators -->
  <g stroke="#bbb" stroke-width="0.5" filter="url(#rough2)">
    <line x1="130" y1="346" x2="130" y2="444"/>
    <line x1="250" y1="346" x2="250" y2="444"/>
    <line x1="370" y1="346" x2="370" y2="444"/>
    <line x1="490" y1="346" x2="490" y2="444"/>
  </g>

  <!-- ===== Final note ===== -->
  <text x="330" y="454" text-anchor="middle" font-size="8.5" fill="#888">Juan（salary=6100）不在 T 中 → INNER JOIN 自然排除 → 最终输出 4 行（id=7/9 同理匹配 7400→team_id=2）</text>
</svg>
