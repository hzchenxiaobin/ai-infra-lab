<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [10,4,−8,7]，total = 13</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">逐下标滚动 leftSum，rightSum = 13 − leftSum，判断 leftSum ≥ rightSum</text>

  <!-- ===== Table header ===== -->
  <!-- columns: i | leftSum | rightSum | 比较 | 合法? | ans -->
  <rect x="36" y="54" width="488" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="156" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">leftSum</text>
  <text x="246" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">rightSum</text>
  <text x="336" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">比较</text>
  <text x="416" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">合法?</text>
  <text x="486" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <!-- column separators -->
  <line x1="116" y1="54" x2="116" y2="246" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="196" y1="54" x2="196" y2="246" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="296" y1="54" x2="296" y2="246" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="376" y1="54" x2="376" y2="246" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="456" y1="54" x2="456" y2="246" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0: i=0  leftSum=10 rightSum=3  10>=3 是 -->
  <rect x="36" y="82" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="76" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="156" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">10</text>
  <text x="246" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="336" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10 ≥ 3</text>
  <text x="416" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="486" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- row 1: i=1  leftSum=14 rightSum=-1  14>=-1 是 -->
  <rect x="36" y="116" width="488" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="156" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">14</text>
  <text x="246" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">−1</text>
  <text x="336" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">14 ≥ −1</text>
  <text x="416" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="486" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- row 2: i=2  leftSum=6 rightSum=7  6>=7 否 -->
  <rect x="36" y="150" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="76" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="156" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
  <text x="246" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="336" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6 ≥ 7</text>
  <text x="416" y="172" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">否 ✗</text>
  <text x="486" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- note: i only goes up to n-2 = 2 -->
  <rect x="36" y="184" width="488" height="34" fill="#fff" stroke="none"/>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#888">i 最大到 n−2 = 2（保证右边至少 1 个元素，不取 i=3）</text>

  <!-- table outer border -->
  <rect x="36" y="54" width="488" height="164" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- annotation for i=1 -->
  <path d="M 470 133 Q 500 133 500 120" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#rough)" filter="url(#rough2)"/>
  <text x="516" y="118" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">连续</text>
  <text x="516" y="130" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">命中</text>

  <!-- ===== Key recurrence box ===== -->
  <rect x="40" y="232" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">递推：leftSum_i = leftSum_{i−1} + nums[i]；rightSum_i = total − leftSum_i</text>

  <!-- ===== Rolling trace of leftSum ===== -->
  <text x="40" y="288" font-size="11" fill="#444" font-weight="bold">leftSum 滚动轨迹：</text>
  <rect x="40" y="294" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <text x="130" y="312" font-size="13" fill="#888" font-weight="bold">→</text>
  <rect x="146" y="294" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="312" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">14</text>
  <text x="236" y="312" font-size="13" fill="#888" font-weight="bold">→</text>
  <rect x="252" y="294" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#888">每步只加 nums[i]，O(1) 转移；rightSum 由 total − leftSum 直接得到</text>

  <!-- ===== answer ===== -->
  <rect x="160" y="350" width="240" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = 2（i=0、i=1 合法）</text>

  <!-- footer -->
  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">含负数时 rightSum 可为负，leftSum ≥ rightSum 仍可能成立（见 i=1）</text>
</svg>
